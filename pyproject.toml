# Python tooling for the project starter kits under projects/ and the runner in python/.
# The web app itself is TypeScript; see package.json.

[project]
name = "groundwork-projects"
version = "0.1.0"
description = "Starter kits, tests and reference solutions for Groundwork projects."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["projects"]
addopts = "--import-mode=importlib -q"
markers = [
  "network: needs network access or an external service (skipped by default)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["node_modules", "public", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101", # assert is how pytest tests are written
]

[tool.ruff.lint.per-file-ignores]
"projects/**/starter/*.py" = ["F401", "F841", "ARG001"]  # starters contain intentional TODO stubs
"python/gw_runner.py" = ["S102"]  # exec() of learner code is the runner's job; it runs inside Pyodide
