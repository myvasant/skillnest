# Lint and format settings for this kit. The CI workflow's `ruff check .` and
# `ruff format --check .` read this file, so local runs and CI enforce the same rules.
line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101", # assert is how pytest tests are written
]

[lint.per-file-ignores]
"starter/*.py" = ["F401", "F841", "ARG001"] # the starter contains intentional TODO stubs
