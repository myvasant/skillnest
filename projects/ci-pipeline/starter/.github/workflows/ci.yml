# Your CI workflow for ci_textkit (milestones 2-4).
#
# GitHub only runs workflows stored in .github/workflows/ at the ROOT of a repository,
# so this file runs for real only after you copy the kit into its own repository
# (see README). Until then, `python -m pytest -k "Milestone2 or Milestone3 or Milestone4"`
# checks its structure locally.
name: CI

on:
  push:
    branches: [main]
  # TODO(milestone 2): also run on pull requests targeting main.

# TODO(milestone 2): add least-privilege `permissions:` (the jobs only read code).
# TODO(milestone 2): add `concurrency:` so a newer push cancels the older run
#   (group on github.workflow and github.ref; cancel-in-progress: true).

jobs:
  test:
    runs-on: ubuntu-latest
    # TODO(milestone 3): add timeout-minutes and a strategy with fail-fast: false and
    #   a matrix of QUOTED Python versions ("3.11" ... "3.14").
    steps:
      - uses: actions/checkout@v5
      # TODO(milestone 3): set up Python with actions/setup-python (matrix version,
      #   pip cache), install requirements-dev.txt and run `ruff check .`.
      # TODO(milestone 4): run pytest with --cov=ci_textkit --cov-fail-under=90, after
      #   linting (a separate lint job that this job `needs`, or an earlier step).
