# Local run of the production image:  docker compose up --build   (from this directory)
# Then: curl http://127.0.0.1:8000/readyz
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: "0.1.0"
    image: container-service:0.1.0
    ports:
      # Bind to loopback only: reachable from this machine, not from the whole network.
      - "127.0.0.1:8000:8000"
    environment:
      SERVICE_NAME: container-service
    volumes:
      - service-data:/app/data
    # Defence in depth: read-only root filesystem, no extra Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  service-data:
