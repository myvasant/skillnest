# An example experiment. Every run of this exact file gives exactly the same metrics.
# Run it:  python starter/experiment_runner.py run experiment.toml --runs-dir runs

name = "logreg-breast-cancer"
seed = 42

[data]
dataset = "breast_cancer"   # "breast_cancer" (bundled with scikit-learn) or "synthetic"
test_size = 0.25

[model]
type = "logistic_regression"   # "logistic_regression" or "random_forest"
C = 1.0                        # any other keys are passed to the estimator

[evaluation]
cv_folds = 5
