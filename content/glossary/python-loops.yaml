terms:
  # ---- python.while-loops
  - id: loop
    term: Loop
    aliases: [repetition]
    definition: A statement that runs a block of code repeatedly. Python has two kinds — `while` (repeat while a condition is true) and `for` (repeat once for each item of an iterable).
    concept: python.while-loops
  - id: iteration
    term: Iteration
    aliases: [pass]
    definition: One run of a loop's body. "The loop ran three iterations" means the body executed three times. Iterating also means stepping through the items of something in turn.
    concept: python.while-loops
  - id: infinite-loop
    term: Infinite loop
    definition: A loop whose condition never becomes false, so it never ends on its own — usually because the loop variable is never updated, is updated in the wrong direction, or steps over the exit value. Stop it with Ctrl+C locally; Groundwork stops programs after 8 seconds.
    concept: python.while-loops
  - id: counter-variable
    term: Counter variable
    aliases: [counter]
    definition: "A variable that counts how many times something happened: it starts at 0 and is increased (usually `count += 1`) each time the event occurs."
    concept: python.while-loops
  - id: accumulator
    term: Accumulator
    aliases: [running total]
    definition: "A variable that builds up a result across loop iterations, such as a running total (`total += price`) or a growing string. It starts at a neutral value: 0 for sums, 1 for products, \"\" for strings."
    concept: python.while-loops
  - id: sentinel-value
    term: Sentinel value
    aliases: [sentinel]
    definition: A special value that signals "stop", such as typing done or an empty line to end an input loop. The program must check for it before treating it as normal data.
    concept: python.while-loops
  - id: trace-table
    term: Trace table
    aliases: [desk check, hand trace]
    definition: A table with one row per step or loop iteration showing the value of each variable, used to predict or debug what a program does without running it.
    concept: python.while-loops

  # ---- python.for-loops
  - id: loop-variable
    term: Loop variable
    aliases: [loop target]
    definition: "The name a loop uses to track its progress. In `for ch in word:`, the for loop rebinds ch to each item in turn; assigning to it inside the body does not change the sequence being looped over."
    concept: python.for-loops
  - id: range-object
    term: range()
    aliases: [range]
    definition: "A built-in that represents an arithmetic sequence of integers: range(stop), range(start, stop) or range(start, stop, step). The stop value is excluded. A range computes its numbers on demand instead of storing them."
    concept: python.for-loops
  - id: nested-loop
    term: Nested loop
    definition: A loop inside the body of another loop. The inner loop runs all of its iterations for every single iteration of the outer loop.
    concept: python.for-loops
  - id: off-by-one-error
    term: Off-by-one error
    aliases: [fencepost error, OBOE]
    definition: A bug where a loop or range runs one time too many or too few, or a slice includes one item too many or too few — typically < versus <=, or forgetting that range() and slices exclude the stop value.
    concept: python.for-loops
  - id: enumerate-function
    term: enumerate()
    definition: "A built-in that pairs each item of an iterable with a running count: `for i, ch in enumerate(\"abc\"):` gives 0 a, 1 b, 2 c. `start=1` makes the count begin at 1."
    concept: python.for-loops
  - id: zip-function
    term: zip()
    definition: "A built-in that walks several iterables in parallel, producing one tuple per step: zip(\"ab\", \"xy\") gives (a, x) then (b, y). It stops at the shortest input unless strict=True is passed."
    concept: python.for-loops

  # ---- python.loop-control
  - id: break-statement
    term: break statement
    aliases: [break]
    definition: Immediately ends the innermost loop that contains it; execution continues after that loop, and the loop's else clause (if any) is skipped.
    concept: python.loop-control
  - id: continue-statement
    term: continue statement
    aliases: [continue]
    definition: Skips the rest of the current iteration. A for loop moves on to its next item; a while loop goes back and re-checks its condition.
    concept: python.loop-control
  - id: loop-else
    term: Loop else clause
    aliases: [for-else, while-else, no-break clause]
    definition: An else block attached to a for or while loop. It runs when the loop finishes normally — including when it ran zero times — and is skipped only when the loop is left with break.
    concept: python.loop-control
  - id: flag-variable
    term: Flag variable
    aliases: [flag, boolean flag]
    definition: "A boolean variable that records whether something has happened, e.g. `found = False` before a search loop and `found = True` when the item is seen; it is checked after the loop."
    concept: python.loop-control

  # ---- python.lists
  - id: list
    term: List
    aliases: [list object]
    definition: "An ordered, mutable sequence of references to objects, written with square brackets: [3, 1, 2]. Lists can grow, shrink and be changed in place."
    concept: python.lists
  - id: index
    term: Index
    aliases: [position, zero-based index]
    definition: "The integer position of an item in a sequence. Python counts from 0, so the first item is seq[0]; negative indexes count from the end, so seq[-1] is the last item."
    concept: python.lists
  - id: index-error
    term: IndexError
    definition: "The exception raised when an index is outside the valid range of a sequence, e.g. `[1, 2][2]` → IndexError: list index out of range. Valid indexes run from -len(seq) to len(seq) - 1."
    concept: python.lists
  - id: in-place
    term: In-place operation
    aliases: [in place, mutating method]
    definition: An operation that changes an existing object instead of creating a new one, such as list.append() or list.sort(). Most in-place list methods return None; pop() is the exception and returns the removed item.
    concept: python.lists

  # ---- python.slicing
  - id: slice
    term: Slice
    aliases: [slicing, "seq[start:stop:step]"]
    definition: "A new sequence made from part of another, written seq[start:stop:step]. start is included, stop is excluded, omitted bounds mean \"from the beginning\" or \"to the end\", and out-of-range bounds are clipped instead of raising IndexError."
    concept: python.slicing
  - id: slice-assignment
    term: Slice assignment
    definition: "Assigning to a slice of a mutable sequence, such as lst[1:3] = [\"a\", \"b\", \"c\"], which replaces that part of the list in place. The replacement may have a different length unless the slice has a step."
    concept: python.slicing
