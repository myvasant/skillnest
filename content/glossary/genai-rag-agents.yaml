terms:
  # ------------------------------------------------------------ genai.what-are-llms
  - id: large-language-model
    term: Large language model
    aliases: [LLM]
    definition: >-
      A neural network, usually a Transformer, trained on very large amounts of text to predict the next
      token. It generates text by repeating that prediction one token at a time.
    concept: genai.what-are-llms
  - id: next-token-prediction
    term: Next-token prediction
    aliases: [autoregressive generation]
    definition: >-
      Producing a probability distribution over the next token given all previous tokens. Generating text
      means repeatedly predicting, picking one token and appending it to the context.
    concept: genai.what-are-llms
  - id: bigram-model
    term: Bigram model
    aliases: [bigram language model, n-gram model]
    definition: >-
      A language model that predicts the next word from only the previous word, using counts of adjacent
      word pairs in a training text. N-gram models generalise this to the previous n − 1 words.
    concept: genai.what-are-llms
  - id: model-parameters
    term: Model parameters
    aliases: [weights, model weights]
    definition: >-
      The learned numbers inside a model that training adjusts to reduce error. An LLM has billions of
      them; they are fixed while the model is used. Per-request settings such as temperature are not
      parameters in this sense.
    concept: genai.what-are-llms
  - id: instruction-tuning
    term: Instruction tuning
    aliases: [supervised fine-tuning, SFT, post-training]
    definition: >-
      Further training of a pretrained (base) model on examples of instructions paired with good
      responses, so that following the instruction becomes the likely continuation. Usually followed by
      preference tuning such as RLHF.
    concept: genai.what-are-llms
  - id: knowledge-cutoff
    term: Knowledge cutoff
    aliases: [training cutoff]
    definition: >-
      The date after which a model's training data contains no information. The model cannot know later
      events unless they are supplied in the prompt or fetched with tools.
    concept: genai.what-are-llms
  # ---------------------------------------------------------- genai.tokens-context
  - id: token
    term: Token
    aliases: [tokens, token ID]
    definition: >-
      The unit of text a language model reads and writes — often a word, part of a word, a punctuation
      mark or a few bytes — represented as an integer ID from the model's vocabulary.
    concept: genai.tokens-context
  - id: tokenizer
    term: Tokenizer
    aliases: [tokeniser]
    definition: >-
      The component that converts text into token IDs and back. Each model family has its own, so the
      same text has different token counts on different models.
    concept: genai.tokens-context
  - id: byte-pair-encoding
    term: Byte-pair encoding
    aliases: [BPE, byte-level BPE]
    definition: >-
      A sub-word tokenization algorithm that starts from characters or bytes and repeatedly merges the
      most frequent adjacent pair into a new token; tokenizing replays the learned merges in order.
    concept: genai.tokens-context
  - id: context-window
    term: Context window
    aliases: [context length, context size]
    definition: >-
      The maximum number of tokens a model can handle in one request, covering the input (system prompt,
      history, documents, tool definitions) and the generated output together.
    concept: genai.tokens-context
  # ---------------------------------------------------------------- genai.sampling
  - id: logits
    term: Logits
    aliases: [logit scores]
    definition: >-
      The raw, unnormalised scores a model outputs for every token in its vocabulary at one step.
      Softmax converts them into probabilities.
    concept: genai.sampling
  - id: greedy-decoding
    term: Greedy decoding
    aliases: [greedy search, argmax decoding]
    definition: >-
      Choosing the single most likely token at every generation step. Deterministic for a fixed model
      and input, but prone to bland or repetitive text.
    concept: genai.sampling
  - id: temperature
    term: Temperature
    aliases: [sampling temperature]
    definition: >-
      A decoding setting that divides the logits before softmax. Values below 1 sharpen the distribution,
      values above 1 flatten it, and 0 is treated as greedy decoding.
    concept: genai.sampling
  - id: top-k-sampling
    term: Top-k sampling
    aliases: [top-k]
    definition: >-
      Sampling only from the k most likely tokens, after renormalising their probabilities to sum to 1.
    concept: genai.sampling
  - id: top-p-sampling
    term: Top-p sampling
    aliases: [nucleus sampling, top-p]
    definition: >-
      Sampling only from the smallest set of most likely tokens whose probabilities add up to at least p,
      renormalised; the set shrinks when the model is confident and grows when it is not.
    concept: genai.sampling
  # ------------------------------------------------------------ rag.keyword-search
  - id: inverted-index
    term: Inverted index
    aliases: [inverted file]
    definition: >-
      A search data structure that maps each term to the list of documents (and often positions) that
      contain it, so a query only visits documents sharing at least one of its terms.
    concept: rag.keyword-search
  - id: postings-list
    term: Postings list
    aliases: [postings]
    definition: >-
      The entry for one term in an inverted index: the documents containing the term, usually with the
      term frequency and positions in each.
    concept: rag.keyword-search
  - id: stop-words
    term: Stop words
    aliases: [stopwords]
    definition: >-
      Very common words such as "the", "to" or "and" that some text analysers remove because they appear
      in almost every document and carry little information for matching.
    concept: rag.keyword-search
  - id: tf-idf
    term: TF-IDF
    aliases: [term frequency-inverse document frequency]
    definition: >-
      A term weight equal to how often a term occurs in a document (tf) times how rare it is across the
      collection (idf, often ln(N / df)); a document's score is the sum over the query's terms.
    concept: rag.keyword-search
  - id: bm25
    term: BM25
    aliases: [Okapi BM25, Best Match 25]
    definition: >-
      A ranking function from the probabilistic relevance framework that sums, over query terms, an IDF
      weight times a term-frequency component that saturates (parameter k1) and is normalised by document
      length (parameter b). The default ranking in Lucene-based search engines.
    concept: rag.keyword-search
  # --------------------------------------------------------- rag.vector-similarity
  - id: semantic-search
    term: Semantic search
    aliases: [dense retrieval, vector search]
    definition: >-
      Retrieval that compares the meaning of texts by embedding them as vectors and returning the stored
      vectors closest to the query's vector, so paraphrases can match without shared words.
    concept: rag.vector-similarity
  - id: l2-normalisation
    term: L2 normalisation
    aliases: [unit normalisation, normalising embeddings]
    definition: >-
      Dividing a vector by its Euclidean length so it has length 1. For unit vectors, dot product equals
      cosine similarity and Euclidean distance gives the same ranking.
    concept: rag.vector-similarity
  - id: exact-knn-search
    term: Exact nearest-neighbour search
    aliases: [brute-force search, exact k-NN search, flat index]
    definition: >-
      Finding the k stored vectors most similar to a query by comparing the query with every stored
      vector — O(N · d) per query, and the reference for measuring approximate indexes.
    concept: rag.vector-similarity
  - id: hashing-trick
    term: Hashing trick
    aliases: [feature hashing]
    definition: >-
      Turning words or features into a fixed-length vector by hashing each one to a slot index and
      counting, without storing a vocabulary; different features can collide in the same slot.
    concept: rag.vector-similarity
  # --------------------------------------------------------------- agents.agent-loop
  - id: agent-loop
    term: Agent loop
    aliases: [tool-calling loop, observe-decide-act loop]
    definition: >-
      The control loop behind an agent: send the conversation and tool descriptions to a model, execute
      any tool call it proposes, append the result, and repeat until a final answer or a stop condition.
    concept: agents.agent-loop
  - id: tool-registry
    term: Tool registry
    aliases: [tool table]
    definition: >-
      The application's mapping from tool names to their implementing functions, descriptions and
      argument schemas, used to validate and dispatch the tool calls a model proposes.
    concept: agents.agent-loop
  - id: step-budget
    term: Step budget
    aliases: [max steps, iteration limit]
    definition: >-
      A code-enforced maximum number of model or tool calls in one agent run, usually combined with token,
      cost and time limits and a defined fallback when it is reached.
    concept: agents.agent-loop
  - id: trajectory
    term: Agent trajectory
    aliases: [trajectory, agent transcript, trace]
    definition: >-
      The recorded sequence of an agent run's steps — model outputs, tool calls, arguments, results and
      usage — used for debugging, evaluation and auditing.
    concept: agents.agent-loop
