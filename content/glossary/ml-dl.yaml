terms:
  # ---------------------------------------------------------------- ml.what-is-ml
  - id: machine-learning
    term: Machine learning
    aliases: [ML]
    definition: >-
      Building a function from examples instead of writing its rules by hand: an algorithm adjusts the
      function's parameters so its outputs match known answers, aiming to give good answers for new inputs.
    concept: ml.what-is-ml
  - id: artificial-intelligence
    term: Artificial intelligence
    aliases: [AI]
    definition: >-
      The broad goal of making computers perform tasks associated with intelligence, such as planning,
      perception or language. It includes non-learning methods (search, hand-written rules) as well as
      machine learning.
    concept: ml.what-is-ml
  - id: deep-learning
    term: Deep learning
    aliases: [DL]
    definition: >-
      Machine learning with neural networks of many layers, which learn useful features directly from raw
      inputs such as pixels, audio or text.
    concept: ml.what-is-ml
  - id: generative-ai
    term: Generative AI
    aliases: [GenAI, generative model]
    definition: >-
      Models that produce new content — text, images, audio or code — by learning the patterns of their
      training data. Today's generative systems, such as large language models, are almost all deep-learning
      models.
    concept: ml.what-is-ml
  - id: feature-ml
    term: Feature
    aliases: [input variable, predictor, attribute]
    definition: >-
      A measurable property of an example that a model uses as input, such as a message's number of
      suspicious words or a flat's floor area.
    concept: ml.what-is-ml
  - id: label-ml
    term: Label
    aliases: [target, ground truth]
    definition: >-
      The known correct answer for a training example — the value a supervised model learns to predict,
      such as "spam" or a flat's rent.
    concept: ml.what-is-ml
  - id: ml-model
    term: Model (machine learning)
    aliases: [trained model, predictive model]
    definition: >-
      A function from features to predictions whose parameters were chosen by training on data, for
      example "spam if signals >= 2" or a neural network's weights.
    concept: ml.what-is-ml
  - id: model-parameter
    term: Model parameter
    aliases: [learned parameter, weights]
    definition: >-
      A number inside a model that training chooses from data, such as a threshold, a regression
      coefficient or a neural-network weight. Contrast with hyperparameters, which are set before training.
    concept: ml.what-is-ml
  - id: model-training
    term: Training (machine learning)
    aliases: [fitting, fit]
    definition: >-
      Searching for the parameter values that make a model's errors on labelled training examples as small
      as possible, by exhaustive search, a closed-form formula or gradient descent.
    concept: ml.what-is-ml
  - id: prediction-inference
    term: Prediction (inference)
    aliases: [inference, predict]
    definition: >-
      Running a trained model on a new input to produce an output. Only the learned parameters are needed;
      the training data is not.
    concept: ml.what-is-ml
  - id: baseline-model
    term: Baseline model
    aliases: [baseline, majority-class baseline, dummy model]
    definition: >-
      The simplest reasonable predictor — always the most frequent class, or always the training mean —
      used as the bar a real model must clearly beat to be worth its cost.
    concept: ml.what-is-ml
  # ------------------------------------------------------------- ml.train-val-test
  - id: generalisation
    term: Generalisation
    aliases: [generalization]
    definition: >-
      A model's ability to perform well on new data from the same source as its training data. It can only
      be measured on examples the model did not see during training.
    concept: ml.train-val-test
  - id: training-set
    term: Training set
    aliases: [training data, train split]
    definition: >-
      The examples used to fit a model's parameters. Scores measured on it are optimistic, because the
      parameters were chosen to fit exactly these examples.
    concept: ml.train-val-test
  - id: validation-set
    term: Validation set
    aliases: [dev set, development set]
    definition: >-
      Held-out examples used during development to compare models, features and hyperparameters and to
      decide when to stop training. Because it guides choices, its score becomes slightly optimistic.
    concept: ml.train-val-test
  - id: test-set
    term: Test set
    aliases: [hold-out set, holdout set]
    definition: >-
      Held-out examples kept untouched until the end and used once to estimate performance on new data.
      Using it to make decisions turns it into another validation set.
    concept: ml.train-val-test
  - id: stratified-split
    term: Stratified split
    aliases: [stratification, stratified sampling]
    definition: >-
      A split made separately within each class so that every set keeps the original class proportions,
      for example 10% positives in training, validation and test.
    concept: ml.train-val-test
  # ----------------------------------------------------------- ml.linear-regression
  - id: linear-regression
    term: Linear regression
    aliases: [least-squares regression]
    definition: >-
      A model that predicts a number as a weighted sum of features plus an intercept, y_hat = w · x + b,
      usually fitted by minimising mean squared error.
    concept: ml.linear-regression
  - id: mean-squared-error
    term: Mean squared error
    aliases: [MSE, squared error loss]
    definition: >-
      The average of the squared differences between true values and predictions. Squaring removes signs
      and penalises large errors more than small ones; it is the standard loss for regression.
    concept: ml.linear-regression
  - id: regression-coefficient
    term: Regression coefficient
    aliases: [coefficient, slope, regression weight]
    definition: >-
      The weight of a feature in a regression model: the change in the prediction per unit increase of that
      feature with the other features held fixed. It describes an association in the data, not a cause.
    concept: ml.linear-regression
  - id: residual
    term: Residual
    aliases: [residuals]
    definition: >-
      The difference between an example's actual value and the model's prediction, y − y_hat. Patterns in
      residuals reveal structure the model is missing.
    concept: ml.linear-regression
  - id: ordinary-least-squares
    term: Ordinary least squares
    aliases: [OLS, closed-form solution, normal equation]
    definition: >-
      Fitting a linear model by choosing the parameters that minimise the sum of squared residuals, which
      can be solved directly; with one feature, w = Σ(x − x̄)(y − ȳ) / Σ(x − x̄)² and b = ȳ − w · x̄.
    concept: ml.linear-regression
  # --------------------------------------------------------- ml.evaluation-metrics
  - id: confusion-matrix
    term: Confusion matrix
    aliases: [error matrix]
    definition: >-
      A table counting a classifier's predictions by actual class and predicted class; for two classes its
      cells are true positives, false positives, false negatives and true negatives.
    concept: ml.evaluation-metrics
  - id: false-positive
    term: False positive
    aliases: [FP, false alarm, type I error]
    definition: >-
      An example that is actually negative but was predicted positive, such as a legitimate transaction
      flagged as fraud.
    concept: ml.evaluation-metrics
  - id: false-negative
    term: False negative
    aliases: [FN, miss, type II error]
    definition: >-
      An example that is actually positive but was predicted negative, such as a fraudulent transaction the
      model let through.
    concept: ml.evaluation-metrics
  - id: accuracy-paradox
    term: Accuracy paradox
    aliases: [accuracy on imbalanced data]
    definition: >-
      The situation where a useless model scores high accuracy because one class dominates — for example
      99% accuracy from always predicting "not fraud" when 1% of cases are fraud.
    concept: ml.evaluation-metrics
  - id: precision-metric
    term: Precision (classification)
    aliases: [precision, positive predictive value, PPV]
    definition: >-
      TP / (TP + FP): of the examples a classifier flagged as positive, the fraction that really were
      positive.
    concept: ml.evaluation-metrics
  - id: recall-metric
    term: Recall (classification)
    aliases: [recall, sensitivity, true positive rate, TPR]
    definition: >-
      TP / (TP + FN): of the examples that really were positive, the fraction the classifier found.
    concept: ml.evaluation-metrics
  - id: f1-score
    term: F1 score
    aliases: [F1, F-measure]
    definition: >-
      The harmonic mean of precision and recall, 2PR / (P + R). It is high only when both are high.
    concept: ml.evaluation-metrics
  - id: decision-threshold
    term: Decision threshold
    aliases: [classification threshold, cut-off]
    definition: >-
      The score above which a classifier's output is turned into a positive prediction. Raising it usually
      increases precision and lowers recall; it should be chosen from the costs of each kind of error.
    concept: ml.evaluation-metrics
  - id: roc-curve
    term: ROC curve
    aliases: [receiver operating characteristic]
    definition: >-
      A plot of the true positive rate against the false positive rate for every possible decision
      threshold of a scoring classifier.
    concept: ml.evaluation-metrics
  - id: roc-auc
    term: ROC AUC
    aliases: [AUC, AUROC, area under the ROC curve]
    definition: >-
      The area under the ROC curve: the probability that a randomly chosen positive gets a higher score than
      a randomly chosen negative. 0.5 is random ranking and 1.0 is perfect; it ignores the threshold and
      calibration.
    concept: ml.evaluation-metrics
  - id: mean-absolute-error
    term: Mean absolute error
    aliases: [MAE]
    definition: >-
      The average absolute difference between predictions and true values, in the target's units. Every
      unit of error counts the same, so it is less sensitive to outliers than RMSE.
    concept: ml.evaluation-metrics
  - id: root-mean-squared-error
    term: Root mean squared error
    aliases: [RMSE]
    definition: >-
      The square root of the mean squared error, in the target's units. Squaring makes large errors count
      disproportionately, so RMSE is always at least as large as MAE.
    concept: ml.evaluation-metrics
  - id: r-squared
    term: R² (coefficient of determination)
    aliases: [R-squared, R2, coefficient of determination]
    definition: >-
      1 − Σ(y − y_hat)² / Σ(y − ȳ)²: how much better a regression model is than always predicting the mean.
      1 is perfect, 0 matches the mean, and negative values are worse than the mean.
    concept: ml.evaluation-metrics
  # ------------------------------------------------------------- dl.neurons-layers
  - id: artificial-neuron
    term: Artificial neuron
    aliases: [neuron, unit, node]
    definition: >-
      The basic unit of a neural network: it computes a weighted sum of its inputs plus a bias,
      z = w · x + b, and passes z through an activation function. Only loosely inspired by biological
      neurons.
    concept: dl.neurons-layers
  - id: perceptron
    term: Perceptron
    aliases: [Rosenblatt perceptron]
    definition: >-
      A single neuron with a step activation that outputs 1 when w · x + b ≥ 0. Its decision boundary is a
      straight line (hyperplane), so it can only separate linearly separable classes — not XOR.
    concept: dl.neurons-layers
  - id: dense-layer
    term: Dense layer
    aliases: [fully connected layer, linear layer, nn.Linear]
    definition: >-
      A layer in which every neuron reads every input: h = g(W x + b), with one row of W per neuron. A dense
      layer from n_in inputs to n_out outputs has n_in × n_out + n_out parameters.
    concept: dl.neurons-layers
  - id: hidden-layer
    term: Hidden layer
    aliases: [hidden units]
    definition: >-
      A layer between a network's inputs and its outputs. Its values are not given by the data; training
      chooses them as an intermediate representation that makes the final prediction easier.
    concept: dl.neurons-layers
  - id: multilayer-perceptron
    term: Multilayer perceptron
    aliases: [MLP, feed-forward network, feedforward neural network]
    definition: >-
      A neural network made of stacked dense layers with non-linear activations between them, with
      information flowing from inputs to outputs without loops.
    concept: dl.neurons-layers
  - id: linearly-separable
    term: Linearly separable
    aliases: [linear separability]
    definition: >-
      Describes classes that a single straight line (or flat hyperplane in higher dimensions) can separate
      perfectly. AND and OR are linearly separable; XOR is not.
    concept: dl.neurons-layers
  # ------------------------------------------------------------------ dl.attention
  - id: attention-mechanism
    term: Attention (neural networks)
    aliases: [attention mechanism, self-attention]
    definition: >-
      A mechanism in which each position builds its output as a weighted average of value vectors, with
      weights computed by comparing its query with every key. In self-attention, queries, keys and values all
      come from the same sequence.
    concept: dl.attention
  - id: query-key-value
    term: Query, key and value
    aliases: [QKV, queries keys and values]
    definition: >-
      The three vectors each token is projected into for attention, by learned matrices W_Q, W_K and W_V: the
      query says what the token looks for, the key what it offers for matching, and the value what it
      contributes when attended to.
    concept: dl.attention
  - id: scaled-dot-product-attention
    term: Scaled dot-product attention
    aliases: [SDPA, softmax(QK^T / sqrt(d_k))V]
    definition: >-
      Attention(Q, K, V) = softmax(Q Kᵀ / √d_k) V, the attention function of the Transformer: dot-product
      scores between queries and keys, scaled by 1/√d_k, normalised with softmax per query, then used to
      average the values.
    concept: dl.attention
  - id: causal-mask
    term: Causal mask
    aliases: [look-ahead mask, causal attention, masked self-attention]
    definition: >-
      A mask that sets the attention scores of later positions to −∞ before the softmax, so each token can
      attend only to itself and earlier tokens. Decoder language models use it so that next-token training
      cannot peek at the answer.
    concept: dl.attention
  - id: multi-head-attention
    term: Multi-head attention
    aliases: [attention heads, MHA]
    definition: >-
      Running several attention heads in parallel, each with its own query, key and value projections into a
      smaller dimension, then concatenating their outputs and mixing them with an output matrix W_O.
    concept: dl.attention
