terms:
  # ----- cs.complexity
  - id: big-o-notation
    term: Big-O notation
    aliases: [Big-O, O-notation, asymptotic upper bound]
    definition: >-
      A way to describe how fast a cost grows with input size n, ignoring constant factors and lower-order
      terms: 3n² + 5n + 2 is O(n²). Formally f(n) is O(g(n)) if f(n) ≤ c·g(n) for some constant c and all
      large enough n, so Big-O is an upper bound on growth.
    concept: cs.complexity
  - id: time-complexity
    term: Time complexity
    aliases: [running time, computational complexity]
    definition: >-
      How the number of basic operations an algorithm performs grows as its input grows, usually stated in
      Big-O notation, e.g. "linear search is O(n)". It predicts scaling; it is not a measurement in seconds.
    concept: cs.complexity
  - id: space-complexity
    term: Space complexity
    aliases: [memory complexity, auxiliary space]
    definition: >-
      How the extra memory an algorithm needs grows with its input size, beyond the input itself. Reversing
      a list in place is O(1) extra space; building a reversed copy is O(n).
    concept: cs.complexity
  - id: worst-case
    term: Worst case
    aliases: [best case, average case, worst-case complexity]
    definition: >-
      The input of a given size that makes an algorithm do the most work. Linear search's worst case (item
      last or missing) is O(n); its best case (item first) is O(1). Average case describes typical inputs,
      e.g. dict lookups are O(1) on average and O(n) in the worst case.
    concept: cs.complexity
  - id: amortized-cost
    term: Amortised cost
    aliases: [amortized cost, amortised analysis, amortized analysis]
    definition: >-
      The average cost per operation over a long sequence of operations. `list.append` occasionally copies
      the whole list, but because capacity grows proportionally those copies are rare, so append is
      amortised O(1).
    concept: cs.complexity
  - id: big-theta
    term: Big-Theta notation
    aliases: [Θ, tight bound]
    definition: >-
      f(n) is Θ(g(n)) when it is both O(g(n)) and Ω(g(n)): it grows exactly like g, up to constant factors.
      What engineers usually mean when they say "O(n²)".
    concept: cs.complexity
  - id: big-omega
    term: Big-Omega notation
    aliases: [Ω, asymptotic lower bound]
    definition: >-
      f(n) is Ω(g(n)) if f(n) ≥ c·g(n) for some constant c > 0 and all large enough n — a lower bound on
      growth. For example, every comparison sort needs Ω(n log n) comparisons in the worst case.
    concept: cs.complexity
  # ----- cs.recursion
  - id: recursion
    term: Recursion
    aliases: [recursive function, recursive call]
    definition: >-
      Solving a problem by having a function call itself on a smaller instance of the same problem, until it
      reaches a base case it can answer directly. Each call gets its own frame on the call stack.
    concept: cs.recursion
  - id: base-case
    term: Base case
    definition: >-
      The input a recursive function answers directly, without calling itself, such as `n == 0` for
      factorial or an empty list for a sum. Without a reachable base case the recursion never stops.
    concept: cs.recursion
  - id: recursive-case
    term: Recursive case
    aliases: [recursive step]
    definition: >-
      The branch of a recursive function that calls itself on a smaller input and combines the result, such
      as `return n * factorial(n - 1)`. Every recursive call must move closer to a base case.
    concept: cs.recursion
  - id: recursion-limit
    term: Recursion limit
    aliases: [recursion depth, maximum recursion depth, sys.getrecursionlimit]
    definition: >-
      The maximum number of nested Python calls CPython allows before raising RecursionError — 1000 by
      default, readable with `sys.getrecursionlimit()`. It protects the interpreter from running out of
      stack memory.
    concept: cs.recursion
  - id: recursion-error
    term: RecursionError
    aliases: [maximum recursion depth exceeded]
    definition: >-
      The exception raised when nested calls exceed the recursion limit, usually because a base case is
      missing or unreachable, or because the input is too deep for recursion. A subclass of RuntimeError.
    concept: cs.recursion
  - id: tail-call
    term: Tail call
    aliases: [tail recursion, tail-call optimisation, tail-call optimization]
    definition: >-
      A call that is the very last thing a function does, as in `return countdown(n - 1)`. Some languages
      reuse the frame for tail calls; CPython does not, so tail-recursive Python functions still hit the
      recursion limit.
    concept: cs.recursion
  - id: recursion-tree
    term: Recursion tree
    aliases: [call tree]
    definition: >-
      A diagram of every call a recursive function makes, with each call's children being the calls it
      makes. Its size is the number of calls; naive Fibonacci's tree roughly doubles with each extra n.
    concept: cs.recursion
  # ----- cs.searching
  - id: linear-search
    term: Linear search
    aliases: [sequential search]
    definition: >-
      Checking items one by one from the start until the target is found or the items run out. Works on
      any sequence, sorted or not, and costs O(n) in the worst case. `x in my_list` and `my_list.index(x)`
      are linear searches.
    concept: cs.searching
  - id: binary-search
    term: Binary search
    aliases: [bisection search, half-interval search]
    definition: >-
      Searching a sorted sequence by comparing the target with the middle item and discarding the half that
      cannot contain it, so the range halves at every step: O(log n), about 20 comparisons for a million
      items. On unsorted data it silently gives wrong answers.
    concept: cs.searching
  - id: loop-invariant
    term: Loop invariant
    definition: >-
      A statement that is true before a loop starts and remains true after every iteration, such as "if
      the target is present, it is within items[lo:hi]". Choosing one and keeping the loop condition and
      updates consistent with it prevents off-by-one errors.
    concept: cs.searching
  - id: half-open-interval
    term: Half-open interval
    aliases: ["[lo, hi)"]
    definition: >-
      A range that includes its start but excludes its end, written [lo, hi). Python's range() and slices
      use this convention, and so do binary searches with `while lo < hi` and `hi = mid`.
    concept: cs.searching
  - id: insertion-point
    term: Insertion point
    aliases: [bisect_left, bisect_right, bisect module]
    definition: >-
      The index at which a value could be inserted into a sorted list while keeping it sorted. The bisect
      module's `bisect_left` returns the position before any equal items and `bisect_right` the position
      after them.
    concept: cs.searching
  # ----- cs.hashing
  - id: hash-function
    term: Hash function
    definition: >-
      A function that turns a key into an integer (its hash) quickly and deterministically, ideally
      spreading different keys evenly. A hash table uses `hash(key) % number_of_buckets` (or similar) to
      choose where the key lives. Equal keys must produce equal hashes.
    concept: cs.hashing
  - id: hash-collision
    term: Hash collision
    aliases: [collision]
    definition: >-
      Two different keys that land in the same bucket, either because their hashes are equal or because
      the hashes map to the same slot. Collisions are unavoidable and are handled by chaining or open
      addressing; too many of them make lookups slow.
    concept: cs.hashing
  - id: bucket
    term: Bucket
    aliases: [slot]
    definition: >-
      One position in a hash table's underlying array. With chaining, each bucket holds a small list of
      the entries whose keys map to it; with open addressing, each slot holds at most one entry.
    concept: cs.hashing
  - id: separate-chaining
    term: Separate chaining
    aliases: [chaining]
    definition: >-
      A collision strategy in which each bucket stores a list (chain) of all entries that map to it. A
      lookup hashes to one bucket and scans only that chain.
    concept: cs.hashing
  - id: open-addressing
    term: Open addressing
    aliases: [probing, linear probing]
    definition: >-
      A collision strategy in which every entry lives directly in the table's array; if a slot is taken,
      the table probes other slots in a fixed sequence until it finds the key or an empty slot. CPython's
      dict and set use open addressing.
    concept: cs.hashing
  - id: load-factor
    term: Load factor
    definition: >-
      The number of stored entries divided by the number of buckets (α = n / m). With a good hash function
      the average chain length is α, so tables resize before α gets large to keep lookups O(1) on average.
    concept: cs.hashing
  - id: rehashing
    term: Rehashing
    aliases: [resizing a hash table, table resize]
    definition: >-
      Growing a hash table by allocating a larger array and re-inserting every entry, because each key's
      bucket depends on the table size. A single resize is O(n), but growing proportionally keeps inserts
      amortised O(1).
    concept: cs.hashing
  - id: hash-flooding
    term: Hash flooding
    aliases: [hash DoS, hash randomisation, PYTHONHASHSEED]
    definition: >-
      An attack that sends many keys crafted to collide, turning O(1) lookups into O(n) and overloading a
      server. Python defends by salting str and bytes hashes with a random per-process value, which is why
      string hashes differ between runs (controlled by PYTHONHASHSEED).
    concept: cs.hashing
  # ----- cs.graphs
  - id: graph
    term: Graph
    aliases: [network]
    definition: >-
      A set of vertices (nodes) connected by edges. Graphs model friendships, road maps, web links,
      package dependencies and workflows. Edges may be directed or undirected, weighted or unweighted.
    concept: cs.graphs
  - id: vertex
    term: Vertex
    aliases: [node, vertices]
    definition: >-
      One of the things a graph connects — a person, a city, a web page, a package. The vertices joined to
      a vertex by edges are its neighbours; how many there are is its degree.
    concept: cs.graphs
  - id: graph-edge
    term: Edge
    aliases: [arc, link]
    definition: >-
      A connection between two vertices in a graph. In an undirected graph it goes both ways (a
      friendship); in a directed graph it goes one way (a follow, a one-way street, "A depends on B"). It
      may carry a weight such as a distance.
    concept: cs.graphs
  - id: directed-graph
    term: Directed graph
    aliases: [digraph, undirected graph]
    definition: >-
      A graph whose edges have a direction, from one vertex to another. In an undirected graph every edge
      can be followed both ways, so an adjacency list stores it under both endpoints.
    concept: cs.graphs
  - id: adjacency-list
    term: Adjacency list
    definition: >-
      A graph representation that maps each vertex to a list (or set) of its neighbours, in Python usually
      a dict such as `{"A": ["B", "C"], "B": ["A"]}`. It uses O(V + E) memory, which suits sparse graphs.
    concept: cs.graphs
  - id: adjacency-matrix
    term: Adjacency matrix
    definition: >-
      A V × V grid in which entry [i][j] records whether (or how strongly) vertex i connects to vertex j. It
      answers "is there an edge?" in O(1) but always uses O(V²) memory.
    concept: cs.graphs
  - id: breadth-first-search
    term: Breadth-first search
    aliases: [BFS]
    definition: >-
      A traversal that visits a start vertex, then all its neighbours, then their neighbours, level by
      level, using a FIFO queue. In an unweighted graph it finds shortest paths (fewest edges). O(V + E).
    concept: cs.graphs
  - id: depth-first-search
    term: Depth-first search
    aliases: [DFS]
    definition: >-
      A traversal that follows one path as deep as possible before backing up to try the next branch,
      using recursion or an explicit LIFO stack. Used for reachability, connected components, cycle
      detection and dependency ordering. O(V + E).
    concept: cs.graphs
  - id: visited-set
    term: Visited set
    aliases: [seen set]
    definition: >-
      The set of vertices a traversal has already reached. Checking it before exploring a vertex makes
      every vertex count once and stops traversals from looping forever around cycles.
    concept: cs.graphs
  - id: graph-cycle
    term: Cycle
    aliases: [cyclic graph, acyclic graph]
    definition: >-
      A path in a graph that starts and ends at the same vertex without reusing an edge, such as A → B → C →
      A. Graphs with cycles need a visited set during traversal; a dependency cycle means no valid build
      order exists.
    concept: cs.graphs
  - id: connected-component
    term: Connected component
    aliases: [component]
    definition: >-
      A maximal group of vertices in an undirected graph that can all reach each other. One BFS or DFS from
      any vertex visits exactly its component, so counting traversal starts counts components.
    concept: cs.graphs
  - id: dag
    term: Directed acyclic graph
    aliases: [DAG]
    definition: >-
      A directed graph with no cycles, such as a set of tasks and their dependencies or a family tree. Only
      DAGs have a topological order — a sequence in which every edge points forward.
    concept: cs.graphs
  # --------------------------------------------------------------- trees
  - id: tree
    term: Tree
    definition: >-
      A connected hierarchical data structure with one root and no cycles. Every node except the root has one
      parent, and nodes may have children. A tree is useful for representing nested or branching relationships.
    concept: cs.trees
  - id: binary-tree
    term: Binary tree
    definition: >-
      A tree in which each node has at most two children, conventionally called left and right. A binary tree
      does not necessarily have any ordering rule for its values.
    concept: cs.trees
  - id: binary-search-tree
    term: Binary search tree
    aliases: [BST]
    definition: >-
      A binary tree that maintains an ordering invariant: keys in a node's left subtree are smaller than its
      key and keys in its right subtree are larger. Search and updates follow one root-to-leaf path.
    concept: cs.trees
  - id: tree-root
    term: Root node
    definition: >-
      The top node of a rooted tree. It has no parent, and every other node is a descendant of it.
    concept: cs.trees
  - id: tree-leaf
    term: Leaf node
    definition: >-
      A node with no children. In a tree traversal, a leaf is still visited like any other node.
    concept: cs.trees
  - id: tree-height
    term: Tree height
    definition: >-
      The number of edges on the longest downward path from a node to a leaf. The height of a tree is the
      height of its root; books may use a different convention for the empty tree.
    concept: cs.trees
  - id: tree-traversal
    term: Tree traversal
    definition: >-
      A systematic visit of every node in a tree. Common orders include pre-order, in-order, post-order and
      level-order; each is useful for different processing tasks.
    concept: cs.trees
  - id: inorder-traversal
    term: In-order traversal
    definition: >-
      A depth-first tree traversal that visits the left subtree, then the current node, then the right subtree.
      In a binary search tree, this order returns keys in ascending order.
    concept: cs.trees
  - id: balanced-tree
    term: Balanced tree
    definition: >-
      A tree whose height is kept within a bound that grows logarithmically with the number of nodes, allowing
      search and updates to remain O(log n). AVL and red-black trees are examples of self-balancing BSTs.
    concept: cs.trees
