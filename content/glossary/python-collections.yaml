terms:
  - id: tuple
    term: Tuple
    aliases: [tuple literal]
    definition: "An ordered, immutable sequence such as `(3, 4)`. Commas create tuples (parentheses only group), so a one-item tuple is written `(5,)`. Tuples of hashable items can be dictionary keys."
    concept: python.tuples
  - id: tuple-packing
    term: Tuple packing
    aliases: [packing]
    definition: "Writing several comma-separated values where one value is expected, as in `point = 3, 4`. Python packs them into a single tuple."
    concept: python.tuples
  - id: unpacking
    term: Unpacking
    aliases: [tuple unpacking, sequence unpacking, destructuring]
    definition: "Assigning the items of a sequence (or any iterable) to several names at once, as in `x, y = point`. The number of names must match the number of items, otherwise Python raises ValueError."
    concept: python.tuples
  - id: extended-unpacking
    term: Extended unpacking
    aliases: [starred assignment, "*rest"]
    definition: "Unpacking with one starred name that collects all the remaining items into a list, as in `first, *rest = items` (PEP 3132)."
    concept: python.tuples
  - id: dictionary
    term: Dictionary
    aliases: [dict, mapping]
    definition: "A mutable collection that maps unique, hashable keys to values, such as `{\"Asha\": 31}`. Lookup by key is fast on average, and iteration follows insertion order (guaranteed since Python 3.7)."
    concept: python.dictionaries
  - id: key-value-pair
    term: Key-value pair
    aliases: [entry, dictionary item]
    definition: "One entry in a dictionary: a key and the value it maps to. `d.items()` produces the pairs as (key, value) tuples."
    concept: python.dictionaries
  - id: key-error
    term: KeyError
    definition: "The exception raised when you look up (`d[key]`), delete or pop a key that is not in a dictionary, or remove a missing item from a set with `remove()`."
    concept: python.dictionaries
  - id: hashable
    term: Hashable
    aliases: [hashability, unhashable]
    definition: "An object is hashable if it has a hash value that never changes during its lifetime and can be compared for equality. Immutable built-ins (int, float, str, tuples of hashables, frozenset) are hashable; list, dict and set are not. Only hashable objects can be dictionary keys or set items."
    concept: python.dictionaries
  - id: hash-value
    term: Hash value
    aliases: [hash, "hash()"]
    definition: "An integer computed from an object's value by `hash(obj)`. Objects that compare equal must have equal hashes. Dictionaries and sets use it to decide where to store and find a key."
    concept: python.dictionaries
  - id: hash-table
    term: Hash table
    aliases: [hash map]
    definition: "A data structure that stores entries in an array of slots chosen from each key's hash value, so a lookup can jump almost directly to the right slot. Python's dict and set are hash tables, giving fast average-case lookups regardless of size."
    concept: python.dictionaries
  - id: set
    term: Set
    aliases: [set type]
    definition: "A mutable, unordered collection of unique hashable items, such as `{1, 2, 3}`. Supports fast membership tests and operations like union and intersection. `set()` creates an empty set; `{}` is an empty dict."
    concept: python.sets
  - id: frozenset
    term: frozenset
    aliases: [frozen set]
    definition: "An immutable version of a set. Because it can't change, it is hashable and can be used as a dictionary key or as an item of another set."
    concept: python.sets
  - id: set-operations
    term: Set operations
    aliases: [union, intersection, difference, symmetric difference]
    definition: "Operations that combine sets: union `a | b` (in either), intersection `a & b` (in both), difference `a - b` (in a but not b) and symmetric difference `a ^ b` (in exactly one)."
    concept: python.sets
  - id: identity
    term: Object identity
    aliases: [identity, "is operator", "id()"]
    definition: "Which object a value is, as opposed to what value it has. Identity never changes during an object's lifetime. `a is b` is True when both names refer to the same object; `id(x)` returns an integer identifying the object."
    concept: python.mutability
  - id: mutation
    term: Mutation
    aliases: [in-place change, mutate, modify in place]
    definition: "Changing an existing object's value in place, for example with `append()`, item assignment `x[0] = 1` or `d[key] = value`. Every name referring to that object sees the change. Contrast with rebinding, which points a name at a different object."
    concept: python.mutability
  - id: reference
    term: Reference
    aliases: [object reference]
    definition: "The link from a name, list slot, dictionary value or other container position to an object. Assignment copies references, never objects, which is why two names can share one mutable object."
    concept: python.mutability
  - id: shallow-copy
    term: Shallow copy
    aliases: [copy.copy]
    definition: "A new outer container whose slots refer to the same element objects as the original, made by `x.copy()`, `list(x)`, `x[:]` or `copy.copy(x)`. Nested mutable objects are shared between the original and the copy."
    concept: python.copying
  - id: deep-copy
    term: Deep copy
    aliases: [copy.deepcopy]
    definition: "A copy made by `copy.deepcopy(x)` that recursively copies every mutable object inside x, so the result shares no mutable parts with the original. It is slower and uses more memory than a shallow copy."
    concept: python.copying
