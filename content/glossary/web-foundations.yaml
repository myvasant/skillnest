terms:
  # ------------------------------------------------ foundations.programs-and-languages
  - id: program
    term: Program
    aliases: [computer program]
    definition: >-
      A precise, ordered list of instructions (plus the data they need) that a computer carries out. It is
      stored as source code in a file and run by a compiler-produced executable or by an interpreter.
    concept: foundations.programs-and-languages
  - id: source-code
    term: Source code
    aliases: [source]
    definition: >-
      The human-readable text of a program written in a programming language, such as the contents of a .py
      file. The CPU cannot run it directly; it must be compiled or interpreted.
    concept: foundations.programs-and-languages
  - id: machine-code
    term: Machine code
    aliases: [native code]
    definition: >-
      Instructions encoded as bytes that a CPU executes directly. Each CPU family (x86-64, ARM) has its own
      machine code, so a program compiled for one does not run on the other.
    concept: foundations.programs-and-languages
  - id: bytecode
    term: Bytecode
    definition: >-
      Compact instructions for a virtual machine rather than a real CPU. CPython compiles source code to
      bytecode (inspect it with the dis module) and its interpreter loop executes it. Bytecode is a CPython
      implementation detail and changes between versions.
    concept: foundations.programs-and-languages
  - id: runtime
    term: Runtime
    aliases: [runtime system, runtime environment]
    definition: >-
      The support system around a running program, providing memory management, built-in functions, error
      handling and access to the operating system. In CPython the runtime is part of the interpreter.
    concept: foundations.programs-and-languages
  - id: jit-compiler
    term: Just-in-time (JIT) compiler
    aliases: [JIT, JIT compilation]
    definition: >-
      A compiler that translates frequently run parts of a program to machine code while the program is
      running. PyPy, the JVM and JavaScript engines use one; CPython has an experimental, off-by-default JIT.
    concept: foundations.programs-and-languages
  - id: bytecode-cache
    term: Bytecode cache (.pyc file)
    aliases: [.pyc file, __pycache__, pyc]
    definition: >-
      A file in a __pycache__ folder, such as notes.cpython-314.pyc, holding the compiled bytecode of an
      imported module so later imports can skip compiling while the source is unchanged. Safe to delete; do
      not commit it.
    concept: foundations.programs-and-languages

  # ------------------------------------------------------------ foundations.text-encoding
  - id: unicode
    term: Unicode
    definition: >-
      The standard that gives every character in every writing system, plus symbols and emoji, a unique number
      called a code point (written U+0041 for A). Encodings such as UTF-8 turn code points into bytes.
    concept: foundations.text-encoding
  - id: code-point
    term: Code point
    definition: >-
      The number Unicode assigns to a character, written U+ followed by hexadecimal digits (é is U+00E9,
      ₹ is U+20B9). In Python, ord() gives a character's code point and chr() goes back; a str is a sequence
      of code points.
    concept: foundations.text-encoding
  - id: character-encoding
    term: Character encoding
    aliases: [codec, encoding, charset]
    definition: >-
      A rule for converting text (code points) to bytes and back, such as UTF-8, UTF-16, ASCII or cp1252.
      Bytes only become text again when decoded with the same encoding they were encoded with.
    concept: foundations.text-encoding
  - id: ascii
    term: ASCII
    definition: >-
      An old 7-bit encoding with 128 characters (English letters, digits, punctuation and control codes).
      UTF-8 encodes these 128 characters with exactly the same single bytes, so ASCII text is valid UTF-8.
    concept: foundations.text-encoding
  - id: bytes-object
    term: bytes
    aliases: [bytes object, byte string]
    definition: >-
      Python's immutable sequence of integers from 0 to 255, written like b'caf\xc3\xa9'. Files, sockets and
      hashes work with bytes; str.encode() produces bytes and bytes.decode() turns them back into a str.
    concept: foundations.text-encoding
  - id: unicode-decode-error
    term: UnicodeDecodeError
    aliases: [UnicodeEncodeError]
    definition: >-
      The exception raised when bytes are not valid in the chosen encoding, for example decoding Latin-1 bytes
      as UTF-8. Its sibling UnicodeEncodeError is raised when a character cannot be represented, such as ₹ in
      ASCII.
    concept: foundations.text-encoding
  - id: mojibake
    term: Mojibake
    definition: >-
      Garbled text such as "cafÃ©" produced by decoding bytes with the wrong encoding (here UTF-8 bytes read as
      Latin-1). It raises no error, which makes it harder to spot than a UnicodeDecodeError.
    concept: foundations.text-encoding
  - id: unicode-normalization
    term: Unicode normalisation
    aliases: [normalization, NFC, NFD, NFKC]
    definition: >-
      Converting text to a standard form so that equivalent sequences compare equal; é can be one code point
      (U+00E9) or e plus a combining accent. NFC composes, NFD decomposes; unicodedata.normalize() does it.
    concept: foundations.text-encoding
  - id: byte-order-mark
    term: Byte order mark (BOM)
    aliases: [BOM]
    definition: >-
      The character U+FEFF placed at the start of a file to signal its encoding. Some tools write it before
      UTF-8 text (bytes EF BB BF); Python's "utf-8-sig" codec removes it when reading.
    concept: foundations.text-encoding
  - id: grapheme-cluster
    term: Grapheme cluster
    aliases: [user-perceived character]
    definition: >-
      What a reader sees as one character, which may be several code points, such as a thumbs-up emoji with a
      skin-tone modifier. len() on a Python str counts code points, not grapheme clusters.
    concept: foundations.text-encoding

  # ------------------------------------------------------------------- tooling.git-basics
  - id: git-repository
    term: Repository
    aliases: [repo, git repository]
    definition: >-
      A project tracked by Git. Its history (objects, branches and configuration) lives in the hidden .git
      folder at the top of the project; git init creates one.
    concept: tooling.git-basics
  - id: working-tree
    term: Working tree
    aliases: [working directory, working copy]
    definition: >-
      The ordinary files and folders of the project that you edit, outside the .git folder. Changes here are
      not recorded until you stage and commit them.
    concept: tooling.git-basics
  - id: staging-area
    term: Staging area
    aliases: [index, cache]
    definition: >-
      Git's record of exactly what the next commit will contain, stored in .git/index. git add copies the
      current content of a file into it; later edits must be added again.
    concept: tooling.git-basics
  - id: git-commit
    term: Commit
    aliases: [commit object, revision]
    definition: >-
      A saved snapshot of the whole project plus metadata: author, committer, timestamp, message and the id of
      its parent commit(s). It is identified by a hash of its contents, such as 581416a.
    concept: tooling.git-basics
  - id: git-head
    term: HEAD
    definition: >-
      Git's pointer to what you currently have checked out, usually a branch name (.git/HEAD contains
      "ref: refs/heads/main"). The next commit's parent is the commit HEAD points to.
    concept: tooling.git-basics
  - id: content-addressable-storage
    term: Content-addressable storage
    aliases: [content addressing]
    definition: >-
      Storing data under a key computed from the data itself, such as its hash. Identical content always gets
      the same key, so it is stored once; Git stores files, trees and commits this way.
    concept: tooling.git-basics
  - id: git-blob
    term: Blob
    aliases: [blob object]
    definition: >-
      The Git object that stores one version of a file's contents (without its name). Its id is the SHA-1 of
      "blob <size>\0" followed by the content, so identical files share one blob.
    concept: tooling.git-basics
  - id: untracked-file
    term: Untracked file
    definition: >-
      A file in the working tree that is neither staged nor in the last commit. Git ignores it in commits
      (even with git commit -a) until you git add it.
    concept: tooling.git-basics

  # ---------------------------------------------------------------- networking.http-basics
  - id: http
    term: HTTP
    aliases: [Hypertext Transfer Protocol]
    definition: >-
      The request-response protocol of the web and of most APIs: a client sends a request (method, target,
      headers, optional body) and a server returns a response (status code, headers, body). HTTPS is HTTP
      inside TLS.
    concept: networking.http-basics
  - id: http-request
    term: HTTP request
    definition: >-
      The message a client sends: a request line such as GET /notes HTTP/1.1, header fields, a blank line and
      an optional body.
    concept: networking.http-basics
  - id: http-response
    term: HTTP response
    definition: >-
      The message a server sends back: a status line such as HTTP/1.1 200 OK, header fields, a blank line and
      the body.
    concept: networking.http-basics
  - id: http-method
    term: HTTP method
    aliases: [HTTP verb]
    definition: >-
      The first word of a request, naming the action wanted on the target resource, such as GET (read), POST
      (submit or create), PUT (replace), PATCH (modify) or DELETE (remove).
    concept: networking.http-basics
  - id: http-status-code
    term: HTTP status code
    aliases: [status code, response code]
    definition: >-
      The three-digit number in a response's status line. The first digit is the class - 1xx informational,
      2xx success, 3xx redirection, 4xx client error, 5xx server error.
    concept: networking.http-basics
  - id: http-header
    term: HTTP header field
    aliases: [header, HTTP header]
    definition: >-
      A name: value line in a request or response, such as Content-Type: application/json, carrying metadata
      about the message. Header names are case-insensitive.
    concept: networking.http-basics
  - id: crlf
    term: CRLF
    aliases: ["\\r\\n", carriage return line feed]
    definition: >-
      The two bytes carriage return (13) and line feed (10), written "\r\n" in Python. HTTP/1.1 ends each line
      of the message head with CRLF and marks the end of the headers with an empty line (CRLF CRLF).
    concept: networking.http-basics
  - id: content-length
    term: Content-Length
    definition: >-
      The header giving the size of the message body in bytes (not characters). The receiver reads exactly
      that many bytes after the blank line, so a wrong value truncates the body or makes it wait.
    concept: networking.http-basics
  - id: stateless-protocol
    term: Stateless protocol
    definition: >-
      A protocol in which each request is understood on its own, without the server remembering earlier
      requests. HTTP is stateless; cookies and tokens add continuity on top.
    concept: networking.http-basics

  # ---------------------------------------------------------------- backend.web-frameworks
  - id: web-framework
    term: Web framework
    definition: >-
      A library that turns HTTP requests into calls to your functions and their results into HTTP responses,
      handling routing, parameter parsing, serialisation, errors and middleware. Examples are FastAPI, Flask
      and Django.
    concept: backend.web-frameworks
  - id: routing
    term: Routing
    aliases: [router, route table]
    definition: >-
      Choosing which handler runs for a request by matching its method and path against a table of routes,
      such as GET /notes/{id}. No matching path gives 404; a matching path with the wrong method gives 405.
    concept: backend.web-frameworks
  - id: request-handler
    term: Handler
    aliases: [request handler, view function, path operation function, endpoint function]
    definition: >-
      The function a framework calls for a matched route. It receives the request data or parameters and
      returns data that the framework converts into a response.
    concept: backend.web-frameworks
  - id: path-parameter
    term: Path parameter
    aliases: [route parameter, URL parameter]
    definition: >-
      A variable part of a route pattern, such as {id} in /notes/{id}. The router extracts the matching path
      segment ("42") and passes it to the handler, often after converting it to a type such as int.
    concept: backend.web-frameworks
  - id: middleware
    term: Middleware
    definition: >-
      Code that wraps every request and response, running before the handler and again after it, like layers
      of an onion. It is used for logging, timing, authentication, CORS and error handling.
    concept: backend.web-frameworks
  - id: wsgi
    term: WSGI
    aliases: [Web Server Gateway Interface, PEP 3333]
    definition: >-
      The synchronous standard (PEP 3333) connecting Python web servers and applications. An application is a
      callable app(environ, start_response) that returns an iterable of bytes; Flask and Django support it.
    concept: backend.web-frameworks
  - id: asgi
    term: ASGI
    aliases: [Asynchronous Server Gateway Interface]
    definition: >-
      The asynchronous successor to WSGI. An application is a coroutine app(scope, receive, send) that
      exchanges event dictionaries with the server, which also supports WebSockets. FastAPI and Starlette are
      ASGI applications run by servers such as Uvicorn.
    concept: backend.web-frameworks
