terms:
  # ---- python.files
  - id: file-object
    term: File object
    aliases: [file handle, stream]
    definition: "The object open() returns. It remembers the file's current position and buffers data, and has methods such as read(), readline(), write() and close(). Iterating over it gives one line at a time."
    concept: python.files
  - id: file-mode
    term: File mode
    aliases: [open mode]
    definition: "The second argument to open(): \"r\" read (default), \"w\" write after erasing (truncating) the file, \"a\" append to the end, \"x\" create only if the file does not exist; add \"b\" for binary or \"+\" for read and write."
    concept: python.files
  - id: text-file
    term: Text file
    aliases: [text mode]
    definition: A file whose bytes represent characters in some encoding (usually UTF-8). Opened in text mode, Python decodes the bytes to str when reading and encodes str to bytes when writing.
    concept: python.files
  - id: binary-file
    term: Binary file
    aliases: [binary mode]
    definition: "A file whose bytes are not text, such as an image or a zip archive. Opened with a \"b\" mode (\"rb\", \"wb\"), it is read and written as bytes objects with no decoding."
    concept: python.files
  - id: buffering
    term: Buffering
    aliases: [buffer, flush]
    definition: Collecting written data in memory and sending it to the disk in larger chunks, because each operating-system call is slow. Data reaches the file when the buffer is flushed — by flush(), close(), or the end of a with block.
    concept: python.files
  # ---- python.csv-json
  - id: csv
    term: CSV
    aliases: [comma-separated values]
    definition: A plain-text table format with one record per line and fields separated by commas. Fields containing commas, quotes or newlines are wrapped in double quotes. Every value is text when read back.
    concept: python.csv-json
  - id: json
    term: JSON
    aliases: [JavaScript Object Notation]
    definition: "A text format for structured data built from objects {...}, arrays [...], strings in double quotes, numbers, true, false and null. The json module converts it to and from Python dicts, lists, str, int, float, bool and None."
    concept: python.csv-json
  - id: serialization
    term: Serialization
    aliases: [serialisation, deserialization, encoding data]
    definition: Converting in-memory objects into bytes or text (such as JSON) so they can be stored or sent elsewhere; deserialization (parsing) turns that text back into objects.
    concept: python.csv-json
  # ---- python.modules
  - id: module
    term: Module
    definition: A file of Python code (or a compiled extension) that can be imported. Importing runs its top-level code once and gives you a module object whose attributes are the names it defined.
    concept: python.modules
  - id: import-statement
    term: import statement
    aliases: [import, from ... import]
    definition: "Finds a module (checking sys.modules first, then the folders in sys.path), runs it if it has not been imported yet, and binds a name: `import math` binds math; `from math import sqrt` binds only sqrt."
    concept: python.modules
  - id: module-cache
    term: sys.modules
    aliases: [module cache]
    definition: The dictionary in which Python keeps every module imported so far, keyed by name. A second import of the same module finds it here and does not run the module's code again.
    concept: python.modules
  - id: module-search-path
    term: sys.path
    aliases: [module search path]
    definition: The list of folders Python searches, in order, to find a module that is not built in or already imported. The first entry is the running script's folder, so a file there named like a standard module shadows it.
    concept: python.modules
  - id: main-guard
    term: Main guard
    aliases: ['if __name__ == "__main__"', __name__]
    definition: "The idiom `if __name__ == \"__main__\":`. A module's __name__ is \"__main__\" only when it is run directly as a program, so code under the guard runs as a script but not when the file is imported."
    concept: python.modules
  # ---- python.comprehensions
  - id: comprehension
    term: Comprehension
    aliases: [list comprehension, dict comprehension, set comprehension]
    definition: "A single expression that builds a list, dict or set from an iterable, optionally filtering: `[x * 2 for x in nums if x > 0]`. Its loop variable is local to the comprehension."
    concept: python.comprehensions
  # ---- python.iterators
  - id: iterable
    term: Iterable
    definition: Any object you can loop over — list, str, dict, range, file, generator. Passing it to iter() returns an iterator over its items.
    concept: python.iterators
  - id: iterator
    term: Iterator
    definition: "An object that produces items one at a time: next(it) returns the next item and raises StopIteration when there are none left. Iterators are single-use and are themselves iterable."
    concept: python.iterators
  - id: iterator-protocol
    term: Iterator protocol
    aliases: [__iter__, __next__]
    definition: The rule every for loop relies on — iter(obj) calls obj.__iter__() to get an iterator, and next(it) calls it.__next__() until StopIteration is raised.
    concept: python.iterators
  - id: stop-iteration
    term: StopIteration
    definition: The exception an iterator raises from next() when it has no more items. for loops catch it to know when to stop; next(it, default) returns the default instead.
    concept: python.iterators
  # ---- python.generators
  - id: generator
    term: Generator
    aliases: [generator object, generator function]
    definition: "The iterator returned by calling a function that contains yield (a generator function). Its body runs only when next() is called, pausing at each yield and resuming from there next time."
    concept: python.generators
  - id: yield
    term: yield
    aliases: [yield from]
    definition: "The keyword that turns a function into a generator function. `yield value` hands value to the caller of next() and pauses the function, keeping its local variables; `yield from iterable` yields every item of another iterable."
    concept: python.generators
  - id: generator-expression
    term: Generator expression
    aliases: [genexpr]
    definition: "A comprehension-like expression in parentheses, such as `(x * x for x in nums)`, that creates a generator: items are computed lazily, one per next() call, instead of building a list."
    concept: python.generators
  - id: lazy-evaluation
    term: Lazy evaluation
    aliases: [lazy, on demand]
    definition: Computing values only when they are actually requested rather than all in advance. Generators, range and many built-ins such as zip and map are lazy, which saves memory and allows infinite sequences.
    concept: python.generators
