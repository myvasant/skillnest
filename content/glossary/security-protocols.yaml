terms:
  # ------------------------------------------------------- security.security-mindset
  - id: cia-triad
    term: CIA triad
    aliases: [confidentiality, integrity, availability]
    definition: >-
      The three core security properties - confidentiality (only authorised people can read data), integrity
      (data cannot be changed without authorisation, and changes are detected) and availability (the system
      works when it is needed).
    concept: security.security-mindset
  - id: vulnerability
    term: Vulnerability
    aliases: [security weakness, threat, risk]
    definition: >-
      A weakness that a threat (an attacker, insider or accident) can exploit to harm an asset, such as a
      missing permission check or an unpatched library. Risk combines how likely exploitation is with how
      much damage it would do.
    concept: security.security-mindset
  - id: attack-surface
    term: Attack surface
    definition: >-
      Everything an attacker can reach and send input to - endpoints, open ports, file uploads, dependencies,
      credentials and people. Removing unused features, ports and permissions shrinks it.
    concept: security.security-mindset
  - id: trust-boundary
    term: Trust boundary
    definition: >-
      A place where data or control passes between parts of a system with different levels of trust, such as
      from the internet into your API or from your app into the database. Validation and permission checks
      belong at trust boundaries.
    concept: security.security-mindset
  - id: least-privilege
    term: Principle of least privilege
    aliases: [least privilege, PoLP]
    definition: >-
      Every user, program, service account and token gets only the permissions it needs to do its job, for only
      as long as it needs them, which limits the damage when one of them is compromised.
    concept: security.security-mindset
  - id: defence-in-depth
    term: Defence in depth
    aliases: [defense in depth, layered security]
    definition: >-
      Layering independent security controls (authentication, authorisation, validation, network rules,
      restricted accounts, monitoring) so that the failure of any one layer does not become a breach.
    concept: security.security-mindset
  - id: fail-safe-defaults
    term: Fail-safe defaults
    aliases: [fail closed, deny by default, secure defaults]
    definition: >-
      The design principle that access is denied unless it is explicitly allowed, including when a check
      cannot complete because of an error or missing information.
    concept: security.security-mindset
  - id: allow-list
    term: Allow-list
    aliases: [allowlist, deny-list, denylist]
    definition: >-
      An explicit list of what is permitted (values, characters, hosts, tools); everything else is rejected.
      Its opposite, a deny-list of known-bad inputs, fails as soon as an attacker finds a case nobody listed.
    concept: security.security-mindset
  - id: path-traversal
    term: Path traversal
    aliases: [directory traversal, dot-dot-slash attack, CWE-22]
    definition: >-
      An attack where user-supplied file names such as `../secrets.txt` or `/etc/passwd` make a program read or
      write files outside the folder it intended. Prevent it by resolving the final path and checking it is
      inside the allowed directory.
    concept: security.security-mindset
  - id: security-through-obscurity
    term: Security through obscurity
    definition: >-
      Relying on attackers not knowing how a system works (hidden URLs, secret formats, unusual ports) instead
      of on real controls. Designs should stay secure even when attackers know everything except the keys.
    concept: security.security-mindset
  # ----------------------------------------------------- security.cryptography-basics
  - id: cryptographic-hash
    term: Cryptographic hash function
    aliases: [SHA-256, message digest, digest]
    definition: >-
      A function such as SHA-256 that maps any input to a fixed-size digest so that it is infeasible to find an
      input for a given digest or two inputs with the same digest. Used for integrity checks and as a building
      block for MACs, signatures and password hashing. Not the same as Python's built-in `hash()`.
    concept: security.cryptography-basics
  - id: base64
    term: Base64
    aliases: [base64 encoding]
    definition: >-
      An encoding that represents bytes using 64 printable characters so binary data can travel through
      text-only channels. It uses no key and anyone can decode it, so it provides no secrecy.
    concept: security.cryptography-basics
  - id: encryption
    term: Encryption
    aliases: [ciphertext, plaintext, decryption]
    definition: >-
      Transforming plaintext into ciphertext with a key so that only holders of the right key can turn it back.
      It protects confidentiality; on its own it does not prove the data was not modified.
    concept: security.cryptography-basics
  - id: symmetric-encryption
    term: Symmetric encryption
    aliases: [secret-key encryption, AES, ChaCha20]
    definition: >-
      Encryption where the same secret key encrypts and decrypts. It is fast and used for bulk data, but both
      sides must already share the key.
    concept: security.cryptography-basics
  - id: public-key-cryptography
    term: Public-key cryptography
    aliases: [asymmetric cryptography, key pair, RSA, elliptic-curve cryptography]
    definition: >-
      Cryptography with a key pair - a public key that can be shared and a private key that must be kept
      secret. It is used for key exchange (agreeing on a shared secret over an open network) and for digital
      signatures.
    concept: security.cryptography-basics
  - id: authenticated-encryption
    term: Authenticated encryption
    aliases: [AEAD, AES-GCM, ChaCha20-Poly1305]
    definition: >-
      Encryption that also produces an authentication tag, so any modification of the ciphertext is detected
      at decryption. AES-GCM and ChaCha20-Poly1305 are the standard choices.
    concept: security.cryptography-basics
  - id: digital-signature
    term: Digital signature
    definition: >-
      A value computed with a private key over some data that anyone holding the matching public key can
      verify, proving who produced the data and that it has not changed since.
    concept: security.cryptography-basics
  - id: hmac
    term: HMAC
    aliases: [message authentication code, MAC, hash-based message authentication code]
    definition: >-
      A message authentication code built from a hash function and a shared secret key (RFC 2104). Anyone with
      the key can check that a message was produced by a key holder and was not changed; in Python use
      `hmac.new(key, message, hashlib.sha256)`.
    concept: security.cryptography-basics
  - id: salt
    term: Salt
    aliases: [password salt]
    definition: >-
      A unique random value (for example 16 bytes from `secrets.token_bytes`) combined with each password
      before hashing and stored next to the hash. It makes identical passwords hash differently and defeats
      precomputed lookup tables.
    concept: security.cryptography-basics
  - id: password-hashing
    term: Password hashing function
    aliases: [key derivation function, KDF, PBKDF2, scrypt, Argon2id, bcrypt]
    definition: >-
      A deliberately slow (and ideally memory-hard), salted function such as Argon2id, scrypt, bcrypt or PBKDF2
      used to store passwords, so that each guess costs an attacker real time and memory.
    concept: security.cryptography-basics
  - id: constant-time-comparison
    term: Constant-time comparison
    aliases: [timing attack, compare_digest]
    definition: >-
      Comparing secrets (MAC tags, tokens) in a way whose running time does not depend on where they first
      differ, so an attacker cannot learn the secret from response times. In Python use
      `hmac.compare_digest` or `secrets.compare_digest`.
    concept: security.cryptography-basics
  - id: csprng
    term: Cryptographically secure random number generator
    aliases: [CSPRNG, secure randomness, secrets module]
    definition: >-
      A random generator whose output cannot be predicted even by someone who has seen earlier outputs. Use it
      (Python's `secrets` module) for tokens, keys and salts; the `random` module is for simulations only.
    concept: security.cryptography-basics
  - id: nonce
    term: Nonce
    aliases: [number used once, IV]
    definition: >-
      A value that must never repeat for the same key, given to an encryption algorithm such as AES-GCM so that
      encrypting the same message twice gives different ciphertexts. Reusing a nonce with the same key can
      break confidentiality and integrity.
    concept: security.cryptography-basics
  # ------------------------------------------------------------ genai.prompt-injection
  - id: prompt-injection
    term: Prompt injection
    definition: >-
      An attack in which text supplied to an LLM - by a user or hidden in content the model reads - makes it
      ignore the application's instructions and follow the attacker's instead. Ranked first (LLM01) in the
      OWASP Top 10 for LLM Applications 2025.
    concept: genai.prompt-injection
  - id: indirect-prompt-injection
    term: Indirect prompt injection
    definition: >-
      Prompt injection where the malicious instructions arrive inside content the model processes on a user's
      behalf - a web page, email, document, retrieved chunk or tool result - rather than being typed by the
      user.
    concept: genai.prompt-injection
  - id: jailbreak
    term: Jailbreak
    definition: >-
      Input crafted to make a model bypass its own safety training (for example to produce content it would
      normally refuse). It overlaps with prompt injection, which is about hijacking an application's
      instructions and capabilities.
    concept: genai.prompt-injection
  - id: data-exfiltration
    term: Data exfiltration
    aliases: [exfiltration]
    definition: >-
      Getting data out of a system to somewhere the attacker controls. With LLM apps the channel is often a
      tool call (send an email, fetch a URL) or rendered output such as an image link whose URL carries the
      data.
    concept: genai.prompt-injection
  - id: excessive-agency
    term: Excessive agency
    definition: >-
      Giving an LLM application more tools, permissions or autonomy than its task needs, so a manipulated or
      mistaken model can cause real damage. LLM06 in the OWASP Top 10 for LLM Applications 2025.
    concept: genai.prompt-injection
  - id: lethal-trifecta
    term: Lethal trifecta
    definition: >-
      Simon Willison's name for the dangerous combination in one LLM system of access to private data,
      exposure to untrusted content and a way to send data out. With all three, prompt injection can steal
      data; removing any one breaks the attack chain.
    concept: genai.prompt-injection
  - id: spotlighting
    term: Spotlighting
    aliases: [delimiting untrusted content, datamarking]
    definition: >-
      Marking or transforming untrusted text in a prompt (delimiters, markers, encoding) so the model can tell
      it apart from instructions. It reduces injection success but does not guarantee the model will ignore
      instructions in the marked text.
    concept: genai.prompt-injection
  # ------------------------------------------------------------------------ agents.mcp
  - id: model-context-protocol
    term: Model Context Protocol
    aliases: [MCP]
    definition: >-
      An open protocol, built on JSON-RPC 2.0, that lets AI applications (hosts) connect through clients to
      servers exposing tools, resources and prompts. Versioned by date; revision 2026-07-28 is stateless,
      with protocol version and capabilities sent in every request.
    concept: agents.mcp
  - id: mcp-host
    term: MCP host
    definition: >-
      The AI application - a chat app, IDE or agent - that coordinates one or more MCP clients, decides what
      the model may use and asks the user for consent.
    concept: agents.mcp
  - id: mcp-client
    term: MCP client
    definition: >-
      The component inside a host that maintains the connection to one MCP server and sends it requests. A host
      creates one client per server.
    concept: agents.mcp
  - id: mcp-server
    term: MCP server
    definition: >-
      A program that exposes tools, resources and prompts to MCP clients, running locally (usually over stdio)
      or remotely (over Streamable HTTP).
    concept: agents.mcp
  - id: json-rpc
    term: JSON-RPC 2.0
    aliases: [JSON-RPC]
    definition: >-
      A lightweight remote-procedure-call format in JSON. Requests carry `jsonrpc`, `id`, `method` and optional
      `params`; responses carry the same `id` and either `result` or `error` (with an integer `code`);
      notifications have no `id` and get no response.
    concept: agents.mcp
  - id: mcp-primitives
    term: MCP primitives
    aliases: [MCP tools, MCP resources, MCP prompts]
    definition: >-
      The three things an MCP server can offer - tools (functions the model can call, model-controlled),
      resources (data identified by URIs, application-controlled) and prompts (reusable templates,
      user-controlled).
    concept: agents.mcp
  - id: stdio-transport
    term: stdio transport
    definition: >-
      The MCP transport in which the client launches the server as a subprocess and exchanges newline-delimited
      JSON-RPC messages over its standard input and output; logs go to standard error.
    concept: agents.mcp
  - id: streamable-http
    term: Streamable HTTP
    definition: >-
      The MCP transport for remote servers - every message is an HTTP POST to one endpoint, answered with a
      JSON object or a Server-Sent Events stream for that request. It replaced the deprecated HTTP+SSE
      transport.
    concept: agents.mcp
  - id: server-discover
    term: server/discover
    definition: >-
      The MCP method (mandatory for servers since revision 2026-07-28) that returns a server's supported
      protocol versions, capabilities and identity in one request.
    concept: agents.mcp
  # ------------------------------------------------------ Python secure coding
  - id: untrusted-data
    term: Untrusted data
    definition: >-
      Input whose contents or origin are not fully controlled by the application, including request fields,
      uploaded files, environment values, database records and tool results. Validate it for the intended
      operation and enforce authorisation separately.
    concept: python.secure-coding
  - id: unsafe-deserialization
    term: Unsafe deserialization
    definition: >-
      Reconstructing objects from data in a way that can execute code or consume excessive resources. Python
      pickle can execute arbitrary code while loading malicious data, so never unpickle untrusted input.
    concept: python.secure-coding
  - id: shell-injection
    term: Shell injection
    definition: >-
      An attack where untrusted text is interpreted as shell syntax because an application builds a command
      string and executes it through a shell. Prefer a fixed executable with a separate argument list and
      shell=False, and validate arguments for the called program.
    concept: python.secure-coding
  - id: resource-exhaustion
    term: Resource exhaustion
    aliases: [denial of service by resource consumption]
    definition: >-
      Making a program consume more CPU, memory, disk, connections or worker capacity than it can safely
      provide. Bound input sizes, processing time, queue length and concurrency, and handle decompression or
      nested data with explicit limits.
    concept: python.secure-coding
