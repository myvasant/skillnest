terms:
  # ------------------------------------------------------------ databases.sql-basics
  - id: sql
    term: SQL
    aliases: [Structured Query Language]
    definition: >-
      The standard language for defining, querying and changing data in relational databases. A query
      describes the rows you want (SELECT ... FROM ... WHERE ...) and the database decides how to fetch them.
      Each product (PostgreSQL, SQLite, MySQL...) speaks a dialect with small differences.
    concept: databases.sql-basics
  - id: declarative-language
    term: Declarative language
    aliases: [declarative programming]
    definition: >-
      A language in which you describe the result you want rather than the steps to compute it. SQL is
      declarative: a query planner chooses the steps (full scan, index lookup, join order) for you.
      Contrast with imperative code such as a Python loop.
    concept: databases.sql-basics
  - id: null-value
    term: "NULL"
    aliases: [SQL NULL, null value]
    definition: >-
      The SQL marker for a missing or unknown value. It is not zero and not an empty string. Comparing
      anything with NULL, even NULL itself, gives UNKNOWN, so you test for it with IS NULL or IS NOT NULL.
      Python's sqlite3 module returns NULL as None.
    concept: databases.sql-basics
  - id: three-valued-logic
    term: Three-valued logic
    aliases: [UNKNOWN, 3VL]
    definition: >-
      SQL's logic in which a condition can be TRUE, FALSE or UNKNOWN (the result of comparing with NULL).
      WHERE, ON and HAVING keep a row only when the condition is TRUE, so UNKNOWN rows are dropped just like
      FALSE ones.
    concept: databases.sql-basics
  # ------------------------------------------------------------ databases.sql-joins
  - id: sql-join
    term: Join
    aliases: [SQL join, JOIN]
    definition: >-
      An operation that combines rows from two tables into wider rows by pairing rows that satisfy a
      condition, usually matching a foreign key with a primary key (ON orders.customer_id = customers.id).
    concept: databases.sql-joins
  - id: inner-join
    term: Inner join
    aliases: [INNER JOIN]
    definition: >-
      A join that returns only the pairs of rows for which the join condition is TRUE. Rows with no match in
      the other table, including rows whose key is NULL, disappear from the result.
    concept: databases.sql-joins
  - id: outer-join
    term: Outer join
    aliases: [LEFT JOIN, RIGHT JOIN, FULL OUTER JOIN, left outer join]
    definition: >-
      A join that also keeps unmatched rows: LEFT JOIN keeps every row of the left table, RIGHT JOIN every row
      of the right table, FULL OUTER JOIN every row of both, filling the missing side's columns with NULL.
    concept: databases.sql-joins
  - id: anti-join
    term: Anti-join
    aliases: [anti join]
    definition: >-
      A query that returns the rows of one table that have no match in another, for example customers who
      never ordered. Written as LEFT JOIN ... WHERE right.id IS NULL or with NOT EXISTS (...).
    concept: databases.sql-joins
  - id: self-join
    term: Self join
    aliases: [self-join]
    definition: >-
      A join of a table with itself, using two aliases, to relate rows of the same table — for example
      employees with their managers when manager_id refers to another row's id.
    concept: databases.sql-joins
  - id: cartesian-product
    term: Cartesian product
    aliases: [CROSS JOIN, cross join]
    definition: >-
      Every row of one table paired with every row of another, so a table of m rows and one of n rows give
      m x n rows. Written deliberately as CROSS JOIN; produced by accident when a join condition is missing.
    concept: databases.sql-joins
  # ------------------------------------------------------------ databases.sqlite-python
  - id: sql-injection
    term: SQL injection
    aliases: [SQLi]
    definition: >-
      An attack in which untrusted input is pasted into the text of a SQL statement, so the database parses
      part of the input as SQL code — for example ' OR '1'='1 turning a lookup into "return every row".
      Prevented by passing values as query parameters, never by string formatting.
    concept: databases.sqlite-python
  - id: parameterized-query
    term: Parameterised query
    aliases: [parameterized query, prepared statement, bind parameter, placeholder, query parameter]
    definition: >-
      A SQL statement written with placeholders (? or :name in sqlite3, %s in psycopg) whose values are sent
      separately and bound as data after the statement is parsed, so they can never change its structure.
    concept: databases.sqlite-python
  - id: database-cursor
    term: Database cursor
    aliases: [cursor, sqlite3.Cursor]
    definition: >-
      The DB-API object that executes statements and walks through their result rows, with methods such as
      execute(), fetchone(), fetchmany() and fetchall(). In sqlite3, Connection.execute() creates one for you.
    concept: databases.sqlite-python
  - id: db-api
    term: DB-API 2.0
    aliases: [PEP 249, Python Database API]
    definition: >-
      The Python specification (PEP 249) that database drivers follow: connect() returns a connection,
      connections create cursors, cursors execute parameterised statements and fetch rows, and the
      connection commits or rolls back. sqlite3 and psycopg both implement it.
    concept: databases.sqlite-python
  # ------------------------------------------------------------ math.vectors
  - id: vector
    term: Vector
    aliases: [feature vector]
    definition: >-
      An ordered list of n numbers, such as [3, 1] or a 768-number embedding. Geometrically it is an arrow
      with a length and a direction in n-dimensional space; vectors add element by element and scale by
      multiplying every element.
    concept: math.vectors
  - id: vector-norm
    term: Norm
    aliases: [vector length, magnitude, L2 norm, Euclidean norm, L1 norm]
    definition: >-
      A measure of a vector's length. The usual (L2, Euclidean) norm is the square root of the sum of the
      squared elements, ||v|| = sqrt(v1² + ... + vn²); the L1 norm is the sum of absolute values.
    concept: math.vectors
  - id: dot-product
    term: Dot product
    aliases: [inner product, scalar product]
    definition: >-
      The sum of element-wise products of two equal-length vectors, a·b = a1b1 + ... + anbn. Geometrically
      a·b = ||a|| ||b|| cos θ, so it is positive for similar directions, zero for perpendicular ones and
      negative for opposite ones.
    concept: math.vectors
  - id: cosine-similarity
    term: Cosine similarity
    aliases: [cosine]
    definition: >-
      The cosine of the angle between two vectors, a·b / (||a|| ||b||). It ranges from -1 (opposite) through
      0 (perpendicular) to 1 (same direction) and ignores the vectors' lengths, which is why it is the usual
      way to compare embeddings.
    concept: math.vectors
  - id: unit-vector
    term: Unit vector
    aliases: [normalised vector, normalized vector, normalisation]
    definition: >-
      A vector with length (L2 norm) 1, obtained by dividing a non-zero vector by its norm. For unit vectors
      the dot product equals the cosine similarity.
    concept: math.vectors
  - id: euclidean-distance
    term: Euclidean distance
    aliases: [L2 distance, straight-line distance]
    definition: >-
      The straight-line distance between two points, ||a - b|| = sqrt(Σ (ai - bi)²). Python provides it as
      math.dist(a, b). For unit vectors, ranking by distance gives the same order as ranking by cosine
      similarity.
    concept: math.vectors
  # ------------------------------------------------------------ math.optimization
  - id: gradient-descent
    term: Gradient descent
    aliases: [GD, steepest descent]
    definition: >-
      An iterative method for minimising a function: repeatedly move the parameters a small step against the
      gradient, θ ← θ - η ∇L(θ), because the gradient points uphill. Variants such as stochastic and
      mini-batch gradient descent estimate the gradient from part of the data.
    concept: math.optimization
  - id: learning-rate
    term: Learning rate
    aliases: [step size, eta, η]
    definition: >-
      The number η that scales each gradient-descent step. Too small and progress is slow; too large and the
      steps overshoot the minimum, oscillate or diverge.
    concept: math.optimization
  - id: convex-function
    term: Convex function
    aliases: [convexity]
    definition: >-
      A function whose graph lies on or below the straight line (chord) joining any two of its points, like a
      bowl. Every local minimum of a convex function is a global minimum, so gradient descent with a suitable
      learning rate cannot get stuck in a worse minimum.
    concept: math.optimization
  - id: local-minimum
    term: Local minimum
    aliases: [global minimum, local minima]
    definition: >-
      A point where the function is lower than at all nearby points. The global minimum is the lowest point
      overall; a non-convex function can have local minima that are higher than the global one, and gradient
      descent may stop in whichever one its starting point leads to.
    concept: math.optimization
  # ------------------------------------------------------------ math.conditional-probability
  - id: conditional-probability
    term: Conditional probability
    aliases: [P(A|B)]
    definition: >-
      The probability of A given that B is known to have happened, P(A|B) = P(A and B) / P(B): restrict
      attention to the cases where B happened and ask how often A happens too. In general P(A|B) differs
      from P(B|A).
    concept: math.conditional-probability
  - id: bayes-theorem
    term: "Bayes' theorem"
    aliases: [Bayes' rule, Bayes rule, Bayes theorem]
    definition: >-
      The rule for reversing a conditional probability, P(H|E) = P(E|H) · P(H) / P(E). It turns a prior
      belief P(H) and a likelihood P(E|H) into a posterior P(H|E) after seeing evidence E.
    concept: math.conditional-probability
  - id: prior-probability
    term: Prior
    aliases: [prior probability, base rate]
    definition: >-
      The probability of a hypothesis before the current evidence is taken into account, such as how common
      a disease is in the population tested. In Bayes' theorem it is P(H).
    concept: math.conditional-probability
  - id: posterior-probability
    term: Posterior
    aliases: [posterior probability]
    definition: >-
      The probability of a hypothesis after taking the evidence into account, P(H|E), computed with Bayes'
      theorem. It can become the prior for the next piece of evidence.
    concept: math.conditional-probability
  - id: likelihood
    term: Likelihood
    aliases: [P(E|H)]
    definition: >-
      In Bayes' theorem, the probability of seeing the evidence if the hypothesis is true, P(E|H) — for a
      medical test, the chance of a positive result in someone who has the condition (its sensitivity).
    concept: math.conditional-probability
  - id: base-rate-fallacy
    term: Base-rate fallacy
    aliases: [base rate neglect]
    definition: >-
      The error of judging P(H|E) from the likelihood P(E|H) alone while ignoring how rare H is. With a rare
      condition, even an accurate test produces mostly false positives.
    concept: math.conditional-probability
  - id: law-of-total-probability
    term: Law of total probability
    aliases: [total probability]
    definition: >-
      The rule P(E) = P(E|H) · P(H) + P(E|not H) · P(not H): the overall probability of E is the weighted sum
      over the cases that cover every possibility. It gives the denominator of Bayes' theorem.
    concept: math.conditional-probability
