terms:
  # ---------------------------------------------------------------- closures
  - id: closure
    term: Closure
    definition: >-
      A function that keeps access to variables of the enclosing function in which it was defined, even
      after that enclosing function has returned. It keeps the variables themselves, not copies of their
      values.
    concept: python.closures
  - id: free-variable
    term: Free variable
    definition: >-
      A name a function uses but does not assign itself (it is not a parameter or local) and that belongs
      to an enclosing function scope. A closure's free variables are listed in `func.__code__.co_freevars`.
    concept: python.closures
  - id: cell-object
    term: Cell object
    aliases: [cell, __closure__]
    definition: >-
      The small container CPython uses to store a variable shared between an outer function and its inner
      functions. `func.__closure__` is a tuple of cells; `cell.cell_contents` is the value inside.
    concept: python.closures
  - id: nonlocal-statement
    term: nonlocal statement
    aliases: [nonlocal]
    definition: >-
      `nonlocal name` inside an inner function makes assignments to name rebind the variable of the
      nearest enclosing function, instead of creating a new local variable. It never refers to globals.
    concept: python.closures
  - id: late-binding
    term: Late binding
    definition: >-
      Looking a free variable up when a function is called rather than when it is defined. Functions
      created in a loop therefore all see the loop variable's final value unless each gets its own value
      (for example with a default argument).
    concept: python.closures
  - id: factory-function
    term: Factory function
    definition: >-
      A function whose job is to build and return another object — often a configured inner function
      (closure), as in `make_multiplier(2)` returning a doubling function.
    concept: python.closures
  # -------------------------------------------------------------- decorators
  - id: decorator
    term: Decorator
    definition: >-
      A callable that takes a function (or class) and returns a replacement for it. Writing `@deco` on the
      line above `def f` is equivalent to `f = deco(f)` right after the definition.
    concept: python.decorators
  - id: wrapper-function
    term: Wrapper function
    aliases: [wrapper]
    definition: >-
      The inner function a decorator returns. It usually runs extra code before and/or after calling the
      original function, passing through `*args, **kwargs` and returning the original's result.
    concept: python.decorators
  - id: decorator-factory
    term: Decorator factory
    aliases: [decorator with arguments]
    definition: >-
      A function that takes configuration arguments and returns a decorator, as in `@repeat(3)`. It gives
      three levels of functions: factory, decorator and wrapper.
    concept: python.decorators
  - id: functools-wraps
    term: functools.wraps
    definition: >-
      A decorator used on a wrapper function that copies the wrapped function's name, docstring, module and
      other metadata onto the wrapper and sets `wrapper.__wrapped__` to the original.
    concept: python.decorators
  - id: memoization
    term: Memoization
    aliases: [caching results]
    definition: >-
      Remembering a function's results for arguments it has already seen, so repeated calls return the
      stored result instead of recomputing it. functools.lru_cache and functools.cache provide it.
    concept: python.decorators
  # ------------------------------------------------------- raising exceptions
  - id: raise-statement
    term: raise statement
    aliases: [raise]
    definition: >-
      `raise SomeError("message")` creates an exception object and starts propagating it, stopping the
      current function immediately. A bare `raise` inside an except block re-raises the exception being
      handled.
    concept: python.raising-exceptions
  - id: custom-exception
    term: Custom exception
    aliases: [user-defined exception]
    definition: >-
      An exception class you define by subclassing Exception (or one of its subclasses), usually named
      ...Error, so callers can catch your specific failure and read context from its attributes.
    concept: python.raising-exceptions
  - id: exception-hierarchy
    term: Exception hierarchy
    definition: >-
      The tree of exception classes formed by inheritance. An except clause for a class also catches all
      of its subclasses — for example, except LookupError catches KeyError and IndexError.
    concept: python.raising-exceptions
  - id: exception-chaining
    term: Exception chaining
    aliases: [raise from, __cause__]
    definition: >-
      Linking a new exception to the one that caused it. `raise New(...) from err` sets `__cause__`;
      raising inside an except block without from sets `__context__` automatically. Tracebacks show both.
    concept: python.raising-exceptions
  - id: exception-group
    term: ExceptionGroup
    aliases: ["except*"]
    definition: >-
      An exception that bundles several unrelated exceptions so they can be raised together (Python 3.11+).
      `except*` clauses handle the matching parts of a group.
    concept: python.raising-exceptions
  - id: guard-clause
    term: Guard clause
    definition: >-
      A check at the top of a function that raises (or returns) immediately when an input is invalid, so
      the rest of the function can assume valid data.
    concept: python.raising-exceptions
  # ----------------------------------------------------------------- testing
  - id: unit-test
    term: Unit test
    definition: >-
      An automated test that checks one small piece of code — usually a single function — by calling it
      with known inputs and asserting on the result.
    concept: python.testing
  - id: assert-statement
    term: assert statement
    aliases: [assert, assertion]
    definition: >-
      `assert condition, message` raises AssertionError with the message if the condition is false. Used
      in tests; not for validating input in production code, because `python -O` removes asserts.
    concept: python.testing
  - id: arrange-act-assert
    term: Arrange-act-assert
    aliases: [AAA]
    definition: >-
      A layout for tests: arrange the inputs and objects, act by calling the code under test once, then
      assert on the outcome.
    concept: python.testing
  - id: test-runner
    term: Test runner
    definition: >-
      A tool that finds test functions, runs each one, records which pass or fail, and reports the
      results — for example pytest or unittest.
    concept: python.testing
  - id: test-fixture
    term: Test fixture
    aliases: [fixture]
    definition: >-
      Reusable setup (and optional cleanup) for tests. In pytest, a function decorated with
      @pytest.fixture whose return value is passed to any test that names it as a parameter.
    concept: python.testing
  - id: parametrized-test
    term: Parametrized test
    aliases: [parametrize]
    definition: >-
      One test function run several times with different inputs and expected outputs, e.g. with
      @pytest.mark.parametrize.
    concept: python.testing
  - id: test-driven-development
    term: Test-driven development
    aliases: [TDD, red-green-refactor]
    definition: >-
      Writing a failing test first (red), then the simplest code that passes it (green), then improving
      the code while the tests stay green (refactor).
    concept: python.testing
  - id: regression-test
    term: Regression test
    definition: >-
      A test added for a bug you fixed, so the same bug cannot quietly return later.
    concept: python.testing
  - id: edge-case
    term: Edge case
    aliases: [boundary case]
    definition: >-
      An input at the limits of what a function handles — empty, zero, one item, the exact boundary value,
      very large — where bugs are most likely to hide.
    concept: python.testing
  # ----------------------------------------------------- concurrency
  - id: concurrency
    term: Concurrency
    definition: >-
      A way to organise a program so multiple tasks have overlapping lifetimes and can make progress during
      one another's waiting periods. Tasks may take turns on one CPU core; concurrency does not require
      simultaneous execution on multiple cores.
    concept: python.concurrency
  - id: parallelism
    term: Parallelism
    definition: >-
      Executing two or more pieces of work at the same instant, usually on different CPU cores or processors.
      Parallelism can improve throughput for suitable independent work, but coordination and data-transfer
      costs can outweigh the benefit.
    concept: python.concurrency
  - id: io-bound
    term: I/O-bound workload
    aliases: [I/O-bound]
    definition: >-
      Work whose progress is limited mainly by waiting for input or output, such as network responses, disk
      operations or database calls. Threads or asynchronous I/O can overlap those waiting periods.
    concept: python.concurrency
  - id: cpu-bound
    term: CPU-bound workload
    aliases: [CPU-bound]
    definition: >-
      Work whose progress is limited mainly by processor time spent calculating. Independent pure-Python
      work may benefit from processes on standard GIL-enabled CPython, while native libraries may use their
      own parallel execution.
    concept: python.concurrency
  - id: race-condition
    term: Race condition
    definition: >-
      A bug where the result depends on the timing or interleaving of operations. Shared read-modify-write
      sequences are a common source; explicit synchronisation or a design without shared mutation can prevent
      lost updates.
    concept: python.concurrency
  - id: critical-section
    term: Critical section
    definition: >-
      A part of a program that accesses shared state and must be protected so another worker cannot interleave
      a conflicting operation. A lock can ensure only one thread enters the protected section at a time.
    concept: python.concurrency
  - id: global-interpreter-lock
    term: Global Interpreter Lock
    aliases: [GIL]
    definition: >-
      A lock used by the standard GIL-enabled CPython build to ensure only one thread at a time executes
      Python bytecode in that interpreter. It is an implementation detail, not a rule for every Python
      implementation or optional free-threaded build.
    concept: python.concurrency
  - id: free-threaded-build
    term: Free-threaded CPython build
    aliases: [free-threaded Python]
    definition: >-
      An optional CPython build introduced in Python 3.13 that can run with the GIL disabled. Third-party
      extension compatibility and explicit protection of shared mutable state still matter.
    concept: python.concurrency
  - id: thread-pool
    term: Thread pool
    definition: >-
      A managed collection of reusable operating-system threads that executes submitted tasks. A bounded
      ThreadPoolExecutor can overlap blocking I/O without creating a new thread for every task.
    concept: python.concurrency
  - id: process-pool
    term: Process pool
    definition: >-
      A managed collection of worker processes that execute tasks in separate memory spaces. It can use
      multiple CPU cores for independent work, but incurs startup, memory and serialisation costs.
    concept: python.concurrency
  # ---------------------------------------------------------- asyncio
  - id: coroutine
    term: Coroutine
    definition: >-
      A function-like unit of asynchronous work declared with async def. Calling a coroutine function creates
      a coroutine object; the body runs only when that object is awaited or scheduled.
    concept: python.asyncio
  - id: coroutine-object
    term: Coroutine object
    definition: >-
      The awaitable object returned when an async def function is called. It represents work that has not yet
      been run; it must be awaited or scheduled as a Task, otherwise it may be reported as never awaited.
    concept: python.asyncio
  - id: event-loop
    term: Event loop
    definition: >-
      The scheduler that runs ready asyncio Tasks and waits for I/O completions or timers. A task normally
      gives other tasks on the same loop a chance to run when it reaches an await point.
    concept: python.asyncio
  - id: asyncio-task
    term: asyncio Task
    definition: >-
      An object that wraps a coroutine and schedules it to run on an event loop. Awaiting a Task waits for its
      result; TaskGroup can manage the lifetime and failures of related Tasks.
    concept: python.asyncio
  - id: cancellation
    term: Task cancellation
    definition: >-
      A request for an asynchronous task to stop. Asyncio raises CancelledError at a cancellation point;
      coroutines should clean up resources and normally propagate the cancellation afterwards.
    concept: python.asyncio
  - id: blocking-call
    term: Blocking call
    definition: >-
      A function call that occupies the current thread until it finishes instead of yielding control. A
      blocking call inside an asyncio task can stall every other task scheduled on that event loop.
    concept: python.asyncio
