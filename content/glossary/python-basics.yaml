terms:
  # ---- python.strings
  - id: escape-sequence
    term: Escape sequence
    aliases: ["\\n", "backslash escape"]
    definition: "A backslash followed by a character inside a string literal that stands for one special character, such as \\n (newline), \\t (tab), \\\\ (backslash) or \\\" (double quote)."
    concept: python.strings
  - id: raw-string
    term: Raw string
    aliases: ["r-string", "r\"...\""]
    definition: "A string literal prefixed with r, such as r\"C:\\new\", in which backslashes are ordinary characters instead of starting escape sequences. Useful for Windows paths and regular expressions."
    concept: python.strings
  - id: concatenation
    term: Concatenation
    aliases: ["string concatenation", "+ on strings"]
    definition: "Joining strings end to end with +, which creates a new string. Both operands must be strings; Python adds no space between them."
    concept: python.strings
  - id: string-method
    term: String method
    aliases: [str method]
    definition: "A function attached to every string and called with a dot, such as text.upper() or text.split(). Because strings are immutable, string methods return new values instead of changing the original."
    concept: python.strings
  # ---- python.type-conversion
  - id: type-conversion
    term: Type conversion
    aliases: [casting, type casting]
    definition: "Creating a new object of a different type from an existing value, for example int(\"42\") or str(3.5). The original object is unchanged."
    concept: python.type-conversion
  - id: type-error
    term: TypeError
    definition: "Raised when an operation is applied to an object of the wrong type, such as \"Age: \" + 36 or len(5)."
    concept: python.type-conversion
  - id: value-error
    term: ValueError
    definition: "Raised when an argument has the right type but an unsuitable value, such as int(\"3.5\") or int(\"hello\")."
    concept: python.type-conversion
  - id: truncation
    term: Truncation
    aliases: [truncate]
    definition: "Dropping the fractional part of a number without rounding. int(3.9) is 3 and int(-3.9) is -3 (toward zero), whereas round(3.9) is 4."
    concept: python.type-conversion
  # ---- python.input-output
  - id: f-string
    term: f-string
    aliases: [formatted string literal, f"..."]
    definition: "A string literal prefixed with f, such as f\"Total: {price:.2f}\", in which expressions inside braces are evaluated and formatted into the text when the line runs."
    concept: python.input-output
  - id: format-specifier
    term: Format specifier
    aliases: [format spec, format mini-language]
    definition: "The part after the colon in an f-string field, such as :.2f, :>8 or :, which controls how a value is displayed (decimal places, width, alignment, separators)."
    concept: python.input-output
  - id: standard-input
    term: Standard input
    aliases: [stdin]
    definition: "The stream a program reads text from, normally the keyboard. input() reads one line from it; in Groundwork it is fed from the Input box."
    concept: python.input-output
  # ---- python.booleans
  - id: boolean
    term: Boolean
    aliases: [bool, "True", "False"]
    definition: "The type bool, whose only values are True and False. Comparisons produce booleans, and conditions are decided by them."
    concept: python.booleans
  - id: comparison-operator
    term: Comparison operator
    aliases: ["==", "!=", "<", ">", "<=", ">="]
    definition: "An operator that compares two values and produces True or False: == (equal), != (not equal), <, >, <= and >=."
    concept: python.booleans
  - id: chained-comparison
    term: Chained comparison
    definition: "Several comparisons written together, such as 0 <= x < 10, meaning 0 <= x and x < 10, with x evaluated only once."
    concept: python.booleans
  - id: truthiness
    term: Truthiness
    aliases: [truthy, falsy, truth value]
    definition: "Whether a value counts as true or false in a condition. False, None, 0, 0.0, empty strings and empty collections are falsy; almost everything else is truthy. bool(x) reveals it."
    concept: python.booleans
  - id: short-circuit-evaluation
    term: Short-circuit evaluation
    aliases: [short-circuiting]
    definition: "and and or stop evaluating as soon as the result is known: False and ... never evaluates the right side, and neither does True or .... They return the last operand they evaluated."
    concept: python.booleans
  # ---- python.conditionals
  - id: code-block
    term: Block
    aliases: [suite, code block, indented block]
    definition: "A group of statements that belong together, such as the body of an if. In Python a block is marked by a colon on the line before and by indenting every line in it by the same amount."
    concept: python.conditionals
  - id: indentation
    term: Indentation
    definition: "Spaces at the start of a line. In Python indentation is syntax: it decides which statements belong to which block. PEP 8 recommends 4 spaces per level."
    concept: python.conditionals
  - id: indentation-error
    term: IndentationError
    aliases: [TabError]
    definition: "A kind of SyntaxError raised when indentation is missing, unexpected or inconsistent, for example 'expected an indented block after 'if' statement'. TabError is a variant for mixed tabs and spaces."
    concept: python.conditionals
  - id: conditional-expression
    term: Conditional expression
    aliases: [ternary operator, "a if condition else b"]
    definition: "An expression of the form value_if_true if condition else value_if_false, which produces one of two values. Only the chosen value is evaluated."
    concept: python.conditionals
  - id: branch
    term: Branch
    definition: "One of the alternative blocks of an if/elif/else statement. At most one branch of a single if statement runs: the first whose condition is true, or else."
    concept: python.conditionals
