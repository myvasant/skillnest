terms:
  # ----- python.functions
  - id: parameter
    term: Parameter
    aliases: [formal parameter]
    definition: "A name listed in a function definition, such as `width` in `def area(width, height):`. Each call binds the parameter to the corresponding argument object."
    concept: python.functions
  - id: call-stack
    term: Call stack
    aliases: [stack]
    definition: The pile of frames for the function calls currently in progress. The frame on top is running; each frame below is paused, waiting for the call it made to return. A traceback is a printout of the call stack.
    concept: python.functions
  - id: stack-frame
    term: Frame
    aliases: [stack frame, activation record]
    definition: The private workspace Python creates for one function call. It holds the call's local names and where execution is up to, and it is discarded when the call returns.
    concept: python.functions
  - id: docstring
    term: Docstring
    aliases: [documentation string]
    definition: "A string literal written as the first statement of a function (or module or class). Python stores it in `__doc__`, and tools such as help() display it."
    concept: python.functions
  - id: side-effect
    term: Side effect
    definition: Anything a function does besides returning a value, such as printing, changing a list it was given, or modifying a global variable.
    concept: python.functions
  # ----- python.parameters
  - id: positional-argument
    term: Positional argument
    definition: "An argument matched to a parameter by its position in the call: in `divide(10, 4)`, 10 goes to the first parameter and 4 to the second."
    concept: python.parameters
  - id: keyword-argument
    term: Keyword argument
    aliases: [named argument]
    definition: "An argument written as `name=value` in a call, matched to the parameter with that name regardless of position, e.g. `sorted(items, reverse=True)`."
    concept: python.parameters
  - id: default-argument
    term: Default parameter value
    aliases: [default argument, optional parameter]
    definition: "A value written in the def line (`def f(x, y=0):`) that is used when the caller omits that argument. It is evaluated once, when the def statement runs."
    concept: python.parameters
  - id: mutable-default-argument
    term: Mutable default argument
    aliases: [mutable default]
    definition: "A default value such as [] or {} that is created once and shared by every call that omits the argument, so changes accumulate between calls. Use None as the default and create the object inside the function."
    concept: python.parameters
  - id: args-kwargs
    term: "*args and **kwargs"
    aliases: [varargs, variadic parameters]
    definition: "Parameters that collect extra arguments: `*args` packs extra positional arguments into a tuple, `**kwargs` packs extra keyword arguments into a dict. The names after the stars are conventions."
    concept: python.parameters
  - id: keyword-only-parameter
    term: Keyword-only parameter
    definition: "A parameter listed after `*` or `*args` in a def line. Callers must pass it by name, e.g. `timeout` in `def connect(host, *, timeout=10):`."
    concept: python.parameters
  - id: positional-only-parameter
    term: Positional-only parameter
    definition: "A parameter listed before `/` in a def line. Callers must pass it by position and cannot use its name as a keyword."
    concept: python.parameters
  - id: argument-unpacking
    term: Argument unpacking
    aliases: [splat]
    definition: "Using `*` or `**` in a call to spread a sequence into positional arguments (`f(*values)`) or a dict into keyword arguments (`f(**options)`)."
    concept: python.parameters
  - id: pass-by-object-reference
    term: Pass by object reference
    aliases: [call by sharing, pass by assignment, call by object reference]
    definition: How Python passes arguments. Each parameter is bound to the same object the argument refers to, so mutations are visible to the caller but rebinding the parameter is not. It is neither pass-by-value (no copy) nor pass-by-reference (the caller's variable cannot be rebound).
    concept: python.parameters
  # ----- python.scope
  - id: scope
    term: Scope
    definition: The region of a program in which a name can be used directly. In Python, modules and function bodies create scopes; if, for and while blocks do not.
    concept: python.scope
  - id: local-variable
    term: Local variable
    aliases: [local name]
    definition: A name bound inside a function - a parameter or any name the function assigns to. It exists only during one call, in that call's frame.
    concept: python.scope
  - id: global-variable
    term: Global variable
    aliases: [module-level variable, global name]
    definition: A name bound at the top level of a module. Functions can read it; rebinding it from inside a function requires a global statement.
    concept: python.scope
  - id: legb-rule
    term: LEGB rule
    aliases: [LEGB, name resolution]
    definition: "The order in which Python searches for a name it reads: Local, then Enclosing functions, then Global (module), then Built-in. The first match wins; no match raises NameError."
    concept: python.scope
  - id: lexical-scoping
    term: Lexical scoping
    aliases: [static scoping]
    definition: Scope rules based on where code is written, not on who calls it. A Python function can see the functions it is nested inside, but never the local names of its caller.
    concept: python.scope
  - id: unbound-local-error
    term: UnboundLocalError
    definition: A NameError subclass raised when a function reads a local variable before assigning it. Usually caused by assigning to a name (for example count += 1) that the programmer expected to be global.
    concept: python.scope
  - id: global-statement
    term: global statement
    aliases: [global]
    definition: "`global name` inside a function makes reads and assignments of name refer to the module-level variable instead of creating a local one."
    concept: python.scope
  - id: shadowing
    term: Shadowing
    aliases: [name shadowing]
    definition: "When a name in an inner scope hides the same name in an outer scope - for example `sum = 0` hiding the built-in sum() function, which then raises TypeError: 'int' object is not callable."
    concept: python.scope
  # ----- python.higher-order-functions
  - id: higher-order-function
    term: Higher-order function
    definition: A function that takes another function as an argument or returns a function, such as sorted (with key=), map, filter, or your own apply_to_all.
    concept: python.higher-order-functions
  - id: first-class-function
    term: First-class function
    aliases: [functions as objects]
    definition: The property that functions are ordinary objects - they can be bound to names, stored in lists and dicts, passed as arguments and returned from other functions.
    concept: python.higher-order-functions
  - id: lambda
    term: Lambda expression
    aliases: [lambda, anonymous function]
    definition: "An expression that creates a small unnamed function: `lambda x: x * 2`. Its body is a single expression whose value is returned; statements are not allowed."
    concept: python.higher-order-functions
  - id: key-function
    term: Key function
    aliases: [sort key, "key="]
    definition: A one-argument function passed as key= to sorted, list.sort, min or max. It is called once per item, and items are compared by the values it returns.
    concept: python.higher-order-functions
  - id: callback
    term: Callback
    aliases: [callback function, handler]
    definition: A function passed to other code so that code can call it later - for each item, when a task finishes, or when an event such as a click or web request happens.
    concept: python.higher-order-functions
  # ----- python.exceptions
  - id: try-statement
    term: try statement
    aliases: [try/except, exception handler]
    definition: "The statement that handles exceptions: a try block, then except clauses for specific exception types, plus optional else (runs if no exception occurred) and finally (always runs)."
    concept: python.exceptions
  - id: bare-except
    term: Bare except
    aliases: ["except:"]
    definition: "An except clause with no exception type. It catches everything - including typos, KeyboardInterrupt and SystemExit - so it hides bugs. Catch specific exceptions instead."
    concept: python.exceptions
  - id: exception-propagation
    term: Exception propagation
    aliases: [stack unwinding]
    definition: How an unhandled exception leaves the function where it was raised and is re-raised at the call site in the caller, frame by frame up the call stack, until a matching except clause handles it or the program stops.
    concept: python.exceptions
  - id: eafp
    term: EAFP
    aliases: [Easier to Ask Forgiveness than Permission]
    definition: "The Python style of attempting an operation and handling the exception if it fails (try: int(text) except ValueError: ...), instead of checking every condition first."
    concept: python.exceptions
  - id: lbyl
    term: LBYL
    aliases: [Look Before You Leap]
    definition: "The style of checking preconditions before acting (if key in d: ...). Clear for simple checks, but the check can disagree with the operation or become out of date before the action happens."
    concept: python.exceptions
  # ----- python.debugging
  - id: debugger
    term: Debugger
    aliases: [pdb]
    definition: A tool that pauses a running program so you can inspect variables and the call stack, run one line at a time and step into function calls. Python's built-in debugger is pdb; editors such as VS Code provide graphical ones.
    concept: python.debugging
  - id: breakpoint
    term: Breakpoint
    aliases: ["breakpoint()"]
    definition: A place where a debugger pauses execution. In Python, calling the built-in breakpoint() starts pdb at that line; debuggers also let you set breakpoints by line number.
    concept: python.debugging
  - id: rubber-duck-debugging
    term: Rubber-duck debugging
    aliases: [rubber ducking]
    definition: Explaining your code line by line, out loud, to someone or something that knows nothing about it (traditionally a rubber duck). Stating every assumption often exposes the wrong one.
    concept: python.debugging
  - id: minimal-reproducible-example
    term: Minimal reproducible example
    aliases: [MRE, minimal working example, reprex]
    definition: The smallest complete program that still shows a bug, with fixed inputs and the expected versus actual result. Making one often reveals the cause, and it is what others need in order to help.
    concept: python.debugging
