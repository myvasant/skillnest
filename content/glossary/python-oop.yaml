terms:
  # ---------------------------------------------------------------- classes
  - id: class
    term: Class
    aliases: [class statement, user-defined type]
    definition: "A blueprint that defines a new type: the attributes its objects hold and the methods that work on them. Calling a class creates an instance of it."
    concept: python.classes
  - id: instance
    term: Instance
    aliases: [object of a class]
    definition: "One object created from a class, e.g. `acct = BankAccount(\"Ada\")`. Each instance has its own attributes but shares the class's methods."
    concept: python.classes
  - id: attribute
    term: Attribute
    aliases: [field, member]
    definition: "A name attached to an object and reached with a dot, such as `acct.balance` or `text.upper`. Attributes can refer to data or to methods."
    concept: python.classes
  - id: method
    term: Method
    definition: "A function defined inside a class. Called on an instance, it receives that instance as its first argument: `obj.method(x)` runs `Class.method(obj, x)`."
    concept: python.classes
  - id: bound-method
    term: Bound method
    definition: "The object you get when you look up a method on an instance (`acct.deposit`). It remembers the instance and inserts it as the first argument when called."
    concept: python.classes
  - id: init-method
    term: "__init__"
    aliases: [initialiser, initializer, dunder init, constructor]
    definition: "The method Python calls right after creating a new instance, to give it its starting attributes. It receives the already-created object as self and must return None."
    concept: python.classes
  - id: self
    term: self
    definition: "The conventional name of a method's first parameter, which receives the instance the method was called on. It is not a keyword; any name would work, but always use self."
    concept: python.classes
  - id: instance-attribute
    term: Instance attribute
    definition: "An attribute stored on one particular object, usually created in __init__ with `self.name = value`. Other instances are unaffected by it."
    concept: python.classes
  - id: class-attribute
    term: Class attribute
    definition: "An attribute assigned in the class body. It lives on the class and is shared by every instance that does not shadow it with an instance attribute of the same name."
    concept: python.classes
  - id: invariant
    term: Invariant
    aliases: [class invariant]
    definition: "A rule that must be true for every valid object of a class at all times, such as \"balance is never negative\". Classes protect invariants by validating in __init__ and in every method that changes state."
    concept: python.classes
  - id: repr-method
    term: "__repr__"
    aliases: [repr, "__str__", string representation]
    definition: "Special method returning an unambiguous developer-facing string for an object, used by repr(), the REPL and containers. __str__ returns the user-facing form used by print() and falls back to __repr__."
    concept: python.classes
  # ------------------------------------------------------------ inheritance
  - id: inheritance
    term: Inheritance
    definition: "Defining a class as a specialised version of another (`class Savings(Account):`). The subclass gets the base class's attributes and methods and can add or override them. Models an is-a relationship."
    concept: python.inheritance
  - id: subclass
    term: Subclass
    aliases: [child class, derived class]
    definition: "A class that inherits from another class. An instance of a subclass is also an instance of its base classes, so isinstance(child_obj, Base) is True."
    concept: python.inheritance
  - id: base-class
    term: Base class
    aliases: [parent class, superclass]
    definition: "A class that another class inherits from. Every Python class ultimately inherits from object."
    concept: python.inheritance
  - id: method-overriding
    term: Method overriding
    aliases: [override]
    definition: "Defining a method in a subclass with the same name as one in a base class. Lookups find the subclass's version first, so it replaces (or, with super(), extends) the inherited behaviour."
    concept: python.inheritance
  - id: super-function
    term: super()
    definition: "A built-in that returns a proxy for calling the next class's version of a method in the method resolution order — usually the parent's, e.g. super().__init__(owner)."
    concept: python.inheritance
  - id: mro
    term: Method resolution order
    aliases: [MRO, C3 linearization]
    definition: "The ordered list of classes Python searches when looking up an attribute on a class or its instances, available as Class.__mro__. Python computes it with the C3 algorithm: children before parents, base order preserved."
    concept: python.inheritance
  - id: composition
    term: Composition
    aliases: [has-a relationship, object composition]
    definition: "Building an object from other objects it holds as attributes (a Car has an Engine) and delegating work to them. Often more flexible than inheritance because the parts can be swapped."
    concept: python.inheritance
  - id: fragile-base-class
    term: Fragile base class problem
    definition: "When a seemingly safe change inside a base class breaks subclasses, because they depend on the base class's internal details (for example, which of its methods call which)."
    concept: python.inheritance
  - id: liskov-substitution
    term: Liskov substitution principle
    aliases: [LSP]
    definition: "Design rule for inheritance: code that works with a base class must keep working when given any subclass instance. A subclass may extend behaviour but must not break the base class's promises."
    concept: python.inheritance
  # ------------------------------------------------------------- type hints
  - id: type-hint
    term: Type hint
    aliases: [type annotation, annotation]
    definition: "An annotation stating the expected type of a parameter, return value or variable, e.g. `def total(prices: list[float]) -> float:`. Python stores hints but does not enforce them at runtime."
    concept: python.type-hints
  - id: type-checker
    term: Static type checker
    aliases: [mypy, pyright, type checking]
    definition: "A tool that reads your code and its type hints without running it and reports calls, returns and assignments that do not match, such as passing a str where an int is expected."
    concept: python.type-hints
  - id: generic-type
    term: Generic type
    aliases: [parameterized generic, "list[int]"]
    definition: "A type with parameters describing its contents, such as list[int], dict[str, float] or tuple[int, int]. The parameters are for readers and tools; at runtime the object is an ordinary list or dict."
    concept: python.type-hints
  - id: union-type
    term: Union type
    aliases: ["X | Y", "X | None", Optional]
    definition: "A hint meaning \"any one of these types\", written `int | str`. `str | None` (also spelled Optional[str]) means the value may be None, so code must check before using it."
    concept: python.type-hints
  - id: type-narrowing
    term: Type narrowing
    definition: "A type checker's ability to use a check such as `if value is None: return` or isinstance() to treat a union-typed value as a more specific type afterwards."
    concept: python.type-hints
  - id: any-type
    term: Any
    aliases: [typing.Any]
    definition: "A special type hint that is compatible with every type in both directions, which switches off checking for that value. Useful at boundaries; overuse hides bugs."
    concept: python.type-hints
  - id: typeddict
    term: TypedDict
    definition: "A typing construct that describes the keys and value types of a dictionary, e.g. a JSON record. At runtime the value is still a plain dict."
    concept: python.type-hints
  - id: gradual-typing
    term: Gradual typing
    definition: "The approach Python uses: hints are optional, annotated and unannotated code mix freely, and you can add types to a codebase one function at a time."
    concept: python.type-hints
  # ------------------------------------------------------ dataclasses, enums
  - id: dataclass
    term: Dataclass
    aliases: ["@dataclass"]
    definition: "A class decorated with @dataclass, which reads the annotated class attributes (fields) and generates __init__, __repr__ and __eq__ (and optionally ordering, hashing and immutability) for you."
    concept: python.dataclasses
  - id: default-factory
    term: default_factory
    aliases: ["field(default_factory=list)"]
    definition: "An argument to dataclasses.field() naming a zero-argument callable (such as list) that is called to create a fresh default value for every new instance, avoiding a shared mutable default."
    concept: python.dataclasses
  - id: frozen-dataclass
    term: Frozen dataclass
    aliases: ["frozen=True", FrozenInstanceError]
    definition: "A dataclass declared with frozen=True whose fields cannot be reassigned after creation (assignment raises FrozenInstanceError). Frozen dataclasses with eq are hashable. The freeze is shallow."
    concept: python.dataclasses
  - id: post-init
    term: "__post_init__"
    definition: "A method a dataclass's generated __init__ calls after assigning the fields. Use it to validate invariants or compute derived fields."
    concept: python.dataclasses
  - id: enum
    term: Enum
    aliases: [enumeration, enum member, enum.Enum]
    definition: "A class whose members are a fixed set of named constants, e.g. Status.PAID. Each member has a .name and a .value, members are singletons, and an invalid lookup raises an error instead of silently passing."
    concept: python.dataclasses
  # -------------------------------------------------------- context managers
  - id: context-manager
    term: Context manager
    aliases: [context manager protocol, "__enter__", "__exit__"]
    definition: "An object with __enter__ and __exit__ methods that a with statement uses to run setup before a block and guaranteed cleanup after it, even if the block raises an exception."
    concept: python.context-managers
  - id: with-statement
    term: with statement
    definition: "`with manager as name:` calls the manager's __enter__, binds its return value to name, runs the block, then always calls __exit__ — on normal exit, return, break or exception."
    concept: python.context-managers
  - id: contextmanager-decorator
    term: "@contextmanager"
    aliases: [contextlib.contextmanager]
    definition: "A decorator from contextlib that turns a generator function into a context manager: code before the single yield is setup, the yielded value is bound by as, and code after it (in a finally block) is cleanup."
    concept: python.context-managers
  # --------------------------------------------------------- abstraction
  - id: abstraction
    term: Abstraction
    definition: >-
      Exposing the essential behaviour a caller needs while hiding implementation details that the caller
      should not depend on. Functions, modules and classes can all provide useful abstractions.
    concept: cs.abstraction
  - id: encapsulation
    term: Encapsulation
    definition: >-
      Keeping related state and behaviour together and controlling how state changes so an object's invariants
      remain valid. Python uses conventions and APIs rather than strict private instance fields.
    concept: cs.abstraction
  - id: interface-contract
    term: Interface contract
    definition: >-
      The documented operations, inputs, outputs and failure behaviour that callers may rely on without
      depending on the internal implementation.
    concept: cs.abstraction
  - id: abstract-base-class
    term: Abstract base class
    aliases: [ABC]
    definition: >-
      A class that defines a common base type and may declare abstract methods that concrete subclasses must
      implement before they can be instantiated.
    concept: cs.abstraction
  - id: structural-protocol
    term: Structural Protocol
    aliases: [typing.Protocol]
    definition: >-
      A typing interface that describes the methods or attributes an object must provide. A class can satisfy
      a Protocol by having the required structure without inheriting from it; static type checkers use this
      relationship to detect incompatible implementations.
    concept: cs.abstraction
  - id: high-cohesion
    term: High cohesion
    definition: >-
      A design quality in which the responsibilities inside a module or class belong together and support one
      clear purpose.
    concept: cs.abstraction
  - id: low-coupling
    term: Low coupling
    definition: >-
      A design quality in which a module depends on few details of other modules, so changes in one component
      are less likely to force changes in another.
    concept: cs.abstraction
  - id: name-mangling
    term: Name mangling
    definition: >-
      Python's transformation of a class attribute beginning with two underscores into a name that includes
      the class name, reducing accidental clashes with subclass attributes. It is not a security or privacy
      mechanism.
    concept: cs.abstraction
