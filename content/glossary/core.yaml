terms:
- id: variable
  term: Variable
  aliases:
  - name
  - binding
  definition: A name that refers to an object. In Python, assignment binds a name to an object; it does not copy
    the object into a box.
  concept: python.variables
- id: assignment
  term: Assignment statement
  aliases:
  - binding
  - = operator
  definition: A statement of the form `name = expression`. Python evaluates the expression first, then binds the
    name to the resulting object.
  concept: python.variables
- id: augmented-assignment
  term: Augmented assignment
  aliases:
  - +=
  - -=
  definition: Shorthand that updates a name based on its current value, such as `count += 1` for `count = count
    + 1`. On mutable objects it may modify the object in place.
  concept: python.variables
- id: aliasing
  term: Aliasing
  definition: Two or more names referring to the same object. Harmless for immutable objects; important for mutable
    ones, because a change through one name is visible through the other.
  concept: python.mutability
- id: object
  term: Object
  definition: A piece of data in memory with an identity (where it is), a type (what it is) and a value. Everything
    in Python — numbers, strings, functions, classes — is an object.
  concept: python.variables
- id: type
  term: Type
  aliases:
  - class
  - data type
  definition: The kind of an object, which determines what values it can have and what operations it supports.
    `type(x)` returns it, e.g. int, float, str.
  concept: python.type-conversion
- id: dynamic-typing
  term: Dynamic typing
  definition: Types belong to objects, not to names, and are checked while the program runs. A name can be rebound
    to an object of any type.
  concept: python.variables
- id: immutable
  term: Immutable
  aliases:
  - immutability
  definition: An object whose value cannot change after it is created, such as int, float, str and tuple. Operations
    that seem to change it actually create a new object.
  concept: python.mutability
- id: mutable
  term: Mutable
  aliases:
  - mutability
  definition: An object whose value can change in place, such as list, dict and set. Every name referring to it
    sees the change.
  concept: python.mutability
- id: expression
  term: Expression
  definition: Code that Python evaluates to produce a value, such as `3 * 4`, `price`, or `len(name)`.
  concept: python.variables
- id: statement
  term: Statement
  definition: A complete instruction Python executes, such as an assignment, a print() call on its own line, an
    if statement or a loop.
  concept: python.first-program
- id: keyword
  term: Keyword
  aliases:
  - reserved word
  definition: A word reserved by the language with special meaning, such as if, for, def, class, True and None.
    Keywords cannot be used as names.
  concept: python.variables
- id: identifier
  term: Identifier
  definition: The technical term for a name in source code. Identifiers may contain letters, digits and underscores,
    and cannot start with a digit.
  concept: python.variables
- id: namespace
  term: Namespace
  definition: A mapping from names to objects. Each module, function call and class has its own namespace; name
    lookups search them in a defined order (LEGB).
  concept: python.scope
- id: interpreter
  term: Interpreter
  definition: A program that runs source code. CPython, the standard Python interpreter, compiles code to bytecode
    and then executes that bytecode.
  concept: foundations.programs-and-languages
- id: compiler
  term: Compiler
  definition: A program that translates source code into another form (machine code or bytecode) before it runs.
  concept: foundations.programs-and-languages
- id: string
  term: String
  aliases:
  - str
  definition: 'An immutable sequence of Unicode characters, written in quotes: "hello" or ''hello''.'
  concept: python.strings
- id: comment
  term: Comment
  definition: 'Text after # on a line. Python ignores it; comments explain intent to human readers.'
  concept: python.first-program
- id: syntax-error
  term: SyntaxError
  definition: An error raised when Python cannot parse the program text, for example due to a missing quote or
    parenthesis. Nothing in the file runs.
  concept: python.first-program
- id: exception
  term: Exception
  aliases:
  - runtime error
  definition: An object representing an error that happened while the program was running. Unhandled exceptions
    stop the program and print a traceback.
  concept: python.exceptions
- id: traceback
  term: Traceback
  definition: The report Python prints for an unhandled exception, listing the chain of calls that led to it.
    Read it from the bottom up.
  concept: python.exceptions
- id: name-error
  term: NameError
  definition: Raised when code uses a name that has not been assigned in any namespace Python searched — often
    a typo, wrong capitalisation, or use before assignment.
  concept: python.variables
- id: operator-precedence
  term: Operator precedence
  definition: The rules that decide which operators are applied first in an expression, e.g. * before +. Parentheses
    override precedence.
  concept: python.numbers
- id: floor-division
  term: Floor division
  aliases:
  - //
  definition: Division that rounds the result down toward negative infinity. 7 // 2 is 3 and -7 // 2 is -4.
  concept: python.numbers
- id: modulo
  term: Modulo
  aliases:
  - '%'
  - remainder
  definition: The remainder after floor division. It always satisfies a == (a // b) * b + a % b.
  concept: python.numbers
- id: floating-point
  term: Floating-point number
  aliases:
  - float
  definition: A number stored in binary scientific notation with limited precision (64 bits in Python). Many decimal
    fractions, such as 0.1, can only be approximated.
  concept: python.numbers
- id: function
  term: Function
  definition: A named, reusable block of code that takes arguments, runs when called, and returns a value (None
    if no return statement runs).
  concept: python.functions
- id: argument
  term: Argument
  definition: A value passed to a function when it is called. A parameter is the name that receives it inside
    the function.
  concept: python.functions
- id: return-value
  term: Return value
  definition: The object a function sends back to its caller with a return statement. Unlike printing, it can
    be stored and used in further computation.
  concept: python.functions
- id: repl
  term: REPL
  aliases:
  - interactive shell
  definition: 'Read–Eval–Print Loop: an interactive prompt that runs each line you type immediately and shows
    the result.'
  concept: python.setup
- id: operating-system
  term: Operating system
  aliases:
  - OS
  definition: Core system software that manages hardware resources, runs processes, provides common services and
    enforces protection between applications.
  concept: foundations.operating-systems
- id: kernel
  term: Kernel
  definition: The privileged core of an operating system that manages resources such as CPU scheduling, memory,
    devices and system-call services.
  concept: foundations.operating-systems
- id: process-id
  term: Process ID
  aliases:
  - PID
  definition: A number the operating system uses to identify a process within its current system context; identifiers
    can be reused after a process exits.
  concept: foundations.operating-systems
- id: scheduler
  term: Scheduler
  definition: The operating-system component that selects which ready process or thread receives CPU time next.
  concept: foundations.operating-systems
- id: system-call
  term: System call
  definition: A controlled interface through which an application requests a service from the operating-system
    kernel, such as opening a file.
  concept: foundations.operating-systems
- id: file-system
  term: File system
  definition: The data structures and rules an operating system uses to organise, name, store and retrieve files
    and directories.
  concept: foundations.files-and-paths
- id: working-directory
  term: Current working directory
  aliases:
  - CWD
  definition: The directory a process uses as the starting point when resolving relative file paths.
  concept: foundations.files-and-paths
- id: absolute-path
  term: Absolute path
  definition: A path that identifies a location from a file-system root rather than from the process's current
    working directory.
  concept: foundations.files-and-paths
- id: relative-path
  term: Relative path
  definition: A path resolved from a starting directory, usually the process's current working directory, rather
    than from the file-system root.
  concept: foundations.files-and-paths
- id: process
  term: Process
  definition: A running instance of a program, with its own memory, managed by the operating system.
  concept: foundations.operating-systems
- id: path
  term: Path
  definition: The address of a file or folder in a file system. Absolute paths start at the root; relative paths
    start at the current working directory.
  concept: foundations.files-and-paths
- id: environment-variable
  term: Environment variable
  definition: A named setting (such as PATH) that a process inherits from the process that started it.
  concept: foundations.environment-variables
- id: shell
  term: Shell
  aliases:
  - terminal
  - command line
  definition: A program that reads commands you type, runs other programs and shows their output. PowerShell,
    bash and zsh are shells.
  concept: foundations.terminal-basics
- id: utf-8
  term: UTF-8
  aliases:
  - Unicode encoding
  definition: The dominant text encoding on the web; it stores each Unicode code point as one to four bytes and
    is compatible with ASCII.
  concept: foundations.text-encoding
- id: algorithm
  term: Algorithm
  definition: A finite, precise sequence of steps that solves a problem.
  concept: foundations.algorithmic-thinking
- id: software-development-lifecycle
  term: Software development lifecycle
  aliases:
  - SDLC
  definition: The connected activities used to discover, design, build, verify, release, operate and improve software.
  concept: cs.sdlc
- id: iterative-development
  term: Iterative development
  definition: A way of building software in repeated small cycles, using feedback from each increment to refine
    the next one.
  concept: cs.sdlc
- id: functional-requirement
  term: Functional requirement
  definition: A statement of behaviour or capability a system must provide, such as creating an expense or exporting
    a report.
  concept: cs.requirements-docs
- id: nonfunctional-requirement
  term: Non-functional requirement
  aliases:
  - quality requirement
  definition: A quality target or constraint on a system, such as latency, availability, security, accessibility
    or cost.
  concept: cs.requirements-docs
- id: user-story
  term: User story
  definition: A short description of a capability from a user perspective, commonly written as who needs what
    and why.
  concept: cs.requirements-docs
- id: acceptance-criteria
  term: Acceptance criteria
  definition: Observable conditions that must be satisfied for a requirement or work item to be accepted.
  concept: cs.requirements-docs
- id: architecture-decision-record
  term: Architecture Decision Record
  aliases:
  - ADR
  definition: A short record of one significant architecture decision, including its context, decision, alternatives
    and consequences.
  concept: cs.requirements-docs
- id: design-pattern
  term: Design pattern
  definition: A named, reusable approach to a recurring design problem, including its context, intent and trade-offs.
  concept: cs.design-patterns
- id: strategy-pattern
  term: Strategy pattern
  definition: A design pattern that makes an algorithm or policy interchangeable while keeping the surrounding
    workflow stable.
  concept: cs.design-patterns
- id: dependency-injection
  term: Dependency injection
  definition: A design technique in which a component receives the collaborators it needs instead of constructing
    them internally.
  concept: cs.design-patterns
- id: adapter-pattern
  term: Adapter pattern
  definition: A design pattern that translates one interface into another so components with different interfaces
    can work together.
  concept: cs.design-patterns
- id: factory-pattern
  term: Factory pattern
  definition: A design approach that centralises object or function creation when selection or configuration has
    meaningful rules.
  concept: cs.design-patterns
- id: architectural-tradeoff
  term: Architectural trade-off
  definition: A choice that improves one system quality or constraint while adding a cost or reducing another.
  concept: cs.architecture-tradeoffs
- id: version-control
  term: Version control
  definition: A system that records changes to project files over time so people can compare, explain and recover
    committed states.
  concept: tooling.version-control
- id: git-remote
  term: Git remote
  definition: A named reference to another Git repository location used to exchange commits.
  concept: tooling.git-remotes
- id: merge-conflict
  term: Merge conflict
  definition: A condition where Git cannot safely combine overlapping changes without a human deciding the intended
    result.
  concept: tooling.git-merge-conflicts
- id: pull-request
  term: Pull request
  definition: A hosted proposal to merge changes from one branch into another, with a diff, discussion, review
    and checks.
  concept: tooling.pull-requests
- id: fork
  term: Fork
  definition: A separate hosted copy of a repository, commonly used to contribute when a person cannot push to
    the original project.
  concept: tooling.github-collaboration
- id: remote-tracking-branch
  term: Remote-tracking branch
  definition: A local reference that records the state of a branch on a remote as of the most recent fetch.
  concept: tooling.git-remotes
- id: upstream-branch
  term: Upstream branch
  definition: The remote branch a local branch is configured to compare with and normally pull from or push to.
  concept: tooling.git-remotes
