  - id: agents.crewai
    title: CrewAI
    module: frameworks
    level: intermediate
    priority: optional
    summary: A framework organising agents into role-based crews with tasks and processes, plus event-driven flows.
    requires: [agents.multi-agent]
    tools: [CrewAI]
    why: >-
      CrewAI offers a high-level, role-based way to compose agents and deterministic flows, which can be quick
      for prototyping multi-step, multi-role tasks if you accept its abstractions.
    keyIdeas:
      - Agents are defined by `role`, `goal` and `backstory` (plus an LLM and tools); Tasks have a description and an expected output and are assigned to agents.
      - "A Crew runs its tasks with a Process: sequential (in order) or hierarchical (a manager agent delegates and validates)."
      - Flows add event-driven, stateful control with decorators such as `@start`, `@listen` and `@router`, and can call crews as steps; the docs recommend a Flow as the backbone of larger apps.
      - It is a standalone, MIT-licensed Python framework with its own primitives; the company also sells a hosted enterprise platform (check the current offering).
      - Projects scaffolded by the `crewai` CLI typically keep agent and task definitions in YAML files.
    misconceptions:
      - Role-play descriptions do not guarantee competence; results still depend on tools, task definitions and evaluation.
    sources:
      - title: CrewAI introduction
        url: https://docs.crewai.com/en/introduction
        publisher: CrewAI
      - title: Agents
        url: https://docs.crewai.com/en/concepts/agents
        publisher: CrewAI
      - title: crewAIInc/crewAI
        url: https://github.com/crewAIInc/crewAI
        publisher: GitHub
  - id: agents.autogen
    title: AutoGen
    module: frameworks
    level: intermediate
    priority: optional
    summary: Microsoft's framework for multi-agent conversations and event-driven agent applications — no longer maintained, with Microsoft Agent Framework as its official successor.
    requires: [agents.multi-agent]
    tools: [AutoGen, Microsoft Agent Framework]
    why: >-
      AutoGen popularised conversational multi-agent patterns and much existing code and many tutorials use
      it. Knowing its status and successor helps you read that code and choose the maintained path for new
      work.
    keyIdeas:
      - AutoGen 0.4 and later is layered — `autogen-core` (an event-driven actor runtime), `autogen-agentchat` (high-level agents and teams such as round-robin and selector group chats) and `autogen-ext` (model clients and tools).
      - The older 0.2 API (`ConversableAgent`, `UserProxyAgent`) differs substantially from 0.4+, and tutorials often mix the two.
      - Microsoft's repository now says AutoGen is no longer maintained and points new projects to Microsoft Agent Framework, which combines AutoGen's agent abstractions with Semantic Kernel's enterprise features and adds graph-based workflows; a migration guide exists.
      - AG2 is a separate, community-led fork of the older AutoGen line, not Microsoft's project.
      - The core ideas transfer to any framework — agents as message-passing participants, team or group-chat orchestration, and explicit termination conditions.
    misconceptions:
      - "\"AutoGen\" does not name one stable API; check whether code targets 0.2, 0.4+, AG2 or Microsoft Agent Framework."
    sources:
      - title: microsoft/autogen (status notice)
        url: https://github.com/microsoft/autogen
        publisher: Microsoft (GitHub)
      - title: Microsoft Agent Framework overview
        url: https://learn.microsoft.com/en-us/agent-framework/overview/
        publisher: Microsoft
      - title: Migration guide from AutoGen
        url: https://learn.microsoft.com/en-us/agent-framework/migration-guide/from-autogen/
        publisher: Microsoft
  - id: agents.other-frameworks
    title: Other agent frameworks and SDKs
    module: frameworks
    level: intermediate
    priority: optional
    summary: Provider agent SDKs, Pydantic AI, smolagents and others — compare them on control, typing, observability and lock-in.
    requires: [agents.what-is-an-agent, frameworks.tradeoffs]
    tools: [OpenAI Agents SDK, Claude Agent SDK, Pydantic AI, smolagents]
    why: >-
      Provider SDKs and lightweight libraries often give you a simpler, better-supported agent loop than a
      general framework. Comparing them on concrete criteria avoids choosing by hype.
    keyIdeas:
      - Provider agent SDKs — such as the OpenAI Agents SDK (agents, handoffs, guardrails, tracing), the Claude Agent SDK (built on the agent harness behind Claude Code) and Google's Agent Development Kit — are tuned for their own models, with varying support for others.
      - Pydantic AI emphasises typed dependencies and validated outputs; smolagents (Hugging Face) is minimal and supports code agents that act by writing Python instead of JSON tool calls.
      - Microsoft Agent Framework (the successor to AutoGen and Semantic Kernel) targets .NET and Python (Go in preview at the time of writing) with agents plus graph-based workflows.
      - "Compare on: control over the loop and prompts, typing and validation, MCP support, tracing and OpenTelemetry, deployment model, licence and lock-in."
      - Evaluate with one real task end to end; this market changes monthly, so re-check maturity and maintenance before committing.
    misconceptions:
      - Code-executing agents need a sandbox; letting a model write and run Python is remote code execution by design.
    sources:
      - title: OpenAI Agents SDK
        url: https://openai.github.io/openai-agents-python/
        publisher: OpenAI
      - title: Agent SDK overview
        url: https://code.claude.com/docs/en/agent-sdk/overview
        publisher: Anthropic
      - title: smolagents documentation
        url: https://huggingface.co/docs/smolagents/index
        publisher: Hugging Face
  # ------------------------------------------------------------- reliability
  - id: agents.evaluation
    title: Evaluating agents
    module: reliability
    level: advanced
    priority: essential
    summary: Score final task success, inspect trajectories (tool choice, arguments, steps), and track cost, latency and safety across a fixed task suite.
    requires: [agents.agent-loop, genai.evaluation]
    why: >-
      Agents take different paths on every run, and a correct-looking final answer can hide wasteful or unsafe
      steps. You need task-level and trajectory-level evaluation, repeated over many runs, to know whether a
      change made the agent better.
    keyIdeas:
      - Build a fixed suite of realistic tasks with automatic success checks where possible (tests pass, database ends in the expected state, correct answer), plus rubric or LLM-judge grading for open-ended outputs.
      - Inspect trajectories — the right tools chosen, valid arguments, number of steps, unnecessary or unsafe actions, recovery from errors.
      - Agents are non-deterministic, so run each task several times and report pass rates; consistency metrics such as pass^k (all k trials succeed) expose flakiness that a single run hides.
      - Track cost (tokens, tool calls), latency and safety violations next to success; a slightly better agent that costs five times more may not be an improvement.
      - Run evaluations in sandboxed environments so they are reproducible and cannot cause real side effects.
    misconceptions:
      - Judging only the final answer misses agents that succeed by luck or through unsafe actions.
      - Public benchmark scores (such as SWE-bench) do not predict performance on your tasks and tools.
    interview: Expect to design an evaluation plan for an agent, including success criteria, trajectory checks and how to handle non-determinism.
    production: Re-run the suite on every model, prompt or tool change, and add production failures as new tasks.
    sources:
      - title: "Demystifying evals for AI agents"
        url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
        publisher: Anthropic
      - title: "tau-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains"
        url: https://arxiv.org/abs/2406.12045
        publisher: arXiv
      - title: "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?"
        url: https://arxiv.org/abs/2310.06770
        publisher: arXiv
  - id: agents.security
    title: Agent security
    module: reliability
    level: advanced
    priority: essential
    summary: Indirect prompt injection, data exfiltration through tools, excessive agency and confused-deputy attacks — and layered mitigations.
    requires: [agents.permissions-sandboxing, genai.prompt-injection, agents.mcp]
    why: >-
      Agents read untrusted content and hold real permissions — a combination attackers exploit to make them
      leak data or take harmful actions. Securing them takes layered controls, because no prompt or filter
      reliably stops prompt injection.
    keyIdeas:
      - Indirect prompt injection hides instructions in web pages, emails, documents or tool results, which the agent reads and follows as if they came from the user.
      - Exfiltration happens through tool calls, URLs, image links or messages; the dangerous combination is access to private data, exposure to untrusted content and an outbound channel.
      - Excessive agency (too many tools, permissions or autonomy) turns a mistake into an incident; a confused deputy is an agent using its privileges on an attacker's behalf.
      - OWASP's agentic Top 10 adds agent-specific risks such as goal hijacking, tool misuse, identity and privilege abuse, memory and context poisoning, insecure inter-agent communication and cascading failures.
      - Layer the defences — least privilege, separating trusted instructions from untrusted data, approval for sensitive actions, egress allow-lists, output filtering, sandboxing and monitoring — and red-team the system.
    misconceptions:
      - There is no reliable prompt-level fix for prompt injection; design so that a successful injection has limited impact.
      - MCP servers and plug-in tools are part of your supply chain; their descriptions and outputs can carry attacks.
    interview: Interviewers ask how indirect prompt injection works against an agent and which architectural controls limit the damage.
    production: Threat-model every new tool or data source, log tool calls for forensics, and keep a kill switch that disables an agent or tool quickly.
    sources:
      - title: OWASP Top 10 for LLM Applications
        url: https://genai.owasp.org/llm-top-10/
        publisher: OWASP GenAI Security Project
      - title: OWASP Top 10 for Agentic Applications for 2026
        url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
        publisher: OWASP GenAI Security Project
      - title: "Not what you've signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection"
        url: https://arxiv.org/abs/2302.12173
        publisher: arXiv
  - id: agents.observability
    title: Agent observability
    module: reliability
    level: advanced
    priority: supporting
    summary: Trace every step, tool call and token of an agent run to debug failures, attribute cost and spot regressions.
    requires: [agents.agent-loop, mlops.observability]
    why: >-
      When an agent fails, the cause is usually one specific step — a wrong tool argument, a misleading tool
      result, an overflowing context. Step-level traces are the practical way to find it and to attribute cost.
    keyIdeas:
      - Trace each run as a tree — the run, every model call (prompt, output, model, tokens, latency) and every tool call (name, arguments, result, errors) — linked by IDs.
      - Prefer standards; OpenTelemetry's generative-AI semantic conventions cover model calls, agent and tool operations and MCP (still evolving, now in their own repository), and recent MCP revisions define how trace context is propagated.
      - Aggregate metrics such as success rate, steps per run, tool error rate, cost per task, latency percentiles and how often budgets or loop detectors fire.
      - Link traces to user feedback and evaluation scores so failing runs can be found and replayed.
      - Langfuse (open source), LangSmith and other OpenTelemetry-compatible backends provide agent-friendly trace views.
    misconceptions:
      - Logging only the final answer hides the cause of failures; you need the intermediate steps.
    tools: [Langfuse, LangSmith, OpenTelemetry]
    interview: Interviewers ask what you would record for each agent step and how you would find the cause of a regression.
    production: Traces include prompts, tool results and user data; redact secrets and personal data, restrict access and set retention limits.
    sources:
      - title: OpenTelemetry semantic conventions for generative AI
        url: https://github.com/open-telemetry/semantic-conventions-genai
        publisher: OpenTelemetry (GitHub)
      - title: Langfuse documentation
        url: https://langfuse.com/docs
        publisher: Langfuse
  - id: agents.context-engineering
    title: Context engineering for long-running agents
    module: design
    level: advanced
    priority: supporting
    summary: Decide what goes into the model's limited context at each step — instructions, tool results, notes, summaries — so long tasks stay coherent and affordable.
    why: Agents accumulate tool output quickly; without deliberate context management they exceed the window, lose track of the goal and cost more every step.
    requires: [agents.state-memory, genai.tokens-context]
    keyIdeas:
      - Treat the context window as a budget; keep stable instructions first and trim or summarise bulky tool output.
      - Compaction replaces older turns with a summary; structured notes or a scratch file let an agent persist important facts outside the window.
      - Sub-agents with their own clean context can explore a sub-task and return only a condensed result.
      - Retrieval (just-in-time loading of files or documents) often beats preloading everything.
    misconceptions:
      - A bigger context window does not remove the need for curation; irrelevant context still distracts models and costs tokens.
    interview: An agent's quality degrades after many tool calls — what would you change about how its context is managed?
    production: Track tokens per step and per task, and alert when tasks approach the context limit.
    sources:
      - title: Effective context engineering for AI agents
        url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
        publisher: Anthropic
