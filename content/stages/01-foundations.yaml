id: foundations
order: 1
title: Computer and Development Foundations
shortTitle: Foundations
summary: >-
  How computers, operating systems, files, terminals and programs actually work, so that
  later tools never feel like magic.
why: >-
  Most beginner frustration is not about code: it is about paths, installs, terminals, error
  messages and not knowing what the computer is doing. This stage removes that friction.
modules:
  - id: computers
    title: How computers work
    summary: Hardware, data representation and the operating system.
  - id: environment
    title: Your working environment
    summary: Files, the terminal, environment variables, editors and installing tools.
  - id: programs
    title: Programs and problem solving
    summary: What programs are, how they run, and how to think and learn like a programmer.
concepts:
  - id: foundations.how-computers-work
    title: How computers work
    module: computers
    level: beginner
    priority: essential
    summary: The CPU executes instructions, RAM holds running programs and their data, storage keeps files when power is off.
    why: Explains why programs are fast or slow, why unsaved work is lost, and what "memory" errors mean.
    keyIdeas:
      - The CPU repeatedly fetches, decodes and executes very simple instructions, billions per second.
      - RAM is fast but volatile working memory; storage (SSD/HDD) is slower but persistent.
      - Input/output devices and the network are much slower than RAM, which shapes how software is designed.
    misconceptions:
      - More storage does not make a computer run programs faster; RAM and CPU matter more for that.
      - Closing a program frees its RAM, but does not delete its files.
    sources:
      - title: "CS50x: Computer Science (lecture notes)"
        url: https://cs50.harvard.edu/x/
        publisher: Harvard University
  - id: foundations.binary-and-data
    title: Bits, bytes and data representation
    module: computers
    level: beginner
    priority: essential
    summary: Everything a computer stores — numbers, text, images — is encoded as bits; the same bits mean different things under different encodings.
    requires: [foundations.how-computers-work]
    keyIdeas:
      - A bit is 0 or 1; a byte is 8 bits and can represent 256 distinct values.
      - Integers use binary place value; floating-point numbers approximate real numbers.
      - Kilobyte/megabyte/gigabyte sizes explain file sizes and memory limits.
    misconceptions:
      - Decimal fractions like 0.1 cannot be represented exactly in binary floating point.
    sources:
      - title: "Floating Point Arithmetic: Issues and Limitations"
        url: https://docs.python.org/3/tutorial/floatingpoint.html
        publisher: Python Software Foundation
  - id: foundations.text-encoding
    title: Text encoding, Unicode and UTF-8
    module: computers
    level: beginner
    priority: supporting
    summary: Text is stored as numbers called code points; UTF-8 is the standard way to turn those numbers into bytes.
    requires: [foundations.binary-and-data]
    keyIdeas:
      - Unicode assigns a number (code point) to every character, including emoji and non-Latin scripts.
      - UTF-8 encodes code points into 1–4 bytes and is backward compatible with ASCII.
      - Reading a file with the wrong encoding produces garbled text or decode errors.
    misconceptions:
      - One character is not always one byte.
    sources:
      - title: Unicode HOWTO
        url: https://docs.python.org/3/howto/unicode.html
        publisher: Python Software Foundation
  - id: foundations.operating-systems
    title: Operating systems and processes
    module: computers
    level: beginner
    priority: essential
    summary: The operating system shares the CPU, memory, files and devices between running programs, each of which runs as a process.
    requires: [foundations.how-computers-work]
    keyIdeas:
      - A program is a file on disk; a process is a running instance of it with its own memory.
      - The OS schedules processes, isolates their memory and mediates access to files and hardware.
      - Windows, macOS and Linux differ in paths, shells and permissions, but share these core ideas.
    misconceptions:
      - Two windows of the same app may be one process or several; it depends on the app.
    sources:
      - title: "Operating Systems: Three Easy Pieces"
        url: https://pages.cs.wisc.edu/~remzi/OSTEP/
        publisher: Remzi and Andrea Arpaci-Dusseau
  - id: foundations.files-and-paths
    title: Files, folders and paths
    module: environment
    level: beginner
    priority: essential
    summary: Files live in a tree of folders; a path is the address of a file, either absolute (from the root) or relative (from the current folder).
    requires: [foundations.operating-systems]
    keyIdeas:
      - Absolute paths start at a root (C:\ on Windows, / on macOS/Linux); relative paths start at the current working directory.
      - "`.` means the current folder and `..` means the parent folder."
      - File extensions are naming conventions that help programs choose how to open a file.
    misconceptions:
      - A relative path is resolved against the current working directory, not the folder the script is in.
    sources:
      - title: pathlib — Object-oriented filesystem paths
        url: https://docs.python.org/3/library/pathlib.html
        publisher: Python Software Foundation
  - id: foundations.permissions
    title: Users and permissions
    module: environment
    level: beginner
    priority: supporting
    summary: Operating systems control who can read, write or execute each file, which protects the system and other users.
    requires: [foundations.files-and-paths]
    keyIdeas:
      - Read, write and execute permissions are granted to users and groups.
      - Administrator/root rights should be used only when necessary (least privilege).
    misconceptions:
      - Running everything as administrator to "fix" errors hides the real problem and adds risk.
    sources:
      - title: "The Linux Command Line (free book)"
        url: https://linuxcommand.org/tlcl.php
        publisher: William Shotts
  - id: foundations.terminal-basics
    title: The terminal and command line
    module: environment
    level: beginner
    priority: essential
    summary: A shell reads typed commands, runs programs with arguments, and shows their output, relative to a current working directory.
    requires: [foundations.files-and-paths]
    keyIdeas:
      - "A command has a name, options (flags) and arguments: `python --version`, `ls -la notes`."
      - "Navigation: print the working directory, list files, change directory."
      - PowerShell, Command Prompt, bash and zsh are different shells with similar ideas.
    misconceptions:
      - The terminal is not "more dangerous" than a GUI, but commands act immediately and often without an undo.
    tools: [PowerShell, bash, zsh, Windows Terminal]
    sources:
      - title: "The Missing Semester of Your CS Education: The Shell"
        url: https://missing.csail.mit.edu/2020/course-shell/
        publisher: MIT
  - id: foundations.environment-variables
    title: Environment variables and PATH
    module: environment
    level: beginner
    priority: essential
    summary: Environment variables are named settings every process inherits; PATH tells the shell where to look for programs.
    requires: [foundations.terminal-basics]
    keyIdeas:
      - "'command not found' usually means the program's folder is not on PATH."
      - Child processes inherit a copy of their parent's environment.
      - Secrets are often passed to programs through environment variables instead of being written in code.
    misconceptions:
      - Changing an environment variable in one terminal does not change it in terminals that are already open.
    sources:
      - title: os.environ
        url: https://docs.python.org/3/library/os.html#os.environ
        publisher: Python Software Foundation
  - id: foundations.installing-tools
    title: Installing and managing developer tools
    module: environment
    level: beginner
    priority: essential
    summary: Installing software safely, choosing versions, and verifying what is installed with --version and PATH checks.
    requires: [foundations.environment-variables]
    keyIdeas:
      - Prefer official installers or package managers (winget, Homebrew, apt).
      - Several versions of a tool can coexist; the first match on PATH wins.
      - Verify an install by running the tool's version command in a new terminal.
    misconceptions:
      - Installing a tool twice does not fix a PATH problem.
    tools: [winget, Homebrew, apt]
    sources:
      - title: Using Python on Windows
        url: https://docs.python.org/3/using/windows.html
        publisher: Python Software Foundation
  - id: foundations.editors-and-ides
    title: Code editors and IDEs
    module: environment
    level: beginner
    priority: essential
    summary: An editor with syntax highlighting, linting, a terminal and a debugger makes reading and fixing code much easier.
    requires: [foundations.files-and-paths]
    keyIdeas:
      - An IDE combines an editor, a run/debug system and language tooling.
      - Extensions (linters, formatters, language servers) give instant feedback on mistakes.
      - Learn the debugger early; it beats guessing.
    tools: [VS Code, PyCharm Community]
    sources:
      - title: Python in Visual Studio Code
        url: https://code.visualstudio.com/docs/python/python-tutorial
        publisher: Microsoft
  - id: foundations.programs-and-languages
    title: Programs, interpreters and compilers
    module: programs
    level: beginner
    priority: essential
    summary: A program is a precise list of instructions; interpreters run source code directly, compilers translate it first, and a runtime supports the running program.
    requires: [foundations.how-computers-work]
    keyIdeas:
      - Source code is text written for humans and tools; the CPU only runs machine code.
      - CPython compiles Python source to bytecode and then interprets that bytecode.
      - Programs run statements in order unless control flow (conditions, loops, calls) changes it.
    misconceptions:
      - "\"Interpreted\" versus \"compiled\" describes implementations, not languages: Python itself is compiled to bytecode first."
    sources:
      - title: "The Python Tutorial: Using the Python Interpreter"
        url: https://docs.python.org/3/tutorial/interpreter.html
        publisher: Python Software Foundation
  - id: foundations.algorithmic-thinking
    title: Algorithmic thinking
    module: programs
    level: beginner
    priority: essential
    summary: Breaking a problem into precise, ordered steps that a computer can follow, and checking them by hand.
    requires: [foundations.programs-and-languages]
    keyIdeas:
      - An algorithm is a finite, unambiguous sequence of steps that solves a problem.
      - Work an example by hand before writing code.
      - Decompose big problems into small ones you already know how to solve.
    misconceptions:
      - Starting to type code immediately is usually slower than planning the steps first.
    sources:
      - title: "CS50x: Computer Science (Week 0)"
        url: https://cs50.harvard.edu/x/
        publisher: Harvard University
  - id: foundations.internet-basics
    title: The internet and client–server basics
    module: programs
    level: beginner
    priority: essential
    summary: Computers talk over networks by sending messages; a client asks for something and a server answers.
    requires: [foundations.operating-systems]
    keyIdeas:
      - Every device on a network has an address; domain names are human-friendly aliases for addresses.
      - Your browser is a client; websites and APIs are servers.
      - Requests and responses follow agreed rules called protocols (for example HTTP).
    sources:
      - title: "MDN: How does the Internet work?"
        url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work
        publisher: Mozilla
  - id: foundations.troubleshooting
    title: Troubleshooting and reading error messages
    module: programs
    level: beginner
    priority: essential
    summary: A systematic way to get unstuck - read the error, reproduce it, isolate it, form a hypothesis, test it, and search effectively.
    requires: [foundations.terminal-basics]
    keyIdeas:
      - The last line of an error message usually says what went wrong; the location tells you where.
      - Change one thing at a time and re-run.
      - A minimal reproducible example makes problems easier to solve and to ask about.
    misconceptions:
      - Copying fixes from the internet without understanding them often creates new problems.
    sources:
      - title: "Stack Overflow: How to create a Minimal, Reproducible Example"
        url: https://stackoverflow.com/help/minimal-reproducible-example
        publisher: Stack Overflow
  - id: foundations.reading-docs
    title: Reading documentation effectively
    module: programs
    level: beginner
    priority: supporting
    summary: Finding the official documentation, reading signatures and examples, and checking which version the docs describe.
    requires: [foundations.programs-and-languages]
    keyIdeas:
      - Official docs and specifications are the primary source; blog posts may be outdated.
      - "A function signature tells you the parameters, their defaults, and what is returned."
      - Always check the version selector on documentation sites.
    sources:
      - title: Python documentation
        url: https://docs.python.org/3/
        publisher: Python Software Foundation
  - id: foundations.learning-to-learn
    title: How to learn technical skills
    module: programs
    level: beginner
    priority: optional
    summary: Retrieval practice, spaced review, deliberate practice and building projects produce durable skill far better than rereading.
    keyIdeas:
      - Testing yourself (retrieval practice) strengthens memory more than rereading.
      - Spacing reviews over days beats cramming.
      - Struggling briefly before seeing a solution helps learning, as long as you then get feedback.
    misconceptions:
      - Feeling fluent while rereading is not the same as being able to do it yourself.
    sources:
      - title: "Learn How to Study Using... Retrieval Practice"
        url: https://www.learningscientists.org/blog/2016/6/23-1
        publisher: The Learning Scientists
