id: math
order: 8
title: Mathematics and Statistics for Machine Learning
shortTitle: Maths & Stats
summary: >-
  The algebra, linear algebra, calculus, probability and statistics that machine learning actually uses —
  taught with Python and visual intuition, at the point you need them.
why: >-
  You can call model.fit() without maths, but you cannot debug a model, choose a metric, read a paper or
  trust an A/B test without it.
modules:
  - id: algebra
    title: Algebra and functions
    summary: Functions, exponents, logarithms and summation notation.
  - id: linear-algebra
    title: Linear algebra
    summary: Vectors, matrices and decompositions — the language of embeddings and neural networks.
  - id: calculus
    title: Calculus and optimisation
    summary: Derivatives, gradients and gradient descent.
  - id: probability
    title: Probability
    summary: Events, conditional probability, Bayes, random variables and distributions.
  - id: statistics
    title: Statistics
    summary: Describing data, sampling, inference, hypothesis testing and information theory.
concepts:
  # ----------------------------------------------------------------- algebra
  - id: math.algebra-functions
    title: Functions, exponents and logarithms
    module: algebra
    level: beginner
    priority: essential
    summary: Functions map inputs to outputs; exponentials grow multiplicatively and logarithms undo them — both appear everywhere in ML.
    why: Loss functions, probabilities, learning-rate schedules and scaling laws are written as functions with exponents and logarithms; reading them fluently is the entry ticket to ML maths.
    requires: [python.numbers]
    keyIdeas:
      - "A function maps each input to exactly one output, for example `f(x) = 2x + 1`; composition `f(g(x))` feeds one function's output into another."
      - "Exponent rules: `a^m · a^n = a^(m+n)`, `(a^m)^n = a^(mn)`, `a^0 = 1` and `a^(-n) = 1 / a^n`."
      - "`log_b(x)` answers \"b to what power gives x?\"; logs turn products into sums, `log(xy) = log x + log y`, and powers into multiples, `log(x^k) = k log x`."
      - "`exp(x) = e^x` and the natural log `ln` undo each other; ML formulas use natural logs unless stated otherwise (`math.log` and `np.log` are natural logs)."
      - Exponential growth multiplies by a constant factor each step, while logarithmic growth adds a constant each time the input doubles, which is why binary search over a million items needs only about 20 steps.
    misconceptions:
      - "`log(a + b)` is not `log a + log b`; only products split into sums."
      - "In Python `^` is bitwise XOR, not a power; use `**` or `math.pow`."
    sources:
      - title: "College Algebra 2e: Exponential and Logarithmic Functions"
        url: https://openstax.org/books/college-algebra-2e/pages/6-introduction-to-exponential-and-logarithmic-functions
        publisher: OpenStax (Rice University)
      - title: math — Mathematical functions
        url: https://docs.python.org/3/library/math.html
        publisher: Python Software Foundation
  - id: math.summation-notation
    title: Summation notation and sequences
    module: algebra
    level: beginner
    priority: essential
    summary: Σ notation compactly describes sums such as means and losses; it translates directly into a Python loop or sum().
    why: Means, variances, losses and dot products are written with Σ in every textbook and paper; translating Σ into code and back is how formulas become working programs.
    requires: [math.algebra-functions, python.for-loops]
    keyIdeas:
      - "`Σ_{i=1}^{n} x_i` means x_1 + x_2 + ... + x_n; i is the index, 1 and n are the bounds and x_i is the term."
      - "The mean `(1/n) Σ x_i` is `sum(xs) / len(xs)` in plain Python and `x.mean()` in NumPy."
      - "Constants factor out and sums split: `Σ c·x_i = c Σ x_i` and `Σ (x_i + y_i) = Σ x_i + Σ y_i`."
      - "A double sum `Σ_i Σ_j a_ij` is a nested loop; Π is the product symbol, as in a likelihood `Π p(x_i)`, whose logarithm becomes a sum."
      - "Maths usually indexes from 1 and Python from 0, so `Σ_{i=1}^{n} x_i` becomes a loop over `x[0]` to `x[n-1]`, i.e. `range(n)`."
    misconceptions:
      - "`(Σ x_i)^2` is not `Σ x_i^2`; squaring a sum and summing squares give different results."
    sources:
      - title: "College Algebra 2e: Series and Their Notations"
        url: https://openstax.org/books/college-algebra-2e/pages/9-4-series-and-their-notations
        publisher: OpenStax (Rice University)
      - title: Mathematics for Machine Learning
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
  # ---------------------------------------------------------- linear-algebra
  - id: math.vectors
    title: Vectors, norms and the dot product
    module: linear-algebra
    level: beginner
    priority: essential
    summary: A vector is an ordered list of numbers with length and direction; the dot product and cosine similarity measure how aligned two vectors are.
    why: Feature rows, embeddings and model weights are all vectors, and similarity search in RAG literally means finding the vectors with the highest cosine similarity to a query.
    requires: [math.algebra-functions, python.lists]
    keyIdeas:
      - A vector in R^n is an ordered list of n numbers; vectors add element by element and scale by multiplying every element.
      - "The L2 (Euclidean) norm is `||v|| = sqrt(Σ v_i^2)` and the L1 norm is `Σ |v_i|`; a unit vector has L2 norm 1."
      - "The dot product `a·b = Σ a_i b_i = ||a|| ||b|| cos θ` is positive when vectors point in similar directions and zero when they are perpendicular."
      - "Cosine similarity `a·b / (||a|| ||b||)` lies between -1 and 1 and ignores length; for unit-normalised vectors it equals the dot product."
      - "Euclidean distance `||a - b||` measures how far apart two points are; for unit vectors, ranking by distance and ranking by cosine similarity give the same order."
    misconceptions:
      - A larger dot product does not always mean more similar; long vectors inflate it, which is why cosine similarity divides by the lengths.
      - "Python lists do not do vector maths: `[1, 2] + [3, 4]` concatenates them. Use NumPy arrays."
    interview: Expect to explain the dot product geometrically and why cosine similarity is used to compare embeddings.
    sources:
      - title: Mathematics for Machine Learning (Ch. 2-3, linear algebra and analytic geometry)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
      - title: "Essence of linear algebra: Dot products and duality"
        url: https://www.3blue1brown.com/lessons/dot-products/
        publisher: 3Blue1Brown
      - title: "Dive into Deep Learning: Linear Algebra"
        url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
  - id: math.matrices
    title: Matrices and matrix multiplication
    module: linear-algebra
    level: intermediate
    priority: essential
    summary: Matrices are grids of numbers; multiplying a matrix by a vector applies many dot products at once, which is how neural network layers compute.
    why: A neural network layer is a matrix multiplication followed by a non-linearity and a batch of data is a matrix, so shape errors are among the most common bugs in ML code.
    requires: [math.vectors]
    keyIdeas:
      - "An m x n matrix has m rows and n columns; `A @ B` needs A's column count to equal B's row count, and (m x n) times (n x p) gives m x p."
      - "Entry `(AB)_ij` is the dot product of row i of A with column j of B; `A @ x` is a weighted combination of A's columns."
      - Matrix multiplication is associative but not commutative - AB and BA are generally different, and one may not even be defined.
      - "The transpose swaps rows and columns, with `(AB)^T = B^T A^T`; the identity matrix I leaves every vector unchanged."
      - "A dense layer computes `y = W x + b` for one input, or `X @ W.T + b` for a batch whose rows are examples."
    misconceptions:
      - "In NumPy `A * B` multiplies element by element; matrix multiplication is `A @ B` (or `np.matmul`)."
      - A 1-D NumPy array is neither a row nor a column vector; the operation decides how it is treated.
    interview: Expect to work out the output shapes of matrix products and explain how a linear layer is a matrix multiplication.
    sources:
      - title: Mathematics for Machine Learning (Ch. 2, linear algebra)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
      - title: "Essence of linear algebra: Matrix multiplication as composition"
        url: https://www.3blue1brown.com/lessons/matrix-multiplication/
        publisher: 3Blue1Brown
      - title: Linear algebra (numpy.linalg)
        url: https://numpy.org/doc/stable/reference/routines.linalg.html
        publisher: NumPy
  - id: math.linear-transformations
    title: Linear transformations, inverses and rank
    module: linear-algebra
    level: intermediate
    priority: supporting
    summary: A matrix transforms space; its inverse undoes the transformation when one exists, and its rank counts independent directions.
    why: Seeing matrices as transformations explains why some systems of equations have no unique solution, why features can be redundant, and what low-rank methods such as LoRA exploit.
    requires: [math.matrices]
    keyIdeas:
      - Every matrix defines a linear map that keeps the origin fixed and sends straight lines to straight lines; its columns show where the basis vectors land.
      - The determinant measures how the transformation scales area or volume; a determinant of 0 means space is squashed into fewer dimensions, so no inverse exists.
      - "If A is invertible, `A^-1 A = I` and `Ax = b` has the unique solution `x = A^-1 b`; in code use `np.linalg.solve(A, b)` rather than computing the inverse."
      - Rank is the number of linearly independent columns (the dimension of the output space); a rank-deficient feature matrix contains redundant, collinear features.
      - "Low-rank factorisation stores a d x k matrix as `B A` with B of shape d x r and A of shape r x k for small r; LoRA fine-tuning learns such a low-rank update instead of changing every weight."
    misconceptions:
      - Not every square matrix has an inverse; singular matrices (determinant 0) do not.
      - "Computing `inv(A) @ b` is slower and less accurate than solving the system directly."
    sources:
      - title: "Essence of linear algebra: Linear transformations and matrices"
        url: https://www.3blue1brown.com/lessons/linear-transformations/
        publisher: 3Blue1Brown
      - title: "Essence of linear algebra: Inverse matrices, column space, and null space"
        url: https://www.3blue1brown.com/lessons/inverse-matrices/
        publisher: 3Blue1Brown
      - title: "18.06 Linear Algebra (Gilbert Strang)"
        url: https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/
        publisher: MIT OpenCourseWare
  - id: math.eigen-svd
    title: Eigenvectors and singular value decomposition
    module: linear-algebra
    level: advanced
    priority: supporting
    summary: Eigenvectors are directions a transformation only stretches; SVD factorises any matrix and underlies PCA and low-rank approximations.
    why: PCA, recommender systems, embedding compression and the analysis of training dynamics all rely on decomposing matrices into simpler, interpretable pieces.
    requires: [math.linear-transformations]
    keyIdeas:
      - "An eigenvector v of a square matrix A satisfies `Av = λv`; A only scales it, by the eigenvalue λ."
      - "A symmetric matrix, such as a covariance matrix, has real eigenvalues and orthogonal eigenvectors, so `A = Q Λ Q^T`."
      - "SVD factorises any m x n matrix as `A = U Σ V^T`, with orthonormal U and V and non-negative singular values on the diagonal of Σ, sorted from largest to smallest."
      - Keeping only the top k singular values gives the best rank-k approximation of A (the Eckart-Young theorem), the basis of compression and latent-factor models.
      - PCA centres the data and takes the top right-singular vectors of the data matrix (equivalently the top eigenvectors of its covariance matrix); each component's explained variance is proportional to its squared singular value.
    misconceptions:
      - Eigenvectors are only defined up to scale and sign, so different libraries may return v or -v; both are correct.
      - PCA on uncentred (and, for mixed units, unscaled) features gives misleading components.
    interview: Expect to explain PCA in terms of eigenvectors or SVD and what explained variance means.
    sources:
      - title: "Essence of linear algebra: Eigenvectors and eigenvalues"
        url: https://www.3blue1brown.com/lessons/eigenvalues/
        publisher: 3Blue1Brown
      - title: Mathematics for Machine Learning (Ch. 4 Matrix Decompositions, Ch. 10 PCA)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
      - title: numpy.linalg.svd
        url: https://numpy.org/doc/stable/reference/generated/numpy.linalg.svd.html
        publisher: NumPy
  # ------------------------------------------------------------------ calculus
  - id: math.derivatives
    title: Derivatives and the chain rule
    module: calculus
    level: intermediate
    priority: essential
    summary: A derivative is an instantaneous rate of change; the chain rule differentiates compositions — the core of backpropagation.
    why: Training means adjusting parameters to reduce a loss, and derivatives say in which direction and how strongly each change affects it; backpropagation is the chain rule applied systematically.
    requires: [math.algebra-functions]
    keyIdeas:
      - "The derivative `f'(x) = lim_{h→0} (f(x+h) - f(x)) / h` is the slope of the tangent line, i.e. how fast f changes as x changes."
      - "Rules to know: `d/dx x^n = n x^(n-1)`, `d/dx e^x = e^x`, `d/dx ln x = 1/x`, the sum and constant-multiple rules, and the product rule `(fg)' = f'g + fg'`."
      - "Chain rule: if `y = f(g(x))` then `dy/dx = f'(g(x)) · g'(x)`; multiply the local derivatives along the chain."
      - "Where `f'(x) = 0` the function is flat (a minimum, maximum or saddle point); the sign of f' says whether f is increasing or decreasing."
      - "Check a derivative numerically with the central difference `(f(x+h) - f(x-h)) / (2h)` for a small h such as 1e-5."
    misconceptions:
      - The derivative at a point is a number (a slope), not the value of the function there.
      - "The chain rule is not `f'(g'(x))`; evaluate f' at g(x), then multiply by g'(x)."
    interview: Expect to differentiate a simple composite function, such as a squared error or the sigmoid, and connect the chain rule to backpropagation.
    sources:
      - title: "Calculus Volume 1, Chapter 3: Derivatives"
        url: https://openstax.org/books/calculus-volume-1/pages/3-introduction
        publisher: OpenStax (Rice University)
      - title: "Essence of calculus: Visualizing the chain rule and product rule"
        url: https://www.3blue1brown.com/lessons/chain-rule-and-product-rule/
        publisher: 3Blue1Brown
      - title: "Dive into Deep Learning: Calculus"
        url: https://d2l.ai/chapter_preliminaries/calculus.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
  - id: math.partial-gradients
    title: Partial derivatives and gradients
    module: calculus
    level: intermediate
    priority: essential
    summary: For functions of many variables, partial derivatives form the gradient, which points uphill most steeply.
    why: A model's loss depends on millions of parameters; the gradient bundles every parameter's sensitivity into one vector that the optimiser follows.
    requires: [math.derivatives, math.vectors]
    keyIdeas:
      - "A partial derivative `∂f/∂x` differentiates with respect to one variable while holding all the others constant."
      - "The gradient `∇f = (∂f/∂x_1, ..., ∂f/∂x_n)` points in the direction of steepest increase, and its length is the rate of increase in that direction."
      - "A gradient has the same shape as the parameters it is taken with respect to; for a weight matrix W, `∂L/∂W` is a matrix of the same shape."
      - When a variable affects the output through several paths, the multivariable chain rule adds the contributions of each path; backpropagation does exactly this over the network's computation graph.
      - Automatic differentiation (PyTorch autograd, JAX) computes exact gradients of your code mechanically, so you rarely derive them by hand - but you must understand what they mean.
    misconceptions:
      - The gradient points uphill; to minimise a loss you step in the negative gradient direction.
      - Automatic differentiation is neither finite-difference approximation nor symbolic algebra; it applies the chain rule to the operations your code actually executed.
    interview: Expect to compute a simple gradient by hand (for example of mean squared error for linear regression) and explain what backpropagation computes.
    sources:
      - title: "Calculus Volume 3, Chapter 4: Differentiation of Functions of Several Variables"
        url: https://openstax.org/books/calculus-volume-3/pages/4-introduction
        publisher: OpenStax (Rice University)
      - title: Mathematics for Machine Learning (Ch. 5 Vector Calculus)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
      - title: "Dive into Deep Learning: Automatic Differentiation"
        url: https://d2l.ai/chapter_preliminaries/autograd.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
  - id: math.optimization
    title: Optimisation and gradient descent
    module: calculus
    level: intermediate
    priority: essential
    summary: Repeatedly step against the gradient to minimise a loss; the learning rate controls step size, and convexity determines whether a global minimum is guaranteed.
    why: Almost every model, from linear regression to large language models, is trained by some form of gradient descent, and many training failures (divergence, stalling) are optimisation problems.
    requires: [math.partial-gradients]
    keyIdeas:
      - "The update rule is `θ ← θ - η ∇L(θ)`, where η is the learning rate; repeat until the loss stops improving."
      - A learning rate that is too large overshoots and can diverge (the loss grows or becomes NaN); one that is too small makes progress painfully slow.
      - Mini-batch stochastic gradient descent estimates the gradient from a small batch, which is far cheaper per step, and its noise can help escape poor regions.
      - For convex functions every local minimum is a global minimum; neural network losses are non-convex, with saddle points and many minima, yet SGD-style methods still find good solutions in practice.
      - Momentum and adaptive optimisers such as Adam and AdamW adjust step sizes per parameter, and learning-rate schedules (warm-up, decay) are part of every modern training recipe.
    misconceptions:
      - Lower training loss is not the goal by itself; you optimise the training loss but judge the model on held-out data.
      - Gradient descent does not guarantee finding the global minimum of a non-convex function.
    interview: Expect to explain gradient descent, the role of the learning rate, and batch versus mini-batch versus stochastic variants.
    sources:
      - title: "Dive into Deep Learning: Gradient Descent"
        url: https://d2l.ai/chapter_optimization/gd.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
      - title: "Neural networks: Gradient descent, how neural networks learn"
        url: https://www.3blue1brown.com/lessons/gradient-descent/
        publisher: 3Blue1Brown
      - title: Convex Optimization (free PDF)
        url: https://web.stanford.edu/~boyd/cvxbook/
        publisher: Boyd and Vandenberghe (Cambridge University Press)
  # --------------------------------------------------------------- probability
  - id: math.probability-basics
    title: Probability fundamentals
    module: probability
    level: beginner
    priority: essential
    summary: Sample spaces, events, and the rules for combining probabilities, with simulation in Python to check intuition.
    why: Models output probabilities, data is noisy and evaluation is statistical; reasoning correctly about uncertainty starts with a few basic rules.
    requires: [math.algebra-functions]
    keyIdeas:
      - The sample space is the set of all possible outcomes and an event is a subset of it; probabilities lie between 0 and 1, and the whole sample space has probability 1.
      - "Complement rule `P(not A) = 1 - P(A)`; addition rule `P(A or B) = P(A) + P(B) - P(A and B)`."
      - "Independent events satisfy `P(A and B) = P(A) · P(B)`; mutually exclusive events cannot happen together, so `P(A and B) = 0`."
      - "With equally likely outcomes, P(A) is the number of outcomes in A divided by the total; permutations count ordered arrangements and combinations (`math.comb(n, k)`) unordered selections."
      - "Check intuition by simulation - repeat a random experiment many times with `numpy.random.default_rng(seed)` and compare frequencies with your calculation."
    misconceptions:
      - Independent and mutually exclusive are different ideas; two mutually exclusive events with non-zero probabilities are never independent.
      - The gambler's fallacy - after five heads in a row a fair coin is still 50/50 on the next flip.
    sources:
      - title: "Introductory Statistics 2e, Chapter 3: Probability Topics"
        url: https://openstax.org/books/introductory-statistics-2e/pages/3-introduction
        publisher: OpenStax (Rice University)
      - title: Seeing Theory (visual introduction to probability and statistics)
        url: https://seeing-theory.brown.edu/
        publisher: Brown University
      - title: Random sampling (numpy.random)
        url: https://numpy.org/doc/stable/reference/random/index.html
        publisher: NumPy
  - id: math.conditional-probability
    title: Conditional probability and Bayes' theorem
    module: probability
    level: intermediate
    priority: essential
    summary: P(A|B) is the probability of A given B; Bayes' theorem reverses the condition and explains why rare-event tests produce many false positives.
    why: Diagnostic tests, spam filters, fraud alerts and classifier thresholds all hinge on conditional probabilities, and confusing P(A|B) with P(B|A) leads to badly wrong decisions.
    requires: [math.probability-basics]
    keyIdeas:
      - "`P(A|B) = P(A and B) / P(B)`: restrict attention to the cases where B happened, then ask how often A also happens."
      - "Bayes' theorem `P(H|E) = P(E|H) · P(H) / P(E)`, where P(H) is the prior, P(E|H) the likelihood and P(H|E) the posterior."
      - "Law of total probability: `P(E) = P(E|H) · P(H) + P(E|not H) · P(not H)`."
      - Base rates dominate - a test that catches 99% of cases with a 1% false-positive rate, for a condition affecting 1 in 1,000 people, gives positives that are correct only about 9% of the time.
      - Naive Bayes classifiers and much probabilistic reasoning in ML apply Bayes' rule with simplifying independence assumptions.
    misconceptions:
      - P(A|B) is not P(B|A) - the share of spam emails containing "free" differs from the share of emails containing "free" that are spam.
      - Ignoring the base rate (the prior) is the most common error when interpreting test results or alerts.
    interview: Expect a Bayes' theorem word problem (a medical test or fraud alert) and a question on why base rates matter.
    sources:
      - title: Bayes theorem, the geometry of changing beliefs
        url: https://www.3blue1brown.com/lessons/bayes-theorem/
        publisher: 3Blue1Brown
      - title: "Introductory Statistics 2e, Chapter 3: Probability Topics"
        url: https://openstax.org/books/introductory-statistics-2e/pages/3-introduction
        publisher: OpenStax (Rice University)
      - title: Mathematics for Machine Learning (Ch. 6 Probability and Distributions)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
  - id: math.random-variables
    title: Random variables, expectation and variance
    module: probability
    level: intermediate
    priority: essential
    summary: A random variable assigns numbers to outcomes; its expected value is the long-run average and variance measures spread.
    why: Losses, metrics, latencies and model outputs vary from run to run; expectation and variance are how you describe that variation and reason about averages.
    requires: [math.probability-basics, math.summation-notation]
    keyIdeas:
      - A random variable X maps outcomes to numbers; a discrete one has a probability mass function, and a continuous one has a probability density function whose area over an interval gives a probability.
      - "Expectation `E[X] = Σ x · P(X = x)` is the probability-weighted average, and it is always linear: `E[aX + bY] = a E[X] + b E[Y]`."
      - "Variance `Var(X) = E[(X - E[X])^2] = E[X^2] - E[X]^2`; the standard deviation is its square root and has the same units as X."
      - "`Var(aX + b) = a^2 Var(X)`, and for independent X and Y, `Var(X + Y) = Var(X) + Var(Y)`."
      - Covariance measures how two variables move together; correlation is covariance rescaled to lie between -1 and 1.
    misconceptions:
      - A density value is not a probability and can be greater than 1; only areas under the density curve are probabilities.
      - Variances add for independent variables; standard deviations do not.
    interview: Expect to compute an expectation and variance for a simple game or distribution and to use linearity of expectation.
    sources:
      - title: "Introductory Statistics 2e, Chapter 4: Discrete Random Variables"
        url: https://openstax.org/books/introductory-statistics-2e/pages/4-introduction
        publisher: OpenStax (Rice University)
      - title: "Dive into Deep Learning: Random Variables"
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/random-variables.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
      - title: Mathematics for Machine Learning (Ch. 6 Probability and Distributions)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
  - id: math.distributions
    title: Probability distributions
    module: probability
    level: intermediate
    priority: essential
    summary: Bernoulli, binomial, uniform, normal and Poisson distributions model common processes; the normal distribution emerges from sums of many effects.
    why: Choosing a distribution means choosing a model of how data is generated; it underlies loss functions, simulations, priors, anomaly thresholds and statistical tests.
    requires: [math.random-variables]
    keyIdeas:
      - "Bernoulli(p) is one yes/no trial; Binomial(n, p) counts successes in n independent trials, with mean `np` and variance `np(1 - p)`."
      - "Uniform(a, b) makes every value in the interval equally likely; Poisson(λ) counts events in a fixed interval and has mean and variance both equal to λ."
      - "The normal distribution N(μ, σ²) is a symmetric bell curve; about 68%, 95% and 99.7% of values lie within 1, 2 and 3 standard deviations of the mean."
      - The central limit theorem says sums and averages of many independent variables with finite variance are approximately normal, whatever the original distribution.
      - "In Python, `scipy.stats` gives probabilities (`norm.cdf`, `binom.pmf`) and `numpy.random.default_rng().normal(...)` draws samples."
    misconceptions:
      - Not all data is normal; incomes, latencies and word frequencies are heavily skewed or heavy-tailed, so mean plus or minus two standard deviations rules mislead.
      - The central limit theorem is about averages of samples; it does not make individual data points normal.
    interview: Expect to pick a distribution for a described process (clicks, arrivals, measurements) and state its mean and variance.
    sources:
      - title: "Introductory Statistics 2e, Chapter 6: The Normal Distribution"
        url: https://openstax.org/books/introductory-statistics-2e/pages/6-introduction
        publisher: OpenStax (Rice University)
      - title: "Dive into Deep Learning: Distributions"
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/distributions.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
      - title: Statistical functions (scipy.stats)
        url: https://docs.scipy.org/doc/scipy/reference/stats.html
        publisher: SciPy
  # ---------------------------------------------------------------- statistics
  - id: math.descriptive-statistics
    title: Descriptive statistics
    module: statistics
    level: beginner
    priority: essential
    summary: Mean, median, mode, variance, standard deviation, percentiles and correlation summarise data — and each can mislead in specific ways.
    why: Before modelling or reporting anything you need a few honest numbers that describe the data, and you need to know when those numbers hide what is really going on.
    requires: [math.summation-notation]
    keyIdeas:
      - The mean is pulled by outliers; the median (50th percentile) is robust to them; the mode is the most frequent value.
      - Spread is measured by variance and standard deviation (divide by n - 1 for a sample estimate), the range, and the interquartile range IQR = Q3 - Q1.
      - Percentiles describe tails - p50, p95 and p99 latency say more about user experience than the mean does.
      - Pearson correlation measures linear association between -1 and 1; Spearman correlation works on ranks and captures any monotonic relationship.
      - Always plot the data, because very different datasets can share the same mean, variance and correlation (Anscombe's quartet).
    misconceptions:
      - Correlation does not imply causation, and zero correlation does not mean no relationship; the relationship may be non-linear.
      - The mean is not the "typical" value of skewed data; report the median as well.
    interview: Expect to say when you would report the median rather than the mean, and why p99 latency matters.
    sources:
      - title: "Introductory Statistics 2e, Chapter 2: Descriptive Statistics"
        url: https://openstax.org/books/introductory-statistics-2e/pages/2-introduction
        publisher: OpenStax (Rice University)
      - title: statistics — Mathematical statistics functions
        url: https://docs.python.org/3/library/statistics.html
        publisher: Python Software Foundation
      - title: NIST/SEMATECH e-Handbook of Statistical Methods
        url: https://www.itl.nist.gov/div898/handbook/
        publisher: NIST
  - id: math.sampling-inference
    title: Sampling and statistical inference
    module: statistics
    level: intermediate
    priority: essential
    summary: Samples estimate population properties with uncertainty; the central limit theorem justifies confidence intervals.
    why: You almost never see the whole population (all users, all future data), so every metric is an estimate, and you need to know how uncertain it is before acting on it.
    requires: [math.distributions, math.descriptive-statistics]
    keyIdeas:
      - A statistic computed on a sample, such as the sample mean, estimates a population parameter and varies from one sample to the next.
      - "The standard error of the mean is `σ / sqrt(n)`, so quadrupling the sample size halves the uncertainty."
      - "By the central limit theorem, an approximate 95% confidence interval for a mean is `x̄ ± 1.96 · s / sqrt(n)` for large n; use the t distribution for small samples."
      - Bootstrapping estimates uncertainty by resampling the data with replacement many times and recomputing the statistic each time.
      - Biased samples (self-selection, survivorship, non-response) are not fixed by collecting more of the same data.
    misconceptions:
      - A 95% confidence interval does not mean there is a 95% probability that this particular interval contains the true value; it means 95% of intervals built this way would.
      - A larger sample reduces random error but does nothing about systematic bias.
    interview: Expect to explain standard error and confidence intervals, and how you would put error bars on a model's test accuracy.
    sources:
      - title: "Introductory Statistics 2e, Chapter 7: The Central Limit Theorem"
        url: https://openstax.org/books/introductory-statistics-2e/pages/7-introduction
        publisher: OpenStax (Rice University)
      - title: "Introductory Statistics 2e, Chapter 8: Confidence Intervals"
        url: https://openstax.org/books/introductory-statistics-2e/pages/8-introduction
        publisher: OpenStax (Rice University)
      - title: But what is the Central Limit Theorem?
        url: https://www.3blue1brown.com/lessons/clt/
        publisher: 3Blue1Brown
  - id: math.hypothesis-testing
    title: Hypothesis testing and A/B tests
    module: statistics
    level: intermediate
    priority: essential
    summary: Null hypotheses, p-values, significance, power and multiple comparisons — what a test can and cannot tell you.
    why: A/B tests and model comparisons decide what ships; without proper testing, random noise looks like improvement and teams chase false wins.
    requires: [math.sampling-inference, math.conditional-probability]
    keyIdeas:
      - The null hypothesis H0 assumes no effect; the p-value is the probability of seeing data at least as extreme as yours if H0 were true.
      - Fix the significance level α (often 0.05) in advance; p < α means "reject H0", not that the effect is large or important.
      - A Type I error is a false positive (rate α) and a Type II error a false negative (rate β); power = 1 - β grows with sample size and effect size.
      - Choose the sample size in advance with a power analysis; stopping as soon as p dips below 0.05 ("peeking") inflates false positives.
      - Testing many metrics or variants multiplies false discoveries; correct with Bonferroni or Benjamini-Hochberg, or pre-register one primary metric.
    misconceptions:
      - A p-value is not the probability that the null hypothesis is true, nor the probability that the result is "due to chance".
      - A non-significant result does not prove there is no effect; the test may simply lack power.
    interview: Expect to design an A/B test (metric, sample size, duration) and interpret a p-value and confidence interval correctly.
    production: In online experiments, check for sample-ratio mismatch, run for whole weekly cycles and watch for novelty effects before trusting a result.
    sources:
      - title: "Introductory Statistics 2e, Chapter 9: Hypothesis Testing with One Sample"
        url: https://openstax.org/books/introductory-statistics-2e/pages/9-introduction
        publisher: OpenStax (Rice University)
      - title: "The ASA's Statement on p-Values: Context, Process, and Purpose"
        url: https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf
        publisher: American Statistical Association
      - title: Statistical functions (scipy.stats)
        url: https://docs.scipy.org/doc/scipy/reference/stats.html
        publisher: SciPy
  - id: math.information-theory
    title: Entropy, cross-entropy and KL divergence
    module: statistics
    level: intermediate
    priority: supporting
    summary: Entropy measures uncertainty; cross-entropy measures how well predicted probabilities match reality and is the standard classification loss.
    why: Cross-entropy is the loss used to train classifiers and every language model, and perplexity, KL penalties in fine-tuning and distillation all build on the same few ideas.
    requires: [math.distributions, math.algebra-functions]
    keyIdeas:
      - "Entropy `H(p) = -Σ p(x) log p(x)` is the average surprise of a distribution; it is largest for a uniform distribution and zero when one outcome is certain (log base 2 gives bits, natural log gives nats)."
      - "Cross-entropy `H(p, q) = -Σ p(x) log q(x)` measures the cost of predicting q when the truth is p; with a one-hot label it reduces to `-log q(correct class)`."
      - "KL divergence `D_KL(p || q) = Σ p(x) log(p(x) / q(x)) = H(p, q) - H(p)` is never negative and is zero only when p equals q."
      - KL divergence is asymmetric, so D_KL(p || q) generally differs from D_KL(q || p) and it is not a true distance.
      - "A language model's perplexity is `exp(average cross-entropy per token)`; lower is better."
    misconceptions:
      - Minimising cross-entropy is not a different goal from minimising KL divergence to the data; the two differ only by the data's entropy, which is a constant.
      - Low cross-entropy loss is not the same as high accuracy; a model can be accurate yet badly calibrated (over-confident).
    interview: Expect to derive the cross-entropy loss for classification and explain how KL divergence relates to it.
    sources:
      - title: "Dive into Deep Learning: Information Theory"
        url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/information-theory.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
      - title: "Dive into Deep Learning: Softmax Regression (cross-entropy loss)"
        url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
        publisher: Zhang, Lipton, Li and Smola (d2l.ai)
  - id: math.numerical-computing
    title: Numerical computing
    module: statistics
    level: intermediate
    priority: supporting
    summary: Floating-point limits, overflow and underflow, numerically stable formulas (log-sum-exp) and vectorised computation.
    why: Real numbers on a computer are approximations; naive formulas overflow, underflow or lose precision and silently produce NaN losses or wrong probabilities.
    requires: [math.matrices, foundations.binary-and-data]
    keyIdeas:
      - float64 carries about 15-16 significant decimal digits (machine epsilon about 2.2e-16) and float32 about 7; float16 and bfloat16 have fewer, with bfloat16 keeping float32's range at lower precision.
      - "Compare floats with a tolerance, `math.isclose(a, b)` or `np.allclose(a, b)`, never with `==`."
      - "`exp(1000)` overflows to `inf`, and multiplying many small probabilities underflows to 0; work with log-probabilities and add them instead."
      - "The log-sum-exp trick `log Σ exp(x_i) = m + log Σ exp(x_i - m)`, with m the maximum of x, keeps softmax and log-likelihood computations stable (`scipy.special.logsumexp`)."
      - "Vectorised NumPy operations run as compiled loops and are often orders of magnitude faster than Python loops; prefer `np.linalg.solve` over explicit inverses for accuracy."
    misconceptions:
      - "NaN is not equal to anything, including itself; test with `math.isnan` or `np.isnan`."
      - Floating-point addition is not associative, so adding the same numbers in a different order can change the result.
    sources:
      - title: "Floating-Point Arithmetic: Issues and Limitations"
        url: https://docs.python.org/3/tutorial/floatingpoint.html
        publisher: Python Software Foundation
      - title: What Every Computer Scientist Should Know About Floating-Point Arithmetic
        url: https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html
        publisher: David Goldberg (reprinted by Oracle)
      - title: scipy.special.logsumexp
        url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.special.logsumexp.html
        publisher: SciPy
  - id: math.maximum-likelihood
    title: Maximum likelihood estimation
    module: statistics
    level: advanced
    priority: supporting
    summary: Choose model parameters that make the observed data most probable; minimising mean squared error and cross-entropy are both maximum likelihood in disguise.
    why: It explains where the standard loss functions come from and why models output probabilities.
    requires: [math.distributions, math.optimization]
    keyIdeas:
      - The likelihood is the probability of the observed data as a function of the parameters; we maximise it, usually via its logarithm, which turns products into sums.
      - Minimising the negative log-likelihood of a Bernoulli or categorical model is exactly minimising cross-entropy.
      - Assuming Gaussian noise with fixed variance, maximising the likelihood is equivalent to minimising mean squared error.
      - Adding a prior and maximising the posterior (MAP) corresponds to regularisation such as L2 weight decay.
    misconceptions:
      - Likelihood is not the probability that the parameters are correct; it is the probability of the data given the parameters.
    sources:
      - title: Mathematics for Machine Learning (free book)
        url: https://mml-book.github.io/
        publisher: Deisenroth, Faisal and Ong
      - title: Deep Learning (free online book)
        url: https://www.deeplearningbook.org/
        publisher: Goodfellow, Bengio and Courville
