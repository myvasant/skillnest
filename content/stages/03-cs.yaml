id: cs
order: 3
title: Computer Science and Software Engineering
shortTitle: CS & Engineering
summary: >-
  Algorithms, data structures, complexity, recursion and the engineering practices — design, testing,
  review, documentation — that turn code into maintainable software.
why: >-
  Frameworks change every few years; complexity analysis, good data-structure choices and disciplined
  engineering practice do not. They are also what technical interviews probe most.
modules:
  - id: algorithms
    title: Algorithms and complexity
    summary: Problem decomposition, Big-O, recursion, searching, sorting and algorithm design techniques.
  - id: data-structures
    title: Data structures
    summary: Arrays, hash tables, stacks, queues, linked lists, trees, heaps and graphs.
  - id: paradigms
    title: Programming paradigms and design
    summary: Abstraction, object-oriented and functional principles, SOLID, design patterns and refactoring.
  - id: engineering
    title: Software engineering practice
    summary: Lifecycle, requirements, testing strategy, code review, documentation, dependencies and trade-offs.
concepts:
  # ------------------------------------------------------------- algorithms
  - id: cs.problem-decomposition
    title: Problem decomposition and computational thinking
    module: algorithms
    level: beginner
    priority: essential
    summary: Break problems into sub-problems, recognise patterns, abstract away irrelevant detail, and design step-by-step solutions before coding.
    requires: [foundations.algorithmic-thinking, python.functions]
    why: Real tasks arrive as vague goals ("build a sales report"); without splitting them into small, checkable steps you stall or end up with tangled code that is hard to test.
    keyIdeas:
      - Restate the problem in your own words and write down the inputs, outputs and constraints before writing any code.
      - Work through two or three small examples by hand, including edge cases such as empty input, a single item and duplicates.
      - Split the task into sub-problems that each become a function with one clear job, then solve and test them one at a time.
      - Look for patterns you have solved before (counting, filtering, searching, grouping, accumulating) and reuse the approach.
      - Abstraction means ignoring detail that does not affect the answer, for example treating a street map as a graph of junctions and roads.
    misconceptions:
      - Starting to type immediately is rarely faster; most bugs come from not understanding the problem, not from syntax.
      - A decomposition is not final; it is normal to re-split when a sub-problem turns out harder than expected.
    interview: Interviewers watch whether you clarify requirements, walk through examples and outline an approach before you start coding.
    sources:
      - title: How to Design Programs (the design recipe)
        url: https://htdp.org/
        publisher: Felleisen, Findler, Flatt and Krishnamurthi
      - title: "Think Python, 3rd edition"
        url: https://allendowney.github.io/ThinkPython/
        publisher: Allen B. Downey
  - id: cs.complexity
    title: Algorithmic complexity and Big-O
    module: algorithms
    level: intermediate
    priority: essential
    summary: Big-O describes how an algorithm's time or memory grows with input size, letting you compare approaches before measuring them.
    requires: [python.for-loops, python.lists, python.functions, python.classes]
    why: Code that is fine on 100 rows can take hours on 10 million; Big-O lets you predict that before it reaches production.
    keyIdeas:
      - Big-O is an upper bound on growth that ignores constant factors and lower-order terms, so 3n² + 5n + 2 is O(n²).
      - Common classes from fastest to slowest growth are O(1), O(log n), O(n), O(n log n), O(n²) and O(2ⁿ).
      - Two nested loops over the same input are usually O(n²); halving the remaining work each step gives O(log n).
      - "Know the cost of built-ins: `x in my_list` is O(n), `x in my_set` and `d[key]` are O(1) on average, and `sorted()` is O(n log n)."
      - Analyse memory as well as time, and say which case you mean (worst, average or amortised); `list.append` is amortised O(1).
    misconceptions:
      - O(1) does not mean fast, only that the cost does not grow with n; for small inputs an asymptotically slower algorithm can win.
      - Big-O is not a measurement; profile real code to find where time actually goes.
    interview: Expect to state the time and space complexity of every solution you write and justify it from its loops and data structures.
    sources:
      - title: "MIT 6.006 Introduction to Algorithms (Spring 2020)"
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        publisher: MIT OpenCourseWare
      - title: TimeComplexity (cost of operations on built-in types)
        url: https://wiki.python.org/moin/TimeComplexity
        publisher: Python Wiki
  - id: cs.recursion
    title: Recursion
    module: algorithms
    level: intermediate
    priority: essential
    summary: A function that solves a problem by calling itself on smaller instances, stopping at a base case; every recursive call gets its own frame on the call stack.
    requires: [python.functions, python.conditionals]
    why: Trees, nested data such as JSON, and divide-and-conquer algorithms are defined in terms of smaller copies of themselves, and recursion expresses them directly.
    keyIdeas:
      - Every recursive function needs a base case that returns without recursing, and every recursive call must move closer to it.
      - Each call gets its own stack frame with its own local variables; frames are removed in reverse order as calls return.
      - "Trust the recursion: assume the call on the smaller input is correct and only check how you combine its result."
      - CPython limits recursion depth (default 1000, see `sys.getrecursionlimit()`), raises `RecursionError` beyond it, and does not optimise tail calls.
      - Any recursive algorithm can be rewritten as a loop with an explicit stack, which avoids the depth limit.
    misconceptions:
      - Naive recursive Fibonacci is slow because it recomputes the same sub-problems exponentially often, not because recursion itself is slow.
      - Raising the recursion limit does not fix a missing or unreachable base case; it only delays the crash.
    interview: Interviewers ask you to trace the call stack, identify the base case and state the cost, including O(depth) stack space.
    sources:
      - title: "Composing Programs, 1.7 Recursive Functions"
        url: https://composingprograms.com/pages/17-recursive-functions.html
        publisher: John DeNero (UC Berkeley)
      - title: sys.getrecursionlimit
        url: https://docs.python.org/3/library/sys.html#sys.getrecursionlimit
        publisher: Python Software Foundation
  - id: cs.searching
    title: Linear and binary search
    module: algorithms
    level: intermediate
    priority: essential
    summary: Linear search checks every item (O(n)); binary search halves a sorted range each step (O(log n)) and is easy to get subtly wrong.
    requires: [cs.complexity, python.while-loops]
    why: Lookups are the most common operation in software, and choosing a linear scan, binary search or hash lookup decides whether they scale.
    keyIdeas:
      - Linear search works on any sequence and costs O(n); `x in my_list` and `my_list.index(x)` are linear scans.
      - Binary search needs sorted data and compares with the middle element to discard half the range, so a million items need at most about 20 comparisons.
      - Fix an invariant (for example "the answer is in `[lo, hi)`") and keep the loop condition and updates consistent with it; mixing conventions causes off-by-one errors and infinite loops.
      - "`bisect.bisect_left` and `bisect.bisect_right` return insertion points in a sorted list; prefer them to hand-written loops."
      - Binary search works on any monotonic yes/no question ("the smallest x for which the condition holds"), not only on arrays.
    misconceptions:
      - Sorting data only to run one binary search costs O(n log n), worse than a single O(n) linear scan.
      - Binary search on unsorted data does not raise an error; it silently returns wrong answers.
    interview: A bug-free binary search, including empty input, duplicates and the first/last-occurrence variants, is a classic interview task.
    sources:
      - title: bisect — Array bisection algorithm
        url: https://docs.python.org/3/library/bisect.html
        publisher: Python Software Foundation
      - title: "MIT 6.006 Introduction to Algorithms (Spring 2020)"
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        publisher: MIT OpenCourseWare
  - id: cs.sorting
    title: Sorting algorithms
    module: algorithms
    level: intermediate
    priority: essential
    summary: Selection, insertion, merge and quick sort illustrate O(n²) vs O(n log n) trade-offs, stability and in-place sorting; Python's built-in sort is Timsort.
    requires: [cs.complexity, cs.recursion]
    why: Sorted data enables binary search, grouping, deduplication and merging, and knowing how sorts work explains their cost, memory use and stability.
    keyIdeas:
      - Selection and insertion sort are O(n²); insertion sort is still fast on small or nearly sorted inputs.
      - Merge sort is O(n log n) in every case and stable but needs O(n) extra memory; quicksort averages O(n log n) in place but degrades to O(n²) with consistently bad pivots.
      - No comparison sort beats O(n log n) in the worst case; counting and radix sort can when keys are small integers.
      - A stable sort keeps equal items in their original order, so sorting by a secondary key and then by the primary key gives a correct multi-key sort.
      - "`sorted()` and `list.sort()` use Timsort, an adaptive, stable merge sort (current CPython versions use the \"powersort\" merge policy), and accept `key=` and `reverse=`."
    misconceptions:
      - "`list.sort()` sorts in place and returns `None`; `sorted()` returns a new list."
      - You rarely implement a sort in production; the real skill is choosing keys and knowing the cost.
    interview: Expect to compare merge sort and quicksort on complexity, stability and memory, and to write custom sort keys fluently.
    sources:
      - title: Sorting Techniques
        url: https://docs.python.org/3/howto/sorting.html
        publisher: Python Software Foundation
      - title: "listsort.txt: description of CPython's list sort"
        url: https://github.com/python/cpython/blob/main/Objects/listsort.txt
        publisher: CPython developers
  - id: cs.two-pointers-sliding-window
    title: Two pointers and sliding windows
    module: algorithms
    level: intermediate
    priority: supporting
    summary: Moving two indices through a sequence, or a window over it, turns many O(n²) scans into O(n) passes.
    requires: [cs.complexity, python.slicing, cs.sorting]
    why: Many array and string problems, such as finding a pair with a given sum or the longest substring without repeats, have an obvious quadratic solution and a linear one.
    keyIdeas:
      - "Opposite ends: on a sorted array start `lo = 0` and `hi = len(a) - 1` and move one pointer inward based on a comparison (sum too small means `lo += 1`)."
      - "Same direction (slow/fast): one index reads and the other writes, which filters or deduplicates a list in place in O(n)."
      - "Sliding window: grow the right edge each step and shrink the left edge while the window violates the condition."
      - Keep the window's state up to date incrementally (a running sum or a dict of counts) instead of recomputing it for every window.
      - Because each pointer only moves forward and at most n times, the total work is O(n) even though the code contains a nested loop.
    misconceptions:
      - A `while` loop inside a `for` loop is not automatically O(n²); if the inner pointer never moves backwards the total is O(n) (amortised analysis).
      - Two pointers relies on order; on unsorted data you usually need to sort first (O(n log n)) or use a hash set instead.
    interview: A staple coding-interview pattern; interviewers check that you can explain why moving a pointer never skips a valid answer.
    sources:
      - title: "Competitive Programmer's Handbook (two pointers method)"
        url: https://cses.fi/book/book.pdf
        publisher: Antti Laaksonen (CSES)
  - id: cs.greedy
    title: Greedy algorithms
    module: algorithms
    level: advanced
    priority: supporting
    summary: Making the locally best choice at each step works only for problems with the right structure; proving or disproving it is the real skill.
    requires: [cs.sorting]
    why: Greedy algorithms are often the simplest and fastest solution (scheduling, Huffman coding, minimum spanning trees), but they silently give wrong answers on problems without the right structure.
    keyIdeas:
      - A greedy algorithm builds a solution by repeatedly taking the choice that looks best now and never revisiting it.
      - It is correct only when the problem has the greedy-choice property and optimal substructure; the usual proof is an exchange argument.
      - Correct examples include interval scheduling by earliest finish time, Huffman coding, Dijkstra's algorithm and Kruskal's and Prim's minimum spanning tree algorithms.
      - Coin change with coins {1, 3, 4} and target 6 shows a failure (greedy picks 4+1+1, the optimum is 3+3), as does 0/1 knapsack.
      - Greedy solutions usually start by sorting or by using a heap, so they typically run in O(n log n).
    misconceptions:
      - Passing a few test cases does not prove a greedy algorithm correct; actively search for a counterexample.
    interview: Interviewers ask you to justify why the greedy choice is safe, or to find a counterexample and switch to dynamic programming.
    sources:
      - title: "Algorithms, Chapter 4: Greedy Algorithms"
        url: https://jeffe.cs.illinois.edu/teaching/algorithms/book/04-greedy.pdf
        publisher: Jeff Erickson (University of Illinois)
      - title: "Competitive Programmer's Handbook (greedy algorithms)"
        url: https://cses.fi/book/book.pdf
        publisher: Antti Laaksonen (CSES)
  - id: cs.dynamic-programming
    title: Dynamic programming
    module: algorithms
    level: advanced
    priority: supporting
    summary: Solve overlapping sub-problems once and reuse the answers, via memoisation (top-down) or tabulation (bottom-up).
    requires: [cs.recursion, python.dictionaries, python.decorators]
    why: Problems such as edit distance, knapsack and counting routes have exponentially many naive solutions; dynamic programming makes them polynomial by solving each sub-problem once.
    keyIdeas:
      - Dynamic programming applies when a problem has optimal substructure and overlapping sub-problems.
      - Define the state precisely first (for example `dp[i]` = best answer using the first i items), then the recurrence that relates it to smaller states and the base cases.
      - "Top-down: write the recursion and cache results, e.g. with `@functools.cache`. Bottom-up: fill a table in an order where every dependency is already computed."
      - Running time is roughly the number of states times the work per state; naive recursive Fibonacci is O(2ⁿ), memoised it is O(n).
      - Often only the previous row or two of the table are needed, cutting memory from O(n·m) to O(m).
    misconceptions:
      - Memoisation only helps when sub-problems repeat; caching a divide-and-conquer algorithm such as merge sort gains nothing.
      - "`functools.cache` needs hashable arguments and grows without bound; use `lru_cache(maxsize=...)` when memory matters."
    interview: Interviewers look for a clear state definition and recurrence before any code, then the complexity and possible space optimisation.
    sources:
      - title: "Algorithms, Chapter 3: Dynamic Programming"
        url: https://jeffe.cs.illinois.edu/teaching/algorithms/book/03-dynprog.pdf
        publisher: Jeff Erickson (University of Illinois)
      - title: functools.cache
        url: https://docs.python.org/3/library/functools.html#functools.cache
        publisher: Python Software Foundation
  - id: cs.bit-manipulation
    title: Bit manipulation
    module: algorithms
    level: advanced
    priority: optional
    summary: Bitwise operators (& | ^ ~ << >>) act on the binary representation of integers, enabling flags, masks and compact tricks.
    requires: [foundations.binary-and-data, python.numbers]
    why: Permission flags, network masks, hash functions, file formats and compact sets all work directly on the bits of integers.
    keyIdeas:
      - "`&` (and), `|` (or), `^` (xor) and `~` (not) combine bits; `x << k` multiplies by 2ᵏ and `x >> k` floor-divides by 2ᵏ."
      - Test, set, clear and toggle bit k with `x & (1 << k)`, `x | (1 << k)`, `x & ~(1 << k)` and `x ^ (1 << k)`.
      - "`x & (x - 1)` clears the lowest set bit, so `x > 0 and x & (x - 1) == 0` tests whether x is a power of two."
      - Python integers are unbounded and behave like infinite two's complement (`~5 == -6`); mask with e.g. `x & 0xFF` to emulate fixed-width integers.
      - "`bin()`, `int(s, 2)`, `int.bit_length()` and `int.bit_count()` (Python 3.10+) inspect bits; `enum.Flag` gives readable, combinable flags."
    misconceptions:
      - "`^` is exclusive or in Python, not exponentiation; use `**` for powers."
      - Bit tricks are rarely faster than clear code in Python; use them for compact representation, not speed.
    sources:
      - title: Bitwise Operations on Integer Types
        url: https://docs.python.org/3/builtins/stdtypes.html#bitwise-operations-on-integer-types
        publisher: Python Software Foundation
      - title: enum.Flag
        url: https://docs.python.org/3/library/enum.html#enum.Flag
        publisher: Python Software Foundation
  # -------------------------------------------------------- data-structures
  - id: cs.dynamic-arrays
    title: Arrays and dynamic arrays
    module: data-structures
    level: intermediate
    priority: essential
    summary: Contiguous memory gives O(1) indexing; dynamic arrays such as Python lists over-allocate so appends are amortised O(1) while inserts at the front are O(n).
    requires: [cs.complexity, python.lists]
    why: Python lists are the default container, and their memory layout decides which operations are cheap and which quietly make a loop quadratic.
    keyIdeas:
      - An array stores elements in one contiguous block, so the address of element i can be computed directly and indexing is O(1).
      - A dynamic array keeps spare capacity; when it is full it allocates a larger block (proportional to the current size) and copies, which makes `append` amortised O(1).
      - Inserting or deleting at the front or middle (`insert(0, x)`, `pop(0)`, `del a[i]`) shifts every later element, costing O(n).
      - CPython lists store references to objects rather than the objects themselves, which is why one list can hold mixed types.
      - For large numeric data, the `array` module and NumPy arrays store raw values contiguously and use far less memory.
    misconceptions:
      - "`pop()` from the end is O(1) but `pop(0)` is O(n); use `collections.deque` for queues."
      - "`x in my_list` is a linear scan, not a lookup."
    interview: Expect to explain why `append` is amortised O(1) and why inserting at the front is O(n).
    production: Repeated `insert(0, ...)` or `pop(0)` on large lists inside a loop is a common hidden O(n²) slowdown.
    sources:
      - title: "Design and History FAQ: How are lists implemented in CPython?"
        url: https://docs.python.org/3/faq/design.html#how-are-lists-implemented-in-cpython
        publisher: Python Software Foundation
      - title: Open Data Structures
        url: https://opendatastructures.org/
        publisher: Pat Morin
  - id: cs.hashing
    title: Hash functions and hash tables
    module: data-structures
    level: intermediate
    priority: essential
    summary: A hash function maps keys to buckets so dicts and sets find items in O(1) on average; collisions, load factor and hashability explain their behaviour.
    requires: [cs.complexity, python.dictionaries, python.sets, cs.dynamic-arrays]
    why: Dicts and sets give near-instant lookup by key and underpin caching, deduplication, counting, joins and indexes.
    keyIdeas:
      - A hash function turns a key into an integer that selects a slot in an array, so lookup, insert and delete are O(1) on average.
      - Collisions (different keys, same slot) are resolved by chaining or by probing other slots (CPython uses open addressing); many collisions degrade operations toward O(n).
      - When the load factor (items divided by slots) gets too high the table resizes and rehashes, so an occasional insert is slow while the average stays O(1).
      - "Keys must be hashable: `a == b` must imply `hash(a) == hash(b)`, and the hash must not change while the key is stored, which is why lists cannot be dict keys."
      - String and bytes hashes are randomised per process (see `PYTHONHASHSEED`) to resist collision attacks, so never store `hash()` values between runs.
    misconceptions:
      - Hash tables do not keep keys sorted; dicts preserve insertion order (guaranteed since Python 3.7) but sets have no defined order.
      - "`hash()` is not a cryptographic hash; use `hashlib` (e.g. SHA-256) for integrity checks and security."
    interview: Interviewers ask how hash tables achieve O(1) lookups, what happens on collisions, and why mutable objects make bad keys.
    sources:
      - title: "Glossary: hashable"
        url: https://docs.python.org/3/glossary.html#term-hashable
        publisher: Python Software Foundation
      - title: "Data model: object.__hash__"
        url: https://docs.python.org/3/reference/datamodel.html#object.__hash__
        publisher: Python Software Foundation
      - title: Open Data Structures
        url: https://opendatastructures.org/
        publisher: Pat Morin
  - id: cs.stacks-queues
    title: Stacks, queues and deques
    module: data-structures
    level: intermediate
    priority: essential
    summary: Stacks are last-in-first-out, queues first-in-first-out; collections.deque gives O(1) operations at both ends.
    requires: [cs.dynamic-arrays, python.stdlib]
    why: Undo history, bracket matching, depth-first search and the call stack itself are stacks; job queues, buffers and breadth-first search are queues.
    keyIdeas:
      - "A stack (LIFO) pushes and pops at the same end; a list's `append()` and `pop()` are both O(1)."
      - "A queue (FIFO) adds at the back and removes from the front; `collections.deque` gives O(1) `append()` and `popleft()`."
      - "`deque(maxlen=n)` keeps only the last n items, which is handy for recent-history buffers and sliding windows."
      - "`queue.Queue` is a thread-safe FIFO for producer-consumer code, and `asyncio.Queue` is the asyncio equivalent."
    misconceptions:
      - Using `list.pop(0)` as a queue works but costs O(n) per removal.
      - "`deque` indexing in the middle is O(n); it is not a drop-in replacement for a list."
    interview: Typical tasks are matching brackets with a stack, implementing a queue with two stacks, and using a deque for BFS.
    sources:
      - title: "The Python Tutorial: Using Lists as Stacks"
        url: https://docs.python.org/3/tutorial/datastructures.html#using-lists-as-stacks
        publisher: Python Software Foundation
      - title: collections.deque
        url: https://docs.python.org/3/library/collections.html#collections.deque
        publisher: Python Software Foundation
  - id: cs.linked-lists
    title: Linked lists
    module: data-structures
    level: intermediate
    priority: supporting
    summary: Nodes that point to the next node allow O(1) insertion at a known position but O(n) indexing, the opposite trade-off to arrays.
    requires: [cs.dynamic-arrays, python.classes]
    why: Linked lists are the pointer-based alternative to arrays; they appear inside LRU caches, schedulers and allocators, and in many interview problems.
    keyIdeas:
      - Each node holds a value and a reference to the next node (and to the previous one in a doubly linked list); the list is reached through its head.
      - Inserting or removing next to a node you already hold is O(1); reaching the i-th node means walking from the head, which is O(n).
      - Nodes are scattered in memory, so traversal is cache-unfriendly and usually slower than iterating an array.
      - Classic techniques are a dummy head node to remove edge cases and fast/slow pointers to find the middle or detect a cycle.
      - In Python you rarely write one yourself; `collections.deque` and `collections.OrderedDict` cover most uses.
    misconceptions:
      - Linked lists are not generally "faster for insertion"; finding the position first is O(n) unless you already hold the node.
    interview: Expect pointer-manipulation tasks such as reversing a list, merging two sorted lists or detecting a cycle.
    sources:
      - title: Open Data Structures
        url: https://opendatastructures.org/
        publisher: Pat Morin
  - id: cs.trees
    title: Trees and binary search trees
    module: data-structures
    level: intermediate
    priority: essential
    summary: Hierarchical structures with a root and children; binary search trees keep keys ordered for O(log n) search when balanced, and traversals visit nodes in defined orders.
    requires: [cs.recursion, python.classes]
    why: File systems, the HTML DOM, JSON documents, syntax trees and database indexes are all trees.
    keyIdeas:
      - A tree has a single root, every other node has exactly one parent, nodes without children are leaves, and height is the longest root-to-leaf path.
      - In a binary search tree every key in a node's left subtree is smaller and every key in its right subtree is larger.
      - Search, insert and delete cost O(height), which is O(log n) when balanced but O(n) if keys arrive in sorted order and the tree degenerates into a chain.
      - Self-balancing trees (AVL, red-black) and B-trees (used by database indexes) keep the height logarithmic.
      - Depth-first traversals are pre-order, in-order and post-order (in-order on a BST yields sorted keys); level-order traversal is BFS with a queue.
    misconceptions:
      - A binary tree is not necessarily a binary search tree; only a BST has the ordering rule.
      - Python has no built-in balanced BST (dicts are hash tables); use `bisect` on a sorted list or a third-party library such as sortedcontainers.
    interview: Recursive tree problems (height, validating a BST, lowest common ancestor, traversals) are among the most common interview questions.
    sources:
      - title: "MIT 6.006 Introduction to Algorithms (Spring 2020)"
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        publisher: MIT OpenCourseWare
      - title: Open Data Structures
        url: https://opendatastructures.org/
        publisher: Pat Morin
  - id: cs.heaps
    title: Heaps and priority queues
    module: data-structures
    level: intermediate
    priority: supporting
    summary: A binary heap always exposes the smallest (or largest) item in O(1) and inserts/removes in O(log n); Python provides heapq.
    requires: [cs.trees, cs.dynamic-arrays]
    why: Schedulers, top-k queries, merging sorted streams and shortest-path algorithms all need "give me the next most important item" quickly.
    keyIdeas:
      - A binary min-heap is a complete binary tree in which every parent is less than or equal to its children, so the minimum is at the root.
      - It is stored in a plain array where the children of index i are at 2i+1 and 2i+2, so no node objects or pointers are needed.
      - Push and pop sift an item up or down in O(log n), peeking at the minimum is O(1), and `heapify` builds a heap from a list in O(n).
      - "`heapq` is a min-heap on a list; for max-heaps negate the keys, and push `(priority, counter, item)` tuples to break ties."
      - "`heapq.nlargest`, `heapq.nsmallest` and `heapq.merge` solve top-k and k-way merge directly."
    misconceptions:
      - A heap is not sorted; only the first element is guaranteed to be the smallest.
      - When tuple priorities tie, Python compares the next elements, which raises `TypeError` if they are not comparable; add a counter.
    interview: Expect top-k, k-way merge and "median of a stream" problems, and an explanation of why heap operations are O(log n).
    sources:
      - title: heapq — Heap queue algorithm
        url: https://docs.python.org/3/library/heapq.html
        publisher: Python Software Foundation
      - title: Open Data Structures
        url: https://opendatastructures.org/
        publisher: Pat Morin
  - id: cs.graphs
    title: Graphs, BFS and DFS
    module: data-structures
    level: intermediate
    priority: essential
    summary: Nodes connected by edges model networks, dependencies and maps; adjacency lists, breadth-first and depth-first search are the core tools.
    requires: [cs.stacks-queues, python.dictionaries, cs.recursion]
    why: Social networks, road maps, package dependencies, web links, knowledge graphs and agent workflows are graphs, and most questions about them reduce to a traversal.
    keyIdeas:
      - A graph is a set of vertices joined by edges, which may be directed or undirected and weighted or unweighted.
      - Adjacency lists (`dict[node, list[node]]`) suit sparse graphs; an adjacency matrix answers "is there an edge?" in O(1) but uses O(V²) memory.
      - Breadth-first search explores level by level with a queue and finds shortest paths (fewest edges) in unweighted graphs.
      - Depth-first search goes as deep as possible first, using recursion or an explicit stack, and finds connected components, cycles and topological orders.
      - Both run in O(V + E); always track visited nodes in a set, or cycles cause infinite loops.
    misconceptions:
      - DFS does not find shortest paths in unweighted graphs; BFS does.
      - Trees are special graphs (connected, no cycles); general graphs can have cycles, so visited tracking is mandatory.
    interview: Grids, word ladders, course schedules and friend networks are graph problems in disguise; interviewers check that you can model them and pick BFS or DFS.
    sources:
      - title: "MIT 6.006 Introduction to Algorithms (Spring 2020)"
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        publisher: MIT OpenCourseWare
      - title: Open Data Structures
        url: https://opendatastructures.org/
        publisher: Pat Morin
  - id: cs.shortest-paths
    title: Shortest paths and topological sort
    module: data-structures
    level: advanced
    priority: supporting
    summary: Dijkstra's algorithm finds shortest weighted paths with a priority queue; topological sort orders dependencies in a DAG.
    requires: [cs.graphs, cs.heaps]
    why: Route planning and network routing need weighted shortest paths, and build systems, package managers and pipeline orchestrators need a valid order for dependent tasks.
    keyIdeas:
      - Dijkstra's algorithm repeatedly settles the unsettled vertex with the smallest known distance, using a min-heap; with a binary heap it runs in O((V + E) log V).
      - Dijkstra requires non-negative edge weights; with negative weights use Bellman-Ford (O(V·E)), which also detects negative cycles.
      - In an unweighted graph plain BFS already gives shortest paths in O(V + E).
      - A topological sort orders a directed acyclic graph so every edge points from an earlier node to a later one; Kahn's algorithm repeatedly removes nodes with no incoming edges.
      - If the sort cannot place every node, the graph has a cycle; Python's `graphlib.TopologicalSorter` raises `CycleError`.
    misconceptions:
      - A topological order is usually not unique; any order that respects every edge is valid.
    interview: Expect "course schedule" style dependency problems and an explanation of why Dijkstra fails with negative edges.
    production: Task schedulers and orchestrators topologically sort dependency graphs and must report cycles clearly instead of hanging.
    sources:
      - title: graphlib — Functionality to operate with graph-like structures
        url: https://docs.python.org/3/library/graphlib.html
        publisher: Python Software Foundation
      - title: "Algorithms, Chapter 8: Shortest Paths"
        url: https://jeffe.cs.illinois.edu/teaching/algorithms/book/08-sssp.pdf
        publisher: Jeff Erickson (University of Illinois)
  # --------------------------------------------------------------- paradigms
  - id: cs.abstraction
    title: Abstraction, encapsulation and interfaces
    module: paradigms
    level: intermediate
    priority: essential
    summary: Hide details behind a small, stable interface so the rest of the program depends on what something does, not how.
    requires: [python.functions, python.classes]
    why: Without clear boundaries every change ripples through the whole codebase; abstraction lets you swap an implementation (a database, an LLM provider) without touching its callers.
    keyIdeas:
      - An abstraction exposes what a component does (its interface) and hides how it does it (its implementation).
      - Encapsulation keeps internal state behind methods so invariants cannot be broken from outside; in Python a leading underscore marks a name as internal by convention.
      - Depend on the behaviour you need, expressed as an abstract base class (`abc.ABC`) or a structural `typing.Protocol`, rather than on a concrete class.
      - Good interfaces are small, stable and hard to misuse; the best modules hide a lot of complexity behind a simple API.
      - "Information hiding (Parnas, 1972): put each design decision that is likely to change inside a single module."
    misconceptions:
      - Python has no truly private attributes; a double underscore triggers name mangling, not access control.
      - Adding layers is not the same as abstraction; a wrapper that exposes every detail of what it wraps hides nothing.
    interview: Interviewers ask how you would let code switch between two implementations (e.g. storage backends) without changing its callers.
    sources:
      - title: "The Python Tutorial: Classes (private variables)"
        url: https://docs.python.org/3/tutorial/classes.html#private-variables
        publisher: Python Software Foundation
      - title: abc — Abstract Base Classes
        url: https://docs.python.org/3/library/abc.html
        publisher: Python Software Foundation
      - title: "typing.Protocol"
        url: https://docs.python.org/3/library/typing.html#typing.Protocol
        publisher: Python Software Foundation
  - id: cs.oop-principles
    title: Object-oriented design principles
    module: paradigms
    level: intermediate
    priority: essential
    summary: Encapsulation, composition over inheritance, polymorphism and cohesive classes with clear responsibilities.
    requires: [cs.abstraction, python.inheritance]
    why: Classes organised around clear responsibilities keep large programs changeable; badly designed hierarchies make every change risky.
    keyIdeas:
      - "Encapsulation: an object owns its data and exposes behaviour that keeps that data valid."
      - "Polymorphism: callers use one interface (e.g. `shape.area()`) and each class supplies its own behaviour; Python's duck typing makes this structural."
      - Prefer composition ("has-a") to inheritance ("is-a"); inheritance couples a subclass tightly to its parent's internals.
      - Aim for high cohesion (a class has one clear purpose) and low coupling (it depends on few other classes).
      - Ask objects to do work rather than pulling out their data and making decisions for them ("tell, don't ask").
    misconceptions:
      - Not everything needs a class; in Python plain functions and modules are often the simpler design.
      - Deep hierarchies copied from real-world taxonomies ("Animal, Mammal, Dog") rarely match what the software actually needs.
    interview: Expect questions on composition vs inheritance, polymorphism examples, and modelling a small domain (parking lot, library) with classes.
    sources:
      - title: "The Python Tutorial: Classes"
        url: https://docs.python.org/3/tutorial/classes.html
        publisher: Python Software Foundation
      - title: "Python Design Patterns: The Composition Over Inheritance Principle"
        url: https://python-patterns.guide/gang-of-four/composition-over-inheritance/
        publisher: Brandon Rhodes
  - id: cs.functional-programming
    title: Functional programming principles
    module: paradigms
    level: intermediate
    priority: supporting
    summary: Pure functions, immutability and avoiding side effects make code easier to test and reason about; Python supports these styles without enforcing them.
    requires: [python.higher-order-functions, python.mutability]
    why: Hidden side effects and shared mutable state are a major source of bugs; pure functions are easy to test, cache, parallelise and reason about.
    keyIdeas:
      - A pure function's result depends only on its arguments and it has no side effects (no I/O, no mutation of outside state).
      - Return new values instead of mutating arguments; tuples, `frozenset` and `@dataclass(frozen=True)` make immutability explicit.
      - Functions are values that can be passed to `map`, `filter`, `sorted(key=...)` and `functools.reduce`, or returned from other functions.
      - "Functional core, imperative shell: keep decision logic pure and push I/O (files, network, clock, randomness) to the edges."
      - Python is multi-paradigm; comprehensions are usually preferred to `map`/`filter` with lambdas, and there is no tail-call optimisation.
    misconceptions:
      - Immutability in Python is shallow; a tuple that contains a list can still change.
      - Functional style does not mean no state; it means making state changes explicit and isolated.
    sources:
      - title: Functional Programming HOWTO
        url: https://docs.python.org/3/howto/functional.html
        publisher: Python Software Foundation
      - title: functools — Higher-order functions and operations on callable objects
        url: https://docs.python.org/3/library/functools.html
        publisher: Python Software Foundation
  - id: cs.solid
    title: SOLID principles
    module: paradigms
    level: advanced
    priority: supporting
    summary: Five heuristics — single responsibility, open/closed, Liskov substitution, interface segregation, dependency inversion — for flexible object-oriented code, to apply with judgement.
    requires: [cs.oop-principles]
    why: They give names to recurring causes of rigid, fragile code, which helps teams discuss and review designs.
    keyIdeas:
      - "Single responsibility: a module should have one reason to change, meaning it serves one group of stakeholders."
      - "Open/closed: add behaviour by adding new code (e.g. a new strategy class) rather than editing code that already works."
      - "Liskov substitution: a subclass must work anywhere its parent is expected, without stronger preconditions or surprising behaviour."
      - "Interface segregation: clients should not depend on methods they do not use; prefer several small Protocols to one large one."
      - "Dependency inversion: high-level policy depends on abstractions, and concrete details (databases, HTTP clients) are passed in."
    misconceptions:
      - SOLID is a set of heuristics popularised by Robert C. Martin, not laws; applying every principle everywhere produces over-engineered code.
      - Single responsibility does not mean a class should have only one method or do only one tiny thing.
    interview: Expect to explain each principle with an example, often Liskov substitution (the square/rectangle problem) and dependency inversion for testability.
    sources:
      - title: The Single Responsibility Principle
        url: https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html
        publisher: Robert C. Martin
      - title: The Open Closed Principle
        url: https://blog.cleancoder.com/uncle-bob/2014/05/12/TheOpenClosedPrinciple.html
        publisher: Robert C. Martin
  - id: cs.design-patterns
    title: Design patterns
    module: paradigms
    level: advanced
    priority: supporting
    summary: Named, reusable solutions — strategy, factory, adapter, observer, decorator, dependency injection — and when Python's features make them unnecessary.
    requires: [cs.oop-principles, python.higher-order-functions]
    why: Patterns give teams a shared vocabulary for common designs and help you recognise when a known solution fits, or when it is overkill.
    keyIdeas:
      - Patterns are named solutions to recurring design problems, catalogued in the 1994 "Gang of Four" book; the shared names matter as much as the code.
      - "Strategy: pass in interchangeable behaviour; in Python a plain function argument often suffices."
      - "Factory centralises object creation so callers do not depend on concrete classes; Adapter wraps an object to match the interface callers expect."
      - "Observer notifies subscribers of events; the Decorator pattern wraps an object to add behaviour."
      - "Dependency injection: pass collaborators in (as constructor or function arguments) instead of creating them inside, so tests can substitute fakes."
    misconceptions:
      - More patterns do not make better code; first-class functions, modules and duck typing make several classic patterns (Singleton, Command) unnecessary in Python.
      - Python's `@decorator` syntax and the Gang of Four Decorator pattern are related ideas, not the same thing.
    interview: Interviewers ask when you would use a given pattern, and how you would make a hard-wired dependency testable.
    sources:
      - title: Python Design Patterns
        url: https://python-patterns.guide/
        publisher: Brandon Rhodes
  - id: cs.clean-code
    title: Clean, readable code
    module: paradigms
    level: beginner
    priority: essential
    summary: Intention-revealing names, small focused functions, consistent style and comments that explain why make code cheaper to change.
    requires: [python.functions, python.style]
    why: Code is read far more often than it is written; readable code is faster to review, debug and change, by others and by you in six months.
    keyIdeas:
      - Names reveal intent (`elapsed_days`, not `d`); functions are verbs (`load_orders`), and booleans read as questions (`is_valid`).
      - Keep functions small and at one level of abstraction; if you need "and" to describe one, split it.
      - Follow PEP 8 and let tools such as Ruff or Black enforce formatting, so reviews focus on substance.
      - Comments explain why, not what; docstrings describe the contract (arguments, return value, errors raised).
      - Remove duplicated knowledge, but prefer a little duplication to the wrong abstraction.
    misconceptions:
      - Short code is not the same as clear code; dense one-liners are often harder to read and debug.
      - Consistency within a codebase matters more than any individual style preference.
    tools: [Ruff, Black]
    interview: In take-home and live coding exercises interviewers judge naming, function size and readability as well as correctness.
    sources:
      - title: "PEP 8: Style Guide for Python Code"
        url: https://peps.python.org/pep-0008/
        publisher: Python Software Foundation
      - title: "PEP 20: The Zen of Python"
        url: https://peps.python.org/pep-0020/
        publisher: Python Software Foundation
      - title: Google Python Style Guide
        url: https://google.github.io/styleguide/pyguide.html
        publisher: Google
  - id: cs.refactoring
    title: Refactoring
    module: paradigms
    level: intermediate
    priority: essential
    summary: Improving the structure of code without changing its behaviour, in small safe steps protected by tests.
    requires: [cs.clean-code, python.testing]
    why: Code naturally decays as features are added; continuous refactoring keeps it cheap to change instead of needing a risky rewrite.
    keyIdeas:
      - Refactoring changes structure, never behaviour; keep behaviour changes in separate commits.
      - Work in small steps, run the tests after each one and commit often, so any step can be undone.
      - Common refactorings include rename, extract function or variable, inline, move function, introduce parameter object and replace conditional with polymorphism.
      - Code smells that prompt refactoring include long functions, duplicated logic, long parameter lists and changes that require edits in many places.
      - Before refactoring untested code, add characterisation tests that pin down its current behaviour.
    misconceptions:
      - A big rewrite is not refactoring; the defining property is that the code keeps working at every step.
      - Refactoring is not a separate project phase; do it continuously ("make the change easy, then make the easy change").
    interview: Interviewers ask how you would safely improve a messy legacy function that has no tests.
    sources:
      - title: Refactoring catalog
        url: https://refactoring.com/catalog/
        publisher: Martin Fowler
  # ------------------------------------------------------------- engineering
  - id: cs.testing-strategy
    title: Testing strategy
    module: engineering
    level: intermediate
    priority: essential
    summary: Unit, integration and end-to-end tests, the test pyramid, test-driven development, coverage and what makes a test valuable.
    requires: [python.testing]
    why: A test suite you trust lets you change code quickly; one that is slow, flaky or tied to implementation details slows everyone down.
    keyIdeas:
      - Unit tests check one small piece in isolation in milliseconds; integration tests check components together (e.g. code plus a real database); end-to-end tests drive the whole system as a user would.
      - "The test pyramid: many fast unit tests, fewer integration tests and a small number of slow end-to-end tests."
      - Valuable tests are deterministic, independent and fast, and check behaviour through public interfaces rather than implementation details.
      - "Test-driven development cycles red, green, refactor: write a failing test, make it pass simply, then clean up."
      - Coverage shows which lines ran, not whether their results were checked; high coverage can still miss bugs.
    misconceptions:
      - More mocks do not make better unit tests; over-mocking tests the mocks and breaks on every refactor.
      - Flaky tests are not harmless; they teach the team to ignore failures.
    tools: [pytest, coverage.py, Hypothesis]
    interview: Interviewers ask how you would test a feature, what you would mock, and how you balance unit and integration tests.
    production: Run the suite in CI on every pull request and fix or quarantine flaky tests quickly so a red build always means something.
    sources:
      - title: The Practical Test Pyramid
        url: https://martinfowler.com/articles/practical-test-pyramid.html
        publisher: Ham Vocke (martinfowler.com)
      - title: "Software Engineering at Google, Chapter 11: Testing Overview"
        url: https://abseil.io/resources/swe-book/html/ch11.html
        publisher: Google (O'Reilly, free online edition)
      - title: pytest documentation
        url: https://docs.pytest.org/en/stable/
        publisher: pytest-dev
  - id: cs.code-review
    title: Code review
    module: engineering
    level: intermediate
    priority: essential
    summary: Reviewing changes for correctness, clarity, risk and maintainability, and giving and receiving feedback constructively.
    requires: [cs.clean-code, tooling.pull-requests]
    why: Review catches defects and security problems before they ship and spreads knowledge of the codebase across the team.
    keyIdeas:
      - Review in priority order (correctness and security, design, tests, readability) and leave formatting to automated tools.
      - Small, focused changes with a description of why get careful reviews; huge diffs get rubber-stamped.
      - Comment on the code, not the person; explain the reasoning behind requests and label optional suggestions (e.g. "nit:").
      - Approve once the change clearly improves the overall health of the code, even if it is not exactly how you would have written it.
      - As an author, review your own diff first, respond to every comment, and treat questions as a sign the code or description needs to be clearer.
    misconceptions:
      - Review is not a gate for the reviewer's personal style preferences.
      - An approval does not transfer responsibility; the author still owns the correctness of the change.
    interview: Behavioural interviews ask what you look for in a review and how you handle disagreement with a reviewer.
    sources:
      - title: Google Engineering Practices — Code Review
        url: https://google.github.io/eng-practices/review/
        publisher: Google
      - title: "Software Engineering at Google, Chapter 9: Code Review"
        url: https://abseil.io/resources/swe-book/html/ch09.html
        publisher: Google (O'Reilly, free online edition)
  - id: cs.sdlc
    title: The software development lifecycle
    module: engineering
    level: beginner
    priority: supporting
    summary: How software moves from idea to production and maintenance — requirements, design, build, test, release, operate — under agile and other process models.
    requires: [cs.problem-decomposition]
    why: Knowing how work flows from idea to production explains why teams plan, review, test and release the way they do, and where your work fits.
    keyIdeas:
      - Typical phases are requirements, design, implementation, testing, release, and operation and maintenance; maintenance usually lasts longest and costs most.
      - Waterfall runs the phases once in sequence; iterative and agile approaches repeat them in short cycles to get feedback early.
      - Scrum works in fixed-length sprints of one month or less with planning, daily scrums, a review and a retrospective; Kanban manages a continuous flow with limits on work in progress.
      - DevOps practices (continuous integration and delivery, monitoring, on-call) shorten the loop from commit to feedback from production.
    misconceptions:
      - Agile does not mean no planning or no documentation; the Agile Manifesto values working software more, not documentation never.
      - Agile is a set of values and principles, not a single process; Scrum and Kanban are specific frameworks.
    sources:
      - title: Manifesto for Agile Software Development
        url: https://agilemanifesto.org/
        publisher: Agile Manifesto authors
      - title: The Scrum Guide
        url: https://scrumguides.org/scrum-guide.html
        publisher: Ken Schwaber and Jeff Sutherland
  - id: cs.requirements-docs
    title: Requirements and technical documentation
    module: engineering
    level: intermediate
    priority: essential
    summary: User stories, acceptance criteria, design documents, architecture decision records and READMEs that let others build on your work.
    requires: [cs.sdlc]
    why: Most project failures come from building the wrong thing or from knowledge that lives only in one person's head; written requirements and docs prevent both.
    keyIdeas:
      - A user story says who wants what and why ("As a ..., I want ..., so that ..."); acceptance criteria, often written as Given/When/Then, make it testable.
      - Separate functional requirements (what the system does) from non-functional ones (latency, availability, security, cost), which drive the architecture.
      - A design doc states context, goals and non-goals, the proposed design, alternatives considered and risks, and is reviewed before major build work starts.
      - An architecture decision record (ADR) is a short, dated note of one decision with its context and consequences; ADRs are superseded, not edited.
      - A README tells a newcomer what the project does and how to install, run, test and get help.
    misconceptions:
      - Documentation is not written once at the end; update it in the same change that alters behaviour.
      - The first thing a stakeholder asks for is not always the requirement; ask why to uncover the real problem and constraints.
    interview: Interviewers ask how you clarify ambiguous requirements and how you document and communicate design decisions.
    sources:
      - title: Architectural Decision Records
        url: https://adr.github.io/
        publisher: ADR GitHub organization
      - title: Diátaxis documentation framework
        url: https://diataxis.fr/
        publisher: Daniele Procida
      - title: "Software Engineering at Google, Chapter 10: Documentation"
        url: https://abseil.io/resources/swe-book/html/ch10.html
        publisher: Google (O'Reilly, free online edition)
  - id: cs.dependency-management
    title: Dependency management and versioning
    module: engineering
    level: intermediate
    priority: essential
    summary: Semantic versioning, version ranges vs pins, lock files, transitive dependencies and the risk every dependency adds.
    requires: [python.virtual-environments]
    why: Unpinned or unmanaged dependencies cause "works on my machine" failures, surprise breakages and security incidents.
    keyIdeas:
      - Semantic versioning uses MAJOR.MINOR.PATCH, where breaking changes bump MAJOR, compatible features bump MINOR and fixes bump PATCH; 0.x versions promise no stability.
      - Libraries declare compatible ranges (e.g. `requests>=2.31,<3`, using PEP 440 syntax); applications pin exact versions in a lock file so every install is identical.
      - Lock files record the whole transitive dependency tree, ideally with hashes; examples are `uv.lock`, `poetry.lock`, pip-tools output and the standard `pylock.toml` (PEP 751), whose tool support is still evolving.
      - Every dependency adds supply-chain risk, upgrade work and possible conflicts; check its maintenance, licence and size before adding it.
      - Update regularly in small steps (e.g. Dependabot or Renovate pull requests) and scan for known vulnerabilities with tools such as `pip-audit`.
    misconceptions:
      - Pinning without ever updating is not safe; it accumulates unpatched vulnerabilities and makes the eventual upgrade larger and riskier.
      - Not every project follows semantic versioning strictly; read the changelog before upgrading.
    tools: [pip, uv, pip-audit, Dependabot]
    interview: Interviewers ask about the difference between version ranges and lock files and how you keep dependencies secure and current.
    production: Production builds should install only from the lock file so they run exactly what CI tested.
    sources:
      - title: Semantic Versioning 2.0.0
        url: https://semver.org/
        publisher: semver.org
      - title: Version specifiers
        url: https://packaging.python.org/en/latest/specifications/version-specifiers/
        publisher: Python Packaging Authority
      - title: "PEP 751: A file format to record Python dependencies for installation reproducibility"
        url: https://peps.python.org/pep-0751/
        publisher: Python Software Foundation
  - id: cs.concurrency-fundamentals
    title: Concurrency fundamentals
    module: engineering
    level: advanced
    priority: essential
    summary: Shared state accessed by concurrent tasks causes race conditions; locks, atomic operations and message passing prevent them, at the risk of deadlock.
    requires: [python.concurrency, foundations.operating-systems]
    why: Web servers, data pipelines and agent systems all do many things at once, and concurrency bugs are among the hardest to reproduce and fix.
    keyIdeas:
      - A race condition occurs when the result depends on the timing of tasks sharing mutable state; `count += 1` is a read-modify-write, not an atomic step.
      - A lock (`threading.Lock`, used as `with lock:`) makes a critical section run in only one thread at a time.
      - Deadlock requires mutual exclusion, hold-and-wait, no preemption and circular wait; acquiring locks in one fixed global order prevents it.
      - Message passing (e.g. `queue.Queue`) and immutable data avoid shared mutable state altogether.
      - Concurrency means making progress on several tasks at once; parallelism means executing at the same instant. asyncio is concurrent on a single thread.
    misconceptions:
      - The GIL does not make Python code thread-safe; threads can switch between bytecode instructions, so compound operations still race, and free-threaded builds (Python 3.13+) remove the GIL entirely.
      - A race that does not reproduce is not fixed; timing bugs may appear only under production load.
    interview: Expect to explain a race condition, how a lock fixes it and how to avoid deadlock.
    production: Prefer higher-level tools (queues, executors, database transactions) to hand-rolled locks, and load-test concurrent code because races often appear only under load.
    sources:
      - title: threading — Thread-based parallelism
        url: https://docs.python.org/3/library/threading.html
        publisher: Python Software Foundation
      - title: "Operating Systems: Three Easy Pieces (Concurrency)"
        url: https://pages.cs.wisc.edu/~remzi/OSTEP/
        publisher: Remzi and Andrea Arpaci-Dusseau
  - id: cs.architecture-tradeoffs
    title: Architectural trade-offs
    module: engineering
    level: advanced
    priority: essential
    summary: Coupling and cohesion, modularity, layering and explicit trade-off analysis — every design choice buys something and costs something.
    requires: [cs.abstraction, cs.design-patterns]
    why: Architecture decisions are expensive to reverse; making their costs explicit up front avoids systems that are slow to change or costly to run.
    keyIdeas:
      - Coupling is how much modules depend on each other; cohesion is how closely a module's contents belong together. Aim for low coupling and high cohesion.
      - Layering (e.g. API, service, data access) lets each layer change independently at the cost of extra indirection.
      - Every option trades qualities such as simplicity, performance, scalability, consistency, cost and delivery speed; state which qualities matter most for this system.
      - Move fast on decisions that are cheap to reverse and invest analysis in those that are hard to undo, such as data models and public APIs.
      - Record significant decisions and the alternatives you rejected (e.g. as ADRs) so future engineers understand the context.
    misconceptions:
      - There is no universally best architecture; microservices, for example, trade simpler code per service for much more operational complexity.
      - Designing for hypothetical future scale usually costs more than it saves; design for known requirements while keeping options open.
    interview: System-design interviews reward naming the trade-offs of each option explicitly rather than presenting one "right" answer.
    sources:
      - title: Software Architecture Guide
        url: https://martinfowler.com/architecture/
        publisher: Martin Fowler
      - title: "Software Engineering at Google, Chapter 1: What Is Software Engineering?"
        url: https://abseil.io/resources/swe-book/html/ch01.html
        publisher: Google (O'Reilly, free online edition)
  - id: cs.backtracking
    title: Backtracking
    module: algorithms
    level: advanced
    priority: supporting
    summary: Build candidate solutions step by step and undo (backtrack) a choice as soon as it cannot lead to a valid answer — the pattern behind subsets, permutations and constraint puzzles.
    why: Many search problems have no clever formula; backtracking explores the possibilities systematically while pruning dead ends early.
    requires: [cs.recursion, python.lists]
    keyIdeas:
      - "The template: choose an option, recurse on the smaller problem, then undo the choice before trying the next option."
      - Pruning (stopping as soon as a partial solution breaks a constraint) is what makes backtracking practical.
      - Subsets of n items number 2^n and permutations n!, so the worst case is exponential; state the bound explicitly.
      - "Copy the partial solution when recording an answer (`results.append(path[:])`), because the same list keeps changing."
    misconceptions:
      - Forgetting to undo the choice, or appending the live list instead of a copy, is the most common bug; it silently corrupts later answers.
    interview: Generate all subsets or permutations, or solve N-queens, explaining the recursion tree and its complexity.
    sources:
      - title: Open Data Structures (free textbook)
        url: https://opendatastructures.org/
        publisher: Pat Morin
      - title: MIT 6.006 Introduction to Algorithms (OpenCourseWare)
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        publisher: MIT OpenCourseWare
  - id: cs.union-find
    title: Union-find (disjoint sets)
    module: data-structures
    level: advanced
    priority: optional
    summary: Track which items belong to the same group, merging groups and answering "are these connected?" in nearly constant time.
    why: Connectivity questions (networks, clustering, Kruskal's minimum spanning tree, cycle detection) appear often and are slow with naive approaches.
    requires: [cs.graphs, cs.dynamic-arrays]
    keyIdeas:
      - Each set is a tree stored in a parent array; `find` follows parents to the root that names the set.
      - "`union` links one root under the other; union by rank or size keeps the trees shallow."
      - Path compression points visited nodes directly at the root, making operations almost O(1) amortised.
    misconceptions:
      - Union-find answers connectivity, not paths; it cannot tell you the route between two items.
    interview: Count connected components or detect a cycle in an undirected graph with union-find, and state its amortised complexity.
    sources:
      - title: MIT 6.006 Introduction to Algorithms (OpenCourseWare)
        url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
        publisher: MIT OpenCourseWare
  - id: cs.tries
    title: Tries (prefix trees)
    module: data-structures
    level: advanced
    priority: optional
    summary: A tree keyed by characters where each path spells a prefix, giving fast prefix search for autocomplete and dictionaries.
    why: Prefix queries such as autocomplete are awkward with hash tables but natural with tries.
    requires: [cs.trees, python.dictionaries]
    keyIdeas:
      - Each node maps a character to a child node (a dict in Python) and marks whether a word ends there.
      - Insert and lookup cost O(length of the word), independent of how many words are stored.
      - Collecting all words below a prefix node gives autocomplete results.
    misconceptions:
      - Tries are not automatically smaller than a set of strings; without compression they often use more memory.
    interview: Implement insert, search and starts_with for a trie and compare it with using a set of words.
    sources:
      - title: Open Data Structures (free textbook)
        url: https://opendatastructures.org/
        publisher: Pat Morin
