id: interview
order: 21
title: Technical Interviews and Engineering Mastery
shortTitle: Interviews
summary: >-
  How to solve problems under pressure, communicate reasoning, design systems out loud, walk through
  projects and handle debugging, ML and GenAI interviews.
why: >-
  Knowing the material is necessary but not sufficient. Interviews — and real engineering work — reward a
  clear process and clear communication.
modules:
  - id: process
    title: Problem-solving process
    summary: A repeatable method for coding problems.
  - id: formats
    title: Interview formats
    summary: Coding, system design, ML/GenAI and debugging interviews.
  - id: communication
    title: Communication
    summary: Explaining, writing and presenting your work.
concepts:
  - id: interview.problem-solving-process
    title: A problem-solving process for coding interviews
    module: process
    level: intermediate
    priority: essential
    summary: Clarify the problem, work examples, state a brute force, improve it, code it cleanly, then test edge cases — out loud.
    why: Under time pressure people jump into code and get stuck; a fixed process keeps you moving and shows the interviewer how you think.
    requires: [cs.problem-decomposition, cs.complexity]
    keyIdeas:
      - Clarify first - restate the problem and ask about input size, types, edge cases (empty input, duplicates, negative numbers) and the expected output.
      - Work one or two examples by hand, including an edge case, before writing any code.
      - State a brute-force solution with its time and space complexity, then find its bottleneck and improve it (hashing, sorting, two pointers, precomputation).
      - Agree the approach with the interviewer, then write clean code with meaningful names while narrating your reasoning.
      - Test by tracing the code on an example and then on edge cases; fix bugs calmly and state the final complexity.
    misconceptions:
      - Silence is not focus to an interviewer; they can only credit reasoning they hear.
      - Aiming straight for the optimal solution without a brute force often ends with nothing working.
    interview: Interviewers usually grade communication, problem solving, code quality and testing, not just whether the final code passes.
    sources:
      - title: Coding interview techniques
        url: https://www.techinterviewhandbook.org/coding-interview-techniques/
        publisher: Tech Interview Handbook (Yangshun Tay)
  - id: interview.coding-interviews
    title: Coding interviews
    module: formats
    level: intermediate
    priority: essential
    summary: Recognise common patterns (hashing, two pointers, BFS/DFS, heaps, dynamic programming) and practise deliberately with timed, explained solutions.
    why: Coding interviews remain the most common filter for engineering roles, and a modest set of patterns covers most of the questions.
    requires: [interview.problem-solving-process, cs.hashing, cs.two-pointers-sliding-window, cs.graphs, cs.heaps, cs.dynamic-programming]
    keyIdeas:
      - Map clues to patterns - pair or duplicate lookups suggest a hash map or set; sorted input suggests two pointers or binary search; contiguous ranges suggest a sliding window or prefix sums; shortest path in an unweighted graph suggests BFS; top-k suggests a heap; counting ways or best value with overlapping subproblems suggests dynamic programming.
      - Know core costs - dict and set lookup O(1) on average, sorting O(n log n), heap push and pop O(log n), BFS and DFS O(V + E).
      - Practise deliberately - timed problems grouped by pattern, review solutions you could not finish, and re-solve them a few days later.
      - Explain trade-offs aloud and write readable Python (small helpers, clear names) rather than clever one-liners.
    misconceptions:
      - Memorising hundreds of solutions works less well than understanding a few dozen patterns deeply.
      - The optimal answer is not the only signal; a correct, tested brute force with a clear improvement plan often scores better than a buggy optimal attempt.
    interview: Expect one or two problems in a 45-60 minute session, followed by questions on complexity and variations of the problem.
    sources:
      - title: Coding interview study plan
        url: https://www.techinterviewhandbook.org/coding-interview-study-plan/
        publisher: Tech Interview Handbook (Yangshun Tay)
      - title: Data structures and algorithms study cheatsheets
        url: https://www.techinterviewhandbook.org/algorithms/study-cheatsheet/
        publisher: Tech Interview Handbook (Yangshun Tay)
  - id: interview.system-design-interviews
    title: System design interviews
    module: formats
    level: advanced
    priority: essential
    summary: Drive a 45-minute design discussion — requirements, estimates, high-level design, deep dives and trade-offs.
    why: Mid-level and senior roles almost always include a design round; it tests whether you can reason about trade-offs at scale, not whether you have memorised architectures.
    requires: [architecture.system-design-basics, architecture.capacity-estimation]
    keyIdeas:
      - A typical flow - requirements and scope (about 5-10 minutes), rough estimates, API and data model, high-level design, deep dives into one or two components, then bottlenecks and trade-offs.
      - Drive the conversation - propose a plan, check in with the interviewer, and go deep where they show interest.
      - Draw a clear diagram (clients, load balancer, services, stores, caches, queues) with labelled data flows.
      - Justify every component by a requirement and name the alternative you rejected and why.
      - Cover failure modes - what happens when each component fails, how you would monitor it, and what changes at 10x the load.
    misconceptions:
      - Naming many technologies is not depth; explaining why one choice fits the requirements is.
      - There is no single correct answer; interviewers assess reasoning and trade-offs.
    interview: Common prompts include a URL shortener, news feed, chat system and rate limiter, and increasingly an LLM-backed or RAG service.
    sources:
      - title: The System Design Primer
        url: https://github.com/donnemartin/system-design-primer
        publisher: Donne Martin (GitHub)
      - title: System design interview guide
        url: https://www.techinterviewhandbook.org/system-design/
        publisher: Tech Interview Handbook (Yangshun Tay)
  - id: interview.ml-interviews
    title: Machine learning interviews
    module: formats
    level: advanced
    priority: supporting
    summary: Explain models, metrics and leakage, and design ML systems from data collection to monitoring.
    why: ML roles test both theory and judgement - whether you can choose the right model and metric, avoid leakage and get a model working in production.
    requires: [ml.evaluation-metrics, mlops.model-serving]
    keyIdeas:
      - Expect fundamentals - bias and variance, regularisation, and common models (linear and logistic regression, trees and gradient boosting, neural networks) with when each fits.
      - Choose metrics from the cost of errors - precision, recall, F1 or PR-AUC for imbalanced classes, ROC-AUC for ranking quality, and calibration when probabilities are used directly.
      - Data leakage is a favourite probe - features unavailable at prediction time, preprocessing fitted on all data, or random splits on time-ordered data.
      - ML system design covers problem framing, data collection and labelling, features, a baseline, training, offline evaluation, serving, monitoring and retraining.
      - Always start from a simple baseline and explain how you would know a complex model is worth its cost.
    misconceptions:
      - Accuracy is rarely the right metric for imbalanced problems.
      - Interviewers do not want the fanciest model; they want sound framing, evaluation and an operational plan.
    interview: Design a spam or fraud detection system end to end, including how you would handle delayed labels and drift.
    sources:
      - title: Introduction to Machine Learning Interviews (free book)
        url: https://huyenchip.com/ml-interviews-book/
        publisher: Chip Huyen
      - title: Rules of Machine Learning
        url: https://developers.google.com/machine-learning/guides/rules-of-ml
        publisher: Google
  - id: interview.genai-interviews
    title: Generative AI and agent interviews
    module: formats
    level: advanced
    priority: supporting
    summary: Discuss RAG and agent architectures, evaluation, failure modes, security and cost with concrete trade-offs.
    why: GenAI roles are new and fast-moving; interviewers look for engineers who can build reliable LLM systems, not just call an API.
    requires: [architecture.ai-system-design, mlops.llmops]
    keyIdeas:
      - Compare prompting, RAG, fine-tuning and agents, and say when each fits - missing knowledge usually calls for retrieval, a behaviour or format problem for prompting or fine-tuning, and taking actions for tools.
      - Explain RAG end to end - chunking, embeddings, hybrid search, reranking, context limits, citations - and evaluate retrieval and generation separately.
      - Discuss failure modes and mitigations - hallucination, prompt injection, tool misuse, stale indexes, latency spikes and runaway cost.
      - Show an evaluation mindset - golden datasets, LLM-as-judge calibrated against humans, online feedback and regression tests in CI.
      - Quantify trade-offs in tokens, latency, cost per request and quality; the field moves quickly, so reason from principles rather than quoting specific model names or prices.
    misconceptions:
      - Knowing the latest framework matters less than understanding the mechanics underneath it.
      - Fine-tuning is rarely the first answer to a knowledge problem; retrieval usually is.
    interview: Design an agent that schedules meetings from incoming emails - cover tools, permissions, injection risks, evaluation and fallbacks.
    sources:
      - title: Building effective AI agents
        url: https://www.anthropic.com/research/building-effective-agents
        publisher: Anthropic
      - title: Building A Generative AI Platform
        url: https://huyenchip.com/2024/07/25/genai-platform.html
        publisher: Chip Huyen
      - title: OWASP Top 10 for LLM Applications
        url: https://genai.owasp.org/llm-top-10/
        publisher: OWASP Gen AI Security Project
        version: "2025"
  - id: interview.debugging-interviews
    title: Debugging and code-review interviews
    module: formats
    level: intermediate
    priority: supporting
    summary: Read unfamiliar code, reproduce the bug, reason about hypotheses and explain fixes and risks.
    why: Much real engineering is reading and fixing existing code; debugging and code-review rounds test exactly that.
    requires: [python.debugging, cs.code-review]
    keyIdeas:
      - Read before changing - find the entry point, follow the data flow and confirm what correct behaviour should be.
      - Reproduce the bug reliably, ideally as a failing test, before trying any fix.
      - Form one hypothesis at a time and test it with prints, logging, the debugger (`breakpoint()` opens pdb) or by bisecting the input or the history.
      - Explain the root cause, the fix, its risks and the test that prevents the bug from returning.
      - In code review, prioritise correctness, security and design over style, and phrase comments as suggestions with reasons.
    misconceptions:
      - Changing several things at once to see whether it works hides which change mattered.
      - Code review is not a hunt for typos; formatting is the linter's job.
    interview: Interviewers watch the process - reproducing, narrowing down and verifying - more than how fast you spot the bug.
    sources:
      - title: How to do a code review
        url: https://google.github.io/eng-practices/review/reviewer/
        publisher: Google Engineering Practices
      - title: pdb — The Python Debugger
        url: https://docs.python.org/3/library/pdb.html
        publisher: Python Software Foundation
      - title: Debugging Rules! (the nine rules)
        url: https://debuggingrules.com/
        publisher: David J. Agans
  - id: interview.technical-communication
    title: Technical communication
    module: communication
    level: intermediate
    priority: essential
    summary: Explain at the right level for the audience, structure answers, draw clear diagrams and write concise design documents.
    why: Clear explanations multiply an engineer's impact; unclear ones waste meetings, lead to wrong decisions and hide good work.
    requires: [cs.requirements-docs]
    keyIdeas:
      - Know your audience - lead with the conclusion or recommendation, then the reasoning, and adjust the detail for executives, peers or newcomers.
      - Structure answers as context, problem, options, decision, trade-offs and next steps.
      - Give diagrams a title, labelled arrows and one level of abstraction at a time; the C4 model's levels (context, containers, components, code) help.
      - A design document states goals and non-goals, the proposed design, alternatives considered with their trade-offs, and open questions - before implementation starts.
      - Prefer short sentences, concrete examples and numbers over vague adjectives.
    misconceptions:
      - More detail is not clearer; choosing what to leave out is part of the skill.
      - Design documents are not bureaucracy; they are cheaper than discovering a flawed design in code review.
    interview: Many interviews include an "explain this to a non-technical stakeholder" question to check structure and clarity.
    sources:
      - title: Technical Writing courses
        url: https://developers.google.com/tech-writing
        publisher: Google for Developers
      - title: Design Docs at Google
        url: https://www.industrialempathy.com/posts/design-docs-at-google/
        publisher: Malte Ubl (Industrial Empathy)
      - title: The C4 model
        url: https://c4model.com/
        publisher: Simon Brown
  - id: interview.project-walkthroughs
    title: Project walkthroughs and behavioural questions
    module: communication
    level: intermediate
    priority: essential
    summary: Present projects with context, your decisions, trade-offs, results and lessons (STAR), and answer questions about incidents and collaboration.
    why: Projects and past experience are your evidence; telling them clearly shows ownership, judgement and impact better than any certificate.
    requires: [interview.technical-communication]
    keyIdeas:
      - STAR - Situation (context), Task (your responsibility), Action (what you did; say "I", not only "we") and Result (a measured outcome), followed by what you learned.
      - A project walkthrough covers the problem and users, the architecture, key decisions and alternatives, one hard bug or trade-off, results with numbers, and what you would do differently.
      - Prepare about five to eight stories covering a success, a failure, a conflict, an incident, leadership and learning something new, and adapt them to each question.
      - Be honest about scope and your own contribution; interviewers probe with follow-up questions.
    misconceptions:
      - Talking about a failure is not a weakness when you show what you changed afterwards.
      - Listing technologies is not a walkthrough; explain why you chose them.
    interview: Expect deep follow-ups on any project on your CV, such as "why that database?" or "what would break at 10x the traffic?".
    sources:
      - title: Behavioral interviews for software engineers
        url: https://www.techinterviewhandbook.org/behavioral-interview/
        publisher: Tech Interview Handbook (Yangshun Tay)
      - title: Using the STAR method for your next behavioral interview
        url: https://capd.mit.edu/resources/the-star-method-for-behavioral-interviews/
        publisher: MIT Career Advising and Professional Development
