id: python
order: 2
title: Python — Absolute Beginner to Advanced
shortTitle: Python
summary: >-
  The Python language from your first print() to decorators, concurrency, packaging, testing
  and the internals that explain surprising behaviour.
why: >-
  Python is the working language of data science, machine learning, generative AI tooling and a
  large share of backend services. Fluency here makes every later stage faster.
modules:
  - id: basics
    title: First steps
    summary: Running code, values, variables, numbers, strings and input/output.
  - id: control-flow
    title: Making decisions and repeating work
    summary: Booleans, conditions, loops and pattern matching.
  - id: collections
    title: Collections and references
    summary: Lists, tuples, dictionaries, sets, slicing, mutability and copying.
  - id: functions
    title: Functions
    summary: Defining functions, parameters, scope, lambdas and higher-order functions.
  - id: errors
    title: Errors and debugging
    summary: Exceptions, tracebacks, raising errors and systematic debugging.
  - id: files-modules
    title: Files, modules and the standard library
    summary: Reading and writing files, paths, CSV/JSON, imports, packages and key stdlib modules.
  - id: intermediate
    title: Idiomatic Python
    summary: Comprehensions, iteration protocols, generators, closures, decorators and context managers.
  - id: oop
    title: Object-oriented Python
    summary: Classes, the data model, inheritance vs composition, dataclasses, enums and protocols.
  - id: quality
    title: Professional practice
    summary: Type hints, static analysis, testing, logging, style, environments and packaging.
  - id: performance
    title: Performance, concurrency and internals
    summary: Profiling, threads, processes, asyncio, memory management and secure coding.
concepts:
  # ---------------------------------------------------------------- basics
  - id: python.first-program
    title: Your first program — print, comments and errors
    module: basics
    level: beginner
    priority: essential
    summary: A Python program is a text file of statements executed top to bottom; print() shows values, comments explain code, and error messages tell you what went wrong.
    requires: [foundations.programs-and-languages]
    keyIdeas:
      - Statements run one after another, from top to bottom.
      - Text values (strings) need quotes; numbers do not.
      - "`#` starts a comment, which Python ignores."
      - A SyntaxError means Python could not even read the program; nothing runs.
    misconceptions:
      - print() does not "return" or store anything; it only displays text.
    sources:
      - title: "The Python Tutorial: An Informal Introduction to Python"
        url: https://docs.python.org/3/tutorial/introduction.html
        publisher: Python Software Foundation
  - id: python.setup
    title: Installing and running Python locally
    module: basics
    level: beginner
    priority: essential
    summary: Installing CPython, running scripts and the interactive REPL from a terminal, and confirming which interpreter you are using.
    requires: [foundations.installing-tools, python.first-program]
    keyIdeas:
      - "`python --version` (or `py --version` on Windows) shows which interpreter runs."
      - "`python script.py` runs a file; `python` alone starts the interactive REPL."
      - Multiple Python versions can be installed; virtual environments (later) keep projects separate.
    misconceptions:
      - "`pip install` may install into a different Python than the one you run if PATH is confusing; prefer `python -m pip`."
    tools: [CPython, py launcher, VS Code]
    sources:
      - title: Python Setup and Usage
        url: https://docs.python.org/3/using/index.html
        publisher: Python Software Foundation
  - id: python.variables
    title: Variables and assignment
    module: basics
    level: beginner
    priority: essential
    summary: A variable is a name bound to an object; assignment evaluates the right-hand side first and then makes the name refer to the result.
    requires: [python.first-program]
    keyIdeas:
      - "`=` means bind, not equals: evaluate the right side, then attach the name."
      - Names refer to objects; several names can refer to the same object.
      - Rebinding a name never changes other names.
      - Names have no fixed type; objects do.
    misconceptions:
      - Variables are not boxes that hold copies of values.
      - "`b = a` does not create a link that updates b when a is rebound later."
    interview: Explain the difference between a name and an object, and what `b = a` does.
    sources:
      - title: "Python Language Reference: Naming and binding"
        url: https://docs.python.org/3/reference/executionmodel.html#naming-and-binding
        publisher: Python Software Foundation
  - id: python.numbers
    title: Numbers and arithmetic
    module: basics
    level: beginner
    priority: essential
    summary: Integers and floats, the arithmetic operators, operator precedence, and the limits of floating-point arithmetic.
    requires: [python.variables]
    keyIdeas:
      - "`/` always produces a float; `//` floors; `%` gives the remainder; `**` raises to a power."
      - Python integers have arbitrary precision; floats are 64-bit binary approximations.
      - Precedence follows maths conventions; parentheses make intent explicit.
    misconceptions:
      - "`0.1 + 0.2 == 0.3` is False because of binary floating point, not a Python bug."
      - "`//` rounds toward negative infinity, so `-7 // 2` is -4, not -3."
    sources:
      - title: "Built-in Types: Numeric Types"
        url: https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex
        publisher: Python Software Foundation
  - id: python.strings
    title: Strings
    module: basics
    level: beginner
    priority: essential
    summary: Strings are immutable sequences of Unicode characters with indexing, slicing, concatenation and many useful methods.
    requires: [python.variables]
    keyIdeas:
      - Single, double and triple quotes create strings; escapes like \n add special characters.
      - Strings are immutable; methods such as upper() return new strings.
      - "`+` joins strings; `*` repeats them; `len()` counts characters."
    misconceptions:
      - Calling `name.upper()` does not change `name` unless you reassign the result.
    sources:
      - title: "Built-in Types: Text Sequence Type — str"
        url: https://docs.python.org/3/library/stdtypes.html#text-sequence-type-str
        publisher: Python Software Foundation
  - id: python.type-conversion
    title: Types and type conversion
    module: basics
    level: beginner
    priority: essential
    summary: Every object has a type; int(), float(), str() and bool() create converted values, and mixing types without converting causes TypeErrors.
    requires: [python.numbers, python.strings]
    keyIdeas:
      - "`type(x)` reveals an object's type."
      - Conversion creates a new object; it does not change the original.
      - "`int(\"3.5\")` fails; `int(3.9)` truncates to 3."
    misconceptions:
      - "`\"5\" + 3` is not 8 in Python; it is a TypeError."
    sources:
      - title: Built-in Functions
        url: https://docs.python.org/3/library/functions.html
        publisher: Python Software Foundation
  - id: python.input-output
    title: Input and output
    module: basics
    level: beginner
    priority: essential
    summary: input() reads a line of text from the user, print() writes text, and f-strings format values for display.
    requires: [python.type-conversion]
    keyIdeas:
      - input() always returns a string; convert it before doing arithmetic.
      - print() accepts several values, plus sep= and end= options.
      - "f-strings (`f\"{name} is {age}\"`) embed expressions and format specifiers like `{price:.2f}`."
    misconceptions:
      - Numbers typed by a user are still text until converted.
    sources:
      - title: "The Python Tutorial: Input and Output"
        url: https://docs.python.org/3/tutorial/inputoutput.html
        publisher: Python Software Foundation
  # ---------------------------------------------------------- control-flow
  - id: python.booleans
    title: Booleans, comparisons and logic
    module: control-flow
    level: beginner
    priority: essential
    summary: Comparisons produce True or False; and/or/not combine conditions with short-circuit evaluation; every object has a truth value.
    requires: [python.numbers, python.strings, python.type-conversion]
    keyIdeas:
      - "`==` compares values; `is` compares identity."
      - "`and`/`or` short-circuit and return one of their operands."
      - Empty containers, 0, None and "" are falsy.
    misconceptions:
      - "`x == 1 or 2` is always truthy; write `x == 1 or x == 2` or `x in (1, 2)`."
    sources:
      - title: "Built-in Types: Truth Value Testing"
        url: https://docs.python.org/3/library/stdtypes.html#truth-value-testing
        publisher: Python Software Foundation
  - id: python.conditionals
    title: Conditional statements
    module: control-flow
    level: beginner
    priority: essential
    summary: if/elif/else choose which block runs; indentation defines the blocks.
    requires: [python.booleans, python.input-output]
    keyIdeas:
      - Only the first true branch of an if/elif chain runs.
      - Indentation is syntax in Python, not decoration.
      - Order elif conditions from most specific to most general.
    misconceptions:
      - Separate if statements are not the same as an if/elif chain.
    sources:
      - title: "The Python Tutorial: if Statements"
        url: https://docs.python.org/3/tutorial/controlflow.html#if-statements
        publisher: Python Software Foundation
  - id: python.while-loops
    title: While loops
    module: control-flow
    level: beginner
    priority: essential
    summary: A while loop repeats while its condition is true; something inside must eventually make it false.
    requires: [python.conditionals, python.input-output]
    keyIdeas:
      - The condition is checked before every iteration.
      - Loop variables must be updated or the loop never ends.
      - Use while when the number of repetitions is not known in advance.
    misconceptions:
      - The condition is not re-checked in the middle of the loop body.
    sources:
      - title: "Python Language Reference: The while statement"
        url: https://docs.python.org/3/reference/compound_stmts.html#the-while-statement
        publisher: Python Software Foundation
  - id: python.for-loops
    title: For loops and range
    module: control-flow
    level: beginner
    priority: essential
    summary: A for loop takes each item of an iterable in turn; range() produces sequences of integers.
    requires: [python.while-loops]
    keyIdeas:
      - "`for x in items:` binds x to each item in order."
      - "`range(stop)`, `range(start, stop)`, `range(start, stop, step)` — stop is excluded."
      - "`enumerate()` gives index and item; `zip()` walks several iterables together."
    misconceptions:
      - "`range(1, 5)` does not include 5."
      - Assigning to the loop variable does not change the list being looped over.
    sources:
      - title: "The Python Tutorial: for Statements"
        url: https://docs.python.org/3/tutorial/controlflow.html#for-statements
        publisher: Python Software Foundation
  - id: python.loop-control
    title: break, continue and loop else
    module: control-flow
    level: beginner
    priority: supporting
    summary: break exits a loop early, continue skips to the next iteration, and a loop's else block runs only if no break happened.
    requires: [python.for-loops]
    keyIdeas:
      - break leaves only the innermost loop.
      - "loop-else is a 'no break happened' clause, handy for searches."
    misconceptions:
      - A loop's else does not mean "if the loop did not run".
    sources:
      - title: "The Python Tutorial: break and continue Statements"
        url: https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements
        publisher: Python Software Foundation
  - id: python.pattern-matching
    title: Structural pattern matching
    module: control-flow
    level: intermediate
    priority: supporting
    summary: The match statement compares a value against patterns that can destructure sequences, mappings and objects.
    requires: [python.conditionals, python.dictionaries, python.classes]
    keyIdeas:
      - Patterns can capture parts of a value into names.
      - "`case _:` is the wildcard (default) case."
    misconceptions:
      - A bare name in a case pattern captures; it does not compare against an existing variable.
    sources:
      - title: "PEP 636: Structural Pattern Matching — Tutorial"
        url: https://peps.python.org/pep-0636/
        publisher: Python Software Foundation
  # ------------------------------------------------------------ collections
  - id: python.lists
    title: Lists
    module: collections
    level: beginner
    priority: essential
    summary: Lists are ordered, mutable sequences; you can index, slice, append, insert, remove and sort them.
    requires: [python.for-loops]
    keyIdeas:
      - Indexes start at 0; negative indexes count from the end.
      - "append/insert/remove/pop/sort change the list in place and mostly return None."
      - "`sorted(lst)` returns a new list; `lst.sort()` sorts in place."
    misconceptions:
      - "`lst = lst.sort()` sets lst to None."
    sources:
      - title: "The Python Tutorial: More on Lists"
        url: https://docs.python.org/3/tutorial/datastructures.html#more-on-lists
        publisher: Python Software Foundation
  - id: python.slicing
    title: Indexing and slicing sequences
    module: collections
    level: beginner
    priority: essential
    summary: Sequences (strings, lists, tuples) share indexing and slicing syntax `seq[start:stop:step]`.
    requires: [python.lists]
    keyIdeas:
      - Slices exclude the stop index and never raise IndexError.
      - "`seq[::-1]` reverses a sequence."
      - Slicing a list creates a new (shallow) list.
    sources:
      - title: "Built-in Types: Common Sequence Operations"
        url: https://docs.python.org/3/library/stdtypes.html#common-sequence-operations
        publisher: Python Software Foundation
  - id: python.tuples
    title: Tuples and unpacking
    module: collections
    level: beginner
    priority: essential
    summary: Tuples are immutable sequences, ideal for fixed groups of values; unpacking assigns their parts to several names at once.
    requires: [python.lists]
    keyIdeas:
      - "Commas make tuples: `point = 3, 4`."
      - "Unpacking: `x, y = point`; extended unpacking: `first, *rest = items`."
      - Tuples can be dictionary keys when their contents are hashable.
    misconceptions:
      - "`(5)` is just 5; a one-item tuple needs a comma: `(5,)`."
    sources:
      - title: "The Python Tutorial: Tuples and Sequences"
        url: https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences
        publisher: Python Software Foundation
  - id: python.dictionaries
    title: Dictionaries
    module: collections
    level: beginner
    priority: essential
    summary: Dictionaries map hashable keys to values with fast lookup, preserving insertion order.
    requires: [python.lists, python.tuples]
    keyIdeas:
      - "`d[key]` raises KeyError if missing; `d.get(key, default)` does not."
      - Iterate with `.items()` to get keys and values together.
      - Keys must be hashable (immutable built-ins such as str, int, tuple).
    misconceptions:
      - Dictionaries do not allow duplicate keys; assigning again replaces the value.
    sources:
      - title: "The Python Tutorial: Dictionaries"
        url: https://docs.python.org/3/tutorial/datastructures.html#dictionaries
        publisher: Python Software Foundation
  - id: python.sets
    title: Sets
    module: collections
    level: beginner
    priority: supporting
    summary: Sets store unique hashable items with fast membership tests and mathematical operations like union and intersection.
    requires: [python.dictionaries]
    keyIdeas:
      - "`x in s` is fast on average regardless of set size."
      - "`{}` is an empty dict; use `set()` for an empty set."
    misconceptions:
      - Sets are unordered; do not rely on the order they print in.
    sources:
      - title: "The Python Tutorial: Sets"
        url: https://docs.python.org/3/tutorial/datastructures.html#sets
        publisher: Python Software Foundation
  - id: python.mutability
    title: Mutability, identity and references
    module: collections
    level: beginner
    priority: essential
    summary: Mutable objects can change in place, so every name referring to them sees the change; `is` checks identity, `==` checks equality.
    requires: [python.lists, python.tuples, python.dictionaries]
    extends: [python.variables]
    confusedWith: [python.copying]
    keyIdeas:
      - Aliasing - two names, one object - is harmless for immutable objects and surprising for mutable ones.
      - In-place operations (append, +=, item assignment) mutate; rebinding does not.
      - "`id()` and `is` reveal identity."
    misconceptions:
      - Assigning a list to a new name does not copy it.
      - "`[[0] * 3] * 3` creates three references to the same inner list."
    interview: Why does modifying a list inside a function affect the caller's list?
    sources:
      - title: "Python Language Reference: Objects, values and types"
        url: https://docs.python.org/3/reference/datamodel.html#objects-values-and-types
        publisher: Python Software Foundation
  - id: python.copying
    title: Shallow and deep copies
    module: collections
    level: intermediate
    priority: supporting
    summary: A shallow copy creates a new outer container that shares inner objects; a deep copy recursively copies everything.
    requires: [python.mutability]
    keyIdeas:
      - "`lst.copy()`, `lst[:]`, `list(lst)` and `copy.copy()` are shallow."
      - "`copy.deepcopy()` copies nested structures, at a cost."
    sources:
      - title: copy — Shallow and deep copy operations
        url: https://docs.python.org/3/library/copy.html
        publisher: Python Software Foundation
  # --------------------------------------------------------------- functions
  - id: python.functions
    title: Defining and calling functions
    module: functions
    level: beginner
    priority: essential
    summary: Functions package reusable steps behind a name; parameters receive arguments and return sends a value back to the caller.
    requires: [python.conditionals, python.for-loops, python.lists, python.tuples]
    keyIdeas:
      - Defining a function does not run it; calling it does.
      - A function without a return statement returns None.
      - Return values let functions be composed; printing does not.
    misconceptions:
      - print() inside a function is not the same as returning a value.
    sources:
      - title: "The Python Tutorial: Defining Functions"
        url: https://docs.python.org/3/tutorial/controlflow.html#defining-functions
        publisher: Python Software Foundation
  - id: python.parameters
    title: Parameters and arguments in depth
    module: functions
    level: intermediate
    priority: essential
    summary: Positional and keyword arguments, defaults, *args and **kwargs, and keyword-only/positional-only parameters.
    requires: [python.functions, python.tuples, python.dictionaries]
    keyIdeas:
      - Default values are evaluated once, when the function is defined.
      - "*args collects extra positional arguments as a tuple; **kwargs collects keyword arguments as a dict."
      - Arguments are passed by object reference (names are bound to the caller's objects).
    misconceptions:
      - A mutable default like `def f(items=[])` is shared between calls.
    sources:
      - title: "The Python Tutorial: More on Defining Functions"
        url: https://docs.python.org/3/tutorial/controlflow.html#more-on-defining-functions
        publisher: Python Software Foundation
  - id: python.scope
    title: Scope and namespaces
    module: functions
    level: intermediate
    priority: essential
    summary: Python looks names up in Local, Enclosing, Global and Built-in scopes (LEGB); assignment inside a function creates a local name unless declared global or nonlocal.
    requires: [python.functions]
    keyIdeas:
      - Each call gets a fresh local namespace.
      - Assigning to a name anywhere in a function makes it local throughout that function.
      - Prefer parameters and return values over global variables.
    misconceptions:
      - UnboundLocalError happens when you read a name before assigning it in the same function.
    sources:
      - title: "The Python Tutorial: Python Scopes and Namespaces"
        url: https://docs.python.org/3/tutorial/classes.html#python-scopes-and-namespaces
        publisher: Python Software Foundation
  - id: python.higher-order-functions
    title: Lambdas and higher-order functions
    module: functions
    level: intermediate
    priority: supporting
    summary: Functions are objects that can be passed, returned and stored; lambda creates small anonymous functions, often used as sort keys.
    requires: [python.functions, python.lists]
    keyIdeas:
      - "`sorted(people, key=lambda p: p[\"age\"])` sorts by a computed key."
      - map/filter exist, but comprehensions are usually clearer.
    sources:
      - title: Functional Programming HOWTO
        url: https://docs.python.org/3/howto/functional.html
        publisher: Python Software Foundation
  # ----------------------------------------------------------------- errors
  - id: python.exceptions
    title: Exceptions and tracebacks
    module: errors
    level: beginner
    priority: essential
    summary: Errors are exception objects; tracebacks show where they happened, and try/except/else/finally handle them deliberately.
    requires: [python.functions, python.dictionaries]
    keyIdeas:
      - Read tracebacks bottom-up - the last line is the error, the lines above show the call chain.
      - Catch specific exceptions you can handle; let others propagate.
      - "`finally` runs no matter what; `else` runs only if no exception occurred."
    misconceptions:
      - A bare `except:` hides bugs, including typos and KeyboardInterrupt.
    sources:
      - title: "The Python Tutorial: Errors and Exceptions"
        url: https://docs.python.org/3/tutorial/errors.html
        publisher: Python Software Foundation
  - id: python.raising-exceptions
    title: Raising and defining exceptions
    module: errors
    level: intermediate
    priority: supporting
    summary: raise signals that a function cannot do its job; custom exception classes make failure modes explicit.
    requires: [python.exceptions, python.classes, python.inheritance]
    keyIdeas:
      - Raise early with a clear message when inputs are invalid.
      - "`raise ... from err` preserves the original cause."
    sources:
      - title: "The Python Tutorial: Raising Exceptions"
        url: https://docs.python.org/3/tutorial/errors.html#raising-exceptions
        publisher: Python Software Foundation
  - id: python.debugging
    title: Debugging techniques
    module: errors
    level: beginner
    priority: essential
    summary: Reproduce, isolate, inspect state with prints, a debugger (pdb/breakpoint()) or an IDE, fix, and add a test so it stays fixed.
    requires: [python.exceptions, foundations.troubleshooting]
    keyIdeas:
      - "`breakpoint()` pauses execution and opens the debugger."
      - Step through code and inspect variables instead of guessing.
      - Rubber-duck explanations often reveal the bug.
    sources:
      - title: pdb — The Python Debugger
        url: https://docs.python.org/3/library/pdb.html
        publisher: Python Software Foundation
  # ----------------------------------------------------------- files-modules
  - id: python.files
    title: Reading and writing files
    module: files-modules
    level: beginner
    priority: essential
    summary: open() returns a file object; `with` guarantees it is closed; modes choose reading, writing, appending, text or binary.
    requires: [python.exceptions, foundations.files-and-paths, foundations.text-encoding]
    keyIdeas:
      - "Mode 'w' truncates the file; 'a' appends; 'r' reads."
      - Always pass encoding="utf-8" for text files.
      - Iterate over a file object to read it line by line.
    misconceptions:
      - Forgetting to close a file can lose buffered writes; `with` prevents this.
    sources:
      - title: "The Python Tutorial: Reading and Writing Files"
        url: https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files
        publisher: Python Software Foundation
  - id: python.pathlib
    title: Paths with pathlib
    module: files-modules
    level: beginner
    priority: supporting
    summary: pathlib.Path represents file-system paths as objects that join, inspect, list and read files portably.
    requires: [python.files]
    keyIdeas:
      - "Join paths with `/`: `Path('data') / 'sales.csv'`."
      - Use `Path(__file__).parent` to locate files next to your script.
    sources:
      - title: pathlib — Object-oriented filesystem paths
        url: https://docs.python.org/3/library/pathlib.html
        publisher: Python Software Foundation
  - id: python.csv-json
    title: CSV and JSON data
    module: files-modules
    level: beginner
    priority: essential
    summary: The csv and json modules read and write the two most common data-exchange formats safely.
    requires: [python.files, python.dictionaries]
    keyIdeas:
      - csv.DictReader turns each row into a dict keyed by the header.
      - json.load/json.dump convert between JSON text and Python dicts/lists.
      - CSV values arrive as strings; convert them explicitly.
    sources:
      - title: json — JSON encoder and decoder
        url: https://docs.python.org/3/library/json.html
        publisher: Python Software Foundation
      - title: csv — CSV File Reading and Writing
        url: https://docs.python.org/3/library/csv.html
        publisher: Python Software Foundation
  - id: python.modules
    title: Modules and imports
    module: files-modules
    level: beginner
    priority: essential
    summary: Every .py file is a module; import runs it once and binds its namespace; `if __name__ == "__main__":` separates script code from importable code.
    requires: [python.functions, python.files]
    keyIdeas:
      - "`import math` binds the module; `from math import sqrt` binds one name."
      - Modules are cached in sys.modules after the first import.
      - Naming your file random.py shadows the standard library module.
    misconceptions:
      - Importing a module twice does not run its code twice.
    sources:
      - title: "The Python Tutorial: Modules"
        url: https://docs.python.org/3/tutorial/modules.html
        publisher: Python Software Foundation
  - id: python.packages
    title: Packages and project layout
    module: files-modules
    level: intermediate
    priority: supporting
    summary: Packages are directories of modules; absolute and relative imports, __init__.py and the src layout organise larger projects.
    requires: [python.modules]
    sources:
      - title: "The Python Tutorial: Packages"
        url: https://docs.python.org/3/tutorial/modules.html#packages
        publisher: Python Software Foundation
  - id: python.stdlib
    title: Essential standard library modules
    module: files-modules
    level: intermediate
    priority: essential
    summary: collections, itertools, functools, datetime, math, random, statistics, re and others solve common problems without third-party packages.
    requires: [python.modules, python.dictionaries]
    keyIdeas:
      - Counter, defaultdict and deque from collections remove a lot of boilerplate.
      - datetime handles dates and times; prefer timezone-aware datetimes.
      - Check the standard library before installing a package.
    sources:
      - title: The Python Standard Library
        url: https://docs.python.org/3/library/index.html
        publisher: Python Software Foundation
  - id: python.regex
    title: Regular expressions
    module: files-modules
    level: intermediate
    priority: supporting
    summary: Regular expressions describe text patterns for searching, validating and extracting data with the re module.
    requires: [python.strings, python.stdlib]
    misconceptions:
      - Regex is not the right tool for parsing nested formats such as HTML or JSON.
    sources:
      - title: Regular Expression HOWTO
        url: https://docs.python.org/3/howto/regex.html
        publisher: Python Software Foundation
  # ------------------------------------------------------------ intermediate
  - id: python.comprehensions
    title: Comprehensions
    module: intermediate
    level: intermediate
    priority: essential
    summary: List, dict and set comprehensions build collections from iterables in a single readable expression, with optional filtering.
    requires: [python.lists, python.dictionaries, python.conditionals, python.sets, python.functions]
    keyIdeas:
      - "`[f(x) for x in items if cond(x)]` = transform + filter."
      - Prefer a normal loop when the logic needs several statements.
    sources:
      - title: "The Python Tutorial: List Comprehensions"
        url: https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions
        publisher: Python Software Foundation
  - id: python.iterators
    title: Iterables and iterators
    module: intermediate
    level: intermediate
    priority: essential
    summary: An iterable can produce an iterator; an iterator yields items one at a time via next() until StopIteration. for loops use this protocol.
    requires: [python.for-loops, python.exceptions, python.higher-order-functions]
    keyIdeas:
      - iter(iterable) returns an iterator; next(iterator) returns the next item.
      - Iterators are single-use; iterables like lists can be iterated many times.
    misconceptions:
      - Looping over the same iterator twice yields nothing the second time.
    sources:
      - title: "Glossary: iterator"
        url: https://docs.python.org/3/glossary.html#term-iterator
        publisher: Python Software Foundation
  - id: python.generators
    title: Generators
    module: intermediate
    level: intermediate
    priority: essential
    summary: Functions with yield produce values lazily, pausing between items, which saves memory on large or infinite sequences.
    requires: [python.iterators, python.functions]
    keyIdeas:
      - Calling a generator function returns a generator; the body runs on next().
      - Generator expressions `(x*x for x in data)` are lazy comprehensions.
    sources:
      - title: "The Python Tutorial: Generators"
        url: https://docs.python.org/3/tutorial/classes.html#generators
        publisher: Python Software Foundation
  - id: python.closures
    title: Closures
    module: intermediate
    level: intermediate
    priority: supporting
    summary: An inner function remembers names from the enclosing scope in which it was defined, even after that scope has finished.
    requires: [python.scope, python.higher-order-functions]
    misconceptions:
      - Closures capture variables, not values - late binding in loops surprises people.
    sources:
      - title: "Python Language Reference: Resolution of names"
        url: https://docs.python.org/3/reference/executionmodel.html#resolution-of-names
        publisher: Python Software Foundation
  - id: python.decorators
    title: Decorators
    module: intermediate
    level: intermediate
    priority: essential
    summary: A decorator is a callable that takes a function and returns a replacement, used for logging, caching, timing, access control and frameworks.
    requires: [python.closures, python.parameters]
    keyIdeas:
      - "`@decorator` above `def f` means `f = decorator(f)`."
      - Use functools.wraps to keep the original name and docstring.
    sources:
      - title: "Glossary: decorator"
        url: https://docs.python.org/3/glossary.html#term-decorator
        publisher: Python Software Foundation
  - id: python.context-managers
    title: Context managers
    module: intermediate
    level: intermediate
    priority: essential
    summary: The with statement guarantees setup and cleanup (files, locks, transactions) even when errors occur.
    requires: [python.exceptions, python.classes, python.generators]
    keyIdeas:
      - __enter__/__exit__ or @contextlib.contextmanager implement the protocol.
    sources:
      - title: contextlib — Utilities for with-statement contexts
        url: https://docs.python.org/3/library/contextlib.html
        publisher: Python Software Foundation
  # ---------------------------------------------------------------------- oop
  - id: python.classes
    title: Classes and objects
    module: oop
    level: intermediate
    priority: essential
    summary: A class defines a new type; instances hold their own attributes; methods are functions that receive the instance as self.
    requires: [python.functions, python.dictionaries, python.exceptions]
    keyIdeas:
      - __init__ initialises a new instance; it does not create it.
      - Instance attributes belong to one object; class attributes are shared.
      - Bundle data with the behaviour that maintains its rules.
    misconceptions:
      - self is not a keyword; it is just the conventional name of the first parameter.
    sources:
      - title: "The Python Tutorial: Classes"
        url: https://docs.python.org/3/tutorial/classes.html
        publisher: Python Software Foundation
  - id: python.data-model
    title: The Python data model (dunder methods)
    module: oop
    level: advanced
    priority: supporting
    summary: Special methods like __repr__, __eq__, __len__ and __iter__ let your objects work with built-in syntax and functions.
    requires: [python.classes, python.iterators]
    sources:
      - title: "Python Language Reference: Data model"
        url: https://docs.python.org/3/reference/datamodel.html
        publisher: Python Software Foundation
  - id: python.inheritance
    title: Inheritance and composition
    module: oop
    level: intermediate
    priority: essential
    summary: Inheritance reuses and specialises behaviour (is-a); composition assembles objects from parts (has-a) and is often more flexible.
    requires: [python.classes]
    keyIdeas:
      - super() calls the parent implementation following the method resolution order.
      - Favour composition when the relationship is not a true "is-a".
    sources:
      - title: "The Python Tutorial: Inheritance"
        url: https://docs.python.org/3/tutorial/classes.html#inheritance
        publisher: Python Software Foundation
  - id: python.polymorphism
    title: Polymorphism, duck typing and protocols
    module: oop
    level: intermediate
    priority: supporting
    summary: Code that relies on behaviour rather than concrete types works with any object that provides it; ABCs and typing.Protocol make expectations explicit.
    requires: [python.inheritance]
    sources:
      - title: abc — Abstract Base Classes
        url: https://docs.python.org/3/library/abc.html
        publisher: Python Software Foundation
  - id: python.dataclasses
    title: Dataclasses and enums
    module: oop
    level: intermediate
    priority: essential
    summary: "@dataclass generates __init__, __repr__ and __eq__ for data-holding classes; Enum names a fixed set of values."
    requires: [python.classes, python.type-hints]
    sources:
      - title: dataclasses — Data Classes
        url: https://docs.python.org/3/library/dataclasses.html
        publisher: Python Software Foundation
      - title: enum — Support for enumerations
        url: https://docs.python.org/3/library/enum.html
        publisher: Python Software Foundation
  # ----------------------------------------------------------------- quality
  - id: python.type-hints
    title: Type hints
    module: quality
    level: intermediate
    priority: essential
    summary: Annotations describe expected types for readers and tools; Python does not enforce them at runtime.
    requires: [python.functions, python.lists, python.dictionaries]
    keyIdeas:
      - "`def total(prices: list[float]) -> float:`"
      - Type checkers (mypy, pyright) find bugs before running the code.
    misconceptions:
      - Type hints alone do not validate data at runtime; use validation libraries (e.g. Pydantic) for that.
    sources:
      - title: typing — Support for type hints
        url: https://docs.python.org/3/library/typing.html
        publisher: Python Software Foundation
  - id: python.static-analysis
    title: Linters, formatters and type checkers
    module: quality
    level: intermediate
    priority: supporting
    summary: Ruff, mypy/pyright and formatters automatically catch bugs and keep a consistent style so reviews focus on logic.
    requires: [python.type-hints, python.setup]
    tools: [Ruff, mypy, pyright]
    sources:
      - title: Ruff documentation
        url: https://docs.astral.sh/ruff/
        publisher: Astral
  - id: python.style
    title: Readable Python and PEP 8
    module: quality
    level: beginner
    priority: essential
    summary: Naming, layout and idioms that make code easy for others (and future you) to read.
    requires: [python.functions]
    sources:
      - title: "PEP 8: Style Guide for Python Code"
        url: https://peps.python.org/pep-0008/
        publisher: Python Software Foundation
  - id: python.testing
    title: Testing with pytest
    module: quality
    level: intermediate
    priority: essential
    summary: Automated tests call your code with known inputs and assert expected results; pytest discovers and runs them and explains failures.
    requires: [python.functions, python.exceptions, python.modules]
    keyIdeas:
      - Arrange, act, assert.
      - Test behaviour and edge cases, not implementation details.
      - Fixtures provide reusable setup; parametrize runs one test over many inputs.
    tools: [pytest]
    sources:
      - title: pytest documentation
        url: https://docs.pytest.org/
        publisher: pytest-dev
  - id: python.mocking
    title: Test doubles and mocking
    module: quality
    level: advanced
    priority: supporting
    summary: Replace slow or external dependencies (network, time, randomness) with fakes or mocks so tests are fast and deterministic.
    requires: [python.testing, python.classes]
    misconceptions:
      - Over-mocking couples tests to implementation and lets real integration bugs through.
    sources:
      - title: unittest.mock — mock object library
        url: https://docs.python.org/3/library/unittest.mock.html
        publisher: Python Software Foundation
  - id: python.logging
    title: Logging
    module: quality
    level: intermediate
    priority: essential
    summary: The logging module records what a program is doing at different severity levels, configurable without changing code.
    requires: [python.modules, python.exceptions]
    keyIdeas:
      - Use module-level loggers `logging.getLogger(__name__)`.
      - Logger, handler and formatter have separate responsibilities.
      - Configure application handlers once at startup; reusable modules should not configure the root logger.
      - Use `logger.exception()` inside an exception handler when traceback context is useful.
      - Never log secrets or unnecessary personal data.
    misconceptions:
      - Logging an exception does not handle or recover from it.
      - Adding handlers at multiple points can duplicate records through logger propagation.
    interview: Explain how logger levels, handlers, formatters and propagation work together.
    production: Use structured context, centralised collection, retention controls and redaction; avoid duplicate exception logging.
    sources:
      - title: Logging HOWTO
        url: https://docs.python.org/3/howto/logging.html
        publisher: Python Software Foundation
  - id: python.virtual-environments
    title: Virtual environments and dependencies
    module: quality
    level: beginner
    priority: essential
    summary: A virtual environment isolates a project's installed packages; requirements or lock files make installs reproducible.
    requires: [python.setup, python.modules]
    keyIdeas:
      - "`python -m venv .venv` then activate it before installing."
      - Pin versions for applications; use ranges for libraries.
    tools: [venv, pip, uv]
    sources:
      - title: "venv — Creation of virtual environments"
        url: https://docs.python.org/3/library/venv.html
        publisher: Python Software Foundation
      - title: "Python Packaging User Guide: Installing packages"
        url: https://packaging.python.org/en/latest/tutorials/installing-packages/
        publisher: Python Packaging Authority
  - id: python.packaging
    title: Packaging and distribution
    module: quality
    level: advanced
    priority: supporting
    summary: pyproject.toml describes a project's metadata, dependencies and build backend so it can be built into wheels and installed.
    requires: [python.virtual-environments, python.packages]
    sources:
      - title: "Python Packaging User Guide: Packaging Python Projects"
        url: https://packaging.python.org/en/latest/tutorials/packaging-projects/
        publisher: Python Packaging Authority
  - id: python.cli-apps
    title: Command-line applications
    module: quality
    level: intermediate
    priority: supporting
    summary: argparse turns command-line arguments into validated options, exit codes signal success or failure, and stdin/stdout let programs be composed.
    requires: [python.modules, foundations.terminal-basics]
    sources:
      - title: argparse tutorial
        url: https://docs.python.org/3/howto/argparse.html
        publisher: Python Software Foundation
  - id: python.configuration
    title: Configuration and secrets
    module: quality
    level: intermediate
    priority: essential
    summary: Keep configuration outside code (environment variables, config files) and never commit secrets.
    requires: [python.modules, foundations.environment-variables]
    keyIdeas:
      - Environment variables are strings and must be parsed and validated before use.
      - Define configuration precedence and load settings at application startup.
      - Missing required values should fail clearly without printing secret values.
      - A `.env` file is not loaded automatically by Python; a tool or deployment environment must provide it.
      - A browser-delivered frontend cannot protect credentials from its users.
    misconceptions:
      - "`bool(\"false\")` is True because every non-empty string is truthy."
      - Adding a secret file to `.gitignore` does not remove credentials already committed to Git history.
    interview: Explain configuration precedence, secret injection and why frontend bundles cannot contain private API keys.
    production: Use a secret manager or platform-managed injection, rotate exposed credentials and keep `.env.example` free of real values.
    sources:
      - title: "The Twelve-Factor App: Config"
        url: https://12factor.net/config
        publisher: Adam Wiggins
  # ------------------------------------------------------------- performance
  - id: python.profiling
    title: Profiling and optimisation
    module: performance
    level: advanced
    priority: supporting
    summary: Measure before optimising - timeit and cProfile find the real bottleneck; better algorithms beat micro-optimisations.
    requires: [python.functions, cs.complexity]
    sources:
      - title: The Python Profilers
        url: https://docs.python.org/3/library/profile.html
        publisher: Python Software Foundation
  - id: python.concurrency
    title: Concurrency vs parallelism and the GIL
    module: performance
    level: advanced
    priority: essential
    summary: Concurrency overlaps waiting; parallelism runs work simultaneously. CPython's GIL limits CPU-bound threads, which shapes the choice between threads, processes and asyncio.
    requires: [python.functions, foundations.operating-systems]
    keyIdeas:
      - Concurrency coordinates overlapping progress; parallelism executes work simultaneously.
      - Classify workloads as I/O-bound or CPU-bound before choosing an execution model.
      - Threads share memory and need careful handling of shared mutable state.
      - Standard GIL-enabled CPython limits simultaneous Python bytecode execution in one interpreter.
      - Free-threaded CPython builds (PEP 703) are available as an optional configuration; verify extension compatibility.
      - Processes can use multiple cores but add startup, memory and data-transfer overhead.
    misconceptions:
      - More threads do not automatically make CPU-bound Python code faster.
      - The GIL is not a universal rule for every Python implementation or build.
    interview: Compare threads, processes and asyncio for I/O-bound and CPU-bound workloads, including the GIL trade-offs.
    production: Bound concurrency, apply timeouts and backpressure, and benchmark throughput, tail latency, CPU and memory.
    sources:
      - title: "Concurrent Execution — Python 3.14"
        url: https://docs.python.org/3.14/library/concurrency.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "threading — Thread-based parallelism"
        url: https://docs.python.org/3.14/library/threading.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "Python support for free threading"
        url: https://docs.python.org/3.14/howto/free-threading-python.html
        publisher: Python Software Foundation
        version: "3.14"
  - id: python.threading
    title: Threads and multiprocessing
    module: performance
    level: advanced
    priority: supporting
    summary: concurrent.futures runs work on thread or process pools; shared state needs locks; race conditions are subtle bugs.
    requires: [python.concurrency]
    sources:
      - title: concurrent.futures — Launching parallel tasks
        url: https://docs.python.org/3/library/concurrent.futures.html
        publisher: Python Software Foundation
  - id: python.asyncio
    title: Asynchronous programming with asyncio
    module: performance
    level: advanced
    priority: essential
    summary: async def defines coroutines; await yields control to the event loop while waiting, letting one thread handle many concurrent I/O tasks.
    requires: [python.concurrency, python.generators]
    keyIdeas:
      - Calling a coroutine function creates a coroutine object; nothing runs until it is awaited or scheduled.
      - "`create_task()` schedules a coroutine and `gather()` waits for several awaitables."
      - Async code needs non-blocking libraries throughout the call chain.
      - Timeouts and cancellation-aware cleanup prevent tasks from waiting indefinitely.
      - Blocking calls inside async code stall every task on that event loop.
    misconceptions:
      - "`async` does not make CPU-bound code faster or automatically use multiple CPU cores."
      - "`asyncio.run()` should not be nested inside an already-running event loop."
    interview: Explain coroutine objects, Tasks, the event loop, await points and how blocking calls affect async applications.
    production: Use bounded concurrency, request timeouts, structured task lifetimes and async-compatible clients; monitor cancellations and task failures.
    sources:
      - title: asyncio — Asynchronous I/O
        url: https://docs.python.org/3/library/asyncio.html
        publisher: Python Software Foundation
  - id: python.memory-model
    title: Memory management and CPython internals
    module: performance
    level: advanced
    priority: optional
    summary: CPython uses reference counting plus a cycle-detecting garbage collector; bytecode, the dis module and object layout explain performance characteristics.
    requires: [python.mutability, python.classes]
    sources:
      - title: gc — Garbage Collector interface
        url: https://docs.python.org/3/library/gc.html
        publisher: Python Software Foundation
      - title: dis — Disassembler for Python bytecode
        url: https://docs.python.org/3/library/dis.html
        publisher: Python Software Foundation
  - id: python.secure-coding
    title: Secure Python coding
    module: performance
    level: intermediate
    priority: essential
    summary: Avoid eval/exec on untrusted input, unsafe deserialisation (pickle), shell injection and leaked secrets; validate input at boundaries.
    requires: [python.files, python.exceptions, python.configuration]
    keyIdeas:
      - Treat request data, uploads, database values and external tool results as untrusted at trust boundaries.
      - Never evaluate untrusted strings or unpickle untrusted data.
      - Use JSON or another data-only format, then validate shape, size and values.
      - Parameterize SQL values and keep them separate from query text.
      - Use a fixed subprocess executable with an argument list and `shell=False`.
      - Resolve and constrain user-controlled paths; account for symlinks and race conditions.
      - Use the `secrets` module, not `random`, for security-sensitive tokens.
    misconceptions:
      - Validating a value does not prove the caller is authorised to use it.
      - Replacing `eval` with `pickle.loads` does not make untrusted input safe.
      - "`.gitignore` cannot revoke or erase a credential that was already committed."
    interview: Describe common Python injection and deserialisation risks and how to protect trust boundaries.
    production: Apply least privilege, schema and resource limits, parameterized queries, safe process invocation, secret rotation and security logging.
    sources:
      - title: "Security Considerations — Python 3.14"
        url: https://docs.python.org/3.14/library/security_warnings.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "pickle — Python object serialization"
        url: https://docs.python.org/3.14/library/pickle.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "secrets — Generate secure random numbers for managing secrets"
        url: https://docs.python.org/3.14/library/secrets.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "subprocess — Subprocess management"
        url: https://docs.python.org/3.14/library/subprocess.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "pathlib — Object-oriented filesystem paths"
        url: https://docs.python.org/3.14/library/pathlib.html
        publisher: Python Software Foundation
        version: "3.14"
      - title: "OWASP Top 10"
        url: https://owasp.org/www-project-top-ten/
        publisher: OWASP Foundation
