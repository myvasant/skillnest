id: backend.async-endpoints
concept: backend.async-endpoints
title: Synchronous and asynchronous endpoints
subtitle: async endpoints handle many concurrent I/O-bound requests on one event loop — but one blocking call inside
  them stalls every request
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: async endpoints handle many concurrent I/O-bound requests on one event loop — but one blocking call inside
  them stalls every request.
objectives:
- Explain the core model behind synchronous and asynchronous endpoints.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: Concurrency and async / await
  url: https://fastapi.tiangolo.com/async/
  publisher: FastAPI
- title: Developing with asyncio
  url: https://docs.python.org/3/library/asyncio-dev.html
  publisher: Python Software Foundation
- title: Working with threads
  url: https://anyio.readthedocs.io/en/stable/threads.html
  publisher: AnyIO
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: async endpoints handle many concurrent I/O-bound requests on one event loop — but one blocking call inside
      them stalls every request. Model APIs and RAG services spend most of their time waiting on databases and other
      HTTP calls; async lets one process serve many such requests at once, or freezes all of them when misused.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- `async def` endpoints run directly on the event loop; plain `def` endpoints and `def` dependencies
      run in a thread pool, so blocking code there does not freeze the loop.

      - Inside `async def`, use only awaitable libraries (`httpx.AsyncClient`, asyncpg, SQLAlchemy''s asyncio extension);
      a `time.sleep()`, `requests.get()` or synchronous database call blocks every request on that worker.

      - Offload unavoidable blocking calls with `await anyio.to_thread.run_sync(fn)` (or Starlette''s `run_in_threadpool`);
      AnyIO''s default limit is 40 worker threads.

      - CPU-heavy work such as large-model inference or image processing belongs in separate processes, task workers
      or a dedicated model server, not on the event loop.

      - Concurrency is per worker process; production servers run several workers to use several CPU cores.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- `async def` does not make code faster or parallel; it only lets other requests proceed while one is
      waiting on I/O.

      - Plain `def` endpoints are not wrong; for blocking libraries they are the safer choice.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import asyncio\n\nasync def fetch_value(value):\n    await asyncio.sleep(0)\n    return value * 2\n\n\
      async def main():\n    return await asyncio.gather(fetch_value(2), fetch_value(3))\n\nprint(asyncio.run(main()))"
    caption: Runnable model of the lesson concept.
- id: practice
  title: Practice and implementation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper first, then run the provided assertions. Consider malformed input and boundary cases.
  - type: item
    ref: async-endpoints-code
  - type: item
    ref: async-endpoints-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - `async def` endpoints run directly on the event loop; plain `def` endpoints and `def` dependencies run in
      a thread pool, so blocking code there does not freeze the loop.

      - Inside `async def`, use only awaitable libraries (`httpx.AsyncClient`, asyncpg, SQLAlchemy''s asyncio extension);
      a `time.sleep()`, `requests.get()` or synchronous database call blocks every request on that worker.

      - Offload unavoidable blocking calls with `await anyio.to_thread.run_sync(fn)` (or Starlette''s `run_in_threadpool`);
      AnyIO''s default limit is 40 worker threads.

      - CPU-heavy work such as large-model inference or image processing belongs in separate processes, task workers
      or a dedicated model server, not on the event loop.

      - Concurrency is per worker process; production servers run several workers to use several CPU cores.


      **Avoid**

      - `async def` does not make code faster or parallel; it only lets other requests proceed while one is waiting
      on I/O.

      - Plain `def` endpoints are not wrong; for blocking libraries they are the safer choice.'
