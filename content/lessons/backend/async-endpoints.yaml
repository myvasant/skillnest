items:
- id: async-endpoints-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of synchronous and asynchronous endpoints?
  explanation: '`async def` endpoints run directly on the event loop; plain `def` endpoints and `def` dependencies
    run in a thread pool, so blocking code there does not freeze the loop.'
  options:
  - id: a
    text: '`async def` endpoints run directly on the event loop; plain `def` endpoints and `def` dependencies run
      in a thread pool, so blocking code there does not freeze the loop.'
    correct: true
    feedback: 'Correct: this is the core rule described in the lesson.'
  - id: b
    text: '`async def` does not make code faster or parallel; it only lets other requests proceed while one is waiting
      on I/O.'
    feedback: This is a common misconception; see the explanation above.
  - id: c
    text: The implementation does not need tests or operational checks.
    feedback: Reliable systems require verification and explicit failure handling.
- id: async-endpoints-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '`async def` does not make code faster or parallel; it only lets other requests proceed while one is waiting
    on I/O.'
  answer: false
  explanation: This statement describes a known misconception. Use the underlying mechanism and test evidence rather
    than relying on the shortcut.
- id: async-endpoints-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are implementing synchronous and asynchronous endpoints in a real application. What design decisions
    would you make, what failure case would you test, and what evidence would tell you the implementation is correct?
  rubric:
  - Describe the relevant mechanism and the design choice it implies.
  - Name a realistic failure or edge case and a concrete test for it.
  - Explain a security, correctness or operational trade-off.
  modelAnswer: Start with the system contract and its failure modes. Choose the simplest implementation that meets
    the contract, validate inputs at the boundary, and test both successful and unsuccessful cases. Observe the
    relevant status, state or output and document any limitations.
  explanation: A strong response links design decisions to observable behaviour and explicitly handles edge cases.
- id: async-endpoints-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the function for synchronous and asynchronous endpoints. Implement the stated rule and make sure
    both ordinary and edge-case tests pass.
  starterCode: "import asyncio\n\nasync def fetch_value(value):\n    raise NotImplementedError('Complete this function')\n\
    \nasync def main():\n    raise NotImplementedError('Complete this function')"
  solution: "import asyncio\n\nasync def fetch_value(value):\n    await asyncio.sleep(0)\n    return value * 2\n\
    \nasync def main():\n    return await asyncio.gather(fetch_value(2), fetch_value(3))"
  tests:
  - name: Core behaviour
    code: assert asyncio.run(main()) == [4, 6]
  - name: Edge cases
    code: assert asyncio.run(fetch_value(5)) == 10
  hints:
  - Read the rule in the mental-model section before coding.
  - Keep the function deterministic and handle boundary cases explicitly.
  - Run every assertion before considering the exercise complete.
  explanation: This exercise checks practical application of the lesson rule and includes edge cases to help detect
    incorrect assumptions.
