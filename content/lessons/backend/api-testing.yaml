id: backend.api-testing
concept: backend.api-testing
title: Testing APIs
subtitle: Exercise endpoints in-process with a test client, override dependencies, test error paths and keep integration
  tests deterministic
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Exercise endpoints in-process with a test client, override dependencies, test error paths and keep integration
  tests deterministic.
objectives:
- Explain the core model behind testing apis.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: Testing
  url: https://fastapi.tiangolo.com/tutorial/testing/
  publisher: FastAPI
- title: Testing Dependencies with Overrides
  url: https://fastapi.tiangolo.com/advanced/testing-dependencies/
  publisher: FastAPI
- title: Async Tests
  url: https://fastapi.tiangolo.com/advanced/async-tests/
  publisher: FastAPI
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Exercise endpoints in-process with a test client, override dependencies, test error paths and keep integration
      tests deterministic. APIs are contracts other code relies on; automated tests catch broken validation, status
      codes and permission checks before clients do, and make refactoring safe.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- `TestClient(app)` (built on HTTPX) calls the app in-process without a running server: `r = client.get("/items/1")`,
      then assert on `r.status_code` and `r.json()`.

      - Use `with TestClient(app) as client:` when the app has lifespan start-up and shutdown logic, so it runs
      during the test.

      - Override dependencies (`app.dependency_overrides`) to swap databases, auth and external services for fakes,
      and clear the overrides after each test.

      - Test the unhappy paths - invalid input (422), missing credentials (401), another user''s object (403 or
      404), not found and conflicts.

      - Run integration tests against a real database (for example a disposable PostgreSQL container) with fixed
      data, rolling back or recreating state per test so results are deterministic.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Checking only the status code is not enough; also assert on the body and on side effects such as rows
      written or jobs queued.

      - Mocking everything can make tests pass while the real integration is broken.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def assert_json_response(response, expected_status, required_keys):\n    assert response[\"status\"]\
      \ == expected_status\n    assert response[\"content_type\"] == \"application/json\"\n    assert all(key in\
      \ response[\"body\"] for key in required_keys)\n    return True\n\nresponse = {\"status\":200,\"content_type\"\
      :\"application/json\",\"body\":{\"id\":1,\"name\":\"Ada\"}}\nprint(assert_json_response(response, 200, [\"\
      id\", \"name\"]))"
    caption: Runnable model of the lesson concept.
- id: practice
  title: Practice and implementation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper first, then run the provided assertions. Consider malformed input and boundary cases.
  - type: item
    ref: api-testing-code
  - type: item
    ref: api-testing-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - `TestClient(app)` (built on HTTPX) calls the app in-process without a running server: `r = client.get("/items/1")`,
      then assert on `r.status_code` and `r.json()`.

      - Use `with TestClient(app) as client:` when the app has lifespan start-up and shutdown logic, so it runs
      during the test.

      - Override dependencies (`app.dependency_overrides`) to swap databases, auth and external services for fakes,
      and clear the overrides after each test.

      - Test the unhappy paths - invalid input (422), missing credentials (401), another user''s object (403 or
      404), not found and conflicts.

      - Run integration tests against a real database (for example a disposable PostgreSQL container) with fixed
      data, rolling back or recreating state per test so results are deterministic.


      **Avoid**

      - Checking only the status code is not enough; also assert on the body and on side effects such as rows written
      or jobs queued.

      - Mocking everything can make tests pass while the real integration is broken.'
  - type: item
    ref: api-testing-mcq
  - type: item
    ref: api-testing-tf
  - type: item
    ref: api-testing-code
items:
- id: api-testing-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of testing apis?
  explanation: '`TestClient(app)` (built on HTTPX) calls the app in-process without a running server: `r = client.get("/items/1")`,
    then assert on `r.status_code` and `r.json()`.'
  options:
  - id: a
    text: '`TestClient(app)` (built on HTTPX) calls the app in-process without a running server: `r = client.get("/items/1")`,
      then assert on `r.status_code` and `r.json()`.'
    correct: true
    feedback: 'Correct: this is the core rule described in the lesson.'
  - id: b
    text: Checking only the status code is not enough; also assert on the body and on side effects such as rows
      written or jobs queued.
    feedback: This is a common misconception; see the explanation above.
  - id: c
    text: The implementation does not need tests or operational checks.
    feedback: Reliable systems require verification and explicit failure handling.
- id: api-testing-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Checking only the status code is not enough; also assert on the body and on side effects such as rows
    written or jobs queued.
  answer: false
  explanation: This statement describes a known misconception. Use the underlying mechanism and test evidence rather
    than relying on the shortcut.
- id: api-testing-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are implementing testing apis in a real application. What design decisions would you make, what failure
    case would you test, and what evidence would tell you the implementation is correct?
  rubric:
  - Describe the relevant mechanism and the design choice it implies.
  - Name a realistic failure or edge case and a concrete test for it.
  - Explain a security, correctness or operational trade-off.
  modelAnswer: Start with the system contract and its failure modes. Choose the simplest implementation that meets
    the contract, validate inputs at the boundary, and test both successful and unsuccessful cases. Observe the
    relevant status, state or output and document any limitations.
  explanation: A strong response links design decisions to observable behaviour and explicitly handles edge cases.
- id: api-testing-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the function for testing apis. Implement the stated rule and make sure both ordinary and edge-case
    tests pass.
  starterCode: "def assert_json_response(response, expected_status, required_keys):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def assert_json_response(response, expected_status, required_keys):\n    assert response[\"status\"\
    ] == expected_status\n    assert response[\"content_type\"] == \"application/json\"\n    assert all(key in response[\"\
    body\"] for key in required_keys)\n    return True"
  tests:
  - name: Core behaviour
    code: assert assert_json_response({"status":200,"content_type":"application/json","body":{"id":1}}, 200, ["id"])
      is True
  - name: Edge cases
    code: 'try: assert_json_response({"status":500,"content_type":"text/plain","body":{}}, 200, ["id"])

      except AssertionError: pass

      else: raise AssertionError("invalid response should fail")'
  hints:
  - Read the rule in the mental-model section before coding.
  - Keep the function deterministic and handle boundary cases explicitly.
  - Run every assertion before considering the exercise complete.
  explanation: This exercise checks practical application of the lesson rule and includes edge cases to help detect
    incorrect assumptions.
masteryCheck:
  passThreshold: 0.8
  items:
  - api-testing-mcq
  - api-testing-tf
  - api-testing-code
