id: backend.secrets-management
concept: backend.secrets-management
title: Secret management
subtitle: Keep API keys and passwords out of code and repositories, inject them at runtime, scope them narrowly
  and rotate them
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Keep API keys and passwords out of code and repositories, inject them at runtime, scope them narrowly and
  rotate them.
objectives:
- Explain the core model behind secret management.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: Secrets Management Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  publisher: OWASP
- title: About secret scanning
  url: https://docs.github.com/en/code-security/concepts/secret-security/secret-scanning
  publisher: GitHub
- title: 'The Twelve-Factor App: Config'
  url: https://12factor.net/config
  publisher: Adam Wiggins / Twelve-Factor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Keep API keys and passwords out of code and repositories, inject them at runtime, scope them narrowly
      and rotate them. API keys pushed to public repositories are found by automated scanners very quickly and can
      run up large bills or expose data, so secrets need a lifecycle separate from code.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Never commit secrets; keep local ones in a git-ignored `.env`, commit a `.env.example` with placeholders,
      and scan commits with a tool such as gitleaks.

      - Inject secrets at runtime from the environment or a secret manager (cloud secret managers, Vault or OpenBao,
      Kubernetes Secrets) rather than baking them into images.

      - Scope each secret to one service with minimum permissions, and prefer short-lived credentials (workload
      identity, OIDC federation) over long-lived keys.

      - Rotate secrets regularly and immediately after any exposure; deleting a secret in a new commit leaves it
      in Git history.

      - Keep secrets out of logs, error messages and URLs; Pydantic''s `SecretStr` masks the value when printed.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Removing a leaked key from the repository is not enough; treat it as compromised and revoke it.

      - Environment variables are not encrypted; anyone who can inspect the process, its environment or its crash
      dumps may read them.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def required_secrets_present(config, required):\n    return [name for name in required if not isinstance(config.get(name),\
      \ str) or not config[name].strip()]\n\nprint(required_secrets_present({\"DB_URL\":\"postgres://...\"}, [\"\
      DB_URL\", \"API_KEY\"]))"
    caption: Runnable model of the lesson concept.
- id: practice
  title: Practice and implementation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper first, then run the provided assertions. Consider malformed input and boundary cases.
  - type: item
    ref: secrets-management-code
  - type: item
    ref: secrets-management-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - Never commit secrets; keep local ones in a git-ignored `.env`, commit a `.env.example` with placeholders,
      and scan commits with a tool such as gitleaks.

      - Inject secrets at runtime from the environment or a secret manager (cloud secret managers, Vault or OpenBao,
      Kubernetes Secrets) rather than baking them into images.

      - Scope each secret to one service with minimum permissions, and prefer short-lived credentials (workload
      identity, OIDC federation) over long-lived keys.

      - Rotate secrets regularly and immediately after any exposure; deleting a secret in a new commit leaves it
      in Git history.

      - Keep secrets out of logs, error messages and URLs; Pydantic''s `SecretStr` masks the value when printed.


      **Avoid**

      - Removing a leaked key from the repository is not enough; treat it as compromised and revoke it.

      - Environment variables are not encrypted; anyone who can inspect the process, its environment or its crash
      dumps may read them.'
  - type: item
    ref: secrets-management-mcq
  - type: item
    ref: secrets-management-tf
  - type: item
    ref: secrets-management-code
items:
- id: secrets-management-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of secret management?
  explanation: Never commit secrets; keep local ones in a git-ignored `.env`, commit a `.env.example` with placeholders,
    and scan commits with a tool such as gitleaks.
  options:
  - id: a
    text: Never commit secrets; keep local ones in a git-ignored `.env`, commit a `.env.example` with placeholders,
      and scan commits with a tool such as gitleaks.
    correct: true
    feedback: 'Correct: this is the core rule described in the lesson.'
  - id: b
    text: Removing a leaked key from the repository is not enough; treat it as compromised and revoke it.
    feedback: This is a common misconception; see the explanation above.
  - id: c
    text: The implementation does not need tests or operational checks.
    feedback: Reliable systems require verification and explicit failure handling.
- id: secrets-management-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Removing a leaked key from the repository is not enough; treat it as compromised and revoke it.
  answer: false
  explanation: This statement describes a known misconception. Use the underlying mechanism and test evidence rather
    than relying on the shortcut.
- id: secrets-management-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are implementing secret management in a real application. What design decisions would you make, what
    failure case would you test, and what evidence would tell you the implementation is correct?
  rubric:
  - Describe the relevant mechanism and the design choice it implies.
  - Name a realistic failure or edge case and a concrete test for it.
  - Explain a security, correctness or operational trade-off.
  modelAnswer: Start with the system contract and its failure modes. Choose the simplest implementation that meets
    the contract, validate inputs at the boundary, and test both successful and unsuccessful cases. Observe the
    relevant status, state or output and document any limitations.
  explanation: A strong response links design decisions to observable behaviour and explicitly handles edge cases.
- id: secrets-management-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the function for secret management. Implement the stated rule and make sure both ordinary and
    edge-case tests pass.
  starterCode: "def required_secrets_present(config, required):\n    raise NotImplementedError('Complete this function')"
  solution: "def required_secrets_present(config, required):\n    return [name for name in required if not isinstance(config.get(name),\
    \ str) or not config[name].strip()]"
  tests:
  - name: Core behaviour
    code: assert required_secrets_present({"DB_URL":"url", "API_KEY":"secret"}, ["DB_URL", "API_KEY"]) == []
  - name: Edge cases
    code: assert required_secrets_present({"DB_URL":" "}, ["DB_URL", "API_KEY"]) == ["DB_URL", "API_KEY"]
  hints:
  - Read the rule in the mental-model section before coding.
  - Keep the function deterministic and handle boundary cases explicitly.
  - Run every assertion before considering the exercise complete.
  explanation: This exercise checks practical application of the lesson rule and includes edge cases to help detect
    incorrect assumptions.
masteryCheck:
  passThreshold: 0.8
  items:
  - secrets-management-mcq
  - secrets-management-tf
  - secrets-management-code
