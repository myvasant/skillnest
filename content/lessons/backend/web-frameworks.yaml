id: backend.web-frameworks
concept: backend.web-frameworks
title: What a Web Framework Does
subtitle: Build a tiny framework, then recognise every piece in FastAPI
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  A web framework turns HTTP requests into calls to your functions and your return values into HTTP
  responses. Build one from scratch in Python - request and response objects, a route table filled by
  decorators, path parameters, JSON responses, error handling and middleware - and then map each piece to
  FastAPI, Starlette and the WSGI/ASGI interfaces that connect frameworks to servers.
objectives:
  - Explain the division of work between an HTTP server (Uvicorn, Gunicorn) and a framework (FastAPI, Flask, Django).
  - Explain how decorators such as @app.get("/notes/{id}") fill a route table when the module is loaded.
  - Implement path matching with path parameters and predict which route a request reaches.
  - Choose between 404 and 405 and produce JSON responses with correct status codes.
  - Predict the order in which middleware runs, and write a middleware that short-circuits a request.
  - Map the pieces of a tiny framework to FastAPI, and describe WSGI and ASGI at a high level.
