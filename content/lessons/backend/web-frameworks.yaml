  - id: m-asgi-wsgi
    type: mcq
    skill: recognition
    difficulty: 2
    prompt: Which statement correctly contrasts WSGI and ASGI?
    explanation: >-
      WSGI (PEP 3333) is a synchronous callable app(environ, start_response) returning an iterable of bytes,
      one request per call. ASGI is an asynchronous callable app(scope, receive, send) that exchanges event
      dictionaries, which lets it support long-lived connections such as WebSockets.
    options:
      - id: a
        text: WSGI apps are synchronous callables app(environ, start_response); ASGI apps are coroutines app(scope, receive, send) that also support WebSockets.
        correct: true
        feedback: Right. Flask is WSGI, FastAPI and Starlette are ASGI, Django supports both.
      - id: b
        text: ASGI is a web framework and WSGI is a web server.
        feedback: Both are interfaces (contracts) between servers and applications, not programs.
      - id: c
        text: WSGI is for Python 2 only, so all WSGI apps are obsolete.
        feedback: WSGI 1.0.1 (PEP 3333) supports Python 3 and is widely used, for example by Flask and Django under Gunicorn.
      - id: d
        text: ASGI makes every handler run faster than WSGI.
        feedback: ASGI helps with many concurrent waiting requests; it does not speed up CPU-bound code.

  - id: m-tf-async
    type: true-false
    skill: transfer
    prompt: |
      True or false: rewriting a handler that resizes images (pure CPU work) from `def` to `async def` in an
      ASGI framework makes each request finish faster.
    answer: false
    explanation: >-
      async lets one process interleave requests that are waiting on I/O. CPU-bound work still needs the CPU
      for the same time - and running it inside an async function blocks the event loop, delaying other
      requests. Use more processes or a background worker for CPU-heavy tasks.

  - id: m-predict-short-circuit
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: The request has no user. What does this print?
    code: |
      def handler(request):
          print("handler")
          return 200

      def auth(request, call_next):
          print("auth")
          if request.get("user") is None:
              return 401
          return call_next(request)

      def log(request, call_next):
          print("log in")
          status = call_next(request)
          print("log out", status)
          return status

      app = lambda request: log(request, lambda r: auth(r, handler))
      app({"user": None})
    answer: |
      log in
      auth
      log out 401
    explanation: >-
      log is outermost and calls inward. auth returns 401 without calling call_next, so the handler never
      runs. The 401 travels back out, and log still prints its "out" line with that status.
    wrongAnswers:
      - answer: |
          log in
          auth
          handler
          log out 401
        feedback: auth returns before calling call_next, so the handler is never reached - that is what short-circuiting means.
      - answer: |
          log in
          auth
        feedback: An early return from auth is a normal return to log, which then continues after its call_next line.

  - id: m-auth-middleware
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write the middleware `require_api_key(request, call_next)`:

      - If `request.path` is `"/health"`, always pass the request on (load balancers call it without a key).
      - Otherwise, if the `x-api-key` header is missing or not equal to `API_KEY`, return
        `Response(401, json.dumps({"detail": "Missing or invalid API key"}).encode("utf-8"))` **without**
        calling `call_next`.
      - Otherwise return whatever `call_next(request)` returns.
    starterCode: |
      import json
      from dataclasses import dataclass, field

      @dataclass
      class Request:
          method: str
          path: str
          headers: dict[str, str] = field(default_factory=dict)

      @dataclass
      class Response:
          status: int
          body: bytes = b""

      API_KEY = "s3cret"

      def require_api_key(request, call_next):
          return call_next(request)

      def handler(request):
          return Response(200, b"ok")

      print(require_api_key(Request("GET", "/notes"), handler).status)
      print(require_api_key(Request("GET", "/notes", {"x-api-key": "s3cret"}), handler).status)
      print(require_api_key(Request("GET", "/health"), handler).status)
    solution: |
      import json
      from dataclasses import dataclass, field

      @dataclass
      class Request:
          method: str
          path: str
          headers: dict[str, str] = field(default_factory=dict)

      @dataclass
      class Response:
          status: int
          body: bytes = b""

      API_KEY = "s3cret"

      def require_api_key(request, call_next):
          if request.path == "/health":
              return call_next(request)
          if request.headers.get("x-api-key") != API_KEY:
              body = json.dumps({"detail": "Missing or invalid API key"}).encode("utf-8")
              return Response(401, body)
          return call_next(request)

      def handler(request):
          return Response(200, b"ok")

      print(require_api_key(Request("GET", "/notes"), handler).status)
      print(require_api_key(Request("GET", "/notes", {"x-api-key": "s3cret"}), handler).status)
      print(require_api_key(Request("GET", "/health"), handler).status)
    expectedOutput: |
      401
      200
      200
    tests:
      - name: missing key is rejected without calling the handler
        code: |
          calls_made = []
          def spy(request):
              calls_made.append(request.path)
              return Response(200, b"ok")
          result = require_api_key(Request("GET", "/notes"), spy)
          assert result.status == 401, f"A request without x-api-key should get 401, got {result.status!r}."
          assert calls_made == [], "Do not call call_next when rejecting the request."
          assert json.loads(result.body) == {"detail": "Missing or invalid API key"}, f"Body should be the JSON detail message, got {result.body!r}."
      - name: wrong key is rejected
        code: |
          result = require_api_key(Request("GET", "/notes", {"x-api-key": "guess"}), lambda r: Response(200, b"ok"))
          assert result.status == 401, "A wrong key must also get 401."
      - name: correct key passes through unchanged
        code: |
          sentinel = Response(204, b"")
          result = require_api_key(Request("POST", "/notes", {"x-api-key": API_KEY}), lambda r: sentinel)
          assert result is sentinel, "With the right key, return exactly what call_next returned."
      - name: /health is public
        code: |
          result = require_api_key(Request("GET", "/health"), lambda r: Response(200, b"healthy"))
          assert result.status == 200, "/health must be reachable without a key."
    hints:
      - Check the /health path first and pass it straight to call_next.
      - "`request.headers.get(\"x-api-key\")` returns None when the header is missing, which is also not equal to API_KEY."
      - Build the 401 Response yourself and return it before reaching call_next.
    feedback:
      - when: { outputEquals: "200\n200\n200\n" }
        message: Every request is let through. Compare the x-api-key header with API_KEY and return a 401 Response when it does not match.
    explanation: >-
      Authentication middleware is the textbook short-circuit: it decides before the router runs, so no
      handler can forget the check. Public paths such as health checks are excluded explicitly. (Production
      code would also compare secrets with hmac.compare_digest to avoid timing leaks.)

