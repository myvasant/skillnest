cheatsheet: |
  ```python
  # Decorator factory registers routes at import time
  def get(self, pattern):
      def register(handler):
          self.routes.append(("GET", pattern, handler))
          return handler            # keep the original function
      return register

  # Middleware: before -> call_next -> after (or return early)
  def mw(request, call_next):
      response = call_next(request)
      response.headers["x-thing"] = "1"
      return response               # never forget this
  ```
  - Server (Uvicorn/Gunicorn) = sockets + HTTP · Framework = routing, validation, serialisation, middleware
  - First matching route wins → specific paths before `{param}` paths; path params are strings until converted
  - 404 no path · 405 wrong method (+ Allow) · 422 invalid input (FastAPI) · 500 unexpected error
  - WSGI `app(environ, start_response)` sync · ASGI `async app(scope, receive, send)` + WebSockets
  - FastAPI: `@app.get("/x/{id}")`, `id: int`, `HTTPException`, `@app.middleware("http")`, run with `fastapi dev`
