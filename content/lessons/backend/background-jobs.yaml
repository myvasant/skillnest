items:
- id: background-jobs-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of background jobs and task queues?
  explanation: FastAPI `BackgroundTasks` run a function after the response is sent, in the same process; fine for
    small, non-critical work, but lost if the process restarts.
  options:
  - id: a
    text: FastAPI `BackgroundTasks` run a function after the response is sent, in the same process; fine for small,
      non-critical work, but lost if the process restarts.
    correct: true
    feedback: 'Correct: this is the core rule described in the lesson.'
  - id: b
    text: '`BackgroundTasks` is not a durable job queue; it has no persistence, retries or separate scaling.'
    feedback: This is a common misconception; see the explanation above.
  - id: c
    text: The implementation does not need tests or operational checks.
    feedback: Reliable systems require verification and explicit failure handling.
- id: background-jobs-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '`BackgroundTasks` is not a durable job queue; it has no persistence, retries or separate scaling.'
  answer: false
  explanation: This statement describes a known misconception. Use the underlying mechanism and test evidence rather
    than relying on the shortcut.
- id: background-jobs-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are implementing background jobs and task queues in a real application. What design decisions would
    you make, what failure case would you test, and what evidence would tell you the implementation is correct?
  rubric:
  - Describe the relevant mechanism and the design choice it implies.
  - Name a realistic failure or edge case and a concrete test for it.
  - Explain a security, correctness or operational trade-off.
  modelAnswer: Start with the system contract and its failure modes. Choose the simplest implementation that meets
    the contract, validate inputs at the boundary, and test both successful and unsuccessful cases. Observe the
    relevant status, state or output and document any limitations.
  explanation: A strong response links design decisions to observable behaviour and explicitly handles edge cases.
- id: background-jobs-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the function for background jobs and task queues. Implement the stated rule and make sure both
    ordinary and edge-case tests pass.
  starterCode: "def retry_delays(attempts, base=1, cap=30):\n    raise NotImplementedError('Complete this function')"
  solution: "def retry_delays(attempts, base=1, cap=30):\n    return [min(base * (2 ** i), cap) for i in range(max(0,\
    \ attempts))]"
  tests:
  - name: Core behaviour
    code: assert retry_delays(4) == [1, 2, 4, 8]
  - name: Edge cases
    code: 'assert retry_delays(6, base=2, cap=5) == [2, 4, 5, 5, 5, 5]

      assert retry_delays(-1) == []'
  hints:
  - Read the rule in the mental-model section before coding.
  - Keep the function deterministic and handle boundary cases explicitly.
  - Run every assertion before considering the exercise complete.
  explanation: This exercise checks practical application of the lesson rule and includes edge cases to help detect
    incorrect assumptions.
