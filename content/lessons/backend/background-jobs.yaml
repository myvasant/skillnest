id: backend.background-jobs
concept: backend.background-jobs
title: Background jobs and task queues
subtitle: Move slow work (emails, model inference, ingestion) out of the request with background tasks or a queue
  and workers, with retries and idempotency
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Move slow work (emails, model inference, ingestion) out of the request with background tasks or a queue
  and workers, with retries and idempotency.
objectives:
- Explain the core model behind background jobs and task queues.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: Background Tasks
  url: https://fastapi.tiangolo.com/tutorial/background-tasks/
  publisher: FastAPI
- title: Celery documentation
  url: https://docs.celeryq.dev/en/stable/
  publisher: Celery project
- title: Exponential Backoff And Jitter
  url: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
  publisher: AWS Architecture Blog
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Move slow work (emails, model inference, ingestion) out of the request with background tasks or a queue
      and workers, with retries and idempotency. Requests that send emails, call slow models or ingest documents
      should not keep users waiting or hit timeouts; background work keeps the API responsive and lets failures
      be retried.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- FastAPI `BackgroundTasks` run a function after the response is sent, in the same process; fine for
      small, non-critical work, but lost if the process restarts.

      - A task queue (Celery, RQ, arq, Dramatiq) puts a job message on a broker such as Redis or RabbitMQ; separate
      worker processes pull and run jobs and can be scaled independently.

      - Brokers usually deliver at least once, so tasks must be idempotent - running the same job twice must not
      charge or email twice (use job IDs and unique constraints).

      - Retry transient failures with exponential backoff, jitter and a maximum number of attempts; move jobs that
      keep failing to a dead-letter queue for inspection.

      - For long-running work, return `202 Accepted` with a job ID and let clients poll a status endpoint or receive
      a webhook.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- `BackgroundTasks` is not a durable job queue; it has no persistence, retries or separate scaling.

      - Retrying is not safe unless the task is idempotent.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def retry_delays(attempts, base=1, cap=30):\n    return [min(base * (2 ** i), cap) for i in range(max(0,\
      \ attempts))]\n\nprint(retry_delays(5))"
    caption: Runnable model of the lesson concept.
- id: practice
  title: Practice and implementation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper first, then run the provided assertions. Consider malformed input and boundary cases.
  - type: item
    ref: background-jobs-code
  - type: item
    ref: background-jobs-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - FastAPI `BackgroundTasks` run a function after the response is sent, in the same process; fine for small,
      non-critical work, but lost if the process restarts.

      - A task queue (Celery, RQ, arq, Dramatiq) puts a job message on a broker such as Redis or RabbitMQ; separate
      worker processes pull and run jobs and can be scaled independently.

      - Brokers usually deliver at least once, so tasks must be idempotent - running the same job twice must not
      charge or email twice (use job IDs and unique constraints).

      - Retry transient failures with exponential backoff, jitter and a maximum number of attempts; move jobs that
      keep failing to a dead-letter queue for inspection.

      - For long-running work, return `202 Accepted` with a job ID and let clients poll a status endpoint or receive
      a webhook.


      **Avoid**

      - `BackgroundTasks` is not a durable job queue; it has no persistence, retries or separate scaling.

      - Retrying is not safe unless the task is idempotent.'
