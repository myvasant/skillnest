cheatsheet: |
  ```text
                     predicted 0   predicted 1
  actual 0 (neg)        TN            FP   (false alarm)
  actual 1 (pos)        FN (miss)     TP

  accuracy  = (TP + TN) / all
  precision = TP / (TP + FP)        recall (TPR) = TP / (TP + FN)
  F1        = 2PR / (P + R)         FPR          = FP / (FP + TN)
  MAE = mean|e|    RMSE = sqrt(mean e²)    R² = 1 - Σe² / Σ(y - ȳ)²
  ```
  - Imbalanced data: accuracy misleads — show the confusion matrix and a baseline
  - Raise the threshold → precision ↑ recall ↓; choose it on validation data from the costs
  - ROC AUC = P(positive ranked above negative); not a threshold, not calibration
  - scikit-learn: `metric(y_true, y_pred)` — true values first; `roc_auc_score(y_true, scores)`
