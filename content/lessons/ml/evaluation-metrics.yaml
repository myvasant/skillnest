sections:
  - id: why
    title: The 99% accurate model that catches nothing
    kind: why
    blocks:
      - type: markdown
        body: |
          A bank sees 10 fraudulent transactions in every 1,000. Here is a "model" that simply approves
          everything:
      - type: code
        runnable: true
        code: |
          labels = [1] * 10 + [0] * 990          # 10 frauds in 1,000 transactions
          always_legit = [0] * len(labels)       # a "model" that never flags anything

          accuracy = sum(p == y for p, y in zip(always_legit, labels)) / len(labels)
          caught = sum(1 for p, y in zip(always_legit, labels) if p == 1 and y == 1)
          print("accuracy:", accuracy)
          print("frauds caught:", caught, "of", sum(labels))
        expectedOutput: |
          accuracy: 0.99
          frauds caught: 0 of 10
        caption: 99% accuracy, zero value. Accuracy hides the only cases that matter.
      - type: markdown
        body: |
          This is the **[accuracy paradox](glossary:accuracy-paradox)**: when one class is rare, a useless
          model can have excellent accuracy. The metric decides what "good" means, so a wrong metric lets
          a model look fine on paper while failing at its real job. This lesson builds the metrics that do
          not fall for it, from first principles, and checks every one against a hand calculation.

  - id: confusion-matrix
    title: The confusion matrix
    kind: concept
    blocks:
      - type: markdown
        body: |
          For a yes/no (binary) classifier, call the class you care about **positive** (fraud, spam,
          disease) and the other **negative**. Every prediction falls into one of four cells:

          | | **Predicted negative** | **Predicted positive** |
          |---|---|---|
          | **Actually negative** | True negative (TN) | [False positive](glossary:false-positive) (FP) — false alarm |
          | **Actually positive** | [False negative](glossary:false-negative) (FN) — miss | True positive (TP) |

          This table of counts is the **[confusion matrix](glossary:confusion-matrix)**. "True/false" says
          whether the prediction was right; "positive/negative" says what was predicted. Every
          classification metric is computed from these four numbers. Step through the counting loop:
      - type: visualization
        component: python-tracer
        title: Counting the four cells
        caption: Each (actual, predicted) pair increments exactly one counter. Watch which branch runs for each pair.
        props:
          code: |
            y_true = [1, 0, 1, 0, 1]
            y_pred = [1, 1, 0, 0, 1]
            tp = fp = fn = tn = 0
            for t, p in zip(y_true, y_pred):
                if t == 1 and p == 1:
                    tp += 1
                elif t == 0 and p == 1:
                    fp += 1
                elif t == 1 and p == 0:
                    fn += 1
                else:
                    tn += 1
            print(tp, fp, fn, tn)
      - type: markdown
        body: |
          A `Counter` over `(actual, predicted)` pairs does the same counting in one line. This is the
          ten-example dataset the rest of the lesson uses:
      - type: code
        runnable: true
        code: |
          from collections import Counter

          y_true = [1, 0, 1, 1, 0, 0, 1, 0, 0, 1]
          y_pred = [1, 0, 0, 1, 0, 1, 1, 0, 0, 0]

          counts = Counter(zip(y_true, y_pred))      # keys are (actual, predicted) pairs
          tp, fp = counts[(1, 1)], counts[(0, 1)]
          fn, tn = counts[(1, 0)], counts[(0, 0)]
          print(f"TP={tp} FP={fp} FN={fn} TN={tn}")
          print("               predicted 0   predicted 1")
          print(f"actual 0 (neg) {tn:^11}   {fp:^11}")
          print(f"actual 1 (pos) {fn:^11}   {tp:^11}")
        expectedOutput: |
          TP=3 FP=1 FN=2 TN=4
                         predicted 0   predicted 1
          actual 0 (neg)      4             1
          actual 1 (pos)      2             3
        caption: Rows are the actual class and columns the predicted class — the same layout scikit-learn's confusion_matrix uses.
        annotations:
          - line: 6
            text: "A missing key in a Counter counts as 0, so cells with no examples are handled automatically."
      - type: callout
        variant: warning
        title: Check the layout before reading someone else's matrix
        body: |
          scikit-learn puts actual classes in rows and predictions in columns, so for labels 0 and 1 the
          matrix is `[[TN, FP], [FN, TP]]`. Some textbooks and tools swap the axes or put the positive class
          first. Always check the labels before reading off TP and FP.
      - type: item
        ref: predict-precision

  - id: precision-recall
    title: Accuracy, precision, recall and F1
    kind: concept
    blocks:
      - type: markdown
        body: |
          | Metric | Formula | Question it answers |
          |---|---|---|
          | **Accuracy** | (TP + TN) / all | What fraction of all predictions were right? |
          | **[Precision](glossary:precision-metric)** | TP / (TP + FP) | When the model says "positive", how often is it right? |
          | **[Recall](glossary:recall-metric)** (sensitivity, true positive rate) | TP / (TP + FN) | Of the real positives, what fraction did it find? |
          | **[F1 score](glossary:f1-score)** | 2 · P · R / (P + R) | One number that is high only when **both** P and R are high |

          Precision is about the **flagged** items (the "predicted positive" column); recall is about the
          **actual** positives (the "actually positive" row). Here they are for the matrix above, checked
          against the hand calculation with `math.isclose`:
      - type: code
        runnable: true
        code: |
          import math

          tp, fp, fn, tn = 3, 1, 2, 4                  # from the confusion matrix above

          accuracy = (tp + tn) / (tp + fp + fn + tn)
          precision = tp / (tp + fp)                   # of the flagged items, how many were right?
          recall = tp / (tp + fn)                      # of the real positives, how many did we find?
          f1 = 2 * precision * recall / (precision + recall)

          print("accuracy ", accuracy)
          print("precision", precision)
          print("recall   ", recall)
          print("F1       ", round(f1, 4))

          # Check against the hand calculation: 7/10, 3/4, 3/5 and 2 * 0.75 * 0.6 / 1.35 = 2/3
          assert math.isclose(accuracy, 7 / 10) and math.isclose(precision, 3 / 4)
          assert math.isclose(recall, 3 / 5) and math.isclose(f1, 2 / 3)
          print("all match the hand calculation")
        expectedOutput: |
          accuracy  0.7
          precision 0.75
          recall    0.6
          F1        0.6667
          all match the hand calculation
        annotations:
          - line: 6
            text: 4 messages were flagged (TP + FP); 3 of them really were positive.
          - line: 7
            text: 5 messages were really positive (TP + FN); the model found 3 of them.
      - type: markdown
        body: |
          **Why a harmonic mean?** The F1 score is the harmonic mean of precision and recall, which is
          dragged down by whichever is smaller. A model that flags a single obvious fraud and misses 99
          others has perfect precision but useless recall:
      - type: code
        runnable: true
        code: |
          precision, recall = 1.0, 0.01        # flags one fraud correctly, misses 99
          arithmetic = (precision + recall) / 2
          f1 = 2 * precision * recall / (precision + recall)
          print("arithmetic mean:", arithmetic)
          print("F1 (harmonic):  ", round(f1, 4))
        expectedOutput: |
          arithmetic mean: 0.505
          F1 (harmonic):   0.0198
        caption: The arithmetic mean rewards the lopsided model with 0.5; F1 correctly reports that it is nearly useless.
      - type: callout
        variant: misconception
        title: '"Precision and recall are just two words for accuracy"'
        body: |
          They divide by different things. Precision divides by what the model **flagged**; recall divides by
          what was **actually there**. The "always legit" fraud model has accuracy 0.99, recall 0, and an
          undefined precision (it flagged nothing, so 0 / 0).
      - type: item
        ref: explain-accuracy-paradox

  - id: thresholds
    title: "Walkthrough: the decision threshold"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Most classifiers — [logistic regression](concept:ml.logistic-regression) included — output a
          **score** (often a probability) rather than a hard yes/no. A **[decision threshold](glossary:decision-threshold)**
          turns the score into a label: "positive if score ≥ threshold". 0.5 is only a default. Here are 12
          scored examples (6 positive, 6 negative) evaluated at four thresholds:
      - type: code
        runnable: true
        code: |
          labels = [1, 1, 1, 1, 0, 1, 0, 0, 1, 0, 0, 0]
          scores = [0.95, 0.9, 0.8, 0.7, 0.65, 0.6, 0.5, 0.4, 0.35, 0.3, 0.2, 0.1]

          for threshold in [0.3, 0.5, 0.7, 0.9]:
              preds = [1 if s >= threshold else 0 for s in scores]
              tp = sum(1 for y, p in zip(labels, preds) if y == 1 and p == 1)
              fp = sum(1 for y, p in zip(labels, preds) if y == 0 and p == 1)
              fn = sum(1 for y, p in zip(labels, preds) if y == 1 and p == 0)
              print(f"threshold {threshold}: flagged {tp + fp:2}  precision {tp / (tp + fp):.2f}  recall {tp / (tp + fn):.2f}")
        expectedOutput: |
          threshold 0.3: flagged 10  precision 0.60  recall 1.00
          threshold 0.5: flagged  7  precision 0.71  recall 0.83
          threshold 0.7: flagged  4  precision 1.00  recall 0.67
          threshold 0.9: flagged  2  precision 1.00  recall 0.33
        caption: Raising the threshold flags fewer items — precision rises, recall falls.
        annotations:
          - line: 5
            text: The model (the scores) never changes; only the rule that turns scores into decisions does.
      - type: markdown
        body: |
          This is the **precision–recall trade-off**. A low threshold catches every positive but raises
          many false alarms; a high threshold is almost never wrong when it fires but misses a lot. No
          threshold is "correct" in general — the right one depends on what each kind of mistake costs, as
          you will compute at the end of this lesson. Choose it on **validation** data, never on the test
          set.

  - id: roc
    title: ROC curves and AUC
    kind: concept
    blocks:
      - type: markdown
        body: |
          Instead of picking one threshold, you can look at **all** of them at once. An
          **[ROC curve](glossary:roc-curve)** plots, for every threshold:

          - the **true positive rate** (TPR = recall = TP / (TP + FN)) on the vertical axis, against
          - the **false positive rate** (FPR = FP / (FP + TN), the fraction of negatives wrongly flagged).

          Lowering the threshold from "flag nothing" (0, 0) to "flag everything" (1, 1) traces the curve. A
          perfect ranker goes straight up to (0, 1) first; a random one follows the diagonal. The **area
          under the curve**, [ROC AUC](glossary:roc-auc), summarises it: 1.0 is a perfect ranking, 0.5 is
          random guessing. AUC also has a direct meaning — the probability that a randomly chosen positive
          gets a higher score than a randomly chosen negative (ties count half). The code computes it both
          ways:
      - type: code
        runnable: true
        code: |
          labels = [1, 1, 1, 1, 0, 1, 0, 0, 1, 0, 0, 0]
          scores = [0.95, 0.9, 0.8, 0.7, 0.65, 0.6, 0.5, 0.4, 0.35, 0.3, 0.2, 0.1]
          pos = sum(labels)
          neg = len(labels) - pos

          points = [(0.0, 0.0)]                                   # threshold above every score
          for t in sorted(set(scores), reverse=True):             # lower the threshold step by step
              tp = sum(1 for y, s in zip(labels, scores) if s >= t and y == 1)
              fp = sum(1 for y, s in zip(labels, scores) if s >= t and y == 0)
              points.append((fp / neg, tp / pos))                 # (false positive rate, true positive rate)
          print([(round(x, 2), round(y, 2)) for x, y in points])

          area = sum((x2 - x1) * (y1 + y2) / 2 for (x1, y1), (x2, y2) in zip(points, points[1:]))
          print("AUC (area under the ROC curve):", round(area, 3))

          pairs = [(sp, sn) for sp, yp in zip(scores, labels) if yp == 1 for sn, yn in zip(scores, labels) if yn == 0]
          ranked = sum(1.0 if sp > sn else 0.5 if sp == sn else 0.0 for sp, sn in pairs)
          print("P(random positive scores above random negative):", round(ranked / len(pairs), 3))
        expectedOutput: |
          [(0.0, 0.0), (0.0, 0.17), (0.0, 0.33), (0.0, 0.5), (0.0, 0.67), (0.17, 0.67), (0.17, 0.83), (0.33, 0.83), (0.5, 0.83), (0.5, 1.0), (0.67, 1.0), (0.83, 1.0), (1.0, 1.0)]
          AUC (area under the ROC curve): 0.889
          P(random positive scores above random negative): 0.889
        caption: The trapezoid area and the pairwise ranking probability agree — 32 of the 36 (positive, negative) pairs are ranked correctly.
        annotations:
          - line: 7
            text: Sorting the distinct scores gives every threshold at which a prediction changes.
          - line: 13
            text: Trapezoid rule over consecutive ROC points.
          - line: 16
            text: Every (positive, negative) pair, 6 × 6 = 36 of them.
      - type: markdown
        body: |
          What AUC does **not** tell you:

          - **Which threshold to use.** It averages over all thresholds, including ones you would never
            deploy.
          - **Whether the scores are good probabilities.** Multiplying every score by 0.1 leaves AUC
            unchanged. Checking that "0.8" really means 80% is **calibration** (see the scikit-learn
            calibration guide).
          - **How it does on rare positives.** With 1 positive per 1,000, a small FPR still means a flood of
            false alarms. The **precision–recall curve** (and its summary, average precision) is more
            informative there; see [imbalanced data](concept:ml.imbalanced-data).
      - type: item
        ref: mcq-auc

  - id: regression-metrics
    title: "Regression metrics: MAE, RMSE and R²"
    kind: concept
    blocks:
      - type: markdown
        body: |
          When the model predicts a number, the errors are `actual − predicted`, and three summaries are
          standard:

          | Metric | Formula | Notes |
          |---|---|---|
          | **[MAE](glossary:mean-absolute-error)** | mean of `abs(error)` | Same units as the target; every unit of error counts the same |
          | **[RMSE](glossary:root-mean-squared-error)** | `sqrt(mean of error²)` | Same units; big errors count disproportionately (it is the square root of [MSE](glossary:mean-squared-error)) |
          | **[R²](glossary:r-squared)** | `1 − Σ error² / Σ (actual − mean)²` | 1 = perfect, 0 = no better than always predicting the mean, **negative** = worse than that |
      - type: code
        runnable: true
        code: |
          import math

          actual = [200, 150, 320, 410, 280]        # e.g. house prices in thousands
          predicted = [210, 140, 300, 430, 285]
          n = len(actual)
          errors = [a - p for a, p in zip(actual, predicted)]

          mae = sum(abs(e) for e in errors) / n
          mse = sum(e ** 2 for e in errors) / n
          rmse = math.sqrt(mse)
          mean_actual = sum(actual) / n
          ss_res = sum(e ** 2 for e in errors)
          ss_tot = sum((a - mean_actual) ** 2 for a in actual)
          r2 = 1 - ss_res / ss_tot

          print("errors:", errors)
          print("MAE ", mae)
          print("RMSE", round(rmse, 2))
          print("R²  ", round(r2, 4))
          assert mae == 65 / 5 and mse == 1025 / 5 and ss_tot == 41480
        expectedOutput: |
          errors: [-10, 10, 20, -20, -5]
          MAE  13.0
          RMSE 14.32
          R²   0.9753
        caption: "Hand check: |errors| sum to 65 (MAE 13); squares sum to 1,025 (MSE 205, RMSE ≈ 14.32); the mean is 272 and Σ(actual − 272)² = 41,480, so R² = 1 − 1025/41480 ≈ 0.975."
      - type: markdown
        body: |
          RMSE is always at least as large as MAE, and the gap grows when a few errors are large. Change one
          miss from 5 to 100 and compare:
      - type: code
        runnable: true
        code: |
          import math

          def mae(errors):
              return sum(abs(e) for e in errors) / len(errors)

          def rmse(errors):
              return math.sqrt(sum(e ** 2 for e in errors) / len(errors))

          small = [-10, 10, 20, -20, -5]
          one_big = [-10, 10, 20, -20, -100]          # the same, but one miss of 100
          print("MAE ", mae(small), "->", mae(one_big))
          print("RMSE", round(rmse(small), 1), "->", round(rmse(one_big), 1))
        expectedOutput: |
          MAE  13.0 -> 32.0
          RMSE 14.3 -> 46.9
        caption: One large miss more than triples RMSE. Use RMSE when big misses are disproportionately bad; MAE when every unit of error costs the same.
      - type: callout
        variant: misconception
        title: '"R² is a squared number, so it cannot be negative"'
        body: |
          R² is defined as 1 − SS_res / SS_tot, not as a square. A model that is worse than always predicting
          the mean of the evaluation data has SS_res > SS_tot and a **negative** R². Predicting
          `[30, 20, 10]` for actual values `[10, 20, 30]` gives R² = −3.0.

  - id: choosing
    title: Choosing a metric by the cost of errors
    kind: application
    blocks:
      - type: markdown
        body: |
          Start from the decision the model drives and ask: **what does each kind of mistake cost?**

          | Situation | Costly mistake | Emphasise |
          |---|---|---|
          | Screening test for a serious disease (positives get a follow-up test) | Missing a sick patient (FN) | Recall, at an acceptable precision |
          | Spam filter moving mail out of the inbox | Hiding a real email (FP) | Precision, at an acceptable recall |
          | Fraud alerts reviewed by analysts | Both, with known costs | Expected cost; precision at the review capacity |
          | Delivery-time estimate shown to customers | Large misses annoy far more | RMSE (or a high percentile of the error) |
          | Inventory forecast where each unit of error costs the same | Every unit equally | MAE |

          When the costs are known, compute them directly and pick the threshold that minimises the total
          on validation data. Suppose an analyst review costs 5 and a missed fraud costs 100:
      - type: code
        runnable: true
        code: |
          labels = [1, 1, 1, 1, 0, 1, 0, 0, 1, 0, 0, 0]
          scores = [0.95, 0.9, 0.8, 0.7, 0.65, 0.6, 0.5, 0.4, 0.35, 0.3, 0.2, 0.1]
          COST_FP = 5       # an analyst reviews a legitimate transaction
          COST_FN = 100     # a fraud goes through unnoticed

          def cost_at(threshold):
              preds = [1 if s >= threshold else 0 for s in scores]
              fp = sum(1 for y, p in zip(labels, preds) if y == 0 and p == 1)
              fn = sum(1 for y, p in zip(labels, preds) if y == 1 and p == 0)
              return fp * COST_FP + fn * COST_FN

          for t in [0.2, 0.35, 0.5, 0.7]:
              print("threshold", t, "cost", cost_at(t))
          best = min(sorted(set(scores)), key=cost_at)
          print("cheapest threshold:", best)
        expectedOutput: |
          threshold 0.2 cost 25
          threshold 0.35 cost 15
          threshold 0.5 cost 110
          threshold 0.7 cost 200
          cheapest threshold: 0.35
        caption: Because a miss costs 20 times a review, the best threshold is far below the default 0.5.
      - type: callout
        variant: production
        title: Report metrics like a professional
        body: |
          Always show the confusion matrix and a baseline next to any headline number; state the threshold;
          report uncertainty (the spread across cross-validation folds, or a bootstrap interval); and break
          metrics down by important groups (regions, devices, customer segments) — an average can hide a
          segment where the model fails, which is also the starting point of a [fairness](concept:ml.fairness)
          review.
      - type: item
        ref: mcq-metric-choice

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `ZeroDivisionError: division by zero` in precision | The model predicted no positives (TP + FP = 0) | Decide what an undefined metric means (often 0.0) and handle it explicitly |
          | Precision and recall look swapped | Arguments passed as `(y_pred, y_true)` | scikit-learn's metrics take `(y_true, y_pred)` — true values first |
          | 99% accuracy, but users complain | Imbalanced classes | Report precision, recall, the confusion matrix and a baseline |
          | Great AUC, poor decisions in production | The threshold (or calibration) was never chosen for the real costs | Tune the threshold on validation data with the real costs |
          | R² looks great on one dataset, terrible on another | R² depends on how much the targets vary in each dataset | Compare MAE/RMSE in units, against a baseline |
          | Metrics computed on the training data | Optimistic scores | Use held-out data ([train/val/test](concept:ml.train-val-test)) |
      - type: code
        runnable: true
        code: |
          y_true = [1, 0, 1, 0]
          y_pred = [0, 0, 0, 0]          # the model never predicts the positive class
          tp = sum(1 for t, p in zip(y_true, y_pred) if t == 1 and p == 1)
          fp = sum(1 for t, p in zip(y_true, y_pred) if t == 0 and p == 1)
          print("tp:", tp, "fp:", fp)
          precision = tp / (tp + fp)
        expectedOutput: |
          tp: 0 fp: 0
        expectError: ZeroDivisionError
        caption: "Precision is 0 / 0 here. scikit-learn's precision_score returns 0.0 with an UndefinedMetricWarning by default (zero_division='warn'); plain Python raises ZeroDivisionError: division by zero."
      - type: item
        ref: debug-recall

