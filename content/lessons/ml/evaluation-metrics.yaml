id: ml.evaluation-metrics
concept: ml.evaluation-metrics
title: Evaluation Metrics
subtitle: Choosing numbers that match the cost of mistakes
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  A fraud model that never flags fraud is 99% accurate. Learn to build a confusion matrix from
  predictions, compute accuracy, precision, recall and F1, see how the decision threshold trades them
  off, understand ROC curves and AUC, measure regression errors with MAE, RMSE and R², and pick the
  metric that matches what each kind of mistake costs.
objectives:
  - Build a confusion matrix (TP, FP, FN, TN) from true labels and predictions in pure Python.
  - Compute accuracy, precision, recall and F1 by hand and in code, and explain the accuracy paradox on imbalanced data.
  - Explain how moving the decision threshold trades precision against recall, and what an ROC curve and AUC summarise.
  - Compute MAE, RMSE and R² for regression and explain how each responds to large errors.
  - Choose a metric — or an explicit cost function and threshold — from the real cost of false positives and false negatives.
