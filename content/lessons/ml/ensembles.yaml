id: ml.ensembles
concept: ml.ensembles
title: Random forests and gradient boosting
subtitle: Combining many trees — by averaging (bagging) or by correcting errors sequentially (boosting) — gives
  the strongest models for most tabular data
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Combining many trees — by averaging (bagging) or by correcting errors sequentially (boosting) — gives the
  strongest models for most tabular data.
objectives:
- Explain the learning problem and assumptions behind random forests and gradient boosting.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: 'Ensembles: gradient boosting, random forests, bagging, voting, stacking'
  url: https://scikit-learn.org/stable/modules/ensemble.html
  publisher: scikit-learn
- title: XGBoost documentation
  url: https://xgboost.readthedocs.io/en/stable/
  publisher: XGBoost contributors
- title: LightGBM documentation
  url: https://lightgbm.readthedocs.io/en/stable/
  publisher: Microsoft
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Combining many trees — by averaging (bagging) or by correcting errors sequentially (boosting) — gives
      the strongest models for most tabular data. For tabular business data, gradient-boosted trees and random forests
      are usually the most accurate practical models and remain the standard choice alongside deep learning.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Bagging trains many trees on bootstrap samples and averages them, which reduces variance; random forests
      also sample features at each split to decorrelate the trees.

      - Boosting adds shallow trees one at a time, each fitted to the errors (loss gradients) of the current ensemble;
      learning rate and number of trees trade off against each other.

      - Libraries such as XGBoost, LightGBM, CatBoost and scikit-learn''s `HistGradientBoostingClassifier` are fast
      on large data and handle missing values natively.

      - Random forests work well with little tuning; boosting usually wins after tuning, with early stopping on
      validation data.

      - Out-of-bag samples (rows left out of each bootstrap) give a random forest a built-in validation estimate.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Adding trees does not make a random forest overfit, but adding boosting rounds can — use early stopping.

      - Tree ensembles cannot extrapolate; they never predict outside the range of targets seen in training.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "from collections import Counter\ndef majority_vote(predictions):\n    if not predictions: raise ValueError(\"\
      no predictions\")\n    counts=Counter(predictions); highest=max(counts.values())\n    return sorted(label\
      \ for label,count in counts.items() if count==highest)[0]\n\nprint(majority_vote([\"cat\",\"dog\",\"cat\"\
      ]))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: ensembles-code
  - type: item
    ref: ensembles-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Bagging trains many trees on bootstrap samples and averages them, which reduces variance; random forests
      also sample features at each split to decorrelate the trees.

      - Boosting adds shallow trees one at a time, each fitted to the errors (loss gradients) of the current ensemble;
      learning rate and number of trees trade off against each other.

      - Libraries such as XGBoost, LightGBM, CatBoost and scikit-learn''s `HistGradientBoostingClassifier` are fast
      on large data and handle missing values natively.

      - Random forests work well with little tuning; boosting usually wins after tuning, with early stopping on
      validation data.

      - Out-of-bag samples (rows left out of each bootstrap) give a random forest a built-in validation estimate.


      **Limitations**

      - Adding trees does not make a random forest overfit, but adding boosting rounds can — use early stopping.

      - Tree ensembles cannot extrapolate; they never predict outside the range of targets seen in training.'
  - type: item
    ref: ensembles-mcq
  - type: item
    ref: ensembles-tf
  - type: item
    ref: ensembles-code
items:
- id: ensembles-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of random forests and gradient boosting?
  explanation: Bagging trains many trees on bootstrap samples and averages them, which reduces variance; random
    forests also sample features at each split to decorrelate the trees.
  options:
  - id: a
    text: Bagging trains many trees on bootstrap samples and averages them, which reduces variance; random forests
      also sample features at each split to decorrelate the trees.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Adding trees does not make a random forest overfit, but adding boosting rounds can — use early stopping.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: ensembles-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Adding trees does not make a random forest overfit, but adding boosting rounds can — use early stopping.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: ensembles-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using random forests and gradient boosting for a real prediction task. What assumptions must hold,
    what failure mode would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: ensembles-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for random forests and gradient boosting. The tests check the central rule and a boundary
    case.
  starterCode: "from collections import Counter\n\ndef majority_vote(predictions):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "from collections import Counter\ndef majority_vote(predictions):\n    if not predictions: raise ValueError(\"\
    no predictions\")\n    counts=Counter(predictions); highest=max(counts.values())\n    return sorted(label for\
    \ label,count in counts.items() if count==highest)[0]"
  tests:
  - name: Core behaviour
    code: assert majority_vote(["cat","dog","cat"]) == "cat"
  - name: Edge case
    code: 'assert majority_vote(["b","a"]) == "a"

      try: majority_vote([])

      except ValueError: pass

      else: raise AssertionError("empty vote must fail")'
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - ensembles-mcq
  - ensembles-tf
  - ensembles-code
