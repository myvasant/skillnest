id: ml.hyperparameter-tuning
concept: ml.hyperparameter-tuning
title: Hyperparameter tuning
subtitle: Search model settings with grid, random or Bayesian search inside cross-validation — never on the test
  set
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Search model settings with grid, random or Bayesian search inside cross-validation — never on the test
  set.
objectives:
- Explain the learning problem and assumptions behind hyperparameter tuning.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Tuning the hyper-parameters of an estimator
  url: https://scikit-learn.org/stable/modules/grid_search.html
  publisher: scikit-learn
- title: Random Search for Hyper-Parameter Optimization
  url: https://www.jmlr.org/papers/v13/bergstra12a.html
  publisher: Journal of Machine Learning Research (Bergstra and Bengio, 2012)
- title: Optuna documentation
  url: https://optuna.readthedocs.io/en/stable/
  publisher: Optuna contributors
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Search model settings with grid, random or Bayesian search inside cross-validation — never on the test
      set. Default settings are rarely best for your data, but careless tuning overfits the validation data and
      gives falsely optimistic scores.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Parameters (weights) are learned from data; hyperparameters (tree depth, learning rate, regularisation
      strength) are set before training.

      - Grid search tries every combination, so cost multiplies with each added hyperparameter; random search usually
      finds good settings faster when only a few hyperparameters matter.

      - Bayesian optimisation and TPE (for example in Optuna) use past trials to pick promising settings; successive
      halving and Hyperband stop poor trials early.

      - Search scale-like hyperparameters (learning rate, `C`, `alpha`) on a log scale.

      - Tune with cross-validation on training data only, then evaluate the chosen configuration once on the test
      set.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Tuning rarely rescues weak features or leakage; fix the data and problem framing first.

      - The best score from a large search is optimistically biased, because you selected it out of many noisy estimates.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def parameter_grid(grid):\n    keys=list(grid)\n    if not keys: return [{}]\n    results=[{}]\n    for\
      \ key in keys: results=[{**row,key:value} for row in results for value in grid[key]]\n    return results\n\
      \nprint(parameter_grid({\"depth\":[2,4],\"rate\":[0.1,0.2]}))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: hyperparameter-tuning-code
  - type: item
    ref: hyperparameter-tuning-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Parameters (weights) are learned from data; hyperparameters (tree depth, learning rate, regularisation strength)
      are set before training.

      - Grid search tries every combination, so cost multiplies with each added hyperparameter; random search usually
      finds good settings faster when only a few hyperparameters matter.

      - Bayesian optimisation and TPE (for example in Optuna) use past trials to pick promising settings; successive
      halving and Hyperband stop poor trials early.

      - Search scale-like hyperparameters (learning rate, `C`, `alpha`) on a log scale.

      - Tune with cross-validation on training data only, then evaluate the chosen configuration once on the test
      set.


      **Limitations**

      - Tuning rarely rescues weak features or leakage; fix the data and problem framing first.

      - The best score from a large search is optimistically biased, because you selected it out of many noisy estimates.'
  - type: item
    ref: hyperparameter-tuning-mcq
  - type: item
    ref: hyperparameter-tuning-tf
  - type: item
    ref: hyperparameter-tuning-code
items:
- id: hyperparameter-tuning-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of hyperparameter tuning?
  explanation: Parameters (weights) are learned from data; hyperparameters (tree depth, learning rate, regularisation
    strength) are set before training.
  options:
  - id: a
    text: Parameters (weights) are learned from data; hyperparameters (tree depth, learning rate, regularisation
      strength) are set before training.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Tuning rarely rescues weak features or leakage; fix the data and problem framing first.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: hyperparameter-tuning-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Tuning rarely rescues weak features or leakage; fix the data and problem framing first.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: hyperparameter-tuning-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using hyperparameter tuning for a real prediction task. What assumptions must hold, what failure
    mode would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: hyperparameter-tuning-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for hyperparameter tuning. The tests check the central rule and a boundary case.
  starterCode: "def parameter_grid(grid):\n    raise NotImplementedError('Complete this function')"
  solution: "def parameter_grid(grid):\n    keys=list(grid)\n    if not keys: return [{}]\n    results=[{}]\n  \
    \  for key in keys: results=[{**row,key:value} for row in results for value in grid[key]]\n    return results"
  tests:
  - name: Core behaviour
    code: assert len(parameter_grid({"depth":[2,4],"rate":[0.1,0.2]})) == 4
  - name: Edge case
    code: assert parameter_grid({}) == [{}]
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - hyperparameter-tuning-mcq
  - hyperparameter-tuning-tf
  - hyperparameter-tuning-code
