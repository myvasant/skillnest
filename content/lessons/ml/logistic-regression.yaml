id: ml.logistic-regression
concept: ml.logistic-regression
title: Logistic regression and classification
subtitle: Pass a linear score through a sigmoid to get a probability, train with cross-entropy, and choose a decision
  threshold
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Pass a linear score through a sigmoid to get a probability, train with cross-entropy, and choose a decision
  threshold.
objectives:
- Explain the learning problem and assumptions behind logistic regression and classification.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Linear models — logistic regression
  url: https://scikit-learn.org/stable/modules/linear_model.html
  publisher: scikit-learn
- title: An Introduction to Statistical Learning (free book)
  url: https://www.statlearning.com/
  publisher: James, Witten, Hastie, Tibshirani and Taylor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Pass a linear score through a sigmoid to get a probability, train with cross-entropy, and choose a decision
      threshold. Many business problems are yes/no decisions (fraud, churn, spam); logistic regression gives fast,
      interpretable probabilities and is the building block of neural-network classifiers.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Compute a linear score `z = X @ w + b`, then `p = 1 / (1 + exp(-z))`, the probability of the positive
      class.

      - Train by minimising log loss (binary cross-entropy) `-(y*log(p) + (1-y)*log(1-p))`; there is no closed form,
      so iterative solvers are used.

      - The decision boundary `z = 0` is linear in the features; each coefficient is the change in log-odds per
      unit of its feature.

      - The 0.5 threshold is only a default; choose the threshold from the relative cost of false positives and
      false negatives.

      - Multi-class problems use softmax (multinomial) regression or one-vs-rest.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Despite its name, logistic regression is a classification model; it regresses the log-odds.

      - scikit-learn''s `LogisticRegression` applies L2 regularisation by default (strength set by `C`, default
      1.0), so unscaled features change both results and coefficients.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import math\ndef sigmoid(z):\n    if z >= 0: return 1 / (1 + math.exp(-z))\n    exp_z = math.exp(z);\
      \ return exp_z / (1 + exp_z)\n\nprint(round(sigmoid(0), 3), round(sigmoid(2), 3))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: logistic-regression-code
  - type: item
    ref: logistic-regression-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Compute a linear score `z = X @ w + b`, then `p = 1 / (1 + exp(-z))`, the probability of the positive class.

      - Train by minimising log loss (binary cross-entropy) `-(y*log(p) + (1-y)*log(1-p))`; there is no closed form,
      so iterative solvers are used.

      - The decision boundary `z = 0` is linear in the features; each coefficient is the change in log-odds per
      unit of its feature.

      - The 0.5 threshold is only a default; choose the threshold from the relative cost of false positives and
      false negatives.

      - Multi-class problems use softmax (multinomial) regression or one-vs-rest.


      **Limitations**

      - Despite its name, logistic regression is a classification model; it regresses the log-odds.

      - scikit-learn''s `LogisticRegression` applies L2 regularisation by default (strength set by `C`, default
      1.0), so unscaled features change both results and coefficients.'
  - type: item
    ref: logistic-regression-mcq
  - type: item
    ref: logistic-regression-tf
  - type: item
    ref: logistic-regression-code
items:
- id: logistic-regression-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of logistic regression and classification?
  explanation: Compute a linear score `z = X @ w + b`, then `p = 1 / (1 + exp(-z))`, the probability of the positive
    class.
  options:
  - id: a
    text: Compute a linear score `z = X @ w + b`, then `p = 1 / (1 + exp(-z))`, the probability of the positive
      class.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Despite its name, logistic regression is a classification model; it regresses the log-odds.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: logistic-regression-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Despite its name, logistic regression is a classification model; it regresses the log-odds.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: logistic-regression-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using logistic regression and classification for a real prediction task. What assumptions must
    hold, what failure mode would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: logistic-regression-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for logistic regression and classification. The tests check the central rule and a
    boundary case.
  starterCode: "import math\n\ndef sigmoid(z):\n    raise NotImplementedError('Complete this function')"
  solution: "import math\ndef sigmoid(z):\n    if z >= 0: return 1 / (1 + math.exp(-z))\n    exp_z = math.exp(z);\
    \ return exp_z / (1 + exp_z)"
  tests:
  - name: Core behaviour
    code: assert sigmoid(0) == 0.5
  - name: Edge case
    code: 'assert sigmoid(10) > 0.99

      assert sigmoid(-10) < 0.01'
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
