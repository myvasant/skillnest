id: ml.overfitting
concept: ml.overfitting
title: Overfitting, underfitting and regularisation
subtitle: The bias–variance trade-off; overfit models memorise noise, and regularisation (L1/L2, simpler models,
  more data) restores generalisation
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: The bias–variance trade-off; overfit models memorise noise, and regularisation (L1/L2, simpler models,
  more data) restores generalisation.
objectives:
- Explain the learning problem and assumptions behind overfitting, underfitting and regularisation.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: 'Validation curves: plotting scores to evaluate models'
  url: https://scikit-learn.org/stable/modules/learning_curve.html
  publisher: scikit-learn
- title: An Introduction to Statistical Learning (free book)
  url: https://www.statlearning.com/
  publisher: James, Witten, Hastie, Tibshirani and Taylor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: The bias–variance trade-off; overfit models memorise noise, and regularisation (L1/L2, simpler models,
      more data) restores generalisation. Diagnosing whether a model is too simple or too flexible tells you what
      to do next — more features, more data, or more regularisation.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Underfitting means high error on both training and validation data (high bias); overfitting means low
      training error but much higher validation error (high variance).

      - For squared error, expected test error = bias² + variance + irreducible noise; model flexibility trades
      bias against variance.

      - Learning curves (error vs training-set size) and validation curves (error vs a complexity setting) show
      which problem you have.

      - L2 (ridge) shrinks all weights; L1 (lasso) drives some to exactly zero, performing feature selection; the
      strength is a hyperparameter chosen by validation.

      - Other remedies are more or cleaner data, fewer features, simpler models and early stopping.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- More data helps an overfitting model but does little for an underfitting one, which needs more capacity
      or better features.

      - In scikit-learn, `alpha` is regularisation strength but `C` is its inverse, so a larger `C` means less regularisation.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def generalization_gap(train_score, validation_score):\n    return train_score - validation_score\n\n\
      print(generalization_gap(0.99, 0.78))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: overfitting-code
  - type: item
    ref: overfitting-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Underfitting means high error on both training and validation data (high bias); overfitting means low training
      error but much higher validation error (high variance).

      - For squared error, expected test error = bias² + variance + irreducible noise; model flexibility trades
      bias against variance.

      - Learning curves (error vs training-set size) and validation curves (error vs a complexity setting) show
      which problem you have.

      - L2 (ridge) shrinks all weights; L1 (lasso) drives some to exactly zero, performing feature selection; the
      strength is a hyperparameter chosen by validation.

      - Other remedies are more or cleaner data, fewer features, simpler models and early stopping.


      **Limitations**

      - More data helps an overfitting model but does little for an underfitting one, which needs more capacity
      or better features.

      - In scikit-learn, `alpha` is regularisation strength but `C` is its inverse, so a larger `C` means less regularisation.'
  - type: item
    ref: overfitting-mcq
  - type: item
    ref: overfitting-tf
  - type: item
    ref: overfitting-code
items:
- id: overfitting-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of overfitting, underfitting and regularisation?
  explanation: Underfitting means high error on both training and validation data (high bias); overfitting means
    low training error but much higher validation error (high variance).
  options:
  - id: a
    text: Underfitting means high error on both training and validation data (high bias); overfitting means low
      training error but much higher validation error (high variance).
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: More data helps an overfitting model but does little for an underfitting one, which needs more capacity
      or better features.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: overfitting-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: More data helps an overfitting model but does little for an underfitting one, which needs more capacity
    or better features.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: overfitting-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using overfitting, underfitting and regularisation for a real prediction task. What assumptions
    must hold, what failure mode would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: overfitting-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for overfitting, underfitting and regularisation. The tests check the central rule
    and a boundary case.
  starterCode: "def generalization_gap(train_score, validation_score):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def generalization_gap(train_score, validation_score):\n    return train_score - validation_score"
  tests:
  - name: Core behaviour
    code: assert round(generalization_gap(0.99, 0.78), 2) == 0.21
  - name: Edge case
    code: assert generalization_gap(0.8, 0.82) < 0
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - overfitting-mcq
  - overfitting-tf
  - overfitting-code
