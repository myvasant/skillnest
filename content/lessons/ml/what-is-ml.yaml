id: ml.what-is-ml
concept: ml.what-is-ml
title: What Machine Learning Is (and Isn't)
subtitle: From hand-written rules to rules learned from examples
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  Write a spam filter by hand, watch it fail, then let the computer choose the decision rule from
  labelled examples. Along the way you learn how AI, machine learning, deep learning and generative AI
  relate, what features, labels, models, training and prediction mean, and when ML is the wrong tool.
objectives:
  - Explain how machine learning differs from traditional programming using rules, data and answers.
  - Place AI, machine learning, deep learning and generative AI correctly relative to each other, with examples.
  - Identify the features, label, model, parameters, training step and prediction step in a concrete problem.
  - Implement a tiny learning algorithm that chooses a decision threshold from labelled examples.
  - Compare a learned model against a simple baseline and decide whether ML is appropriate for a problem.
  - Name the main learning types (supervised, unsupervised, self-supervised, reinforcement) and what data each needs.
sources:
