id: ml.clustering
concept: ml.clustering
title: Clustering
subtitle: Group similar items without labels using k-means, hierarchical clustering or DBSCAN, and judge results
  with care
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Group similar items without labels using k-means, hierarchical clustering or DBSCAN, and judge results
  with care.
objectives:
- Explain the learning problem and assumptions behind clustering.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Clustering
  url: https://scikit-learn.org/stable/modules/clustering.html
  publisher: scikit-learn
- title: An Introduction to Statistical Learning (free book)
  url: https://www.statlearning.com/
  publisher: James, Witten, Hastie, Tibshirani and Taylor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Group similar items without labels using k-means, hierarchical clustering or DBSCAN, and judge results
      with care. Clustering lets you segment customers, group documents or spot unusual behaviour when nobody has
      labelled the data.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- k-means alternates between assigning points to the nearest of `k` centroids and moving each centroid
      to its points'' mean; it assumes compact, similar-sized clusters and needs `k` up front.

      - Use k-means++ initialisation with several restarts, and scale features first, because results depend on
      the starting points and on units.

      - Agglomerative (hierarchical) clustering repeatedly merges the closest clusters; the linkage (Ward, average,
      complete) changes the result, and a dendrogram shows structure at every level.

      - DBSCAN grows clusters from dense regions using `eps` and `min_samples`, finds arbitrary shapes, labels outliers
      as noise and does not need `k`.

      - Judge clusters with internal scores (silhouette, Davies–Bouldin), stability across runs and, above all,
      whether they are useful for the task.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Most real data has no single "correct" number of clusters; the elbow method and silhouette score are
      heuristics.

      - k-means always returns `k` clusters, even when the data has no cluster structure at all.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def nearest_centroid(point, centroids):\n    if not centroids: raise ValueError(\"no centroids\")\n \
      \   def distance(a,b): return sum((x-y)**2 for x,y in zip(a,b))\n    if any(len(point)!=len(c) for c in centroids):\
      \ raise ValueError(\"dimension mismatch\")\n    return min(range(len(centroids)), key=lambda i: distance(point,\
      \ centroids[i]))\n\nprint(nearest_centroid([1,1], [[0,0],[3,3]]))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: clustering-code
  - type: item
    ref: clustering-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - k-means alternates between assigning points to the nearest of `k` centroids and moving each centroid to
      its points'' mean; it assumes compact, similar-sized clusters and needs `k` up front.

      - Use k-means++ initialisation with several restarts, and scale features first, because results depend on
      the starting points and on units.

      - Agglomerative (hierarchical) clustering repeatedly merges the closest clusters; the linkage (Ward, average,
      complete) changes the result, and a dendrogram shows structure at every level.

      - DBSCAN grows clusters from dense regions using `eps` and `min_samples`, finds arbitrary shapes, labels outliers
      as noise and does not need `k`.

      - Judge clusters with internal scores (silhouette, Davies–Bouldin), stability across runs and, above all,
      whether they are useful for the task.


      **Limitations**

      - Most real data has no single "correct" number of clusters; the elbow method and silhouette score are heuristics.

      - k-means always returns `k` clusters, even when the data has no cluster structure at all.'
  - type: item
    ref: clustering-mcq
  - type: item
    ref: clustering-tf
  - type: item
    ref: clustering-code
items:
- id: clustering-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of clustering?
  explanation: k-means alternates between assigning points to the nearest of `k` centroids and moving each centroid
    to its points' mean; it assumes compact, similar-sized clusters and needs `k` up front.
  options:
  - id: a
    text: k-means alternates between assigning points to the nearest of `k` centroids and moving each centroid to
      its points' mean; it assumes compact, similar-sized clusters and needs `k` up front.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Most real data has no single "correct" number of clusters; the elbow method and silhouette score are heuristics.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: clustering-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Most real data has no single "correct" number of clusters; the elbow method and silhouette score are heuristics.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: clustering-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using clustering for a real prediction task. What assumptions must hold, what failure mode would
    you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: clustering-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for clustering. The tests check the central rule and a boundary case.
  starterCode: "def nearest_centroid(point, centroids):\n    raise NotImplementedError('Complete this function')"
  solution: "def nearest_centroid(point, centroids):\n    if not centroids: raise ValueError(\"no centroids\")\n\
    \    def distance(a,b): return sum((x-y)**2 for x,y in zip(a,b))\n    if any(len(point)!=len(c) for c in centroids):\
    \ raise ValueError(\"dimension mismatch\")\n    return min(range(len(centroids)), key=lambda i: distance(point,\
    \ centroids[i]))"
  tests:
  - name: Core behaviour
    code: assert nearest_centroid([1,1], [[0,0],[3,3]]) == 0
  - name: Edge case
    code: 'assert nearest_centroid([4,4], [[0,0],[3,3]]) == 1

      try: nearest_centroid([1], [[1,2]])

      except ValueError: pass

      else: raise AssertionError("dimension mismatch must fail")'
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - clustering-mcq
  - clustering-tf
  - clustering-code
