id: ml.reproducibility
concept: ml.reproducibility
title: Reproducible ML
subtitle: Fix seeds, pin versions, record data versions and parameters, and log every experiment so results can
  be repeated and compared
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Fix seeds, pin versions, record data versions and parameters, and log every experiment so results can be
  repeated and compared.
objectives:
- Explain the learning problem and assumptions behind reproducible ml.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Common pitfalls — controlling randomness
  url: https://scikit-learn.org/stable/common_pitfalls.html
  publisher: scikit-learn
- title: MLflow documentation
  url: https://mlflow.org/docs/latest/
  publisher: MLflow (Linux Foundation)
- title: DVC documentation
  url: https://doc.dvc.org/
  publisher: DVC
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Fix seeds, pin versions, record data versions and parameters, and log every experiment so results can
      be repeated and compared. A result nobody can reproduce cannot be trusted, debugged, audited or improved —
      and "it worked on my laptop" is common in ML.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Set seeds for every source of randomness — `random_state` in scikit-learn, `numpy.random.default_rng(seed)`,
      and framework seeds for deep learning.

      - Pin exact package versions with a lock file and record the Python version, OS and hardware.

      - Version the data by snapshot ID, table version or content hash (for example with DVC or lakehouse time travel).

      - Log each run''s code commit, parameters, metrics and artefacts in an experiment tracker so runs can be compared.

      - Some GPU operations are non-deterministic; exact repeatability may require deterministic modes that run
      slower.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A fixed seed is not enough if the data, library versions or hardware change.

      - Reporting only the best seed is cherry-picking; report the variation across several seeds.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def experiment_record(seed, dataset_version, parameters):\n    return {\"seed\":seed,\"dataset_version\"\
      :dataset_version,\"parameters\":dict(sorted(parameters.items()))}\n\nprint(experiment_record(42, \"v3\", {\"\
      depth\":4,\"rate\":0.1}))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: reproducibility-code
  - type: item
    ref: reproducibility-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Set seeds for every source of randomness — `random_state` in scikit-learn, `numpy.random.default_rng(seed)`,
      and framework seeds for deep learning.

      - Pin exact package versions with a lock file and record the Python version, OS and hardware.

      - Version the data by snapshot ID, table version or content hash (for example with DVC or lakehouse time travel).

      - Log each run''s code commit, parameters, metrics and artefacts in an experiment tracker so runs can be compared.

      - Some GPU operations are non-deterministic; exact repeatability may require deterministic modes that run
      slower.


      **Limitations**

      - A fixed seed is not enough if the data, library versions or hardware change.

      - Reporting only the best seed is cherry-picking; report the variation across several seeds.'
  - type: item
    ref: reproducibility-mcq
  - type: item
    ref: reproducibility-tf
  - type: item
    ref: reproducibility-code
items:
- id: reproducibility-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of reproducible ml?
  explanation: Set seeds for every source of randomness — `random_state` in scikit-learn, `numpy.random.default_rng(seed)`,
    and framework seeds for deep learning.
  options:
  - id: a
    text: Set seeds for every source of randomness — `random_state` in scikit-learn, `numpy.random.default_rng(seed)`,
      and framework seeds for deep learning.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: A fixed seed is not enough if the data, library versions or hardware change.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: reproducibility-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A fixed seed is not enough if the data, library versions or hardware change.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: reproducibility-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using reproducible ml for a real prediction task. What assumptions must hold, what failure mode
    would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: reproducibility-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for reproducible ml. The tests check the central rule and a boundary case.
  starterCode: "def experiment_record(seed, dataset_version, parameters):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def experiment_record(seed, dataset_version, parameters):\n    return {\"seed\":seed,\"dataset_version\"\
    :dataset_version,\"parameters\":dict(sorted(parameters.items()))}"
  tests:
  - name: Core behaviour
    code: assert experiment_record(42,"v3",{"rate":0.1,"depth":4})["parameters"] == {"depth":4,"rate":0.1}
  - name: Edge case
    code: assert experiment_record(42,"v3",{})["seed"] == 42
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - reproducibility-mcq
  - reproducibility-tf
  - reproducibility-code
