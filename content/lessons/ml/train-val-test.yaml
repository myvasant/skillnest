id: ml.train-val-test
concept: ml.train-val-test
title: Training, Validation and Test Sets
subtitle: Honest estimates of how a model will do on data it has never seen
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  A model that memorises its training data can score 100% and still be useless. Learn why models must be
  judged on held-out data, how to shuffle and split reproducibly with a seed, what the validation and test
  sets are each for, and how stratified, time-based and grouped splits prevent misleading scores.
objectives:
  - Explain generalisation and why accuracy on the training data overestimates performance on new data.
  - Implement a reproducible, seeded train/validation/test split in pure Python without mutating the input.
  - Describe the distinct jobs of the training, validation and test sets, and why the test set is used once.
  - Choose between random, stratified, time-ordered and grouped splits for a given dataset.
  - Recognise early signs of data leakage, such as preprocessing fitted on all data or entities shared across splits.
