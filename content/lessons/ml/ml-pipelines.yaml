id: ml.ml-pipelines
concept: ml.ml-pipelines
title: ML pipelines
subtitle: Bundle preprocessing and the model into one pipeline so the same transformations are fitted only on training
  data and applied consistently
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Bundle preprocessing and the model into one pipeline so the same transformations are fitted only on training
  data and applied consistently.
objectives:
- Explain the learning problem and assumptions behind ml pipelines.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Pipelines and composite estimators
  url: https://scikit-learn.org/stable/modules/compose.html
  publisher: scikit-learn
- title: Common pitfalls and recommended practices
  url: https://scikit-learn.org/stable/common_pitfalls.html
  publisher: scikit-learn
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Bundle preprocessing and the model into one pipeline so the same transformations are fitted only on training
      data and applied consistently. Hand-written preprocessing drifts between notebook, training job and serving
      code; a single pipeline object prevents both leakage and train–serve skew.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A `Pipeline` is a sequence of transformers ending in an estimator; `fit` fits each step in order on
      training data, and `predict` applies the fitted steps and then the model.

      - `ColumnTransformer` applies different preprocessing to different columns, for example impute and scale numerics
      but one-hot encode categoricals.

      - Cross-validating or grid-searching the whole pipeline refits preprocessing inside every fold; step parameters
      are addressed as `step__param`.

      - The fitted pipeline is the deployable artefact — serving calls one `predict` on raw input with the same
      columns used in training.

      - Handle unseen categories explicitly, for example `OneHotEncoder(handle_unknown="ignore")`.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Preprocessing the whole dataset in pandas and putting only the model in a pipeline still leaks information
      across folds.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def transform_then_predict(value, transform, model):\n    features=transform(value)\n    return model(features)\n\
      \nprint(transform_then_predict(3, lambda x: [x, x*x], lambda xs: sum(xs)))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: ml-pipelines-code
  - type: item
    ref: ml-pipelines-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A `Pipeline` is a sequence of transformers ending in an estimator; `fit` fits each step in order on training
      data, and `predict` applies the fitted steps and then the model.

      - `ColumnTransformer` applies different preprocessing to different columns, for example impute and scale numerics
      but one-hot encode categoricals.

      - Cross-validating or grid-searching the whole pipeline refits preprocessing inside every fold; step parameters
      are addressed as `step__param`.

      - The fitted pipeline is the deployable artefact — serving calls one `predict` on raw input with the same
      columns used in training.

      - Handle unseen categories explicitly, for example `OneHotEncoder(handle_unknown="ignore")`.


      **Limitations**

      - Preprocessing the whole dataset in pandas and putting only the model in a pipeline still leaks information
      across folds.'
  - type: item
    ref: ml-pipelines-mcq
  - type: item
    ref: ml-pipelines-tf
  - type: item
    ref: ml-pipelines-code
items:
- id: ml-pipelines-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of ml pipelines?
  explanation: A `Pipeline` is a sequence of transformers ending in an estimator; `fit` fits each step in order
    on training data, and `predict` applies the fitted steps and then the model.
  options:
  - id: a
    text: A `Pipeline` is a sequence of transformers ending in an estimator; `fit` fits each step in order on training
      data, and `predict` applies the fitted steps and then the model.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Preprocessing the whole dataset in pandas and putting only the model in a pipeline still leaks information
      across folds.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: ml-pipelines-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Preprocessing the whole dataset in pandas and putting only the model in a pipeline still leaks information
    across folds.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: ml-pipelines-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using ml pipelines for a real prediction task. What assumptions must hold, what failure mode would
    you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: ml-pipelines-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for ml pipelines. The tests check the central rule and a boundary case.
  starterCode: "def transform_then_predict(value, transform, model):\n    raise NotImplementedError('Complete this\
    \ function')"
  solution: "def transform_then_predict(value, transform, model):\n    features=transform(value)\n    return model(features)"
  tests:
  - name: Core behaviour
    code: assert transform_then_predict(3, lambda x:[x,x*x], sum) == 12
  - name: Edge case
    code: assert transform_then_predict(0, lambda x:[x], lambda xs:xs[0]) == 0
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - ml-pipelines-mcq
  - ml-pipelines-tf
  - ml-pipelines-code
