id: ml.data-leakage
concept: ml.data-leakage
title: Data leakage
subtitle: Information from the future or from the test set leaking into training produces models that look great
  and fail in production
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Information from the future or from the test set leaking into training produces models that look great
  and fail in production.
objectives:
- Explain the learning problem and assumptions behind data leakage.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Common pitfalls and recommended practices
  url: https://scikit-learn.org/stable/common_pitfalls.html
  publisher: scikit-learn
- title: Rules of Machine Learning
  url: https://developers.google.com/machine-learning/guides/rules-of-ml
  publisher: Google for Developers
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Information from the future or from the test set leaking into training produces models that look great
      and fail in production. Leakage is the most common reason a model with excellent offline scores collapses
      after deployment, and it is invisible unless you look for it.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Target leakage — a feature that is only known after the outcome (such as "refund issued" when predicting
      fraud) or is derived from the label.

      - Train–test contamination — fitting scalers, imputers, encoders or feature selection on the full dataset
      before splitting.

      - Temporal leakage — random splits of time-ordered data, or features such as rolling averages that include
      future values.

      - Group leakage — the same customer, patient or near-duplicate record appearing in both training and test
      sets.

      - Red flags are suspiciously high scores or one feature dominating; for every feature ask "would I know this
      value at prediction time?"'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Leakage is not only about the test set; duplicates and near-duplicates across splits leak just as badly.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def has_temporal_leakage(feature_time, prediction_time):\n    return feature_time > prediction_time\n\
      \nprint(has_temporal_leakage(\"2025-02-02\", \"2025-02-01\"))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: data-leakage-code
  - type: item
    ref: data-leakage-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Target leakage — a feature that is only known after the outcome (such as "refund issued" when predicting
      fraud) or is derived from the label.

      - Train–test contamination — fitting scalers, imputers, encoders or feature selection on the full dataset
      before splitting.

      - Temporal leakage — random splits of time-ordered data, or features such as rolling averages that include
      future values.

      - Group leakage — the same customer, patient or near-duplicate record appearing in both training and test
      sets.

      - Red flags are suspiciously high scores or one feature dominating; for every feature ask "would I know this
      value at prediction time?"


      **Limitations**

      - Leakage is not only about the test set; duplicates and near-duplicates across splits leak just as badly.'
  - type: item
    ref: data-leakage-mcq
  - type: item
    ref: data-leakage-tf
  - type: item
    ref: data-leakage-code
items:
- id: data-leakage-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of data leakage?
  explanation: Target leakage — a feature that is only known after the outcome (such as "refund issued" when predicting
    fraud) or is derived from the label.
  options:
  - id: a
    text: Target leakage — a feature that is only known after the outcome (such as "refund issued" when predicting
      fraud) or is derived from the label.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Leakage is not only about the test set; duplicates and near-duplicates across splits leak just as badly.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: data-leakage-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Leakage is not only about the test set; duplicates and near-duplicates across splits leak just as badly.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: data-leakage-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using data leakage for a real prediction task. What assumptions must hold, what failure mode would
    you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: data-leakage-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for data leakage. The tests check the central rule and a boundary case.
  starterCode: "def has_temporal_leakage(feature_time, prediction_time):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def has_temporal_leakage(feature_time, prediction_time):\n    return feature_time > prediction_time"
  tests:
  - name: Core behaviour
    code: assert has_temporal_leakage("2025-02-02", "2025-02-01") is True
  - name: Edge case
    code: assert has_temporal_leakage("2025-01-01", "2025-02-01") is False
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - data-leakage-mcq
  - data-leakage-tf
  - data-leakage-code
cheatsheet: '**Core ideas**

  - Target leakage — a feature that is only known after the outcome (such as "refund issued" when predicting fraud)
  or is derived from the label.

  - Train–test contamination — fitting scalers, imputers, encoders or feature selection on the full dataset before
  splitting.

  - Temporal leakage — random splits of time-ordered data, or features such as rolling averages that include future
  values.

  - Group leakage — the same customer, patient or near-duplicate record appearing in both training and test sets.

  - Red flags are suspiciously high scores or one feature dominating; for every feature ask "would I know this value
  at prediction time?"


  **Evaluation risks**

  - Leakage is not only about the test set; duplicates and near-duplicates across splits leak just as badly.'
