id: ml.fairness
concept: ml.fairness
title: Fairness and bias in ML
subtitle: Biased data and objectives produce unfair outcomes; measure performance across groups and understand the
  trade-offs between fairness definitions
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Biased data and objectives produce unfair outcomes; measure performance across groups and understand the
  trade-offs between fairness definitions.
objectives:
- Explain the learning problem and assumptions behind fairness and bias in ml.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Fairness and Machine Learning (free book)
  url: https://fairmlbook.org/
  publisher: Barocas, Hardt and Narayanan
- title: Fairlearn user guide
  url: https://fairlearn.org/main/user_guide/index.html
  publisher: Fairlearn contributors
- title: AI Risk Management Framework
  url: https://www.nist.gov/itl/ai-risk-management-framework
  publisher: NIST
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Biased data and objectives produce unfair outcomes; measure performance across groups and understand the
      trade-offs between fairness definitions. Models used for hiring, lending, healthcare or policing can harm
      people at scale, and organisations face legal and reputational consequences when they do.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Bias enters through data (historical discrimination, under-representation, noisy labels), proxy features
      (postcode standing in for ethnicity) and the objective itself.

      - Disaggregate evaluation — compute selection rates, false positive and false negative rates and calibration
      separately for each group.

      - Demographic parity asks for equal selection rates, equalised odds for equal true and false positive rates,
      calibration for equally reliable scores; when base rates differ these generally cannot all hold at once.

      - Mitigations include better data, reweighting, fairness constraints during training and group-specific thresholds,
      each needing legal and domain review.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Dropping the protected attribute ("fairness through unawareness") does not remove bias, because correlated
      proxies remain.

      - There is no single technical definition of fairness; choosing one is a value and policy decision, not only
      an engineering one.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def selection_rates(groups):\n    return {name: sum(values)/len(values) if values else None for name,values\
      \ in groups.items()}\n\ndef rate_gap(groups):\n    rates=[v for v in selection_rates(groups).values() if v\
      \ is not None]\n    return max(rates)-min(rates) if rates else None\n\nprint(rate_gap({\"A\":[1,1,0],\"B\"\
      :[1,0,0]}))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: fairness-code
  - type: item
    ref: fairness-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Bias enters through data (historical discrimination, under-representation, noisy labels), proxy features
      (postcode standing in for ethnicity) and the objective itself.

      - Disaggregate evaluation — compute selection rates, false positive and false negative rates and calibration
      separately for each group.

      - Demographic parity asks for equal selection rates, equalised odds for equal true and false positive rates,
      calibration for equally reliable scores; when base rates differ these generally cannot all hold at once.

      - Mitigations include better data, reweighting, fairness constraints during training and group-specific thresholds,
      each needing legal and domain review.


      **Limitations**

      - Dropping the protected attribute ("fairness through unawareness") does not remove bias, because correlated
      proxies remain.

      - There is no single technical definition of fairness; choosing one is a value and policy decision, not only
      an engineering one.'
  - type: item
    ref: fairness-mcq
  - type: item
    ref: fairness-tf
  - type: item
    ref: fairness-code
items:
- id: fairness-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of fairness and bias in ml?
  explanation: Bias enters through data (historical discrimination, under-representation, noisy labels), proxy features
    (postcode standing in for ethnicity) and the objective itself.
  options:
  - id: a
    text: Bias enters through data (historical discrimination, under-representation, noisy labels), proxy features
      (postcode standing in for ethnicity) and the objective itself.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Dropping the protected attribute ("fairness through unawareness") does not remove bias, because correlated
      proxies remain.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: fairness-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Dropping the protected attribute ("fairness through unawareness") does not remove bias, because correlated
    proxies remain.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: fairness-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using fairness and bias in ml for a real prediction task. What assumptions must hold, what failure
    mode would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: fairness-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for fairness and bias in ml. The tests check the central rule and a boundary case.
  starterCode: "def selection_rates(groups):\n    raise NotImplementedError('Complete this function')\n\ndef rate_gap(groups):\n\
    \    raise NotImplementedError('Complete this function')"
  solution: "def selection_rates(groups):\n    return {name: sum(values)/len(values) if values else None for name,values\
    \ in groups.items()}\n\ndef rate_gap(groups):\n    rates=[v for v in selection_rates(groups).values() if v is\
    \ not None]\n    return max(rates)-min(rates) if rates else None"
  tests:
  - name: Core behaviour
    code: assert abs(rate_gap({"A":[1,1,0],"B":[1,0,0]}) - (2/3-1/3)) < 1e-9
  - name: Edge case
    code: assert rate_gap({"A":[],"B":[]}) is None
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - fairness-mcq
  - fairness-tf
  - fairness-code
