id: ml.decision-trees
concept: ml.decision-trees
title: Decision trees
subtitle: Trees split data with if/else questions chosen to reduce impurity; they are interpretable but overfit
  easily
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Trees split data with if/else questions chosen to reduce impurity; they are interpretable but overfit easily.
objectives:
- Explain the learning problem and assumptions behind decision trees.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: Decision trees
  url: https://scikit-learn.org/stable/modules/tree.html
  publisher: scikit-learn
- title: An Introduction to Statistical Learning (free book)
  url: https://www.statlearning.com/
  publisher: James, Witten, Hastie, Tibshirani and Taylor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Trees split data with if/else questions chosen to reduce impurity; they are interpretable but overfit
      easily. Trees handle mixed feature types and non-linear interactions with no scaling, can be read as rules,
      and are the building block of the strongest tabular models.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- At each node the tree greedily picks the feature and threshold that most reduce impurity — Gini or
      entropy (information gain) for classification, squared error for regression.

      - Leaves predict the majority class (or class proportions) or the mean target of the training rows that reach
      them.

      - An unconstrained tree grows until leaves are pure and memorises the training set; limit it with `max_depth`,
      `min_samples_leaf` or cost-complexity pruning (`ccp_alpha`).

      - Small changes in the data can produce a very different tree (high variance), which is what ensembles fix.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Near-100% training accuracy from a deep tree is a warning sign of overfitting, not a success.

      - Impurity-based feature importances are biased towards high-cardinality features; do not treat them as ground
      truth.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def gini(labels):\n    if not labels: return 0.0\n    total=len(labels); counts={x:labels.count(x) for\
      \ x in set(labels)}\n    return 1 - sum((n/total)**2 for n in counts.values())\n\nprint(round(gini([\"yes\"\
      ,\"yes\",\"no\",\"no\"]), 3))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: decision-trees-code
  - type: item
    ref: decision-trees-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - At each node the tree greedily picks the feature and threshold that most reduce impurity — Gini or entropy
      (information gain) for classification, squared error for regression.

      - Leaves predict the majority class (or class proportions) or the mean target of the training rows that reach
      them.

      - An unconstrained tree grows until leaves are pure and memorises the training set; limit it with `max_depth`,
      `min_samples_leaf` or cost-complexity pruning (`ccp_alpha`).

      - Small changes in the data can produce a very different tree (high variance), which is what ensembles fix.


      **Limitations**

      - Near-100% training accuracy from a deep tree is a warning sign of overfitting, not a success.

      - Impurity-based feature importances are biased towards high-cardinality features; do not treat them as ground
      truth.'
  - type: item
    ref: decision-trees-mcq
  - type: item
    ref: decision-trees-tf
  - type: item
    ref: decision-trees-code
items:
- id: decision-trees-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of decision trees?
  explanation: At each node the tree greedily picks the feature and threshold that most reduce impurity — Gini or
    entropy (information gain) for classification, squared error for regression.
  options:
  - id: a
    text: At each node the tree greedily picks the feature and threshold that most reduce impurity — Gini or entropy
      (information gain) for classification, squared error for regression.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Near-100% training accuracy from a deep tree is a warning sign of overfitting, not a success.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: decision-trees-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Near-100% training accuracy from a deep tree is a warning sign of overfitting, not a success.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: decision-trees-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using decision trees for a real prediction task. What assumptions must hold, what failure mode
    would you test, and how would you evaluate the result on unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: decision-trees-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for decision trees. The tests check the central rule and a boundary case.
  starterCode: "def gini(labels):\n    raise NotImplementedError('Complete this function')"
  solution: "def gini(labels):\n    if not labels: return 0.0\n    total=len(labels); counts={x:labels.count(x)\
    \ for x in set(labels)}\n    return 1 - sum((n/total)**2 for n in counts.values())"
  tests:
  - name: Core behaviour
    code: assert gini(["a","a","a"]) == 0
  - name: Edge case
    code: 'assert gini(["a","b"]) == 0.5

      assert gini([]) == 0.0'
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - decision-trees-mcq
  - decision-trees-tf
  - decision-trees-code
