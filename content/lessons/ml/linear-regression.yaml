id: ml.linear-regression
concept: ml.linear-regression
title: Linear Regression
subtitle: Fitting a line by minimising squared error
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Predict a number as a weighted sum of features. You will define the model y = w·x + b, measure its
  errors with mean squared error, fit it by gradient descent written in pure Python, check the answer
  against the closed-form solution, and learn to read coefficients and residuals honestly.
objectives:
  - Write the linear model y_hat = w·x + b and explain what the weight and the intercept mean in the units of the data.
  - Compute mean squared error by hand and in code, and explain why errors are squared.
  - Implement gradient descent for linear regression in pure Python, including the gradients of the MSE.
  - Compute the closed-form least-squares solution for one feature and verify it against gradient descent.
  - Diagnose a fit from its residuals and from the behaviour of the training loss (convergence vs divergence).
  - Extend the model to several features and relate it to scikit-learn's LinearRegression.
