sections:
  - id: why
    title: Predicting a number
    kind: why
    blocks:
      - type: markdown
        body: |
          A food-delivery app wants to promise a delivery time. Five past orders give the distance in km
          and the time it took in minutes. Without a model, the best single guess is the **mean** time —
          the regression [baseline](glossary:baseline-model). A line that uses distance should do better.
          To compare guesses we need a score; we use the average squared miss, the
          [mean squared error](glossary:mean-squared-error):
      - type: code
        runnable: true
        code: |
          xs = [1, 2, 3, 4, 5]          # delivery distance in km
          ys = [9, 11, 15, 17, 18]      # delivery time in minutes

          mean_y = sum(ys) / len(ys)
          baseline_preds = [mean_y for _ in xs]               # ignore distance entirely
          line_preds = [2 * x + 8 for x in xs]                # a guessed line: 2 min per km + 8

          def mse(ys, preds):
              return sum((y - p) ** 2 for y, p in zip(ys, preds)) / len(ys)

          print("mean baseline MSE:", mse(ys, baseline_preds))
          print("guessed line MSE: ", mse(ys, line_preds))
        expectedOutput: |
          mean baseline MSE: 12.0
          guessed line MSE:  0.8
        caption: Even a guessed line is 15 times better than the mean. Can we find the best line automatically?
        annotations:
          - line: 4
            text: The mean time is 14 minutes; the baseline predicts 14 for every order.
          - line: 9
            text: Square each miss, then average. Lower is better; 0 would be perfect.
      - type: markdown
        body: |
          [Linear regression](glossary:linear-regression) answers that question. It is the simplest useful
          model for numbers and a strong baseline in its own right — and its ideas (a loss, gradients, a
          learning rate, parameters) are exactly the ones used to train neural networks.

  - id: model
    title: "The model: y = w·x + b"
    kind: concept
    blocks:
      - type: markdown
        body: |
          With one feature `x`, the model predicts

          ```text
          y_hat = w * x + b
          ```

          - `w` is the **weight** (slope, [coefficient](glossary:regression-coefficient)): how much the
            prediction changes when `x` increases by one unit.
          - `b` is the **intercept** (bias): the prediction when `x` is 0.
          - `y_hat` ("y hat") is the prediction; `y` is the true value.

          `w` and `b` are the model's [parameters](glossary:model-parameter). Training means choosing them.
      - type: code
        runnable: true
        code: |
          def predict(x, w, b):
              return w * x + b

          print(predict(4, w=2, b=8))
          print([predict(x, 2.5, 6) for x in [1, 2, 3]])
        expectedOutput: |
          16
          [8.5, 11.0, 13.5]
        caption: 'With w = 2 and b = 8, a 4 km order is predicted to take 2 × 4 + 8 = 16 minutes.'
      - type: callout
        variant: misconception
        title: '"Linear" means linear in the parameters'
        body: |
          The prediction must be a weighted sum of the inputs, but the inputs can be anything you compute:
          `x`, `x ** 2`, `log(x)`, `x1 * x2`. A model `w1 * x + w2 * x ** 2 + b` draws a curve, and it is
          still linear regression, because it is linear in `w1`, `w2` and `b`.

  - id: loss
    title: "The loss: mean squared error"
    kind: concept
    blocks:
      - type: markdown
        body: |
          For each example the **error** (or residual) is `y - y_hat`. The mean squared error averages the
          squared errors:

          ```text
          MSE = (1/n) * Σ (y_i - y_hat_i)²
          ```

          Why square?

          1. **Signs cannot cancel.** Errors of +5 and -5 would average to 0; their squares do not.
          2. **Big misses cost more.** A miss of 4 costs 16, four times a miss of 2. Squared error prefers
             many small errors to a few large ones.
          3. **It is smooth.** MSE has a derivative everywhere, which is what gradient descent needs, and
             for a linear model it has a single minimum (it is *convex*).

          Here is a hand calculation you can check line by line:
      - type: code
        runnable: true
        code: |
          ys = [9, 11, 15]
          preds = [10, 11, 13]
          errors = [y - p for y, p in zip(ys, preds)]
          print("errors:", errors)
          print("squared:", [e ** 2 for e in errors])
          print("MSE:", sum(e ** 2 for e in errors) / len(errors))
        expectedOutput: |
          errors: [-1, 0, 2]
          squared: [1, 0, 4]
          MSE: 1.6666666666666667
        caption: (1 + 0 + 4) / 3 = 1.67 square minutes. Its square root, about 1.29 minutes, is back in the original units (RMSE).
      - type: item
        ref: predict-mse

  - id: gradient-descent
    title: "Walkthrough: fitting by gradient descent"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          The MSE is a function of the two parameters, `MSE(w, b)`. We want the `w` and `b` at its lowest
          point. [Gradient descent](concept:math.optimization) gets there by repeatedly stepping
          **downhill**:

          1. Compute the slope of the loss with respect to each parameter (the *gradient*).
          2. Move each parameter a small step **against** its slope: `w ← w − lr · ∂MSE/∂w`.
          3. Repeat until the loss stops falling.

          The step size `lr` is the **learning rate**. For MSE the slopes have a simple form. Writing
          `e_i = y_hat_i − y_i` for prediction minus target:

          ```text
          ∂MSE/∂w = (2/n) Σ e_i · x_i        ∂MSE/∂b = (2/n) Σ e_i
          ```

          (Chain rule: the derivative of `e²` is `2e`, and `e` changes by `x_i` per unit of `w` and by 1
          per unit of `b`.) Before running a full loop, step through **one** update on three points that
          lie exactly on `y = 2x + 1`:
      - type: visualization
        component: python-tracer
        title: One gradient-descent step
        caption: >-
          Starting from w = b = 0, every prediction is too low, so all errors are negative and both
          gradients are negative. Subtracting a negative step increases w and b.
        props:
          code: |
            xs = [1, 2, 3]
            ys = [3, 5, 7]
            w, b, lr = 0.0, 0.0, 0.1
            errors = [w * x + b - y for x, y in zip(xs, ys)]
            dw = 2 / 3 * sum(e * x for e, x in zip(errors, xs))
            db = 2 / 3 * sum(errors)
            w = w - lr * dw
            b = b - lr * db
            print(round(w, 3), round(b, 3))
      - type: markdown
        body: |
          Now the full loop on the delivery data, printing progress:
      - type: code
        runnable: true
        code: |
          xs = [1, 2, 3, 4, 5]          # distance in km
          ys = [9, 11, 15, 17, 18]      # minutes

          def mse(w, b):
              return sum((w * x + b - y) ** 2 for x, y in zip(xs, ys)) / len(xs)

          def gradients(w, b):
              n = len(xs)
              errors = [w * x + b - y for x, y in zip(xs, ys)]     # prediction minus target
              dw = 2 / n * sum(e * x for e, x in zip(errors, xs))
              db = 2 / n * sum(errors)
              return dw, db

          w, b = 0.0, 0.0
          lr = 0.05
          for step in range(2001):
              if step in (0, 10, 100, 500, 1000, 2000):
                  print(f"step {step:4}: w={w:.3f}  b={b:.3f}  mse={mse(w, b):.3f}")
              dw, db = gradients(w, b)
              w, b = w - lr * dw, b - lr * db
        expectedOutput: |
          step    0: w=0.000  b=0.000  mse=208.000
          step   10: w=3.731  b=1.995  mse=4.682
          step  100: w=2.687  b=5.764  mse=0.675
          step  500: w=2.400  b=6.799  mse=0.480
          step 1000: w=2.400  b=6.800  mse=0.480
          step 2000: w=2.400  b=6.800  mse=0.480
        caption: The loss falls quickly at first, then creeps towards its minimum of 0.48 at w = 2.4, b = 6.8.
        annotations:
          - line: 9
            text: Positive error = the prediction is too high.
          - line: 20
            text: Both gradients were computed from the same old w and b; now both are updated together.
      - type: markdown
        body: |
          Notice that `w` overshoots to 3.7 early on while `b` is still small, then both settle. Gradient
          descent never "knows" the answer; it only ever looks at the local slope. The visualization below
          shows the same process for a single parameter: imagine `b` fixed and the loss as a function of
          `w` alone, a parabola with its minimum at 2.4.
      - type: visualization
        component: gradient-descent
        title: Gradient descent on one parameter
        caption: >-
          This loss is (w − 2.4)², a simplified one-parameter version. Try learning rates of 0.1 (smooth),
          0.9 (overshoots and oscillates but converges) and 1.05 (diverges). Real losses have different
          curvature, so the safe range of learning rates depends on the data — which is why the delivery
          data diverges at 0.1 (see Common mistakes).
        props:
          target: 2.4
          start: -2
          learningRate: 0.1

  - id: closed-form
    title: The closed-form solution for one feature
    kind: concept
    blocks:
      - type: markdown
        body: |
          For linear regression we do not actually need to search: setting both derivatives to zero and
          solving gives the **[ordinary least squares](glossary:ordinary-least-squares)** formulas
          directly. With one feature:

          ```text
          w = Σ (x_i − x̄)(y_i − ȳ) / Σ (x_i − x̄)²        b = ȳ − w · x̄
          ```

          where `x̄` and `ȳ` are the means. In words: the slope is how much `x` and `y` vary *together*,
          divided by how much `x` varies on its own. Python's standard library even includes this as
          `statistics.linear_regression`, so we can check our arithmetic:
      - type: code
        runnable: true
        code: |
          import statistics

          xs = [1, 2, 3, 4, 5]
          ys = [9, 11, 15, 17, 18]

          x_mean = sum(xs) / len(xs)
          y_mean = sum(ys) / len(ys)
          w = sum((x - x_mean) * (y - y_mean) for x, y in zip(xs, ys)) / sum((x - x_mean) ** 2 for x in xs)
          b = y_mean - w * x_mean
          print("closed form:", round(w, 6), round(b, 6))

          fit = statistics.linear_regression(xs, ys)
          print("statistics: ", round(fit.slope, 6), round(fit.intercept, 6))
        expectedOutput: |
          closed form: 2.4 6.8
          statistics:  2.4 6.8
        caption: The same w and b that gradient descent found after 1,000 steps, computed in one go.
        annotations:
          - line: 8
            text: "By hand: x deviations −2, −1, 0, 1, 2; y deviations −5, −3, 1, 3, 4; products sum to 24; squares sum to 10; w = 2.4."
          - line: 9
            text: The best line always passes through the point of means (x̄, ȳ) = (3, 14).
          - line: 10
            text: Rounding hides tiny floating-point noise such as 6.800000000000001.
      - type: callout
        variant: note
        title: Then why ever use gradient descent?
        body: |
          With many features the closed form needs a matrix solve whose cost grows roughly with the cube of
          the number of features, and it must hold all the data at once. Gradient descent (especially its
          mini-batch form) works on huge datasets in pieces and generalises to models with no closed form
          at all — logistic regression and every neural network. Linear regression is where you can see
          both methods agree.
      - type: item
        ref: explain-squared

  - id: interpreting
    title: Interpreting the coefficients
    kind: concept
    blocks:
      - type: markdown
        body: |
          Our fitted model is **minutes ≈ 2.4 × km + 6.8**.

          - **Slope 2.4**: in this data, each extra kilometre goes with about 2.4 more minutes of delivery
            time, on average.
          - **Intercept 6.8**: the predicted time at 0 km — perhaps the time to prepare and hand over the
            order. Here it is plausible; often it is not, because `x = 0` lies far outside the data (a
            house with 0 m² of floor area). Do not interpret an intercept you never observed.

          Three cautions that apply to every regression:

          1. **Units matter.** Measure distance in metres and the slope becomes 0.0024. A coefficient's size
             says nothing about importance until features share a scale.
          2. **Association, not causation.** The slope summarises how the variables moved together in this
             data. It does not prove that changing `x` would change `y`.
          3. **Extrapolation is risky.** The data covers 1–5 km. The model will happily predict 246.8
             minutes for 100 km, but nothing in the data supports that.
      - type: item
        ref: mcq-coefficient

  - id: residuals
    title: Residuals tell you what the model missed
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [residual](glossary:residual) is `actual − predicted` for one example. Looking at them is the
          single most useful check of a regression:
      - type: code
        runnable: true
        code: |
          xs = [1, 2, 3, 4, 5]
          ys = [9, 11, 15, 17, 18]
          w, b = 2.4, 6.8
          for x, y in zip(xs, ys):
              pred = w * x + b
              print(f"x={x}  actual={y}  predicted={pred:.1f}  residual={y - pred:+.1f}")
          print("sum of residuals:", round(sum(y - (w * x + b) for x, y in zip(xs, ys)), 10))
        expectedOutput: |
          x=1  actual=9  predicted=9.2  residual=-0.2
          x=2  actual=11  predicted=11.6  residual=-0.6
          x=3  actual=15  predicted=14.0  residual=+1.0
          x=4  actual=17  predicted=16.4  residual=+0.6
          x=5  actual=18  predicted=18.8  residual=-0.8
          sum of residuals: 0.0
        caption: Small, mixed-sign residuals with no pattern. With an intercept, least-squares residuals always sum to zero.
      - type: markdown
        body: |
          Now fit a straight line to data that is actually curved (`y = x²`). The text bars show the
          residuals:
      - type: code
        runnable: true
        code: |
          def fit_line(xs, ys):
              x_mean, y_mean = sum(xs) / len(xs), sum(ys) / len(ys)
              w = sum((x - x_mean) * (y - y_mean) for x, y in zip(xs, ys)) / sum((x - x_mean) ** 2 for x in xs)
              return w, y_mean - w * x_mean

          xs = [0, 1, 2, 3, 4, 5, 6]
          ys = [x ** 2 for x in xs]                 # a curved relationship
          w, b = fit_line(xs, ys)
          print("slope", w, "intercept", b)
          for x, y in zip(xs, ys):
              r = y - (w * x + b)
              bar = ("+" if r > 0 else "-") * round(abs(r))
              print(f"x={x}  residual={r:+5.1f}  {bar}")
        expectedOutput: |
          slope 6.0 intercept -5.0
          x=0  residual= +5.0  +++++
          x=1  residual= +0.0
          x=2  residual= -3.0  ---
          x=3  residual= -4.0  ----
          x=4  residual= -3.0  ---
          x=5  residual= +0.0
          x=6  residual= +5.0  +++++
        caption: Positive at both ends, negative in the middle — a U-shape. The line is systematically wrong, not randomly wrong.
      - type: markdown
        body: |
          A **pattern** in the residuals means the model is missing structure. Here the fix is an
          engineered feature: add `x²` as a second input and the model fits perfectly — still linear
          regression, because it is linear in the parameters. Other common patterns: residuals that grow
          with `x` (the spread is not constant; try predicting `log(y)`), or a few huge residuals
          (outliers that squared error weighs heavily).
      - type: item
        ref: mcq-residuals

  - id: multiple-features
    title: "Preview: several features"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Real predictions use many features: distance, time of day, number of items, weather. The model
          becomes a weighted sum — a [dot product](concept:math.vectors) of a weight vector with the
          feature vector:

          ```text
          y_hat = w1·x1 + w2·x2 + ... + wd·xd + b  =  w · x + b
          ```

          For a whole dataset stacked as a matrix `X` (one row per example) this is `X @ w + b`, as in
          [matrix multiplication](concept:math.matrices). Gradient descent is unchanged: each weight's
          gradient is `(2/n) Σ e_i · x_ij`, using its own feature column. Below, the data is generated
          from known weights so we can check that training recovers them:
      - type: code
        runnable: true
        code: |
          import random

          rng = random.Random(0)
          X = [[rng.random(), rng.random()] for _ in range(50)]   # two features per row
          y = [2 * x1 + 3 * x2 + 1 for x1, x2 in X]               # true weights 2 and 3, bias 1

          w = [0.0, 0.0]
          b = 0.0
          lr = 0.3
          for step in range(3000):
              preds = [sum(wj * xj for wj, xj in zip(w, row)) + b for row in X]
              errors = [p - t for p, t in zip(preds, y)]
              grad_w = [2 / len(X) * sum(e * row[j] for e, row in zip(errors, X)) for j in range(len(w))]
              grad_b = 2 / len(X) * sum(errors)
              w = [wj - lr * g for wj, g in zip(w, grad_w)]
              b = b - lr * grad_b
          print([round(wj, 3) for wj in w], round(b, 3))
        expectedOutput: |
          [2.0, 3.0] 1.0
        caption: Training recovers the weights used to generate the data (real data has noise, so you never get them exactly).
        annotations:
          - line: 11
            text: "One prediction per row: the dot product of the weights with that row, plus the bias."
          - line: 13
            text: The gradient for weight j uses column j of every row.
      - type: callout
        variant: warning
        title: Scale your features
        body: |
          With features on very different scales (distance in metres next to number of items), one weight's
          gradient dwarfs the others and no single learning rate suits them all: training either crawls or
          diverges. Standardising each feature (subtract the training mean, divide by the training standard
          deviation) fixes this — fitted on the training set only, as you saw in
          [train/validation/test](concept:ml.train-val-test).

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | Loss grows every step, then `OverflowError`, `inf` or `nan` | Learning rate too large (or features unscaled) | Lower `lr` (try ÷10); scale features |
          | Loss falls painfully slowly | Learning rate too small, or features on very different scales | Raise `lr` carefully; standardise features |
          | Loss grows steadily even with a small `lr` | Sign error: `w += lr * grad` (gradient *ascent*) | Subtract the gradient |
          | Different results from "the same" update | `w` updated before `db` was computed from it | Compute all gradients first, then update all parameters |
          | Great training MSE, poor test MSE | Too many features for the data, or evaluation on training rows | Evaluate on held-out data; see [overfitting](concept:ml.overfitting) |
          | scikit-learn says it expected a 2-D array | Passed `[1, 2, 3]` as `X` | Use one row per example: `[[1], [2], [3]]` |

          Here is what a too-large learning rate looks like. On the delivery data, 0.05 converges, but 0.1
          overshoots further on every step:
      - type: code
        runnable: true
        code: |
          xs = [1, 2, 3, 4, 5]
          ys = [9, 11, 15, 17, 18]
          w, b, lr = 0.0, 0.0, 0.1          # learning rate too large for this data

          for step in range(2000):
              errors = [w * x + b - y for x, y in zip(xs, ys)]
              loss = sum(e ** 2 for e in errors) / len(xs)
              if step < 5:
                  print(f"step {step}: mse={loss:.0f}")
              dw = 2 / len(xs) * sum(e * x for e, x in zip(errors, xs))
              db = 2 / len(xs) * sum(errors)
              w, b = w - lr * dw, b - lr * db
        expectedOutput: |
          step 0: mse=208
          step 1: mse=382
          step 2: mse=708
          step 3: mse=1316
          step 4: mse=2452
        expectError: OverflowError
        caption: The loss roughly doubles each step until squaring a huge float raises OverflowError ("Result too large" or "Numerical result out of range", depending on the platform).
        annotations:
          - line: 7
            text: "`e ** 2` raises OverflowError once e is around 1e154; with NumPy you would get inf and then nan instead."
      - type: item
        ref: debug-gd-sign

  - id: practice
    title: Practice
