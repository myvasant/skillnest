id: ml.learning-types
concept: ml.learning-types
title: Supervised, unsupervised, self-supervised and reinforcement learning
subtitle: Learning from labelled examples, from structure in unlabelled data, from labels derived from the data
  itself, or from rewards for actions
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Learning from labelled examples, from structure in unlabelled data, from labels derived from the data itself,
  or from rewards for actions.
objectives:
- Explain the learning problem and assumptions behind supervised, unsupervised, self-supervised and reinforcement
  learning.
- Interpret the model behaviour using a small numerical example.
- Evaluate model quality without confusing training performance with real-world generalisation.
sources:
- title: 'Dive into Deep Learning: Introduction (kinds of machine learning problems)'
  url: https://d2l.ai/chapter_introduction/index.html
  publisher: Zhang, Lipton, Li and Smola
- title: An Introduction to Statistical Learning (free book)
  url: https://www.statlearning.com/
  publisher: James, Witten, Hastie, Tibshirani and Taylor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Learning from labelled examples, from structure in unlabelled data, from labels derived from the data
      itself, or from rewards for actions. The type of learning decides what data you must collect (labels, rewards
      or neither) and which algorithms and evaluations apply.
- id: mental-model
  title: Core model and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Supervised learning uses labelled pairs `(x, y)`; regression predicts numbers and classification predicts
      categories.

      - Unsupervised learning has no labels and finds structure such as clusters, low-dimensional representations
      or anomalies.

      - Self-supervised learning creates targets from the data itself — predict the next token, a masked word or
      a hidden image patch — which is how LLMs are pretrained on unlabelled text.

      - Reinforcement learning has an agent act in an environment, receive rewards and learn a policy that maximises
      long-term reward.

      - Semi-supervised and weakly supervised learning combine a few trusted labels with many unlabelled or noisily
      labelled examples.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Self-supervised does not mean "no target"; it trains on a supervised-style objective whose targets
      are generated automatically.

      - Clusters found without labels are not hidden "true classes"; they depend on the features, distance and algorithm
      you chose.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one mathematical or evaluation rule used by the method. A production
      estimator also needs a suitable dataset, preprocessing, validation strategy and monitoring.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def learning_setup(labelled, reward, unlabelled):\n    if labelled: return \"supervised\"\n    if reward:\
      \ return \"reinforcement\"\n    if unlabelled: return \"unsupervised\"\n    return \"no training signal specified\"\
      \n\nprint(learning_setup(True, False, False))"
    caption: Runnable standard-library teaching model; not a replacement for a complete ML library estimator.
- id: practice
  title: Practice and evaluation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper, test a normal case and an edge case, and explain what the result does and does not
      tell you about a trained model.
  - type: item
    ref: learning-types-code
  - type: item
    ref: learning-types-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Supervised learning uses labelled pairs `(x, y)`; regression predicts numbers and classification predicts
      categories.

      - Unsupervised learning has no labels and finds structure such as clusters, low-dimensional representations
      or anomalies.

      - Self-supervised learning creates targets from the data itself — predict the next token, a masked word or
      a hidden image patch — which is how LLMs are pretrained on unlabelled text.

      - Reinforcement learning has an agent act in an environment, receive rewards and learn a policy that maximises
      long-term reward.

      - Semi-supervised and weakly supervised learning combine a few trusted labels with many unlabelled or noisily
      labelled examples.


      **Limitations**

      - Self-supervised does not mean "no target"; it trains on a supervised-style objective whose targets are generated
      automatically.

      - Clusters found without labels are not hidden "true classes"; they depend on the features, distance and algorithm
      you chose.'
  - type: item
    ref: learning-types-mcq
  - type: item
    ref: learning-types-tf
  - type: item
    ref: learning-types-code
items:
- id: learning-types-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of supervised, unsupervised, self-supervised and reinforcement
    learning?
  explanation: Supervised learning uses labelled pairs `(x, y)`; regression predicts numbers and classification
    predicts categories.
  options:
  - id: a
    text: Supervised learning uses labelled pairs `(x, y)`; regression predicts numbers and classification predicts
      categories.
    correct: true
    feedback: 'Correct: this is the central mechanism or evaluation principle.'
  - id: b
    text: Self-supervised does not mean "no target"; it trains on a supervised-style objective whose targets are
      generated automatically.
    feedback: This is a known misconception; evaluate on data that was not used to fit the model.
  - id: c
    text: Model evaluation can be skipped when training loss decreases.
    feedback: Training loss alone cannot establish generalisation or suitability.
- id: learning-types-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Self-supervised does not mean "no target"; it trains on a supervised-style objective whose targets are
    generated automatically.
  answer: false
  explanation: This is a known misconception. Use a validation strategy appropriate to the data and the deployment
    setting.
- id: learning-types-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are using supervised, unsupervised, self-supervised and reinforcement learning for a real prediction
    task. What assumptions must hold, what failure mode would you test, and how would you evaluate the result on
    unseen data?
  rubric:
  - Explain the method or evaluation assumption correctly.
  - Name a realistic failure mode and a test that could reveal it.
  - Describe an evaluation approach that avoids misleading leakage or overclaiming.
  modelAnswer: Define the prediction target and the data available at prediction time. Choose a validation split
    that reflects deployment, compare against a simple baseline, inspect errors across important groups and document
    uncertainty. Check for leakage and distribution changes before trusting the score.
  explanation: A strong answer links the algorithm to its assumptions and evaluates performance on data that represents
    future use.
- id: learning-types-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for supervised, unsupervised, self-supervised and reinforcement learning. The tests
    check the central rule and a boundary case.
  starterCode: "def learning_setup(labelled, reward, unlabelled):\n    raise NotImplementedError('Complete this\
    \ function')"
  solution: "def learning_setup(labelled, reward, unlabelled):\n    if labelled: return \"supervised\"\n    if reward:\
    \ return \"reinforcement\"\n    if unlabelled: return \"unsupervised\"\n    return \"no training signal specified\""
  tests:
  - name: Core behaviour
    code: assert learning_setup(True,False,False) == "supervised"
  - name: Edge case
    code: 'assert learning_setup(False,True,False) == "reinforcement"

      assert learning_setup(False,False,True) == "unsupervised"'
  hints:
  - Translate the method or metric into a small deterministic calculation.
  - Check empty inputs, ties, dimensions or numerical extremes.
  - Do not interpret the helper output as a complete model-quality guarantee.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - learning-types-mcq
  - learning-types-tf
  - learning-types-code
