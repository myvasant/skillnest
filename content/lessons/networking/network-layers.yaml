id: networking.network-layers
concept: networking.network-layers
title: 'Network layers: TCP/IP and OSI models'
subtitle: Network layers divide communication into responsibilities so applications can use networks without implementing
  every lower-level detail
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Network layers divide communication into responsibilities so applications can use networks without implementing
  every lower-level detail.
objectives:
- 'Explain the purpose and core mental model of network layers: tcp/ip and osi models.'
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: 'Network layers divide communication into responsibilities so applications can use networks without implementing
      every lower-level detail. Layering gives engineers a shared way to reason about where a failure occurs: name
      resolution, routing, transport connection, TLS negotiation or application protocol.'
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: The TCP/IP model is commonly described as link, internet, transport and application. The OSI model has
      seven conceptual layers. These models are teaching tools; real protocols do not always fit a neat single box.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def tcp_ip_layer(protocol):\n    mapping = {\"ethernet\": \"link\", \"ip\": \"internet\", \"tcp\": \"\
      transport\", \"udp\": \"transport\",\n               \"http\": \"application\", \"dns\": \"application\",\
      \ \"tls\": \"between transport and application in common teaching models\"}\n    return mapping.get(protocol.lower(),\
      \ \"unknown\")\n\nfor p in [\"ip\", \"tcp\", \"http\"]: print(p, tcp_ip_layer(p))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: network-layers-code
  - type: item
    ref: network-layers-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Network layers divide communication into responsibilities so applications can use networks without
      implementing every lower-level detail.

      - Layering gives engineers a shared way to reason about where a failure occurs: name resolution, routing,
      transport connection, TLS negotiation or application protocol.

      - The TCP/IP model is commonly described as link, internet, transport and application. The OSI model has seven
      conceptual layers. These models are teaching tools; real protocols do not always fit a neat single box.'
  - type: item
    ref: network-layers-mcq
  - type: item
    ref: network-layers-tf
  - type: item
    ref: network-layers-code
items:
- id: network-layers-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: Which layer is responsible for end-to-end transport using TCP or UDP?
  explanation: 'Correct: TCP and UDP provide transport services to applications.'
  options:
  - id: a
    text: The transport layer.
    correct: true
    feedback: 'Correct: TCP and UDP provide transport services to applications.'
  - id: b
    text: The application layer.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: network-layers-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: network-layers-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: HTTP is an application protocol; TCP/UDP provide transport.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: network-layers-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Network layers: TCP/IP and OSI models.'
  starterCode: "def tcp_ip_layer(protocol):\n    # TODO: implement the behaviour described in the exercise.\n  \
    \  raise NotImplementedError(\"Complete this function\")"
  solution: "def tcp_ip_layer(protocol):\n    mapping = {\"ethernet\": \"link\", \"ip\": \"internet\", \"tcp\":\
    \ \"transport\", \"udp\": \"transport\",\n               \"http\": \"application\", \"dns\": \"application\"\
    , \"tls\": \"between transport and application in common teaching models\"}\n    return mapping.get(protocol.lower(),\
    \ \"unknown\")"
  tests:
  - name: Core behaviour
    code: assert tcp_ip_layer("IP") == "internet"
  - name: Edge behaviour
    code: 'assert tcp_ip_layer("TCP") == "transport"

      assert tcp_ip_layer("HTTP") == "application"'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - network-layers-mcq
  - network-layers-tf
  - network-layers-code
cheatsheet: '**Core idea:** Network layers divide communication into responsibilities so applications can use networks
  without implementing every lower-level detail.


  **Remember:** Layering gives engineers a shared way to reason about where a failure occurs: name resolution, routing,
  transport connection, TLS negotiation or application protocol.


  **Apply:** The TCP/IP model is commonly described as link, internet, transport and application. The OSI model
  has seven conceptual layers. These models are teaching tools; real protocols do not always fit a neat single box.'
