id: networking.tls
concept: networking.tls
title: HTTPS and TLS
subtitle: TLS protects data in transit by providing encryption, integrity and server authentication when certificates
  are validated correctly
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: TLS protects data in transit by providing encryption, integrity and server authentication when certificates
  are validated correctly.
objectives:
- Explain the purpose and core mental model of https and tls.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: TLS protects data in transit by providing encryption, integrity and server authentication when certificates
      are validated correctly. HTTPS is HTTP carried over TLS. It protects credentials and application data from
      passive observation and many active network attacks.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: A TLS handshake negotiates cryptographic parameters and establishes shared traffic keys. Certificates
      bind a public key to an identity; clients validate the certificate chain, hostname, validity and trust. Modern
      TLS uses ephemeral key exchange for forward secrecy.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def tls_checks(certificate):\n    required = [\"hostname_matches\", \"trusted_chain\", \"not_expired\"\
      , \"valid_usage\"]\n    return [check for check in required if not certificate.get(check, False)]\n\nprint(tls_checks({\"\
      hostname_matches\": True, \"trusted_chain\": True}))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: tls-code
  - type: item
    ref: tls-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- TLS protects data in transit by providing encryption, integrity and server authentication when certificates
      are validated correctly.

      - HTTPS is HTTP carried over TLS. It protects credentials and application data from passive observation and
      many active network attacks.

      - A TLS handshake negotiates cryptographic parameters and establishes shared traffic keys. Certificates bind
      a public key to an identity; clients validate the certificate chain, hostname, validity and trust. Modern
      TLS uses ephemeral key exchange for forward secrecy.'
  - type: item
    ref: tls-mcq
  - type: item
    ref: tls-tf
  - type: item
    ref: tls-code
items:
- id: tls-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: What does certificate hostname validation help prevent?
  explanation: 'Correct: TLS authenticates the server identity for the requested hostname when validation succeeds.'
  options:
  - id: a
    text: Connecting securely to a server that is not the intended hostname, such as an impostor presenting another
      site’s certificate.
    correct: true
    feedback: 'Correct: TLS authenticates the server identity for the requested hostname when validation succeeds.'
  - id: b
    text: All application-level authorization bugs.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: tls-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: tls-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: TLS protects the channel; it does not replace application authorization or input validation.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: tls-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: HTTPS and TLS.'
  starterCode: "def tls_checks(certificate):\n    # TODO: implement the behaviour described in the exercise.\n \
    \   raise NotImplementedError(\"Complete this function\")"
  solution: "def tls_checks(certificate):\n    required = [\"hostname_matches\", \"trusted_chain\", \"not_expired\"\
    , \"valid_usage\"]\n    return [check for check in required if not certificate.get(check, False)]"
  tests:
  - name: Core behaviour
    code: assert tls_checks({"hostname_matches":True, "trusted_chain":True, "not_expired":True, "valid_usage":True})
      == []
  - name: Edge behaviour
    code: assert "hostname_matches" in tls_checks({"trusted_chain":True})
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - tls-mcq
  - tls-tf
  - tls-code
cheatsheet: '**Core idea:** TLS protects data in transit by providing encryption, integrity and server authentication
  when certificates are validated correctly.


  **Remember:** HTTPS is HTTP carried over TLS. It protects credentials and application data from passive observation
  and many active network attacks.


  **Apply:** A TLS handshake negotiates cryptographic parameters and establishes shared traffic keys. Certificates
  bind a public key to an identity; clients validate the certificate chain, hostname, validity and trust. Modern
  TLS uses ephemeral key exchange for forward secrecy.'
