id: networking.http-basics
concept: networking.http-basics
title: HTTP Requests and Responses
subtitle: Reading and writing the messages behind every web page and API
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  HTTP is a request-response protocol: a client sends a method, a target, headers and an optional body; the
  server answers with a status code, headers and a body. In HTTP/1.1 these messages are plain text over a
  TCP connection, so you can build and parse them yourself. Do exactly that in Python, learn the methods and
  status code classes, read curl output, and see how HTTP/2 and HTTP/3 carry the same meaning in binary
  frames.
objectives:
  - Identify the request line, header fields, blank line and body of an HTTP/1.1 request, and the status line of a response.
  - Choose the status code class (1xx-5xx) that matches a situation, and name the common methods.
  - Build a valid HTTP/1.1 request as bytes, with a Content-Length counted in bytes.
  - Parse a raw response into status, case-insensitive headers and body.
  - Split a URL into the parts that go into the request line and the Host header with urllib.parse.
  - Explain statelessness and what changes (and what does not) in HTTP/2 and HTTP/3.
