id: networking.debugging-network
concept: networking.debugging-network
title: Debugging network problems systematically
subtitle: Network debugging is a process of narrowing a failure to a layer using reproducible tests and observable
  evidence
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Network debugging is a process of narrowing a failure to a layer using reproducible tests and observable
  evidence.
objectives:
- Explain the purpose and core mental model of debugging network problems systematically.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Network debugging is a process of narrowing a failure to a layer using reproducible tests and observable
      evidence. “The API is down” is a symptom, not a diagnosis. A disciplined sequence avoids random configuration
      changes that hide the original cause.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: Separate name resolution, routing, TCP connection, TLS handshake, HTTP response and application logic.
      Record hostname, resolved IP, port, timestamp, environment, error class and request ID. Compare a known-good
      client or environment.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def classify_failure(stage):\n    hints = {\"dns\": \"hostname did not resolve\", \"tcp\": \"connection\
      \ could not be established\",\n             \"tls\": \"secure channel negotiation or validation failed\",\
      \ \"http\": \"server returned an HTTP response\",\n             \"application\": \"request reached application\
      \ logic\"}\n    return hints.get(stage, \"collect more evidence\")\n\nprint(classify_failure(\"dns\"))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: debugging-network-code
  - type: item
    ref: debugging-network-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Network debugging is a process of narrowing a failure to a layer using reproducible tests and observable
      evidence.

      - “The API is down” is a symptom, not a diagnosis. A disciplined sequence avoids random configuration changes
      that hide the original cause.

      - Separate name resolution, routing, TCP connection, TLS handshake, HTTP response and application logic. Record
      hostname, resolved IP, port, timestamp, environment, error class and request ID. Compare a known-good client
      or environment.'
  - type: item
    ref: debugging-network-mcq
  - type: item
    ref: debugging-network-tf
  - type: item
    ref: debugging-network-code
items:
- id: debugging-network-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: A client reports ENOTFOUND for an API hostname. What should you investigate first?
  explanation: 'Correct: ENOTFOUND indicates name resolution failed before an HTTP request could reach the API.'
  options:
  - id: a
    text: DNS resolution, including hostname spelling, resolver configuration and whether the name exists in the
      expected environment.
    correct: true
    feedback: 'Correct: ENOTFOUND indicates name resolution failed before an HTTP request could reach the API.'
  - id: b
    text: Database query performance.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: debugging-network-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: debugging-network-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Do not debug HTTP status codes until the hostname resolves.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: debugging-network-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Debugging network problems systematically.'
  starterCode: "def classify_failure(stage):\n    # TODO: implement the behaviour described in the exercise.\n \
    \   raise NotImplementedError(\"Complete this function\")"
  solution: "def classify_failure(stage):\n    hints = {\"dns\": \"hostname did not resolve\", \"tcp\": \"connection\
    \ could not be established\",\n             \"tls\": \"secure channel negotiation or validation failed\", \"\
    http\": \"server returned an HTTP response\",\n             \"application\": \"request reached application logic\"\
    }\n    return hints.get(stage, \"collect more evidence\")"
  tests:
  - name: Core behaviour
    code: assert "resolve" in classify_failure("dns")
  - name: Edge behaviour
    code: 'assert "HTTP response" in classify_failure("http")

      assert classify_failure("unknown") == "collect more evidence"'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - debugging-network-mcq
  - debugging-network-tf
  - debugging-network-code
cheatsheet: '**Core idea:** Network debugging is a process of narrowing a failure to a layer using reproducible
  tests and observable evidence.


  **Remember:** “The API is down” is a symptom, not a diagnosis. A disciplined sequence avoids random configuration
  changes that hide the original cause.


  **Apply:** Separate name resolution, routing, TCP connection, TLS handshake, HTTP response and application logic.
  Record hostname, resolved IP, port, timestamp, environment, error class and request ID. Compare a known-good client
  or environment.'
