id: networking.rest
concept: networking.rest
title: REST API design principles
subtitle: REST is an architectural style for networked resource systems; practical HTTP APIs often adopt resource-oriented
  URLs, standard methods and stateless interactions
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: REST is an architectural style for networked resource systems; practical HTTP APIs often adopt resource-oriented
  URLs, standard methods and stateless interactions.
objectives:
- Explain the purpose and core mental model of rest api design principles.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: REST is an architectural style for networked resource systems; practical HTTP APIs often adopt resource-oriented
      URLs, standard methods and stateless interactions. Consistent API semantics make clients simpler and reduce
      custom rules. REST is not merely “JSON over HTTP” and not every HTTP API is fully RESTful.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: Model resources with nouns, use HTTP methods for intent, represent resource state with standard media
      types, use status codes meaningfully, and keep each request self-contained. Hypermedia-driven constraints
      are part of the original REST style but are often only partially adopted.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def resource_route(resource, identifier=None):\n    base = \"/\" + resource.strip(\"/\")\n    return\
      \ base if identifier is None else f\"{base}/{identifier}\"\n\nprint(resource_route(\"users\", 42))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: rest-code
  - type: item
    ref: rest-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- REST is an architectural style for networked resource systems; practical HTTP APIs often adopt resource-oriented
      URLs, standard methods and stateless interactions.

      - Consistent API semantics make clients simpler and reduce custom rules. REST is not merely “JSON over HTTP”
      and not every HTTP API is fully RESTful.

      - Model resources with nouns, use HTTP methods for intent, represent resource state with standard media types,
      use status codes meaningfully, and keep each request self-contained. Hypermedia-driven constraints are part
      of the original REST style but are often only partially adopted.'
  - type: item
    ref: rest-mcq
  - type: item
    ref: rest-tf
  - type: item
    ref: rest-code
items:
- id: rest-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which route is most resource-oriented for retrieving user 42?
  explanation: 'Correct: the URI identifies the resource and GET expresses retrieval.'
  options:
  - id: a
    text: GET /users/42
    correct: true
    feedback: 'Correct: the URI identifies the resource and GET expresses retrieval.'
  - id: b
    text: GET /getUser?id=42
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: rest-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: rest-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: HTTP method semantics should carry the operation where possible.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: rest-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: REST API design principles.'
  starterCode: "def resource_route(resource, identifier=None):\n    # TODO: implement the behaviour described in\
    \ the exercise.\n    raise NotImplementedError(\"Complete this function\")"
  solution: "def resource_route(resource, identifier=None):\n    base = \"/\" + resource.strip(\"/\")\n    return\
    \ base if identifier is None else f\"{base}/{identifier}\""
  tests:
  - name: Core behaviour
    code: assert resource_route("users") == "/users"
  - name: Edge behaviour
    code: assert resource_route("/users/", 42) == "/users/42"
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - rest-mcq
  - rest-tf
  - rest-code
cheatsheet: '**Core idea:** REST is an architectural style for networked resource systems; practical HTTP APIs often
  adopt resource-oriented URLs, standard methods and stateless interactions.


  **Remember:** Consistent API semantics make clients simpler and reduce custom rules. REST is not merely “JSON
  over HTTP” and not every HTTP API is fully RESTful.


  **Apply:** Model resources with nouns, use HTTP methods for intent, represent resource state with standard media
  types, use status codes meaningfully, and keep each request self-contained. Hypermedia-driven constraints are
  part of the original REST style but are often only partially adopted.'
