cheatsheet: '**Core idea:** Intermediaries sit between clients and origin services to route, protect, cache or distribute
  traffic.


  **Remember:** Modern web systems rarely connect every client directly to one application process; intermediaries
  improve scale and operational control but add another layer to debug.


  **Apply:** A forward proxy represents clients; a reverse proxy represents servers. A load balancer distributes
  requests across healthy backends. An API gateway may add authentication, rate limits and routing. A CDN caches
  content near users.'
