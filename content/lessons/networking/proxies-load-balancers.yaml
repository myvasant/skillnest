id: networking.proxies-load-balancers
concept: networking.proxies-load-balancers
title: Proxies, load balancers, gateways and CDNs
subtitle: Intermediaries sit between clients and origin services to route, protect, cache or distribute traffic
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Intermediaries sit between clients and origin services to route, protect, cache or distribute traffic.
objectives:
- Explain the purpose and core mental model of proxies, load balancers, gateways and cdns.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Intermediaries sit between clients and origin services to route, protect, cache or distribute traffic.
      Modern web systems rarely connect every client directly to one application process; intermediaries improve
      scale and operational control but add another layer to debug.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: A forward proxy represents clients; a reverse proxy represents servers. A load balancer distributes requests
      across healthy backends. An API gateway may add authentication, rate limits and routing. A CDN caches content
      near users.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def choose_backend(backends):\n    healthy = [b for b in backends if b[\"healthy\"]]\n    return min(healthy,\
      \ key=lambda b: b[\"active_requests\"])[\"name\"] if healthy else None\n\nprint(choose_backend([{\"name\"\
      :\"a\", \"healthy\":True, \"active_requests\":4}, {\"name\":\"b\", \"healthy\":True, \"active_requests\":2}]))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: proxies-load-balancers-code
  - type: item
    ref: proxies-load-balancers-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
