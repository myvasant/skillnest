id: networking.http-semantics
concept: networking.http-semantics
title: HTTP methods, status codes and caching
subtitle: 'HTTP defines request and response semantics: methods describe intent, status codes describe outcomes,
  and caching controls reuse of responses'
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: 'HTTP defines request and response semantics: methods describe intent, status codes describe outcomes,
  and caching controls reuse of responses.'
objectives:
- Explain the purpose and core mental model of http methods, status codes and caching.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: 'HTTP defines request and response semantics: methods describe intent, status codes describe outcomes,
      and caching controls reuse of responses. Knowing semantics helps design APIs that behave predictably for browsers,
      clients, proxies and retries.'
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: GET is safe and idempotent; PUT is idempotent by definition; DELETE is idempotent in intended effect;
      POST is not generally idempotent. Common status classes are 2xx success, 3xx redirection, 4xx client errors
      and 5xx server errors. Cache-Control, ETag and conditional requests reduce unnecessary transfers.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def status_class(code):\n    if 100 <= code < 200: return \"informational\"\n    if 200 <= code < 300:\
      \ return \"success\"\n    if 300 <= code < 400: return \"redirection\"\n    if 400 <= code < 500: return \"\
      client error\"\n    if 500 <= code < 600: return \"server error\"\n    return \"invalid\"\n\nprint(status_class(404),\
      \ status_class(503))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: http-semantics-code
  - type: item
    ref: http-semantics-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- HTTP defines request and response semantics: methods describe intent, status codes describe outcomes,
      and caching controls reuse of responses.

      - Knowing semantics helps design APIs that behave predictably for browsers, clients, proxies and retries.

      - GET is safe and idempotent; PUT is idempotent by definition; DELETE is idempotent in intended effect; POST
      is not generally idempotent. Common status classes are 2xx success, 3xx redirection, 4xx client errors and
      5xx server errors. Cache-Control, ETag and conditional requests reduce unnecessary transfers.'
  - type: item
    ref: http-semantics-mcq
  - type: item
    ref: http-semantics-tf
  - type: item
    ref: http-semantics-code
items:
- id: http-semantics-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: Which HTTP method is designed to retrieve a representation without changing server state?
  explanation: 'Correct: GET is defined as a safe method; servers should not make the requested state change through
    it.'
  options:
  - id: a
    text: GET
    correct: true
    feedback: 'Correct: GET is defined as a safe method; servers should not make the requested state change through
      it.'
  - id: b
    text: POST
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: http-semantics-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: http-semantics-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Safe does not mean no logging or side effects at all; it means the client did not request a state change.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: http-semantics-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: HTTP methods, status codes and caching.'
  starterCode: "def status_class(code):\n    # TODO: implement the behaviour described in the exercise.\n    raise\
    \ NotImplementedError(\"Complete this function\")"
  solution: "def status_class(code):\n    if 100 <= code < 200: return \"informational\"\n    if 200 <= code < 300:\
    \ return \"success\"\n    if 300 <= code < 400: return \"redirection\"\n    if 400 <= code < 500: return \"\
    client error\"\n    if 500 <= code < 600: return \"server error\"\n    return \"invalid\""
  tests:
  - name: Core behaviour
    code: assert status_class(201) == "success"
  - name: Edge behaviour
    code: 'assert status_class(404) == "client error"

      assert status_class(503) == "server error"

      assert status_class(99) == "invalid"'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - http-semantics-mcq
  - http-semantics-tf
  - http-semantics-code
cheatsheet: '**Core idea:** HTTP defines request and response semantics: methods describe intent, status codes describe
  outcomes, and caching controls reuse of responses.


  **Remember:** Knowing semantics helps design APIs that behave predictably for browsers, clients, proxies and retries.


  **Apply:** GET is safe and idempotent; PUT is idempotent by definition; DELETE is idempotent in intended effect;
  POST is not generally idempotent. Common status classes are 2xx success, 3xx redirection, 4xx client errors and
  5xx server errors. Cache-Control, ETag and conditional requests reduce unnecessary transfers.'
