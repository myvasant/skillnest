id: networking.urls
concept: networking.urls
title: URLs, paths and query strings
subtitle: A URL identifies a resource and may specify the scheme, authority, path, query and fragment
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: A URL identifies a resource and may specify the scheme, authority, path, query and fragment.
objectives:
- Explain the purpose and core mental model of urls, paths and query strings.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A URL identifies a resource and may specify the scheme, authority, path, query and fragment. Understanding
      URL components helps build API clients, route requests and debug encoding or routing mistakes.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: The scheme identifies the protocol such as https; the authority contains host and optional port; the path
      identifies a resource; the query carries parameters; and the fragment is interpreted by the client and is
      not sent in an HTTP request. Reserved characters must be percent-encoded when they are data.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: 'from urllib.parse import urlsplit, parse_qs

      u = urlsplit("https://api.example.test:8443/items?id=7&tag=blue#details")

      print(u.scheme, u.hostname, u.port, u.path, parse_qs(u.query), u.fragment)'
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: urls-code
  - type: item
    ref: urls-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- A URL identifies a resource and may specify the scheme, authority, path, query and fragment.

      - Understanding URL components helps build API clients, route requests and debug encoding or routing mistakes.

      - The scheme identifies the protocol such as https; the authority contains host and optional port; the path
      identifies a resource; the query carries parameters; and the fragment is interpreted by the client and is
      not sent in an HTTP request. Reserved characters must be percent-encoded when they are data.'
  - type: item
    ref: urls-mcq
  - type: item
    ref: urls-tf
  - type: item
    ref: urls-code
items:
- id: urls-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: Which URL component is normally not included in the HTTP request sent to the server?
  explanation: 'Correct: fragments are client-side identifiers and are not sent as part of the HTTP request target.'
  options:
  - id: a
    text: 'The fragment (the part after #).'
    correct: true
    feedback: 'Correct: fragments are client-side identifiers and are not sent as part of the HTTP request target.'
  - id: b
    text: The path.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: urls-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: urls-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: The path and query are sent; the fragment is handled by the client.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: urls-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: URLs, paths and query strings.'
  starterCode: "from urllib.parse import urlsplit, parse_qs\n\ndef summarize_url(value):\n    # TODO: implement\
    \ the behaviour described in the exercise.\n    raise NotImplementedError(\"Complete this function\")"
  solution: "from urllib.parse import urlsplit, parse_qs\ndef summarize_url(value):\n    u = urlsplit(value)\n \
    \   return {\"scheme\": u.scheme, \"host\": u.hostname, \"port\": u.port, \"path\": u.path,\n            \"\
    query\": parse_qs(u.query), \"fragment\": u.fragment}"
  tests:
  - name: Core behaviour
    code: s = summarize_url("https://example.test/search?q=python&page=2#top")
  - name: Edge behaviour
    code: 'assert s["scheme"] == "https" and s["host"] == "example.test"

      assert s["query"] == {"q": ["python"], "page": ["2"]}

      assert s["fragment"] == "top"'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - urls-mcq
  - urls-tf
  - urls-code
cheatsheet: '**Core idea:** A URL identifies a resource and may specify the scheme, authority, path, query and fragment.


  **Remember:** Understanding URL components helps build API clients, route requests and debug encoding or routing
  mistakes.


  **Apply:** The scheme identifies the protocol such as https; the authority contains host and optional port; the
  path identifies a resource; the query carries parameters; and the fragment is interpreted by the client and is
  not sent in an HTTP request. Reserved characters must be percent-encoded when they are data.'
