id: networking.json-apis
concept: networking.json-apis
title: JSON APIs and serialisation
subtitle: JSON is a text format for exchanging structured data; serialisation converts in-memory values into a transferable
  representation
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: JSON is a text format for exchanging structured data; serialisation converts in-memory values into a transferable
  representation.
objectives:
- Explain the purpose and core mental model of json apis and serialisation.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: 'MDN Web Docs: HTTP'
  url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  publisher: MDN
- title: RFC Editor
  url: https://www.rfc-editor.org/
  publisher: RFC Editor
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: JSON is a text format for exchanging structured data; serialisation converts in-memory values into a transferable
      representation. APIs need stable, language-neutral representations so different clients can exchange data
      without sharing internal object implementations.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: 'JSON supports objects, arrays, strings, numbers, booleans and null. It has no native date, decimal, bytes
      or tuple type. Schema validation is separate from parsing: valid JSON can still violate the API contract.'
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: 'import json

      payload = {"user_id": 17, "active": True, "tags": ["python", "api"]}

      encoded = json.dumps(payload, separators=(",", ":"))

      print(encoded)

      print(json.loads(encoded)["user_id"])'
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: json-apis-code
  - type: item
    ref: json-apis-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- JSON is a text format for exchanging structured data; serialisation converts in-memory values into
      a transferable representation.

      - APIs need stable, language-neutral representations so different clients can exchange data without sharing
      internal object implementations.

      - JSON supports objects, arrays, strings, numbers, booleans and null. It has no native date, decimal, bytes
      or tuple type. Schema validation is separate from parsing: valid JSON can still violate the API contract.'
  - type: item
    ref: json-apis-mcq
  - type: item
    ref: json-apis-tf
  - type: item
    ref: json-apis-code
items:
- id: json-apis-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: A JSON document parses successfully. Does that prove it is valid input for your API?
  explanation: 'Correct: syntax validity and business-contract validity are separate checks.'
  options:
  - id: a
    text: No. Parsing checks JSON syntax; the API must still validate schema, types, constraints and authorization.
    correct: true
    feedback: 'Correct: syntax validity and business-contract validity are separate checks.'
  - id: b
    text: Yes, valid JSON is always valid API input.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: json-apis-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: json-apis-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Use explicit boundary validation and reject malformed or unexpected values.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: json-apis-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: JSON APIs and serialisation.'
  starterCode: "import json\n\ndef parse_user_payload(text):\n    # TODO: implement the behaviour described in the\
    \ exercise.\n    raise NotImplementedError(\"Complete this function\")"
  solution: "import json\ndef parse_user_payload(text):\n    data = json.loads(text)\n    if not isinstance(data,\
    \ dict): raise ValueError(\"Expected a JSON object\")\n    if not isinstance(data.get(\"user_id\"), int): raise\
    \ ValueError(\"user_id must be an integer\")\n    if not isinstance(data.get(\"active\"), bool): raise ValueError(\"\
    active must be a boolean\")\n    return data"
  tests:
  - name: Core behaviour
    code: 'assert parse_user_payload(''{"user_id": 3, "active": true}'')["user_id"] == 3'
  - name: Edge behaviour
    code: 'try: parse_user_payload(''[1, 2]'')

      except ValueError: pass

      else: raise AssertionError("array should be rejected")'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - json-apis-mcq
  - json-apis-tf
  - json-apis-code
cheatsheet: '**Core idea:** JSON is a text format for exchanging structured data; serialisation converts in-memory
  values into a transferable representation.


  **Remember:** APIs need stable, language-neutral representations so different clients can exchange data without
  sharing internal object implementations.


  **Apply:** JSON supports objects, arrays, strings, numbers, booleans and null. It has no native date, decimal,
  bytes or tuple type. Schema validation is separate from parsing: valid JSON can still violate the API contract.'
