id: python.raising-exceptions
concept: python.raising-exceptions
title: Raising and Defining Exceptions
subtitle: Signalling clearly that a function cannot do its job
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Catching exceptions is half the story; the other half is raising them. Learn when and how to raise,
  how to validate inputs with clear messages, how to design your own exception classes and hierarchies,
  how to chain a low-level error to a high-level one with raise ... from, and when not to use
  exceptions at all.
objectives:
  - Use raise to stop a function that cannot do its job, with a message that names the problem and the bad value.
  - Validate inputs early and choose correctly between TypeError and ValueError.
  - Define custom exception classes (and small hierarchies) that carry context in attributes.
  - Chain exceptions with raise ... from err, read the resulting traceback, and re-raise with a bare raise.
  - Decide when a function should raise and when it should return a normal value instead.
