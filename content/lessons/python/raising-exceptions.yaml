        feedback: The bare raise sends the same exception on to the caller, so the outer except also runs.
      - answer: caught KeyError('token')
        feedback: The exception is first caught inside step(), which prints "cleaning up" before re-raising it.
      - answer: |
          cleaning up
          caught RuntimeError('No active exception to reraise')
        feedback: Inside an except block there is an active exception, so a bare raise re-raises the KeyError.

  - id: mcq-raise-or-return
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      `find_customer(email)` is used by a "Forgot password?" form. Unknown emails are typed all the time and
      are not a problem — the form just says "if that account exists, we sent an email". What should the
      function do when no customer has that email?
    explanation: >-
      "Not found" is a normal, expected outcome here, so return a value that represents it and make it
      visible in the signature (`-> Customer | None`). Raising would force every caller to wrap a routine
      lookup in try/except.
    options:
      - id: a
        text: Return None (and document it, e.g. with the type hint `-> Customer | None`).
        correct: true
        feedback: An expected outcome deserves a normal return value.
      - id: b
        text: "raise Exception(\"not found\")"
        feedback: Raising for an everyday outcome makes callers use try/except for normal flow — and a bare Exception is too generic to catch precisely.
      - id: c
        text: Print "Customer not found" and return an empty string.
        feedback: Printing does not inform the caller, and "" is a confusing stand-in for "no customer".
      - id: d
        text: Call sys.exit() so the program stops safely.
        feedback: Stopping the whole program because someone mistyped an email would be a serious bug.

  - id: parse-quantity
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `parse_quantity(text)`, which turns text from an order form into a positive whole number:

      1. If `text` is not a `str`, raise **TypeError** with a message that includes the type's name
         (e.g. `int`).
      2. Strip surrounding spaces and convert with `int()`. If that fails, raise **ValueError** with a
         message that includes `repr(text)` — and chain it to the original error with `from`.
      3. If the number is less than 1, raise **ValueError** with a message containing `at least 1`.
      4. Otherwise return the number.
    starterCode: |
      def parse_quantity(text):
          return int(text)


      print(parse_quantity(" 3 "))
    solution: |
      def parse_quantity(text):
          if not isinstance(text, str):
              raise TypeError(f"quantity must be text, got {type(text).__name__}")
          try:
              number = int(text.strip())
          except ValueError as err:
              raise ValueError(f"quantity must be a whole number, got {text!r}") from err
          if number < 1:
              raise ValueError(f"quantity must be at least 1, got {number}")
          return number


      print(parse_quantity(" 3 "))
    expectedOutput: |
      3
    tests:
      - name: valid quantities are converted
        code: |
          for text, expected in [("3", 3), (" 12 ", 12), ("1", 1)]:
              got = parse_quantity(text)
              assert got == expected, f"parse_quantity({text!r}) should return {expected}, got {got!r}."
      - name: non-text raises TypeError naming the type
        code: |
          for bad in [5, None, ["2"]]:
              try:
                  parse_quantity(bad)
              except TypeError as err:
                  assert type(bad).__name__ in str(err), f"The TypeError message for {bad!r} should mention {type(bad).__name__!r}; it was {str(err)!r}."
              else:
                  raise AssertionError(f"parse_quantity({bad!r}) should raise TypeError because it is not a str.")
      - name: non-numbers raise a chained ValueError
        code: |
          for bad in ["ten", "2.5", ""]:
              try:
                  parse_quantity(bad)
              except ValueError as err:
                  assert repr(bad) in str(err), f"The message for {bad!r} should include {repr(bad)}; it was {str(err)!r}."
                  assert isinstance(err.__cause__, ValueError), f"Chain the error for {bad!r}: write `raise ValueError(...) from err` inside `except ValueError as err:`."
              else:
                  raise AssertionError(f"parse_quantity({bad!r}) should raise ValueError.")
      - name: numbers below 1 are rejected
        code: |
          for bad in ["0", "-4"]:
              try:
                  parse_quantity(bad)
              except ValueError as err:
                  assert "at least 1" in str(err), f"The message for {bad!r} should contain 'at least 1'; it was {str(err)!r}."
              else:
                  raise AssertionError(f"parse_quantity({bad!r}) should raise ValueError: quantities must be at least 1.")
    hints:
      - Start with a guard clause using isinstance(text, str) and raise TypeError if it fails.
      - "Wrap only the conversion in try: `number = int(text.strip())`, and in `except ValueError as err:` raise your own ValueError `from err`."
      - After the try/except, check `if number < 1:` and raise a ValueError mentioning "at least 1".
    feedback:
      - when: { errorType: AttributeError }
        message: You called a string method (such as strip) before checking the type. Put the isinstance guard first.
      - when: { codeMatches: "assert\\s" }
        message: Validate with if ... raise, not assert — asserts are removed when Python runs with -O.
    explanation: >-
      The guard clause rejects the wrong type first, so .strip() is safe afterwards. The int() failure is
      translated into a message about quantities and chained with from err, so the original error is still
      visible. A final value check enforces the business rule.

  - id: out-of-stock
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Create a custom exception and use it.

      1. Define `OutOfStockError`, a subclass of `Exception`, whose `__init__(self, item, requested,
         available)` stores those three values as attributes **and** passes this message to
         `super().__init__`: `only {available} {item} left, cannot reserve {requested}`.
      2. Write `reserve(stock, item, quantity)`. `stock` is a dict such as `{"tea": 5}`. If there is
         enough of `item` (a missing item counts as 0), subtract `quantity` from the stock and return the
         amount left. Otherwise raise `OutOfStockError` **without changing the stock**.
    starterCode: |
      class OutOfStockError(Exception):
          pass


      def reserve(stock, item, quantity):
          stock[item] -= quantity
          return stock[item]


      stock = {"tea": 5}
      print(reserve(stock, "tea", 2))
    solution: |
      class OutOfStockError(Exception):
          """Raised when a reservation asks for more than is in stock."""

          def __init__(self, item, requested, available):
              super().__init__(f"only {available} {item} left, cannot reserve {requested}")
              self.item = item
              self.requested = requested
              self.available = available


      def reserve(stock, item, quantity):
          available = stock.get(item, 0)
          if quantity > available:
              raise OutOfStockError(item, quantity, available)
          stock[item] = available - quantity
          return stock[item]


      stock = {"tea": 5}
      print(reserve(stock, "tea", 2))
    expectedOutput: |
      3
    tests:
      - name: OutOfStockError is a proper exception class
        code: |
          assert isinstance(OutOfStockError, type) and issubclass(OutOfStockError, Exception), "OutOfStockError must be a class that inherits from Exception."
          err = OutOfStockError("pens", 4, 1)
          for name in ["item", "requested", "available"]:
              assert hasattr(err, name), f"OutOfStockError should store {name!r} as an attribute: write `self.{name} = {name}` in __init__."
          assert (err.item, err.requested, err.available) == ("pens", 4, 1), "Store item, requested and available as attributes in __init__."
          assert str(err) == "only 1 pens left, cannot reserve 4", f"str(err) should be 'only 1 pens left, cannot reserve 4', got {str(err)!r}. Pass the message to super().__init__."
      - name: successful reservations update the stock
        code: |
          s = {"rice": 10}
          assert reserve(s, "rice", 4) == 6, "reserve should return the amount left (10 - 4 = 6)."
          assert s == {"rice": 6}, f"The stock dict should now be {{'rice': 6}}, got {s}."
      - name: raises OutOfStockError with context
        code: |
          s = {"rice": 3}
          try:
              reserve(s, "rice", 5)
          except OutOfStockError as err:
              assert (err.item, err.requested, err.available) == ("rice", 5, 3), f"Expected item='rice', requested=5, available=3, got {(err.item, err.requested, err.available)}."
          else:
              raise AssertionError("Reserving 5 when only 3 are in stock should raise OutOfStockError.")
          assert s == {"rice": 3}, f"A failed reservation must not change the stock, but it became {s}."
      - name: missing items count as zero
        code: |
          s = {}
          try:
              reserve(s, "salt", 1)
          except OutOfStockError as err:
              assert err.available == 0, "A missing item has 0 available."
          except KeyError:
              raise AssertionError("reserve({}, 'salt', 1) raised KeyError. Look the item up with stock.get(item, 0) so a missing item counts as 0 and raises OutOfStockError.")
          else:
              raise AssertionError("Reserving an item that is not in the dict should raise OutOfStockError, not KeyError.")
          assert s == {}, "A failed reservation must not add the item to the stock."
    hints:
      - "In __init__, first call `super().__init__(f\"only {available} {item} left, cannot reserve {requested}\")`, then set self.item, self.requested and self.available."
      - In reserve, look up the available amount with stock.get(item, 0) before changing anything.
      - "Guard clause: `if quantity > available: raise OutOfStockError(item, quantity, available)`."
    feedback:
      - when: { errorType: KeyError }
        message: A missing item caused KeyError. Use stock.get(item, 0) to treat it as 0 available.
    explanation: >-
      The custom exception names the failure and carries the data a handler needs. reserve checks before it
      mutates, so a failed reservation leaves the stock untouched — raising early keeps data consistent.

  - id: debug-chain
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      `get_setting` translates a missing key into a `ConfigError`, but the program prints
      `Caused by: None`: the original `KeyError` is not recorded as the cause. Fix it so the output is:

      ```text
      Error: missing required setting 'port'
      Caused by: KeyError('port')
      ```
    starterCode: |
      class ConfigError(Exception):
          """The configuration is missing or invalid."""


      def get_setting(config, name):
          try:
              return config[name]
          except KeyError:
              raise ConfigError(f"missing required setting {name!r}")


      try:
          get_setting({"debug": True}, "port")
      except ConfigError as err:
          print("Error:", err)
          print("Caused by:", repr(err.__cause__))
    solution: |
      class ConfigError(Exception):
          """The configuration is missing or invalid."""


      def get_setting(config, name):
          try:
              return config[name]
          except KeyError as err:
              raise ConfigError(f"missing required setting {name!r}") from err


      try:
          get_setting({"debug": True}, "port")
      except ConfigError as err:
          print("Error:", err)
          print("Caused by:", repr(err.__cause__))
    expectedOutput: |
      Error: missing required setting 'port'
      Caused by: KeyError('port')
    tests:
      - name: prints the error and its cause
        code: |
          assert output_lines() == ["Error: missing required setting 'port'", "Caused by: KeyError('port')"], f"Your program printed {output()!r}."
      - name: the cause is set for any missing setting
        code: |
          try:
              get_setting({}, "timeout")
          except ConfigError as err:
              assert isinstance(err.__cause__, KeyError), "Use `except KeyError as err:` and `raise ConfigError(...) from err` so __cause__ is the KeyError."
              assert "'timeout'" in str(err), f"The message should name the missing setting; got {str(err)!r}."
          else:
              raise AssertionError("get_setting({}, 'timeout') should raise ConfigError.")
      - name: existing settings still work
        code: |
          assert get_setting({"port": 8080}, "port") == 8080, "get_setting should return the value when the key exists."
    hints:
      - Which part of a raise statement records the exception that caused the new one?
      - You need a name for the original exception — add `as err` to the except clause.
      - "`raise ConfigError(...) from err`"
    feedback:
      - when: { outputContains: "Caused by: None" }
        message: The KeyError is still only the implicit __context__. Name it with `as err` and add `from err` to the raise.
    explanation: >-
      Raising inside except without from leaves the original only in __context__. `from err` sets
      __cause__, so the chain is explicit in code, in the traceback ("The above exception was the direct
      cause...") and for handlers that inspect err.__cause__.

  - id: parsons-hierarchy
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines so that a small exception hierarchy is defined and the program prints
      `not found: user 7`. One line is a distractor.
    solution: |
      class AppError(Exception):
          """Base class for this app's errors."""
      class NotFoundError(AppError):
          """A requested record does not exist."""
      try:
          raise NotFoundError("user 7")
      except NotFoundError as err:
          print("not found:", err)
      except AppError as err:
          print("other app error:", err)
    distractors:
      - "    raise AppError(\"user 7\")"
    expectedOutput: |
      not found: user 7
    explanation: >-
      The base class inherits from Exception and NotFoundError from AppError. The specific handler must come
      before the general one, otherwise AppError would catch the NotFoundError first. Raising the base
      class AppError would skip the NotFoundError handler, because a parent is not an instance of its
      subclass.

  # ----- Mastery check (new items, not used in the sections) -----
  - id: m-predict-context
    type: predict-output
    skill: prediction
    difficulty: 3
    prompt: What does this print? (Three lines.)
    code: |
      class ParseError(Exception):
          pass

      def parse(text):
          try:
              return int(text)
          except ValueError as err:
              raise ParseError(f"not a number: {text!r}") from err

      try:
          parse("x1")
      except ParseError as err:
          print(err)
          print(type(err.__cause__).__name__)
          print(err.__cause__ is err.__context__)
    answer: |
      not a number: 'x1'
      ValueError
      True
    explanation: >-
      `from err` sets __cause__ to the ValueError. Because ParseError was raised while that ValueError was
      being handled, __context__ is set to the same object automatically. (from also sets
      __suppress_context__, so the traceback only shows it once, as the cause.)
    wrongAnswers:
      - answer: |
          not a number: 'x1'
          ValueError
          False
        feedback: >-
          from does not replace __context__. Raising inside an except block always records the exception
          being handled as __context__; here that is the same ValueError that from stored in __cause__.
      - answer: |
          not a number: 'x1'
          NoneType
          False
        feedback: "`from err` sets __cause__ to the ValueError, so its type name is ValueError."

  - id: m-mcq-catch-level
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: |
      A payments library defines:

      ```python
      class PaymentError(Exception): ...
      class CardDeclinedError(PaymentError): ...
      class FraudSuspectedError(CardDeclinedError): ...
      class GatewayTimeoutError(PaymentError): ...
      ```

      Which single `except` clause catches `CardDeclinedError` **and** `FraudSuspectedError`, but **not**
      `GatewayTimeoutError`?
    explanation: >-
      An except clause catches the class and all its subclasses. FraudSuspectedError is a subclass of
      CardDeclinedError; GatewayTimeoutError is not, so `except CardDeclinedError` is exactly right.
    options:
      - id: a
        text: "`except CardDeclinedError:`"
        correct: true
        feedback: It matches CardDeclinedError and its subclass FraudSuspectedError, nothing else.
      - id: b
        text: "`except PaymentError:`"
        feedback: PaymentError is the base of all three, so it would also catch GatewayTimeoutError.
      - id: c
        text: "`except FraudSuspectedError:`"
        feedback: A subclass clause does not catch its parent; a plain CardDeclinedError would get through.
      - id: d
        text: "`except Exception:`"
        feedback: Far too broad — it catches every ordinary exception, including GatewayTimeoutError and unrelated bugs.

  - id: m-code-required-fields
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Build a tiny validation module:

      1. `ValidationError` — a subclass of `Exception`, the base class for validation problems.
      2. `MissingFieldError` — a subclass of `ValidationError` whose `__init__(self, field)` stores
         `field` as an attribute and passes the message `missing required field: {field}` to
         `super().__init__`.
      3. `check_required(record, fields)` — raise `MissingFieldError` for the **first** name in `fields`
         (in the order given) that is not a key of the dict `record`; return `None` if all are present.
    starterCode: |
      class ValidationError(Exception):
          pass


      def check_required(record, fields):
          pass


      try:
          check_required({"name": "Ada"}, ["name", "email", "age"])
      except ValidationError as err:
          print("Invalid:", err)
    solution: |
      class ValidationError(Exception):
          """Base class for validation problems."""


      class MissingFieldError(ValidationError):
          """A required field is absent."""

          def __init__(self, field):
              super().__init__(f"missing required field: {field}")
              self.field = field


      def check_required(record, fields):
          for field in fields:
              if field not in record:
                  raise MissingFieldError(field)
          return None


      try:
          check_required({"name": "Ada"}, ["name", "email", "age"])
      except ValidationError as err:
          print("Invalid:", err)
    expectedOutput: |
      Invalid: missing required field: email
    tests:
      - name: the hierarchy is correct
        code: |
          assert defined("MissingFieldError"), "Define a class named MissingFieldError."
          assert issubclass(ValidationError, Exception), "ValidationError must inherit from Exception."
          assert issubclass(MissingFieldError, ValidationError), "MissingFieldError must inherit from ValidationError."
      - name: the error carries the field name
        code: |
          err = MissingFieldError("phone")
          assert err.field == "phone", "Store the field name in self.field."
          assert str(err) == "missing required field: phone", f"str(err) should be 'missing required field: phone', got {str(err)!r}."
      - name: reports the first missing field in order
        code: |
          try:
              check_required({"b": 1}, ["a", "b", "c"])
          except MissingFieldError as err:
              assert err.field == "a", f"The first missing field in ['a', 'b', 'c'] is 'a', but the error was for {err.field!r}."
          else:
              raise AssertionError("check_required({'b': 1}, ['a', 'b', 'c']) should raise MissingFieldError.")
          try:
              check_required({"a": 1, "b": 2}, ["a", "b", "c"])
          except MissingFieldError as err:
              assert err.field == "c", f"Only 'c' is missing, but the error was for {err.field!r}."
          else:
              raise AssertionError("A record missing 'c' should raise MissingFieldError.")
      - name: complete records pass
        code: |
          assert check_required({"a": 1, "b": 2}, ["a", "b"]) is None, "When every field is present, return None without raising."
      - name: prints the friendly message
        code: |
          assert output().strip() == "Invalid: missing required field: email", f"Your program printed {output()!r}."
    hints:
      - "class MissingFieldError(ValidationError): with an __init__(self, field) that calls super().__init__(...) and sets self.field."
      - In check_required, loop over fields in order and test `field not in record`.
      - Raise as soon as you find the first missing field; after the loop, return None.
    feedback:
      - when: { errorType: NameError, errorMessageContains: "MissingFieldError" }
        message: Define the MissingFieldError class (inheriting from ValidationError) before using it.
    explanation: >-
      MissingFieldError is a ValidationError, so callers can catch either the specific problem or any
      validation problem. Storing the field as an attribute lets handlers react without parsing the
      message, and raising at the first missing field keeps the check simple.

  - id: m-debug-raise-string
    type: debug
    skill: debugging
    prompt: |
      This program should print `Rejected: discount must be between 0 and 100, got 150`, but it crashes
      with a TypeError instead. Fix `set_discount` so it raises the right kind of exception, with a message
      that includes the bad value.
    starterCode: |
      def set_discount(percent):
          if percent < 0 or percent > 100:
              raise "discount must be between 0 and 100"
          return percent / 100


      try:
          set_discount(150)
      except ValueError as err:
          print("Rejected:", err)
    solution: |
      def set_discount(percent):
          if percent < 0 or percent > 100:
              raise ValueError(f"discount must be between 0 and 100, got {percent}")
          return percent / 100


      try:
          set_discount(150)
      except ValueError as err:
          print("Rejected:", err)
    expectedOutput: |
      Rejected: discount must be between 0 and 100, got 150
    tests:
      - name: prints the rejection
        code: |
          assert output().strip() == "Rejected: discount must be between 0 and 100, got 150", f"Your program printed {output()!r}."
      - name: rejects other bad values with their value in the message
        code: |
          try:
              set_discount(-5)
          except ValueError as err:
              assert "-5" in str(err), f"The message should include the bad value -5; it was {str(err)!r}."
          else:
              raise AssertionError("set_discount(-5) should raise ValueError.")
      - name: valid discounts still work
        code: |
          assert set_discount(20) == 0.2, "set_discount(20) should return 0.2."
          assert set_discount(100) == 1.0, "100 is allowed: set_discount(100) should return 1.0."
    hints:
      - Read the error message. What must an exception derive from?
      - The handler catches ValueError — so raise a ValueError object containing the message.
      - Use an f-string so the message ends with `, got {percent}`.
    feedback:
      - when: { errorMessageContains: "must derive from BaseException" }
        message: You can only raise exception objects. Write `raise ValueError(f"... got {percent}")`.
    explanation: >-
      A string is not an exception, so `raise "..."` itself fails with TypeError — which the except
      ValueError clause does not catch. Raising ValueError with an f-string message fixes both the type and
      the missing detail.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-context, predict-reraise, m-mcq-catch-level, m-code-required-fields, m-debug-raise-string]

cheatsheet: |
  ```python
  raise ValueError(f"age must be >= 0, got {age}")     # stop: cannot do the job
  raise TypeError(f"expected str, got {type(x).__name__}")

  class AppError(Exception):                           # base for your package
      """Base class for this app's errors."""

  class NotFoundError(AppError):                       # specific failure + context
      def __init__(self, key):
          super().__init__(f"no record for {key!r}")
          self.key = key

  try:
      value = int(text)
  except ValueError as err:
      raise ConfigError("bad port") from err           # chain: sets __cause__

  except SomeError:
      log(...)
      raise                                            # re-raise unchanged
  ```
  - ValueError = right type, wrong value · TypeError = wrong type
  - except clauses: specific first; subclass instances match parent clauses
  - Expected outcomes (not found) → return a value; failures → raise
  - Never validate with assert (removed by `python -O`)
