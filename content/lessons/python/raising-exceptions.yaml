  - id: mcq-value-vs-type
    type: mcq
    skill: recognition
    prompt: |
      `make_username(name, length)` builds a username. Which call should make it raise **ValueError**
      (rather than TypeError)?
    explanation: >-
      ValueError means the type is right but the value is not acceptable. A negative length is an int —
      the right type — with an impossible value. Passing a list or None where a str/int is expected is a
      TypeError.
    options:
      - id: a
        text: '`make_username("ada", -3)` — a negative length'
        correct: true
        feedback: Right type (int), inappropriate value → ValueError.
      - id: b
        text: '`make_username(["a", "d", "a"], 5)` — a list instead of a string'
        feedback: The argument has the wrong type entirely, so TypeError is the accurate choice.
      - id: c
        text: '`make_username("ada", "five")` — the length is a string'
        feedback: A str where an int is expected is a type problem → TypeError.
      - id: d
        text: '`make_username(None, 5)` — no name at all'
        feedback: None is a different type from str, so this is a TypeError.

  - id: predict-except-order
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      class AppError(Exception):
          pass

      class NotFoundError(AppError):
          pass

      try:
          raise NotFoundError("user 7")
      except AppError as err:
          print("app error:", err)
      except NotFoundError as err:
          print("not found:", err)
    answer: "app error: user 7"
    explanation: >-
      except clauses are tried from top to bottom and the first match wins. A NotFoundError is also an
      AppError (it is a subclass), so the first clause matches and the second can never run. Put the more
      specific clause first.
    wrongAnswers:
      - answer: "not found: user 7"
        feedback: >-
          Python does not look for the most specific match — it takes the first clause that matches, in
          order. NotFoundError is a subclass of AppError, so the first clause catches it.
      - answer: |
          app error: user 7
          not found: user 7
        feedback: At most one except clause runs for an exception in an ordinary try statement.

  - id: mcq-chaining
    type: mcq
    skill: explanation
    difficulty: 2
    prompt: |
      Inside `except KeyError as err:`, what is the difference between writing
      `raise ConfigError("missing port")` and `raise ConfigError("missing port") from err`?
    explanation: >-
      In both cases Python remembers the KeyError in __context__. from err additionally sets __cause__,
      which marks the chain as deliberate: the traceback says "The above exception was the direct cause of
      the following exception" instead of "During handling of the above exception, another exception
      occurred".
    options:
      - id: a
        text: "With from err, the KeyError is stored as __cause__ and the traceback says it was the direct cause; without it, it is only the implicit __context__ and the traceback suggests an error occurred while handling."
        correct: true
        feedback: Exactly. from err documents that you translated the error on purpose.
      - id: b
        text: Without from err the original KeyError is lost completely.
        feedback: It is still kept as __context__ and shown in the traceback, just with wording that suggests an accident.
      - id: c
        text: from err makes the KeyError be raised again instead of ConfigError.
        feedback: The exception raised is still ConfigError; err is only attached as its cause.
      - id: d
        text: There is no difference; from is only a comment for readers.
        feedback: from sets __cause__ and __suppress_context__, which changes the traceback and what handlers can inspect.

  - id: predict-reraise
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      def step():
          try:
              raise KeyError("token")
          except KeyError:
              print("cleaning up")
              raise

      try:
          step()
      except KeyError as err:
          print("caught", repr(err))
    answer: |
      cleaning up
      caught KeyError('token')
    explanation: >-
      The inner except block runs first (printing "cleaning up"), then the bare raise re-raises the same
      KeyError, which the outer handler catches.
    wrongAnswers:
