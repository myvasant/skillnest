      function (including "after raise" and "stock ok") is skipped, and so is "all checked" in the try
      block. Control jumps straight to the except clause.
    wrongAnswers:
      - answer: |
          checking 5
          stock ok
          checking -1
          after raise
          problem: negative stock
        feedback: raise stops the function immediately; the line after it never runs.
      - answer: |
          checking 5
          stock ok
          checking -1
          problem: negative stock
          all checked
        feedback: When an exception jumps to the except clause, the remaining lines of the try block are skipped.
      - answer: |
          checking 5
          stock ok
          checking -1
          stock ok
          problem: negative stock
