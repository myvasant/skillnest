  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - **Positional** arguments match by position; **keyword** arguments (`name=value`) match by name.
            Positional ones come first; each parameter gets exactly one value.
          - **Defaults** (`def f(x, y=0)`) are evaluated **once**, when `def` runs. Never use a mutable
            default; use `None` and create the object inside.
          - `*args` packs extra positional arguments into a **tuple**; `**kwargs` packs extra keyword
            arguments into a **dict**.
          - After `*` (or `*args`): **keyword-only**. Before `/`: **positional-only**.
          - In a call, `f(*seq)` spreads a sequence and `f(**d)` spreads a dict.
          - Arguments are passed **by object reference**: the parameter is bound to the caller's object.
            Mutation is visible to the caller; rebinding the parameter is not.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          Expect "What is wrong with `def f(items=[])`?" and "Is Python pass-by-value or pass-by-reference?".
          For the first, explain that defaults are evaluated once and stored on the function, show the
          shared list, and give the `None` sentinel fix. For the second, say "neither - by object
          reference", then demonstrate mutation (visible) versus rebinding (not visible).

items:
  - id: predict-keyword-match
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      def describe(name, role, years):
          print(name, "-", role, "-", years)

      describe("Ada", years=12, role="engineer")
      describe(role="analyst", name="Grace", years=3)
    answer: |
      Ada - engineer - 12
      Grace - analyst - 3
    explanation: >-
      "Ada" fills name by position; years and role are matched by name, whatever order they are written
      in. The second call uses keywords only. The function always prints in parameter order.
    wrongAnswers:
      - answer: |
          Ada - 12 - engineer
          analyst - Grace - 3
        feedback: >-
          Keyword arguments are matched by parameter name, not by the order you write them. years=12
          always goes to the years parameter.
      - answer: |
          Ada - engineer - 12
          analyst - Grace - 3
        feedback: In the second call name="Grace" is a keyword argument, so Grace is bound to name even though it is written second.

  - id: predict-default-time
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      greeting = "Hello"

      def greet(name, word=greeting):
          return word + ", " + name

      greeting = "Goodbye"
      print(greet("Ada"))
      print(greet("Ada", greeting))
    answer: |
      Hello, Ada
      Goodbye, Ada
    explanation: >-
      The default for word was evaluated when def ran, while greeting referred to "Hello". Rebinding
      greeting afterwards does not change the stored default. The second call passes greeting explicitly,
      which is evaluated at the call: "Goodbye".
    wrongAnswers:
      - answer: |
          Goodbye, Ada
          Goodbye, Ada
        feedback: >-
          Defaults are not looked up at each call. The expression `greeting` was evaluated once, when the
          def statement ran, and the object "Hello" was stored.
      - answer: |
          Hello, Ada
          Hello, Ada
