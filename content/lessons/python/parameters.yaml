  - id: explain-pass-by
    type: explain
    skill: explanation
    difficulty: 2
    prompt: >-
      A colleague says: "Python passes numbers by value and lists by reference." Explain what Python
      actually does when it calls a function, using the change(number, items) example above.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says each parameter is bound to the same object the argument refers to - no copy - and that this rule is the same for every type.
      - Explains that rebinding a parameter (number = number + 1, items = [...]) moves only the function's local name and never changes the caller's variable.
      - Explains that mutating a mutable object through the parameter (items.append) is visible to the caller because it is the same object.
      - Explains that numbers only seem to be passed by value because they are immutable, so the function can only rebind, not change them.
    modelAnswer: |
      Python binds each parameter to the very object the argument evaluated to, like an assignment in the
      new frame; nothing is copied, whatever the type. In change(n, data), number and n both refer to 10,
      and items and data both refer to the list. `number = number + 1` creates 11 and moves only the local
      name number, so n is still 10. `items.append(number)` changes the shared list in place, so data now
      shows [1, 11]. `items = ["replaced"]` moves only the local name. Ints look "passed by value" just
      because they are immutable: a function can never change the object 10, only rebind its own name.
      The accurate term is pass by object reference (or pass by assignment).

  - id: debug-mutable-default
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      Each call to `add_student` without a roster should start a **new** class list, but the second
      class also contains Ada. Fix the function so the program prints `['Ada']` and then `['Alan']`,
      while a roster passed in explicitly is still used.
    starterCode: |
      def add_student(name, roster=[]):
          roster.append(name)
          return roster

      class_a = add_student("Ada")
      class_b = add_student("Alan")
      print(class_a)
      print(class_b)
    solution: |
      def add_student(name, roster=None):
          if roster is None:
              roster = []
          roster.append(name)
          return roster

      class_a = add_student("Ada")
      class_b = add_student("Alan")
      print(class_a)
      print(class_b)
    expectedOutput: |
      ['Ada']
      ['Alan']
    tests:
      - name: each call without a roster gets a new list
        code: |
          a = add_student("X")
          b = add_student("Y")
          assert a == ["X"], f"add_student('X') returned {a!r}; a call without a roster should return a new list containing only 'X'."
          assert b == ["Y"], f"add_student('Y') returned {b!r}; it still shares a list with earlier calls."
      - name: an explicit roster is used
        code: |
          r = ["Grace"]
          out = add_student("Linus", r)
          assert out is r and r == ["Grace", "Linus"], "When a roster is passed in, append to that list and return it."
      - name: the default is not a mutable list
        code: |
          defaults = add_student.__defaults__ or ()
          assert not any(isinstance(d, (list, dict, set)) for d in defaults), "The default value is still a mutable object created once at definition time. Use roster=None and create the list inside the function."
      - name: prints the two classes
        code: |
          assert output_lines() == ["['Ada']", "['Alan']"], f"Expected ['Ada'] then ['Alan'], but your program printed {output()!r}."
    hints:
      - "When is the list in `roster=[]` created: once, or on every call?"
      - Use None as the default, because None can never be changed in place.
      - "Inside the function: `if roster is None:` then `roster = []` - this line runs on every call."
    feedback:
      - when: { outputContains: "'Ada', 'Alan'" }
        message: >-
          Both calls are still sharing one list. The default [] is created once when def runs; create a new
          list inside the function instead.
    explanation: >-
      The default list was created once and stored on the function, so both calls appended to it. With
      roster=None, the `if roster is None: roster = []` line runs on every call that omits the argument,
