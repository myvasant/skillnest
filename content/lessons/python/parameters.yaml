  - id: m-mcq-default-time
    type: mcq
    skill: explanation
    prompt: "Why does `def add(x, items=[])` keep values from earlier calls?"
    explanation: >-
      The default expression [] is evaluated once, when the def statement runs. The resulting list is
      stored on the function object (in __defaults__) and reused by every call that omits items, so
      mutations accumulate.
    options:
      - id: a
        text: The default list is created once, when def runs, and every call without items reuses that same object.
        correct: true
        feedback: Correct. That is why the fix creates the list inside the function body.
      - id: b
        text: Python caches the return value of each call.
        feedback: Python does not cache return values. The shared state is the single default object.
      - id: c
        text: Lists are passed by reference, so the caller's list is modified.
        feedback: No list is passed by the caller here at all; the shared object is the stored default.
      - id: d
        text: The items parameter is global.
        feedback: Parameters are always local names. The surprise comes from which object the local name is bound to.

  - id: m-build-url
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `build_url(base, **params)`. It returns `base` followed by `?` and the keyword arguments as
      `key=value` pairs joined by `&`, in the order they were passed. With no keyword arguments, return
      `base` unchanged. For example:

      ```python
      build_url("https://example.com/search", q="python", page=2)
      # 'https://example.com/search?q=python&page=2'
      ```

      Print that example.
    starterCode: |
      def build_url(base):
          return base

      print(build_url("https://example.com/search", q="python", page=2))
    solution: |
      def build_url(base, **params):
          if not params:
              return base
          parts = []
          for key, value in params.items():
              parts.append(f"{key}={value}")
          return base + "?" + "&".join(parts)

      print(build_url("https://example.com/search", q="python", page=2))
    expectedOutput: |
      https://example.com/search?q=python&page=2
    tests:
      - name: collects keyword arguments with **
        code: |
          import ast
          defs = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == "build_url"]
          assert defs and defs[0].args.kwarg is not None, "Add **params to the def line so build_url accepts any keyword arguments."
      - name: no parameters returns base
        code: |
          r = build_url("https://x.org")
          assert r == "https://x.org", f"build_url('https://x.org') returned {r!r}; with no keyword arguments return base unchanged."
      - name: joins pairs in call order
        code: |
          r = build_url("https://x.org/a", page=2)
          assert r == "https://x.org/a?page=2", f"build_url('https://x.org/a', page=2) returned {r!r}."
          r = build_url("https://x.org/b", sort="new", limit=5, q="hi")
          assert r == "https://x.org/b?sort=new&limit=5&q=hi", f"With three keywords it returned {r!r}; keep the call order and join with &."
      - name: prints the example
        code: |
          assert output().strip() == "https://example.com/search?q=python&page=2", f"Your program printed {output()!r}."
    hints:
      - "`**params` gives you a dict such as {'q': 'python', 'page': 2}."
      - "Loop over params.items(), build \"key=value\" strings, then join them with \"&\".join(...)."
      - "An empty dict is falsy, so `if not params: return base` handles the no-arguments case."
    explanation: >-
      **params packs the keyword arguments into a dict whose order matches the call. Each pair is
      formatted as key=value and the pieces are joined with &. The guard clause keeps the plain base URL
      when no parameters were given.

