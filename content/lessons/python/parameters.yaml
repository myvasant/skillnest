sections:
  - id: why
    title: Why calls need more than position
    kind: why
    blocks:
      - type: markdown
        body: |
          With the [functions](concept:python.functions) you have written so far, arguments are matched to
          parameters purely by **position**. That is fine for `area(3, 4)`, but it breaks down quickly.
          Read this call and say what `True` and `False` mean:
      - type: code
        runnable: true
        code: |
          def book_ticket(name, seats, window, meal):
              print(name, "booked", seats, "seat(s); window:", window, "meal:", meal)

          book_ticket("Ada", 2, True, False)
        expectedOutput: |
          Ada booked 2 seat(s); window: True meal: False
        caption: You have to open the function to find out - and swapping True and False would not raise any error.
      - type: markdown
        body: |
          Two features fix this. **Keyword arguments** name each value at the call site, and
          **default values** let callers leave out what is usually the same:
      - type: code
        runnable: true
        code: |
          def book_ticket(name, seats=1, window=False, meal=False):
              print(name, "booked", seats, "seat(s); window:", window, "meal:", meal)

          book_ticket("Ada", seats=2, window=True)
          book_ticket("Grace")
        expectedOutput: |
          Ada booked 2 seat(s); window: True meal: False
          Grace booked 1 seat(s); window: False meal: False
        annotations:
          - line: 1
            text: Every parameter after name has a default, so callers may omit it.
          - line: 4
            text: The call now documents itself. meal is left out, so it uses its default, False.
      - type: markdown
        body: |
          This lesson covers every way Python can match arguments to parameters, and finishes with the
          question every Python developer eventually asks: *when a function changes its parameter, does
          the caller see it?*

  - id: positional-keyword
    title: Positional and keyword arguments
    kind: concept
    blocks:
      - type: markdown
        body: |
          - A [positional argument](glossary:positional-argument) is matched by its **position**: the first
            argument goes to the first parameter, and so on.
          - A [keyword argument](glossary:keyword-argument) is written `parameter=value` and is matched by
            **name**, so its position does not matter.

          You can mix them in one call, with one rule: **all positional arguments come first**. Each
          parameter must receive exactly one value.
      - type: code
        runnable: true
        code: |
          def divide(dividend, divisor):
              return dividend / divisor

          print(divide(10, 4))
          print(divide(divisor=4, dividend=10))
          print(divide(10, divisor=4))
        expectedOutput: |
          2.5
          2.5
          2.5
        annotations:
          - line: 5
            text: Keyword arguments in any order - they are matched by name.
          - line: 6
            text: Mixed - 10 fills dividend by position, then divisor is given by name.
      - type: markdown
        body: |
          Breaking the rules gives errors that say exactly what went wrong:
      - type: code
        runnable: true
        code: |
          def divide(dividend, divisor):
              return dividend / divisor

          print(divide(10, dividend=4))
        expectError: TypeError
        caption: "TypeError: divide() got multiple values for argument 'dividend' - 10 already filled dividend by position."
      - type: code
        runnable: true
        code: |
          def divide(dividend, divisor):
              return dividend / divisor

          print(divide(dividend=10, 4))
        expectError: SyntaxError
        caption: "SyntaxError: positional argument follows keyword argument. Python refuses to read the program at all."
      - type: callout
        variant: tip
        title: When to use keywords
        body: |
          Use keyword arguments whenever the meaning of a value is not obvious from the call: booleans
          (`window=True`), numbers with units (`timeout=30`), and functions with more than two or three
          parameters. Built-ins do this too: `print(a, b, sep=", ", end="")`, `sorted(names, reverse=True)`.
      - type: item
        ref: predict-keyword-match

  - id: defaults
    title: Default values are evaluated once
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [default parameter value](glossary:default-argument) is written `parameter=value` in the `def`
          line. If the caller does not supply that argument, the default is used.

          Two rules:

          1. Parameters **with** defaults must come **after** parameters without them:
             `def f(a, b=2)` is fine; `def f(a=1, b)` is a `SyntaxError`.
          2. The default expression is evaluated **once, when the `def` statement runs** - not each time
             the function is called. Python stores the resulting object on the function and reuses it.

          Rule 2 is easy to see with a name that changes after the definition:
      - type: code
        runnable: true
        code: |
          rate = 18

          def add_tax(price, percent=rate):
              return price + price * percent / 100

          rate = 5
          print(add_tax(100))
          print(add_tax(100, rate))
        expectedOutput: |
          118.0
          105.0
        annotations:
          - line: 3
            text: When def runs, rate refers to 18, so the default becomes the object 18.
          - line: 6
            text: Rebinding rate later does not change the stored default.
          - line: 8
            text: Passing rate explicitly evaluates it now, at the call, giving 5.
      - type: item
        ref: predict-default-time

  - id: mutable-default
    title: "The mutable default trap"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          "Evaluated once" has a famous consequence. If the default is a **mutable** object such as a list,
          every call that uses the default shares **the same list** - and changes made in one call are
          still there in the next. Predict the output, then step through it.
      - type: visualization
        component: python-tracer
        title: Two calls, one default list
        caption: >-
          Watch the basket name in each add_item frame. Both calls point at the same list object, which was
          created once when def ran. first and second end up as two names for that one list.
        props:
          code: |
            def add_item(item, basket=[]):
                basket.append(item)
                return basket

            first = add_item("apple")
            second = add_item("bread")
            print(first)
            print(second)
            print(first is second)
      - type: markdown
        body: |
          The output is `['apple', 'bread']` twice, then `True`. This is the
          [mutable default argument](glossary:mutable-default-argument) bug, and the official tutorial
          carries an "Important warning" about it.

          **The fix - the `None` sentinel.** Use `None` as the default and create a fresh object inside
          the function, where it runs on every call:
      - type: code
        runnable: true
        code: |
          def add_item(item, basket=None):
              if basket is None:
                  basket = []
              basket.append(item)
              return basket

          first = add_item("apple")
          second = add_item("bread")
          print(first)
          print(second)
          print(add_item("cheese", ["milk"]))
        expectedOutput: |
          ['apple']
          ['bread']
          ['milk', 'cheese']
        annotations:
          - line: 2
            text: "`is None` checks identity with the single None object. It is the idiomatic test for \"no argument given\"."
          - line: 3
            text: This line runs on each call, so each call gets a new list.
      - type: callout
        variant: production
        title: Tools catch this for you
        body: |
          Linters such as Ruff and pylint warn about mutable defaults. Treat the warning as a bug report.
          Immutable defaults (`0`, `""`, `None`, `False`, tuples) are always safe because they can never be
          changed in place.
      - type: item
        ref: predict-mutable-default

  - id: star-args
    title: "*args - any number of positional arguments"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Some functions should accept as many values as the caller likes - think of `print(a, b, c)` or
          `max(3, 8, 1)`. A parameter written with one star, conventionally
          [`*args`](glossary:args-kwargs), **collects every extra positional argument into a tuple**. The name after the star can be anything; choose a
          meaningful one such as `*numbers`.
      - type: code
        runnable: true
        code: |
          def total(*numbers):
              print("numbers is", numbers)
              result = 0
              for n in numbers:
                  result += n
              return result

          print(total(1, 2, 3))
          print(total())
        expectedOutput: |
          numbers is (1, 2, 3)
          6
          numbers is ()
          0
        annotations:
          - line: 1
            text: The star means "pack the remaining positional arguments into one tuple".
          - line: 9
            text: With no arguments, numbers is an empty tuple - never None.
      - type: markdown
        body: |
          `*args` can follow ordinary parameters. The ordinary ones are filled first; only the leftovers
          are packed:
      - type: code
        runnable: true
        code: |
          def report(title, *lines):
              print(title.upper())
              for line in lines:
                  print("-", line)

          report("Shopping", "milk", "eggs")
          report("Empty list")
        expectedOutput: |
          SHOPPING
          - milk
          - eggs
          EMPTY LIST

  - id: star-kwargs
    title: "**kwargs - any number of keyword arguments"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Two stars, conventionally `**kwargs` ("keyword arguments"), **collect every extra keyword
          argument into a new dictionary**: the keys are the argument names (as strings), the values are
          the argument objects. The dict keeps the order in which the caller wrote the arguments.
      - type: code
        runnable: true
        code: |
          def describe(name, **details):
              print(name)
              for key, value in details.items():
                  print(f"  {key}: {value}")

          describe("Ada Lovelace", born=1815, field="mathematics")
          describe("Unknown")
        expectedOutput: |
          Ada Lovelace
            born: 1815
            field: mathematics
          Unknown
        annotations:
          - line: 1
            text: name is filled normally; any other keyword arguments land in the dict details.
          - line: 6
            text: "details is {'born': 1815, 'field': 'mathematics'} for this call."
      - type: markdown
        body: |
          All the kinds of parameter can be combined. When they are, they must appear in this order:

          ```text
          def f(positional_only, /, normal, *args, keyword_only, **kwargs):
          ```

          You will rarely need all of them at once. `*args` and `**kwargs` shine when a function forwards
          arguments to another function, or genuinely accepts open-ended input - but explicit parameters
          are clearer whenever you know the names in advance.

  - id: special-parameters
    title: Keyword-only and positional-only parameters
    kind: concept
    blocks:
      - type: markdown
        body: |
          You can also **force** callers to use one style.

          **[Keyword-only](glossary:keyword-only-parameter) (`*`).** Parameters after a bare `*` (or after
          `*args`) can only be passed by keyword. Use this for flags and options whose meaning would be unclear as a bare value
          ([PEP 3102](https://peps.python.org/pep-3102/)). The built-in `sorted` does exactly this: its
          `key` and `reverse` parameters are keyword-only.
      - type: code
        runnable: true
        code: |
          def connect(host, port, *, timeout=10, retries=3):
              return f"{host}:{port} timeout={timeout} retries={retries}"

          print(connect("example.com", 443))
          print(connect("example.com", 443, timeout=5))
          print(connect("example.com", 443, 5))
        expectError: TypeError
        expectedOutput: |
          example.com:443 timeout=10 retries=3
          example.com:443 timeout=5 retries=3
        caption: "The last call fails with: connect() takes 2 positional arguments but 3 were given. A bare 5 could mean timeout or retries, so Python refuses to guess."
      - type: markdown
        body: |
          **[Positional-only](glossary:positional-only-parameter) (`/`).** Parameters before a `/` can only
          be passed by position
          ([PEP 570](https://peps.python.org/pep-0570/)). Use this when the parameter names are not
          meaningful to callers, so you remain free to rename them later. Many built-ins work this way:
          `len(obj=[1, 2])` raises `TypeError: len() takes no keyword arguments`.
      - type: code
        runnable: true
        code: |
          def distance(x, y, /):
              return (x ** 2 + y ** 2) ** 0.5

          print(distance(3, 4))
          print(distance(x=3, y=4))
        expectError: TypeError
        expectedOutput: |
          5.0
        caption: "TypeError: distance() got some positional-only arguments passed as keyword arguments: 'x, y'"
      - type: item
        ref: mcq-keyword-only

  - id: unpacking
    title: "Unpacking arguments: f(*items) and f(**options)"
    kind: concept
    blocks:
      - type: markdown
        body: |
          The stars also work **in a call**, where they do the opposite of what they do in a definition:

          | Where | `*` | `**` |
          |---|---|---|
          | In a `def` (parameters) | **pack** extra positional arguments into a tuple | **pack** extra keyword arguments into a dict |
          | In a call (arguments) | **spread** a sequence into separate positional arguments | **spread** a dict into keyword arguments |

          This is [argument unpacking](glossary:argument-unpacking):
      - type: code
        runnable: true
        code: |
          def volume(length, width, height):
              return length * width * height

          dims = [2, 3, 4]
          print(volume(*dims))

          box = {"height": 4, "length": 2, "width": 3}
          print(volume(**box))

          print(*dims)
          print(*dims, sep="-")
        expectedOutput: |
          24
          24
          2 3 4
          2-3-4
        annotations:
          - line: 5
            text: "*dims spreads the list, so this call is volume(2, 3, 4)."
          - line: 8
            text: "**box becomes volume(height=4, length=2, width=3); keys are matched to parameter names."
          - line: 10
            text: print receives three separate arguments, not one list.
      - type: callout
        variant: misconception
        title: A list is one argument
        body: |
          `volume(dims)` passes **one** argument - the list - so Python reports
          `volume() missing 2 required positional arguments: 'width' and 'height'`. Python never unpacks a
          list for you; write the `*` to ask for it.

  - id: passing
    title: "Mental model: arguments are passed by object reference"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          You may hear that some languages pass arguments "by value" (the function gets a **copy**) or "by
          reference" (the function gets access to the caller's **variable** itself, and can make it refer
          to something else). Python does neither. Python passes arguments
          [by object reference](glossary:pass-by-object-reference):

          > Calling `f(x)` binds the parameter to **the same object** that the argument expression
          > evaluated to - exactly like the assignment `parameter = argument`, done in the function's new
          > frame.

          Two consequences follow, for **every** type of object:

          1. **No copy is made.** If the function **mutates** the object (appends to a list, sets a dict
             key), the caller sees the change, because it is the same object.
          2. **The parameter is a separate name.** If the function **rebinds** the parameter
             (`items = []`, `n = n + 1`), only its local name moves. The caller's variable still refers to
             the original object.

          The official tutorial puts it this way: arguments are passed "using call by value (where the
          value is always an object reference, not the value of the object)", and adds that "call by object
          reference would be a better description". The Programming FAQ puts it even more briefly:
          "arguments are passed by assignment in Python".
      - type: visualization
        component: python-tracer
        title: Rebinding vs mutating a parameter
        caption: >-
          Inside change, number = number + 1 rebinds only the local name (n is still 10). items.append(...)
          mutates the shared list, so data sees it. items = [...] then rebinds only the local name.
        props:
          code: |
            def change(number, items):
                number = number + 1
                items.append(number)
                items = ["replaced"]

            n = 10
            data = [1]
            change(n, data)
            print(n, data)
      - type: callout
        variant: misconception
        title: '"Numbers are passed by value, lists by reference"'
        body: |
          The mechanism is the same for both. Integers only *look* copied because they are
          [immutable](glossary:immutable): `n += 1` cannot change the object 10, so it creates 11 and
          rebinds the local name. A list *can* be changed in place, so the caller notices. Want a function
          to "change" a caller's number? Return the new value and let the caller rebind:
          `count = increment(count)`.
      - type: item
        ref: explain-pass-by

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **How a call fills the parameters.** The language reference
          ([Calls](https://docs.python.org/3/reference/expressions.html#calls)) describes it as filling
          slots, one per parameter:

          1. Positional arguments fill slots left to right. Extra ones go into `*args`, or raise
             `TypeError: ... takes N positional arguments but M were given`.
          2. Keyword arguments fill slots by name. A slot that is already full raises "got multiple values";
             an unknown name goes into `**kwargs`, or raises "got an unexpected keyword argument".
          3. Empty slots take their default. Any slot still empty raises "missing ... required argument".

          **Where defaults live.** The default objects are stored on the function object: positional
          defaults in the tuple `__defaults__`, keyword-only defaults in the dict `__kwdefaults__`. That
          is the precise reason a mutable default is shared - it is one object stored in one place.
      - type: code
        runnable: true
        code: |
          import inspect

          def f(a, b=2, *args, c, d=4, **kw):
              pass

          print(f.__defaults__)
          print(f.__kwdefaults__)
          print(inspect.signature(f))
        expectedOutput: |
          (2,)
          {'d': 4}
          (a, b=2, *args, c, d=4, **kw)
        annotations:
          - line: 3
            text: c is keyword-only and required; d is keyword-only with a default.
      - type: markdown
        body: |
          **Packing always builds new objects.** Each call creates a fresh tuple for `*args` and a fresh
          dict for `**kwargs`. So a function that receives `**options` cannot add keys to the caller's
          dict - it only has a copy of the top level (the *values* are still shared objects, as always).
          Since Python 3.6 the order of `**kwargs` is guaranteed to match the order of the keyword
          arguments in the call ([PEP 468](https://peps.python.org/pep-0468/)).
      - type: code
        runnable: true
        code: |
          def tweak(**options):
              options["debug"] = True
              return options

          settings = {"level": 3}
          result = tweak(**settings)
          print(settings)
          print(result)
          print(result is settings)
        expectedOutput: |
          {'level': 3}
          {'level': 3, 'debug': True}
          False

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: f() missing 1 required positional argument: 'b'` | No value for a parameter without a default | Pass it, or give the parameter a default. |
          | `TypeError: f() takes 2 positional arguments but 3 were given` | Too many positional arguments - or a keyword-only parameter passed by position | Check the `def` line; pass options by keyword. |
          | `TypeError: f() got an unexpected keyword argument 'colour'` | The keyword does not match any parameter name (often spelling) | Use the exact parameter name from the `def` line. |
          | `TypeError: f() got multiple values for argument 'a'` | The same parameter given by position **and** by keyword | Give each parameter one value. |
          | `SyntaxError: positional argument follows keyword argument` | `f(a=1, 2)` | Put positional arguments first. |
          | `SyntaxError: parameter without a default follows parameter with a default` | `def f(a=1, b):` | Put parameters with defaults last. |
          | A default list or dict "remembers" earlier calls | Mutable default evaluated once | Default to `None`; create the object inside. |
          | `missing 2 required positional arguments` when passing a list | You passed the list as one argument | Unpack it: `f(*values)`. |
          | The caller's variable did not change after the function "changed" it | The function rebound its parameter | Return the new value and rebind in the caller. |
      - type: code
        runnable: true
        code: |
          def order(item, quantity=1):
              return f"{quantity} x {item}"

          print(order("tea", quantity=2))
          print(order("tea", qty=2))
        expectError: TypeError
        expectedOutput: |
          2 x tea
        caption: "TypeError: order() got an unexpected keyword argument 'qty' - keyword names must match the parameter names exactly."
      - type: item
        ref: debug-mutable-default

