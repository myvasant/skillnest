  - id: average-args
    type: code
    skill: implementation
    prompt: |
      Rewrite `average` so it accepts **any number of numbers as separate arguments** -
      `average(4, 8, 6)` - and returns their mean. With no arguments at all it should return `None`
      (instead of crashing). The program should print `6.0`, `10.0` and `None`.
    starterCode: |
      def average(numbers):
          return sum(numbers) / len(numbers)

      print(average(4, 8, 6))
      print(average(10))
      print(average())
    solution: |
      def average(*numbers):
          if len(numbers) == 0:
              return None
          return sum(numbers) / len(numbers)

      print(average(4, 8, 6))
      print(average(10))
      print(average())
    expectedOutput: |
      6.0
      10.0
      None
    tests:
      - name: accepts any number of arguments
        code: |
          import ast
          defs = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == "average"]
          assert defs, "Define a function named average."
          assert defs[0].args.vararg is not None, "Put a star before the parameter - def average(*numbers): - so it collects every argument into a tuple."
      - name: returns the mean
        code: |
          for args, expected in [((4, 8, 6), 6.0), ((10,), 10.0), ((1, 2), 1.5), ((-3, 3, 0, 4), 1.0)]:
              r = average(*args)
              assert r == expected, f"average{args} returned {r!r}; expected {expected}."
      - name: no arguments gives None
        code: |
          r = average()
          assert r is None, f"average() returned {r!r}; with no numbers it should return None instead of dividing by zero."
      - name: prints the three results
        code: |
          assert output_lines() == ["6.0", "10.0", "None"], f"Your program printed {output()!r}."
    hints:
      - "`def average(*numbers):` packs all the arguments into a tuple called numbers."
      - sum() and len() work on tuples just as they do on lists.
      - Check for an empty tuple before dividing, and return None in that case.
    feedback:
      - when: { errorType: ZeroDivisionError }
        message: With no arguments the tuple is empty, so len(numbers) is 0. Return None before dividing.
    explanation: >-
      The star packs every positional argument into the tuple numbers - (4, 8, 6), (10,) or (). The guard
      clause handles the empty case before the division that would otherwise raise ZeroDivisionError.

