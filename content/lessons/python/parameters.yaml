cheatsheet: |
  ```python
  def f(a, b=2):           # b has a default (evaluated ONCE, at def time)
  f(1), f(1, 3), f(b=3, a=1)   # positional / keyword (positional first)

  def f(items=None):       # never items=[] - use the None sentinel
      if items is None:
          items = []

  def f(*args, **kwargs):  # args: tuple of extra positionals, kwargs: dict of extra keywords
  def f(pos, /, normal, *, kw):   # / -> positional-only before it; * -> keyword-only after it

  f(*[1, 2, 3])            # spread a sequence into positional arguments
  f(**{"a": 1, "b": 2})    # spread a dict into keyword arguments
  ```
  - Passing = binding the parameter to the caller's object (pass by object reference)
  - Mutating a parameter's object → caller sees it · rebinding the parameter → caller doesn't
