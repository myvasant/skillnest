id: python.parameters
concept: python.parameters
title: Parameters and Arguments in Depth
subtitle: Keywords, defaults, *args, **kwargs - and what really gets passed
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Make functions easy to call correctly: keyword arguments, default values (and the famous mutable
  default trap), *args and **kwargs, keyword-only and positional-only parameters, and argument
  unpacking. Finish with an accurate model of how Python passes arguments - by object reference.
objectives:
  - Call functions with positional and keyword arguments and predict how arguments are matched to parameters.
  - Use default parameter values, and explain why defaults are evaluated once when the function is defined.
  - Recognise and fix the mutable default argument bug with the None sentinel pattern.
  - Write functions that accept any number of arguments with *args and **kwargs, and unpack sequences and dicts into calls.
  - Design signatures with keyword-only (*) and positional-only (/) parameters.
  - Explain "pass by object reference" and predict when a caller sees changes made inside a function.
