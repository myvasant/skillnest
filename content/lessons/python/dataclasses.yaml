id: python.dataclasses
concept: python.dataclasses
title: Dataclasses and Enums
subtitle: Less boilerplate for data, named constants for fixed choices
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Let @dataclass write __init__, __repr__ and __eq__ for classes that mainly hold data. Use defaults and
  field(default_factory=list) safely, freeze objects, sort them, and validate them in __post_init__. Then
  replace error-prone strings with Enum members, and learn when to pick a dataclass, a plain class, a dict
  or an enum.
objectives:
  - Write a dataclass with typed fields, defaults and field(default_factory=...), and predict the generated __init__, __repr__ and __eq__.
  - Explain why mutable defaults are rejected and fix them with default_factory.
  - Use frozen=True, replace() and order=True, and explain hashing and shallow immutability.
  - Validate invariants in __post_init__.
  - Define and use an Enum, look members up by value and by name, and explain why Status.PAID != "paid".
  - Choose between a dataclass, a plain class, a dict and an enum for a given situation.
