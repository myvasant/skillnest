  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **A code generator.** `@dataclass` reads the class's annotations (in Python 3.14 via
          `annotationlib`), builds a `Field` object for each one and stores them in the class attribute
          `__dataclass_fields__`. It then writes the *source text* of `__init__`, `__repr__`, `__eq__` and
          friends, compiles it with `exec`, and attaches the resulting functions to your class. It returns
          the same class object — except with `slots=True`, where it must build a new class with `__slots__`.
          (That text-generation strategy is a CPython implementation detail; the documented behaviour is
          what the methods do.)

          **Which names are fields.** Every annotated class attribute — except those annotated
          `typing.ClassVar[...]` (shared class data) and `dataclasses.InitVar[...]` (passed to
          `__post_init__` but not stored). Unannotated attributes are ignored.

          **Hashing rules.** With `eq=True` (the default) and `frozen=False`, `__hash__` is set to `None` —
          the object is unhashable. With `eq=True` and `frozen=True`, a `__hash__` based on the fields is
          generated. `unsafe_hash=True` forces one anyway (rarely a good idea).

          **Frozen is implemented by `__setattr__`.** A frozen dataclass overrides `__setattr__` and
          `__delattr__` to raise `FrozenInstanceError`. Inside `__post_init__` of a frozen class you
          therefore cannot write `self.total = ...`; the documented workaround is
          `object.__setattr__(self, "total", ...)`.

          **Enum members are created once.** The `Enum` base class uses a metaclass (`EnumType`) that turns
          each class attribute into a member object when the class is created; afterwards no new members can
          be made, which is why `is` comparisons are safe. A second name with an already-used value becomes
          an **alias** of the first member. Variants exist for special needs: `StrEnum` and `IntEnum` members
          compare equal to plain strings/ints (convenient, but weaker protection), and `Flag` supports
          combinable bit flags.
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass
          from enum import Enum

          @dataclass
          class Point:
              x: int
              y: int

          @dataclass(frozen=True)
          class FrozenPoint:
              x: int
              y: int

          print(list(Point.__dataclass_fields__), Point.__hash__ is None)
          print(isinstance(hash(FrozenPoint(1, 2)), int))

          class Color(Enum):
              RED = 1
              CRIMSON = 1

          print(Color.CRIMSON is Color.RED, list(Color))
        expectedOutput: |
          ['x', 'y'] True
          True
          True [<Color.RED: 1>]
        annotations:
          - line: 14
            text: A normal (non-frozen) dataclass is deliberately unhashable.
          - line: 19
            text: CRIMSON is an alias for RED; iteration lists each member once.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `@dataclass` turns annotated class attributes into **fields** and generates `__init__`,
            `__repr__` and `__eq__` (fields compared in order, same class only).
          - Required fields first; mutable defaults are rejected — use `field(default_factory=list)`.
          - `frozen=True` → no reassignment, hashable, change with `replace()`. Frozen is **shallow**.
          - `order=True` → `<`, `>`… comparing fields as a tuple, so `sorted()` works.
          - `__post_init__` runs after the generated `__init__`: validate, normalise, compute
            `field(init=False)` values.
          - `Enum` names a fixed set of values: `.name`, `.value`, `Status(value)`, `Status[name]`. Members
            are singletons and are **not** equal to their raw values.
          - Dataclass for records, plain class for heavy behaviour, dict for dynamic keys, Enum for choices.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          Common questions: "Why can't a dataclass field default to `[]`?" (shared mutable default; use
          `default_factory`), "Why is my dataclass unhashable?" (`eq` without `frozen` sets `__hash__ = None`)
          and "Dataclass, NamedTuple, dict or Pydantic model?" — dataclasses for internal records, Pydantic
          when you must validate external data at runtime, dicts for truly dynamic data.

items:
  - id: which-are-fields
    type: mcq
    skill: recognition
    prompt: |
      Which names become parameters of the generated `__init__`?

      ```python
      @dataclass
      class Config:
          host: str
          port: int = 8080
          retries = 3
          debug: bool = False
      ```
    explanation: >-
      Only annotated names are fields. host, port and debug have annotations; retries = 3 is a plain class
      attribute that every instance shares, and it is not a parameter of __init__.
    options:
      - id: a
        text: host, port and debug
        correct: true
        feedback: Right — retries has no annotation, so @dataclass ignores it.
      - id: b
        text: host, port, retries and debug
        feedback: "A name needs a type annotation to be a field. retries = 3 is an ordinary class attribute."
      - id: c
        text: only host, because the others have defaults
        feedback: Fields with defaults are still parameters — they are just optional ones.
      - id: d
        text: none — you must still write __init__ yourself
        feedback: Generating __init__ is the main job of @dataclass.

  - id: predict-eq
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      from dataclasses import dataclass

      @dataclass
      class Card:
          rank: str
          suit: str

      a = Card("Q", "hearts")
      b = Card("Q", "hearts")
      c = a
      c.suit = "spades"
      print(a == b, a is c, a)
    answer: "False True Card(rank='Q', suit='spades')"
    explanation: >-
      c = a makes c another name for the same object (no copy), so changing c.suit changes a. Now a's
      fields ("Q", "spades") differ from b's ("Q", "hearts"), so the generated __eq__ returns False. a is c
      is True because they are one object.
    wrongAnswers:
      - answer: "True True Card(rank='Q', suit='hearts')"
        feedback: >-
          c = a does not copy the card; both names refer to the same object, so c.suit = "spades" changes
          what a refers to as well.
      - answer: "True False Card(rank='Q', suit='spades')"
        feedback: >-
          a and b no longer have equal fields once the suit changed, and c = a binds c to the very same object,
          so a is c is True.

  - id: predict-enum-compare
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      from enum import Enum

      class Light(Enum):
          RED = "stop"
          GREEN = "go"

      signal = Light("go")
      print(signal.name, signal == "go", signal is Light.GREEN)
    answer: "GREEN False True"
    explanation: >-
      Light("go") looks the member up by value and returns Light.GREEN, whose name is "GREEN". An Enum member
      is not equal to its raw value, so signal == "go" is False. Members are singletons, so the identity
      check is True.
    wrongAnswers:
      - answer: "GREEN True True"
        feedback: >-
          A plain Enum member never equals its value. Compare with Light.GREEN, or use signal.value == "go"
          (StrEnum is the variant whose members do equal strings).
      - answer: "go False True"
        feedback: .name is the identifier (GREEN); .value is what you assigned ("go").

  - id: choose-structure
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      Your program reads delivery records from JSON. Each has the same three keys — `id`, `address`,
      `status` — and status is always one of "pending", "out", "delivered". The code passes records
      around and changes their status. What representation fits best inside your program?
    explanation: >-
      A fixed set of named fields that your code works with suggests a dataclass, and a value drawn from a
      fixed set of options suggests an Enum. Converting at the boundary (JSON → dataclass, and asdict() on
      the way out) catches bad data early.
    options:
      - id: a
        text: A dataclass with an Enum field for status, created from each JSON record as it is read.
        correct: true
        feedback: Fields are documented and required, a typo in a status value fails at the boundary, and the status can still be updated.
      - id: b
        text: Keep each record as a dict with string statuses.
        feedback: Works, but a missing key or a typo like "deliverd" goes unnoticed until something misbehaves later.
      - id: c
        text: A frozen dataclass, so the status can never be changed.
        feedback: The code needs to change the status. You could replace() each time, but a frozen record doesn't match how this data is used.
      - id: d
        text: An Enum whose members are the records.
        feedback: Enums are for a fixed set of options known when you write the code, not for data loaded at runtime.

  - id: inventory-item
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a dataclass `Item` with these fields, in this order:

      - `name: str`
      - `price: float`
      - `quantity: int`, defaulting to 0
      - `tags: list[str]`, defaulting to a **new empty list for each item**

      and a method `stock_value()` returning price × quantity. Don't write `__init__`, `__repr__` or
      `__eq__` yourself. The program should print:

      ```text
      Item(name='pen', price=12.5, quantity=4, tags=['office'])
      Item(name='ink', price=40.0, quantity=0, tags=[])
      50.0 True
      ```
    starterCode: |
      from dataclasses import dataclass, field


      # Write the Item dataclass here.


      pen = Item("pen", 12.5, 4)
      ink = Item("ink", 40.0)
      pen.tags.append("office")
      print(pen)
      print(ink)
      print(pen.stock_value(), pen == Item("pen", 12.5, 4, ["office"]))
    solution: |
      from dataclasses import dataclass, field


      @dataclass
      class Item:
          name: str
          price: float
          quantity: int = 0
          tags: list[str] = field(default_factory=list)

          def stock_value(self):
              return self.price * self.quantity


      pen = Item("pen", 12.5, 4)
      ink = Item("ink", 40.0)
      pen.tags.append("office")
      print(pen)
      print(ink)
      print(pen.stock_value(), pen == Item("pen", 12.5, 4, ["office"]))
    expectedOutput: |
      Item(name='pen', price=12.5, quantity=4, tags=['office'])
      Item(name='ink', price=40.0, quantity=0, tags=[])
      50.0 True
    tests:
      - name: Item is a dataclass with the right fields
        code: |
          import dataclasses
          assert defined("Item"), "Define a class named Item."
          assert dataclasses.is_dataclass(Item), "Put @dataclass on the line above class Item."
          names = [f.name for f in dataclasses.fields(Item)]
          assert names == ["name", "price", "quantity", "tags"], f"Fields should be name, price, quantity, tags (in that order), got {names}."
      - name: defaults work
        code: |
          x = Item("x", 1.0)
          assert x.quantity == 0, f"quantity should default to 0, got {x.quantity!r}."
          assert x.tags == [], f"tags should default to an empty list, got {x.tags!r}."
      - name: each item gets its own tags list
        code: |
          a = Item("a", 1.0)
          b = Item("b", 2.0)
          a.tags.append("sale")
          assert b.tags == [], "Two items share one tags list. Use field(default_factory=list)."
      - name: stock_value works for any item
        code: |
          assert Item("box", 2.5, 10).stock_value() == 25.0, "Item('box', 2.5, 10).stock_value() should be 25.0."
      - name: no hand-written __init__
        code: |
          import ast
          cls = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "Item")
          written = {f.name for f in cls.body if isinstance(f, ast.FunctionDef)}
          assert not written & {"__init__", "__repr__", "__eq__"}, "Let @dataclass generate __init__, __repr__ and __eq__ — remove your own versions."
      - name: prints the three lines
        code: |
          assert output_lines() == ["Item(name='pen', price=12.5, quantity=4, tags=['office'])", "Item(name='ink', price=40.0, quantity=0, tags=[])", "50.0 True"], f"Your program printed {output()!r}."
    hints:
      - "Start with `@dataclass` then `class Item:` and one annotated line per field: `name: str`."
      - "Defaults: `quantity: int = 0`. A list default must be `tags: list[str] = field(default_factory=list)`."
      - "stock_value is an ordinary method: `def stock_value(self): return self.price * self.quantity`."
    feedback:
      - when: { errorMessageContains: "mutable default" }
        message: Dataclasses reject a [] default because it would be shared. Use field(default_factory=list).
      - when: { errorMessageContains: "non-default argument" }
        message: Fields without defaults (name, price) must come before fields with defaults.
      - when: { errorMessageContains: "is not callable" }
        message: Pass the function list itself to default_factory, without brackets.
    explanation: >-
      Four annotated fields are all @dataclass needs to generate __init__, __repr__ and __eq__. The tags
      default uses default_factory=list, so the generated __init__ calls list() for every new item, and
      stock_value is a normal method.

  - id: debug-post-init
    type: debug
    skill: debugging
    prompt: |
      Bookings with zero nights should be rejected, but the validation never runs. Find and fix the bug.
      The program should print:

      ```text
      Booking(guest='Ada', nights=3)
      Rejected: a booking needs at least one night
      ```
    starterCode: |
      from dataclasses import dataclass


      @dataclass
      class Booking:
          guest: str
          nights: int

          def post_init(self):
              if self.nights < 1:
                  raise ValueError("a booking needs at least one night")


      print(Booking("Ada", 3))
      try:
          Booking("Sam", 0)
          print("accepted a zero-night booking!")
      except ValueError as error:
          print("Rejected:", error)
    solution: |
      from dataclasses import dataclass


      @dataclass
      class Booking:
          guest: str
          nights: int

          def __post_init__(self):
              if self.nights < 1:
                  raise ValueError("a booking needs at least one night")


      print(Booking("Ada", 3))
      try:
          Booking("Sam", 0)
          print("accepted a zero-night booking!")
      except ValueError as error:
          print("Rejected:", error)
    expectedOutput: |
      Booking(guest='Ada', nights=3)
      Rejected: a booking needs at least one night
    tests:
      - name: prints the expected lines
        code: |
          assert output_lines() == ["Booking(guest='Ada', nights=3)", "Rejected: a booking needs at least one night"], f"Your program printed {output()!r}."
      - name: rejects any number of nights below 1
        code: |
          try:
              Booking("Lee", -2)
          except ValueError:
              pass
          else:
              raise AssertionError("Booking('Lee', -2) should raise ValueError.")
          assert Booking("Lee", 1).nights == 1, "A one-night booking is valid."
      - name: still uses the generated __init__
        code: |
          import ast
          cls = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "Booking")
          assert not any(isinstance(f, ast.FunctionDef) and f.name == "__init__" for f in cls.body), "No need to write __init__ — the generated one calls the validation hook if it has the right name."
    hints:
      - "Does `post_init` ever get called? Add a print inside it to find out."
      - The generated __init__ only calls a hook with one exact name, written with double underscores on both sides.
    feedback:
      - when: { outputContains: "accepted a zero-night booking!" }
        message: Your validation method never runs. The generated __init__ calls a method named exactly __post_init__.
    explanation: >-
      The dataclass's generated __init__ calls self.__post_init__() if the class defines it. A method named
      post_init is just an ordinary method that nobody calls, so no validation happened.

  - id: order-status
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      An online shop stores order status as strings and keeps shipping bugs caused by typos like
      `"shiped"`. Rewrite it with an Enum:

      1. `class Status(Enum)` with members `PENDING`, `PAID`, `SHIPPED`, `CANCELLED` whose values are
         `"pending"`, `"paid"`, `"shipped"`, `"cancelled"`.
      2. A dataclass `Order` with fields `number: int` and `status: Status`, defaulting to `Status.PENDING`.
      3. `cancel(order)` sets the status to `Status.CANCELLED`, but raises `ValueError` (changing nothing)
         if the order has already been shipped.
      4. `parse_status(text)` converts text such as `"paid"` (read from a file) into a member; unknown text
         must raise `ValueError`.

      The program should print:

      ```text
      Order(number=1001, status=<Status.PENDING: 'pending'>)
      CANCELLED Status.SHIPPED
      ```
    starterCode: |
      from dataclasses import dataclass
      from enum import Enum


      # 1. Status enum
      # 2. Order dataclass
      # 3. cancel(order)
      # 4. parse_status(text)


      order = Order(1001)
      print(order)
      cancel(order)
      print(order.status.name, parse_status("shipped"))
    solution: |
      from dataclasses import dataclass
      from enum import Enum


      class Status(Enum):
          PENDING = "pending"
          PAID = "paid"
          SHIPPED = "shipped"
          CANCELLED = "cancelled"


      @dataclass
      class Order:
          number: int
          status: Status = Status.PENDING


      def cancel(order: Order) -> None:
          if order.status is Status.SHIPPED:
              raise ValueError("a shipped order cannot be cancelled")
          order.status = Status.CANCELLED


      def parse_status(text: str) -> Status:
          return Status(text)


      order = Order(1001)
      print(order)
      cancel(order)
      print(order.status.name, parse_status("shipped"))
    expectedOutput: |
      Order(number=1001, status=<Status.PENDING: 'pending'>)
      CANCELLED Status.SHIPPED
    tests:
      - name: Status has the four members
        code: |
          import enum
          assert defined("Status") and issubclass(Status, enum.Enum), "Define class Status(Enum)."
          expected = {"PENDING": "pending", "PAID": "paid", "SHIPPED": "shipped", "CANCELLED": "cancelled"}
          actual = {m.name: m.value for m in Status}
          assert actual == expected, f"Status members should be {expected}, got {actual}."
      - name: Order defaults to PENDING
        code: |
          import dataclasses
          assert dataclasses.is_dataclass(Order), "Order should be a @dataclass."
          assert Order(7).status is Status.PENDING, "A new Order's status should default to Status.PENDING."
      - name: cancel works for pending and paid orders
        code: |
          o = Order(1, Status.PAID)
          cancel(o)
          assert o.status is Status.CANCELLED, f"Cancelling a paid order should set Status.CANCELLED, got {o.status!r}."
      - name: shipped orders cannot be cancelled
        code: |
          o = Order(2, Status.SHIPPED)
          try:
              cancel(o)
          except ValueError:
              pass
          else:
              raise AssertionError("cancel() on a SHIPPED order should raise ValueError.")
          assert o.status is Status.SHIPPED, "A refused cancel must leave the status unchanged."
      - name: parse_status converts and validates text
        code: |
          assert parse_status("paid") is Status.PAID, "parse_status('paid') should return Status.PAID."
          try:
              parse_status("payed")
          except ValueError:
              pass
          else:
              raise AssertionError("parse_status('payed') should raise ValueError for unknown text.")
      - name: prints the two lines
        code: |
          assert output_lines() == ["Order(number=1001, status=<Status.PENDING: 'pending'>)", "CANCELLED Status.SHIPPED"], f"Your program printed {output()!r}."
    hints:
      - "Enum members are class attributes: `PENDING = \"pending\"` inside `class Status(Enum):`."
      - "In cancel, compare members, not strings: `if order.status is Status.SHIPPED: raise ValueError(...)`."
      - "Looking up by value already validates: `Status(text)` raises ValueError for unknown text."
    feedback:
      - when: { codeMatches: "status\\s*==\\s*[\"']" }
        message: Comparing a member with a string is always False. Compare with the member itself, e.g. order.status is Status.SHIPPED.
      - when: { errorType: KeyError }
        message: Status[...] looks up by member NAME (like "PAID"). Text from a file holds the VALUE ("paid") — use Status(text).
    explanation: >-
      The enum lists every legal status once, so a typo in code fails immediately and bad text from a file
      fails in parse_status. The dataclass default is a member (hashable and immutable, so it is a safe
      default), and cancel compares members by identity before changing anything.

  - id: parsons-frozen
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to create an immutable point and a moved copy of it, printing
      `Point(x=1, y=2) Point(x=1, y=5)`. Two lines are distractors.
    solution: |
      from dataclasses import dataclass, replace
      @dataclass(frozen=True)
      class Point:
          x: int
          y: int
      p = Point(1, 2)
      q = replace(p, y=5)
      print(p, q)
    distractors:
      - "p.y = 5"
      - "    x = int"
    expectedOutput: |
      Point(x=1, y=2) Point(x=1, y=5)
    explanation: >-
      Fields need annotations (x: int), not assignments. A frozen instance cannot be changed with p.y = 5;
      replace() builds a new Point with y changed and leaves p as it was.

