sections:
  - id: why
    title: Why dataclasses exist
    kind: why
    blocks:
      - type: markdown
        body: |
          Many classes exist mostly to **hold data**: a point, a book, an order line. Written by hand, even
          a two-field class needs a surprising amount of code — and it still behaves oddly:
      - type: code
        runnable: true
        code: |
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def __repr__(self):
                  return f"Point(x={self.x}, y={self.y})"

          a = Point(1, 2)
          b = Point(1, 2)
          print(a)
          print(a == b)
        expectedOutput: |
          Point(x=1, y=2)
          False
        caption: Each field name is typed four times, and two identical points are not equal.
      - type: markdown
        body: |
          `a == b` is `False` because, without an `__eq__` method, `==` falls back to asking "are these the
          same object?" Fixing that means writing `__eq__` too — more repetitive code to keep in sync every
          time you add a field.

          A [dataclass](glossary:dataclass) lets you declare the fields once, with
          [type hints](concept:python.type-hints), and generates those methods for you:
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass

          @dataclass
          class Point:
              x: int
              y: int

          a = Point(1, 2)
          b = Point(1, 2)
          print(a)
          print(a == b)
        expectedOutput: |
          Point(x=1, y=2)
          True
        annotations:
          - line: 3
            text: "@dataclass processes the class right after it is defined and adds methods to it."
          - line: 5
            text: "A field: a name with a type annotation in the class body."
          - line: 11
            text: The generated __eq__ compares the fields.
      - type: callout
        variant: note
        title: What is the @ line?
        body: |
          `@dataclass` is a **decorator**: a function applied to the class immediately after the `class`
          statement runs, as if you had written `Point = dataclass(Point)`. You will learn to write your
          own in [decorators](concept:python.decorators); for now, read it as "turn this into a dataclass".

  - id: basics
    title: Fields and generated methods
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **field** is a class-level name **with a type annotation**. `@dataclass` collects the fields in
          the order they are written and generates:

          - `__init__` taking the fields as parameters, in that order, and storing each on `self`;
          - `__repr__` showing the class name and every field;
          - `__eq__` returning True when the other object is the **same class** with **equal fields**.

          A dataclass is still an ordinary class: you can add methods, and everything from
          [classes](concept:python.classes) still applies.
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass, fields

          @dataclass
          class Book:
              title: str
              author: str
              pages: int

              def is_long(self):
                  return self.pages > 400

          b = Book("Dune", "Frank Herbert", 412)
          print(b)
          print(b.is_long(), b == Book("Dune", "Frank Herbert", 412))
          print([f.name for f in fields(Book)])
        expectedOutput: |
          Book(title='Dune', author='Frank Herbert', pages=412)
          True True
          ['title', 'author', 'pages']
        annotations:
          - line: 9
            text: Methods work exactly as in any class.
          - line: 14
            text: fields() lists the fields @dataclass found, in order.
      - type: code
        language: python
        status: illustrative
        code: |
          # Roughly what @dataclass writes for Book (simplified):
          def __init__(self, title: str, author: str, pages: int):
              self.title = title
              self.author = author
              self.pages = pages

          def __repr__(self):
              return f"Book(title={self.title!r}, author={self.author!r}, pages={self.pages!r})"

          def __eq__(self, other):
              if other.__class__ is self.__class__:
                  return (self.title, self.author, self.pages) == (other.title, other.author, other.pages)
              return NotImplemented
        caption: Not run — a sketch of the generated methods. The real code lives in the dataclasses module.
      - type: callout
        variant: analogy
        title: "Mental model: a code generator"
        body: |
          Think of `@dataclass` as a helper that reads your field list once, when the class is defined, and
          writes the boilerplate methods you would otherwise type by hand. After that, nothing about a
          dataclass is magic: instances are ordinary objects with ordinary attributes, and the generated
          methods are ordinary methods. (The exact generated code differs in details — for example how
          `__eq__` short-cuts identical objects — but this model predicts the behaviour correctly.)
      - type: callout
        variant: warning
        title: The hints are still not enforced
        body: |
          The annotations tell `@dataclass` which names are fields; they are **not checked**.
          `Book(123, None, "many")` runs and prints `Book(title=123, author=None, pages='many')`. A type
          checker would flag it, and you can add runtime checks in `__post_init__` (below).
      - type: item
        ref: which-are-fields
      - type: item
        ref: predict-eq

  - id: defaults
    title: Defaults and the mutable default trap
    kind: concept
    blocks:
      - type: markdown
        body: |
          Give a field a default by assigning a value: `express: bool = False`. Two rules apply:

          1. **Fields without defaults come first.** The generated `__init__` is an ordinary function, and a
             required parameter cannot follow one with a default.
          2. **No mutable defaults.** You met the [mutable default trap](concept:python.parameters) with
             functions: a default list is created once and shared by every call. Dataclasses refuse to
             repeat that mistake — a list, dict or set default raises an error when the class is defined:
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass

          @dataclass
          class Order:
              customer: str
              items: list[str] = []
        expectError: ValueError
        caption: "ValueError: mutable default <class 'list'> for field items is not allowed: use default_factory"
      - type: markdown
        body: |
          The fix is [`field(default_factory=list)`](glossary:default-factory). A *factory* is a function
          that makes a new object; `list` itself is such a function (`list()` returns a new empty list).
          The generated `__init__` calls the factory **every time** an instance is created without that
          argument:
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass, field

          @dataclass
          class Order:
              customer: str
              express: bool = False
              items: list[str] = field(default_factory=list)

          a = Order("Ada")
          b = Order("Sam", express=True)
          a.items.append("pen")
          print(a)
          print(b)
          print(a.items is b.items)
        expectedOutput: |
          Order(customer='Ada', express=False, items=['pen'])
          Order(customer='Sam', express=True, items=[])
          False
        annotations:
          - line: 7
            text: Pass the function list itself — no brackets. The dataclass calls it for each new Order.
          - line: 10
            text: Generated __init__ accepts keyword arguments too.
      - type: visualization
        component: python-tracer
        title: Every Order gets a new list
        caption: Each instance's items attribute points at a different list object, so appending to one leaves the other empty.
        props:
          code: |
            from dataclasses import dataclass, field

            @dataclass
            class Order:
                customer: str
                items: list[str] = field(default_factory=list)

            a = Order("Ada")
            b = Order("Sam")
            a.items.append("pen")
            print(a, b)

  - id: frozen
    title: Immutable dataclasses with frozen=True
    kind: concept
    blocks:
      - type: markdown
        body: |
          Some values should never change once created — an amount of money, a coordinate, a configuration.
          `@dataclass(frozen=True)` makes assigning to a field raise
          [`FrozenInstanceError`](glossary:frozen-dataclass). To get a modified version, create a **new**
          object with `dataclasses.replace()`.

          Frozen dataclasses (with the default `eq=True`) are also [hashable](glossary:hashable), so they can
          be dictionary keys and set members.
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass, replace

          @dataclass(frozen=True)
          class Money:
              amount: int
              currency: str

          price = Money(500, "INR")
          try:
              price.amount = 1
          except Exception as error:
              print(type(error).__name__, "-", error)

          discounted = replace(price, amount=450)
          print(price, discounted)
          budget = {Money(100, "INR"): "lunch"}
          print(budget[Money(100, "INR")])
        expectedOutput: |
          FrozenInstanceError - cannot assign to field 'amount'
          Money(amount=500, currency='INR') Money(amount=450, currency='INR')
          lunch
        annotations:
          - line: 10
            text: Assignment is refused.
          - line: 14
            text: replace() copies the fields, changing only the ones you name.
          - line: 16
            text: An equal Money object finds the same dictionary entry.
      - type: callout
        variant: warning
        title: Frozen is shallow
        body: |
          `frozen=True` stops you rebinding a field; it does not freeze the object a field refers to. A
          frozen dataclass holding a list can still have that list mutated (`team.members.append("Sam")`
          works), and it is no longer hashable, because lists aren't. For truly immutable data, use
          immutable field types such as `tuple[str, ...]` and `frozenset`.
      - type: markdown
        body: |
          **Why are normal dataclasses unhashable?** Dict keys must keep the same hash for their whole life.
          A mutable object whose fields can change would change its hash, so with `eq=True` and no
          `frozen=True`, the dataclass sets `__hash__` to `None` on purpose. Using one as a key raises
          `TypeError: cannot use 'Point' as a dict key (unhashable type: 'Point')`.

  - id: ordering
    title: Sorting with order=True
    kind: concept
    blocks:
      - type: markdown
        body: |
          By default dataclasses support `==` but not `<`. `@dataclass(order=True)` generates `<`, `<=`, `>`
          and `>=`, which compare the fields **as a tuple, in definition order**: the first field decides,
          and the next field only breaks ties. That makes `sorted()`, `min()` and `max()` work.
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass

          @dataclass(order=True, frozen=True)
          class Version:
              major: int
              minor: int
              patch: int = 0

          releases = [Version(1, 10), Version(1, 2, 5), Version(0, 9, 9)]
          print(sorted(releases))
          print(Version(1, 2) < Version(1, 10), max(releases))
        expectedOutput: |
          [Version(major=0, minor=9, patch=9), Version(major=1, minor=2, patch=5), Version(major=1, minor=10, patch=0)]
          True Version(major=1, minor=10, patch=0)
        annotations:
          - line: 11
            text: "(1, 2, 0) < (1, 10, 0) because 2 < 10 — unlike the strings '1.2' and '1.10', which sort the other way."
      - type: callout
        variant: tip
        title: Field order is now part of the meaning
        body: |
          With `order=True`, reordering fields changes how objects sort. If a field should not take part in
          comparisons (say, a free-text note), declare it with `field(compare=False)`.

  - id: post-init
    title: Validating in __post_init__
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          The generated `__init__` just stores the arguments. To protect an
          [invariant](glossary:invariant), define [`__post_init__`](glossary:post-init): the generated
          `__init__` calls it **after** all fields are assigned. Use it to:

          1. **validate** — raise `ValueError` for impossible values;
          2. **normalise** — for example strip spaces from a name;
          3. **compute derived fields** — declared with `field(init=False)` so they are not `__init__`
             parameters.
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass, field

          @dataclass
          class Product:
              name: str
              price: float
              quantity: int = 0
              total: float = field(init=False)

              def __post_init__(self):
                  if self.price < 0:
                      raise ValueError(f"price cannot be negative: {self.price}")
                  if self.quantity < 0:
                      raise ValueError(f"quantity cannot be negative: {self.quantity}")
                  self.name = self.name.strip()
                  self.total = self.price * self.quantity

          print(Product("  pen ", 12.5, 4))
          try:
              Product("ink", -1.0)
          except ValueError as error:
              print("Rejected:", error)
        expectedOutput: |
          Product(name='pen', price=12.5, quantity=4, total=50.0)
          Rejected: price cannot be negative: -1.0
        annotations:
          - line: 8
            text: "init=False: not a parameter of __init__; __post_init__ fills it in."
          - line: 10
            text: Called automatically at the end of the generated __init__ — the name must be exactly __post_init__.
          - line: 15
            text: Normalising a field is allowed here, because the class is not frozen.
      - type: callout
        variant: production
        title: Validation only runs at creation
        body: |
          `__post_init__` runs once, inside `__init__`. A later `product.price = -5` is not checked. For
          values that must stay valid, combine validation with `frozen=True` — then creation is the only way
          to set fields, so the check covers the object's whole life.

  - id: enums
    title: "Enums: a fixed set of named values"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Order status, card suits, log levels, traffic lights: many values come from a **small, fixed set
          of options**. Storing them as plain strings invites silent bugs — `status == "shiped"` is simply
          False forever, and nothing tells you about the typo.

          An [Enum](glossary:enum) (enumeration) is a class whose attributes are the only allowed values.
          Each **member** has a `.name` (the identifier) and a `.value` (whatever you assigned):
      - type: code
        runnable: true
        code: |
          from enum import Enum

          class Status(Enum):
              PENDING = "pending"
              PAID = "paid"
              SHIPPED = "shipped"

          s = Status.PAID
          print(s, s.name, s.value)
          print(Status("shipped"), Status["PENDING"])
          print(s is Status.PAID, s == "paid")
          print([member.name for member in Status])
        expectedOutput: |
          Status.PAID PAID paid
          Status.SHIPPED Status.PENDING
          True False
          ['PENDING', 'PAID', 'SHIPPED']
        annotations:
          - line: 4
            text: Member names are UPPER_CASE by convention, because they are constants.
          - line: 10
            text: "Status(value) looks a member up by value; Status[name] by name."
          - line: 11
            text: Each member is a single object, so `is` works. A member is NOT equal to its value.
          - line: 12
            text: Iterating an Enum gives its members in definition order.
      - type: markdown
        body: |
          **Why this is safer than strings:**

          - A typo is an error immediately: `Status.SHIPED` raises `AttributeError` (and your editor
            autocompletes the real names).
          - Converting outside data is validation for free: `Status("refunded")` raises
            `ValueError: 'refunded' is not a valid Status`.
          - A hint like `status: Status` tells readers and type checkers exactly which values are allowed.

          When the values don't matter, `auto()` numbers them for you. Enum members are hashable and
          immutable, so they make safe dataclass defaults:
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass
          from enum import Enum, auto

          class Size(Enum):
              SMALL = auto()
              MEDIUM = auto()
              LARGE = auto()

          @dataclass
          class Coffee:
              size: Size = Size.MEDIUM
              extra_shot: bool = False

          print(Coffee(), Size.LARGE.value)
          print(Coffee(Size.LARGE).size.name)
        expectedOutput: |
          Coffee(size=<Size.MEDIUM: 2>, extra_shot=False) 3
          LARGE
        annotations:
          - line: 14
            text: "Inside a dataclass repr, members show in their repr form: <Size.MEDIUM: 2>."
      - type: item
        ref: predict-enum-compare

  - id: choosing
    title: Dataclass, plain class, dict or enum?
    kind: application
    blocks:
      - type: markdown
        body: |
          A dataclass is not automatically better than a dictionary. Compare them on a user record:
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass, asdict
          import json

          @dataclass(slots=True)
          class User:
              name: str
              age: int

          try:
              User("Ada")
          except TypeError as error:
              print("TypeError:", error)

          user = User("Ada", 36)
          try:
              user.nmae = "Grace"
          except AttributeError as error:
              print("AttributeError:", error)

          print(json.dumps(asdict(user)))
          data = json.loads('{"name": "Sam", "age": 29}')
          print(User(**data))
        expectedOutput: |
          TypeError: User.__init__() missing 1 required positional argument: 'age'
          AttributeError: 'User' object has no attribute 'nmae' and no __dict__ for setting new attributes
          {"name": "Ada", "age": 36}
          User(name='Sam', age=29)
        annotations:
          - line: 4
            text: "slots=True gives the class a fixed set of attribute slots, so unknown names are rejected."
          - line: 10
            text: A required field cannot be forgotten. A dict happily lacks any key.
          - line: 16
            text: "A typo on assignment fails. With a dict, record['nmae'] = ... silently adds a new key."
          - line: 20
            text: asdict() converts to a dict, ready for JSON.
          - line: 22
            text: "User(**data) passes each key of the dict as a keyword argument."
      - type: markdown
        body: |
          | You need | Choose | Why |
          |---|---|---|
          | A record with a known set of named fields, made by your code | `@dataclass` | Fields documented in one place, generated `__init__`/`__repr__`/`__eq__`, type-checkable |
          | The same, but it must never change or must be a dict key | `@dataclass(frozen=True)` | Immutable and hashable |
          | Rich behaviour, a complex invariant or unusual construction | A plain class (often still a dataclass underneath) | Full control over `__init__` and state changes |
          | Arbitrary or dynamic keys, or JSON just passing through | `dict` (a `TypedDict` can describe its shape) | Flexible, no class needed |
          | One value out of a small fixed set of options | `Enum` | Typos fail loudly; invalid inputs are rejected |

          A common pattern at program boundaries: parse JSON into a `dict`, convert it to a dataclass (with
          `Enum` fields) as soon as it enters your code, work with the dataclass, and convert back with
          `asdict()` when sending it out.
      - type: item
        ref: choose-structure

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `ValueError: mutable default <class 'list'> for field items is not allowed: use default_factory` | `items: list = []` | `items: list[str] = field(default_factory=list)` |
          | `TypeError: non-default argument 'b' follows default argument 'a'` | A field without a default after one with a default | Move required fields first (or use `kw_only=True`) |
          | `TypeError: Point.__init__() takes 2 positional arguments but 3 were given` | A "field" without a type annotation (`y = 0`) is just a class attribute | Annotate it: `y: int = 0` |
          | `TypeError: 'list' object is not callable` when creating an instance | `field(default_factory=[])` or `default_factory=list()` | Pass the function itself: `default_factory=list` |
          | Validation never runs | `__post_init__` misspelled (`post_init`, `__postinit__`) | Use exactly `__post_init__` |
          | `FrozenInstanceError: cannot assign to field 'x'` | Assigning to a frozen dataclass | `replace(obj, x=new_value)` |
          | `TypeError: cannot use 'Point' as a dict key (unhashable type: 'Point')` | Normal dataclasses are unhashable | `@dataclass(frozen=True)` |
          | `TypeError: '<' not supported between instances of 'Version' and 'Version'` | No ordering methods | `@dataclass(order=True)` |
          | `if status == "paid":` is never true | Comparing an Enum member with a string | Compare members: `status is Status.PAID` (or `status.value == "paid"`) |
          | `ValueError: 'PAID' is not a valid Status` | `Status("PAID")` looks up by **value** | Use `Status["PAID"]` to look up by name |
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass

          @dataclass
          class Ticket:
              price: float = 10.0
              seat: str
        expectError: TypeError
        caption: "The generated __init__(self, price=10.0, seat) would be invalid Python, so the class definition fails."
      - type: code
        runnable: true
        code: |
          from dataclasses import dataclass

          @dataclass
          class Point:
              x: int
              y = 0

          print(Point(1))
          print(Point(1, 2))
        expectError: TypeError
        caption: Point(1) works and prints Point(x=1) — y is not a field at all — then Point(1, 2) fails.

  - id: practice
    title: Practice
    kind: practice
    blocks:
