cheatsheet: |
  ```python
  from dataclasses import dataclass, field, replace, asdict
  from enum import Enum, auto

  class Status(Enum):
      PENDING = "pending"
      PAID = "paid"

  @dataclass(order=True)                 # also: frozen=True, slots=True, kw_only=True
  class Order:
      number: int                        # required fields first
      status: Status = Status.PENDING    # immutable default: fine
      items: list[str] = field(default_factory=list)   # NEVER = []
      total: float = field(init=False, default=0.0)

      def __post_init__(self):           # runs after the generated __init__
          if self.number <= 0:
              raise ValueError("bad number")

  replace(obj, status=Status.PAID)       # copy with changes (frozen-friendly)
  asdict(obj)                            # -> dict, e.g. for JSON
  Status("paid"), Status["PAID"]         # by value, by name
  ```
  - Unannotated names are not fields · eq without frozen → unhashable · frozen is shallow
  - `Status.PAID == "paid"` is False — compare members
