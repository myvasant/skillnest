  - id: m-mcq-unhashable
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      This line fails with `TypeError: cannot use 'Point' as a dict key (unhashable type: 'Point')`:

      ```python
      @dataclass
      class Point:
          x: int
          y: int

      names = {Point(0, 0): "origin"}
      ```

      What is the best fix?
    explanation: >-
      With eq=True and frozen=False, a dataclass sets __hash__ to None, because a mutable object's hash could
      change while it is a key. Making it frozen gives it a field-based hash and guarantees it never changes.
    options:
      - id: a
        text: "Use @dataclass(frozen=True), so the point is immutable and gets a hash."
        correct: true
        feedback: Frozen dataclasses with eq are hashable — and safe to use as keys.
      - id: b
        text: Use the tuple (0, 0) as the key and convert back to a Point when needed.
        feedback: That works but throws away the Point type. Making Point frozen solves the real problem.
      - id: c
        text: "Use @dataclass(eq=False)."
        feedback: Then Point(0, 0) == Point(0, 0) is False and lookups with a new, equal point fail.
      - id: d
        text: Add order=True.
        feedback: Ordering adds < and >; it has nothing to do with hashing.

  - id: m-tf-frozen-shallow
    type: true-false
    skill: recognition
    prompt: "True or false: in a `@dataclass(frozen=True)` with a field `members: list[str]`, calling `team.members.append(\"Sam\")` raises FrozenInstanceError."
    answer: false
    explanation: >-
      Frozen only blocks rebinding fields (team.members = [...]). append mutates the list object the field
      refers to, which frozen does not protect. Use a tuple for an immutable collection.

  - id: m-mcq-enum-lookup
    type: mcq
    skill: debugging
    prompt: |
      A CSV file contains the column value `PAID` (the member's name), and this line fails with
      `ValueError: 'PAID' is not a valid Status`:

      ```python
      status = Status(row["status"])      # Status.PAID has the value "paid"
      ```

      How should you look the member up?
    explanation: >-
      Calling the Enum, Status(x), looks up by value; indexing it, Status[x], looks up by name. The file holds
      names, so use Status[row["status"]] (which raises KeyError for unknown names).
    options:
      - id: a
        text: 'Status[row["status"]], which looks up by name.'
        correct: true
        feedback: Square brackets find a member by its name.
      - id: b
        text: 'Status(row["status"].lower()), which turns the name into the value.'
        feedback: That only works while every value happens to be the lower-case name. Look up by name directly.
      - id: c
        text: 'Compare the text with each member: if row["status"] == Status.PAID ...'
        feedback: A member never equals a plain string, so that comparison is always False.
      - id: d
        text: Change the Enum to use auto() values.
        feedback: The values would then be numbers, and Status("PAID") would still fail.

  - id: m-code-money
    type: code
    skill: implementation
    difficulty: 3
    prompt: |
      Write a **frozen** dataclass `Money` with fields `amount: int` (in paise or cents) and
      `currency: str`:

      - `__post_init__` raises `ValueError` if amount is negative;
      - `add(other)` returns a **new** Money with the amounts summed, and raises `ValueError` if the
        currencies differ.

      The program should print `Money(amount=650, currency='INR') Money(amount=500, currency='INR')`.
    starterCode: |
      from dataclasses import dataclass


      # Write the Money dataclass here.


      a = Money(500, "INR")
      b = a.add(Money(150, "INR"))
      print(b, a)
    solution: |
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Money:
          amount: int
          currency: str

          def __post_init__(self):
              if self.amount < 0:
                  raise ValueError("amount cannot be negative")

          def add(self, other):
              if other.currency != self.currency:
                  raise ValueError(f"cannot add {other.currency} to {self.currency}")
              return Money(self.amount + other.amount, self.currency)


      a = Money(500, "INR")
      b = a.add(Money(150, "INR"))
      print(b, a)
    expectedOutput: |
      Money(amount=650, currency='INR') Money(amount=500, currency='INR')
    tests:
      - name: Money is a frozen dataclass
        code: |
          import dataclasses
          assert dataclasses.is_dataclass(Money), "Money should be a @dataclass."
          m = Money(1, "USD")
          try:
              m.amount = 2
          except dataclasses.FrozenInstanceError:
              pass
          else:
              raise AssertionError("Assigning to a field should fail. Use @dataclass(frozen=True).")
          assert len({Money(1, "USD"), Money(1, "USD")}) == 1, "Equal Money values should be hashable and equal."
      - name: add returns a new object
        code: |
          x = Money(100, "EUR")
          y = x.add(Money(25, "EUR"))
          assert y == Money(125, "EUR"), f"Money(100, 'EUR').add(Money(25, 'EUR')) should be Money(125, 'EUR'), got {y!r}."
