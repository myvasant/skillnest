id: python.testing
concept: python.testing
title: Testing with pytest
subtitle: Automated checks that your code does what you think
estimatedMinutes: 60
reviewedOn: 2026-10-22
summary: >-
  An automated test calls your code with known inputs and checks the result, every time you change
  anything. Write test functions with plain assert (they run right here in the browser), choose the
  cases that catch real bugs, learn what pytest adds — discovery, detailed failure reports, fixtures,
  pytest.raises and parametrize — and how to run it on your own machine.
objectives:
  - Explain why automated tests matter and structure a test with arrange-act-assert.
  - Write test functions with plain assert that cover typical, boundary and error cases.
  - Write tests that pass for a correct implementation and fail for buggy ones, and recognise tests that can never fail.
  - Explain what pytest adds — test discovery, assertion rewriting, fixtures, pytest.raises and parametrize — and run it locally.
  - Describe the red-green-refactor cycle of test-driven development.
