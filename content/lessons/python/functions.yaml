cheatsheet: |
  ```python
  def area(width, height):          # parameters: width, height
      """Return the area of a rectangle."""   # docstring
      return width * height         # ends the call, sends the value back

  a = area(3, 4)                    # arguments: 3, 4  -> a is 12
  x = print("hi")                   # print displays, returns None
  def f(): pass                     # no return -> f() is None

  def min_max(xs):
      return min(xs), max(xs)       # one tuple
  low, high = min_max([4, 1, 9])    # unpack it
  ```
  - Define before you call · `f` is the function, `f()` calls it
  - Each call: new frame on the call stack; locals vanish on return
  - Mutating a list parameter changes the caller's list; rebinding the parameter does not
