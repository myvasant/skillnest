  - id: order-total
    type: code
    skill: design
    difficulty: 2
    prompt: |
      Split a calculation into two functions:

      1. `line_total(price, quantity)` returns the cost of one order line.
      2. `order_total(lines)` takes a list of `(price, quantity)` tuples and returns the total of the
         whole order. It must **call `line_total`** for each line instead of repeating the
         multiplication.

      Finally print `order_total([(45, 3), (12, 2), (100, 1)])`, which is `259`.
    starterCode: |
      def line_total(price, quantity):
          # Return the cost of one line of the order.
          pass

      def order_total(lines):
          # Return the sum of line_total(...) for every (price, quantity) tuple.
          pass

      print(order_total([(45, 3), (12, 2), (100, 1)]))
    solution: |
      def line_total(price, quantity):
          return price * quantity

      def order_total(lines):
          total = 0
          for price, quantity in lines:
              total += line_total(price, quantity)
          return total

      print(order_total([(45, 3), (12, 2), (100, 1)]))
    expectedOutput: |
      259
    tests:
      - name: line_total returns price times quantity
        code: |
          for args, expected in [((45, 3), 135), ((12, 2), 24), ((0, 5), 0)]:
              r = line_total(*args)
              assert r == expected, f"line_total{args} returned {r!r}; it should return {expected}."
      - name: order_total adds up every line
        code: |
          cases = [([(45, 3), (12, 2), (100, 1)], 259), ([], 0), ([(10, 10)], 100), ([(5, 1), (5, 1)], 10)]
          for lines, expected in cases:
              r = order_total(lines)
              assert r == expected, f"order_total({lines}) returned {r!r}; it should return {expected}."
      - name: order_total reuses line_total
        code: |
          import ast
          funcs = {n.name: n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef)}
          assert "order_total" in funcs, "Define a function named order_total."
          called = {c.func.id for c in ast.walk(funcs["order_total"]) if isinstance(c, ast.Call) and isinstance(c.func, ast.Name)}
          assert "line_total" in called, "Inside order_total, call line_total(price, quantity) for each line instead of multiplying again."
      - name: prints 259
        code: |
          assert output().strip() == "259", f"Print the order total. Your program printed {output()!r}."
    hints:
      - "`for price, quantity in lines:` unpacks each tuple into two names."
      - Inside the loop, add `line_total(price, quantity)` to a running total.
      - Both functions must end with a return statement; return the total after the loop.
    feedback:
      - when: { outputContains: "None" }
        message: One of your functions returns None. Check that both line_total and order_total end with a return statement.
    explanation: >-
      order_total delegates the per-line arithmetic to line_total. If the rule for one line changes (a
      discount, tax), only line_total changes. Each call to line_total gets its own frame on top of
      order_total's frame and returns a value that order_total adds to its running total.

  - id: parsons-clamp
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to define `clamp(value, low, high)`, which returns `value` limited to the range
      low..high using early returns, and then prints three results. One line is a distractor.
    solution: |
      def clamp(value, low, high):
          if value < low:
              return low
          if value > high:
              return high
          return value
      print(clamp(15, 0, 10), clamp(-3, 0, 10), clamp(4, 0, 10))
    distractors:
      - "    print(value)"
    expectedOutput: |
      10 0 4
    explanation: >-
      Each guard clause returns as soon as it knows the answer; only values inside the range reach the
      final `return value`. Printing value instead of returning it would make clamp return None.

  - id: explain-return-print
    type: explain
    skill: explanation
    prompt: >-
      A classmate wrote `def add(a, b): print(a + b)` and says "it works - it shows the right answer".
      Explain why `total = add(2, 3) * 10` will fail, and how to fix the function.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says that print only displays the value and does not send it back to the caller.
      - Says that a function without a return statement returns None, so add(2, 3) evaluates to None.
      - Explains that None * 10 raises a TypeError.
      - Gives the fix - `return a + b` - and says printing should happen in the calling code if needed.
    modelAnswer: |
      print(a + b) shows 5 on the screen, but the function never returns anything, so the call add(2, 3)
      evaluates to None. Then None * 10 is attempted, which raises TypeError: unsupported operand
      type(s) for *: 'NoneType' and 'int'. The fix is to write `return a + b`. Then add(2, 3) evaluates
      to 5, total becomes 50, and the caller can print it if it wants to.

