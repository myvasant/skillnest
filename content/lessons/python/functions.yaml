  - id: m-mcq-call-steps
    type: mcq
    skill: explanation
    difficulty: 2
    prompt: "Which sequence correctly describes what Python does for `y = area(3, 4)`?"
    explanation: >-
      Arguments are evaluated, a new frame is created, parameters are bound to the argument objects, the
      body runs until return, the frame is discarded and finally the assignment binds y to the returned
      object.
    options:
      - id: a
        text: Evaluate 3 and 4, create a new frame, bind width and height in it, run the body until return, discard the frame, bind y to the returned value.
        correct: true
        feedback: Correct - and the right-hand side (the call) is fully evaluated before y is bound.
      - id: b
        text: Bind y to the function, then run the body later when y is printed.
        feedback: The call runs immediately. Assignment evaluates the right-hand side (the whole call) first, then binds y to its result.
      - id: c
        text: The body already ran when def executed; the call just looks up the stored result.
        feedback: Defining a function never runs its body. Each call runs the body again with the new arguments.
      - id: d
        text: Copy the caller's variables into the function so it can use them, run the body, then copy them back.
        feedback: Nothing is copied. Parameters are new names bound to the argument objects in a fresh frame.

