          assert r is not None, "count_vowels returned None. End the function with `return count` instead of printing the count."
          assert r == 3, f"count_vowels('idea') returned {r!r}; it should return 3."
      - name: correct for many inputs
        code: |
          cases = {"Hello World": 3, "": 0, "rhythm": 0, "AEIOU": 5, "Banana": 3, "Python 3.14": 1}
          for text, expected in cases.items():
