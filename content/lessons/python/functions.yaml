    skill: implementation
    prompt: |
      Write a function `count_vowels(text)` that **returns** how many vowels (a, e, i, o, u - upper
      or lower case) are in `text`. Then print `count_vowels("Hello World")`, which should be `3`.
    starterCode: |
      def count_vowels(text):
