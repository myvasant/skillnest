sections:
  - id: why
    title: Why functions?
    kind: why
    blocks:
      - type: markdown
        body: |
          You have already **used** functions: `print()`, `len()`, `input()`, `int()`, `sorted()`. Each
          one hides a chunk of work behind a short name. Now you will write your own.

          Here is the problem they solve. This program works out two class averages. The same four
          lines appear twice, with only the list changed:
      - type: code
        runnable: true
        code: |
          maths = [72, 84, 90]
          total = 0
          for score in maths:
              total += score
          print("Maths average:", total / len(maths))

          science = [64, 70, 88]
          total = 0
          for score in science:
              total += score
          print("Science average:", total / len(science))
        expectedOutput: |
          Maths average: 82.0
          Science average: 74.0
        caption: Copy-paste programming. A third subject means a third copy; a bug means fixing every copy.
      - type: markdown
        body: |
          A [function](glossary:function) lets you write the steps **once**, give them a name, and run
          them whenever you need them:
      - type: code
        runnable: true
        code: |
          def average(numbers):
              total = 0
              for n in numbers:
                  total += n
              return total / len(numbers)

          print("Maths average:", average([72, 84, 90]))
          print("Science average:", average([64, 70, 88]))
          print("Art average:", average([95, 80]))
        expectedOutput: |
          Maths average: 82.0
          Science average: 74.0
          Art average: 87.5
        annotations:
          - line: 1
            text: "`def` defines a function called `average` that expects one value, named `numbers`."
          - line: 5
            text: "`return` sends the result back to whoever called the function."
          - line: 7
            text: Each `average(...)` is a call. The list in the parentheses becomes `numbers` for that call.
      - type: markdown
        body: |
          Functions give you three things:

          1. **Reuse.** Write the logic once, call it many times. Fix a bug in one place.
          2. **Naming.** `average(scores)` says *what* happens; the reader doesn't need to read *how*.
             A good function name is a small piece of documentation.
          3. **Decomposition.** Big problems become small, separate problems: one function reads the
             data, one checks it, one calculates, one prints the report. Each piece can be understood,
             tested and fixed on its own.

  - id: define-and-call
    title: Defining a function vs calling it
    kind: concept
    blocks:
      - type: markdown
        body: |
          A function definition has this shape:

          ```text
          def name(parameters):
              body (indented)
          ```

          - `def` is a [keyword](glossary:keyword) that starts the definition.
          - The **name** follows the same rules as variable names (`snake_case`, by convention a verb:
            `calculate_total`, `send_email`).
          - The parentheses list the **parameters** (possibly none), then a colon.
          - The **body** is the indented block underneath. It ends where the indentation ends.

          The most important rule: **defining a function does not run its body.** Running the `def`
          statement creates a function object and binds the name to it - just like assignment binds a
          name. The body runs only when you **call** the function by writing its name followed by
          parentheses.
      - type: code
        runnable: true
        code: |
          def say_hello():
              print("Hello!")

          print("Before any call")
          say_hello()
          say_hello()
          print("After two calls")
        expectedOutput: |
          Before any call
          Hello!
          Hello!
          After two calls
        annotations:
          - line: 1
            text: Python creates the function and binds the name `say_hello`. Nothing is printed yet.
          - line: 5
            text: A call. Python jumps into the body, prints Hello!, then comes back to the next line.
      - type: callout
        variant: misconception
        title: The parentheses are the call
        body: |
          `say_hello` on its own just **refers to** the function object - like mentioning a recipe's
          name without cooking it. `say_hello()` **calls** it. Forgetting the parentheses is a silent
          bug: nothing runs and no error appears.
      - type: item
        ref: predict-define-only

  - id: parameters
    title: Parameters and arguments
    kind: concept
    blocks:
      - type: markdown
        body: |
          Most functions need input. Two words describe the two ends of that hand-over:

          | Term | Where it appears | Example |
          |---|---|---|
          | [Parameter](glossary:parameter) | In the `def` line: a **name** the function uses for its input | `def greet(name, times):` |
          | [Argument](glossary:argument) | In the call: the **value** you pass in | `greet("Ada", 2)` |

          When you call a function, Python first evaluates every argument, then binds each parameter to
          the corresponding argument object, left to right - exactly as if it had run `name = "Ada"` and
          `times = 2` at the start of the body.
      - type: code
        runnable: true
        code: |
          def greet(name, times):
              for _ in range(times):
                  print("Hello,", name)

          greet("Ada", 2)
          greet("Gr" + "ace", 3 - 2)
        expectedOutput: |
          Hello, Ada
          Hello, Ada
          Hello, Grace
        annotations:
          - line: 2
            text: "`_` is a conventional name for a loop variable you don't use."
          - line: 6
            text: Arguments can be any expressions. They are evaluated first, so name is bound to "Grace" and times to 1.
      - type: markdown
        body: |
          The number of arguments must match the number of parameters, or Python raises a `TypeError`
          that names the missing or extra argument. Keyword arguments (`greet(name="Ada", times=2)`),
          default values and more are covered in [parameters in depth](concept:python.parameters).

  - id: return
    title: Returning values - and why print is not return
    kind: concept
    blocks:
      - type: markdown
        body: |
          `return expression` does two things:

          1. It **ends the function immediately**.
          2. It sends the value of the expression back to the caller. The call `area(3, 4)` is an
             [expression](glossary:expression), and its value is whatever the function returned - the
             [return value](glossary:return-value).

          `print()` does something completely different: it **displays** text for a human. The value is
          shown on the screen and then it is gone; the program cannot use it.
      - type: code
        runnable: true
        code: |
          def area_printed(width, height):
              print(width * height)

          def area(width, height):
              return width * height

          a = area_printed(3, 4)
          b = area(3, 4)
          print("a is", a)
          print("b is", b)
          print("twice b:", b * 2)
        expectedOutput: |
          12
          a is None
          b is 12
          twice b: 24
        annotations:
          - line: 7
            text: The call prints 12 as a side effect, but returns nothing useful - so a is None.
          - line: 8
            text: The call prints nothing; its value, 12, is bound to b.
          - line: 11
            text: Only a returned value can be stored and used in further calculations.
      - type: markdown
        body: |
          **Every function call returns something.** If a function finishes without reaching a `return`
          statement - or uses `return` with no value - it returns `None`, Python's special "no value"
          object.

          That includes `print` itself. `print()` *displays* its arguments and *returns* `None`:
      - type: code
        runnable: true
        code: |
          x = print("hi")
          print(x)
        expectedOutput: |
          hi
          None
        caption: The first line displays hi, then binds x to print's return value, which is None.
      - type: callout
        variant: misconception
        title: '"It printed the right number, so my function works"'
        body: |
          A function that prints its result looks fine when you try it by hand, but nothing else can use
          the result: you cannot add it, store it, compare it or test it. **Return values; print at the
          edges of the program** (usually in the code that calls your functions). Anything a function
          does besides returning a value - printing, changing a list it was given - is called a
          [side effect](glossary:side-effect).
      - type: item
        ref: predict-print-vs-return

  - id: call-stack
    title: "Mental model: every call gets its own frame"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          What actually happens when Python meets a call such as `square(3)`?

          1. **Evaluate the arguments** (here, the object `3`).
          2. **Create a new [frame](glossary:stack-frame)** - a private workspace that holds the
             function's local names.
          3. **Bind the parameters** in that frame to the argument objects (`n` → `3`).
          4. **Run the body** in that frame.
          5. **On `return`**, throw the frame away and continue in the caller, where the call expression
             now has the returned value.

          Frames pile up when functions call other functions. The pile is the
          [call stack](glossary:call-stack): the frame on top is the one running; each frame below it is
          paused, waiting for the call it made to come back. This is what makes decomposition work: a
          function can rely on helper functions without knowing how they work inside.
      - type: visualization
        component: python-tracer
        title: Frames appear on each call and vanish on return
        caption: >-
          Step through. Watch a new frame appear for sum_of_squares, then for each call to square. When
          square returns, its frame (with n and result) disappears, and the return value is used in the
          caller's expression.
        props:
          code: |
            def square(n):
                result = n * n
                return result

            def sum_of_squares(a, b):
                total = square(a) + square(b)
                return total

            answer = sum_of_squares(3, 4)
            print(answer)
      - type: markdown
        body: |
          Three things to notice:

          - The two calls to `square` each get a **fresh** frame. `n` is 3 in the first and 4 in the
            second; nothing is left over from the first call.
          - `result` and `n` exist only while `square` is running. When the frame is discarded, the
            *names* are gone - but the returned *object* lives on, because the caller now refers to it.
          - `sum_of_squares` would work even if `square` were defined *below* it in the file, as long as
            both `def` statements have run before the call on line 9. A function body only needs the names
            it uses to exist **when it runs**, not when it is defined.

          This model is not a simplification: CPython really does create a frame per call, and a
          [traceback](glossary:traceback) is a printout of the call stack at the moment of an error. The
          rules for which names a frame can see are the subject of [scope](concept:python.scope).

  - id: return-patterns
    title: Returning several values, and returning early
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          **Several results.** A function returns exactly one object - but that object can be a
          [tuple](concept:python.tuples). `return smallest, largest` builds a tuple, and the caller can
          unpack it straight into two names:
      - type: code
        runnable: true
        code: |
          def min_max(numbers):
              smallest = numbers[0]
              largest = numbers[0]
              for n in numbers:
                  if n < smallest:
                      smallest = n
                  if n > largest:
                      largest = n
              return smallest, largest

          low, high = min_max([4, 9, 1, 7])
          print(low, high)
          print(min_max([5]))
        expectedOutput: |
          1 9
          (5, 5)
        annotations:
          - line: 9
            text: The comma makes a tuple. This is one return value containing two objects.
          - line: 11
            text: Tuple unpacking binds low to 1 and high to 9.
      - type: markdown
        body: |
          **Early return.** Because `return` ends the function immediately, you can stop as soon as you
          know the answer - even from inside a loop. Unlike `break`, which only leaves the loop, `return`
          leaves the **whole function**.
      - type: code
        runnable: true
        code: |
          def first_negative(numbers):
              for n in numbers:
                  if n < 0:
                      return n
              return None

          print(first_negative([3, 8, -2, 5, -9]))
          print(first_negative([1, 2]))
        expectedOutput: |
          -2
          None
        annotations:
          - line: 4
            text: At -2 the function ends. -9 is never examined.
          - line: 5
            text: Reached only if the loop finishes without finding a negative. Writing it out makes "no answer" explicit.
      - type: markdown
        body: |
          Early returns also make checks read clearly. Each `if` handles one case and leaves; whatever
          reaches the end is the remaining case. These are often called **guard clauses**:
      - type: code
        runnable: true
        code: |
          def grade(score):
              if score < 0 or score > 100:
                  return "invalid"
              if score >= 90:
                  return "A"
              if score >= 75:
                  return "B"
              return "C"

          print(grade(95), grade(80), grade(40), grade(120))
        expectedOutput: |
          A B C invalid
        caption: No elif or else needed - each return ends the function, so later checks only run if earlier ones failed.
      - type: item
        ref: predict-early-return

  - id: docstrings
    title: Docstrings - documenting what a function does
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [docstring](glossary:docstring) is a string literal written as the **first statement** of a
          function body. Python stores it on the function, and tools such as `help()`, editors and
          documentation generators show it to anyone using your function.

          Convention ([PEP 257](https://peps.python.org/pep-0257/)): triple double quotes, a one-line
          summary written as a command ("Return…", "Convert…"), and - for bigger functions - a blank line
          followed by details about the parameters and the return value.
      - type: code
        runnable: true
        code: |
          def celsius_to_fahrenheit(celsius):
              """Convert a temperature from degrees Celsius to degrees Fahrenheit."""
              return celsius * 9 / 5 + 32

          def split_bill(total, people):
              """Return each person's whole-rupee share and the leftover tip.

              total and people must be positive integers.
              """
              return total // people, total % people

          print(celsius_to_fahrenheit(100))
          print(celsius_to_fahrenheit.__doc__)
          print(split_bill(1000, 3))
        expectedOutput: |
          212.0
          Convert a temperature from degrees Celsius to degrees Fahrenheit.
          (333, 1)
        annotations:
          - line: 13
            text: "`__doc__` holds the docstring. In a terminal, help(celsius_to_fahrenheit) displays it nicely."
      - type: callout
        variant: tip
        title: Docstring or comment?
        body: |
          A **docstring** tells a *caller* what the function does and how to use it - the contract. A
          **comment** inside the body explains *why* a particular line is written the way it is, for
          someone reading the implementation. A function with a clear name and a one-line docstring
          rarely needs many comments.

  - id: passing-lists
    title: Passing a list - the function sees the same object
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Binding a parameter works exactly like assignment: **no copy is made**. If you pass a list,
          the parameter and the caller's variable are two names for the **same list object**. So:

          - if the function **mutates** the list (`append`, `remove`, `scores[i] = …`), the caller sees
            the change - you saw why in [mutability](concept:python.mutability);
          - if the function **rebinds** the parameter (`basket = [...]`), only the function's local name
            moves; the caller's variable is unaffected.
      - type: visualization
        component: python-tracer
        title: One list, two names - then a rebinding
        caption: >-
          In add_item, basket and groceries point at the same list, so append changes what groceries
          sees. In replace, the assignment moves only the local basket label to a new list, which is
          discarded when the frame ends.
        props:
          code: |
            def add_item(basket, item):
                basket.append(item)

            def replace(basket):
                basket = ["new"]

            groceries = ["milk"]
            add_item(groceries, "eggs")
            replace(groceries)
            print(groceries)
      - type: callout
        variant: production
        title: Make side effects obvious
        body: |
          Changing a caller's list is sometimes exactly what you want (`list.sort()` does it), but it
          surprises readers when it is hidden. Choose one style per function and say so in the docstring:

          - **mutate and return `None`** - like `list.sort()`, `list.append()`; or
          - **leave the input alone and return a new object** - like `sorted()`.

          Doing both (changing the input *and* returning it) makes it easy for callers to miss the
          change. The full story of how arguments are passed is in
          [parameters in depth](concept:python.parameters).
      - type: item
        ref: predict-mutate

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **`def` is an executable statement.** When Python compiles your file, each function body is
          turned into a *code object* (bytecode). When the `def` statement then **runs**, Python builds a
          *function object* from that code object - together with a reference to the module's global
          namespace and any default values - and binds the name to it. That is why calling a function
          above its `def` line raises `NameError`, and why a second `def` with the same name silently
          replaces the first.

          **Functions are objects.** You can look at their attributes, give them a second name, and (as
          you will see in [higher-order functions](concept:python.higher-order-functions)) pass them to
          other functions.
      - type: code
        runnable: true
        code: |
          def square(n):
              result = n * n
              return result

          print(type(square))
          print(square.__name__)
          print(square.__code__.co_varnames)

          also_square = square
          print(also_square(5))
        expectedOutput: |
          <class 'function'>
          square
          ('n', 'result')
          25
        annotations:
          - line: 7
            text: The compiler already knows the function's local names - parameters first.
          - line: 9
            text: A second name for the same function object. Calling it runs the same code.
      - type: markdown
        body: |
          **Frames in CPython.** Each call needs somewhere to keep its local variables, the position of
          the instruction it is executing and a link back to the caller. Since CPython 3.11 this lives in a
          compact per-thread stack of internal frames; a full Python *frame object* is created only when
          something asks for one - a traceback, a debugger or the tracer used in this lesson. The
          behaviour you can observe is the same as the simple model above.

          **Depth is limited.** Each pending call keeps its frame alive, so a function that keeps calling
          itself without stopping would grow the stack forever. CPython stops it with `RecursionError`
          once the depth passes a limit (`sys.getrecursionlimit()`, 1000 by default). Functions that call
          themselves on purpose are the topic of [recursion](concept:cs.recursion).

          **Cost.** A call does a little work (creating the frame, binding arguments), but it is cheap.
          Split code into functions for clarity first; measure before worrying about call overhead
          ([profiling](concept:python.profiling)).

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | Nothing happens; no output, no error | The function is defined but never called, or called without `()` | Add a call with parentheses: `report()`. |
          | `TypeError: greet() missing 1 required positional argument: 'times'` | Fewer arguments than parameters | Pass a value for every parameter (or give it a default - see the next lesson). |
          | `TypeError: greet() takes 1 positional argument but 2 were given` | More arguments than parameters | Check the `def` line; remove the extra argument or add a parameter. |
          | `TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'` | You used the result of a function that **prints** instead of **returns** | Replace `print(value)` with `return value` inside the function. |
          | Function returns after the first loop iteration | `return` is indented inside the loop | Dedent `return` so it runs after the loop. |
          | `NameError: name 'result' is not defined` after calling a function | `result` is a local name; it disappears when the call ends | Return it and store it: `result = compute()`. |
          | `NameError` for the function's own name | The call runs before the `def` statement | Define functions near the top, call them afterwards. |
          | `SyntaxError: 'return' outside function` | `return` used at the top level of the program | Only use `return` inside a function body. |
      - type: code
        runnable: true
        code: |
          def to_minutes(hours):
              print(hours * 60)

          total = to_minutes(2) + 30
        expectError: TypeError
        expectedOutput: |
          120
        caption: >-
          "It printed 120, so why the crash?" Read the last line of the error. to_minutes displayed 120
          but returned None, and None + 30 is impossible.
      - type: code
        runnable: true
        code: |
          def greet(name, greeting):
              return greeting + ", " + name

          print(greet("Ada"))
        expectError: TypeError
        caption: The message names the missing parameter - 'greeting'.
      - type: item
        ref: debug-return-in-loop

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          Each exercise asks for a function that **returns** its answer. The checks call your function
          with several different inputs, so make it work in general, not just for the example.
      - type: item
        ref: count-vowels
      - type: item
        ref: order-total
      - type: item
        ref: parsons-clamp
      - type: item
        ref: explain-return-print

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `def name(parameters):` **creates** a function object and binds the name; the body runs only
            when you **call** it with `name(arguments)`.
          - **Parameters** are names in the definition; **arguments** are values in the call. Calling binds
            each parameter to its argument object - no copy is made.
          - `return value` ends the call and hands the value back. No `return` (or bare `return`) →
            the call returns `None`. `print()` displays; it does not return your value (it returns `None`).
          - `return a, b` returns one tuple; unpack it with `x, y = f()`.
          - Each call gets a fresh **frame** on the **call stack**; its local names vanish when it returns.
          - Mutating a list parameter changes the caller's list; rebinding the parameter does not.
          - Give functions verb names and a one-line docstring.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What is the difference between `print` and `return`?" and "What does a function return if it
          has no return statement?" are classic screening questions. Show `x = print("hi")` giving
          `None`, explain that returned values can be composed (`area(2, 3) + area(4, 5)`) while printed
          ones cannot, and mention that each call runs in its own frame on the call stack.

items:
  - id: predict-define-only
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      def shout():
          print("HEY")

      print("start")
      shout
      print("end")
    answer: |
      start
      end
    explanation: >-
      The def statement only creates the function. Line 5 mentions the function object without calling it
      (no parentheses), so its body never runs. Only the two top-level print calls produce output.
    wrongAnswers:
      - answer: |
          start
          HEY
          end
        feedback: >-
          `shout` without parentheses only refers to the function - it does not call it. You need
          `shout()` to run the body.
      - answer: |
          HEY
          start
          end
        feedback: >-
          Defining a function does not run it. The body of shout would only run when the function is
          called, and here it never is.

  - id: predict-print-vs-return
    type: predict-output
    skill: prediction
    prompt: What does this program print? (Think about what each call returns.)
    code: |
      def double_print(n):
          print(n * 2)

      def double_return(n):
          return n * 2

      a = double_print(5)
      b = double_return(5)
      print(a, b)
    answer: |
      10
      None 10
    explanation: >-
      Calling double_print(5) displays 10, but the function has no return statement, so it returns None
      and a is bound to None. double_return(5) prints nothing and returns 10. The last line prints both.
    wrongAnswers:
      - answer: |
          10
          10 10
        feedback: >-
          double_print displays 10 but never returns it. A function without a return statement returns
          None, so a is None.
      - answer: None 10
        feedback: >-
          The print inside double_print runs when the function is called on line 7, so 10 appears first.
      - answer: |
          10
          10
          None 10
        feedback: double_return only returns its value; it does not print anything itself.

  - id: predict-early-return
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print? (Six lines.)
    code: |
      def check(n):
          for i in range(n):
              if i == 2:
                  return i * 10
              print(i)
          return -1

      print(check(5))
      print(check(2))
    answer: |
