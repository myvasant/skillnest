id: python.functions
concept: python.functions
title: Defining and Calling Functions
subtitle: Name a piece of work once, use it everywhere
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Learn to package steps behind a name with def, pass values in through parameters, and send results
  back with return. See exactly what happens on every call - a new frame on the call stack - and why
  returning a value is not the same as printing it.
objectives:
  - Explain why functions help with reuse, naming and breaking a problem into parts.
  - Distinguish defining a function from calling it, and parameters from arguments.
  - Write functions that return values (including several values as a tuple) instead of printing them.
  - Predict the output of programs with several function calls, early returns and None return values.
  - Describe the call stack, and predict what happens when a function receives a list and changes it.
sources:
