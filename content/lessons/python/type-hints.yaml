  - id: m-predict-annotated-var
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      total: float = 0
      total += 5
      name: str = "Ada"
      name = 42
      print(total, name, type(name).__name__)
    answer: "5 42 int"
    explanation: >-
      Annotations do not convert or check values. total refers to the int 0, then 5 (still an int, so it
      prints 5, not 5.0). name is rebound to the int 42 without complaint.
    wrongAnswers:
      - answer: "5.0 42 int"
        feedback: The float hint does not convert 0 into 0.0. The object is the int 0, and 0 + 5 is the int 5.
      - answer: "5 Ada str"
        feedback: "Python does not block `name = 42` because of the str hint — the rebinding happens. A type checker would report it."
      - answer: "5 42 str"
        feedback: type() reports the object's type, and the object is now the int 42. Hints don't change objects.

  - id: m-mcq-pick-hint
    type: mcq
    skill: design
    prompt: |
      A function receives data like `{"pen": [12.5, 11.0], "ink": [40.0]}` — product codes mapped to their
      past prices — and returns the cheapest price per product. Which signature describes it best?
    explanation: >-
      The input is a dict with str keys and list-of-float values; the output maps each str to one float.
      Precise hints let the checker verify both the callers and the body.
    options:
      - id: a
        text: "def cheapest(history: dict[str, list[float]]) -> dict[str, float]:"
        correct: true
        feedback: Exactly — the nested generic describes the shape of both the input and the output.
      - id: b
        text: "def cheapest(history: dict) -> dict:"
        feedback: Legal, but it hides the contents, so the checker cannot catch a list of strings or a misused value.
      - id: c
        text: "def cheapest(history: list[float]) -> float:"
        feedback: The input is a dict of lists, not one list, and the result has one price per product.
      - id: d
        text: "def cheapest(history: Any) -> Any:"
        feedback: Any switches checking off entirely. Use it only when the type truly cannot be described.

  - id: m-tf-isinstance-generic
    type: true-false
    skill: recognition
    prompt: "True or false: `isinstance(data, list[int])` checks that data is a list whose items are all ints."
    answer: false
    explanation: >-
      isinstance refuses parameterized generics: it raises TypeError ("isinstance() argument 2 cannot be a
      parameterized generic"). Check isinstance(data, list) and then the items, for example
      all(isinstance(x, int) for x in data).

  - id: m-mcq-checker-message
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      mypy reports `error: Incompatible return value type (got "str", expected "int")  [return-value]` for:

      ```python
      def parse_age(text: str) -> int:
          return text.strip()
      ```

      Callers do arithmetic with the result. What is the right fix?
    explanation: >-
      The checker found a real bug: strip() returns a str, but the contract (and the callers) expect an int.
      Fix the code so it honours the hint — convert with int(). Changing or silencing the hint would just
      move the crash to the callers.
    options:
      - id: a
        text: "Return int(text.strip())."
        correct: true
        feedback: The function now does what its name and hint promise.
      - id: b
        text: "Change the hint to -> str."
        feedback: That silences this error but breaks the contract; every caller doing arithmetic would now be reported (or crash).
      - id: c
        text: "Add # type: ignore to the return line."
        feedback: That hides the warning without fixing the bug — the callers would still receive a string.
      - id: d
        text: "Nothing — Python ignores hints, so the code is fine."
        feedback: "Python ignores the hint, but callers do not: age + 1 would raise TypeError at runtime."

  - id: m-code-first-word
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write two fully annotated functions:

      - `first_word(text: str) -> str | None` returns the first whitespace-separated word of `text`, or
        `None` if there are no words;
      - `shout(text: str) -> str` returns the first word in upper case followed by `!`, or `(silence)` when
        `first_word` returns None.

      The program should print `HELLO!` and then `(silence)`.
    starterCode: |
      # Write first_word and shout here.


      print(shout("hello there"))
      print(shout("   "))
    solution: |
      def first_word(text: str) -> str | None:
          words = text.split()
          if not words:
              return None
          return words[0]


      def shout(text: str) -> str:
          word = first_word(text)
          if word is None:
              return "(silence)"
          return word.upper() + "!"


      print(shout("hello there"))
      print(shout("   "))
    expectedOutput: |
      HELLO!
      (silence)
    tests:
      - name: first_word behaves correctly
        code: |
          assert first_word("  data science ") == "data", f"first_word('  data science ') should be 'data', got {first_word('  data science ')!r}."
          assert first_word("") is None, "first_word('') should return None."
      - name: shout uses first_word's result safely
        code: |
          assert shout("yes please") == "YES!", f"shout('yes please') should be 'YES!', got {shout('yes please')!r}."
          assert shout("") == "(silence)", "shout('') should be '(silence)'."
      - name: annotations are complete
        code: |
          import typing
          fw = typing.get_type_hints(first_word)
          sh = typing.get_type_hints(shout)
          assert fw.get("text") is str and fw.get("return") == (str | None), "first_word should be annotated (text: str) -> str | None."
          assert sh.get("text") is str and sh.get("return") is str, "shout should be annotated (text: str) -> str."
      - name: prints the two lines
        code: |
          assert output_lines() == ["HELLO!", "(silence)"], f"Your program printed {output()!r}."
    hints:
      - "`text.split()` with no argument splits on any whitespace and drops empty pieces."
      - "An empty list is falsy, so `if not words: return None` handles 'no words'."
      - In shout, store the result of first_word and check `is None` before calling .upper().
    feedback:
      - when: { errorMessageContains: "'NoneType' object has no attribute 'upper'" }
        message: shout called .upper() on None. Check whether first_word returned None first.
      - when: { errorType: IndexError }
        message: words[0] fails when there are no words. Return None before indexing an empty list.
    explanation: >-
      first_word's honest return hint str | None tells shout to handle the None case; shout checks it and
      only then uses string methods. A type checker would have rejected an unchecked word.upper().

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-annotated-var, m-mcq-pick-hint, m-tf-isinstance-generic, m-mcq-checker-message, m-code-first-word]

cheatsheet: |
  ```python
  def greet(name: str, punctuation: str = ".") -> str: ...
  def log(message: str) -> None: ...
  count: int = 0
  totals: dict[str, float] = {}          # annotate empty containers
  scores: list[int]; pair: tuple[int, int]; rest: tuple[str, ...]
  email: str | None                      # check `if email is None` before use

  from collections.abc import Callable
  from typing import Any, TypedDict
  handler: Callable[[int], str]          # function int -> str
  type Point = tuple[float, float]       # alias (3.12+)

  typing.get_type_hints(func)            # read hints like tools do
  ```
  - Python does **not** enforce hints at runtime — run mypy/pyright; validate external data explicitly
  - `isinstance(x, list[int])` → TypeError; use `isinstance(x, list)`
  - `x: int` alone does not create x
