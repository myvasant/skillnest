id: python.type-hints
concept: python.type-hints
title: Type Hints
subtitle: Saying what your code expects — for readers and tools
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  Annotate parameters, return values and variables with types such as list[int], dict[str, float] and
  str | None. Learn the single most important fact about hints — Python does not enforce them when the
  program runs — and how type checkers like mypy and pyright use them to find bugs before you run anything.
objectives:
  - Write annotations for parameters, defaults, return values (including None) and variables.
  - Use built-in generics such as list[int], dict[str, float] and tuple[float, float], and unions such as str | None.
  - Demonstrate that type hints are not enforced at runtime, and add explicit checks where runtime validation is needed.
  - Read a type checker's error message and decide how to fix the code.
  - Choose between Any, Callable, TypedDict and type aliases for common situations.
