id: python.csv-json
concept: python.csv-json
title: CSV and JSON Data
subtitle: Reading and writing the two everyday data-exchange formats
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Spreadsheets export CSV; web APIs and config files speak JSON. Learn to read and write both with the
  csv and json modules instead of fragile string splitting, how their values map to Python types, why
  CSV values are always strings, and how to handle invalid data safely — without ever using eval().
objectives:
  - Read CSV files with csv.reader and csv.DictReader, converting the string values to the types you need.
  - Write CSV files with csv.writer and csv.DictWriter, opening them with newline="".
  - Convert between JSON text and Python objects with json.dumps/loads (strings) and json.dump/load (files).
  - Predict how Python values map to JSON and back, including tuples, None, booleans and non-string keys.
  - Diagnose JSONDecodeError, "not JSON serializable" and DictWriter errors, and explain why eval() must never parse data.
sources:
  - title: csv — CSV File Reading and Writing
    url: https://docs.python.org/3/library/csv.html
    publisher: Python Software Foundation
  - title: json — JSON encoder and decoder
    url: https://docs.python.org/3/library/json.html
    publisher: Python Software Foundation
  - title: "The Python Tutorial: Saving structured data with json"
    url: https://docs.python.org/3/tutorial/inputoutput.html#saving-structured-data-with-json
    publisher: Python Software Foundation
  - title: "RFC 8259: The JavaScript Object Notation (JSON) Data Interchange Format"
    url: https://www.rfc-editor.org/rfc/rfc8259
    publisher: IETF
  - title: "RFC 4180: Common Format and MIME Type for CSV Files"
    url: https://www.rfc-editor.org/rfc/rfc4180
