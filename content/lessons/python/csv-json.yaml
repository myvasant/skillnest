  - id: under-the-hood
    title: Under the hood and in production
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **CSV has no single standard.** RFC 4180 describes the common form, but real files vary:
          semicolons as separators (common where the comma is the decimal mark), tabs, different quoting.
          The csv module calls these variations *dialects*: `csv.reader(f, delimiter=";")`, or
          `csv.Sniffer().sniff(sample)` to guess. Short rows get `None` for missing columns in
          `DictReader`; extra fields are collected in a list under the key `None`.
      - type: code
        runnable: true
        code: |
          import csv

          with open("ragged.csv", "w", encoding="utf-8", newline="") as f:
              f.write("a,b,c\n1,2\n1,2,3,4\n")

          with open("ragged.csv", encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f):
                  print(row)
        expectedOutput: |
          {'a': '1', 'b': '2', 'c': None}
          {'a': '1', 'b': '2', 'c': '3', None: ['4']}
        caption: Validate row lengths in production code instead of trusting every file.
      - type: markdown
        body: |
          **The Excel BOM.** "CSV UTF-8" files from Excel begin with a byte-order mark (the bytes
          `EF BB BF`). Decoded as plain UTF-8 it becomes an invisible `'\ufeff'` glued to the first header:
      - type: code
        runnable: true
        code: |
          import csv

          with open("from-excel.csv", "wb") as f:
              f.write("name,qty\r\nPens,3\r\n".encode("utf-8-sig"))   # simulate Excel's output

          with open("from-excel.csv", encoding="utf-8", newline="") as f:
              print(csv.DictReader(f).fieldnames)

          with open("from-excel.csv", encoding="utf-8-sig", newline="") as f:
              print(csv.DictReader(f).fieldnames)
        expectedOutput: |
          ['\ufeffname', 'qty']
          ['name', 'qty']
      - type: markdown
        body: |
          **JSON details worth knowing.**

          - Python's json module accepts and writes `NaN` and `Infinity` by default, although they are not
            valid JSON. Pass `allow_nan=False` to `dumps` to get a `ValueError` instead of emitting them.
          - Duplicate keys in an object are allowed by the parser; the **last** one wins.
          - Python ints are unlimited, but many JSON readers (JavaScript in particular) store every number
            as a 64-bit float, so integers above 2**53 lose precision there. APIs often send large IDs as
            strings for this reason.
          - `json.dumps(obj, default=func)` calls `func` for objects it cannot serialize — return something
            serializable (for example `str`), or raise `TypeError`. `json.loads(text, object_hook=func)`
            lets you transform each decoded object.
          - `separators=(",", ":")` removes the spaces for the most compact output.
      - type: code
        runnable: true
        code: |
          import json
          from datetime import date

          event = {"title": "Launch", "day": date(2026, 10, 22)}
          print(json.dumps(event, default=str))
          print(json.loads('{"id": 1, "id": 2}'))
          print(json.dumps([1, [2, 3]], separators=(",", ":")))
        expectedOutput: |
          {"title": "Launch", "day": "2026-10-22"}
          {'id': 2}
          [1,[2,3]]
        annotations:
          - line: 5
            text: default=str turns the date into its string form, '2026-10-22'.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - Use the `csv` and `json` modules, never `split(",")` or hand-built strings.
          - CSV: open with `encoding="utf-8", newline=""`. `csv.reader` → lists, `csv.DictReader` → dicts
            keyed by the header. **Every value is a string** — convert with `int()`/`float()`.
          - Write with `csv.writer(f).writerow(...)` or `csv.DictWriter(f, fieldnames=[...])` +
            `writeheader()` + `writerow(dict)`.
          - JSON ↔ Python: object↔dict, array↔list (tuples become lists), string↔str, numbers↔int/float,
            true/false↔True/False, null↔None. Object keys are always strings.
          - `dumps`/`loads` work with strings; `dump`/`load` with files. `indent=2` pretty-prints.
          - Catch `json.JSONDecodeError` (a `ValueError`) for bad input; convert sets, dates and other
            objects before dumping. **Never** `eval()` data.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "How would you load a JSON config safely, and what changes in a round trip?" — Use `json.load`
          with an explicit encoding, catch `JSONDecodeError` with a clear message, validate required keys;
          mention that tuples become lists and non-string keys become strings, and that `eval` is never
          acceptable because it executes code.

items:
  - id: predict-strings
    type: predict-output
    skill: prediction
    prompt: What does this program print? (Two lines.)
    code: |
      import csv

      with open("stock.csv", "w", encoding="utf-8", newline="") as f:
          f.write("item,qty\npens,3\npads,2\n")

      with open("stock.csv", encoding="utf-8", newline="") as f:
          rows = list(csv.DictReader(f))

      print(rows[0]["qty"] * 2)
      print(len(rows))
    answer: |
      33
      2
    explanation: >-
      CSV values are strings, so rows[0]["qty"] is '3' and '3' * 2 repeats it: '33'. DictReader consumes
      the header row to make the keys, so there are two data rows.
    wrongAnswers:
      - answer: |
          6
          2
        feedback: >-
          The csv module does not convert types. '3' is a string, and multiplying a string by 2 repeats it.
          Use int(row["qty"]) to get a number.
      - answer: |
          33
          3
        feedback: DictReader uses the first line as the header (the dict keys), so it is not counted as a row.
      - answer: |
          6
          3
        feedback: Two misconceptions — values are strings ('3' * 2 is '33'), and the header is not a data row.

  - id: newline-mcq
    type: mcq
    skill: recognition
    prompt: Why does the csv documentation tell you to open CSV files with `newline=""`?
    explanation: >-
      newline="" turns off text mode's newline translation so the csv module sees and writes line endings
      exactly. Otherwise Windows output gets an extra \r per row (blank rows in spreadsheets) and line
      breaks inside quoted fields can be altered when reading.
    options:
      - id: a
        text: It stops Python translating line endings, because the csv module handles them itself — including line breaks inside quoted fields.
        correct: true
        feedback: Right. The csv module needs to see the raw line endings to read and write them correctly.
      - id: b
        text: It removes all newlines from the file so the data fits on one line.
