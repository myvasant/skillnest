cheatsheet: |
  ```python
  import csv, json

  with open("in.csv", encoding="utf-8", newline="") as f:
      for row in csv.DictReader(f):          # dict per row, keys from header
          qty = int(row["qty"])              # values are ALWAYS strings
  with open("out.csv", "w", encoding="utf-8", newline="") as f:
      w = csv.DictWriter(f, fieldnames=["name", "qty"])
      w.writeheader()
      w.writerow({"name": "pen", "qty": 3})

  text = json.dumps(obj, indent=2)          # object -> str
  obj = json.loads(text)                    # str -> object
  json.dump(obj, f, indent=2)               # object -> file
  obj = json.load(f)                        # file -> object
  ```
  - JSON ↔ Python: object/dict · array/list (tuple → list) · null/None · true/True · keys → str
  - `json.JSONDecodeError` (a ValueError) for bad JSON · sets/dates → convert before dumping
  - Never `eval()` data · Excel BOM → `encoding="utf-8-sig"`
