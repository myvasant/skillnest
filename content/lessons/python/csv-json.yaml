sections:
  - id: why
    title: Why not just split on commas?
    kind: why
    blocks:
      - type: markdown
        body: |
          Programs constantly swap data with other programs: a spreadsheet exports a table, a web service
          returns a user profile, a tool reads its settings from a file. Two plain-text formats cover most
          of this:

          - [CSV](glossary:csv) (comma-separated values) — a **table**: one row per line, fields separated
            by commas.
          - [JSON](glossary:json) — **nested structures**: objects (like dicts) and arrays (like lists)
            containing strings, numbers, booleans and null.

          Both look simple enough to handle with string methods. They are not. Here is one CSV line where
          a name contains a comma, so the format wraps it in quotes:
      - type: code
        runnable: true
        code: |
          import csv

          line = '"Hopper, Grace",New York,85'

          print(line.split(","))          # naive: wrong

          for row in csv.reader([line]):  # the csv module knows the quoting rules
              print(row)
        expectedOutput: |
          ['"Hopper', ' Grace"', 'New York', '85']
          ['Hopper, Grace', 'New York', '85']
        annotations:
          - line: 5
            text: split() knows nothing about quotes, so the name is torn in two and the quotes are kept.
          - line: 7
            text: csv.reader accepts anything that gives lines — a file, or here a one-item list.
      - type: markdown
        body: |
          The same is true for JSON: hand-built strings break as soon as a value contains a quote or a
          newline. The standard library's `csv` and `json` modules implement the full rules, so use them
          for both reading and writing. Turning objects into text like this is called
          [serialization](glossary:serialization); turning text back into objects is *parsing*.

  - id: csv-reading
    title: Reading CSV
    kind: concept
    blocks:
      - type: markdown
        body: |
          A CSV file usually starts with a **header** row naming the columns:

          ```text
          name,city,age
          Ada,London,36
          "Hopper, Grace",New York,85
          ```

          The rules: fields are separated by commas; a field containing a comma, a double quote or a line
          break is wrapped in double quotes; a double quote inside such a field is written twice (`""`).

          `csv.reader(f)` turns each line into a **list of strings**. Open CSV files with `newline=""` —
          the csv module handles line endings itself (more on that below).
      - type: code
        runnable: true
        code: |
          import csv

          with open("people.csv", "w", encoding="utf-8", newline="") as f:
              f.write('name,city,age\nAda,London,36\n"Hopper, Grace",New York,85\n')

          with open("people.csv", encoding="utf-8", newline="") as f:
              for row in csv.reader(f):
                  print(row)
        expectedOutput: |
          ['name', 'city', 'age']
          ['Ada', 'London', '36']
          ['Hopper, Grace', 'New York', '85']
        annotations:
          - line: 4
            text: Writing the raw text ourselves so you can see exactly what is in the file.
          - line: 7
            text: Each row is a list; the header is just the first row.
      - type: markdown
        body: |
          Usually you want to refer to columns by name. `csv.DictReader` reads the header for you and turns
          every following row into a **dict** keyed by the column names:
      - type: code
        runnable: true
        code: |
          import csv

          with open("people.csv", "w", encoding="utf-8", newline="") as f:
              f.write('name,city,age\nAda,London,36\n"Hopper, Grace",New York,85\n')

          with open("people.csv", encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              print(reader.fieldnames)
              for row in reader:
                  print(row["name"], "is", row["age"])
        expectedOutput: |
          ['name', 'city', 'age']
          Ada is 36
          Hopper, Grace is 85
      - type: callout
        variant: warning
        title: Every CSV value is a string
        body: |
          CSV has no types: `36` in the file arrives as the string `'36'`. `row["age"] + 1` raises
          `TypeError`, and `row["age"] * 2` gives `'3636'`. Convert explicitly — `int(row["age"])`,
          `float(row["price"])` — as soon as you read a row.
      - type: code
        runnable: true
        code: |
          import csv

          with open("orders.csv", "w", encoding="utf-8", newline="") as f:
              f.write("item,qty,price\npen,3,1.50\npad,2,4.25\n")

          total = 0.0
          with open("orders.csv", encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f):
                  qty = int(row["qty"])          # '3'    -> 3
                  price = float(row["price"])    # '1.50' -> 1.5
                  total += qty * price

          print(f"Order total: {total:.2f}")
        expectedOutput: |
          Order total: 13.00
        caption: Convert each value to the type you need, then do arithmetic.
      - type: item
        ref: predict-strings

  - id: csv-writing
    title: Writing CSV
    kind: concept
    blocks:
      - type: markdown
        body: |
          `csv.writer(f).writerow(list)` writes one row; `writerows(list_of_lists)` writes many. Values
          are converted with `str()` (and `None` becomes an empty field), and quoting is added only where
          it is needed.

          `csv.DictWriter` writes dicts. You list the columns in `fieldnames`, call `writeheader()` once,
          then `writerow(dict)` for each row:
      - type: code
        runnable: true
        code: |
          import csv

          results = [
              {"name": "Ada", "score": 91},
              {"name": 'Grace "Amazing" Hopper', "score": 87},
          ]

          with open("results.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=["name", "score"])
              writer.writeheader()
              writer.writerows(results)

          with open("results.csv", encoding="utf-8", newline="") as f:
              print(repr(f.read()))
        expectedOutput: |
          'name,score\r\nAda,91\r\n"Grace ""Amazing"" Hopper",87\r\n'
        annotations:
          - line: 9
            text: fieldnames fixes the column order and is written as the header.
          - line: 15
            text: The quotes inside the name were doubled and the field wrapped in quotes. The csv module ends lines with \r\n, as RFC 4180 specifies.
      - type: markdown
        body: |
          **Why `newline=""`?** The csv module writes its own `"\r\n"` line endings and understands line
          breaks *inside* quoted fields. Normal text mode would interfere in both directions:

          - **Writing** on Windows, text mode turns every `"\n"` into `"\r\n"`, so the csv module's `"\r\n"`
            becomes `"\r\r\n"` — spreadsheet programs then show a blank row between every record.
          - **Reading**, text mode translates line endings before the csv module sees them, which silently
            changes line breaks stored inside quoted fields:
      - type: code
        runnable: true
        code: |
          import csv

          with open("notes.csv", "w", encoding="utf-8", newline="") as f:
              csv.writer(f).writerow(["memo", "line one\r\nline two"])

          with open("notes.csv", encoding="utf-8") as f:              # no newline=""
              print(list(csv.reader(f)))

          with open("notes.csv", encoding="utf-8", newline="") as f:  # correct
              print(list(csv.reader(f)))
        expectedOutput: |
          [['memo', 'line one\nline two']]
          [['memo', 'line one\r\nline two']]
        caption: Without newline="", the \r inside the quoted field was lost before the csv module could see it.
      - type: item
        ref: newline-mcq

  - id: json-basics
    title: JSON and Python types
    kind: concept
    blocks:
      - type: markdown
        body: |
          JSON text looks a lot like Python literals, but it is a separate, stricter language
          ([RFC 8259](https://www.rfc-editor.org/rfc/rfc8259)): strings **must** use double quotes, the
          constants are lower-case `true`, `false` and `null`, and trailing commas are not allowed.

          | JSON | Python (after loading) | Notes |
          |---|---|---|
          | object `{"k": v}` | `dict` | keys are always strings |
          | array `[1, 2]` | `list` | tuples are written as arrays too |
          | string `"text"` | `str` | |
          | number `3` / `3.5` | `int` / `float` | |
          | `true` / `false` | `True` / `False` | |
          | `null` | `None` | |

          Four functions do the conversion. The ones ending in **s** work with **s**trings; the others
          work with files:

          | Function | Converts | Direction |
          |---|---|---|
          | `json.dumps(obj)` | Python object → JSON `str` | serialize |
          | `json.loads(text)` | JSON `str` → Python object | parse |
          | `json.dump(obj, f)` | Python object → JSON written to file `f` | serialize |
          | `json.load(f)` | JSON read from file `f` → Python object | parse |
      - type: code
        runnable: true
        code: |
          import json

          profile = {"name": "Ada", "langs": ["Python", "C"], "active": True, "manager": None}

          text = json.dumps(profile)
          print(text)
          print(type(text))

          back = json.loads(text)
          print(back["langs"][0], back["manager"])
        expectedOutput: |
          {"name": "Ada", "langs": ["Python", "C"], "active": true, "manager": null}
          <class 'str'>
          Python None
        annotations:
          - line: 5
            text: True became true and None became null — JSON spelling.
          - line: 9
            text: Parsing gives ordinary Python objects you can index.
      - type: visualization
        component: python-tracer
        title: From JSON text to Python objects
        caption: >-
          Before line 4 runs, text is just one string. Afterwards, data refers to a real dict containing a
          list and None, which you can change like any other dict. dumps() then builds a brand-new string.
        props:
          code: |
            import json

            text = '{"name": "Ada", "langs": ["Python", "C"], "manager": null}'
            data = json.loads(text)
            data["langs"].append("Rust")
            new_text = json.dumps(data)
            print(new_text)
      - type: markdown
        body: |
          The round trip is **not always perfect**, because JSON has fewer types than Python. Predict what
          survives:
      - type: item
        ref: predict-roundtrip
      - type: callout
        variant: misconception
        title: '"JSON is just a Python dict written down"'
        body: |
          `str(my_dict)` produces Python syntax — single quotes, `True`, `None` — which is **not** valid
          JSON, and other languages cannot read it. Always produce JSON with `json.dumps`/`json.dump`.

  - id: json-files
    title: JSON files and pretty printing
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          `json.dump(obj, f)` writes straight to an open file and `json.load(f)` reads one back. JSON is
          text, so open the file in text mode with `encoding="utf-8"` (the JSON standard requires UTF-8
          for data exchanged between systems).

          Pass `indent=2` to make the output readable — one item per line, nested levels indented. Add
          `sort_keys=True` to order the keys alphabetically, which keeps files stable under version control.
      - type: code
        runnable: true
        code: |
          import json

          settings = {"theme": "dark", "font_size": 14, "plugins": ["git", "lint"]}

          with open("settings.json", "w", encoding="utf-8") as f:
              json.dump(settings, f, indent=2)

          with open("settings.json", encoding="utf-8") as f:
              print(f.read())

          with open("settings.json", encoding="utf-8") as f:
              loaded = json.load(f)

          loaded["font_size"] += 2
          print(loaded["font_size"], loaded == settings)
        expectedOutput: |
          {
            "theme": "dark",
            "font_size": 14,
            "plugins": [
              "git",
              "lint"
            ]
          }
          16 False
        annotations:
          - line: 6
            text: indent=2 puts each item on its own line, indented by two spaces per level.
          - line: 12
            text: json.load parses the file's text into a new dict.
          - line: 14
            text: loaded is a separate object, so changing it does not change settings — hence False.
      - type: callout
        variant: tip
        title: Non-ASCII text
        body: |
          By default `json.dumps("café")` writes `"caf\u00e9"` — an escape that every JSON reader
          understands. Pass `ensure_ascii=False` to keep the characters as they are (`"café"`), which is
          friendlier to read; then make sure the file is written with `encoding="utf-8"`.

  - id: mistakes
    title: Invalid data, errors and safety
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `json.decoder.JSONDecodeError: Expecting property name enclosed in double quotes` | Single quotes — the text is Python syntax, not JSON | Produce it with `json.dumps`; JSON strings need `"` |
          | `JSONDecodeError: Illegal trailing comma before end of object` | A comma after the last item | Remove it — JSON forbids trailing commas |
          | `JSONDecodeError: Expecting value: line 1 column 1 (char 0)` | Empty file or empty string (or HTML instead of JSON) | Check what you actually read: `print(repr(text[:100]))` |
          | `TypeError: Object of type set is not JSON serializable` | JSON has no set, date, or custom object types | Convert first: `sorted(my_set)`, `day.isoformat()` |
          | `TypeError: can only concatenate str (not "int") to str` with CSV data | CSV values are strings | `int(row["qty"])`, `float(row["price"])` |
          | `ValueError: dict contains fields not in fieldnames: 'age'` | DictWriter got a key missing from `fieldnames` | Add the column to `fieldnames` (or pass `extrasaction="ignore"`) |
          | `KeyError: 'name'` though the header says `name` | Excel saved "UTF-8 with BOM"; the first key is really `'\ufeffname'` | Open with `encoding="utf-8-sig"` |
          | Blank rows between CSV records on Windows | File opened without `newline=""` | `open(path, "w", encoding="utf-8", newline="")` |

          JSON errors report the **line and column** where parsing failed — the mistake is at or just
          before that position:
      - type: code
        runnable: true
        code: |
          import json

          text = '{"name": "Ada", "age": 36,}'
          data = json.loads(text)
        expectError: JSONDecodeError
        caption: Column 26 is the closing brace, just after the illegal trailing comma.
      - type: markdown
        body: |
          `JSONDecodeError` is a subclass of `ValueError`, so you can catch it specifically and report a
          helpful message when input comes from a user, a file or the network:
      - type: code
        runnable: true
        code: |
          import json

          def parse_or_none(text):
              try:
                  return json.loads(text)
              except json.JSONDecodeError as err:
                  print(f"Invalid JSON at line {err.lineno}, column {err.colno}: {err.msg}")
                  return None

          print(parse_or_none('[1, 2, 3]'))
          print(parse_or_none("{'name': 'Ada'}"))
        expectedOutput: |
          [1, 2, 3]
          Invalid JSON at line 1, column 2: Expecting property name enclosed in double quotes
          None
      - type: markdown
        body: |
          Some Python objects have no JSON equivalent, so `dumps` refuses them rather than guessing:
      - type: code
        runnable: true
        code: |
          import json

          tags = {"python", "files"}
          print(json.dumps({"tags": sorted(tags)}))   # convert the set to a sorted list: works
          print(json.dumps({"tags": tags}))           # a set: TypeError
        expectError: TypeError
        expectedOutput: |
          {"tags": ["files", "python"]}
      - type: callout
        variant: warning
        title: Never use eval() to parse data
        body: |
          JSON looks like Python, so it is tempting to write `eval(text)`. Don't. `eval` **runs** the text
          as Python code, so data from a file, a user or the internet could do anything your program can do
          — read secrets, delete files. It also fails on valid JSON (`true` and `null` are not Python
          names). `json.loads` only ever builds data, so it is safe. (For Python-literal text such as
          `"{'a': 1}"`, `ast.literal_eval` is the safe tool — but for JSON use `json`.)
      - type: code
        runnable: true
        code: |
          import json

          untrusted = '__import__("os").getcwd()'   # imagine this arrived from a web form

          print(eval(untrusted))     # eval RAN it - it could just as easily delete files

          try:
              json.loads(untrusted)  # json only parses data: this is not valid JSON
          except json.JSONDecodeError as err:
              print("rejected:", err.msg)
        expectedOutput: |
          /home/pyodide
          rejected: Expecting value
        caption: >-
          eval executed code that asked the operating system for the current folder. json.loads refused,
          because the text is not data. More in [secure coding](concept:python.secure-coding).
      - type: item
        ref: explain-eval
      - type: item
        ref: debug-str-json

