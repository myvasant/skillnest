  - id: predict-roundtrip
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print? (Two lines.)
    code: |
      import json

      original = {1: ("a", "b"), "ok": None}
      copy = json.loads(json.dumps(original))

      print(copy)
      print(copy == original)
    answer: |
      {'1': ['a', 'b'], 'ok': None}
      False
    explanation: >-
      JSON object keys are always strings, so the key 1 is written as "1" and comes back as '1'. JSON has
      no tuples, so ("a", "b") becomes an array and comes back as a list. None survives as null → None. The
      result differs from the original, so == is False.
    wrongAnswers:
      - answer: |
          {1: ('a', 'b'), 'ok': None}
          True
        feedback: >-
          JSON has fewer types than Python: keys must be strings and there are no tuples, so the round trip
          changes both.
      - answer: |
          {'1': ['a', 'b'], 'ok': null}
          False
        feedback: null is JSON spelling. json.loads converts it back to Python's None.
      - answer: |
          {'1': ('a', 'b'), 'ok': None}
          False
        feedback: A JSON array always loads as a list — the parser cannot know it was a tuple before.

  - id: explain-eval
    type: explain
    skill: explanation
    prompt: >-
      A teammate parses JSON received from a web form with `data = eval(request_text)` because "it works
      in my tests". Explain why this is dangerous and what to use instead.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says eval executes the text as Python code rather than just reading data.
      - Explains that an attacker controlling the text could run arbitrary code (delete files, read secrets).
      - Notes that eval does not even handle valid JSON reliably (true, false, null are not Python names).
      - Recommends json.loads, which only builds data, and catching json.JSONDecodeError for bad input.
    modelAnswer: |
      eval() treats its argument as a Python expression and runs it. If the text comes from outside —
      a form, a file, an API — whoever controls it can make the program do anything it is allowed to
      do, such as `__import__("os").remove(...)`. It is also simply wrong for JSON: valid JSON like
      `{"ok": true}` fails because `true` is not a Python name. json.loads parses only JSON data into
      dicts, lists, strings, numbers, booleans and None, and raises json.JSONDecodeError (which we can
      catch) for anything else.

