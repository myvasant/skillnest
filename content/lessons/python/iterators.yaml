          assert buffer.getvalue().splitlines() == ["1 plan"], "Number the items from the list itself."
    hints:
      - len(tasks) is the number 3. Can you loop over a number?
      - enumerate(tasks) gives (index, item) pairs; start=1 makes the numbering begin at 1.
    feedback:
      - when: { outputContains: "0 write" }
