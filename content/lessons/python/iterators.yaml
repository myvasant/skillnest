sections:
  - id: why
    title: One loop, many kinds of data
    kind: why
    blocks:
      - type: markdown
        body: |
          You have looped over lists, strings, dictionaries, ranges, files and `zip(...)` with the same
          `for` statement. Those are very different objects — how can one statement handle them all? And
          why does this program print the pairs once, and then find nothing?
      - type: code
        runnable: true
        code: |
          pairs = zip(["Ada", "Lin"], [91, 78])

          for name, score in pairs:
              print(name, score)

          print("Again:", list(pairs))
        expectedOutput: |
          Ada 91
          Lin 78
          Again: []
        annotations:
          - line: 6
            text: The same zip object, looped over a second time, is empty.
      - type: markdown
        body: |
          Both questions have the same answer: the **iterator protocol**, a tiny agreement between `for`
          and the objects it loops over. Once you know it, you can predict exactly when data is "used up",
          and you will understand [generators](concept:python.generators) — the next lesson — immediately.

  - id: iterable-vs-iterator
    title: Iterable vs iterator
    kind: concept
    blocks:
      - type: markdown
        body: |
          Two roles, two words:

          - An [iterable](glossary:iterable) is anything you can loop over: a list, a string, a dict, a
            range, a file. Its job is to **hand out iterators** when asked, via the built-in `iter()`.
          - An [iterator](glossary:iterator) does the actual walking. It **remembers its position** and
            gives the next item each time you call `next()` on it. When there are no items left, it raises
            [StopIteration](glossary:stop-iteration).

          A list is iterable but is **not** an iterator — it does not remember any position, which is why
          you can loop over the same list as often as you like. Each `iter(list)` creates a fresh iterator
          with its own position:
      - type: code
        runnable: true
        code: |
          colors = ["red", "green", "blue"]

          first = iter(colors)
          second = iter(colors)

          print(next(first))
          print(next(first))
          print(next(second))     # independent: starts at the beginning
          print(type(first).__name__)
        expectedOutput: |
          red
          green
          red
          list_iterator
        annotations:
          - line: 3
            text: iter() asks the list for a new iterator.
          - line: 8
            text: second has its own position, untouched by first.
      - type: callout
        variant: analogy
        title: A book and its bookmarks
        body: |
          An iterable is like a **book**; an iterator is a **bookmark** in it. Many readers can have their
          own bookmark in the same book, each at a different page. A bookmark only moves forward, and once
          it reaches the end it is no use — you need a new bookmark to read again. Some objects, like a zip
          or an open file, are *bookmarks without a book*: the iterator is all there is.
      - type: markdown
        body: |
          **Every iterator is also iterable:** `iter(an_iterator)` simply returns the same iterator. That
          is what allows you to write `for x in some_iterator:`. So "iterable" is the broad category, and
          iterators are the single-use members of it.

          | Object | Iterable? | Iterator? | Can loop over it again? |
          |---|---|---|---|
          | `list`, `tuple`, `str`, `dict`, `set` | yes | no | yes |
          | `range(10)` | yes | no | yes |
          | `zip(...)`, `map(...)`, `filter(...)`, `enumerate(...)`, `reversed(...)` | yes | **yes** | no |
          | open file object | yes | **yes** | no (unless you `seek(0)`) |
          | `iter(any_iterable)` | yes | **yes** | no |
      - type: item
        ref: iterable-mcq

  - id: iter-and-next
    title: Driving iteration by hand with iter() and next()
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          `next(iterator)` returns the next item and moves the iterator forward. When nothing is left it
          raises `StopIteration` — an exception that simply means "finished", not "something went wrong".
          If you would rather get a value than an exception, pass a default: `next(iterator, default)`.
      - type: code
        runnable: true
        code: |
          letters = iter("ab")

          print(next(letters))
          print(next(letters))
          print(next(letters, "no more"))   # default instead of an exception

          try:
              next(letters)
          except StopIteration:
              print("StopIteration: the iterator is exhausted")
        expectedOutput: |
          a
          b
          no more
          StopIteration: the iterator is exhausted
      - type: markdown
        body: |
          Calling `next()` by hand is genuinely useful when the first item is special — for example, a
          header line — and the rest should be processed normally:
      - type: code
        runnable: true
        code: |
          rows = iter(["name,score", "Ada,91", "Lin,78"])

          header = next(rows)          # take the first item off
          print("columns:", header.split(","))

          for row in rows:             # the loop continues from where next() left off
              print("data:", row)
        expectedOutput: |
          columns: ['name', 'score']
          data: Ada,91
          data: Lin,78
        annotations:
          - line: 6
            text: The for loop uses the same iterator, so it starts at the second item.
      - type: item
        ref: predict-next

  - id: for-loop
    title: What a for loop really does
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          `for item in iterable:` is a convenient way to write the [iterator protocol](glossary:iterator-protocol):

          1. Call `iter(iterable)` **once** to get an iterator.
          2. Call `next()` on it, bind the result to `item`, and run the body.
          3. Repeat step 2 until `next()` raises `StopIteration`; the loop catches it silently and ends.

          Written out by hand, these two programs do the same thing:

          ```python
          for color in colors:          # what you write
              print(color)
          ```
      - type: code
        runnable: true
        code: |
          colors = ["red", "green"]

          it = iter(colors)                  # step 1
          while True:
              try:
                  color = next(it)           # step 2
              except StopIteration:          # step 3: no more items
                  break
              print(color)                   # the loop body
        expectedOutput: |
          red
          green
        caption: The real for loop does this in C inside the interpreter, but the logic is exactly this.
      - type: visualization
        component: python-tracer
        title: The for loop, unrolled
        caption: >-
          Each pass calls next(it) and binds color. On the third call the iterator has nothing left: the
          tracer shows StopIteration being raised on line 5, the except clause runs, and break ends the
          loop.
        props:
          code: |
            colors = ["red", "green"]
            it = iter(colors)
            while True:
                try:
                    color = next(it)
                except StopIteration:
                    break
                print(color)
      - type: callout
        variant: note
        title: Why this matters
        body: |
          Because `for` only needs `iter()` and `next()`, **any** object that supports them can be looped
          over — including ones you will create yourself with [generators](concept:python.generators) or,
          later, [classes](concept:python.classes) that define the `__iter__` and `__next__` methods. The
          same protocol powers `list()`, `sum()`, `max()`, `sorted()`, unpacking (`a, b = pair`),
          comprehensions and `in`.
      - type: item
        ref: parsons-while-for

  - id: single-use
    title: Iterators are single-use
    kind: concept
    blocks:
      - type: markdown
        body: |
          An iterator only moves forward. Once it has raised `StopIteration`, every later `next()` raises it
          again, and every later loop finds nothing. Anything that consumes items — a `for` loop, `list()`,
          `sum()`, `max()`, even `in` — moves the same iterator forward:
      - type: code
        runnable: true
        code: |
          prices = ["4", "10", "6"]
          numbers = map(int, prices)      # map returns an iterator

          print(sum(numbers))             # consumes all three items
          print(list(numbers))            # nothing left
          print(max(map(int, prices)))    # a NEW map object works again
        expectedOutput: |
          20
          []
          10
        annotations:
          - line: 2
            text: map(int, prices) converts each item when it is asked for — not in advance.
          - line: 6
            text: The list prices is untouched; calling map again creates a fresh iterator over it.
      - type: visualization
        component: python-tracer
        title: The second pass finds an empty iterator
        caption: >-
          After the loop, pairs still refers to the same zip object, but it has been exhausted, so again is
          bound to an empty list.
        props:
          code: |
            pairs = zip(["Ada", "Lin"], [91, 78])
            for name, score in pairs:
                print(name, score)
            again = list(pairs)
            print(again)
      - type: callout
        variant: tip
        title: Need the items twice? Make a list
        body: |
          If you must use the results of `zip`, `map`, `filter`, `enumerate` or a file more than once, store
          them: `pairs = list(zip(names, scores))`. A list is an iterable, so every loop gets a fresh
          iterator. (Do this only when the data fits comfortably in memory.)
      - type: item
        ref: predict-exhausted

  - id: lazy
    title: "Lazy objects: range, zip, enumerate"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Many built-ins are **lazy**: they produce items only when asked, instead of building a whole list
          up front. That is why `zip`, `map`, `filter` and `enumerate` return iterators — each pair or
          result is computed on the call to `next()` that needs it.

          `range` is lazy too, but it is **not** an iterator. It is a *lazy sequence*: it stores only
          `start`, `stop` and `step` and calculates any item on demand. So it supports `len()`, indexing and
          fast `in` tests, takes the same tiny amount of memory for a billion numbers as for three, and can be
          looped over any number of times.
      - type: code
        runnable: true
        code: |
          import sys

          r = range(1_000_000_000)
          print(len(r), r[-1], 123_456_789 in r)   # instant: computed, not stored
          print(sys.getsizeof(r) < 100)             # a few dozen bytes

          small = range(3)
          print(list(small), list(small))           # reusable

          e = enumerate(["x", "y"])                 # an iterator
          print(next(e), list(e), list(e))
        expectedOutput: |
          1000000000 999999999 True
          True
          [0, 1, 2] [0, 1, 2]
          (0, 'x') [(1, 'y')] []
        annotations:
          - line: 4
            text: "`in` on a range of ints is answered with arithmetic, without looping."
          - line: 8
            text: range is iterable, not an iterator, so each list() gets a fresh iterator.
          - line: 11
            text: enumerate is single-use like zip.
      - type: code
        runnable: true
        code: |
          next(range(3))
        expectError: TypeError
        caption: "TypeError: 'range' object is not an iterator — call iter(range(3)) first."
      - type: callout
        variant: deep-dive
        title: Dictionary views are live, not single-use
        depth: deep
        body: |
          `d.keys()`, `d.values()` and `d.items()` return *views*: iterables (not iterators) that always
          reflect the dict's current contents. You can loop over a view many times, but you must not add or
          remove keys **while** looping over the dict or one of its views — that raises
          `RuntimeError: dictionary changed size during iteration`.
      - type: item
        ref: explain-range

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | Second loop prints nothing; `max()` says `iterable argument is empty` | Reusing an exhausted iterator (zip, map, filter, file…) | Store it with `list(...)`, or create a new iterator |
          | `TypeError: 'list' object is not an iterator` | `next(my_list)` | `it = iter(my_list)`, then `next(it)` |
          | `TypeError: 'int' object is not iterable` | `for i in len(items):` or `for x in 5:` | `for i in range(len(items)):` — or better `for i, item in enumerate(items):` |
          | Some items are skipped when removing from a list in a loop | The list iterator walks by position while the list shrinks | Build a new list: `[x for x in items if keep(x)]`, or loop over a copy `items[:]` |
          | `RuntimeError: dictionary changed size during iteration` | Adding or deleting keys while looping over the dict | Loop over `list(d)` (a snapshot of the keys) |
          | Unexpected `StopIteration` traceback | Calling `next()` on an exhausted iterator outside a loop | Use `next(it, default)` or catch `StopIteration` |
      - type: code
        runnable: true
        code: |
          names = ["Ada", "Lin", "Sam"]
          for i in len(names):
              print(i, names[i])
        expectError: TypeError
        caption: len() returns an int, and an int is not iterable.
      - type: markdown
        body: |
          Changing a list while iterating over it does not raise an error — it silently skips items, which is
          worse. The list iterator keeps an index; when an item is removed, everything after it shifts left
          and the next item is jumped over:
      - type: code
        runnable: true
        code: |
          scores = [50, 40, 45, 90]
          for s in scores:
              if s < 60:
                  scores.remove(s)
          print("buggy:", scores)

          scores = [50, 40, 45, 90]
          scores = [s for s in scores if s >= 60]
          print("fixed:", scores)
        expectedOutput: |
          buggy: [40, 90]
          fixed: [90]
        annotations:
          - line: 4
            text: Removing 50 shifts 40 into position 0 — but the iterator moves on to position 1 (45), so 40 is never checked.
          - line: 8
            text: Building a new list never disturbs the one being iterated.
      - type: code
        runnable: true
        code: |
          stock = {"pens": 0, "pads": 3, "ink": 0}
          for item in stock:
              if stock[item] == 0:
                  del stock[item]
        expectError: RuntimeError
        caption: "Dicts detect the change and stop: loop over list(stock) instead."
      - type: item
        ref: debug-zip-twice

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: item
        ref: first-and-rest
      - type: item
        ref: count-without-for

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Special methods.** `iter(x)` calls `type(x).__iter__(x)` and `next(it)` calls
          `type(it).__next__(it)`. An iterator's `__iter__` returns the iterator itself. You can call them
          directly to see the protocol (normal code should use the built-ins):
      - type: code
        runnable: true
        code: |
          nums = [10, 20]
          it = nums.__iter__()          # what iter(nums) does
          print(it.__next__())          # what next(it) does
          print(it.__iter__() is it)    # an iterator returns itself
          print(hasattr(nums, "__next__"), hasattr(it, "__next__"))
        expectedOutput: |
          10
          True
          False True
      - type: markdown
        body: |
          - **The old sequence protocol.** If an object has no `__iter__` but has `__getitem__` accepting
            0, 1, 2, …, `iter()` still works: it calls `obj[0]`, `obj[1]`, … until `IndexError`.
          - **Your own iterators.** A class that defines `__iter__` and `__next__` works with `for`,
            `list()` and everything else — see [classes](concept:python.classes) and the
            [data model](concept:python.data-model). Generators are a much shorter way to get the same
            result.
          - **Bytecode.** CPython compiles `for` into a `GET_ITER` instruction (calls `iter()`) followed by
            a loop around `FOR_ITER` (calls `__next__` and jumps out at the end). Built-in iterators signal
            exhaustion efficiently without creating a `StopIteration` object each time; the exception is the
            protocol's contract for Python-level code.
          - **`iter(callable, sentinel)`.** The two-argument form calls `callable()` repeatedly until it
            returns `sentinel`. Example: reading a file in fixed-size chunks.
      - type: code
        runnable: true
        code: |
          with open("chunks.txt", "w", encoding="utf-8") as f:
              f.write("abcdefghij")

          with open("chunks.txt", encoding="utf-8") as f:
              for chunk in iter(lambda: f.read(4), ""):   # stop when read() returns ""
                  print(chunk)
        expectedOutput: |
          abcd
          efgh
          ij
      - type: markdown
        body: |
          **Sharing one iterator.** Because `zip()` pulls from each argument in turn, passing the *same*
          iterator twice groups items into pairs — a well-known idiom that only makes sense once you see
          iterators as single-use bookmarks:
      - type: code
        runnable: true
        code: |
          it = iter([1, 2, 3, 4, 5, 6])
          print(list(zip(it, it)))
        expectedOutput: |
          [(1, 2), (3, 4), (5, 6)]

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - **Iterable**: can be looped over; `iter(x)` gives a fresh iterator. Lists, strings, dicts, sets,
            ranges are iterables you can reuse.
          - **Iterator**: remembers a position; `next(it)` returns the next item or raises `StopIteration`.
            Single-use. `iter(it) is it`.
          - A `for` loop = `iter()` once + `next()` repeatedly + stop on `StopIteration`.
          - `zip`, `map`, `filter`, `enumerate`, `reversed` and file objects are **iterators**: lazy and
            single-use. Use `list(...)` to keep the items.
          - `range` is a **lazy sequence**, not an iterator: `len`, indexing, `in`, reusable, tiny memory.
          - Don't change a list or dict while looping over it; build a new one instead.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What's the difference between an iterable and an iterator?" — iterables produce iterators via
          `__iter__`; iterators implement `__next__`, keep state, are exhausted after one pass and return
          themselves from `__iter__`. Then show how a `for` loop expands into `iter`/`next`/`StopIteration`,
          and mention that `range` is not an iterator.

items:
  - id: iterable-mcq
    type: mcq
    skill: recognition
    prompt: Which of these objects is an **iterator** (not just an iterable)?
    explanation: >-
      zip() returns an iterator: it has __next__, remembers its position and is used up after one pass.
      Lists, strings and ranges are iterables — they hand out a new iterator each time you loop over them.
    options:
      - id: a
        text: "`[1, 2, 3]`"
        feedback: "A list is iterable but not an iterator. next([1, 2, 3]) raises TypeError: 'list' object is not an iterator."
      - id: b
        text: "`range(3)`"
        feedback: range is a lazy sequence — iterable and reusable, but not an iterator. next(range(3)) is a TypeError.
      - id: c
        text: "`zip([1, 2], [3, 4])`"
        correct: true
        feedback: Right. zip objects are iterators — loop over one twice and the second loop finds nothing.
      - id: d
        text: '`"hello"`'
        feedback: Strings are iterables. iter("hello") would give you an iterator over the characters.

  - id: predict-next
    type: predict-output
    skill: prediction
    prompt: What does this print? (Three lines.)
    code: |
      it = iter([10, 20])
      print(next(it))
      print(next(it, 0))
      print(next(it, 0))
    answer: |
      10
      20
      0
    explanation: >-
      The first next() returns 10. The second still has an item, so the default is ignored and 20 is
      returned. The third finds the iterator exhausted and returns the default 0 instead of raising
      StopIteration.
    wrongAnswers:
      - answer: |
          10
          0
          0
        feedback: The default is used only when the iterator is exhausted. 20 is still available on the second call.
      - answer: |
          10
          10
          10
        feedback: An iterator remembers its position; each next() moves it forward.
      - answer: |
          10
          20
          10
        feedback: Iterators never restart on their own. Once exhausted, they stay exhausted.

  - id: parsons-while-for
    type: parsons
    skill: implementation
    difficulty: 2
    prompt: |
      Arrange the lines into the while-loop equivalent of `for n in [3, 5]: print(n * 10)`. One line is a
      distractor.
    solution: |
      it = iter([3, 5])
      while True:
          try:
              n = next(it)
          except StopIteration:
              break
          print(n * 10)
    distractors:
      - "        n = next([3, 5])"
    expectedOutput: |
      30
      50
    explanation: >-
      iter() is called once, before the loop. Inside, next(it) gets each item; StopIteration ends the loop
      with break. next([3, 5]) is the distractor — a list is not an iterator, so it raises TypeError.

  - id: predict-exhausted
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print? (Three lines.)
    code: |
      words = ["sun", "moon", "star"]
      lengths = map(len, words)

      print(max(lengths))
      print(sum(lengths))
      print(len(words))
    answer: |
      4
      0
      3
    explanation: >-
      map returns a single-use iterator. max() consumes all of it, so sum() sees no items and returns 0
      (the sum of nothing). The list words itself is unchanged and still has 3 items.
    wrongAnswers:
      - answer: |
          4
          11
          3
        feedback: That would be right with a list of lengths. But lengths is a map iterator, and max() already used it up.
      - answer: |
          4
          0
          0
        feedback: Consuming the map iterator does not change the original list — words still has three items.
      - answer: |
          4
          7
          3
        feedback: max() reads every item to find the largest, so it consumes the whole iterator, not just the first two items.

  - id: explain-range
    type: explain
    skill: explanation
    prompt: >-
      `range(10)` can be looped over twice and gives the same numbers both times, but `zip(a, b)` cannot.
      Explain why, using the words iterable and iterator, and say how much memory `range(10**9)` needs.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says range is an iterable (a lazy sequence) and zip returns an iterator.
      - Explains that each loop calls iter() on the range and gets a fresh iterator, whereas iter() on a zip returns the same, already-advanced iterator.
      - Explains that an exhausted iterator produces nothing more.
      - Says range stores only start, stop and step, so even range(10**9) uses a tiny, constant amount of memory.
    modelAnswer: |
      A for loop starts by calling iter() on what it is given. range(10) is an iterable — a lazy
      sequence — so iter() creates a brand-new iterator starting at 0 every time, and the numbers come out
      again. zip(a, b) returns an iterator: iter() on an iterator returns the iterator itself, with its
      position wherever the last loop left it. After the first full pass it is exhausted, so a second loop
      gets StopIteration immediately and does nothing. range never stores its numbers; it keeps start, stop
      and step and computes each value on demand, so range(10**9) takes only a few dozen bytes.

  - id: debug-zip-twice
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This program should print every result and then the best student, but it crashes with
      `ValueError: max() iterable argument is empty`. Fix it so both parts work.
    starterCode: |
      names = ["Ada", "Lin", "Sam"]
      scores = [91, 78, 95]
      results = zip(names, scores)

      for name, score in results:
          print(name, score)

      best = max(results, key=lambda pair: pair[1])
      print("Best:", best[0])
    solution: |
      names = ["Ada", "Lin", "Sam"]
      scores = [91, 78, 95]
      results = list(zip(names, scores))

      for name, score in results:
          print(name, score)

      best = max(results, key=lambda pair: pair[1])
      print("Best:", best[0])
    expectedOutput: |
      Ada 91
      Lin 78
      Sam 95
      Best: Sam
    tests:
      - name: prints the results and the best student
        code: |
          assert output_lines() == ["Ada 91", "Lin 78", "Sam 95", "Best: Sam"], f"Got {output()!r}."
      - name: still computed from the lists
        code: |
          import io, contextlib
          changed = source.replace("[91, 78, 95]", "[99, 78, 95]")
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buffer.getvalue().splitlines()[-1] == "Best: Ada", "Find the best student from the data rather than printing a fixed name."
    hints:
      - zip() returns an iterator. What happens to an iterator after a for loop has gone through it?
      - "By the time max() runs, results has no items left."
      - Store the pairs in a list with list(zip(names, scores)) so they can be used twice.
    feedback:
      - when: { errorType: ValueError }
        message: >-
          max() still receives an exhausted iterator. Turn the zip into a list when you create it, so it can
          be looped over twice.
    explanation: >-
      The for loop consumed the zip iterator, so max() received no items. list(zip(...)) materialises the
