id: python.iterators
concept: python.iterators
title: Iterables and Iterators
subtitle: iter(), next(), StopIteration and what a for loop really does
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  One for loop works on lists, strings, dicts, files, ranges and zips because they all follow the same
  iterator protocol. Learn the difference between an iterable and an iterator, drive iteration by hand
  with iter() and next(), rewrite a for loop as the while loop it really is, and avoid the classic
  "my zip is empty the second time" bug.
objectives:
  - Distinguish iterables (can be looped over repeatedly) from iterators (single-use, remember their position).
  - Use iter() and next(), including next(it, default), and explain the role of StopIteration.
  - Rewrite a for loop as the equivalent while loop with try/except StopIteration.
  - Predict the behaviour of exhausted iterators such as zip, map, enumerate and file objects.
  - Explain why range is a lazy sequence but not an iterator, and diagnose common iteration errors.
