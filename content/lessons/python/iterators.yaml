  - id: m-predict-in
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print? (Two lines.)
    code: |
      it = iter([1, 2, 3, 4, 5])
      print(3 in it)
      print(list(it))
    answer: |
      True
      [4, 5]
    explanation: >-
      `in` on an iterator calls next() until it finds the item, consuming 1, 2 and 3 along the way. The
      list() call then collects only what is left: 4 and 5.
    wrongAnswers:
      - answer: |
          True
          [1, 2, 3, 4, 5]
        feedback: An `in` test on an iterator consumes items until it finds a match; they are gone afterwards.
      - answer: |
          True
          []
        feedback: The search stops as soon as 3 is found, so 4 and 5 are still in the iterator.

  - id: m-tf-range
    type: true-false
    skill: recognition
    prompt: "True or false: `range(5)` is an iterator, so after one loop over it a second loop prints nothing."
    answer: false
    explanation: >-
      range is a lazy sequence — an iterable, not an iterator. Every loop calls iter() on it and gets a
      fresh iterator, so it can be looped over any number of times. next(range(5)) raises TypeError.

  - id: m-mcq-remove
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      `for x in nums: if x % 2 == 0: nums.remove(x)` with `nums = [2, 4, 5, 6]` leaves `[4, 5]`. Why was
      4 not removed?
    explanation: >-
      The list iterator tracks an index. Removing 2 (index 0) shifts 4 into index 0, but the iterator moves
      on to index 1, which is now 5. 4 is never examined. Build a new list instead.
    options:
      - id: a
        text: The list iterator moves by index; removing an item shifts the next one into the position already visited, so it is skipped.
        correct: true
        feedback: Right. Never change a list's length while iterating over it; use a comprehension or loop over a copy.
      - id: b
        text: remove() deletes only the last matching item.
        feedback: remove() deletes the first matching item. The problem is the skipped check, not remove().
      - id: c
        text: The for loop works on a copy of the list made when it started.
        feedback: A for loop does not copy the list — that is exactly why changes during the loop affect it.
      - id: d
        text: "4 % 2 == 0 is False."
        feedback: 4 is even. The condition was simply never evaluated for 4.

  - id: m-code-take
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `take(iterable, n)` that **returns a list** of at most the first `n` items. It must stop as soon
      as it has `n` items — so it works on endless iterators like `itertools.count()` — and must not take
      more items than it returns from an iterator it was given.
    starterCode: |
      import itertools


      def take(iterable, n):
          # Use iter() and next(it, ...) — stop after n items or when the iterable runs out.
          pass


      print(take(itertools.count(10), 3))
      print(take("ab", 5))
    solution: |
      import itertools


      def take(iterable, n):
          it = iter(iterable)
          result = []
          while len(result) < n:
              try:
                  result.append(next(it))
              except StopIteration:
                  break
          return result


      print(take(itertools.count(10), 3))
      print(take("ab", 5))
    expectedOutput: |
      [10, 11, 12]
      ['a', 'b']
    tests:
      - name: takes from an endless iterator
        code: |
          import itertools
          assert take(itertools.count(1), 4) == [1, 2, 3, 4], f"take(itertools.count(1), 4) returned {take(itertools.count(1), 4)!r}."
      - name: stops early when the iterable runs out
        code: |
          assert take([1, 2], 5) == [1, 2], f"take([1, 2], 5) should be [1, 2], got {take([1, 2], 5)!r}."
          assert take([], 3) == [], "take([], 3) should be []."
          assert take([1, 2, 3], 0) == [], "take(..., 0) should be []."
      - name: does not consume extra items
        code: |
          it = iter([1, 2, 3, 4])
          assert take(it, 2) == [1, 2], "take(it, 2) should return [1, 2]."
          assert next(it) == 3, "After take(it, 2), the next item of it should still be 3 — don't call next() more than n times."
    hints:
      - "Get an iterator with iter(iterable) and keep a result list."
      - Loop while the result has fewer than n items; call next() inside try/except StopIteration.
      - Check the length *before* calling next(), so you never take an item you won't return.
    feedback:
      - when: { errorType: StopIteration }
        message: next() raised StopIteration because the iterable was shorter than n. Catch it and stop.
      - when: { errorType: MemoryError }
        message: Something tried to read the endless iterator to the end (list() on itertools.count never finishes). Take items one at a time.
    explanation: >-
      Calling next() exactly as many times as needed makes take() safe for endless iterators and leaves an
      iterator positioned right after the last item returned. itertools.islice(iterable, n) does the same
      job in the standard library.

  - id: m-debug-len-loop
    type: debug
    skill: debugging
    prompt: |
      This program should print a numbered list starting at 1, but crashes with
      `TypeError: 'int' object is not iterable`. Fix it using `enumerate`.
    starterCode: |
      tasks = ["write", "test", "ship"]
      for i in len(tasks):
