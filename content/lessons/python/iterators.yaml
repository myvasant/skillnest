  - id: first-and-rest
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `first_and_rest(iterable)` that **returns a tuple** `(first, rest)`: the first item and a list
      of all remaining items. It must work for **any** iterable — lists, strings, ranges and single-use
      iterators like `zip` — so use `iter()` and `next()` rather than indexing. For an empty iterable return
      `(None, [])`.
    starterCode: |
      def first_and_rest(iterable):
          # Get an iterator, take one item with next() (with a default), then collect the rest.
          pass


      print(first_and_rest(["header", "a", "b"]))
      print(first_and_rest("xyz"))
      print(first_and_rest([]))
    solution: |
      def first_and_rest(iterable):
          it = iter(iterable)
          first = next(it, None)
          rest = list(it)
          return first, rest


      print(first_and_rest(["header", "a", "b"]))
      print(first_and_rest("xyz"))
      print(first_and_rest([]))
    expectedOutput: |
      ('header', ['a', 'b'])
      ('x', ['y', 'z'])
      (None, [])
    tests:
      - name: works for lists and strings
        code: |
          assert first_and_rest([1, 2, 3]) == (1, [2, 3]), f"first_and_rest([1, 2, 3]) returned {first_and_rest([1, 2, 3])!r}."
          assert first_and_rest("ab") == ("a", ["b"]), f"first_and_rest('ab') returned {first_and_rest('ab')!r}."
      - name: works for iterators that cannot be indexed
        code: |
          result = first_and_rest(zip("ab", [1, 2]))
          assert result == (("a", 1), [("b", 2)]), f"For a zip object the result should be (('a', 1), [('b', 2)]), got {result!r}. Use iter() and next() instead of [0] and slicing."
          result = first_and_rest(range(5))
          assert result == (0, [1, 2, 3, 4]), f"first_and_rest(range(5)) returned {result!r}."
      - name: empty input gives (None, [])
        code: |
          assert first_and_rest([]) == (None, []), f"first_and_rest([]) should be (None, []), got {first_and_rest([])!r}."
          assert first_and_rest(iter([])) == (None, []), "An empty iterator should also give (None, [])."
      - name: uses next()
        code: |
          assert calls("next"), "Take the first item with next(it, None)."
    hints:
      - "Start with it = iter(iterable). That works for every kind of iterable."
      - next(it, None) returns the first item, or None if there is none — no exception.
      - list(it) collects whatever is left after next() moved the iterator forward.
    feedback:
      - when: { errorType: TypeError, errorMessageContains: "not subscriptable" }
        message: Iterators such as zip cannot be indexed with [0]. Use it = iter(iterable) and next(it, None).
      - when: { errorType: StopIteration }
        message: next() raised StopIteration on the empty input. Pass a default — next(it, None).
      - when: { outputContains: "('header', ['header'" }
        message: The rest still includes the first item. Collect the rest from the same iterator after calling next().
    explanation: >-
      iter() gives one iterator whatever the input. next(it, None) takes the first item (or None when there
      is none) and advances the iterator, so list(it) collects exactly the remaining items. Indexing would
      fail for zip and other iterators.

  - id: count-without-for
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      To prove you know what a `for` loop does, write `count_matches(iterable, target)` that **returns** how
      many items equal `target` — **without** using a `for` loop or a comprehension. Use `iter()`, `next()`,
      a `while` loop and `StopIteration`.
    starterCode: |
      def count_matches(iterable, target):
          # No for loops! Use iter(), a while loop, next() and except StopIteration.
          pass


      print(count_matches([3, 1, 3, 3, 2], 3))
      print(count_matches("banana", "a"))
    solution: |
      def count_matches(iterable, target):
          it = iter(iterable)
          count = 0
          while True:
              try:
                  item = next(it)
              except StopIteration:
                  break
              if item == target:
                  count += 1
          return count


      print(count_matches([3, 1, 3, 3, 2], 3))
      print(count_matches("banana", "a"))
    expectedOutput: |
      3
      3
    tests:
      - name: counts in lists and strings
        code: |
          assert count_matches([3, 1, 3, 3, 2], 3) == 3, f"count_matches([3, 1, 3, 3, 2], 3) returned {count_matches([3, 1, 3, 3, 2], 3)!r}."
          assert count_matches("banana", "n") == 2, f"count_matches('banana', 'n') returned {count_matches('banana', 'n')!r}."
          assert count_matches([], 1) == 0, "An empty iterable has 0 matches."
      - name: works with iterators
        code: |
          assert count_matches(map(abs, [-1, 1, 2]), 1) == 2, "count_matches should work with any iterable, including map objects."
      - name: no for loops or comprehensions
        code: |
          assert not uses("For", "ListComp", "SetComp", "DictComp", "GeneratorExp"), "Don't use a for loop or a comprehension — drive the iterator yourself with while and next()."
          assert uses("While") and calls("next"), "Use a while loop that calls next()."
          assert not calls("count"), "Don't use the .count() method — the point is to iterate by hand."
    hints:
      - "Get an iterator first: it = iter(iterable)."
      - Inside `while True:`, put `item = next(it)` in a try block and `break` in `except StopIteration:`.
      - After the try/except, compare item with target and add 1 to a counter. Return the counter after the loop.
    feedback:
      - when: { errorType: StopIteration }
        message: StopIteration escaped your function. Catch it with try/except and break out of the loop.
      - when: { errorType: TypeError, errorMessageContains: "not an iterator" }
        message: Call iter() on the input first; next() needs an iterator, not a list or string.
    explanation: >-
      This is exactly what for does internally: get an iterator once, call next() repeatedly, and stop
      when StopIteration is raised. Because it only relies on the protocol, the function works for lists,
      strings, maps and any other iterable.

