cheatsheet: |
  ```python
  it = iter(iterable)          # get an iterator (lists, str, dict, range, file...)
  next(it)                     # next item, or StopIteration
  next(it, default)            # next item, or default when exhausted
  iter(it) is it               # True: iterators return themselves

  # what `for x in data: body` does
  it = iter(data)
  while True:
      try:
          x = next(it)
      except StopIteration:
          break
      body

  pairs = list(zip(a, b))      # keep single-use results to reuse them
  ```
  - Iterators (single-use): zip, map, filter, enumerate, reversed, files, generators
  - Reusable iterables: list, tuple, str, dict, set, range (a lazy sequence)
  - Don't add/remove items while iterating; build a new collection instead
