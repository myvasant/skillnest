  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **What `with` expands to.** The language reference defines `with EXPR as TARGET: SUITE` as
          semantically equivalent to this code (simplified slightly):
      - type: code
        language: python
        status: illustrative
        code: |
          manager = (EXPR)
          enter = type(manager).__enter__
          exit = type(manager).__exit__
          value = enter(manager)
          hit_except = False

          try:
              TARGET = value
              SUITE
          except:
              hit_except = True
              if not exit(manager, *sys.exc_info()):
                  raise
          finally:
              if not hit_except:
                  exit(manager, None, None, None)
        caption: From the language reference. Not runnable as written — EXPR, TARGET and SUITE are placeholders.
      - type: markdown
        body: |
          Three consequences:

          1. **The methods are looked up on the type**, not the instance (like all special methods). Setting
             `obj.__exit__ = ...` on one instance has no effect.
          2. **`__enter__` runs before the `try`.** If `__enter__` raises, the block never runs and
             `__exit__` is **not** called — there is nothing to clean up yet.
          3. **`__exit__` sees the exception before any outer `except`**, so cleanup always happens before
             the error is handled elsewhere.
      - type: code
        runnable: true
        code: |
          class Fragile:
              def __enter__(self):
                  raise RuntimeError("could not acquire")

              def __exit__(self, exc_type, exc_value, traceback):
                  print("exit called")
                  return False

          try:
              with Fragile():
                  print("body")
          except RuntimeError as error:
              print("caught:", error)
        expectedOutput: |
          caught: could not acquire
        caption: Neither the body nor __exit__ ran, because entering failed.
      - type: markdown
        body: |
          **How `@contextmanager` works.** It wraps your generator in an object whose `__enter__` calls
          `next(generator)` and returns the yielded value. On a normal exit, `__exit__` calls `next()` again
          and expects the generator to finish (if it yields again: `RuntimeError: generator didn't stop`). On
          an exception, `__exit__` calls `generator.throw(exception)`, which raises it at the `yield`. If the
          generator catches it and finishes, the exception counts as **handled** and is suppressed; if it
          re-raises or lets it escape, it propagates. A `@contextmanager` object is single-use — each call
          of the function creates a fresh one.

          **More of contextlib.** `ExitStack` manages a dynamic number of context managers (for example,
          opening every file in a list) and unwinds them all; `closing(obj)` calls `obj.close()` on exit for
          objects that have `close` but no `with` support; `nullcontext()` is a do-nothing manager for when
          a `with` is required but nothing needs managing. `async with`, used in
          [asyncio](concept:python.asyncio), follows the same protocol with `__aenter__` and `__aexit__`.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `with manager as name:` → `__enter__()` (its return value is bound to `name`), run the block,
            then **always** `__exit__()` — on normal exit, exception, `return`, `break` or `continue`.
          - `__exit__(self, exc_type, exc_value, traceback)`: all `None` if no exception. Return
            False/None to let an exception propagate (normal); True suppresses it.
          - If `__enter__` raises, `__exit__` is not called.
          - `@contextmanager`: setup, `yield value`, cleanup — and wrap the `yield` in `try`/`finally`.
          - Use them for files, locks, connections, timers (inject the clock), temporary state
            (`redirect_stdout`, `chdir`) and `suppress(SpecificError)`.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What does `with` do, and how would you write your own context manager?" Describe the protocol
          and the guarantee, write a small class with `__enter__`/`__exit__`, then the `@contextmanager`
          version — and point out the `try`/`finally` around `yield`. Mentioning that a truthy `__exit__`
          return suppresses exceptions shows you understand the details.

items:
  - id: as-target
    type: mcq
    skill: recognition
    prompt: "In `with Manager() as m:`, what is bound to the name `m`?"
    explanation: >-
      Python binds the return value of the manager's __enter__ method to the as name. It is often the manager
      itself (when __enter__ returns self, as files do), but it does not have to be.
    options:
      - id: a
        text: The value returned by Manager()'s __enter__ method.
        correct: true
        feedback: Right — that is why a forgotten `return self` gives you None.
      - id: b
        text: Always the Manager object itself.
        feedback: Only when __enter__ returns self. In the Resource example, __enter__ returned a string and m was that string.
      - id: c
        text: The value returned by __exit__.
        feedback: __exit__ runs after the block, and its return value decides whether an exception is suppressed.
      - id: d
        text: True if setup succeeded, False otherwise.
        feedback: If setup fails, __enter__ raises and the block doesn't run at all; nothing is bound.

  - id: predict-exit-exception
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      class Logger:
          def __enter__(self):
              print("start")
              return self

          def __exit__(self, exc_type, exc_value, traceback):
              print("stop")

      try:
          with Logger():
              print("working")
              1 / 0
              print("unreachable")
      except ZeroDivisionError:
          print("caught")
    answer: |
      start
      working
      stop
      caught
    explanation: >-
      The block stops at 1 / 0. Python then calls __exit__ (printing stop). __exit__ returns None — falsy —
      so the ZeroDivisionError continues to the except clause, which prints caught.
    wrongAnswers:
      - answer: |
          start
          working
          caught
        feedback: __exit__ is called even when the block raises — that is the whole point of with.
      - answer: |
          start
          working
          caught
          stop
        feedback: __exit__ runs as the exception leaves the with block, before any outer except clause sees it.
      - answer: |
          start
          working
          stop
        feedback: >-
          __exit__ returns None (it has no return statement), which is falsy, so the exception is not
          suppressed and reaches the except clause.
      - answer: |
          start
          working
          unreachable
          stop
          caught
        feedback: The rest of the block is skipped once 1 / 0 raises.

  - id: explain-finally
    type: explain
    skill: explanation
    difficulty: 2
    prompt: >-
      In the first tag() example, the closing tag disappeared when the block raised. Explain why, and why
      wrapping the yield in try/finally fixes it.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Explains that the code before yield runs on enter and the code after yield runs on exit.
      - Explains that when the with block raises, contextmanager re-raises the exception inside the generator at the yield line.
      - Explains that without try/finally nothing catches it there, so the generator stops and the lines after yield are skipped.
      - Explains that a finally block runs whether or not an exception occurred, so the cleanup always happens and the exception still propagates.
    modelAnswer: |
      With @contextmanager, the generator's code up to yield is the setup and the code after yield is the
      cleanup. When the with block raises, the context manager does not simply resume the generator; it
      raises the same exception inside the generator, at the yield. In the first version nothing catches it
      there, so the generator stops at that line and the closing print never runs. Wrapping yield in
      try/finally means the finally block runs on both paths — after a normal block and when the exception
      arrives — so the cleanup always happens, and because finally does not catch the exception, it still
      propagates to the caller.

