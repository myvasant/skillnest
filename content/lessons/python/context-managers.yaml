  - id: section-logger
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a class-based context manager `Section(title, log)` that records what happens in a shared list
      `log`:

      - `__enter__` appends `"start <title>"` and returns the Section itself;
      - `__exit__` appends `"end <title>"` if the block finished normally, or
        `"error <title>: <ExceptionClassName>"` if it raised;
      - it must **never** suppress exceptions.

      The program should print:

      ```text
      ['start load', 'working', 'end load', 'start save', 'error save: OSError', 'handled']
      ```
    starterCode: |
      class Section:
          def __init__(self, title, log):
              self.title = title
              self.log = log

          def __enter__(self):
              pass

          def __exit__(self, exc_type, exc_value, traceback):
              pass


      log = []
      with Section("load", log):
          log.append("working")
      try:
          with Section("save", log):
              raise OSError("disk full")
      except OSError:
          log.append("handled")
      print(log)
    solution: |
      class Section:
          def __init__(self, title, log):
              self.title = title
              self.log = log

          def __enter__(self):
              self.log.append(f"start {self.title}")
              return self

          def __exit__(self, exc_type, exc_value, traceback):
              if exc_type is None:
                  self.log.append(f"end {self.title}")
              else:
                  self.log.append(f"error {self.title}: {exc_type.__name__}")
              return False


      log = []
      with Section("load", log):
          log.append("working")
      try:
          with Section("save", log):
              raise OSError("disk full")
      except OSError:
          log.append("handled")
      print(log)
    expectedOutput: |
      ['start load', 'working', 'end load', 'start save', 'error save: OSError', 'handled']
    tests:
      - name: normal block is logged
        code: |
          events = []
          with Section("x", events):
              events.append("body")
          assert events == ["start x", "body", "end x"], f"Expected ['start x', 'body', 'end x'], got {events}."
      - name: as receives the Section itself
        code: |
          with Section("y", []) as s:
              pass
          assert isinstance(s, Section), f"`as` received {s!r}. __enter__ should return self."
      - name: failing block is logged and the exception still propagates
        code: |
          events = []
          try:
              with Section("z", events):
                  raise ValueError("boom")
          except ValueError:
              pass
          else:
              raise AssertionError("The ValueError disappeared. __exit__ must return False (or None) so exceptions propagate.")
          assert events == ["start z", "error z: ValueError"], f"Expected ['start z', 'error z: ValueError'], got {events}."
      - name: prints the log
        code: |
          assert output().strip() == "['start load', 'working', 'end load', 'start save', 'error save: OSError', 'handled']", f"Your program printed {output()!r}."
    hints:
      - "`__enter__` appends `f\"start {self.title}\"` and ends with `return self`."
      - "`exc_type` is None when the block finished normally; otherwise `exc_type.__name__` is the class name, e.g. 'OSError'."
      - End __exit__ with `return False` so exceptions are never swallowed.
    feedback:
      - when: { outputContains: "'end save'" }
        message: 'When the block raises, __exit__ should record "error <title>: <ExceptionClassName>" instead of "end <title>". Check exc_type.'
      - when: { errorMessageContains: "NoneType" }
        message: Something received None — make __enter__ return self.
    explanation: >-
      __enter__ records the start and returns self. __exit__ distinguishes the two paths through exc_type,
      records the right line, and returns False so the OSError still reaches the except clause that logs
      "handled".

