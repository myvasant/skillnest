cheatsheet: |
  ```python
  with open("data.txt") as f:            # __enter__ -> f; __exit__ always closes
      text = f.read()

  class Managed:
      def __enter__(self):
          # setup
          return self                    # bound by `as`
      def __exit__(self, exc_type, exc_value, traceback):
          # cleanup; args are None if no exception
          return False                   # True would SUPPRESS the exception

  from contextlib import contextmanager, suppress, redirect_stdout, chdir
  @contextmanager
  def managed():
      # setup
      try:
          yield "value"                  # bound by `as`
      finally:
          ...                            # cleanup, runs on every path

  with suppress(FileNotFoundError):      # ignore ONE specific, expected error
      os.remove("cache.tmp")
  ```
  - `with a(), b():` → enter a, enter b … exit b, exit a
  - `__enter__` raises → block and `__exit__` do not run
  - `with timer:` (no call) → "'function' object does not support the context manager protocol"
