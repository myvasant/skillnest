  - id: temporarily
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      Write a generator-based context manager `temporarily(config, key, value)` using `@contextmanager`. For
      the duration of the block it sets `config[key] = value`; afterwards it restores the original value —
      **even if the block raises** — and lets any exception propagate. If `key` was not in `config` before,
      remove it afterwards.

      The program should print `inside: True` and then `after: False`.
    starterCode: |
      from contextlib import contextmanager


      # Write temporarily here.


      settings = {"debug": False}
      with temporarily(settings, "debug", True):
          print("inside:", settings["debug"])
      print("after:", settings["debug"])
    solution: |
      from contextlib import contextmanager


      @contextmanager
      def temporarily(config, key, value):
          had_key = key in config
          old = config.get(key)
          config[key] = value
          try:
              yield config
          finally:
              if had_key:
                  config[key] = old
              else:
                  del config[key]


      settings = {"debug": False}
      with temporarily(settings, "debug", True):
          print("inside:", settings["debug"])
      print("after:", settings["debug"])
    expectedOutput: |
      inside: True
      after: False
    tests:
      - name: sets the value inside and restores it after
        code: |
          cfg = {"level": 1}
          with temporarily(cfg, "level", 5):
              assert cfg["level"] == 5, "Inside the block config[key] should be the temporary value."
          assert cfg == {"level": 1}, f"After the block the dict should be back to {{'level': 1}}, got {cfg}."
      - name: restores even when the block raises, and does not swallow the error
        code: |
          cfg = {"level": 1}
          try:
              with temporarily(cfg, "level", 9):
                  raise RuntimeError("boom")
          except RuntimeError:
              pass
          else:
              raise AssertionError("The RuntimeError disappeared — the exception must propagate.")
          assert cfg == {"level": 1}, f"After an error the original value must be restored, got {cfg}."
      - name: removes a key that did not exist before
        code: |
          cfg = {}
          with temporarily(cfg, "verbose", True):
              assert cfg.get("verbose") is True, "Inside the block the new key should exist."
          assert cfg == {}, f"A key that was not there before should be removed afterwards, got {cfg}."
      - name: built with @contextmanager and try/finally
        code: |
          import ast
          func = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == "temporarily")
          names = [d.id if isinstance(d, ast.Name) else getattr(d, "attr", "") for d in func.decorator_list]
          assert "contextmanager" in names, "Decorate temporarily with @contextmanager."
          assert any(isinstance(n, ast.Try) and n.finalbody for n in ast.walk(func)), "Put the yield inside try: ... finally: so the restore always runs."
      - name: prints the two lines
        code: |
          assert output_lines() == ["inside: True", "after: False"], f"Your program printed {output()!r}."
    hints:
      - "Before yielding, remember whether the key existed (`key in config`) and its old value."
      - "Set the new value, then `try: yield` … `finally:` restore — the finally block runs on both paths."
      - "To remove a key that was new: `del config[key]`."
    feedback:
      - when: { errorMessageContains: "does not support the context manager protocol" }
        message: Decorate the function with @contextmanager so calling it returns a context manager.
      - when: { errorMessageContains: "generator didn't yield" }
        message: The generator must reach a yield — the block runs at that point.
      - when: { errorType: KeyError }
        message: Reading config[key] fails for a key that doesn't exist yet. Use key in config and config.get(key) first.
    explanation: >-
      The setup records the original state, applies the change and yields. Because the yield sits inside
      try/finally, the restore runs after a normal block and also when an exception is thrown in at the
      yield; finally does not catch the exception, so it still propagates.

  - id: parsons-contextmanager
    type: parsons
    skill: implementation
    prompt: |
