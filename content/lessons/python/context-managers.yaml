    url: https://docs.python.org/3/reference/compound_stmts.html#the-with-statement
    publisher: Python Software Foundation
  - title: "Python Language Reference: With Statement Context Managers"
    url: https://docs.python.org/3/reference/datamodel.html#with-statement-context-managers
    publisher: Python Software Foundation
  - title: contextlib — Utilities for with-statement contexts
    url: https://docs.python.org/3/library/contextlib.html
    publisher: Python Software Foundation
  - title: "Built-in Types: Context Manager Types"
    url: https://docs.python.org/3/library/stdtypes.html#context-manager-types
    publisher: Python Software Foundation
  - title: "PEP 343: The with Statement"
    url: https://peps.python.org/pep-0343/
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why cleanup needs a guarantee
    kind: why
    blocks:
      - type: markdown
        body: |
          Many resources must be **given back** after use: an open file, a network connection, a lock, a
          temporary setting. The obvious code — open, use, close — has a hole in it. If anything fails in
          the middle, the closing line never runs:
      - type: code
        runnable: true
        code: |
          f = open("notes.txt", "w")
          try:
              f.write("first line\n")
              count = int("ten")          # fails before close() is reached
              f.close()
          except ValueError:
              print("something went wrong")
          print("file closed?", f.closed)
        expectedOutput: |
          something went wrong
          file closed? False
        caption: The error skipped f.close(). The file stays open — and text written to it may not have been saved yet.
      - type: markdown
        body: |
          One leaked file is harmless in a tiny script. In a server that runs for weeks, leaked files,
          connections and locks pile up until the program fails with errors like "too many open files", or
          freezes waiting for a lock nobody released.

          You could write `try`/`finally` around every use — and must remember to, every time. The `with`
          statement packages that guarantee so you can't forget it:
      - type: code
        runnable: true
        code: |
          try:
              with open("notes.txt", "w") as f:
                  f.write("first line\n")
                  count = int("ten")      # fails inside the block
          except ValueError:
              print("something went wrong")
          print("file closed?", f.closed)
        expectedOutput: |
          something went wrong
          file closed? True
        annotations:
          - line: 2
            text: The file object is a context manager. with promises to close it when the block ends — however it ends.
          - line: 4
            text: The block is interrupted by the error, but the file is closed before the exception reaches except.

  - id: with-statement
    title: What the with statement does
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [context manager](glossary:context-manager) is an object that knows how to set something up and
          how to clean it up. The [with statement](glossary:with-statement) uses one like this:

          ```text
          with EXPRESSION as NAME:
              BLOCK
          ```

          1. **Evaluate** `EXPRESSION` to get the context manager.
          2. **Enter:** call its `__enter__()` method, and bind **whatever it returns** to `NAME` (the
             `as NAME` part is optional).
          3. **Run** the block.
          4. **Exit:** call its `__exit__()` method — **always**, whether the block finished normally, raised
             an exception, or left early with `return`, `break` or `continue`.

          You can manage several resources in one statement. They are entered left to right and exited in
          the **reverse** order, like nested `with` blocks:
      - type: code
        runnable: true
        code: |
          with open("source.txt", "w") as f:
              f.write("alpha\nbeta\n")

          with open("source.txt") as src, open("copy.txt", "w") as dst:
              for line in src:
                  dst.write(line.upper())

          with open("copy.txt") as f:
              print(f.read(), end="")
          print(src.closed, dst.closed)
        expectedOutput: |
          ALPHA
          BETA
          True True
        annotations:
          - line: 4
            text: Two context managers in one with statement. dst is closed first, then src.
      - type: callout
        variant: analogy
        title: "Mental model: a try/finally you cannot forget"
        body: |
          Picture `with` as a `try`/`finally` that the *object* brings along: `__enter__` is the code before
          the `try`, the block is the `try` body, and `__exit__` is the `finally`. That model is accurate for
          everything in this lesson; the one extra power `__exit__` has — seeing the exception and choosing
          to swallow it — is covered below, and the exact expansion is in the deep dive.
          - line: 10
            text: The names still exist after the block, but both files have been closed.
      - type: callout
        variant: tip
        title: Long with statements
        body: |
          Since Python 3.10 you can wrap several managers in parentheses and put each on its own line:

          ```python
          with (
              open("source.txt") as src,
              open("copy.txt", "w") as dst,
          ):
              ...
          ```

  - id: protocol
    title: "The protocol: __enter__ and __exit__"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Any object becomes a context manager by defining two methods:

          | Method | Called | Its return value |
          |---|---|---|
          | `__enter__(self)` | at the start of the `with` | is bound to the `as` name |
          | `__exit__(self, exc_type, exc_value, traceback)` | at the end, always | true → swallow the exception; false/None → let it continue |

          When the block finishes normally, the three `__exit__` arguments are all `None`. Step through this
          program and watch the frames appear in order — enter, the block, exit:
      - type: visualization
        component: python-tracer
        title: Enter, block, exit
        caption: >-
          The with line calls __enter__; its return value — the string, not the Resource object — is bound
          to value. After the block, Python calls __exit__ with three None arguments.
        props:
          code: |
            class Resource:
                def __enter__(self):
                    print("setup")
                    return "the resource"

                def __exit__(self, exc_type, exc_value, traceback):
                    print("cleanup")
                    return False

                def __repr__(self):
                    return "Resource()"

            with Resource() as value:
                print("using", value)
            print("done")
      - type: markdown
        body: |
          Most context managers return **themselves** from `__enter__`, so `as` gives you the manager.
          Files do exactly that, which is why `with open(...) as f` gives you the file. Here is the common
          shape:
      - type: code
        runnable: true
        code: |
          class Announce:
              def __init__(self, name):
                  self.name = name

              def __enter__(self):
                  print("enter", self.name)
                  return self

              def __exit__(self, exc_type, exc_value, traceback):
                  print("exit", self.name, "| exception:", exc_type)
                  return False

          with Announce("A") as a:
              print("inside, using", a.name)
          print("after the block")
        expectedOutput: |
          enter A
          inside, using A
          exit A | exception: None
          after the block
        annotations:
          - line: 7
            text: Return self so that `as a` gives you this object.
          - line: 11
            text: False means "I did not handle any exception" — the normal choice.
      - type: item
        ref: as-target

  - id: exceptions
    title: Exceptions inside the block
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          If the block raises, Python stops running the block and calls `__exit__` **with details of the
          exception** — its class, the exception object and the traceback. `__exit__` can do its cleanup,
          and then its return value decides what happens next:

          - return `False` or `None` (or nothing) → the exception **continues** to propagate, exactly as if
            there had been no `with` — this is what you want almost always;
          - return `True` → the exception is **suppressed**: the program carries on after the `with` block.
            The rest of the block is still skipped.
      - type: code
        runnable: true
        code: |
          class Guard:
              def __init__(self, swallow):
                  self.swallow = swallow

              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc_value, traceback):
                  if exc_type is not None:
                      print("__exit__ saw:", exc_type.__name__, "-", exc_value)
                  return self.swallow

          with Guard(swallow=True):
              raise KeyError("missing")
          print("suppressed, program continues")

          try:
              with Guard(swallow=False):
                  raise ValueError("bad value")
          except ValueError:
              print("propagated to the caller")
        expectedOutput: |
          __exit__ saw: KeyError - 'missing'
          suppressed, program continues
          __exit__ saw: ValueError - bad value
          propagated to the caller
        annotations:
          - line: 9
            text: exc_type is None when the block finished without an exception.
          - line: 11
            text: The return value is the decision. True swallows; False lets it propagate.
          - line: 19
            text: __exit__ runs first, and only then does the exception reach this except.
      - type: callout
        variant: warning
        title: Swallowing exceptions is rarely right
        body: |
          A context manager that returns `True` hides every error raised in its block — bugs included. Only
          suppress when that is the manager's documented purpose and the exception type is specific (see
          `contextlib.suppress` below). Watch out for accidentally truthy returns: an `__exit__` that ends
          with `return self` swallows everything.
      - type: item
        ref: predict-exit-exception
      - type: markdown
        body: |
          **Every way out of the block counts.** `return`, `break` and `continue` also trigger `__exit__`.
          Here the function returns from *inside* the block, and the cleanup still runs first:
      - type: code
        runnable: true
        code: |
          class Announce:
              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc_value, traceback):
                  print("exit runs")
                  return False

          def find(items, target):
              with Announce():
                  for item in items:
                      if item == target:
                          return "found " + item
              return "not found"

          print(find(["a", "b"], "b"))
        expectedOutput: |
          exit runs
          found b
        caption: "__exit__ runs on the way out of the function, before the caller receives the return value."

  - id: contextmanager
    title: Writing context managers with @contextmanager
    kind: concept
    blocks:
      - type: markdown
        body: |
          Writing a class with two special methods is a lot of ceremony for "do X before, Y after".
          [`contextlib.contextmanager`](glossary:contextmanager-decorator) turns a
          [generator](glossary:generator) function into a context manager instead:

          - code **before** the `yield` is the setup (`__enter__`);
          - the **yielded value** is what `as` receives;
          - code **after** the `yield` is the cleanup (`__exit__`).

          The generator must yield exactly once. And there is one rule you must not skip — watch what happens
          without it:
      - type: code
        runnable: true
        code: |
          from contextlib import contextmanager

          @contextmanager
          def tag(name):
              print(f"<{name}>")
              yield
              print(f"</{name}>")

          with tag("p"):
              print("hello")

          try:
              with tag("p"):
                  raise ValueError("oops")
          except ValueError:
              print("caught")
        expectedOutput: |
          <p>
          hello
          </p>
          <p>
          caught
        caption: The second time, the closing tag never appears — cleanup was skipped.
      - type: markdown
        body: |
          When the block raises, `contextmanager` re-raises the exception **inside the generator, at the
          `yield` line**. Nothing catches it there, so the generator stops and the lines after `yield` never
          run. The fix is the same tool that guarantees cleanup anywhere: `try`/`finally` around the `yield`.
      - type: code
        runnable: true
        code: |
          from contextlib import contextmanager

          @contextmanager
          def tag(name):
              print(f"<{name}>")
              try:
                  yield
              finally:
                  print(f"</{name}>")

          try:
              with tag("p"):
                  raise ValueError("oops")
          except ValueError:
              print("caught")
        expectedOutput: |
          <p>
          </p>
          caught
        annotations:
          - line: 7
            text: An exception from the with block appears here...
          - line: 9
            text: "...and finally runs the cleanup before the exception continues to the caller."
      - type: visualization
        component: python-tracer
        title: The generator pauses at yield
        caption: >-
          The generator runs up to yield and pauses (the step marked return), the block runs in the global
          frame, then the generator resumes after yield for the cleanup. While the generator runs, only its
          own frame is shown, because it is being driven by contextlib's (untraced) code.
        props:
          code: |
            from contextlib import contextmanager

            @contextmanager
            def opened(name):
                print("open", name)
                try:
                    yield name.upper()
                finally:
                    print("close", name)

            with opened("report") as handle:
                print("writing to", handle)
            print("done")
      - type: item
        ref: explain-finally

  - id: uses
    title: Practical uses
    kind: application
    blocks:
      - type: markdown
        body: |
          The pattern "set up, run the block, always undo" appears everywhere. A few you will meet often:

          ### Timing a block — with a clock you can replace

          A timer reads a clock on enter and on exit. Passing the clock **in** (instead of calling
          `time.perf_counter()` directly) means tests can use a fake clock and get exact, repeatable results:
      - type: code
        runnable: true
        code: |
          class Timer:
              def __init__(self, clock):
                  self.clock = clock
                  self.elapsed = None

              def __enter__(self):
                  self.start = self.clock()
                  return self

              def __exit__(self, exc_type, exc_value, traceback):
                  self.elapsed = self.clock() - self.start
                  return False

          readings = iter([100.0, 102.5])

          def fake_clock():
              return next(readings)

          with Timer(fake_clock) as t:
              total = sum(range(1000))
          print(total, t.elapsed)
        expectedOutput: |
          499500 2.5
        annotations:
          - line: 14
            text: A fake clock that returns 100.0, then 102.5.
          - line: 19
            text: In real code you would pass time.perf_counter instead of fake_clock.
          - line: 11
            text: Recorded in __exit__, so elapsed is set even if the block raises.
      - type: markdown
        body: |
          ### Temporary changes that are always undone

          The standard library includes managers that change some global state for the duration of a block
          and restore it afterwards. `redirect_stdout` captures everything printed; `chdir` (Python 3.11+)
          changes the current working directory:
      - type: code
        runnable: true
        code: |
          import io
          import os
          from contextlib import chdir, redirect_stdout

          buffer = io.StringIO()
          with redirect_stdout(buffer):
              print("this goes into the buffer")
          print("captured:", buffer.getvalue().strip())

          os.makedirs("reports", exist_ok=True)
          start = os.getcwd()
          with chdir("reports"):
              print("now in", os.path.basename(os.getcwd()))
          print("back where we started:", os.getcwd() == start)
        expectedOutput: |
          captured: this goes into the buffer
          now in reports
          back where we started: True
        annotations:
          - line: 6
            text: Inside the block, print writes to the StringIO object instead of the screen.
          - line: 12
            text: The working directory is restored on exit, even if the block fails.
      - type: markdown
        body: |
          ### Locks, connections and transactions

          In [threaded code](concept:python.threading), a lock must be released even if the protected code
          raises — otherwise every other thread waits forever. Locks are context managers, so you write:
      - type: code
        language: python
        status: illustrative
        code: |
          import threading

          lock = threading.Lock()
          balance = 0

          def deposit(amount):
              global balance
              with lock:                # acquire; released automatically, even on error
                  balance += amount
        caption: Illustrative only — threads are not available in the browser runtime.
      - type: markdown
        body: |
          Database libraries use the same idea for transactions: `with connection:` commits if the block
          succeeds and rolls back if it raises. Whenever an API gives you something you must "close",
          "release" or "undo", look for a context manager.

  - id: suppress
    title: Ignoring one expected exception with suppress
    kind: concept
    blocks:
      - type: markdown
        body: |
          Sometimes an exception is genuinely expected and harmless: deleting a cache file that might not
          exist, for example. `contextlib.suppress(ExceptionType)` is a ready-made context manager whose
          `__exit__` returns True for exactly that exception type — a shorter, clearer form of
          `try: ... except FileNotFoundError: pass`:
      - type: code
        runnable: true
        code: |
          import os
          from contextlib import suppress

          with suppress(FileNotFoundError):
              os.remove("old-cache.txt")      # fine if the file doesn't exist
          print("carried on")
        expectedOutput: |
          carried on
      - type: callout
        variant: warning
        title: Suppress narrowly
        body: |
          Name the most specific exception that you really expect, and keep the block to the one statement
          that may raise it. `suppress(Exception)` around many lines hides real bugs, just like a bare
          `except: pass`.
      - type: item
        ref: predict-suppress

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: 'Timer' object does not support the context manager protocol (missed __exit__ method)` | The class lacks `__exit__` (or `__enter__`, as the message says) | Define both methods |
          | Same message but about a `'function' object` | `with timer:` instead of `with timer():` — you passed the function, not the manager it returns | Call it: `with timer():` |
          | `AttributeError: 'NoneType' object has no attribute 'write'` | `__enter__` forgot `return self`, so `as` received None | `return self` (or whatever `as` should receive) |
          | `TypeError: Timer.__exit__() takes 1 positional argument but 4 were given` | `__exit__` must accept the three exception arguments | `def __exit__(self, exc_type, exc_value, traceback):` |
          | `ValueError: I/O operation on closed file.` | Using a file after its `with` block ended | Do all the work inside the block |
          | Cleanup is skipped when the block fails | `@contextmanager` generator without `try`/`finally` around `yield` | Wrap the `yield` in `try:` … `finally:` |
          | Errors silently disappear | `__exit__` returns True or another truthy value | Return False/None unless suppression is the purpose |
          | `RuntimeError: generator didn't stop` | The generator yields more than once | Yield exactly once |
          | `RuntimeError: generator didn't yield` | The generator returns before reaching `yield` | Make sure every path reaches the single `yield` |
      - type: code
        runnable: true
        code: |
          class Timer:
              def __enter__(self):
                  return self

          with Timer():
              print("working")
        expectError: TypeError
        caption: Python checks for both methods before running the block, so "working" is never printed.
      - type: code
        runnable: true
        code: |
          with open("log.txt", "w") as log:
              log.write("started\n")
          log.write("finished\n")
        expectError: ValueError
        caption: The second write happens after the block — the file has already been closed.
      - type: item
        ref: mcq-protocol-error

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          Each exercise is checked on both paths: when the block succeeds and when it raises. Cleanup must
          happen in both, and exceptions must not disappear.
      - type: item
        ref: section-logger
      - type: item
        ref: debug-enter-return
      - type: item
        ref: temporarily
      - type: item
