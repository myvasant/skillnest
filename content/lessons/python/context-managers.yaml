  - id: m-code-stopwatch
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a class-based context manager `Stopwatch(clock)`. `clock` is a function returning the current
      time in seconds.

      - `__enter__` reads the clock, stores the start time and returns the Stopwatch;
      - `__exit__` sets the attribute `elapsed` to the time since the start — **even if the block raised** —
        and never suppresses exceptions.

      With the fake clock in the starter, the program prints `elapsed: 1.5`.
    starterCode: |
      # Write Stopwatch here.


      ticks = iter([10.0, 11.5])

      def fake_clock():
          return next(ticks)

      with Stopwatch(fake_clock) as sw:
          pass
      print("elapsed:", sw.elapsed)
    solution: |
      class Stopwatch:
          def __init__(self, clock):
              self.clock = clock
              self.elapsed = None

          def __enter__(self):
              self.start = self.clock()
              return self

          def __exit__(self, exc_type, exc_value, traceback):
              self.elapsed = self.clock() - self.start
              return False


      ticks = iter([10.0, 11.5])

      def fake_clock():
          return next(ticks)

      with Stopwatch(fake_clock) as sw:
          pass
      print("elapsed:", sw.elapsed)
    expectedOutput: |
      elapsed: 1.5
    tests:
      - name: measures any interval
        code: |
          readings = iter([3.0, 7.25])
          with Stopwatch(lambda: next(readings)) as s:
              pass
          assert isinstance(s, Stopwatch), "__enter__ should return the Stopwatch itself."
          assert s.elapsed == 4.25, f"Clock read 3.0 then 7.25, so elapsed should be 4.25, got {s.elapsed!r}."
      - name: records elapsed even when the block raises, without swallowing it
        code: |
          readings = iter([1.0, 2.0])
          watch = Stopwatch(lambda: next(readings))
          try:
              with watch:
                  raise KeyError("oops")
          except KeyError:
              pass
          else:
              raise AssertionError("The KeyError disappeared — __exit__ must not suppress exceptions.")
          assert watch.elapsed == 1.0, f"elapsed should be recorded even after an error (1.0), got {watch.elapsed!r}."
      - name: prints the result
        code: |
          assert output().strip() == "elapsed: 1.5", f"Your program printed {output()!r}."
    hints:
      - Store the clock function in __init__ — don't call it yet.
      - "`__enter__`: `self.start = self.clock()` then `return self`."
      - "`__exit__(self, exc_type, exc_value, traceback)`: compute `self.clock() - self.start`, then `return False`."
    feedback:
      - when: { errorMessageContains: "takes 1 positional argument but 4 were given" }
        message: __exit__ receives three extra arguments — define it as __exit__(self, exc_type, exc_value, traceback).
      - when: { errorType: StopIteration }
        message: The fake clock only has two readings. Read the clock exactly once in __enter__ and once in __exit__.
    explanation: >-
      Taking the clock as a parameter makes the stopwatch deterministic to test. Recording elapsed in
      __exit__ means it happens on every path out of the block, and returning False lets exceptions
      continue to the caller.

