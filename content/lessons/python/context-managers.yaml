id: python.context-managers
concept: python.context-managers
title: Context Managers and the with Statement
subtitle: Guaranteed cleanup, even when things go wrong
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  The with statement guarantees that cleanup code — closing a file, releasing a lock, restoring a
  setting — runs no matter how a block ends. Learn the exact protocol (__enter__ and __exit__), how
  exceptions flow through it, how to write context managers as classes or with @contextmanager, and the
  everyday tools in contextlib.
objectives:
  - Explain what the with statement guarantees and the exact order in which __enter__, the block and __exit__ run.
  - Predict what is bound by `as`, and what happens when the block raises, returns or completes normally.
  - Write a class-based context manager whose __exit__ handles exceptions correctly and does not swallow them by accident.
  - Write a generator-based context manager with @contextmanager and try/finally.
  - Apply context managers to files, timing with an injected clock, temporary state changes and suppressing a specific exception.
sources:
