  - id: m-mcq-truthy-exit
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      A colleague's context manager ends `__exit__` with `return self` "so callers can chain calls". Since
      then, bugs inside `with` blocks seem to vanish without any traceback. Why?
    explanation: >-
      __exit__'s return value is interpreted as "was the exception handled?". Any object (including self) is
      truthy by default, so every exception raised in the block is suppressed. __exit__ should return False
      or None.
    options:
      - id: a
        text: A truthy return value from __exit__ tells Python the exception was handled, so every exception is suppressed.
        correct: true
        feedback: Exactly. Return False (or None) unless suppression is the manager's purpose.
      - id: b
        text: Returning self from __exit__ re-runs the block, which hides the original error.
        feedback: The block never re-runs. The problem is how the return value is interpreted.
      - id: c
        text: __exit__ is not called when it returns a value.
        feedback: __exit__ is always called; its return value is only used afterwards.
      - id: d
        text: Exceptions are only shown when __enter__ returns None.
        feedback: __enter__'s return value only affects what as binds.

  - id: m-tf-enter-raises
