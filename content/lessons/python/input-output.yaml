id: python.input-output
concept: python.input-output
title: Input and Output
subtitle: Talking to the user with input(), print() and f-strings
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  Make programs interactive. input() reads a line the user types — always as a string — print()
  controls exactly how output looks with sep= and end=, and f-strings build readable messages with
  embedded expressions and format specifiers such as :.2f, :>8 and :,.
objectives:
  - Read a line of text with input() and explain why the result is always a str.
  - Convert input with int() or float() before calculating, and tidy text input with strip().
  - Control print() output with the sep= and end= options.
  - Build messages with f-strings containing expressions and format specifiers (:.2f, :>8, :<8, :^8, :,).
  - Write small interactive programs that read input, process it and report results.
