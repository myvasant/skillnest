  - id: explain-shadowing
    type: explain
    skill: explanation
    prompt: >-
      A classmate saved their program as `json.py`. It contains `import json` and then
      `json.dumps({"a": 1})`, which fails with `AttributeError: module 'json' has no attribute 'dumps'`.
      Explain step by step why, and how to fix it.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says that import searches the folders in sys.path in order and uses the first match.
      - Says the script's own folder comes first, so their json.py is found before the standard library's json.
      - Explains that the imported "json" module is therefore their own file, which has no dumps.
      - Gives the fix - rename the file - and mentions json.__file__ as a way to confirm which file was imported.
    modelAnswer: |
      When Python runs `import json` it looks for a module called json in each folder of sys.path, in
      order, and takes the first one it finds. The first folder is the one containing the script being
      run — and that folder contains their own json.py. So `json` refers to their program, not the
      standard library module, and their file defines no dumps function, hence the AttributeError.
      Printing json.__file__ would show the path of their own file. Renaming the program (for example
      to save_data.py) fixes it.

