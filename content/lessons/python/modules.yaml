  - id: m-predict-from-rebind
    type: predict-output
    skill: transfer
    difficulty: 3
    prompt: What does this program print? (The first lines create the module `taxes.py`.)
    code: |
      import sys, importlib

      with open("taxes.py", "w", encoding="utf-8") as f:
          f.write("RATE = 0.2\n\ndef with_tax(amount):\n    return amount * (1 + RATE)\n")
      sys.modules.pop("taxes", None)
      importlib.invalidate_caches()

      from taxes import RATE, with_tax
      RATE = 0.5
      print(with_tax(100))
    answer: "120.0"
    explanation: >-
      `from taxes import RATE` binds a new name RATE in the program to the same float. `RATE = 0.5` rebinds
      only the program's name. with_tax looks up RATE in its own module's namespace, where it is still 0.2,
      so the result is 100 * 1.2 = 120.0.
    wrongAnswers:
      - answer: "150.0"
        feedback: >-
          Rebinding your own RATE does not change the module's RATE. with_tax reads the name in the taxes
          module's namespace. (Setting taxes.RATE = 0.5 would change it.)
      - answer: "120"
        feedback: "1 + RATE is a float (1.2), so the result is the float 120.0."

  - id: m-pip-mismatch
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      You ran `pip install requests` successfully, but `python app.py` fails with
      `ModuleNotFoundError: No module named 'requests'`. What is the most likely cause?
    explanation: >-
      pip installed into the site-packages of some Python installation or virtual environment, but app.py
      is run by a different interpreter whose sys.path does not include that folder.
    options:
      - id: a
        text: The package was installed for a different Python interpreter or environment than the one running app.py.
        correct: true
        feedback: Right. Use `python -m pip install requests` with the same python, or activate the right virtual environment.
      - id: b
        text: Third-party packages must be imported with `from requests import *`.
        feedback: Third-party modules are imported exactly like standard ones; the import form is not the problem.
      - id: c
        text: You must restart the computer after installing.
        feedback: Installing only copies files into site-packages. A new Python process sees them immediately — if it searches that folder.
      - id: d
        text: Modules are cached in sys.modules, so Python remembers that requests was missing.
        feedback: sys.modules caches only within one running program; each `python app.py` starts fresh.

  - id: m-tf-edit-reimport
