      - name: functions still compute their results
        code: |
          import math as _m
          assert hypotenuse(5, 12) == 13.0, "hypotenuse(5, 12) should be 13.0."
          assert _m.isclose(circle_area(1), _m.pi), "circle_area(1) should equal pi — use the pi from the math module, not a typed-in approximation."
          assert "3.14" not in source, "Use math.pi (or import pi) instead of typing 3.14."
    hints:
      - "`from math import sqrt` binds the name sqrt — and nothing else."
      - Which name does circle_area use that was never bound?
