id: python.modules
concept: python.modules
title: Modules and Imports
subtitle: Reusing code across files, the import system, and __main__
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Every .py file is a module. Learn the import forms, what import actually does (find, run once, cache in
  sys.modules, bind a name), where Python looks for modules, how `if __name__ == "__main__":` separates
  script code from library code, why a file called random.py breaks your program, and a first tour of
  math, random and datetime.
objectives:
  - Use `import x`, `from x import y` and `as` aliases, and predict which names each form binds.
  - Explain that a module's code runs once per process, and that later imports reuse the cached module in sys.modules.
  - Describe the module search order (sys.modules, built-ins, sys.path) and diagnose ModuleNotFoundError and shadowing.
  - Write code that runs as a script but stays silent when imported, using `if __name__ == "__main__":`.
  - Use math, random (with a seed) and datetime for everyday tasks.
