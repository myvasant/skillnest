masteryCheck:
  passThreshold: 0.8
  items: [m-predict-from-rebind, m-pip-mismatch, m-tf-edit-reimport, m-code-dice, m-debug-datetime]

cheatsheet: |
  ```python
  import math                  # binds math          -> math.sqrt(16)
  from math import sqrt, pi    # binds sqrt, pi only -> sqrt(16)
  import datetime as dt        # binds dt            -> dt.date(2026, 1, 1)
  from datetime import date    # the class inside the module

  import sys
  sys.modules                  # cache: name -> module (code runs once)
  sys.path                     # folders searched, script folder first
  module.__file__              # which file was really imported?

  def main():
      ...
  if __name__ == "__main__":   # True only when this file is run directly
      main()

  random.seed(42)              # reproducible random numbers (not for security)
  ```
  - ModuleNotFoundError → typo, or installed for another Python (`python -m pip`)
  - AttributeError on a stdlib module → your file shadows it (random.py, json.py…)
  - `TypeError: 'module' object is not callable` → `from datetime import datetime`
