  - id: m-code-dice
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `roll_dice(n, seed)` that seeds the random module with `seed` and **returns** a list of `n`
      die rolls (integers from 1 to 6). Calling it twice with the same seed must give the same list.
    starterCode: |
      import random


      def roll_dice(n, seed):
          # Seed the generator, then roll n times and collect the results in a list.
          pass


      print(roll_dice(5, 42))
    solution: |
      import random


      def roll_dice(n, seed):
          random.seed(seed)
          rolls = []
          for _ in range(n):
              rolls.append(random.randint(1, 6))
          return rolls


      print(roll_dice(5, 42))
    expectedOutput: |
      [6, 1, 1, 6, 3]
    tests:
      - name: returns n rolls between 1 and 6
        code: |
          rolls = roll_dice(20, 7)
          assert isinstance(rolls, list), f"roll_dice should return a list, but returned {rolls!r}."
          assert len(rolls) == 20, f"roll_dice(20, 7) should return 20 rolls, but returned {len(rolls)}."
          assert all(isinstance(r, int) and 1 <= r <= 6 for r in rolls), f"Every roll must be an int from 1 to 6: {rolls!r}."
      - name: same seed gives the same rolls
        code: |
          assert roll_dice(10, 1) == roll_dice(10, 1), "With the same seed, roll_dice must return the same list. Call random.seed(seed) inside the function."
      - name: different seeds give different rolls
        code: |
          assert roll_dice(10, 1) != roll_dice(10, 2), "Different seeds should give different rolls — use the seed parameter, not a fixed number."
      - name: uses random.seed and random.randint
        code: |
          assert calls("seed"), "Call random.seed(seed) so the results are repeatable."
          assert calls("randint") or calls("randrange") or calls("choice"), "Roll each die with random.randint(1, 6)."
    hints:
      - Call random.seed(seed) at the start of the function.
      - "random.randint(1, 6) returns a whole number from 1 to 6 — both ends included."
      - Build the list with a for loop over range(n) and append, then return it.
    feedback:
      - when: { outputEquals: "None\n" }
        message: roll_dice must return the list of rolls.
      - when: { errorType: NameError, errorMessageContains: "randint" }
        message: randint lives in the random module. Write random.randint(1, 6) (or import randint from random).
    explanation: >-
      Seeding resets the pseudo-random generator to a known state, so the same seed always produces the
      same sequence — perfect for tests and reproducible simulations. randint includes both ends.

