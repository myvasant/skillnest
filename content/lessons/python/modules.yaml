  - id: days-between
    type: code
    skill: implementation
    prompt: |
      Write `days_between(start, end)` that takes two dates as ISO strings such as `"2026-10-22"` and
      **returns** the number of days from `start` to `end` (negative if `end` is earlier). Use the
      datetime module — do not calculate month lengths yourself.
    starterCode: |
      from datetime import date


      def days_between(start, end):
          # Turn both strings into date objects, subtract them, and return the days.
          pass


      print(days_between("2026-10-22", "2026-12-25"))
    solution: |
      from datetime import date


      def days_between(start, end):
          first = date.fromisoformat(start)
          last = date.fromisoformat(end)
          return (last - first).days


      print(days_between("2026-10-22", "2026-12-25"))
    expectedOutput: |
      64
    tests:
      - name: 64 days from 22 October to 25 December
        code: |
          result = days_between("2026-10-22", "2026-12-25")
          assert result == 64, f"days_between('2026-10-22', '2026-12-25') should be 64, but got {result!r}."
      - name: handles leap years
        code: |
          result = days_between("2028-02-28", "2028-03-01")
          assert result == 2, f"2028 is a leap year (29 February exists), so the answer is 2, but got {result!r}. Let datetime do the calendar maths."
      - name: negative when end is earlier
        code: |
          result = days_between("2026-01-10", "2026-01-01")
          assert result == -9, f"Going backwards 9 days should give -9, but got {result!r}."
      - name: returns an int
        code: |
          result = days_between("2026-01-01", "2026-01-02")
          assert isinstance(result, int), f"Return the number of days as an int (use .days), not {type(result).__name__}."
    hints:
      - "`date.fromisoformat(\"2026-10-22\")` turns the string into a date object."
      - Subtracting one date from another gives a timedelta.
      - "A timedelta's .days attribute is the whole number of days. Return it."
    feedback:
      - when: { errorType: TypeError, errorMessageContains: "unsupported operand" }
        message: You are subtracting strings. Convert both with date.fromisoformat() first.
      - when: { outputContains: "days," }
        message: You returned the timedelta itself. Return its .days attribute.
      - when: { outputEquals: "None\n" }
        message: days_between must return the result.
    explanation: >-
      date.fromisoformat parses the strings; subtracting dates gives a timedelta whose .days is an int.
      The datetime module knows every month length and leap year, so the function is correct for any pair
      of dates.

  - id: main-guard-exercise
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      This file should work both ways: when **run**, it prints the three demo lines; when **imported**
      by another program, it should only define the two functions and print nothing. Change it so that
      importing it is silent. (The checks really import your code as a module.)
    starterCode: |
      def celsius_to_fahrenheit(c):
          return c * 9 / 5 + 32


      def fahrenheit_to_celsius(f):
          return (f - 32) * 5 / 9


      print("Demo:")
      print(celsius_to_fahrenheit(100))
      print(fahrenheit_to_celsius(32))
    solution: |
      def celsius_to_fahrenheit(c):
          return c * 9 / 5 + 32


      def fahrenheit_to_celsius(f):
          return (f - 32) * 5 / 9


      if __name__ == "__main__":
          print("Demo:")
          print(celsius_to_fahrenheit(100))
          print(fahrenheit_to_celsius(32))
    expectedOutput: |
      Demo:
      212.0
      0.0
    tests:
      - name: running it prints the demo
        code: |
          assert output_lines() == ["Demo:", "212.0", "0.0"], f"When run directly, the program should print the three demo lines, but printed {output()!r}."
      - name: importing it prints nothing
        code: |
          import sys, importlib, io, contextlib
          with open("temperature_check.py", "w", encoding="utf-8") as module_file:
              module_file.write(source)
          sys.modules.pop("temperature_check", None)
          importlib.invalidate_caches()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured):
              module = importlib.import_module("temperature_check")
          assert captured.getvalue() == "", f'Importing your file printed {captured.getvalue()!r}. Put the demo lines under if __name__ == "__main__":'
          assert module.celsius_to_fahrenheit(0) == 32, "The functions must still be defined when the file is imported."
          assert module.fahrenheit_to_celsius(212) == 100, "fahrenheit_to_celsius should still work when imported."
    hints:
      - When the file is imported, __name__ is the module's name; when it is run, it is "__main__".
      - "Add `if __name__ == \"__main__\":` above the demo lines."
      - Indent the three print lines so they are inside the if block. Keep the two functions outside it.
    feedback:
      - when: { outputEquals: "" }
        message: >-
          Now nothing prints even when the file is run. Check the spelling — two underscores on each side:
          if __name__ == "__main__":
      - when: { errorType: IndentationError }
        message: The lines inside the if block must all be indented by the same amount (four spaces).
    explanation: >-
      Under the guard, the demo runs only when __name__ == "__main__", i.e. when the file is the program
      being run. Imported, its __name__ is "temperature_check", so only the def statements execute and the
      functions become available silently.

