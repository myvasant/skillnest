    feedback:
      - when: { errorType: NameError, errorMessageContains: "'pi'" }
        message: You switched to pi, but it is not imported yet. Use `from math import sqrt, pi`.
      - when: { errorType: NameError }
        message: A name is used that no import statement bound. `from math import sqrt` does not bind math.
    explanation: >-
      A from-import only binds the listed names. circle_area refers to math, which was never bound, so the
