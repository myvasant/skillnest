sections:
  - id: why
    title: Why split code into modules?
    kind: why
    blocks:
      - type: markdown
        body: |
          As programs grow, keeping everything in one file stops working: it gets too long to navigate,
          and the useful function you wrote for one project has to be copy-pasted into the next (and then
          fixed in two places). Python's answer is the [module](glossary:module): **any `.py` file can be
          imported by another file**, which then uses its functions and variables.

          Python also ships with hundreds of ready-made modules — the *standard library*. Before writing
          something tricky yourself, check whether a module already does it. Counting the days between two
          dates by hand means handling month lengths and leap years; with the `datetime` module it is one
          line:
      - type: code
        runnable: true
        code: |
          from datetime import date

          today = date(2026, 10, 22)
          holiday = date(2026, 12, 25)
          print((holiday - today).days, "days to go")
        expectedOutput: |
          64 days to go
        annotations:
          - line: 1
            text: Load the datetime module and bind the name date to its date type.
          - line: 5
            text: Subtracting two dates gives a timedelta; .days is the whole number of days.
      - type: markdown
        body: |
          In this lesson you will learn how `import` really works, so that errors like
          `ModuleNotFoundError` or a module that "doesn't have" a function you just saw in the docs stop
          being mysterious.

  - id: import-forms
    title: The three import forms
    kind: concept
    blocks:
      - type: markdown
        body: |
          An [import statement](glossary:import-statement) does two things: it makes sure the module is
          loaded, and it **binds a name** in your file's namespace — exactly like an assignment. The form
          you choose decides *which* name:

          | Statement | Name(s) bound in your file | How you use it |
          |---|---|---|
          | `import math` | `math` → the module object | `math.sqrt(16)` |
          | `from math import sqrt, pi` | `sqrt` and `pi` only | `sqrt(16)` — but `math` is **not** defined |
          | `import datetime as dt` | `dt` → the datetime module | `dt.date(2026, 1, 1)` |
          | `from math import sqrt as root` | `root` → the sqrt function | `root(16)` |

          A module is an ordinary object (of type `module`); its functions and variables are its
          *attributes*, reached with a dot.
      - type: visualization
        component: python-tracer
        title: Imports bind names to objects
        caption: >-
          After line 1 the global frame has a name math referring to a module object. Line 2 adds sqrt
          (a function) and pi (a float) — taken from that module. Line 3 binds dt to the datetime module.
        props:
          code: |
            import math
            from math import sqrt, pi
            import datetime as dt

            root = sqrt(16)
            print(root, pi == math.pi)
            print(dt.date(2026, 1, 1).year)
      - type: markdown
        body: |
          **Which form should you use?** `import math` keeps the origin visible at every use
          (`math.sqrt` tells the reader where `sqrt` comes from) and avoids clashes with your own names.
          `from x import y` is fine for a few frequently used names. Aliases are conventions for long
          names (`import numpy as np` in data science). Avoid `from math import *`, which dumps every
          public name into your file so readers (and tools) can no longer tell where a name came from.
      - type: code
        runnable: true
        code: |
          import math

          print(type(math).__name__)
          print(math.floor(7.8), math.ceil(7.2))
          print("sqrt" in dir(math))
        expectedOutput: |
          module
          7 8
          True
        annotations:
          - line: 5
            text: dir(module) lists the names a module defines — handy for exploring.
      - type: item
        ref: import-binding-mcq

  - id: own-modules
    title: Your own module, and what import really does
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A module is just a `.py` file, so the file `greetings.py` is the module `greetings`. On your own
          computer you would create the file in your editor next to your main script. In this browser we
          create it with `open()` — the virtual file system works the same way.

          When Python executes `import greetings` for the first time, it:

          1. **Finds** `greetings.py` (where it looks is covered below).
          2. **Creates** an empty module object and stores it in [sys.modules](glossary:module-cache), a
             dictionary of every module loaded so far.
          3. **Runs** the file's code from top to bottom inside that module object. Every `def` and
             assignment at the top level becomes an attribute of the module.
          4. **Binds** the name `greetings` in the importing file.

          The second time, step 1 starts by checking `sys.modules` — the module is already there, so
          Python **skips straight to step 4**. The module's code runs once per program run, no matter how
          many times it is imported.
      - type: code
        runnable: true
        code: |
          import sys, importlib

          with open("greetings.py", "w", encoding="utf-8") as f:
              f.write('print("greetings.py is running")\n')
              f.write('def hello(name):\n')
              f.write('    return f"Hello, {name}!"\n')

          sys.modules.pop("greetings", None)   # start fresh on every Run (see note)
          importlib.invalidate_caches()        # a new .py file appeared while running

          import greetings
          import greetings                      # cached: does not run the file again
          from greetings import hello           # also cached

          print(greetings.hello("Ada"))
          print(hello is greetings.hello, "greetings" in sys.modules)
        expectedOutput: |
          greetings.py is running
          Hello, Ada!
          True True
        annotations:
          - line: 3
            text: Writes a three-line module file into the current folder.
          - line: 8
            text: This browser keeps one Python running between Runs, so we remove any cached copy to make every Run behave like a fresh program.
          - line: 9
            text: Tells the import system to look at the folder again, because the file was created after Python started.
          - line: 11
            text: The only import that runs the module's code — "greetings.py is running" prints once.
          - line: 16
            text: Both names refer to the same function object inside the one cached module.
      - type: callout
        variant: misconception
        title: '"Importing a module twice runs it twice"'
        body: |
          It doesn't. The first import runs the module and caches it in `sys.modules`; every later import —
          in the same file or any other module of the same program — gets the cached object. The flip side:
          if you **edit** a module while a program (or an interactive session) is running, `import` will
          not pick up the change. Restart the program, or (rarely) use `importlib.reload(module)`.
      - type: item
        ref: predict-import-twice

  - id: search-path
    title: Where Python looks for modules
    kind: concept
    blocks:
      - type: markdown
        body: |
          For `import name`, Python checks, in order, and **stops at the first match**:

          1. `sys.modules` — already imported?
          2. **Built-in modules** compiled into the interpreter itself, such as `sys` (and, in this browser,
             `math`).
          3. Each folder in the list [sys.path](glossary:module-search-path), in order:
             - the folder containing the script you ran (or the current directory for the interactive
               shell, `python -c` and `python -m`),
             - folders listed in the `PYTHONPATH` environment variable, if set,
             - the standard library,
             - `site-packages`, where `pip` installs third-party packages.

          If nothing matches you get `ModuleNotFoundError: No module named '...'`.
      - type: code
        runnable: true
        code: |
          import sys

          for folder in sys.path:
              print(repr(folder))
        expectedOutput: |
          '/home/pyodide/groundwork'
          ''
          '/lib/python314.zip'
          '/lib/python3.14/lib-dynload'
          '/lib/python3.14/site-packages'
        caption: >-
          In this browser: the first folder holds this website's own runner; '' means "the current
          directory" (/home/pyodide), which is why greetings.py could be imported; then the standard
          library (stored as a zip file), compiled extension modules, and installed packages. On your own
          computer the first entry is your script's folder.
      - type: callout
        variant: production
        title: '"I installed it, but Python says No module named ..."'
        body: |
          Each Python installation (and each [virtual environment](concept:python.virtual-environments))
          has its own `site-packages`. If `pip` installed the package for a different Python than the one
          running your code, the folder is simply not on this `sys.path`. Install with
          `python -m pip install package` using the same `python` you run, and check `sys.executable` to
          see which interpreter that is.
      - type: markdown
        body: |
          Because your script's folder comes **before** the standard library, a file of yours can
          accidentally *shadow* a standard module — the classic mistake covered in the next section but
          one.

  - id: main-guard
    title: Scripts vs modules — `if __name__ == "__main__":`
    kind: concept
    blocks:
      - type: markdown
        body: |
          Every module has a variable `__name__`. Python sets it to:

          - the module's name (`"greetings"`) when the file is **imported**, and
          - the special string `"__main__"` when the file is **run directly** as the program.
      - type: item
        ref: predict-name
      - type: markdown
        body: |
          That difference lets one file be both a useful **library** and a runnable **script**. Put the
          code that should only run as a program under the [main guard](glossary:main-guard):
      - type: code
        runnable: true
        code: |
          import sys, importlib

          with open("temperature.py", "w", encoding="utf-8") as f:
              f.write(
                  "def to_fahrenheit(c):\n"
                  "    return c * 9 / 5 + 32\n"
                  "\n"
                  'if __name__ == "__main__":\n'
                  '    print("Demo: 100 C =", to_fahrenheit(100), "F")\n'
              )

          sys.modules.pop("temperature", None)
          importlib.invalidate_caches()

          import temperature                 # __name__ is "temperature": the demo is skipped
          print(temperature.to_fahrenheit(37))
        expectedOutput: |
          98.6
        annotations:
          - line: 8
            text: Inside temperature.py, this condition is only True when someone runs `python temperature.py`.
          - line: 14
            text: Imported, so __name__ is "temperature" and the demo print never runs.
      - type: markdown
        body: |
          The usual layout puts the program's steps in a `main()` function and calls it from the guard. Step
          through it: `def` lines only **create** functions; nothing inside them runs until the guard calls
          `main()`.
      - type: visualization
        component: python-tracer
        title: Definitions first, then the guard calls main()
        caption: >-
          Lines 1 and 4 bind area and main to function objects. Line 7 checks __name__ (it is "__main__"
          because this is the program being run), then main() gets its own frame and calls area().
        props:
          code: |
            def area(width, height):
                return width * height

            def main():
                print("Area:", area(3, 4))

            if __name__ == "__main__":
                main()
      - type: callout
        variant: tip
        title: Why bother?
        body: |
          Without the guard, `import temperature` from another program — or from a test file — would run
          the demo and print output nobody asked for (or, worse, start a long job or delete files). Testing
          tools such as [pytest](concept:python.testing) import your modules, so the guard matters as soon
          as you write tests.

  - id: shadowing
    title: Shadowing the standard library (the random.py trap)
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          A learner writes a dice game and saves it as **`random.py`**:

          ```python
          # random.py
          import random

          print(random.randint(1, 6))
          ```

          Running it fails. `import random` searches `sys.path`, and the **first** folder is the script's
          own folder, which contains… `random.py`. So the program imports **itself** instead of the
          standard module, and that file has no `randint`. Python 3.13 and later even point at the cause:
      - type: code
        language: text
        code: |
          $ python random.py
          Traceback (most recent call last):
            File "/home/me/random.py", line 1, in <module>
              import random
            File "/home/me/random.py", line 4, in <module>
              print(random.randint(1, 6))
                    ^^^^^^^^^^^^^^
          AttributeError: module 'random' has no attribute 'randint' (consider renaming '/home/me/random.py' since it has the same name as the standard library module named 'random' and prevents importing that standard library module)
        caption: Output of Python 3.13+ on a computer (the hint in brackets is new in 3.13).
      - type: markdown
        body: |
          You can reproduce it here. The extra lines simulate "a project folder whose script directory comes
          first on sys.path", then put everything back so the real `random` keeps working in this browser:
      - type: code
        runnable: true
        code: |
          import os, sys, importlib

          os.makedirs("my_project", exist_ok=True)
          with open("my_project/random.py", "w", encoding="utf-8") as f:
              f.write('print("Oops - running my_project/random.py!")\n')

          folder = os.path.abspath("my_project")
          saved = sys.modules.pop("random", None)   # forget the real module for this demo
          sys.path.insert(0, folder)                 # my_project is now searched first
          importlib.invalidate_caches()
          try:
              import random
              print("random was loaded from", random.__file__)
              print(random.randint(1, 6))
          finally:                                   # undo the demo
              sys.path.remove(folder)
              sys.modules.pop("random", None)
              if saved:
                  sys.modules["random"] = saved
        expectError: AttributeError
        expectedOutput: |
          Oops - running my_project/random.py!
          random was loaded from /home/pyodide/my_project/random.py
        annotations:
          - line: 13
            text: "The best diagnostic: module.__file__ shows which file was really imported."
          - line: 14
            text: AttributeError — the module you got has no randint. (The browser build does not add the 3.13 hint.)
      - type: markdown
        body: |
          **The fix:** rename your file (`dice_game.py`). A leftover `__pycache__/random.cpython-314.pyc` is
          harmless: Python 3 ignores cached bytecode in `__pycache__` once its source file is gone. Common
          culprits: `random.py`, `math.py`, `json.py`, `csv.py`, `email.py`, `test.py`, `string.py`,
          `statistics.py` — and third-party names such as `requests.py` or `numpy.py`. (Modules that are
          built into the interpreter, like `sys`, are found before `sys.path` and cannot be shadowed this
          way.)
      - type: item
        ref: explain-shadowing

  - id: mistakes
    title: Other import errors and how to fix them
    kind: debugging
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `ModuleNotFoundError: No module named 'maths'` | Typo, or the package is not installed for *this* Python | Fix the name; `python -m pip install ...` for the interpreter you run |
          | `ImportError: cannot import name 'sqroot' from 'math'` | The module exists but has no such name | Check spelling and the module's docs (`dir(module)`) |
          | `NameError: name 'math' is not defined` after `from math import sqrt` | `from` imports bind only the listed names | Add `import math`, or import the extra names too |
          | `AttributeError: module 'random' has no attribute 'randint'` | Your own file shadows the module (or a circular import) | Print `module.__file__`; rename your file |
          | `TypeError: 'module' object is not callable` | `import datetime` then `datetime(...)` — the module, not the class | `from datetime import datetime`, or `datetime.datetime(...)` |
          | Output appears when you import a file | Script code at the top level | Move it under `if __name__ == "__main__":` |
          | Edits to a module have no effect | The old version is cached in `sys.modules` | Restart the program (or the interactive session) |
      - type: code
        runnable: true
        code: |
          import maths
        expectError: ModuleNotFoundError
        caption: Run it. The error names exactly the module Python could not find.
      - type: code
        runnable: true
        code: |
          from math import sqroot
        expectError: ImportError
        caption: The module was found, but it has no name sqroot. (The real name is sqrt.)
      - type: item
        ref: debug-import-name

  - id: stdlib-tour
    title: A quick tour of math, random and datetime
    kind: application
    blocks:
      - type: markdown
        body: |
          Three modules you will use constantly (the [standard library lesson](concept:python.stdlib) goes
          much further):

          - **`math`** — `sqrt`, `floor`, `ceil`, `gcd`, `isclose`, constants `pi` and `e`.
          - **`random`** — pseudo-random numbers: `randint(a, b)` (both ends included), `choice(seq)`,
            `shuffle(list)`, `random()` for a float in [0, 1). `random.seed(n)` makes the sequence
            **repeatable**, which is what you want in tests and examples.
          - **`datetime`** — `date`, `datetime` and `timedelta` for calendar arithmetic and formatting.
      - type: code
        runnable: true
        code: |
          import math
          import random
          from datetime import date, timedelta

          print(math.sqrt(81), math.floor(7.8), math.ceil(7.2))
          print(math.pi)

          random.seed(42)            # same seed -> same sequence on every run
          print(random.randint(1, 6), random.randint(1, 6))
          print(random.choice(["rock", "paper", "scissors"]))

          launch = date(2026, 10, 22)
          print(launch + timedelta(days=30))
          print(launch.strftime("%A, %d %B %Y"))
          print((date(2026, 12, 25) - launch).days, "days until 25 December")
        expectedOutput: |
          9.0 7 8
          3.141592653589793
          6 1
          rock
          2026-11-21
          Thursday, 22 October 2026
          64 days until 25 December
        annotations:
          - line: 8
            text: Remove this line and the numbers change on every run.
          - line: 13
            text: timedelta handles month lengths and leap years for you.
          - line: 14
            text: "strftime formats a date: %A weekday, %d day, %B month name, %Y year."
      - type: callout
        variant: warning
        title: random is not for secrets
        body: |
          `random` is predictable by design — anyone who learns the seed (or enough outputs) can predict
          the rest. For passwords, tokens and anything security-related use the `secrets` module
          (`secrets.token_hex(16)`). Likewise `date.today()` and `datetime.now()` give the current date and
          time; examples here use fixed dates so their output never changes.

