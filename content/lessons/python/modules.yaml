  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Finders and loaders.** The import system is itself written in Python (`importlib`). For a name
          not yet in `sys.modules`, it asks each *finder* in `sys.meta_path` in turn: first the one for
          built-in modules, then frozen modules (a few start-up modules stored inside the interpreter), then
          the path-based finder that scans `sys.path`. A finder returns a *module spec* saying which
          *loader* can create the module — a source file, compiled bytecode, a zip archive or a C extension.

          **Bytecode cache.** After compiling `greetings.py`, CPython normally saves the bytecode in
          `__pycache__/greetings.cpython-314.pyc` and reuses it on the next run if the source's modification
          time and size are unchanged. (This browser build sets `sys.dont_write_bytecode`, so it skips that.)

          **Registered before it runs.** The new module is put into `sys.modules` *before* its code executes.
          That is what makes circular imports possible at all — and what produces this error when module `a`
          imports `b` while `b` (still loading) tries to take a name from the half-finished `a`:
      - type: code
        language: text
        code: |
          ImportError: cannot import name 'helper' from partially initialized module 'a'
          (most likely due to a circular import)
        caption: The cure is usually to move the shared code into a third module that both import.
      - type: markdown
        body: |
          **`from` imports copy a reference.** `from greetings import hello` binds your own name `hello` to
          the function object that exists *at that moment*. If the module later rebinds its `hello`, or you
          `importlib.reload()` it, your name still refers to the old object — the same names-and-objects rule
          as for any assignment:
      - type: code
        runnable: true
        code: |
          import sys, importlib

          with open("config_mod.py", "w", encoding="utf-8") as f:
              f.write('LEVEL = "info"\n')

          sys.modules.pop("config_mod", None)
          importlib.invalidate_caches()

          import config_mod
          from config_mod import LEVEL

          config_mod.LEVEL = "debug"     # rebinds the name inside the module
          print(config_mod.LEVEL, LEVEL)
        expectedOutput: |
          debug info
        caption: Your LEVEL name still refers to the original string; only the module's attribute was rebound.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - Every `.py` file is a **module**; `import` makes its names available to another file.
          - `import math` binds `math`; `from math import sqrt` binds only `sqrt`; `as` picks another name.
          - The first import **runs** the module once and caches it in `sys.modules`; later imports reuse it.
          - Search order: `sys.modules` → built-in modules → each folder in `sys.path` (your script's folder
            first, then the standard library, then `site-packages`). First match wins.
          - Never name your files after modules you use (`random.py`, `json.py`…). `module.__file__` reveals
            what was really imported.
          - `__name__` is `"__main__"` only for the program being run: put script-only code under
            `if __name__ == "__main__":`.
          - `random.seed(n)` makes randomness reproducible; use `secrets` for security; datetime does calendar
            arithmetic.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What happens when you import a module twice?" and "What does `if __name__ == '__main__'` do?" are
          staples. Explain find → create → register in `sys.modules` → execute → bind, that a second import
          only binds, and that `__name__` distinguishes running from importing. Mentioning shadowing and
          circular imports shows real-world experience.

items:
  - id: import-binding-mcq
    type: mcq
    skill: recognition
    prompt: "A file starts with `from math import sqrt`. Which of these lines will then work?"
    explanation: >-
      A from-import binds only the names listed — here sqrt. The name math is not bound, so math.pi raises
      NameError, and pi was never imported.
    options:
      - id: a
        text: "`print(sqrt(25))`"
        correct: true
        feedback: Right. sqrt is the only name this statement binds in your file.
      - id: b
        text: "`print(math.sqrt(25))`"
        feedback: "`from math import sqrt` does not bind the name math. You would get NameError: name 'math' is not defined."
      - id: c
        text: "`print(pi)`"
        feedback: Only listed names are imported. Write `from math import sqrt, pi` to get pi too.
      - id: d
        text: All three, because the whole math module is loaded anyway.
        feedback: The module is loaded (and cached), but your file only gets the names you asked for.

  - id: predict-import-twice
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print? (The first lines just create a module file `counter_mod.py`.)
    code: |
      import sys, importlib

      with open("counter_mod.py", "w", encoding="utf-8") as f:
          f.write('print("counter_mod loaded")\ncount = 0\n')
      sys.modules.pop("counter_mod", None)
      importlib.invalidate_caches()

      import counter_mod
      counter_mod.count += 1
      import counter_mod
      counter_mod.count += 1
      print(counter_mod.count)
    answer: |
      counter_mod loaded
      2
    explanation: >-
      The first import runs the module (printing once) and caches it. The second import finds it in
      sys.modules and only binds the name again — the code does not rerun, so count is not reset to 0.
      Both += 1 updates act on the same module object: 2.
    wrongAnswers:
      - answer: |
          counter_mod loaded
          counter_mod loaded
