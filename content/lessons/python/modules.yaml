    solution: |
      import math
      from math import sqrt


      def hypotenuse(a, b):
          return sqrt(a ** 2 + b ** 2)


      def circle_area(radius):
          return math.pi * radius ** 2


      print(hypotenuse(3, 4))
      print(round(circle_area(2), 2))
    expectedOutput: |
      5.0
      12.57
    tests:
      - name: prints both results
