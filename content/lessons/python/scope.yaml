sections:
  - id: why
    title: Why functions keep their names to themselves
    kind: why
    blocks:
      - type: markdown
        body: |
          Imagine you are using a function someone else wrote. Would you need to check every variable name
          inside it, in case it overwrites one of yours? Look at this program: the program and the
          function both use the name `total`.
      - type: code
        runnable: true
        code: |
          total = 100

          def sum_list(numbers):
              total = 0
              for n in numbers:
                  total += n
              return total

          print(sum_list([1, 2, 3]))
          print(total)
        expectedOutput: |
          6
          100
        annotations:
          - line: 1
            text: The program's own total.
          - line: 4
            text: A different total that belongs only to this call of sum_list.
          - line: 10
            text: The program's total is untouched.
      - type: markdown
        body: |
          The function's `total` and the program's `total` are **two different names that happen to be
          spelled the same**, living in two different [namespaces](glossary:namespace). That separation is
          called [scope](glossary:scope), and it is what makes functions safe to reuse: you can call a
          function without knowing - or caring - which names it uses inside.

  - id: local-global
    title: Local and global names
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **namespace** is a mapping from names to objects. A **scope** is the region of code in which a
          namespace's names can be used directly. For now there are two that matter:

          - **Global** names are bound at the top level of the file (outside any function). They live in
            the module's global namespace for as long as the program runs. These are
            [global variables](glossary:global-variable).
          - **Local** names are bound inside a function: its parameters, and any name it assigns to. They
            live in that call's **frame** and disappear when the call returns. These are
            [local variables](glossary:local-variable).

          The rule of visibility is one-directional: **code inside a function can read global names, but
          code outside a function cannot see its local names.**
      - type: code
        runnable: true
        code: |
          greeting = "Hello"

          def greet(name):
              message = greeting + ", " + name
              return message

          print(greet("Ada"))
          print(message)
        expectError: NameError
        expectedOutput: |
          Hello, Ada
        annotations:
          - line: 1
            text: A global name.
          - line: 3
            text: The parameter name is local to greet.
          - line: 4
            text: message is local; greeting is not assigned here, so it is read from the global namespace.
          - line: 8
            text: "NameError: message existed only inside the call, which has already finished."
      - type: callout
        variant: tip
        title: Getting a value out of a function
        body: |
          If the caller needs a value computed inside a function, **return it** and store the result:
          `message = greet("Ada")`. That is the only clean way out - local names never leak.

  - id: fresh-namespace
    title: Each call gets a fresh namespace
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A function's local namespace is created **when the function is called**, not when it is defined,
          and it is thrown away when the call ends. Two calls never share local names, and nothing is
          remembered from one call to the next:
      - type: code
        runnable: true
        code: |
          def count_calls():
              calls = 0
              calls += 1
              return calls

          print(count_calls())
          print(count_calls())
          print(count_calls())
        expectedOutput: |
          1
          1
          1
        caption: Each call starts with a brand-new calls = 0. The previous call's calls no longer exists.
      - type: markdown
        body: |
          Now three functions, three different names that are all spelled `x`. Predict the output, then step
          through it and watch the frames.
      - type: item
        ref: predict-three-x
      - type: visualization
        component: python-tracer
        title: Three x's in three frames
        caption: >-
          Each frame has its own x. When helper runs, its frame sits on top of outer_task's frame; helper's
          x does not replace outer_task's x, and neither affects the global x.
        props:
          code: |
            x = "global x"

            def outer_task():
                x = "outer_task's x"
                helper()
                print(x)

            def helper():
                x = "helper's x"
                print(x)

            outer_task()
            print(x)

  - id: legb
    title: "LEGB: the order Python searches"
    kind: concept
    blocks:
      - type: markdown
        body: |
          When Python meets a name it must **read**, it searches up to four scopes, in this fixed order -
          the [LEGB rule](glossary:legb-rule) - and uses the first match:

          1. **L**ocal - the current function call's names.
          2. **E**nclosing - the local names of any function the current function is written *inside*
             (functions can be defined inside other functions).
          3. **G**lobal - the module's top-level names.
          4. **B**uilt-in - names Python provides everywhere: `print`, `len`, `range`, `int`, `ValueError`…

          If no scope has the name, you get a `NameError`.
      - type: code
        runnable: true
        code: |
          x = "global"

          def outer():
              x = "enclosing"

              def inner():
                  print("inner sees:", x)

              inner()

          outer()
          print("module sees:", x)
          print(len("abc"))
        expectedOutput: |
          inner sees: enclosing
          module sees: global
          3
        annotations:
          - line: 6
            text: A nested function - defined inside outer. It is a local name of outer.
          - line: 7
            text: x is not local to inner, so Python checks the enclosing function (outer) and finds it there.
          - line: 13
            text: len is not local or global, so Python finds it in the built-in scope.
      - type: markdown
        body: |
          **Scopes follow where code is *written*, not who *calls* it.** This is called
          [lexical scoping](glossary:lexical-scoping). A function can see the enclosing functions it is
          written inside, but never the local names of whatever function happens to call it. Nested
          functions that remember enclosing names are the foundation of
          [closures](concept:python.closures).
      - type: item
        ref: mcq-lexical
      - type: markdown
        body: |
          **Blocks do not create scopes.** In Python only functions (and, later, classes and modules)
          create scopes. A name assigned inside an `if`, `for` or `while` block belongs to the surrounding
          function or module and is still there after the block:
      - type: code
        runnable: true
        code: |
          for i in range(3):
              last = i * 10
          print(i, last)

          if len("abc") == 3:
              inside_if = "still visible"
          print(inside_if)
        expectedOutput: |
          2 20
          still visible
        caption: Many other languages would reject this; in Python the loop variable and last survive the loop.

  - id: assignment-local
    title: Assignment makes a name local - UnboundLocalError
    kind: concept
    blocks:
      - type: markdown
        body: |
          How does Python decide whether a name in a function is local? Not by running the code line by
          line. It decides **when the function is compiled**, using one rule:

          > If a function **assigns** to a name anywhere in its body, that name is local for the **whole**
          > function - including the lines before the assignment.

          "Assigns" includes `=`, augmented assignment (`+=`, `-=` …), `for name in …`, `def name` and
          `import name`. Parameters are local too.

          So this famous program fails, even though `count` clearly exists globally:
      - type: code
        runnable: true
        code: |
          count = 0

          def increment():
              count += 1

          increment()
        expectError: UnboundLocalError
        caption: "UnboundLocalError: cannot access local variable 'count' where it is not associated with a value"
      - type: markdown
        body: |
          `count += 1` means `count = count + 1`, an assignment, so `count` is local throughout
          `increment`. To compute `count + 1` Python reads the **local** `count`, which has not been bound
          yet. The error type, [`UnboundLocalError`](glossary:unbound-local-error), is a kind of
          `NameError`: "the name is local, but it has no value yet".

          The decision covers the whole body, so even a read on an **earlier** line fails:
      - type: item
        ref: mcq-unbound
      - type: markdown
        body: |
          **The fix** is usually not `global` (next section) but better design: pass the value in and
          return the new value.
      - type: code
        runnable: true
        code: |
          def increment(count):
              return count + 1

          count = 0
          count = increment(count)
          count = increment(count)
          print(count)
        expectedOutput: |
          2
        caption: The function's input and output are now visible in every call.
      - type: item
        ref: explain-unbound

  - id: global-nonlocal
    title: global and nonlocal
    kind: concept
    blocks:
      - type: markdown
        body: |
          Sometimes a function really must **rebind** a name that lives outside it. Two statements switch
          off the "assignment makes it local" rule for specific names:

          - The [global statement](glossary:global-statement), `global name`, means "in this function,
            `name` is the module-level name": reads and assignments go to the global namespace.
          - `nonlocal name` means "`name` is the variable of the nearest **enclosing function**". It is only
            allowed in nested functions and never refers to globals.

          Both must appear before the name is used in the function, usually as its first line.
      - type: visualization
        component: python-tracer
        title: global rebinds the module's name; plain assignment makes a local
        caption: >-
          increment changes counter in the global frame. broken_increment's assignment creates a separate
          local counter in its own frame, which disappears when it returns - the global stays 2.
        props:
          code: |
            counter = 0

            def increment():
                global counter
                counter += 1

            def broken_increment():
                counter = 99

            increment()
            increment()
            broken_increment()
            print(counter)
      - type: code
        runnable: true
        code: |
          def play_rounds():
              score = 0

              def add_points(n):
                  nonlocal score
                  score += n

              add_points(3)
              add_points(5)
              return score

          print(play_rounds())
        expectedOutput: |
          8
        annotations:
          - line: 5
            text: Without this line, score += n would make score local to add_points and raise UnboundLocalError.
      - type: markdown
        body: |
          **Mutation is not assignment.** `global` is only needed to **rebind** a global name. Calling a
          method that changes a global list or dict in place - `items.append(x)`, `settings["debug"] = True`
          - does not assign to the name itself, so Python simply looks the name up (LEGB finds the global)
          and mutates that object.
      - type: item
        ref: predict-global-mutation

  - id: avoid-global-state
    title: Prefer parameters and return values
    kind: application
    blocks:
      - type: markdown
        body: |
          `global` works, but code that shares changing state through global variables is harder to get
          right. Compare these two versions:
      - type: code
        runnable: true
        code: |
          balance = 100

          def withdraw(amount):
              global balance
              balance -= amount

          withdraw(30)
          withdraw(20)
          print(balance)
        expectedOutput: |
          50
        caption: "Global state: the call withdraw(30) does not show what it reads or what it changes."
      - type: code
        runnable: true
        code: |
          def withdraw(balance, amount):
              return balance - amount

          balance = 100
          balance = withdraw(balance, 30)
          balance = withdraw(balance, 20)
          print(balance)

          savings = withdraw(500, 125)
          print(savings)
        expectedOutput: |
          50
          375
        caption: Parameters and a return value - and the same function now works for any number of accounts.
      - type: markdown
        body: |
          Why the second version is better:

          - **Visible inputs and outputs.** Everything the function uses arrives as a parameter; everything
            it produces leaves as the return value. You can understand a call without reading the body.
          - **No action at a distance.** With a global, *any* function anywhere could change `balance`, so
            a wrong value could come from anywhere.
          - **Order independence and testability.** A function whose result depends only on its arguments
            gives the same answer every time; a test can call it without setting up and resetting globals.
          - **It scales.** One global `balance` means one account. Later, with concurrent code, shared
            mutable globals also become a source of race conditions.

          Module-level **constants** that are only read - `TAX_RATE = 18`, written in UPPER_CASE - are fine.
          It is changing global state that causes trouble.

  - id: shadowing
    title: Shadowing built-ins
    kind: concept
    blocks:
      - type: markdown
        body: |
          Because Python searches local and global scopes **before** the built-in scope, a name you create
          hides - [shadows](glossary:shadowing) - any built-in with the same name. Nothing stops you
          writing `sum = 0` or `list = [1, 2]`, but from then on that name no longer means the built-in in
          that scope:
      - type: code
        runnable: true
        code: |
          prices = [3, 4, 5]
          sum = 0
          for p in prices:
              sum += p
          print(sum)
          print(sum(prices))
        expectError: TypeError
        expectedOutput: |
          12
        caption: "TypeError: 'int' object is not callable - the global name sum now refers to 12, and LEGB finds it before the built-in."
      - type: markdown
        body: |
          Names beginners often shadow: `list`, `dict`, `str`, `sum`, `max`, `min`, `input`, `type`, `id`,
          `len`, `filter`, `map`, `next`. Pick descriptive names instead: `total`, `scores`, `name_list`,
          `largest`.

          Shadowing inside a function only affects that function's local scope; at the top level it affects
          the rest of the module. If you have shadowed a built-in at the top level, `del sum` removes your
          global name so the built-in is found again - but renaming is the real fix.
      - type: code
        runnable: true
        code: |
          import builtins

          sum = 10
          del sum
          print(sum([1, 2]))
          print(builtins.sum is sum)
        expectedOutput: |
          3
          True
        depth: deep
        caption: Built-ins live in the builtins module. Deleting the global name lets LEGB reach the built-in again.

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Scope is decided at compile time.** Before a function runs, the compiler builds a *symbol
          table* for it: every name is classified as local, enclosing (a *free* variable of a nested
          function), global or built-in. That is why `UnboundLocalError` can happen on a line *before* the
          assignment - the classification is about the whole body, not about execution order. It is also
          why `global x` after `x` has been used is a `SyntaxError` ("name 'x' is used prior to global
          declaration"), and `nonlocal y` with no enclosing `y` is a `SyntaxError` ("no binding for
          nonlocal 'y' found").

          **Different lookups, different instructions.** CPython stores a function's locals in a fixed
          array inside the frame and reads them by position, which is fast. Global and built-in names are
          looked up in dictionaries (with caching to make this quick). Enclosing variables live in small
          *cell* objects shared between the outer and inner function. You can see the instructions with
          `dis.dis(function)` - instruction names such as `LOAD_FAST` and `LOAD_GLOBAL` vary a little
          between versions.

          **Inspecting namespaces.** `globals()` returns the module's namespace dict. Inside a function,
          `locals()` returns a dict *snapshot* of the local names; writing to it does not change the local
          variables (since Python 3.13 this behaviour is guaranteed by
          [PEP 667](https://peps.python.org/pep-0667/)).
      - type: code
        runnable: true
        code: |
          import builtins

          x = "global"

          def demo(a):
              b = a * 2
              print(sorted(locals()))
              print("x" in globals(), "x" in locals())

          demo(1)
          print(demo.__code__.co_varnames)
          print(builtins.len is len)
        expectedOutput: |
          ['a', 'b']
          True False
          ('a', 'b')
          True
        annotations:
          - line: 11
            text: The compiler recorded the local names - parameter a first, then b - before demo ever ran.
          - line: 12
            text: len found by LEGB is the very object stored in the builtins module.

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `UnboundLocalError: cannot access local variable 'count' where it is not associated with a value` | The function assigns to `count` (e.g. `count += 1`) and reads it before that | Pass the value in and return the new value; use `global`/`nonlocal` only if you truly must rebind an outer name. |
          | `NameError` for a variable created inside a function | Local names disappear when the call ends | `return` the value and store it in the caller. |
          | `NameError` in a helper for a name its caller defined | Scopes are lexical: a callee cannot see its caller's locals | Pass the value as an argument. |
          | A global "did not change" after a function assigned it | The assignment created a new local name | Return the new value and rebind in the caller. |
          | A function gives a different answer the second time | It accumulates in global state between calls | Create the working variables inside the function. |
          | `TypeError: 'int' object is not callable` (or `'list'`, `'str'`…) | A variable shadows a built-in such as `sum`, `list`, `max` | Rename the variable. |
          | `SyntaxError: name 'x' is used prior to global declaration` | `global x` written after `x` is used | Put `global x` first in the function. |
          | `SyntaxError: no binding for nonlocal 'x' found` | `nonlocal` used where no enclosing function defines `x` | Define `x` in the enclosing function, or use parameters. |
      - type: code
        runnable: true
        code: |
          def helper():
              print(secret)

          def caller():
              secret = 42
              helper()

          caller()
        expectError: NameError
        caption: Read the traceback - helper is the innermost frame. secret is local to caller, and helper is not written inside caller, so LEGB never looks there.
      - type: item
        ref: debug-unbound-counter

