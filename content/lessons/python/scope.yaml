  - id: m-predict-legb
    type: predict-output
    skill: prediction
    difficulty: 3
    prompt: What does this program print?
    code: |
      x = "global"

      def outer():
          x = "enclosing"
          def inner():
              return x
          x = "changed"
          return inner()

      print(outer(), x)
    answer: changed global
    explanation: >-
      inner has no local x, so LEGB finds the enclosing function's x - and reads its value at the moment
      inner runs. By then outer has rebound its x to "changed". The global x was never assigned inside
      any function, so it is still "global".
    wrongAnswers:
      - answer: enclosing global
        feedback: >-
          inner looks the name up when it is called, not when it is defined. By the time inner() runs,
          outer's x refers to "changed".
      - answer: global global
        feedback: The Enclosing scope is searched before the Global one, and outer has its own x.
      - answer: changed changed
        feedback: Assignments inside outer only bind outer's local x; the module's x is untouched.

  - id: m-mcq-global
    type: mcq
    skill: explanation
    difficulty: 2
    prompt: |
      Calling `add(5)` raises `UnboundLocalError` for `count`. Why does the line using `items` work
      when the line using `count` fails?

      ```python
      items = []
      count = 0

      def add(x):
          items.append(x)
          count = count + 1
      ```
    explanation: >-
      items is only mutated (a method call), never assigned in add, so it is not local and LEGB finds the
      global list. count is assigned in add, which makes it local for the whole function; reading it on
      the right-hand side before it has a value raises UnboundLocalError.
    options:
      - id: a
        text: items is mutated but never assigned, so it is looked up as a global; count is assigned, so it is local throughout add.
        correct: true
        feedback: Correct. Only rebinding needs global; mutation just needs to find the object.
      - id: b
        text: Lists are always global and integers are always local.
        feedback: Scope depends on whether a name is assigned in the function, not on the type of object.
      - id: c
        text: append is a built-in function, so it is allowed to change globals.
        feedback: append is a list method. What matters is that the name items is not assigned in add.
      - id: d
        text: count must be declared before items for the function to see it.
        feedback: Both globals exist before add runs. The problem is that count = ... makes count local.

  - id: m-tf-fresh
    type: true-false
    skill: recognition
    prompt: "True or false: a local variable keeps the value it had at the end of the previous call to the same function."
    answer: false
    explanation: >-
      Each call creates a fresh local namespace, and it is discarded when the call returns. To keep a value
      between calls, return it (and pass it back in) or store it in an object the caller keeps.

  - id: m-debug-leaky-state
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      `unique(items)` should return the distinct items of **one** list, in first-seen order. The first
      call prints `[1, 2]` correctly, but the second prints `[1, 2, 3]` instead of `[3]`. Fix it so
      every call starts fresh.
    starterCode: |
      seen = []

      def unique(items):
          for item in items:
              if item not in seen:
                  seen.append(item)
          return seen

      print(unique([1, 2, 2]))
      print(unique([3, 3]))
    solution: |
      def unique(items):
          seen = []
          for item in items:
              if item not in seen:
                  seen.append(item)
          return seen

      print(unique([1, 2, 2]))
      print(unique([3, 3]))
    expectedOutput: |
      [1, 2]
      [3]
    tests:
      - name: each call is independent
        code: |
          r1 = unique([5, 5, 6])
          r2 = unique([7])
          assert r1 == [5, 6], f"unique([5, 5, 6]) returned {r1!r}; expected [5, 6]. Results from earlier calls are leaking in."
          assert r2 == [7], f"unique([7]) returned {r2!r}; expected [7]."
          assert r1 is not r2, "Two calls returned the same list object. Create a new list inside the function."
      - name: empty input
        code: |
          r = unique([])
          assert r == [], f"unique([]) returned {r!r}; expected []."
      - name: prints both results
        code: |
          assert output_lines() == ["[1, 2]", "[3]"], f"Your program printed {output()!r}."
    hints:
      - Where is the seen list created, and how many times does that line run?
      - A local name gets a fresh object on every call only if it is assigned inside the function.
    feedback:
      - when: { outputContains: "[1, 2, 3]" }
        message: The calls are still sharing one global list. Create seen inside unique.
    explanation: >-
      The global seen list was created once and kept growing across calls. Moving `seen = []` into the
      function makes it a local name bound to a new list on every call, so each result depends only on
      its own argument.

  - id: m-debug-nonlocal
    type: debug
    skill: debugging
    difficulty: 3
    prompt: |
      `score_game` should add up the points from each round using its helper `add`, and print `7`. It
      crashes with `UnboundLocalError`. Fix it so `points` belongs to `score_game` (do not use `global`).
    starterCode: |
      def score_game(rounds):
          points = 0
          def add(n):
              points += n
          for r in rounds:
              add(r)
          return points

      print(score_game([3, 4]))
    solution: |
      def score_game(rounds):
          points = 0
          def add(n):
              nonlocal points
              points += n
          for r in rounds:
              add(r)
          return points

      print(score_game([3, 4]))
    expectedOutput: |
      7
    tests:
      - name: no global statement
        code: |
          assert not uses("Global"), "points belongs to score_game, not to the module. Use nonlocal, not global."
      - name: adds up the rounds
        code: |
          for rounds, expected in [([3, 4], 7), ([], 0), ([10, -2, 5], 13)]:
              r = score_game(rounds)
              assert r == expected, f"score_game({rounds}) returned {r!r}; expected {expected}."
      - name: prints 7
        code: |
          assert output().strip() == "7", f"Your program printed {output()!r}."
    hints:
      - "`points += n` assigns to points, which makes points local to add."
      - Which statement tells an inner function that a name belongs to the enclosing function?
    feedback:
      - when: { errorType: UnboundLocalError }
        message: Inside add, points is still treated as local. Add `nonlocal points` as the first line of add.
    explanation: >-
      The assignment in add made points local to add. `nonlocal points` makes add rebind the enclosing
      function's points instead. (Removing the helper and adding in the loop directly is another valid
      fix.)

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-legb, m-mcq-global, m-tf-fresh, m-debug-leaky-state, m-debug-nonlocal]

cheatsheet: |
  ```python
  x = "global"            # global name (module level)
  def f(a):               # a is local
      b = a * 2           # b is local (assigned in f)
      return x            # read: Local -> Enclosing -> Global -> Built-in

  def g():
      count += 1          # UnboundLocalError: assignment makes count local everywhere in g

  def h():
      global total        # rebind the module-level total
      total += 1

  def outer():
      n = 0
      def inner():
          nonlocal n      # rebind outer's n
          n += 1
  ```
  - Each call → fresh locals · blocks (if/for/while) don't create scopes
  - Mutating an outer list needs no global; rebinding does
  - Don't shadow built-ins (sum, list, max, input…) · prefer parameters + return over globals
