  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **namespace** maps names to objects; a **scope** is where those names can be used directly.
          - Names bound in a function (parameters, assignments) are **local**; each call gets a **fresh**
            local namespace that disappears when the call returns.
          - Reading a name searches **L**ocal → **E**nclosing → **G**lobal → **B**uilt-in; scopes follow
            where code is written, not who calls it. `if`/`for`/`while` blocks do not create scopes.
          - **Assigning** to a name anywhere in a function makes it local for the whole function →
            `UnboundLocalError` if it is read first.
          - `global name` / `nonlocal name` let a function rebind an outer name. Mutating an outer object
            needs neither. Prefer parameters and return values over global state.
          - Don't name variables `sum`, `list`, `max`, `input`…: they shadow the built-ins.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          A common question shows `x = 10; def f(): print(x); x = 5` and asks what happens. Answer
          `UnboundLocalError`, then explain *why*: scope is determined at compile time, and any assignment
          makes the name local for the whole function. Follow with the LEGB order, when `nonlocal` is
          needed, and why you would pass state explicitly instead of using `global`.

items:
  - id: predict-three-x
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: Predict the output before you step through it below. (Three lines.)
    code: |
      x = "global x"

      def outer_task():
          x = "outer_task's x"
          helper()
          print(x)

      def helper():
          x = "helper's x"
          print(x)

      outer_task()
      print(x)
    answer: |
      helper's x
      outer_task's x
      global x
    explanation: >-
      Each function assigns x, so each has its own local x. helper prints its own; when it returns,
      outer_task's x is unchanged and is printed; finally the global x was never touched.
    wrongAnswers:
      - answer: |
          helper's x
          helper's x
          helper's x
        feedback: >-
          This assumes one shared x that each assignment overwrites. Each function call has its own local
          namespace, so helper's assignment cannot change outer_task's x or the global x.
      - answer: |
          helper's x
          helper's x
          global x
        feedback: helper's x lives in helper's own frame. It cannot replace the x in the frame of the function that called it.
      - answer: |
          outer_task's x
          helper's x
          global x
        feedback: outer_task calls helper before its own print, so helper's line comes first.

  - id: mcq-lexical
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: |
      Why does this program raise `NameError: name 'secret' is not defined`?

      ```python
      def helper():
          print(secret)

      def caller():
          secret = 42
          helper()

      caller()
      ```
    explanation: >-
      Python's scopes are lexical: helper can see its own locals, the functions it is written inside (none),
      the globals and the built-ins. caller's local names are not on that list, even though caller is
      the function that called helper.
    options:
      - id: a
        text: secret is local to caller, and helper is not written inside caller, so helper's lookup never searches caller's names.
        correct: true
        feedback: Right. Lookup follows where helper is defined (top level), not who called it. Pass secret as an argument instead.
      - id: b
        text: helper is defined before caller, so it cannot see caller's variables yet.
        feedback: Definition order is not the issue. Even if helper were defined after caller, it still could not see caller's locals.
      - id: c
        text: secret should be written in quotes.
        feedback: In quotes it would just be the text "secret", not a lookup of the variable.
      - id: d
        text: Functions can only read built-in names.
        feedback: Functions can read their own locals, enclosing functions' names, globals and built-ins (LEGB).

  - id: mcq-unbound
    type: mcq
    skill: prediction
    difficulty: 2
    prompt: |
      What happens when this program runs?

      ```python
      total = 10

      def show():
          print(total)
          total = 5

      show()
      ```
    explanation: >-
      Because show assigns to total (line 5), total is local throughout show - including line 4. When
      print(total) runs, the local total has no value yet, so Python raises UnboundLocalError. The
      decision is made when the function is compiled, not line by line.
    options:
      - id: a
        text: It prints 10, then the local total becomes 5.
        feedback: That would require Python to decide scope line by line. It decides for the whole function at once, and line 5 makes total local everywhere in show.
      - id: b
        text: It prints 5.
        feedback: Line 5 has not run when line 4 prints. Assignments do not happen early.
      - id: c
        text: "UnboundLocalError on the print line: total is local in show but not yet assigned."
        correct: true
        feedback: Correct. The assignment anywhere in the body makes total local for the whole body.
      - id: d
        text: It prints 10 and changes the global total to 5.
        feedback: Without a global statement, an assignment inside a function never rebinds the global name.

  - id: explain-unbound
    type: explain
    skill: explanation
    prompt: >-
      Explain to a friend why `count += 1` inside `increment()` raises UnboundLocalError even though
      `count = 0` was set at the top of the program. Then describe two different fixes and say which one
      you would choose.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says that count += 1 is an assignment, and assigning anywhere in a function makes the name local for the whole function.
      - Says this is decided when the function is compiled, before it runs, so the local count is read before it has a value.
      - Gives the preferred fix - pass count in as a parameter and return count + 1, rebinding in the caller.
      - Mentions `global count` as an alternative and explains why it is usually worse (hidden state, harder to test).
    modelAnswer: |
      count += 1 is short for count = count + 1, which assigns to count. When Python compiles increment,
      it sees that assignment and marks count as a local name for the entire function. So when the line
      runs, Python needs the value of the local count to add 1 to it - and the local count has not been
      given a value yet, hence UnboundLocalError. The global count is never consulted. The best fix is to
      write def increment(count): return count + 1 and call count = increment(count), so the input and
      output are explicit. The other fix is to put `global count` at the top of the function; it works,
      but the function then secretly depends on and changes global state, which makes it harder to reuse
      and test.

  - id: predict-global-mutation
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      names = ["Ada"]
      label = "team"

      def update():
          names.append("Alan")
          label = "squad"

      update()
      print(names, label)
    answer: "['Ada', 'Alan'] team"
    explanation: >-
      names.append is a method call on the object the global names refers to - no assignment to the name,
      so LEGB finds the global list and mutates it. label = "squad" is an assignment, so it creates a new
      local label that disappears when update returns.
    wrongAnswers:
      - answer: "['Ada'] team"
        feedback: >-
          append does not assign to the name names, so names is not local. Python finds the global list
          and changes it in place - no global statement needed for mutation.
      - answer: "['Ada', 'Alan'] squad"
        feedback: Assigning label inside the function creates a local name. Without `global label`, the global label stays "team".

  - id: tf-block-scope
    type: true-false
    skill: recognition
    prompt: |
      True or false: a variable first assigned inside a `for` loop (at the top level of a program) can
      still be used after the loop has finished.
    answer: true
    explanation: >-
      In Python only functions (and classes and modules) create new scopes. Loops and if blocks do not, so
      a name assigned in the loop body - and the loop variable itself - belongs to the surrounding scope
      and keeps its last value after the loop.

  - id: debug-unbound-counter
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This program should print `15`, but it crashes with `UnboundLocalError`. Fix it **without using
      `global`**: change `add` so it takes the current total and the amount and **returns** the new
      total, then update the two calls.
    starterCode: |
      total = 0

      def add(amount):
          total = total + amount

      add(5)
      add(10)
      print(total)
    solution: |
      def add(total, amount):
          return total + amount

      total = 0
      total = add(total, 5)
      total = add(total, 10)
      print(total)
    expectedOutput: |
      15
    tests:
      - name: no global statement
        code: |
          assert not uses("Global"), "Solve it without the global statement: pass total in as a parameter and return the new value."
      - name: add takes the total and the amount
        code: |
          import inspect
          n = len(inspect.signature(add).parameters)
          assert n == 2, f"add should take two parameters (the current total and the amount); yours takes {n}."
      - name: add returns the new total
        code: |
          for args, expected in [((0, 5), 5), ((10, 3), 13), ((-2, 2), 0)]:
              r = add(*args)
              assert r == expected, f"add{args} returned {r!r}; it should return {expected}."
      - name: prints 15
        code: |
          assert output().strip() == "15", f"Rebind total from each call, e.g. total = add(total, 5). Your program printed {output()!r}."
    hints:
      - "`total = total + amount` assigns to total, so inside add, total is local - and it has no value yet."
      - "Make total a parameter: `def add(total, amount):` and end with `return total + amount`."
      - "The caller must store the result: `total = add(total, 5)`."
    feedback:
      - when: { errorType: UnboundLocalError }
        message: total is still being assigned inside add without being a parameter. Make it a parameter and return the result.
      - when: { outputEquals: "0\n" }
        message: The calls run, but their results are thrown away. Rebind the global name with total = add(total, 5).
    explanation: >-
      With total as a parameter, the local name is bound to the caller's value before the body runs, and
      return hands the new value back. The caller rebinds its own total, so all state changes are visible
      at the call site.

  - id: debug-shadow-builtin
    type: debug
    skill: debugging
    prompt: |
      This program should print the total and the average of the scores, but the average line crashes
      with `TypeError: 'int' object is not callable`. Find the variable that shadows a built-in and
      rename it, so the program prints:

      ```text
      Total: 15
      Average: 5.0
      ```
    starterCode: |
      scores = [4, 9, 2]

      sum = 0
      for s in scores:
          sum += s
      print("Total:", sum)

      average = sum(scores) / len(scores)
      print("Average:", average)
    solution: |
      scores = [4, 9, 2]

      total = 0
      for s in scores:
          total += s
      print("Total:", total)

      average = sum(scores) / len(scores)
      print("Average:", average)
    expectedOutput: |
      Total: 15
      Average: 5.0
    tests:
      - name: prints total and average
        code: |
          assert output_lines() == ["Total: 15", "Average: 5.0"], f"Expected 'Total: 15' and 'Average: 5.0', but your program printed {output()!r}."
      - name: no built-in names are reassigned
        code: |
          import ast, builtins
          stored = {n.id for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Store)}
          shadowed = sorted(stored & set(dir(builtins)))
          assert not shadowed, f"Your program still assigns to built-in names: {shadowed}. Rename those variables (for example total instead of sum)."
      - name: works for other scores
        code: |
          import re, io, contextlib
          changed = re.sub(r"scores\s*=\s*\[4,\s*9,\s*2\]", "scores = [10, 20]", source, count=1)
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buf.getvalue().splitlines()[:2] == ["Total: 30", "Average: 15.0"], "Compute both lines from the scores list so the program works for any scores."
    hints:
      - The error happens on the average line. What does the name sum refer to at that moment?
      - "`sum = 0` rebinds the name sum in the global scope, so LEGB finds your integer before the built-in function."
      - Rename the variable (and every place it is used) to something like total.
    feedback:
      - when: { errorMessageContains: "not callable" }
        message: A built-in name is still bound to a number. Rename the loop's running-total variable everywhere it appears.
    explanation: >-
      `sum = 0` created a global name that shadows the built-in sum. LEGB checks globals before
      built-ins, so sum(scores) tried to call the integer 15. Renaming the variable leaves sum referring
      to the built-in function.

  - id: bank-refactor
    type: code
    skill: design
    difficulty: 2
    prompt: |
      This banking script keeps the balance in a global variable. Rewrite `deposit` and `withdraw` so
      that each takes `balance` and `amount` as parameters and **returns** the new balance - no `global`.
      `withdraw` must refuse to overdraw: if `amount` is more than `balance`, it returns `balance`
      unchanged. Update the calls so the program still prints `120`.
    starterCode: |
      balance = 100

      def deposit(amount):
          global balance
          balance += amount

      def withdraw(amount):
          global balance
          if amount <= balance:
              balance -= amount

      deposit(50)
      withdraw(30)
      withdraw(500)
      print(balance)
    solution: |
      def deposit(balance, amount):
          return balance + amount

      def withdraw(balance, amount):
          if amount > balance:
              return balance
          return balance - amount

      balance = 100
      balance = deposit(balance, 50)
      balance = withdraw(balance, 30)
      balance = withdraw(balance, 500)
      print(balance)
    expectedOutput: |
      120
    tests:
      - name: no global statements
        code: |
          assert not uses("Global"), "Remove the global statements: pass balance in and return the new balance."
      - name: deposit returns the new balance
        code: |
          for args, expected in [((100, 50), 150), ((0, 1), 1)]:
              r = deposit(*args)
              assert r == expected, f"deposit{args} returned {r!r}; it should return {expected}."
      - name: withdraw returns the new balance and refuses to overdraw
        code: |
          for args, expected in [((100, 30), 70), ((100, 100), 0), ((100, 300), 100)]:
              r = withdraw(*args)
              assert r == expected, f"withdraw{args} returned {r!r}; it should return {expected}."
      - name: functions do not change the global balance
        code: |
          before = balance
          deposit(10, 5)
          withdraw(10, 5)
          assert balance == before, "deposit and withdraw should not change the global balance; return the new value and let the caller rebind it."
      - name: prints 120
        code: |
          assert output().strip() == "120", f"Rebind balance from each call, e.g. balance = deposit(balance, 50). Your program printed {output()!r}."
    hints:
      - "Start with the def lines: `def deposit(balance, amount):` and `def withdraw(balance, amount):`."
      - In withdraw, return early with the unchanged balance when the amount is too large.
      - "Each call must store the result: `balance = withdraw(balance, 30)`."
    feedback:
      - when: { outputEquals: "100\n" }
        message: The functions return the new balance, but the calls throw it away. Write balance = deposit(balance, 50), and so on.
    explanation: >-
      Each function now depends only on its arguments and communicates only through its return value.
      The same functions can manage any number of accounts, and a test can call withdraw(100, 300) without
      setting up a global first.

