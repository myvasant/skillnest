id: python.scope
concept: python.scope
title: Scope and Namespaces
subtitle: Where Python looks for a name - and why functions keep their names to themselves
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  Every function call gets its own namespace, so names inside a function cannot clash with names
  outside it. Learn the LEGB lookup order, why assigning to a name makes it local (and how that causes
  UnboundLocalError), when global and nonlocal are needed, and why global state and shadowed built-ins
  cause bugs.
objectives:
  - Distinguish local, enclosing, global and built-in names, and predict which object a name refers to using the LEGB rule.
  - Explain why each call gets a fresh local namespace and why local names do not exist after the call.
  - Explain why assigning to a name anywhere in a function makes it local everywhere in that function, and fix UnboundLocalError.
  - Use global and nonlocal correctly, and refactor global state into parameters and return values.
  - Recognise and fix bugs caused by shadowing built-in names such as sum, list or max.
