  - id: m-predict-tuple-list
    type: predict-output
    skill: transfer
    difficulty: 2
    prompt: What does this print?
    code: |
      pair = ([1], [2])
      first = pair[0]
      first.append(10)
      print(pair)
    answer: "([1, 10], [2])"
    explanation: >-
      first is another name for the list stored in pair[0]. Appending mutates that list. The tuple can't
      change which objects it holds, but it doesn't stop those objects from changing.
    wrongAnswers:
      - answer: "([1], [2])"
        feedback: >-
          Tuple immutability is shallow: the tuple still holds the same two lists, but a list inside it can
          be mutated through any name that refers to it.
      - answer: "([1, 10], [2, 10])"
        feedback: first refers only to the first list; the second list is a different object.

  - id: m-mcq-which-mutates
    type: mcq
    skill: recognition
    prompt: |
      After these two lines:

      ```python
      a = [3, 1, 2]
      b = a
      ```

      which **single** statement changes what `print(b)` shows?
    explanation: >-
      Only a mutation of the shared list is visible through b. a.sort() sorts that list in place. The other
      statements rebind a to a different list and leave b's list untouched.
    options:
      - id: a
        text: "`a = sorted(a)`"
        feedback: sorted() builds a new list and a is rebound to it. b still refers to the original, unsorted list.
      - id: b
        text: "`a.sort()`"
        correct: true
        feedback: Right. sort() mutates the list in place, and b refers to the same list.
      - id: c
        text: "`a = a + [4]`"
        feedback: "+ builds a new list; only a is rebound. b is unchanged."
      - id: d
        text: "`a = [1, 2, 3]`"
        feedback: Rebinding a moves only the name a. b keeps referring to the original list.

  - id: m-tf-id-same
    type: true-false
    skill: recognition
    prompt: "True or false: after `a = [1]` and then `a.append(2)`, `id(a)` returns a different number than it did before the append."
    answer: false
    explanation: >-
      append() mutates the existing list object; it does not create a new one. An object's identity never
      changes during its lifetime, so id(a) is the same before and after.

  - id: m-debug-snapshot
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      A game records the player's inventory after each pickup. `history` should end up as
      `[['key'], ['key', 'map'], ['key', 'map', 'torch']]`, but every entry shows the final inventory. Fix it
      so that each entry is a snapshot of the inventory at that moment.
    starterCode: |
      inventory = []
      history = []
      for item in ["key", "map", "torch"]:
          inventory.append(item)
          history.append(inventory)
      print(history)
    solution: |
      inventory = []
      history = []
      for item in ["key", "map", "torch"]:
          inventory.append(item)
          history.append(inventory[:])
      print(history)
    expectedOutput: |
      [['key'], ['key', 'map'], ['key', 'map', 'torch']]
    tests:
      - name: history holds snapshots
        code: |
          assert history == [["key"], ["key", "map"], ["key", "map", "torch"]], f"history is {history!r}."
      - name: inventory still has every item
        code: |
          assert inventory == ["key", "map", "torch"], f"inventory should end as ['key', 'map', 'torch'], but it is {inventory!r}."
      - name: entries are separate lists
        code: |
          assert all(entry is not inventory for entry in history), "Each history entry must be a new list, not the inventory list itself."
      - name: works for other pickups
        code: |
          import re
          changed = re.sub(r'\["key", "map", "torch"\]', '["axe", "rope"]', source, count=1)
          assert changed != source, 'Keep the list ["key", "map", "torch"] in the loop so the checks can try other items.'
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert ns.get("history") == [["axe"], ["axe", "rope"]], "With other items the snapshots were wrong."
    hints:
      - How many list objects does this program create? Count the [] literals and anything else that builds a list.
      - history.append(inventory) appends a reference to the same inventory list every time.
      - "Append a snapshot instead: inventory[:] (or list(inventory)) builds a new list with the current items."
    feedback:
      - when: { outputEquals: "[['key', 'map', 'torch'], ['key', 'map', 'torch'], ['key', 'map', 'torch']]\n" }
        message: All three entries are still the same list object - the inventory itself. Append a new list built from its current items.
    explanation: >-
      `history.append(inventory)` stores a reference to the one inventory list three times, so later appends
      show up in every entry. `inventory[:]` builds a new list containing the current items, so each entry
      freezes the inventory as it was at that moment.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-dict-alias, m-predict-tuple-list, m-mcq-which-mutates, m-tf-id-same, m-debug-snapshot]

cheatsheet: |
  ```python
  a == b        # equal values?
  a is b        # same object?  (same as id(a) == id(b))
  b = a         # NO copy: two names, one object
  b.append(x)   # mutation  -> visible through a too
  b = [9]       # rebinding -> only b moves
  a += [3]      # list: mutates in place (like extend)
  a = a + [3]   # new list, rebinds a
  grid = []                                  # independent rows
  for _ in range(3): grid.append([0] * 3)
  x is None     # the main legitimate use of is
  ```
  - Immutable: int float bool str tuple frozenset None · Mutable: list dict set
  - Rebinding moves one name · mutation changes the object for every alias
  - Never `[[0] * n] * m` · never `lst = lst.append(x)` · never `is` for numbers/strings
