id: python.mutability
concept: python.mutability
title: Mutability, Identity and References
subtitle: When one change shows up under two names
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Why does appending to one list sometimes "also change" another? This lesson gives you the precise rule:
  names refer to objects, some objects can be changed in place (mutated), and every name referring to a
  mutated object sees the change. You'll learn to tell mutation from rebinding, use is and == correctly,
  understand why += behaves differently for lists, and avoid the famous [[0] * 3] * 3 trap.
objectives:
  - Explain the difference between an object's identity, type and value, and compare objects with is and ==.
  - Classify built-in types as mutable or immutable and explain what "changing" an immutable value really does.
  - Distinguish mutation from rebinding in code, and predict which names see a change.
  - Predict the effect of += versus + on lists, tuples and strings that have several names.
  - Diagnose and fix aliasing bugs, including the shared-row grid trap and loops that rebind their variable.
