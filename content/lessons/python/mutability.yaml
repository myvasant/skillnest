      config = {"debug": False}
      current = config
      current["debug"] = True
      current = {"debug": False}
      print(config["debug"], current["debug"])
    answer: "True False"
    explanation: >-
      Line 3 mutates the dictionary both names share, so config["debug"] becomes True. Line 4 rebinds only
      current to a new dictionary; config is unaffected.
    wrongAnswers:
      - answer: "False False"
        feedback: Line 3 mutates the shared dictionary, and rebinding current on line 4 does not undo that change.
      - answer: "True True"
