id: python.asyncio
concept: python.asyncio
title: Asynchronous Programming with asyncio
subtitle: Coroutines, tasks and the event loop
estimatedMinutes: 60
reviewedOn: 2026-11-04
summary: Understand how Python's async/await syntax lets one event loop coordinate many I/O tasks without
  creating one operating-system thread per task. Learn coroutine objects, Tasks, TaskGroup, cancellation,
  timeouts, blocking-call hazards and the limits of this platform's WebAssembly runtime.
objectives:
- Distinguish a coroutine function, a coroutine object, a Task and an event loop.
- Explain how await suspends the current coroutine and gives the event loop a chance to run other tasks.
- Run a top-level async program with asyncio.run and group related tasks with TaskGroup.
- Handle cancellation and timeouts without skipping cleanup or hiding cancellation.
- Recognise blocking calls that stall the event loop and choose an appropriate offloading strategy.
- Explain why async code requires compatible libraries through the call chain.
