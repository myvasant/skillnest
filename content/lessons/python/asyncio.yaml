sections:
- id: why-asyncio
  title: Why asynchronous I/O exists
  kind: why
  blocks:
  - type: markdown
    body: 'A web service may handle hundreds of requests that spend most of their time waiting for databases,

      remote APIs or sockets. Creating a large number of operating-system threads can consume memory and

      require coordination. A single event loop can instead switch between many tasks while they wait,

      provided the tasks use non-blocking operations.


      **Asyncio** is Python''s standard-library framework for writing concurrent code with `async` and

      `await`. It is most useful for I/O-bound programs whose libraries already support asynchronous

      operations. It does not make a CPU-heavy calculation faster by itself.

      '
  - type: callout
    variant: misconception
    title: Async is not a synonym for parallel
    body: 'Several coroutines may be in progress at once, but one event loop normally runs one task at
      a time

      on its thread. A task gives control back at an `await` point. CPU work that never awaits can block

      every other task on that event loop.

      '
- id: coroutine-task-loop
  title: Coroutine function, coroutine object, Task and event loop
  kind: mental-model
  blocks:
  - type: markdown
    body: 'These four terms describe different things:


      1. A **coroutine function** is declared with `async def`.

      2. Calling that function creates a **coroutine object**. The body has not started running yet.

      3. A **Task** wraps a coroutine and schedules it on an event loop.

      4. The **event loop** is the scheduler that runs ready tasks and waits for I/O completion or timers.


      Calling `download()` is not the same as running it. You must `await` the coroutine or schedule it

      as a Task. If you create a coroutine and never await or schedule it, Python may warn that it was

      never awaited and its work never happens.

      '
  - type: code
    runnable: true
    code: "import inspect\n\nasync def greet():\n    return \"hello\"\n\npending = greet()\nprint(inspect.iscoroutine(pending))\n\
      pending.close()\n"
    expectedOutput: 'True

      '
    caption: The browser can demonstrate that calling async def creates a coroutine object. It cannot
      run a full asyncio event loop in the current synchronous Pyodide runner.
  - type: visualization
    component: step-diagram
    title: From async def to a scheduled task
    caption: Follow the distinction between defining a coroutine, creating its object, scheduling it and
      the event loop running it.
