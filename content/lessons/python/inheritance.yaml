  - id: m-code-bike
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Given `Vehicle`, write a subclass `Bike`:

      - `__init__(self, brand)` calls the parent's initialiser with 2 wheels (use `super()`), then stores `brand`;
      - `describe()` returns the brand, then `" bike with "`, then the parent's description (use `super()`).

      The program should print `Raleigh bike with 2 wheels`.
    starterCode: |
      class Vehicle:
          def __init__(self, wheels):
              self.wheels = wheels

          def describe(self):
              return f"{self.wheels} wheels"


      # Write class Bike here.


      print(Bike("Raleigh").describe())
    solution: |
      class Vehicle:
          def __init__(self, wheels):
              self.wheels = wheels

          def describe(self):
              return f"{self.wheels} wheels"


      class Bike(Vehicle):
          def __init__(self, brand):
              super().__init__(2)
              self.brand = brand

          def describe(self):
              return f"{self.brand} bike with " + super().describe()


      print(Bike("Raleigh").describe())
    expectedOutput: |
      Raleigh bike with 2 wheels
    tests:
      - name: Bike inherits from Vehicle
        code: |
          assert defined("Bike"), "Define a class named Bike."
          assert issubclass(Bike, Vehicle), "Write class Bike(Vehicle): so a bike is a vehicle."
      - name: a Bike has wheels and brand
        code: |
          attrs = vars(Bike("Brompton"))
          assert attrs == {"wheels": 2, "brand": "Brompton"}, f"Expected wheels=2 and brand, got {attrs!r}."
      - name: describe works for any brand
        code: |
          assert Bike("Brompton").describe() == "Brompton bike with 2 wheels", f"Got {Bike('Brompton').describe()!r}."
      - name: both methods use super()
        code: |
          import ast
          cls = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "Bike")
          for f in cls.body:
              if isinstance(f, ast.FunctionDef) and f.name in ("__init__", "describe"):
                  assert any(isinstance(c, ast.Call) and isinstance(c.func, ast.Name) and c.func.id == "super" for c in ast.walk(f)), f"Bike.{f.name} should reuse Vehicle's version through super()."
