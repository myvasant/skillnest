    solution: |
      class Shape:
          def __init__(self, name):
              self.name = name

          def describe(self):
              return f"a {self.name}"


      class Circle(Shape):
          def __init__(self, radius):
              super().__init__("circle")
              self.radius = radius

          def describe(self):
              return super().describe() + f" of radius {self.radius}"


      print(Circle(2).describe())
    expectedOutput: |
      a circle of radius 2
    tests:
      - name: prints the description
        code: |
          assert output().strip() == "a circle of radius 2", f"Your program printed {output()!r}."
      - name: works for any radius
        code: |
          assert Circle(5).describe() == "a circle of radius 5", f"Circle(5).describe() returned {Circle(5).describe()!r}."
      - name: still builds on Shape.describe
        code: |
          import ast
          cls = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "Circle")
          describe = next(f for f in cls.body if isinstance(f, ast.FunctionDef) and f.name == "describe")
          assert any(isinstance(c, ast.Call) and isinstance(c.func, ast.Name) and c.func.id == "super" for c in ast.walk(describe)), "Keep using super().describe() instead of typing 'a circle' yourself."
    hints:
      - What does a function return if it never reaches a return statement?
      - The expression on the last line of Circle.describe is computed and then thrown away.
    feedback:
      - when: { outputEquals: "None\n" }
        message: Circle.describe builds the string but never returns it. Put return in front of the expression.
    explanation: >-
      An expression statement computes a value and discards it; without return the method returns None.
      Adding return passes the combined string back to the caller.

masteryCheck:
  passThreshold: 0.8
