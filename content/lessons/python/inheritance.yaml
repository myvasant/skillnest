  - id: queue-composition
    type: code
    skill: design
    difficulty: 3
    prompt: |
      `TicketQueue` inherits from `list`, so any caller can `insert(0, ...)` to jump the queue, or `sort()`
      it. Refactor it to use **composition**: it must **not** inherit from list, but store a list in an
      attribute and delegate to it. Keep the same public methods:

      - `join(name)` adds a name at the back;
      - `serve()` removes and returns the name at the front (an empty queue raises `IndexError`);
      - `size()` returns how many are waiting;
      - `__repr__()` returns text like `TicketQueue(['Ben', 'Cy'])`.

      The program's output must stay the same.
    starterCode: |
      class TicketQueue(list):
          def join(self, name):
              self.append(name)

          def serve(self):
              return self.pop(0)

          def size(self):
              return len(self)

          def __repr__(self):
              return f"TicketQueue({list(self)})"


      q = TicketQueue()
      q.join("Ana")
      q.join("Ben")
      q.join("Cy")
      print(q.serve(), q.size())
      print(q)
    solution: |
      class TicketQueue:
          def __init__(self):
              self._items = []

          def join(self, name):
              self._items.append(name)

          def serve(self):
              return self._items.pop(0)

          def size(self):
              return len(self._items)

          def __repr__(self):
              return f"TicketQueue({self._items})"


      q = TicketQueue()
      q.join("Ana")
      q.join("Ben")
      q.join("Cy")
      print(q.serve(), q.size())
      print(q)
    expectedOutput: |
      Ana 2
      TicketQueue(['Ben', 'Cy'])
    tests:
      - name: TicketQueue is not a list
        code: |
          assert not issubclass(TicketQueue, list), "A queue is not a list. Remove (list) from the class line and store a list in an attribute instead."
      - name: list-only methods are gone
        code: |
          q2 = TicketQueue()
          for name in ["insert", "sort", "append", "remove", "reverse"]:
              assert not hasattr(q2, name), f"TicketQueue still has .{name}() — callers could use it to break the queue's order."
      - name: first in, first out
        code: |
          q2 = TicketQueue()
          for person in ["x", "y", "z"]:
              q2.join(person)
          assert q2.serve() == "x" and q2.serve() == "y", "serve() must return the earliest-joined name first."
          assert q2.size() == 1, f"After 3 joins and 2 serves, size() should be 1, got {q2.size()!r}."
      - name: serving an empty queue raises IndexError
        code: |
          try:
              TicketQueue().serve()
          except IndexError:
              pass
          else:
              raise AssertionError("serve() on an empty queue should raise IndexError.")
      - name: queues are independent and print correctly
        code: |
          a = TicketQueue()
          b = TicketQueue()
          a.join("Ana")
          assert b.size() == 0, "Two queues share their list. Create the list inside __init__."
          assert repr(a) == "TicketQueue(['Ana'])", f"repr should look like TicketQueue(['Ana']), got {repr(a)!r}."
      - name: output unchanged
        code: |
          assert output_lines() == ["Ana 2", "TicketQueue(['Ben', 'Cy'])"], f"Your program printed {output()!r}."
    hints:
      - "Change the first line to `class TicketQueue:` and add an `__init__` that creates `self._items = []`."
      - "Each method delegates to the list: `self._items.append(name)`, `self._items.pop(0)`, `len(self._items)`."
      - "`__repr__` can show the list directly: `f\"TicketQueue({self._items})\"`."
    feedback:
      - when: { errorType: AttributeError }
        message: Some method still uses list methods on self. After removing the base class, call them on the stored list, e.g. self._items.append(name).
    explanation: >-
      The queue now has a list instead of being one, so its public interface is exactly join, serve, size
      and repr — nobody can insert at the front. Because the list is private, you could later swap it for
      collections.deque (whose popleft() is faster than list.pop(0)) without changing a single caller.

  - id: parsons-super-init
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines so that `Square` reuses `Shape`'s initialiser and the program prints `square 3`.
      Two lines are distractors.
    solution: |
      class Shape:
          def __init__(self, name):
              self.name = name
      class Square(Shape):
          def __init__(self, side):
              super().__init__("square")
              self.side = side
      sq = Square(3)
      print(sq.name, sq.side)
