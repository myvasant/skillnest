  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **The MRO is computed once, when the class is created.** C3 builds it by merging the parents'
          MROs: `L[Service] = Service + merge(L[Logging], L[Caching], [Logging, Caching])`. The merge
          repeatedly takes the first class that does not appear later in any other list. With
          `L[Logging] = [Logging, Base, object]` and `L[Caching] = [Caching, Base, object]`, Base cannot be
          taken until Caching has been, giving `Service, Logging, Caching, Base, object`. If no class can be
          taken, the hierarchy is inconsistent and the `class` statement raises `TypeError`.

          **Attribute lookup walks `type(obj).__mro__`**, checking each class's namespace in order (after
          the instance's own `__dict__`, apart from data descriptors such as properties, which win).
          CPython keeps a per-type cache of lookups so long MROs do not slow down repeated method calls;
          the cache is invalidated when a class is modified.

          **Zero-argument `super()`** works because the compiler gives any method that uses `super` (or
          `__class__`) a hidden reference to the class it was defined in. `super()` inside
          `SavingsAccount.__init__` is therefore shorthand for `super(SavingsAccount, self)`: "search
          `type(self).__mro__`, starting just after SavingsAccount". That is why it reaches Caching in the
          diamond example — the search uses the MRO of the actual object's class.

          **Calling a parent directly** (`Base.__init__(self)`) also works in a simple chain, but it
          bypasses the MRO. In a diamond, both branches call Base directly and Base runs twice:
      - type: code
        runnable: true
        code: |
          class Base:
              def __init__(self):
                  print("Base init")

          class Left(Base):
              def __init__(self):
                  Base.__init__(self)
                  print("Left init")

          class Right(Base):
              def __init__(self):
                  Base.__init__(self)
                  print("Right init")

          class Both(Left, Right):
              def __init__(self):
                  Left.__init__(self)
                  Right.__init__(self)

          Both()
        expectedOutput: |
          Base init
          Left init
          Base init
          Right init
        caption: Replace each direct call with super().__init__() and Base runs exactly once, in MRO order.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `class Child(Base):` — the subclass inherits everything, can add methods and can override them.
          - Attribute lookup: instance → class → parents in **MRO** order (`Class.__mro__`). First match
            wins; `self` is always the original object, so base-class code reaches subclass overrides.
          - Overriding `__init__` replaces the parent's; call `super().__init__(...)` (without `self`) to
            run it.
          - `super()` means "next class in the MRO of this object's class", which makes cooperative
            multiple inheritance run each class once.
          - `isinstance` / `issubclass` respect inheritance; `type(x) is C` does not.
          - **Is-a → inheritance; has-a → composition.** Prefer composition when in doubt: smaller
            interface, swappable parts, no fragile base class.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Composition or inheritance?" is a favourite design question. Give the is-a / has-a test, mention
          the Liskov substitution principle, and back it up with an example such as `Stack(list)` exposing
          `insert`. Senior interviews may ask you to explain the MRO of a diamond and why `super()` calls a
          sibling rather than the parent.

items:
  - id: predict-dispatch
    type: predict-output
    skill: prediction
    prompt: Predict both lines, then step through the tracer below to check.
    code: |
      class Report:
          def title(self):
              return "Report"

          def render(self):
              return "== " + self.title() + " =="

      class SalesReport(Report):
          def title(self):
              return "Sales"

      print(Report().render())
      print(SalesReport().render())
    answer: |
      == Report ==
      == Sales ==
    explanation: >-
      render is inherited, but self is the SalesReport object, so self.title() starts its lookup at
      SalesReport and finds the override. Where a method is written does not decide which methods it calls
      through self.
    wrongAnswers:
      - answer: |
          == Report ==
          == Report ==
        feedback: >-
          This assumes render, being written in Report, calls Report's title. But self.title() looks up title
          on the object's own class first, and the object is a SalesReport.
      - answer: |
          == Report ==
          Sales
        feedback: SalesReport does not override render, so the inherited render still adds the == decorations around the title.

  - id: predict-mro
    type: predict-output
    skill: prediction
    difficulty: 3
    prompt: What does this print? Work out D.__mro__ first.
    code: |
      class A:
          def who(self):
              return "A"

      class B(A):
          def who(self):
              return "B" + super().who()

      class C(A):
          def who(self):
              return "C" + super().who()

      class D(B, C):
          def who(self):
              return "D" + super().who()

      print(D().who())
    answer: "DBCA"
    explanation: >-
      D.__mro__ is D, B, C, A, object. Each super() call moves to the next class in that order for the D
      object: D → B → C → A. So B's super() reaches C, not A, and A runs once at the end.
    wrongAnswers:
      - answer: "DBA"
        feedback: >-
          super() is not "my parent". Inside B, for a D object, the next class in D's MRO after B is C. C is
          skipped only if someone stops calling super().
      - answer: "DBACA"
        feedback: C3 linearization lists every class once, so A appears only at the end of the MRO and runs once.
      - answer: "DCBA"
        feedback: The bases are listed as (B, C), and C3 keeps that order, so B comes before C.

  - id: is-a-or-has-a
    type: mcq
    skill: design
    prompt: Which pair is the best fit for inheritance (`class X(Y)`) rather than composition?
    explanation: >-
      Inheritance fits a true is-a relationship where the subclass can be used anywhere the base is
      expected. Every savings account is a bank account. The other pairs are has-a or uses relationships.
    options:
      - id: a
        text: SavingsAccount and BankAccount
        correct: true
        feedback: Every savings account is a bank account and should work wherever one is expected — a genuine is-a.
      - id: b
        text: Car and Engine
        feedback: A car has an engine; it is not a kind of engine. Store an Engine in an attribute and delegate start().
      - id: c
        text: ShoppingCart and list (a cart stores items)
        feedback: A cart has a list of items. Inheriting from list would expose insert, sort and clear, letting callers bypass the cart's rules.
      - id: d
        text: InvoiceReport and EmailSender (the report must be emailed)
        feedback: The report uses a sender. Pass the sender in as an attribute, so you can swap it for SMS or a test fake.

  - id: explain-fragile-base
    type: explain
    skill: explanation
    difficulty: 2
    prompt: >-
      In your own words: why did the first CountingInventory report 4 instead of 2, why is this called the
      fragile base class problem, and how does the composition version avoid it?
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Explains that the base add_many calls self.add, and since self is a CountingInventory the overridden add counts each item again.
      - Says the subclass depends on an internal detail of the base class (which of its methods call which), not on its public behaviour.
      - Explains that a change to the base class's internals could silently change or break the subclass — hence "fragile".
      - Explains that the composition version only calls the inventory's public methods, and inside the Inventory self is the Inventory, so the count cannot be affected.
    modelAnswer: |
      The subclass added len(items) in add_many and then called the base add_many. That method loops and
      calls self.add(item) — and because self is a CountingInventory, the lookup finds the overridden add,
      which counts every item a second time: 2 + 2 = 4. The subclass silently depended on an internal
      implementation detail of Inventory, namely that add_many calls add. If the Inventory author later
      changed add_many to use items.extend, the subclass's behaviour would change without any change in
      the subclass — a base class that cannot safely change its internals is "fragile". With composition,
      CountingInventory holds an Inventory and calls its public methods. Inside Inventory.add_many, self is
      the Inventory object, so nothing calls back into the counter, and the count depends only on the
      counter's own code.

  - id: mcq-super-args
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      This subclass fails with `TypeError: BankAccount.__init__() takes from 2 to 3 positional arguments but 4 were given`. Why?

      ```python
      class SavingsAccount(BankAccount):
          def __init__(self, owner, balance, rate):
              super().__init__(self, owner, balance)
              self.rate = rate
      ```
    explanation: >-
      super() returns an object already bound to self, just like calling a method on an instance. Passing
      self explicitly adds it a second time, so BankAccount.__init__ receives (self, self, owner, balance) —
      four positional arguments instead of at most three.
    options:
      - id: a
        text: super() already passes self, so writing self again adds an extra argument.
        correct: true
        feedback: Right. Write super().__init__(owner, balance).
      - id: b
        text: super() cannot be used inside __init__.
        feedback: Calling super().__init__ inside __init__ is the standard way to run the parent's initialiser.
      - id: c
        text: BankAccount.__init__ must also accept rate.
        feedback: The parent doesn't need to know about rate — the subclass stores it itself after calling super().
      - id: d
        text: SavingsAccount must also list object as a base class.
        feedback: Every class already inherits from object; listing it changes nothing here.

  - id: discounted-product
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a subclass `DiscountedProduct` of `Product`:

      - `__init__(self, name, price, percent)` lets `Product` store `name` and `price` (use `super()`), then
        stores `percent`;
      - `final_price()` takes the parent's `final_price()` (use `super()`) and reduces it by `percent` per cent.

      The program should then print:

      ```text
      Product('pen', 50) DiscountedProduct('book', 300.0)
      True
      ```
    starterCode: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          def final_price(self):
              return self.price

          def __repr__(self):
              return f"{type(self).__name__}({self.name!r}, {self.final_price()})"


      # Write class DiscountedProduct(Product) here.


      pen = Product("pen", 50)
      book = DiscountedProduct("book", 400, 25)
      print(pen, book)
      print(isinstance(book, Product))
    solution: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          def final_price(self):
              return self.price

          def __repr__(self):
              return f"{type(self).__name__}({self.name!r}, {self.final_price()})"


      class DiscountedProduct(Product):
          def __init__(self, name, price, percent):
              super().__init__(name, price)
              self.percent = percent

          def final_price(self):
              return super().final_price() * (100 - self.percent) / 100


      pen = Product("pen", 50)
      book = DiscountedProduct("book", 400, 25)
      print(pen, book)
      print(isinstance(book, Product))
    expectedOutput: |
      Product('pen', 50) DiscountedProduct('book', 300.0)
      True
    tests:
      - name: DiscountedProduct is a subclass of Product
        code: |
          assert defined("DiscountedProduct"), "Define a class named DiscountedProduct."
          assert issubclass(DiscountedProduct, Product), "Write class DiscountedProduct(Product): so it inherits from Product."
      - name: stores name, price and percent
        code: |
          attrs = vars(DiscountedProduct("lamp", 200, 10))
          assert attrs == {"name": "lamp", "price": 200, "percent": 10}, f"Expected attributes name, price and percent, got {attrs!r}."
      - name: final_price applies the discount for any values
        code: |
          assert DiscountedProduct("lamp", 200, 10).final_price() == 180, "200 with 10% off should be 180."
          assert DiscountedProduct("mug", 80, 0).final_price() == 80, "0% off should leave the price unchanged."
      - name: reuses the parent with super()
        code: |
          import ast
          cls = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "DiscountedProduct")
          methods = {f.name: f for f in cls.body if isinstance(f, ast.FunctionDef)}
          for name in ("__init__", "final_price"):
              assert name in methods, f"DiscountedProduct needs its own {name} method."
              calls_super = any(isinstance(c, ast.Call) and isinstance(c.func, ast.Name) and c.func.id == "super" for c in ast.walk(methods[name]))
              assert calls_super, f"In DiscountedProduct.{name}, call super() to reuse Product's version instead of copying it."
      - name: prints the two lines
        code: |
          assert output_lines() == ["Product('pen', 50) DiscountedProduct('book', 300.0)", "True"], f"Your program printed {output()!r}."
    hints:
      - "Start with `class DiscountedProduct(Product):` and an `__init__(self, name, price, percent)`."
      - "First line of that __init__: `super().__init__(name, price)` — no self in the brackets."
      - "In final_price: `return super().final_price() * (100 - self.percent) / 100`."
    feedback:
      - when: { errorType: NameError }
        message: DiscountedProduct is not defined yet. Write the class between the comment and the program lines.
      - when: { errorMessageContains: "positional arguments but" }
        message: super() already passes self. Call super().__init__(name, price), without self.
      - when: { errorType: AttributeError }
        message: An attribute is missing. Did your __init__ call super().__init__(name, price) before storing percent?
    explanation: >-
      super().__init__ lets Product set name and price on the new object, so that code exists once. The
      override of final_price builds on the parent's result. Product's __repr__ is inherited and, because
      it calls self.final_price(), shows the discounted price for a DiscountedProduct.

  - id: debug-missing-super
    type: debug
    skill: debugging
    prompt: |
      This program should print `Grace 6500` but crashes with an AttributeError. Fix `Manager` so that
      `Employee` sets up the attributes it is responsible for.
    starterCode: |
      class Employee:
          def __init__(self, name, salary):
              self.name = name
              self.salary = salary

          def pay(self):
              return self.salary


      class Manager(Employee):
          def __init__(self, name, salary, bonus):
