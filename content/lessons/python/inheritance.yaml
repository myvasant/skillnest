    solution: |
      class Employee:
          def __init__(self, name, salary):
              self.name = name
              self.salary = salary

          def pay(self):
              return self.salary


      class Manager(Employee):
          def __init__(self, name, salary, bonus):
              super().__init__(name, salary)
              self.bonus = bonus

          def pay(self):
              return super().pay() + self.bonus


      boss = Manager("Grace", 5000, 1500)
      print(boss.name, boss.pay())
    expectedOutput: |
      Grace 6500
    tests:
      - name: prints Grace 6500
        code: |
          assert output().strip() == "Grace 6500", f"Your program printed {output()!r}."
      - name: a Manager has all three attributes
        code: |
          attrs = vars(Manager("Ana", 100, 5))
          assert attrs == {"name": "Ana", "salary": 100, "bonus": 5}, f"Expected name, salary and bonus, got {attrs!r}."
          assert Manager("Ana", 100, 5).pay() == 105, "pay() should be salary + bonus."
      - name: Employee's __init__ does the Employee part
        code: |
          import ast
          cls = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.ClassDef) and n.name == "Manager")
          init = next(f for f in cls.body if isinstance(f, ast.FunctionDef) and f.name == "__init__")
          assert any(isinstance(c, ast.Call) and isinstance(c.func, ast.Name) and c.func.id == "super" for c in ast.walk(init)), "Let Employee set name and salary by calling super().__init__(name, salary) instead of repeating its code."
    hints:
      - The error says the Manager object has no attribute name. Which method was supposed to set it?
      - Manager defines its own __init__, so Employee.__init__ never runs on its own.
      - "Add `super().__init__(name, salary)` as the first line of Manager.__init__."
    feedback:
      - when: { errorType: AttributeError }
        message: The Manager still lacks name or salary. Call super().__init__(name, salary) inside Manager.__init__.
      - when: { errorMessageContains: "positional arguments but" }
        message: Do not pass self to super().__init__ — super() supplies it already.
