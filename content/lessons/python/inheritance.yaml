id: python.inheritance
concept: python.inheritance
title: Inheritance and Composition
subtitle: Reusing behaviour with is-a and has-a
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Build specialised classes from existing ones with inheritance, override and extend methods with
  super(), and see how Python's method resolution order decides which method runs. Then learn why
  composition — building objects from parts — is usually the safer default, with a worked refactor.
objectives:
  - Distinguish is-a relationships (inheritance) from has-a relationships (composition) and choose between them.
  - Write a subclass that overrides a method and extends its parent with super(), including in __init__.
  - Predict which method runs using the method resolution order (Class.__mro__), including with multiple inheritance.
  - Use isinstance() and issubclass() correctly and explain why they respect inheritance.
  - Refactor an inheritance-based class into composition and explain the fragile base class problem.
sources:
  - title: "The Python Tutorial: Inheritance"
    url: https://docs.python.org/3/tutorial/classes.html#inheritance
    publisher: Python Software Foundation
  - title: "The Python Tutorial: Multiple Inheritance"
    url: https://docs.python.org/3/tutorial/classes.html#multiple-inheritance
    publisher: Python Software Foundation
  - title: "Built-in Functions: super()"
    url: https://docs.python.org/3/library/functions.html#super
    publisher: Python Software Foundation
  - title: "Built-in Functions: isinstance()"
    url: https://docs.python.org/3/library/functions.html#isinstance
    publisher: Python Software Foundation
  - title: The Python 2.3 Method Resolution Order (C3, still used by Python 3)
    url: https://docs.python.org/3/howto/mro.html
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why inheritance exists
    kind: why
    blocks:
      - type: markdown
        body: |
          Suppose your bank charges most accounts a monthly fee of 5, but student accounts pay nothing.
          Everything else — owner, balance, how fees are charged, how an account prints — is identical.

          Without inheritance you would copy the whole `BankAccount` class, rename it `StudentAccount`
          and change one number. Now there are two copies of every method. Fix a bug in one and you must
          remember to fix the other — and one day someone won't.

          [Inheritance](glossary:inheritance) lets you say "a student account **is a** bank account,
          except for this one difference" and write only the difference:
      - type: code
        runnable: true
        code: |
          class BankAccount:
              def __init__(self, owner, balance=0):
                  self.owner = owner
                  self.balance = balance

              def monthly_fee(self):
                  return 5

              def charge_fee(self):
                  self.balance -= self.monthly_fee()

              def __repr__(self):
                  return f"{type(self).__name__}({self.owner!r}, {self.balance})"


          class StudentAccount(BankAccount):
              def monthly_fee(self):
                  return 0


          regular = BankAccount("Ada", 100)
          student = StudentAccount("Sam", 100)
          for account in [regular, student]:
              account.charge_fee()
          print(regular, student)
        expectedOutput: |
          BankAccount('Ada', 95) StudentAccount('Sam', 100)
        annotations:
          - line: 12
            text: "`type(self).__name__` makes the repr show the real class, so subclasses print correctly too."
          - line: 15
            text: StudentAccount inherits everything from BankAccount...
          - line: 16
            text: "...and overrides just this one method."
          - line: 23
            text: charge_fee is inherited, but self.monthly_fee() finds the student version for student.
      - type: markdown
        body: |
          Inheritance is powerful, and also the most over-used feature in object-oriented code. This
          lesson teaches how it works precisely, then when **not** to use it — and the alternative,
          [composition](glossary:composition), that experienced engineers reach for first.

  - id: subclassing
    title: Subclasses inherit everything
    kind: concept
    blocks:
      - type: markdown
        body: |
          `class SavingsAccount(BankAccount):` defines a [subclass](glossary:subclass) (also called a
          *child* or *derived* class) of the [base class](glossary:base-class) `BankAccount` (the *parent*
          or *superclass*). The subclass:

          - **inherits** every attribute and method of the base class, including `__init__`;
          - can **add** new methods and attributes;
          - can **override** inherited methods by defining one with the same name.

          An instance of the subclass is also an instance of the base class: a savings account *is* a bank
          account. Every class ultimately inherits from the built-in class `object`.
      - type: code
        runnable: true
        code: |
          class BankAccount:
              def __init__(self, owner, balance=0):
                  self.owner = owner
                  self.balance = balance

              def deposit(self, amount):
                  self.balance += amount


          class SavingsAccount(BankAccount):
              def add_interest(self, rate):
                  self.deposit(self.balance * rate)


          s = SavingsAccount("Ada", 200)
          s.deposit(100)
          s.add_interest(0.1)
          print(s.balance)
          print(isinstance(s, SavingsAccount), isinstance(s, BankAccount))
          print(SavingsAccount.__bases__)
        expectedOutput: |
          330.0
          True True
          (<class '__main__.BankAccount'>,)
        annotations:
          - line: 14
            text: SavingsAccount has no __init__ of its own, so BankAccount.__init__ runs.
          - line: 15
            text: deposit is not on SavingsAccount, so the lookup continues to BankAccount.
          - line: 16
            text: "add_interest is new: 300 * 0.1 = 30.0 is deposited."
          - line: 19
            text: "__bases__ lists the direct parents."

  - id: overriding
    title: Overriding and extending with super()
    kind: concept
    blocks:
      - type: markdown
        body: |
          [Overriding](glossary:method-overriding) a method **replaces** the inherited version for the
          subclass. Often you don't want to replace it completely — you want the parent's behaviour **plus**
          something extra. [`super()`](glossary:super-function) gives you access to the parent's version:

          - `super().describe()` — run the parent's `describe` on this same object, then build on its result.
          - `super().__init__(owner, balance)` — let the parent set up *its* attributes, then add yours.

          Overriding `__init__` is the case that matters most: if your subclass defines `__init__`, the
          parent's `__init__` **no longer runs automatically**. Python only ever calls one `__init__` — the
          first it finds. Calling `super().__init__(...)` is how you make the parent's run too.
      - type: code
        runnable: true
        code: |
          class BankAccount:
              def __init__(self, owner, balance=0):
                  self.owner = owner
                  self.balance = balance

              def describe(self):
                  return f"{self.owner}: {self.balance}"


          class SavingsAccount(BankAccount):
              def __init__(self, owner, balance=0, rate=0.02):
                  super().__init__(owner, balance)
                  self.rate = rate

              def describe(self):
                  return super().describe() + f" (saving at {self.rate:.0%})"


          s = SavingsAccount("Ada", 500, 0.04)
          print(s.describe())
          print(vars(s))
        expectedOutput: |
          Ada: 500 (saving at 4%)
          {'owner': 'Ada', 'balance': 500, 'rate': 0.04}
        annotations:
          - line: 12
            text: "Parent first: BankAccount.__init__ sets owner and balance on this object. Note: no self in the arguments."
          - line: 13
            text: Then the subclass adds its own attribute.
          - line: 16
            text: Extend, don't copy — reuse the parent's text and append to it.
          - line: 21
            text: One object, with attributes set by both __init__ methods.
      - type: callout
        variant: tip
        title: Keep the signature compatible
        body: |
          An overriding method should accept the same arguments and return the same kind of value as the
          one it overrides. Code written for `BankAccount` calls `account.describe()` and expects a string;
          a subclass that suddenly requires an argument, or returns `None`, breaks that code.

  - id: lookup
    title: "Mental model: lookup walks up a chain"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Extend the model from the classes lesson: to find `obj.name`, Python looks in the **instance**,
          then the instance's **class**, then that class's **parent**, and so on up to `object`. **The first
          match wins.** That chain is called the [method resolution order](glossary:mro) (MRO).

          Two consequences follow, and both surprise people:

          1. `self` is always the **original object**. When an inherited method calls `self.something()`,
             the lookup starts again at the object's own class — so it finds the subclass's override, even
             though the calling method was written in the base class.
          2. Nothing runs "automatically" from parent classes. A parent's method runs only if the lookup
             finds it, or if you call it with `super()`.

          Step through `super().__init__` and watch the second `__init__` frame appear on top of the first,
          working on the same object:
      - type: visualization
        component: python-tracer
        title: super().__init__ sets up the same object
        caption: >-
          Both __init__ frames receive the same self. The parent adds owner and balance; when it returns,
          the subclass adds rate.
        props:
          code: |
            class Account:
                def __init__(self, owner):
                    self.owner = owner
                    self.balance = 0

            class SavingsAccount(Account):
                def __init__(self, owner, rate):
                    super().__init__(owner)
                    self.rate = rate

            s = SavingsAccount("Ada", 0.04)
            print(s.owner, s.balance, s.rate)
      - type: markdown
        body: |
          Now apply consequence 1. `render` is written in `Report`, but `self` may be a subclass:
      - type: item
        ref: predict-dispatch
      - type: visualization
        component: python-tracer
        title: An inherited method calling an override
        caption: When render runs for a SalesReport, self.title() is looked up on SalesReport first.
        props:
          code: |
            class Report:
                def title(self):
                    return "Report"

                def render(self):
                    return "== " + self.title() + " =="

            class SalesReport(Report):
                def title(self):
                    return "Sales"

            print(Report().render())
            print(SalesReport().render())

  - id: mro
    title: Method resolution order and multiple inheritance
    kind: concept
    blocks:
      - type: markdown
        body: |
          A class may list several bases: `class Service(Logging, Caching):`. Then "go to the parent" is
          ambiguous, so Python computes one linear order for every class, stored as `Class.__mro__`. It
          uses the **C3 linearization** algorithm, which guarantees:

          - a class always comes **before its parents**;
          - parents keep the **order you listed them** in the class statement;
          - every class appears **once**.

          `super()` means "**the next class in the MRO of this object's class**" — not "my parent". In a
          diamond-shaped hierarchy that difference is what makes every class run exactly once:
      - type: code
        runnable: true
        code: |
          class Base:
              def setup(self):
                  print("Base.setup")

          class Logging(Base):
              def setup(self):
                  print("Logging.setup")
                  super().setup()

          class Caching(Base):
              def setup(self):
                  print("Caching.setup")
                  super().setup()

          class Service(Logging, Caching):
              def setup(self):
                  print("Service.setup")
                  super().setup()

          Service().setup()
          print([cls.__name__ for cls in Service.__mro__])
        expectedOutput: |
          Service.setup
          Logging.setup
          Caching.setup
          Base.setup
          ['Service', 'Logging', 'Caching', 'Base', 'object']
        annotations:
          - line: 8
            text: "For a Service object, the class after Logging in the MRO is Caching — not Base!"
          - line: 21
            text: The MRO is a plain tuple of classes you can inspect.
      - type: item
        ref: predict-mro
      - type: callout
        variant: production
        title: Multiple inheritance in practice
        body: |
          Real code uses multiple inheritance mostly for **mixins**: small classes that add one capability
          (for example `to_json()`) and are combined with a main base class. Each method in the chain must
          call `super()` and accept compatible arguments for the cooperation to work. If you find yourself
          drawing a complicated diamond on a whiteboard, composition is probably the better design.

  - id: isinstance
    title: isinstance() and issubclass()
    kind: concept
    blocks:
      - type: markdown
        body: |
          `isinstance(obj, Class)` asks "is obj an instance of Class **or of any subclass of it**?".
          `issubclass(A, B)` asks the same question about two classes. Both accept a tuple of classes,
          meaning "any of these". Because they respect inheritance, they are almost always what you want —
          `type(obj) is Class` rejects subclasses, which breaks the promise that a subclass instance can be
          used wherever its parent is expected.
      - type: code
        runnable: true
        code: |
          class BankAccount:
              pass

          class SavingsAccount(BankAccount):
              pass

          s = SavingsAccount()
          print(isinstance(s, SavingsAccount), isinstance(s, BankAccount), isinstance(s, object))
          print(type(s) is BankAccount, type(s).__name__)
          print(issubclass(SavingsAccount, BankAccount), issubclass(BankAccount, SavingsAccount))
          print(isinstance(True, int), isinstance(3, (str, float)))
          print(bool.__mro__)
        expectedOutput: |
          True True True
          False SavingsAccount
          True False
          True False
          (<class 'bool'>, <class 'int'>, <class 'object'>)
        annotations:
          - line: 9
            text: type() reports only the exact class.
          - line: 11
            text: "Surprise: bool is a subclass of int, so True is an int (True + True == 2)."
      - type: callout
        variant: tip
        title: Prefer behaviour over type checks
        body: |
          A long `if isinstance(x, A): ... elif isinstance(x, B): ...` chain usually means each class
          should have its own method instead — like `monthly_fee()` above — so the caller simply calls it.
          That idea, [polymorphism](concept:python.polymorphism), is the next step after this lesson.

  - id: composition
    title: "Composition: the default alternative"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Inheritance models **is-a**: every `SavingsAccount` is a `BankAccount` and must work anywhere a
          `BankAccount` is expected. [Composition](glossary:composition) models **has-a**: an object holds
          other objects as attributes and **delegates** work to them. A car *has an* engine; an order *has*
          line items; a notifier *has a* message sender.

          | Ask | If yes | Example |
          |---|---|---|
          | Is every X truly a Y, usable anywhere a Y is expected? | Inheritance can fit | `SavingsAccount(BankAccount)` |
          | Does X just need some of Y's abilities? | Composition | A `Stack` that stores items in a list |
          | Might you want to swap the part (another sender, a fake in tests)? | Composition | `OrderNotifier(sender)` |
          | Would X inherit methods that break its own rules? | Composition | `Stack(list)` inherits `insert` |
      - type: item
        ref: is-a-or-has-a
      - type: markdown
        body: |
          ### Worked refactor: a stack that is not a list

          A [stack](https://docs.python.org/3/tutorial/datastructures.html#using-lists-as-stacks) allows
          only three things: push an item on top, look at the top, pop the top. Its invariant is "the only
          item you can remove is the one added most recently". A tempting shortcut is to inherit from
          `list`, since a list already stores items:
      - type: code
        runnable: true
        code: |
          class Stack(list):
              def push(self, item):
                  self.append(item)

              def peek(self):
                  return self[-1]

          s = Stack()
          s.push("a")
          s.push("b")
          s.insert(0, "sneaky")     # inherited from list
          s.sort()                  # also inherited
          print(s, s.peek())
        expectedOutput: |
          ['a', 'b', 'sneaky'] sneaky
        caption: The "top" of the stack is now an item that was never pushed last. The stack's rules are broken.
      - type: markdown
        body: |
          The stack inherited every list method — `insert`, `sort`, `remove`, `reverse`, `clear` and dozens
          more — and each one is a way to break its invariant. A stack is not a list; it **has** a list.
          The refactor takes four steps:

          1. Remove the base class and store a list in an attribute: `self._items = []` (the underscore says
             "internal").
          2. Write the methods the stack really offers, each **delegating** to the list.
          3. Everything else disappears from the public interface — callers can only do what a stack allows.
          4. The storage is now a private detail: you could later switch to another structure without
             changing any caller.
      - type: code
        runnable: true
        code: |
          class Stack:
              def __init__(self):
                  self._items = []

              def push(self, item):
                  self._items.append(item)

              def pop(self):
                  if not self._items:
                      raise IndexError("pop from empty stack")
                  return self._items.pop()

              def peek(self):
                  if not self._items:
                      raise IndexError("peek at empty stack")
                  return self._items[-1]

              def size(self):
                  return len(self._items)

              def __repr__(self):
                  return f"Stack({self._items})"

          s = Stack()
          s.push("a")
          s.push("b")
          print(s, s.peek(), s.size())
          print(s.pop(), s)
          print(hasattr(s, "insert"), isinstance(s, list))
        expectedOutput: |
          Stack(['a', 'b']) b 2
          b Stack(['a'])
          False False
        annotations:
          - line: 3
            text: Has-a — the stack owns a list instead of being one.
          - line: 9
            text: A clear, stack-specific error instead of the list's.
          - line: 29
            text: "insert no longer exists on a Stack: the invariant is protected."
      - type: markdown
        body: |
          ### Composition lets you swap parts

          Because the part is just an attribute, the caller can choose it. Here a notifier *has a* sender. In
          production it gets a real sender; in a test it gets a fake that records messages (a preview of
          [test doubles](concept:python.mocking)). If `OrderNotifier` inherited from `EmailSender`, it would
          be welded to email forever.
      - type: code
        runnable: true
        code: |
          class EmailSender:
              def send(self, to, text):
                  return f"email to {to}: {text}"

          class FakeSender:
              def __init__(self):
                  self.sent = []

              def send(self, to, text):
                  self.sent.append((to, text))
                  return "recorded"

          class OrderNotifier:
              def __init__(self, sender):
                  self.sender = sender

              def order_shipped(self, customer):
                  return self.sender.send(customer, "Your order has shipped")

          print(OrderNotifier(EmailSender()).order_shipped("ada@example.com"))
          fake = FakeSender()
          OrderNotifier(fake).order_shipped("sam@example.com")
          print(fake.sent)
        expectedOutput: |
          email to ada@example.com: Your order has shipped
          [('sam@example.com', 'Your order has shipped')]
        annotations:
          - line: 15
            text: The notifier has a sender — whichever one it was given.
          - line: 18
            text: Delegation — the notifier asks its part to do the work.

  - id: fragile
    title: When inheritance goes wrong
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A subclass is tightly coupled to its base class: it sees, and often depends on, how the base
          class is implemented *inside*. This example wants to count how many items were ever added, so it
          overrides **both** adding methods:
      - type: code
        runnable: true
        code: |
          class Inventory:
              def __init__(self):
                  self.items = []

              def add(self, item):
                  self.items.append(item)

              def add_many(self, items):
                  for item in items:
                      self.add(item)


          class CountingInventory(Inventory):
              def __init__(self):
                  super().__init__()
                  self.added = 0

              def add(self, item):
                  self.added += 1
                  super().add(item)

              def add_many(self, items):
                  self.added += len(items)
                  super().add_many(items)


          inv = CountingInventory()
          inv.add_many(["pen", "ink"])
          print(inv.added, inv.items)
        expectedOutput: |
          4 ['pen', 'ink']
        caption: Two items, counted four times.
      - type: markdown
        body: |
          Trace it: `CountingInventory.add_many` adds 2, then calls `Inventory.add_many`, which calls
          `self.add(item)` for each item. `self` is a `CountingInventory`, so the **overridden** `add` runs
          and counts each item again: 2 + 2 = 4.

          The subclass author could not see this from `Inventory`'s public behaviour — it depends on an
          internal detail ("add_many happens to call add"). Worse, if the base class author later
          "optimises" `add_many` to `self.items.extend(items)`, a subclass that relied on the old detail
          silently starts counting differently. A harmless-looking change in the base class breaks the
          subclass: this is the [fragile base class problem](glossary:fragile-base-class).

          **The composition version** wraps an `Inventory` and counts in its own methods. It only uses the
          inventory's public methods, so the inventory's internals cannot affect the count:
      - type: code
        runnable: true
        code: |
          class Inventory:
              def __init__(self):
                  self.items = []

              def add(self, item):
                  self.items.append(item)

              def add_many(self, items):
                  for item in items:
                      self.add(item)


          class CountingInventory:
              def __init__(self):
                  self.inventory = Inventory()
                  self.added = 0

              def add(self, item):
                  self.added += 1
                  self.inventory.add(item)

              def add_many(self, items):
                  self.added += len(items)
                  self.inventory.add_many(items)


          inv = CountingInventory()
          inv.add_many(["pen", "ink"])
          print(inv.added, inv.inventory.items)
        expectedOutput: |
          2 ['pen', 'ink']
        annotations:
          - line: 15
            text: Has-a. When Inventory.add_many calls self.add, self is the Inventory, not the counter.
      - type: markdown
        body: |
          **Warning signs that inheritance is the wrong tool:**

          - The subclass inherits methods that make no sense for it, or overrides them just to raise an
            error. It is not really an "is-a".
          - The subclass breaks a promise of the base class. If code relies on "a rectangle's width and
            height can change independently", a `Square` subclass that forces them equal breaks that code.
            The rule that a subclass must be usable anywhere its base is expected is called the
            [Liskov substitution principle](glossary:liskov-substitution).
          - You inherit only to reuse a few helper methods ("inheritance for code reuse").
          - The hierarchy is more than two or three levels deep and nobody can say which method runs.
      - type: item
        ref: explain-fragile-base

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `AttributeError: 'SavingsAccount' object has no attribute 'owner'` | The subclass defines `__init__` but never calls `super().__init__(...)`, so the parent's attributes were never set | Call `super().__init__(owner, balance)` at the start of the subclass's `__init__` |
          | `TypeError: BankAccount.__init__() missing 1 required positional argument: 'owner'` | `super().__init__()` was called without the arguments the parent needs | Pass the parent's arguments (not `self`) |
          | `TypeError: ... takes from 2 to 3 positional arguments but 4 were given` | `super().__init__(self, ...)` — `super()` already supplies `self` | Remove `self` from the argument list |
          | An overridden method returns `None` | `super().describe() + "..."` computed but not returned | `return super().describe() + "..."` |
          | `TypeError: Cannot create a consistent method resolution order (MRO) for bases ...` | The bases are listed in an order C3 cannot satisfy, e.g. a parent before its own subclass | List more specific classes first, or simplify the hierarchy |
          | A parent's method runs twice | Calling `Parent.method(self)` directly in a diamond hierarchy | Use `super()` consistently in every class |
          | A subclass's rules can be bypassed with inherited methods | Inheriting from a class (like `list`) for convenience | Use composition and delegate only what you need |
      - type: code
        runnable: true
        code: |
          class BankAccount:
              def __init__(self, owner, balance=0):
                  self.owner = owner
                  self.balance = balance

          class SavingsAccount(BankAccount):
              def __init__(self, owner, balance, rate):
                  self.rate = rate                 # forgot super().__init__(owner, balance)

          s = SavingsAccount("Ada", 100, 0.02)
          print(s.owner)
        expectError: AttributeError
        caption: "The object only has rate. Python calls exactly one __init__ — the subclass's — and it never asked the parent to run."
      - type: code
        runnable: true
        code: |
          class Animal:
              pass

          class Dog(Animal):
              pass

          class Puppy(Animal, Dog):
              pass
        expectError: TypeError
        caption: "Animal is listed before its own subclass Dog, which contradicts 'a class comes before its parents'."
      - type: item
        ref: mcq-super-args

