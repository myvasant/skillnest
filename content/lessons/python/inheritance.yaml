  - id: m-debug-override-return
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This should print `a circle of radius 2`, but it prints `None`. Fix the bug in `Circle`.
    starterCode: |
      class Shape:
          def __init__(self, name):
              self.name = name

          def describe(self):
