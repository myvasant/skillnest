  - id: m-tf-super-parent
    type: true-false
    skill: recognition
    difficulty: 2
    prompt: "True or false: `super().method()` always calls the method defined in the direct parent class of the class where it is written."
    answer: false
    explanation: >-
      super() looks for the next class after the current one in the MRO of the object's actual class. In
      single inheritance that is the parent, but with multiple inheritance it can be a sibling — as in the
