      - "class Square:"
      - "        super().__init__(self, \"square\")"
    expectedOutput: |
      square 3
    explanation: >-
      Square must list Shape as its base, and its __init__ calls super().__init__("square") — without self,
      which super() supplies — before adding its own side attribute.

  # ----- Mastery check (new items, not used in the sections) -----
  - id: m-predict-init-chain
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      class A:
          def __init__(self):
              print("A init")

      class B(A):
          def __init__(self):
              print("B init")

      class C(B):
          def __init__(self):
              print("C init")
              super().__init__()

      C()
    answer: |
      C init
      B init
    explanation: >-
      Python calls C.__init__ only. It explicitly calls super().__init__(), which runs B.__init__. B never
      calls super(), so A.__init__ never runs. Parent initialisers are not called automatically.
    wrongAnswers:
      - answer: |
          C init
          B init
          A init
        feedback: The chain continues only while each __init__ calls super(). B.__init__ does not, so A is never reached.
      - answer: |
          A init
          B init
          C init
        feedback: Some languages run parent constructors first automatically. Python does not — only the explicitly called methods run, in the order they are called.
      - answer: "C init"
        feedback: C.__init__ does call super().__init__(), which finds B's version next in the MRO.

  - id: m-mcq-composition
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      A `Car` needs to start and stop an engine, and you want to test cars with a fake engine that does
      not make noise. Which design is best?
    explanation: >-
      A car has an engine — a has-a relationship. Storing the engine in an attribute (passed in when the
      car is created) lets Car delegate start/stop and lets tests pass a fake engine.
    options:
      - id: a
        text: class Car(Engine) so that Car gets start() and stop() for free.
        feedback: A car is not a kind of engine, and inheriting welds Car to one engine class — you could not substitute a fake.
      - id: b
        text: Give Car an engine attribute, set from an argument to __init__, and delegate start/stop to it.
        correct: true
        feedback: Composition — has-a, delegate, and the part is swappable (a real engine or a test fake).
      - id: c
        text: class Engine(Car), because the engine belongs to the car.
        feedback: An engine is not a kind of car either. Belonging-to is has-a, not is-a.
      - id: d
