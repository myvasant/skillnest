cheatsheet: |
  ```python
  class SavingsAccount(BankAccount):          # is-a: inherits everything
      def __init__(self, owner, balance, rate):
          super().__init__(owner, balance)    # run the parent's __init__ (no self!)
          self.rate = rate
      def describe(self):                     # override + extend
          return super().describe() + f" at {self.rate:.0%}"

  SavingsAccount.__mro__                      # lookup order: class, parents..., object
  isinstance(obj, BankAccount)                # True for subclasses too
  issubclass(SavingsAccount, BankAccount)     # True

  class Stack:                                # has-a: composition
      def __init__(self):
          self._items = []                    # the part
      def push(self, item):
          self._items.append(item)            # delegate
  ```
  - Lookup: instance → class → MRO… → object; first match wins; `self` is the original object
  - `super()` = next class in the MRO of `type(self)` (not always the parent)
  - Prefer composition unless it is a true is-a that honours the parent's promises
