id: python.setup
concept: python.setup
title: Installing and Running Python Locally
subtitle: Know which interpreter you are using and how to start it
estimatedMinutes: 40
reviewedOn: 2026-11-04
summary: >-
  Learn the difference between the Python interpreter, an interactive session and a script file. Use
  terminal commands to start Python, run a saved program, execute a module and inspect the interpreter
  selected by the shell. Diagnose the common case where several Python installations exist.
objectives:
  - Explain what the Python interpreter does when it runs source code.
  - Distinguish the interactive REPL from running a saved .py script.
  - Use python, python3 or the Windows py launcher to check and start an interpreter.
  - Run a file, a module and a short command from a terminal.
  - Explain why the editor, terminal and virtual environment must use the intended interpreter.
  - Inspect the running interpreter with sys.version_info and sys.executable.
sources:
  - title: Python Setup and Usage
    url: https://docs.python.org/3/using/index.html
    publisher: Python Software Foundation
  - title: Using Python on Windows
    url: https://docs.python.org/3/using/windows.html
    publisher: Python Software Foundation
  - title: The Python Tutorial — Using the Python Interpreter
    url: https://docs.python.org/3/tutorial/interpreter.html
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why the interpreter matters
    kind: why
    blocks:
      - type: markdown
        body: |
          A `.py` file is source code: text that describes what you want Python to do. The **Python
          interpreter** is the program that reads and executes that code. Installing an editor does not
          install every Python version, and installing Python does not guarantee that your terminal or
          editor will use the version you intended.

          A computer can have several Python interpreters. One project may need Python 3.12 while another
          uses Python 3.14. The important question is not only “Is Python installed?” but also “Which Python
          executable is this command or editor actually running?”
      - type: callout
        variant: note
        title: Local Python and the browser playground are different environments
        body: |
          Groundwork's in-browser playground uses Pyodide, a WebAssembly build of Python. It is useful for
          learning and running supported examples, but it is not the same installation as CPython on your
          computer. Local files, installed packages, subprocesses and network access can behave differently.
          Use the local interpreter when following instructions that install tools or work with your machine.

  - id: repl-and-script
    title: Interactive REPL versus a saved script
    kind: concept
    blocks:
      - type: markdown
        body: |
          **REPL** means Read–Eval–Print Loop. You type one statement, Python evaluates it, displays the
          result and waits for the next statement. It is useful for quick experiments:

          ```text
          >>> 2 + 3
          5
          >>> name = "Ada"
          >>> print(name)
          Ada
          ```

          A **script** is a saved `.py` file containing statements that Python executes when you launch it.
          Scripts are easier to rerun, share and test. Use the REPL to explore a small idea; use a script
          when you want a repeatable program.
      - type: code
        language: powershell
        status: illustrative
        code: |
          # Start the interactive interpreter
          python

          # Run a saved script from the current folder
          python hello.py

          # Run a module using Python's module search system
          python -m http.server 8000

          # Execute a short expression without creating a file
          python -c "print(2 + 3)"
        caption: Illustrative PowerShell commands. The equivalent command may be `py` or `python3` depending on the installation and operating system.
      - type: code
        runnable: true
        code: |
          message = "Python is running this script"
          print(message)
        expectedOutput: |
          Python is running this script
        annotations:
          - line: 1
            text: The script assigns a string to a name.
          - line: 2
            text: Python executes the print call when the file is run.
      - type: item
        ref: repl-script-check

  - id: commands
    title: Check the interpreter and run code
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Common command names vary by operating system and installation:

          | Environment | Common command |
          |---|---|
          | Windows with Python launcher | `py` or `py -3.14` |
          | macOS / Linux | `python3` |
          | Some Windows installations | `python` |

          First ask the command for its version. Then ask the shell where it found the executable. If more
          than one installation exists, inspect the matches rather than guessing. On Windows use
          `py -0p` or `where.exe python`; on bash/zsh use `command -v python3` or `type -a python3`.
      - type: code
        language: bash
        status: illustrative
        code: |
          python3 --version
          command -v python3
          python3 -c 'import sys; print(sys.executable)'
        caption: Read-only checks for a bash-like shell. `sys.executable` reports the interpreter executable used by the running process when available.
      - type: code
        language: powershell
        status: illustrative
        code: |
          py --version
          py -0p
          python -c "import sys; print(sys.executable)"
        caption: Read-only Windows checks. The Python launcher can list installed interpreters; command availability depends on the installation.
      - type: code
        runnable: true
        code: |
          import sys

          print(sys.version_info.major >= 3)
          print(sys.version_info.major)
        expectedOutput: |
          True
          3
        annotations:
          - line: 1
            text: The sys module exposes information about the Python process.
          - line: 3
            text: This checks the major version component without comparing version strings.
          - line: 4
            text: The major version is 3 for the Python runtime used by this platform.
      - type: item
        ref: interpreter-prediction

  - id: environment-mismatch
    title: When the editor and terminal use different Python versions
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          A common beginner problem looks like this: a package imports successfully in the terminal, but
          the editor reports `ModuleNotFoundError`. Often the editor and terminal are using different
          interpreters or environments.

          Compare the executable path from the working terminal with the interpreter selected by the
          editor. Then install the dependency into the environment the project actually uses. Do not
          install the same package into every Python installation just to silence the warning.
      - type: callout
        variant: warning
        title: Do not use pip without knowing which Python it belongs to
        body: |
          `pip install package-name` may invoke a pip command associated with another interpreter. Prefer
          `python -m pip install package-name` after selecting the intended interpreter. Virtual environments
          make this relationship easier to manage; they are covered in a later lesson.
      - type: item
        ref: explain-interpreter-mismatch

  - id: summary
    title: Summary and mastery check
    kind: summary
    blocks:
      - type: markdown
        body: |
          - The interpreter executes Python source code.
          - The REPL is for interactive experiments; a script is a saved file you can rerun.
          - "`python file.py` runs a script; `python -m module` runs a module; `python -c` runs a short command."
          - Check both the version and executable path to know which interpreter is running.
          - Configure the editor and package installer to use the same project interpreter.
      - type: item
        ref: mastery-python-run
      - type: item
        ref: mastery-version-code
      - type: item
        ref: mastery-interpreter-explain

items:
  - id: repl-script-check
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: Which situation is best suited to the interactive Python REPL?
    options:
      - id: a
        text: Trying a short expression and immediately seeing its result.
        correct: true
        feedback: Correct. The REPL is designed for quick interactive experiments.
      - id: b
        text: Running a repeatable application every morning with the same steps.
        correct: false
        feedback: A saved script or scheduled program is more suitable for repeatable execution.
      - id: c
        text: Installing the Python interpreter itself.
        correct: false
        feedback: The REPL is part of a running interpreter; it does not install Python.
    explanation: The REPL is an interactive prompt for trying statements without first saving a script.
  - id: interpreter-prediction
    type: predict-output
    skill: prediction
    difficulty: 1
    prompt: What does the code print?
    code: |
      import sys
      print(sys.version_info.major)
    answer: "3"
    explanation: The major component of the Python version used by this platform is 3.
  - id: explain-interpreter-mismatch
    type: explain
    skill: transfer
    difficulty: 2
    prompt: A package imports in the terminal but not in the editor. Explain one likely cause and how you would verify it.
    rubric:
      - Identifies that the editor and terminal may use different Python interpreters or virtual environments.
      - Suggests comparing the selected interpreter or executable path and checking package installation in that environment.
    modelAnswer: The terminal and editor may be using different Python interpreters or virtual environments. I would inspect `sys.executable` in the terminal and check the interpreter selected by the editor, then verify that the package is installed in that same environment.
    explanation: Installed packages belong to a particular Python environment; they are not automatically shared by every interpreter.
  - id: mastery-python-run
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: Which command runs a saved file named `app.py` with the interpreter selected by the command `python`?
    options:
      - id: a
        text: "`python app.py`"
        correct: true
        feedback: Correct. Python starts and executes the statements in the saved file.
      - id: b
        text: "`pip app.py`"
        correct: false
        feedback: pip installs Python packages; it is not the Python script runner.
      - id: c
        text: "`app.py python`"
        correct: false
        feedback: The interpreter command comes first, followed by the script path.
    explanation: The interpreter command is followed by the path to the script you want it to execute.
  - id: mastery-version-code
    type: code
    skill: implementation
    difficulty: 2
    prompt: Implement `version_label(major, minor, patch)` to return a string such as `Python 3.14.1`.
    explanation: Format the major, minor and patch components as a dotted version string so the active interpreter release is easy to identify.
    starterCode: |
      def version_label(major, minor, patch):
          pass
    solution: |
      def version_label(major, minor, patch):
          return f"Python {major}.{minor}.{patch}"
    tests:
      - name: formats a version
        code: assert version_label(3, 14, 1) == "Python 3.14.1"
      - name: formats a zero patch
        code: assert version_label(3, 12, 0) == "Python 3.12.0"
    hints:
      - Use an f-string to combine the three integer components.
      - Include the dots between version components.
  - id: mastery-interpreter-explain
    type: explain
    skill: explanation
    difficulty: 2
    prompt: Why should you check both `python --version` and the executable location when several Python installations are present?
    rubric:
      - Explains that different executables can have different versions and package environments.
      - Explains that command resolution determines which executable the shell starts.
    modelAnswer: The version tells me which release ran, while the executable location tells me which installation supplied it. Multiple installations can have different packages and configuration, so I need both pieces of information to identify the interpreter accurately.
    explanation: Version and executable path answer different questions; together they identify the interpreter being used.
masteryCheck:
  passThreshold: 0.8
  items: [mastery-python-run, mastery-version-code, mastery-interpreter-explain]
cheatsheet: |
  REPL = interactive prompt. Script = saved `.py` file. Interpreter = program that executes Python code.
  `python app.py` runs a file; `python -m package.module` runs a module; `python -c "..."` runs a short command.
  Check both `--version` and `sys.executable`. Use `python -m pip` for the selected interpreter.
