  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - An **inner function** is created each time the outer function runs; its name is local to the
            outer function.
          - A **closure** is an inner function that keeps access to the enclosing function's variables after
            the outer call returns. Those variables are its **free variables**.
          - Closures keep **variables, not values**: they read the current value each time they run.
          - Each call of the outer function creates **new** variables, so each closure it returns has
            independent state.
          - To **rebind** an enclosed variable, declare it `nonlocal`; mutating an enclosed list or dict
            needs no declaration.
          - **Late binding** in loops: functions created in a loop share the loop variable. Fix with
            `i=i`, a factory function or `functools.partial`.
          - One callable with a little state → closure. Several operations or inspectable state → class.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What does `[lambda: i for i in range(3)]` return when you call each lambda, and why?" — Answer
          `[2, 2, 2]`, explain that the lambdas close over the variable `i` (late binding), not its value,
          and give two fixes (`lambda i=i: i` or a factory function). Strong answers also explain `nonlocal`
          and when a class would be clearer than a closure.

