  - id: mcq-why-unbound
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      Calling `add(5)` on the function returned by this factory raises
      `UnboundLocalError: cannot access local variable 'total' where it is not associated with a value`.
      Why?

      ```python
      def make_adder():
          total = 0
          def add(amount):
              total = total + amount
              return total
          return add
      ```
    explanation: >-
      Because add assigns to total, the compiler makes total a local variable of add. The right-hand side
      then reads that local before it has a value. `nonlocal total` tells Python the assignment should
      rebind make_adder's variable instead.
    options:
      - id: a
        text: The assignment inside add makes total a local variable of add, and it is read before it has a value.
        correct: true
        feedback: Right. Assignment anywhere in a function makes the name local there. Add `nonlocal total`.
      - id: b
        text: make_adder has already returned, so its variables have been deleted.
        feedback: >-
          Enclosed variables survive the outer call — that is what closures do. Reading total without
          assigning to it would work fine.
      - id: c
        text: Inner functions can never see variables of the outer function.
        feedback: They can read them (the E in LEGB). The problem is only the assignment.
      - id: d
        text: total must be declared global inside make_adder.
        feedback: >-
          total is not a global variable, and global would refer to the module namespace, not to
          make_adder. The right declaration is `nonlocal total` inside add.

  - id: explain-two-counters
    type: explain
    skill: explanation
    prompt: >-
      With the `make_counter` factory above, `tick = make_counter()` and `tock = make_counter()` count
      independently, yet each one remembers its count between calls. Explain both facts in your own words.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says that each call to make_counter creates a new local variable count.
      - Explains that the returned inner function keeps a reference to the count variable of the call that created it (a closure), so it survives after make_counter returns.
      - Explains that tick and tock come from different calls, so they refer to different count variables.
      - Explains that nonlocal makes count += 1 update the enclosed variable rather than create a new local.
    modelAnswer: |
      Every call to make_counter runs its body again, so it creates a brand-new variable count set to 0
      and a brand-new counter function. The counter function uses count from its enclosing function, so it
      keeps a reference to that particular variable; when make_counter returns, the variable stays alive
      because the function still refers to it. That is why tick remembers its count between calls. tock
      was produced by a second call, which created a second count, so the two never interfere. Inside
      counter, `nonlocal count` makes `count += 1` rebind the enclosed variable instead of creating a new
      local one.

  - id: predict-late-binding
