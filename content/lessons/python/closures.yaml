id: python.closures
concept: python.closures
title: Closures
subtitle: Inner functions that remember their enclosing variables
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  A function defined inside another function can keep using the outer function's variables even after
  the outer call has returned. This lesson builds that idea step by step — inner functions, returning
  them, updating enclosed state with nonlocal — and then tackles the famous late-binding trap in loops.
objectives:
  - Explain a closure as an inner function together with the enclosing variables it uses, which stay alive after the outer function returns.
  - Predict what closures return, including independent state created by separate calls to the outer function.
  - Use nonlocal to update enclosed state, and fix the UnboundLocalError that appears without it.
  - Recognise the late-binding trap in loops and fix it with a default argument or a factory function.
  - Decide when a closure is enough and when a small class is clearer.
sources:
  - title: "Python Language Reference: Resolution of names"
    url: https://docs.python.org/3/reference/executionmodel.html#resolution-of-names
    publisher: Python Software Foundation
  - title: "Python Language Reference: The nonlocal statement"
    url: https://docs.python.org/3/reference/simple_stmts.html#the-nonlocal-statement
    publisher: Python Software Foundation
  - title: "PEP 3104: Access to Names in Outer Scopes"
    url: https://peps.python.org/pep-3104/
    publisher: Python Software Foundation
  - title: "Python Language Reference: Data model — function.__closure__"
    url: https://docs.python.org/3/reference/datamodel.html#function.__closure__
    publisher: Python Software Foundation
  - title: "Programming FAQ: Why do lambdas defined in a loop with different values all return the same result?"
    url: https://docs.python.org/3/faq/programming.html#why-do-lambdas-defined-in-a-loop-with-different-values-all-return-the-same-result
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why functions need to remember things
    kind: why
    blocks:
      - type: markdown
        body: |
          Many tools call *your* function for you: `filter()` calls it once per item, `sorted(key=...)`
          calls it to get a sort key, a button calls it when clicked. These callers decide the arguments —
          usually exactly one. But often your function also needs some **configuration**: a cut-off
          value, a currency, a priority order.

          Here is a common first attempt, which keeps the configuration in a global variable:
      - type: code
        runnable: true
        code: |
          scores = [35, 80, 62, 47, 91]

          threshold = 50

          def above_threshold(score):
              return score > threshold

          print(list(filter(above_threshold, scores)))

          threshold = 75          # a different cut-off? change the global...
          print(list(filter(above_threshold, scores)))
        expectedOutput: |
          [80, 62, 91]
          [80, 91]
        caption: It works, but the function's behaviour depends on a global that any code can change.
      - type: markdown
        body: |
          The problems: you can only have **one** threshold at a time, any line of the program can change
          it, and reading `above_threshold` alone does not tell you what it will do.

          A better design is a function that **builds** a configured function and hands it back:
      - type: code
        runnable: true
        code: |
          scores = [35, 80, 62, 47, 91]

          def make_above(threshold):
              def above(score):
                  return score > threshold
              return above

          passed = make_above(50)
          distinction = make_above(75)

          print(list(filter(passed, scores)))
          print(list(filter(distinction, scores)))
          print(passed(60), distinction(60))
        expectedOutput: |
          [80, 62, 91]
          [80, 91]
          True False
        annotations:
          - line: 4
            text: "`above` uses `threshold`, a parameter of the *outer* function."
          - line: 6
            text: "Return the inner function itself — no parentheses, so it is not called here."
          - line: 8
            text: Each call to make_above creates a new `above` that remembers its own threshold.
      - type: markdown
        body: |
          `passed` and `distinction` are two functions with **their own remembered threshold**, living side
          by side, with no global variable. Functions like these are called
          [closures](glossary:closure), and `make_above` is a [factory function](glossary:factory-function).
          You will use them constantly: as sort keys and callbacks, and as the building block of
          [decorators](concept:python.decorators) in the next lesson.

  - id: inner-functions
    title: "Step 1: functions inside functions"
    kind: concept
    blocks:
      - type: markdown
        body: |
          A `def` statement can appear inside another function's body. It is an ordinary statement: each
          time the outer function runs, `def` creates a **new function object** and binds it to a
          **local name** of the outer function.

          The inner function can **read** the outer function's variables. This is the *E* (Enclosing) in
          the LEGB lookup order you met in [scope and namespaces](concept:python.scope): Local, then
          Enclosing functions, then Global, then Built-in.
      - type: code
        runnable: true
        code: |
          def print_receipt(items):
              currency = "Rs"

              def line(name, price):
                  return f"{name:<8}{currency} {price:>6.2f}"

              for name, price in items:
                  print(line(name, price))

          print_receipt([("Tea", 40), ("Samosa", 25.5)])
        expectedOutput: |
          Tea     Rs  40.00
          Samosa  Rs  25.50
        annotations:
          - line: 4
            text: "`line` is created every time print_receipt runs. It is a local name of print_receipt."
          - line: 5
            text: "`currency` is not defined in `line`, so Python finds it in the enclosing function."
      - type: markdown
        body: |
          Because the inner function's name is local to the outer function, it does not exist outside it —
          exactly like any other local variable:
      - type: code
        runnable: true
        code: |
          def outer():
              def helper():
                  return "hi"
              return helper()

          print(outer())
          print(helper())
        expectError: NameError
        caption: "The first print works (outer calls its own helper). The second fails: `helper` only exists inside outer."

  - id: returning-functions
    title: "Step 2: returning the inner function"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Functions are objects, so — as you saw with
          [higher-order functions](concept:python.higher-order-functions) — a function can **return**
          another function. Write `return multiply` (the function object), not `return multiply()` (the
          result of calling it).
      - type: code
        runnable: true
        code: |
          def make_multiplier(factor):
              def multiply(x):
                  return x * factor
              return multiply

          double = make_multiplier(2)
          triple = make_multiplier(3)

          print(double(5))
          print(triple(5))
          print(double(triple(10)))
        expectedOutput: |
          10
          15
          60
        annotations:
          - line: 6
            text: make_multiplier(2) runs to completion and returns a function. The name double now refers to it.
          - line: 9
            text: make_multiplier has already returned — yet multiply still finds factor = 2.
      - type: markdown
        body: |
          This is the puzzle closures solve. Normally a call's local variables disappear when the call
          returns. But `double(5)` runs long after `make_multiplier(2)` has finished, and it still finds
          `factor`.

          > A **closure** is a function that keeps access to variables of the enclosing function in which
          > it was defined, even after that enclosing function has returned.

          The variables a closure keeps are its [free variables](glossary:free-variable): names the
          function **uses** but does not assign itself (they are not its parameters or its own locals) and
          that belong to an enclosing function. For `multiply`, `x` is a parameter (local) and `factor` is
          free.
      - type: item
        ref: predict-greeter

  - id: mental-model
    title: "Mental model: each call makes new variables, and the closure keeps the ones it uses"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Follow `double = make_multiplier(2)` precisely:

          1. Calling `make_multiplier(2)` creates a **fresh local namespace** for that call, with
             `factor → 2`.
          2. `def multiply` creates a new function object. Python already knows (from compiling the code)
             that `multiply` uses `factor` from the enclosing function, so the new function object gets a
             **reference to the variable `factor` of this call** — not a copy of its value.
          3. `make_multiplier` returns. Its other locals are discarded, but `factor` stays alive because
             the returned function still refers to it.
          4. `make_multiplier(3)` is a **separate call**, so it creates a separate `factor`. `double` and
             `triple` never share it.

          Step through it. Watch the `multiply` frame: `factor` appears there even though the
          `make_multiplier` frame is long gone.
      - type: visualization
        component: python-tracer
        title: Two closures, two remembered factors
        caption: >-
          Each call to make_multiplier creates its own factor. When double(5) runs, its frame can still see
          factor = 2, and triple's frame sees factor = 3.
        props:
          code: |
            def make_multiplier(factor):
                def multiply(x):
                    return x * factor
                return multiply

            double = make_multiplier(2)
            triple = make_multiplier(3)
            print(double(5))
            print(triple(5))
      - type: callout
        variant: analogy
        title: A function that carries references, not photocopies
        body: |
          Picture each call of the outer function as a room with its own furniture (its variables). When
          the call ends the room is cleared — except for any furniture that an inner function is still
          holding a string tied to. The inner function does not take a photo of the furniture; it holds the
          real thing. If someone rearranges that furniture before the room closes, the function sees the
          change. (This is a simplification: the deep dive below shows the real mechanism, called a
          *cell*.)
      - type: callout
        variant: misconception
        title: '"A closure stores the value the variable had when the function was defined"'
        body: |
          It stores the **variable**, and reads its current value **each time the function runs**. If the
          enclosing function rebinds the variable after defining the inner function, the closure sees the
          new value:

          ```python
          def make_reporter():
              status = "starting"
              def report():
                  return "status: " + status
              status = "ready"        # rebinding AFTER report was defined
              return report

          print(make_reporter()())    # status: ready
          ```

          This one fact explains the late-binding trap later in this lesson.
      - type: code
        runnable: true
        code: |
          def make_reporter():
              status = "starting"
              def report():
                  return "status: " + status
              status = "ready"
              return report

          print(make_reporter()())
        expectedOutput: |
          status: ready
        caption: Run it to confirm. The closure reads status when report() runs, not when report was defined.

  - id: nonlocal
    title: Updating enclosed state with nonlocal
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Reading an enclosed variable is automatic. **Assigning** to it is different. Recall the scope
          rule: *assigning to a name anywhere in a function makes that name local to that function*. Watch
          what that rule does to a counter factory:
      - type: code
        runnable: true
        code: |
          def make_counter():
              count = 0
              def counter():
                  count += 1
                  return count
              return counter

          tick = make_counter()
          print(tick())
        expectError: UnboundLocalError
        caption: "Run it and read the last line of the error."
      - type: markdown
        body: |
          ```text
          UnboundLocalError: cannot access local variable 'count' where it is not associated with a value
          ```

          `count += 1` means `count = count + 1`, which **assigns** to `count`. So Python decides, when it
          compiles `counter`, that `count` is a *local* variable of `counter` — a brand-new one, unrelated to
          the `count` in `make_counter`. Then `count + 1` tries to read that local before it has a value.

          The fix is the [`nonlocal` statement](glossary:nonlocal-statement). It tells Python: "assignments
          to this name inside me should rebind the variable in the nearest enclosing function":
      - type: code
        runnable: true
        code: |
          def make_counter():
              count = 0
              def counter():
                  nonlocal count
                  count += 1
                  return count
              return counter

          tick = make_counter()
          tock = make_counter()
          print(tick(), tick(), tick())
          print(tock())
          print(tick())
        expectedOutput: |
          1 2 3
          1
          4
        annotations:
          - line: 4
            text: "`count` now refers to make_counter's variable, so `count += 1` updates it."
          - line: 10
            text: A second call to make_counter creates a second, independent count.
          - line: 13
            text: tick continues from 3 — its count survived between calls, and tock did not touch it.
      - type: visualization
        component: python-tracer
        title: State that survives between calls
        caption: >-
          Each tick() call gets a new frame, but count is not stored in that frame — it belongs to the
          finished make_counter call and is shared with every call of this tick.
        props:
          code: |
            def make_counter():
                count = 0
                def counter():
                    nonlocal count
                    count += 1
                    return count
                return counter

            tick = make_counter()
            tick()
            print(tick())
      - type: markdown
        body: |
          **The rules of `nonlocal`:**

          - `nonlocal name` makes assignments to `name` rebind the variable of the **nearest enclosing
            function** that has one.
          - The name must be a variable of an enclosing **function** (assigned somewhere in it). Otherwise
            Python refuses to compile the code: `SyntaxError: no binding for nonlocal 'name' found` — even if a *global* with
            that name exists. (`nonlocal` never refers to module-level variables; that is what `global` is
            for, and you should rarely need it.)
          - You need `nonlocal` only to **rebind** the name. **Mutating** an enclosed mutable object —
            `history.append(...)`, `cache[key] = value` — does not assign to the name, so it works without
            `nonlocal`:
      - type: code
        runnable: true
        code: |
          def make_recorder():
              history = []
              def record(event):
                  history.append(event)     # mutates the list; the name is not rebound
                  return len(history)
              return record

          record = make_recorder()
          print(record("login"), record("view page"), record("logout"))
        expectedOutput: |
          1 2 3
      - type: item
        ref: mcq-why-unbound
      - type: item
        ref: explain-two-counters

  - id: late-binding
    title: The late-binding trap in loops
    kind: concept
    blocks:
      - type: markdown
        body: |
          Because closures keep **variables**, not values, there is a famous surprise when you create
          functions in a loop. Predict the output before running:
      - type: code
        runnable: true
        code: |
          functions = [lambda: i for i in range(3)]
          print([f() for f in functions])
        expectedOutput: |
          [2, 2, 2]
        caption: Three lambdas — and all of them return 2.
      - type: markdown
        body: |
          There are three lambda functions but only **one** variable `i`, which the loop rebinds to 0, 1
          and 2. Each lambda looks `i` up **when it is called**. By then the loop has finished and `i` is 2.
          Looking up a free variable at call time rather than definition time is called
          [late binding](glossary:late-binding).

          The same thing happens with an ordinary `for` loop and `def`. Step through it and watch the
          single `i` in `make_functions`:
      - type: visualization
        component: python-tracer
        title: Three functions, one shared variable
        caption: >-
          The loop rebinds one variable i. All three lambdas refer to it, so after the loop each of them
          sees its final value, 2.
        props:
          code: |
            def make_functions():
                functions = []
                for i in range(3):
                    functions.append(lambda: i)
                return functions

            for f in make_functions():
                print(f())
      - type: markdown
        body: |
          **Three standard fixes** — each gives every function its *own* value:

          1. **Default argument** — `lambda i=i: i`. Default values are evaluated **once, when the function
             is defined** (you met this rule in [parameters](concept:python.parameters)), so each lambda
             gets its own parameter `i` holding the value of that moment.
          2. **Factory function** — call a function that creates the closure. Every call creates a new
             enclosing scope, so every closure has its own variable.
          3. **`functools.partial`** — stores the argument values inside a new callable object.
      - type: code
        runnable: true
        code: |
          import functools

          with_default = [lambda i=i: i for i in range(3)]
          print([f() for f in with_default])

          def make_getter(value):
              return lambda: value

          with_factory = [make_getter(i) for i in range(3)]
          print([f() for f in with_factory])

          def show(value):
              return value

          with_partial = [functools.partial(show, i) for i in range(3)]
          print([f() for f in with_partial])
        expectedOutput: |
          [0, 1, 2]
          [0, 1, 2]
          [0, 1, 2]
        annotations:
          - line: 3
            text: "`i=i`: a parameter named i whose default is the current value of the loop's i."
          - line: 6
            text: Each make_getter call has its own `value` variable.
          - line: 14
            text: partial(show, i) remembers the current value of i as show's first argument.
      - type: callout
        variant: tip
        title: Which fix should I use?
        body: |
          The default-argument trick is short but leaks into the signature: someone can call `f(99)` and
          override the value. For anything other people will call, prefer a factory function or
          `functools.partial`.
      - type: item
        ref: predict-late-binding

  - id: closures-vs-classes
    title: Closures or a small class?
    kind: application
    blocks:
      - type: markdown
        body: |
          A closure bundles **behaviour with a little remembered state**. So does an object. Here is the
          counter as a class:
      - type: code
        runnable: true
        code: |
          class Counter:
              def __init__(self):
                  self.count = 0

              def increment(self):
                  self.count += 1
                  return self.count

          clicks = Counter()
          clicks.increment()
          print(clicks.increment(), clicks.count)
        expectedOutput: |
          2 2
        annotations:
          - line: 11
            text: Unlike a closure's variable, the state is easy to inspect from outside.
      - type: markdown
        body: |
          | Prefer a **closure** when… | Prefer a **class** when… |
          |---|---|
          | You need **one** callable: a key function, a callback, a decorator. | You need **several operations** on the same state (`deposit`, `withdraw`, `balance`). |
          | The state is a little configuration or a private counter. | Other code should **read** the state (`clicks.count`) or tests need to inspect it. |
          | The code stays a few lines long. | The state grows, or you want a readable `repr`, equality, or inheritance. |

          Both are correct tools; the question is which one a reader will understand faster. A factory
          returning three inner functions that share state is usually a class in disguise — write the class.
      - type: item
        ref: mcq-closure-or-class

  - id: under-the-hood
    title: "Under the hood: cells and __closure__"
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          When CPython compiles a function, it already knows which of its variables are used by inner
          functions. Those variables are stored in a small box called a [cell](glossary:cell-object)
          instead of directly in the call's frame. The inner function object keeps a tuple of references to
          those cells in its `__closure__` attribute. Reading or writing the variable — from either
          function — goes through the cell, which is why both see the same value.

          You can inspect this:

          - `outer.__code__.co_cellvars` — the outer function's variables that live in cells.
          - `inner.__code__.co_freevars` — the inner function's free variables.
          - `inner.__closure__` — a tuple of cell objects (or `None` if there are no free variables).
          - `cell.cell_contents` — the value currently in the cell.
      - type: code
        runnable: true
        code: |
          def make_multiplier(factor):
              def multiply(x):
                  return x * factor
              return multiply

          double = make_multiplier(2)
          print(make_multiplier.__code__.co_cellvars)
          print(double.__code__.co_freevars)
          print(len(double.__closure__), type(double.__closure__[0]).__name__)
          print(double.__closure__[0].cell_contents)

          def plain(x):
              return x * 2

          print(plain.__closure__)
        expectedOutput: |
          ('factor',)
          ('factor',)
          1 cell
          2
          None
      - type: markdown
        body: |
          **One cell per variable per call.** Functions created in the *same* call share a cell; functions
          created by *different* calls get different cells. That is exactly why `tick` and `tock` counted
          independently, and why all the lambdas in the late-binding loop saw the same `i`.
      - type: code
        runnable: true
        code: |
          def make_pair():
              value = 0
              def get():
                  return value
              def set_value(new):
                  nonlocal value
                  value = new
              return get, set_value

          get_a, set_a = make_pair()
          get_b, set_b = make_pair()
          print(get_a.__closure__[0] is set_a.__closure__[0])
          print(get_a.__closure__[0] is get_b.__closure__[0])
          set_a(42)
          print(get_a(), get_b())
        expectedOutput: |
          True
          False
          42 0
      - type: markdown
        body: |
          **Bytecode (a CPython 3.14 implementation detail).** The compiler emits special instructions for
          cell variables: `MAKE_CELL` creates the cell in the outer frame, `COPY_FREE_VARS` copies the cell
          references into the inner function's frame when it is called, and `LOAD_DEREF` / `STORE_DEREF`
          read and write through a cell. Instruction names change between CPython versions; the behaviour
          above is what the language guarantees.
      - type: code
        runnable: true
        code: |
          import dis

          def make_counter():
              count = 0
              def counter():
                  nonlocal count
                  count += 1
                  return count
              return counter

          def cell_ops(func):
              return [ins.opname for ins in dis.get_instructions(func)
                      if "DEREF" in ins.opname or "CELL" in ins.opname or "FREE" in ins.opname]

          print(cell_ops(make_counter))
          print(cell_ops(make_counter()))
        expectedOutput: |
          ['MAKE_CELL', 'STORE_DEREF']
          ['COPY_FREE_VARS', 'LOAD_DEREF', 'STORE_DEREF', 'LOAD_DEREF']
        caption: Verified on CPython 3.14 (the browser runtime). Other versions may print different instruction names.
      - type: markdown
        body: |
          **Other facts worth knowing:**

          - **Globals are not captured.** A module-level function that uses a global variable has
            `__closure__` set to `None`; the global is looked up in the module namespace each time the
            function runs. (That is why the late-binding surprise also happens at module level, without any
            cell involved.)
          - **Reading a free variable before it is assigned** in the enclosing function raises
            `NameError: cannot access free variable 'value' where it is not associated with a value in
            enclosing scope`.
          - **Memory.** A closure keeps every object its cells refer to alive for as long as the closure
            exists. A closure over a huge list keeps the whole list in memory.
          - **Not a lambda thing.** `lambda` and `def` create the same kind of function object; both form
            closures in exactly the same way.

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `UnboundLocalError: cannot access local variable 'count' where it is not associated with a value` | The inner function assigns (`=`, `+=`) to an enclosed name without `nonlocal`, so the name became local. | Add `nonlocal count` as the first line of the inner function. |
          | `SyntaxError: no binding for nonlocal 'total' found` | `nonlocal` names a variable that no enclosing *function* assigns (it is a global, misspelled, or only assigned in a different function). | Create the variable in the outer function before defining the inner function, or fix the spelling. |
          | `TypeError: 'NoneType' object is not callable` when calling the result of a factory | The factory forgot `return inner`, so it returned `None`. | Add `return inner` at the end of the outer function. |
          | `TypeError: ...multiply() missing 1 required positional argument` | `return multiply()` **called** the inner function instead of returning it. | Return the function object: `return multiply`. |
          | Every function built in a loop returns the last value | Late binding: they all share the loop variable. | Use a default argument (`i=i`), a factory function, or `functools.partial`. |
          | Two "independent" things share state, or state resets unexpectedly | One closure reused where you needed two, or the factory called again where you needed the same one. | Call the factory **once per independent piece of state** and keep the result. |
      - type: code
        runnable: true
        code: |
          def make_multiplier(factor):
              def multiply(x):
                  return x * factor

          double = make_multiplier(2)
          print(double(5))
        expectError: TypeError
        caption: "make_multiplier has no return statement, so double is None. Calling None gives \"'NoneType' object is not callable\"."
      - type: code
        runnable: true
        code: |
          def make_multiplier(factor):
              def multiply(x):
                  return x * factor
              return multiply()

          double = make_multiplier(2)
        expectError: TypeError
        caption: "The parentheses call multiply immediately, without an x — the error appears inside the factory, before you ever use double."

