    solution: |
      def make_toggle():
          on = False

          def toggle():
              nonlocal on
              on = not on
              return on

          return toggle


      switch = make_toggle()
      print(switch(), switch(), switch())
    expectedOutput: |
      True False True
    tests:
      - name: flips on every call
        code: |
          t = make_toggle()
          got = [t(), t(), t(), t()]
          assert got == [True, False, True, False], f"Expected [True, False, True, False], got {got}."
      - name: toggles are independent
        code: |
          a = make_toggle()
          b = make_toggle()
          a()
          assert b() is True, "A new toggle should start fresh and return True on its first call."
      - name: no global state
        code: |
          assert not uses("Global"), "Keep `on` inside make_toggle; use `nonlocal`, not `global`."
    hints:
      - Read the error. Which variable does Python say is local and has no value?
      - toggle assigns to on. What statement makes that assignment update make_toggle's variable?
    feedback:
      - when: { errorType: UnboundLocalError }
        message: "`on = not on` makes on local to toggle. Add `nonlocal on` as the first line of toggle."
    explanation: >-
      Assigning to on inside toggle made it a new local variable, which `not on` read before it had a
      value. `nonlocal on` makes the assignment rebind make_toggle's variable, so its value persists and
      flips on every call.

