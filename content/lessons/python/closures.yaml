  - id: mcq-closure-or-class
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      You are modelling a shopping cart. Code elsewhere must add items, remove items, read the current
      list of items, and compute the total. Which design is the clearest?
    explanation: >-
      Several operations share the same state, and other code must read that state. That is exactly what
      a class is for. A closure shines when you need a single callable with a little private state.
    options:
      - id: a
        text: A class Cart with an items attribute and add, remove and total methods.
        correct: true
        feedback: Yes. Several operations plus inspectable state is the classic case for a class.
      - id: b
        text: A factory make_cart() that returns four inner functions sharing a nonlocal list.
        feedback: >-
          It works, but it is a class in disguise: harder to read, harder to inspect in a debugger or a
          test, and there is no single object to pass around.
      - id: c
        text: A global list items plus four module-level functions.
        feedback: Globals allow only one cart and let any code change it. Bundle the state with its operations instead.
      - id: d
        text: A lambda for each operation, created in a loop.
        feedback: Lambdas created in a loop also invite the late-binding trap — and this still does not group the state.

  - id: accumulator
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a factory `make_accumulator()` that returns a function `add(amount)`. Each call to `add` adds
      `amount` to a running total (which starts at 0) and returns the new total.

      - Two accumulators must not share a total.
      - Do not use global variables — keep the total inside `make_accumulator`.
    starterCode: |
      def make_accumulator():
          # Create the running total here, then define and return add(amount).
          pass


      wallet = make_accumulator()
      print(wallet(100))
      print(wallet(50))
    solution: |
      def make_accumulator():
          total = 0

          def add(amount):
              nonlocal total
              total += amount
              return total

          return add


      wallet = make_accumulator()
      print(wallet(100))
      print(wallet(50))
    expectedOutput: |
      100
      150
    tests:
      - name: make_accumulator returns a function
        code: |
          acc = make_accumulator()
          assert callable(acc), "make_accumulator() should return the inner function. End it with `return add` (no parentheses)."
      - name: keeps a running total
        code: |
          acc = make_accumulator()
          results = [acc(10), acc(5), acc(-3)]
          assert results == [10, 15, 12], f"Adding 10, then 5, then -3 should return 10, 15, 12, but returned {results}."
      - name: accumulators are independent
        code: |
          a = make_accumulator()
          b = make_accumulator()
          a(100)
          a(100)
          assert b(1) == 1, "A second accumulator should start from 0. Create the total inside make_accumulator so each call gets its own."
      - name: total lives in the enclosing function
        code: |
          assert not uses("Global"), "Do not use `global`. Store the total in make_accumulator and use `nonlocal` in add."
          assert getattr(make_accumulator(), "__closure__", None), "add should be a closure over a variable of make_accumulator (define add inside make_accumulator)."
    hints:
      - Start make_accumulator with `total = 0`, then define `def add(amount):` inside it.
      - add needs to change total. Which statement lets an inner function rebind an enclosing variable?
      - "Inside add: `nonlocal total`, then `total += amount`, then `return total`. Finally `return add` from make_accumulator."
    feedback:
      - when: { errorType: UnboundLocalError }
        message: >-
          add assigns to total, so Python treats total as a new local variable of add. Put
          `nonlocal total` as the first line of add.
      - when: { errorMessageContains: "'NoneType' object is not callable" }
        message: make_accumulator returned None. End it with `return add` so the caller gets the inner function.
    explanation: >-
      Each call to make_accumulator creates a new total and a new add function that closes over it.
      `nonlocal total` lets add rebind that enclosed variable, so the total survives between calls and
      separate accumulators never interfere.

  - id: debug-buttons
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This program builds three click handlers, but every handler prints `Button 3 clicked`. Fix it so
      handler number *n* reports its own number. Keep building the handlers with the comprehension (don't
      write each message by hand).
    starterCode: |
      handlers = [lambda: f"Button {n} clicked" for n in range(1, 4)]

      for handler in handlers:
          print(handler())
    solution: |
      handlers = [lambda n=n: f"Button {n} clicked" for n in range(1, 4)]

      for handler in handlers:
          print(handler())
    expectedOutput: |
      Button 1 clicked
      Button 2 clicked
      Button 3 clicked
    tests:
      - name: each handler reports its own number
        code: |
          got = [h() for h in handlers]
          assert got == ["Button 1 clicked", "Button 2 clicked", "Button 3 clicked"], f"The handlers returned {got}. Each lambda needs its own copy of n."
      - name: handlers are still generated
        code: |
          assert uses("ListComp", "For"), "Keep creating the handlers with a comprehension or loop."
          assert "Button 1" not in source and "Button 2" not in source, "Don't type each message by hand; fix the lambda instead."
      - name: works for more buttons
        code: |
          import re
          changed = re.sub(r"range\(\s*1\s*,\s*4\s*\)", "range(1, 6)", source, count=1)
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert len(ns["handlers"]) == 5, "Keep `range(1, 4)` in your code so this check can re-run it with five buttons."
          assert ns["handlers"][3]() == "Button 4 clicked", "With five buttons, handler 4 should say 'Button 4 clicked'."
    hints:
      - All three lambdas share one variable n. What is its value after the comprehension finishes?
      - Default argument values are evaluated when the function is created, not when it is called.
      - "Change the lambda to `lambda n=n: f\"Button {n} clicked\"`."
    feedback:
      - when: { outputContains: "Button 3 clicked\nButton 3 clicked" }
        message: >-
          Still late binding: every lambda reads n after the loop has finished. Give each lambda its own
          value with a default argument (`lambda n=n: ...`) or build them with a factory function.
    explanation: >-
      The lambdas looked up n when called, after the comprehension had set it to 3. `lambda n=n:` creates a
      parameter whose default is evaluated at definition time, so each handler stores its own number.
      A factory such as `def make_handler(n): return lambda: f"Button {n} clicked"` works too.

  - id: priority-key
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Tasks have a `"priority"` of `"high"`, `"medium"` or `"low"`. Write a factory
      `make_priority_key(order)` that takes a list of priorities in the order you want them and **returns a
      key function** for `sorted()`. Given a task dict, the key function returns the position of the task's
      priority in `order`.

      The starter sorts the tasks with it and prints the titles.
    starterCode: |
      tasks = [
          {"title": "Write report", "priority": "low"},
          {"title": "Fix outage", "priority": "high"},
          {"title": "Review code", "priority": "medium"},
      ]

      def make_priority_key(order):
          pass


      by_priority = sorted(tasks, key=make_priority_key(["high", "medium", "low"]))
      print([task["title"] for task in by_priority])
    solution: |
      tasks = [
          {"title": "Write report", "priority": "low"},
          {"title": "Fix outage", "priority": "high"},
          {"title": "Review code", "priority": "medium"},
      ]

      def make_priority_key(order):
          rank = {priority: position for position, priority in enumerate(order)}

          def key(task):
              return rank[task["priority"]]

          return key


      by_priority = sorted(tasks, key=make_priority_key(["high", "medium", "low"]))
      print([task["title"] for task in by_priority])
    expectedOutput: |
      ['Fix outage', 'Review code', 'Write report']
    tests:
      - name: returns a key function
        code: |
          key = make_priority_key(["high", "medium", "low"])
          assert callable(key), "make_priority_key should return a function (the key), not call it."
          got = key({"title": "x", "priority": "medium"})
          assert got == 1, f"With order ['high', 'medium', 'low'], a 'medium' task should get key 1, but got {got!r}."
      - name: respects any order
        code: |
          key = make_priority_key(["low", "medium", "high"])
          got = [key({"priority": p}) for p in ["low", "medium", "high"]]
          assert got == [0, 1, 2], f"With order ['low', 'medium', 'high'] the keys should be [0, 1, 2], got {got}. Use the order you were given."
          titles = [t["title"] for t in sorted(tasks, key=key)]
          assert titles == ["Write report", "Review code", "Fix outage"], f"Sorting low-first should give {['Write report', 'Review code', 'Fix outage']}, got {titles}."
      - name: the key is a closure over order
        code: |
          key = make_priority_key(["high", "low"])
          assert getattr(key, "__closure__", None), "Define the key function inside make_priority_key so it remembers `order`."
      - name: prints the sorted titles
        code: |
          assert output().strip() == "['Fix outage', 'Review code', 'Write report']", f"Your program printed {output()!r}."
    hints:
      - Inside make_priority_key, define `def key(task):` and return key at the end.
      - "`order.index(task[\"priority\"])` gives the position of the task's priority in the list."
      - "For speed you can build a dict once: `rank = {p: i for i, p in enumerate(order)}` — the closure keeps it."
    feedback:
      - when: { errorMessageContains: "not supported between instances of 'dict' and 'dict'" }
        message: >-
          make_priority_key returned None, so sorted() tried to compare the task dicts themselves. Define a
          key function inside make_priority_key and `return key`.
      - when: { errorMessageContains: "'NoneType' object is not callable" }
        message: sorted() got None as its key. make_priority_key must `return key`.
    explanation: >-
      sorted() calls the key with one argument, the task, but the key also needs the priority order. The
      factory solves that: the returned function closes over order (or over a rank dict built once from
      it), so each key function remembers its own ordering.

  - id: parsons-counter
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines into a counter factory that starts from a given number, then use it so the program
      prints `12`. Two lines are distractors.
    solution: |
      def make_counter(start):
          count = start
          def counter():
              nonlocal count
              count += 1
              return count
          return counter
      tick = make_counter(10)
      tick()
      print(tick())
    distractors:
      - "        global count"
      - "    return counter()"
    expectedOutput: |
      12
    explanation: >-
      count must be created in make_counter before counter is defined; counter declares it nonlocal before
      updating it; make_counter returns the function object itself. `global count` would look for a
      module-level variable, and `return counter()` would call the function instead of returning it.

