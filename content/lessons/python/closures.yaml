  - id: m-mcq-nonlocal-global
    type: mcq
    skill: recognition
    difficulty: 2
    prompt: |
      What happens when Python tries to run this file?

      ```python
      total = 0

      def make_adder():
          def add(x):
              nonlocal total
              total += x
              return total
          return add

      print(make_adder()(5))
      ```
    explanation: >-
      nonlocal only searches enclosing function scopes, never the module (global) scope. make_adder has no
      variable called total, so the compiler rejects the file with
      "SyntaxError: no binding for nonlocal 'total' found" before anything runs.
    options:
      - id: a
        text: "SyntaxError: no binding for nonlocal 'total' found — nothing runs."
        correct: true
        feedback: Right. The module-level total does not count; nonlocal needs an enclosing function variable.
      - id: b
        text: It prints 5, updating the global total.
        feedback: That would need `global total`. nonlocal deliberately ignores module-level names.
      - id: c
        text: UnboundLocalError when add runs.
        feedback: The problem is found at compile time, so the program never gets as far as calling add.
      - id: d
        text: It silently creates a new variable total inside make_adder.
        feedback: nonlocal never creates variables; it only refers to existing ones in enclosing functions.

  - id: m-code-limiter
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a factory `make_limiter(max_calls)` that returns a function `allow()`. `allow()` returns `True`
      for the first `max_calls` calls and `False` for every call after that. Each limiter has its own
      count, and you must not use global variables.
    starterCode: |
      def make_limiter(max_calls):
          pass


      allow = make_limiter(2)
      print(allow(), allow(), allow())
    solution: |
      def make_limiter(max_calls):
          calls = 0

          def allow():
              nonlocal calls
              calls += 1
              return calls <= max_calls

          return allow


      allow = make_limiter(2)
      print(allow(), allow(), allow())
    expectedOutput: |
      True True False
    tests:
      - name: allows exactly max_calls calls
        code: |
          allow = make_limiter(3)
          got = [allow() for _ in range(5)]
          assert got == [True, True, True, False, False], f"make_limiter(3) should allow 3 calls: expected [True, True, True, False, False], got {got}."
      - name: a limit of 0 allows nothing
        code: |
          allow = make_limiter(0)
          assert allow() is False, "make_limiter(0)() should return False straight away."
      - name: limiters are independent
        code: |
          a = make_limiter(1)
          b = make_limiter(1)
          a()
          a()
          assert b() is True, "Using one limiter must not use up another one's calls. Create the counter inside make_limiter."
      - name: state lives in the closure
        code: |
          assert not uses("Global"), "Do not use `global`; keep the count inside make_limiter."
          assert getattr(make_limiter(1), "__closure__", None), "Define allow inside make_limiter so it closes over the count."
    hints:
      - Keep a count of calls in make_limiter, starting at 0.
      - allow must update that count, so it needs `nonlocal`.
      - Increase the count, then return whether it is still at most max_calls.
    feedback:
      - when: { errorType: UnboundLocalError }
        message: allow assigns to the counter, which makes it local. Declare it with `nonlocal` first.
      - when: { errorMessageContains: "'NoneType' object is not callable" }
        message: make_limiter returned None. Define allow inside it and end with `return allow`.
    explanation: >-
      The factory creates a fresh calls variable for each limiter. allow uses nonlocal to increase it and
      compares it with max_calls, which it also remembers from the enclosing call.

  - id: m-debug-toggle
    type: debug
    skill: debugging
    prompt: |
      `make_toggle()` should return a function that flips between `True` and `False` on each call,
