cheatsheet: |
  ```python
  def make_multiplier(factor):       # factory function
      def multiply(x):               # inner function
          return x * factor          # factor is a free variable
      return multiply                # return the function, don't call it

  double = make_multiplier(2)        # a closure: remembers factor = 2

  def make_counter():
      count = 0
      def counter():
          nonlocal count             # needed to REBIND an enclosed name
          count += 1
          return count
      return counter

  [lambda: i for i in range(3)]      # late binding: all return 2
  [lambda i=i: i for i in range(3)]  # fix: default evaluated at definition time
  ```
  - Closures keep **variables**, not values. Each outer call creates new variables.
  - Mutating an enclosed list/dict needs no `nonlocal`; rebinding the name does.
  - `f.__closure__` → tuple of cells · `cell.cell_contents` → current value
