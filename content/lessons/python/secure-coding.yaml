id: python.secure-coding
concept: python.secure-coding
title: Secure Python Coding
subtitle: Treat external data as untrusted
estimatedMinutes: 60
reviewedOn: 2026-11-04
summary: Learn practical Python security habits at the boundaries where data enters a program or crosses
  into another system. Validate inputs, constrain file paths and resource use, parameterize SQL, avoid
  unsafe deserialization and shell injection, protect secrets, and handle errors without leaking sensitive
  data.
objectives:
- Identify trust boundaries and explain why input validation is different from authorisation.
- Validate type, format, range and size before using external data.
- Resolve user-controlled paths and check that they remain inside an allowed directory.
- Use SQL parameters and safe subprocess argument lists instead of building executable strings.
- Explain why pickle, eval and exec must not process untrusted input.
- Generate security tokens with secrets and compare secret values with compare_digest.
- Limit resource consumption and avoid leaking secrets through logs and error messages.
