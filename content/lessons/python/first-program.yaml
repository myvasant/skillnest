id: python.first-program
concept: python.first-program
title: Your First Python Program
subtitle: print(), comments, and reading error messages
estimatedMinutes: 25
reviewedOn: 2026-10-22
summary: >-
  Write and run real Python in your browser. Learn how Python executes a program line by line, how
  print() displays values, how comments work, and how to read your first error messages calmly.
objectives:
  - Run a Python program and explain that statements execute from top to bottom.
  - Use print() to display text and numbers, including several values at once.
  - Distinguish text (strings, in quotes) from numbers and from names.
  - Write comments that explain intent.
  - Read a SyntaxError and a NameError and locate the problem.
sources:
  - title: "The Python Tutorial: An Informal Introduction to Python"
    url: https://docs.python.org/3/tutorial/introduction.html
    publisher: Python Software Foundation
  - title: "Built-in Functions: print()"
    url: https://docs.python.org/3/library/functions.html#print
    publisher: Python Software Foundation
  - title: "The Python Tutorial: Errors and Exceptions"
    url: https://docs.python.org/3/tutorial/errors.html
    publisher: Python Software Foundation
sections:
  - id: run
    title: Run your first program
    kind: intro
    blocks:
      - type: markdown
        body: |
          A Python **program** is plain text containing instructions called
          [statements](glossary:statement). The Python [interpreter](glossary:interpreter) reads the
          program and carries out the statements **one at a time, from top to bottom**.

          Press **Run** below. The Python interpreter runs right here in your browser — nothing to install.
      - type: code
        runnable: true
        code: |
          print("Hello, world!")
          print("I am learning Python.")
        expectedOutput: |
          Hello, world!
          I am learning Python.
        annotations:
          - line: 1
            text: "`print` is a built-in function. The parentheses call it; the value inside is what it displays."
      - type: callout
        variant: tip
        title: Experiment freely
        body: |
          Every runnable example can be edited. Change the text, run it again, break it on purpose. The
          **Reset** button restores the original. You cannot damage anything.

  - id: print
    title: Displaying values with print()
    kind: concept
    blocks:
      - type: markdown
        body: |
          `print()` accepts one or more values separated by commas and displays them on one line, with a
          space between each value, then moves to a new line.

          - **Text** — a [string](glossary:string) — must be inside quotes: `"like this"` or `'like this'`.
          - **Numbers** are written without quotes: `42`, `3.5`.
          - Python can calculate inside print: `print(2 + 3)` displays `5`.
      - type: code
        runnable: true
        code: |
          print("Age:", 30)
          print(7 * 6)
          print("7 * 6")
          print()
          print("The end")
        expectedOutput: |
          Age: 30
          42
          7 * 6

          The end
        annotations:
          - line: 1
            text: Two values; print puts one space between them.
          - line: 2
            text: Without quotes this is arithmetic, so Python prints the result.
          - line: 3
            text: In quotes it is just text, printed exactly as written.
          - line: 4
            text: An empty print() outputs a blank line.
      - type: item
        ref: predict-quotes

  - id: order
    title: Top to bottom, one statement at a time
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Python does not read the whole program and "understand" it at once. It executes statement 1,
          then statement 2, and so on. Step through this program to see the current line move:
      - type: visualization
        component: python-tracer
        title: Execution order
        props:
          code: |
            print("first")
            print("second")
            print("third")
      - type: markdown
        body: |
          This ordering rule matters a lot. If a statement fails, the statements after it never run — and
          anything already printed stays printed.

  - id: comments
    title: Comments
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [comment](glossary:comment) starts with `#` and runs to the end of the line. Python ignores
          comments completely; they are for humans. Good comments explain **why**, not what — the code
          already says what.
      - type: code
        runnable: true
        code: |
          # Prices include tax, so we don't add it again here.
          print(120 + 80)  # notebook + pen
        expectedOutput: |
          200
      - type: callout
        variant: tip
        title: Commenting out
        body: |
          Putting `#` in front of a line is a quick way to stop it running while you experiment.

  - id: errors
    title: When things go wrong
    kind: debugging
    blocks:
      - type: markdown
        body: |
          Errors are normal — professional programmers see them all day. What matters is reading them.
          Python reports two broad kinds you will meet first:

          - A **SyntaxError** means Python could not understand the text of your program at all, so
            **nothing runs**. Typical causes: a missing quote, parenthesis or colon.
          - A **runtime error** (an *exception*) happens while the program is running, at a specific line.
            Lines before it have already run.

          Run this program, which is missing a closing parenthesis:
      - type: code
        runnable: true
        code: |
          print("Ready")
          print("Set"
          print("Go")
        expectError: SyntaxError
        caption: Notice that even "Ready" is not printed - a SyntaxError stops the whole program before it starts.
      - type: markdown
        body: |
          The message points at the line where Python noticed the problem. Sometimes the real mistake is
          just **before** that point — here the parenthesis opened on line 2 was never closed.

          Now a runtime error:
      - type: code
        runnable: true
        code: |
          print("Ready")
          print(Set)
          print("Go")
        expectError: NameError
        caption: '"Ready" is printed, then line 2 fails. Without quotes, Python treats Set as a name, and no such name exists.'
      - type: markdown
        body: |
          **How to read a traceback:** start at the **last line** (the error type and message), then look
          at the line number above it, then look at your code on that line.
      - type: item
        ref: debug-missing-quote

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: item
        ref: three-lines
      - type: item
        ref: tf-syntax

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - Programs run **top to bottom**, one statement at a time.
          - `print(a, b)` displays values separated by spaces and ends the line.
          - Quotes make text; no quotes means a number, a calculation, or a name to look up.
          - `#` starts a comment.
          - **SyntaxError** → nothing runs; **exceptions** stop the program at that line.
          - Read errors from the **bottom up**.

items:
  - id: predict-quotes
    type: predict-output
    skill: prediction
    prompt: What does this program print? Type the exact output (two lines).
    code: |
      print(10 + 5)
      print("10 + 5")
    answer: |
      15
      10 + 5
    explanation: >-
      The first line has no quotes, so Python calculates 10 + 5. The second line is a string, printed
      exactly as written.
    wrongAnswers:
      - answer: |
          15
          15
        feedback: Quotes turn the second line into text. Python does not calculate inside a string.
      - answer: |
          10 + 5
          10 + 5
        feedback: Without quotes, 10 + 5 is an arithmetic expression and print displays its result.

  - id: debug-missing-quote
    type: debug
    skill: debugging
    prompt: This program should print two lines but has a syntax error. Find and fix it.
    starterCode: |
      print("Welcome to Groundwork)
      print("Let's begin")
    solution: |
      print("Welcome to Groundwork")
      print("Let's begin")
    expectedOutput: |
      Welcome to Groundwork
      Let's begin
    tests:
      - name: prints both lines
        code: |
          assert output() == "Welcome to Groundwork\nLet's begin\n", f"Got {output()!r}"
    hints:
      - The error says the string literal is "unterminated". Which string never ends?
      - Every opening quote needs a matching closing quote before the closing parenthesis.
    feedback:
      - when: { errorType: SyntaxError }
        message: Python still cannot read the program. Check that each string starts and ends with the same kind of quote.
    explanation: >-
      The first string was never closed, so Python kept reading the rest of the line as text and found no
      end. Adding the closing quote fixes it. Note that "Let's" works because the apostrophe is inside
      double quotes.

  - id: three-lines
    type: code
    skill: implementation
    prompt: |
      Write a program that prints exactly these three lines:

      ```text
      Name: Grace
      Language: Python
      Year: 1991
      ```

      Print the year as a **number** (no quotes around 1991), using print with two values.
    starterCode: |
      # Print three lines.

    solution: |
      print("Name: Grace")
      print("Language: Python")
      print("Year:", 1991)
    expectedOutput: |
      Name: Grace
      Language: Python
      Year: 1991
    tests:
      - name: three exact lines
        code: |
          assert output_lines() == ["Name: Grace", "Language: Python", "Year: 1991"], f"Your output was {output()!r}"
      - name: year printed as a number
        code: |
          import ast
          numbers = [n.value for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Constant) and n.value == 1991]
          assert numbers, "Pass 1991 as a number (without quotes) as a second value to print."
    hints:
      - Use one print() per line.
      - "print(\"Year:\", 1991) prints the text, a space, then the number."
    feedback:
      - when: { outputContains: "Year:  1991" }
        message: print already adds one space between values, so you don't need a space inside "Year:".
    explanation: >-
      print with several values separates them with a single space, so print("Year:", 1991) produces
      "Year: 1991".

  - id: tf-syntax
    type: true-false
    skill: recognition
    prompt: "True or false: if line 5 of a program has a SyntaxError, lines 1–4 still run first."
    answer: false
    explanation: >-
      Python must be able to read (parse) the whole file before running any of it. A SyntaxError anywhere
      means no statement runs. Runtime errors are different: they happen at a specific line during the run.

  - id: m-predict-order
    type: predict-output
    skill: prediction
    prompt: What does this print? (Three lines.)
    code: |
      print("A", 1)
      # print("B", 2)
      print("C", 1 + 2)
      print("D" "E")
    answer: |
      A 1
      C 3
      DE
    explanation: >-
      The commented line is ignored. "C", 1 + 2 prints C 3. Two string literals written next to each other
      are joined into one string, so "D" "E" is "DE".
    wrongAnswers:
      - answer: |
          A 1
          B 2
          C 3
          DE
        feedback: Line 2 starts with #, so the whole line is a comment and never runs.

  - id: m-which-error
    type: mcq
    skill: debugging
    prompt: |
      Running this program prints `Start` and then reports an error. Which line has the problem, and what
      kind of error is it?

      ```python
      print("Start")
      print(Hello)
      print("End")
      ```
    explanation: >-
      "Start" was printed, so the program was readable (no SyntaxError) and line 1 ran. Line 2 asks for a
      name called Hello, which does not exist: a NameError at runtime. Line 3 never runs.
    options:
      - id: a
        text: Line 2 — a NameError, because Hello without quotes is treated as a name.
        correct: true
        feedback: Right. Quotes would make it text.
      - id: b
        text: Line 2 — a SyntaxError.
        feedback: If it were a SyntaxError, "Start" would not have printed.
      - id: c
        text: Line 3 — because it was never reached.
        feedback: Line 3 is fine; it just doesn't run because line 2 failed.
      - id: d
        text: Line 1 — print can't be the first line.
        feedback: Any statement can be first. Line 1 ran successfully.

  - id: m-code-banner
    type: code
    skill: implementation
    prompt: |
      Print a three-line banner exactly like this, where the middle line uses print with two values,
      the second being the number 2026 written without quotes:

      ```text
      ==========
      Groundwork 2026
      ==========
      ```
    starterCode: ""
    solution: |
      print("==========")
      print("Groundwork", 2026)
      print("==========")
    expectedOutput: |
      ==========
      Groundwork 2026
      ==========
    tests:
      - name: exact banner
        code: |
          assert output_lines() == ["==========", "Groundwork 2026", "=========="], f"Your output was {output()!r}"
      - name: 2026 printed as a number
        code: |
          import ast
          assert any(isinstance(n, ast.Constant) and n.value == 2026 for n in ast.walk(ast.parse(source))), "Pass 2026 as a number."
    hints:
      - Three print calls.
      - "print(\"Groundwork\", 2026) inserts the space for you."
    explanation: Each print call produces one line; two values are separated by one space.

masteryCheck:
  passThreshold: 0.75
  items: [m-predict-order, m-which-error, m-code-banner, tf-syntax]

cheatsheet: |
  ```python
  print("text")            # strings need quotes
  print("Total:", 42)      # several values -> separated by spaces
  print(3 * 4)             # expressions are evaluated first -> 12
  print()                  # blank line
  # a comment
  ```
  - SyntaxError → nothing runs (missing quote/paren/colon)
  - NameError → a word without quotes that isn't a defined name
