id: python.slicing
concept: python.slicing
title: Indexing and Slicing Sequences
subtitle: "seq[start:stop:step] on strings and lists"
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  One syntax, seq[start:stop:step], takes any part of a string or list: the first few items, the last
  few, every second one, or everything reversed. Learn the rules for omitted and negative bounds, why
  slices never raise IndexError, why slicing a list makes a new (shallow) list, and how slice
  assignment edits a list in place.
objectives:
  - Predict the result of slices with positive and negative bounds, omitted bounds and steps, on strings and lists.
  - Explain the half-open rule (start included, stop excluded) and the "fence post" picture of indexes.
  - Use slicing to take prefixes, suffixes, middles, every n-th item and reversed copies — without loops.
  - Explain why slices clip out-of-range bounds instead of raising IndexError, and when that can hide a bug.
  - Explain that slicing a list creates a new, shallow list, and use slice assignment to replace, insert or delete parts of a list.
sources:
  - title: "Built-in Types: Common Sequence Operations"
    url: https://docs.python.org/3/library/stdtypes.html#common-sequence-operations
    publisher: Python Software Foundation
  - title: "The Python Tutorial: Text (indexing and slicing strings)"
    url: https://docs.python.org/3/tutorial/introduction.html#text
    publisher: Python Software Foundation
  - title: "The Python Tutorial: Lists"
    url: https://docs.python.org/3/tutorial/introduction.html#lists
    publisher: Python Software Foundation
  - title: "Python Language Reference: Slicings"
    url: https://docs.python.org/3/reference/expressions.html#slicings
    publisher: Python Software Foundation
  - title: "Built-in Functions: slice()"
    url: https://docs.python.org/3/library/functions.html#slice
