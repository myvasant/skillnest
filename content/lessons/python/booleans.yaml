sections:
  - id: why
    title: Why programs need yes-or-no answers
    kind: why
    blocks:
      - type: markdown
        body: |
          Programs constantly ask questions. Is the user old enough? Is the password long enough? Is
          the basket empty? Did the payment succeed? Before a program can *act* on the answer, it needs
          a value that **is** the answer.

          Printing a number leaves the judgement to the reader. A comparison makes Python answer the
          question itself:
      - type: code
        runnable: true
        code: |
          age = 17
          password = "hunter2"
          print(age)
          print(age >= 18)
          print(len(password) >= 8)
        expectedOutput: |
          17
          False
          False
        annotations:
          - line: 3
            text: "Just a number: you have to decide what it means."
          - line: 4
            text: "A comparison: Python answers the question 'is age at least 18?'"
      - type: markdown
        body: |
          These True/False answers are the raw material of every decision. In the next lesson,
          [conditional statements](concept:python.conditionals) use them to choose which code runs.

  - id: bool-type
    title: The bool type
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [Boolean](glossary:boolean) value — type `bool` — is either `True` or `False`. Those are
          the only two values of the type. They are [keywords](glossary:keyword), so they must be
          capitalised exactly: `true` is just an unknown name and raises `NameError`.
      - type: code
        runnable: true
        code: |
          is_raining = True
          print(is_raining, type(is_raining))
          print(type(False))
          print(5 > 3)
        expectedOutput: |
          True <class 'bool'>
          <class 'bool'>
          True
        annotations:
          - line: 4
            text: A comparison is an expression whose value is a bool.

  - id: comparisons
    title: Comparison operators
    kind: concept
    blocks:
      - type: markdown
        body: |
          [Comparison operators](glossary:comparison-operator) compare two values and produce a bool:

          | Operator | Meaning | Example | Result |
          |---|---|---|---|
          | `==` | equal to | `3 == 3` | `True` |
          | `!=` | not equal to | `3 != 3` | `False` |
          | `<` | less than | `2 < 5` | `True` |
          | `>` | greater than | `2 > 5` | `False` |
          | `<=` | less than or equal to | `5 <= 5` | `True` |
          | `>=` | greater than or equal to | `4 >= 5` | `False` |
      - type: callout
        variant: misconception
        title: "= is not =="
        body: |
          A single `=` is **assignment** (bind a name). A double `==` is a **question** (are these
          equal?). Writing `=` where a comparison belongs is a SyntaxError — Python even suggests:
          `Maybe you meant '==' or ':=' instead of '='?`
      - type: code
        runnable: true
        code: |
          print(5 == 5, 5 != 5, 3 < 7, 7 <= 7)
          print(1 == 1.0, "1" == 1)
          print("apple" < "banana", "Zebra" < "apple")
          print("10" < "9", 10 < 9)
          print("Ada" == "ada", "Ada".lower() == "ada")
        expectedOutput: |
          True False True True
          True False
          True True
          True False
          False True
        annotations:
          - line: 2
            text: An int and a float with the same value are equal. Text and a number never are (but == does not raise an error).
          - line: 3
            text: All upper-case letters sort before all lower-case letters.
          - line: 4
            text: As text, "10" < "9" because the first characters are compared - "1" comes before "9".
          - line: 5
            text: String comparison is case-sensitive. Lower-case both sides to ignore case.
      - type: markdown
        body: |
          **How strings compare.** Python compares strings character by character from the left, using
          each character's Unicode number (`ord("A")` is 65, `ord("a")` is 97). The first difference
          decides. If one string runs out first, the shorter one is smaller: `"apple" < "apple pie"`.
          This is *dictionary-like* order, but not quite: capitals come before all lower-case letters,
          and digits are compared as characters, not as numbers.

          **Mixing types.** `==` between unrelated types is simply `False`. Ordering them with `<`,
          `>`, `<=` or `>=` is a TypeError — a frequent bug when input text has not been converted:
      - type: code
        runnable: true
        code: |
          age_text = "20"
          print(age_text >= 18)
        expectError: TypeError
        caption: "TypeError: '>=' not supported between instances of 'str' and 'int'. Fix: int(age_text) >= 18."
      - type: callout
        variant: warning
        title: Never use == on computed floats
        body: |
          `0.1 + 0.2 == 0.3` is `False` because of binary rounding (see [numbers](concept:python.numbers)).
          Compare floats with `math.isclose(a, b)`.
      - type: item
        ref: predict-compare

  - id: chained
    title: Chained comparisons
    kind: concept
    blocks:
      - type: markdown
        body: |
          Python lets you write ranges the way maths does. A
          [chained comparison](glossary:chained-comparison) such as `0 <= score <= 100` means
          `0 <= score and score <= 100`, except that `score` is evaluated only once. Any comparison
          operators can be chained.
      - type: code
        runnable: true
        code: |
          score = 72
          print(0 <= score <= 100)
          print(70 <= score < 80)
          x = 5
          print(1 < x < 3)
          print(1 < 3 > 2)
        expectedOutput: |
          True
          True
          False
          True
        annotations:
          - line: 3
            text: A common pattern for "in this band, including 70 but not 80".
          - line: 6
            text: Legal - it means 1 < 3 and 3 > 2 - but confusing. Keep chains pointing in one direction.

  - id: logic
    title: Combining conditions with and, or, not
    kind: concept
    blocks:
      - type: markdown
        body: |
          Three keywords combine truth values:

          - `a and b` — true only when **both** are true.
          - `a or b` — true when **at least one** is true.
          - `not a` — flips true to false and false to true.

          | `a` | `b` | `a and b` | `a or b` | `not a` |
          |---|---|---|---|---|
          | `True` | `True` | `True` | `True` | `False` |
          | `True` | `False` | `False` | `True` | `False` |
          | `False` | `True` | `False` | `True` | `True` |
          | `False` | `False` | `False` | `False` | `True` |

          **Precedence** (who goes first): arithmetic, then comparisons, then `not`, then `and`, then
          `or`. So `not a == b` means `not (a == b)`, and `a or b and c` means `a or (b and c)`. Use
          parentheses whenever you mix `and` with `or` — readers will thank you.
      - type: code
        runnable: true
        code: |
          age = 25
          has_ticket = True
          print(age >= 18 and has_ticket)
          print(age < 12 or age >= 65)
          print(not has_ticket)
          print(True or False and False)
          print((True or False) and False)
        expectedOutput: |
          True
          False
          False
          True
          False
        annotations:
          - line: 6
            text: and runs first - True or (False and False) - which is True.
          - line: 7
            text: Parentheses change the grouping, and the answer.
      - type: item
        ref: predict-logic

  - id: short-circuit
    title: Short-circuit evaluation, step by step
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          `and` and `or` evaluate from left to right and **stop as soon as the answer is known** —
          [short-circuit evaluation](glossary:short-circuit-evaluation):

          - In `a and b`, if `a` is false the whole thing must be false, so `b` is **never evaluated**.
          - In `a or b`, if `a` is true the whole thing must be true, so `b` is **never evaluated**.

          This is not just an optimisation: it lets the left side **guard** the right side. Walk
          through `count != 0 and total / count > 10` with `count = 0`:

          1. Evaluate the left operand: `count != 0` → `0 != 0` → `False`.
          2. `and` looks at that result. `False and anything` can only be false, so it **stops** and
             the whole expression's value is that `False`.
          3. `total / count > 10` is never evaluated — so no division by zero happens.

          With `or`, step 2 is reversed: a **true** left operand ends the evaluation.
      - type: code
        runnable: true
        code: |
          count = 0
          total = 50
          print(count != 0 and total / count > 10)
          print(count == 0 or total / count > 10)
        expectedOutput: |
          False
          True
        annotations:
          - line: 3
            text: count != 0 is False, so the division (which would divide by zero) never runs.
          - line: 4
            text: count == 0 is True, so again the right side is skipped.
      - type: code
        runnable: true
        code: |
          count = 0
          total = 50
          print(total / count > 10 and count != 0)
        expectError: ZeroDivisionError
        caption: Same two conditions, opposite order. The division runs first and fails - put the guard on the left.
      - type: item
        ref: explain-short-circuit

  - id: truthiness
    title: Truthiness — every value is true or false
    kind: concept
    blocks:
      - type: markdown
        body: |
          `and`, `or`, `not` and `if` accept **any** value, not just `True` and `False`. Python decides
          whether a value counts as true using its [truthiness](glossary:truthiness):

          - **Falsy** values: `False`, `None`, zero of any number type (`0`, `0.0`), the empty string
            `""`, and empty collections such as an empty [list](concept:python.lists) `[]`.
          - **Everything else is truthy** — including `"0"`, `" "`, `"False"`, `-1` and `0.001`.

          `bool(x)` shows how a value will be treated.

          `None` is a special value meaning "no value here" — for example, a field the user left blank.
          It has its own type, `NoneType`, and there is exactly one `None` object.
      - type: code
        runnable: true
        code: |
          print(bool(0), bool(0.0), bool(""), bool(None))
          print(bool(1), bool(-3), bool("0"), bool(" "), bool("False"))
          print(type(None))
        expectedOutput: |
          False False False False
          True True True True True
          <class 'NoneType'>
        annotations:
          - line: 2
            text: Non-zero numbers and non-empty strings are truthy, whatever the text says.

  - id: operands
    title: "Mental model: and/or hand back the operand that decided"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Here is a surprise: `and` and `or` do not always produce `True` or `False`. Picture each of
          them reading its operands from left to right and **handing back the operand where it
          stopped** — the one that decided the answer. They never convert it to a bool; they return
          one of the original objects:

          | Expression | If `x` is truthy | If `x` is falsy |
          |---|---|---|
          | `x or y` | `x` (y is not evaluated) | `y` |
          | `x and y` | `y` | `x` (y is not evaluated) |
          | `not x` | `False` | `True` |

          `not` is the exception: it always returns a real bool. This behaviour gives a handy idiom for
          defaults: `name or "Guest"` means "name, unless it is empty".
      - type: visualization
        component: python-tracer
        title: Which object does each name end up with?
        caption: >-
          display1 refers to the string "Guest" because name is empty (falsy). display2 refers to the
          very same "Ada" object as nickname. safe becomes 1 because 0 is falsy.
        props:
          code: |
            name = ""
            nickname = "Ada"
            display1 = name or "Guest"
            display2 = nickname or "Guest"
            count = 0
            safe = count or 1
            print(display1, display2, safe)
      - type: code
        runnable: true
        code: |
          print(0 or 10, 5 or 10, 0 and 10, 5 and 10)
          print(not 0, not "hi")
          print("" or 0 or "last")
        expectedOutput: |
          10 5 0 10
          True False
          last
        annotations:
          - line: 3
            text: or returns the first truthy operand - or the last one if none is truthy.
      - type: callout
        variant: warning
        title: The default idiom treats 0 and "" as missing
        body: |
          `quantity = user_quantity or 1` replaces `None` with 1 — but it also replaces a deliberate `0`,
          because 0 is falsy. When 0 or the empty string are valid values, test for the missing case
          explicitly with `is None` (next section).
      - type: item
        ref: predict-operands

  - id: identity
    title: == versus is
    kind: concept
    blocks:
      - type: markdown
        body: |
          Recall from [variables](concept:python.variables) that names refer to objects. Two different
          questions can be asked about two names:

          - `a == b` — do they have **equal values**?
          - `a is b` — do they refer to **the very same object**?

          Two objects can be equal without being the same object, just as two copies of a book have the
          same text but are different books:
      - type: code
        runnable: true
        code: |
          x = 1000
          y = int("1000")
          print(x == y)
          print(x is y)
        expectedOutput: |
          True
          False
        annotations:
          - line: 2
            text: int() builds a new integer object at run time.
          - line: 4
            text: Equal values, different objects. (CPython detail - small ints and some strings are shared, so don't rely on is either way.)
      - type: markdown
        body: |
          So **use `==` to compare values**. The main use of `is` is checking for `None`: because there
          is only one `None` object, `x is None` is exact, fast, and cannot be fooled by unusual objects
          that redefine `==`. [PEP 8](https://peps.python.org/pep-0008/#programming-recommendations)
          recommends it.
      - type: code
        runnable: true
        code: |
          result = None
          print(result is None)
          print(result is not None)
          answer = 0
          print(answer is None, answer == 0, not answer)
        expectedOutput: |
          True
          False
          False True True
        annotations:
          - line: 5
            text: 0 is not None, yet `not answer` is True. Use `is None` when 0 is a real value.
      - type: callout
        variant: note
        title: Python warns about is with literals
        body: |
          Writing `x is 5` or `name is "Ada"` makes Python print
          `SyntaxWarning: "is" with 'int' literal. Did you mean "=="?` (or 'str' literal). Treat that
          warning as an error and use `==`.
      - type: item
        ref: mcq-is

  - id: or-bug
    title: "The `x == 1 or 2` bug"
    kind: debugging
    blocks:
      - type: markdown
        body: |
          This looks like "choice is 1 or 2" in English, but it is always truthy:
      - type: code
        runnable: true
        code: |
          choice = 3
          print(choice == 1 or 2)
          print(bool(choice == 1 or 2))
          print(choice == 1 or choice == 2)
        expectedOutput: |
          2
          True
          False
        annotations:
          - line: 2
            text: "Precedence groups it as (choice == 1) or 2. That is False or 2, which returns 2."
          - line: 3
            text: 2 is truthy, so this condition would pass for ANY choice.
          - line: 4
            text: The fix - write out the full comparison on both sides of or.
      - type: markdown
        body: |
          `==` binds tighter than `or`, so the right-hand side of `or` is the bare value `2`, not
          "choice == 2". Since a non-zero number is truthy, the whole expression is truthy whenever
          `choice == 1` is false. The same bug appears with text: `answer == "y" or "yes"` is always
          truthy.

          **Fixes:** repeat the comparison (`choice == 1 or choice == 2`), or test membership with
          `choice in (1, 2)` — the parentheses hold a [tuple](concept:python.tuples) of allowed values.

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **bool is a kind of int.** Python added `bool` in version 2.3
          ([PEP 285](https://peps.python.org/pep-0285/)); before that, programs used 1 and 0. For
          compatibility `bool` is a subclass of `int`: `True == 1`, `False == 0`, and
          `True + True == 2`. Adding up booleans therefore counts how many are true.

          **How truthiness is decided.** For `bool(x)` (and for every `if`, `and`, `or`, `not`), Python
          calls the object's `__bool__` method if it has one; otherwise it calls `__len__` and treats
          length 0 as false; if neither exists, the object is truthy. That is why empty containers are
          falsy. Your own classes can define these [special methods](concept:python.data-model).

          **Equality can be customised, identity cannot.** `==` calls the `__eq__` method, which each
          type defines as it sees fit (if a type does not, `==` falls back to identity). `is` simply
          compares object identity and cannot be overridden. CPython keeps a single shared object for
          each integer from -5 to 256 and reuses some strings, which is why `is` can *appear* to work
          for small values — an implementation detail you must not rely on.

          **NaN is not equal to itself.** The float "not a number" compares unequal to everything,
          including itself. Use `math.isnan()` to detect it.
      - type: code
        runnable: true
        code: |
          import math

          print(True == 1, False == 0, True + True)
          print(isinstance(True, int))
          nan = float("nan")
          print(nan == nan, math.isnan(nan))
        expectedOutput: |
          True True 2
          True
          False True
      - type: markdown
        body: |
          **Chains and short-circuits are jumps.** CPython compiles `a < b < c` so that `b` is evaluated
          once, and if `a < b` is false it jumps straight past `b < c`. `and`/`or` compile to similar
          conditional jumps, which is exactly how short-circuiting skips the right-hand operand. You
          will see those jump instructions in the [conditionals lesson](concept:python.conditionals).

  - id: mistakes
    title: Common mistakes and how to fix them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?` | `=` used for comparison | Use `==` |
          | `NameError: name 'true' is not defined` | Lower-case `true` / `false` | `True`, `False` |
          | A condition is always true | `x == 1 or 2` | `x == 1 or x == 2` |
          | `TypeError: '<' not supported between instances of 'str' and 'int'` | Comparing unconverted input with a number | `int(text) < 10` |
          | `"10" < "9"` is `True` | Comparing digits as text | Convert to numbers first |
          | `0.1 + 0.2 == 0.3` is `False` | Binary floating point | `math.isclose(a, b)` |
          | `SyntaxWarning: "is" with 'int' literal` | `x is 5` | `x == 5` |
          | A valid `0` was replaced by a default | `value or default` treats 0 as missing | Test `value is None` |
          | `ZeroDivisionError` in a combined condition | The guard is on the right of `and` | Put the guard first: `n != 0 and total / n > 1` |
      - type: code
        runnable: true
        code: |
          is_ready = true
        expectError: NameError
        caption: "NameError: name 'true' is not defined. Booleans are capitalised: True and False."

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          No `if` statements yet — each answer is a single Boolean expression. The checks change the
          input values to make sure your expression is right in every case.
      - type: item
        ref: code-ticket-rule
      - type: item
        ref: debug-or-bug
      - type: item
        ref: code-valid-score

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `bool` has two values, `True` and `False`. Comparisons `== != < > <= >=` produce them.
          - Strings compare character by character by Unicode number: case-sensitive, `"10" < "9"`.
          - Chains: `0 <= x < 10` means `0 <= x and x < 10`.
          - Precedence: comparisons → `not` → `and` → `or`. Use parentheses when mixing.
          - `and`/`or` short-circuit and **return an operand**; `not` always returns a bool.
          - Falsy: `False`, `None`, `0`, `0.0`, `""`, empty collections. Everything else is truthy.
          - `==` compares values; `is` compares identity — use it for `x is None`.
          - `x == 1 or 2` is always truthy: write `x == 1 or x == 2`.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What does `"" or "default"` evaluate to, and why?" — `"default"`: `or` returns its first
          truthy operand (or the last one), short-circuiting. Follow up by explaining truthiness, why
          `value or default` is wrong when 0 is valid, and the difference between `==` and `is`.

items:
  - id: predict-compare
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      print("cat" < "dog", "Cat" < "cat", "100" > "20", 100 > 20)
    answer: "True True False True"
    explanation: >-
      Strings compare character by character using Unicode numbers. "c" comes before "d". Upper-case
      "C" (67) comes before lower-case "c" (99). As text, "100" vs "20" is decided by the first
      characters, "1" < "2", so "100" is the SMALLER string. Only the last comparison is numeric.
    wrongAnswers:
      - answer: "True False False True"
        feedback: All upper-case letters come before all lower-case letters (ord("C") is 67, ord("c") is 99), so "Cat" < "cat" is True.
      - answer: "True True True True"
        feedback: '"100" and "20" are strings, compared character by character: "1" comes before "2", so "100" > "20" is False.'

  - id: predict-logic
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      a = True
      b = False
      c = True
      print(a and not b, not a or b, a or b and not c)
    answer: "True False True"
    explanation: >-
      a and not b is True and True, so True. not a or b groups as (not a) or b, which is False or
      False, so False. a or b and not c groups as a or (b and not c); a is True, so the result is
      True.
    wrongAnswers:
      - answer: "True False False"
        feedback: and binds tighter than or, so the last expression is a or (b and not c). Since a is True, the result is True.
      - answer: "True True True"
        feedback: not applies only to a here - (not a) or b - which is False or False.

  - id: explain-short-circuit
    type: explain
    skill: explanation
    prompt: |
      With `count = 0`, the expression `count != 0 and total / count > 10` evaluates to False without
      any error, but `total / count > 10 and count != 0` raises ZeroDivisionError. Explain why.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says that and evaluates its operands left to right.
      - Explains short-circuiting - if the left operand is falsy, and returns it without evaluating the right operand.
      - Applies it - count != 0 is False, so the division is never performed in the first version.
      - Explains that in the second version the division is evaluated first, dividing by zero, so the guard must be on the left.
    modelAnswer: |
      and evaluates from left to right and short-circuits: if the left operand is falsy, the result
      must be falsy, so Python returns it without evaluating the right operand at all. In the first
      version count != 0 is False, so total / count is never computed. In the second version the
      division is the left operand, so it runs first and divides by zero before the check is reached.
      The guard has to come first.

  - id: predict-operands
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print? Remember what and/or actually return.
    code: |
      print("" or "N/A", "Bo" or "N/A", 0 and "x", 3 and "x")
    answer: "N/A Bo 0 x"
    explanation: >-
      or returns the first truthy operand: "" is falsy, so "N/A"; "Bo" is truthy, so "Bo". and returns
      the first falsy operand, or the last one: 0 is falsy, so 0; 3 is truthy, so "x".
    wrongAnswers:
      - answer: "True True False True"
        feedback: and/or do not convert to bool. They return one of the operands themselves.
      - answer: "N/A Bo False x"
        feedback: 0 and "x" stops at 0 (falsy) and returns that operand, 0 - not False.
      - answer: "N/A N/A 0 x"
        feedback: '"Bo" is a non-empty string, so it is truthy and or returns it immediately.'

  - id: mcq-is
    type: mcq
    skill: recognition
    prompt: When should you use `is` rather than `==`?
    explanation: >-
      is asks whether two names refer to the same object. For values such as numbers and strings you
      care about equality, so use ==. The standard use of is is comparing with the single None object.
    options:
      - id: a
        text: To compare two numbers
        feedback: Use ==. Equal numbers can be different objects, so is may give False (or, for small ints in CPython, a misleading True).
      - id: b
        text: To compare two strings
        feedback: Use ==. Whether equal strings share one object is a CPython implementation detail.
      - id: c
        text: To check whether a value is None
        correct: true
        feedback: Right. There is exactly one None object, so x is None is exact and is what PEP 8 recommends.
      - id: d
        text: Always - it is faster than ==
        feedback: They ask different questions. Speed is irrelevant if the answer is to the wrong question.

  - id: code-ticket-rule
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A concert lets you in if you are **at least 18 and have a ticket** — or if you are on the **VIP
      list** (VIPs need nothing else). Starting from the three variables below, create `can_enter` with
      a **single Boolean expression** (no `if`), then print it. For these values it prints `False`.
    starterCode: |
      age = 16
      has_ticket = True
      is_vip = False
      # can_enter = ...

    solution: |
      age = 16
      has_ticket = True
      is_vip = False
      can_enter = (age >= 18 and has_ticket) or is_vip
      print(can_enter)
    expectedOutput: |
      False
    tests:
      - name: can_enter is False for this person
        code: |
          assert defined("can_enter"), "Create a variable named can_enter."
          assert can_enter is False, f"A 16-year-old with a ticket who is not a VIP cannot enter, but can_enter is {can_enter!r}."
      - name: Correct for other people
        code: |
          import re
          cases = [((20, True, False), True), ((20, False, False), False), ((16, False, True), True), ((16, True, False), False), ((70, True, True), True)]
          for (a, t, v), expected in cases:
              changed = re.sub(r"age\s*=\s*\d+", f"age = {a}", source, count=1)
              changed = re.sub(r"has_ticket\s*=\s*(True|False)", f"has_ticket = {t}", changed, count=1)
              changed = re.sub(r"is_vip\s*=\s*(True|False)", f"is_vip = {v}", changed, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              exec(compile(changed, "<variant>", "exec"), ns)
              assert ns.get("can_enter") == expected, f"With age={a}, has_ticket={t}, is_vip={v}, can_enter should be {expected} but it was {ns.get('can_enter')!r}."
      - name: One expression, no if
        code: |
          assert not uses("If", "IfExp"), "Write can_enter as one Boolean expression using and/or - no if needed."
      - name: Prints the result
        code: |
          assert output().strip() == "False", f"Print can_enter. Your program printed {output()!r}."
    hints:
      - Write the two ways in as separate pieces first - "adult with ticket" and "VIP".
      - "\"Adult with ticket\" is age >= 18 and has_ticket. Either way in is enough, so join the pieces with or."
      - Parentheses make the grouping obvious - (age >= 18 and has_ticket) or is_vip
    feedback:
      - when: { codeContains: "and is_vip" }
        message: >-
          VIPs do not need to be adults with tickets — being a VIP is an alternative way in. Join it with
          or, not and.
    explanation: >-
      There are two independent ways in, so they are joined with or. The first way needs two things
      at once, so it uses and. Because and binds tighter than or, the parentheses are optional, but
      they make the intent obvious.

  - id: debug-or-bug
    type: debug
    skill: debugging
    prompt: |
      `is_yes` should be `True` only when `answer` is `"y"` or `"yes"`. With `answer = "maybe"` the
      program should print `False`, but it prints `yes`. Fix the expression.
    starterCode: |
      answer = "maybe"
      is_yes = answer == "y" or "yes"
      print(is_yes)
    solution: |
      answer = "maybe"
      is_yes = answer == "y" or answer == "yes"
      print(is_yes)
    expectedOutput: |
      False
    tests:
      - name: "maybe is not a yes"
        code: |
          assert is_yes is False, f"For answer = 'maybe', is_yes should be False, but it is {is_yes!r}."
      - name: Correct for other answers
        code: |
          import re
          for text, expected in [("y", True), ("yes", True), ("no", False), ("Y", False)]:
              changed = re.sub(r"answer\s*=\s*[\"']maybe[\"']", f'answer = "{text}"', source, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              exec(compile(changed, "<variant>", "exec"), ns)
              assert ns.get("is_yes") is expected, f"For answer = {text!r}, is_yes should be {expected}, but it was {ns.get('is_yes')!r}."
    hints:
      - "Add parentheses the way Python groups it: (answer == \"y\") or \"yes\". What is the right-hand side of or?"
      - The string "yes" on its own is truthy. Each side of or needs its own full comparison.
    feedback:
      - when: { outputEquals: "yes\n" }
        message: >-
          The expression is (answer == "y") or "yes". The comparison is False, so or returns the string
          "yes". Compare answer on both sides - answer == "y" or answer == "yes".
    explanation: >-
      == binds tighter than or, so the original was (answer == "y") or "yes". For "maybe" the
      comparison is False, and or returns its right operand, the truthy string "yes". Writing the
      comparison on both sides gives a real bool for every answer.

  - id: code-valid-score
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      A form field sends a score as text: `score_text = "85"`. Create two booleans:

      - `is_valid` — `True` only if the text consists of digits **and** the number is from 0 to 100
        inclusive.
      - `passed` — `True` only if the score is valid **and** at least 40.

      Print them on one line (`print(is_valid, passed)` gives `True True`). Your expressions must not
      crash for text such as `"abc"` or `""` — use `score_text.isdecimal()` together with
      short-circuiting so that `int()` only runs on digit text.
    starterCode: |
      score_text = "85"

    solution: |
      score_text = "85"
      is_valid = score_text.isdecimal() and 0 <= int(score_text) <= 100
      passed = is_valid and int(score_text) >= 40
      print(is_valid, passed)
    expectedOutput: |
      True True
    tests:
      - name: "\"85\" is valid and passed"
        code: |
          assert defined("is_valid") and defined("passed"), "Create the variables is_valid and passed."
          assert (is_valid, passed) == (True, True), f"For '85' both should be True, but got is_valid={is_valid!r}, passed={passed!r}."
      - name: Correct (and no crash) for other text
        code: |
          import re
          cases = [("150", False, False), ("abc", False, False), ("30", True, False), ("0", True, False), ("100", True, True), ("", False, False)]
          for text, valid, ok in cases:
              changed = re.sub(r"score_text\s*=\s*[\"'][^\"']*[\"']", f'score_text = "{text}"', source, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              try:
                  exec(compile(changed, "<variant>", "exec"), ns)
              except ValueError:
                  raise AssertionError(f"With score_text = {text!r} your program crashed with ValueError. Check isdecimal() first, so int() is skipped for non-digit text.")
              got = (ns.get("is_valid"), ns.get("passed"))
              assert got[0] == valid and got[1] == ok, f"For score_text = {text!r}, expected is_valid={valid}, passed={ok}, but got is_valid={got[0]!r}, passed={got[1]!r}."
              assert isinstance(got[0], bool) and isinstance(got[1], bool), f"For score_text = {text!r}, is_valid and passed should be True or False, but got {got!r}."
      - name: Prints both values
        code: |
          assert output().strip() == "True True", f"Print both values with print(is_valid, passed). You printed {output()!r}."
    hints:
      - "score_text.isdecimal() is True for \"85\" and False for \"abc\" or \"\"."
      - "Put the isdecimal() check on the LEFT of and: if it is False, int(score_text) never runs."
      - "A chained comparison checks the range - 0 <= int(score_text) <= 100. passed can reuse is_valid."
    feedback:
      - when: { errorType: ValueError }
        message: >-
          int() ran on text that is not a number. Put score_text.isdecimal() first, joined with and, so
          the conversion is skipped when the check fails.
    explanation: >-
      score_text.isdecimal() guards the conversion: for "abc" or "" it is False, and and short-circuits,
      so int() never runs. The chained comparison 0 <= int(score_text) <= 100 checks the range in one
      step, and passed builds on is_valid in the same way. Ordering the checks so that the cheap, safe
      test comes first is a pattern you will use constantly.

  # ----- Mastery check (not used in the sections above) -----
  - id: m-predict-truthy
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      print(bool("0"), bool(0), bool(" ".strip()), not None)
    answer: "True False False True"
    explanation: >-
      "0" is a non-empty string, so it is truthy. The number 0 is falsy. " ".strip() is the empty
      string "", which is falsy. None is falsy, so not None is True.
    wrongAnswers:
      - answer: "False False False True"
        feedback: '"0" is text with one character, so it is truthy. Only the number 0 is falsy.'
      - answer: "True False True True"
        feedback: strip() removes the space, leaving the empty string "", which is falsy.

  - id: m-predict-chain
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      x = 7
      print(1 < x < 5, 5 < x <= 7, x == 7 == 7.0)
    answer: "False True True"
    explanation: >-
      1 < x < 5 means 1 < 7 and 7 < 5, which is False. 5 < x <= 7 means 5 < 7 and 7 <= 7, which is
      True. x == 7 == 7.0 is a chain too - x == 7 and 7 == 7.0 - and both parts are True.
    wrongAnswers:
      - answer: "False True False"
        feedback: >-
          This is a chain, not (x == 7) == 7.0. It means x == 7 and 7 == 7.0, and an int equals a float
          with the same value, so it is True.
      - answer: "True True True"
        feedback: Both parts of a chain must hold. 7 < 5 is False, so 1 < x < 5 is False.

  - id: m-mcq-or-default
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      A form gives `quantity`, which is either `None` (the field was left blank) or a whole number —
      and `0` is a valid order. A teammate writes `quantity = quantity or 1` "so a blank field means
      1". What is the problem?
    explanation: >-
      or returns its right operand whenever the left one is falsy, and 0 is falsy, so a deliberate 0
      becomes 1. Testing for the missing case explicitly - quantity is None - only replaces None.
    options:
      - id: a
        text: There is no problem - or only replaces None.
        feedback: or replaces every falsy value, and 0 is falsy too.
      - id: b
        text: A deliberate 0 also becomes 1 because 0 is falsy; test `quantity is None` instead.
        correct: true
        feedback: Exactly. Use the or-default idiom only when no falsy value is valid.
      - id: c
        text: It raises a TypeError when quantity is None.
        feedback: or accepts any values. None or 1 simply evaluates to 1.
      - id: d
        text: or always returns True or False, so quantity becomes True.
        feedback: and/or return one of their operands, so the result is 1 or the original quantity.

  - id: m-code-leap-year
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A year is a **leap year** if it is divisible by 4 — except century years (divisible by 100),
      which are leap years only if they are also divisible by 400. So 2024 and 2000 are leap years, but
      1900 and 2023 are not.

      Given `year = 2024`, create `is_leap` with a **single Boolean expression** (no `if`) and print it.
    starterCode: |
      year = 2024

    solution: |
      year = 2024
      is_leap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
      print(is_leap)
    expectedOutput: |
      True
    tests:
      - name: 2024 is a leap year
        code: |
          assert defined("is_leap"), "Create a variable named is_leap."
          assert is_leap is True, f"2024 is a leap year, but is_leap is {is_leap!r}."
      - name: Correct for other years
        code: |
          import re
          for value, expected in [(1900, False), (2000, True), (2023, False), (2100, False), (1996, True)]:
              changed = re.sub(r"year\s*=\s*\d+", f"year = {value}", source, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              exec(compile(changed, "<variant>", "exec"), ns)
              assert ns.get("is_leap") is expected, f"For {value}, is_leap should be {expected}, but it was {ns.get('is_leap')!r}."
      - name: One expression, no if
        code: |
          assert not uses("If", "IfExp"), "Write is_leap as one Boolean expression with and/or - no if needed."
    hints:
      - "\"Divisible by 4\" is year % 4 == 0."
      - "The exception: it must NOT be a century year (year % 100 != 0) OR it must be divisible by 400."
      - Combine the rule and the exception with and, and put parentheses around the exception.
    feedback:
      - when: { outputEquals: "False\n" }
        message: 2024 is divisible by 4 and is not a century year, so it should be True. Check each part of your expression.
    explanation: >-
      year % 4 == 0 is the basic rule. The century exception is (year % 100 != 0 or year % 400 == 0):
      either it is not a century year, or it is one of the special 400-year centuries. Both must hold,
      so they are joined with and; the parentheses are essential because and binds tighter than or.

  - id: m-debug-compare
    type: debug
    skill: debugging
    prompt: |
      Ages arrive as text. With `age_text = "9"` the program should print `True` (9 is under 18) but it
      prints `False`. Fix the comparison. Keep `age_text` as text.
    starterCode: |
      age_text = "9"
      limit = "18"
      is_child = age_text < limit
      print(is_child)
    solution: |
      age_text = "9"
      limit = "18"
      is_child = int(age_text) < int(limit)
      print(is_child)
    expectedOutput: |
      True
    tests:
      - name: 9 is a child
        code: |
          assert is_child is True, f"9 is under 18, so is_child should be True, but it is {is_child!r}."
      - name: age_text is still text
        code: |
          assert age_text == "9", "Keep age_text as the string \"9\"; convert it in the comparison."
      - name: Correct for other ages
        code: |
          import re
          for text, expected in [("100", False), ("17", True), ("18", False), ("5", True)]:
              changed = re.sub(r"age_text\s*=\s*[\"']9[\"']", f'age_text = "{text}"', source, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              exec(compile(changed, "<variant>", "exec"), ns)
              assert ns.get("is_child") is expected, f"For age {text}, is_child should be {expected}, but it was {ns.get('is_child')!r}."
    hints:
      - Both values are strings. How does Python compare "9" and "18" - as numbers or as text?
      - As text, "9" > "18" because "9" comes after "1". Convert both to numbers before comparing.
    feedback:
      - when: { outputEquals: "False\n" }
        message: >-
          You are still comparing text - "9" < "18" is False because "9" comes after "1". Convert both
          sides with int().
    explanation: >-
      String comparison looks at characters, and "9" comes after "1", so "9" < "18" is False even
      though 9 < 18. Converting both sides with int() compares the numbers.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-truthy, m-predict-chain, m-mcq-or-default, m-code-leap-year, m-debug-compare]

cheatsheet: |
  ```python
  ==  !=  <  >  <=  >=       # comparisons -> True / False
  0 <= x < 10                # chained: 0 <= x and x < 10
  a and b   a or b   not a   # precedence: not > and > or
  n != 0 and total / n > 1   # guard first (short-circuit)
  name or "Guest"            # or returns the first truthy operand
  bool(0), bool(""), bool(None)   # all False;  bool("0") is True
  x is None                  # identity - the right way to test for None
  x == 1 or x == 2           # NOT x == 1 or 2 (always truthy)
  ```
  - Strings compare by Unicode number: `"Z" < "a"`, `"10" < "9"`
  - `True == 1`, `True + True == 2` (bool is a subclass of int)
