id: python.booleans
concept: python.booleans
title: Booleans, Comparisons and Logic
subtitle: True, False, and how Python decides
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  Every decision a program makes comes down to True or False. Learn the comparison operators
  (including chained comparisons and comparing text), combine conditions with and, or and not,
  understand short-circuiting and why and/or return one of their operands, predict the truthiness of
  any value, and know when to use is instead of ==.
objectives:
  - Write comparisons with == != < > <= >= and predict their results, including chained comparisons and string comparisons.
  - Combine conditions with and, or and not, using precedence and short-circuit evaluation to predict results.
  - Explain that and/or return one of their operands, and use or to supply a default value safely.
  - Predict the truthiness of values such as 0, "", "0", " " and None.
  - Distinguish == (equal values) from is (same object), and test for None with is None.
  - Diagnose and fix the `x == 1 or 2` bug.
