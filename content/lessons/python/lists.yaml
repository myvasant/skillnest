  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **A dynamic array of references.** The
          [Python FAQ](https://docs.python.org/3/faq/design.html#how-are-lists-implemented-in-cpython)
          explains that CPython's list is "a contiguous array of references to other objects", plus the
          array's length. That explains the costs of the operations (see
          [complexity](concept:cs.complexity) and [dynamic arrays](concept:cs.dynamic-arrays)):

          | Operation | Cost | Why |
          |---|---|---|
          | `lst[i]`, `lst[i] = x`, `len(lst)` | constant time | jump straight to slot i; the length is stored |
          | `lst.append(x)`, `lst.pop()` | constant time on average ("amortised") | CPython over-allocates, so most appends find a free slot |
          | `lst.insert(0, x)`, `lst.pop(0)` | proportional to `len(lst)` | every later reference must shift by one slot |
          | `x in lst`, `lst.index(x)`, `lst.remove(x)` | proportional to `len(lst)` | the items are compared one by one |
          | `lst.sort()` | about n log n comparisons | an adaptive merge sort (Timsort) that is fast on partly ordered data |

          When an append finds the array full, CPython allocates a bigger array with spare room and moves
          the references across. Growing by a proportion each time keeps the average cost of append
          constant. (If you need fast adds and removes at **both** ends, `collections.deque` is designed
          for it.)

          **Sorting is guaranteed stable.** The [sorting HOWTO](https://docs.python.org/3/howto/sorting.html)
          guarantees that items that compare equal keep their original order — a language guarantee, not
          just a CPython detail. Below, `key=len` sorts by length, and words of equal length stay in the
          order they had:
      - type: code
        runnable: true
        code: |
          words = ["bb", "a", "ccc", "dd", "e"]
          print(sorted(words, key=len))
        expectedOutput: |
          ['a', 'e', 'bb', 'dd', 'ccc']
        caption: '"a" stays before "e" and "bb" before "dd", exactly as in the original list.'
      - type: markdown
        body: |
          **`+` versus `+=`.** `a + b` builds a **new** list. `a += b` behaves like `a.extend(b)`: it
          changes `a` in place, accepts any iterable, and therefore adds a string **character by
          character**:
      - type: code
        runnable: true
        code: |
          letters = ["a", "b"]
          letters += "cd"
          print(letters)
          new = letters + ["e"]
          print(new, letters)
        expectedOutput: |
          ['a', 'b', 'c', 'd']
          ['a', 'b', 'c', 'd', 'e'] ['a', 'b', 'c', 'd']
        caption: "letters + \"e\" (a string, not a list) would raise TypeError: + only joins a list with another list."
      - type: markdown
        body: |
          **Why the loop skipped an item.** In CPython, a for loop over a list uses a list iterator that
          stores a position and fetches the item at that position each time, stopping when the position
          reaches the list's *current* length. Removing an item shifts the later references left, so the iterator's next position
          jumps over one of them. Inserting does the opposite and can make a loop see an item twice — or
          never finish.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A list is an **ordered, mutable** sequence: `[72, 88, 95]`; `[]` is empty; `len()` counts items.
          - Indexes start at **0**; `-1` is the last item; valid indexes run `0 … len-1` (else IndexError).
            `lst[i] = x` replaces an item.
          - `append` (one item), `insert(i, x)`, `extend` (each item), `remove(value)`, `pop(index)`,
            `sort()`, `reverse()` change the list **in place** and return **None** — except `pop`, which
            returns the removed item.
          - `sorted(x)` returns a **new** list and leaves `x` alone; `x.sort()` changes `x`. Never write
            `lst = lst.sort()`.
          - Build lists with `[]` + `append` in a loop; test membership with `in`.
          - Don't remove items from the list you are looping over — build a new list.
          - `b = a` makes two names for **one** list ([mutability](concept:python.mutability) explains more).
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          Expect: "What is the difference between `append` and `extend`?", "`sort()` vs `sorted()`?",
          "Why does `x = lst.sort()` give None?", and "What is the time complexity of `append`,
          `insert(0, x)` and `in` on a list?" (amortised O(1), O(n), O(n)). Mentioning that CPython lists
          are dynamic arrays of references, and that sorting is stable, signals real understanding.

items:
  - id: predict-index
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      colors = ["red", "green", "blue", "gold"]
      print(colors[1], colors[-1], colors[-3])
      colors[0] = colors[2]
      print(colors)
    answer: |
      green gold green
      ['blue', 'green', 'blue', 'gold']
    explanation: >-
      Index 1 is the second item, "green". -1 is the last item, "gold", and -3 counts three from the end,
      which is "green" again. Then slot 0 is pointed at the object in slot 2, "blue", so blue appears
      twice.
    wrongAnswers:
      - answer: |
          red gold blue
          ['blue', 'green', 'blue', 'gold']
        feedback: Indexes count from 0, so colors[1] is the SECOND item, green; and -3 is the third item from the end, green.
      - answer: |
          green gold green
          ['blue', 'green', 'red', 'gold']
        feedback: >-
          colors[0] = colors[2] only replaces slot 0; it is not a swap. Slot 2 still refers to "blue".
      - answer: |
          green blue green
          ['blue', 'green', 'blue', 'gold']
        feedback: -1 is the very last item, gold. Negative indexes start at -1, not 0.

