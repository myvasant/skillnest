      [88, 95, 81]
      ```
    starterCode: |
      scores = [72, 88, 95, 60, 81]
      # 1. Compute average.
      # 2. Build the list above, starting from an empty list.

    solution: |
      scores = [72, 88, 95, 60, 81]
      average = sum(scores) / len(scores)
      above = []
      for score in scores:
          if score > average:
              above.append(score)
      print(average)
      print(above)
    expectedOutput: |
      79.2
      [88, 95, 81]
    tests:
      - name: average is correct
        code: |
          assert defined("average"), "Create a variable named average."
          assert abs(average - 79.2) < 1e-9, f"average should be 79.2, but it is {average!r}."
      - name: above holds the scores greater than the average
        code: |
          assert defined("above"), "Create a list named above."
          assert above == [88, 95, 81], f"above should be [88, 95, 81], but it is {above!r}."
      - name: built with a loop and append
        code: |
          assert uses("For") and calls("append"), "Build above by looping over scores and appending the ones you keep."
      - name: works for other scores
        code: |
          import re, io, contextlib
          changed = re.sub(r"scores\s*=\s*\[[^\]]*\]", "scores = [10, 20, 30, 40]", source, count=1)
          assert changed != source, "Keep the first line that creates scores."
          ns = {}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(compile(changed, "<variant>", "exec"), ns)
          assert ns.get("average") == 25 and ns.get("above") == [30, 40], "For scores [10, 20, 30, 40] the average is 25 and above should be [30, 40]. Compute both from scores."
      - name: prints average then above
        code: |
          assert output_lines() == ["79.2", "[88, 95, 81]"], f"Print average and then above. Your output was {output_lines()}."
    hints:
      - "average = sum(scores) / len(scores)"
      - Start with above = [] before the loop, then loop over scores.
      - Inside the loop, if score > average, call above.append(score) — on its own line, without assigning.
    feedback:
      - when: { errorType: AttributeError }
        message: >-
          above became None. `above = above.append(score)` replaces the list with append's return value
          (None). Write `above.append(score)` on its own.
      - when: { outputContains: "[72, 88, 95, 60, 81]" }
        message: You printed all the scores. Only the scores greater than the average belong in above.
    explanation: >-
      sum and len give the average without a loop. The new list starts empty and the loop appends only the
      scores that pass the test — the filter pattern. The original scores list is never changed.

