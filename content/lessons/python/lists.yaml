  - id: m-mcq-indexerror
    type: mcq
    skill: debugging
    prompt: |
      What happens when this program runs?

      ```python
      nums = [4, 8, 15]
      for i in range(len(nums) + 1):
          print(nums[i])
      ```
    explanation: >-
      range(len(nums) + 1) is range(4), giving 0, 1, 2, 3. The first three indexes are valid and print
      4, 8 and 15; nums[3] does not exist, so the fourth iteration raises IndexError. Use range(len(nums))
      — or better, loop over the items directly.
    options:
      - id: a
        text: It prints 4, 8 and 15, then stops with IndexError.
        correct: true
        feedback: Right. The valid indexes are 0, 1 and 2; the loop also tries 3.
      - id: b
        text: It prints 4, 8 and 15 and finishes normally.
        feedback: The + 1 makes the range produce one index too many, 3, and nums[3] is out of range.
      - id: c
        text: It raises IndexError before printing anything.
        feedback: Errors happen when the bad line runs. The first three iterations use valid indexes and print first.
      - id: d
        text: It prints 4, 8, 15 and then 4 again, wrapping around.
        feedback: Python lists do not wrap around for indexes that are too large. Only negative indexes count from the end.

