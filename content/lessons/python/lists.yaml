id: python.lists
concept: python.lists
title: Lists
subtitle: Ordered collections you can change
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  A list holds many values in order under one name. Learn to create lists, index them from the front
  and the back, grow and shrink them with methods, sort them, loop over them and build new lists with
  loops — and avoid the classic traps: IndexError, `lst = lst.sort()`, and changing a list while
  looping over it.
objectives:
  - Create lists, read items with positive and negative indexes, and replace items by index.
  - Use append, insert, extend, remove, pop, sort and reverse, and predict how each changes the list and what it returns.
  - Explain why in-place methods return None, and choose between sorted() and .sort().
  - Loop over lists and build new lists with the accumulator pattern and membership tests (in).
  - Diagnose IndexError, ValueError from remove(), the `lst = lst.sort()` bug, and items skipped by removing during a loop.
