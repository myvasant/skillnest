sections:
  - id: why
    title: Why one name for many values?
    kind: why
    blocks:
      - type: markdown
        body: |
          Suppose you want the average of some test scores. With one variable per value, the program
          works — but only for exactly three scores:
      - type: code
        runnable: true
        code: |
          score1 = 72
          score2 = 88
          score3 = 95
          total = score1 + score2 + score3
          print(total / 3)
        expectedOutput: |
          85.0
        caption: A fourth score means a new name and edits to two lines. A hundred scores, or "however many the user types", is impossible.
      - type: markdown
        body: |
          A [list](glossary:list) keeps any number of values, **in order**, under **one** name — and a
          [for loop](concept:python.for-loops) can walk through it:
      - type: code
        runnable: true
        code: |
          scores = [72, 88, 95]
          total = 0
          for score in scores:
              total += score
          print(total / len(scores))
        expectedOutput: |
          85.0
        caption: Add a score inside the brackets and run it again. Nothing else needs to change.

  - id: creating
    title: Creating lists
    kind: concept
    blocks:
      - type: markdown
        body: |
          Write a list as **square brackets** around values separated by commas. The values are called
          **items** (or elements). A list can hold any kind of object, even a mix, although in practice
          most lists hold items of one kind.

          - `[]` is the empty list.
          - `len(lst)` gives the number of items.
          - `list(iterable)` builds a list from any [iterable](glossary:iterable) — for example the
            characters of a string or the numbers of a range.
          - Printing a list shows strings with quotes, so you can see where each item begins and ends.
      - type: code
        runnable: true
        code: |
          scores = [72, 88, 95]
          names = ["Ada", "Grace", "Linus"]
          mixed = [1, "two", 3.0, True]
          empty = []
          print(scores)
          print(names)
          print(mixed)
          print(len(names), len(empty))
          print(list("abc"), list(range(4)))
        expectedOutput: |
          [72, 88, 95]
          ['Ada', 'Grace', 'Linus']
          [1, 'two', 3.0, True]
          3 0
          ['a', 'b', 'c'] [0, 1, 2, 3]
        annotations:
          - line: 6
            text: Lists display strings with quotes (single quotes by default), unlike print("Ada") on its own.
          - line: 9
            text: list() takes each item the iterable hands out — characters of a string, numbers of a range.
      - type: callout
        variant: tip
        title: Plural names for lists
        body: |
          Name a list after what it holds, in the plural: `scores`, `names`, `tasks`. Then the loop reads
          naturally: `for score in scores:`.

  - id: indexing
    title: Indexing — items by position
    kind: concept
    blocks:
      - type: markdown
        body: |
          Each item has an [index](glossary:index): its position, **counting from 0**. As with strings,
          `lst[i]` reads the item at index `i`, and **negative indexes count from the end**: `-1` is the
          last item, `-2` the one before it.

          | Item | `"Mercury"` | `"Venus"` | `"Earth"` | `"Mars"` |
          |---|---|---|---|---|
          | Index | 0 | 1 | 2 | 3 |
          | Negative index | -4 | -3 | -2 | -1 |

          For a list of length `n`, the valid indexes are `0 … n - 1` and `-n … -1`. Anything else raises
          [IndexError](glossary:index-error).

          Unlike strings, lists are [mutable](glossary:mutable): you can **assign to an index** to replace
          that item.
      - type: code
        runnable: true
        code: |
          planets = ["Mercury", "Venus", "Earth", "Mars"]
          print(planets[0], planets[2])
          print(planets[-1], planets[-2])
          planets[1] = "VENUS"
          print(planets)
        expectedOutput: |
          Mercury Earth
          Mars Earth
          ['Mercury', 'VENUS', 'Earth', 'Mars']
        annotations:
          - line: 3
            text: -1 is always the last item, whatever the length. Handy when you don't know len(planets).
          - line: 4
            text: Item assignment changes the list itself. The same on a string raises TypeError, because strings are immutable.
      - type: code
        runnable: true
        code: |
          planets = ["Mercury", "Venus", "Earth", "Mars"]
          print(planets[4])
        expectError: IndexError
        caption: "IndexError: list index out of range. Four items means the last index is 3 (or -1), not 4."
      - type: item
        ref: predict-index

  - id: mental-model
    title: "Mental model: a numbered row of references"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          A list is **one object** that holds an ordered row of slots, numbered from 0. Each slot holds a
          **reference** to another object — exactly like a [variable](glossary:variable) refers to an
          object, but numbered instead of named. The list does not contain copies of the items; it points
          at them.

          Operations like `append` or `langs[0] = "Go"` **change that one list object in place**: the
          name `langs` keeps pointing at the same list the whole time. Step through and watch the arrows.
      - type: visualization
        component: python-tracer
        title: One list, changed in place
        caption: >-
          The list object stays the same (the name langs never moves); its slots change. Line 3 points
          slot 0 at a new string, and line 4 gives the name first a reference to the same string.
        props:
          code: |
            langs = ["Python", "SQL"]
            langs.append("Rust")
            langs[0] = "Go"
            first = langs[0]
            print(langs, first)
      - type: markdown
        body: |
          This picture predicts something important. Assignment never copies, so after `b = a` both
          names refer to the **same list**, and a change made through one name is visible through the
          other:
      - type: code
        runnable: true
        code: |
          a = [1, 2]
          b = a
          b.append(3)
          print(a, b)
        expectedOutput: |
          [1, 2, 3] [1, 2, 3]
        caption: One list, two names ([aliasing](glossary:aliasing)). The mutability lesson explores this in depth.
      - type: callout
        variant: note
        title: Coming up
        body: |
          Aliasing is harmless with immutable values like numbers and strings, and very important with
          lists. You will study it properly — including how to make real copies — in
          [mutability and references](concept:python.mutability) and
          [shallow and deep copies](concept:python.copying). For now, remember: `b = a` does **not** copy a
          list.

  - id: methods
    title: Changing a list with methods
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A **method** is a function that belongs to an object and is called with a dot, like the string
          methods `upper()` and `split()`. Lists have methods that change the list
          [in place](glossary:in-place):

          | Method | What it does | Returns |
          |---|---|---|
          | `lst.append(x)` | add `x` at the end | `None` |
          | `lst.insert(i, x)` | insert `x` **before** index `i` | `None` |
          | `lst.extend(iterable)` | add **each item** of the iterable at the end | `None` |
          | `lst.remove(x)` | remove the **first** item equal to `x` (ValueError if none) | `None` |
          | `lst.pop()` / `lst.pop(i)` | remove the last item / the item at index `i` | **the removed item** |
          | `del lst[i]` *(a statement)* | remove the item at index `i` | — |
          | `lst.sort()` | sort the list in place (ascending; `reverse=True` for descending) | `None` |
          | `lst.reverse()` | reverse the order in place | `None` |
          | `lst.index(x)` | index of the first item equal to `x` (ValueError if none) | an int |
          | `lst.count(x)` | how many items equal `x` | an int |
      - type: code
        runnable: true
        code: |
          tasks = ["email", "code"]
          tasks.append("lunch")
          tasks.insert(0, "coffee")
          tasks.extend(["review", "gym"])
          print(tasks)
          tasks.remove("lunch")
          last = tasks.pop()
          first = tasks.pop(0)
          print(tasks, last, first)
          print(tasks.index("code"), tasks.count("email"))
          tasks.reverse()
          print(tasks)
        expectedOutput: |
          ['coffee', 'email', 'code', 'lunch', 'review', 'gym']
          ['email', 'code', 'review'] gym coffee
          1 1
          ['review', 'code', 'email']
        annotations:
          - line: 3
            text: Inserted before index 0, so "coffee" becomes the new first item and everything else shifts right.
          - line: 6
            text: remove() finds by VALUE; pop() and del find by INDEX.
          - line: 7
            text: pop() is the one changing method that hands back something useful — the item it removed.
      - type: markdown
        body: |
          **append versus extend.** `append` always adds exactly **one** item — even if that item is a
          list, which then sits inside the list as a single (nested) item. `extend` adds the items of an
          iterable **one by one**:
      - type: code
        runnable: true
        code: |
          a = [1, 2]
          a.append([3, 4])
          b = [1, 2]
          b.extend([3, 4])
          print(a, len(a))
          print(b, len(b))
        expectedOutput: |
          [1, 2, [3, 4]] 3
          [1, 2, 3, 4] 4
      - type: item
        ref: predict-methods

  - id: in-place-none
    title: In-place methods return None — sort() versus sorted()
    kind: concept
    blocks:
      - type: markdown
        body: |
          Methods that change a list in place (all of the changing methods above except `pop`) return
          `None`, Python's "no value" object. This is a deliberate design: the return value reminds you
          that **no new list was created** — the original was changed.
      - type: code
        runnable: true
        code: |
          numbers = [3, 1, 2]
          result = numbers.sort()
          print(result)
          print(numbers)
        expectedOutput: |
          None
          [1, 2, 3]
      - type: callout
        variant: misconception
        title: "\"lst = lst.sort() gives me the sorted list\""
        body: |
          It gives you `None`. `lst.sort()` sorts the list and returns `None`, and the assignment then
          rebinds `lst` to that `None` — the sorted list is lost. The error appears later, often far
          away: `TypeError: 'NoneType' object is not subscriptable` when you try `lst[0]`. The same trap
          exists for `append`, `extend`, `insert`, `reverse` and `remove`.
      - type: code
        runnable: true
        code: |
          numbers = [3, 1, 2]
          numbers = numbers.sort()
          print(numbers[0])
        expectError: TypeError
        caption: "numbers is now None, and None cannot be indexed. Fix: write numbers.sort() on its own line."
      - type: markdown
        body: |
          When you want a **new** sorted list and need to keep the original, use the built-in function
          `sorted()`:

          | | `sorted(x)` | `x.sort()` |
          |---|---|---|
          | Works on | any iterable (list, string, range, …) | lists only |
          | Original | unchanged | changed |
          | Returns | a **new list** | `None` |
      - type: code
        runnable: true
        code: |
          original = [3, 1, 2]
          new = sorted(original)
          print(new, original)
          original.sort(reverse=True)
          print(original)
          print(sorted("banana"))
          print(sorted(["banana", "apple", "Cherry"]))
        expectedOutput: |
          [1, 2, 3] [3, 1, 2]
          [3, 2, 1]
          ['a', 'a', 'a', 'b', 'n', 'n']
          ['Cherry', 'apple', 'banana']
        annotations:
          - line: 6
            text: sorted() of a string gives a list of its characters in order.
          - line: 7
            text: Strings sort by character code, and every upper-case letter comes before every lower-case one, so "Cherry" is first.
      - type: callout
        variant: tip
        title: Sorting ignoring case
        body: |
          `sorted(words, key=str.lower)` compares the lower-case versions while keeping the original
          strings. The `key=` argument takes a function that is applied to each item before comparing —
          you will meet this idea properly in [higher-order functions](concept:python.higher-order-functions).
      - type: item
        ref: mcq-sort-none

  - id: looping-building
    title: Looping over lists and building new ones
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Everything from the [for loops lesson](concept:python.for-loops) works on lists: `for item in
          lst` visits items in order, `enumerate(lst)` adds positions, and the built-ins `len`, `sum`,
          `min` and `max` accept lists of numbers.
      - type: code
        runnable: true
        code: |
          scores = [72, 88, 95, 60]
          print(sum(scores), min(scores), max(scores))
          print(sum(scores) / len(scores))
          for position, score in enumerate(scores, start=1):
              print(position, score)
        expectedOutput: |
          315 60 95
          78.75
          1 72
          2 88
          3 95
          4 60
      - type: markdown
        body: |
          **Building a list** is the [accumulator](glossary:accumulator) pattern with an empty list as
          the starting value: create `[]` before the loop and `append` inside it. Add an `if` to keep only
          some items (a *filter*):
      - type: code
        runnable: true
        code: |
          squares = []
          for n in range(1, 6):
              squares.append(n * n)
          print(squares)

          words = ["apple", "kiwi", "banana", "fig"]
          short = []
          for w in words:
              if len(w) <= 4:
                  short.append(w)
          print(short)
        expectedOutput: |
          [1, 4, 9, 16, 25]
          ['kiwi', 'fig']
      - type: visualization
        component: python-tracer
        title: Build a filtered list
        caption: Watch the empty list hot gain a slot each time append runs. The original list temps never changes.
        props:
          code: |
            temps = [21, 35, 28, 40]
            hot = []
            for t in temps:
                if t > 30:
                    hot.append(t)
            print(hot)
      - type: markdown
        body: |
          **Membership.** `x in lst` is True if some item equals `x`; `x not in lst` is the opposite.
          Comparisons are exact, so case matters for strings:
      - type: code
        runnable: true
        code: |
          guests = ["Ada", "Grace"]
          print("Ada" in guests, "ada" in guests, "Linus" not in guests)
        expectedOutput: |
          True False True
      - type: markdown
        body: |
          **Lists from user input.** Because a list can grow, it is the natural home for "however many
          values the user types". Combine a [sentinel loop](concept:python.while-loops) — here the
          sentinel is an empty line — with `append`:
      - type: code
        runnable: true
        stdin: "milk\neggs\nbread\n\n"
        code: |
          items = []
          item = input("Item (blank to finish): ")
          while item != "":
              items.append(item)
              item = input("Item (blank to finish): ")
          print()
          print(len(items), "items:", items)
        expectedOutput: |
          Item (blank to finish): Item (blank to finish): Item (blank to finish): Item (blank to finish):
          3 items: ['milk', 'eggs', 'bread']
        caption: The input box holds three items and an empty line. The four prompts share a line because typed values are not echoed.

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `IndexError: list index out of range` | Index ≥ `len(lst)` (often `lst[len(lst)]`), or the list is empty | The last index is `len(lst) - 1`, or simply `-1`. Check for an empty list first. |
          | `TypeError: 'NoneType' object is not subscriptable`, or `AttributeError: 'NoneType' object has no attribute 'append'` | `lst = lst.sort()` / `lst = lst.append(x)` replaced the list with None | Call in-place methods on their own line; use `sorted()` for a new list. |
          | `ValueError: list.remove(x): x not in list` | Removing a value that is not there | Check `if x in lst:` first. |
          | `TypeError: list indices must be integers or slices, not float` | Index computed with `/` | Use `//` or `int()`. |
          | A list inside your list: `[1, 2, [3, 4]]` | `append` used where `extend` was meant | `extend` adds items one by one. |
          | `TypeError: '<' not supported between instances of 'str' and 'int'` | Sorting a list that mixes strings and numbers | Convert so all items are the same kind. |
          | Some items are skipped when removing in a loop | The list is changed while a for loop walks through it | Build a new list instead (see below). |
          | A change to one list "also changed" another | Two names refer to the same list | `b = a` does not copy; see [mutability](concept:python.mutability). |
      - type: code
        runnable: true
        code: |
          nums = [1, 2]
          nums.remove(5)
        expectError: ValueError
        caption: "ValueError: list.remove(x): x not in list. remove() insists that the value exists."
      - type: markdown
        body: |
          **Removing while looping.** This looks like it removes every 2, but one survives:
      - type: code
        runnable: true
        code: |
          nums = [1, 2, 2, 3]
          for n in nums:
              if n == 2:
                  nums.remove(n)
          print(nums)
        expectedOutput: |
          [1, 2, 3]
      - type: visualization
        component: python-tracer
        title: Why the second 2 is skipped
        caption: >-
          The for loop walks the list by position: 0, 1, 2, …. Removing the 2 at position 1 shifts the
          second 2 into position 1, which the loop has already visited, so the next item it fetches is
          the 3 at position 2.
        props:
          code: |
            nums = [1, 2, 2, 3]
            for n in nums:
                if n == 2:
                    nums.remove(n)
            print(nums)
      - type: markdown
        body: |
          The reliable fix is to **build a new list** of the items you want to keep, and never change the
          list you are looping over:
      - type: code
        runnable: true
        code: |
          nums = [1, 2, 2, 3]
          kept = []
          for n in nums:
              if n != 2:
                  kept.append(n)
          print(kept)
        expectedOutput: |
          [1, 3]
      - type: item
        ref: debug-sort-none

