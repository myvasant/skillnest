  - id: code-above-average
    type: code
    skill: implementation
    prompt: |
      Given the list `scores`, compute `average` (a float) and build a **new list** `above` that holds the
      scores **greater than** the average, in their original order. Print `average`, then `above`.

      For `[72, 88, 95, 60, 81]` the average is 79.2 and the output is:

      ```text
