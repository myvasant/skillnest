  - id: m-debug-remove-negatives
    type: debug
    skill: debugging
    difficulty: 3
    prompt: |
      This program should print the readings without the negative values: `[5, 7]`. It prints
      `[5, -2, 7]` instead. Fix it so it works for any list of readings.
    starterCode: |
      readings = [5, -1, -2, 7, -3]
      for r in readings:
          if r < 0:
              readings.remove(r)
      print(readings)
    solution: |
      readings = [5, -1, -2, 7, -3]
      clean = []
      for r in readings:
          if r >= 0:
              clean.append(r)
      print(clean)
    expectedOutput: |
      [5, 7]
    tests:
      - name: prints [5, 7]
        code: |
          assert output().strip() == "[5, 7]", f"Expected [5, 7], but your program printed {output()!r}."
      - name: works for other readings
        code: |
          import re, io, contextlib
          for data, expected in [("[-1, -2, -3, 4]", "[4]"), ("[1, 2, 3]", "[1, 2, 3]"), ("[-5, -5, 0, 9, -1]", "[0, 9]")]:
              changed = re.sub(r"readings\s*=\s*\[[^\]]*\]", "readings = " + data, source, count=1)
              assert changed != source, "Keep the first line that creates readings."
              buffer = io.StringIO()
              with contextlib.redirect_stdout(buffer):
                  exec(compile(changed, "<variant>", "exec"), {})
              printed = buffer.getvalue().strip()
              assert printed == expected, f"For readings = {data} expected {expected}, but got {printed}."
    hints:
      - Step through the original. After the -1 is removed, which item moves into the position the loop just checked?
      - Changing a list while a for loop walks over it makes the loop skip items.
      - Build a new list of the readings you want to keep (r >= 0) and print that instead.
    feedback:
      - when: { outputEquals: "[5, -2, 7]\n" }
        message: >-
          The list is still being changed while the loop walks over it, so the -2 is skipped. Build a new
          list of the readings to keep instead of removing from the one you are looping over.
    explanation: >-
      remove() shifts the later items left, so the loop's next position skips the item that slid into the
      slot it just checked (-2 slid into position 1 after -1 was removed). Building a new list leaves the
      list being iterated untouched, so every item is examined exactly once.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-pop, m-mcq-indexerror, m-tf-sorted, m-code-running-balance, m-debug-remove-negatives]

cheatsheet: |
  ```python
  nums = [3, 1, 2]          # create; [] is empty; len(nums) -> 3
  nums[0], nums[-1]         # first, last (0-based; -1 = last)
  nums[1] = 9               # replace an item (lists are mutable)
  nums.append(4)            # add one item at the end
  nums.insert(0, 7)         # insert before index 0
  nums.extend([5, 6])       # add each item of an iterable
  nums.remove(9)            # remove first 9 (ValueError if absent)
  last = nums.pop()         # remove + RETURN last item; pop(i) for index i
  nums.sort()               # in place, returns None (reverse=True for descending)
  nums.reverse()            # in place, returns None
  new = sorted(nums)        # NEW sorted list; nums unchanged
  x in nums                 # membership test
  evens = []                # build a list: empty list + append in a loop
  for n in nums:
      if n % 2 == 0:
          evens.append(n)
  ```
  - Never `lst = lst.sort()` (or `= lst.append(x)`): it stores None
  - Don't remove from a list while looping over it; build a new list
  - `b = a` is the SAME list, not a copy
