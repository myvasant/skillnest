  - id: code-unique-items
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Read shopping items, one per line, until an **empty line**. Ignore an item if it is already in your
      list. Then print `<count> unique items`, followed by the items in **alphabetical order**, one per
      line.

      For the inputs `milk`, `eggs`, `milk`, `bread`, `eggs` and an empty line, the output ends with:

      ```text
      3 unique items
      bread
      eggs
      milk
      ```
    stdin: "milk\neggs\nmilk\nbread\neggs\n\n"
    starterCode: |
      items = []
      # Read items until an empty line; add each one only if it is not already in items.

      # Then print the count and the items in alphabetical order.
    solution: |
      items = []
      item = input("Item: ")
      while item != "":
          if item not in items:
              items.append(item)
          item = input("Item: ")
      print(len(items), "unique items")
      for item in sorted(items):
          print(item)
    expectedOutput: |
      Item: Item: Item: Item: Item: Item: 3 unique items
      bread
      eggs
      milk
    tests:
      - name: uses a loop, append and a sort
        code: |
          assert calls("append"), "Add new items with append."
          assert calls("sorted") or calls("sort"), "Print the items in alphabetical order with sorted() or .sort()."
      - name: example shopping list
        code: |
          lines = output_lines()
          assert len(lines) >= 4 and lines[-4].endswith("3 unique items") and lines[-3:] == ["bread", "eggs", "milk"], f"Expected '3 unique items' then bread, eggs, milk. Your output ended with {lines[-4:]}."
      - name: other inputs
        code: |
          lines = run_program("pear\napple\npear\npear\nfig\n\n").rstrip("\n").split("\n")
          assert lines[-4].endswith("3 unique items") and lines[-3:] == ["apple", "fig", "pear"], f"For pear, apple, pear, pear, fig expected 3 unique items: apple, fig, pear. Got {lines[-4:]}."
          lines = run_program("\n").rstrip("\n").split("\n")
          assert lines[-1].endswith("0 unique items"), f"An empty line straight away means 0 unique items. Got {lines}."
    hints:
      - 'Use a sentinel loop: read one item before the loop, loop `while item != "":`, and read the next item as the last line of the body.'
      - "`if item not in items:` guards the append, so duplicates are skipped."
      - After the loop, print len(items), then loop over sorted(items) to print each one.
    feedback:
      - when: { outputContains: "5 unique items" }
        message: Duplicates are being added. Check `item not in items` before appending.
      - when: { errorType: EOFError }
        message: The loop kept reading after the empty line. Stop looping when the item is the empty string "".
    explanation: >-
      The list grows as items arrive, which is why a list suits input of unknown length. A membership test
      before append keeps it free of duplicates, and sorted() gives a new alphabetical list for printing
      without disturbing the original order. (Later, a set will make "unique items" even simpler.)

  - id: explain-sort-vs-sorted
    type: explain
    skill: explanation
    prompt: |
      A colleague asks: "What is the difference between `my_list.sort()` and `sorted(my_list)`, and why
      does `my_list = my_list.sort()` break my program?" Write your answer.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says that my_list.sort() changes the existing list in place, while sorted() builds and returns a new list and leaves the original unchanged.
      - States that sort() returns None (as most in-place list methods do).
      - Explains that the assignment rebinds my_list to None, losing the sorted list, so later indexing fails.
      - Gives guidance on choosing — sorted() when the original must be kept or the input is not a list; sort() to reorder a list you own.
    modelAnswer: |
      `my_list.sort()` reorders the list object itself and returns None — the None signals "I changed
      the original, I did not make a new list". `sorted(my_list)` leaves my_list alone and returns a new,
      sorted list; it also works on any iterable, such as a string or a range. Writing
      `my_list = my_list.sort()` sorts the list and then rebinds the name my_list to the None that
      sort() returned, so the sorted list is lost and something like my_list[0] later fails with
      "'NoneType' object is not subscriptable". Use sort() on its own line when you want to reorder a
      list in place, and sorted() when you need to keep the original or are not starting from a list.

