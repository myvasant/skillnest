id: python.style
concept: python.style
title: Readable Python and PEP 8
subtitle: Write code that another developer can understand and maintain
estimatedMinutes: 40
reviewedOn: 2026-11-04
summary: >-
  Learn the naming, indentation, whitespace, import and documentation conventions that make Python code
  readable. Understand the purpose of PEP 8, how formatters and linters help, and why consistent style
  improves review and maintenance without guaranteeing that a program is correct.
objectives:
  - Explain why consistent style matters when code is read and changed by other people.
  - Apply common PEP 8 naming conventions to variables, functions, classes and constants.
  - Use four-space indentation, sensible line breaks and whitespace around operators.
  - Organise imports and write comments or docstrings that explain intent.
  - Distinguish a formatter from a linter and from a test suite.
  - Improve readability without changing the program's behaviour.
sources:
  - title: PEP 8 — Style Guide for Python Code
    url: https://peps.python.org/pep-0008/
    publisher: Python Software Foundation
  - title: PEP 257 — Docstring Conventions
    url: https://peps.python.org/pep-0257/
    publisher: Python Software Foundation
  - title: Python Tutorial — Defining Functions
    url: https://docs.python.org/3/tutorial/controlflow.html#defining-functions
    publisher: Python Software Foundation
  - title: Ruff — Formatter
    url: https://docs.astral.sh/ruff/formatter/
    publisher: Astral
sections:
  - id: why
    title: Why readability is an engineering requirement
    kind: why
    blocks:
      - type: markdown
        body: |
          Code is read many more times than it is written. A teammate may need to debug it six months later,
          or you may need to change it after forgetting why you made a decision. Consistent style reduces
          the effort needed to understand the structure, names and intent.

          **PEP 8** is Python's widely used style guide. It is a convention, not a rule enforced by the
          Python interpreter. Valid Python can still be difficult to read, and a formatter can make code
          consistent without making its logic correct.
      - type: callout
        variant: note
        title: Style is not a substitute for correctness
        body: |
          A neatly formatted program can still contain a bug. Use style tools to make code easier to inspect,
          and use tests and debugging to check what the program actually does.

  - id: naming
    title: Name things consistently
    kind: concept
    blocks:
      - type: markdown
        body: |
          Names should explain what a value or function represents. Python conventions commonly use:

          | Kind | Convention | Example |
          |---|---|---|
          | Variables and functions | `snake_case` | `total_price`, `calculate_tax()` |
          | Classes | `CapWords` / `PascalCase` | `Invoice`, `WeatherClient` |
          | Constants | `UPPER_SNAKE_CASE` | `DEFAULT_TIMEOUT` |
          | Internal implementation names | Leading underscore by convention | `_parse_header()` |

          Python does not enforce these naming styles. A constant written in uppercase can still be reassigned;
          uppercase is a signal to readers, not an immutable declaration.

          Prefer names that communicate meaning. `elapsed_seconds` is clearer than `x`, and
          `calculate_average(scores)` is clearer than `do_stuff(values)`.
      - type: code
        runnable: true
        code: |
          DEFAULT_TAX_RATE = 0.18

          def calculate_total(unit_price, quantity):
              subtotal = unit_price * quantity
              tax_amount = subtotal * DEFAULT_TAX_RATE
              return subtotal + tax_amount

          print(calculate_total(100, 2))
        expectedOutput: |
          236.0
        annotations:
          - line: 1
            text: Uppercase naming signals that this value is intended to be treated as a constant.
          - line: 3
            text: Function and parameter names use snake_case.
          - line: 4
            text: The intermediate name explains what the value represents.
      - type: item
        ref: naming-prediction

  - id: layout
    title: Indentation, whitespace and line length
    kind: concept
    blocks:
      - type: markdown
        body: |
          Python uses indentation to define blocks. PEP 8 recommends **four spaces per indentation level**.
          Do not mix tabs and spaces in one block. Use blank lines to separate logical groups, and put spaces
          around binary operators such as `=`, `+`, `==` and `<`.

          PEP 8 historically recommends a maximum line length of 79 characters for code and 72 for
          docstrings and comments. Many teams choose a different limit, but consistency matters more than
          repeatedly wrapping a line in a way that makes it harder to read.
      - type: code
        language: python
        status: illustrative
        code: |
          # Hard to scan
          def calc(a,b):
              x=a*0.18
              return a+x

          # Clearer names and spacing
          def calculate_tax(price, tax_rate):
              tax_amount = price * tax_rate
              return tax_amount
        caption: Both examples are valid Python. The second communicates the role of each value more clearly.
      - type: callout
        variant: misconception
        title: Do not optimise for the fewest characters
        body: |
          Short names can be useful for tiny loop variables, but cryptic names make larger blocks harder to
          understand. A readable name saves more time than the few keystrokes it costs.
      - type: item
        ref: style-check

  - id: imports-and-docstrings
    title: Imports, comments and docstrings
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Keep imports near the top of the file. A common convention is to group standard-library imports,
          third-party imports and your own project imports, with a blank line between groups. Avoid wildcard
          imports because they hide where names came from.

          A **comment** explains something to a person reading the code. A **docstring** is a string placed
          at the start of a module, function or class to document its purpose; tools can inspect it through
          `help()` and `.__doc__`.
      - type: code
        runnable: true
        code: |
          def calculate_discount(price, rate):
              """Return the discount amount for a price and rate."""
              return price * rate

          print(calculate_discount.__doc__)
        expectedOutput: |
          Return the discount amount for a price and rate.
        annotations:
          - line: 2
            text: The string directly under the function definition is its docstring.
          - line: 5
            text: The docstring is available as an attribute on the function.
      - type: callout
        variant: tip
        title: Explain why, not every obvious line
        body: |
          A useful comment records a reason, constraint or non-obvious decision. A comment that simply
          repeats the next line becomes stale when the code changes.
      - type: item
        ref: docstring-explain

  - id: tooling
    title: Formatters and linters
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **formatter** rewrites code layout according to a consistent set of rules. A **linter** analyses
          source code and reports patterns that may be errors, risky or inconsistent with a project's rules.
          They can be run from an editor or a terminal and should be configured consistently for a project.

          Examples include Ruff, Black and Flake8. A team should choose a toolchain and apply it consistently
          rather than arguing about spaces during every code review. Automated formatting does not decide
          whether a function has the right behaviour.
      - type: code
        language: bash
        status: illustrative
        code: |
          ruff check src
          ruff format --check src
        caption: Illustrative commands. Install and configure Ruff in the project's chosen environment before running them.
      - type: item
        ref: formatter-linter-check

  - id: summary
    title: Summary and mastery check
    kind: summary
    blocks:
      - type: markdown
        body: |
          - Use `snake_case` for variables and functions, `PascalCase` for classes and uppercase names for constants by convention.
          - Indent with four spaces and use whitespace to expose structure.
          - Keep imports organised; write comments for reasoning and docstrings for public interfaces.
          - Formatters standardise layout; linters report suspicious patterns; tests check behaviour.
          - Readability is a maintenance tool, not a guarantee of correctness.
      - type: item
        ref: mastery-style
      - type: item
        ref: mastery-style-code
      - type: item
        ref: mastery-style-explain

items:
  - id: naming-prediction
    type: predict-output
    skill: prediction
    difficulty: 1
    prompt: What does this code print?
    code: |
      DEFAULT_LIMIT = 5
      def remaining_items(items):
          return DEFAULT_LIMIT - len(items)
      print(remaining_items(["a", "b"]))
    answer: "3"
    explanation: The function subtracts the two existing items from the constant value five.
  - id: style-check
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: Which name follows the usual PEP 8 convention for a function?
    options:
      - id: a
        text: "`calculate_total`"
        correct: true
        feedback: Correct. Function names normally use lowercase words separated by underscores.
      - id: b
        text: "`CalculateTotal`"
        correct: false
        feedback: CapWords is normally used for class names.
      - id: c
        text: "`CALCULATE_TOTAL`"
        correct: false
        feedback: Uppercase names are commonly used for constants by convention.
    explanation: PEP 8 recommends lowercase words separated by underscores for function and variable names.
  - id: docstring-explain
    type: explain
    skill: transfer
    difficulty: 2
    prompt: Why is a docstring often more useful than a comment that simply repeats the next line of code?
    rubric:
      - Explains that a docstring documents the purpose or interface of a module, function or class.
      - Explains that tools and help systems can expose docstrings to users and developers.
    modelAnswer: A docstring describes the purpose and usage of a function or class and can be displayed by `help()` or read through its `__doc__` attribute. A comment that repeats the next line adds little information and may become stale.
    explanation: Docstrings are structured documentation attached to the object; comments are explanatory notes in source text.
  - id: formatter-linter-check
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: Which statement correctly distinguishes a formatter from a linter?
    options:
      - id: a
        text: A formatter rewrites layout; a linter reports suspicious patterns or rule violations.
        correct: true
        feedback: Correct. They can be used together but perform different jobs.
      - id: b
        text: A formatter runs the program; a linter stores its output.
        correct: false
        feedback: Execution and output capture are separate tasks.
      - id: c
        text: A linter proves that every possible input produces the correct result.
        correct: false
        feedback: Static analysis cannot prove general functional correctness.
    explanation: Formatters standardise presentation; linters analyse code and report potential issues.
  - id: mastery-style
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: Which naming convention is normally used for a Python class?
    options:
      - id: a
        text: "`PascalCase`"
        correct: true
        feedback: Correct. Class names normally use CapWords.
      - id: b
        text: "`snake_case`"
        correct: false
        feedback: snake_case is the usual convention for variables and functions.
      - id: c
        text: "`UPPER_SNAKE_CASE`"
        correct: false
        feedback: This style is commonly used for constants by convention.
    explanation: PEP 8 recommends CapWords for class names.
  - id: mastery-style-code
    type: code
    skill: implementation
    difficulty: 2
    prompt: Implement `calculate_subtotal(unit_price, quantity)` with clear names and return the product. The function should not print.
    explanation: A descriptive function name and local variable make the calculation easier to read, while returning the value keeps calculation separate from display.
    starterCode: |
      def calculate_subtotal(unit_price, quantity):
          pass
    solution: |
      def calculate_subtotal(unit_price, quantity):
          subtotal = unit_price * quantity
          return subtotal
    tests:
      - name: calculates product
        code: assert calculate_subtotal(12, 3) == 36
      - name: handles zero quantity
        code: assert calculate_subtotal(12, 0) == 0
      - name: does not print
        code: assert output() == ""
    hints:
      - Use a descriptive local name such as `subtotal`.
      - Return the value instead of printing it.
  - id: mastery-style-explain
    type: explain
    skill: transfer
    difficulty: 2
    prompt: Why can a team use a formatter and still need code review and tests?
    rubric:
      - Explains that formatting changes presentation, not the intended logic.
      - Explains that code review and tests examine correctness, maintainability and requirements.
    modelAnswer: A formatter makes layout consistent but does not know whether the algorithm meets the requirement. Tests check selected behaviours, and code review evaluates design, readability and risks that automated formatting cannot assess.
    explanation: Formatting, testing and review provide different kinds of quality evidence.
masteryCheck:
  passThreshold: 0.8
  items: [mastery-style, mastery-style-code, mastery-style-explain]
cheatsheet: |
  Variables/functions: snake_case. Classes: PascalCase. Constants: UPPER_SNAKE_CASE by convention.
  Four spaces per indentation level. Organise imports and write useful docstrings.
  Formatter = layout. Linter = static warnings. Tests = behaviour checks. None alone proves correctness.
