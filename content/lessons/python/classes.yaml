id: python.classes
concept: python.classes
title: Classes and Objects
subtitle: Bundling data with the behaviour that keeps it valid
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Define your own types with class. Learn what really happens when you create an object, why __init__
  initialises rather than creates, what self is, how instance and class attributes differ (and the
  shared-list bug that catches everyone), and how methods keep an object's rules true.
objectives:
  - Explain what a class is and how an instance differs from the class it was created from.
  - Describe the steps Python performs for `BankAccount("Ada", 100)`, including the role of `__init__` and `self`.
  - Predict attribute lookups involving instance attributes, class attributes and shadowing.
  - Write a class with `__init__`, methods and a `__repr__` that keeps its invariants with validation.
  - Diagnose the shared mutable class attribute bug and the common errors caused by a missing `self`.
