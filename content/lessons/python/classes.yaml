  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **A class statement is executed.** When Python reaches `class Point:` it runs the class body
          like a little program in a fresh namespace. The `def` statements in it bind function objects to
          names in that namespace. Then Python calls `type("Point", bases, namespace)` to build the class
          object and binds the name `Point` to it. Classes are objects too — instances of `type`.

          **Calling a class** runs `type.__call__`, which calls `Point.__new__(Point, ...)` to create the
          object and then `__init__(obj, ...)` to initialise it. If `__init__` returns anything other than
          `None`, `type.__call__` raises `TypeError`.

          **Methods are plain functions stored on the class.** Looking up `p.norm2` finds the function in
          the class namespace and wraps it, together with `p`, in a new *bound method* object. Calling the
          bound method calls the function with `p` inserted as the first argument. That is the entire
          mechanism behind `self`. A new bound method is created on every lookup, which is why
          `p.norm2 is p.norm2` is `False` even though the two compare equal.

          **Instance storage (CPython detail).** Instance attributes behave like a per-object dictionary,
          exposed as `obj.__dict__` (what `vars()` returns). To save memory, CPython shares one table of
          attribute *names* between instances of the same class (key-sharing dictionaries, PEP 412) and
          recent versions store the values inline in the object until you ask for `__dict__`. A class can
          declare `__slots__ = ("x", "y")` to give up the per-instance dictionary entirely — instances then
          use less memory but cannot gain new attributes.
      - type: code
        runnable: true
        code: |
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def norm2(self):
                  return self.x ** 2 + self.y ** 2

          p = Point(3, 4)
          print(type(Point), type(p) is Point)
          print(sorted(name for name in vars(Point) if not name.startswith("__")))
          method = p.norm2
          print(method(), method.__self__ is p, method.__func__ is Point.norm2)
          print(p.norm2 is p.norm2, p.norm2 == p.norm2)
        expectedOutput: |
          <class 'type'> True
          ['norm2']
          25 True True
          False True
        annotations:
          - line: 10
            text: The class itself is an object whose type is type.
          - line: 13
            text: A bound method remembers the instance (__self__) and the plain function (__func__).
          - line: 14
            text: Two lookups, two new bound-method objects that wrap the same function and instance.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **class** defines a new type; an **instance** is one object of that type, created by calling
            the class.
          - `Point(3, 4)` → create an empty object → `Point.__init__(obj, 3, 4)` → return obj.
            `__init__` **initialises**; it does not create, and it returns `None`.
          - `self` is just the first parameter: `obj.method(a)` means `Class.method(obj, a)`. It is a
            convention, not a keyword.
          - `obj.name` looks in the instance, then the class. `obj.name = value` always writes to the
            instance.
          - Class attributes are shared. **Never** put a mutable default (list, dict, set) in the class
            body for per-object data — create it in `__init__`.
          - Always define `__repr__`; add `__str__` for a user-facing form.
          - Protect **invariants**: validate in `__init__`, check before changing state, raise `ValueError`.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What is `self`?" and "What is the difference between a class attribute and an instance
          attribute?" are classic warm-ups. Show `obj.method(x)` → `Class.method(obj, x)`, explain the
          lookup order (instance, then class), and finish with the shared-list bug and its fix — that
          shows you understand mutation, not just syntax.

items:
  - id: init-role
    type: mcq
    skill: recognition
    prompt: 'When `acct = BankAccount("Ada", 100)` runs, what does `BankAccount.__init__` do?'
    explanation: >-
      Python creates the new object first, then calls __init__ with that object as self (plus your
      arguments) so it can set the starting attributes. Python itself returns the object; __init__
      returns None.
    options:
      - id: a
        text: It creates the new object and returns it.
        feedback: >-
          The object already exists when __init__ starts — it arrives as self. __init__ must return None;
          Python hands the object back to you.
      - id: b
        text: It receives the newly created object as self and sets up its starting attributes.
        correct: true
        feedback: Exactly. Create, then initialise, then return — and __init__ is only the middle step.
      - id: c
        text: It defines the class BankAccount.
        feedback: The class statement defines the class. __init__ runs again for every new instance.
      - id: d
        text: It runs once, when the class is defined, to set values shared by all accounts.
        feedback: >-
          Code directly in the class body runs once at definition time. __init__ runs each time you call
          BankAccount(...).

  - id: predict-counter-shadow
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      class Ticket:
          issued = 0

          def __init__(self):
              self.issued += 1

      a = Ticket()
      b = Ticket()
      print(a.issued, b.issued, Ticket.issued)
    answer: "1 1 0"
    explanation: >-
      `self.issued += 1` means `self.issued = self.issued + 1`. The read finds no instance attribute, so it
      uses the class attribute 0; the assignment then creates an instance attribute with the value 1. Each
      ticket gets its own `issued = 1` and the class attribute stays 0. To count on the class, write
      `Ticket.issued += 1`.
    wrongAnswers:
      - answer: "1 2 2"
        feedback: >-
          This assumes self.issued updates the shared class attribute. Assignment through self always
          creates or rebinds an INSTANCE attribute, so the class attribute is never changed.
      - answer: "2 2 2"
        feedback: >-
          A shared counter would need `Ticket.issued += 1`. With `self.issued`, each instance reads the class
          value 0 and stores its own 1.
      - answer: "1 1 2"
        feedback: >-
          The class attribute is only read, never assigned, so Ticket.issued is still 0 — the 1s live on the
          instances.

  - id: predict-str-repr
    type: predict-output
    skill: prediction
    prompt: What does this program print? (Two lines.)
    code: |
      class Temp:
          def __init__(self, celsius):
              self.celsius = celsius

          def __repr__(self):
              return f"Temp({self.celsius})"

          def __str__(self):
              return f"{self.celsius} degrees"

      t = Temp(21)
      print(t)
      print([t])
    answer: |
      21 degrees
      [Temp(21)]
    explanation: >-
      print(t) converts t with str(), which uses __str__. Printing a list converts the list with str(), but
      a list always shows its items with repr(), so __repr__ is used for t inside the brackets.
    wrongAnswers:
      - answer: |
          21 degrees
          [21 degrees]
        feedback: >-
          Containers display their items with repr(), not str(). That is why always defining __repr__
          matters — it is what you see inside lists and dicts.
      - answer: |
          Temp(21)
          [Temp(21)]
        feedback: print() uses __str__ when the class defines one. __repr__ is only the fallback.

  - id: mcq-no-arguments
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      Running this program fails with `TypeError: Account() takes no arguments`. What is the cause?

      ```python
      class Account:
          def _init_(self, owner):
              self.owner = owner

      acct = Account("Ada")
      ```
    explanation: >-
      Python only calls a method named exactly __init__ (two underscores on each side). `_init_` is an
      ordinary method nobody calls, so the class falls back to the default initialiser, which accepts no
      arguments — hence the message.
    options:
      - id: a
        text: The method is named _init_ with single underscores, so Python never calls it as the initialiser.
        correct: true
        feedback: Right. Rename it to __init__ and the call works.
      - id: b
        text: Classes cannot receive arguments when they are called.
        feedback: They can — any arguments after self in a correctly named __init__ are passed through.
      - id: c
        text: You must pass the object yourself, as Account(acct, "Ada").
        feedback: Python passes the new object as self automatically; you never pass it when calling the class.
      - id: d
        text: owner needs a default value.
        feedback: A default would make the argument optional, but the real problem is that this method is never called at all.

  - id: explain-why-class
    type: explain
    skill: explanation
    prompt: >-
      A teammate says: "Classes are just dictionaries with extra syntax — I'll keep using a dict plus some
      functions for bank accounts." Explain what a class gives you here, and be honest about what it does
      not do.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says a class bundles the data with the methods that operate on it, so the rules live in one obvious place.
      - Mentions validating in __init__ so every object starts valid, and methods that keep the invariant true.
      - Mentions that every instance gets the same attributes from __init__ and the class is a named type (isinstance, a readable __repr__).
      - Acknowledges that Python does not stop code from assigning attributes directly; it relies on convention (use the methods, _name for internal).
    modelAnswer: |
      With a dict, the rule "never overdraw" lives in a separate function that nothing connects to the
      data; any code can change the balance directly and nobody reading the dict knows the rule exists. A
      BankAccount class puts the data and the behaviour together: __init__ validates the opening balance so
      an invalid account can never be created, and deposit/withdraw check the rules before changing
      anything, so the invariant "balance >= 0" stays true. Every account is built the same way, has a real
      type name and prints readably through __repr__. It is not a lock, though: Python still allows
      account.balance = -5. The class makes the correct path obvious; conventions such as calling methods
      and naming internal attributes _balance do the rest.

  - id: rectangle
    type: code
    skill: implementation
    prompt: |
      Write a class `Rectangle`:

      - `__init__(self, width, height)` stores the attributes `width` and `height`;
      - `area()` returns width × height;
      - `perimeter()` returns 2 × (width + height);
      - `__repr__()` returns text like `Rectangle(3, 4)`.

      The last three lines of the starter must then print:

      ```text
      Rectangle(3, 4)
      12 14
      ```
    starterCode: |
      class Rectangle:
          # Write __init__, area, perimeter and __repr__ here.
          pass


      r = Rectangle(3, 4)
      print(r)
      print(r.area(), r.perimeter())
    solution: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          def area(self):
              return self.width * self.height

          def perimeter(self):
              return 2 * (self.width + self.height)

          def __repr__(self):
              return f"Rectangle({self.width}, {self.height})"


      r = Rectangle(3, 4)
      print(r)
      print(r.area(), r.perimeter())
    expectedOutput: |
      Rectangle(3, 4)
      12 14
    tests:
      - name: __init__ stores width and height on the instance
        code: |
          r2 = Rectangle(5, 2)
          assert vars(r2).get("width") == 5, "Store the width on the object with self.width = width."
          assert vars(r2).get("height") == 2, "Store the height on the object with self.height = height."
      - name: area and perimeter work for any size
        code: |
          r2 = Rectangle(5, 2)
          assert r2.area() == 10, f"Rectangle(5, 2).area() should be 10, got {r2.area()!r}. Use self.width and self.height."
          assert r2.perimeter() == 14, f"Rectangle(5, 2).perimeter() should be 14, got {r2.perimeter()!r}."
          assert Rectangle(1, 7).area() == 7, "area() must be calculated from the attributes, not typed in."
      - name: each rectangle keeps its own size
        code: |
          small = Rectangle(1, 1)
          big = Rectangle(10, 20)
          assert small.area() == 1 and big.area() == 200, "Two rectangles must not share their width and height."
      - name: __repr__ returns the expected text
        code: |
          text = repr(Rectangle(7, 1))
          assert text == "Rectangle(7, 1)", f"repr(Rectangle(7, 1)) should be 'Rectangle(7, 1)', got {text!r}. Make __repr__ return (not print) an f-string."
      - name: prints the two lines
        code: |
          assert output_lines() == ["Rectangle(3, 4)", "12 14"], f"Your program printed {output()!r}."
    hints:
      - "Start with `def __init__(self, width, height):` and store each value with `self.width = width`."
      - "Methods read the attributes through self: `return self.width * self.height`."
      - '`__repr__` must return a string: `return f"Rectangle({self.width}, {self.height})"`.'
    feedback:
      - when: { errorMessageContains: "takes no arguments" }
        message: Python cannot find your initialiser. Name it exactly __init__, with two underscores on each side.
      - when: { errorMessageContains: "positional argument" }
        message: Check that every method has self as its first parameter, and that __init__ takes width and height after it.
      - when: { outputContains: "object at 0x" }
        message: The default representation is being shown. Define __repr__ so it returns "Rectangle(width, height)".
      - when: { outputContains: "None" }
        message: A method printed instead of returning, or returned nothing. area, perimeter and __repr__ must use return.
    explanation: >-
      __init__ stores the two measurements on self, so each Rectangle has its own. area and perimeter read
      them back through self, which is why they work for any rectangle. __repr__ returns a string that looks
      like the code that creates the object.

  - id: debug-shared-playlist
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      Every playlist shows every song, no matter which playlist it was added to. Fix the class so each
      playlist keeps its own songs. The program should print:

      ```text
      Playlist('Road trip', ['Highway Song'])
      Playlist('Study', ['Quiet Piano'])
      ```
    starterCode: |
      class Playlist:
          songs = []

          def __init__(self, name):
              self.name = name

          def add(self, song):
              self.songs.append(song)

          def __repr__(self):
              return f"Playlist({self.name!r}, {self.songs})"


      road_trip = Playlist("Road trip")
      study = Playlist("Study")
      road_trip.add("Highway Song")
      study.add("Quiet Piano")
      print(road_trip)
      print(study)
    solution: |
      class Playlist:
          def __init__(self, name):
              self.name = name
              self.songs = []

          def add(self, song):
              self.songs.append(song)

          def __repr__(self):
              return f"Playlist({self.name!r}, {self.songs})"


      road_trip = Playlist("Road trip")
      study = Playlist("Study")
      road_trip.add("Highway Song")
      study.add("Quiet Piano")
      print(road_trip)
      print(study)
    expectedOutput: |
      Playlist('Road trip', ['Highway Song'])
      Playlist('Study', ['Quiet Piano'])
    tests:
      - name: prints each playlist with only its own song
        code: |
          assert output_lines() == ["Playlist('Road trip', ['Highway Song'])", "Playlist('Study', ['Quiet Piano'])"], f"Your program printed {output()!r}."
      - name: each new playlist starts with its own empty list
        code: |
          a = Playlist("a")
          b = Playlist("b")
          a.add("x")
          assert b.songs == [], f"Adding to one playlist changed another: b.songs is {b.songs!r}."
          assert "songs" in vars(a), "songs should be an instance attribute: create it in __init__ with self.songs = []."
          assert a.songs is not b.songs, "Two playlists still share the same list object."
      - name: no shared list left in the class body
        code: |
          assert not isinstance(vars(Playlist).get("songs"), list), "Delete `songs = []` from the class body; the list now belongs in __init__."
    hints:
      - Where is `songs` created — once per playlist, or once for the whole class?
      - "`self.songs.append(...)` does not assign anything, so it finds the class's single list and mutates it."
      - Create the list inside __init__ with `self.songs = []`, so every call makes a new one.
    feedback:
      - when: { outputContains: "'Highway Song', 'Quiet Piano'" }
        message: Both playlists still share one list. A list in the class body is created once and shared by every instance.
      - when: { errorType: AttributeError }
        message: The songs attribute is missing. Add `self.songs = []` inside __init__.
    explanation: >-
      The class body runs once, so `songs = []` created a single list shared by all playlists, and
      `self.songs.append` mutated it. Creating `self.songs = []` in __init__ gives every playlist its own new
      list.

  - id: stock-tracker
    type: code
    skill: design
    difficulty: 3
    prompt: |
      Write a class `Stock` that tracks how many of each product a shop has. Its invariant: **no
      quantity is ever negative**, and a refused operation changes nothing.

      - `__init__(self)` gives each Stock its own empty dictionary `self.items`.
      - `add(self, name, quantity)` raises `ValueError` if quantity is not greater than 0; otherwise adds it.
      - `remove(self, name, quantity)` raises `ValueError` if quantity is not greater than 0 **or** is more
        than is in stock; otherwise subtracts it.
      - `count(self, name)` returns the quantity in stock (0 for products never added).

      The starter's last lines should print `7 0`.
    starterCode: |
      class Stock:
          def __init__(self):
              pass

          def add(self, name, quantity):
              pass

          def remove(self, name, quantity):
              pass

          def count(self, name):
              pass


      shop = Stock()
      shop.add("pen", 10)
      shop.remove("pen", 3)
      print(shop.count("pen"), shop.count("ink"))
    solution: |
      class Stock:
          def __init__(self):
              self.items = {}

          def add(self, name, quantity):
              if quantity <= 0:
                  raise ValueError("quantity must be positive")
              self.items[name] = self.items.get(name, 0) + quantity

          def remove(self, name, quantity):
              if quantity <= 0:
                  raise ValueError("quantity must be positive")
              if quantity > self.count(name):
                  raise ValueError(f"only {self.count(name)} {name} in stock")
              self.items[name] -= quantity

          def count(self, name):
              return self.items.get(name, 0)


      shop = Stock()
      shop.add("pen", 10)
      shop.remove("pen", 3)
      print(shop.count("pen"), shop.count("ink"))
    expectedOutput: |
      7 0
    tests:
      - name: add and count
        code: |
          s = Stock()
          s.add("pen", 10)
          s.add("pen", 5)
          s.add("ink", 2)
          assert s.count("pen") == 15, f"After adding 10 and 5 pens, count('pen') should be 15, got {s.count('pen')!r}."
          assert s.count("ink") == 2, f"count('ink') should be 2, got {s.count('ink')!r}."
          assert s.count("glue") == 0, f"count() of a product never added should be 0, got {s.count('glue')!r}."
      - name: remove subtracts
        code: |
          s = Stock()
          s.add("pen", 10)
          s.remove("pen", 4)
          assert s.count("pen") == 6, f"10 - 4 should leave 6 pens, got {s.count('pen')!r}."
      - name: refuses to go below zero and changes nothing
        code: |
          s = Stock()
          s.add("pen", 2)
          try:
              s.remove("pen", 5)
          except ValueError:
              pass
          else:
              raise AssertionError("remove('pen', 5) with only 2 in stock should raise ValueError.")
          assert s.count("pen") == 2, f"A refused remove must leave the stock unchanged; count('pen') is {s.count('pen')!r}, expected 2."
          try:
              s.remove("ink", 1)
          except ValueError:
              pass
          else:
              raise AssertionError("Removing a product that was never added should raise ValueError.")
      - name: rejects zero and negative quantities
        code: |
          s = Stock()
          for call, args in [(s.add, ("pen", 0)), (s.add, ("pen", -3)), (s.remove, ("pen", 0))]:
              try:
                  call(*args)
              except ValueError:
                  continue
              raise AssertionError(f"{call.__name__}{args} should raise ValueError: quantities must be greater than 0.")
          assert s.count("pen") == 0, "A refused add must not change the stock."
      - name: each Stock has its own items
        code: |
          one = Stock()
          two = Stock()
          one.add("pen", 3)
          assert two.count("pen") == 0, "Two Stock objects share data. Create self.items = {} inside __init__."
      - name: prints 7 0
        code: |
          assert output().strip() == "7 0", f"Your program printed {output()!r}."
    hints:
      - "In `__init__`, create the dictionary on the object: `self.items = {}`."
      - "`self.items.get(name, 0)` gives the current quantity, or 0 if the product is missing."
      - "In `remove`, check both rules and `raise ValueError(...)` BEFORE subtracting, so a refused call changes nothing."
    feedback:
      - when: { outputEquals: "None None\n" }
        message: count() must return the quantity. A method that never reaches a return statement returns None.
      - when: { errorType: KeyError }
        message: A product that was never added has no key yet. Use self.items.get(name, 0) instead of self.items[name].
      - when: { errorType: AttributeError }
        message: An attribute is missing — make sure __init__ creates self.items = {}.
    explanation: >-
      The dictionary is created in __init__, so each Stock owns its data. Both mutating methods validate
      first and only then change self.items, which keeps the invariant "no negative quantities" true even
      when a call is refused. count() uses .get(name, 0) so unknown products read as 0.

  - id: parsons-counter
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines into a class whose counter starts at 0 and goes up by one each time `increment()`
      is called. The program should print `2`. Two lines are distractors.
    solution: |
      class Counter:
          def __init__(self):
              self.count = 0
          def increment(self):
              self.count += 1
      c = Counter()
      c.increment()
      c.increment()
      print(c.count)
    distractors:
      - "    def increment():"
      - "        count += 1"
    expectedOutput: |
      2
    explanation: >-
      __init__ creates the count attribute on each new object; increment needs self to know which object
      to update, and must write self.count rather than a bare local name count.

  # ----- Mastery check (new items, not used in the sections) -----
  - id: m-predict-mutate-vs-assign
    type: predict-output
    skill: prediction
    difficulty: 3
    prompt: What does this program print?
    code: |
      class Team:
          members = []

          def __init__(self, name):
              self.name = name

      red = Team("red")
      blue = Team("blue")
      red.members.append("Ana")
      blue.members = ["Ben"]
      print(red.members, blue.members, Team.members)
    answer: "['Ana'] ['Ben'] ['Ana']"
    explanation: >-
      `red.members.append("Ana")` reads members (found on the class) and mutates the shared class list.
      `blue.members = ["Ben"]` is an assignment, so it creates an instance attribute on blue only. red still
      sees the class list, which now holds "Ana".
    wrongAnswers:
      - answer: "['Ana'] ['Ben'] []"
        feedback: >-
          append does not create an instance attribute — it mutates the object it finds. red has no members
          of its own, so it mutated the class's list.
      - answer: "['Ben'] ['Ben'] ['Ben']"
        feedback: >-
          Assigning through an instance never changes the class attribute; blue.members = [...] creates an
          attribute on blue only.
      - answer: "['Ana', 'Ben'] ['Ana', 'Ben'] ['Ana', 'Ben']"
        feedback: blue.members = ["Ben"] rebinds a name on blue to a brand-new list; it does not append to the shared one.

  - id: m-mcq-where-validate
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      A `Booking` class stores `start_hour` and `end_hour`, and the end must be after the start. A method
      `reschedule(start, end)` can change both. Where should the check go?
    explanation: >-
      The invariant must hold for every object at all times, so it belongs where state is set: in __init__
      (no invalid object can be created) and in every method that changes the hours, raising ValueError
      before anything is changed.
    options:
      - id: a
        text: In __init__ and in reschedule, raising ValueError before any attribute is changed.
        correct: true
        feedback: Yes — guard every place that sets the state, and check before you change it.
      - id: b
        text: In the function that prints bookings, which can skip invalid ones.
        feedback: By then the invalid object already exists and may have been saved or used elsewhere. Fail at the source.
      - id: c
        text: In a separate validate(booking) function that callers should remember to call.
        feedback: Rules that callers must remember will be forgotten. The class should enforce its own invariant.
      - id: d
        text: Only in __init__ — once an object is valid it stays valid.
        feedback: reschedule can break the rule later. Every method that changes state must preserve the invariant.

  - id: m-tf-self-keyword
    type: true-false
    skill: recognition
    prompt: "True or false: `self` is a Python keyword, so a method's first parameter must be named self."
    answer: false
    explanation: >-
      self is an ordinary parameter name. Python passes the instance as the first argument whatever the
      parameter is called. Using self is a very strong convention (PEP 8), so always follow it — but it is
      not enforced by the language.

  - id: m-code-temperature
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a class `Temperature`:

      - `__init__(self, celsius)` raises `ValueError` if celsius is below -273.15 (absolute zero), otherwise
        stores it as the attribute `celsius`;
      - `to_fahrenheit()` returns celsius × 9 / 5 + 32;
      - `__repr__()` returns text like `Temperature(25)`.

      The last two lines should print `Temperature(25) 77.0`.
    starterCode: |
      class Temperature:
          pass


      t = Temperature(25)
      print(t, t.to_fahrenheit())
    solution: |
      class Temperature:
          def __init__(self, celsius):
              if celsius < -273.15:
                  raise ValueError("below absolute zero")
              self.celsius = celsius

          def to_fahrenheit(self):
              return self.celsius * 9 / 5 + 32

          def __repr__(self):
              return f"Temperature({self.celsius})"


      t = Temperature(25)
      print(t, t.to_fahrenheit())
    expectedOutput: |
      Temperature(25) 77.0
    tests:
      - name: converts any temperature
        code: |
          assert Temperature(100).to_fahrenheit() == 212.0, "Temperature(100).to_fahrenheit() should be 212.0."
          assert Temperature(-40).to_fahrenheit() == -40.0, "Temperature(-40).to_fahrenheit() should be -40.0."
      - name: stores celsius on the instance
        code: |
          assert vars(Temperature(12)).get("celsius") == 12, "Store the value with self.celsius = celsius."
      - name: rejects temperatures below absolute zero
        code: |
          try:
              Temperature(-300)
          except ValueError:
              pass
          else:
              raise AssertionError("Temperature(-300) should raise ValueError.")
          assert Temperature(-273.15).celsius == -273.15, "-273.15 itself is allowed; only values below it are invalid."
      - name: __repr__ returns the expected text
        code: |
          assert repr(Temperature(3.5)) == "Temperature(3.5)", f"repr(Temperature(3.5)) should be 'Temperature(3.5)', got {repr(Temperature(3.5))!r}."
      - name: prints the example
        code: |
          assert output().strip() == "Temperature(25) 77.0", f"Your program printed {output()!r}."
    hints:
      - Check the value at the top of __init__ and raise ValueError before storing anything.
      - "to_fahrenheit reads self.celsius: `return self.celsius * 9 / 5 + 32`."
      - '`__repr__` returns `f"Temperature({self.celsius})"`.'
    feedback:
      - when: { errorMessageContains: "takes no arguments" }
        message: Define __init__(self, celsius) — with two underscores on each side — so Temperature(25) is accepted.
      - when: { outputContains: "object at 0x" }
        message: Define __repr__ to return "Temperature(...)" instead of the default representation.
    explanation: >-
      Validation happens first in __init__, so an impossible temperature is never stored. The conversion
      reads the attribute through self, and __repr__ returns a string describing the object.

  - id: m-debug-forgot-self
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This timer should print `45 seconds`, but it crashes. There are **two** bugs, both about `self`.
      Fix them.
    starterCode: |
      class Timer:
          def __init__(self, seconds):
              seconds = seconds

          def add(self, extra):
              self.seconds += extra

          def describe():
              return f"{self.seconds} seconds"


      t = Timer(30)
      t.add(15)
      print(t.describe())
    solution: |
      class Timer:
          def __init__(self, seconds):
              self.seconds = seconds

          def add(self, extra):
              self.seconds += extra

          def describe(self):
              return f"{self.seconds} seconds"


      t = Timer(30)
      t.add(15)
      print(t.describe())
    expectedOutput: |
      45 seconds
    tests:
      - name: prints 45 seconds
        code: |
          assert output().strip() == "45 seconds", f"Your program printed {output()!r}."
      - name: stores seconds on the object
        code: |
          assert vars(Timer(5)).get("seconds") == 5, "__init__ must store the value on the object: self.seconds = seconds."
      - name: describe works for any timer
        code: |
          assert Timer(10).describe() == "10 seconds", f"Timer(10).describe() should be '10 seconds', got {Timer(10).describe()!r}."
    hints:
      - Read the first error. Which attribute does Python say the Timer object does not have?
      - "`seconds = seconds` only rebinds the local parameter. Attributes are created with `self.`."
      - "After that, look at describe: Python passes the instance to every method, so it needs a parameter for it."
    feedback:
      - when: { errorType: AttributeError }
        message: "`seconds = seconds` rebinds the local parameter and is thrown away. Store it on the object: self.seconds = seconds."
      - when: { errorMessageContains: "takes 0 positional arguments" }
        message: describe() has no self parameter, but Python passes the instance automatically. Write def describe(self).
    explanation: >-
      In __init__, `seconds = seconds` assigned the parameter to itself, so the object never got a seconds
      attribute and add() failed. describe() lacked the self parameter that every method receives. With
      `self.seconds = seconds` and `def describe(self)`, the program prints 45 seconds.

