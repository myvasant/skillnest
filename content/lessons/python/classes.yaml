cheatsheet: |
  ```python
  class BankAccount:                       # CapWords name
      fee = 2                              # class attribute: shared by all instances
      def __init__(self, owner, balance=0):
          if balance < 0:                  # validate: protect the invariant
              raise ValueError("negative balance")
          self.owner = owner               # instance attributes: one per object
          self.balance = balance
          self.history = []                # mutable state ALWAYS in __init__
      def deposit(self, amount):           # method: self = the instance
          self.balance += amount
      def __repr__(self):                  # for developers; also used inside lists
          return f"BankAccount({self.owner!r}, {self.balance})"

  acct = BankAccount("Ada", 100)           # create -> __init__(acct, "Ada", 100) -> acct
  acct.deposit(5)                          # same as BankAccount.deposit(acct, 5)
  vars(acct)                               # the instance's own attributes
  ```
  - Lookup: instance first, then class · assignment writes to the instance
  - No `self` parameter → "takes 0 positional arguments but 1 was given"
  - Misspelled `__init__` → "Account() takes no arguments"
