sections:
  - id: why
    title: Why classes exist
    kind: why
    blocks:
      - type: markdown
        body: |
          You already know how to store related values together in a dictionary and how to write
          functions that work on them. Here is a bank account built that way. The rule "you cannot
          withdraw more than you have" lives in a function:
      - type: code
        runnable: true
        code: |
          account = {"owner": "Ada", "balance": 100}

          def withdraw(account, amount):
              if amount > account["balance"]:
                  raise ValueError("insufficient funds")
              account["balance"] -= amount

          withdraw(account, 30)
          account["balance"] -= 500      # nothing connects this line to the rule
          print(account)
        expectedOutput: |
          {'owner': 'Ada', 'balance': -430}
        caption: The rule exists, but nothing ties it to the data. Any code can skip it.
      - type: markdown
        body: |
          The data (`account`) and the behaviour that keeps it valid (`withdraw`) are separate things
          that merely happen to be used together. Someone reading the program — or writing new code
          months later — has no reason to know that `withdraw` exists, or that a dictionary with these
          keys is meant to be an "account" at all.

          A [class](glossary:class) fixes this by **bundling the data with the behaviour that maintains
          its rules**, under one name:
      - type: code
        runnable: true
        code: |
          class BankAccount:
              def __init__(self, owner, balance=0):
                  self.owner = owner
                  self.balance = balance

              def withdraw(self, amount):
                  if amount > self.balance:
                      raise ValueError("insufficient funds")
                  self.balance -= amount

              def __repr__(self):
                  return f"BankAccount({self.owner!r}, {self.balance})"

          account = BankAccount("Ada", 100)
          account.withdraw(30)
          print(account)
        expectedOutput: |
          BankAccount('Ada', 70)
        caption: The account and its rules travel together. Every account is built the same way and knows how to withdraw.
        annotations:
          - line: 1
            text: "`class` defines a new type called BankAccount."
          - line: 2
            text: "`__init__` sets up each new account's starting data."
          - line: 6
            text: A method — a function that belongs to the class and works on one account (`self`).
          - line: 14
            text: Calling the class creates a new account object.
      - type: callout
        variant: note
        title: A class is not a lock
        body: |
          Python does not stop other code from writing `account.balance -= 500` directly — the language
          trusts programmers. What a class gives you is a **single, obvious home for the rules**: the
          correct way to change an account is right there as `account.withdraw(...)`, every account is
          created through the same validated `__init__`, and the object has a real type name
          (`BankAccount`) instead of being "some dictionary".

  - id: define
    title: Classes and instances
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **class** is a blueprint for a new [type](glossary:type) of object. An
          [instance](glossary:instance) is one object made from that blueprint. `int` is a class and `42`
          is an instance of it; in the same way, `BankAccount` is a class and each account you create is an
          instance.

          - You define a class with the `class` statement. Class names use `CapWords` by convention
            (`BankAccount`, not `bank_account`).
          - You create an instance by **calling** the class like a function: `Point()`.
          - Each instance has its own [attributes](glossary:attribute) — names attached to that object,
            reached with a dot: `p.x`.

          The smallest possible class has an empty body (`pass`). Even that is enough to see that each
          instance is a separate object with its own attributes:
      - type: code
        runnable: true
        code: |
          class Point:
              pass

          p = Point()
          q = Point()
          p.x = 3
          p.y = 4
          print(p.x + p.y)
          print(type(p).__name__, isinstance(p, Point))
          print(p is q)
        expectedOutput: |
          7
          Point True
          False
        annotations:
          - line: 4
            text: Calling the class creates a brand-new instance.
          - line: 6
            text: Assigning `p.x` attaches an attribute to the object p refers to — q is unaffected.
          - line: 10
            text: Two calls, two different objects.
      - type: markdown
        body: |
          Attaching attributes from outside like this works, but it is not how real classes are written:
          nothing guarantees every Point has an `x`. The next section shows the normal way — giving every
          new instance its attributes as soon as it is created.

  - id: init
    title: "__init__ initialises a new object"
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [method](glossary:method) is a function defined inside a class. One method has a special name,
          [`__init__`](glossary:init-method) (two underscores on each side, often read "dunder init"). When
          you call `Point(3, 4)`, Python does **three things, in this order**:

          1. **Create** a new, empty Point object.
          2. **Initialise** it by calling `Point.__init__(new_object, 3, 4)` — the new object arrives as the
             first parameter, conventionally named `self`, followed by your arguments.
          3. **Return** the new object, which you usually bind to a name.

          So `__init__` does **not** create the object — the object already exists when `__init__` starts.
          Its job is to give that object its starting attributes. It must not return anything (it returns
          `None`).
      - type: code
        runnable: true
        code: |
          class Point:
              def __init__(self, x, y):
                  print("__init__ received an object that already exists:", type(self).__name__)
                  self.x = x
                  self.y = y

          p = Point(3, 4)
          print(p.x, p.y)
        expectedOutput: |
          __init__ received an object that already exists: Point
          3 4
        annotations:
          - line: 2
            text: You pass two arguments (3, 4); Python passes the new object as `self` in front of them.
          - line: 4
            text: "`self.x = x` attaches an attribute named x to the object. The parameter x is just a local name."
          - line: 7
            text: "Point(3, 4) → create, then Point.__init__(new_object, 3, 4), then hand back the object."
      - type: callout
        variant: misconception
        title: '"__init__ is the constructor"'
        body: |
          People often call `__init__` "the constructor", and in casual speech that is fine. Strictly, the
          object is constructed by a different special method, `__new__`, before `__init__` runs; `__init__`
          only *initialises* it. You will almost never need `__new__` — but remembering that `self` already
          exists inside `__init__` explains why `__init__` cannot return a different object.
      - type: item
        ref: init-role

  - id: methods
    title: Methods and self
    kind: concept
    blocks:
      - type: markdown
        body: |
          Any function defined in a class body is a method. When you call a method **on an instance**,
          Python passes that instance as the first argument automatically:

          ```text
          account.withdraw(30)     is translated to     BankAccount.withdraw(account, 30)
          ```

          That first parameter is how the method knows *which* object to work on. It is called
          [`self`](glossary:self) by universal convention, but `self` is **not a keyword** — it is an
          ordinary parameter name. This example names it `this` to prove the point (please don't do this in
          real code; every Python programmer expects `self`):
      - type: code
        runnable: true
        code: |
          class Greeter:
              def __init__(this, name):
                  this.name = name

              def greet(this, greeting="Hello"):
                  return greeting + ", " + this.name

          g = Greeter("Ada")
          print(g.greet())
          print(Greeter.greet(g, "Hi"))
        expectedOutput: |
          Hello, Ada
          Hi, Ada
        annotations:
          - line: 9
            text: "g.greet() → Greeter.greet(g): g becomes `this`, greeting uses its default."
          - line: 10
            text: The same call written out by hand. Both forms run the same function.
      - type: markdown
        body: |
          Inside a method, **every attribute access goes through `self`**. A bare name like `balance` is a
          local or global variable, exactly as in any other function; `self.balance` is the attribute of
          the object. Methods can also call other methods the same way:
      - type: code
        runnable: true
        code: |
          class Order:
              def __init__(self, price, quantity):
                  self.price = price
                  self.quantity = quantity

              def subtotal(self):
                  return self.price * self.quantity

              def total_with_tax(self, rate):
                  return self.subtotal() * (1 + rate)

          order = Order(200, 3)
          print(order.subtotal(), order.total_with_tax(0.5))
        expectedOutput: |
          600 900.0
        annotations:
          - line: 10
            text: A method calling another method on the same object, through self.

  - id: mental-model
    title: "Mental model: every object has its own namespace"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          From the variables lesson you know that a [namespace](glossary:namespace) maps names to objects.
          A class adds two more namespaces to that picture:

          - **Each instance has its own namespace** for its attributes. `self.count = 0` binds the name
            `count` in *that object's* namespace — like a small private dictionary of names → objects.
          - **The class has a namespace** too. That is where the methods live: they are defined once and
            shared by every instance.

          When you write `obj.name`, Python looks in the **instance first, then the class**. Step through
          this program and watch each Counter object get its own `count`:
      - type: visualization
        component: python-tracer
        title: Two instances, two separate namespaces
        caption: >-
          Watch the objects on the right. Each Counter instance lists its own attributes. When
          increment runs, self refers to whichever object the method was called on.
        props:
          code: |
            class Counter:
                def __init__(self, start):
                    self.count = start

                def increment(self):
                    self.count += 1

                def __repr__(self):
                    return f"Counter({self.count})"

            a = Counter(0)
            b = Counter(10)
            a.increment()
            a.increment()
            b.increment()
            print(a, b)
      - type: markdown
        body: |
          You can look at an instance's namespace directly with `vars(obj)`, which returns it as a
          dictionary. Notice that the method `increment` is **not** in the instance's namespace — it is
          found on the class:
      - type: code
        runnable: true
        code: |
          class Counter:
              def __init__(self, start):
                  self.count = start

              def increment(self):
                  self.count += 1

          a = Counter(0)
          b = Counter(10)
          a.increment()
          print(vars(a), vars(b))
          print("increment" in vars(a), "increment" in vars(Counter))
        expectedOutput: |
          {'count': 1} {'count': 10}
          False True
      - type: callout
        variant: note
        title: How accurate is this model?
        body: |
          "Instance namespace first, then the class" is the rule you will use every day, and it stays true.
          Two refinements come later: with [inheritance](concept:python.inheritance) the search continues
          into parent classes, and some special attributes (properties and other *descriptors*) take
          priority over the instance. CPython also stores instance attributes more compactly than a plain
          dictionary — but `vars()` still shows them as one.

  - id: class-attributes
    title: Instance attributes vs class attributes
    kind: concept
    blocks:
      - type: markdown
        body: |
          An assignment inside a method, like `self.owner = owner`, creates an
          [instance attribute](glossary:instance-attribute): one per object. An assignment directly in the
          class body creates a [class attribute](glossary:class-attribute): **one object, shared by every
          instance**, because it lives in the class's namespace.
      - type: code
        runnable: true
        code: |
          class Account:
              bank = "Groundwork Bank"       # class attribute: shared

              def __init__(self, owner):
                  self.owner = owner          # instance attribute: one per object

          a = Account("Ada")
          b = Account("Grace")
          print(a.bank, "|", b.bank)
          Account.bank = "GW Bank"
          print(a.bank, "|", b.bank)
          a.bank = "Ada's Bank"
          print(a.bank, "|", b.bank, "|", Account.bank)
          print(vars(a))
        expectedOutput: |
          Groundwork Bank | Groundwork Bank
          GW Bank | GW Bank
          Ada's Bank | GW Bank | GW Bank
          {'owner': 'Ada', 'bank': "Ada's Bank"}
        annotations:
          - line: 9
            text: Neither instance has its own `bank`, so both lookups fall through to the class.
          - line: 10
            text: Rebinding the class attribute is seen by every instance that does not shadow it.
          - line: 12
            text: "Assigning through an instance creates a NEW instance attribute on a only — it shadows the class attribute."
      - type: markdown
        body: |
          The key rule: **reading** `obj.name` searches the instance, then the class. **Assigning**
          `obj.name = value` always writes to the instance's own namespace. Use that rule to predict this
          program:
      - type: item
        ref: predict-counter-shadow
      - type: markdown
        body: |
          ### The shared mutable class attribute bug

          Class attributes are fine for values that are genuinely shared and never mutated, such as
          constants. They become a trap when the shared value is **mutable**, like a list:
      - type: code
        runnable: true
        code: |
          class Dog:
              tricks = []                     # BUG: one list for every Dog

              def __init__(self, name):
                  self.name = name

              def add_trick(self, trick):
                  self.tricks.append(trick)

          rex = Dog("Rex")
          fido = Dog("Fido")
          rex.add_trick("roll over")
          print(fido.tricks)
          print(rex.tricks is fido.tricks, vars(rex))
        expectedOutput: |
          ['roll over']
          True {'name': 'Rex'}
        caption: Fido learned Rex's trick. vars(rex) shows that tricks is not even on the instance.
      - type: markdown
        body: |
          `self.tricks.append(...)` is **not an assignment**. Python looks up `self.tricks`, finds no
          instance attribute, falls through to the class, and mutates that single shared list. This is the
          same trap as the [mutable default argument](concept:python.parameters): one mutable object,
          created once, reused by everyone.

          **The fix:** create mutable state in `__init__`, so each instance gets its own new object. Step
          through the corrected version and look for two separate list objects:
      - type: visualization
        component: python-tracer
        title: Each instance gets its own list
        caption: The list is created inside __init__, so every call makes a new one. Rex's and Fido's tricks point at different lists.
        props:
          code: |
            class Dog:
                def __init__(self, name):
                    self.name = name
                    self.tricks = []

                def add_trick(self, trick):
                    self.tricks.append(trick)

                def __repr__(self):
                    return f"Dog({self.name!r}, {self.tricks})"

            rex = Dog("Rex")
            fido = Dog("Fido")
            rex.add_trick("roll over")
            print(rex, fido)

  - id: repr
    title: "Readable objects: __repr__ and __str__"
    kind: concept
    blocks:
      - type: markdown
        body: |
          If a class does not say how to display itself, Python falls back to a default that shows the
          class name and the object's **memory address** — which changes every time the program runs and
          tells a human nothing useful. We check only the start of it here, because the address part is
          different on every run:
      - type: code
        runnable: true
        code: |
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

          p = Point(3, 4)
          text = repr(p)
          print(text.startswith("<__main__.Point object at 0x"))
        expectedOutput: |
          True
        caption: The default looks like <__main__.Point object at 0x7f3a2c1b9d30>, with a different number each run.
      - type: markdown
        body: |
          Two special methods control how an object is shown as text:

          | Method | Audience | Used by | Convention |
          |---|---|---|---|
          | [`__repr__`](glossary:repr-method) | developers (debugging, logs) | `repr(obj)`, the REPL, items inside lists/dicts, `f"{obj!r}"` | Unambiguous; ideally looks like the code that would recreate the object |
          | `__str__` | end users | `print(obj)`, `str(obj)`, `f"{obj}"` | Friendly; falls back to `__repr__` if you don't define it |

          Both must **return** a string (not print it). **Always define `__repr__`** for your own classes —
          it makes every debugging print, error message and test failure readable. Add `__str__` only when
          users need a different, friendlier form.
      - type: code
        runnable: true
        code: |
          class Point:
              def __init__(self, x, y):
                  self.x = x
                  self.y = y

              def __repr__(self):
                  return f"Point({self.x!r}, {self.y!r})"

              def __str__(self):
                  return f"({self.x}, {self.y})"

          p = Point(3, 4)
          print(p)
          print(repr(p))
          print([p, Point(0, 0)])
          print(f"{p} and {p!r}")
        expectedOutput: |
          (3, 4)
          Point(3, 4)
          [Point(3, 4), Point(0, 0)]
          (3, 4) and Point(3, 4)
        annotations:
          - line: 7
            text: "`!r` inserts repr(value), so string attributes would appear with quotes."
          - line: 13
            text: print uses __str__.
          - line: 15
            text: A list shows its items with repr, even when you print the list.
      - type: item
        ref: predict-str-repr

  - id: invariants
    title: Invariants and validation
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          An [invariant](glossary:invariant) is a rule that must be true for **every** valid object of a
          class, at every moment between method calls: "a balance is never negative", "a rectangle's sides
          are positive", "an end time is after its start time". Classes exist largely to protect
          invariants. The recipe has three parts:

          1. **Validate in `__init__`**, so an invalid object can never be created. Raise an exception —
             usually `ValueError` — instead of storing bad data. Failing early, at the line that caused
             the problem, makes bugs far easier to find than discovering a bad value much later.
          2. **Every method that changes state preserves the invariant.** Check *before* you change
             anything, so a refused operation leaves the object exactly as it was.
          3. **Change state through methods**, not by assigning attributes from outside. A leading
             underscore (`self._balance`) is the convention for "internal — please use the methods".
      - type: code
        runnable: true
        code: |
          class BankAccount:
              def __init__(self, owner, balance=0):
                  if balance < 0:
                      raise ValueError("opening balance cannot be negative")
                  self.owner = owner
                  self.balance = balance

              def deposit(self, amount):
                  if amount <= 0:
                      raise ValueError("deposit must be positive")
                  self.balance += amount

              def withdraw(self, amount):
                  if amount <= 0:
                      raise ValueError("withdrawal must be positive")
                  if amount > self.balance:
                      raise ValueError("insufficient funds")
                  self.balance -= amount

              def __repr__(self):
                  return f"BankAccount({self.owner!r}, {self.balance})"

          acct = BankAccount("Ada", 50)
          acct.deposit(25)
          try:
              acct.withdraw(500)
          except ValueError as error:
              print("Refused:", error)
          print(acct)

          try:
              BankAccount("Bob", -10)
          except ValueError as error:
              print("Refused:", error)
        expectedOutput: |
          Refused: insufficient funds
          BankAccount('Ada', 75)
          Refused: opening balance cannot be negative
        annotations:
          - line: 3
            text: The invariant is checked before any attribute is stored.
          - line: 16
            text: Check first, change second — a refused withdrawal leaves the balance untouched.
          - line: 29
            text: Still 75 after the refused withdrawal.
      - type: callout
        variant: production
        title: Why fail fast?
        body: |
          A negative balance stored silently might be noticed days later, in a report, far from the code
          that caused it. Raising `ValueError` in `__init__` or the method points at the exact call that
          broke the rule. Production code adds the same checks to any data arriving from users, files or
          networks — never trust input just because it reached your class.
      - type: item
        ref: explain-why-class

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: Dog.bark() takes 0 positional arguments but 1 was given` | The method has no `self` parameter, but Python always passes the instance | Add `self` as the first parameter: `def bark(self):` |
          | `NameError: name 'balance' is not defined` inside a method | You wrote `balance` instead of `self.balance` | Attributes are always reached through `self.` |
          | `TypeError: Account() takes no arguments` | `__init__` is misspelled (`__int__`, `_init_`, `__init`), so Python never calls it | Spell it with two underscores on each side: `__init__` |
          | `TypeError: Account.__init__() missing 1 required positional argument: 'owner'` | The call passes fewer arguments than `__init__` needs (not counting `self`) | Pass every argument, or give the parameter a default |
          | `AttributeError: 'Account' object has no attribute 'balance'` | The attribute was never set — often `balance = balance` instead of `self.balance = balance` in `__init__` | Set every attribute on `self` in `__init__` |
          | Data "leaks" between instances | A mutable class attribute (`items = []` in the class body) | Create it in `__init__`: `self.items = []` |
          | `<__main__.Point object at 0x...>` printed | No `__repr__` (or `__str__`) defined | Define `__repr__` returning a string |
          | `TypeError: __init__() should return None, not 'int'` | `__init__` has `return something` | `__init__` only sets attributes; Python returns the object for you |
      - type: code
        runnable: true
        code: |
          class Dog:
              def bark():
                  return "Woof"

          rex = Dog()
          print(rex.bark())
        expectError: TypeError
        caption: "rex.bark() becomes Dog.bark(rex) — one argument for a function that accepts none."
      - type: code
        runnable: true
        code: |
          class Account:
              def __init__(self, balance):
                  self.balance = balance

              def report(self):
                  return f"Balance: {balance}"

          print(Account(10).report())
        expectError: NameError
        caption: Inside a method, a bare name is a local or global variable. The attribute is self.balance.
      - type: item
        ref: mcq-no-arguments

  - id: practice
