id: python.exceptions
concept: python.exceptions
title: Exceptions and Tracebacks
subtitle: Read what went wrong, handle what you can, let the rest be loud
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  When something goes wrong while a program runs, Python raises an exception. Learn to read a
  traceback across several function calls, handle specific exceptions with try/except/else/finally,
  re-prompt users until their input is valid, choose between EAFP and LBYL, and avoid the bare except
  that hides bugs.
objectives:
  - Read a multi-frame traceback from the bottom up and locate both where an error was detected and where the bad data came from.
  - Name the common built-in exceptions and the situations that raise them.
  - Write try/except blocks that catch specific exceptions, and use as, else and finally correctly.
  - Write an input loop that re-prompts until the user enters a valid value.
  - Explain how an exception propagates up the call stack and decide where it should be handled.
  - Explain why bare except is harmful, and compare the EAFP and LBYL styles.
