  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - An **exception** is an object describing a runtime error; unhandled, it stops the program with a
            **traceback**.
          - Read tracebacks **bottom-up**: last line = what; the frame above = where detected; frames above
            that = how you got there. The cause is often higher up than the detection point.
          - `try`/`except SpecificError` handles what you can deal with; `as e` gives the object; the first
            matching clause wins; keep the `try` block small.
          - `else` runs only on success; `finally` runs always - even after `return`.
          - Exceptions **propagate** up the call stack until handled; handle them where you can respond
            meaningfully (often near the user).
          - Never use bare `except:` - it hides bugs and catches Ctrl+C.
          - **EAFP** (try it, handle failure) is idiomatic; **LBYL** (check first) suits simple, cheap checks.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          Be ready to explain the difference between `else` and `finally`, why bare `except:` is
          dangerous (it hides bugs and catches `KeyboardInterrupt`/`SystemExit`), and EAFP vs LBYL with an
          example such as parsing numbers or a file disappearing between check and use. Senior candidates
          are also asked *where* exceptions should be handled - at the boundary where a decision can be made.

items:
  - id: mcq-read-traceback
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      A checkout program crashes with this traceback. Which reading is correct?

      ```text
      Traceback (most recent call last):
        File "shop.py", line 13, in <module>
          print(checkout(cart))
                ~~~~~~~~^^^^^^
        File "shop.py", line 9, in checkout
          total += price_of(item)
                   ~~~~~~~~^^^^^^
        File "shop.py", line 4, in price_of
          return PRICES[item]
                 ~~~~~~^^^^^^
      KeyError: 'mango'
      ```
    explanation: >-
      The last line says what happened: a KeyError for the key 'mango'. The frame just above it is where it
      was detected - line 4 in price_of, looking up PRICES[item]. The frames above show the route:
      checkout called price_of on line 9, and the main program called checkout on line 13. The real fix is
      probably in the data (a cart item with no price) or in how missing prices are handled.
    options:
      - id: a
        text: "Line 4 in price_of failed to find the key 'mango' in PRICES; it was called from checkout (line 9), which was called from line 13."
        correct: true
        feedback: Correct - bottom line first, then the innermost frame, then walk up the call chain.
      - id: b
        text: The error is on line 13, because it is listed first.
        feedback: The first frame is the outermost call. Python lists frames oldest first ("most recent call last"); the error was raised in the last frame.
      - id: c
        text: There is a typo in a variable name called mango.
        feedback: A misspelled name would be a NameError. KeyError means a dictionary lookup used a key that is not in the dict.
      - id: d
        text: checkout must contain the bug because it is in the middle of the traceback.
        feedback: Being in the middle only means checkout was on the call path. The traceback shows where the error was detected, not necessarily which function is wrong.

  - id: predict-try-flow
    type: predict-output
    skill: prediction
    prompt: What does this program print? (Four lines.)
    code: |
      try:
          print("A")
          x = int("7")
          print("B")
          y = 10 / (x - 7)
          print("C")
      except ZeroDivisionError:
          print("D")
      print("E")
    answer: |
      A
      B
      D
      E
    explanation: >-
      A and B print; int("7") succeeds. 10 / (7 - 7) raises ZeroDivisionError, so the rest of the try block
      (printing C) is skipped and the matching handler prints D. Execution then continues after the try
      statement and prints E.
    wrongAnswers:
      - answer: |
          A
          B
          C
          D
          E
        feedback: When an exception is raised, the rest of the try block is skipped. C is never printed.
      - answer: |
          A
          D
          E
        feedback: int("7") is a valid conversion, so no exception happens there and B is printed.
      - answer: |
          A
          B
          D
        feedback: Once the exception is handled, the program continues normally after the try statement, so E is printed.

  - id: predict-finally
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print? (Four lines.)
    code: |
      def check(value):
          try:
              number = int(value)
          except ValueError:
              return "bad"
          else:
              return "good"
          finally:
              print("checked", value)

      print(check("5"))
      print(check("x"))
    answer: |
      checked 5
      good
      checked x
      bad
    explanation: >-
      For "5", the else clause returns "good" - but the finally clause runs first, printing "checked 5",
      before the call actually completes and the caller prints "good". For "x", the except clause returns
      "bad", and again finally prints before the caller prints the result.
    wrongAnswers:
      - answer: |
          good
          checked 5
          bad
          checked x
        feedback: >-
          finally runs before the function finishes returning, so its print happens before the caller
          can print the returned value.
      - answer: |
          checked 5
          good
          bad
        feedback: finally runs on every path, including when the except clause returns.

  - id: explain-bare-except
    type: explain
    skill: explanation
    prompt: >-
      A teammate wraps a whole function in `try:` ... `except: pass` "so it never crashes". Explain why
      this is harmful and what they should write instead.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says that a bare except catches every exception, including bugs such as NameError and TypeError, so they turn into silent wrong behaviour.
      - Mentions that it also catches KeyboardInterrupt and SystemExit, so the program may not stop when asked.
      - Says the handler (pass) cannot respond correctly to problems it did not anticipate, and that the information in the traceback is lost.
      - Recommends catching only the specific exceptions the code can handle, with a small try block, and letting others propagate.
    modelAnswer: |
      `except: pass` catches everything - not only the error they expected, but also typos (NameError),
      wrong types (TypeError) and any other bug - and then throws the information away. The function
      silently does the wrong thing and the traceback that would have pointed straight at the bug is lost.
      A bare except even catches KeyboardInterrupt and SystemExit, so Ctrl+C may not stop the program.
      Instead, keep the try block around the line that can fail and catch the specific exception you
      expect and can handle, e.g. `except ValueError:` with a useful response. Unexpected exceptions should
      propagate so they are seen and fixed.

  - id: mcq-eafp
    type: mcq
    skill: design
    difficulty: 2
    prompt: >-
      A program converts text typed by a user into an int. Inputs like "42", "-7" and " 12 " must be
      accepted. Which approach is the most robust?
    explanation: >-
      int() itself is the authority on what it accepts (signs, surrounding spaces, underscores between
      digits). Trying the conversion and handling ValueError (EAFP) can never disagree with int(), while a
      hand-written check almost always rejects some valid input or accepts some invalid one.
    options:
      - id: a
        text: "Check text.isdigit() first, and only call int(text) if it is True."
        feedback: isdigit() is False for "-7" and " 12 ", so valid input would be rejected. The check and the real rules disagree.
      - id: b
        text: "Call int(text) inside try, and handle ValueError by asking again."
        correct: true
        feedback: Correct - EAFP. The operation is the validator, so the rules can never get out of sync.
      - id: c
        text: "Wrap the conversion in a bare except: so nothing can go wrong."
        feedback: A bare except would also hide unrelated bugs and catch Ctrl+C. Catch ValueError specifically.
      - id: d
        text: Check that len(text) > 0, then convert.
        feedback: A non-empty string can still be invalid ("abc"), so int() could still raise.

  - id: predict-propagation
    type: predict-output
    skill: prediction
    difficulty: 3
    prompt: What does this program print? (Four lines.)
    code: |
      def inner():
          try:
              print("inner start")
              return 1 / 0
          finally:
              print("inner cleanup")

      def outer():
          try:
              inner()
              print("after inner")
          except ZeroDivisionError:
              print("outer handled it")

      outer()
      print("program continues")
    answer: |
      inner start
      inner cleanup
      outer handled it
      program continues
    explanation: >-
      inner raises ZeroDivisionError and has no handler, but its finally runs as the exception leaves the
      frame. The exception propagates to outer at the call inner(), so "after inner" is skipped and outer's
      handler runs. The exception is now handled, so the program continues normally.
    wrongAnswers:
      - answer: |
          inner start
          outer handled it
          program continues
        feedback: finally blocks run while an exception propagates out of their frame, so "inner cleanup" is printed first.
      - answer: |
          inner start
          inner cleanup
          after inner
          outer handled it
          program continues
        feedback: The exception arrives in outer at the call inner(), so the rest of outer's try block - "after inner" - is skipped.
      - answer: |
          inner start
          inner cleanup
          outer handled it
        feedback: Once outer handles the exception, the program carries on normally, so the final print runs.

  - id: debug-bare-except
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      `average(numbers)` should return the mean, or `0` for an empty list - but it returns `0` for **every**
      list. The bare `except:` is hiding the real error. Replace it with the one exception that an empty
      list causes, run the program, read the error that appears, and fix that bug too. The program should
      print `4.0` and then `0`.
    starterCode: |
      def average(numbers):
          try:
              return sum(numbers) / len(numbrs)
          except:
              return 0

      print(average([2, 4, 6]))
      print(average([]))
    solution: |
      def average(numbers):
          try:
              return sum(numbers) / len(numbers)
          except ZeroDivisionError:
              return 0

      print(average([2, 4, 6]))
      print(average([]))
    expectedOutput: |
      4.0
      0
    tests:
      - name: no bare or catch-all except
        code: |
          import ast
          for h in ast.walk(ast.parse(source)):
              if isinstance(h, ast.ExceptHandler):
                  assert h.type is not None, "Replace the bare except: with the specific exception an empty list raises."
                  assert not (isinstance(h.type, ast.Name) and h.type.id in ("Exception", "BaseException")), "except Exception still catches typos. Catch ZeroDivisionError specifically."
      - name: averages real lists
        code: |
          for numbers, expected in [([2, 4, 6], 4.0), ([10], 10.0), ([1, 2], 1.5)]:
              r = average(numbers)
              assert r == expected, f"average({numbers}) returned {r!r}; expected {expected}. Is something still hiding an error?"
      - name: empty list gives 0
        code: |
          r = average([])
          assert r == 0, f"average([]) returned {r!r}; expected 0."
      - name: prints 4.0 and 0
        code: |
          assert output_lines() == ["4.0", "0"], f"Your program printed {output()!r}."
    hints:
      - Dividing by len([]) - which is 0 - raises which exception? Catch only that one.
      - Once the bare except is gone, the real error appears. Read its last line.
      - The NameError points at a misspelled variable on the return line.
    feedback:
      - when: { errorType: NameError }
        message: Now the hidden bug is visible. Read the error - which name is misspelled on the return line?
      - when: { outputEquals: "0\n0\n" }
        message: Still 0 for a real list - an exception is still being swallowed. Check the spelling of numbers on the return line, and catch only ZeroDivisionError.
    explanation: >-
      The bare except caught the NameError from the typo numbrs, so every call returned 0. Catching only
      ZeroDivisionError (the empty-list case) let the NameError surface, which pointed straight at the typo.
      This is why handlers should name the specific exceptions they expect.

  - id: to-int-or-none
    type: code
    skill: implementation
    prompt: |
      Write `to_int_or_none(text)` that returns `int(text)` when `text` is a valid whole number (as `int()`
      defines it - surrounding spaces and a sign are fine) and `None` otherwise. Catch **only**
      `ValueError`. The loop at the bottom should then print:

      ```text
      '42' -> 42
      ' -7 ' -> -7
      '4.5' -> None
      'abc' -> None
      ```
    starterCode: |
      def to_int_or_none(text):
          return int(text)

      for text in ["42", " -7 ", "4.5", "abc"]:
          print(repr(text), "->", to_int_or_none(text))
    solution: |
      def to_int_or_none(text):
          try:
              return int(text)
          except ValueError:
              return None

      for text in ["42", " -7 ", "4.5", "abc"]:
          print(repr(text), "->", to_int_or_none(text))
    expectedOutput: |
      '42' -> 42
      ' -7 ' -> -7
      '4.5' -> None
      'abc' -> None
    tests:
      - name: valid numbers are converted
        code: |
          for text, expected in [("42", 42), (" -7 ", -7), ("0", 0), ("+3", 3), ("1_000", 1000)]:
              r = to_int_or_none(text)
              assert r == expected, f"to_int_or_none({text!r}) returned {r!r}; expected {expected}."
      - name: invalid text gives None
        code: |
          for text in ["4.5", "abc", "", "12a", " "]:
              r = to_int_or_none(text)
              assert r is None, f"to_int_or_none({text!r}) returned {r!r}; expected None."
      - name: catches ValueError specifically
        code: |
          import ast
          handlers = [h for h in ast.walk(ast.parse(source)) if isinstance(h, ast.ExceptHandler)]
          assert handlers, "Use try/except around int(text)."
          names = {n.id for h in handlers if h.type is not None for n in ast.walk(h.type) if isinstance(n, ast.Name)}
          assert all(h.type is not None for h in handlers), "Don't use a bare except: - catch ValueError."
          assert "ValueError" in names and not names & {"Exception", "BaseException"}, "Catch ValueError specifically (not Exception)."
      - name: prints the four lines
        code: |
          assert output_lines() == ["'42' -> 42", "' -7 ' -> -7", "'4.5' -> None", "'abc' -> None"], f"Your program printed {output()!r}."
    hints:
      - Put `return int(text)` inside a try block.
      - "Add `except ValueError:` and return None from it."
    feedback:
      - when: { errorType: ValueError }
        message: int() still raises for invalid text. Wrap it in try/except ValueError and return None in the handler.
    explanation: >-
      EAFP in its simplest form: try the conversion and translate the one expected failure into None.
      Because int() decides what is valid, inputs such as " -7 " and "1_000" are accepted without any
      hand-written checks.

  - id: ask-rating
    type: code
    skill: transfer
    difficulty: 2
    stdin: |
      great
      9
      4
    prompt: |
      Write a program that asks `Rating (1-5): ` until the user types a whole number from 1 to 5, then
      prints `Thanks for rating 4/5` (with the number they typed). For text that is not a whole number
      print `Please type a number.`; for numbers outside 1-5 print `Out of range.` Use `try`/`except
      ValueError`.

      The input box contains `great`, `9` and `4`, so your program should print:

      ```text
      Rating (1-5): Please type a number.
      Rating (1-5): Out of range.
      Rating (1-5): Thanks for rating 4/5
      ```
    starterCode: |
      text = input("Rating (1-5): ")
      rating = int(text)
      print(f"Thanks for rating {rating}/5")
    solution: |
      while True:
          text = input("Rating (1-5): ")
          try:
              rating = int(text)
          except ValueError:
              print("Please type a number.")
              continue
          if 1 <= rating <= 5:
              break
          print("Out of range.")

      print(f"Thanks for rating {rating}/5")
    expectedOutput: |
      Rating (1-5): Please type a number.
      Rating (1-5): Out of range.
      Rating (1-5): Thanks for rating 4/5
    tests:
      - name: handles the example input
        code: |
          assert output_lines() == ["Rating (1-5): Please type a number.", "Rating (1-5): Out of range.", "Rating (1-5): Thanks for rating 4/5"], f"Your program printed {output()!r}."
      - name: accepts a valid first answer
        code: |
          out = run_program("5\n")
          assert out.count("Rating (1-5): ") == 1 and out.endswith("Thanks for rating 5/5\n"), f"With input 5 your program printed {out!r}; it should ask once and thank the user."
      - name: keeps asking through several bad answers
        code: |
          out = run_program("0\n-3\nfive\n1\n")
          assert out.count("Rating (1-5): ") == 4, f"With inputs 0, -3, five, 1 the program should ask 4 times. It printed {out!r}."
          assert out.count("Out of range.") == 2 and out.count("Please type a number.") == 1, f"Expected two 'Out of range.' and one 'Please type a number.'; got {out!r}."
          assert out.endswith("Thanks for rating 1/5\n"), f"The last line should thank for rating 1/5; got {out!r}."
      - name: uses try/except ValueError
        code: |
          import ast
          handlers = [h for h in ast.walk(ast.parse(source)) if isinstance(h, ast.ExceptHandler)]
          assert any(isinstance(h.type, ast.Name) and h.type.id == "ValueError" for h in handlers), "Convert with int() inside try and catch ValueError."
    hints:
      - Wrap everything in `while True:` - the loop ends only with break once the rating is valid.
      - After `except ValueError:` print the message and `continue` back to the prompt.
      - "`1 <= rating <= 5` checks the range in one expression."
    feedback:
      - when: { errorType: ValueError }
        message: int() raised ValueError for "great". Put the conversion inside try and handle ValueError.
      - when: { errorType: EOFError }
        message: Your program asked for more input than was provided - make sure the loop stops (break) once a valid rating arrives.
    explanation: >-
      The loop separates two checks: int() validates the format (handled with except ValueError) and the
      if validates the range. Only a value passing both reaches break, so the final line always has a
      valid rating.

