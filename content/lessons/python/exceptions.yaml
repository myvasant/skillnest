sections:
  - id: why
    title: Why handle errors at all?
    kind: why
    blocks:
      - type: markdown
        body: |
          Real programs meet real data: users type "ten" instead of 10, a dictionary lacks a key, a list
          is empty. Here is a program that trusts its user. Run it - the input box already contains `ten`:
      - type: code
        runnable: true
        stdin: |
          ten
        code: |
          age = int(input("Age: "))
          print("Next year you will be", age + 1)
        expectError: ValueError
        expectedOutput: |
          Age:
        caption: The program crashes with a ValueError and a traceback - fine for you, baffling for a user.
      - type: markdown
        body: |
          An unhandled [exception](glossary:exception) stops the program. But often you *know* what to do
          when a particular thing goes wrong - here, ask for a number politely. `try`/`except` lets you say
          so:
      - type: code
        runnable: true
        stdin: |
          ten
        code: |
          text = input("Age: ")
          try:
              age = int(text)
              print("Next year you will be", age + 1)
          except ValueError:
              print("Please type a whole number, like 42.")
        expectedOutput: |
          Age: Please type a whole number, like 42.
        annotations:
          - line: 3
            text: int("ten") raises ValueError. The rest of the try block is skipped...
          - line: 5
            text: ...and Python jumps here, because this clause handles ValueError.
        caption: The typed input is not echoed (just like piping input into Python), so the message follows the prompt on the same line.
      - type: markdown
        body: |
          This lesson is about doing that **deliberately**: reading errors well, handling the ones you
          can do something about, and letting the others fail loudly so you can fix them.

  - id: what-is-exception
    title: What an exception is
    kind: concept
    blocks:
      - type: markdown
        body: |
          When an operation cannot be carried out, Python **raises** an exception:

          1. It creates an **exception object** describing the problem. Its **type** names the kind of
             problem (`ValueError`), and its **message** gives details.
          2. It stops running the current code immediately.
          3. It looks for a handler - an `except` clause for that type - in the current function, then in
             the function that called it, and so on up the [call stack](glossary:call-stack).
          4. If no handler is found, the program stops and prints a [traceback](glossary:traceback).

          (A `SyntaxError` is different: Python could not even read the program, so nothing ran.)

          The built-in exceptions you will meet most:

          | Exception | Meaning | Example that raises it |
          |---|---|---|
          | `ValueError` | Right type, unsuitable value | `int("ten")` |
          | `TypeError` | Operation not supported for this type | `"3" + 4`, `len(5)`, calling `None()` |
          | `NameError` | Name not found in any scope | `prnt("hi")` |
          | `UnboundLocalError` | Local name read before assignment (a kind of `NameError`) | see [scope](concept:python.scope) |
          | `IndexError` | Sequence index out of range | `[1, 2][5]` |
          | `KeyError` | Dictionary key not present | `{"a": 1}["b"]` |
          | `AttributeError` | Object has no such attribute or method | `(5).append(1)` |
          | `ZeroDivisionError` | Division or modulo by zero | `1 / 0` |
          | `RecursionError` | Too many nested calls | a function that calls itself forever |
          | `FileNotFoundError` | File does not exist | `open("missing.txt")` |
          | `KeyboardInterrupt` | The user pressed Ctrl+C | — |

          Exception types form a family tree: `ZeroDivisionError` is a kind of `ArithmeticError`;
          `KeyError` and `IndexError` are kinds of `LookupError`; nearly all are kinds of `Exception`.
          Handling a parent type also handles its children. Defining your own exception types needs
          [classes](concept:python.classes) and is covered in
          [raising exceptions](concept:python.raising-exceptions).

  - id: tracebacks
    title: Reading a traceback from the bottom up
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          This program loads user records through two helper functions. The second record is bad.
      - type: code
        runnable: true
        code: |
          def parse_age(text):
              return int(text)

          def load_user(record):
              age = parse_age(record["age"])
              return record["name"], age

          users = [{"name": "Ada", "age": "36"}, {"name": "Alan", "age": "forty-one"}]
          for user in users:
              print(load_user(user))
        expectError: ValueError
        expectedOutput: |
          ('Ada', 36)
        caption: Run it and compare the traceback you get with the annotated copy below.
      - type: code
        language: text
        code: |
          Traceback (most recent call last):
            File "<learner>", line 10, in <module>
              print(load_user(user))
                    ~~~~~~~~~^^^^^^
            File "<learner>", line 5, in load_user
              age = parse_age(record["age"])
            File "<learner>", line 2, in parse_age
              return int(text)
          ValueError: invalid literal for int() with base 10: 'forty-one'
        caption: >-
          In this browser your program's file is called <learner>. On your own computer you would see the
          script's path, for example File "/home/ada/users.py", line 10.
      - type: markdown
        body: |
          A traceback is a snapshot of the call stack at the moment of the error, printed **outermost call
          first** ("most recent call last"). Read it **from the bottom up**:

          1. **Last line - what happened.** `ValueError: invalid literal for int() with base 10:
             'forty-one'`. The type tells you the kind of problem; the message often shows the bad value.
          2. **The frame just above - where it was detected.** Line 2, in `parse_age`: `return int(text)`.
          3. **Walk upwards - how execution got there.** `parse_age` was called by `load_user` (line 5),
             which was called from the main program (`<module>`, line 10). Each `File ..., line ..., in ...`
             entry is one frame.
          4. **Ask where the bad data came from.** The line that *detects* an error is often not the line
             that *caused* it. `int` is working correctly; the real problem is the record with
             `"forty-one"` - higher up, in the data.

          The `~~~^^^` markers under a line highlight the exact part of it that was being evaluated
          (Python 3.11+). They are omitted when they would just underline the whole line.
      - type: item
        ref: mcq-read-traceback

  - id: try-except
    title: Handling exceptions with try/except
    kind: concept
    blocks:
      - type: markdown
        body: |
          ```text
          try:
              code that might raise
          except SomeError:
              what to do if SomeError is raised in the try block
          ```

          How a [try statement](glossary:try-statement) runs:

          1. The `try` block runs.
          2. If **no exception** happens, the `except` clauses are skipped.
          3. If an exception happens, the **rest of the try block is skipped**. Python checks the `except`
             clauses from top to bottom and runs the **first** one whose type matches. Execution then
             continues after the whole `try` statement - the exception has been *handled*.
          4. If no clause matches, the exception keeps travelling up the call stack, as if there were no
             `try` at all.
      - type: code
        runnable: true
        code: |
          def safe_divide(a, b):
              try:
                  return a / b
              except ZeroDivisionError:
                  print("Cannot divide", a, "by zero")
                  return None

          print(safe_divide(10, 4))
          print(safe_divide(1, 0))
        expectedOutput: |
          2.5
          Cannot divide 1 by zero
          None
      - type: markdown
        body: |
          **Getting the exception object.** `except SomeError as name:` binds `name` to the exception
          object, so you can show or record its message with `str(name)` or by printing it:
      - type: code
        runnable: true
        code: |
          prices = {"tea": 30, "coffee": 45}
          for item in ["tea", "cake"]:
              try:
                  print(item, prices[item])
              except KeyError as error:
                  print("No price for", error)
        expectedOutput: |
          tea 30
          No price for 'cake'
        annotations:
          - line: 5
            text: error is the KeyError object; printing a KeyError shows the missing key (with quotes).
      - type: markdown
        body: |
          **Several possible problems.** Add one `except` clause per type, or group types in a tuple when
          the response is the same:
      - type: code
        runnable: true
        code: |
          def to_number(value):
              try:
                  return int(value)
              except ValueError:
                  return "not a number"
              except TypeError:
                  return "wrong type"

          print(to_number("42"), to_number("4.2"), to_number(None))

          def describe(value):
              try:
                  return f"{int(value)} as an int"
              except (ValueError, TypeError) as error:
                  return f"cannot convert: {type(error).__name__}"

          print(describe("7"), "|", describe([7]))
        expectedOutput: |
          42 not a number wrong type
          7 as an int | cannot convert: TypeError
        annotations:
          - line: 9
            text: int("4.2") raises ValueError; int(None) raises TypeError.
          - line: 14
            text: A tuple of types - one handler for both.
      - type: callout
        variant: tip
        title: Keep the try block small
        body: |
          Put **only the line that can fail** inside `try`. A large try block can catch an exception
          from a line you did not expect to fail - and then your handler runs for the wrong reason. Also
          order handlers from **specific to general**: the first matching clause wins, so
          `except Exception:` placed first would swallow everything before `except ValueError:` is checked.
      - type: item
        ref: predict-try-flow

  - id: else-finally
    title: else and finally
    kind: concept
    blocks:
      - type: markdown
        body: |
          A `try` statement can have two more clauses:

          - `else:` runs only if the try block finished **without** an exception. Put code there that
            should run on success but whose own errors you do *not* want the `except` to catch - it keeps
            the try block small.
          - `finally:` runs **no matter what** - after success, after a handled exception, after an
            unhandled one, and even when the try block executes `return`. Use it for clean-up that must
            always happen (closing a connection, releasing a resource). For files there is an even better
            tool, `with` - see [context managers](concept:python.context-managers).
      - type: code
        runnable: true
        code: |
          def read_number(text):
              try:
                  number = int(text)
              except ValueError:
                  print(f"{text!r} is not a number")
                  return None
              else:
                  print(f"parsed {number}")
                  return number
              finally:
                  print("done with", repr(text))

          print(read_number("12"))
          print(read_number("abc"))
        expectedOutput: |
          parsed 12
          done with '12'
          12
          'abc' is not a number
          done with 'abc'
          None
        annotations:
          - line: 7
            text: Reached only when int(text) succeeded.
          - line: 10
            text: Runs on both paths - just before the function actually returns.
      - type: item
        ref: predict-finally

  - id: reprompt
    title: Re-prompting until the input is valid
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          The most common use of `try`/`except` for a beginner: keep asking until the user gives a usable
          answer. The pattern is a `while True` loop that only exits once a value has passed **every**
          check. Wrapping it in a function makes it reusable.
      - type: code
        runnable: true
        stdin: |
          two
          0
          3
        code: |
          def ask_positive_int(prompt):
              while True:
                  text = input(prompt)
                  try:
                      value = int(text)
                  except ValueError:
                      print(f"{text!r} is not a whole number. Try again.")
                      continue
                  if value > 0:
                      return value
                  print("It must be at least 1. Try again.")

          tickets = ask_positive_int("Tickets: ")
          print("Booking", tickets, "tickets")
        expectedOutput: |
          Tickets: 'two' is not a whole number. Try again.
          Tickets: It must be at least 1. Try again.
          Tickets: Booking 3 tickets
        annotations:
          - line: 7
            text: Show the user what was wrong, including the text they typed.
          - line: 8
            text: continue goes straight back to the prompt.
          - line: 10
            text: The only way out - return leaves both the loop and the function.
        caption: The input box holds three answers, one per line - two, 0 and 3. Change them and run again.
      - type: callout
        variant: production
        title: Two kinds of check
        body: |
          `int()` checks the **format** (is it a whole number?) and raises if not; the `if` checks the
          **business rule** (at least 1). Real input validation usually needs both. Keep messages
          specific - "must be at least 1" helps far more than "invalid input".

  - id: bare-except
    title: Why a bare except is harmful
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [bare `except:`](glossary:bare-except) - with no exception type - catches **every** exception. That sounds safe, but it
          means the handler also runs for errors you never anticipated, including your own bugs:
      - type: code
        runnable: true
        code: |
          def average(numbers):
              try:
                  return sum(numbers) / len(numbrs)   # typo: numbrs
              except:
                  return 0

          print(average([2, 4, 6]))
        expectedOutput: |
          0
        caption: >-
          No error, no traceback - just a wrong answer. The NameError from the typo was swallowed, so the
          function returns 0 for every list. With except ZeroDivisionError, the typo would have been
          reported immediately.
      - type: markdown
        body: |
          Problems with bare `except:` (and with `except Exception:` used carelessly):

          - **It hides bugs.** Typos (`NameError`), wrong types (`TypeError`) and logic errors turn into
            silent wrong behaviour that is far harder to find than a traceback.
          - **It catches things that are not errors in your code.** A bare `except:` also catches
            `KeyboardInterrupt` (the user pressing Ctrl+C) and `SystemExit` (the program asking to exit),
            so a loop protected this way may refuse to stop. `except Exception:` does not catch those two,
            because they are not subclasses of `Exception`.
          - **The handler cannot respond sensibly.** "Return 0" is right for an empty list, wrong for a
            typo. A handler should exist for a problem you understand.

          [PEP 8](https://peps.python.org/pep-0008/#programming-recommendations) says: "When catching
          exceptions, mention specific exceptions whenever possible instead of using a bare `except:`
          clause." The one common, legitimate use of a broad handler is at the very **top** of a long-running
          program (a web server, a job runner) where you record the full error and carry on with the next
          request - never `except: pass`.
      - type: item
        ref: explain-bare-except

  - id: eafp-lbyl
    title: "EAFP vs LBYL: ask forgiveness or look before you leap?"
    kind: concept
    blocks:
      - type: markdown
        body: |
          There are two styles of dealing with something that might fail:

          - [LBYL](glossary:lbyl) - **Look Before You Leap**: check first, then act.
          - [EAFP](glossary:eafp) - **Easier to Ask Forgiveness than Permission**: just act, and handle the
            exception if it fails.
      - type: code
        runnable: true
        code: |
          stock = {"apple": 5, "pear": 0}

          # LBYL
          if "mango" in stock:
              print(stock["mango"])
          else:
              print("no mango (checked first)")

          # EAFP
          try:
              print(stock["mango"])
          except KeyError:
              print("no mango (handled the KeyError)")
        expectedOutput: |
          no mango (checked first)
          no mango (handled the KeyError)
      - type: markdown
        body: |
          Both are fine for a dictionary lookup (and `stock.get("mango", 0)` is simpler than either). EAFP
          is idiomatic in Python and has real advantages when the check is hard to get right or can go out
          of date:
      - type: code
        runnable: true
        code: |
          text = "-12"
          print(text.isdigit())
          try:
              print(int(text))
          except ValueError:
              print("not a number")
        expectedOutput: |
          False
          -12
        annotations:
          - line: 2
            text: The LBYL check rejects a perfectly valid number - isdigit() knows nothing about minus signs or spaces.
          - line: 4
            text: int() is the authority on what int() accepts. Asking it directly cannot disagree with it.
      - type: markdown
        body: |
          **Choosing:**

          - Prefer **EAFP** when the operation itself is the best validator (parsing numbers, dates), or
            when the world can change between the check and the action - a file can be deleted after
            `exists()` said it was there (a "time-of-check to time-of-use" bug).
          - Prefer **LBYL** when the check is simple and failure is a normal, frequent case - `if items:`
            before taking `items[0]`, `if key in d:` - or when an operation cannot be undone, so you must
            check *before* doing it.
          - Exceptions in CPython are cheap to *set up* but relatively expensive to *raise*, so EAFP is best
            when failure is the exception rather than the rule.
      - type: item
        ref: mcq-eafp

  - id: propagation
    title: How exceptions travel up the call stack
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          An exception that is not handled in the function where it happens is not lost. The function stops,
          its frame is discarded, and the exception **propagates** to the caller - at the exact point where
          the call was made - as if the call itself had raised it. This repeats up the stack until some
          `try` handles it, or the program stops with a traceback. This is
          [exception propagation](glossary:exception-propagation).

          Step through it. Watch the `exception` steps: `int("x")` fails inside `parse`, `parse`'s frame is
          removed, then `total`'s frame - neither handles `ValueError` - and finally the `except` in the
          main program catches it.
      - type: visualization
        component: python-tracer
        title: An exception unwinds two frames before it is caught
        caption: >-
          parse and total have no try statement, so the ValueError passes straight through them. Note
          that print(total(...)) never prints a total - the call never returned a value.
        props:
          code: |
            def parse(text):
                return int(text)

            def total(items):
                result = 0
                for item in items:
                    result += parse(item)
                return result

            try:
                print(total(["4", "x", "5"]))
            except ValueError as e:
                print("Caught in the caller:", e)
      - type: markdown
        body: |
          **Where should you handle an exception?** Where you can do something **meaningful** about it:

          - `parse` cannot know whether a bad value should be skipped, replaced, or reported - so it lets
            the exception propagate.
          - The code that talks to the user *can* decide: re-prompt, show a message, skip a record and
            count it.

          Low-level functions usually let exceptions propagate (or raise clearer ones - see
          [raising exceptions](concept:python.raising-exceptions)); the code at the edges of the program -
          user input, request handlers, the main loop - handles them. Any `finally` blocks in the frames
          being unwound still run on the way up.
      - type: item
        ref: predict-propagation

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **The hierarchy is real class inheritance.** Every exception type is a class, and each one's
          `__mro__` lists its ancestors. `except ArithmeticError:` handles `ZeroDivisionError` because
          `ZeroDivisionError` is a subclass of it. At the top sits `BaseException`; `Exception` is the
          parent of all "normal" errors, while `KeyboardInterrupt`, `SystemExit` and `GeneratorExit`
          derive from `BaseException` directly - which is why `except Exception:` lets Ctrl+C through.
      - type: code
        runnable: true
        code: |
          print(ZeroDivisionError.__mro__)
          print(issubclass(KeyError, LookupError), issubclass(IndexError, LookupError))
          print(issubclass(KeyboardInterrupt, Exception))
        expectedOutput: |
          (<class 'ZeroDivisionError'>, <class 'ArithmeticError'>, <class 'Exception'>, <class 'BaseException'>, <class 'object'>)
          True True
          False
      - type: markdown
        body: |
          **The `as` name is deleted.** At the end of an `except ... as error:` clause Python deletes the
          name `error` (an exception object holds a reference to its traceback and all its frames, and
          keeping it alive would create reference cycles). Copy anything you need first.
      - type: code
        runnable: true
        code: |
          try:
              1 / 0
          except ZeroDivisionError as error:
              message = str(error)
          print(message)
          print("error" in globals())
        expectedOutput: |
          division by zero
          False
      - type: markdown
        body: |
          **Cost.** Since CPython 3.11, entering a `try` block costs almost nothing when no exception is
          raised ("zero-cost" exceptions); the work happens only when something is actually raised.

          **Errors inside handlers chain.** If a handler itself fails, Python shows both tracebacks joined by
          "During handling of the above exception, another exception occurred:", so the original cause is not
          lost. `raise ... from ...` controls this explicitly (see raising exceptions).

          **New in Python 3.14.** [PEP 758](https://peps.python.org/pep-0758/) allows
          `except ValueError, TypeError:` without parentheses when there is no `as` clause (older versions
          require the tuple form, which still works everywhere). [PEP 765](https://peps.python.org/pep-0765/)
          makes the compiler emit a `SyntaxWarning` for `return`, `break` or `continue` that leaves a
          `finally` block, because doing so silently discards any exception in flight:
      - type: code
        runnable: true
        code: |
          def risky():
              try:
                  return 1 / 0
              finally:
                  return "finally wins"

          print(risky())
        expectedOutput: |
          finally wins
        caption: >-
          The ZeroDivisionError vanished without a trace. Python 3.14 also prints
          "SyntaxWarning: 'return' in a 'finally' block" (on standard error) when compiling this.

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `ValueError: invalid literal for int() with base 10: 'ten'` | Converting text that is not a whole number | Wrap the conversion in `try`/`except ValueError` and re-prompt or report. |
          | Your `except` never runs; the program still crashes | You caught the wrong type (e.g. `ValueError` for a missing key) | Read the last line of the traceback and catch that exact type. |
          | Wrong results, but no error at all | A bare `except:` or `except Exception: pass` is swallowing a bug | Catch only the specific exception you expect. |
          | The handler runs for errors from an unrelated line | The `try` block is too big | Keep only the risky line in `try`; move the rest to `else`. |
          | `NameError` for the exception variable after the handler | The `as` name is deleted when the `except` block ends | Save `str(error)` in another variable inside the handler. |
          | A specific handler below `except Exception:` never runs | The first matching clause wins | Order handlers from specific to general. |
          | `SyntaxError: expected 'except' or 'finally' block` | A `try:` with no handler | Add an `except` (or `finally`) clause. |
          | `NameError`/`UnboundLocalError` for a variable assigned in `try` | The exception happened before the assignment | Assign a default before `try`, or use the value only in `else`. |
      - type: code
        runnable: true
        code: |
          prices = {"tea": 30}
          try:
              print(prices["cake"])
          except ValueError:
              print("No such item")
        expectError: KeyError
        caption: The handler is for ValueError, but a missing key raises KeyError - so it is not handled at all.
      - type: item
        ref: debug-bare-except

