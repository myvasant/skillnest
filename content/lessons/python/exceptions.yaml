      print(price_of("tea"))
      print(price_of("cake"))
    solution: |
      prices = {"tea": 30, "coffee": 45}

      def price_of(item):
          try:
              return prices[item]
          except KeyError:
              return 0

      print(price_of("tea"))
      print(price_of("cake"))
    expectedOutput: |
      30
      0
    tests:
      - name: known and unknown items
        code: |
          for item, expected in [("tea", 30), ("coffee", 45), ("cake", 0), ("", 0)]:
              r = price_of(item)
              assert r == expected, f"price_of({item!r}) returned {r!r}; expected {expected}."
      - name: no bare or catch-all except
        code: |
          import ast
          for h in ast.walk(ast.parse(source)):
              if isinstance(h, ast.ExceptHandler):
                  assert h.type is not None and not (isinstance(h.type, ast.Name) and h.type.id in ("Exception", "BaseException")), "Catch the specific exception a missing key raises, not everything."
      - name: prints 30 and 0
        code: |
          assert output_lines() == ["30", "0"], f"Your program printed {output()!r}."
    hints:
      - Run it and read the last line of the traceback. Which exception type is it?
      - The except clause must name that type for the handler to run.
    feedback:
      - when: { errorType: KeyError }
        message: The missing key raises KeyError, which your handler does not catch. Name KeyError in the except clause.
    explanation: >-
      A missing dictionary key raises KeyError, not ValueError, so the handler never matched and the
      exception propagated. Catching KeyError (or using prices.get(item, 0)) gives the intended default.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-else, m-mcq-which-exception, m-tf-finally, m-sum-valid, m-debug-wrong-exception]

cheatsheet: |
  ```python
  try:
      value = int(text)            # only the risky line
  except ValueError as error:      # specific type; error = the exception object
      print("Not a number:", error)
  except (KeyError, IndexError):   # several types, one response
      ...
  else:
      print("parsed", value)       # runs only if no exception
  finally:
      print("always runs")         # success, failure, even return

  while True:                      # re-prompt pattern
      try:
          n = int(input("n: "))
          break
      except ValueError:
          print("Try again")
  ```
  - Tracebacks: read bottom-up (what → where → how you got there)
  - Never bare `except:` · catch specific → general · handle where you can respond
  - EAFP: try it and handle failure · LBYL: check first when the check is simple
