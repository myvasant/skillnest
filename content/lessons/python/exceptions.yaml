  - id: m-mcq-which-exception
    type: mcq
    skill: recognition
    prompt: 'Which exception does `{"tea": 30}["cake"]` raise?'
    explanation: Looking up a key that is not in a dictionary raises KeyError, and its message is the missing key.
    options:
      - id: a
        text: KeyError
        correct: true
        feedback: Correct. Use `in`, .get(), or except KeyError depending on what should happen.
      - id: b
        text: IndexError
        feedback: IndexError is for sequence positions such as a list index that is out of range.
      - id: c
        text: NameError
        feedback: NameError is for an unknown variable name. Here the dict exists; the key is missing.
      - id: d
        text: ValueError
        feedback: ValueError is for a right-type, wrong-value argument, such as int("ten").

  - id: m-tf-finally
    type: true-false
    skill: recognition
    prompt: "True or false: a finally clause runs even when the try block executes a return statement."
    answer: true
    explanation: >-
      finally runs on every way out of the try statement - normal completion, a handled or unhandled
      exception, return, break or continue. It runs just before the function actually returns.

  - id: m-sum-valid
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `sum_valid(values)`. `values` is a list of strings. Return a tuple `(total, bad)`: `total` is
      the sum of the strings that `int()` can convert, and `bad` is how many could not be converted. Use
      try/except. Print `sum_valid(["4", "x", "10", "", "-2"])`, which is `(12, 2)`.
    starterCode: |
      def sum_valid(values):
          total = 0
          for v in values:
              total += int(v)
          return total

      print(sum_valid(["4", "x", "10", "", "-2"]))
    solution: |
      def sum_valid(values):
          total = 0
          bad = 0
          for v in values:
              try:
                  total += int(v)
              except ValueError:
                  bad += 1
          return total, bad

      print(sum_valid(["4", "x", "10", "", "-2"]))
    expectedOutput: |
      (12, 2)
    tests:
      - name: returns total and bad count
        code: |
          cases = [(["4", "x", "10", "", "-2"], (12, 2)), ([], (0, 0)), (["a", "b"], (0, 2)), ([" 7 ", "3"], (10, 0))]
          for values, expected in cases:
              r = sum_valid(values)
              assert r == expected, f"sum_valid({values}) returned {r!r}; expected {expected}."
      - name: catches ValueError specifically
        code: |
          import ast
          handlers = [h for h in ast.walk(ast.parse(source)) if isinstance(h, ast.ExceptHandler)]
          assert handlers and all(isinstance(h.type, ast.Name) and h.type.id == "ValueError" for h in handlers), "Wrap int(v) in try and catch ValueError (not a bare except)."
      - name: prints (12, 2)
        code: |
          assert output().strip() == "(12, 2)", f"Your program printed {output()!r}."
    hints:
      - Keep two counters, total and bad.
      - Put only `total += int(v)` inside the try block, so one bad value does not stop the loop.
      - "`return total, bad` returns a tuple."
    explanation: >-
      The try block sits inside the loop, so each bad value is handled and counted, and the loop moves on
      to the next one. Catching only ValueError means any other bug would still surface.

  - id: m-debug-wrong-exception
    type: debug
    skill: debugging
    prompt: |
      `price_of` should return `0` for items that are not on the menu, but `price_of("cake")` crashes.
      Fix the handler so the program prints `30` and then `0`.
