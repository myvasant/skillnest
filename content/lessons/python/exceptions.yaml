      the handler prints "divide by zero" and sets result to None; else is skipped because an exception
      happened.
    wrongAnswers:
      - answer: |
          ok
          2.0
          divide by zero
          ok
          None
        feedback: else runs only when the try block finished without an exception, so it is skipped for 1 / 0.
      - answer: |
          2.0
          ok
          None
