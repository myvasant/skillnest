id: python.concurrency
concept: python.concurrency
title: Concurrency, Parallelism and the GIL
subtitle: Choose the right way to run work
estimatedMinutes: 55
reviewedOn: 2026-11-04
summary: Learn why programs sometimes need to make progress on several tasks at once, how concurrency
  differs from parallelism, and when Python threads, processes or asyncio are appropriate. Understand
  the GIL, shared-state hazards and the limits of the browser-based Python runtime.
objectives:
- Distinguish concurrency (overlapping progress) from parallelism (simultaneous execution).
- Classify work as I/O-bound or CPU-bound before selecting an execution model.
- Explain the GIL in standard CPython and the optional free-threaded build introduced in Python 3.13.
- Identify race conditions, critical sections and deadlocks in shared-state designs.
- Choose between threads, processes and asyncio, including the cost and portability trade-offs.
- Design worker code that returns local results instead of mutating shared state unnecessarily.
sources:
- title: Concurrent Execution — Python 3.14
  url: https://docs.python.org/3.14/library/concurrency.html
  publisher: Python Software Foundation
  version: '3.14'
- title: threading — Thread-based parallelism
  url: https://docs.python.org/3.14/library/threading.html
  publisher: Python Software Foundation
  version: '3.14'
