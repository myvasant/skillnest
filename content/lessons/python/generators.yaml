      - answer: |
          100 110
          5 100
        feedback: Creating a new generator u does not reset t. Each generator object has independent local variables.

  - id: m-tf-body
    type: true-false
    skill: recognition
    prompt: "True or false: calling a generator function runs its body up to the first `yield`."
    answer: false
