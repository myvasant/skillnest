  - id: m-mcq-big-file
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      You must count the lines containing "ERROR" in a 20 GB log file on a machine with 8 GB of memory.
      Which approach works?
    explanation: >-
      Iterating over the file object (directly or through generator expressions) reads one line at a time,
      so memory use stays tiny no matter how large the file is. The other options load the whole file.
    options:
      - id: a
        text: 'sum(1 for line in f if "ERROR" in line), inside a with block'
        correct: true
        feedback: Right. The file iterator and the generator expression are both lazy, so only one line is in memory at a time.
      - id: b
        text: 'len([line for line in f.readlines() if "ERROR" in line])'
        feedback: readlines() builds a list of every line — about 20 GB of strings — before filtering.
      - id: c
        text: 'f.read().count("ERROR")'
        feedback: read() loads the whole file into one string, which does not fit in memory. (It would also count several errors on one line separately.)
      - id: d
        text: "lines = list(f), then a for loop over lines"
        feedback: list(f) materialises every line in memory first — exactly what a lazy approach avoids.

  - id: m-code-chunked
    type: code
    skill: implementation
    difficulty: 3
    prompt: |
      Write a generator function `chunked(items, size)` that yields lists of `size` consecutive items from
      any iterable; the last chunk may be shorter. For example, `chunked(range(7), 3)` yields `[0, 1, 2]`,
      `[3, 4, 5]`, `[6]`. It must work lazily on endless inputs.
    starterCode: |
      def chunked(items, size):
          # Collect items into a list; when it reaches size, yield it and start a new one.
          # Don't forget the last, shorter chunk.
          pass


      print(list(chunked(range(7), 3)))
    solution: |
      def chunked(items, size):
          chunk = []
          for item in items:
              chunk.append(item)
              if len(chunk) == size:
                  yield chunk
                  chunk = []
          if chunk:
              yield chunk


      print(list(chunked(range(7), 3)))
    expectedOutput: |
      [[0, 1, 2], [3, 4, 5], [6]]
    tests:
      - name: splits into chunks
        code: |
          assert list(chunked(range(7), 3)) == [[0, 1, 2], [3, 4, 5], [6]], f"Got {list(chunked(range(7), 3))!r}."
          assert list(chunked("abcd", 2)) == [["a", "b"], ["c", "d"]], "chunked('abcd', 2) should give [['a', 'b'], ['c', 'd']] with no empty chunk at the end."
          assert list(chunked([], 3)) == [], "An empty input gives no chunks."
      - name: is a generator function
        code: |
          import inspect
          assert inspect.isgeneratorfunction(chunked), "chunked must use yield."
      - name: works on an endless input
        code: |
          from itertools import count, islice
          result = list(islice(chunked(count(), 2), 3))
          assert result == [[0, 1], [2, 3], [4, 5]], f"The first three chunks of 0, 1, 2, ... should be [[0, 1], [2, 3], [4, 5]], got {result!r}."
      - name: chunks are separate lists
        code: |
          a, b = list(chunked([1, 2, 3, 4], 2))
          assert a is not b and a == [1, 2], "Start a new list after yielding each chunk — otherwise every chunk is the same list object."
    hints:
      - Keep a list chunk; append each item to it.
      - When len(chunk) == size, yield chunk, then rebind chunk to a new empty list (don't clear() the yielded one).
      - After the loop, yield the leftover chunk only if it is not empty.
    feedback:
      - when: { outputContains: "[[0, 1, 2], [3, 4, 5]]" }
        message: The last, shorter chunk is missing. After the loop, yield chunk if it still has items.
      - when: { outputContains: "[]]" }
        message: An empty chunk was yielded at the end. Only yield the leftover chunk when it is not empty.
      - when: { outputContains: "[[6], [6]" }
        message: All chunks are the same list. Create a new list (chunk = []) after each yield instead of calling chunk.clear().
    explanation: >-
      The generator accumulates items and yields a chunk whenever it is full, then starts a fresh list so
      yielded chunks are independent. Because it yields as soon as each chunk is ready, it works with
      islice on an infinite input. (Python 3.12 added itertools.batched, which does the same with tuples.)

  - id: m-debug-closed-file
    type: debug
    skill: debugging
    difficulty: 3
    prompt: |
      `read_numbers(path)` should lazily yield each number in a file, so the program prints `60`. Instead
      it crashes with `ValueError: I/O operation on closed file.` Fix `read_numbers` so it stays lazy and
      the file is open while the numbers are being read.
    starterCode: |
      with open("numbers.txt", "w", encoding="utf-8") as f:
          f.write("10\n20\n30\n")


      def read_numbers(path):
          with open(path, encoding="utf-8") as f:
              return (int(line) for line in f)


      print(sum(read_numbers("numbers.txt")))
    solution: |
      with open("numbers.txt", "w", encoding="utf-8") as f:
          f.write("10\n20\n30\n")


      def read_numbers(path):
          with open(path, encoding="utf-8") as f:
              for line in f:
                  yield int(line)


      print(sum(read_numbers("numbers.txt")))
    expectedOutput: |
      60
    tests:
      - name: prints 60
        code: |
          assert output().strip() == "60", f"Expected 60, got {output()!r}."
      - name: works for another file
        code: |
          with open("check-numbers.txt", "w", encoding="utf-8") as setup:
              setup.write("1\n2\n")
          assert sum(read_numbers("check-numbers.txt")) == 3, "read_numbers should read the file it is given."
      - name: read_numbers is a generator function
        code: |
          import inspect
          assert inspect.isgeneratorfunction(read_numbers), "Make read_numbers a generator function (use yield inside the with block) so it stays lazy."
    hints:
      - When does the with block close the file — before or after sum() starts reading the generator expression?
      - The generator expression escapes the with block; by the time it runs, the file is closed.
      - Make read_numbers itself a generator - loop over f inside the with block and yield int(line).
    feedback:
      - when: { errorType: ValueError, errorMessageContains: "closed file" }
        message: >-
          The file is still closed before the numbers are read. Move the iteration inside the with block by
          yielding from read_numbers itself.
    explanation: >-
      return hands the generator expression back and immediately leaves the with block, closing the file.
      sum() then tries to read a closed file. When read_numbers is itself a generator, the with block stays
      active while the generator is paused, and it closes the file when the loop finishes.

