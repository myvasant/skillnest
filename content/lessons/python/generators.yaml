id: python.generators
concept: python.generators
title: Generators
subtitle: yield, lazy sequences and pipelines
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  A function containing `yield` becomes a generator function: calling it returns a generator that
  produces values one at a time, pausing between them. Learn how execution jumps in and out of a paused
  generator, write generator expressions, process huge or infinite sequences in constant memory with
  itertools.islice, chain generators into pipelines, and delegate with `yield from`.
objectives:
  - Explain that calling a generator function runs none of its body, and that each next() runs it to the next yield and pauses.
  - Predict the interleaved output of programs that use generators and generator pipelines.
  - Write generator functions and generator expressions instead of building full lists when values are used once.
  - Take a finite number of items from an infinite generator safely with itertools.islice.
  - Diagnose generator mistakes - exhausted generators, len()/indexing, return instead of yield, closed files - and use yield from.
