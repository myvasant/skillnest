  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Compile-time decision.** Whether a function is a generator function is decided when it is
          compiled: one `yield` anywhere in the body — even in a branch that never runs — makes it one.
          `inspect.isgeneratorfunction(f)` tells you, and `inspect.getgeneratorstate(gen)` reports
          `GEN_CREATED`, `GEN_RUNNING`, `GEN_SUSPENDED` or `GEN_CLOSED`.

          **A frame that outlives its call.** For a normal call, CPython creates a frame (local variables
          plus the position in the bytecode) and discards it on return. A generator object owns its frame;
          `yield` saves the instruction position and leaves the frame intact, so resuming is cheap — no
          copying of locals.

          **Two-way communication.** `value = yield x` is an expression: `gen.send(v)` resumes the generator
          and makes the paused `yield` evaluate to `v` (the first resume must be `next(gen)` or
          `gen.send(None)`). `gen.close()` raises `GeneratorExit` at the paused `yield` so `finally` blocks
          and `with` statements inside the generator can clean up.
      - type: code
        runnable: true
        code: |
          import inspect

          def averager():
              total = count = 0
              average = None
              while True:
                  value = yield average      # pause; resume with the sent value
                  total += value
                  count += 1
                  average = total / count

          avg = averager()
          print(inspect.getgeneratorstate(avg))
          next(avg)                            # run to the first yield
          print(avg.send(10), avg.send(20), avg.send(60))
          avg.close()
          print(inspect.getgeneratorstate(avg))
        expectedOutput: |
          GEN_CREATED
          10.0 15.0 30.0
          GEN_CLOSED
      - type: markdown
        body: |
          **The itertools toolbox.** `itertools` provides fast lazy building blocks that combine with
          generators: `count`, `islice`, `takewhile`, `chain`, `zip_longest`, `groupby`, `batched` (3.12+)
          and more — see the [standard library lesson](concept:python.stdlib).

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A function containing `yield` is a **generator function**; calling it returns a **generator** and
            runs **none** of the body.
          - Each `next()` runs the body to the next `yield`, hands over the value and **pauses** with all
            locals kept; finishing raises `StopIteration`.
          - Generators are single-use iterators: `for`, `list()`, `sum()` etc. consume them.
          - `(expr for x in items if cond)` is a lazy generator expression; `sum(x * x for x in nums)`
            needs no extra brackets.
          - Lazy = constant memory and possible infinity — take from infinite generators with
            `itertools.islice`.
          - Chain generators into pipelines; one item at a time flows through every stage.
          - `yield from iterable` delegates to another iterable or generator.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What's the difference between a list comprehension and a generator expression, and when would you
          use a generator?" — eager vs lazy, memory, single-use; then walk through what `next()` does to a
          paused frame. Senior candidates mention pipelines over large files, `yield from`, and that
          generators were the basis of coroutines.

items:
  - id: predict-order
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print? (Four lines — think about when the body runs.)
    code: |
      def greet():
          print("hello from the body")
          yield "first"
          yield "second"

      g = greet()
      print("created")
      print(next(g))
      print(next(g))
    answer: |
      created
      hello from the body
      first
      second
    explanation: >-
      Calling greet() runs nothing, so "created" prints first. The first next() starts the body: it prints
      "hello from the body" and pauses at yield "first". The second next() resumes after that yield and
      stops at yield "second".
    wrongAnswers:
      - answer: |
          hello from the body
          created
          first
          second
        feedback: Calling a generator function does not run its body. It only creates the generator; the body starts at the first next().
      - answer: |
          created
          hello from the body
          first
          hello from the body
          second
        feedback: The second next() resumes after the first yield — it does not restart the function from the top.
      - answer: |
          created
          first
          second
        feedback: The print inside the body does run — at the first next(), just before the first yield.

  - id: explain-pause
    type: explain
    skill: explanation
    prompt: >-
      Explain, step by step, what happens to a generator function's code and its local variables when you
      call the function, then call next() on the result twice. Use countdown(2) from this lesson as your
      example.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Calling the function creates a generator object without running any of the body.
      - The first next() runs the body from the top until the first yield, which hands its value to the caller.
      - At a yield the function is paused, not finished - its local variables (like n) are kept.
      - The next next() resumes right after the yield; when the body ends, next() raises StopIteration.
    modelAnswer: |
      `gen = countdown(2)` only creates a generator object; not a single line of countdown has run. The
      first `next(gen)` starts the body: it prints "start", checks n > 0 and reaches `yield n`, so next()
      returns 2 and the function pauses there — its frame, with n = 2, is kept inside the generator. The
      second `next(gen)` resumes immediately after the yield: n -= 1 makes n 1, the loop condition is still
      true, and `yield n` hands back 1 and pauses again. One more next() would let the loop end, print
      "done", and finish the function, which next() reports by raising StopIteration.

  - id: mcq-brackets
    type: mcq
    skill: recognition
    prompt: "What is the difference between `[n * n for n in nums]` and `(n * n for n in nums)`?"
    explanation: >-
      Square brackets make a list comprehension: all values are computed immediately and stored. Round
      brackets make a generator expression: a lazy, single-use iterator that computes each value when asked.
    options:
      - id: a
        text: The first builds a list of every value right away; the second creates a generator that computes values one at a time when asked.
        correct: true
        feedback: Right — eager list versus lazy, single-use generator.
      - id: b
        text: The second builds a tuple.
        feedback: There is no tuple comprehension. Round brackets around a comprehension create a generator; use tuple(...) to get a tuple.
      - id: c
        text: There is no difference; the brackets are a matter of style.
        feedback: The results behave differently — a list has len() and indexing and can be reused; a generator does not and cannot.
      - id: d
