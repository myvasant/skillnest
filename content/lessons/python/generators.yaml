  passThreshold: 0.8
  items: [m-predict-state, m-tf-body, m-mcq-big-file, m-code-chunked, m-debug-closed-file]

cheatsheet: |
  ```python
  def countdown(n):            # contains yield -> generator function
      while n > 0:
          yield n              # hand over n, pause here
          n -= 1

  gen = countdown(3)           # runs NOTHING yet
  next(gen)                    # 3 (runs to the first yield)
  list(gen)                    # [2, 1]  (then exhausted)

  squares = (x * x for x in nums)       # generator expression (lazy)
  total = sum(x * x for x in nums)      # no extra brackets needed

  from itertools import islice
  list(islice(endless(), 5))            # take 5 from an infinite generator

  def walk(nested):
      for item in nested:
          if isinstance(item, list):
              yield from walk(item)     # delegate
          else:
              yield item
  ```
  - Single-use · no len() / indexing · `print(gen)` shows the object, not values
  - Keep `with open(...)` INSIDE the generator function that reads the file
