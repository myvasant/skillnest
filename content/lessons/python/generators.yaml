  - id: debug-return-yield
    type: debug
    skill: debugging
    prompt: |
      `squares(n)` should be a generator producing `1, 4, 9, ..., n*n`, so the program prints
      `[1, 4, 9, 16]`. Instead it crashes with `TypeError: 'int' object is not iterable`. Fix the function.
    starterCode: |
      def squares(n):
          for i in range(1, n + 1):
              return i * i


      print(list(squares(4)))
    solution: |
      def squares(n):
          for i in range(1, n + 1):
              yield i * i


      print(list(squares(4)))
    expectedOutput: |
      [1, 4, 9, 16]
    tests:
      - name: produces the squares
        code: |
          assert list(squares(4)) == [1, 4, 9, 16], f"list(squares(4)) should be [1, 4, 9, 16], got {list(squares(4))!r}."
          assert list(squares(1)) == [1], "list(squares(1)) should be [1]."
      - name: squares is a generator function
        code: |
          import inspect
          assert inspect.isgeneratorfunction(squares), "squares should contain yield, so that calling it returns a generator."
    hints:
      - What does return do to a function — and to the loop inside it?
      - "return ends the function on the first pass and hands back one int; list() cannot loop over an int."
      - Replace return with yield.
    feedback:
      - when: { errorType: TypeError, errorMessageContains: "not iterable" }
        message: squares still returns a single int. Use yield to hand back each value and keep going.
      - when: { outputEquals: "[1]\n" }
        message: Only one value is produced. Is something still ending the function after the first value?
    explanation: >-
      return ends the function immediately, so the loop ran once and returned the int 1 — and list(1)
      fails. yield hands over a value and pauses, so the loop continues on the next request and every
      square is produced.

  - id: running-total
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a generator function `running_total(numbers)` that yields the running total after each number:
      for `[5, 3, 2]` it yields `5`, `8`, `10`. It must work lazily — even on an endless input.
    starterCode: |
      def running_total(numbers):
          # Keep a total; after adding each number, yield the total so far.
          pass


      print(list(running_total([5, 3, 2])))
    solution: |
      def running_total(numbers):
          total = 0
          for n in numbers:
              total += n
              yield total


      print(list(running_total([5, 3, 2])))
    expectedOutput: |
      [5, 8, 10]
    tests:
      - name: running totals of a list
        code: |
          assert list(running_total([5, 3, 2])) == [5, 8, 10], f"Got {list(running_total([5, 3, 2]))!r}."
          assert list(running_total([])) == [], "An empty input gives no totals."
      - name: is a generator function
        code: |
          import inspect
          assert inspect.isgeneratorfunction(running_total), "Use yield inside running_total so it is a generator function."
      - name: works on an endless input
        code: |
          from itertools import count, islice
          result = list(islice(running_total(count(1)), 4))
          assert result == [1, 3, 6, 10], f"The first four totals of 1, 2, 3, 4, ... should be [1, 3, 6, 10], got {result!r}. Yield as you go instead of building a list first."
    hints:
      - Start with total = 0, then loop over numbers.
      - After adding each number to total, yield total.
      - Don't build a list and return it — that would never finish on an endless input.
    feedback:
      - when: { outputEquals: "[10]\n" }
        message: Only the final total appears. Yield inside the loop, after each addition.
      - when: { errorType: TypeError, errorMessageContains: "NoneType" }
        message: running_total returned None. It needs a yield so that calling it creates a generator.
    explanation: >-
      The generator keeps total in its paused frame between values, so each yield reports the total so
      far. Because it never builds a list, islice can take the first few totals from an infinite input.

  - id: error-lines
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      Write a generator function `error_messages(path)` that opens the log file at `path` and yields, one
      at a time, the message part of every line that starts with `"ERROR "` — without the `"ERROR "` prefix
      and without the newline. Keep the file open only while the generator is running by putting the
      `with` statement **inside** the generator function.
    starterCode: |
      with open("app.log", "w", encoding="utf-8") as f:
          f.write("INFO boot\nERROR disk full\nWARN slow\nERROR timeout\n")


      def error_messages(path):
          # Open the file with `with`, loop over its lines, and yield the message of each ERROR line.
          pass


      for message in error_messages("app.log"):
          print(message)
    solution: |
      with open("app.log", "w", encoding="utf-8") as f:
          f.write("INFO boot\nERROR disk full\nWARN slow\nERROR timeout\n")


      def error_messages(path):
          with open(path, encoding="utf-8") as f:
              for line in f:
                  if line.startswith("ERROR "):
                      yield line.removeprefix("ERROR ").rstrip("\n")


      for message in error_messages("app.log"):
          print(message)
    expectedOutput: |
      disk full
      timeout
    tests:
      - name: yields the error messages
        code: |
          result = list(error_messages("app.log"))
          assert result == ["disk full", "timeout"], f"Expected ['disk full', 'timeout'], got {result!r}."
      - name: works for another file
        code: |
          with open("check.log", "w", encoding="utf-8") as setup:
              setup.write("ERROR a\nINFO ERROR not at the start\nERROR b c\n")
          result = list(error_messages("check.log"))
          assert result == ["a", "b c"], f"For the check file expected ['a', 'b c'], got {result!r}. Only lines that START with 'ERROR ' count."
      - name: is a lazy generator
        code: |
          import inspect
          assert inspect.isgeneratorfunction(error_messages), "error_messages must contain yield."
          gen = error_messages("app.log")
          assert next(gen) == "disk full", "The first value from the generator should be 'disk full'."
      - name: opens the file inside the generator with encoding
        code: |
          import ast
          tree = ast.parse(source)
          funcs = [n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "error_messages"]
          assert funcs and any(isinstance(n, ast.With) for n in ast.walk(funcs[0])), "Put the with open(...) statement inside error_messages."
          opens = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "open"]
          assert all(any(k.arg == "encoding" for k in n.keywords) for n in opens), 'Pass encoding="utf-8" to every open() call.'
    hints:
      - Inside the function, `with open(path, encoding="utf-8") as f:` and then `for line in f:`.
      - 'line.startswith("ERROR ") checks the prefix; line.removeprefix("ERROR ") removes it.'
      - Yield the message with .rstrip("\n") so the newline is gone.
    feedback:
      - when: { outputContains: "ERROR" }
        message: The "ERROR " prefix is still there. Remove it, for example with line.removeprefix("ERROR ").
      - when: { errorType: ValueError, errorMessageContains: "closed file" }
        message: >-
          The file was closed before the lines were read. Put the with statement inside the generator
          function and yield from within it, so the file stays open while values are requested.
    explanation: >-
      With the with statement inside the generator function, the file is opened on the first next() and
      stays open while the generator is paused between values; it closes when the loop over the file ends
      (or when the generator is closed). Only one line is in memory at a time, whatever the file's size.

  - id: parsons-pipeline
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines into a two-stage pipeline that prints the squares of the odd numbers below 8.
      One line is a distractor.
    solution: |
      def odds(limit):
          for n in range(limit):
              if n % 2 == 1:
                  yield n
      def squared(nums):
          for n in nums:
              yield n * n
      for value in squared(odds(8)):
          print(value)
    distractors:
      - "            return n"
    expectedOutput: |
      1
      9
      25
      49
    explanation: >-
      odds yields 1, 3, 5, 7 one at a time; squared consumes that generator and yields each square; the
      final for loop drives the pipeline. return n would end odds after its first value.

