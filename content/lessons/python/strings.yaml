  - id: m-predict-methods
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print? (Two lines.)
    code: |
      s = "  Banana Bread "
      t = s.strip().lower()
      print(t.count("a"), t.find("b"), t.find("x"))
      print(len(s), len(t))
    answer: |
      4 0 -1
      15 12
    explanation: >-
      t is "banana bread": three a's in banana plus one in bread makes 4; the first b is now at index 0
      (it was lower-cased); x is missing, so find gives -1. s itself was never changed by strip(), so it
      still has 15 characters, while t has 12.
    wrongAnswers:
      - answer: |
          4 -1 -1
          15 12
        feedback: t was lower-cased, so "Banana" became "banana" and a lower-case b is found at index 0.
      - answer: |
          4 0 -1
          12 12
        feedback: strip() returned a new string for t; s still has its spaces, so len(s) is 15.
      - answer: |
          3 0 -1
          15 12
        feedback: count() looks at the whole of t, including the a in "bread".

  - id: m-mcq-immutable
    type: mcq
    skill: explanation
    difficulty: 2
    prompt: |
      After `word = "hello"`, which single line changes the string object `"hello"` itself?
    explanation: >-
      No operation can change a string object. Methods return new strings, item assignment raises
      TypeError, and assignment only moves the name word to a different object.
    options:
      - id: a
        text: "`word.upper()`"
        feedback: upper() builds and returns a new string "HELLO"; the original is untouched (and here the new one is discarded).
      - id: b
        text: "`word[0] = \"H\"`"
        feedback: "This raises TypeError: 'str' object does not support item assignment."
      - id: c
        text: "`word = word.capitalize()`"
        feedback: This rebinds the NAME word to a new string "Hello". The object "hello" is unchanged; any other name referring to it would still see "hello".
      - id: d
        text: None of them — strings are immutable.
        correct: true
        feedback: Right. You can only create new strings and move names to them.

  - id: m-tf-case
    type: true-false
    skill: recognition
    prompt: |
      True or false: `"py" in "Python"` evaluates to `True`.
    answer: false
    explanation: >-
      in is case-sensitive. "Python" contains "Py" with a capital P, but not "py". To ignore case,
