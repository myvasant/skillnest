id: python.strings
concept: python.strings
title: Strings
subtitle: Working with text, one immutable character sequence at a time
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Strings are Python's type for text. Learn how to write them (quotes and escape sequences), read
  individual characters by index, combine them with + and *, transform them with methods such as
  strip(), replace() and split(), and why every one of those methods returns a new string instead of
  changing the old one.
objectives:
  - Create strings with single, double and triple quotes, and use escape sequences such as \n, \\ and \".
  - Read single characters with positive and negative indexes, and count characters with len().
  - Combine and repeat strings with + and *, and test for a substring with in.
  - Use upper, lower, strip, split, join, replace, find, startswith and count, and predict what each returns.
  - Explain why strings are immutable and why a method's result must be assigned to keep it.
  - Diagnose TypeError and IndexError messages caused by common string mistakes.
