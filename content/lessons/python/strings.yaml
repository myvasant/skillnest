  - id: m-code-words
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Given `sentence = "  Python   makes text   easy  "` (with untidy spacing), print two lines:

      ```text
      4 words
      Python|makes|text|easy
      ```

      The first line is the number of words; the second is the words joined by `|`. Your code must
      work for any sentence.
    starterCode: |
      sentence = "  Python   makes text   easy  "

    solution: |
      sentence = "  Python   makes text   easy  "
      words = sentence.split()
      print(len(words), "words")
      print("|".join(words))
    expectedOutput: |
      4 words
      Python|makes|text|easy
    tests:
      - name: Prints the count and the joined words
        code: |
          assert output_lines() == ["4 words", "Python|makes|text|easy"], f"Expected '4 words' and 'Python|makes|text|easy'. You printed {output()!r}."
      - name: Works for another sentence
        code: |
          import contextlib, io, re
          changed = re.sub(r"sentence\s*=\s*[\"'][^\"']*[\"']", 'sentence = " one  two "', source, count=1)
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buffer.getvalue() == "2 words\none|two\n", (
              f"With sentence = ' one  two ' you should print '2 words' and 'one|two', but got {buffer.getvalue()!r}. "
              "Split the sentence and count the pieces instead of typing the answer."
          )
    hints:
      - split() with no argument splits on any run of spaces and ignores spaces at the ends.
      - len() of the split result counts the words.
      - "\"|\".join(words) glues the words with | between them."
    feedback:
      - when: { outputContains: "||" }
        message: >-
          Empty pieces appear between the bars: split(" ") splits at every single space. Call split()
          with no argument instead.
    explanation: >-
      sentence.split() returns the four words without any of the extra spaces. len() counts them, and
      "|".join(...) puts a bar between each pair. Because everything comes from sentence, the same code
      works for any text.

  - id: m-debug-last-char
    type: debug
    skill: debugging
    prompt: |
      This program should print the last letter of `word` (`Last letter: n`) but crashes with an
      IndexError. Fix it so it works for any word.
    starterCode: |
      word = "python"
      last = word[len(word)]
      print("Last letter:", last)
    solution: |
      word = "python"
      last = word[-1]
      print("Last letter:", last)
    expectedOutput: |
      Last letter: n
    tests:
      - name: Prints the last letter
        code: |
          assert output() == "Last letter: n\n", f"Expected 'Last letter: n' but got {output()!r}."
      - name: Works for another word
        code: |
          import contextlib, io, re
          changed = re.sub(r"word\s*=\s*[\"']python[\"']", 'word = "strings"', source, count=1)
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buffer.getvalue() == "Last letter: s\n", (
              f"With word = 'strings' you should print 'Last letter: s', but got {buffer.getvalue()!r}. "
              "Use an index that always means 'the last character' instead of typing the letter."
          )
    hints:
      - "word has 6 characters. What are its first and last indexes?"
      - "The last index is len(word) - 1. Python also offers a shortcut: index -1."
    feedback:
      - when: { errorType: IndexError }
        message: >-
          Indexes start at 0, so len(word) is one past the end. Use len(word) - 1, or simply -1.
    explanation: >-
      A 6-character string has indexes 0 to 5, so word[6] (which is word[len(word)]) does not exist.
      word[-1] — or word[len(word) - 1] — always refers to the last character.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-methods, m-mcq-immutable, m-tf-case, m-code-words, m-debug-last-char]

cheatsheet: |
  ```python
  s = "Hello"                 # or 'Hello' or """multi-line"""
  len(s)                      # 5
  s[0], s[-1]                 # 'H', 'o'      (s[5] -> IndexError)
  s + " world"                # concatenation: both sides must be str
  "ab" * 3                    # 'ababab'
  "ell" in s                  # True (case-sensitive)
  s.upper(); s.lower(); s.strip(); s.title()
  s.replace("l", "L")         # 'HeLLo'  (every occurrence)
  s.find("l"), s.count("l")   # 2, 2     (find gives -1 if missing)
  s.startswith("He")          # True
  "a b  c".split()            # ['a', 'b', 'c']
  "-".join(["a", "b"])        # 'a-b'
  s = s.upper()               # methods return NEW strings: assign to keep
  ```
  - Escapes: `\n` newline · `\t` tab · `\\` backslash · `\"` quote · raw string `r"C:\new"`
  - Strings are immutable: `s[0] = "J"` → TypeError
