sections:
  - id: why
    title: Why programs need text
    kind: why
    blocks:
      - type: markdown
        body: |
          Almost every real program handles text: names, email addresses, passwords, messages, file
          names, web pages. And text from the outside world is messy. People type extra spaces, use
          CAPS LOCK by accident, or mix upper and lower case.

          Here is a name exactly as someone typed it into a form. The square brackets are only there so
          you can see where the text starts and ends:
      - type: code
        runnable: true
        code: |
          raw_name = "   ada LOVELACE  "
          print("[" + raw_name + "]")

          clean_name = raw_name.strip().title()
          print("[" + clean_name + "]")
        expectedOutput: |
          [   ada LOVELACE  ]
          [Ada Lovelace]
        caption: One line of string methods turns messy input into tidy, consistent text.
        annotations:
          - line: 4
            text: "`strip()` removes the spaces at both ends; `title()` capitalises the first letter of each word."
      - type: markdown
        body: |
          Without string tools you would have to fix every name by hand. With them, the program cleans
          *any* name the same way. A [string](glossary:string) — type `str` — is Python's type for text.
          This lesson covers how to write strings, read their characters, combine them, and transform
          them with methods.

  - id: creating
    title: Writing strings with quotes
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **string literal** is text written directly in your code between quotes. Python accepts
          single quotes `'...'` and double quotes `"..."` — they create exactly the same kind of value.
          Pick whichever means you don't have to escape anything inside: double quotes for text that
          contains an apostrophe, single quotes for text that contains double quotes.

          The quotes are **not** part of the value. They only tell Python where the text starts and ends.
      - type: code
        runnable: true
        code: |
          greeting = "Hello"
          reply = 'Hi there'
          sentence = "It's sunny"
          quote = 'She said "yes"'
          empty = ""

          print(greeting, reply)
          print(sentence)
          print(quote)
          print(type(empty))
        expectedOutput: |
          Hello Hi there
          It's sunny
          She said "yes"
          <class 'str'>
        annotations:
          - line: 3
            text: The apostrophe is safe inside double quotes.
          - line: 5
            text: The empty string contains zero characters. It is still a str.
      - type: markdown
        body: |
          **Triple quotes** (`"""..."""` or `'''...'''`) let a string span several lines. The line breaks
          you type become part of the text:
      - type: code
        runnable: true
        code: |
          poem = """Roses are red,
          violets are blue."""
          print(poem)
        expectedOutput: |
          Roses are red,
          violets are blue.

  - id: escapes
    title: Escape sequences
    kind: concept
    blocks:
      - type: markdown
        body: |
          Some characters are awkward to type inside quotes: a line break, or the same quote that
          surrounds the string. An [escape sequence](glossary:escape-sequence) is a backslash `\`
          followed by a character, which together stand for **one** special character:

          | You write | You get |
          |---|---|
          | `\n` | a newline (line break) |
          | `\t` | a tab |
          | `\\` | one backslash |
          | `\'` | a single quote |
          | `\"` | a double quote |
      - type: code
        runnable: true
        code: |
          print("Line 1\nLine 2")
          print('It\'s fine')
          print("She said \"hi\"")
          print("A backslash: \\")
          print(len("\n"))
        expectedOutput: |
          Line 1
          Line 2
          It's fine
          She said "hi"
          A backslash: \
          1
        annotations:
          - line: 5
            text: "`len()` counts characters. The two symbols `\\n` in your code are a single newline character in the string."
      - type: callout
        variant: warning
        title: Windows paths and the backslash trap
        body: |
          `print("C:\new_data")` prints `C:` and then `ew_data` on the next line, because `\n` became a
          newline. Write the backslash twice (`"C:\\new_data"`) or use a
          [raw string](glossary:raw-string), `r"C:\new_data"`, in which backslashes have no special
          meaning. Since Python 3.12, a backslash followed by a character that is *not* a known escape
          (such as `"\d"`) produces a `SyntaxWarning`, and a future version will make it an error.
      - type: code
        runnable: true
        code: |
          print("C:\new_data")
          print("C:\\new_data")
          print(r"C:\new_data")
        expectedOutput: |
          C:
          ew_data
          C:\new_data
          C:\new_data
        caption: Run it and compare the three lines. Only the first one is wrong.
      - type: item
        ref: predict-escape

  - id: indexing
    title: Characters, positions and len()
    kind: concept
    blocks:
      - type: markdown
        body: |
          A string is a **sequence**: an ordered row of characters. Each character has a position
          number called an **index**, and indexes **start at 0**. Negative indexes count backwards from
          the end, so `-1` is always the last character.

          ```text
           character:   P    y    t    h    o    n
           index:       0    1    2    3    4    5
           negative:   -6   -5   -4   -3   -2   -1
          ```

          Write the index in square brackets after the string: `word[0]`. The built-in function
          `len()` returns how many characters a string has. Because counting starts at 0, the last
          index is always `len(word) - 1`.
      - type: code
        runnable: true
        code: |
          word = "Python"
          print(word[0], word[1], word[5])
          print(word[-1], word[-2])
          print(len(word))
          print(word[len(word) - 1])
        expectedOutput: |
          P y n
          n o
          6
          n
        annotations:
          - line: 2
            text: The first character is at index 0, not 1.
          - line: 5
            text: len(word) is 6, so the last index is 5. word[6] would be an error.
      - type: markdown
        body: |
          Python has no separate "character" type: `word[0]` is simply a new string of length 1.

          Asking for a position that does not exist raises `IndexError: string index out of range`.
          You can also take a whole piece of a string at once — `word[0:3]` is `'Pyt'` (the stop
          position is excluded). That is called slicing, and it has its own lesson:
          [indexing and slicing](concept:python.slicing).
      - type: item
        ref: predict-index

  - id: combining
    title: Joining, repeating and searching with + * and in
    kind: concept
    blocks:
      - type: markdown
        body: |
          Three operators work on strings:

          - `+` **concatenates** ([concatenation](glossary:concatenation)): it glues two strings into a
            new, longer string. It adds nothing in between — not even a space.
          - `*` with an integer **repeats** a string: `"ha" * 3` is `"hahaha"`.
          - `in` asks "does this text appear inside that text?" and answers `True` or `False`. It is
            case-sensitive. (True and False get their own lesson:
            [booleans](concept:python.booleans).)
      - type: code
        runnable: true
        code: |
          first = "Ada"
          last = "Lovelace"
          full = first + " " + last
          print(full)
          print(first + last)
          print("ha" * 3)
          print("=" * 12)
          print("Love" in full, "love" in full)
        expectedOutput: |
          Ada Lovelace
          AdaLovelace
          hahaha
          ============
          True False
        annotations:
          - line: 3
            text: The space has to be added explicitly as its own string.
          - line: 8
            text: '"love" with a lower-case l does not appear in "Ada Lovelace".'
      - type: callout
        variant: misconception
        title: '"+ will turn my number into text"'
        body: |
          `+` only joins a string to **another string**. Joining a number fails, because Python will not
          guess whether you meant addition or joining. `print()` with commas converts for you, and
          `str(36)` turns a number into text — you will learn more conversions in
          [type conversion](concept:python.type-conversion).
      - type: code
        runnable: true
        code: |
          age = 36
          print("Age: " + age)
        expectError: TypeError
        caption: "Read the last line of the error: TypeError: can only concatenate str (not \"int\") to str."
      - type: code
        runnable: true
        code: |
          age = 36
          print("Age: " + str(age))
          print("Age:", age)
        expectedOutput: |
          Age: 36
          Age: 36
        caption: Two fixes. str(age) creates the text "36"; print with a comma converts each value for display.

  - id: methods
    title: String methods
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **method** is a function that belongs to an object. You call it by writing a dot after the
          value, then the method name and parentheses: `text.upper()`. The method works on the string
          before the dot. Some methods need extra information inside the parentheses, such as
          `text.replace("old", "new")`.

          | Method | Returns | Example | Result |
          |---|---|---|---|
          | `upper()` / `lower()` | a copy in upper / lower case | `"Hi".upper()` | `'HI'` |
          | `title()` / `capitalize()` | a copy with words / only the first letter capitalised | `"ada BYRON".capitalize()` | `'Ada byron'` |
          | `strip()` | a copy without spaces, tabs and newlines at both ends | `"  hi \n".strip()` | `'hi'` |
          | `replace(old, new)` | a copy with **every** `old` replaced by `new` | `"a-b-c".replace("-", "+")` | `'a+b+c'` |
          | `find(sub)` | the index where `sub` first appears, or `-1` if it doesn't | `"banana".find("n")` | `2` |
          | `count(sub)` | how many times `sub` appears (without overlapping) | `"banana".count("a")` | `3` |
          | `startswith(p)` / `endswith(s)` | `True` or `False` | `"photo.jpg".endswith(".jpg")` | `True` |
          | `split(sep)` | the pieces between each `sep` | `"a,b,c".split(",")` | `['a', 'b', 'c']` |
          | `sep.join(pieces)` | one string with `sep` between the pieces | `"-".join(["a", "b"])` | `'a-b'` |

          Notice the word **copy** — no method changes the original string. More on that in the next
          section.
      - type: code
        runnable: true
        code: |
          email = "  Ada.Lovelace@Example.com \n"
          clean = email.strip().lower()
          print(clean)
          print(clean.find("@"))
          print(clean.count("."))
          print(clean.startswith("ada"))
          print(clean.replace("example.com", "groundwork.dev"))
        expectedOutput: |
          ada.lovelace@example.com
          12
          2
          True
          ada.lovelace@groundwork.dev
        annotations:
          - line: 2
            text: "Method chaining: strip() returns a new string, and lower() is called on that new string."
          - line: 4
            text: '"ada.lovelace" is 12 characters (indexes 0-11), so the @ is at index 12.'
      - type: markdown
        body: |
          `split()` and `join()` are a pair. `split()` breaks a string into pieces; with no argument it
          splits on any run of whitespace and ignores spaces at the ends. `join()` is called **on the
          separator** and glues pieces back together with that separator between them.

          The square brackets in the output show a [list](concept:python.lists) — an ordered collection
          you will study soon. For now, read `['a', 'b']` as "the pieces a and b".
      - type: code
        runnable: true
        code: |
          sentence = "learn python one step at a time"
          words = sentence.split()
          print(words)
          print(len(words))
          print("-".join(words))

          date = "2026-10-22"
          print(date.split("-"))
          print("/".join(date.split("-")))
        expectedOutput: |
          ['learn', 'python', 'one', 'step', 'at', 'a', 'time']
          7
          learn-python-one-step-at-a-time
          ['2026', '10', '22']
          2026/10/22
        annotations:
          - line: 4
            text: len() also works on lists — here it counts the words.
          - line: 9
            text: Split on one separator, join with another.
      - type: item
        ref: mcq-find

  - id: immutability
    title: "Mental model: strings never change"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Strings are [immutable](glossary:immutable): once a string object exists, its characters can
          never be changed. Trying to replace one character fails:
      - type: code
        runnable: true
        code: |
          word = "jello"
          word[0] = "h"
        expectError: TypeError
        caption: "TypeError: 'str' object does not support item assignment."
      - type: markdown
        body: |
          So what does `upper()` do? It **builds a brand-new string** and returns it. The original stays
          exactly as it was. If you want to keep the result, you must give it a name — often the same
          name, which moves that label to the new object (exactly as in
          [variables](concept:python.variables)).
      - type: visualization
        component: python-tracer
        title: Methods create new objects
        caption: >-
          Step through slowly. Line 2 creates "ADA" but no name refers to it, so it is thrown away.
          Line 3 keeps a new "ADA" under the name shout. Line 4 moves the label name to a new string,
          "Ada" — the object "ada" itself never changed.
        props:
          code: |
            name = "ada"
            name.upper()
            shout = name.upper()
            name = name.capitalize()
            print(name, shout)
      - type: callout
        variant: analogy
        title: Printed labels, not a whiteboard
        body: |
          A string is like a printed label, not a whiteboard. You cannot rub out one letter. To "change"
          it you print a new label and move the name tag onto it. That is why the fix for `"jello"` is
          `word = "h" + word[1:]` (a slice: everything from index 1 onwards) or
          `word = word.replace("j", "h")` — both build a new string and rebind `word`.
      - type: item
        ref: predict-immutable
      - type: item
        ref: explain-immutable

  - id: worked-example
    title: "Worked example: cleaning a message"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A common pattern is to clean text in several small steps, rebinding the same name each time.
          Watch the name `message` move to a new object after every step:
      - type: visualization
        component: python-tracer
        title: One name, a new string at every step
        caption: Each method returns a new string. Rebinding message keeps the newest version; loud is a separate object.
        props:
          code: |
            message = "  I love Java!  "
            message = message.strip()
            message = message.replace("Java", "Python")
            loud = message.upper()
            print(message)
            print(loud)
      - type: markdown
        body: |
          Once the text is clean, other methods answer questions about it. Note how `len()` and `*`
          combine to draw an underline exactly as long as the text:
      - type: code
        runnable: true
        code: |
          message = "  I love Java. Java is great!  "
          message = message.strip()
          message = message.replace("Java", "Python")
          print(message)
          print(message.count("Python"), "mentions")
          print(message.upper().startswith("I LOVE"))
          print("-" * len(message))
        expectedOutput: |
          I love Python. Python is great!
          2 mentions
          True
          -------------------------------
        annotations:
          - line: 3
            text: replace() changes every occurrence, not just the first.
          - line: 6
            text: Comparing upper-case versions is a simple way to ignore case.
          - line: 7
            text: The cleaned message has 31 characters, so 31 dashes are printed.

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Characters are Unicode code points.** Every character has a number in the Unicode standard:
          `ord("A")` is 65 and `chr(8364)` is `'€'`. `len()` counts these code points — not bytes, and
          not always what a human sees as "one letter". An accented é can be stored as one code point
          (U+00E9) or as a plain e followed by a combining accent (U+0301). Both *look* like "café", but
          they have different lengths and are not `==`. `unicodedata.normalize()` converts text to one
          consistent form. When text is saved or sent over a network it is encoded to bytes, usually as
          [UTF-8](glossary:utf-8), where one code point takes 1 to 4 bytes.
      - type: code
        runnable: true
        code: |
          import unicodedata

          print(ord("A"), ord("a"), chr(8364))
          composed = "caf\u00e9"
          decomposed = "cafe\u0301"
          print(len(composed), len(decomposed))
          print(composed == decomposed)
          print(unicodedata.normalize("NFC", decomposed) == composed)
          print(len(composed.encode("utf-8")))
        expectedOutput: |
          65 97 €
          4 5
          False
          True
          5
        annotations:
          - line: 4
            text: "\\u00e9 is an escape for the code point U+00E9 (é)."
          - line: 9
            text: In UTF-8, é needs two bytes, so 4 characters become 5 bytes.
      - type: markdown
        body: |
          **How CPython stores them.** Since Python 3.3 ([PEP 393](https://peps.python.org/pep-0393/))
          CPython stores each string using 1, 2 or 4 bytes per character, chosen by the widest character
          in that string. Pure ASCII text is compact; a single emoji makes the whole string use 4 bytes
          per character. This is a CPython implementation detail — the language only promises a
          sequence of code points.

          **Why immutability is useful.** Because a string can never change, it is safe for many names
          to share one string object (aliasing is harmless), CPython can cache a string's hash, and
          strings can be used as [dictionary](concept:python.dictionaries) keys. CPython also *interns*
          some strings (for example, short identifier-like literals), reusing one object for equal
          text. That is why `is` sometimes appears to work on strings — never rely on it; compare text
          with `==`.

          **Building long strings.** Every `+` creates a new string and copies both parts into it.
          Building a large string by adding small pieces one at a time therefore copies the growing
          text over and over. CPython can sometimes extend a string in place for `s += t`, but
          [PEP 8](https://peps.python.org/pep-0008/#programming-recommendations) warns that this
          optimisation is fragile; when you have many pieces, collect them and call `"".join(pieces)`
          once (you will do this with [loops](concept:python.for-loops) and lists).

          **Two method gotchas.** `strip("abc")` removes any of the characters a, b and c from both
          ends — it does not remove the *word* "abc". To remove an exact prefix or suffix use
          `removeprefix()` / `removesuffix()` (Python 3.9+). And `title()` treats an apostrophe as the
          end of a word.
      - type: code
        runnable: true
        code: |
          url = "www.example.com"
          print(url.strip("w.moc"))
          print(url.removeprefix("www."))
          print("they're here".title())
        expectedOutput: |
          example
          example.com
          They'Re Here
        annotations:
          - line: 2
            text: Every w, ., m, o and c is stripped from both ends until another character is reached.

  - id: mistakes
    title: Common mistakes and how to fix them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: can only concatenate str (not "int") to str` | `"Age: " + 36` | Convert with `str(36)`, or pass both values to `print()` separated by a comma. |
          | `TypeError: 'str' object does not support item assignment` | `word[0] = "J"` — strings are immutable | Build a new string: `word = "J" + word[1:]` or use `replace()`. |
          | `IndexError: string index out of range` | Index is `len(s)` or more (or below `-len(s)`) | The last index is `len(s) - 1`; use `s[-1]` for the last character. |
          | Method "did nothing" | `name.upper()` on its own line | Assign the result: `name = name.upper()`. |
          | `SyntaxError: unterminated string literal` | Missing closing quote, or an apostrophe ending a single-quoted string | Match the quotes; use `"It's"` or `'It\'s'`. |
          | Output breaks onto a new line in a file path | `\n` inside `"C:\new"` | Use `\\` or a raw string `r"C:\new"`. |
          | `TypeError: can't multiply sequence by non-int of type 'float'` | `"ab" * 2.0` | Repeat counts must be integers. |
          | `find()` result used as an index picks the last character | `find()` returned `-1` (not found) | Check with `in` first, or test for `-1`. |
      - type: code
        runnable: true
        code: |
          word = "code"
          print(len(word))
          print(word[4])
        expectedOutput: |
          4
        expectError: IndexError
        caption: The string has 4 characters, at indexes 0 to 3. Index 4 is one past the end.

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          Try each exercise before opening the hints. The checks re-run your program with different
          text, so the code has to work in general — typing the expected answer will not pass.
      - type: item
        ref: debug-shout
      - type: item
        ref: code-badge
      - type: item
        ref: code-filename
      - type: item
        ref: parsons-greeting

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **string** (`str`) is an immutable sequence of characters, written in `'...'`, `"..."` or
            `"""..."""`. The quotes are not part of the value.
          - Escape sequences start with `\`: `\n` newline, `\t` tab, `\\` backslash, `\"` quote. Raw
            strings `r"..."` switch escapes off.
          - Indexes start at 0; `-1` is the last character; `len(s)` counts characters; the last index
            is `len(s) - 1`.
          - `+` joins strings (no automatic spaces), `*` repeats, `in` tests for a substring
            (case-sensitive).
          - Methods (`upper`, `strip`, `replace`, `split`, `join`, `find`, `count`, `startswith` …)
            **return new strings or answers**; the original never changes. Assign the result to keep it.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Why does `s.upper()` not change `s`?" — Strings are immutable; methods return new objects and
          `s` keeps referring to the old one until you rebind it. Strong answers add *why* immutability
          helps (safe sharing, hashable dictionary keys, cached hashes) and that building big strings is
          best done with `"".join(pieces)` rather than repeated `+`.

items:
  - id: predict-escape
    type: predict-output
    skill: prediction
    prompt: What does this print? Think about how many characters each string really contains.
    code: |
      print(len("a\nb"), "a\\nb")
    answer: |
      3 a\nb
    explanation: >-
      In "a\nb" the escape \n is ONE character (a newline), so the string is a, newline, b: 3
      characters. In "a\\nb" the escape \\ is one backslash, so the string contains a real backslash
      followed by the letter n — it prints as a\nb on one line.
    wrongAnswers:
      - answer: |
          4 a\nb
        feedback: >-
          The two symbols \ and n in your code produce a single newline character, so len("a\nb") is
          3, not 4.
      - answer: |
          3 a
          b
        feedback: >-
          "\\" is an escaped backslash. The second string contains a backslash and then an ordinary
          n, so no line break is printed.

  - id: predict-index
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      code = "A7-X9"
      print(code[1], code[-1], len(code))
    answer: "7 9 5"
    explanation: >-
      Indexes start at 0, so code[1] is the second character, "7". Index -1 is always the last
      character, "9". len() counts all five characters (A, 7, -, X, 9).
    wrongAnswers:
      - answer: "A 9 5"
        feedback: Index 1 is the SECOND character. The first character is code[0].
      - answer: "7 X 5"
        feedback: "-1 is the last character, not the second-to-last. code[-2] would be X."
      - answer: "7 9 4"
        feedback: len() counts characters starting from 1 — there are 5. Only indexes start at 0.

  - id: mcq-find
    type: mcq
    skill: recognition
    prompt: "What does `\"banana\".find(\"z\")` return?"
    explanation: >-
      find() returns the index of the first match, or -1 when the text does not appear at all. It does
      not raise an error (the similar index() method does).
    options:
      - id: a
        text: "-1"
        correct: true
        feedback: Correct. -1 means "not found". Be careful — -1 is also a valid index (the last character), so check for it before using it as one.
      - id: b
        text: "0"
        feedback: 0 would mean "found at the very start". "banana" starts with b, and there is no z at all.
      - id: c
        text: A ValueError
        feedback: That is what "banana".index("z") does. find() reports a missing substring with -1 instead.
      - id: d
        text: "False"
        feedback: find() answers "where?", so it returns a number. To ask "is it there?" use "z" in "banana", which gives False.

  - id: predict-immutable
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      city = "paris"
      city.upper()
      city.replace("p", "P")
      print(city)
    answer: "paris"
    explanation: >-
      Lines 2 and 3 each build a new string ("PARIS" and "Paris") and return it, but nothing keeps
      those results — no name is bound to them. city still refers to the original, unchanged "paris".
    wrongAnswers:
      - answer: "PARIS"
        feedback: upper() does not change city. It returns a new string, which line 2 throws away. Write city = city.upper() to keep it.
      - answer: "Paris"
        feedback: replace() also returns a new string without changing the original. Neither result was assigned to a name.

  - id: explain-immutable
    type: explain
    skill: explanation
    prompt: |
      A classmate writes `name.strip()` on its own line and is confused that `name` still has spaces.
      Explain what is happening and what they should write instead.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says that strings are immutable, so no method can change the existing string.
      - Explains that strip() builds and returns a NEW string.
      - Points out that the returned string was not assigned, so it was discarded.
      - Gives the fix, name = name.strip(), and says it rebinds name to the new string.
    modelAnswer: |
      Strings in Python are immutable — once created, their characters can never change. So strip()
      cannot remove spaces from the existing string; instead it builds a new string without them and
      returns it. Because the line doesn't assign that result to anything, the new string is thrown
      away and name still refers to the original. The fix is name = name.strip(): the right side
      produces the new string, and the assignment moves the name to it.

  - id: debug-shout
    type: debug
    skill: debugging
    prompt: |
      This program should print `HELLO, WORLD!` (no spaces at the start or before the `!`), but it
      prints the message unchanged. Fix it without changing the first line.
    starterCode: |
      message = "  hello, world  "
      message.strip()
      message.upper()
      print(message + "!")
    solution: |
      message = "  hello, world  "
      message = message.strip()
      message = message.upper()
      print(message + "!")
    expectedOutput: |
      HELLO, WORLD!
    tests:
      - name: Prints the cleaned, upper-case message
        code: |
          assert output() == "HELLO, WORLD!\n", f"Expected 'HELLO, WORLD!' but your program printed {output()!r}."
      - name: Works for any message
        code: |
          import contextlib, io
          original = '"  hello, world  "'
          assert original in source, 'Keep the first line exactly as it was: message = "  hello, world  "'
          changed = source.replace(original, '"  good morning "', 1)
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buffer.getvalue() == "GOOD MORNING!\n", (
              "With message = '  good morning ' your program should print 'GOOD MORNING!'. "
              "Transform the variable with strip() and upper() instead of typing the answer."
          )
    hints:
      - What does message.strip() return? Where does that returned value go?
      - Strings are immutable. Keep each result by assigning it, e.g. message = message.strip().
      - You can also chain the calls in one line - message = message.strip().upper()
    feedback:
      - when: { outputContains: "hello" }
        message: >-
          The text is still lower case: upper() returned a new string that was thrown away. Assign it:
          message = message.upper().
      - when: { outputContains: " !" }
        message: >-
          The spaces are still there: strip() returned a new string that was thrown away. Assign it:
          message = message.strip().
    explanation: >-
      strip() and upper() never change the string they are called on; they return new strings. The
      original program discarded both results. Assigning each result back to message (or chaining
      them, message = message.strip().upper()) keeps the transformed text.

  - id: code-badge
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A conference prints name badges from carelessly typed names. Given `first = "grace"` and
      `last = "HOPPER"`, create a variable `badge` that reads `G. Hopper`:

      - the **first letter** of `first`, in upper case,
      - then a full stop and a space,
      - then `last` with only its first letter capitalised.

      Print `badge`. Build it from `first` and `last` so it works for any name.
    starterCode: |
      first = "grace"
      last = "HOPPER"
      # Build badge from first and last, then print it.

    solution: |
      first = "grace"
      last = "HOPPER"
      badge = first[0].upper() + ". " + last.capitalize()
      print(badge)
    expectedOutput: |
      G. Hopper
    tests:
      - name: badge reads G. Hopper
        code: |
          assert defined("badge"), "Create a variable named badge."
          assert badge == "G. Hopper", f"badge should be 'G. Hopper', but it is {badge!r}."
      - name: Works for other names
        code: |
          import re
          changed = re.sub(r"first\s*=\s*[\"']grace[\"']", 'first = "alan"', source, count=1)
          changed = re.sub(r"last\s*=\s*[\"']HOPPER[\"']", 'last = "tURING"', changed, count=1)
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert ns.get("badge") == "A. Turing", (
              f"With first = 'alan' and last = 'tURING', badge should be 'A. Turing' but it was {ns.get('badge')!r}. "
              "Build badge from first and last instead of typing the letters."
          )
      - name: Prints the badge
        code: |
          assert output().strip() == "G. Hopper", f"Print badge. Your program printed {output()!r}."
    hints:
      - "first[0] is the first character of first. Which method makes it upper case?"
      - "capitalize() returns a copy with the first character upper case and all the others lower case."
      - "Join the three parts with +: first[0].upper() + \". \" + last.capitalize()"
    feedback:
      - when: { outputContains: "HOPPER" }
        message: last is still in capitals. capitalize() makes the first letter upper case and the rest lower case.
      - when: { outputContains: "g." }
        message: The initial is lower case. Call upper() on first[0].
      - when: { outputContains: "G.Hopper" }
        message: Add a space after the full stop - the middle part should be ". " (full stop, space).
    explanation: >-
      first[0] picks out "g", and .upper() turns it into "G". last.capitalize() gives "Hopper".
      Concatenating "G" + ". " + "Hopper" produces the badge. Because every part comes from the
      variables, the same line works for any name.

  - id: code-filename
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Phones create messy file names. Given `filename = "  Holiday Photo.JPG "`, create `clean`:

      1. no spaces at the start or end,
      2. all lower case,
      3. every remaining space replaced by an underscore `_`.

      Print `clean`, then on the next line print whether `clean` ends with `.jpg` (use a method, so
      Python prints `True` or `False`). Expected output:

      ```text
      holiday_photo.jpg
      True
      ```
    starterCode: |
      filename = "  Holiday Photo.JPG "

    solution: |
      filename = "  Holiday Photo.JPG "
      clean = filename.strip().lower().replace(" ", "_")
      print(clean)
      print(clean.endswith(".jpg"))
    expectedOutput: |
      holiday_photo.jpg
      True
    tests:
      - name: clean is holiday_photo.jpg
        code: |
          assert defined("clean"), "Create a variable named clean."
          assert clean == "holiday_photo.jpg", f"clean should be 'holiday_photo.jpg', but it is {clean!r}."
      - name: Prints the name and the check
        code: |
          assert output_lines() == ["holiday_photo.jpg", "True"], f"Expected two lines, holiday_photo.jpg and True. You printed {output()!r}."
      - name: Works for other files
        code: |
          import contextlib, io, re
          changed = re.sub(r"filename\s*=\s*[\"'][^\"']*[\"']", 'filename = " My Report.PDF"', source, count=1)
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buffer.getvalue() == "my_report.pdf\nFalse\n", (
              f"With filename = ' My Report.PDF' you should print my_report.pdf and False, but got {buffer.getvalue()!r}. "
              "Compute both lines from filename with methods."
          )
    hints:
      - Do the three steps in order. Which method removes spaces at the ends? Which lowers the case?
      - "replace(\" \", \"_\") swaps every space for an underscore — but strip first, or the end spaces become underscores too."
      - The check is clean.endswith(".jpg").
    feedback:
      - when: { outputContains: "__" }
        message: >-
          There are underscores at the ends: the spaces were replaced before they were stripped. Call
          strip() first, then replace().
      - when: { outputContains: ".JPG" }
        message: Lower-case the name before checking, so .JPG becomes .jpg.
    explanation: >-
      Chaining strip(), lower() and replace() applies the three steps in order, each producing a new
      string. endswith(".jpg") then answers True or False. Order matters: replacing before stripping
      would turn the outer spaces into underscores.

