sections:
  - id: two-types
    title: Two kinds of number
    kind: concept
    blocks:
      - type: markdown
        body: |
          Python's everyday numbers come in two [types](glossary:type):

          - **`int`** — whole numbers: `-3`, `0`, `42`, `10_000_000` (underscores are allowed for
            readability). Python integers have **no fixed size limit**; they grow as large as memory allows.
          - **`float`** — numbers with a fractional part, written with a decimal point or exponent:
            `3.14`, `2.0`, `1.5e3` (= 1500.0). Floats are stored in 64-bit binary format, so they have about
            15–17 significant digits and are often **approximations**.
      - type: code
        runnable: true
        code: |
          print(type(7), type(7.0))
          print(2 ** 100)
          print(1.5e3)
        expectedOutput: |
          <class 'int'> <class 'float'>
          1267650600228229401496703205376
          1500.0
        annotations:
          - line: 2
            text: An exact 31-digit integer. Many languages would overflow here; Python does not.

  - id: operators
    title: The arithmetic operators
    kind: concept
    blocks:
      - type: markdown
        body: |
          | Operator | Meaning | Example | Result |
          |---|---|---|---|
          | `+` | add | `7 + 2` | `9` |
          | `-` | subtract | `7 - 2` | `5` |
          | `*` | multiply | `7 * 2` | `14` |
          | `/` | true division — **always a float** | `7 / 2` | `3.5` |
          | `//` | floor division — round **down** | `7 // 2` | `3` |
          | `%` | remainder (modulo) | `7 % 2` | `1` |
          | `**` | power | `7 ** 2` | `49` |

          **Type rules:** an operation on two ints gives an int (except `/`, which always gives a float).
          If either operand is a float, the result is a float.
      - type: code
        runnable: true
        code: |
          print(10 / 2)
          print(10 // 3, 10 % 3)
          print(2 + 1.0)
          print(9 ** 0.5)
        expectedOutput: |
          5.0
          3 1
          3.0
          3.0
        annotations:
          - line: 1
            text: Even when it divides evenly, / returns a float (5.0, not 5).
          - line: 2
            text: 10 = 3 × 3 + 1, so the quotient is 3 and the remainder 1.
          - line: 4
            text: A fractional power is a square root.
      - type: item
        ref: predict-types

  - id: floor-mod
    title: Floor division and remainder
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          `//` and `%` always satisfy one identity:

          ```text
          a == (a // b) * b + (a % b)
          ```

          `//` rounds **toward negative infinity** (it "floors"), not toward zero. With positive numbers
          you won't notice the difference; with negatives you will:
      - type: code
        runnable: true
        code: |
          print(7 // 2, 7 % 2)
          print(-7 // 2, -7 % 2)
          print(int(-7 / 2))
        expectedOutput: |
          3 1
          -4 1
          -3
        annotations:
          - line: 2
            text: -3.5 floors to -4, and -4 × 2 + 1 = -7, so the remainder is 1.
          - line: 3
            text: int() truncates toward zero instead, giving -3. Different rule, different answer.
      - type: markdown
        body: |
          **Why `%` is useful:**

          - `n % 2 == 0` tests whether `n` is even.
          - `n % 10` gives the last digit of a positive integer; `n // 10` drops it.
          - Converting units: 135 minutes is `135 // 60` hours and `135 % 60` minutes.
      - type: code
        runnable: true
        code: |
          minutes = 135
          hours = minutes // 60
          remaining = minutes % 60
          print(hours, "h", remaining, "min")
        expectedOutput: |
          2 h 15 min

  - id: precedence
    title: Operator precedence
    kind: concept
    blocks:
      - type: markdown
        body: |
          When an expression has several operators, Python applies them in a fixed
          [precedence](glossary:operator-precedence) order — the same as school maths:

          1. Parentheses `( )`
          2. Exponent `**` (groups right to left: `2 ** 3 ** 2` is `2 ** 9`)
          3. Unary minus `-x`
          4. `*`, `/`, `//`, `%` (left to right)
          5. `+`, `-` (left to right)

          When in doubt, **add parentheses**. They cost nothing and make your intent obvious to readers.
      - type: code
        runnable: true
        code: |
          print(2 + 3 * 4)
          print((2 + 3) * 4)
          print(-2 ** 2)
          print(2 ** 3 ** 2)
        expectedOutput: |
          14
          20
          -4
          512
        annotations:
          - line: 3
            text: "** binds tighter than unary minus: this is -(2 ** 2). Write (-2) ** 2 for 4."
          - line: 4
            text: "Right to left: 3 ** 2 = 9 first, then 2 ** 9 = 512."
      - type: item
        ref: predict-precedence

  - id: floats
    title: Why 0.1 + 0.2 is not 0.3
    kind: internals
    blocks:
      - type: code
        runnable: true
        code: |
          print(0.1 + 0.2)
          print(0.1 + 0.2 == 0.3)
        expectedOutput: |
          0.30000000000000004
          False
      - type: markdown
        body: |
          This is not a Python bug; every language using standard binary floating point behaves the same.
          Just as 1/3 cannot be written exactly in decimal (0.3333…), 1/10 cannot be written exactly in
          binary. The stored values are extremely close to 0.1, 0.2 and 0.3, but not identical, so the
          sum differs from the stored 0.3 in the last bit.

          **Practical habits:**

          - Never compare floats with `==` after arithmetic. Use `math.isclose(a, b)`.
          - Use `round(x, 2)` when *displaying* results.
          - For money, work in whole units (paise, cents) as ints, or use the `decimal` module.
      - type: code
        runnable: true
        code: |
          import math

          total = 0.1 + 0.2
          print(math.isclose(total, 0.3))
          print(round(total, 2))

          price_paise = 1999          # store money as whole paise
          print(price_paise * 3 / 100)
        expectedOutput: |
          True
          0.3
          59.97
      - type: callout
        variant: deep-dive
        title: round() uses banker's rounding
        depth: deep
        body: |
          `round(2.5)` is `2` and `round(3.5)` is `4`: ties go to the nearest **even** number, which
          avoids a systematic upward bias when rounding many values. Also, `round(2.675, 2)` gives `2.67`
          because 2.675 is actually stored as 2.67499999… Use `decimal.Decimal` when exact decimal
          rounding rules matter.
      - type: item
        ref: tf-float-equality

  - id: builtins
    title: Useful built-in functions
    kind: concept
    blocks:
      - type: code
        runnable: true
        code: |
          print(abs(-8))
          print(min(4, 9, 2), max(4, 9, 2))
          print(round(3.14159, 2))
          print(int(9.99), float(3))
          print(divmod(17, 5))
        expectedOutput: |
          8
          2 9
          3.14
          9 3.0
          (3, 2)
        annotations:
          - line: 4
            text: int() of a float truncates toward zero — it does not round.
          - line: 5
            text: divmod(a, b) returns (a // b, a % b) together.

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: item
        ref: celsius
      - type: item
        ref: split-bill
      - type: item
        ref: debug-average

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `int` = exact whole numbers of any size; `float` = 64-bit binary approximations.
          - `/` always returns a float; `//` floors; `%` is the remainder; `**` is power.
          - `a == (a // b) * b + a % b` always holds; `//` rounds toward negative infinity.
          - Precedence: `()` → `**` → unary `-` → `* / // %` → `+ -`. Use parentheses for clarity.
          - Don't use `==` on computed floats; use `math.isclose`. Store money as integer units.

items:
  - id: predict-types
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      print(8 / 4, 8 // 4, 8.0 // 4)
    answer: "2.0 2 2.0"
    explanation: >-
      `/` always produces a float (2.0). `//` on two ints gives an int (2). If either operand is a float,
      `//` gives a float (2.0).
    wrongAnswers:
      - answer: "2 2 2"
        feedback: True division `/` always returns a float, even when the result is whole.
      - answer: "2.0 2 2"
        feedback: When either operand is a float, the result is a float — 8.0 // 4 is 2.0.

  - id: predict-precedence
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      print(10 - 4 / 2 * 3)
    answer: "4.0"
    explanation: >-
      `/` and `*` come before `-` and run left to right: 4 / 2 = 2.0, then 2.0 * 3 = 6.0, then
      10 - 6.0 = 4.0. The result is a float because `/` produced a float.
    wrongAnswers:
      - answer: "4"
        feedback: The value is right, but `/` produced a float, so the final result is 4.0.
      - answer: "9.0"
        feedback: "Multiplication and division run left to right: (4 / 2) * 3, not 4 / (2 * 3)."
      - answer: "9.333333333333334"
        feedback: Subtraction happens last; 10 - 4 is not computed first.

  - id: tf-float-equality
    type: true-false
    skill: recognition
    prompt: "True or false: `0.1 * 3 == 0.3` evaluates to True in Python."
    answer: false
    explanation: >-
      0.1 * 3 is 0.30000000000000004 in binary floating point, which is not equal to the float closest to
      0.3. Use math.isclose(0.1 * 3, 0.3) for comparisons like this.

  - id: celsius
    type: code
    skill: implementation
    prompt: |
      Convert a temperature. Create `celsius = 25`, compute `fahrenheit` with the formula
      F = C × 9 / 5 + 32, and print `fahrenheit`.
    starterCode: |
      celsius = 25
    solution: |
      celsius = 25
      fahrenheit = celsius * 9 / 5 + 32
      print(fahrenheit)
    expectedOutput: |
      77.0
    tests:
      - name: fahrenheit is correct
        code: |
          assert defined("fahrenheit"), "Create a variable named fahrenheit."
          assert fahrenheit == 77.0, f"fahrenheit should be 77.0, got {fahrenheit!r}"
      - name: uses the formula, not the answer
        code: |
          assert "celsius" in source.split("fahrenheit", 1)[1], "Compute fahrenheit from celsius using the formula."
      - name: prints it
        code: |
          assert output().strip() == "77.0", f"Print fahrenheit. Output was {output()!r}"
    hints:
      - "Translate the formula directly: celsius * 9 / 5 + 32."
      - Precedence handles it — multiplication and division happen before + 32.
    feedback:
      - when: { outputEquals: "77\n" }
        message: Close! But `/` always produces a float, so the expected value is 77.0. Did you use //?
    explanation: 25 * 9 / 5 + 32 = 45.0 + 32 = 77.0. The `/` makes the result a float.

  - id: split-bill
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Friends share a restaurant bill. Each person pays the same **whole** number of rupees, and whatever
      cannot be split evenly is left as a tip. With `bill = 1000` and `people = 3`, compute `each` and
      `tip`, then print them on one line: `333 1`. Your formulas must work for any bill.
    starterCode: |
      bill = 1000
      people = 3
    solution: |
      bill = 1000
      people = 3
      each = bill // people
      tip = bill % people
      print(each, tip)
    expectedOutput: |
      333 1
    tests:
      - name: each is the whole-number share
        code: |
          assert each == 333 and isinstance(each, int), f"each should be the int 333, got {each!r}"
      - name: tip is the remainder
        code: |
          assert tip == 1, f"tip should be 1, got {tip!r}"
      - name: works for other bills
        code: |
          import re
          changed = re.sub(r"bill\s*=\s*1000", "bill = 1250", source, count=1)
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert (ns["each"], ns["tip"]) == (416, 2), "Your formulas should work for any bill, not just 1000."
      - name: prints each and tip
        code: |
          assert output().strip() == "333 1", f"Output was {output()!r}"
    hints:
      - Which operator gives a whole-number quotient?
      - Which operator gives what is left over?
    feedback:
      - when: { outputContains: "333.3" }
        message: "`/` gives a fractional result. Use `//` for a whole-number share."
    explanation: >-
      Floor division gives each person's whole share (1000 // 3 = 333) and the remainder operator gives
      what is left (1000 % 3 = 1). Because the formulas use the variables, they work for any bill.

  - id: debug-average
    type: debug
    skill: debugging
    prompt: |
      This program should print the average of three scores, `80.0`, but prints something else. Fix it.
    starterCode: |
      a = 70
      b = 80
      c = 90
      average = a + b + c / 3
      print(average)
    solution: |
      a = 70
      b = 80
      c = 90
      average = (a + b + c) / 3
      print(average)
    expectedOutput: |
      80.0
    tests:
      - name: prints 80.0
        code: |
          assert output().strip() == "80.0", f"Expected 80.0, got {output()!r}"
      - name: uses the variables
        code: |
          assert all(name in source.split("average", 1)[1] for name in "abc"), "Compute average from a, b and c."
    hints:
      - Which operation does Python perform first in `a + b + c / 3`?
      - Parentheses force the addition to happen before the division.
    feedback:
      - when: { outputEquals: "180.0\n" }
        message: Only c is being divided by 3. Precedence means / runs before +. Group the sum with parentheses.
    explanation: >-
      Division binds tighter than addition, so the original computed 70 + 80 + (90 / 3) = 180.0.
      Parentheses make the sum happen first: (70 + 80 + 90) / 3 = 80.0.

  - id: m-predict-floor
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      print(-9 // 4, -9 % 4)
    answer: "-3 3"
    explanation: >-
      -9 / 4 = -2.25, which floors (toward negative infinity) to -3. The remainder satisfies
      -3 * 4 + r = -9, so r = 3.
    wrongAnswers:
      - answer: "-2 -1"
        feedback: That is truncation toward zero (how some other languages work). Python's // floors toward negative infinity, giving -3; the remainder then has the sign of the divisor.

  - id: m-mcq-money
    type: mcq
    skill: design
    difficulty: 2
    prompt: You are writing code that adds up thousands of prices in rupees and paise. Which approach avoids rounding errors?
    explanation: >-
      Integers are exact. Storing amounts as whole paise (or using decimal.Decimal) avoids the binary
      approximation errors that accumulate with floats.
    options:
      - id: a
        text: Store prices as floats and compare totals with ==.
        feedback: Floats accumulate tiny errors, and == on computed floats is unreliable.
      - id: b
        text: Store prices as integer paise (e.g. 1999 for ₹19.99) and convert only for display.
        correct: true
        feedback: Exactly. Integer arithmetic is exact; divide by 100 only when showing the value.
      - id: c
        text: Round every float to 2 decimals after each operation.
        feedback: That reduces but doesn't eliminate the problem, and round() itself works on binary approximations.
      - id: d
        text: Use ** instead of * for multiplication.
        feedback: "** is exponentiation, a different operation."

  - id: m-code-seconds
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Given `total_seconds = 7384`, compute `hours`, `minutes` and `seconds` (the clock-style breakdown)
      and print them on one line: `2 3 4`.
    starterCode: |
      total_seconds = 7384
    solution: |
      total_seconds = 7384
      hours = total_seconds // 3600
      minutes = total_seconds % 3600 // 60
      seconds = total_seconds % 60
      print(hours, minutes, seconds)
    expectedOutput: |
      2 3 4
    tests:
      - name: correct breakdown
        code: |
          assert (hours, minutes, seconds) == (2, 3, 4), f"Got {(hours, minutes, seconds)}"
      - name: works for another value
        code: |
          import re
          changed = re.sub(r"total_seconds\s*=\s*7384", "total_seconds = 3661", source, count=1)
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert (ns["hours"], ns["minutes"], ns["seconds"]) == (1, 1, 1), "Use // and % on total_seconds so it works for any value."
      - name: prints them
        code: |
          assert output().strip() == "2 3 4", f"Output was {output()!r}"
    hints:
      - There are 3600 seconds in an hour.
      - After removing whole hours (with %), how many whole minutes are left?
    explanation: >-
      7384 // 3600 = 2 hours; 7384 % 3600 = 184 seconds remain; 184 // 60 = 3 minutes; 7384 % 60 = 4
      seconds.

  - id: m-predict-mixed
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      print(3 * 2.0, 7 // 2 * 2, 2 ** -1)
    answer: "6.0 6 0.5"
    explanation: >-
      3 * 2.0 involves a float, so the result is 6.0. 7 // 2 is 3, times 2 is 6 (all ints). A negative
      exponent gives a reciprocal: 2 ** -1 = 0.5.
    wrongAnswers:
      - answer: "6 6 0.5"
        feedback: Any operation involving a float produces a float, so 3 * 2.0 is 6.0.
      - answer: "6.0 7 0.5"
        feedback: "7 // 2 is 3 — the .5 is floored away — so 3 * 2 = 6, not 7."

  - id: m-debug-digit
    type: debug
    skill: debugging
    prompt: |
      This program should print the **last digit** of `number` (which is 7) but prints `482.7`. Fix the
      calculation so it works for any positive integer.
    starterCode: |
      number = 4827
      last_digit = number / 10
      print(last_digit)
    solution: |
      number = 4827
      last_digit = number % 10
      print(last_digit)
    expectedOutput: |
      7
    tests:
      - name: prints 7
        code: |
          assert output().strip() == "7", f"Expected 7, got {output()!r}"
      - name: works for other numbers
        code: |
          import re
          changed = re.sub(r"number\s*=\s*4827", "number = 1905", source, count=1)
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert ns["last_digit"] == 5, "Compute the last digit from number with an operator, so it works for any value."
    hints:
      - Dividing by 10 shifts the decimal point. Which operator gives what is *left over* after dividing by 10?
    feedback:
      - when: { outputEquals: "482\n" }
        message: "`//` drops the last digit. You want the remainder instead."
    explanation: >-
      The remainder after dividing by 10 is the last digit: 4827 % 10 = 7. `/` gives 482.7 and `//` gives
      482 — both remove the digit rather than isolating it.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-floor, m-predict-mixed, m-mcq-money, m-code-seconds, m-debug-digit]

cheatsheet: |
  ```python
  7 / 2    # 3.5   true division -> float
  7 // 2   # 3     floor division
  7 % 2    # 1     remainder
  2 ** 10  # 1024  power
  -7 // 2  # -4    floors toward -infinity
  math.isclose(0.1 + 0.2, 0.3)   # True; == would be False
  round(3.14159, 2)              # 3.14
  divmod(17, 5)                  # (3, 2)
  ```
  Precedence: () → ** → unary - → * / // % → + -
