id: python.numbers
concept: python.numbers
title: Numbers and Arithmetic
subtitle: Integers, floats, operators and precision
estimatedMinutes: 35
reviewedOn: 2026-10-22
summary: >-
  Python's two everyday number types, every arithmetic operator, the order in which operators run, and
  why 0.1 + 0.2 is not exactly 0.3 — with the practical habits that keep calculations correct.
objectives:
  - Distinguish int and float values and predict which type an operation produces.
  - Use + - * / // % ** correctly, including floor division and remainder with negative numbers.
  - Apply operator precedence and use parentheses to make intent explicit.
  - Explain floating-point imprecision and compare floats safely with round() or math.isclose().
  - Solve small real-world problems (unit conversion, splitting, even/odd checks) with arithmetic.
sources:
  - title: "Built-in Types: Numeric Types — int, float, complex"
    url: https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex
    publisher: Python Software Foundation
  - title: "Python Language Reference: Operator precedence"
    url: https://docs.python.org/3/reference/expressions.html#operator-precedence
    publisher: Python Software Foundation
  - title: "Floating-Point Arithmetic: Issues and Limitations"
    url: https://docs.python.org/3/tutorial/floatingpoint.html
    publisher: Python Software Foundation
