id: python.debugging
concept: python.debugging
title: Debugging Techniques
subtitle: A systematic method instead of guessing
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Debugging is a skill with a method: reproduce the bug, read the error, form a hypothesis, isolate the
  cause, inspect the program's state, fix the cause and add a test so it stays fixed. Learn print
  debugging done well with f"{x=}", assertions, the pdb debugger and breakpoint(), rubber-duck
  debugging, minimal reproducible examples and the bug patterns that cause most beginner bugs.
objectives:
  - Apply a systematic debugging method - reproduce, read, hypothesise, isolate, inspect, fix, prevent - instead of changing code at random.
  - Inspect program state with labelled print debugging (f"{x=}", repr) and with a step-through debugger.
  - Use assert statements to check assumptions and write small tests that catch regressions.
  - Describe how to use breakpoint() and the main pdb commands.
  - Reduce a bug to a minimal reproducible example and write a useful bug report.
  - Recognise and fix common bug patterns - off-by-one, wrong indentation, mutating while iterating, aliasing, shadowing and string/number confusion.
