  - id: write-boundary-tests
    type: code
    skill: design
    difficulty: 3
    prompt: |
      `grade(score)` below is correct. Your job is step 7 of the method - **prevent**. Extend
      `test_grade()` with `assert` statements so that it **passes** for this correct `grade`, but would
      **fail** if someone later introduced a boundary bug, such as changing `>= 90` to `> 90` or `>= 75`
      to `> 75`, or forgetting the `"C"` case. Use at least four asserts.
    starterCode: |
      def grade(score):
          if score >= 90:
              return "A"
          if score >= 75:
              return "B"
          return "C"

      def test_grade():
          assert grade(95) == "A"

      test_grade()
      print("all tests passed")
    solution: |
      def grade(score):
          if score >= 90:
              return "A"
          if score >= 75:
              return "B"
          return "C"

      def test_grade():
          assert grade(95) == "A"
          assert grade(90) == "A"
          assert grade(89) == "B"
          assert grade(75) == "B"
          assert grade(74) == "C"
          assert grade(0) == "C"

      test_grade()
      print("all tests passed")
    expectedOutput: |
      all tests passed
    tests:
      - name: test_grade passes for the correct grade
        code: |
          assert defined("test_grade") and callable(test_grade), "Keep the function test_grade()."
          test_grade()
      - name: uses at least four asserts
        code: |
          import ast
          fn = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == "test_grade"]
          count = sum(isinstance(n, ast.Assert) for n in ast.walk(fn[0])) if fn else 0
          assert count >= 4, f"test_grade has {count} assert statement(s); write at least four."
      - name: catches a bug at the A boundary
        code: |
          def buggy(score):
              if score > 90:
                  return "A"
              if score >= 75:
                  return "B"
              return "C"
          g = test_grade.__globals__
          original = g["grade"]
          g["grade"] = buggy
          try:
              test_grade()
              caught = False
          except AssertionError:
              caught = True
          finally:
              g["grade"] = original
          assert caught, "test_grade() still passes if grade() wrongly uses score > 90, so a score of exactly 90 would get a B. Add an assert for the boundary value 90."
      - name: catches a bug at the B boundary
        code: |
          def buggy(score):
              if score >= 90:
                  return "A"
              if score > 75:
                  return "B"
              return "C"
          g = test_grade.__globals__
          original = g["grade"]
          g["grade"] = buggy
          try:
              test_grade()
              caught = False
          except AssertionError:
              caught = True
          finally:
              g["grade"] = original
          assert caught, "test_grade() still passes if grade() wrongly uses score > 75. Add an assert for the boundary value 75."
      - name: catches a missing C case
        code: |
          def buggy(score):
              if score >= 90:
                  return "A"
              return "B"
          g = test_grade.__globals__
          original = g["grade"]
          g["grade"] = buggy
          try:
              test_grade()
              caught = False
          except AssertionError:
              caught = True
          finally:
              g["grade"] = original
          assert caught, "test_grade() still passes if grade() never returns 'C'. Add an assert for a low score, such as 74 or 0."
      - name: prints the success message
        code: |
          assert output().strip() == "all tests passed", f"Your program printed {output()!r}."
    hints:
      - Bugs hide at boundaries. Which exact scores sit on either side of each threshold?
      - "Test both sides of every boundary: 90 and 89, 75 and 74."
      - "`assert grade(90) == \"A\"` fails if someone writes > 90."
    explanation: >-
      A test only protects you if it would fail when the code is wrong. Values on both sides of each
      threshold (90/89, 75/74) pin the boundaries exactly, and a low score pins the "C" branch. This is
      how a fixed bug stays fixed: the next person who breaks it gets a failing assert instead of a wrong
      grade in production.

  # ----- Mastery check (new items) -----
  - id: m-mcq-isolate
    type: mcq
    skill: design
    difficulty: 2
    prompt: >-
      A 200-line script reads data, transforms it in several stages and prints a total at the end. The
      total is wrong, and there is no error message. What is the most efficient way to locate the bug?
    explanation: >-
      Checking the data at the midpoint tells you which half contains the bug; repeating this halves the
      search space each time (bisection). Reading or rewriting everything does not use the program's own
      evidence, and changing many things at once destroys the information you need.
    options:
      - id: a
        text: Check the intermediate data halfway through. If it is already wrong, the bug is in the first half; otherwise in the second. Repeat on the half that is wrong.
        correct: true
        feedback: Correct - isolate by bisection. Each check halves the amount of code you have to suspect.
      - id: b
        text: Rewrite the script from scratch more carefully.
        feedback: Expensive, and you may repeat the same mistake. Find the cause first.
      - id: c
        text: Change every line that looks suspicious, then run it again.
        feedback: With several changes at once you cannot tell which one mattered - and you may add new bugs.
      - id: d
        text: Wrap the whole script in try/except so it cannot fail.
        feedback: There is no exception to catch - the total is simply wrong. Handling exceptions cannot fix a wrong value.

  - id: m-predict-repr
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print? (Two lines.)
    code: |
      name = "Ada\n"
      count = "3"
      print(f"{name=}")
      print(f"{count=}", count * 2)
    answer: |
      name='Ada\n'
      count='3' 33
    explanation: >-
      The = specifier uses repr(), which shows the quotes and writes the newline as the two characters \n
      instead of starting a new line. count is the string "3", so count * 2 repeats it: "33".
    wrongAnswers:
      - answer: |
          name=Ada

          count=3 6
        feedback: >-
          f"{x=}" shows the repr of the value: strings appear in quotes and a newline appears as \n. And
          "3" * 2 repeats the string - it is not arithmetic.
      - answer: |
          name='Ada\n'
          count='3' 6
        feedback: count is the string "3". Multiplying a string by 2 repeats it, giving "33".

  - id: m-mcq-pdb-step
    type: mcq
    skill: recognition
    prompt: >-
      You are paused in pdb on the line `total = compute_tax(price)`, and you want to watch what happens
      *inside* compute_tax. Which command do you type?
    explanation: >-
      s (step) runs the current line but stops at the first line inside any function it calls. n (next)
      would run compute_tax completely and stop on the following line of the current function.
    options:
      - id: a
        text: "s (step)"
        correct: true
        feedback: Correct - step into the call.
      - id: b
        text: "n (next)"
        feedback: next steps over the call - compute_tax runs to completion and you stop on the next line of the current function.
      - id: c
        text: "c (continue)"
        feedback: continue runs until the next breakpoint (or the end of the program), so you would not see inside compute_tax.
      - id: d
        text: "q (quit)"
        feedback: quit stops the debugger and the program.

  - id: m-tf-assert-input
    type: true-false
    skill: recognition
    prompt: "True or false: `assert` is a good way to check that a user typed a valid number in a production program."
    answer: false
    explanation: >-
      Running Python with -O removes every assert statement, and bad user input is an expected situation,
      not a programming error. Validate input with try/except (or an if) and handle it - for example by
      asking again.

  - id: m-debug-aliasing
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      `scaled(values)` should return a **new** list with every value multiplied by 10, leaving the caller's
      list unchanged. The program should print `[1, 2, 3]` and then `[10, 20, 30]`, but it prints
      `[10, 20, 30]` twice. Fix the bug.
    starterCode: |
      def scaled(values):
          result = values
          for i in range(len(result)):
              result[i] = result[i] * 10
          return result

      original = [1, 2, 3]
      bigger = scaled(original)
      print(original)
      print(bigger)
    solution: |
      def scaled(values):
          result = values.copy()
          for i in range(len(result)):
              result[i] = result[i] * 10
          return result

      original = [1, 2, 3]
      bigger = scaled(original)
      print(original)
      print(bigger)
    expectedOutput: |
      [1, 2, 3]
      [10, 20, 30]
    tests:
      - name: returns the scaled values
        code: |
          for values, expected in [([1, 2, 3], [10, 20, 30]), ([], []), ([-1, 0], [-10, 0])]:
              r = scaled(list(values))
              assert r == expected, f"scaled({values}) returned {r!r}; expected {expected}."
      - name: does not change the caller's list
        code: |
          data = [5, 6]
          r = scaled(data)
          assert data == [5, 6], f"The caller's list became {data}. result = values does not copy - make a new list."
          assert r is not data, "scaled returned the caller's own list object. Return a new list."
      - name: prints both lists
        code: |
          assert output_lines() == ["[1, 2, 3]", "[10, 20, 30]"], f"Your program printed {output()!r}."
    hints:
      - "Inspect identity: `print(result is values)` inside the function. What does it show?"
      - Assignment never copies. result and values are two names for one list.
      - Start from a copy (values.copy() or list(values)), or build a new list with append.
    feedback:
      - when: { outputContains: "[10, 20, 30]\n[10, 20, 30]" }
        message: The caller's list is still being changed. `result = values` makes a second name for the same list, not a copy.
    explanation: >-
      result = values created an alias, so the loop mutated the caller's list. Copying first (or building a
      new list) gives the function its own object to change, so the original stays [1, 2, 3].

masteryCheck:
  passThreshold: 0.8
  items: [m-mcq-isolate, m-predict-repr, m-mcq-pdb-step, m-tf-assert-input, m-debug-aliasing]

cheatsheet: |
  ```python
  print(f"{total=} {len(items)=}")   # labelled values (repr) - remove when done
  print(repr(text), type(value))     # see hidden spaces, quotes, types
  assert 0 <= pct <= 100, f"bad pct {pct}"   # fail fast; never for user input
  breakpoint()                       # pause here in pdb (needs a terminal)
  ```
  - pdb: `p expr` print · `n` next · `s` step into · `c` continue · `l` list · `w` where · `q` quit
  - Method: reproduce → read → hypothesise → isolate → inspect → fix cause → prevent (test)
  - Usual suspects: off-by-one · indentation · accumulator reset · mutate while iterating · aliasing · "3" vs 3 · missing return · shadowing
