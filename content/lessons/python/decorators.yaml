sections:
  - id: why
    title: Why decorators exist
    kind: why
    blocks:
      - type: markdown
        body: |
          Suppose you want to see every call to a few functions while debugging: what arguments came in and
          what came out. The direct approach is to edit every function:
      - type: code
        runnable: true
        code: |
          def add(a, b):
              print("calling add with", (a, b))
              result = a + b
              print("add returned", result)
              return result

          def multiply(a, b):
              print("calling multiply with", (a, b))
              result = a * b
              print("multiply returned", result)
              return result

          add(2, 3)
          multiply(4, 5)
        expectedOutput: |
          calling add with (2, 3)
          add returned 5
          calling multiply with (4, 5)
          multiply returned 20
        caption: The logging lines are copied into every function and buried among the real work.
      - type: markdown
        body: |
          The same four lines are pasted everywhere. To change the log format you edit every function, and
          to turn logging off you delete the lines again. The logging has nothing to do with *adding* or
          *multiplying*, yet it is tangled into them.

          A [decorator](glossary:decorator) writes that extra behaviour **once** and applies it with one line:
      - type: code
        runnable: true
        code: |
          def log_calls(func):
              def wrapper(*args):
                  print("calling", func.__name__, "with", args)
                  result = func(*args)
                  print(func.__name__, "returned", result)
                  return result
              return wrapper

          @log_calls
          def add(a, b):
              return a + b

          @log_calls
          def multiply(a, b):
              return a * b

          add(2, 3)
          multiply(4, 5)
        expectedOutput: |
          calling add with (2, 3)
          add returned 5
          calling multiply with (4, 5)
          multiply returned 20
        annotations:
          - line: 1
            text: log_calls receives a function and builds a new one around it.
          - line: 9
            text: "`@log_calls` replaces add with the logging version. add's own body stays clean."
      - type: markdown
        body: |
          Same output, but each function contains only its real job. Decorators are everywhere in
          professional Python: web frameworks register URL handlers with them, test tools mark tests with
          them, and the standard library uses them for caching (`@functools.cache`) and for
          [dataclasses](concept:python.dataclasses) (`@dataclass`). Let's build them from first principles.

  - id: functions-as-values
    title: "Building block: functions that take and return functions"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Two facts from earlier lessons are all you need:

          1. **Functions are objects.** You can give them extra names, pass them as arguments and return
             them ([higher-order functions](concept:python.higher-order-functions)).
          2. **Inner functions remember their enclosing variables** ([closures](concept:python.closures)).
      - type: code
        runnable: true
        code: |
          def shout(text):
              return text.upper() + "!"

          def apply_twice(func, value):
              return func(func(value))

          speak = shout                # a second name for the same function object
          print(speak("hello"))
          print(apply_twice(shout, "hey"))
        expectedOutput: |
          HELLO!
          HEY!!
      - type: markdown
        body: |
          Now combine them: a function that **takes a function and returns a new function** which calls
          the original and adds something:
      - type: code
        runnable: true
        code: |
          def exclaim(func):
              def wrapper(name):
                  return func(name) + "!!!"
              return wrapper

          def greet(name):
              return "Hello, " + name

          excited_greet = exclaim(greet)
          print(greet("Ada"))
          print(excited_greet("Ada"))
        expectedOutput: |
          Hello, Ada
          Hello, Ada!!!
        annotations:
          - line: 2
            text: wrapper is a closure — it remembers func from the exclaim call that created it.
          - line: 9
            text: exclaim returns wrapper. The original greet is untouched.
      - type: markdown
        body: |
          `exclaim` **is a decorator**: a callable that takes a function and returns a replacement. The
          inner function it returns is called the [wrapper](glossary:wrapper-function), because it wraps
          extra behaviour around the original.

  - id: at-syntax
    title: "The @ syntax: f = deco(f)"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Usually you want the decorated version to **replace** the original under the same name. Python's
          `@` syntax does exactly that. These two programs are equivalent:

          ```python
          # With @
          @exclaim
          def greet(name):
              return "Hello, " + name
          ```

          ```python
          # Without @ — the same thing, written out
          def greet(name):
              return "Hello, " + name
          greet = exclaim(greet)
          ```

          Precisely: Python evaluates the decorator expression (`exclaim`), creates the function object,
          calls the decorator **with that function as its only argument**, and binds the name `greet` to
          **whatever the decorator returned**.
      - type: code
        runnable: true
        code: |
          def exclaim(func):
              def wrapper(name):
                  return func(name) + "!!!"
              return wrapper

          @exclaim
          def greet(name):
              return "Hello, " + name

          print(greet("Ada"))
        expectedOutput: |
          Hello, Ada!!!
      - type: markdown
        body: |
          A crucial consequence: **decorating happens once, when the `def` statement runs** — usually when
          the module is first imported — not each time the function is called. The wrapper is what runs on
          every call. Test yourself:
      - type: item
        ref: predict-definition-time
      - type: callout
        variant: misconception
        title: '"The decorator runs every time I call the function"'
        body: |
          The decorator function runs **once**, at definition time, and returns the wrapper. Only the code
          *inside the wrapper* runs on each call. Code placed directly in the decorator body (outside the
          wrapper) is setup that happens a single time.

  - id: general-wrapper
    title: "A wrapper that works for any function"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          `exclaim`'s wrapper accepts exactly one argument, so it only works for one-argument functions. A
          general decorator must accept **any** arguments and pass them through unchanged. That is what
          `*args` and `**kwargs` are for (see [parameters](concept:python.parameters)): collect every
          positional argument into a tuple and every keyword argument into a dict, then unpack them again
          when calling the original.

          Every well-behaved decorator follows this template:

          ```python
          def decorator(func):
              def wrapper(*args, **kwargs):
                  # 1. code that runs BEFORE the original
                  result = func(*args, **kwargs)   # 2. call the original with the same arguments
                  # 3. code that runs AFTER the original
                  return result                    # 4. hand back the original's result
              return wrapper                       # 5. return the wrapper, not wrapper()
          ```
      - type: code
        runnable: true
        code: |
          def log_calls(func):
              def wrapper(*args, **kwargs):
                  print(f"calling {func.__name__} args={args} kwargs={kwargs}")
                  result = func(*args, **kwargs)
                  print(f"{func.__name__} returned {result!r}")
                  return result
              return wrapper

          @log_calls
          def make_tag(text, tag="p"):
              return f"<{tag}>{text}</{tag}>"

          @log_calls
          def zero():
              return 0

          html = make_tag("hi", tag="b")
          print(html)
          zero()
        expectedOutput: |
          calling make_tag args=('hi',) kwargs={'tag': 'b'}
          make_tag returned '<b>hi</b>'
          <b>hi</b>
          calling zero args=() kwargs={}
          zero returned 0
        annotations:
          - line: 2
            text: "*args and **kwargs let one wrapper fit functions with any parameters."
          - line: 4
            text: Unpacking passes the arguments through exactly as the caller gave them.
          - line: 6
            text: Without this line every decorated function would return None.
      - type: markdown
        body: |
          Step through a decorated call. Notice the **two frames**: the caller calls `wrapper` (because the
          name `add` now refers to the wrapper), and `wrapper` calls the original function, which it finds
          through its closure variable `func`.
      - type: visualization
        component: python-tracer
        title: Calling a decorated function
        caption: >-
          The decoration happens once (lines 9-11). The call on line 13 enters wrapper first; wrapper then
          calls the original add through func and returns its result.
        props:
          code: |
            def log_calls(func):
                def wrapper(*args, **kwargs):
                    print("calling", func.__name__)
                    result = func(*args, **kwargs)
                    return result
                return wrapper

            @log_calls
            def add(a, b):
                return a + b

            total = add(2, 3)
            print(total)
      - type: item
        ref: mcq-missing-return

  - id: wraps
    title: Keeping the original's identity with functools.wraps
    kind: concept
    blocks:
      - type: markdown
        body: |
          The decorated name now refers to the wrapper — and the wrapper has its *own* name and docstring.
          Anything that inspects the function (logging that prints `func.__name__`, `help()`, documentation
          tools, frameworks that register functions by name) sees the wrong information:
      - type: code
        runnable: true
        code: |
          def log_calls(func):
              def wrapper(*args, **kwargs):
                  return func(*args, **kwargs)
              return wrapper

          @log_calls
          def add(a, b):
              """Return the sum of a and b."""
              return a + b

          print(add.__name__)
          print(add.__doc__)
        expectedOutput: |
          wrapper
          None
        caption: The function's identity has been lost.
      - type: markdown
        body: |
          [`functools.wraps`](glossary:functools-wraps) fixes this. It is itself a decorator, applied to the
          wrapper, that copies the original's `__name__`, `__qualname__`, `__doc__`, `__module__` and
          annotation information onto the wrapper, and stores the original in `wrapper.__wrapped__`:
      - type: code
        runnable: true
        code: |
          import functools

          def log_calls(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  return func(*args, **kwargs)
              return wrapper

          @log_calls
          def add(a, b):
              """Return the sum of a and b."""
              return a + b

          print(add.__name__)
          print(add.__doc__)
          print(add.__wrapped__(2, 3))
        expectedOutput: |
          add
          Return the sum of a and b.
          5
        annotations:
          - line: 4
            text: "`functools.wraps(func)` returns a decorator, which is applied to wrapper."
          - line: 16
            text: __wrapped__ is the undecorated original — handy in tests.
      - type: callout
        variant: production
        title: Always use functools.wraps
        body: |
          There is no downside, and forgetting it causes confusing logs and broken introspection. Treat
          `@functools.wraps(func)` as part of the decorator template. (Notice that `wraps(func)` takes an
          argument — it is a *decorator with arguments*, the next topic.)

  - id: decorator-arguments
    title: Decorators that take arguments
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Sometimes the decorator itself needs configuration: *repeat this 3 times*, *retry up to 5 times*,
          *only allow admins*. You write `@repeat(3)`. Apply the rule carefully: the expression after `@` is
          `repeat(3)`, so Python **first calls `repeat(3)`**, and whatever that returns is the actual
          decorator:

          ```python
          @repeat(3)
          def cheer(name): ...
          # means:  cheer = repeat(3)(cheer)
          ```

          So `repeat` is a [decorator factory](glossary:decorator-factory): a function that returns a
          decorator. That gives **three levels**:
      - type: code
        runnable: true
        code: |
          import functools

          def repeat(times):
              def decorator(func):
                  @functools.wraps(func)
                  def wrapper(*args, **kwargs):
                      result = None
                      for _ in range(times):
                          result = func(*args, **kwargs)
                      return result
                  return wrapper
              return decorator

          @repeat(3)
          def cheer(name):
              print("Go,", name + "!")

          cheer("Ada")
        expectedOutput: |
          Go, Ada!
          Go, Ada!
          Go, Ada!
        annotations:
          - line: 3
            text: "Level 1, the factory: receives the configuration and returns the decorator."
          - line: 4
            text: "Level 2, the decorator: receives the function and returns the wrapper."
          - line: 6
            text: "Level 3, the wrapper: runs on every call. It can see both times and func through closures."
      - type: markdown
        body: |
          | Level | Runs when | Receives | Returns |
          |---|---|---|---|
          | `repeat(times)` | once, when the `@repeat(3)` line is evaluated | the configuration (`3`) | `decorator` |
          | `decorator(func)` | once, right after the `def` | the function | `wrapper` |
          | `wrapper(*args, **kwargs)` | on **every** call | the call's arguments | the result |
      - type: visualization
        component: python-tracer
        title: Three levels in action
        caption: >-
          Watch repeat(2) run and return decorator, decorator(beep) run and return wrapper, and then the
          single call beep() run the original twice. The wrapper frame can see both times and func.
        props:
          code: |
            def repeat(times):
                def decorator(func):
                    def wrapper(*args, **kwargs):
                        for _ in range(times):
                            func(*args, **kwargs)
                    return wrapper
                return decorator

            @repeat(2)
            def beep():
                print("beep")

            beep()
      - type: callout
        variant: warning
        title: Forgetting the parentheses
        body: |
          `@repeat` (without `(3)`) calls `repeat(cheer)` — so `times` becomes the function and the name
          `cheer` ends up referring to `decorator`. The mistake only shows up when you call it:
          `TypeError: repeat.<locals>.decorator() missing 1 required positional argument: 'func'`. A
          factory must always be called: `@repeat(3)`.
      - type: code
        runnable: true
        code: |
          def repeat(times):
              def decorator(func):
                  def wrapper(*args, **kwargs):
                      for _ in range(times):
                          func(*args, **kwargs)
                  return wrapper
              return decorator

          @repeat
          def cheer():
              print("Go!")

          cheer()
        expectError: TypeError
        caption: Run it to see the error, then change line 9 to @repeat(2).

  - id: stacking
    title: Stacking decorators
    kind: concept
    blocks:
      - type: markdown
        body: |
          You can apply several decorators to one function. They are applied **bottom-up** — the one
          nearest the `def` first:

          ```python
          @bold
          @italic
          def label(text): ...
          # means:  label = bold(italic(label))
          ```

          The result is like nested boxes: `italic`'s wrapper is inside `bold`'s wrapper. So at **call
          time** the **top** decorator's wrapper runs first, and the bottom one is closest to the original.
      - type: code
        runnable: true
        code: |
          import functools

          def bold(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  return "<b>" + func(*args, **kwargs) + "</b>"
              return wrapper

          def italic(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  return "<i>" + func(*args, **kwargs) + "</i>"
              return wrapper

          @bold
          @italic
          def label(text):
              return text

          print(label("sale"))
        expectedOutput: |
          <b><i>sale</i></b>
      - type: item
        ref: predict-stacking
      - type: markdown
        body: |
          **Order changes behaviour.** Put a logging decorator *above* a cache and you log every call; put
          it *below* the cache and you only log the calls the cache could not answer:
      - type: code
        runnable: true
        code: |
          import functools

          def log_calls(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  print("  computing", func.__name__, args)
                  return func(*args, **kwargs)
              return wrapper

          @log_calls
          @functools.cache
          def square_a(n):
              return n * n

          @functools.cache
          @log_calls
          def square_b(n):
              return n * n

          print("log outside the cache:")
          square_a(4)
          square_a(4)
          print("log inside the cache:")
          square_b(4)
          square_b(4)
        expectedOutput: |
          log outside the cache:
            computing square_a (4,)
            computing square_a (4,)
          log inside the cache:
            computing square_b (4,)
        annotations:
          - line: 10
            text: The logging wrapper is outermost, so it runs on every call — even when the cache answers.
          - line: 15
            text: The cache is outermost; on the second call it returns the stored result without reaching log_calls.

  - id: practical
    title: Practical decorators
    kind: application
    blocks:
      - type: markdown
        body: |
          **Counting calls.** A wrapper is a function object, so you can attach attributes to it. Here the
          count lives on the wrapper, where callers can read it:
      - type: code
        runnable: true
        code: |
          import functools

          def count_calls(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  wrapper.calls += 1
                  return func(*args, **kwargs)
              wrapper.calls = 0
              return wrapper

          @count_calls
          def fib(n):
              return n if n < 2 else fib(n - 1) + fib(n - 2)

          print(fib(15), fib.calls)
        expectedOutput: |
          610 1973
        annotations:
          - line: 8
            text: Set once, at decoration time. The wrapper increments it on every call.
          - line: 13
            text: The recursive calls look up the global name fib, which is now the wrapper — so they are counted too.
      - type: markdown
        body: |
          Nearly 2,000 calls to compute one number: the naive recursion recomputes the same values again
          and again. **Caching results** ([memoization](glossary:memoization)) fixes that. A simple version
          is a dict in the decorator's closure:
      - type: code
        runnable: true
        code: |
          import functools

          def count_calls(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  wrapper.calls += 1
                  return func(*args, **kwargs)
              wrapper.calls = 0
              return wrapper

          def memoize(func):
              cache = {}
              @functools.wraps(func)
              def wrapper(*args):
                  if args not in cache:
                      cache[args] = func(*args)
                  return cache[args]
              return wrapper

          @count_calls
          @memoize
          def fib(n):
              return n if n < 2 else fib(n - 1) + fib(n - 2)

          print(fib(15), fib.calls)
        expectedOutput: |
          610 29
        annotations:
          - line: 12
            text: One cache dict per decorated function, created once at decoration time and kept by the closure.
          - line: 15
            text: The args tuple is the key, so it works for any number of (hashable) positional arguments.
      - type: markdown
        body: |
          **Use the standard library's cache.** `functools.lru_cache` is a fast, tested version of the same
          idea (implemented in C in CPython). `@functools.lru_cache(maxsize=128)` keeps the 128 most
          recently used results (128 is the default); `maxsize=None` keeps everything.
          `@functools.cache` (Python 3.9+) is shorthand for `lru_cache(maxsize=None)`. Both add
          `cache_info()` and `cache_clear()`:
      - type: code
        runnable: true
        code: |
          import functools

          @functools.cache
          def fib(n):
              return n if n < 2 else fib(n - 1) + fib(n - 2)

          print(fib(80))
          print(fib.cache_info())

          @functools.lru_cache(maxsize=2)
          def square(n):
              return n * n

          for n in [1, 2, 1, 3, 2]:
              square(n)
          print(square.cache_info())
        expectedOutput: |
          23416728348467685
          CacheInfo(hits=78, misses=81, maxsize=None, currsize=81)
          CacheInfo(hits=1, misses=4, maxsize=2, currsize=2)
        annotations:
          - line: 7
            text: Instant — each fib(n) is computed once. Without the cache this would take longer than you would wait.
          - line: 15
            text: With room for only 2 results, 3 evicts 2 (least recently used), so the final square(2) misses again.
      - type: callout
        variant: warning
        title: When caching is wrong
        body: |
          A cache returns the **stored** result without running the function. That is only correct when:

          - the function is **pure** — same arguments always give the same result, with no side effects.
            Do not cache something that reads the clock, a file or the network, or that writes logs or
            sends emails;
          - the arguments are **hashable** — they become dictionary keys. Passing a list raises
            `TypeError: unhashable type: 'list'` (pass a tuple instead);
          - callers do not **mutate** the returned object — every caller gets the *same* cached object;
          - memory is acceptable — an unbounded cache (`cache`, `maxsize=None`) grows forever.
      - type: markdown
        body: |
          **Timing — and making it testable.** A timing decorator reads a clock before and after the call.
          Real timings change on every run, so a good timing decorator lets you **inject the clock** — in
          production you use `time.perf_counter` (the clock meant for measuring short durations), and in a
          test you pass a fake clock with predictable readings:
      - type: code
        runnable: true
        code: |
          import functools
          import time

          def timed(clock=time.perf_counter):
              def decorator(func):
                  @functools.wraps(func)
                  def wrapper(*args, **kwargs):
                      start = clock()
                      result = func(*args, **kwargs)
                      elapsed = clock() - start
                      print(f"{func.__name__} took {elapsed:.2f}s")
                      return result
                  return wrapper
              return decorator

          readings = iter([100.0, 102.5])     # a fake clock with two readings

          def fake_clock():
              return next(readings)

          @timed(clock=fake_clock)
          def build_report():
              return "report ready"

          print(build_report())
        expectedOutput: |
          build_report took 2.50s
          report ready
        annotations:
          - line: 4
            text: "A decorator factory whose argument has a sensible default: @timed() uses the real clock."
          - line: 16
            text: The first reading is the start, the second the end, so the reported time is exactly 2.5 s.
      - type: code
        status: illustrative
        code: |
          @timed()
          def build_report():
              return "report ready"

          print(build_report())
          # build_report took 0.00s   <- the real duration differs on every run
        caption: >-
          With the real clock the printed duration changes from run to run, so this block is not executed
          by the content tests. Injecting the clock (above) is what makes the decorator verifiable.
      - type: markdown
        body: |
          **Registering functions.** A decorator does not have to wrap anything. It can record the function
          somewhere and return it **unchanged**. This is the idea behind many framework decorators: web
          frameworks map URLs to handler functions, and command-line tools map command names to functions.
      - type: code
        runnable: true
        code: |
          COMMANDS = {}

          def command(func):
              COMMANDS[func.__name__] = func
              return func              # no wrapper: the original is returned as-is

          @command
          def hello():
              return "hello!"

          @command
          def bye():
              return "goodbye!"

          print(sorted(COMMANDS))
          print(COMMANDS["bye"]())
        expectedOutput: |
          ['bye', 'hello']
          goodbye!
      - type: item
        ref: mcq-cache-design

  - id: under-the-hood
    title: "Under the hood: what Python actually does"
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **The exact semantics.** The Language Reference (*Function definitions*) guarantees that decorator
          expressions are evaluated when the function is defined, in the scope containing the definition;
          that each result must be a callable called with the function object as its only argument; that
          multiple decorators are applied in nested fashion (bottom one innermost); and that the final result
          is bound to the function's name. It notes one difference from writing `f = deco(f)` by hand: the
          original function is never temporarily bound to the name. In CPython the order is: evaluate the
          decorator expressions **top to bottom**, evaluate default argument values, create the function
          object, then apply the decorators **bottom to top**.

          **Any expression can be a decorator** (since Python 3.9, PEP 614), e.g.
          `@handlers["click"]` or `@app.route("/")` — anything that evaluates to a callable.

          **Classes and methods.** Decorators can be applied to classes (`@dataclass` receives the class
          and returns it with generated methods). Decorating a method works with the usual template: the
          instance arrives as the first element of `args`. `@property`, `@staticmethod` and `@classmethod`
          are built-in decorators that you will meet with the [data model](concept:python.data-model).

          **What `functools.wraps` copies.** It calls `functools.update_wrapper`, which copies the attributes
          listed in `functools.WRAPPER_ASSIGNMENTS`, merges the original's `__dict__` into the wrapper's,
          and sets `__wrapped__`. `inspect.signature` follows `__wrapped__`, so tools see the original
          parameters:
      - type: code
        runnable: true
        code: |
          import functools
          import inspect

          def plain(func):
              def wrapper(*args, **kwargs):
                  return func(*args, **kwargs)
              return wrapper

          def tidy(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  return func(*args, **kwargs)
              return wrapper

          def area(width, height=1.0):
              return width * height

          print(inspect.signature(plain(area)))
          print(inspect.signature(tidy(area)))
          print(functools.WRAPPER_ASSIGNMENTS)
        expectedOutput: |
          (*args, **kwargs)
          (width, height=1.0)
          ('__module__', '__name__', '__qualname__', '__doc__', '__annotate__', '__type_params__')
        caption: >-
          The last line is Python 3.14, which copies __annotate__ (the function behind lazily evaluated
          annotations). Python 3.12 and 3.13 listed __annotations__ there instead.
      - type: markdown
        body: |
          **What wraps does not change.** The wrapper's *code* is still the wrapper's: tracebacks and
          debuggers show a frame named `wrapper` between the caller and the original. That is normal.

          **lru_cache details.** The cache key is built from the positional and keyword arguments, so
          `f(a=1, b=2)` and `f(b=2, a=1)` may be stored as separate entries. With the default
          `typed=False`, `f(3)` and `f(3.0)` are usually treated as the same call (they are equal and hash
          the same); `typed=True` keeps them apart. Using `lru_cache` on a method puts `self` into the cache
          key, which keeps those instances alive for as long as their entries stay cached — with
          `maxsize=None`, forever. This is a common memory leak in long-running services.

          **Cost.** Every wrapper adds a function call (and argument packing/unpacking) to each call of the
          decorated function. That is negligible for almost everything, but it is why you should not wrap a
          tiny function that runs millions of times in a hot loop without measuring first
          ([profiling](concept:python.profiling)).

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: 'NoneType' object is not callable` when calling the decorated function | The decorator forgot `return wrapper`, so the name now refers to `None`. | End the decorator with `return wrapper`. |
          | The decorated function always returns `None` | The wrapper calls `func(...)` but does not return its result. | `return func(*args, **kwargs)` (or store it in `result` and return that). |
          | `TypeError: ...wrapper() takes 0 positional arguments but 2 were given` | The wrapper was defined without parameters. | `def wrapper(*args, **kwargs):` and pass them through. |
          | The function runs once at start-up and the name refers to its result | The decorator returned `wrapper()` or `func()` instead of the function object. | Return `wrapper` without parentheses. |
          | `TypeError: ...decorator() missing 1 required positional argument: 'func'` | A decorator factory was used without parentheses: `@repeat`. | Call the factory: `@repeat(3)`. |
          | `NameError: name 'func' is not defined` inside a factory | The factory skipped the middle level, so no parameter named `func` exists. | Use three levels: factory → decorator(func) → wrapper. |
          | Logs or `help()` show `wrapper` instead of the real name | `functools.wraps` is missing. | Add `@functools.wraps(func)` above the wrapper. |
          | `TypeError: unhashable type: 'list'` from a cached function | `lru_cache`/`cache` arguments must be hashable. | Pass a tuple, or do not cache this function. |
      - type: code
        runnable: true
        code: |
          def log_calls(func):
              def wrapper(*args, **kwargs):
                  print("calling", func.__name__)
                  return func(*args, **kwargs)

          @log_calls
          def add(a, b):
              return a + b

          print(add(2, 3))
        expectError: TypeError
        caption: "log_calls returns None, so add is None. The error appears at the call: 'NoneType' object is not callable."
      - type: code
        runnable: true
        code: |
          def log_calls(func):
              def wrapper():
                  print("calling", func.__name__)
                  return func()
              return wrapper

          @log_calls
          def add(a, b):
              return a + b

          print(add(2, 3))
        expectError: TypeError
        caption: The wrapper takes no arguments, but the caller passes two. Fix it with *args and **kwargs.

