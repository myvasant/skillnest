id: python.decorators
concept: python.decorators
title: Decorators
subtitle: Wrapping functions to add behaviour without editing them
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  A decorator is a function that takes a function and returns a replacement for it. Learn what the @
  syntax really does, write general-purpose wrappers with *args and **kwargs, keep metadata with
  functools.wraps, build decorators that take arguments, stack them in the right order, and use the
  standard library's caching decorators.
objectives:
  - Explain that `@deco` above `def f` means `f = deco(f)`, applied once when the function is defined.
  - Write a decorator whose wrapper accepts any arguments, calls the original function and returns its result.
  - Use functools.wraps to preserve a decorated function's name, docstring and signature.
  - Build a decorator that takes arguments (factory → decorator → wrapper) and predict the order of stacked decorators.
  - Apply practical decorators — call counting, logging, timing with an injectable clock, and caching with functools.lru_cache / functools.cache — and recognise when caching is unsafe.
