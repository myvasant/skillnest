      - type: item
        ref: parsons-tag

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **decorator** is a callable that takes a function and returns a replacement.
            `@deco` above `def f` means `f = deco(f)`, done **once**, when the `def` runs.
          - Template: `def deco(func):` → `@functools.wraps(func)` → `def wrapper(*args, **kwargs):` →
            before / `result = func(*args, **kwargs)` / after / `return result` → `return wrapper`.
          - **Decorator with arguments** = factory → decorator → wrapper. `@repeat(3)` means
            `f = repeat(3)(f)`.
          - **Stacking**: applied bottom-up; at call time the top wrapper runs first. Order matters.
          - `functools.cache` / `functools.lru_cache` memoize **pure** functions with **hashable**
            arguments.
          - Make side-effecting decorators testable by injecting dependencies such as the clock.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Write a decorator that times a function" is a classic. Use `*args, **kwargs`, return the
          result, add `functools.wraps`, use `time.perf_counter`, and mention you would make the clock
          injectable (or log rather than print) for testing. Expect follow-ups: a decorator that takes
          arguments, what `@a @b` means, and when `lru_cache` is unsafe.

items:
  - id: predict-definition-time
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: Predict the output (five lines).
    code: |
      def register(func):
          print("registering", func.__name__)
          return func

      print("start")

      @register
      def backup():
          print("backing up")

      print("middle")
      backup()
      backup()
    answer: |
      start
      registering backup
      middle
      backing up
      backing up
    explanation: >-
      The decorator runs once, when the def statement executes — between "start" and "middle". It returns
      the original function, so each call just prints "backing up".
    wrongAnswers:
      - answer: |
          start
          middle
          registering backup
          backing up
          backing up
        feedback: >-
          The decorator does not wait for the first call. `@register` runs as soon as Python executes the
          def statement, which comes before print("middle").
      - answer: |
          start
          middle
          registering backup
          backing up
          registering backup
          backing up
        feedback: >-
          The decorator is not re-run on each call. It runs once at definition time; here it returns the
          original function, so calls only run backup's body.

  - id: mcq-missing-return
    type: mcq
    skill: debugging
    prompt: |
      With this decorator, `print(add(2, 3))` prints `calling add` and then `None`. Why?

      ```python
      def log_calls(func):
          def wrapper(*args, **kwargs):
              print("calling", func.__name__)
              func(*args, **kwargs)
          return wrapper

      @log_calls
      def add(a, b):
          return a + b
      ```
    explanation: >-
      The name add refers to wrapper, and wrapper is what the caller gets a value from. It calls the
      original but throws its result away, and a function that reaches its end without return returns
      None. `return func(*args, **kwargs)` fixes it.
    options:
      - id: a
        text: wrapper calls the original but does not return its result, so wrapper returns None.
        correct: true
        feedback: Right. Every wrapper must hand back the original's result.
      - id: b
        text: log_calls forgot to return wrapper.
        feedback: >-
          It does return wrapper — otherwise add would be None and calling it would raise TypeError
          before anything was printed.
      - id: c
        text: "*args and **kwargs lose the arguments, so add receives nothing."
        feedback: They pass the arguments through unchanged; add computes 5 correctly. The 5 is just never returned.
      - id: d
        text: Decorated functions always return None unless you use functools.wraps.
        feedback: wraps only copies metadata like the name and docstring. It does not affect return values.

  - id: predict-stacking
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      def double(func):
          def wrapper(x):
              return func(x) * 2
          return wrapper

      def add_one(func):
          def wrapper(x):
              return func(x) + 1
          return wrapper

      @double
      @add_one
      def identity(x):
          return x

      print(identity(5))
    answer: "12"
    explanation: >-
      identity = double(add_one(identity)). The outer (double) wrapper calls the add_one wrapper, which
      returns 5 + 1 = 6; double's wrapper then returns 6 * 2 = 12.
    wrongAnswers:
      - answer: "11"
        feedback: >-
          That is (5 * 2) + 1 — the decorators applied in the opposite order. The decorator nearest the def
          (add_one) is applied first, so it sits inside; double's wrapper doubles its result.
      - answer: "10"
        feedback: Both decorators apply. identity is wrapped by add_one, and that result is wrapped by double.

  - id: mcq-cache-design
    type: mcq
    skill: design
    difficulty: 2
    prompt: Which of these functions is a safe and useful candidate for `@functools.cache`?
    explanation: >-
      Caching is only correct for pure functions with hashable arguments: the same inputs must always give
      the same output, with no side effects that would be skipped on a cache hit.
    options:
      - id: a
        text: "`shipping_cost(weight_kg, zone)` — a pure calculation from two numbers, called thousands of times with repeated values."
        correct: true
        feedback: Pure, hashable arguments, repeated inputs — exactly what memoization is for.
      - id: b
        text: "`latest_exchange_rate(currency)` — downloads today's rate from a web service."
        feedback: The answer changes over time; a cache would keep returning the first rate it saw forever.
      - id: c
        text: "`append_to_log(line)` — writes the line to a file."
        feedback: Its job is a side effect. On a cache hit the function body is skipped, so repeated lines would never be written.
      - id: d
        text: "`average(scores)` — scores is a list of numbers."
        feedback: Lists are unhashable, so the call would raise TypeError. You could pass a tuple, but the function as described cannot be cached.

  - id: announce
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write a decorator `announce` that:

      1. prints `>> NAME` just before the decorated function runs and `<< NAME` just after it returns,
         where NAME is the function's name;
      2. returns the function's result unchanged;
      3. works for any positional and keyword arguments;
      4. keeps the original name and docstring (use `functools.wraps`).
    starterCode: |
      import functools


      def announce(func):
          # Define a wrapper that prints, calls func, prints again and returns the result.
          pass


      @announce
      def add(a, b):
          return a + b


      print(add(2, 3))
    solution: |
      import functools


      def announce(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              print(">>", func.__name__)
              result = func(*args, **kwargs)
              print("<<", func.__name__)
              return result
          return wrapper


      @announce
      def add(a, b):
          return a + b


      print(add(2, 3))
    expectedOutput: |
      >> add
      << add
      5
    tests:
      - name: announce returns a function
        code: |
          def sample(x):
              return x
          assert callable(announce(sample)), "announce(func) must return the wrapper function. End announce with `return wrapper`."
      - name: prints around the call and returns the result
        code: |
          import contextlib, io
          def multiply(a, b):
              print("inside")
              return a * b
          wrapped = announce(multiply)
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              result = wrapped(4, 5)
          lines = buffer.getvalue().splitlines()
          assert lines == [">> multiply", "inside", "<< multiply"], f"Expected the lines ['>> multiply', 'inside', '<< multiply'], got {lines}."
          assert result == 20, f"The decorated function should return the original result (20) but returned {result!r}. Did you `return result`?"
      - name: passes keyword arguments through
        code: |
          import contextlib, io
          def tag(text, name="p"):
              return f"<{name}>{text}</{name}>"
          with contextlib.redirect_stdout(io.StringIO()):
              got = announce(tag)("hi", name="b")
          assert got == "<b>hi</b>", f"announce(tag)('hi', name='b') should return '<b>hi</b>', got {got!r}. Use *args and **kwargs."
      - name: keeps the name and docstring
        code: |
          def report():
              """Build the report."""
          decorated = announce(report)
          assert decorated.__name__ == "report", f"The decorated function is called {decorated.__name__!r}. Add @functools.wraps(func) above the wrapper."
          assert decorated.__doc__ == "Build the report.", "The docstring was lost. Add @functools.wraps(func) above the wrapper."
    hints:
      - Follow the template — def wrapper(*args, **kwargs) inside announce, and return wrapper at the end.
      - Inside the wrapper print before, store `result = func(*args, **kwargs)`, print after, then return result.
      - Put `@functools.wraps(func)` on the line directly above `def wrapper`.
    feedback:
      - when: { errorMessageContains: "'NoneType' object is not callable" }
        message: announce returned None, so add became None. End announce with `return wrapper`.
      - when: { outputContains: "None" }
        message: The wrapper does not return the original's result. Store it and `return result`.
      - when: { errorMessageContains: "positional argument" }
        message: The wrapper's parameters do not match the call. Define it as `def wrapper(*args, **kwargs):` and call `func(*args, **kwargs)`.
    explanation: >-
      The wrapper prints, calls the original with exactly the arguments it received, prints again and
      returns the result. functools.wraps copies the original's name and docstring onto the wrapper.

  - id: debug-count-calls
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This decorator should print `call #1 of square`, `call #2 of square`, … on each call, but it
      crashes. Read the error, then fix the decorator (keep the counter inside `count_calls`).
    starterCode: |
      import functools


      def count_calls(func):
          calls = 0

          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              calls += 1
              print(f"call #{calls} of {func.__name__}")
              return func(*args, **kwargs)

          return wrapper


      @count_calls
      def square(n):
          return n * n


      print(square(3), square(4))
    solution: |
      import functools


      def count_calls(func):
          calls = 0

          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              nonlocal calls
              calls += 1
              print(f"call #{calls} of {func.__name__}")
              return func(*args, **kwargs)

          return wrapper


      @count_calls
      def square(n):
          return n * n


      print(square(3), square(4))
    expectedOutput: |
      call #1 of square
      call #2 of square
      9 16
    tests:
      - name: prints the call numbers and results
        code: |
          assert output_lines() == ["call #1 of square", "call #2 of square", "9 16"], f"Your program printed {output()!r}."
      - name: each decorated function has its own counter
        code: |
          import contextlib, io
          def cube(n):
              return n ** 3
          counted = count_calls(cube)
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              first = counted(2)
              counted(3)
          lines = buffer.getvalue().splitlines()
          assert first == 8, f"The decorated cube(2) should return 8, got {first!r}."
          assert lines == ["call #1 of cube", "call #2 of cube"], f"A newly decorated function should count from 1. Got {lines}."
    hints:
      - The error is UnboundLocalError. Which assignment makes `calls` local to wrapper?
      - This is the closures lesson again — what statement lets an inner function rebind an enclosing variable?
    feedback:
      - when: { errorType: UnboundLocalError }
        message: "`calls += 1` makes calls local to wrapper. Add `nonlocal calls` as the first line of wrapper."
    explanation: >-
      calls belongs to count_calls, and wrapper assigns to it, which made it a local of wrapper. `nonlocal
      calls` makes the assignment update the enclosed counter. Because each call to count_calls creates its
      own calls variable, every decorated function counts independently.

  - id: retry
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      Network calls sometimes fail on the first try. Write a decorator factory `retry(times)`:

      - The wrapper calls the function. If the call raises an `Exception`, it tries again — up to `times`
        attempts in total.
      - As soon as an attempt succeeds, return its result (no further attempts).
      - If every attempt fails, re-raise the **last** exception.
      - Pass all arguments through and use `functools.wraps`.

      You may assume `times` is at least 1.
    starterCode: |
      import functools


      def retry(times):
          pass


      attempts = []

      @retry(3)
      def flaky_fetch():
          attempts.append("try")
          if len(attempts) < 3:
              raise ConnectionError("network hiccup")
          return "data"


      print(flaky_fetch(), "after", len(attempts), "attempts")
    solution: |
      import functools


      def retry(times):
          def decorator(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  for attempt in range(times):
                      try:
                          return func(*args, **kwargs)
                      except Exception:
                          if attempt == times - 1:
                              raise
              return wrapper
          return decorator


      attempts = []

      @retry(3)
      def flaky_fetch():
          attempts.append("try")
          if len(attempts) < 3:
              raise ConnectionError("network hiccup")
          return "data"


      print(flaky_fetch(), "after", len(attempts), "attempts")
    expectedOutput: |
      data after 3 attempts
    tests:
      - name: succeeds after earlier failures
        code: |
          calls = []
          def sometimes(x):
              calls.append(x)
              if len(calls) < 2:
                  raise TimeoutError("slow")
              return x * 2
          got = retry(5)(sometimes)(21)
          assert got == 42, f"retry(5) should return the successful result 42, got {got!r}."
          assert len(calls) == 2, f"It should stop retrying after the first success: expected 2 attempts, made {len(calls)}."
      - name: no retries when the first attempt works
        code: |
          calls = []
          def fine():
              calls.append(1)
              return "ok"
          assert retry(3)(fine)() == "ok", "A function that succeeds should just return its result."
          assert len(calls) == 1, f"A successful first attempt should not be repeated, but the function ran {len(calls)} times."
      - name: re-raises after the last attempt
        code: |
          calls = []
          def always_fails():
              calls.append(1)
              raise ValueError("boom")
          try:
              retry(2)(always_fails)()
          except ValueError as err:
              assert str(err) == "boom", f"Re-raise the original exception; got message {str(err)!r}."
          else:
              raise AssertionError("When every attempt fails, the wrapper must raise the last exception, not return.")
          assert len(calls) == 2, f"retry(2) should make exactly 2 attempts, made {len(calls)}."
      - name: passes arguments and keeps the name
        code: |
          def combine(a, b=1):
              return a + b
          decorated = retry(2)(combine)
          assert decorated(2, b=5) == 7, "Pass *args and **kwargs through to the function."
          assert decorated.__name__ == "combine", "Use @functools.wraps(func) so the name is kept."
    hints:
      - Three levels — retry(times) returns decorator(func), which returns wrapper(*args, **kwargs).
      - "In the wrapper, loop `for attempt in range(times):` and put the call in a try block; `return` the result as soon as it works."
      - "In the except block, if this was the last attempt (`attempt == times - 1`), re-raise with a bare `raise`."
    feedback:
      - when: { errorMessageContains: "'NoneType' object is not callable" }
        message: >-
          Something returned None where a function was expected. retry must return decorator, and
          decorator must return wrapper.
      - when: { errorType: ConnectionError }
        message: >-
          The exception escaped on an early attempt. Catch it inside the loop and only re-raise on the last
          attempt.
    explanation: >-
      The factory remembers times; the decorator remembers func; the wrapper loops over attempts, returning
      the first success. A bare `raise` in the except block re-raises the exception currently being
      handled, which on the final attempt is the last failure — with its original traceback.

  - id: parsons-tag
    type: parsons
    skill: implementation
    difficulty: 2
    prompt: |
      Arrange the lines into a decorator factory `tag(name)` so that the program prints
      `<em>hello</em>`. Two lines are distractors.
    solution: |
      import functools
      def tag(name):
          def decorator(func):
              @functools.wraps(func)
              def wrapper(*args, **kwargs):
                  return f"<{name}>{func(*args, **kwargs)}</{name}>"
              return wrapper
          return decorator
      @tag("em")
      def word():
          return "hello"
      print(word())
    distractors:
      - "            return wrapper()"
      - "@tag"
    expectedOutput: |
      <em>hello</em>
    explanation: >-
      The factory tag(name) returns decorator; decorator(func) returns wrapper; wrapper builds the tagged
      string. `@tag("em")` calls the factory. `return wrapper()` would call the wrapper during decoration,
      and a bare `@tag` would pass the function in as name.

  # ----- Mastery check (new items, not used in the sections) -----
  - id: m-predict-factory-order
    type: predict-output
    skill: prediction
    difficulty: 3
    prompt: Predict the output (four lines).
    code: |
      def tagged(label):
          print("factory", label)
          def decorator(func):
              print("decorating", func.__name__)
              def wrapper():
                  print("calling", func.__name__)
                  return func()
              return wrapper
          return decorator

      @tagged("A")
      def job():
          print("working")

      job()
    answer: |
      factory A
      decorating job
      calling job
      working
    explanation: >-
      `@tagged("A")` first calls the factory (prints "factory A"), then applies the returned decorator to
      job (prints "decorating job"). Only the call job() runs the wrapper, which prints "calling job" and
      then calls the original.
    wrongAnswers:
      - answer: |
          decorating job
          factory A
          calling job
          working
        feedback: The factory must run first — its return value is the decorator that gets applied.
      - answer: |
          calling job
          factory A
          decorating job
          working
        feedback: The factory and decorator run when the def statement executes, before any call.

  - id: m-mcq-equivalent
    type: mcq
    skill: recognition
    difficulty: 2
    prompt: |
      Which assignment is equivalent to this decorated definition?

      ```python
      @cache_result
      @log_calls
      def load(path):
          ...
      ```
    explanation: >-
      Decorators are applied bottom-up: log_calls wraps the original first, then cache_result wraps that.
      So load = cache_result(log_calls(load)), and at call time cache_result's wrapper runs first.
    options:
      - id: a
        text: "`load = cache_result(log_calls(load))`"
        correct: true
        feedback: Right — the decorator nearest the def is applied first and ends up innermost.
      - id: b
        text: "`load = log_calls(cache_result(load))`"
        feedback: That is the reverse order. The bottom decorator (log_calls) is applied first.
      - id: c
        text: "`load = cache_result(log_calls)(load)`"
        feedback: This passes log_calls itself to cache_result — that is the decorator-factory pattern, not stacking.
      - id: d
        text: "`load = cache_result(load); log_calls(load)`"
        feedback: The result of log_calls(load) is thrown away here; stacked decorators bind the name to the fully wrapped function.

  - id: m-predict-wraps-name
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      import functools

      def plain(func):
          def wrapper(*args, **kwargs):
              return func(*args, **kwargs)
          return wrapper

      def tidy(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              return func(*args, **kwargs)
          return wrapper

      @plain
      def first():
          pass

      @tidy
      def second():
          pass

      print(first.__name__, second.__name__)
    answer: wrapper second
    explanation: >-
      Both names refer to wrappers. Only tidy copies the original's metadata with functools.wraps, so
      second reports its original name while first reports the wrapper's own name.
    wrongAnswers:
      - answer: first second
        feedback: Without functools.wraps the wrapper keeps its own name, "wrapper".
      - answer: wrapper wrapper
        feedback: functools.wraps copies __name__ from the original onto the wrapper, so second reports "second".

  - id: m-code-memoize
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write your own `memoize` decorator (do **not** use `functools.cache` or `functools.lru_cache`):

      - It stores results in a dict keyed by the tuple of positional arguments.
      - On a repeated call with the same arguments, it returns the stored result **without** calling the
        function again.
      - It works for functions with any number of positional arguments and keeps the function's name.
    starterCode: |
      import functools


      def memoize(func):
          pass


      @memoize
      def slow_square(n):
          print("computing", n)
          return n * n


      print(slow_square(4))
      print(slow_square(4))
    solution: |
      import functools


      def memoize(func):
          cache = {}

          @functools.wraps(func)
          def wrapper(*args):
              if args not in cache:
                  cache[args] = func(*args)
              return cache[args]

          return wrapper


      @memoize
      def slow_square(n):
          print("computing", n)
          return n * n


      print(slow_square(4))
      print(slow_square(4))
    expectedOutput: |
      computing 4
      16
      16
    tests:
      - name: repeated calls are answered from the cache
        code: |
          calls = []
          def double(n):
              calls.append(n)
              return n * 2
          fast = memoize(double)
          results = [fast(3), fast(3), fast(5), fast(3)]
          assert results == [6, 6, 10, 6], f"Expected [6, 6, 10, 6], got {results}."
          assert calls == [3, 5], f"The original should run once per new argument (calls [3, 5]) but ran with {calls}."
      - name: works with several arguments
        code: |
          calls = []
          def power(base, exp):
              calls.append((base, exp))
              return base ** exp
          fast = memoize(power)
          assert fast(2, 10) == 1024 and fast(2, 10) == 1024 and fast(10, 2) == 100, "memoize(power) gave wrong results. Key the cache on the whole args tuple."
          assert len(calls) == 2, f"(2, 10) should be computed once and (10, 2) once, but the function ran {len(calls)} times."
      - name: separate functions have separate caches
        code: |
          inc = memoize(lambda n: n + 1)
          dec = memoize(lambda n: n - 1)
          assert inc(5) == 6 and dec(5) == 4, "Each decorated function needs its own cache: create the dict inside memoize."
      - name: keeps the name and builds its own cache
        code: |
          def named(n):
              return n
          assert memoize(named).__name__ == "named", "Use @functools.wraps(func) so the decorated function keeps its name."
          assert "lru_cache" not in source and "functools.cache" not in source, "Build the cache yourself with a dict instead of using functools.cache/lru_cache."
    hints:
      - Create `cache = {}` inside memoize, before defining the wrapper.
      - In `wrapper(*args)`, args is already a tuple — use it directly as the dictionary key.
      - If args is not in the cache, compute and store `func(*args)`; then return `cache[args]`.
    feedback:
      - when: { outputEquals: "computing 4\n16\ncomputing 4\n16\n" }
        message: The second call recomputed the result. Check the cache before calling func, and store results in it.
      - when: { errorMessageContains: "'NoneType' object is not callable" }
        message: memoize must return the wrapper function.
    explanation: >-
      The cache dict lives in memoize's closure, one per decorated function. The args tuple is hashable and
      identifies the call, so a repeated call finds its stored result and skips the original function.

  - id: m-debug-factory
    type: debug
    skill: debugging
    difficulty: 3
    prompt: |
      This decorator factory should make `beep()` run twice, but the program crashes with
      `NameError: name 'func' is not defined` before `beep` is ever called. Fix the factory.
    starterCode: |
      def repeat(times):
          def wrapper(*args, **kwargs):
              result = None
              for _ in range(times):
                  result = func(*args, **kwargs)
              return result
          return wrapper


      @repeat(2)
      def beep():
          print("beep")


      beep()
    solution: |
      def repeat(times):
          def decorator(func):
              def wrapper(*args, **kwargs):
                  result = None
                  for _ in range(times):
                      result = func(*args, **kwargs)
                  return result
              return wrapper
          return decorator


      @repeat(2)
      def beep():
          print("beep")


      beep()
    expectedOutput: |
      beep
      beep
    tests:
      - name: beep runs twice
        code: |
          assert output_lines() == ["beep", "beep"], f"Expected two lines of 'beep', got {output()!r}."
      - name: works for other functions and counts
        code: |
          calls = []
          def record(x, y=0):
              calls.append((x, y))
              return x + y
          result = repeat(3)(record)(1, y=2)
          assert calls == [(1, 2), (1, 2), (1, 2)], f"repeat(3) should call the function 3 times with the same arguments; calls were {calls}."
          assert result == 3, f"The wrapper should return the last result (3), got {result!r}."
    hints:
      - "`@repeat(2)` means beep = repeat(2)(beep). What does repeat(2) return, and what does Python then call with beep?"
      - The function being decorated needs a parameter to arrive in — that is the missing middle level.
      - "Insert `def decorator(func):` between repeat and wrapper, return wrapper from it, and return decorator from repeat."
    feedback:
      - when: { errorType: NameError }
        message: >-
          wrapper refers to func, but no enclosing function has a parameter called func. Add a middle
          level, `def decorator(func):`, that receives the decorated function.
    explanation: >-
      With only two levels, repeat(2) returned wrapper, and Python then called wrapper(beep) — which tried to
      use a func that did not exist. A decorator factory needs three levels: the factory receives times,
      the decorator receives func, and the wrapper receives the call's arguments.

