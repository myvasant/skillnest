cheatsheet: |
  ```python
  import functools

  def decorator(func):                     # runs once, at definition time
      @functools.wraps(func)               # keep name, docstring, signature
      def wrapper(*args, **kwargs):        # runs on every call
          # before
          result = func(*args, **kwargs)
          # after
          return result
      return wrapper                       # the function, not wrapper()

  def repeat(times):                       # decorator factory: @repeat(3)
      def decorator(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              for _ in range(times):
                  result = func(*args, **kwargs)
              return result
          return wrapper
      return decorator

  @a
  @b
  def f(): ...                             # f = a(b(f)); a's wrapper runs first

  @functools.cache                         # = lru_cache(maxsize=None)
  @functools.lru_cache(maxsize=128)        # bounded; .cache_info(), .cache_clear()
  ```
  - Cache only pure functions with hashable arguments.
  - Inject clocks and other side effects so decorated code stays testable.
