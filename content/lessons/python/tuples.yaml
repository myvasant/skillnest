id: python.tuples
concept: python.tuples
title: Tuples and Unpacking
subtitle: Fixed groups of values, taken apart in one line
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  A tuple is an ordered, immutable sequence: a fixed group of values such as a point, a date or a colour.
  Learn why commas (not parentheses) create tuples, why `(5,)` needs its comma, and how unpacking assigns
  the parts of any sequence to several names at once, including one-line swaps and `first, *rest`.
objectives:
  - Create tuples, including empty and one-item tuples, and explain that commas, not parentheses, make them.
  - Read tuples with indexing, slicing, len(), in and for loops, and explain why item assignment fails.
  - Unpack sequences into several names, swap values in one line, and collect extra items with `*`.
  - Predict the result of packing, unpacking and tuple concatenation, including the ValueError cases.
  - Choose between a tuple and a list for a given piece of data and justify the choice.
sources:
  - title: "The Python Tutorial: Tuples and Sequences"
    url: https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences
    publisher: Python Software Foundation
  - title: "Built-in Types: Tuples"
    url: https://docs.python.org/3/library/stdtypes.html#tuples
    publisher: Python Software Foundation
  - title: "Python Language Reference: Assignment statements"
    url: https://docs.python.org/3/reference/simple_stmts.html#assignment-statements
    publisher: Python Software Foundation
  - title: "PEP 3132: Extended Iterable Unpacking"
    url: https://peps.python.org/pep-3132/
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why a fixed group of values?
    kind: why
    blocks:
      - type: markdown
        body: |
          Some data naturally comes in **fixed-size groups where each position has a meaning**: the
          (x, y) of a point on a screen, the (year, month, day) of a date, the (red, green, blue) of a
          colour. You could store such a group in a list, but a list is built to grow and change — and
          nothing stops a mistake from quietly corrupting the group:
      - type: code
        runnable: true
        code: |
          release = [2026, 10, 22]
          release.append(5)        # a mistake nobody notices...
          print(release)
          print(release[0], release[1], release[2])
        expectedOutput: |
          [2026, 10, 22, 5]
          2026 10 22
        caption: A "date" with four parts. The list accepted the bad append without complaint.
      - type: markdown
        body: |
          Now the same date as a **tuple**:
      - type: code
        runnable: true
        code: |
          release = (2026, 10, 22)
          year, month, day = release
          print(year, month, day)
          print(release)
        expectedOutput: |
          2026 10 22
          (2026, 10, 22)
        annotations:
          - line: 1
            text: Values separated by commas make a tuple. It can never grow, shrink or change.
          - line: 2
            text: "Unpacking: three well-named variables in one statement, instead of release[0], release[1], release[2]."
      - type: markdown
        body: |
          A tuple gives you two things:

          1. **A group that cannot be changed by accident.** `release.append(5)` on a tuple fails loudly
             with an error instead of silently producing a four-part date.
          2. **[Unpacking](glossary:unpacking)** — taking a group apart into separate names in one line.
             Unpacking works on lists and strings too, and you will use it constantly: in loops, for
             swapping values, and with functions that hand back several results.

  - id: what
    title: "Creating tuples: commas make them"
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [tuple](glossary:tuple) is an **ordered sequence of values that cannot be changed after it is
          created** — it is [immutable](glossary:immutable). Like a list, it can hold any mix of types and
          you read its items by position. You write it as values separated by commas, usually inside
          parentheses:
      - type: code
        runnable: true
        code: |
          point = (3, 4)
          also_point = 3, 4
          print(point, also_point)
          print(type(point))
          print(point == also_point)
        expectedOutput: |
          (3, 4) (3, 4)
          <class 'tuple'>
          True
        annotations:
          - line: 2
            text: No parentheses at all, yet this is a tuple. The comma is what matters.
          - line: 3
            text: Python always displays tuples with parentheses, whichever way you wrote them.
      - type: markdown
        body: |
          Look at line 2: **the commas make the tuple; the parentheses only group**, exactly as they do in
          `(2 + 3) * 4`. Writing several comma-separated values where Python expects one value is called
          [tuple packing](glossary:tuple-packing).

          Parentheses are needed in only two situations:

          - **The empty tuple** is written `()` — there are no values, so there is no comma to write.
          - **When commas already mean something else**, for example inside a function call:
            `print(1, 2)` passes two separate values, while `print((1, 2))` passes one tuple.
      - type: code
        runnable: true
        code: |
          print(1, 2)
          print((1, 2))
        expectedOutput: |
          1 2
          (1, 2)
      - type: markdown
        body: |
          ### One-item tuples

          Because parentheses alone only group, `(5)` is simply the integer 5. A tuple with one item needs
          a **trailing comma**:
      - type: code
        runnable: true
        code: |
          not_a_tuple = (5)
          one_item = (5,)
          also_one = 5,
          empty = ()
          print(type(not_a_tuple), not_a_tuple)
          print(type(one_item), one_item)
          print(also_one, empty, len(empty))
        expectedOutput: |
          <class 'int'> 5
          <class 'tuple'> (5,)
          (5,) () 0
        annotations:
          - line: 1
            text: Just the number 5 in grouping parentheses.
          - line: 2
            text: The comma turns it into a one-item tuple. Python even prints it with the comma.
      - type: callout
        variant: misconception
        title: '"Parentheses make a tuple"'
        body: |
          They don't — commas do. `(5)` is an int, `5,` is a tuple. When you see a value printed as
          `(5,)` where you expected `5`, look for a stray comma at the end of a line.
      - type: item
        ref: predict-single
      - type: markdown
        body: |
          You can also build a tuple from any other sequence with `tuple(...)`, and turn a tuple into a list
          with `list(...)`. Both create a **new** object; the original is not changed.
      - type: code
        runnable: true
        code: |
          print(tuple("abc"))
          print(tuple([1, 2]))
          print(list((1, 2)))
        expectedOutput: |
          ('a', 'b', 'c')
          (1, 2)
          [1, 2]

  - id: sequence
    title: Reading a tuple
    kind: concept
    blocks:
      - type: markdown
        body: |
          A tuple is a sequence, so everything you know about **reading** lists works the same way:
          indexes from 0, negative indexes from the end, [slicing](concept:python.slicing), `len()`, `in`
          and `for` loops.
      - type: code
        runnable: true
        code: |
          rgb = (255, 128, 0)
          print(rgb[0], rgb[-1])
          print(rgb[1:])
          print(len(rgb), 128 in rgb)
          for value in rgb:
              print(value)
        expectedOutput: |
          255 0
          (128, 0)
          3 True
          255
          128
          0
        annotations:
          - line: 3
            text: Slicing a tuple gives a new tuple.
      - type: markdown
        body: |
          Tuples have only two methods, and both just read: `count(x)` (how many times x appears) and
          `index(x)` (position of the first x). The operators `+` (join) and `*` (repeat) build **new**
          tuples:
      - type: code
        runnable: true
        code: |
          week = ("Mon", "Tue", "Wed")
          longer = week + ("Thu",)
          print(longer)
          print(week)
          print(longer.index("Wed"), longer.count("Mon"))
          print(("ha",) * 3)
        expectedOutput: |
          ('Mon', 'Tue', 'Wed', 'Thu')
          ('Mon', 'Tue', 'Wed')
          2 1
          ('ha', 'ha', 'ha')
        annotations:
          - line: 2
            text: '("Thu",) needs its comma. Without it, ("Thu") is a string and + raises a TypeError.'
          - line: 4
            text: week is unchanged; + created a separate, longer tuple.

  - id: immutable
    title: "Immutable: no changing, adding or removing"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Once a tuple exists, **which objects it holds, and in what order, is fixed**. Anything that would
          change a list in place fails on a tuple:
      - type: code
        runnable: true
        code: |
          point = (3, 4)
          point[0] = 10
        expectError: TypeError
        caption: "Read the last line: TypeError: 'tuple' object does not support item assignment."
      - type: code
        runnable: true
        code: |
          point = (3, 4)
          point.append(5)
        expectError: AttributeError
        caption: "AttributeError: 'tuple' object has no attribute 'append'. Tuples have no methods that change them."
      - type: item
        ref: mcq-immutable
      - type: markdown
        body: |
          To get a "changed" tuple you **build a new tuple and rebind the name**. The old tuple is not
          touched — any other name that still refers to it sees exactly the same values as before.
          Predict this one before stepping through it:
      - type: item
        ref: predict-rebind-tuple
      - type: visualization
        component: python-tracer
        title: A new tuple, not a changed one
        caption: >-
          Line 2 gives the tuple a second name. Line 3 builds a brand-new tuple and moves only the
          `point` label to it; `saved` still refers to the original two-item tuple.
        props:
          code: |
            point = (3, 4)
            saved = point
            point = point + (5,)
            print(saved)
            print(point)
      - type: markdown
        body: |
          Why is "can't change" useful rather than annoying?

          - **Safety:** code that receives a tuple can rely on it not changing underneath it.
          - **Clarity:** a tuple tells the reader "this is a fixed record", a list says "this collection
            may grow".
          - **Lookups:** because a tuple of numbers or strings never changes, Python can use it as a
            dictionary key or set item (see below). Lists can't do that.
      - type: callout
        variant: deep-dive
        title: A tuple can hold a list — and the list can still change
        depth: deep
        body: |
          A tuple stores **references** to objects. Immutability means those references can never be
          replaced, but if one of the objects is itself mutable, such as a list, that object can still be
          changed through any name that refers to it:

          ```python
          record = ("Asha", [90, 85])
          record[1].append(77)
          print(record)          # ('Asha', [90, 85, 77])
          ```

          The tuple still holds the same two objects; it is the list that changed. The
          [mutability lesson](concept:python.mutability) explores this in detail.

  - id: unpacking
    title: "Unpacking: several names in one assignment"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          [Unpacking](glossary:unpacking) is the reverse of packing. Put several names, separated by
          commas, on the **left** of `=`. Python takes the sequence on the right apart and binds the names
          to its items, in order:
      - type: code
        runnable: true
        code: |
          point = (3, 4)
          x, y = point
          print(x)
          print(y)

          name, age, city = ("Asha", 31, "Pune")
          print(name, "is", age)
        expectedOutput: |
          3
          4
          Asha is 31
      - type: markdown
        body: |
          Two rules:

          1. **The right-hand side can be any sequence** (in fact any iterable): a tuple, a list, a
             string, a `range`...
          2. **The number of names must equal the number of items.** Otherwise Python raises a
             `ValueError` and binds none of the names.
      - type: code
        runnable: true
        code: |
          a, b, c = "xyz"
          print(a, b, c)
          first, second = [10, 20]
          print(first + second)
        expectedOutput: |
          x y z
          30
      - type: code
        runnable: true
        code: |
          x, y = (1, 2, 3)
        expectError: ValueError
        caption: "ValueError: too many values to unpack (expected 2, got 3). Python 3.14 tells you both counts."
      - type: markdown
        body: |
          ### Swapping in one line

          In the [variables lesson](concept:python.variables) you swapped two values with a temporary name.
          Unpacking does it in one line: `left, right = right, left`.

          This works because of the rule you already know for every assignment: **evaluate the whole
          right-hand side first, then bind the names.** The right side packs the *current* objects of
          `right` and `left`; only after that are the two labels moved.
      - type: visualization
        component: python-tracer
        title: Both labels move at once
        caption: >-
          Before line 3, left refers to "coffee" and right to "tea". After it, the labels have swapped —
          no temporary name, and no value lost.
        props:
          code: |
            left = "coffee"
            right = "tea"
            left, right = right, left
            print(left, right)
      - type: callout
        variant: tip
        title: The right side always uses the old values
        body: |
          `a, b = b, a + b` computes `a + b` with the **old** a, because the entire right side is
          evaluated before any name changes. Writing it as two lines, `a = b` then `b = a + b`, gives a
          different result — the second line would see the new a.
      - type: markdown
        body: |
          ### Unpacking in `for` loops

          A `for` loop's target can be an unpacking pattern too. Each item of the list is unpacked into the
          names as the loop reaches it. Watch `name` and `score` change on every iteration:
      - type: visualization
        component: python-tracer
        title: Unpacking each tuple as the loop runs
        caption: Each item is a (name, score) tuple; the loop header unpacks it into two names.
        props:
          code: |
            results = [("Asha", 82), ("Ben", 95)]
            for name, score in results:
                print(name, score)
      - type: markdown
        body: |
          You have already used this with `enumerate()`: it produces `(index, item)` tuples, and
          `for i, fruit in enumerate(fruits):` unpacks each one.
      - type: code
        runnable: true
        code: |
          fruits = ["mango", "kiwi"]
          for i, fruit in enumerate(fruits):
              print(i, fruit)
          print(list(enumerate(fruits)))
        expectedOutput: |
          0 mango
          1 kiwi
          [(0, 'mango'), (1, 'kiwi')]
        annotations:
          - line: 4
            text: Turning enumerate's output into a list shows the tuples it produces.
      - type: markdown
        body: |
          ### Preview: "returning several values"

          Some built-in functions give back a tuple so that you can unpack the parts. `divmod(a, b)`
          returns `(a // b, a % b)`:
      - type: code
        runnable: true
        code: |
          print(divmod(135, 60))
          hours, minutes = divmod(135, 60)
          print(hours, "h", minutes, "min")
        expectedOutput: |
          (2, 15)
          2 h 15 min
      - type: markdown
        body: |
          When you write your own [functions](concept:python.functions), `return total, count` works the
          same way: the function returns **one tuple**, and the caller unpacks it. Python has no special
          "multiple return values" feature — it is just packing and unpacking.

  - id: extended
    title: Extended unpacking with *
    kind: concept
    blocks:
      - type: markdown
        body: |
          What if you only care about the first item, or the number of items varies? Put `*` in front of
          **one** name and it collects "everything else" as a **list**. This is called
          [extended unpacking](glossary:extended-unpacking).
      - type: code
        runnable: true
        code: |
          scores = (90, 85, 77, 64, 52)
          best, *others = scores
          print(best, others)

          first, *middle, last = scores
          print(first, middle, last)
          *_, lowest = scores
          print(lowest)
        expectedOutput: |
          90 [85, 77, 64, 52]
          90 [85, 77, 64] 52
          52
        annotations:
          - line: 2
            text: best gets the first item; *others collects the rest into a list, even though scores is a tuple.
          - line: 5
            text: The plain names are filled from the ends; the starred name takes whatever is in between.
          - line: 7
            text: "`_` is a conventional name meaning \"a value I don't need\". It is an ordinary name to Python."
      - type: markdown
        body: |
          Rules for the starred name:

          - **Only one** starred name per assignment. Two (`*a, *b = items`) is a
            `SyntaxError: multiple starred expressions in assignment` — Python couldn't know how to split.
          - It **always gets a list**, possibly an empty one.
          - The other names must still be filled: `a, b, *rest = [1]` raises
            `ValueError: not enough values to unpack (expected at least 2, got 1)`.
      - type: code
        runnable: true
        code: |
          head, *tail = [42]
          print(head, tail)
        expectedOutput: |
          42 []
        caption: One item is enough for head; tail is an empty list.
      - type: item
        ref: predict-star

  - id: choosing
    title: Tuple or list?
    kind: concept
    blocks:
      - type: markdown
        body: |
          Both are ordered sequences. Choose based on **what the data means**:

          | | List | Tuple |
          |---|---|---|
          | Can change after creation | Yes: append, remove, sort, item assignment | No |
          | Typical content | Many items of the same kind: all scores, all orders | A fixed number of parts, each with its own meaning: (x, y), (year, month, day) |
          | Length | Grows and shrinks | Fixed when created |
          | Does each position have a meaning? | Usually not — the 4th order is just another order | Yes — index 0 is always the year |
          | Can be a dictionary key or set item | No | Yes, if all its items can be |

          Rule of thumb: **a list is a collection; a tuple is a record.** If you would describe each
          position with a different name, use a tuple. If every item is "another one of these", use a list.
          A **list of tuples** is extremely common: `[("Asha", 82), ("Ben", 95)]` is a growing collection
          of fixed (name, score) records.

          ### Preview: tuples as dictionary keys

          In the next lesson, [dictionaries](concept:python.dictionaries), you will look values up by a
          *key*. Because a tuple of numbers can never change, it works as a key; a list does not:
      - type: code
        runnable: true
        code: |
          board = {(0, 0): "X", (1, 1): "O"}
          print(board[(1, 1)])
          print(board[0, 0])
        expectedOutput: |
          O
          X
        annotations:
          - line: 1
            text: A dictionary mapping board positions (row, column) to the mark in that square.
          - line: 3
            text: Commas make the tuple, even inside square brackets, so board[0, 0] means board[(0, 0)].
      - type: markdown
        body: |
          The same thing with a list key fails with
          `TypeError: cannot use 'list' as a dict key (unhashable type: 'list')`. The dictionaries lesson
          explains what "hashable" means and why it matters.
      - type: item
        ref: explain-tuple-vs-list

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: 'tuple' object does not support item assignment` | Trying to change an item: `t[0] = 9` | Build a new tuple, e.g. `t = (9,) + t[1:]`, or use a list if the data really must change. |
          | `AttributeError: 'tuple' object has no attribute 'append'` | Tuples have no methods that change them | `t = t + (x,)`, or use a list. |
          | `ValueError: too many values to unpack (expected 2, got 3)` | More items than names on the left | Add names, or collect the extras with `*rest`. |
          | `ValueError: not enough values to unpack (expected 3, got 2)` | Fewer items than names | Check the data; remove a name or use `*rest`. |
          | A number prints as `(250,)`, or `price * 3` gives `(250, 250, 250)` | A stray trailing comma: `price = 250,` | Delete the comma. |
          | `(5)` behaves like a plain number | One-item tuple written without its comma | Write `(5,)`. |
          | `TypeError: can only concatenate tuple (not "str") to tuple` | `t + ("x")` — those parentheses don't make a tuple | `t + ("x",)` |
      - type: code
        runnable: true
        code: |
          entry = ("2026-10-22", "rain", 14)
          date, weather = entry
        expectError: ValueError
        caption: Three items, two names. Count both sides when you see an unpacking ValueError.
      - type: markdown
        body: |
          The trailing-comma bug is the sneakiest, because often **no error appears at all**:
      - type: code
        runnable: true
        code: |
          price = 250,
          print(price)
          print(price * 3)
        expectedOutput: |
          (250,)
          (250, 250, 250)
        caption: The comma packed 250 into a one-item tuple, and * on a tuple repeats it. Wrong answer, no error.

