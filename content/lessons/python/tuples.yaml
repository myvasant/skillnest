  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **What a tuple object stores.** In CPython a tuple is a single block of memory: a small header
          (reference count, type, length and a little bookkeeping) followed by a fixed array of references to
          the item objects. The
          length is decided when the tuple is created and never changes, so CPython allocates exactly the
          space needed. A list keeps its references in a separate array that it **over-allocates**, so that
          repeated `append()` calls are fast on average. That is why a tuple is a little smaller than a list
          with the same items:
      - type: code
        runnable: true
        code: |
          import sys
          print(sys.getsizeof((1, 2, 3)) < sys.getsizeof([1, 2, 3]))
        expectedOutput: |
          True
        caption: >-
          Exact sizes in bytes differ between platforms and versions (the browser runs a 32-bit build of
          CPython), so only the comparison is shown.
      - type: markdown
        body: |
          **Constant tuples are built once.** When a tuple literal contains only constants, such as
          `(2026, 10, 22)`, the CPython compiler builds it once and stores it with the compiled code
          instead of building it every time the line runs.

          **Swaps don't really build a tuple.** For `a, b = b, a` (and three-name versions), CPython's
          compiler replaces "build a tuple, then unpack it" with instructions that simply swap values on
          its internal stack. The *behaviour* is exactly as if a tuple were built — evaluate the right side,
          then bind — so the mental model stays correct; this is purely an optimisation.

          **Hashing.** A tuple's hash value (the number dictionaries and sets use to find it) is computed
          from the hashes of its items. If any item is unhashable, such as a list, the tuple is unhashable
          too:
      - type: code
        runnable: true
        code: |
          print(hash((1, 2)) == hash((1, 2)))
          print(hash((1, [2])))
        expectedOutput: |
          True
        expectError: TypeError
        caption: "Equal tuples have equal hashes. The second line fails with TypeError: unhashable type: 'list'."
      - type: markdown
        body: |
          **Tuples are not "faster lists".** Tuple literals made of constants are cheaper to create, but in
          everyday code the speed difference between tuples and lists is negligible. Choose by meaning and
          safety, not speed.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **tuple** is an ordered, **immutable** sequence. Read it like a list; you can't change it.
          - **Commas make tuples**: `3, 4` and `(3, 4)` are the same; `(5)` is an int, `(5,)` is a tuple,
            `()` is empty.
          - "Changing" a tuple means building a new one (`t + (x,)`) and rebinding the name.
          - **Unpacking**: `x, y = point` — the counts must match, or you get a `ValueError`.
          - **Swap**: `a, b = b, a` — the whole right side is evaluated before any name is rebound.
          - **Extended unpacking**: `first, *rest = items` — the starred name always gets a list.
          - **List = collection** of similar items that may grow; **tuple = record** with a fixed meaning
            per position. Tuples of hashable items can be dictionary keys.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "When would you use a tuple instead of a list?" — Talk about meaning (fixed records vs growing
          collections), immutability as a safety guarantee, and hashability (tuples of immutable items can
          be dict keys and set members). Bonus points: a tuple holding a list is still unhashable, because
          its contents can change.

items:
  - id: predict-single
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      a = (7)
      b = (7,)
      print(a * 2, b * 2)
    answer: "14 (7, 7)"
    explanation: >-
      `(7)` is just the integer 7 in grouping parentheses, so `a * 2` is 14. `(7,)` is a one-item tuple, and
      `*` on a tuple repeats it, giving `(7, 7)`.
    wrongAnswers:
      - answer: "(7, 7) (7, 7)"
        feedback: >-
          This assumes parentheses make a tuple. They only group: `(7)` is the int 7. Only the comma in
          `(7,)` creates a tuple.
      - answer: "14 14"
        feedback: The comma in `(7,)` matters — b is a tuple, and multiplying a tuple repeats it.
      - answer: "14 (14,)"
        feedback: "`*` on a tuple doesn't multiply the items; it repeats the whole tuple, like \"ab\" * 2 is \"abab\"."

  - id: mcq-immutable
    type: mcq
    skill: recognition
    prompt: "Given `t = (1, 2, 3)`, which line runs **without** an error?"
    explanation: >-
      Tuples cannot be changed in place, so item assignment, item deletion and append all fail. `t + (4,)`
      doesn't change anything: it builds a new tuple, and the assignment rebinds the name t to it.
    options:
      - id: a
        text: "`t[0] = 9`"
        feedback: "TypeError: 'tuple' object does not support item assignment."
      - id: b
        text: "`t.append(4)`"
        feedback: "AttributeError: tuples have no append method, because they can't grow."
      - id: c
        text: "`t = t + (4,)`"
        correct: true
        feedback: >-
          Right. `+` builds a new tuple (1, 2, 3, 4) and the name t is rebound to it. The original tuple was
          never modified.
      - id: d
        text: "`del t[0]`"
        feedback: "TypeError: 'tuple' object doesn't support item deletion."

  - id: predict-rebind-tuple
    type: predict-output
    skill: prediction
    prompt: Predict the output, then check it with the step-through below.
    code: |
      point = (1, 2)
      saved = point
      point = point + (3,)
      print(saved, point)
    answer: "(1, 2) (1, 2, 3)"
    explanation: >-
      `saved = point` gives the tuple (1, 2) a second name. `point + (3,)` builds a new tuple, and only the
      name point is rebound to it. saved still refers to the original tuple, which can never change.
    wrongAnswers:
      - answer: "(1, 2, 3) (1, 2, 3)"
        feedback: >-
          This assumes `+` changed the tuple that both names share. Tuples can't change: `+` creates a new
          tuple and only point is moved to it.
      - answer: "(1, 2) (1, 2, (3,))"
        feedback: "`+` joins the items of two tuples; it doesn't put one tuple inside the other."

  - id: predict-star
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      first, *middle, last = [10, 20, 30, 40]
      print(middle, last)
    answer: "[20, 30] 40"
    explanation: >-
      first takes the first item (10), last takes the final item (40), and the starred name collects
      everything in between as a list: [20, 30].
    wrongAnswers:
      - answer: "(20, 30) 40"
        feedback: The starred name always receives a list, whatever kind of sequence is being unpacked.
      - answer: "20 40"
        feedback: "*middle collects all the remaining middle items, not just one."
      - answer: "[20, 30, 40] 40"
        feedback: Plain names are filled first; last takes 40, so the starred name gets only what is left between them.

  - id: explain-tuple-vs-list
    type: explain
    skill: design
    difficulty: 2
    prompt: |
      A colleague stores each user's birth date as a list such as `[1990, 7, 14]`, and keeps all the
      users' birth dates in another list. Explain which of these should be a tuple and which should stay a
      list, and why.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says each birth date should be a tuple, because it has a fixed number of parts and each position has a meaning (year, month, day).
      - Says the collection of all dates should stay a list, because it grows as users are added and every item is the same kind of thing.
      - Mentions that immutability prevents accidental changes, such as appending a fourth part to a date.
      - Mentions that tuples (of hashable items) can be dictionary keys or set items, while lists cannot.
    modelAnswer: |
      Each individual date is a record: exactly three parts, where position 0 always means the year,
      1 the month and 2 the day. That is what tuples are for, so write `(1990, 7, 14)`. Being immutable, a
      tuple can't accidentally gain a fourth part or have its month overwritten, and it can be used as a
      dictionary key or put in a set (for example to count users per birth date). The collection of all
      users' dates is different: it grows as users sign up and every item is "another date", so it should
      remain a list — a list of tuples.

  - id: rotate-three
    type: code
    skill: implementation
    prompt: |
      Three runners stand in a line. Using **one unpacking assignment**, rotate them so the first runner
      moves to the back. After your line, `a` should refer to `"Ben"`, `b` to `"Chen"` and `c` to `"Asha"`.

      **Constraints:** don't type the names again, and don't use a temporary variable.
    starterCode: |
      a = "Asha"
      b = "Ben"
      c = "Chen"

      # Rotate in one line here.

      print(a, b, c)
    solution: |
      a = "Asha"
      b = "Ben"
      c = "Chen"

      a, b, c = b, c, a

      print(a, b, c)
    expectedOutput: |
      Ben Chen Asha
    tests:
      - name: the runners are rotated
        code: |
          assert (a, b, c) == ("Ben", "Chen", "Asha"), f"After rotating, a, b, c should be Ben Chen Asha, but they are {a} {b} {c}."
      - name: rotation uses one unpacking assignment
        code: |
          import ast
          tree = ast.parse(source)
          rotations = [
              n for n in ast.walk(tree)
              if isinstance(n, ast.Assign)
              and isinstance(n.targets[0], ast.Tuple)
              and isinstance(n.value, ast.Tuple)
              and all(isinstance(e, ast.Name) for e in n.value.elts)
          ]
          assert rotations, "Rotate with a single unpacking assignment like `a, b, c = ...` whose right side lists the existing names."
          assigns = [n for n in ast.walk(tree) if isinstance(n, ast.Assign)]
          assert len(assigns) == 4, "Use exactly one extra assignment: no temporary variables and no separate a = ..., b = ... lines."
      - name: names are not retyped
        code: |
          assert all(source.count(word) == 1 for word in ("Asha", "Ben", "Chen")), "Move the existing values with names; don't type the strings again."
      - name: prints the new order
        code: |
          assert output_lines() == ["Ben Chen Asha"], f"Expected the line 'Ben Chen Asha' but your program printed {output()!r}."
    hints:
      - After the rotation, which current name holds the value that a should get? Write that name first on the right-hand side.
      - "The pattern is `a, b, c = <new a>, <new b>, <new c>`."
      - It is safe to mention a on the right while a is also on the left, because the whole right side is evaluated before any name is rebound.
    feedback:
      - when: { outputEquals: "Ben Chen Ben\n" }
        message: >-
          You rebound the names one at a time, so when `c = a` ran, a already referred to "Ben" and "Asha"
          was lost. Use one unpacking assignment, which evaluates the whole right side first.
      - when: { outputEquals: "Chen Asha Ben\n" }
        message: That rotates the other way (the last runner moved to the front). a should end up with the old b.
    explanation: >-
      `a, b, c = b, c, a` first evaluates the right side using the current objects ("Ben", "Chen", "Asha")
      and only then binds a, b and c to them in order. Nothing is lost because no name changes until all the
      values have been collected.

  - id: best-score
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      `results` is a list of `(name, score)` tuples. Loop over it, **unpacking each tuple into `name` and
      `score` in the loop header**, and find the highest score. Store the winner in `best_name` and
      `best_score`, then print them, for example `Ben 95`.

      Your code must work for any non-empty list of results (assume there are no ties).
    starterCode: |
      results = [("Asha", 82), ("Ben", 95), ("Chen", 78)]

    solution: |
      results = [("Asha", 82), ("Ben", 95), ("Chen", 78)]

      best_name, best_score = results[0]
      for name, score in results:
          if score > best_score:
              best_name, best_score = name, score
      print(best_name, best_score)
    expectedOutput: |
      Ben 95
    tests:
      - name: finds the winner
        code: |
          assert defined("best_name") and defined("best_score"), "Create the variables best_name and best_score."
          assert (best_name, best_score) == ("Ben", 95), f"The winner is Ben with 95, but best_name, best_score are {best_name!r}, {best_score!r}."
      - name: unpacks in the loop header
        code: |
          import ast
          loops = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.For) and isinstance(n.target, ast.Tuple)]
          assert loops, "Unpack each tuple in the loop header: `for name, score in results:`."
      - name: works for other results
        code: |
          import re
          other = 'results = [("Dev", 40), ("Eli", 61), ("Fay", 59), ("Gus", 12)]\n'
          changed = re.sub(r"results\s*=\s*\[.*?\]\n", other, source, count=1, flags=re.S)
          assert changed != source, "Keep the line that creates results so the checks can try other data."
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert (ns.get("best_name"), ns.get("best_score")) == ("Eli", 61), "With other results your code found the wrong winner. Compare each score with the best so far instead of using fixed values."
      - name: prints the winner
        code: |
          assert output().strip() == "Ben 95", f"Print best_name and best_score, e.g. Ben 95. Your program printed {output()!r}."
    hints:
      - "Start with the first result as the best so far: `best_name, best_score = results[0]` (unpacking again!)."
      - Inside the loop, compare score with best_score. Only when it is bigger, update both names.
      - "`for name, score in results:` unpacks each tuple for you, so you don't need any indexing."
    feedback:
      - when: { outputEquals: "Chen 78\n" }
        message: Your loop keeps the last result rather than the best one. Update best_name and best_score only when score > best_score.
      - when: { errorType: ValueError }
        message: >-
          An unpacking has the wrong number of names. Each item of results is a tuple of two values, so
          unpack it into exactly two names.
    explanation: >-
      Unpacking in the loop header gives each part of the record a readable name. The "best so far" pattern
      starts from the first record and replaces it whenever a better score appears, so it works for any
      list.

  - id: debug-trailing-comma
    type: debug
    skill: debugging
    prompt: |
      This program should print the total cost, `750`, but it prints `(250, 250, 250)`. Find and fix the
      one-character bug.
    starterCode: |
      price = 250,
      quantity = 3
      total = price * quantity
      print(total)
    solution: |
      price = 250
      quantity = 3
      total = price * quantity
      print(total)
    expectedOutput: |
      750
    tests:
      - name: price is a number
        code: |
          assert isinstance(price, int), f"price should be the integer 250, but it is {price!r}, a {type(price).__name__}."
      - name: total is calculated from price and quantity
        code: |
          import ast
          used = set()
          for node in ast.walk(ast.parse(source)):
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "total" for t in node.targets):
                  used |= {n.id for n in ast.walk(node.value) if isinstance(n, ast.Name)}
          assert {"price", "quantity"} <= used, "Keep calculating total from price and quantity."
          assert total == 750, f"total should be 750, but it is {total!r}."
      - name: prints 750
        code: |
          assert output().strip() == "750", f"Expected 750 but your program printed {output()!r}."
    hints:
      - Add `print(price)` after line 1. What does it show, and what type is that?
      - A comma after a value packs it into a one-item tuple, and `*` on a tuple repeats it.
      - Remove the comma at the end of line 1.
    feedback:
      - when: { outputContains: "(" }
        message: The result is still a tuple. Look at the very end of line 1 — a trailing comma packs 250 into a one-item tuple.
    explanation: >-
      `price = 250,` packs 250 into the tuple `(250,)`. Multiplying a tuple by 3 repeats it, so no error is
      raised and the wrong value flows through the program. Removing the comma makes price the integer 250.

  - id: parsons-unpack
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines so the program prints the race winner and how many other runners finished. Two
      lines are distractors that do not belong.
    solution: |
      finishers = ("Mo", "Lin", "Kai", "Ana")
      winner, *others = finishers
      print("Winner:", winner)
      print("Others:", len(others))
    distractors:
      - winner, others = finishers
      - "*winner, others = finishers"
    expectedOutput: |
      Winner: Mo
      Others: 3
    explanation: >-
      `winner, *others = finishers` binds the first runner to winner and collects the other three into a
      list. Without the star, two names can't unpack four items (ValueError); with the star on winner,
      winner would collect the first three and others would get only "Ana".

  # ----- Mastery check (new items, not used in the sections above) -----
  - id: m-predict-fib-swap
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      a, b = 1, 2
      a, b = b, a + b
      print(a, b)
    answer: "2 3"
    explanation: >-
      The right side of line 2 is evaluated completely first, using the old values: (b, a + b) is (2, 1 + 2)
      = (2, 3). Only then are a and b rebound, to 2 and 3.
    wrongAnswers:
      - answer: "2 4"
        feedback: >-
          That would happen if a were rebound to 2 before a + b was calculated. Unpacking evaluates the
          whole right side first, so a + b uses the old a, which is 1.
      - answer: "(2, 3)"
        feedback: print(a, b) prints two separate values separated by a space, not a tuple.

  - id: m-tf-star-list
    type: true-false
    skill: recognition
    prompt: "True or false: after `first, *rest = (1, 2, 3)`, the name `rest` refers to the tuple `(2, 3)`."
    answer: false
    explanation: >-
      The starred name in extended unpacking always receives a list — here `[2, 3]` — no matter what kind
      of sequence is being unpacked.

  - id: m-mcq-key
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: Which of these values could be used as a dictionary key?
    explanation: >-
      Dictionary keys must be hashable. A tuple is hashable only if every item inside it is hashable, so a
      tuple of ints works, but a tuple that contains a list does not. Lists and dictionaries are mutable and
      never hashable.
    options:
      - id: a
        text: "`[2026, 10, 22]`"
        feedback: Lists can change, so they are not hashable and can't be keys. Use a tuple instead.
      - id: b
        text: "`(2026, 10, 22)`"
        correct: true
        feedback: A tuple of integers can never change, so it is hashable and works as a key.
      - id: c
        text: "`(\"Asha\", [90, 85])`"
        feedback: It is a tuple, but it contains a list, which could change. The whole tuple is therefore unhashable.
      - id: d
        text: "`{\"year\": 2026}`"
        feedback: Dictionaries are mutable, so they can't be used as keys of other dictionaries.

  - id: m-code-inner
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A sensor sends batches of readings. The **first and last** reading of each batch are calibration
      values that must be ignored. Use **extended unpacking** (one assignment with `*`) to bind `inner` to
      the middle readings, then print their total. For the batch below the output is `88`.

      Your code must work for any batch of at least two readings.
    starterCode: |
      readings = (5, 21, 25, 23, 19, 7)

    solution: |
      readings = (5, 21, 25, 23, 19, 7)
      first, *inner, last = readings
      print(sum(inner))
    expectedOutput: |
      88
    tests:
      - name: inner holds the middle readings
        code: |
          assert defined("inner"), "Create a starred name called inner, e.g. `first, *inner, last = readings`."
          assert inner == [21, 25, 23, 19], f"inner should be [21, 25, 23, 19], but it is {inner!r}."
      - name: uses extended unpacking
        code: |
          import ast
          ok = any(
              isinstance(n, ast.Assign)
              and isinstance(n.targets[0], (ast.Tuple, ast.List))
              and any(isinstance(e, ast.Starred) for e in n.targets[0].elts)
              for n in ast.walk(ast.parse(source))
          )
          assert ok, "Use extended unpacking: one assignment with a starred name on the left, like `first, *inner, last = readings`."
      - name: works for another batch
        code: |
          import re
          changed = re.sub(r"readings\s*=\s*\(.*?\)\n", "readings = (1, 2, 3, 100)\n", source, count=1, flags=re.S)
          assert changed != source, "Keep the line that creates readings so the checks can try another batch."
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert ns.get("inner") == [2, 3], "With readings (1, 2, 3, 100), inner should be [2, 3]. Unpack readings itself rather than typing values."
      - name: prints the total
        code: |
          assert output().strip() == "88", f"Print the total of the middle readings (88). Your program printed {output()!r}."
    hints:
      - You need three names on the left - one for the first reading, a starred one for the middle, one for the last.
      - "`a, *b, c = (1, 2, 3, 4)` makes b the list [2, 3]."
      - sum() adds up a list of numbers.
    feedback:
      - when: { outputEquals: "100\n" }
        message: That is the total of all six readings. Leave out the first and last calibration values.
      - when: { codeContains: "[1:-1]" }
        message: Slicing would work too, but this exercise practises extended unpacking. Use a starred name on the left of =.
    explanation: >-
      `first, *inner, last = readings` fills first and last from the two ends and collects everything in
      between into the list inner, however long the batch is. sum(inner) then adds 21 + 25 + 23 + 19 = 88.

  - id: m-debug-unpack
    type: debug
    skill: debugging
    prompt: |
      This weather report crashes with a `ValueError`. Each entry has **four** parts: date, conditions,
      high temperature and low temperature. Fix the unpacking so the program prints `2026-10-22 high 14`.
      Keep using unpacking (don't switch to indexing).
    starterCode: |
      entry = ("2026-10-22", "rain", 14, 9)
      date, conditions, high = entry
      print(date, "high", high)
    solution: |
      entry = ("2026-10-22", "rain", 14, 9)
      date, conditions, high, low = entry
      print(date, "high", high)
    expectedOutput: |
      2026-10-22 high 14
    tests:
      - name: prints the report
        code: |
          assert output().strip() == "2026-10-22 high 14", f"Expected '2026-10-22 high 14' but your program printed {output()!r}."
      - name: still unpacks entry
        code: |
          import ast
          ok = any(
              isinstance(n, ast.Assign) and isinstance(n.targets[0], ast.Tuple)
              and isinstance(n.value, ast.Name) and n.value.id == "entry"
              for n in ast.walk(ast.parse(source))
          )
          assert ok, "Keep unpacking entry with several names on the left of =."
      - name: works for another entry
        code: |
          import re
          changed = re.sub(r"entry\s*=\s*\(.*?\)\n", 'entry = ("2026-12-01", "sun", 31, 22)\n', source, count=1, flags=re.S)
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert (ns.get("date"), ns.get("high")) == ("2026-12-01", 31), "date and high should come from entry by unpacking, so they change when entry changes."
    hints:
      - "Read the error: how many values did Python expect, and how many does entry have?"
      - Every item needs a name on the left, or the extras must be collected by a starred name.
      - Add a fourth name such as low, or use `*_` for the parts you don't need.
    feedback:
      - when: { errorType: ValueError }
        message: The number of names on the left still doesn't match the four items in entry. Add a name, or collect extras with a starred name.
    explanation: >-
      Unpacking requires exactly one name per item. entry has four items but only three names were given,
      so Python raised "too many values to unpack (expected 3, got 4)". Adding `low` (or a starred `*_`)
      makes the counts match.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-fib-swap, m-tf-star-list, m-mcq-key, m-code-inner, m-debug-unpack]

cheatsheet: |
  ```python
  point = (3, 4)          # tuple; same as point = 3, 4
  one = (5,)              # one-item tuple needs the comma; (5) is just 5
  empty = ()
  x, y = point            # unpacking: counts must match
  a, b = b, a             # swap: right side evaluated first
  first, *rest = items    # rest is always a list
  for name, score in results: ...   # unpack in a loop
  q, r = divmod(17, 5)    # functions can hand back tuples
  t = t + (6,)            # "change" = build a new tuple and rebind
  ```
  - Tuples: indexing, slicing, len, in, count(), index() — but no item assignment, append or remove.
  - List = growing collection of similar items · tuple = fixed record, each position has a meaning.
  - ValueError "too many / not enough values to unpack" → count both sides.
