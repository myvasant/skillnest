id: python.variables
concept: python.variables
title: Variables and Assignment
subtitle: Names that refer to values
estimatedMinutes: 35
reviewedOn: 2026-10-22
summary: >-
  Learn what really happens when you write `x = 5`: Python creates (or finds) an object and binds a
  name to it. This mental model explains reassignment, aliasing and the most common beginner errors.
objectives:
  - Explain a variable as a name bound to an object, and what the assignment statement does step by step.
  - Predict the values of variables after a sequence of assignments, including reassignment and `+=`.
  - Use variables to store, update and combine values in a short program.
  - Choose valid, readable names and recognise invalid ones.
  - Diagnose and fix NameError and other common assignment mistakes.
sources:
  - title: "Python Language Reference: Naming and binding"
    url: https://docs.python.org/3/reference/executionmodel.html#naming-and-binding
    publisher: Python Software Foundation
  - title: "Python Language Reference: Assignment statements"
    url: https://docs.python.org/3/reference/simple_stmts.html#assignment-statements
    publisher: Python Software Foundation
  - title: "Python Language Reference: Identifiers and keywords"
    url: https://docs.python.org/3/reference/lexical_analysis.html#identifiers
    publisher: Python Software Foundation
  - title: "PEP 8: Naming Conventions"
    url: https://peps.python.org/pep-0008/#naming-conventions
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why programs need names
    kind: why
    blocks:
      - type: markdown
        body: |
          A program constantly needs to **remember** things: a price, a user's name, a running total,
          the result of a calculation it will use again later.

          Look at this program, which works out the cost of 3 notebooks and 2 pens. It works, but
          every number is typed directly into the calculation:
      - type: code
        runnable: true
        code: |
          print(45 * 3 + 12 * 2)
          print((45 * 3 + 12 * 2) * 18 / 100)
        expectedOutput: |
          159
          28.62
        caption: Total cost, then 18% tax on it. Can you tell which number is the pen price?
      - type: markdown
        body: |
          Three problems appear immediately:

          1. **It is hard to read.** Nothing says that 45 is a notebook price or that 18 is a tax rate.
          2. **It repeats work.** The total is calculated twice.
          3. **It is fragile.** If the notebook price changes, you must find and edit every `45` — and not
             accidentally change some other 45.

          A [variable](glossary:variable) solves all three by giving a value a **name**:
      - type: code
        runnable: true
        code: |
          notebook_price = 45
          pen_price = 12
          tax_rate = 18

          total = notebook_price * 3 + pen_price * 2
          tax = total * tax_rate / 100

          print(total)
          print(tax)
        expectedOutput: |
          159
          28.62
        caption: Same result, but now the program explains itself, and each value is defined once.
        annotations:
          - line: 1
            text: The name `notebook_price` now refers to the integer 45.
          - line: 5
            text: The right-hand side is calculated first (159), then the name `total` is attached to the result.
          - line: 6
            text: "`total` is reused instead of recalculating it."

  - id: what
    title: What a variable really is
    kind: concept
    blocks:
      - type: markdown
        body: |
          In Python, a **variable is a name that refers to an object**. An **object** is a piece of data
          in the computer's memory — the number 45, the text `"Ada"`, a list of scores. Every object has a
          [type](glossary:type) (what kind of thing it is) and a value.

          You create the connection between a name and an object with an
          [assignment statement](glossary:assignment):

          ```text
          name = expression
          ```

          Python carries out an assignment in **two steps, always in this order**:

          1. **Evaluate the right-hand side.** Work out the value of the
             [expression](glossary:expression) — this produces an object.
          2. **Bind the name.** Make the name on the left refer to that object. If the name did not
             exist, it is created. If it did, it now refers to the new object instead.

          That is why `=` in Python does **not** mean "is equal to" as it does in maths. It means
          "make this name refer to the result of this expression". (Checking equality uses `==`, which you
          will meet in the lesson on [booleans](concept:python.booleans).)
      - type: code
        runnable: true
        code: |
          age = 30
          name = "Ada"
          height_m = 1.65

          print(name)
          print(age)
          print(height_m)
        expectedOutput: |
          Ada
          30
          1.65
        annotations:
          - line: 1
            text: An integer object 30 is created and the name `age` is bound to it.
          - line: 2
            text: Text values (strings) need quotes. The quotes are not part of the value.
          - line: 5
            text: "`print(name)` looks up what `name` refers to and displays it: Ada, without quotes."
      - type: callout
        variant: misconception
        title: '"name" is not the same as name'
        body: |
          `print("name")` prints the four letters *n-a-m-e*. `print(name)` prints whatever the variable
          `name` refers to. Quotes mean "this exact text"; no quotes means "look this name up".
      - type: item
        ref: what-is-assignment

  - id: mental-model
    title: "Mental model: names are labels, not boxes"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Many textbooks describe a variable as a **box** that holds a value. That picture works for some
          languages, but for Python it leads to wrong predictions later on (especially with lists).

          A more accurate picture: **objects live in memory, and names are labels (or arrows) pointing at
          them.** Assignment moves a label; it never copies an object into a box.
      - type: callout
        variant: analogy
        title: Name tags at a conference
        body: |
          Think of objects as people at a conference and names as name tags. One person can wear several
          tags (two names, one object). Moving a tag to another person does not change either person.
          A person with no tags left is eventually escorted out — Python frees objects nobody refers to.
      - type: visualization
        component: python-tracer
        title: Step through an assignment
        caption: >-
          Use Next to execute one line at a time. The left column lists names; arrows show which object
          each name refers to. The highlighted line is the one about to run.
        props:
          code: |
            price = 20
            quantity = 3
            total = price * quantity
            print(total)
      - type: markdown
        body: |
          Notice at step 3 that `total` points to a **new** object, 60. It is not linked to `price` or
          `quantity`: if you later change `price`, `total` stays 60 until you recalculate it.

  - id: reassignment
    title: Reassignment and updating values
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A name can be **rebound** to a different object at any time. This is called *reassignment*.
          Because the right-hand side is evaluated **before** the name is rebound, a variable can appear
          on both sides:
      - type: code
        runnable: true
        code: |
          count = 1
          count = count + 1
          print(count)
        expectedOutput: |
          2
        annotations:
          - line: 2
            text: "Step 1: evaluate `count + 1` using the *current* object (1) → 2. Step 2: rebind `count` to 2."
      - type: callout
        variant: misconception
        title: "\"count = count + 1 is impossible\""
        body: |
          In algebra, *x = x + 1* has no solution. In Python it is an instruction, not an equation:
          "take what `count` refers to now, add 1, and make `count` refer to the result".
      - type: visualization
        component: python-tracer
        title: Watch the label move
        caption: "Each assignment points `score` at a new object. The old objects lose their label."
        props:
          code: |
            score = 10
            score = score + 5
            score = score * 2
            print(score)
      - type: markdown
        body: |
          Updating a variable based on its current value is so common that Python has a shortcut,
          [augmented assignment](glossary:augmented-assignment):

          | Long form | Short form |
          |---|---|
          | `total = total + 5` | `total += 5` |
          | `total = total - 5` | `total -= 5` |
          | `total = total * 2` | `total *= 2` |
          | `total = total / 2` | `total /= 2` |
      - type: code
        runnable: true
        code: |
          balance = 1000
          balance += 250   # deposit
          balance -= 100   # withdrawal
          print(balance)
        expectedOutput: |
          1150
      - type: item
        ref: predict-reassign

  - id: aliasing
    title: Two names, one object
    kind: concept
    blocks:
      - type: markdown
        body: |
          What does `b = a` do? Apply the two steps: evaluate the right-hand side — the name `a` evaluates
          to **the object `a` currently refers to** — then bind `b` to that same object.

          No copy is made. Both names now refer to one object. This is called
          [aliasing](glossary:aliasing).

          What happens if you then rebind `a`?
      - type: item
        ref: predict-alias
      - type: visualization
        component: python-tracer
        title: Rebinding one name leaves the other alone
        caption: After line 2 both labels point at 10. Line 3 moves only the `a` label.
        props:
          code: |
            a = 10
            b = a
            a = 20
            print(a, b)
      - type: markdown
        body: |
          `b` still refers to 10, because assignment to `a` only moves the `a` label. There is no hidden
          link between the two names.

          With numbers and strings this is all you need to know, because those objects can never be changed
          in place (they are [immutable](glossary:immutable)). Lists and dictionaries **can** be changed in
          place, and then aliasing matters a lot — the
          [mutability lesson](concept:python.mutability) builds directly on this picture.
      - type: callout
        variant: deep-dive
        title: Seeing identity with id() and is
        depth: deep
        body: |
          `id(x)` returns an integer that is unique to the object `x` refers to for as long as that object
          exists. `a is b` is `True` when both names refer to the very same object.

          ```python
          a = [1, 2]
          b = a
          print(a is b)        # True - one object, two names
          c = [1, 2]
          print(a is c)        # False - equal value, different object
          print(a == c)        # True - == compares values
          ```

          Be careful with numbers and short strings: CPython reuses some small objects (for example the
          integers -5 to 256) as an optimisation, so `is` may report `True` for "different" small numbers.
          That is an implementation detail. **Use `==` to compare values; use `is` only for identity
          checks such as `x is None`.**
      - type: item
        ref: explain-aliasing

  - id: dynamic-typing
    title: Names don't have types — objects do
    kind: concept
    blocks:
      - type: markdown
        body: |
          In some languages you declare a variable's type (`int count;`) and it can only ever hold integers.
          Python is [dynamically typed](glossary:dynamic-typing): a name can be rebound to an object of any
          type. The **object** carries the type.
      - type: code
        runnable: true
        code: |
          value = 42
          print(type(value))
          value = "forty-two"
          print(type(value))
        expectedOutput: |
          <class 'int'>
          <class 'str'>
        annotations:
          - line: 2
            text: "`type()` reports the type of the object the name currently refers to."
      - type: callout
        variant: tip
        title: Possible is not the same as wise
        body: |
          Rebinding a name to a different *kind* of value usually makes code harder to follow. Keep one
          meaning per name. Later you will add [type hints](concept:python.type-hints) so tools can check
          this for you.

  - id: naming
    title: Naming rules and conventions
    kind: concept
    blocks:
      - type: markdown
        body: |
          **Rules** (break these and Python raises a `SyntaxError`):

          - Use letters, digits and underscores only: `total_2`, `_count`.
          - Do not start with a digit: `2nd_place` is invalid.
          - Do not use a [keyword](glossary:keyword) such as `if`, `for`, `class`, `True`, `None`.
          - Names are **case-sensitive**: `Score`, `score` and `SCORE` are three different names.

          **Conventions** (Python runs either way, but other programmers expect these —
          [PEP 8](https://peps.python.org/pep-0008/#naming-conventions)):

          - Use `snake_case` for variables: `unit_price`, not `unitPrice` or `UnitPrice`.
          - Choose descriptive names: `seconds_elapsed` beats `s` or `x2`.
          - Use `UPPER_CASE` for values meant to stay constant: `TAX_RATE = 18`. Python does not enforce
            this; it is a signal to readers.
          - Avoid reusing names of built-in functions such as `print`, `list`, `str`, `input`, `sum`.
      - type: code
        runnable: true
        code: |
          import keyword
          print(len(keyword.kwlist), "keywords, for example:", keyword.kwlist[:6])
        expectedOutput: |
          35 keywords, for example: ['False', 'None', 'True', 'and', 'as', 'assert']
        caption: The keyword module lists every reserved word in this Python version.
        depth: deep
      - type: item
        ref: valid-names
      - type: item
        ref: shadow-print

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `NameError: name 'totl' is not defined` | Typo, or wrong capitalisation | Compare the spelling with where the name was assigned. Python's "Did you mean …?" hint helps. |
          | `NameError` for a name you *did* assign | You used it **before** the line that assigns it | Programs run top to bottom; move the assignment earlier. |
          | `SyntaxError: cannot assign to literal` | Sides swapped: `5 = x` | The name goes on the **left**: `x = 5`. |
          | Prints the name instead of the value | Quotes around the name: `print("total")` | Remove the quotes. |
          | `TypeError: 'str' object is not callable` | You rebound a built-in, e.g. `print = "hi"` | Rename your variable; restart so the built-in is available again. |
      - type: code
        runnable: true
        code: |
          subtotal = 120
          print(subtotl)
        expectError: NameError
        caption: Run this to see a real NameError. Read the last line first, then the line number.
      - type: markdown
        body: |
          Read error messages **from the bottom up**: the last line names the error and describes it; the
          lines above show where it happened. Here Python even suggests the name you probably meant.
      - type: item
        ref: debug-nameerror

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          Write the code yourself before looking at hints. Struggling for a few minutes is part of
          learning — the checks will tell you exactly what is still missing.
      - type: item
        ref: total-price
      - type: item
        ref: swap-values
      - type: item
        ref: parsons-average

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Namespaces.** Python keeps track of names in [namespaces](glossary:namespace) — essentially
          dictionaries mapping names to objects. Top-level variables in a script live in the module's
          *global namespace*; you can even look at it with `globals()`. Assignment adds or updates an entry;
          looking a name up reads it. A `NameError` means the lookup found no entry in any namespace that
          was searched.

          **Objects are reclaimed automatically.** CPython counts how many references point at each
          object. When the count drops to zero — for example after the last name is rebound — the memory
          can be reused. `del name` removes a *name*, not necessarily the object: if another name still
          refers to it, the object lives on.

          **Assignment never copies.** Copying only happens when you ask for it explicitly (for example
          `list(original)` or `copy.copy()`), which you will study in
          [shallow and deep copies](concept:python.copying).
      - type: code
        runnable: true
        code: |
          a = "hello"
          b = a
          del a
          print(b)
          print("a" in globals(), "b" in globals())
        expectedOutput: |
          hello
          False True
        caption: "`del a` removed the name a. The string survives because b still refers to it."

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **variable is a name bound to an object**. Objects have types; names do not.
          - `name = expression` → evaluate the right side, **then** bind the name.
          - Reassignment moves the label to a new object; other names are unaffected.
          - `b = a` makes two names refer to the **same** object — no copy.
          - Names: letters, digits, `_`; not starting with a digit; not a keyword; case-sensitive;
            `snake_case` by convention.
          - `NameError` = Python could not find the name: check spelling, case, and order.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Is a Python variable a box or a reference?" — Explain that names are references (bindings) to
          objects, show `b = a` followed by rebinding `a`, and mention that the difference becomes visible
          with mutable objects such as lists.

items:
  - id: what-is-assignment
    type: mcq
    skill: recognition
    prompt: "What does the statement `score = 90` do?"
    explanation: >-
      Assignment evaluates the right-hand side (the integer 90) and then binds the name `score` to that
      object. It does not compare anything and does not fix the type of `score`.
    options:
      - id: a
        text: Checks whether score is equal to 90
        feedback: Checking equality uses `==`. A single `=` is assignment.
      - id: b
        text: Makes the name score refer to an integer object with the value 90
        correct: true
        feedback: Exactly — the name is bound to the object.
      - id: c
        text: Declares that score may only ever refer to integers
        feedback: Python names have no fixed type. `score = "ninety"` later would be allowed.
      - id: d
        text: Prints 90 on the screen
        feedback: Assignment produces no output. Use print(score) to display the value.

  - id: predict-reassign
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      x = 5
      x = x + 2
      x = x * 3
      print(x)
    answer: "21"
    explanation: >-
      Line 2 evaluates 5 + 2 = 7 and rebinds x to 7. Line 3 evaluates 7 * 3 = 21 and rebinds x to 21.
      Each line uses whatever x refers to at that moment.
    wrongAnswers:
      - answer: "15"
        feedback: >-
          That would be 5 * 3. But line 2 already rebound x to 7, so line 3 computes 7 * 3. Each
          assignment changes what x refers to from then on.
      - answer: "5"
        feedback: >-
          Reassignment really does replace the value: after line 2, x refers to 7, and after line 3 to 21.
      - answer: "x"
        feedback: print(x) without quotes prints the value the name refers to, not the letter x.

  - id: predict-alias
    type: predict-output
    skill: prediction
    prompt: Predict the output before you step through it below.
    code: |
      a = 10
      b = a
      a = 20
      print(a, b)
    answer: "20 10"
    explanation: >-
      `b = a` binds b to the object a referred to at that moment (10). Rebinding a to 20 moves only the a
      label, so b still refers to 10.
    wrongAnswers:
      - answer: "20 20"
        feedback: >-
          This is the "linked variables" misconception. `b = a` does not create a permanent link; it binds b
          to the object 10. Line 3 moves only a's label.
      - answer: "10 10"
        feedback: Line 3 does rebind a to 20, so the first value printed is 20.
      - answer: "10 20"
        feedback: print(a, b) prints a first. a is 20 and b is still 10.

  - id: explain-aliasing
    type: explain
    skill: explanation
    prompt: >-
      In your own words, explain why `b` is still 10 after `a = 10`, `b = a`, `a = 20`. Imagine
      explaining it to a friend who thinks variables are boxes.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says that names refer to (are bound to) objects rather than containing copies.
      - Explains that `b = a` binds b to the same object a referred to at that time.
      - Explains that `a = 20` rebinds only a; it does not affect b.
      - Uses the two-step rule — evaluate the right side, then bind the name.
    modelAnswer: |
      In Python a variable is a name that points to an object. `a = 10` points a at the object 10.
      `b = a` evaluates the right side — the object a points to, which is 10 — and points b at that same
      object. `a = 20` evaluates 20 and moves only a's pointer. Nothing tells b to move, so b still points
      to 10. There are no boxes and no copies, just labels being attached to objects.

  - id: valid-names
    type: mcq
    skill: recognition
    prompt: Which of these is a valid Python variable name?
    explanation: >-
      Names may contain letters, digits and underscores, must not start with a digit, and must not be a
      keyword. `_count2` satisfies every rule.
    options:
      - id: a
        text: "`2nd_place`"
        feedback: Names cannot start with a digit.
      - id: b
        text: "`total-price`"
        feedback: The hyphen is the minus operator, so Python reads this as total minus price.
      - id: c
        text: "`class`"
        feedback: "`class` is a keyword reserved by the language."
      - id: d
        text: "`_count2`"
        correct: true
        feedback: Valid. Leading underscores are allowed (by convention they hint at "internal use").

  - id: shadow-print
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      A program contains these two lines (with other code between them):

      ```python
      print = "Report finished"
      print("Done")
      ```

      The second line fails with `TypeError: 'str' object is not callable`. Why?
    explanation: >-
      The first line rebinds the name `print` in the program's namespace to a string. When Python looks up
      `print` on the second line it finds that string, and strings cannot be called like functions. The
      built-in function still exists, but this name now hides (shadows) it.
    options:
      - id: a
        text: print can only be used once per program.
        feedback: You can call print as many times as you like — as long as the name still refers to the function.
      - id: b
        text: The name print now refers to a string, which hides the built-in print function.
        correct: true
        feedback: Right. Assignment rebinds any name, even built-in ones. Choose a different name such as `message`.
      - id: c
        text: '"Done" needs single quotes.'
        feedback: Single and double quotes are equivalent for strings.
      - id: d
        text: Python is out of memory.
        feedback: The error message tells you the real cause - a string is being called like a function.

  - id: debug-nameerror
    type: debug
    skill: debugging
    prompt: |
      This program should print `Hello, Ada` but crashes. Run it, read the error, and fix it.
    starterCode: |
      first_name = "Ada"
      greeting = "Hello, " + firstname
      print(greeting)
    solution: |
      first_name = "Ada"
      greeting = "Hello, " + first_name
      print(greeting)
    expectedOutput: |
      Hello, Ada
    tests:
      - name: Prints the greeting
        code: |
          assert output() == "Hello, Ada\n", f"Expected 'Hello, Ada' but your program printed {output()!r}"
      - name: Keeps the first_name variable
        code: |
          assert first_name == "Ada", "Keep the variable first_name with the value 'Ada'."
    hints:
      - Read the last line of the error message. Which name does Python say is not defined?
      - Compare that name, letter by letter, with the name created on line 1.
    feedback:
      - when: { errorType: NameError }
        message: >-
          Python still cannot find a name. Names must match exactly — `firstname` and `first_name` are
          different names.
      - when: { outputEquals: "Hello, first_name\n" }
        message: >-
          The quotes turned the name into literal text. Use the variable without quotes so Python looks up
          its value.
    explanation: >-
      The variable was created as `first_name` but used as `firstname`. To Python those are completely
      different names, so the lookup fails with NameError. Fixing the spelling makes the lookup succeed.

  - id: total-price
    type: code
    skill: implementation
    prompt: |
      A shop sells notebooks for 45 rupees each. Write a program that:

      1. creates a variable `price` referring to 45,
      2. creates a variable `quantity` referring to 4,
      3. creates a variable `total` **calculated from** `price` and `quantity`,
      4. prints `total`.
    starterCode: |
      # Create price and quantity, then calculate total from them.

    solution: |
      price = 45
      quantity = 4
      total = price * quantity
      print(total)
    expectedOutput: |
      180
    tests:
      - name: price is 45
        code: |
          assert defined("price"), "Create a variable named price."
          assert price == 45, f"price should be 45, but it is {price!r}."
      - name: quantity is 4
        code: |
          assert defined("quantity"), "Create a variable named quantity."
          assert quantity == 4, f"quantity should be 4, but it is {quantity!r}."
      - name: total is calculated from the variables
        code: |
          import ast
          tree = ast.parse(source)
          used = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "total" for t in node.targets):
                  used |= {n.id for n in ast.walk(node.value) if isinstance(n, ast.Name)}
          assert defined("total"), "Create a variable named total."
          assert {"price", "quantity"} <= used, "Calculate total from price and quantity instead of typing the number 180."
          assert total == 180, f"total should be 180, but it is {total!r}."
      - name: prints the total
        code: |
          assert output().strip() == "180", f"Print the total. Your program printed {output()!r}."
    hints:
      - "Multiplication uses `*`."
      - "The third line can be `total = price * quantity` — the names on the right are looked up first."
      - Don't forget to print(total) at the end.
    feedback:
      - when: { outputEquals: "total\n" }
        message: You printed the text "total". Remove the quotes so Python prints the value the name refers to.
      - when: { errorType: NameError }
        message: A name is used before it is assigned, or is misspelled. Python runs top to bottom — create price and quantity before total.
    explanation: >-
      Each value gets a descriptive name. `total = price * quantity` evaluates the right side using the
      current objects (45 * 4 = 180) and binds total to the result.

  - id: swap-values
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Two cups are labelled: `left` refers to `"coffee"` and `right` refers to `"tea"`.
      Swap them so that `left` refers to `"tea"` and `right` refers to `"coffee"`.

      **Constraint:** do not type the words `"coffee"` or `"tea"` again — move the labels using assignment.
    starterCode: |
      left = "coffee"
      right = "tea"

      # Swap the values here.

      print(left, right)
    solution: |
      left = "coffee"
      right = "tea"

      temp = left
      left = right
      right = temp

      print(left, right)
    expectedOutput: |
      tea coffee
    tests:
      - name: left now refers to tea
        code: |
          assert left == "tea", f"left should be 'tea' but it is {left!r}."
      - name: right now refers to coffee
        code: |
          assert right == "coffee", f"right should be 'coffee' but it is {right!r}."
      - name: values moved, not retyped
        code: |
          assert source.count("coffee") == 1 and source.count("tea") == 1, "Swap using the existing names, without typing the words again."
    hints:
      - Try `left = right` first and print both. What happened to "coffee"?
      - "Before you overwrite `left`, give its object a second name, e.g. `temp = left`."
      - "Python also has a one-line idiom: `left, right = right, left` (tuple unpacking)."
    feedback:
      - when: { outputEquals: "tea tea\n" }
        message: >-
          After `left = right`, both names refer to "tea" and no name refers to "coffee" any more. Save
          left's object in a temporary name before you rebind left.
      - when: { outputEquals: "coffee coffee\n" }
        message: >-
          After `right = left`, both names refer to "coffee". Keep a temporary name for right's object
          before rebinding it.
    explanation: >-
      Assignment moves labels. `temp = left` keeps a label on "coffee" so it is not lost when left is
      rebound. Python's `left, right = right, left` does the same thing: the right side builds a tuple of
      the two current objects first, then unpacks it into the names.

  - id: parsons-average
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to compute and print the average of three test scores. One line is a distractor
      that does not belong.
    solution: |
      score1 = 80
      score2 = 90
      score3 = 70
      total = score1 + score2 + score3
      average = total / 3
      print(average)
    distractors:
      - print(Average)
    expectedOutput: |
      80.0
    explanation: >-
      Each name must be assigned before it is used. `total` needs all three scores, `average` needs total,
      and the print needs average. `Average` with a capital A is a different (undefined) name.

  # ----- Mastery check (different items from the practice above) -----
  - id: m-predict-chain
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      a = 3
      b = a + 1
      a = b * 2
      b = a - b
      print(a, b)
    answer: "8 4"
    explanation: >-
      Track each line: a=3; b=3+1=4; a=4*2=8; b=8-4=4. Each right-hand side uses the objects the names
      refer to at that moment.
    wrongAnswers:
      - answer: "8 8"
        feedback: "On line 4, b - the old b - is 4, so a - b is 8 - 4 = 4."
      - answer: "6 2"
        feedback: "On line 3, b already refers to 4, so a becomes 4 * 2 = 8."

  - id: m-first-line-error
    type: mcq
    skill: debugging
    prompt: |
      A program's **first line** is `total = total + 5`. What happens when it runs?
    explanation: >-
      To evaluate the right-hand side Python must look up `total`, but nothing has been bound to that name
      yet, so it raises NameError before any assignment happens.
    options:
      - id: a
        text: total becomes 5, because new variables start at 0.
        feedback: Python has no default value for names. A name must be assigned before it is read.
      - id: b
        text: NameError, because total is read before it has been assigned.
        correct: true
        feedback: Correct. Evaluate-then-bind means the lookup of total fails first.
      - id: c
        text: SyntaxError, because a name cannot appear on both sides.
        feedback: "`x = x + 1` is perfectly valid syntax once x exists."
      - id: d
        text: total becomes None.
        feedback: Python never silently creates names; reading an unassigned name is an error.

  - id: m-types
    type: true-false
    skill: transfer
    prompt: |
      True or false: after `x = 5` and then `x = "five"`, Python raises an error because x was created as
      an integer.
    answer: false
    explanation: >-
      Names do not have types; objects do. Rebinding x to a string is allowed (though changing a name's
      meaning like this usually hurts readability).

  - id: m-receipt
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A cinema ticket costs 250 rupees and a snack costs 120 rupees. Write a program with variables
      `ticket`, `snack` and `people` (3 people). Each person buys one ticket and one snack. Store the cost
      for everyone in `bill`, apply a 100 rupee discount to `bill` using `-=`, and print `bill`.
    starterCode: |
      # ticket, snack, people, then bill

    solution: |
      ticket = 250
      snack = 120
      people = 3
      bill = (ticket + snack) * people
      bill -= 100
      print(bill)
    expectedOutput: |
      1010
    tests:
      - name: inputs are stored in variables
        code: |
          for name, value in {"ticket": 250, "snack": 120, "people": 3}.items():
              assert defined(name), f"Create a variable named {name}."
              assert globals()[name] == value, f"{name} should be {value}."
      - name: discount uses -=
        code: |
          assert uses("AugAssign") and "-=" in source, "Apply the discount with bill -= 100."
      - name: bill is correct
        code: |
          assert defined("bill"), "Create a variable named bill."
          assert bill == 1010, f"bill should be (250 + 120) * 3 - 100 = 1010, but it is {bill!r}."
      - name: prints the bill
        code: |
          assert output().strip() == "1010", f"Print bill. Your program printed {output()!r}."
    hints:
      - Each person pays ticket + snack. How do you multiply that by people? Remember parentheses.
      - "`bill -= 100` means `bill = bill - 100`."
    feedback:
      - when: { outputEquals: "510\n" }
        message: >-
          Multiplication happens before addition, so ticket + snack * people is 250 + 360. Put
          parentheses around (ticket + snack).
    explanation: >-
      (250 + 120) * 3 = 1110, then the discount rebinds bill to 1010. Parentheses make the per-person
      cost explicit.

  - id: m-debug-swap
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This program should swap the two values and print `B A`, but it prints `B B`. Fix the bug without
      typing the strings "A" or "B" again.
    starterCode: |
      first = "A"
      second = "B"
      first = second
      second = first
      print(first, second)
    solution: |
      first = "A"
      second = "B"
      first, second = second, first
      print(first, second)
    expectedOutput: |
      B A
    tests:
      - name: prints B A
        code: |
          assert output() == "B A\n", f"Expected 'B A' but got {output()!r}"
      - name: strings not retyped
        code: |
          assert source.count('"A"') + source.count("'A'") == 1 and source.count('"B"') + source.count("'B'") == 1, "Swap with names, not by typing the strings again."
    hints:
      - After line 3, what do first and second each refer to? Has any name kept "A"?
      - Use a temporary name, or tuple unpacking.
    explanation: >-
      After `first = second`, no name refers to "A" any more, so `second = first` just copies "B" back.
      Keeping a temporary name, or `first, second = second, first`, preserves both objects.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-chain, m-first-line-error, m-types, m-receipt, m-debug-swap]

cheatsheet: |
  ```python
  name = expression        # 1) evaluate right side  2) bind name to the result
  count += 1               # same as count = count + 1
  b = a                    # b refers to the SAME object as a (no copy)
  a, b = b, a              # swap via tuple unpacking
  type(x)                  # type of the object x refers to
  x is y                   # same object?   x == y  -> equal values?
  ```
  - Names: letters/digits/_ · no leading digit · not a keyword · case-sensitive · snake_case
  - NameError → misspelled, wrong case, or used before assignment
