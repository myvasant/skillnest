  - id: save-load-lines
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write two functions:

      1. `save_lines(path, lines)` writes every string in the list `lines` to the file at `path`, each on
         its own line, **replacing** any previous content.
      2. `load_lines(path)` **returns** a list of the lines in the file, without their trailing newline.

      Use `with` and `encoding="utf-8"` in both. The code at the bottom tries them out.
    starterCode: |
      def save_lines(path, lines):
          # Open the file for writing and write each line followed by "\n".
          pass


      def load_lines(path):
          # Open the file for reading and return a list of lines without "\n".
          pass


      save_lines("pets.txt", ["cat", "dog", "parrot"])
      print(load_lines("pets.txt"))
    solution: |
      def save_lines(path, lines):
          with open(path, "w", encoding="utf-8") as f:
              for line in lines:
                  f.write(line + "\n")


      def load_lines(path):
          result = []
          with open(path, encoding="utf-8") as f:
              for line in f:
                  result.append(line.rstrip("\n"))
          return result


      save_lines("pets.txt", ["cat", "dog", "parrot"])
      print(load_lines("pets.txt"))
    expectedOutput: |
      ['cat', 'dog', 'parrot']
    tests:
      - name: save_lines writes one item per line
        code: |
          import os
          if os.path.exists("check-save.txt"):
              os.remove("check-save.txt")
          save_lines("check-save.txt", ["x", "y z"])
          assert os.path.exists("check-save.txt"), "save_lines should create the file at path."
          with open("check-save.txt", encoding="utf-8") as check:
              content = check.read()
          assert content == "x\ny z\n", f"The file should contain 'x\\ny z\\n', but it contains {content!r}. Write each item followed by \"\\n\"."
      - name: save_lines replaces old content
        code: |
          save_lines("check-replace.txt", ["old1", "old2", "old3"])
          save_lines("check-replace.txt", ["new"])
          with open("check-replace.txt", encoding="utf-8") as check:
              content = check.read()
          assert content == "new\n", f"After saving ['new'], the file should contain only 'new\\n', but it contains {content!r}. Use mode \"w\"."
      - name: load_lines returns the lines without newlines
        code: |
          with open("check-load.txt", "w", encoding="utf-8") as setup:
              setup.write("first\nsecond line\n")
          result = load_lines("check-load.txt")
          assert isinstance(result, list), f"load_lines should return a list, but it returned {result!r}."
          assert result == ["first", "second line"], f"Expected ['first', 'second line'], got {result!r}."
      - name: load_lines handles a last line without a newline
        code: |
          with open("check-last.txt", "w", encoding="utf-8") as setup:
              setup.write("a\nb")
          result = load_lines("check-last.txt")
          assert result == ["a", "b"], f"Expected ['a', 'b'], got {result!r}."
      - name: uses with and encoding="utf-8"
        code: |
          import ast
          tree = ast.parse(source)
          opens = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "open"]
          assert len(opens) >= 2, "Call open() in both functions."
          missing = [n.lineno for n in opens if not any(k.arg == "encoding" for k in n.keywords)]
          assert not missing, f'Pass encoding="utf-8" to every open() call (missing on line {missing}).'
          assert uses("With"), "Open the files with a with statement so they are always closed."
    hints:
      - 'In save_lines: `with open(path, "w", encoding="utf-8") as f:` then loop over lines and write each one plus "\n".'
      - In load_lines, start with an empty list, loop over the file object, and append each line.
      - 'line.rstrip("\n") removes the newline from the end of a line. Remember to return the list.'
    feedback:
      - when: { outputContains: "\\n'" }
        message: >-
          Your lines still end with \n. Remove it from each line, for example with line.rstrip("\n"),
          before adding it to the list.
      - when: { outputEquals: "None\n" }
        message: load_lines must return the list (with return), not just build or print it.
      - when: { outputContains: "catdog" }
        message: The items ran together because write() does not add newlines. Write line + "\n".
    explanation: >-
      save_lines opens with "w" so each save replaces the old content, and adds "\n" because write() never
      does. load_lines iterates over the file — one line at a time, newline included — and strips the
      newline before collecting each line. rstrip("\n") is safer than strip() when leading spaces are part
      of the data.

