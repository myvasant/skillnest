      - name: counts the words in the file, not a fixed number
        code: |
          import io, contextlib
          changed = source.replace("roses are red", "roses are very red")
          ns = {}
          with contextlib.redirect_stdout(io.StringIO()):
              exec(compile(changed, "<variant>", "exec"), ns)
          assert ns.get("word_count") == 7, "Count the words by reading the file, so a longer poem gives a bigger count."
    hints:
