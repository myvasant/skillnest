  - id: m-code-total
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      The program creates `prices.txt` with one price per line (and one blank line). Write
      `total_price(path)` that reads the file and **returns** the sum of the prices as a float, skipping
      blank lines. Use `with` and `encoding="utf-8"`.
    starterCode: |
      with open("prices.txt", "w", encoding="utf-8") as f:
          f.write("12.50\n7.25\n\n0.25\n")


      def total_price(path):
          # Read the file line by line, convert non-blank lines to float, add them up.
          pass


      print(total_price("prices.txt"))
    solution: |
      with open("prices.txt", "w", encoding="utf-8") as f:
          f.write("12.50\n7.25\n\n0.25\n")


      def total_price(path):
          total = 0.0
          with open(path, encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line:
                      total += float(line)
          return total


      print(total_price("prices.txt"))
    expectedOutput: |
      20.0
    tests:
      - name: total of prices.txt is 20.0
        code: |
          result = total_price("prices.txt")
          assert result == 20.0, f"total_price('prices.txt') should return 20.0, but returned {result!r}."
      - name: works for another file
        code: |
          with open("check-prices.txt", "w", encoding="utf-8") as setup:
              setup.write("2\n\n3.5\n")
          result = total_price("check-prices.txt")
          assert result == 5.5, f"For a file containing 2, a blank line and 3.5, expected 5.5 but got {result!r}. Read the path you are given."
      - name: uses with and encoding
        code: |
          import ast
          opens = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "open"]
          missing = [n.lineno for n in opens if not any(k.arg == "encoding" for k in n.keywords)]
          assert not missing, f'Pass encoding="utf-8" to every open() call (missing on line {missing}).'
          assert uses("With"), "Open the file with a with statement."
    hints:
      - Start with total = 0.0, then loop with `for line in f:`.
      - "Each line is a string like '12.50\\n'. strip() it; if the result is empty, skip it."
      - Convert with float(line) before adding, and return total at the end.
    feedback:
      - when: { errorType: ValueError, errorMessageContains: "''" }
        message: >-
          float('') fails: the blank line became an empty string after strip(). Skip lines that are empty
          before converting.
      - when: { errorType: TypeError }
        message: Lines read from a file are strings. Convert each one with float() before adding it to the total.
      - when: { outputEquals: "None\n" }
        message: total_price must return the total, not just calculate or print it.
    explanation: >-
      Everything read from a text file is a str, so each line is stripped and converted with float(). The
      blank line strips to "", which is falsy, so `if line:` skips it. Returning (rather than printing)
      the total lets other code use the result.

  - id: m-debug-double-spacing
    type: debug
    skill: debugging
    prompt: |
      This program should print the to-do list like this:

      ```text
      - wash dishes
      - feed cat
      - pay bills
      ```

      but it prints an empty line after every item. Fix it without typing the items again.
    starterCode: |
      with open("todo.txt", "w", encoding="utf-8") as f:
          f.write("wash dishes\nfeed cat\npay bills\n")

      with open("todo.txt", encoding="utf-8") as f:
          for line in f:
              print("-", line)
    solution: |
      with open("todo.txt", "w", encoding="utf-8") as f:
          f.write("wash dishes\nfeed cat\npay bills\n")

      with open("todo.txt", encoding="utf-8") as f:
          for line in f:
              print("-", line.rstrip("\n"))
    expectedOutput: |
      - wash dishes
      - feed cat
      - pay bills
    tests:
      - name: prints the list without blank lines
        code: |
          assert output_lines() == ["- wash dishes", "- feed cat", "- pay bills"], f"Expected three lines with no blank lines between them, but got {output()!r}."
      - name: still reads the items from the file
        code: |
          import io, contextlib
          changed = source.replace("feed cat", "feed the cat")
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(changed, "<variant>", "exec"), {})
          assert buffer.getvalue().splitlines() == ["- wash dishes", "- feed the cat", "- pay bills"], "Keep printing the lines read from the file (in a loop) rather than typing them."
    hints:
      - Print repr(line) to see exactly what each line contains.
      - Each line already ends with "\n", and print adds another one.
      - Remove the newline with line.rstrip("\n"), or tell print not to add one with end="".
    feedback:
      - when: { outputContains: "-  " }
        message: Close — but there is an extra space. print puts one space between "-" and the line already.
    explanation: >-
      Lines read from a file keep their "\n". print() then adds its own newline, producing a blank line
      after each item. Stripping the newline (or using end="") leaves exactly one line break per item.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-append, m-mode-design, m-tf-write-newline, m-code-total, m-debug-double-spacing]

cheatsheet: |
  ```python
  with open("data.txt", encoding="utf-8") as f:      # read (mode "r" is the default)
      text = f.read()                                # whole file as one str
  with open("data.txt", encoding="utf-8") as f:
      for line in f:                                 # one line at a time, "\n" included
          print(line.rstrip("\n"))
  with open("out.txt", "w", encoding="utf-8") as f:  # "w" ERASES the file first
      f.write("no newline added\n")
      print("print adds one", file=f)
  open("log.txt", "a", encoding="utf-8")             # append to the end
  open("new.txt", "x", encoding="utf-8")             # FileExistsError if it exists
  open("photo.png", "rb")                            # bytes, no encoding
  ```
  - `with` closes (and flushes) the file even if an exception happens.
  - `""` from read()/readline() = end of file.
  - Relative paths start at `os.getcwd()`, not the script's folder.
  - FileNotFoundError → check name, folder, cwd · UnicodeDecodeError → wrong encoding
