id: python.files
concept: python.files
title: Reading and Writing Files
subtitle: open(), modes, encodings and the with statement
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Programs forget everything when they stop; files let data outlive a run. Learn what a file really is
  (bytes on disk), how open() and its modes work, why you always pass encoding="utf-8", how `with`
  guarantees the file is closed, and how to read, write and debug files safely.
objectives:
  - Explain a file as named bytes on disk, and a text file as bytes decoded with an encoding.
  - Choose the right open() mode (r, w, a, x, b) and predict what each does to an existing file.
  - Use `with open(..., encoding="utf-8") as f:` to read a file whole, line by line, or with readline().
  - Write text with write(), writelines() and print(file=...), adding newlines deliberately.
  - Diagnose FileNotFoundError, UnicodeDecodeError and "not readable" errors, including relative-path problems.
sources:
  - title: "The Python Tutorial: Reading and Writing Files"
    url: https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files
    publisher: Python Software Foundation
  - title: "Built-in Functions: open()"
    url: https://docs.python.org/3/library/functions.html#open
    publisher: Python Software Foundation
  - title: "io — Core tools for working with streams (Text encoding)"
    url: https://docs.python.org/3/library/io.html#text-encoding
    publisher: Python Software Foundation
  - title: "Python Language Reference: The with statement"
    url: https://docs.python.org/3/reference/compound_stmts.html#the-with-statement
    publisher: Python Software Foundation
  - title: "PEP 686: Make UTF-8 mode default"
    url: https://peps.python.org/pep-0686/
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why programs need files
    kind: why
    blocks:
      - type: markdown
        body: |
          Every variable you have created so far lives in the computer's **memory** (RAM). Memory is fast,
          but it is wiped the moment your program ends. Run a to-do app, add three tasks, close it — and
          the tasks are gone.

          To remember anything between runs — settings, scores, a log of what happened, data from another
          program — a program has to put it somewhere **persistent**: a file on disk.
      - type: code
        runnable: true
        code: |
          tasks = ["buy milk", "call Sam", "water plants"]

          with open("tasks.txt", "w", encoding="utf-8") as f:
              for task in tasks:
                  f.write(task + "\n")

          del tasks   # pretend the program ended: the list is gone from memory

          with open("tasks.txt", encoding="utf-8") as f:
              print(f.read())
        expectedOutput: |
          buy milk
          call Sam
          water plants
        caption: >-
          The list is deleted, but its contents survive in tasks.txt. A completely different program could
          read the same file tomorrow.
        annotations:
          - line: 3
            text: Open tasks.txt for writing ("w"), as UTF-8 text. `f` is the file object.
          - line: 5
            text: write() does not add a newline, so we add "\n" ourselves to put each task on its own line.
          - line: 9
            text: Open the same file again, this time for reading (the default mode).
      - type: callout
        variant: note
        title: Files in this browser
        body: |
          Python here runs inside your browser, so it has a **virtual** file system that lives in memory
          (your working folder is `/home/pyodide`). Files survive between runs until you reload the page,
          then they disappear. That is why every example in this lesson creates the files it reads. On
          your own computer, the same code writes real files to your disk.

  - id: what-is-a-file
    title: What a file really is
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **file** is a named sequence of **bytes** stored by the operating system's file system. A
          [path](glossary:path) such as `reports/june.txt` is the file's address. The file system does not
          know or care what the bytes mean — that is up to the program reading them.

          Files come in two broad kinds:

          - A [text file](glossary:text-file) holds bytes that represent characters: `.txt`, `.csv`,
            `.json`, `.py`, `.html`. To turn the bytes into characters you need to know the file's
            **encoding** — the rule that maps characters to bytes (see
            [text encoding](concept:foundations.text-encoding)). Today the usual encoding is
            [UTF-8](glossary:utf-8).
          - A [binary file](glossary:binary-file) holds bytes that are *not* text: images, audio, zip
            archives, Excel workbooks. You read them as raw bytes.

          In UTF-8, plain English letters take one byte each, but many other characters take two to four.
          So "number of characters" and "number of bytes" are different things:
      - type: code
        runnable: true
        code: |
          word = "café"
          data = word.encode("utf-8")   # text -> bytes

          print(len(word), "characters")
          print(len(data), "bytes")
          print(data)
          print(data.decode("utf-8"))   # bytes -> text
        expectedOutput: |
          4 characters
          5 bytes
          b'caf\xc3\xa9'
          café
        annotations:
          - line: 2
            text: encode() turns a str into a bytes object using an encoding.
          - line: 6
            text: "A bytes literal starts with b. The é became two bytes, written in hex as \\xc3\\xa9."
          - line: 7
            text: decode() is the reverse. You must decode with the same encoding that was used to encode.
      - type: markdown
        body: |
          When you open a file in **text mode** (the default), Python does this encoding and decoding for
          you: you write and read `str` objects, and Python converts to and from bytes on the way to the
          disk. Opening in **binary mode** (`"rb"`, `"wb"`) skips that step and gives you the raw bytes:
      - type: code
        runnable: true
        code: |
          with open("cafe.txt", "w", encoding="utf-8") as f:
              f.write("café\n")

          with open("cafe.txt", "rb") as f:     # b = binary: no decoding
              print(f.read())

          with open("cafe.txt", encoding="utf-8") as f:
              print(f.read())
        expectedOutput: |
          b'caf\xc3\xa9\n'
          café
        caption: The same six bytes on disk, seen raw (binary mode) and decoded (text mode).
      - type: callout
        variant: warning
        title: Always pass encoding="utf-8" for text files
        body: |
          If you leave out `encoding`, Python 3.14 uses your computer's *locale* encoding. In this browser
          and on most macOS and Linux machines that is UTF-8, but on Windows it is often `cp1252`. The
          same program can then read a file correctly on one computer and produce garbage — or crash with
          `UnicodeDecodeError` — on another. Python 3.15 switches the default to UTF-8
          ([PEP 686](https://peps.python.org/pep-0686/)), but writing `encoding="utf-8"` explicitly is
          still the clearest and works on every version.
      - type: item
        ref: encoding-mcq

  - id: open-and-modes
    title: open() and its modes
    kind: concept
    blocks:
      - type: markdown
        body: |
          `open(path, mode, encoding=...)` asks the operating system for access to a file and returns a
          [file object](glossary:file-object) — a Python object you call methods on (`read`, `write`,
          `close`, …). The [mode](glossary:file-mode) string says what you intend to do:

          | Mode | Meaning | If the file exists | If it doesn't |
          |---|---|---|---|
          | `"r"` (default) | read | read from the start | `FileNotFoundError` |
          | `"w"` | write | **erases it first** (truncates to 0 bytes) | creates it |
          | `"a"` | append | keeps it; every write goes **at the end** | creates it |
          | `"x"` | exclusive create | `FileExistsError` | creates it |

          Add `b` for binary (`"rb"`, `"wb"`) or `+` to allow both reading and writing (`"r+"`). Text mode
          (`t`) is the default, so `"r"` means `"rt"`.

          The most important row is `"w"`: **opening a file in `"w"` mode erases it immediately**, before
          you write anything. That is great for "save my latest data", and a disaster if you meant to add
          to the file.
      - type: code
        runnable: true
        code: |
          with open("log.txt", "w", encoding="utf-8") as f:
              f.write("first entry\n")

          with open("log.txt", "a", encoding="utf-8") as f:   # append: keep what is there
              f.write("second entry\n")

          with open("log.txt", encoding="utf-8") as f:
              print(f.read())

          with open("log.txt", "w", encoding="utf-8") as f:   # "w" again: erased!
              pass

          with open("log.txt", encoding="utf-8") as f:
              print(repr(f.read()))
        expectedOutput: |
          first entry
          second entry

          ''
        annotations:
          - line: 4
            text: '"a" adds to the end of the existing file.'
          - line: 10
            text: '`pass` writes nothing, yet the file is now empty: "w" truncated it the moment it was opened.'
          - line: 14
            text: repr() shows the empty string as '' so you can see that nothing is left.
      - type: markdown
        body: |
          Use `"x"` when overwriting would be a bug — for example, never replacing a report that already
          exists:
      - type: code
        runnable: true
        code: |
          with open("report.txt", "w", encoding="utf-8") as f:
              f.write("Q3 report\n")

          try:
              with open("report.txt", "x", encoding="utf-8") as f:
                  f.write("this must not replace the old report\n")
          except FileExistsError:
              print("report.txt already exists - leaving it alone")

          with open("report.txt", encoding="utf-8") as f:
              print(f.read())
        expectedOutput: |
          report.txt already exists - leaving it alone
          Q3 report
      - type: item
        ref: predict-truncate

  - id: with-statement
    title: "Closing files: why `with` matters"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          An open file is a **resource borrowed from the operating system**. Two things make closing it
          important:

          1. **Buffering.** Writing to disk is slow, so the file object collects your writes in memory (a
             [buffer](glossary:buffering)) and sends them to the disk in bigger chunks. Until the buffer is
             *flushed* — which `close()` does — the data may not be in the file yet.
          2. **Limits.** The operating system lets each program have only a limited number of files open
             at once, and on some systems an open file cannot be renamed or deleted.

          Watch the buffer in action. The data is written, but another reader sees an empty file until
          the writer is closed:
      - type: code
        runnable: true
        code: |
          f = open("buffered.txt", "w", encoding="utf-8")
          f.write("important data\n")

          with open("buffered.txt", encoding="utf-8") as reader:
              print("before close:", repr(reader.read()))

          f.close()

          with open("buffered.txt", encoding="utf-8") as reader:
              print("after close:", repr(reader.read()))
        expectedOutput: |
          before close: ''
          after close: 'important data\n'
        caption: >-
          write() put the text in the file object's buffer. Only close() (or flush()) pushed it to the
          file.
      - type: markdown
        body: |
          The `with` statement closes the file for you. When the indented block ends — **normally, or
          because an exception was raised inside it** — Python calls `f.close()`:

          ```python
          with open("notes.txt", "w", encoding="utf-8") as f:
              f.write("hello\n")
          # here the file is already closed
          ```

          It is a shorter, safer version of this pattern from the
          [exceptions lesson](concept:python.exceptions):

          ```python
          f = open("notes.txt", "w", encoding="utf-8")
          try:
              f.write("hello\n")
          finally:
              f.close()
          ```
      - type: code
        runnable: true
        code: |
          try:
              with open("partial.txt", "w", encoding="utf-8") as f:
                  f.write("line 1\n")
                  result = 10 / 0          # something goes wrong half-way
                  f.write("line 2\n")
          except ZeroDivisionError:
              print("Error! Is the file closed anyway?", f.closed)

          with open("partial.txt", encoding="utf-8") as f:
              print(repr(f.read()))
        expectedOutput: |
          Error! Is the file closed anyway? True
          'line 1\n'
        annotations:
          - line: 4
            text: The ZeroDivisionError leaves the with block immediately — but with closes the file first.
          - line: 7
            text: "`f.closed` is True. The name f still exists; it just refers to a closed file object."
          - line: 10
            text: Line 1 reached the disk because closing flushed the buffer. Line 2 never ran.
      - type: callout
        variant: analogy
        title: A borrowed book with a bookmark
        body: |
          Opening a file is like borrowing a book from a library. The file object is your copy plus a
          **bookmark**: reading moves the bookmark forward, so the next read continues where the last one
          stopped. Closing is returning the book. `with` is a librarian who takes the book back the moment
          you leave the reading room — even if you leave in a hurry.
      - type: callout
        variant: deep-dive
        title: with works with more than files
        depth: deep
        body: |
          Any object that is a [context manager](glossary:context-manager) can be used with `with` — locks, database transactions,
          temporary directories. The object defines what happens on entry and exit. You will build your own
          in [context managers](concept:python.context-managers).
      - type: item
        ref: explain-with

  - id: reading
    title: Reading a file
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A file object opened for reading gives you several ways to get at the text:

          | Code | Returns | Good for |
          |---|---|---|
          | `f.read()` | the whole rest of the file as one `str` | small files |
          | `f.readline()` | the next line, **including** its `"\n"`; `""` at the end | reading a header line first |
          | `for line in f:` | each line in turn, including `"\n"` | almost everything — uses little memory |
          | `f.readlines()` | a `list` of all remaining lines | when you need them all at once |

          Each of these continues from the file's current position (the bookmark) and moves it forward. At
          the end of the file there is nothing left, so `read()` returns `""` and `readline()` returns `""`.
      - type: code
        runnable: true
        code: |
          with open("lines.txt", "w", encoding="utf-8") as f:
              f.write("one\ntwo\nthree")

          with open("lines.txt", encoding="utf-8") as f:
              print(repr(f.readline()))
              print(repr(f.readline()))
              print(repr(f.read()))
              print(repr(f.read()))
        expectedOutput: |
          'one\n'
          'two\n'
          'three'
          ''
        annotations:
          - line: 2
            text: The last line has no "\n" — files do not have to end with a newline.
          - line: 8
            text: The bookmark is at the end, so there is nothing left to read.
      - type: markdown
        body: |
          The most common pattern is a `for` loop over the file object. Step through it and look at the
          value of `line` each time — notice the `\n` at the end:
      - type: visualization
        component: python-tracer
        title: Looping over the lines of a file
        caption: >-
          Each iteration binds `line` to the next line of text, newline included. strip() removes it before
          printing. After the with block, the file object still exists but is closed.
        props:
          code: |
            with open("shopping.txt", "w", encoding="utf-8") as f:
                f.write("apples\nbread\n")

            count = 0
            with open("shopping.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    print(count, line.strip())
            print("closed:", f.closed)
      - type: callout
        variant: tip
        title: Iterating does not load the whole file
        body: |
          `for line in f:` reads one line at a time, so it works on a 10 GB log file with very little
          memory. `f.read()` and `f.readlines()` load everything at once. File objects are
          [iterators](concept:python.iterators), an idea you will study properly soon.
      - type: item
        ref: predict-read-twice

  - id: writing
    title: Writing a file
    kind: concept
    blocks:
      - type: markdown
        body: |
          Three ways to write text to a file opened with `"w"`, `"a"` or `"x"`:

          - `f.write(text)` writes exactly the string you give it — **no newline is added** — and returns
            the number of characters written. It only accepts `str` (in text mode), so convert numbers
            first.
          - `f.writelines(list_of_strings)` writes each string in turn. Despite the name it does **not**
            add newlines either.
          - `print(..., file=f)` works like normal print — spaces between values, a newline at the end —
            but sends the text to the file instead of the screen.
      - type: code
        runnable: true
        code: |
          scores = {"Ada": 91, "Grace": 87}

          with open("scores.txt", "w", encoding="utf-8") as f:
              f.write("name,score\n")
              for name, score in scores.items():
                  f.write(name + "," + str(score) + "\n")
              f.writelines(["no", "newlines", "here"])
              f.write("\n")
              print("Total:", sum(scores.values()), file=f)

          with open("scores.txt", encoding="utf-8") as f:
              print(f.read())
        expectedOutput: |
          name,score
          Ada,91
          Grace,87
          nonewlineshere
          Total: 178
        annotations:
          - line: 6
            text: str(score) is required — write(91) would raise TypeError.
          - line: 7
            text: writelines() glued the three strings together.
          - line: 9
            text: print(..., file=f) formats like print and adds the newline itself.
      - type: callout
        variant: deep-dive
        title: Newlines on Windows
        depth: deep
        body: |
          In text mode Python translates line endings for you. When writing, each `"\n"` becomes the
          operating system's line separator (`os.linesep`): `"\r\n"` on Windows, `"\n"` elsewhere. When
          reading, `"\r\n"`, `"\r"` and `"\n"` all arrive as `"\n"` ("universal newlines"). You can turn
          this off with `open(..., newline="")`, which the [csv module](concept:python.csv-json) needs.

  - id: paths-and-cwd
    title: Relative paths and the current working directory
    kind: concept
    blocks:
      - type: markdown
        body: |
          A path like `"tasks.txt"` or `"reports/june.txt"` is **relative**: Python looks for it starting
          from the program's [current working directory](glossary:path) (cwd), which is the folder the
          program was *started from* — not necessarily the folder the `.py` file lives in. An **absolute**
          path such as `/home/pyodide/tasks.txt` or `C:\Users\ada\tasks.txt` names the file from the root
          of the file system and does not depend on the cwd.
      - type: code
        runnable: true
        code: |
          import os

          print(os.getcwd())                       # where relative paths start
          os.makedirs("reports", exist_ok=True)    # create a folder (no error if it exists)

          with open("reports/q3-summary.txt", "w", encoding="utf-8") as f:
              f.write("All good\n")

          print(os.path.abspath("reports/q3-summary.txt"))
          print(os.path.exists("q3-summary.txt"), os.path.exists("reports/q3-summary.txt"))
        expectedOutput: |
          /home/pyodide
          /home/pyodide/reports/q3-summary.txt
          False True
        annotations:
          - line: 9
            text: abspath() shows the full path a relative path resolves to from the current directory.
          - line: 10
            text: The file is inside reports/, so "q3-summary.txt" on its own does not find it.
      - type: callout
        variant: misconception
        title: '"The file is right next to my script, so open() will find it"'
        body: |
          Only if you start the program from that folder. If `app/main.py` opens `"config.txt"` and you run
          `python app/main.py` from the parent folder, Python looks for `config.txt` in the **parent**
          folder and raises `FileNotFoundError`. Either run the program from its own folder, or build the
          path from the script's location — the [pathlib lesson](concept:python.pathlib) shows the
          standard way, `Path(__file__).parent / "config.txt"`.
      - type: callout
        variant: tip
        title: Windows paths in strings
        body: |
          A backslash starts an escape sequence in a Python string (`"\n"` is a newline), so
          `"C:\new\data.txt"` contains a newline! Use forward slashes (`"C:/new/data.txt"`, which Windows
          accepts), a raw string (`r"C:\new\data.txt"`), or pathlib.
      - type: item
        ref: cwd-mcq

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `FileNotFoundError: [Errno 2] No such file or directory: 'data.txt'` | Typo in the name, wrong folder, or the cwd is not what you think | Print `os.getcwd()` and `os.path.abspath(path)`; check spelling and extension (`data.txt.txt` on Windows!) |
          | The file is unexpectedly empty | It was opened with `"w"`, which truncates | Use `"a"` to add, `"r"` to read |
          | `io.UnsupportedOperation: not readable` | Reading from a file opened with `"w"` or `"a"` | Open it with `"r"` (the default) to read |
          | `UnicodeDecodeError: 'utf-8' codec can't decode byte …` | The file is not UTF-8 (or not text at all) | Find out the real encoding, or open binary files with `"rb"` |
          | Text like `cafÃ©` instead of `café` | Decoded with the wrong encoding | Pass the encoding the file was written with — usually `"utf-8"` |
          | `TypeError: write() argument must be str, not int` | Writing a number in text mode | Convert first: `f.write(str(n))` or use an f-string |
          | `ValueError: I/O operation on closed file.` | Using `f` after the `with` block ended | Do the work inside the block |
          | Blank lines between printed lines | Each line already ends with `"\n"` and print adds another | `print(line.rstrip("\n"))` or `print(line, end="")` |

          The `[Errno 2]` part is the operating system's error code for "no such file". In this browser
          you will see `[Errno 44]` instead, because the WebAssembly runtime numbers its errors
          differently — the meaning is identical.
      - type: code
        runnable: true
        code: |
          with open("no-such-folder/scores.txt", encoding="utf-8") as f:
              print(f.read())
        expectError: FileNotFoundError
        caption: Run it and read the last line of the traceback. The path in quotes is exactly what Python looked for.
      - type: markdown
        body: |
          When a missing file is a normal situation — a first run, an optional settings file — catch the
          specific exception and fall back to something sensible:
      - type: code
        runnable: true
        code: |
          filename = "never-created-settings.txt"

          try:
              with open(filename, encoding="utf-8") as f:
                  settings = f.read()
          except FileNotFoundError:
              print(f"{filename} not found - using defaults")
              settings = "theme=light"

          print(settings)
        expectedOutput: |
          never-created-settings.txt not found - using defaults
          theme=light
        caption: >-
          Catch only FileNotFoundError. A bare except would also hide a typo in your code or a permission
          problem you need to know about.
      - type: markdown
        body: |
          An encoding mismatch either crashes or silently produces garbled text (called *mojibake*):
      - type: code
        runnable: true
        code: |
          with open("menu.txt", "w", encoding="utf-8") as f:
              f.write("crème brûlée\n")

          with open("menu.txt", encoding="latin-1") as f:   # wrong encoding, no error...
              print(f.read())

          with open("menu.txt", encoding="ascii") as f:     # wrong encoding, error
              print(f.read())
        expectError: UnicodeDecodeError
        expectedOutput: |
          crÃ¨me brÃ»lÃ©e
        caption: >-
          Latin-1 can decode any byte, so it "succeeds" with the wrong characters. ASCII only knows bytes
          0–127, so it fails on the first é byte. The fix for both is encoding="utf-8".
      - type: item
        ref: debug-word-count

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          Each exercise creates its own files, so you can run it as often as you like. Write the code
          yourself before opening the hints.
      - type: item
