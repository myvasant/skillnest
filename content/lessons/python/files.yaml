      `python app/main.py` from `C:/projects` fails with `FileNotFoundError`. Why?
    explanation: >-
      Relative paths are resolved from the current working directory — the folder the program was started
      from — not from the folder containing the script. From C:/projects, "config.txt" means
      C:/projects/config.txt, which does not exist.
    options:
