  - id: explain-with
    type: explain
    skill: explanation
    prompt: >-
      Explain to a teammate what `with open("out.txt", "w", encoding="utf-8") as f:` guarantees, and what
      can go wrong if they call open() without `with` and never call close().
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says the file is closed automatically when the with block ends.
      - Says this also happens when an exception is raised inside the block.
      - Explains that writes are buffered and closing flushes them, so unclosed files may be missing data.
      - Mentions that open files are a limited operating-system resource (or may stay locked).
    modelAnswer: |
      `with` calls f.close() as soon as the indented block finishes, whether it finishes normally or
      because an exception was raised. Closing matters because write() first puts text in an in-memory
      buffer; close() flushes that buffer to disk. Without closing, other readers may see an empty or
      incomplete file, and data can be lost if the program crashes. Each open file also uses an
      operating-system file handle, which is limited and on some systems keeps the file locked.

  - id: cwd-mcq
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: |
      `C:/projects/app/main.py` contains `open("config.txt", encoding="utf-8")`, and `config.txt` sits in
