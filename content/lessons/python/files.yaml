  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Three layers.** `open()` in text mode builds a stack of objects from the
          [io module](https://docs.python.org/3/library/io.html):

          1. `TextIOWrapper` — what you use. Encodes `str` to bytes (and decodes back) and translates
             newlines.
          2. `BufferedWriter` / `BufferedReader` — keeps a buffer in memory so the OS is called rarely.
          3. `FileIO` — the raw layer that makes operating-system calls on a **file descriptor**, a small
             integer the OS uses to identify the open file.

          Binary mode (`"rb"`) gives you layer 2 directly; `buffering=0` with binary mode gives layer 3.
      - type: code
        runnable: true
        code: |
          with open("layers.txt", "w", encoding="utf-8") as f:
              print(type(f).__name__)
              print(type(f.buffer).__name__)
              print(type(f.buffer.raw).__name__)
              print(f.fileno() >= 0)
        expectedOutput: |
          TextIOWrapper
          BufferedWriter
          FileIO
          True
      - type: markdown
        body: |
          **Position.** Every open file has a current position. `f.tell()` reports it and `f.seek(0)` jumps
          back to the start. In text mode the number returned by `tell()` is an opaque "cookie" that you
          should only pass back to `seek()`; with multi-byte encodings it is not a character count.
      - type: code
        runnable: true
        code: |
          with open("abc.txt", "w", encoding="utf-8") as f:
              f.write("abcdef")

          with open("abc.txt", encoding="utf-8") as f:
              print(f.read(2))    # read at most 2 characters
              print(f.read())     # the rest
              f.seek(0)           # back to the start
              print(f.read(3))
        expectedOutput: |
          ab
          cdef
          abc
      - type: markdown
        body: |
          **What if you forget to close?** In CPython, a file object is closed (and flushed) when its last
          reference disappears, thanks to reference counting, and remaining files are usually flushed at
          normal exit. That is an implementation detail: other Pythons (such as PyPy) free objects later, a
          crash or `os._exit()` skips the cleanup, and in long-running programs leaked files pile up until
          the OS refuses to open more (`OSError: [Errno 24] Too many open files`). Python even emits a
          `ResourceWarning` for unclosed files when warnings are enabled (`python -W default`). Use `with`
          and none of this matters.

          **Atomic saves (production).** If a program crashes half-way through writing, `"w"` has already
          erased the old content, so you are left with a broken file. Robust programs write to a temporary
          file in the same folder and then replace the original with `os.replace(tmp, path)`, which swaps
          the file in one step.

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A file is named **bytes** on disk. Text files need an **encoding** to become characters — pass
            `encoding="utf-8"` every time.
          - `open(path, mode, encoding=...)` returns a file object. Modes: `"r"` read, `"w"` **truncate**
            and write, `"a"` append, `"x"` create-only; add `"b"` for binary.
          - `with open(...) as f:` closes the file when the block ends, even after an exception — which
            also flushes buffered writes.
          - Read with `read()`, `readline()`, or `for line in f:` (lines keep their `"\n"`; `""` means end
            of file).
          - `write()` and `writelines()` never add newlines; `print(..., file=f)` does.
          - Relative paths start from the **current working directory**, not the script's folder.
          - Catch `FileNotFoundError` when a missing file is expected; don't hide other errors.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What does `with` do when you open a file, and what happens if an exception occurs inside the
          block?" — Explain that the file is closed on exit no matter how the block ends, that closing
          flushes buffered data, and that it replaces a `try`/`finally` with `close()`. Strong answers also
          mention passing an explicit encoding and that `"w"` truncates immediately.

items:
  - id: encoding-mcq
    type: mcq
    skill: recognition
    prompt: Why should you write `open("notes.txt", encoding="utf-8")` instead of just `open("notes.txt")`?
    explanation: >-
      Without an explicit encoding, Python 3.14 decodes text with the computer's locale encoding, which
      differs between machines (often cp1252 on Windows, UTF-8 on macOS/Linux). Passing encoding="utf-8"
      makes the program read and write the same bytes everywhere.
    options:
      - id: a
        text: Without it, Python cannot open text files at all.
        feedback: open() works without it — it silently picks a default encoding, which is exactly the problem.
      - id: b
        text: Without it, Python uses a platform-dependent default, so the same file may be decoded differently (or fail) on another computer.
        correct: true
        feedback: Right. An explicit encoding makes the program behave the same on every machine.
      - id: c
        text: UTF-8 always makes files smaller than other encodings.
        feedback: Size is not the point (for some languages other encodings are smaller). Consistency and correctness are.
      - id: d
        text: The encoding argument switches the file to binary mode.
        feedback: Binary mode is "b" and takes no encoding at all — open(path, "rb", encoding="utf-8") raises ValueError.

