id: python.for-loops
concept: python.for-loops
title: For Loops and range()
subtitle: Doing something once for every item
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  A for loop takes the items of a string, a range of numbers (and soon lists) one at a time and runs
  its body once for each. Learn range(start, stop, step) and why stop is excluded, the accumulator
  pattern, nested loops, enumerate() and zip(), and when to choose for over while.
objectives:
  - Explain how a for loop binds its loop variable to each item of an iterable in turn.
  - Predict exactly which numbers range(stop), range(start, stop) and range(start, stop, step) produce.
  - Write for loops that count, total, or build a new string (the accumulator pattern).
  - Trace nested loops and predict how many times the inner body runs.
  - Use enumerate() to get positions and zip() to walk two sequences side by side.
  - Explain why assigning to the loop variable does not change the sequence, and choose between for and while.
