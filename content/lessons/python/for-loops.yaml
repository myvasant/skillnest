  - id: m-mcq-range-inclusive
    type: mcq
    skill: recognition
    prompt: Which call produces exactly the numbers 1, 2, 3, …, 10?
    explanation: >-
      range includes its start and excludes its stop, so to end at 10 the stop must be 11, and to begin
      at 1 the start must be 1.
    options:
      - id: a
        text: "`range(10)`"
        feedback: That is 0 to 9 — ten numbers, but starting at the default start 0.
      - id: b
        text: "`range(1, 10)`"
        feedback: The stop is excluded, so this ends at 9.
      - id: c
        text: "`range(1, 11)`"
        correct: true
        feedback: Right. Start 1 is included; stop 11 is excluded, so the last number is 10.
      - id: d
        text: "`range(0, 11)`"
        feedback: This includes 0, so it is eleven numbers from 0 to 10.

