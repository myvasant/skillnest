sections:
  - id: why
    title: Why another kind of loop?
    kind: why
    blocks:
      - type: markdown
        body: |
          With a [while loop](concept:python.while-loops) you can visit every character of a string, but
          you have to manage the position yourself — start it, test it, update it — and each of those
          three jobs is a chance for a bug:
      - type: code
        runnable: true
        code: |
          word = "code"
          i = 0
          while i < len(word):
              print(word[i])
              i += 1
        expectedOutput: |
          c
          o
          d
          e
        caption: Three lines of bookkeeping (lines 2, 3 and 5) just to visit four characters.
      - type: markdown
        body: |
          "Do this once for every item" is so common that Python has a loop built for it. The `for` loop
          hands you each item directly, and it stops by itself when the items run out:
      - type: code
        runnable: true
        code: |
          word = "code"
          for letter in word:
              print(letter)
        expectedOutput: |
          c
          o
          d
          e
        caption: Same output. No counter, no condition, no update to forget — so no infinite loop.

  - id: basics
    title: How a for loop works
    kind: concept
    blocks:
      - type: markdown
        body: |
          ```text
          for name in iterable:
              body
          ```

          An [iterable](glossary:iterable) is any object that can hand out its items one at a time.
          Strings are iterable (their items are characters); so are ranges of numbers, and the lists you
          will meet [next](concept:python.lists).

          Python runs a for loop like this:

          1. Ask the iterable for its **next item**. If there are none left, the loop ends.
          2. **Bind** the [loop variable](glossary:loop-variable) (`name`) to that item — an ordinary
             assignment.
          3. Run the body, then go back to step 1.

          So the body runs **exactly once per item**, in order. For a string of length 9 that is nine
          [iterations](glossary:iteration).
      - type: code
        runnable: true
        code: |
          word = "education"
          vowels = 0
          for ch in word:
              if ch in "aeiou":
                  vowels += 1
          print(word, "has", vowels, "vowels")
        expectedOutput: |
          education has 5 vowels
        annotations:
          - line: 3
            text: ch is bound to "e", then "d", then "u", … — one character per iteration.
          - line: 4
            text: "`ch in \"aeiou\"` is True when the character appears in that string."
          - line: 6
            text: Not indented, so it runs once, after all nine iterations.
      - type: callout
        variant: tip
        title: Name the loop variable after one item
        body: |
          Read `for ch in word:` as "for each character `ch` in `word`". Good names make loops
          self-explanatory: `for letter in word`, `for digit in pin`, `for n in range(10)`.

  - id: range
    title: Counting with range()
    kind: concept
    blocks:
      - type: markdown
        body: |
          To repeat something a number of times, or to walk through numbers, loop over a
          [range](glossary:range-object). `range()` has three forms, and in **every** form the
          **stop value is excluded**:

          | Call | Numbers produced | How many |
          |---|---|---|
          | `range(5)` | 0 1 2 3 4 | 5 |
          | `range(2, 6)` | 2 3 4 5 | 6 − 2 = 4 |
          | `range(0, 20, 5)` | 0 5 10 15 | 4 |
          | `range(5, 0, -1)` | 5 4 3 2 1 | 5 |
          | `range(10, 0)` | *(nothing)* | 0 |

          - `start` defaults to 0 and is **included**; `stop` is **never included**.
          - `step` defaults to 1. A **negative** step counts down, and then the range stops *before*
            reaching `stop` from above.
          - If `start` is already past `stop` in the direction of the step, the range is **empty** and
            the loop body runs zero times. `range(10, 0)` is empty because the default step is +1.
          - All three values must be integers, and `step` cannot be 0.
      - type: code
        runnable: true
        code: |
          for i in range(5):
              print(i, end=" ")
          print()
          for i in range(2, 6):
              print(i, end=" ")
          print()
          for i in range(0, 20, 5):
              print(i, end=" ")
          print()
          for i in range(5, 0, -1):
              print(i, end=" ")
          print()
        expectedOutput: |
          0 1 2 3 4
          2 3 4 5
          0 5 10 15
          5 4 3 2 1
        annotations:
          - line: 2
            text: '`end=" "` puts a space instead of a newline after each number, so a whole range fits on one line.'
          - line: 3
            text: An empty print() ends the line.
      - type: callout
        variant: misconception
        title: '"range(1, 5) includes 5"'
        body: |
          It does not: `range(1, 5)` is 1, 2, 3, 4. To include an end value `n`, use `range(1, n + 1)`.
          The rule pays off: `range(n)` gives exactly `n` numbers, `range(a, b)` gives `b - a` numbers,
          and `range(0, len(word))` produces exactly the valid indexes of `word`. Two ranges that share a
          boundary, like `range(0, 5)` and `range(5, 10)`, fit together without overlap.
      - type: markdown
        body: |
          A range is an object in its own right, not a stored collection of numbers. It remembers only
          start, stop and step, and works out each number when the loop asks for it. Printing it shows
          the recipe; converting it to a [list](concept:python.lists) (next lesson) shows the numbers:
      - type: code
        runnable: true
        code: |
          print(range(5))
          print(list(range(5)))
          print(list(range(10, 0, -3)))
        expectedOutput: |
          range(0, 5)
          [0, 1, 2, 3, 4]
          [10, 7, 4, 1]
      - type: item
        ref: predict-range-step

  - id: mental-model
    title: "Mental model: the loop variable is assigned for you"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Picture the for loop as doing an assignment at the top of every iteration: `n = <next item>`.
          The loop variable is an ordinary [variable](glossary:variable); the for loop simply rebinds it
          before each pass. That has a consequence people often miss: **after the loop, the name still
          refers to the last item**.

          Step through it and watch `n` move from 1 to 2 to 3 while `total` accumulates.
      - type: visualization
        component: python-tracer
        title: Watch the loop variable being rebound
        caption: >-
          Each time line 2 runs, the for loop binds n to the next number from range(1, 4). When the range
          has no numbers left, execution jumps to line 5 — and n still refers to 3.
        props:
          code: |
            total = 0
            for n in range(1, 4):
                total += n
                print("n =", n, "total =", total)
            print("done, n is still", n)
      - type: markdown
        body: |
          A `for` over a range does the same three jobs as the while loop from the previous lesson, but
          packs them into one line that cannot be forgotten:

          | | while loop | for loop |
          |---|---|---|
          | start | `n = 1` before the loop | first number of `range(1, 4)` |
          | test | `while n < 4:` | "are there numbers left?" — automatic |
          | update | `n += 1` in the body | the next number — automatic |

  - id: accumulator
    title: The accumulator pattern
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          The [accumulator](glossary:accumulator) pattern from the while lesson becomes very compact with
          `for`: create the result **before** the loop with a neutral starting value, update it **inside**
          the loop, use it **after** the loop.
      - type: code
        runnable: true
        code: |
          total = 0
          for n in range(1, 101):
              total += n
          print(total, sum(range(1, 101)))

          text = "R2-D2 and C-3PO"
          digits = 0
          for ch in text:
              if ch.isdigit():
                  digits += 1
          print(digits)
        expectedOutput: |
          5050 5050
          3
        annotations:
          - line: 4
            text: The built-in sum() does this particular accumulation for you. Writing it once by hand shows what sum() does.
          - line: 9
            text: A counter that only counts some items — a filter inside the loop.
      - type: markdown
        body: |
          An accumulator does not have to be a number. Starting from the empty string `""`, you can build
          a new string piece by piece. Strings are [immutable](glossary:immutable), so each step creates
          a new string and rebinds the name to it:
      - type: code
        runnable: true
        code: |
          word = "stressed"
          backwards = ""
          for ch in word:
              backwards = ch + backwards
          print(backwards)
        expectedOutput: |
          desserts
        annotations:
          - line: 4
            text: Each new character goes on the FRONT, so the first character ends up last.
      - type: visualization
        component: python-tracer
        title: Build a string one character at a time
        caption: Watch backwards grow from "" to "p", "op", "top", "stop". Each step is a brand-new string object.
        props:
          code: |
            word = "pots"
            backwards = ""
            for ch in word:
                backwards = ch + backwards
            print(backwards)
      - type: item
        ref: predict-build-string

  - id: loop-variable
    title: Assigning to the loop variable changes nothing else
    kind: concept
    blocks:
      - type: markdown
        body: |
          Because the loop variable is just a name bound to the current item, assigning something else
          to it only **rebinds that name**. It does not change the string or range you are looping over,
          and it does not change which item comes next.
      - type: code
        runnable: true
        code: |
          word = "cat"
          for ch in word:
              ch = ch.upper()
              print(ch, end=" ")
          print()
          print(word)
        expectedOutput: |
          C A T
          cat
        caption: "ch = ch.upper() points ch at a new string; word is untouched. To get an upper-case copy, build a new string (or use word.upper())."
      - type: visualization
        component: python-tracer
        title: The next iteration rebinds i anyway
        caption: >-
          Line 3 points i at 100, but when execution returns to line 1 the for loop binds i to the next
          number from the range (1, then 2). The range never learns about the 100.
        props:
          code: |
            for i in range(3):
                print("start of body, i =", i)
                i = 100
                print("changed i to", i)
      - type: callout
        variant: misconception
        title: '"Changing i skips ahead"'
        body: |
          In some languages, changing the loop counter changes where the loop goes next. In Python, the
          for loop keeps its own place in the iterable and ignores what you did to the name. If you need
          to jump around, use a [while loop](concept:python.while-loops) with an explicit index. And
          changing a **list** while looping over it is a different (and risky) thing, covered in the
          [lists lesson](concept:python.lists).
      - type: item
        ref: predict-loopvar

  - id: nested
    title: Nested loops
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A loop can sit inside another loop's body — a [nested loop](glossary:nested-loop). The rule is
          simple and strict: **for each single iteration of the outer loop, the inner loop runs all of its
          iterations.** With 3 outer iterations and 4 inner ones, the inner body runs 3 × 4 = 12 times.
      - type: code
        runnable: true
        code: |
          for row in range(1, 4):
              for col in range(1, 5):
                  print(row * col, end=" ")
              print()
        expectedOutput: |
          1 2 3 4
          2 4 6 8
          3 6 9 12
        annotations:
          - line: 2
            text: The inner loop starts again from 1 every time the outer loop moves to a new row.
          - line: 4
            text: Indented under the outer loop only, so it ends each row after the inner loop finishes.
      - type: code
        runnable: true
        code: |
          for first in "AB":
              for second in "xyz":
                  print(first + second, end=" ")
          print()
        expectedOutput: |
          Ax Ay Az Bx By Bz
        caption: The inner loop runs completely (x, y, z) before the outer loop moves from A to B — like the minute hand going all the way round before the hour hand moves.
      - type: markdown
        body: |
          The inner loop may depend on the outer loop's variable. Then the inner loop runs a **different**
          number of times on each outer iteration — count carefully:
      - type: item
        ref: predict-nested-count
      - type: callout
        variant: warning
        title: Use different names for the two loop variables
        body: |
          `for i in ...:` inside `for i in ...:` makes the inner loop rebind the outer loop's name. The
          outer loop still continues correctly (it keeps its own place), but any code in the outer body
          after the inner loop sees the inner value. Choose distinct, descriptive names such as `row` and
          `col`.

  - id: enumerate-zip
    title: enumerate() and zip()
    kind: concept
    blocks:
      - type: markdown
        body: |
          Sometimes you need the **position** of each item as well as the item. Instead of
          `for i in range(len(word)):` followed by `word[i]`, use [enumerate()](glossary:enumerate-function),
          which hands out pairs of (count, item):
      - type: code
        runnable: true
        code: |
          for position, letter in enumerate("cat"):
              print(position, letter)
          for number, letter in enumerate("cat", start=1):
              print(f"{number}. {letter}")
        expectedOutput: |
          0 c
          1 a
          2 t
          1. c
          2. a
          3. t
        annotations:
          - line: 1
            text: Two names after for. Each pair from enumerate is split into them — position gets the count, letter gets the character.
          - line: 3
            text: start=1 makes the count begin at 1, handy for numbered lists shown to people.
      - type: markdown
        body: |
          Writing two names separated by a comma after `for` *unpacks* each pair into those names. The
          pairs are [tuples](concept:python.tuples), which you will study soon; for now, "two names, one
          pair" is all you need.

          To walk through **two sequences side by side**, use [zip()](glossary:zip-function). It pairs the
          first items, then the second items, and so on:
      - type: code
        runnable: true
        code: |
          guess = "crane"
          answer = "crate"
          matches = 0
          for g, a in zip(guess, answer):
              if g == a:
                  matches += 1
          print(matches, "letters in the right place")

          for letter, number in zip("abc", range(1, 10)):
              print(letter + str(number))
        expectedOutput: |
          4 letters in the right place
          a1
          b2
          c3
        annotations:
          - line: 4
            text: "First iteration: g is \"c\" and a is \"c\". Second: \"r\" and \"r\". And so on."
          - line: 9
            text: zip stops as soon as the SHORTEST input runs out — three letters, so only three pairs.
      - type: callout
        variant: deep-dive
        title: Catching unequal lengths with strict=True
        depth: deep
        body: |
          Silently stopping at the shortest input can hide bugs (for example, two strings that were
          supposed to have the same length). Since Python 3.10, `zip(a, b, strict=True)` raises
          `ValueError` if one input runs out before the others — after producing the pairs it could.
          See [PEP 618](https://peps.python.org/pep-0618/).

  - id: for-vs-while
    title: Choosing between for and while
    kind: concept
    blocks:
      - type: markdown
        body: |
          | Use **for** when… | Use **while** when… |
          |---|---|
          | you have a sequence to walk through (a string, a range, a list) | you repeat **until something happens** (valid input, a goal reached) |
          | you know how many repetitions you need before the loop starts | the number of repetitions is discovered while running |
          | e.g. "for every character", "10 times", "for each score" | e.g. "until the user types done", "until the balance doubles" |

          Every `for` over a range can be rewritten as a `while`, but the `for` version is shorter and
          cannot get stuck. Reach for `for` by default; use `while` when there is no sequence to walk.
      - type: item
        ref: explain-for-vs-while

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `TypeError: 'int' object is not iterable` | Looping over a number: `for i in 5:` | Loop over a range: `for i in range(5):` |
          | `TypeError: 'float' object cannot be interpreted as an integer` | A float passed to range, e.g. `range(len(s) / 2)` | Use `//` or `int()` so range gets an integer. |
          | The last number is missing | [Off-by-one](glossary:off-by-one-error): stop is excluded | `range(1, n + 1)` to include n. |
          | Loop body never runs | Empty range such as `range(10, 0)` (default step is +1) | Count down with a negative step: `range(10, 0, -1)`. |
          | Total is just the last item | The accumulator is reset **inside** the loop | Create it once, **before** the loop. |
          | Original string unchanged after "modifying" `ch` | Assigning to the loop variable only rebinds the name | Build a new result in an accumulator. |
          | `ValueError: range() arg 3 must not be zero` | `step` of 0 | Use a non-zero step. |
      - type: code
        runnable: true
        code: |
          count = 5
          for i in count:
              print(i)
        expectError: TypeError
        caption: "TypeError: 'int' object is not iterable. A number is not a collection of items; range(count) is."
      - type: code
        runnable: true
        code: |
          word = "python"
          for i in range(len(word) / 2):
              print(word[i])
        expectError: TypeError
        caption: "len(word) / 2 is 3.0, a float, and range only accepts integers. len(word) // 2 gives 3."
      - type: item
        ref: debug-reset-total

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          Before writing each loop, say what it loops **over** and what the loop variable will be on the
          first and last iteration.
      - type: item
        ref: code-even-squares
      - type: item
        ref: parsons-triangle
      - type: item
        ref: code-hamming

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **The iteration protocol.** A for loop does not use indexes. It calls the built-in `iter()` on
          the object to get an [iterator](glossary:iterator) — an object that remembers its position —
          and then calls `next()` on that iterator before every iteration. When `next()` has no more
          items it raises `StopIteration`, which the for loop catches silently to end the loop. You can
          drive the protocol by hand:
      - type: code
        runnable: true
        code: |
          letters = iter("hi")
          print(next(letters))
          print(next(letters))
          print(next(letters, "no more items"))
        expectedOutput: |
          h
          i
          no more items
        caption: "next(it, default) returns the default instead of raising StopIteration. The full story is in the iterators lesson."
      - type: markdown
        body: |
          This is why `for` works on anything iterable — strings, ranges, lists, files, dictionaries —
          and why assigning to the loop variable cannot affect the loop: the iterator, not the name,
          holds the position. See [iterators](concept:python.iterators) and
          [generators](concept:python.generators).

          **Ranges are tiny and lazy.** The [docs](https://docs.python.org/3/library/stdtypes.html#ranges)
          guarantee that a range takes the same small amount of memory however large it is, because it
          stores only start, stop and step and calculates items on demand. It still behaves like a
          sequence: it supports `len()`, indexing (including negative indexes) and `in`. For integer
          membership tests CPython does arithmetic instead of looping, so this is instant:
      - type: code
        runnable: true
        code: |
          big = range(0, 10**12, 5)
          print(big[-1])
          print(10**11 in big)
          print(len(range(0, 1_000_000, 7)))
        expectedOutput: |
          999999999995
          True
          142858
        caption: A trillion-number range costs a few bytes. (len() must fit in a C ssize_t, which is 32 bits in the browser's WebAssembly build, so len(big) itself would raise OverflowError here.)
      - type: markdown
        body: |
          **No block scope.** Python has no separate scope for a loop body: the loop variable and any
          names assigned in the body are ordinary variables of the surrounding code and survive the
          loop. If the loop runs zero times, the loop variable is never assigned at all — using it
          afterwards raises `NameError` unless it already existed.

          **Speed.** In CPython, `for i in range(n)` is generally faster than the equivalent while loop,
          because producing the next number happens inside the range iterator (written in C) rather than
          in separate bytecode instructions for `i += 1` and `i < n`. Built-ins like `sum()` go further by
          running the whole loop in C. These are implementation details; measure with
          [profiling tools](concept:python.profiling) before optimising.

          **for … else.** A for loop can have an `else` block that runs when the loop was not ended by
          `break`. It is covered in [break, continue and loop else](concept:python.loop-control).

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `for name in iterable:` binds `name` to each item **in order** and runs the body once per
            item. It stops by itself when the items run out.
          - Strings give characters; `range(start, stop, step)` gives integers. **stop is excluded**;
            `start` defaults to 0, `step` to 1; a negative step counts down.
          - Accumulators: create **before** the loop, update **inside**, use **after**.
          - Nested loops: the inner loop runs **completely** for every outer iteration.
          - `enumerate(seq)` gives (position, item); `zip(a, b)` gives items side by side and stops at the
            shortest.
          - Assigning to the loop variable only rebinds the name; the next iteration rebinds it again.
          - Prefer `for` when there is a sequence to walk; use `while` to repeat until a condition changes.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          Common warm-ups: "What does `range(1, 10, 2)` produce?", "How many times does this nested loop
          run?", "Why use `enumerate` instead of `range(len(x))`?". A strong answer mentions that
          `for` uses the iteration protocol (`iter()`/`next()`), which is why it works on any iterable and
          why reassigning the loop variable has no effect on the loop.

items:
  - id: predict-range-step
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      for i in range(10, 0, -3):
          print(i, end=" ")
      print()
      for i in range(3, 15, 4):
          print(i, end=" ")
      print()
    answer: |
      10 7 4 1
      3 7 11
    explanation: >-
      range(10, 0, -3) starts at 10 and counts down by 3 while the value is still greater than the stop 0:
      10, 7, 4, 1 (the next value, -2, is past the stop). range(3, 15, 4) gives 3, 7, 11; the next value,
      15, equals the stop and is excluded.
    wrongAnswers:
      - answer: |
          10 7 4 1 -2
          3 7 11 15
        feedback: >-
          range never produces the stop value or anything beyond it. 15 is the stop of the second range,
          and -2 is past the stop 0 of the first.
      - answer: |
          10 7 4 1
          3 7 11 15
        feedback: The stop value is always excluded, so range(3, 15, 4) ends at 11.
      - answer: |
          1 4 7 10
          3 7 11
        feedback: A negative step counts down from start, so the first range begins at 10.

  - id: predict-build-string
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      result = ""
      for ch in "banana":
          if ch != "a":
              result += ch.upper()
      print(result)
    answer: BNN
    explanation: >-
      The loop visits b, a, n, a, n, a. Only the characters that are not "a" (b, n, n) pass the if, and
      each is added in upper case, so result grows "" → "B" → "BN" → "BNN".
    wrongAnswers:
      - answer: BANANA
        feedback: The if skips every "a", so only b, n and n are added.
      - answer: bnn
        feedback: Each character is added as ch.upper(), the upper-case version.
      - answer: AAA
        feedback: "`ch != \"a\"` is True for the letters that are NOT \"a\". Those are the ones added."

  - id: predict-loopvar
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      count = 0
      for i in range(4):
          i = i * 10
          count += 1
      print(count, i)
    answer: "4 30"
    explanation: >-
      The for loop rebinds i to 0, 1, 2, 3 at the start of each iteration, regardless of the assignment
      in the body, so the body runs 4 times. In the last iteration i is 3 and is then rebound to 30;
      nothing rebinds it after that, so i is 30 when printed.
    wrongAnswers:
      - answer: "2 10"
        feedback: >-
          This assumes that setting i to 10 makes the loop jump ahead and finish. The for loop keeps its
          own position in range(4) and binds i to the next number anyway.
      - answer: "4 3"
        feedback: >-
          The loop variable is an ordinary name. In the last iteration it was rebound from 3 to 30, and
          the loop does not undo that.
      - answer: "4 40"
        feedback: range(4) stops at 3, so the last value is 3 * 10 = 30.

  - id: predict-nested-count
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this program print?
    code: |
      count = 0
      for i in range(4):
          for j in range(i):
              count += 1
      print(count)
    answer: "6"
    explanation: >-
      The inner range depends on i. For i = 0 the inner range is empty (0 runs), then range(1) gives 1
      run, range(2) gives 2 and range(3) gives 3: 0 + 1 + 2 + 3 = 6.
    wrongAnswers:
      - answer: "16"
        feedback: That would be 4 × 4, but the inner loop runs range(i) times, a different number on each outer iteration.
      - answer: "10"
        feedback: range(i) excludes i, so the counts are 0, 1, 2, 3 rather than 1, 2, 3, 4.
      - answer: "4"
        feedback: count is increased in the inner body, which runs several times per outer iteration (and zero times when i is 0).

  - id: explain-for-vs-while
    type: explain
    skill: explanation
    prompt: |
      A teammate wrote this:

      ```python
      i = 0
      while i < len(word):
          print(word[i])
          i += 1
      ```

      Explain why a for loop is a better fit here, and describe one situation where a while loop would
      still be the right choice.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says the loop walks a known sequence, which is exactly what for is designed for.
      - Notes that for removes the manual start, test and update, so the off-by-one and forgotten-update bugs disappear.
      - "Shows the replacement: `for ch in word: print(ch)` (or enumerate if the index is needed)."
      - Gives a while example where the number of repetitions is unknown in advance (input validation, waiting until a value reaches a goal, a sentinel loop).
    modelAnswer: |
      The loop visits every character of a string that already exists, so the number of iterations is
      known: one per character. A for loop does exactly that — `for ch in word: print(ch)` — without a
      counter to initialise, test and update, so there is no way to forget `i += 1` or to write `<=`
      by mistake. If the index is also needed, `for i, ch in enumerate(word)` provides it. A while loop
      is still right when there is no sequence to walk and you repeat until something happens, for
      example asking for a password until it is correct, or doubling a value until it passes a target.

  - id: debug-reset-total
    type: debug
    skill: debugging
    prompt: |
      This program should add up the numbers from 1 to 10 and print `55`, but it prints `10`. Find and
      fix the bug without changing the range.
    starterCode: |
      for n in range(1, 11):
          total = 0
          total += n
      print(total)
    solution: |
      total = 0
      for n in range(1, 11):
          total += n
      print(total)
    expectedOutput: |
      55
    tests:
      - name: prints 55
        code: |
          assert output().strip() == "55", f"Expected 55, but your program printed {output()!r}."
      - name: still uses the for loop
        code: |
          assert uses("For"), "Keep the for loop over range(1, 11)."
      - name: works for a different range
        code: |
          import re
          changed = re.sub(r"range\(\s*1\s*,\s*11\s*\)", "range(1, 5)", source, count=1)
          assert changed != source, "Keep the loop as for n in range(1, 11)."
          ns = {}
          exec(compile(changed, "<variant>", "exec"), ns)
          assert ns.get("total") == 10, "With range(1, 5) the total should be 1 + 2 + 3 + 4 = 10. Make sure the total is built by the loop, not typed in."
    hints:
      - Step through the loop. What does total refer to at the start of each iteration?
      - "`total = 0` runs on every iteration, throwing away everything added so far."
      - The accumulator must be created once, before the loop starts.
    feedback:
      - when: { outputEquals: "10\n" }
        message: >-
          total is reset to 0 at the start of every iteration, so only the last number (10) survives.
          Move `total = 0` above the for line.
      - when: { errorType: NameError }
        message: total must exist before the loop's first `total += n`. Create it with `total = 0` before the loop.
    explanation: >-
      Anything inside the body runs once per iteration. Putting `total = 0` inside the loop resets the
      accumulator every time, so the final value is just the last n. Created once before the loop, it
      keeps every addition.

  - id: code-even-squares
    type: code
    skill: implementation
    prompt: |
      Read a whole number `n` and print the **squares of the even numbers from 2 up to and including
      n**, one per line. For `10` that is 4, 16, 36, 64, 100.

      Use the **step** argument of range so the loop only visits even numbers (no `%` test needed).
    stdin: |
      10
    starterCode: |
      n = int(input("n: "))
      # Print the squares of 2, 4, 6, ... up to and including n.
    solution: |
      n = int(input("n: "))
      for x in range(2, n + 1, 2):
          print(x * x)
    expectedOutput: |
      n: 4
      16
      36
      64
      100
    tests:
      - name: uses range with a step
        code: |
          import ast
          has_step = any(
              isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "range" and len(node.args) == 3
              for node in ast.walk(ast.parse(source))
          )
          assert uses("For") and has_step, "Use a for loop over range(start, stop, step) with a step of 2."
      - name: squares for n = 10
        code: |
          numbers = [w for w in output().split() if w.isdigit()]
          assert numbers == ["4", "16", "36", "64", "100"], f"For n = 10 expected 4, 16, 36, 64, 100 but got {numbers}."
      - name: works for other n
        code: |
          for typed, expected in [("7\n", ["4", "16", "36"]), ("2\n", ["4"]), ("1\n", [])]:
              numbers = [w for w in run_program(typed).split() if w.isdigit()]
              assert numbers == expected, f"For n = {typed.strip()} expected {expected} but got {numbers}."
    hints:
      - The first even number is 2 and each next one is 2 more. Those are range's start and step.
      - range excludes its stop. Which stop makes n itself included when n is even?
      - "`for x in range(2, n + 1, 2):` then print x * x."
    feedback:
      - when: { outputEquals: "n: 4\n16\n36\n64\n" }
        message: 100 is missing. range stops before its stop value, so to include n the stop must be n + 1.
      - when: { outputContains: "n: 0\n" }
        message: Your range starts at 0. The task asks for even numbers starting from 2.
    explanation: >-
      range(2, n + 1, 2) starts at 2 and steps by 2. The stop n + 1 makes sure n is included when it is
      even (and is harmless when n is odd). For n = 1 the range is empty, so nothing is printed.

  - id: parsons-triangle
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to print this number triangle. Two lines are distractors.

      ```text
      1
      12
      123
      ```
    solution: |
      for row in range(1, 4):
          line = ""
          for col in range(1, row + 1):
              line += str(col)
          print(line)
    distractors:
      - "            line = str(col)"
      - "    for col in range(1, row):"
    expectedOutput: |
      1
      12
      123
    explanation: >-
      The outer loop makes one row per iteration and resets line to "" at the start of each row. The
      inner loop runs from 1 up to and including row (stop row + 1) and appends each number. The print
      belongs to the outer loop, after the inner loop has finished. `range(1, row)` would leave out the
      last number of each row, and `line = str(col)` would replace instead of append.

  - id: code-hamming
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Biologists compare DNA strands by counting the positions where the letters differ (the *Hamming
      distance*). Read two strands of **equal length** and print `Differences:` followed by that count.

      `GATTACA` and `GACTATA` differ at two positions (T/C and C/T), so the output ends with
      `Differences: 2`.
    stdin: |
      GATTACA
      GACTATA
    starterCode: |
      strand1 = input("Strand 1: ")
      strand2 = input("Strand 2: ")
      differences = 0
      # Compare the strands position by position.

      print("Differences:", differences)
    solution: |
      strand1 = input("Strand 1: ")
      strand2 = input("Strand 2: ")
      differences = 0
      for a, b in zip(strand1, strand2):
          if a != b:
              differences += 1
      print("Differences:", differences)
    expectedOutput: |
      Strand 1: Strand 2: Differences: 2
    tests:
      - name: uses a for loop
        code: |
          assert uses("For"), "Use a for loop to walk through the two strands."
      - name: example strands
        code: |
          assert output().strip().endswith("Differences: 2"), f"GATTACA and GACTATA differ in 2 places. Your program printed {output()!r}."
      - name: works for other strands
        code: |
          cases = [("AAAA\nAAAA\n", 0), ("A\nT\n", 1), ("GAGCCTACTAACGGGAT\nCATCGTAATGACGGCCT\n", 7)]
          for typed, expected in cases:
              out = run_program(typed).strip()
              assert out.endswith(f"Differences: {expected}"), f"For strands {typed.split()} expected Differences: {expected}, but got {out!r}."
    hints:
      - You need the letters at the same position from both strands at the same time. Which built-in walks two sequences side by side?
      - "`for a, b in zip(strand1, strand2):` gives a from strand1 and b from strand2. Count when they differ."
      - Indexes also work, using for i in range(len(strand1)) and comparing strand1[i] with strand2[i].
    feedback:
      - when: { outputContains: "Differences: 5" }
        message: You counted the positions that match. The task asks for positions where the letters are different (!=).
      - when: { outputContains: "Differences: 0" }
        message: Nothing was counted. Make sure differences += 1 is inside the loop, under an if that compares the two letters.
    explanation: >-
      zip pairs up the letters at the same position, so one loop compares them all. A counter increases
      each time the pair differs. The same idea — comparing two sequences position by position — appears
      in spell checkers, diff tools and error-detecting codes.

