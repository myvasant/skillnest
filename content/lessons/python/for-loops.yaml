  - id: m-tf-loopvar
    type: true-false
    skill: explanation
    prompt: "True or false: inside `for i in range(5):`, the statement `i = 10` makes the loop finish early."
    answer: false
    explanation: >-
      The for loop gets each number from the range's iterator and rebinds i at the start of every
      iteration. Rebinding i in the body only changes what the name refers to until the next iteration;
      the loop still runs five times. To leave early you would use break (next lesson).

  - id: m-code-alternate-case
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Read a word and print a new version of it in which characters at **even positions** (0, 2, 4, …)
      are upper case and characters at **odd positions** are lower case. For `python` the result is
      `PyThOn`.
    stdin: |
      python
    starterCode: |
      word = input("Word: ")
      result = ""
      # Build result: even positions upper case, odd positions lower case.

      print(result)
    solution: |
      word = input("Word: ")
      result = ""
      for i, ch in enumerate(word):
          if i % 2 == 0:
              result += ch.upper()
          else:
              result += ch.lower()
      print(result)
    expectedOutput: |
      Word: PyThOn
    tests:
      - name: uses a for loop
        code: |
          assert uses("For"), "Use a for loop to visit each character with its position."
      - name: python becomes PyThOn
        code: |
          words = output().split()
          assert words and words[-1] == "PyThOn", f"For python the result should be PyThOn. Your program printed {output()!r}."
      - name: works for other words
        code: |
          for typed, expected in [("hello\n", "HeLlO"), ("ABCDEF\n", "AbCdEf"), ("q\n", "Q")]:
              words = run_program(typed).split()
              assert words and words[-1] == expected, f"For {typed.strip()} expected {expected}, but got {words[-1:]}."
    hints:
      - You need each character and its position. enumerate(word) gives both.
      - "A position i is even when `i % 2 == 0`."
      - Add ch.upper() or ch.lower() to the result accumulator depending on the position.
    feedback:
      - when: { outputContains: "pYtHoN" }
        message: The cases are swapped. Position 0 (the first character) counts as even, so it should be upper case.
    explanation: >-
      enumerate supplies the position i alongside each character. i % 2 decides whether the position is
      even, and the accumulator result collects the converted characters in order.

  - id: m-debug-half-word
    type: debug
    skill: debugging
    prompt: |
      This program should print the first half of a word (for `python`: `pyt`), but it crashes with a
      TypeError. Fix it so it works for any word.
    stdin: |
      python
    starterCode: |
      word = input("Word: ")
      half = ""
      for i in range(len(word) / 2):
          half += word[i]
      print(half)
    solution: |
      word = input("Word: ")
      half = ""
      for i in range(len(word) // 2):
          half += word[i]
      print(half)
    expectedOutput: |
      Word: pyt
    tests:
      - name: first half of python
        code: |
          words = output().split()
          assert words and words[-1] == "pyt", f"For python the first half is pyt. Your program printed {output()!r}."
      - name: works for other words
        code: |
          for typed, expected in [("abcdefgh\n", "abcd"), ("hello\n", "he"), ("ok\n", "o")]:
              words = run_program(typed).split()
              assert words and words[-1] == expected, f"For {typed.strip()} expected {expected}, but got {words[-1:]}."
          assert uses("For"), "Keep the for loop."
    hints:
      - Read the error message. What type of value does range receive, and what type does it need?
      - "`/` always produces a float, even for 6 / 2. Which operator divides and keeps an integer?"
    feedback:
      - when: { errorType: TypeError }
        message: range still receives a float. Use floor division (//) or int(...) so it gets a whole number.
    explanation: >-
      `/` is true division and always returns a float (6 / 2 is 3.0), but range only accepts integers.
      Floor division `len(word) // 2` returns the int 3. For odd lengths it rounds down, so "hello"
      gives "he".

masteryCheck:
  passThreshold: 0.8
  items: [m-mcq-range-inclusive, m-predict-enumerate, m-tf-loopvar, m-code-alternate-case, m-debug-half-word]

cheatsheet: |
  ```python
  for ch in "abc":            # each character in turn
  for i in range(5):          # 0 1 2 3 4        (stop excluded)
  for i in range(2, 6):       # 2 3 4 5
  for i in range(0, 20, 5):   # 0 5 10 15
  for i in range(5, 0, -1):   # 5 4 3 2 1
  for i, ch in enumerate(s):  # (0, s[0]), (1, s[1]), ...   start=1 to count from 1
  for a, b in zip(s, t):      # side by side; stops at the shortest

  total = 0                   # accumulator: before the loop
  for n in range(1, 11):
      total += n              # update inside
  print(total)                # use after
  ```
  - Include n → `range(1, n + 1)` · count down → negative step · `range(10, 0)` is empty
  - Reassigning the loop variable doesn't change the sequence or the next item
  - Nested loops: inner runs fully for each outer iteration (3 × 4 = 12 runs)
  - `for` when there is a sequence to walk; `while` until a condition changes
