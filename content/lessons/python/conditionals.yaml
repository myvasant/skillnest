  - id: m-predict-ternary
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      n = 0
      label = "none" if n == 0 else "some"
      parity = "odd" if n % 2 else "even"
      print(label, parity)
    answer: "none even"
    explanation: >-
      n == 0 is True, so label is "none". n % 2 is 0, which is falsy, so the conditional expression
      chooses its else value, "even".
    wrongAnswers:
      - answer: "none odd"
        feedback: The condition n % 2 evaluates to 0, which is falsy, so the value after else is chosen.
      - answer: "some even"
        feedback: The value BEFORE if is chosen when the condition is true. n == 0 is true, so label is "none".

  - id: m-mcq-indent-error
    type: mcq
    skill: debugging
    prompt: |
      This code fails with `IndentationError: unindent does not match any outer indentation level`:

      ```python
      if balance < 0:
              print("Overdrawn")
          print("Contact the bank")
      ```

      Both messages should appear when the balance is negative. What is wrong?
    explanation: >-
      The block started at 8 spaces, so Python's known indentation levels are 0 and 8. The third line
      uses 4 spaces, which matches neither level. Indent both lines of the block by the same amount
      (4 spaces by convention).
    options:
      - id: a
        text: The two lines of the block are indented differently (8 and 4 spaces); indent both by 4 spaces.
        correct: true
        feedback: Right. Every line in a block needs the same indentation, and 4 matches no level Python has seen.
      - id: b
        text: The if line is missing its colon.
        feedback: The colon is there. A missing colon gives SyntaxError - expected ':'.
      - id: c
        text: print() cannot be used inside an if block.
        feedback: Any statement can go inside a block.
      - id: d
        text: Every if needs an else.
        feedback: else is optional.

