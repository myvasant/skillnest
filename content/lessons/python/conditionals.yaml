    hints:
      - Use one if/elif/else chain - each age gets exactly one price.
      - "Order the age bands so each condition is only reached when the earlier ones are false: age < 5, then age < 18, ..."
      - Check the boundaries - is 5 a child? Is 65 a senior? Use < and >= carefully.
    explanation: >-
      A single chain gives each age exactly one price. Testing age < 5 first means the age < 18 branch
      only sees ages 5 to 17. The age >= 65 branch handles seniors, and else catches 18 to 64.

