      - name: Every boundary is correct
        code: |
          import re
          for value, expected in [(0, 0), (4, 0), (5, 100), (17, 100), (18, 250), (64, 250), (65, 120), (90, 120)]:
              changed = re.sub(r"age\s*=\s*\d+", f"age = {value}", source, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              exec(compile(changed, "<variant>", "exec"), ns)
              assert ns.get("price") == expected, f"For age {value} the price should be {expected}, but your program gives {ns.get('price')!r}."
      - name: Prints the price
        code: |
