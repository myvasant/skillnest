masteryCheck:
  passThreshold: 0.8
  items: [m-predict-chain-first, m-predict-ternary, m-mcq-indent-error, m-code-ticket-price, m-debug-missing-else]

cheatsheet: |
  ```python
  if score >= 90:          # colon after every condition
      grade = "A"          # block: indented 4 spaces
  elif score >= 75:        # tested only if everything above was false
      grade = "B"
  else:                    # no condition; catches everything else
      grade = "C"

  if battery < 20: ...     # separate ifs = independent checks
  if signal == 0: ...

  if age >= 18 and has_id: ...           # flatten nesting with and
  word = "item" if n == 1 else "items"   # conditional expression
  ```
  - Only the **first true branch** of a chain runs → most specific condition first
  - `IndentationError` → fix indentation · `expected ':'` → add the colon · NameError after an if → add `else`
