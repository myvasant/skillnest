id: python.conditionals
concept: python.conditionals
title: Conditional Statements
subtitle: if, elif and else — choosing which code runs
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  Make programs react to their data. Learn the if, elif and else statements, why indentation is part
  of Python's syntax, why only the first true branch of a chain runs, how a chain differs from
  separate if statements, how to order and simplify conditions, and the one-line conditional
  expression.
objectives:
  - Write if, if/else and if/elif/else statements with correct colons and indentation.
  - Predict which branch of an if/elif/else chain runs, knowing that only the first true branch executes.
  - Explain the difference between an elif chain and several separate if statements, and choose the right one.
  - Order conditions from most specific to most general, and flatten nested conditions with and/or.
  - Use a conditional expression (`a if condition else b`) to choose between two values.
  - Diagnose IndentationError, SyntaxError and NameError problems in conditional code.
sources:
  - title: "The Python Tutorial: if Statements"
    url: https://docs.python.org/3/tutorial/controlflow.html#if-statements
    publisher: Python Software Foundation
  - title: "Python Language Reference: The if statement"
    url: https://docs.python.org/3/reference/compound_stmts.html#the-if-statement
    publisher: Python Software Foundation
  - title: "Python Language Reference: Indentation"
    url: https://docs.python.org/3/reference/lexical_analysis.html#indentation
    publisher: Python Software Foundation
  - title: "Python Language Reference: Conditional expressions"
    url: https://docs.python.org/3/reference/expressions.html#conditional-expressions
    publisher: Python Software Foundation
  - title: "PEP 8: Indentation"
    url: https://peps.python.org/pep-0008/#indentation
    publisher: Python Software Foundation
  - title: "PEP 308: Conditional Expressions"
    url: https://peps.python.org/pep-0308/
    publisher: Python Software Foundation
sections:
  - id: why
    title: Why programs need to choose
    kind: why
    blocks:
      - type: markdown
        body: |
          Until now every line of every program has run, top to bottom, every time. But real programs
          must react: free shipping for big orders, an error message for a wrong password, a different
          greeting in the morning. Without a way to choose, a shop program can only print *both*
          messages and leave the customer confused:
      - type: code
        runnable: true
        code: |
          total = 650
          print("Free shipping!")
          print("Shipping costs 50.")
        expectedOutput: |
          Free shipping!
          Shipping costs 50.
      - type: markdown
        body: |
          An **if statement** uses a [Boolean](glossary:boolean) condition to decide which lines run:
      - type: code
        runnable: true
        code: |
          total = 650
          if total >= 500:
              print("Free shipping!")
          else:
              print("Shipping costs 50.")
        expectedOutput: |
          Free shipping!
        caption: Change total to 300 and run it again - the other message appears.

  - id: if-statement
    title: The if statement
    kind: concept
    blocks:
      - type: markdown
        body: |
          An `if` statement has three parts:

          ```text
          if condition:          <- the keyword if, a condition, and a colon
              statement          <- the block: indented lines that run only
              statement             when the condition is true
          next statement         <- back at the left margin: always runs
          ```

          Python evaluates the condition. If it is **truthy**, the indented [block](glossary:code-block)
          runs; if it is falsy, the block is skipped. Either way, the program then continues with the
          first line after the block.
      - type: code
        runnable: true
        code: |
          temperature = 31
          if temperature > 30:
              print("It's hot.")
              print("Drink some water.")
          print("Have a nice day.")
        expectedOutput: |
          It's hot.
          Drink some water.
          Have a nice day.
        annotations:
          - line: 2
            text: The condition ends with a colon.
          - line: 3
            text: Both indented lines belong to the if - they run together or not at all.
          - line: 5
            text: Not indented, so it is outside the if and always runs.
      - type: code
        runnable: true
        code: |
          temperature = 20
          if temperature > 30:
              print("It's hot.")
              print("Drink some water.")
          print("Have a nice day.")
        expectedOutput: |
          Have a nice day.
        caption: The same program with a falsy condition - the whole block is skipped.
      - type: markdown
        body: |
          The condition can be **any** expression, because Python uses its
          [truthiness](glossary:truthiness). `if name:` reads naturally as "if name is not empty":
      - type: code
        runnable: true
        code: |
          name = ""
          if name:
              print("Hello,", name)
          if not name:
              print("Please enter your name.")
        expectedOutput: |
          Please enter your name.

  - id: indentation
    title: Indentation is syntax
    kind: concept
    blocks:
      - type: markdown
        body: |
          Many languages mark blocks with braces `{ }` and treat spacing as decoration. Python uses
          [indentation](glossary:indentation) itself: **the lines indented under the colon are the
          block**, and the block ends at the first line that is indented less.

          The rules:

          - After a colon, the next line must be indented.
          - Every line in a block must be indented by **the same amount**.
          - Use **4 spaces** per level ([PEP 8](https://peps.python.org/pep-0008/#indentation)). Most
            editors insert 4 spaces when you press Tab. Never mix tabs and spaces.

          Break the rules and Python reports an [IndentationError](glossary:indentation-error) before
          running anything:
      - type: code
        runnable: true
        code: |
          temperature = 31
          if temperature > 30:
          print("It's hot.")
        expectError: IndentationError
        caption: "IndentationError: expected an indented block after 'if' statement on line 2."
      - type: markdown
        body: |
          Worse, some indentation mistakes are **not errors** at all — they silently change the meaning
          of the program. Here the second `print` was meant to be inside the `if`:
      - type: code
        runnable: true
        code: |
          score = 45
          if score >= 50:
              print("Passed")
          print("Certificate sent")
        expectedOutput: |
          Certificate sent
        caption: A failing student still gets a certificate. Python cannot know you meant to indent line 4.
      - type: callout
        variant: tip
        title: An empty block needs pass
        body: |
          A block cannot be empty. While you are still writing a program, the `pass` statement — which
          does nothing — keeps the syntax valid: `if total > 1000:` followed by an indented `pass`.
      - type: item
        ref: predict-indent

  - id: else-elif
    title: else and elif
    kind: concept
    blocks:
      - type: markdown
        body: |
          `else:` adds a block that runs when the condition is **false**. With `if`/`else`, exactly one
          of the two blocks runs — never both, never neither. `else` has no condition of its own.
      - type: code
        runnable: true
        code: |
          age = 15
          if age >= 18:
              print("You can vote.")
          else:
              print("Not yet -", 18 - age, "years to go.")
        expectedOutput: |
          Not yet - 3 years to go.
      - type: markdown
        body: |
          For more than two possibilities, add `elif` ("else if") branches. Python checks the
          conditions **from top to bottom** and runs the block of the **first** one that is true. Then
          it skips the whole rest of the chain. `else` at the end catches everything that matched
          nothing. The Language Reference puts it precisely: the if statement "selects exactly one of
          the suites by evaluating the expressions one by one until one is found to be true".
      - type: code
        runnable: true
        code: |
          score = 72
          if score >= 90:
              grade = "A"
          elif score >= 75:
              grade = "B"
          elif score >= 60:
              grade = "C"
          else:
              grade = "F"
          print("Grade:", grade)
        expectedOutput: |
          Grade: C
        annotations:
          - line: 2
            text: 72 >= 90 is False - check the next condition.
          - line: 4
            text: 72 >= 75 is False - check the next condition.
          - line: 6
            text: 72 >= 60 is True - run this block, then jump past the end of the chain.
          - line: 10
            text: Execution continues here. The else block was never considered.
      - type: visualization
        component: python-tracer
        title: Only the first true branch runs
        caption: >-
          Watch the highlighted line: Python tests line 2, then line 4, then line 6. Once line 6 is
          true it runs line 7 and jumps straight to line 10 - lines 8 and 9 are never visited.
        props:
          code: |
            score = 72
            if score >= 90:
                grade = "A"
            elif score >= 75:
                grade = "B"
            elif score >= 60:
                grade = "C"
            else:
                grade = "F"
            print("Grade:", grade)
      - type: markdown
        body: |
          Each one of these pieces is a [branch](glossary:branch). Notice that `elif score >= 75` does
          not need to say `and score < 90`: if `score` were 90 or more, the first branch would already
          have run and the chain would have stopped.

  - id: mental-model
    title: "Mental model: a corridor of gates"
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Picture an `if`/`elif`/`else` chain as a corridor with a row of doors. Python walks down the
          corridor testing one door (condition) at a time. **The first door that opens is taken**, its
          block runs, and then Python leaves the corridor at the far end — it never comes back to test
          the remaining doors. `else` is the exit at the end of the corridor, used only when every door
          stayed shut. Step through the path for `score = 72`:
      - type: visualization
        component: step-diagram
        title: The path through a grade chain for score = 72
        caption: Each condition is a door. The first True one is taken, and the rest of the chain is skipped.
        props:
          width: 720
          height: 320
          nodes:
            - { id: n90, label: "score >= 90 ?", x: 130, y: 40, shape: pill }
            - { id: n75, label: "score >= 75 ?", x: 130, y: 120, shape: pill }
            - { id: n60, label: "score >= 60 ?", x: 130, y: 200, shape: pill }
            - { id: gA, label: 'grade = "A"', x: 360, y: 40 }
            - { id: gB, label: 'grade = "B"', x: 360, y: 120 }
            - { id: gC, label: 'grade = "C"', x: 360, y: 200 }
            - { id: gF, label: 'else: grade = "F"', x: 130, y: 280 }
            - { id: done, label: "print(...)", x: 590, y: 160 }
          edges:
            - { id: t90, from: n90, to: gA, label: "True" }
            - { id: f90, from: n90, to: n75, label: "False" }
            - { id: t75, from: n75, to: gB, label: "True" }
            - { id: f75, from: n75, to: n60, label: "False" }
            - { id: t60, from: n60, to: gC, label: "True" }
            - { id: f60, from: n60, to: gF, label: "False" }
            - { id: xA, from: gA, to: done }
            - { id: xB, from: gB, to: done }
            - { id: xC, from: gC, to: done }
            - { id: xF, from: gF, to: done }
          steps:
            - title: Test the first condition
              body: "`72 >= 90` is **False**, so the first door stays shut and the A block is skipped."
              active: [n90]
            - title: Move to the next elif
              body: "Only because the first test failed does Python try the next one: `72 >= 75` is also **False**."
              active: [f90, n75]
            - title: A door opens
              body: "`72 >= 60` is **True**. This is the first true condition in the chain."
              active: [f75, n60]
            - title: Run that branch
              body: 'Python runs the block of this branch only: `grade = "C"`.'
              active: [t60, gC]
            - title: Leave the chain
              body: "Python jumps to the first statement after the chain. The `else` branch is never even considered."
              active: [xC, done]
      - type: markdown
        body: |
          Separate `if` statements are different: they are **several corridors in a row**. After
          finishing one, Python always walks into the next and tests its door too — which is exactly
          the behaviour the next section examines.

  - id: separate-ifs
    title: An elif chain versus separate ifs
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          What if you write the grade checks as **separate** `if` statements instead of one chain? Each
          `if` is a new, independent statement, so **every** condition is tested and every true one
          runs:
      - type: visualization
        component: python-tracer
        title: Three separate ifs - three decisions
        caption: All three conditions are true for 95, so all three blocks run. Compare with the chain above, which stops at the first match.
        props:
          code: |
            score = 95
            if score >= 90:
                print("A")
            if score >= 75:
                print("B")
            if score >= 60:
                print("C")
      - type: markdown
        body: |
          For grades this is a bug: a score gets exactly one grade, so the categories are **mutually
          exclusive** and belong in one `if`/`elif`/`else` chain. Separate `if`s are right when the
          checks are **independent** and several can apply at once:
      - type: code
        runnable: true
        code: |
          battery = 15
          signal = 0
          if battery < 20:
              print("Low battery")
          if signal == 0:
              print("No signal")
        expectedOutput: |
          Low battery
          No signal
        caption: Both warnings are true, and the user should see both - so these are separate ifs.
      - type: callout
        variant: misconception
        title: '"elif is just a shorter way to write if"'
        body: |
          `elif` belongs to the chain above it and runs **only if every earlier condition in that chain
          was false**. A new `if` starts a fresh decision that ignores what happened before.
      - type: item
        ref: predict-elif-vs-if
      - type: item
        ref: explain-elif-vs-if

  - id: ordering
    title: Ordering conditions
    kind: concept
    blocks:
      - type: markdown
        body: |
          Because the first true branch wins, **the order of the conditions is part of the logic**.
          Put the most specific (narrowest) condition first and the most general last. Here the checks
          are in the wrong order:
      - type: code
        runnable: true
        code: |
          score = 95
          if score >= 60:
              grade = "C"
          elif score >= 75:
              grade = "B"
          elif score >= 90:
              grade = "A"
          print(grade)
        expectedOutput: |
          C
        caption: 95 >= 60 is already true, so the chain stops at C. The A and B branches can never run for anyone.
      - type: markdown
        body: |
          Two ways to fix it:

          1. **Order from most specific to most general:** test `>= 90` first, then `>= 75`, then
             `>= 60` (as in the grade example above).
          2. **Make the ranges explicit** so the order no longer matters: `60 <= score < 75`,
             `75 <= score < 90`, and so on. This is longer but harder to break when someone reorders
             the branches later.

          A quick check for any chain: ask "is there a value for which a later branch should run, but
          an earlier condition is already true?" If yes, the order is wrong.
      - type: item
        ref: mcq-order

  - id: nested
    title: Nested conditions
    kind: concept
    blocks:
      - type: markdown
        body: |
          A block can contain any statements — including another `if`. Each level of nesting is
          indented 4 more spaces:
      - type: code
        runnable: true
        code: |
          age = 20
          has_id = False
          if age >= 18:
              if has_id:
                  print("Entry allowed")
              else:
                  print("Bring your ID")
          else:
              print("Too young")
        expectedOutput: |
          Bring your ID
        annotations:
          - line: 4
            text: This inner if only runs when the outer condition is true.
          - line: 8
            text: This else belongs to the OUTER if - it lines up with it.
      - type: markdown
        body: |
          Every `else` pairs with the `if` at the same indentation. Deep nesting quickly becomes hard to
          read, and it can often be **flattened** by combining conditions with `and`:
      - type: code
        runnable: true
        code: |
          age = 20
          has_id = False
          if age >= 18 and has_id:
              print("Entry allowed")
          elif age >= 18:
              print("Bring your ID")
          else:
              print("Too young")
        expectedOutput: |
          Bring your ID
        caption: Same behaviour, one level of indentation. Later, functions let you flatten further with early returns.
      - type: item
        ref: mcq-nested-equivalent

  - id: conditional-expression
    title: "Conditional expressions: a if condition else b"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Sometimes you only need to **choose between two values**. A
          [conditional expression](glossary:conditional-expression) does that in one line:

          ```text
          value_if_true if condition else value_if_false
          ```

          It is an *expression* — it produces a value — so it can go anywhere a value can: on the right
          of `=`, inside an f-string, as an argument to `print()`. Only the chosen value is evaluated.
      - type: code
        runnable: true
        code: |
          count = 1
          word = "item" if count == 1 else "items"
          print(count, word)

          count = 3
          print(f"{count} {'item' if count == 1 else 'items'}")

          total = 50
          people = 0
          share = total / people if people != 0 else 0
          print(share)
        expectedOutput: |
          1 item
          3 items
          0
        annotations:
          - line: 2
            text: Read it as "word is 'item' if count == 1, otherwise 'items'".
          - line: 10
            text: The division is never evaluated when people is 0, so there is no ZeroDivisionError.
      - type: callout
        variant: tip
        title: Keep it simple
        body: |
          Use a conditional expression for a simple choice between **two values**. For three or more
          outcomes, or when the branches need several statements, write a normal `if`/`elif`/`else` —
          nested conditional expressions are legal but very hard to read.

  - id: interactive
    title: "Worked example: validating input before deciding"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Real programs combine everything so far: read input, **check it is usable**, then choose. This
          ticket-price program first rejects input that is not a whole number, so `int()` never
          crashes, and only then picks a price. The Input box contains `70`:
      - type: code
        runnable: true
        code: |
          text = input("Age: ").strip()
          if not text.isdecimal():
              print("Please type a whole number.")
          else:
              age = int(text)
              if age < 5:
                  price = 0
              elif age < 18 or age >= 65:
                  price = 100
              else:
                  price = 250
              print(f"Ticket price: {price}")
        stdin: |
          70
        expectedOutput: |
          Age: Ticket price: 100
        annotations:
          - line: 2
            text: Guard first - handle the bad case before doing anything that could fail.
          - line: 5
            text: Inside the else we know text holds digits, so int() is safe.
          - line: 8
            text: Two groups share a price, so their conditions are joined with or.
          - line: 12
            text: Every branch of the inner chain sets price, so it is always defined here.
      - type: code
        runnable: true
        code: |
          text = input("Age: ").strip()
          if not text.isdecimal():
              print("Please type a whole number.")
          else:
              age = int(text)
              print("Age accepted:", age)
        stdin: |
          seventy
        expectedOutput: |
          Age: Please type a whole number.
        caption: With the input "seventy" the guard catches the problem and the program explains it instead of crashing.

  - id: under-the-hood
    title: Under the hood
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **An if is a conditional jump.** CPython compiles your code to bytecode. An `if` becomes the
          instructions that compute the condition followed by a *jump if false* instruction that skips
          over the block. An `elif` behaves exactly like another `if` nested inside the previous
          `else` — which is why the conditions are tested one at a time, in order.
      - type: code
        runnable: true
        code: |
          import dis

          source = "if x > 0:\n    y = 1\nelse:\n    y = 2\n"
          listing = dis.Bytecode(compile(source, "<demo>", "exec")).dis()
          print("POP_JUMP_IF_FALSE" in listing)
        expectedOutput: |
          True
        caption: Add print(listing) to see the whole bytecode. The exact instructions change between Python versions; the jump is the idea that stays.
      - type: markdown
        body: |
          **Indentation becomes tokens.** Before parsing, Python's tokenizer turns changes in
          indentation into INDENT and DEDENT tokens, keeping a stack of the indentation levels it has
          seen. A line may only return to a level that is on that stack — otherwise you get
          `unindent does not match any outer indentation level`. Mixing tabs and spaces so that the
          meaning depends on the tab width raises `TabError: inconsistent use of tabs and spaces in
          indentation`.

          **Long chains.** A chain with many branches tests its conditions one after another, so a value
          that matches the last branch pays for every test before it. That is almost never a
          performance problem, but it can be a readability one: mapping many fixed values to results is
          often clearer with a [dictionary](concept:python.dictionaries) lookup, and Python 3.10+ has
          the `match` statement for [structural pattern matching](concept:python.pattern-matching)
          (which also tries its cases in order).

          **The walrus operator.** The `if` grammar accepts an *assignment expression*, so
          `if (n := len(text)) > 10:` computes a value, binds it to `n` and tests it in one step. Use it
          sparingly; a separate assignment line is usually clearer for beginners and reviewers alike.

  - id: mistakes
    title: Common mistakes and how to fix them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `SyntaxError: expected ':'` | Missing colon after the condition, `else` or `elif` — also caused by writing `else if` | Add the colon; write `elif` |
          | `SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead of '='?` | `if x = 5:` | `if x == 5:` |
          | `IndentationError: expected an indented block after 'if' statement on line N` | Block not indented | Indent the block 4 spaces |
          | `IndentationError: unexpected indent` | A line indented for no reason | Line it up with the surrounding code |
          | `IndentationError: unindent does not match any outer indentation level` | Inconsistent indentation inside a block | Use the same 4-space steps everywhere |
          | `TabError: inconsistent use of tabs and spaces in indentation` | Tabs and spaces mixed | Configure your editor to insert spaces |
          | `SyntaxError: 'elif' block follows an 'else' block` | `elif` written after `else` | `else` must come last |
          | Several messages print | Separate `if`s where one chain was meant | Use `elif` |
          | The wrong branch runs | Conditions in the wrong order or overlapping | Most specific first, or explicit ranges |
          | `NameError` after the if statement | A variable is assigned in only some branches | Add an `else`, or assign a default before the `if` |
          | A condition is always true | `if x == "a" or "b":` | `if x == "a" or x == "b":` |
      - type: code
        runnable: true
        code: |
          age = 20
          if age >= 18
              print("Adult")
        expectError: SyntaxError
        caption: "SyntaxError: expected ':'. Python points at the end of line 2, where the colon is missing."
      - type: code
        runnable: true
        code: |
          score = 40
          if score >= 90:
              result = "Distinction"
          elif score >= 50:
              result = "Pass"
          print(result)
        expectError: NameError
        caption: No branch matched 40 and there is no else, so result was never assigned. NameError - name 'result' is not defined.

  - id: practice
    title: Practice
    kind: practice
    blocks:
      - type: markdown
        body: |
          The checks run your program with several different values, so every branch has to be right —
          not just the one the starting value happens to reach.
      - type: item
        ref: debug-grade-order
      - type: item
        ref: code-fizzbuzz-one
      - type: item
        ref: code-shipping
      - type: item
        ref: parsons-temperature

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - `if condition:` + an indented block runs the block only when the condition is truthy.
          - Indentation **is** syntax: 4 spaces per level, the same within a block, no tabs mixed in.
          - `if`/`elif`/`else`: conditions are tested top to bottom; **only the first true branch
            runs**; `else` catches the rest.
          - A chain is for mutually exclusive cases; separate `if`s are for independent checks.
          - Order conditions from most specific to most general (or use explicit ranges).
          - Flatten nesting with `and`; every `else` pairs with the `if` at its indentation level.
          - `a if condition else b` chooses between two values in one expression.
          - Make sure every path assigns the variables used after the if statement.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What is the difference between a chain of `elif`s and several `if` statements?" — A chain
          picks at most one branch (the first true one) and skips the rest; separate `if`s evaluate and
          may run every block. Show a bug caused by the wrong choice, mention condition ordering, and
          discuss reducing nesting with combined conditions or (in functions) early returns.

items:
  - id: predict-indent
    type: predict-output
    skill: prediction
    prompt: What does this print? Watch the indentation carefully.
    code: |
      x = 5
      if x > 10:
          print("big")
          print("really big")
      print("done")
      if x > 1:
          print("positive-ish")
    answer: |
      done
      positive-ish
    explanation: >-
      x > 10 is False, so the whole indented block (both "big" lines) is skipped. "done" is not
      indented, so it always runs. Then a separate if tests x > 1, which is True.
    wrongAnswers:
      - answer: |
          really big
          done
          positive-ish
        feedback: Both indented lines belong to the first if, so they are skipped together. Indentation, not position, decides membership.
      - answer: |
          done
        feedback: The second if is a new statement with its own condition. 5 > 1 is True, so its block runs.

  - id: predict-elif-vs-if
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      n = 15
      if n % 3 == 0:
          print("fizz")
      elif n % 5 == 0:
          print("buzz")
      if n % 5 == 0:
          print("five")
    answer: |
      fizz
      five
    explanation: >-
      15 % 3 == 0 is True, so the first chain prints fizz and skips its elif, even though 15 % 5 == 0
      is also true. The final if is a separate statement, so it is tested on its own and prints five.
    wrongAnswers:
      - answer: |
          fizz
          buzz
          five
        feedback: An elif only runs if every earlier condition in its chain was false. "fizz" already ran, so "buzz" is skipped.
      - answer: |
          fizz
        feedback: The last if is not part of the chain - it starts a new decision, and 15 % 5 == 0 is true.

  - id: explain-elif-vs-if
    type: explain
    skill: explanation
    prompt: |
      Explain the difference between an `if`/`elif`/`else` chain and a series of separate `if`
      statements. Give one situation where each is the right choice.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Says a chain tests conditions in order and runs only the first true branch, skipping the rest.
      - Says separate ifs are each evaluated independently, so several (or none) of their blocks may run.
      - Gives a fitting example for a chain - mutually exclusive categories such as grades or price bands.
      - Gives a fitting example for separate ifs - independent checks such as several warnings that can all apply.
    modelAnswer: |
      In an if/elif/else chain Python checks the conditions from the top and runs the block of the
      first one that is true; the rest of the chain is skipped, and else runs only if nothing matched.
      So exactly one branch (or none, without else) runs. Separate if statements are independent
      decisions: each condition is checked, and every block whose condition is true runs. Use a chain
      for mutually exclusive categories - a score gets exactly one grade. Use separate ifs for
      independent checks - a phone can have low battery AND no signal, and both warnings should show.

  - id: mcq-order
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      Shipping rules: orders of **1000 or more** ship free; orders of **500 or more** get half-price
      shipping; all other orders pay full shipping. Which structure is correct?
    explanation: >-
      The narrowest condition (>= 1000) must come first, because every order of 1000 or more is also
      >= 500. A single chain then gives each order exactly one shipping rule.
    options:
      - id: a
        text: "`if total >= 500:` half price, `elif total >= 1000:` free, `else:` full price"
        feedback: An order of 1200 matches total >= 500 first, so it gets half price and the free branch can never run.
      - id: b
        text: "`if total >= 1000:` free, `elif total >= 500:` half price, `else:` full price"
        correct: true
        feedback: Correct. Most specific first, and the chain guarantees exactly one rule applies.
      - id: c
        text: "`if total >= 1000:` free, then a separate `if total >= 500:` half price, `else:` full price"
        feedback: With separate ifs an order of 1200 runs both the free and the half-price blocks, so the second assignment wins.
      - id: d
        text: "`if total < 500:` full price, `elif total >= 500:` half price, `elif total >= 1000:` free"
        feedback: Every order of 500 or more is caught by the second branch, so the free branch is unreachable.

  - id: mcq-nested-equivalent
    type: mcq
    skill: transfer
    prompt: |
      Which single `if` is equivalent to this nested code?

      ```python
      if is_member:
          if total > 100:
              print("Discount")
      ```
    explanation: >-
      The inner print runs only when the outer condition AND the inner condition are both true, which
      is exactly what and expresses.
    options:
      - id: a
        text: "`if is_member and total > 100:`"
        correct: true
        feedback: Right. Nested ifs with no else branches combine with and.
      - id: b
        text: "`if is_member or total > 100:`"
        feedback: With or, a non-member with a big order would get the discount. The nested version requires both.
      - id: c
        text: "`if not is_member and total > 100:`"
        feedback: not flips the membership test, so only non-members would qualify.
      - id: d
        text: "`if is_member == total > 100:`"
        feedback: This is a chained comparison - is_member == total and total > 100 - which is not the same thing at all.

  - id: debug-grade-order
    type: debug
    skill: debugging
    prompt: |
      Grades should be: **90 or more → A**, **75–89 → B**, **60–74 → C**, **below 60 → F**. With
      `score = 95` this program prints `C`. Fix the logic so every score gets the right grade.
    starterCode: |
      score = 95
      if score >= 60:
          grade = "C"
      elif score >= 75:
          grade = "B"
      elif score >= 90:
          grade = "A"
      else:
          grade = "F"
      print(grade)
    solution: |
      score = 95
      if score >= 90:
          grade = "A"
      elif score >= 75:
          grade = "B"
      elif score >= 60:
          grade = "C"
      else:
          grade = "F"
      print(grade)
    expectedOutput: |
      A
    tests:
      - name: 95 is an A
        code: |
          assert grade == "A", f"A score of 95 should be an A, but grade is {grade!r}."
      - name: Every band is correct
        code: |
          import re
          cases = [(90, "A"), (89, "B"), (75, "B"), (74, "C"), (60, "C"), (59, "F"), (0, "F")]
          for value, expected in cases:
              changed = re.sub(r"score\s*=\s*\d+", f"score = {value}", source, count=1)
              ns = {"print": lambda *args, **kwargs: None}
              exec(compile(changed, "<variant>", "exec"), ns)
              assert ns.get("grade") == expected, f"A score of {value} should be {expected}, but your program gives {ns.get('grade')!r}."
    hints:
      - Only the first true branch runs. For 95, which condition is tested first - and is it true?
      - Every score of 90 or more is also >= 60. Which condition should be tested first?
      - Reorder the branches from the highest threshold to the lowest.
    feedback:
      - when: { outputEquals: "C\n" }
        message: >-
          95 >= 60 is tested first and is true, so the chain stops at C. Put the most specific condition
          (score >= 90) first.
    explanation: >-
      In a chain the first true condition wins. Every A or B score is also >= 60, so testing >= 60
      first captured them all. Ordering the thresholds from highest to lowest means each condition
      is only reached when all the higher ones have failed.

  - id: code-fizzbuzz-one
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      For one whole number `n`, print:

      - `FizzBuzz` if `n` is divisible by **both** 3 and 5,
      - `Fizz` if it is divisible by 3 only,
      - `Buzz` if it is divisible by 5 only,
      - otherwise, the number itself.

      Start with `n = 15`, which prints `FizzBuzz`. The checks try other numbers too.
    starterCode: |
      n = 15

    solution: |
      n = 15
      if n % 3 == 0 and n % 5 == 0:
          print("FizzBuzz")
      elif n % 3 == 0:
          print("Fizz")
      elif n % 5 == 0:
          print("Buzz")
      else:
          print(n)
    expectedOutput: |
      FizzBuzz
    tests:
      - name: 15 prints FizzBuzz
        code: |
          assert output() == "FizzBuzz\n", f"For n = 15 the output should be FizzBuzz, but it was {output()!r}."
      - name: Correct for other numbers
        code: |
          import contextlib, io, re
          for value, expected in [(9, "Fizz"), (10, "Buzz"), (7, "7"), (30, "FizzBuzz"), (3, "Fizz"), (1, "1")]:
              changed = re.sub(r"n\s*=\s*\d+", f"n = {value}", source, count=1)
              buffer = io.StringIO()
              with contextlib.redirect_stdout(buffer):
                  exec(compile(changed, "<variant>", "exec"), {})
              assert buffer.getvalue() == expected + "\n", f"For n = {value} you should print exactly {expected!r} (one line), but printed {buffer.getvalue()!r}."
      - name: Uses an if statement
        code: |
          assert uses("If"), "Use an if/elif/else chain to choose what to print."
    hints:
      - "\"Divisible by 3\" means n % 3 == 0."
      - Which case is the most specific? Every number divisible by both 3 and 5 is also divisible by 3.
      - Test the FizzBuzz case first, then Fizz, then Buzz, then else for the number.
    feedback:
      - when: { outputEquals: "Fizz\n" }
        message: >-
          For 15 the Fizz branch ran first, because 15 is divisible by 3. Test the most specific case -
          divisible by both - before the others.
      - when: { outputContains: "Fizz\nBuzz" }
        message: >-
          Several lines printed: those look like separate if statements. Use one if/elif/else chain so
          only one branch runs.
    explanation: >-
      The cases overlap - 15 is divisible by 3, by 5, and by both - so the most specific test must come
      first. One chain guarantees exactly one line is printed; the else catches numbers divisible by
      neither.

  - id: code-shipping
    type: code
    skill: transfer
    difficulty: 3
    stdin: |
      620
      no
    prompt: |
      Write a checkout program that reads **two lines**: the order total (it may have decimals), then
      whether the customer is a member (`yes` or `no` — users may type `YES` or add spaces).

      Rules: **members always get free shipping**; non-members get free shipping on orders of
      **500 or more**; everyone else pays **50**. Print two lines, the second with two decimals:

      ```text
      Shipping: 0
      Pay: 620.00
      ```

      Prompts are allowed; the checks look at the end of your output and try other totals and answers.
    starterCode: |
      total = float(input("Order total: "))
      member = input("Member? ")

    solution: |
      total = float(input("Order total: "))
      member = input("Member? ").strip().lower() == "yes"
      if member or total >= 500:
          shipping = 0
      else:
          shipping = 50
      print(f"Shipping: {shipping}")
      print(f"Pay: {total + shipping:.2f}")
    expectedOutput: |
      Order total: Member? Shipping: 0
      Pay: 620.00
    tests:
      - name: Large order ships free
        code: |
          lines = output().rstrip().split("\n")
          assert len(lines) >= 2 and lines[-2].rstrip().endswith("Shipping: 0") and lines[-1].rstrip() == "Pay: 620.00", (
              f"For 620 and 'no' the last two lines should be 'Shipping: 0' and 'Pay: 620.00'. Your output was {output()!r}."
          )
      - name: Correct for other orders
        code: |
          cases = [("120\nno\n", "Shipping: 50", "Pay: 170.00"), ("120\n YES \n", "Shipping: 0", "Pay: 120.00"), ("499.99\nNo\n", "Shipping: 50", "Pay: 549.99"), ("500\nno\n", "Shipping: 0", "Pay: 500.00")]
          for given, ship, pay in cases:
              out = run_program(given)
              lines = out.rstrip().split("\n")
              ok = len(lines) >= 2 and lines[-2].rstrip().endswith(ship) and lines[-1].rstrip() == pay
              assert ok, f"With input {given!r} the last two lines should be {ship!r} and {pay!r}, but your program printed {out!r}."
    hints:
      - "Clean the member answer before comparing: input(...).strip().lower() == \"yes\" gives True or False."
      - "There are two ways to get free shipping - joined with or: member or total >= 500."
      - "Format the amount to pay with an f-string and :.2f."
    feedback:
      - when: { outputContains: "Shipping: 50\nPay: 670.00" }
        message: >-
          620 is 500 or more, so shipping should be free. Check your threshold condition (>= 500).
      - when: { errorMessageContains: "can only concatenate" }
        message: Use an f-string (or str()) to put the numbers into the output text.
    explanation: >-
      The member answer is normalised with strip().lower() and compared once, giving a bool. The two
      routes to free shipping are alternatives, so they are joined with or, and a single if/else picks
      the shipping cost. The f-string formats the final amount with two decimals.

