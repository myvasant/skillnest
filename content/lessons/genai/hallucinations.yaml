id: genai.hallucinations
concept: genai.hallucinations
title: Hallucinations and limitations
subtitle: Models produce fluent text whether or not it is true; knowledge cutoffs, missing context and sampling
  cause confident errors that must be designed around
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Models produce fluent text whether or not it is true; knowledge cutoffs, missing context and sampling cause
  confident errors that must be designed around.
objectives:
- Explain the role of hallucinations and limitations in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Why Language Models Hallucinate
  url: https://arxiv.org/abs/2509.04664
  publisher: arXiv (Kalai et al.)
- title: A Survey on Hallucination in Large Language Models
  url: https://arxiv.org/abs/2311.05232
  publisher: arXiv (Huang et al.)
- title: LLM09:2025 Misinformation
  url: https://genai.owasp.org/llmrisk/llm092025-misinformation/
  publisher: OWASP Gen AI Security Project
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Models produce fluent text whether or not it is true; knowledge cutoffs, missing context and sampling
      cause confident errors that must be designed around. Confident wrong answers — invented facts, citations or
      APIs — are the biggest risk in LLM products, and they cannot be prompted away entirely.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A hallucination is fluent, confident output that is unsupported or false, such as invented facts, quotes,
      citations, URLs or library functions.

      - Causes include training that rewards plausible guesses over admitting uncertainty, knowledge cutoffs, missing
      or ambiguous context, and sampling randomness.

      - Ground answers in supplied sources (RAG) and ask for citations; explicitly allow "I don''t know"; use tools
      for facts, calculations and current data.

      - Verify outputs in code where possible (links resolve, quotes appear in the source, numbers recompute) and
      keep humans in the loop for high-stakes decisions.

      - Measure hallucination rates on your own evaluation set; they vary by model, domain, prompt and context.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- RAG reduces hallucination but does not eliminate it; models can still misread, ignore or over-extend
      retrieved text.

      - Asking the model "are you sure?" is not verification; it may simply change a correct answer.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def evidence_status(answer, evidence):\n    if not evidence: return \"unsupported\"\n    if answer in\
      \ evidence: return \"directly supported\"\n    return \"requires verification\"\n\nprint(evidence_status(\"\
      The policy is 30 days\", [\"The policy is 30 days\"]))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: hallucinations-code
  - type: item
    ref: hallucinations-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A hallucination is fluent, confident output that is unsupported or false, such as invented facts, quotes,
      citations, URLs or library functions.

      - Causes include training that rewards plausible guesses over admitting uncertainty, knowledge cutoffs, missing
      or ambiguous context, and sampling randomness.

      - Ground answers in supplied sources (RAG) and ask for citations; explicitly allow "I don''t know"; use tools
      for facts, calculations and current data.

      - Verify outputs in code where possible (links resolve, quotes appear in the source, numbers recompute) and
      keep humans in the loop for high-stakes decisions.

      - Measure hallucination rates on your own evaluation set; they vary by model, domain, prompt and context.


      **Limitations**

      - RAG reduces hallucination but does not eliminate it; models can still misread, ignore or over-extend retrieved
      text.

      - Asking the model "are you sure?" is not verification; it may simply change a correct answer.'
  - type: item
    ref: hallucinations-mcq
  - type: item
    ref: hallucinations-tf
  - type: item
    ref: hallucinations-code
items:
- id: hallucinations-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of hallucinations and limitations?
  explanation: A hallucination is fluent, confident output that is unsupported or false, such as invented facts,
    quotes, citations, URLs or library functions.
  options:
  - id: a
    text: A hallucination is fluent, confident output that is unsupported or false, such as invented facts, quotes,
      citations, URLs or library functions.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: RAG reduces hallucination but does not eliminate it; models can still misread, ignore or over-extend retrieved
      text.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: hallucinations-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: RAG reduces hallucination but does not eliminate it; models can still misread, ignore or over-extend retrieved
    text.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: hallucinations-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding hallucinations and limitations to an application. Describe the design, one failure mode,
    and how you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: hallucinations-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for hallucinations and limitations. The assertions include the normal
    path and a meaningful edge case.
  starterCode: "def evidence_status(answer, evidence):\n    raise NotImplementedError('Complete this function')"
  solution: "def evidence_status(answer, evidence):\n    if not evidence: return \"unsupported\"\n    if answer\
    \ in evidence: return \"directly supported\"\n    return \"requires verification\""
  tests:
  - name: Core behaviour
    code: assert evidence_status("claim", []) == "unsupported"
  - name: Edge case
    code: 'assert evidence_status("claim", ["claim"]) == "directly supported"

      assert evidence_status("claim", ["other"]) == "requires verification"'
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - hallucinations-mcq
  - hallucinations-tf
  - hallucinations-code
