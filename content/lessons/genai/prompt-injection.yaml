      - "`TOOLS[name](**call.get(\"arguments\", {}))` runs the tool with its arguments."
    feedback:
      - when: { errorType: KeyError }
        message: An unknown tool name should be refused with an "error..." string, not crash with KeyError.
    explanation: >-
      The model only proposes; your code decides. Unknown tools are refused outright, side effects wait for an
      explicit human yes (anything else, including None, is a no), and read-only tools run without bothering the
      user - which keeps approval prompts rare enough that people still read them.

