id: genai.prompt-injection
concept: genai.prompt-injection
title: Prompt Injection
subtitle: When data becomes instructions
estimatedMinutes: 55
reviewedOn: 2026-10-23
summary: >-
  An LLM reads its instructions and the data it works on as one stream of text, so text in an email, web
  page or tool result can quietly take over. You will watch a toy summariser get hijacked into leaking a
  secret through a tool call, then build the layered mitigations real systems use - delimiting untrusted
  content, least-privilege tools, allow-lists and human approval, output validation, and keeping secrets out
  of prompts - and learn why none of them is a complete fix on its own.
objectives:
  - Explain prompt injection and distinguish direct from indirect injection (and from jailbreaking).
  - Explain why instructions and data share one channel in an LLM, contrasting it with parameterised SQL.
  - Trace how an indirect injection turns into data exfiltration through tools or rendered output.
  - Implement layered mitigations - tool allow-lists, human approval gates, delimiting and output validation - in Python.
  - Evaluate a design for residual risk and explain why no single mitigation is sufficient.
