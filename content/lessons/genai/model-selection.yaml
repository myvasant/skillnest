id: genai.model-selection
concept: genai.model-selection
title: Choosing a model
subtitle: Match capability, context length, latency, cost, privacy and licence to the task, and verify with your
  own evaluations rather than leaderboards alone
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Match capability, context length, latency, cost, privacy and licence to the task, and verify with your
  own evaluations rather than leaderboards alone.
objectives:
- Explain the role of choosing a model in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Holistic Evaluation of Language Models (HELM)
  url: https://crfm.stanford.edu/helm/
  publisher: Stanford CRFM
- title: 'Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference'
  url: https://arxiv.org/abs/2403.04132
  publisher: arXiv (Chiang et al.)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Match capability, context length, latency, cost, privacy and licence to the task, and verify with your
      own evaluations rather than leaderboards alone. Model choice sets the quality ceiling, the unit cost and the
      latency of a feature — and the right answer changes every few months.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Start from requirements — quality bar, latency (time to first token and total time), cost per request
      at expected volume, context length, data privacy or residency, and licence.

      - Prototype with a strong model to check the task is feasible, then test cheaper and smaller models on your
      evaluation set to find the cheapest one that passes.

      - Public leaderboards and benchmarks show general capability but may be contaminated or unrepresentative of
      your task.

      - Weigh operational factors too — rate limits, availability, regional hosting, and the provider''s model deprecation
      schedule.

      - Put the model behind an interface in your code so you can swap or route between models as prices and capabilities
      change.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- The newest or largest model is not automatically best; a smaller model can match it on a narrow task
      at a fraction of the cost and latency.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def score_model(metrics, weights):\n    return sum(metrics.get(key, 0) * weight for key,weight in weights.items())\n\
      \nprint(score_model({\"quality\":0.9,\"latency\":0.7,\"cost\":0.8}, {\"quality\":0.5,\"latency\":0.3,\"cost\"\
      :0.2}))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: model-selection-code
  - type: item
    ref: model-selection-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Start from requirements — quality bar, latency (time to first token and total time), cost per request at
      expected volume, context length, data privacy or residency, and licence.

      - Prototype with a strong model to check the task is feasible, then test cheaper and smaller models on your
      evaluation set to find the cheapest one that passes.

      - Public leaderboards and benchmarks show general capability but may be contaminated or unrepresentative of
      your task.

      - Weigh operational factors too — rate limits, availability, regional hosting, and the provider''s model deprecation
      schedule.

      - Put the model behind an interface in your code so you can swap or route between models as prices and capabilities
      change.


      **Limitations**

      - The newest or largest model is not automatically best; a smaller model can match it on a narrow task at
      a fraction of the cost and latency.'
  - type: item
    ref: model-selection-mcq
  - type: item
    ref: model-selection-tf
  - type: item
    ref: model-selection-code
items:
- id: model-selection-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of choosing a model?
  explanation: Start from requirements — quality bar, latency (time to first token and total time), cost per request
    at expected volume, context length, data privacy or residency, and licence.
  options:
  - id: a
    text: Start from requirements — quality bar, latency (time to first token and total time), cost per request
      at expected volume, context length, data privacy or residency, and licence.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: The newest or largest model is not automatically best; a smaller model can match it on a narrow task at
      a fraction of the cost and latency.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: model-selection-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: The newest or largest model is not automatically best; a smaller model can match it on a narrow task at
    a fraction of the cost and latency.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: model-selection-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding choosing a model to an application. Describe the design, one failure mode, and how you
    would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: model-selection-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for choosing a model. The assertions include the normal path and a meaningful
    edge case.
  starterCode: "def score_model(metrics, weights):\n    raise NotImplementedError('Complete this function')"
  solution: "def score_model(metrics, weights):\n    return sum(metrics.get(key, 0) * weight for key,weight in weights.items())"
  tests:
  - name: Core behaviour
    code: assert abs(score_model({"quality":1,"cost":0.5}, {"quality":0.8,"cost":0.2})-0.9)<1e-12
  - name: Edge case
    code: assert score_model({}, {}) == 0
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - model-selection-mcq
  - model-selection-tf
  - model-selection-code
