id: genai.evaluation
concept: genai.evaluation
title: Evaluating LLM applications
subtitle: Build test sets from real cases, define pass criteria, combine exact checks with rubric or LLM-as-judge
  scoring (checked against humans), and rerun on every change
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Build test sets from real cases, define pass criteria, combine exact checks with rubric or LLM-as-judge
  scoring (checked against humans), and rerun on every change.
objectives:
- Explain the role of evaluating llm applications in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena
  url: https://arxiv.org/abs/2306.05685
  publisher: arXiv (Zheng et al.)
- title: Inspect evaluation framework
  url: https://inspect.aisi.org.uk/
  publisher: UK AI Security Institute
- title: promptfoo documentation
  url: https://www.promptfoo.dev/docs/intro/
  publisher: promptfoo
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Build test sets from real cases, define pass criteria, combine exact checks with rubric or LLM-as-judge
      scoring (checked against humans), and rerun on every change. Without systematic evaluation, every prompt or
      model change is a guess, and regressions reach users before anyone notices.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Build an evaluation set from real or realistic inputs, including edge cases and past failures; start
      with tens of examples and grow it over time.

      - Define pass criteria per case, using programmatic checks wherever possible (valid JSON, expected label,
      required citation present) and rubric grading for open-ended answers.

      - LLM-as-judge scales rubric grading but has known biases (position, verbosity, self-preference); measure
      its agreement with human labels before trusting it.

      - Rerun the suite on every prompt, model or retrieval change, compare variants on the same cases and track
      scores over time.

      - Offline evaluation complements, but does not replace, online signals such as user feedback, A/B tests and
      production monitoring.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Public benchmark scores do not tell you how a model performs on your task.

      - One run on a small set is noisy because outputs are stochastic; repeat runs and look at the spread before
      declaring a winner.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def exact_match_rate(expected, actual):\n    if len(expected)!=len(actual) or not expected: raise ValueError(\"\
      equal non-empty lists required\")\n    return sum(a==b for a,b in zip(expected,actual))/len(expected)\n\n\
      print(exact_match_rate([\"yes\",\"no\",\"yes\"], [\"yes\",\"yes\",\"yes\"]))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: evaluation-code
  - type: item
    ref: evaluation-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Build an evaluation set from real or realistic inputs, including edge cases and past failures; start with
      tens of examples and grow it over time.

      - Define pass criteria per case, using programmatic checks wherever possible (valid JSON, expected label,
      required citation present) and rubric grading for open-ended answers.

      - LLM-as-judge scales rubric grading but has known biases (position, verbosity, self-preference); measure
      its agreement with human labels before trusting it.

      - Rerun the suite on every prompt, model or retrieval change, compare variants on the same cases and track
      scores over time.

      - Offline evaluation complements, but does not replace, online signals such as user feedback, A/B tests and
      production monitoring.


      **Limitations**

      - Public benchmark scores do not tell you how a model performs on your task.

      - One run on a small set is noisy because outputs are stochastic; repeat runs and look at the spread before
      declaring a winner.'
  - type: item
    ref: evaluation-mcq
  - type: item
    ref: evaluation-tf
  - type: item
    ref: evaluation-code
items:
- id: evaluation-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of evaluating llm applications?
  explanation: Build an evaluation set from real or realistic inputs, including edge cases and past failures; start
    with tens of examples and grow it over time.
  options:
  - id: a
    text: Build an evaluation set from real or realistic inputs, including edge cases and past failures; start with
      tens of examples and grow it over time.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: Public benchmark scores do not tell you how a model performs on your task.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: evaluation-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Public benchmark scores do not tell you how a model performs on your task.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: evaluation-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding evaluating llm applications to an application. Describe the design, one failure mode, and
    how you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: evaluation-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for evaluating llm applications. The assertions include the normal path
    and a meaningful edge case.
  starterCode: "def exact_match_rate(expected, actual):\n    raise NotImplementedError('Complete this function')"
  solution: "def exact_match_rate(expected, actual):\n    if len(expected)!=len(actual) or not expected: raise ValueError(\"\
    equal non-empty lists required\")\n    return sum(a==b for a,b in zip(expected,actual))/len(expected)"
  tests:
  - name: Core behaviour
    code: assert exact_match_rate(["a","b"],["a","c"]) == 0.5
  - name: Edge case
    code: 'try: exact_match_rate([], [])

      except ValueError: pass

      else: raise AssertionError("empty evaluation set must fail")'
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - evaluation-mcq
  - evaluation-tf
  - evaluation-code
