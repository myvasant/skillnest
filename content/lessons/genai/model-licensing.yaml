id: genai.model-licensing
concept: genai.model-licensing
title: Model licences — open weights vs open source
subtitle: Licences decide what you may do with a model and its outputs; "open-weight" is not the same as open source,
  and terms vary widely
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Licences decide what you may do with a model and its outputs; "open-weight" is not the same as open source,
  and terms vary widely.
objectives:
- Explain the role of model licences — open weights vs open source in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: The Open Source AI Definition 1.0
  url: https://opensource.org/ai/open-source-ai-definition
  publisher: Open Source Initiative
  version: '1.0'
- title: Licenses (Hugging Face Hub)
  url: https://huggingface.co/docs/hub/repositories-licenses
  publisher: Hugging Face
- title: Model cards
  url: https://huggingface.co/docs/hub/model-cards
  publisher: Hugging Face
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Licences decide what you may do with a model and its outputs; "open-weight" is not the same as open source,
      and terms vary widely. Shipping a model whose licence forbids your use case is a legal risk that no amount
      of engineering fixes later.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Closed, API-only models are used under the provider''s terms of service; you never receive the weights.

      - Open-weight models publish weights under licences ranging from permissive (Apache 2.0, MIT) to custom licences
      with acceptable-use policies, user-count thresholds or attribution and naming requirements.

      - The Open Source Initiative''s Open Source AI Definition requires the freedoms to use, study, modify and
      share, including access to weights, code and sufficiently detailed information about the training data.

      - Licences may restrict using outputs to train other models, certain domains or certain users, and terms can
      change between model versions — read the licence for the exact version you deploy.

      - Check the licences of datasets used for fine-tuning and of the inference code as well.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Being downloadable from Hugging Face does not make a model open source or free for commercial use.

      - Custom community licences with usage restrictions are not OSI-approved open source licences, even when the
      weights are free to download.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def use_allowed(license_terms, commercial, modify, redistribute):\n    required = [\"commercial\", \"\
      modify\", \"redistribute\"]\n    requested = [commercial, modify, redistribute]\n    return all(not want or\
      \ license_terms.get(term, False) for term,want in zip(required,requested))\n\nprint(use_allowed({\"commercial\"\
      :True,\"modify\":False,\"redistribute\":False}, True, False, False))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: model-licensing-code
  - type: item
    ref: model-licensing-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Closed, API-only models are used under the provider''s terms of service; you never receive the weights.

      - Open-weight models publish weights under licences ranging from permissive (Apache 2.0, MIT) to custom licences
      with acceptable-use policies, user-count thresholds or attribution and naming requirements.

      - The Open Source Initiative''s Open Source AI Definition requires the freedoms to use, study, modify and
      share, including access to weights, code and sufficiently detailed information about the training data.

      - Licences may restrict using outputs to train other models, certain domains or certain users, and terms can
      change between model versions — read the licence for the exact version you deploy.

      - Check the licences of datasets used for fine-tuning and of the inference code as well.


      **Limitations**

      - Being downloadable from Hugging Face does not make a model open source or free for commercial use.

      - Custom community licences with usage restrictions are not OSI-approved open source licences, even when the
      weights are free to download.'
  - type: item
    ref: model-licensing-mcq
  - type: item
    ref: model-licensing-tf
  - type: item
    ref: model-licensing-code
items:
- id: model-licensing-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of model licences — open weights vs open source?
  explanation: Closed, API-only models are used under the provider's terms of service; you never receive the weights.
  options:
  - id: a
    text: Closed, API-only models are used under the provider's terms of service; you never receive the weights.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: Being downloadable from Hugging Face does not make a model open source or free for commercial use.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: model-licensing-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Being downloadable from Hugging Face does not make a model open source or free for commercial use.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: model-licensing-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding model licences — open weights vs open source to an application. Describe the design, one
    failure mode, and how you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: model-licensing-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for model licences — open weights vs open source. The assertions include
    the normal path and a meaningful edge case.
  starterCode: "def use_allowed(license_terms, commercial, modify, redistribute):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def use_allowed(license_terms, commercial, modify, redistribute):\n    required = [\"commercial\",\
    \ \"modify\", \"redistribute\"]\n    requested = [commercial, modify, redistribute]\n    return all(not want\
    \ or license_terms.get(term, False) for term,want in zip(required,requested))"
  tests:
  - name: Core behaviour
    code: assert use_allowed({"commercial":True,"modify":False,"redistribute":False}, True, False, False) is True
  - name: Edge case
    code: assert use_allowed({"commercial":True,"modify":False}, True, True, False) is False
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - model-licensing-mcq
  - model-licensing-tf
  - model-licensing-code
