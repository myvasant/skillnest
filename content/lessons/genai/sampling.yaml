  ```python
  def softmax(logits):                       # dict -> dict
      m = max(logits.values())               # subtract max: no overflow
      exps = {t: math.exp(v - m) for t, v in logits.items()}
      s = sum(exps.values())
      return {t: e / s for t, e in exps.items()}

  scaled = {t: v / T for t, v in logits.items()}      # temperature (T == 0 -> greedy)
