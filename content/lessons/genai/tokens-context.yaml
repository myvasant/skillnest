    url: https://huggingface.co/docs/transformers/tokenizer_summary
    publisher: Hugging Face
  - title: "LLM Course, chapter 6: Byte-Pair Encoding tokenization"
    url: https://huggingface.co/learn/llm-course/chapter6/5
    publisher: Hugging Face
  - title: Neural Machine Translation of Rare Words with Subword Units (BPE)
    url: https://arxiv.org/abs/1508.07909
    publisher: arXiv (Sennrich, Haddow and Birch)
  - title: tiktoken (README)
