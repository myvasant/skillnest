id: genai.tokens-context
concept: genai.tokens-context
title: Tokens and Context Windows
subtitle: The unit every limit, bill and delay is counted in
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  LLMs read and write tokens, not characters or words. You will build a toy byte-pair-encoding (BPE)
  tokenizer in Python, see why non-English text and code often need more tokens, and learn to treat the
  context window as a budget shared by input and output — and to trim it when a conversation grows.
objectives:
  - Explain why models use sub-word tokens instead of words or characters.
  - Implement a toy BPE trainer (merge the most frequent pair, deterministic ties) and use its merges to tokenize new words.
  - Compare token, character, word and byte counts, and explain why non-English text and code often cost more tokens.
  - Check whether a request fits a context window, reserving room for the output, and trim conversation history to a budget.
  - Estimate how cost and latency scale with input and output tokens.
sources:
