id: genai.prompt-engineering
concept: genai.prompt-engineering
title: Prompt engineering
subtitle: Clear instructions, roles, examples (few-shot), delimiters, explicit output formats and iterative testing
  make outputs more reliable
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Clear instructions, roles, examples (few-shot), delimiters, explicit output formats and iterative testing
  make outputs more reliable.
objectives:
- Explain the role of prompt engineering in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Prompt engineering overview
  url: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview
  publisher: Anthropic
- title: Prompt engineering guide
  url: https://developers.openai.com/api/docs/guides/prompt-engineering
  publisher: OpenAI
- title: Chain-of-Thought Prompting Elicits Reasoning in Large Language Models
  url: https://arxiv.org/abs/2201.11903
  publisher: arXiv (Wei et al.)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Clear instructions, roles, examples (few-shot), delimiters, explicit output formats and iterative testing
      make outputs more reliable. The prompt is the main interface to the model; clear, tested prompts are the cheapest
      way to improve quality before reaching for fine-tuning or bigger models.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Be explicit about the task, audience, constraints and output format; the model cannot infer intent
      you leave out.

      - Put stable instructions and role in the system prompt, and separate instructions from data with clear delimiters
      such as XML-style tags or fenced blocks.

      - Few-shot examples show the expected format and edge cases; make them varied and representative so the model
      does not copy one pattern.

      - For complex tasks, ask for step-by-step reasoning (or use a reasoning model) and split big tasks into smaller
      chained calls.

      - Treat prompts as code — version them, test them against an evaluation set and change one thing at a time;
      best practices differ between model families and versions.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Magic phrases, threats or bribes are not reliable techniques; clarity, structure and examples are.

      - A prompt that works in a few manual tries is not validated; test it on many representative cases.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def build_prompt(role, task, constraints, format_name):\n    return chr(10).join([f\"Role: {role}\",\
      \ f\"Task: {task}\", f\"Constraints: {constraints}\", f\"Output format: {format_name}\"])\n\nprint(build_prompt(\"\
      assistant\", \"summarise\", \"use only supplied text\", \"bullets\"))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: prompt-engineering-code
  - type: item
    ref: prompt-engineering-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Be explicit about the task, audience, constraints and output format; the model cannot infer intent you leave
      out.

      - Put stable instructions and role in the system prompt, and separate instructions from data with clear delimiters
      such as XML-style tags or fenced blocks.

      - Few-shot examples show the expected format and edge cases; make them varied and representative so the model
      does not copy one pattern.

      - For complex tasks, ask for step-by-step reasoning (or use a reasoning model) and split big tasks into smaller
      chained calls.

      - Treat prompts as code — version them, test them against an evaluation set and change one thing at a time;
      best practices differ between model families and versions.


      **Limitations**

      - Magic phrases, threats or bribes are not reliable techniques; clarity, structure and examples are.

      - A prompt that works in a few manual tries is not validated; test it on many representative cases.'
  - type: item
    ref: prompt-engineering-mcq
  - type: item
    ref: prompt-engineering-tf
  - type: item
    ref: prompt-engineering-code
items:
- id: prompt-engineering-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of prompt engineering?
  explanation: Be explicit about the task, audience, constraints and output format; the model cannot infer intent
    you leave out.
  options:
  - id: a
    text: Be explicit about the task, audience, constraints and output format; the model cannot infer intent you
      leave out.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: Magic phrases, threats or bribes are not reliable techniques; clarity, structure and examples are.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: prompt-engineering-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Magic phrases, threats or bribes are not reliable techniques; clarity, structure and examples are.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: prompt-engineering-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding prompt engineering to an application. Describe the design, one failure mode, and how you
    would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: prompt-engineering-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for prompt engineering. The assertions include the normal path and a
    meaningful edge case.
  starterCode: "def build_prompt(role, task, constraints, format_name):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def build_prompt(role, task, constraints, format_name):\n    return chr(10).join([f\"Role: {role}\"\
    , f\"Task: {task}\", f\"Constraints: {constraints}\", f\"Output format: {format_name}\"])"
  tests:
  - name: Core behaviour
    code: p = build_prompt("tutor", "explain", "beginner friendly", "steps")
  - name: Edge case
    code: 'assert "Task: explain" in p and "Output format: steps" in p

      assert "Constraints:" in p'
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - prompt-engineering-mcq
  - prompt-engineering-tf
  - prompt-engineering-code
