id: agents.evaluation
concept: agents.evaluation
title: Evaluating agents
subtitle: Score final task success, inspect trajectories (tool choice, arguments, steps), and track cost, latency
  and safety across a fixed task suite
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Score final task success, inspect trajectories (tool choice, arguments, steps), and track cost, latency
  and safety across a fixed task suite.
objectives:
- Explain the architecture and trade-offs behind evaluating agents.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Demystifying evals for AI agents
  url: https://www.anthropic.com/research/demystifying-evals-for-ai-agents
  publisher: Anthropic
- title: 'tau-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains'
  url: https://arxiv.org/abs/2406.12045
  publisher: arXiv
- title: 'SWE-bench: Can Language Models Resolve Real-World GitHub Issues?'
  url: https://arxiv.org/abs/2310.06770
  publisher: arXiv
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Score final task success, inspect trajectories (tool choice, arguments, steps), and track cost, latency
      and safety across a fixed task suite. Agents take different paths on every run, and a correct-looking final
      answer can hide wasteful or unsafe steps. You need task-level and trajectory-level evaluation, repeated over
      many runs, to know whether a change made the agent better.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Build a fixed suite of realistic tasks with automatic success checks where possible (tests pass, database
      ends in the expected state, correct answer), plus rubric or LLM-judge grading for open-ended outputs.

      - Inspect trajectories — the right tools chosen, valid arguments, number of steps, unnecessary or unsafe actions,
      recovery from errors.

      - Agents are non-deterministic, so run each task several times and report pass rates; consistency metrics
      such as pass^k (all k trials succeed) expose flakiness that a single run hides.

      - Track cost (tokens, tool calls), latency and safety violations next to success; a slightly better agent
      that costs five times more may not be an improvement.

      - Run evaluations in sandboxed environments so they are reproducible and cannot cause real side effects.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Judging only the final answer misses agents that succeed by luck or through unsafe actions.

      - Public benchmark scores (such as SWE-bench) do not predict performance on your tasks and tools.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def task_success_rate(results):\n    if not results: raise ValueError(\"evaluation set cannot be empty\"\
      )\n    return sum(bool(x) for x in results)/len(results)\n\nprint(task_success_rate([True,True,False,True]))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: evaluation-code
  - type: item
    ref: evaluation-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Build a fixed suite of realistic tasks with automatic success checks where possible (tests pass, database
      ends in the expected state, correct answer), plus rubric or LLM-judge grading for open-ended outputs.

      - Inspect trajectories — the right tools chosen, valid arguments, number of steps, unnecessary or unsafe actions,
      recovery from errors.

      - Agents are non-deterministic, so run each task several times and report pass rates; consistency metrics
      such as pass^k (all k trials succeed) expose flakiness that a single run hides.

      - Track cost (tokens, tool calls), latency and safety violations next to success; a slightly better agent
      that costs five times more may not be an improvement.

      - Run evaluations in sandboxed environments so they are reproducible and cannot cause real side effects.


      **Limitations**

      - Judging only the final answer misses agents that succeed by luck or through unsafe actions.

      - Public benchmark scores (such as SWE-bench) do not predict performance on your tasks and tools.'
  - type: item
    ref: evaluation-mcq
  - type: item
    ref: evaluation-tf
  - type: item
    ref: evaluation-code
items:
- id: evaluation-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of evaluating agents?
  explanation: Build a fixed suite of realistic tasks with automatic success checks where possible (tests pass,
    database ends in the expected state, correct answer), plus rubric or LLM-judge grading for open-ended outputs.
  options:
  - id: a
    text: Build a fixed suite of realistic tasks with automatic success checks where possible (tests pass, database
      ends in the expected state, correct answer), plus rubric or LLM-judge grading for open-ended outputs.
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: Judging only the final answer misses agents that succeed by luck or through unsafe actions.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: evaluation-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Judging only the final answer misses agents that succeed by luck or through unsafe actions.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: evaluation-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing evaluating agents for a production application. Explain the main design decision, one
    alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: evaluation-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for evaluating agents. The tests cover the main rule and a boundary
    or failure case.
  starterCode: "def task_success_rate(results):\n    raise NotImplementedError('Complete this function')"
  solution: "def task_success_rate(results):\n    if not results: raise ValueError(\"evaluation set cannot be empty\"\
    )\n    return sum(bool(x) for x in results)/len(results)"
  tests:
  - name: Core behaviour
    code: assert task_success_rate([True,True,False,True]) == 0.75
  - name: Failure or edge case
    code: 'try: task_success_rate([])

      except ValueError: pass

      else: raise AssertionError("empty evaluation must fail")'
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - evaluation-mcq
  - evaluation-tf
  - evaluation-code
