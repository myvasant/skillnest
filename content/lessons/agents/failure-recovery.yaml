id: agents.failure-recovery
concept: agents.failure-recovery
title: Retries, timeouts and failure recovery
subtitle: Detect loops, cap steps and spend, retry transient failures with backoff, checkpoint progress and fall
  back gracefully
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Detect loops, cap steps and spend, retry transient failures with backoff, checkpoint progress and fall
  back gracefully.
objectives:
- Explain the architecture and trade-offs behind retries, timeouts and failure recovery.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Timeouts, retries, and backoff with jitter
  url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
  publisher: Amazon Web Services (Builders' Library)
- title: Persistence
  url: https://docs.langchain.com/oss/python/langgraph/persistence
  publisher: LangChain
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Detect loops, cap steps and spend, retry transient failures with backoff, checkpoint progress and fall
      back gracefully. Agents call flaky networks and APIs and can get stuck repeating themselves. Without explicit
      recovery logic, a single timeout or loop can burn money or leave work half done.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Classify errors: transient (timeouts, 429, 5xx) get retries with exponential backoff and jitter; permanent
      ones (validation errors, most 4xx) are reported, not retried; invalid tool arguments go back to the model
      once or twice before stopping.

      - Put timeouts on every model and tool call, and budgets on every run (steps, tokens, money, wall-clock time).

      - Detect loops — the same tool with the same arguments, or no progress over N steps — and respond by stopping,
      replanning or escalating to a person.

      - Checkpoint after each step so a crashed run resumes instead of restarting; this requires idempotent side
      effects (idempotency keys).

      - Plan graceful fallbacks such as a simpler workflow, a different model, a partial answer with a clear explanation,
      or hand-off to a person.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Retrying everything is harmful; retrying non-idempotent writes can duplicate payments or emails.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def retry_schedule(attempts, base_delay, max_delay):\n    if attempts < 0 or base_delay < 0 or max_delay\
      \ < 0: raise ValueError(\"values must be non-negative\")\n    return [min(base_delay * (2**i), max_delay)\
      \ for i in range(attempts)]\n\nprint(retry_schedule(5, 1, 4))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: failure-recovery-code
  - type: item
    ref: failure-recovery-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Classify errors: transient (timeouts, 429, 5xx) get retries with exponential backoff and jitter; permanent
      ones (validation errors, most 4xx) are reported, not retried; invalid tool arguments go back to the model
      once or twice before stopping.

      - Put timeouts on every model and tool call, and budgets on every run (steps, tokens, money, wall-clock time).

      - Detect loops — the same tool with the same arguments, or no progress over N steps — and respond by stopping,
      replanning or escalating to a person.

      - Checkpoint after each step so a crashed run resumes instead of restarting; this requires idempotent side
      effects (idempotency keys).

      - Plan graceful fallbacks such as a simpler workflow, a different model, a partial answer with a clear explanation,
      or hand-off to a person.


      **Limitations**

      - Retrying everything is harmful; retrying non-idempotent writes can duplicate payments or emails.'
  - type: item
    ref: failure-recovery-mcq
  - type: item
    ref: failure-recovery-tf
  - type: item
    ref: failure-recovery-code
items:
- id: failure-recovery-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of retries, timeouts and failure recovery?
  explanation: 'Classify errors: transient (timeouts, 429, 5xx) get retries with exponential backoff and jitter;
    permanent ones (validation errors, most 4xx) are reported, not retried; invalid tool arguments go back to the
    model once or twice before stopping.'
  options:
  - id: a
    text: 'Classify errors: transient (timeouts, 429, 5xx) get retries with exponential backoff and jitter; permanent
      ones (validation errors, most 4xx) are reported, not retried; invalid tool arguments go back to the model
      once or twice before stopping.'
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: Retrying everything is harmful; retrying non-idempotent writes can duplicate payments or emails.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: failure-recovery-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Retrying everything is harmful; retrying non-idempotent writes can duplicate payments or emails.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: failure-recovery-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing retries, timeouts and failure recovery for a production application. Explain the main
    design decision, one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: failure-recovery-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for retries, timeouts and failure recovery. The tests cover the main
    rule and a boundary or failure case.
  starterCode: "def retry_schedule(attempts, base_delay, max_delay):\n    raise NotImplementedError('Complete this\
    \ function')"
  solution: "def retry_schedule(attempts, base_delay, max_delay):\n    if attempts < 0 or base_delay < 0 or max_delay\
    \ < 0: raise ValueError(\"values must be non-negative\")\n    return [min(base_delay * (2**i), max_delay) for\
    \ i in range(attempts)]"
  tests:
  - name: Core behaviour
    code: assert retry_schedule(5,1,4) == [1,2,4,4,4]
  - name: Failure or edge case
    code: assert retry_schedule(0,1,4) == []
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
