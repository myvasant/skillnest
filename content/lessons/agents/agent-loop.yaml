cheatsheet: |
  ```python
  messages = [{"role": "user", "content": goal}]
  for step in range(max_steps):                         # hard budget in code
      response = model.respond(messages)                # observe + decide
      if response["type"] == "final":
          return response["text"], messages
      messages.append({"role": "assistant", "tool_call": response})
      error = validate_call(response, tools)            # unknown tool, missing/extra args, types
      if error:
          content, is_error = f"error: {error}", True
      else:
          try:
              content, is_error = json.dumps(tools[name]["function"](**args)), False
          except ValueError as exc:                     # expected tool failure -> feed back
              content, is_error = f"error: {exc}", True
      messages.append({"role": "tool", "name": name, "content": content, "is_error": is_error})
  return None, messages                                 # budget exhausted -> fallback
  ```
  - Stops: final answer · max steps · token/cost budget · timeout · repeated identical call.
  - Expected errors → back to the model; bugs → fail loudly. Log every step (the trajectory).
  - Test with scripted fakes; evaluate real agents over many runs. Known steps → write a workflow.
