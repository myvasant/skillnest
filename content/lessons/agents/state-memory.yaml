id: agents.state-memory
concept: agents.state-memory
title: State and memory
subtitle: Short-term conversation state, structured task state and long-term memory (often retrieval-based) each
  need explicit management and limits
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Short-term conversation state, structured task state and long-term memory (often retrieval-based) each
  need explicit management and limits.
objectives:
- Explain the architecture and trade-offs behind state and memory.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Memory overview
  url: https://docs.langchain.com/oss/python/concepts/memory
  publisher: LangChain
- title: 'MemGPT: Towards LLMs as Operating Systems'
  url: https://arxiv.org/abs/2310.08560
  publisher: arXiv
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Short-term conversation state, structured task state and long-term memory (often retrieval-based) each
      need explicit management and limits. Models are stateless between calls. Anything an agent must remember —
      the conversation, task progress, user preferences — has to be stored, selected and re-inserted by your system
      within a limited context window.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Short-term memory is the current thread''s messages and working state; trim or summarise it as it nears
      the context limit.

      - Keep structured task state (plan, completed steps, intermediate results) in typed fields rather than buried
      in chat text, so code can check it.

      - Long-term memory persists across sessions — facts, preferences, past episodes — usually in a database or
      vector store, retrieved by key or relevance.

      - Decide explicitly what is written to memory and when, how it is retrieved, when it expires, and how users
      can view or delete it.

      - Memory is an attack surface; poisoned or wrong memories persist and steer later runs.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A bigger context window is not memory; it vanishes when the session ends, and filling it degrades focus
      and raises cost.

      - Storing everything is not good memory; irrelevant or stale memories distract the model.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def update_state(state, event):\n    history=list(state.get(\"history\", []));history.append(event)\n\
      \    return {**state,\"history\":history,\"last_event\":event}\n\nprint(update_state({\"history\":[\"start\"\
      ]}, \"tool_result\"))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: state-memory-code
  - type: item
    ref: state-memory-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Short-term memory is the current thread''s messages and working state; trim or summarise it as it nears
      the context limit.

      - Keep structured task state (plan, completed steps, intermediate results) in typed fields rather than buried
      in chat text, so code can check it.

      - Long-term memory persists across sessions — facts, preferences, past episodes — usually in a database or
      vector store, retrieved by key or relevance.

      - Decide explicitly what is written to memory and when, how it is retrieved, when it expires, and how users
      can view or delete it.

      - Memory is an attack surface; poisoned or wrong memories persist and steer later runs.


      **Limitations**

      - A bigger context window is not memory; it vanishes when the session ends, and filling it degrades focus
      and raises cost.

      - Storing everything is not good memory; irrelevant or stale memories distract the model.'
  - type: item
    ref: state-memory-mcq
  - type: item
    ref: state-memory-tf
  - type: item
    ref: state-memory-code
items:
- id: state-memory-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of state and memory?
  explanation: Short-term memory is the current thread's messages and working state; trim or summarise it as it
    nears the context limit.
  options:
  - id: a
    text: Short-term memory is the current thread's messages and working state; trim or summarise it as it nears
      the context limit.
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: A bigger context window is not memory; it vanishes when the session ends, and filling it degrades focus
      and raises cost.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: state-memory-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A bigger context window is not memory; it vanishes when the session ends, and filling it degrades focus
    and raises cost.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: state-memory-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing state and memory for a production application. Explain the main design decision, one
    alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: state-memory-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for state and memory. The tests cover the main rule and a boundary or
    failure case.
  starterCode: "def update_state(state, event):\n    raise NotImplementedError('Complete this function')"
  solution: "def update_state(state, event):\n    history=list(state.get(\"history\", []));history.append(event)\n\
    \    return {**state,\"history\":history,\"last_event\":event}"
  tests:
  - name: Core behaviour
    code: new=update_state({"history":["start"]},"result")
  - name: Failure or edge case
    code: 'assert new["history"] == ["start","result"]

      assert new["last_event"] == "result"'
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - state-memory-mcq
  - state-memory-tf
  - state-memory-code
