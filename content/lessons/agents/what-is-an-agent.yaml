id: agents.what-is-an-agent
concept: agents.what-is-an-agent
title: What an AI agent is
subtitle: An agent is an LLM that decides, in a loop, which actions (tool calls) to take toward a goal; autonomy
  is a spectrum, not a switch
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: An agent is an LLM that decides, in a loop, which actions (tool calls) to take toward a goal; autonomy
  is a spectrum, not a switch.
objectives:
- Explain the architecture and trade-offs behind what an ai agent is.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Building effective agents
  url: https://www.anthropic.com/research/building-effective-agents
  publisher: Anthropic
- title: Agents
  url: https://docs.langchain.com/oss/python/langchain/agents
  publisher: LangChain
  version: 1.x
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: An agent is an LLM that decides, in a loop, which actions (tool calls) to take toward a goal; autonomy
      is a spectrum, not a switch. "Agent" is used for everything from a chatbot to an autonomous coder. A precise
      definition helps you decide how much autonomy a task really needs and which risks you take on with it.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- An agent is an LLM using tools in a loop — it chooses an action (a tool call or a final answer), sees
      the result and decides what to do next until the task is done.

      - The building block is the augmented LLM, a model with access to tools, retrieval and memory.

      - Autonomy is a spectrum: single call, fixed workflow, router, tool-calling loop, long-running autonomous
      agent; each step adds flexibility, cost, latency and risk.

      - Because the model chooses the control flow at run time, the same input can take different paths — the source
      of both power and unpredictability.

      - What an agent can do, and the damage it can cause, is defined mostly by its tools and permissions, not by
      the model alone.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A chatbot with a system prompt is not an agent unless it can take actions and choose its next steps.

      - Agents are not inherently better than workflows; for many tasks they are slower, costlier and less reliable.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def agent_step(state, model_decision):\n    if model_decision[\"action\"] == \"finish\": return {**state,\"\
      status\":\"complete\"}\n    return {**state,\"status\":\"needs_tool\",\"tool\":model_decision[\"action\"]}\n\
      \nprint(agent_step({\"status\":\"running\"},{\"action\":\"search\"}))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: what-is-an-agent-code
  - type: item
    ref: what-is-an-agent-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - An agent is an LLM using tools in a loop — it chooses an action (a tool call or a final answer), sees the
      result and decides what to do next until the task is done.

      - The building block is the augmented LLM, a model with access to tools, retrieval and memory.

      - Autonomy is a spectrum: single call, fixed workflow, router, tool-calling loop, long-running autonomous
      agent; each step adds flexibility, cost, latency and risk.

      - Because the model chooses the control flow at run time, the same input can take different paths — the source
      of both power and unpredictability.

      - What an agent can do, and the damage it can cause, is defined mostly by its tools and permissions, not by
      the model alone.


      **Limitations**

      - A chatbot with a system prompt is not an agent unless it can take actions and choose its next steps.

      - Agents are not inherently better than workflows; for many tasks they are slower, costlier and less reliable.'
  - type: item
    ref: what-is-an-agent-mcq
  - type: item
    ref: what-is-an-agent-tf
  - type: item
    ref: what-is-an-agent-code
items:
- id: what-is-an-agent-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of what an ai agent is?
  explanation: An agent is an LLM using tools in a loop — it chooses an action (a tool call or a final answer),
    sees the result and decides what to do next until the task is done.
  options:
  - id: a
    text: An agent is an LLM using tools in a loop — it chooses an action (a tool call or a final answer), sees
      the result and decides what to do next until the task is done.
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: A chatbot with a system prompt is not an agent unless it can take actions and choose its next steps.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: what-is-an-agent-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A chatbot with a system prompt is not an agent unless it can take actions and choose its next steps.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: what-is-an-agent-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing what an ai agent is for a production application. Explain the main design decision,
    one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: what-is-an-agent-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for what an ai agent is. The tests cover the main rule and a boundary
    or failure case.
  starterCode: "def agent_step(state, model_decision):\n    raise NotImplementedError('Complete this function')"
  solution: "def agent_step(state, model_decision):\n    if model_decision[\"action\"] == \"finish\": return {**state,\"\
    status\":\"complete\"}\n    return {**state,\"status\":\"needs_tool\",\"tool\":model_decision[\"action\"]}"
  tests:
  - name: Core behaviour
    code: assert agent_step({}, {"action":"finish"})["status"] == "complete"
  - name: Failure or edge case
    code: assert agent_step({}, {"action":"lookup"})["tool"] == "lookup"
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - what-is-an-agent-mcq
  - what-is-an-agent-tf
  - what-is-an-agent-code
