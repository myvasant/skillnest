id: agents.permissions-sandboxing
concept: agents.permissions-sandboxing
title: Tool permissions and sandboxing
subtitle: Grant the least privilege needed, isolate code execution, scope credentials per task and treat every tool
  call as untrusted input
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Grant the least privilege needed, isolate code execution, scope credentials per task and treat every tool
  call as untrusted input.
objectives:
- Explain the architecture and trade-offs behind tool permissions and sandboxing.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: LLM06:2025 Excessive Agency
  url: https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
  publisher: OWASP GenAI Security Project
- title: OWASP Top 10 for Agentic Applications for 2026
  url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  publisher: OWASP GenAI Security Project
- title: MCP security best practices
  url: https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices
  publisher: Model Context Protocol
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Grant the least privilege needed, isolate code execution, scope credentials per task and treat every tool
      call as untrusted input. An agent can be tricked or simply wrong, so the damage it can do is bounded only
      by the permissions you give it. Least privilege and isolation turn worst cases from disasters into contained
      incidents.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Give each agent only the tools, scopes and data its task needs, prefer read-only access, and use short-lived,
      task-scoped credentials instead of a user''s or admin''s full token.

      - Run model-generated code in an isolated sandbox (container or microVM) with no secrets, restricted network
      egress, CPU, memory and time limits, and a disposable filesystem.

      - Enforce permissions in the tool or server layer, not the prompt; the model''s tool call is untrusted input
      to validate like any API request.

      - Treat tool outputs (web pages, emails, files) as untrusted too, because they can carry instructions that
      hijack the agent.

      - Keep audit logs of every tool call and the identity it acted as.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- "The system prompt tells it not to" is not a control; instructions can be overridden by injection or
      simply misread.

      - A container is not automatically a sandbox; mounted secrets, host sockets and open network access break
      isolation.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def permitted_tool(tool, allowlist):\n    return tool in allowlist\n\nprint(permitted_tool(\"read_file\"\
      , {\"read_file\",\"search_docs\"}))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: permissions-sandboxing-code
  - type: item
    ref: permissions-sandboxing-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Give each agent only the tools, scopes and data its task needs, prefer read-only access, and use short-lived,
      task-scoped credentials instead of a user''s or admin''s full token.

      - Run model-generated code in an isolated sandbox (container or microVM) with no secrets, restricted network
      egress, CPU, memory and time limits, and a disposable filesystem.

      - Enforce permissions in the tool or server layer, not the prompt; the model''s tool call is untrusted input
      to validate like any API request.

      - Treat tool outputs (web pages, emails, files) as untrusted too, because they can carry instructions that
      hijack the agent.

      - Keep audit logs of every tool call and the identity it acted as.


      **Limitations**

      - "The system prompt tells it not to" is not a control; instructions can be overridden by injection or simply
      misread.

      - A container is not automatically a sandbox; mounted secrets, host sockets and open network access break
      isolation.'
  - type: item
    ref: permissions-sandboxing-mcq
  - type: item
    ref: permissions-sandboxing-tf
  - type: item
    ref: permissions-sandboxing-code
items:
- id: permissions-sandboxing-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of tool permissions and sandboxing?
  explanation: Give each agent only the tools, scopes and data its task needs, prefer read-only access, and use
    short-lived, task-scoped credentials instead of a user's or admin's full token.
  options:
  - id: a
    text: Give each agent only the tools, scopes and data its task needs, prefer read-only access, and use short-lived,
      task-scoped credentials instead of a user's or admin's full token.
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: '"The system prompt tells it not to" is not a control; instructions can be overridden by injection or
      simply misread.'
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: permissions-sandboxing-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '"The system prompt tells it not to" is not a control; instructions can be overridden by injection or
    simply misread.'
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: permissions-sandboxing-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing tool permissions and sandboxing for a production application. Explain the main design
    decision, one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: permissions-sandboxing-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for tool permissions and sandboxing. The tests cover the main rule and
    a boundary or failure case.
  starterCode: "def permitted_tool(tool, allowlist):\n    raise NotImplementedError('Complete this function')"
  solution: "def permitted_tool(tool, allowlist):\n    return tool in allowlist"
  tests:
  - name: Core behaviour
    code: assert permitted_tool("read_file", {"read_file"}) is True
  - name: Failure or edge case
    code: assert permitted_tool("run_shell", {"read_file"}) is False
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - permissions-sandboxing-mcq
  - permissions-sandboxing-tf
  - permissions-sandboxing-code
