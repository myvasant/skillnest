  - id: m-predict-responses
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print?
    code: |
      def handle(msg):
          if "id" not in msg:
              return None
          meta = msg.get("params", {}).get("_meta", {})
          version = meta.get("io.modelcontextprotocol/protocolVersion")
          if version is None:
              return {"id": msg["id"], "error": -32602}
          if version != "2026-07-28":
              return {"id": msg["id"], "error": -32022}
          return {"id": msg["id"], "result": "complete"}

      V = {"io.modelcontextprotocol/protocolVersion": "2026-07-28",
           "io.modelcontextprotocol/clientCapabilities": {}}
      messages = [
          {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {"_meta": V}},
          {"jsonrpc": "2.0", "method": "notifications/cancelled", "params": {"requestId": 1}},
          {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          {"jsonrpc": "2.0", "id": 3, "method": "tools/list",
           "params": {"_meta": {**V, "io.modelcontextprotocol/protocolVersion": "2025-11-25"}}},
      ]
      replies = [r for r in map(handle, messages) if r is not None]
      print(len(replies), [r.get("error", r.get("result")) for r in replies])
    answer: "3 ['complete', -32602, -32022]"
    explanation: >-
      The notification gets no reply, leaving three. Request 1 is valid. Request 2 has no params, so no version:
      -32602. Request 3 carries a version the handler does not support: -32022.
    wrongAnswers:
      - answer: "4 ['complete', None, -32602, -32022]"
        feedback: Notifications (no id) return None and are filtered out - they never get a response.
      - answer: "3 ['complete', -32022, -32022]"
        feedback: Request 2 has no `_meta` at all, so the version is None and the missing-field check (-32602) fires first.

  - id: m-mcq-version-retry
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: >-
      A client that supports revisions 2026-07-28 and 2025-11-25 sends `server/discover` over stdio with
      protocol version 2027-03-01 (a newer revision it was testing). The server replies with error -32022 and
      `"data": {"supported": ["2026-07-28"], "requested": "2027-03-01"}`. What should the client do?
    explanation: >-
      A recognised modern error such as -32022 proves the server is modern, so the client must not fall back to
      the legacy handshake. It picks a version both sides support from data.supported and retries.
    options:
      - id: a
        text: Fall back to the legacy `initialize` handshake
        feedback: The fallback is only for legacy servers. A recognised modern error identifies a modern server.
      - id: b
        text: Retry with protocol version 2026-07-28, which both sides support
        correct: true
        feedback: Right - choose a mutually supported version from data.supported and retry.
      - id: c
        text: Keep sending 2027-03-01 until the server accepts it
        feedback: The server has said it does not implement that version; retrying unchanged cannot succeed.
      - id: d
        text: Give up and tell the user MCP is unavailable
        feedback: Only if no mutually supported version exists. Here 2026-07-28 works for both.

  - id: m-tf-annotations
    type: true-false
    skill: explanation
    prompt: "True or false: if a tool from a server you just installed from an unknown publisher has annotations claiming it is read-only, the host can safely run it without asking the user."
    answer: false
    explanation: >-
      The specification says clients must consider tool annotations untrusted unless they come from trusted
      servers, and that hosts must obtain consent before invoking tools. A malicious server can label a
      destructive tool "read-only".

  - id: m-merge-tools
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A host connects to several MCP servers and must show the model one combined tool list. Write
      `merge_tools(servers)`, where `servers` maps a **host-chosen server id** to that server's `tools/list`
      result (a list of tool definitions). Return a dict that maps `"<server id>__<tool name>"` to the pair
      `(server id, tool name)`, so that tools with the same name on different servers do not collide.
    starterCode: |
      def merge_tools(servers):
          routes = {}
          for server, tools in servers.items():
              for tool in tools:
                  routes[tool["name"]] = (server, tool["name"])
          return routes
    solution: |
      def merge_tools(servers):
          routes = {}
          for server, tools in servers.items():
              for tool in tools:
                  routes[f"{server}__{tool['name']}"] = (server, tool["name"])
          return routes
    tests:
      - name: Same tool name on two servers
        code: |
          got = merge_tools({"notes": [{"name": "search"}], "web": [{"name": "search"}]})
          assert got == {"notes__search": ("notes", "search"), "web__search": ("web", "search")}, f"Both search tools must survive under prefixed names, got {got!r}."
      - name: Several tools and servers
        code: |
          servers = {
              "git": [{"name": "log", "description": "..."}, {"name": "diff"}],
              "tracker": [{"name": "create_issue"}],
          }
          got = merge_tools(servers)
          assert got == {"git__log": ("git", "log"), "git__diff": ("git", "diff"), "tracker__create_issue": ("tracker", "create_issue")}, f"Unexpected routes: {got!r}"
      - name: Empty input
        code: |
          assert merge_tools({}) == {}, "No servers means no tools."
          assert merge_tools({"empty": []}) == {}, "A server with no tools adds nothing."
    hints:
      - The starter uses only the tool name as the key - what happens when two servers both have `search`?
      - "Build the key with an f-string: `f\"{server}__{tool['name']}\"`."
    explanation: >-
      Tool names are only unique within one server, and the self-reported serverInfo name is not guaranteed
      unique either, so the host prefixes each tool with its own server id. The mapping then routes a model's
      call for `web__search` back to the right client.

  - id: m-debug-stdio-logging
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      This stdio server loop works in testing, but real MCP clients fail to parse its output. Find and fix
      **both** framing bugs: stdout (`out`) may contain only JSON-RPC messages, exactly one per line. Keep the
      debug log, but write it to `sys.stderr`.
    starterCode: |
      import json, sys

      def handle(message):
          if "id" not in message:
              return None
          return {"jsonrpc": "2.0", "id": message["id"], "result": {"resultType": "complete"}}

      def serve(lines, out):
          """Read one JSON-RPC message per line; write one response per line to out."""
          for line in lines:
              message = json.loads(line)
              print(f"debug: received {message.get('method')}", file=out)
              response = handle(message)
              if response is not None:
                  print(json.dumps(response, indent=2), file=out)
    solution: |
      import json, sys

      def handle(message):
          if "id" not in message:
              return None
          return {"jsonrpc": "2.0", "id": message["id"], "result": {"resultType": "complete"}}

      def serve(lines, out):
          """Read one JSON-RPC message per line; write one response per line to out."""
          for line in lines:
              message = json.loads(line)
              print(f"debug: received {message.get('method')}", file=sys.stderr)
              response = handle(message)
              if response is not None:
                  print(json.dumps(response), file=out)
    tests:
      - name: Only one JSON message per line on stdout
        code: |
          import io, json, contextlib
          lines = [
              json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}),
              json.dumps({"jsonrpc": "2.0", "method": "notifications/cancelled", "params": {"requestId": 1}}),
              json.dumps({"jsonrpc": "2.0", "id": 2, "method": "server/discover", "params": {}}),
          ]
          out, err = io.StringIO(), io.StringIO()
          with contextlib.redirect_stderr(err):
              serve(lines, out)
          written = out.getvalue().splitlines()
          for text in written:
              try:
                  json.loads(text)
              except json.JSONDecodeError:
                  raise AssertionError(f"This line on stdout is not a complete JSON-RPC message: {text!r}. Logs belong on stderr, and each message must be on one line.")
          assert [json.loads(t)["id"] for t in written] == [1, 2], f"Expected exactly two response lines (ids 1 and 2), got {written!r}."
      - name: Logs still go to stderr
        code: |
          import io, json, contextlib
          out, err = io.StringIO(), io.StringIO()
          with contextlib.redirect_stderr(err):
              serve([json.dumps({"jsonrpc": "2.0", "id": 5, "method": "tools/list", "params": {}})], out)
          assert "tools/list" in err.getvalue(), "Keep the debug log, but print it to sys.stderr."
    hints:
      - "What does a client trying `json.loads` on every stdout line make of the line 'debug: received tools/list'?"
      - "`print(..., file=sys.stderr)` sends a line to standard error instead."
      - Look at how the response is serialised. What does `indent=2` add?
    feedback:
      - when: { codeContains: "indent=" }
        message: Pretty-printed JSON spans several lines, but stdio framing is one message per line. Remove indent.
    explanation: >-
      On stdio, stdout is the protocol channel: every line must be a complete JSON-RPC message. Debug output
      belongs on stderr (which clients may show or ignore), and json.dumps without indent keeps each message on
      a single line because newlines inside strings are escaped.

