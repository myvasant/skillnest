cheatsheet: |
  ```python
  # Request (revision 2026-07-28): every request carries _meta
  {"jsonrpc": "2.0", "id": 1, "method": "tools/call",
   "params": {"name": "search_notes", "arguments": {"query": "refund"},
              "_meta": {"io.modelcontextprotocol/protocolVersion": "2026-07-28",   # required
                        "io.modelcontextprotocol/clientCapabilities": {},          # required
                        "io.modelcontextprotocol/clientInfo": {"name": "app", "version": "1.0"}}}}
  # Result: same id, resultType required
  {"jsonrpc": "2.0", "id": 1, "result": {"resultType": "complete",
   "content": [{"type": "text", "text": "..."}], "isError": False}}
  # Error: same id, integer code
  {"jsonrpc": "2.0", "id": 1, "error": {"code": -32022, "message": "Unsupported protocol version",
   "data": {"supported": ["2026-07-28"], "requested": "1900-01-01"}}}
  # Notification: no id, no reply
  {"jsonrpc": "2.0", "method": "notifications/cancelled", "params": {"requestId": 1}}
  ```
  - Host → one client per server → server (tools: model · resources: app · prompts: user)
  - Methods: server/discover · tools/list · tools/call · resources/list · resources/read · prompts/list · prompts/get
  - Errors: -32700 parse · -32600 invalid request · -32601 no method · -32602 invalid params / unknown tool / missing _meta · -32022 version
  - stdio: subprocess, one JSON message per line, logs to stderr · Streamable HTTP: POST per message, JSON or SSE, Origin + auth
  - Legacy (≤ 2025-11-25): initialize → result → notifications/initialized, then stateful session
  - Security: consent before tool calls · least privilege · descriptions, annotations and results are untrusted
