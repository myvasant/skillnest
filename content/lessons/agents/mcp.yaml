id: agents.mcp
concept: agents.mcp
title: The Model Context Protocol (MCP)
subtitle: One protocol between AI applications and the tools and data they use
estimatedMinutes: 65
reviewedOn: 2026-10-23
summary: >-
  MCP is an open protocol that lets any AI application (a host) connect, through clients, to servers that
  offer tools, resources and prompts. Learn the roles, the three server primitives, the JSON-RPC 2.0
  messages underneath, the two standard transports, and the security rules - then make the message shapes
  concrete by building and validating requests and a tiny in-process server that follows the current,
  stateless specification revision (2026-07-28).
objectives:
  - Explain the integration problem MCP solves and the roles of host, client and server.
  - Distinguish tools, resources and prompts and who controls each.
  - Build and classify JSON-RPC 2.0 requests, responses, errors and notifications, including MCP's per-request `_meta` fields.
  - Implement a minimal stateless MCP-style dispatcher with server/discover, tools/list, tools/call, version checks and correct error handling.
  - Choose between the stdio and Streamable HTTP transports and apply MCP's security principles to a third-party server.
