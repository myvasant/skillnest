id: agents.tool-design
concept: agents.tool-design
title: Designing tools for agents
subtitle: Small, well-named tools with precise descriptions, typed inputs, helpful errors and idempotent effects
  make agents far more reliable
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Small, well-named tools with precise descriptions, typed inputs, helpful errors and idempotent effects
  make agents far more reliable.
objectives:
- Explain the architecture and trade-offs behind designing tools for agents.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Writing effective tools for agents — with agents
  url: https://www.anthropic.com/research/writing-tools-for-agents
  publisher: Anthropic
- title: 'MCP specification: Tools'
  url: https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  publisher: Model Context Protocol
  version: '2026-07-28'
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Small, well-named tools with precise descriptions, typed inputs, helpful errors and idempotent effects
      make agents far more reliable. The model knows your tools only through their names, descriptions and schemas,
      and tool quality affects agent success as much as the prompt does. Badly designed tools cause wrong calls,
      wasted tokens and dangerous side effects.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Write descriptions as for a new colleague: what the tool does, when to use it (and when not), argument
      formats, units and an example; use unambiguous parameter names such as `user_id`.

      - Prefer a few purpose-built tools that match user tasks (e.g. `search_customers`) over thin wrappers around
      every API endpoint, and namespace related tools (e.g. `crm_search`, `crm_update`).

      - Use typed, constrained inputs (JSON Schema enums, required fields, formats), validate them server-side,
      and make mistakes hard to make ("poka-yoke"), e.g. require absolute file paths.

      - Return concise, meaningful output (names, not only opaque IDs), paginate or truncate large results, and
      write error messages that tell the model how to fix the call.

      - Make side-effecting tools idempotent (idempotency keys, upserts) and separate read tools from write tools
      so permissions and approvals can differ.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- More tools do not make an agent more capable; large, overlapping toolsets confuse tool selection and
      use up context.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def validate_tool_arguments(arguments, required, allowed):\n    missing=set(required)-set(arguments);extra=set(arguments)-set(allowed)\n\
      \    if missing or extra: raise ValueError({\"missing\":sorted(missing),\"extra\":sorted(extra)})\n    return\
      \ True\n\nprint(validate_tool_arguments({\"query\":\"python\"}, [\"query\"], [\"query\"]))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: tool-design-code
  - type: item
    ref: tool-design-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Write descriptions as for a new colleague: what the tool does, when to use it (and when not), argument formats,
      units and an example; use unambiguous parameter names such as `user_id`.

      - Prefer a few purpose-built tools that match user tasks (e.g. `search_customers`) over thin wrappers around
      every API endpoint, and namespace related tools (e.g. `crm_search`, `crm_update`).

      - Use typed, constrained inputs (JSON Schema enums, required fields, formats), validate them server-side,
      and make mistakes hard to make ("poka-yoke"), e.g. require absolute file paths.

      - Return concise, meaningful output (names, not only opaque IDs), paginate or truncate large results, and
      write error messages that tell the model how to fix the call.

      - Make side-effecting tools idempotent (idempotency keys, upserts) and separate read tools from write tools
      so permissions and approvals can differ.


      **Limitations**

      - More tools do not make an agent more capable; large, overlapping toolsets confuse tool selection and use
      up context.'
  - type: item
    ref: tool-design-mcq
  - type: item
    ref: tool-design-tf
  - type: item
    ref: tool-design-code
items:
- id: tool-design-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of designing tools for agents?
  explanation: 'Write descriptions as for a new colleague: what the tool does, when to use it (and when not), argument
    formats, units and an example; use unambiguous parameter names such as `user_id`.'
  options:
  - id: a
    text: 'Write descriptions as for a new colleague: what the tool does, when to use it (and when not), argument
      formats, units and an example; use unambiguous parameter names such as `user_id`.'
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: More tools do not make an agent more capable; large, overlapping toolsets confuse tool selection and use
      up context.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: tool-design-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: More tools do not make an agent more capable; large, overlapping toolsets confuse tool selection and use
    up context.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: tool-design-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing designing tools for agents for a production application. Explain the main design decision,
    one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: tool-design-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for designing tools for agents. The tests cover the main rule and a
    boundary or failure case.
  starterCode: "def validate_tool_arguments(arguments, required, allowed):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def validate_tool_arguments(arguments, required, allowed):\n    missing=set(required)-set(arguments);extra=set(arguments)-set(allowed)\n\
    \    if missing or extra: raise ValueError({\"missing\":sorted(missing),\"extra\":sorted(extra)})\n    return\
    \ True"
  tests:
  - name: Core behaviour
    code: assert validate_tool_arguments({"query":"x"},["query"],["query"]) is True
  - name: Failure or edge case
    code: 'try: validate_tool_arguments({"query":"x","admin":True},["query"],["query"])

      except ValueError: pass

      else: raise AssertionError("unknown argument must fail")'
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - tool-design-mcq
  - tool-design-tf
  - tool-design-code
cheatsheet: '**Key ideas**

  - Write descriptions as for a new colleague: what the tool does, when to use it (and when not), argument formats,
