  - Prefer a few purpose-built tools that match user tasks (e.g. `search_customers`) over thin wrappers around every
  API endpoint, and namespace related tools (e.g. `crm_search`, `crm_update`).

  - Use typed, constrained inputs (JSON Schema enums, required fields, formats), validate them server-side, and
  make mistakes hard to make ("poka-yoke"), e.g. require absolute file paths.

  - Return concise, meaningful output (names, not only opaque IDs), paginate or truncate large results, and write
  error messages that tell the model how to fix the call.

  - Make side-effecting tools idempotent (idempotency keys, upserts) and separate read tools from write tools so
  permissions and approvals can differ.


  **Trade-offs**

  - More tools do not make an agent more capable; large, overlapping toolsets confuse tool selection and use up
