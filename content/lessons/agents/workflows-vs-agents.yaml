id: agents.workflows-vs-agents
concept: agents.workflows-vs-agents
title: Workflows vs agents
subtitle: Deterministic workflows (chaining, routing, parallelisation, orchestrator–workers) are cheaper, faster
  and more predictable; use agents only when the path genuinely can't be known in advance
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Deterministic workflows (chaining, routing, parallelisation, orchestrator–workers) are cheaper, faster
  and more predictable; use agents only when the path genuinely can't be known in advance.
objectives:
- Explain the architecture and trade-offs behind workflows vs agents.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Building effective agents
  url: https://www.anthropic.com/research/building-effective-agents
  publisher: Anthropic
- title: Workflows and agents
  url: https://docs.langchain.com/oss/python/langgraph/workflows-agents
  publisher: LangChain
- title: Microsoft Agent Framework overview (agents vs workflows)
  url: https://learn.microsoft.com/en-us/agent-framework/overview/
  publisher: Microsoft
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Deterministic workflows (chaining, routing, parallelisation, orchestrator–workers) are cheaper, faster
      and more predictable; use agents only when the path genuinely can't be known in advance. Many production "agents"
      are better built as workflows — predefined code paths with LLM steps — which are cheaper, faster and easier
      to test. Knowing the patterns lets you add autonomy only where it pays.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Workflow: your code defines the control flow and LLMs fill in steps. Agent: the LLM decides the control
      flow and tool use itself.

      - Common workflow patterns: prompt chaining (sequential steps with checks), routing (classify, then dispatch),
      parallelisation (sectioning or voting), orchestrator-workers (an LLM splits work dynamically) and evaluator-optimizer
      (generate, critique, revise).

      - Choose an agent when the number and order of steps truly cannot be predicted and mistakes are recoverable;
      choose a workflow when the steps are known.

      - Start with the simplest thing — often one well-prompted call with retrieval — and add complexity only when
      evaluation shows it helps.

      - Hybrids are common, such as a deterministic workflow with one bounded agentic step.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A workflow is not a lesser agent — it is often the better engineering choice — and using a framework''s
      agent class does not make a design agentic.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def choose_execution(task_deterministic, needs_adaptation, risk):\n    if task_deterministic and not\
      \ needs_adaptation: return \"deterministic workflow\"\n    if risk == \"high\": return \"workflow with human\
      \ approval\"\n    return \"bounded agent may be appropriate\"\n\nprint(choose_execution(True, False, \"low\"\
      ))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: workflows-vs-agents-code
  - type: item
    ref: workflows-vs-agents-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Workflow: your code defines the control flow and LLMs fill in steps. Agent: the LLM decides the control
      flow and tool use itself.

      - Common workflow patterns: prompt chaining (sequential steps with checks), routing (classify, then dispatch),
      parallelisation (sectioning or voting), orchestrator-workers (an LLM splits work dynamically) and evaluator-optimizer
      (generate, critique, revise).

      - Choose an agent when the number and order of steps truly cannot be predicted and mistakes are recoverable;
      choose a workflow when the steps are known.

      - Start with the simplest thing — often one well-prompted call with retrieval — and add complexity only when
      evaluation shows it helps.

      - Hybrids are common, such as a deterministic workflow with one bounded agentic step.


      **Limitations**

      - A workflow is not a lesser agent — it is often the better engineering choice — and using a framework''s
      agent class does not make a design agentic.'
