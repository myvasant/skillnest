    ref: workflows-vs-agents-mcq
  - type: item
    ref: workflows-vs-agents-tf
  - type: item
    ref: workflows-vs-agents-code
items:
- id: workflows-vs-agents-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of workflows vs agents?
  explanation: 'Workflow: your code defines the control flow and LLMs fill in steps. Agent: the LLM decides the
    control flow and tool use itself.'
  options:
  - id: a
    text: 'Workflow: your code defines the control flow and LLMs fill in steps. Agent: the LLM decides the control
      flow and tool use itself.'
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: A workflow is not a lesser agent — it is often the better engineering choice — and using a framework's
      agent class does not make a design agentic.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: workflows-vs-agents-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A workflow is not a lesser agent — it is often the better engineering choice — and using a framework's
    agent class does not make a design agentic.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: workflows-vs-agents-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing workflows vs agents for a production application. Explain the main design decision,
    one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: workflows-vs-agents-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for workflows vs agents. The tests cover the main rule and a boundary
    or failure case.
  starterCode: "def choose_execution(task_deterministic, needs_adaptation, risk):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def choose_execution(task_deterministic, needs_adaptation, risk):\n    if task_deterministic and not\
    \ needs_adaptation: return \"deterministic workflow\"\n    if risk == \"high\": return \"workflow with human\
    \ approval\"\n    return \"bounded agent may be appropriate\""
  tests:
  - name: Core behaviour
    code: assert choose_execution(True,False,"low") == "deterministic workflow"
  - name: Failure or edge case
    code: assert choose_execution(False,True,"high") == "workflow with human approval"
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
