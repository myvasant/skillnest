id: tooling.git-branching
concept: tooling.git-branching
title: Git Branches and Merging
subtitle: Work on features without destabilising the shared branch
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Git branches are lightweight references that let you develop changes independently. Learn branch pointers,
  HEAD, fast-forward merges, three-way merges and a safe feature workflow.
objectives:
- Explain what a branch and HEAD represent.
- Create, switch, list and delete branches safely.
- Distinguish fast-forward and three-way merges.
- Describe a focused feature-branch workflow and why tests still matter after a merge.
sources:
- title: Pro Git, 3.1 Branches in a Nutshell
  url: https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
  publisher: Scott Chacon and Ben Straub
- title: Pro Git, 3.2 Basic Branching and Merging
  url: https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging
  publisher: Scott Chacon and Ben Straub
sections:
- id: why
  title: Why branches exist
  kind: why
  blocks:
  - type: markdown
    body: A branch lets you work on a change without moving the stable branch that others depend on. Git branches
      are lightweight references to commits. Creating one is fast because Git does not make a full copy of every
      file.
- id: model
  title: A branch is a movable pointer
  kind: concept
  blocks:
  - type: markdown
    body: A commit points to a snapshot and its parent commit(s). A branch name such as `main` or `feature/search`
      points to one commit. When you commit while on a branch, that branch pointer advances. `HEAD` records the
      current checkout, usually by pointing symbolically to the current branch.
  - type: code
    language: bash
    runnable: false
    code: 'git branch

      git switch -c feature/search

      git status

      git log --oneline --decorate --graph --all'
    caption: Inspect branches, create and switch to a feature branch, then inspect the commit graph.
  - type: item
    ref: branch-pointer-mcq
- id: merge
  title: Fast-forward and three-way merge
  kind: concept
  blocks:
  - type: markdown
    body: If the target branch has not moved since you created the feature branch, Git can **fast-forward** the
      target pointer to the feature commit. If both branches have new commits, Git uses their common ancestor and
      the two branch tips to perform a **three-way merge**. A merge commit records both parent histories.
  - type: markdown
    body: After merging, run the tests. A merge can be conflict-free and still combine incompatible assumptions.
      Delete a merged local branch with `git branch -d feature/search`; do not force-delete an unmerged branch unless
      you understand what will become unreachable.
  - type: item
    ref: branch-switch-tf
- id: workflow
  title: A small safe workflow
  kind: walkthrough
  blocks:
  - type: markdown
    body: Keep branches focused and short-lived. Update the base branch before creating a new branch, commit coherent
      units of work, push the feature branch and open a pull request for review. Avoid mixing unrelated formatting,
      refactoring and feature changes in one large diff.
  - type: item
    ref: branch-workflow-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Branch = movable pointer to a commit.

      - `git switch -c name` creates and switches.

      - Fast-forward moves a branch pointer; three-way merge combines divergent histories.

      - Run tests after merging; no-conflict does not mean no-bug.'
  - type: item
    ref: branch-pointer-mcq
  - type: item
    ref: branch-switch-tf
  - type: item
    ref: branch-workflow-explain
items:
- id: branch-pointer-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: What is a Git branch, conceptually?
  explanation: A branch is a movable reference to a commit, not a separate copy of the project files.
  options:
  - id: a
    text: A complete duplicate of the repository files.
    correct: false
    feedback: Git does not copy the entire repository when creating a branch.
  - id: b
    text: A movable pointer to a commit.
    correct: true
    feedback: Correct. New commits advance the current branch reference.
  - id: c
    text: A remote server.
    correct: false
    feedback: A remote is another repository location.
  - id: d
    text: A staging area.
    correct: false
    feedback: The index is the staging area.
- id: branch-switch-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Creating a branch automatically copies all files into a new independent directory.
  answer: false
  explanation: A branch is a lightweight reference. Your working tree changes when you switch to a branch, but Git
    does not duplicate the full project for every branch.
- id: branch-workflow-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You need to add a feature without changing the stable `main` branch. Describe a safe sequence of Git commands
    and explain what happens when you merge the feature back.
  rubric:
  - Create and switch to a new branch from the intended base.
  - Commit the feature changes on that branch.
  - Switch to the target branch and merge the feature branch.
  - Explain that Git may fast-forward or create a merge commit depending on history.
  modelAnswer: Start with `git switch main`, update it, then run `git switch -c feature/search`. Make focused commits
    on the feature branch. When ready, switch to main and merge with `git merge feature/search`. If main has not
    moved since branching, Git may fast-forward; if both branches have new commits, Git performs a three-way merge
    and may create a merge commit.
  explanation: Branches isolate lines of work by moving references to commits. Merging integrates histories; it
    does not automatically prove the combined code is correct.
masteryCheck:
  passThreshold: 0.8
  items:
  - branch-pointer-mcq
  - branch-switch-tf
  - branch-workflow-explain
cheatsheet: '`git branch` lists branches · `git switch -c feature/name` creates and switches · `git switch main`
  switches · `git merge feature/name` integrates. Fast-forward = move pointer; three-way merge = combine divergent
  histories. Test after merging.'
