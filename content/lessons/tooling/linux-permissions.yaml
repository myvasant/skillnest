id: tooling.linux-permissions
concept: tooling.linux-permissions
title: Linux users, groups and permissions
subtitle: Linux permissions control which users may read, write or execute files and directories
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Linux permissions control which users may read, write or execute files and directories.
objectives:
- Explain the purpose and core mental model of linux users, groups and permissions.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Linux permissions control which users may read, write or execute files and directories. The owner, group
      and other permission classes let a system grant access without making every file public or running every process
      as administrator.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: For regular files, read means inspect contents, write means modify contents and execute means run the
      file. For directories, read lists names, write changes directory entries and execute allows traversal/search.
      chmod changes mode bits; chown changes ownership.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def permission_bits(mode):\n    labels = \"rwx\"\n    return {\"owner\": \"\".join(labels[i] if mode\
      \ & (0o400 >> i) else \"-\" for i in range(3)),\n            \"group\": \"\".join(labels[i] if mode & (0o040\
      \ >> i) else \"-\" for i in range(3)),\n            \"other\": \"\".join(labels[i] if mode & (0o004 >> i)\
      \ else \"-\" for i in range(3))}\n\nprint(permission_bits(0o750))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: linux-permissions-code
  - type: item
    ref: linux-permissions-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Linux permissions control which users may read, write or execute files and directories.

      - The owner, group and other permission classes let a system grant access without making every file public
      or running every process as administrator.

      - For regular files, read means inspect contents, write means modify contents and execute means run the file.
      For directories, read lists names, write changes directory entries and execute allows traversal/search. chmod
      changes mode bits; chown changes ownership.'
  - type: item
    ref: linux-permissions-mcq
  - type: item
    ref: linux-permissions-tf
  - type: item
