cheatsheet: '**Core idea:** Linux permissions control which users may read, write or execute files and directories.


  **Remember:** The owner, group and other permission classes let a system grant access without making every file
  public or running every process as administrator.


  **Apply:** For regular files, read means inspect contents, write means modify contents and execute means run the
  file. For directories, read lists names, write changes directory entries and execute allows traversal/search.
  chmod changes mode bits; chown changes ownership.'
