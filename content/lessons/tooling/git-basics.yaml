id: tooling.git-basics
concept: tooling.git-basics
title: "Git Basics: init, add, commit, status, log, diff"
subtitle: The working tree, the staging area and snapshots
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Learn the handful of Git commands you will use every day and, more importantly, the model behind them: a
  working tree you edit, a staging area that holds exactly what the next commit will contain, and a
  repository of snapshot commits. Then build a tiny content-addressed snapshot store in Python to see why
  commits are snapshots and why identical content is stored only once.
objectives:
  - Describe the working tree, the staging area (index) and the repository, and what add and commit move between them.
  - Create a repository and record commits with init, status, add, commit and log.
  - Read git status and git diff output, including files that are both staged and modified.
  - Write clear commit messages that describe one logical change.
  - Explain why a commit is a snapshot and how content addressing makes unchanged files free to store.
  - Implement a simplified content-addressed object store and status check in Python.
