id: tooling.ssh
concept: tooling.ssh
title: SSH and remote machines
subtitle: SSH provides encrypted remote login and secure channels for commands, file transfer and Git transport
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: SSH provides encrypted remote login and secure channels for commands, file transfer and Git transport.
objectives:
- Explain the purpose and core mental model of ssh and remote machines.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: SSH provides encrypted remote login and secure channels for commands, file transfer and Git transport.
      Engineers use SSH to administer servers and authenticate to Git hosts without sending passwords in clear text.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: A client authenticates to a server using a password or public-key authentication. With keys, the private
      key stays on the client and the public key is installed in the account’s authorized_keys file. Host-key checking
      helps detect unexpected server identity changes.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def ssh_key_roles():\n    return {\"private_key\": \"kept secret on client\", \"public_key\": \"installed\
      \ on server\",\n            \"host_key\": \"identifies the server to the client\"}\n\nprint(ssh_key_roles())"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: ssh-code
  - type: item
    ref: ssh-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- SSH provides encrypted remote login and secure channels for commands, file transfer and Git transport.

      - Engineers use SSH to administer servers and authenticate to Git hosts without sending passwords in clear
      text.

      - A client authenticates to a server using a password or public-key authentication. With keys, the private
      key stays on the client and the public key is installed in the account’s authorized_keys file. Host-key checking
      helps detect unexpected server identity changes.'
  - type: item
    ref: ssh-mcq
  - type: item
    ref: ssh-tf
  - type: item
    ref: ssh-code
items:
- id: ssh-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which key must never be copied to the remote server?
  explanation: 'Correct: the private key proves possession of the credential and must remain protected on the client.'
  options:
  - id: a
    text: The private key.
    correct: true
    feedback: 'Correct: the private key proves possession of the credential and must remain protected on the client.'
  - id: b
    text: The public key.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: ssh-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: ssh-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: The server receives the public key; the private key remains secret.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: ssh-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: SSH and remote machines.'
  starterCode: "def ssh_key_roles():\n    # TODO: implement the behaviour described in the exercise.\n    raise\
    \ NotImplementedError(\"Complete this function\")"
  solution: "def ssh_key_roles():\n    return {\"private_key\": \"kept secret on client\", \"public_key\": \"installed\
    \ on server\",\n            \"host_key\": \"identifies the server to the client\"}"
  tests:
  - name: Core behaviour
    code: roles = ssh_key_roles()
  - name: Edge behaviour
    code: 'assert "secret" in roles["private_key"]

      assert "server" in roles["public_key"]

      assert "identifies" in roles["host_key"]'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - ssh-mcq
  - ssh-tf
  - ssh-code
cheatsheet: '**Core idea:** SSH provides encrypted remote login and secure channels for commands, file transfer
  and Git transport.


  **Remember:** Engineers use SSH to administer servers and authenticate to Git hosts without sending passwords
  in clear text.


  **Apply:** A client authenticates to a server using a password or public-key authentication. With keys, the private
  key stays on the client and the public key is installed in the account’s authorized_keys file. Host-key checking
  helps detect unexpected server identity changes.'
