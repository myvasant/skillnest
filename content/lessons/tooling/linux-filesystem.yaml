id: tooling.linux-filesystem
concept: tooling.linux-filesystem
title: The Linux file system and navigation
subtitle: Linux presents files, directories and many system resources through a hierarchical filesystem rooted at
  /
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Linux presents files, directories and many system resources through a hierarchical filesystem rooted at
  /.
objectives:
- Explain the purpose and core mental model of the linux file system and navigation.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Linux presents files, directories and many system resources through a hierarchical filesystem rooted at
      /. Your current working directory affects relative paths. Absolute paths begin at /; relative paths are interpreted
      from the current directory.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: 'Common directories have conventions: /etc for system configuration, /var for changing data and logs,
      /home for user files, /tmp for temporary data, /usr for installed userland software. A path can refer to a
      regular file, directory or symbolic link.'
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: 'from pathlib import PurePosixPath


      p = PurePosixPath("/home/learner/projects/app/main.py")

      print(p.name, p.suffix, p.parent, p.is_absolute())'
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: linux-filesystem-code
  - type: item
    ref: linux-filesystem-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Linux presents files, directories and many system resources through a hierarchical filesystem rooted
      at /.

      - Your current working directory affects relative paths. Absolute paths begin at /; relative paths are interpreted
      from the current directory.

      - Common directories have conventions: /etc for system configuration, /var for changing data and logs, /home
      for user files, /tmp for temporary data, /usr for installed userland software. A path can refer to a regular
      file, directory or symbolic link.'
  - type: item
    ref: linux-filesystem-mcq
  - type: item
    ref: linux-filesystem-tf
  - type: item
    ref: linux-filesystem-code
items:
- id: linux-filesystem-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: What does the leading slash in /var/log/app.log indicate?
  explanation: 'Correct: absolute paths are resolved from / regardless of the current working directory.'
  options:
  - id: a
    text: It is an absolute path rooted at the filesystem root directory.
    correct: true
    feedback: 'Correct: absolute paths are resolved from / regardless of the current working directory.'
  - id: b
    text: It means the file is inside the current directory.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: linux-filesystem-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: linux-filesystem-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Relative paths depend on the current directory; absolute paths do not.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: linux-filesystem-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: The Linux file system and navigation.'
  starterCode: "from pathlib import PurePosixPath\n\ndef describe_path(value):\n    # TODO: implement the behaviour\
    \ described in the exercise.\n    raise NotImplementedError(\"Complete this function\")"
  solution: "from pathlib import PurePosixPath\ndef describe_path(value):\n    p = PurePosixPath(value)\n    return\
    \ {\"name\": p.name, \"suffix\": p.suffix, \"parent\": str(p.parent), \"absolute\": p.is_absolute()}"
  tests:
  - name: Core behaviour
    code: assert describe_path("/var/log/app.log")["absolute"] is True
  - name: Edge behaviour
    code: 'assert describe_path("/var/log/app.log")["suffix"] == ".log"

      assert describe_path("notes/todo.txt")["parent"] == "notes"'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - linux-filesystem-mcq
  - linux-filesystem-tf
  - linux-filesystem-code
cheatsheet: '**Core idea:** Linux presents files, directories and many system resources through a hierarchical filesystem
  rooted at /.


  **Remember:** Your current working directory affects relative paths. Absolute paths begin at /; relative paths
  are interpreted from the current directory.


  **Apply:** Common directories have conventions: /etc for system configuration, /var for changing data and logs,
  /home for user files, /tmp for temporary data, /usr for installed userland software. A path can refer to a regular
  file, directory or symbolic link.'
