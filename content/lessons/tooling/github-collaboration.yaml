id: tooling.github-collaboration
concept: tooling.github-collaboration
title: Collaborating on GitHub
subtitle: Team collaboration adds review, permissions, issue tracking and automation around Git repositories
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Team collaboration adds review, permissions, issue tracking and automation around Git repositories.
objectives:
- Explain the purpose and core mental model of collaborating on github.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Team collaboration adds review, permissions, issue tracking and automation around Git repositories. A
      shared repository needs clear ownership and a workflow that prevents unreviewed changes from silently reaching
      important branches.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: Forks create a personal server-side copy; branches isolate work; remotes connect local and hosted repositories;
      protected branches can require reviews and passing checks.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def review_checklist(change):\n    required = [\"purpose\", \"tests\", \"risk\"]\n    return [name for\
      \ name in required if not change.get(name)]\n\nprint(review_checklist({\"purpose\": \"Fix timeout\", \"tests\"\
      : \"Added regression test\"}))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: github-collaboration-code
  - type: item
    ref: github-collaboration-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Team collaboration adds review, permissions, issue tracking and automation around Git repositories.

      - A shared repository needs clear ownership and a workflow that prevents unreviewed changes from silently
      reaching important branches.

      - Forks create a personal server-side copy; branches isolate work; remotes connect local and hosted repositories;
      protected branches can require reviews and passing checks.'
  - type: item
    ref: github-collaboration-mcq
  - type: item
    ref: github-collaboration-tf
  - type: item
    ref: github-collaboration-code
items:
- id: github-collaboration-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: What is the main purpose of a pull request review?
  explanation: 'Correct: review is a quality and knowledge-sharing step, not a substitute for version control.'
  options:
  - id: a
    text: To evaluate a proposed change before it is integrated, including correctness, maintainability, risk and
      tests.
    correct: true
    feedback: 'Correct: review is a quality and knowledge-sharing step, not a substitute for version control.'
  - id: b
    text: To replace Git commits with comments.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: github-collaboration-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: github-collaboration-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: A useful review checks intent, implementation, tests and operational impact.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: github-collaboration-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Collaborating on GitHub.'
  starterCode: "def review_checklist(change):\n    # TODO: implement the behaviour described in the exercise.\n\
    \    raise NotImplementedError(\"Complete this function\")"
  solution: "def review_checklist(change):\n    required = [\"purpose\", \"tests\", \"risk\"]\n    return [name\
    \ for name in required if not change.get(name)]"
  tests:
  - name: Core behaviour
    code: 'assert review_checklist({"purpose": "x", "tests": "y", "risk": "z"}) == []'
  - name: Edge behaviour
    code: 'assert review_checklist({"purpose": "x"}) == ["tests", "risk"]'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - github-collaboration-mcq
  - github-collaboration-tf
  - github-collaboration-code
cheatsheet: '**Core idea:** Team collaboration adds review, permissions, issue tracking and automation around Git
  repositories.


  **Remember:** A shared repository needs clear ownership and a workflow that prevents unreviewed changes from silently
  reaching important branches.


  **Apply:** Forks create a personal server-side copy; branches isolate work; remotes connect local and hosted repositories;
  protected branches can require reviews and passing checks.'
