id: tooling.version-control
concept: tooling.version-control
title: Why version control
subtitle: Version control records deliberate snapshots of a project so changes can be inspected, shared and recovered
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Version control records deliberate snapshots of a project so changes can be inspected, shared and recovered.
objectives:
- Explain the purpose and core mental model of why version control.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: 'Version control records deliberate snapshots of a project so changes can be inspected, shared and recovered.
      A repository history replaces fragile copies such as final-v2-really-final.py. Git is distributed: a clone
      contains local history, while GitHub is a hosting and collaboration service. Commits should describe one coherent
      change.'
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: A commit is a snapshot with parent links, author metadata and a message. A branch is a movable name pointing
      to a commit; it is not a separate copy of every file. Untracked files are not protected until added and committed.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def commit_summary(changes):\n    \"\"\"Summarise a logical change set without mutating it.\"\"\"\n \
      \   return {\"files\": len(changes), \"added\": sum(v == \"added\" for v in changes.values()),\n         \
      \   \"modified\": sum(v == \"modified\" for v in changes.values()),\n            \"deleted\": sum(v == \"\
      deleted\" for v in changes.values())}\n\nprint(commit_summary({\"app.py\": \"modified\", \"README.md\": \"\
      modified\", \"old.txt\": \"deleted\"}))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: version-control-code
  - type: item
    ref: version-control-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Version control records deliberate snapshots of a project so changes can be inspected, shared and recovered.

      - A repository history replaces fragile copies such as final-v2-really-final.py. Git is distributed: a clone
      contains local history, while GitHub is a hosting and collaboration service. Commits should describe one coherent
      change.

      - A commit is a snapshot with parent links, author metadata and a message. A branch is a movable name pointing
      to a commit; it is not a separate copy of every file. Untracked files are not protected until added and committed.'
  - type: item
    ref: version-control-mcq
  - type: item
    ref: version-control-tf
  - type: item
    ref: version-control-code
items:
- id: version-control-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: Which statement best describes Git?
  explanation: 'Correct: Git is the version-control program; GitHub is one possible hosting and collaboration platform.'
  options:
  - id: a
    text: A distributed version-control system that records project history locally and can exchange it with remotes.
    correct: true
    feedback: 'Correct: Git is the version-control program; GitHub is one possible hosting and collaboration platform.'
  - id: b
    text: A hosted website that stores files only.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: version-control-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: version-control-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Git is not GitHub; a local repository works without an internet connection.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: version-control-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Why version control.'
  starterCode: "def commit_summary(changes):\n    # TODO: implement the behaviour described in the exercise.\n \
    \   raise NotImplementedError(\"Complete this function\")"
  solution: "def commit_summary(changes):\n    return {\"files\": len(changes), \"added\": sum(v == \"added\" for\
    \ v in changes.values()),\n            \"modified\": sum(v == \"modified\" for v in changes.values()),\n   \
    \         \"deleted\": sum(v == \"deleted\" for v in changes.values())}"
  tests:
  - name: Core behaviour
    code: 'assert commit_summary({"a": "added", "b": "modified"}) == {"files": 2, "added": 1, "modified": 1, "deleted":
      0}'
  - name: Edge behaviour
    code: 'assert commit_summary({}) == {"files": 0, "added": 0, "modified": 0, "deleted": 0}'
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - version-control-mcq
  - version-control-tf
  - version-control-code
cheatsheet: '**Core idea:** Version control records deliberate snapshots of a project so changes can be inspected,
  shared and recovered.


  **Remember:** A repository history replaces fragile copies such as final-v2-really-final.py. Git is distributed:
  a clone contains local history, while GitHub is a hosting and collaboration service. Commits should describe one
  coherent change.


  **Apply:** A commit is a snapshot with parent links, author metadata and a message. A branch is a movable name
  pointing to a commit; it is not a separate copy of every file. Untracked files are not protected until added and
  committed.'
