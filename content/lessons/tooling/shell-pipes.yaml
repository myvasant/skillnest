id: tooling.shell-pipes
concept: tooling.shell-pipes
title: Shell streams, redirection and pipes
subtitle: Shell commands communicate through standard input, standard output and standard error; pipes connect one
  command’s output to another command’s input
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Shell commands communicate through standard input, standard output and standard error; pipes connect one
  command’s output to another command’s input.
objectives:
- Explain the purpose and core mental model of shell streams, redirection and pipes.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Shell commands communicate through standard input, standard output and standard error; pipes connect one
      command’s output to another command’s input. Composing small commands is powerful for inspection and automation,
      but it is important to know which stream contains data and which contains diagnostics.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: stdin is file descriptor 0, stdout is 1 and stderr is 2. > redirects stdout, 2> redirects stderr, >> appends,
      and | pipes stdout to the next process. 2>&1 redirects stderr to the current stdout destination.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def route_streams(stdout, stderr):\n    return {\"pipe_receives\": stdout, \"diagnostic_stream\": stderr}\n\
      \nprint(route_streams(\"rows\\n\", \"warning: skipped 1 row\"))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: shell-pipes-code
  - type: item
    ref: shell-pipes-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Shell commands communicate through standard input, standard output and standard error; pipes connect
      one command’s output to another command’s input.

      - Composing small commands is powerful for inspection and automation, but it is important to know which stream
      contains data and which contains diagnostics.

      - stdin is file descriptor 0, stdout is 1 and stderr is 2. > redirects stdout, 2> redirects stderr, >> appends,
      and | pipes stdout to the next process. 2>&1 redirects stderr to the current stdout destination.'
  - type: item
    ref: shell-pipes-mcq
  - type: item
    ref: shell-pipes-tf
  - type: item
    ref: shell-pipes-code
items:
- id: shell-pipes-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: By default, which stream is sent through a shell pipe?
  explanation: 'Correct: stderr remains separate unless explicitly redirected.'
  options:
  - id: a
    text: Standard output (stdout).
    correct: true
    feedback: 'Correct: stderr remains separate unless explicitly redirected.'
  - id: b
    text: Standard error (stderr).
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: shell-pipes-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: shell-pipes-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Pipes connect stdout to stdin; diagnostics on stderr do not flow through by default.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: shell-pipes-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Shell streams, redirection and pipes.'
  starterCode: "def route_streams(stdout, stderr):\n    # TODO: implement the behaviour described in the exercise.\n\
    \    raise NotImplementedError(\"Complete this function\")"
  solution: "def route_streams(stdout, stderr):\n    return {\"pipe_receives\": stdout, \"diagnostic_stream\": stderr}"
  tests:
  - name: Core behaviour
    code: assert route_streams("ok", "warning")["pipe_receives"] == "ok"
  - name: Edge behaviour
    code: assert route_streams("ok", "warning")["diagnostic_stream"] == "warning"
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - shell-pipes-mcq
  - shell-pipes-tf
  - shell-pipes-code
cheatsheet: '**Core idea:** Shell commands communicate through standard input, standard output and standard error;
  pipes connect one command’s output to another command’s input.


  **Remember:** Composing small commands is powerful for inspection and automation, but it is important to know
  which stream contains data and which contains diagnostics.


  **Apply:** stdin is file descriptor 0, stdout is 1 and stderr is 2. > redirects stdout, 2> redirects stderr, >>
  appends, and | pipes stdout to the next process. 2>&1 redirects stderr to the current stdout destination.'
