id: tooling.pull-requests
concept: tooling.pull-requests
title: Pull requests and code review
subtitle: A pull request (PR) proposes integrating a branch and gives reviewers a focused place to inspect changes,
  discuss trade-offs and check automation
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: A pull request (PR) proposes integrating a branch and gives reviewers a focused place to inspect changes,
  discuss trade-offs and check automation.
objectives:
- Explain the purpose and core mental model of pull requests and code review.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A pull request (PR) proposes integrating a branch and gives reviewers a focused place to inspect changes,
      discuss trade-offs and check automation. A PR should make a change understandable to someone who did not write
      it. Small, coherent PRs reduce review cost and make regressions easier to locate.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: The diff is the primary evidence. CI checks provide repeatable signals, but passing tests do not prove
      the design is correct. Review comments should distinguish blocking defects from suggestions.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def pr_readiness(pr):\n    fields = [\"problem\", \"approach\", \"tests\", \"risk\"]\n    missing = [field\
      \ for field in fields if not pr.get(field)]\n    return {\"ready\": not missing, \"missing\": missing}\n\n\
      print(pr_readiness({\"problem\": \"Fix cache bug\", \"approach\": \"Expire stale entries\", \"tests\": \"\
      Unit tests\"}))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: pull-requests-code
  - type: item
    ref: pull-requests-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- A pull request (PR) proposes integrating a branch and gives reviewers a focused place to inspect changes,
      discuss trade-offs and check automation.

      - A PR should make a change understandable to someone who did not write it. Small, coherent PRs reduce review
      cost and make regressions easier to locate.

      - The diff is the primary evidence. CI checks provide repeatable signals, but passing tests do not prove the
      design is correct. Review comments should distinguish blocking defects from suggestions.'
  - type: item
    ref: pull-requests-mcq
  - type: item
    ref: pull-requests-tf
  - type: item
    ref: pull-requests-code
items:
- id: pull-requests-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which is the strongest evidence that a proposed code change is safe to merge?
  explanation: 'Correct: no single signal is sufficient; review combines implementation evidence and automated feedback.'
  options:
  - id: a
    text: A reviewed diff, relevant automated checks, and a reasoned assessment of risks together.
    correct: true
    feedback: 'Correct: no single signal is sufficient; review combines implementation evidence and automated feedback.'
  - id: b
    text: A large number of changed lines.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: pull-requests-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: pull-requests-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: PR checks support review but cannot replace human reasoning about behaviour and design.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: pull-requests-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Pull requests and code review.'
  starterCode: "def pr_readiness(pr):\n    # TODO: implement the behaviour described in the exercise.\n    raise\
    \ NotImplementedError(\"Complete this function\")"
  solution: "def pr_readiness(pr):\n    fields = [\"problem\", \"approach\", \"tests\", \"risk\"]\n    missing =\
    \ [field for field in fields if not pr.get(field)]\n    return {\"ready\": not missing, \"missing\": missing}"
  tests:
  - name: Core behaviour
    code: 'assert pr_readiness({"problem":"p", "approach":"a", "tests":"t", "risk":"r"}) == {"ready": True, "missing":
      []}'
  - name: Edge behaviour
    code: assert pr_readiness({"problem":"p"})["missing"] == ["approach", "tests", "risk"]
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - pull-requests-mcq
  - pull-requests-tf
  - pull-requests-code
cheatsheet: '**Core idea:** A pull request (PR) proposes integrating a branch and gives reviewers a focused place
  to inspect changes, discuss trade-offs and check automation.


  **Remember:** A PR should make a change understandable to someone who did not write it. Small, coherent PRs reduce
  review cost and make regressions easier to locate.


  **Apply:** The diff is the primary evidence. CI checks provide repeatable signals, but passing tests do not prove
  the design is correct. Review comments should distinguish blocking defects from suggestions.'
