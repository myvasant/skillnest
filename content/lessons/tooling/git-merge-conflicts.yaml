id: tooling.git-merge-conflicts
concept: tooling.git-merge-conflicts
title: Resolving merge conflicts
subtitle: A merge conflict means Git cannot safely combine overlapping changes automatically; a human must choose
  the correct final content
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: A merge conflict means Git cannot safely combine overlapping changes automatically; a human must choose
  the correct final content.
objectives:
- Explain the purpose and core mental model of resolving merge conflicts.
- Recognise common failure modes and choose an appropriate diagnostic or implementation approach.
- Apply the concept in a small exercise and explain the trade-offs.
sources:
- title: Pro Git documentation
  url: https://git-scm.com/docs
  publisher: Git project
- title: 'The Missing Semester: The Shell Tools and Scripting'
  url: https://missing.csail.mit.edu/2020/command-line/
  publisher: MIT CSAIL
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A merge conflict means Git cannot safely combine overlapping changes automatically; a human must choose
      the correct final content. Conflicts are not Git errors and do not mean data is automatically lost. They are
      signals that two histories changed the same area in ways Git cannot reconcile without domain knowledge.
- id: mental-model
  title: Build the mental model
  kind: mental-model
  blocks:
  - type: markdown
    body: Conflict markers show the current branch section, the incoming section and the boundary. The correct resolution
      may combine both changes or choose a new implementation; blindly accepting either side can break behaviour.
  - type: callout
    variant: misconception
    title: Avoid the shortcut
    body: Do not treat a command, framework or status indicator as proof that the system is correct. Verify the
      intended behaviour, inspect the evidence and test the relevant failure case.
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following Python example models one small part of the idea. It is a teaching model, not a replacement
      for the real operating-system or network tool.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def merge_lines(base, ours, theirs):\n    \"\"\"A deliberately simple conflict detector for equal-length\
      \ line lists.\"\"\"\n    result = []\n    conflicts = []\n    for i, original in enumerate(base):\n      \
      \  left, right = ours[i], theirs[i]\n        if left == right: result.append(left)\n        elif left == original:\
      \ result.append(right)\n        elif right == original: result.append(left)\n        else: conflicts.append(i)\n\
      \    return result, conflicts\n\nprint(merge_lines([\"a\", \"b\"], [\"a\", \"ours\"], [\"a\", \"theirs\"]))"
    caption: Runnable conceptual model; use the platform runner to inspect the output.
- id: practice
  title: Practice and diagnose
  kind: practice
  blocks:
  - type: markdown
    body: Try the exercise before opening the solution. Think about edge cases and explain why the chosen behaviour
      is safe.
  - type: item
    ref: merge-conflicts-code
  - type: item
    ref: merge-conflicts-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- A merge conflict means Git cannot safely combine overlapping changes automatically; a human must choose
      the correct final content.

      - Conflicts are not Git errors and do not mean data is automatically lost. They are signals that two histories
      changed the same area in ways Git cannot reconcile without domain knowledge.

      - Conflict markers show the current branch section, the incoming section and the boundary. The correct resolution
      may combine both changes or choose a new implementation; blindly accepting either side can break behaviour.'
  - type: item
    ref: merge-conflicts-mcq
  - type: item
    ref: merge-conflicts-tf
  - type: item
    ref: merge-conflicts-code
items:
- id: merge-conflicts-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: What should you do after editing a conflicted file?
  explanation: 'Correct: staging only tells Git the file is resolved; it does not prove the chosen content is correct.'
  options:
  - id: a
    text: Remove markers, inspect the intended combined result, run relevant tests, review the diff and stage the
      resolution.
    correct: true
    feedback: 'Correct: staging only tells Git the file is resolved; it does not prove the chosen content is correct.'
  - id: b
    text: Run git add immediately without reading the file.
    feedback: This confuses the concept with a different layer or responsibility.
  - id: c
    text: It is safe to skip verification when the command succeeds.
    feedback: A successful command is not sufficient evidence that the intended outcome is correct.
- id: merge-conflicts-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A technically successful command or response always proves the overall system behaviour is correct.
  answer: false
  explanation: A local success can coexist with incorrect assumptions, missing authorization, stale state, partial
    failure or unsafe side effects. Verify the complete behaviour.
- id: merge-conflicts-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: A merge conflict requires a semantic decision, not just removal of marker strings.
  rubric:
  - Identify the relevant system boundary or underlying mechanism rather than guessing from the symptom.
  - Propose at least one concrete verification step and explain what evidence it would provide.
  - Mention a realistic risk, limitation or alternative explanation.
  modelAnswer: Start by identifying the boundary where the behaviour changes. Gather a reproducible example, inspect
    the relevant state or protocol evidence, and test one hypothesis at a time. Check an alternative explanation
    before changing configuration. Record the result so another engineer can reproduce the diagnosis.
  explanation: A strong response explains the mechanism, distinguishes facts from assumptions, and proposes a concrete
    way to verify the outcome.
- id: merge-conflicts-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Complete the helper function shown below. The reference implementation should satisfy both normal and
    edge-case assertions. Topic: Resolving merge conflicts.'
  starterCode: "def merge_lines(base, ours, theirs):\n    # TODO: implement the behaviour described in the exercise.\n\
    \    raise NotImplementedError(\"Complete this function\")"
  solution: "def merge_lines(base, ours, theirs):\n    result, conflicts = [], []\n    for i, original in enumerate(base):\n\
    \        left, right = ours[i], theirs[i]\n        if left == right: result.append(left)\n        elif left\
    \ == original: result.append(right)\n        elif right == original: result.append(left)\n        else: conflicts.append(i)\n\
    \    return result, conflicts"
  tests:
  - name: Core behaviour
    code: assert merge_lines(["a"], ["ours"], ["a"]) == (["ours"], [])
  - name: Edge behaviour
    code: assert merge_lines(["a"], ["x"], ["y"]) == ([], [0])
  hints:
  - Translate the requirement into a small deterministic rule.
  - Handle missing, unknown or boundary values explicitly.
  - Run both assertions; do not optimise before the behaviour is correct.
  explanation: This exercise checks whether you can apply the lesson’s core rule and handle an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - merge-conflicts-mcq
  - merge-conflicts-tf
  - merge-conflicts-code
cheatsheet: '**Core idea:** A merge conflict means Git cannot safely combine overlapping changes automatically;
  a human must choose the correct final content.


  **Remember:** Conflicts are not Git errors and do not mean data is automatically lost. They are signals that two
  histories changed the same area in ways Git cannot reconcile without domain knowledge.


  **Apply:** Conflict markers show the current branch section, the incoming section and the boundary. The correct
  resolution may combine both changes or choose a new implementation; blindly accepting either side can break behaviour.'
