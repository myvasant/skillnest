sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Blocks of multi-head self-attention and feed-forward layers with residual connections and layer normalisation,
      in encoder, decoder or encoder–decoder form. Transformers power LLMs, embedding models and many vision and
      audio models; reading a model card or paper requires knowing the block structure.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A block combines multi-head self-attention with a position-wise feed-forward network (typically about
      4x wider than the model dimension), each wrapped in a residual connection with layer normalisation.

      - Multi-head attention runs several attention heads in parallel on lower-dimensional projections and concatenates
      their outputs, letting heads specialise in different relationships.

      - Modern LLMs normalise before each sub-layer (pre-norm) for stable training; the original paper normalised
      after (post-norm).

      - Encoder-only models (BERT) suit classification and embeddings; decoder-only models (GPT-style, causal attention)
      generate text; encoder–decoder models (T5, the original Transformer) map one sequence to another.

      - During training all positions are processed in parallel, which is why Transformers scale so well on GPUs.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- In typical configurations most parameters sit in the feed-forward layers, not in attention.

      - "Transformer" does not mean "LLM"; the architecture is also used for vision, speech, proteins and more.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def scaled_dot_product_attention(query, keys, values):\n    if len(keys)!=len(values) or not keys: raise\
      \ ValueError(\"keys and values must align\")\n    scores=[sum(q*k for q,k in zip(query,key))/math.sqrt(len(query))\
      \ for key in keys]\n    weights=softmax(scores)\n    return [sum(w*v[i] for w,v in zip(weights,values)) for\
      \ i in range(len(values[0]))]\n\ndef softmax(scores):\n    exps=[math.exp(x-max(scores)) for x in scores];\
      \ total=sum(exps)\n    return [x/total for x in exps]\n\nimport math\nprint(scaled_dot_product_attention([1,0],\
      \ [[1,0],[0,1]], [[10,0],[0,10]]))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
