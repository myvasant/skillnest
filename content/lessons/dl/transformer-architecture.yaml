items:
- id: transformer-architecture-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of the transformer architecture?
  explanation: A block combines multi-head self-attention with a position-wise feed-forward network (typically about
    4x wider than the model dimension), each wrapped in a residual connection with layer normalisation.
  options:
  - id: a
    text: A block combines multi-head self-attention with a position-wise feed-forward network (typically about
      4x wider than the model dimension), each wrapped in a residual connection with layer normalisation.
    correct: true
    feedback: 'Correct: this describes the operation or purpose introduced in the lesson.'
  - id: b
    text: In typical configurations most parameters sit in the feed-forward layers, not in attention.
    feedback: This is a misconception; check the mathematical conditions and implementation details.
  - id: c
    text: A neural network learns without data, parameters or an objective.
    feedback: Training depends on data, a parameterised model and an objective or learning signal.
- id: transformer-architecture-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: In typical configurations most parameters sit in the feed-forward layers, not in attention.
  answer: false
  explanation: The statement is a known misconception. Frameworks implement the operations; understanding them is
    necessary for debugging and choosing the right architecture.
- id: transformer-architecture-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Explain the transformer architecture using a small numerical example. Identify the input, operation and
    output, then describe one limitation or failure mode.
  rubric:
  - Describe the operation and relevant inputs/outputs accurately.
  - Use a numerical example or trace to support the explanation.
  - Identify a limitation, assumption or numerical issue.
  modelAnswer: Start with a small set of values and apply the operation step by step. Explain how each intermediate
    value is produced and what the final result represents. Then discuss a relevant edge case such as numerical
    stability, dimensions, scale or generalisation.
  explanation: A strong answer connects the equations to computation and recognises the assumptions behind the result.
- id: transformer-architecture-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for the transformer architecture. The tests cover the main calculation and
    an edge case.
  starterCode: "import math\n\ndef softmax(scores):\n    raise NotImplementedError('Complete this function')\n\n\
    def scaled_dot_product_attention(query, keys, values):\n    raise NotImplementedError('Complete this function')"
  solution: "import math\ndef softmax(scores):\n    exps=[math.exp(x-max(scores)) for x in scores]; total=sum(exps)\n\
    \    return [x/total for x in exps]\n\ndef scaled_dot_product_attention(query, keys, values):\n    if len(keys)!=len(values)\
    \ or not keys: raise ValueError(\"keys and values must align\")\n    scores=[sum(q*k for q,k in zip(query,key))/math.sqrt(len(query))\
    \ for key in keys]\n    weights=softmax(scores)\n    return [sum(w*v[i] for w,v in zip(weights,values)) for\
    \ i in range(len(values[0]))]"
  tests:
  - name: Core calculation
    code: result=scaled_dot_product_attention([1,0], [[1,0],[0,1]], [[10,0],[0,10]])
  - name: Edge behaviour
    code: 'assert result[0] > result[1]

      assert abs(sum(softmax([1,2,3]))-1)<1e-12'
  hints:
  - Translate the mathematical operation into explicit steps.
  - Check vector dimensions, empty inputs and numerical limits.
  - Run the tests and explain the meaning of the output.
  explanation: This exercise checks the numerical operation and a boundary condition.
