sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Text is split into sub-word tokens (BPE, WordPiece, SentencePiece); token counts drive context limits,
      cost and some odd model behaviours. Models never see characters or words, only token IDs; tokenisation explains
      context limits, API cost and surprising failures such as miscounting letters.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A tokenizer maps text to integer IDs from a fixed vocabulary (typically tens of thousands to a few
      hundred thousand entries); the model sees only those IDs.

      - Byte-pair encoding (BPE) starts from characters or bytes and repeatedly merges the most frequent adjacent
      pair; byte-level BPE can encode any UTF-8 text with no unknown tokens.

      - WordPiece (used by BERT) and Unigram (common in SentencePiece) are related sub-word schemes; SentencePiece
      treats spaces as ordinary symbols.

      - English averages roughly 3–4 characters per token; many other languages and code need more tokens for the
      same content.

      - Each model has its own tokenizer and special tokens (chat templates); always count and encode with the model''s
      own tokenizer.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Tokens are not words, and the same text produces different token counts on different models.

      - A model does not see individual letters inside a token, which is why spelling and letter-counting tasks
      trip it up.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def tokenize(text):\n    import re\n    return re.findall(r\"[A-Za-z0-9]+|[^\\w\\s]\", text.lower())\n\
      \nprint(tokenize(\"Hello, LLMs!\"))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: tokenization-code
  - type: item
    ref: tokenization-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A tokenizer maps text to integer IDs from a fixed vocabulary (typically tens of thousands to a few hundred
      thousand entries); the model sees only those IDs.

      - Byte-pair encoding (BPE) starts from characters or bytes and repeatedly merges the most frequent adjacent
      pair; byte-level BPE can encode any UTF-8 text with no unknown tokens.

      - WordPiece (used by BERT) and Unigram (common in SentencePiece) are related sub-word schemes; SentencePiece
      treats spaces as ordinary symbols.

      - English averages roughly 3–4 characters per token; many other languages and code need more tokens for the
      same content.

      - Each model has its own tokenizer and special tokens (chat templates); always count and encode with the model''s
      own tokenizer.


      **Limitations**

      - Tokens are not words, and the same text produces different token counts on different models.

      - A model does not see individual letters inside a token, which is why spelling and letter-counting tasks
      trip it up.'
  - type: item
    ref: tokenization-mcq
