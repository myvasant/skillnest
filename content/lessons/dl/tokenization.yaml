- id: tokenization-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for tokenisation. The tests cover the main calculation and an edge case.
  starterCode: "def tokenize(text):\n    raise NotImplementedError('Complete this function')"
  solution: "def tokenize(text):\n    import re\n    return re.findall(r\"[A-Za-z0-9]+|[^\\w\\s]\", text.lower())"
  tests:
  - name: Core calculation
    code: assert tokenize("Hello, LLMs!") == ["hello", ",", "llms", "!"]
  - name: Edge behaviour
    code: assert tokenize("") == []
