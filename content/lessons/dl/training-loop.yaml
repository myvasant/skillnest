id: dl.training-loop
concept: dl.training-loop
title: The training loop
subtitle: Mini-batches, epochs, validation, checkpoints and early stopping — and reading loss curves to diagnose
  problems
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Mini-batches, epochs, validation, checkpoints and early stopping — and reading loss curves to diagnose
  problems.
objectives:
- Explain the mathematical operation behind the training loop.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: Optimizing Model Parameters (PyTorch tutorial)
  url: https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html
  publisher: PyTorch Foundation
- title: A Recipe for Training Neural Networks
  url: https://karpathy.github.io/2019/04/25/recipe/
  publisher: Andrej Karpathy
- title: Saving and Loading Models
  url: https://docs.pytorch.org/tutorials/beginner/saving_loading_models.html
  publisher: PyTorch Foundation
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Mini-batches, epochs, validation, checkpoints and early stopping — and reading loss curves to diagnose
      problems. Almost all deep-learning work happens in or around this loop; writing it correctly and reading its
      curves is the core practical skill.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Each step loads a mini-batch, runs the forward pass, computes the loss, calls `zero_grad()`, `backward()`
      and `optimizer.step()`; one epoch is one pass over the training data.

      - Evaluate on validation data regularly in eval mode without gradients, and track training and validation
      loss side by side.

      - Read the curves — both high and flat means underfitting or a learning rate that is too low; training falling
      while validation rises means overfitting; spikes or NaN suggest a too-high learning rate or bad data.

      - Checkpoint model, optimiser, scheduler and step so training can resume; keep the best checkpoint by validation
      metric, and stop early when it stops improving.

      - Sanity check first — a correct model and loop can overfit a single small batch to near-zero loss.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Saving only the model weights is not enough to resume training exactly; optimiser and scheduler state
      matter too.

      - Falling training loss does not prove the model is learning something useful; judge by validation metrics.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def training_history(losses, tolerance=0.0):\n    if not losses: return {\"epochs\":0,\"improved\":False,\"\
      last_loss\":None}\n    return {\"epochs\":len(losses),\"improved\":losses[-1] < losses[0] - tolerance,\"last_loss\"\
      :losses[-1]}\n\nprint(training_history([1.0,0.7,0.4]))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: training-loop-code
  - type: item
    ref: training-loop-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Each step loads a mini-batch, runs the forward pass, computes the loss, calls `zero_grad()`, `backward()`
      and `optimizer.step()`; one epoch is one pass over the training data.

      - Evaluate on validation data regularly in eval mode without gradients, and track training and validation
      loss side by side.

      - Read the curves — both high and flat means underfitting or a learning rate that is too low; training falling
      while validation rises means overfitting; spikes or NaN suggest a too-high learning rate or bad data.

      - Checkpoint model, optimiser, scheduler and step so training can resume; keep the best checkpoint by validation
      metric, and stop early when it stops improving.

      - Sanity check first — a correct model and loop can overfit a single small batch to near-zero loss.


      **Limitations**

      - Saving only the model weights is not enough to resume training exactly; optimiser and scheduler state matter
      too.

      - Falling training loss does not prove the model is learning something useful; judge by validation metrics.'
  - type: item
    ref: training-loop-mcq
  - type: item
    ref: training-loop-tf
  - type: item
    ref: training-loop-code
items:
- id: training-loop-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of the training loop?
  explanation: Each step loads a mini-batch, runs the forward pass, computes the loss, calls `zero_grad()`, `backward()`
    and `optimizer.step()`; one epoch is one pass over the training data.
  options:
  - id: a
    text: Each step loads a mini-batch, runs the forward pass, computes the loss, calls `zero_grad()`, `backward()`
      and `optimizer.step()`; one epoch is one pass over the training data.
    correct: true
    feedback: 'Correct: this describes the operation or purpose introduced in the lesson.'
  - id: b
    text: Saving only the model weights is not enough to resume training exactly; optimiser and scheduler state
      matter too.
    feedback: This is a misconception; check the mathematical conditions and implementation details.
  - id: c
    text: A neural network learns without data, parameters or an objective.
    feedback: Training depends on data, a parameterised model and an objective or learning signal.
- id: training-loop-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Saving only the model weights is not enough to resume training exactly; optimiser and scheduler state
    matter too.
  answer: false
  explanation: The statement is a known misconception. Frameworks implement the operations; understanding them is
    necessary for debugging and choosing the right architecture.
- id: training-loop-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Explain the training loop using a small numerical example. Identify the input, operation and output, then
    describe one limitation or failure mode.
  rubric:
  - Describe the operation and relevant inputs/outputs accurately.
  - Use a numerical example or trace to support the explanation.
  - Identify a limitation, assumption or numerical issue.
  modelAnswer: Start with a small set of values and apply the operation step by step. Explain how each intermediate
    value is produced and what the final result represents. Then discuss a relevant edge case such as numerical
    stability, dimensions, scale or generalisation.
  explanation: A strong answer connects the equations to computation and recognises the assumptions behind the result.
- id: training-loop-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for the training loop. The tests cover the main calculation and an edge case.
  starterCode: "def training_history(losses, tolerance=0.0):\n    raise NotImplementedError('Complete this function')"
  solution: "def training_history(losses, tolerance=0.0):\n    if not losses: return {\"epochs\":0,\"improved\"\
    :False,\"last_loss\":None}\n    return {\"epochs\":len(losses),\"improved\":losses[-1] < losses[0] - tolerance,\"\
    last_loss\":losses[-1]}"
  tests:
  - name: Core calculation
    code: assert training_history([1.0,0.7,0.4])["improved"] is True
  - name: Edge behaviour
    code: 'assert training_history([0.4,0.5])["improved"] is False

      assert training_history([])["epochs"] == 0'
  hints:
  - Translate the mathematical operation into explicit steps.
  - Check vector dimensions, empty inputs and numerical limits.
  - Run the tests and explain the meaning of the output.
  explanation: This exercise checks the numerical operation and a boundary condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - training-loop-mcq
  - training-loop-tf
  - training-loop-code
