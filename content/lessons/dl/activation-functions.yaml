sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Non-linear functions (ReLU, GELU, sigmoid, tanh, softmax) let networks represent more than straight lines;
      without them, layers collapse into one. The choice of activation affects whether a deep network can learn
      at all (vanishing gradients) and what the output means (probabilities vs raw values).
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Stacked linear layers are still one linear function (`W2 @ (W1 @ x)` equals `(W2 @ W1) @ x`), so non-linear
      activations are what give depth its power.

      - ReLU `max(0, x)` is cheap and does not saturate for positive inputs; GELU and SiLU (Swish) are smooth variants
      common in Transformers.

      - Sigmoid (0 to 1) and tanh (-1 to 1) saturate — for large inputs their gradients approach zero, which slows
      learning in deep stacks.

      - Softmax turns a vector of logits into probabilities that sum to 1; it is used for multi-class outputs and
      inside attention.

      - Match the output layer to the task — no activation for regression, sigmoid for binary or multi-label, softmax
      for single-label multi-class.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- PyTorch''s `nn.CrossEntropyLoss` expects raw logits; applying softmax first is a common bug that hurts
      training.

      - ReLU units can "die" (output zero for every input) when learning rates are too high; Leaky ReLU and careful
      initialisation reduce this.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import math\ndef sigmoid(x):\n    if x >= 0: return 1/(1+math.exp(-x))\n    e=math.exp(x); return e/(1+e)\n\
      \ndef relu(x): return max(0, x)\n\nprint(round(sigmoid(0),2), relu(-3), relu(4))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: activation-functions-code
  - type: item
    ref: activation-functions-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Stacked linear layers are still one linear function (`W2 @ (W1 @ x)` equals `(W2 @ W1) @ x`), so non-linear
      activations are what give depth its power.

      - ReLU `max(0, x)` is cheap and does not saturate for positive inputs; GELU and SiLU (Swish) are smooth variants
      common in Transformers.

      - Sigmoid (0 to 1) and tanh (-1 to 1) saturate — for large inputs their gradients approach zero, which slows
      learning in deep stacks.

      - Softmax turns a vector of logits into probabilities that sum to 1; it is used for multi-class outputs and
      inside attention.

      - Match the output layer to the task — no activation for regression, sigmoid for binary or multi-label, softmax
      for single-label multi-class.


      **Limitations**

      - PyTorch''s `nn.CrossEntropyLoss` expects raw logits; applying softmax first is a common bug that hurts training.

      - ReLU units can "die" (output zero for every input) when learning rates are too high; Leaky ReLU and careful
      initialisation reduce this.'
