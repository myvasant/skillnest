id: dl.activation-functions
concept: dl.activation-functions
title: Activation functions
subtitle: Non-linear functions (ReLU, GELU, sigmoid, tanh, softmax) let networks represent more than straight lines;
  without them, layers collapse into one
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Non-linear functions (ReLU, GELU, sigmoid, tanh, softmax) let networks represent more than straight lines;
  without them, layers collapse into one.
