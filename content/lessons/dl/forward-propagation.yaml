id: dl.forward-propagation
concept: dl.forward-propagation
title: Forward propagation
subtitle: Inputs flow through layers of matrix multiplications and activations to produce predictions
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Inputs flow through layers of matrix multiplications and activations to produce predictions.
objectives:
- Explain the mathematical operation behind forward propagation.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: Forward Propagation, Backward Propagation, and Computational Graphs
  url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  publisher: Dive into Deep Learning
- title: Build the Neural Network (PyTorch tutorial)
  url: https://docs.pytorch.org/tutorials/beginner/basics/buildmodel_tutorial.html
  publisher: PyTorch Foundation
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Inputs flow through layers of matrix multiplications and activations to produce predictions. Tracing the
      forward pass and its tensor shapes is how you understand what a model computes and how you find most bugs.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Each layer computes `h = activation(h_prev @ W + b)`; the final layer outputs logits (classification)
      or values (regression).

      - Track tensor shapes at every step; most bugs are shape mismatches or applying softmax or a sum over the
      wrong dimension.

      - Broadcasting adds the bias vector to every row of the batch.

      - Frameworks record each operation during the forward pass to build the computation graph used later for backpropagation.

      - Inference is just the forward pass; in PyTorch call `model.eval()` and wrap it in `torch.no_grad()` or `torch.inference_mode()`.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Forgetting `model.eval()` leaves dropout and batch normalisation in training mode at inference, giving
      noisy, worse predictions.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def dense_forward(inputs, weights, biases):\n    if len(weights) != len(biases): raise ValueError(\"\
      one bias per neuron required\")\n    if any(len(row) != len(inputs) for row in weights): raise ValueError(\"\
      weight dimension mismatch\")\n    return [sum(x*w for x,w in zip(inputs,row)) + bias for row,bias in zip(weights,biases)]\n\
      \nprint(dense_forward([2,3], [[1,2],[0.5,-1]], [1,0]))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: forward-propagation-code
  - type: item
    ref: forward-propagation-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Each layer computes `h = activation(h_prev @ W + b)`; the final layer outputs logits (classification) or
      values (regression).

      - Track tensor shapes at every step; most bugs are shape mismatches or applying softmax or a sum over the
      wrong dimension.

      - Broadcasting adds the bias vector to every row of the batch.

      - Frameworks record each operation during the forward pass to build the computation graph used later for backpropagation.

      - Inference is just the forward pass; in PyTorch call `model.eval()` and wrap it in `torch.no_grad()` or `torch.inference_mode()`.


      **Limitations**

      - Forgetting `model.eval()` leaves dropout and batch normalisation in training mode at inference, giving noisy,
      worse predictions.'
  - type: item
    ref: forward-propagation-mcq
  - type: item
    ref: forward-propagation-tf
  - type: item
    ref: forward-propagation-code
