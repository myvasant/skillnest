  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of forward propagation?
  explanation: Each layer computes `h = activation(h_prev @ W + b)`; the final layer outputs logits (classification)
    or values (regression).
  options:
  - id: a
    text: Each layer computes `h = activation(h_prev @ W + b)`; the final layer outputs logits (classification)
      or values (regression).
    correct: true
    feedback: 'Correct: this describes the operation or purpose introduced in the lesson.'
  - id: b
    text: Forgetting `model.eval()` leaves dropout and batch normalisation in training mode at inference, giving
      noisy, worse predictions.
    feedback: This is a misconception; check the mathematical conditions and implementation details.
  - id: c
    text: A neural network learns without data, parameters or an objective.
    feedback: Training depends on data, a parameterised model and an objective or learning signal.
- id: forward-propagation-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Forgetting `model.eval()` leaves dropout and batch normalisation in training mode at inference, giving
    noisy, worse predictions.
  answer: false
  explanation: The statement is a known misconception. Frameworks implement the operations; understanding them is
    necessary for debugging and choosing the right architecture.
- id: forward-propagation-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Explain forward propagation using a small numerical example. Identify the input, operation and output,
    then describe one limitation or failure mode.
  rubric:
  - Describe the operation and relevant inputs/outputs accurately.
  - Use a numerical example or trace to support the explanation.
  - Identify a limitation, assumption or numerical issue.
  modelAnswer: Start with a small set of values and apply the operation step by step. Explain how each intermediate
    value is produced and what the final result represents. Then discuss a relevant edge case such as numerical
    stability, dimensions, scale or generalisation.
  explanation: A strong answer connects the equations to computation and recognises the assumptions behind the result.
- id: forward-propagation-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for forward propagation. The tests cover the main calculation and an edge case.
  starterCode: "def dense_forward(inputs, weights, biases):\n    raise NotImplementedError('Complete this function')"
  solution: "def dense_forward(inputs, weights, biases):\n    if len(weights) != len(biases): raise ValueError(\"\
    one bias per neuron required\")\n    if any(len(row) != len(inputs) for row in weights): raise ValueError(\"\
    weight dimension mismatch\")\n    return [sum(x*w for x,w in zip(inputs,row)) + bias for row,bias in zip(weights,biases)]"
  tests:
  - name: Core calculation
    code: assert dense_forward([2,3], [[1,2],[0.5,-1]], [1,0]) == [9.0,-2.0]
  - name: Edge behaviour
    code: 'try: dense_forward([1], [[1,2]], [0])

      except ValueError: pass

      else: raise AssertionError("dimension mismatch must fail")'
  hints:
  - Translate the mathematical operation into explicit steps.
  - Check vector dimensions, empty inputs and numerical limits.
  - Run the tests and explain the meaning of the output.
  explanation: This exercise checks the numerical operation and a boundary condition.
