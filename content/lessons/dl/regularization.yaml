id: dl.regularization
concept: dl.regularization
title: Regularisation and normalisation
subtitle: Dropout, weight decay, data augmentation, batch and layer normalisation keep deep networks trainable and
  general
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Dropout, weight decay, data augmentation, batch and layer normalisation keep deep networks trainable and
  general.
objectives:
- Explain the mathematical operation behind regularisation and normalisation.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: 'Dive into Deep Learning: Dropout'
  url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
  publisher: Zhang, Lipton, Li and Smola
- title: 'Dive into Deep Learning: Batch Normalization'
  url: https://d2l.ai/chapter_convolutional-modern/batch-norm.html
  publisher: Zhang, Lipton, Li and Smola
- title: Layer Normalization
  url: https://arxiv.org/abs/1607.06450
  publisher: arXiv (Ba, Kiros and Hinton)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Dropout, weight decay, data augmentation, batch and layer normalisation keep deep networks trainable and
      general. Deep networks have enough capacity to memorise their training data and can be unstable to train;
      these techniques address both problems.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Dropout zeroes each activation with probability `p` during training and scales the rest by `1 / (1
      - p)`; it is switched off in eval mode.

      - Weight decay penalises large weights; data augmentation (crops, flips, noise) creates plausible new training
      examples.

      - Batch normalisation normalises each feature across the batch and then rescales it with learned parameters;
      at inference it uses running averages collected during training.

      - Layer normalisation normalises across the features of each example, independent of batch size, and is standard
      in Transformers — many recent LLMs use the simpler RMSNorm.

      - Early stopping and more (or more varied) data are regularisers too.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Normalisation layers mainly stabilise and speed up training; any regularising effect (as with batch
      norm) is a side effect.

      - Batch normalisation is unreliable with very small batches; layer or group normalisation is used instead.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def l2_penalty(weights, strength):\n    if strength < 0: raise ValueError(\"strength cannot be negative\"\
      )\n    return strength * sum(w*w for w in weights)\n\nprint(l2_penalty([1,-2,3], 0.1))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: regularization-code
  - type: item
    ref: regularization-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Dropout zeroes each activation with probability `p` during training and scales the rest by `1 / (1 - p)`;
      it is switched off in eval mode.

      - Weight decay penalises large weights; data augmentation (crops, flips, noise) creates plausible new training
      examples.

      - Batch normalisation normalises each feature across the batch and then rescales it with learned parameters;
      at inference it uses running averages collected during training.

      - Layer normalisation normalises across the features of each example, independent of batch size, and is standard
      in Transformers — many recent LLMs use the simpler RMSNorm.

      - Early stopping and more (or more varied) data are regularisers too.


      **Limitations**

      - Normalisation layers mainly stabilise and speed up training; any regularising effect (as with batch norm)
      is a side effect.

      - Batch normalisation is unreliable with very small batches; layer or group normalisation is used instead.'
  - type: item
    ref: regularization-mcq
  - type: item
    ref: regularization-tf
  - type: item
    ref: regularization-code
items:
- id: regularization-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of regularisation and normalisation?
  explanation: Dropout zeroes each activation with probability `p` during training and scales the rest by `1 / (1
    - p)`; it is switched off in eval mode.
  options:
  - id: a
    text: Dropout zeroes each activation with probability `p` during training and scales the rest by `1 / (1 - p)`;
      it is switched off in eval mode.
    correct: true
    feedback: 'Correct: this describes the operation or purpose introduced in the lesson.'
  - id: b
    text: Normalisation layers mainly stabilise and speed up training; any regularising effect (as with batch norm)
      is a side effect.
    feedback: This is a misconception; check the mathematical conditions and implementation details.
  - id: c
    text: A neural network learns without data, parameters or an objective.
    feedback: Training depends on data, a parameterised model and an objective or learning signal.
- id: regularization-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Normalisation layers mainly stabilise and speed up training; any regularising effect (as with batch norm)
    is a side effect.
  answer: false
  explanation: The statement is a known misconception. Frameworks implement the operations; understanding them is
    necessary for debugging and choosing the right architecture.
- id: regularization-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Explain regularisation and normalisation using a small numerical example. Identify the input, operation
    and output, then describe one limitation or failure mode.
  rubric:
  - Describe the operation and relevant inputs/outputs accurately.
  - Use a numerical example or trace to support the explanation.
  - Identify a limitation, assumption or numerical issue.
  modelAnswer: Start with a small set of values and apply the operation step by step. Explain how each intermediate
    value is produced and what the final result represents. Then discuss a relevant edge case such as numerical
    stability, dimensions, scale or generalisation.
  explanation: A strong answer connects the equations to computation and recognises the assumptions behind the result.
- id: regularization-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for regularisation and normalisation. The tests cover the main calculation
    and an edge case.
  starterCode: "def l2_penalty(weights, strength):\n    raise NotImplementedError('Complete this function')"
  solution: "def l2_penalty(weights, strength):\n    if strength < 0: raise ValueError(\"strength cannot be negative\"\
    )\n    return strength * sum(w*w for w in weights)"
  tests:
  - name: Core calculation
    code: assert abs(l2_penalty([1,-2,3],0.1)-1.4)<1e-12
  - name: Edge behaviour
    code: 'assert l2_penalty([],0.1) == 0

      try: l2_penalty([1],-1)

      except ValueError: pass

      else: raise AssertionError("negative strength must fail")'
  hints:
  - Translate the mathematical operation into explicit steps.
  - Check vector dimensions, empty inputs and numerical limits.
  - Run the tests and explain the meaning of the output.
  explanation: This exercise checks the numerical operation and a boundary condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - regularization-mcq
  - regularization-tf
  - regularization-code
