id: dl.neurons-layers
concept: dl.neurons-layers
title: Neurons, Weights and Layers
subtitle: From one weighted sum to a network that solves XOR
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Build neural networks from scratch in pure Python. A neuron is a weighted sum plus a bias passed through
  an activation; a layer is many neurons computed as a matrix–vector product; stacking layers with
  non-linear activations lets a tiny 2-2-1 network solve XOR, which no single neuron can.
objectives:
  - Compute a neuron's output as activation(w · x + b) by hand and in code.
  - Explain the perceptron, its linear decision boundary, and why a single perceptron cannot compute XOR.
  - Implement a dense layer as a matrix–vector product with list comprehensions, and apply it to a batch.
  - Count the parameters of a multilayer perceptron from its layer sizes.
  - Show algebraically and in code that stacked linear layers collapse into one, and explain why non-linear activations prevent this.
  - Trace a 2-2-1 network with hand-chosen weights that solves XOR, and relate it to PyTorch's nn.Linear.
sources:
  - title: "Dive into Deep Learning: Multilayer Perceptrons"
    url: https://d2l.ai/chapter_multilayer-perceptrons/index.html
    publisher: Zhang, Lipton, Li and Smola
  - title: "Deep Learning, chapter 6: Deep Feedforward Networks (including 'Example: Learning XOR')"
    url: https://www.deeplearningbook.org/contents/mlp.html
    publisher: Goodfellow, Bengio and Courville (MIT Press)
  - title: torch.nn.Linear
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html
    publisher: PyTorch Foundation
