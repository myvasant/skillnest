id: dl.pretraining-finetuning
concept: dl.pretraining-finetuning
title: Pretraining, transfer learning and fine-tuning
subtitle: Models pretrained on huge corpora with self-supervised objectives are adapted with fine-tuning, instruction
  tuning, preference tuning and parameter-efficient methods such as LoRA
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Models pretrained on huge corpora with self-supervised objectives are adapted with fine-tuning, instruction
  tuning, preference tuning and parameter-efficient methods such as LoRA.
objectives:
- Explain the mathematical operation behind pretraining, transfer learning and fine-tuning.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: 'LoRA: Low-Rank Adaptation of Large Language Models'
  url: https://arxiv.org/abs/2106.09685
  publisher: arXiv (Hu et al.)
- title: Training language models to follow instructions with human feedback (InstructGPT)
  url: https://arxiv.org/abs/2203.02155
  publisher: arXiv (Ouyang et al.)
- title: PEFT documentation
  url: https://huggingface.co/docs/peft/index
  publisher: Hugging Face
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Models pretrained on huge corpora with self-supervised objectives are adapted with fine-tuning, instruction
      tuning, preference tuning and parameter-efficient methods such as LoRA. Almost nobody trains large models
      from scratch; adapting pretrained models is how teams get strong results with modest data and compute.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Pretraining is self-supervised learning on huge corpora — next-token prediction for decoders, masked-token
      prediction for BERT-style encoders — and is by far the most expensive stage.

      - Transfer learning reuses pretrained weights for a new task with far less data, either fine-tuning all weights
      or freezing most and training a small head.

      - Assistant models are post-trained with supervised fine-tuning (SFT) on instruction–response pairs, then
      preference tuning such as RLHF (reward model plus PPO) or DPO.

      - LoRA freezes the base weights and learns a low-rank update `W + B @ A` with small rank `r`, cutting trainable
      parameters by orders of magnitude; QLoRA does this on a 4-bit quantised base.

      - Aggressive fine-tuning can cause catastrophic forgetting of general abilities; low learning rates, mixing
      in general data and parameter-efficient methods reduce it.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Fine-tuning is not a reliable way to add new factual knowledge; it mainly changes behaviour, style
      and format, and retrieval is usually better for facts.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def update_scope(base_parameters, trainable_parameters):\n    if not set(trainable_parameters).issubset(base_parameters):\
      \ raise ValueError(\"unknown parameter name\")\n    return {name: (\"updated\" if name in trainable_parameters\
      \ else \"frozen\") for name in base_parameters}\n\nprint(update_scope({\"encoder\":\"w1\",\"head\":\"w2\"\
      }, [\"head\"]))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: pretraining-finetuning-code
  - type: item
    ref: pretraining-finetuning-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Pretraining is self-supervised learning on huge corpora — next-token prediction for decoders, masked-token
      prediction for BERT-style encoders — and is by far the most expensive stage.

      - Transfer learning reuses pretrained weights for a new task with far less data, either fine-tuning all weights
      or freezing most and training a small head.

      - Assistant models are post-trained with supervised fine-tuning (SFT) on instruction–response pairs, then
      preference tuning such as RLHF (reward model plus PPO) or DPO.

      - LoRA freezes the base weights and learns a low-rank update `W + B @ A` with small rank `r`, cutting trainable
      parameters by orders of magnitude; QLoRA does this on a 4-bit quantised base.

      - Aggressive fine-tuning can cause catastrophic forgetting of general abilities; low learning rates, mixing
      in general data and parameter-efficient methods reduce it.


      **Limitations**

      - Fine-tuning is not a reliable way to add new factual knowledge; it mainly changes behaviour, style and format,
      and retrieval is usually better for facts.'
  - type: item
    ref: pretraining-finetuning-mcq
  - type: item
    ref: pretraining-finetuning-tf
  - type: item
    ref: pretraining-finetuning-code
