  solution: "def update_scope(base_parameters, trainable_parameters):\n    if not set(trainable_parameters).issubset(base_parameters):\
    \ raise ValueError(\"unknown parameter name\")\n    return {name: (\"updated\" if name in trainable_parameters\
    \ else \"frozen\") for name in base_parameters}"
