  explanation: Pretraining is self-supervised learning on huge corpora — next-token prediction for decoders, masked-token
    prediction for BERT-style encoders — and is by far the most expensive stage.
  options:
  - id: a
    text: Pretraining is self-supervised learning on huge corpora — next-token prediction for decoders, masked-token
      prediction for BERT-style encoders — and is by far the most expensive stage.
    correct: true
