id: dl.optimizers
concept: dl.optimizers
title: Optimisers and learning rates
subtitle: SGD, momentum and Adam update weights from gradients; learning-rate schedules and warm-up stabilise training
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: SGD, momentum and Adam update weights from gradients; learning-rate schedules and warm-up stabilise training.
objectives:
- Explain the mathematical operation behind optimisers and learning rates.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: 'Adam: A Method for Stochastic Optimization'
  url: https://arxiv.org/abs/1412.6980
  publisher: arXiv (Kingma and Ba)
- title: Decoupled Weight Decay Regularization (AdamW)
  url: https://arxiv.org/abs/1711.05101
  publisher: arXiv (Loshchilov and Hutter)
- title: torch.optim
  url: https://docs.pytorch.org/docs/stable/optim.html
  publisher: PyTorch Foundation
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: SGD, momentum and Adam update weights from gradients; learning-rate schedules and warm-up stabilise training.
      The optimiser and learning rate decide whether training converges, diverges or crawls — they are the first
      things to check when training goes wrong.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- SGD updates `w = w - lr * grad` on each mini-batch; momentum keeps a running velocity that smooths
      and accelerates updates.

      - Adam keeps running averages of gradients and squared gradients to give every parameter an adaptive step
      size; AdamW decouples weight decay and is the usual default for Transformers.

      - The learning rate is the most important hyperparameter — too high and the loss spikes or becomes NaN, too
      low and training crawls.

      - A short linear warm-up followed by cosine or linear decay is standard for Transformers; warm-up avoids unstable
      early steps.

      - Gradient clipping (for example to a global norm of 1.0) prevents occasional huge updates from wrecking training.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Adam is not always better than SGD; well-tuned SGD with momentum still generalises very well for many
      vision models.

      - Adding an L2 penalty to the loss with Adam is not the same as AdamW''s decoupled weight decay.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def gradient_descent_step(parameter, gradient, learning_rate):\n    if learning_rate <= 0: raise ValueError(\"\
      learning rate must be positive\")\n    return parameter - learning_rate * gradient\n\nprint(gradient_descent_step(5.0,\
      \ 2.0, 0.1))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: optimizers-code
  - type: item
    ref: optimizers-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - SGD updates `w = w - lr * grad` on each mini-batch; momentum keeps a running velocity that smooths and accelerates
      updates.

      - Adam keeps running averages of gradients and squared gradients to give every parameter an adaptive step
      size; AdamW decouples weight decay and is the usual default for Transformers.

      - The learning rate is the most important hyperparameter — too high and the loss spikes or becomes NaN, too
      low and training crawls.

      - A short linear warm-up followed by cosine or linear decay is standard for Transformers; warm-up avoids unstable
      early steps.

      - Gradient clipping (for example to a global norm of 1.0) prevents occasional huge updates from wrecking training.


      **Limitations**

      - Adam is not always better than SGD; well-tuned SGD with momentum still generalises very well for many vision
      models.

      - Adding an L2 penalty to the loss with Adam is not the same as AdamW''s decoupled weight decay.'
