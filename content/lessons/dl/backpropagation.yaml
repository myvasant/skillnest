id: dl.backpropagation
concept: dl.backpropagation
title: Backpropagation and automatic differentiation
subtitle: The chain rule applied backwards through the computation graph gives the gradient of the loss for every
  weight efficiently
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: The chain rule applied backwards through the computation graph gives the gradient of the loss for every
  weight efficiently.
objectives:
- Explain the mathematical operation behind backpropagation and automatic differentiation.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
