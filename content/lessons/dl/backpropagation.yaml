sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: The chain rule applied backwards through the computation graph gives the gradient of the loss for every
      weight efficiently. Every neural network is trained with gradients computed this way; understanding it explains
      vanishing gradients, memory use during training and many training bugs.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Backpropagation applies the chain rule from the loss back through each operation, reusing intermediate
      results so all gradients cost about as much as a couple of forward passes.

      - Reverse-mode automatic differentiation computes exact gradients from the recorded graph — not numerical
      approximations — and is efficient for many parameters and one scalar loss.

      - In PyTorch, `loss.backward()` fills each parameter''s `.grad`; gradients accumulate, so call `optimizer.zero_grad()`
      every step.

      - Vanishing and exploding gradients are tackled with good initialisation, ReLU-family activations, normalisation,
      residual connections and gradient clipping.

      - Forward-pass activations are kept for the backward pass, which is why training needs far more memory than
      inference.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Backpropagation only computes gradients; the optimiser is what uses them to update the weights.

      - Forgetting `zero_grad()` silently adds gradients from previous steps together.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def chain_rule(local_derivatives):\n    result=1\n    for derivative in local_derivatives: result *=\
      \ derivative\n    return result\n\nprint(chain_rule([2, 3, 4]))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: backpropagation-code
  - type: item
    ref: backpropagation-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Backpropagation applies the chain rule from the loss back through each operation, reusing intermediate results
      so all gradients cost about as much as a couple of forward passes.

      - Reverse-mode automatic differentiation computes exact gradients from the recorded graph — not numerical
      approximations — and is efficient for many parameters and one scalar loss.

      - In PyTorch, `loss.backward()` fills each parameter''s `.grad`; gradients accumulate, so call `optimizer.zero_grad()`
      every step.

      - Vanishing and exploding gradients are tackled with good initialisation, ReLU-family activations, normalisation,
      residual connections and gradient clipping.

      - Forward-pass activations are kept for the backward pass, which is why training needs far more memory than
      inference.


      **Limitations**

      - Backpropagation only computes gradients; the optimiser is what uses them to update the weights.

      - Forgetting `zero_grad()` silently adds gradients from previous steps together.'
