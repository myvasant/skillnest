id: dl.loss-functions
concept: dl.loss-functions
title: Loss functions
subtitle: A loss scores how wrong predictions are — MSE for regression, cross-entropy for classification and next-token
  prediction
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: A loss scores how wrong predictions are — MSE for regression, cross-entropy for classification and next-token
  prediction.
objectives:
- Explain the mathematical operation behind loss functions.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: torch.nn — loss functions
  url: https://docs.pytorch.org/docs/stable/nn.html
  publisher: PyTorch Foundation
- title: 'Dive into Deep Learning: Softmax Regression (cross-entropy loss)'
  url: https://d2l.ai/chapter_linear-classification/softmax-regression.html
  publisher: Zhang, Lipton, Li and Smola
- title: 'Deep Learning, chapter 6: Deep Feedforward Networks'
  url: https://www.deeplearningbook.org/contents/mlp.html
  publisher: Goodfellow, Bengio and Courville (MIT Press)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A loss scores how wrong predictions are — MSE for regression, cross-entropy for classification and next-token
      prediction. The loss is the only signal the network learns from; choosing the wrong one, or applying it to
      the wrong outputs, trains the wrong behaviour.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Mean squared error `mean((y - y_hat)**2)` suits regression; MAE or Huber loss are more robust to outliers.

      - Cross-entropy is `-log(p_correct)` averaged over examples; it punishes confident wrong answers heavily,
      and minimising it is maximum-likelihood estimation.

      - In PyTorch use `BCEWithLogitsLoss` for binary or multi-label tasks and `CrossEntropyLoss` for single-label
      multi-class tasks, both on raw logits.

      - Language models minimise cross-entropy on the next token; perplexity is `exp(mean cross-entropy)`.

      - The loss is what you optimise; metrics such as accuracy or F1 are what you report, and the two can disagree.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A lower loss does not always mean a better metric, especially for thresholded accuracy or imbalanced
      data.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def mean_squared_error(actual, predicted):\n    if len(actual) != len(predicted) or not actual: raise\
      \ ValueError(\"non-empty arrays of equal length required\")\n    return sum((a-p)**2 for a,p in zip(actual,predicted))/len(actual)\n\
      \nprint(mean_squared_error([1,2,3],[1,3,2]))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: loss-functions-code
  - type: item
    ref: loss-functions-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Mean squared error `mean((y - y_hat)**2)` suits regression; MAE or Huber loss are more robust to outliers.

      - Cross-entropy is `-log(p_correct)` averaged over examples; it punishes confident wrong answers heavily,
      and minimising it is maximum-likelihood estimation.

      - In PyTorch use `BCEWithLogitsLoss` for binary or multi-label tasks and `CrossEntropyLoss` for single-label
      multi-class tasks, both on raw logits.

      - Language models minimise cross-entropy on the next token; perplexity is `exp(mean cross-entropy)`.

      - The loss is what you optimise; metrics such as accuracy or F1 are what you report, and the two can disagree.


      **Limitations**

      - A lower loss does not always mean a better metric, especially for thresholded accuracy or imbalanced data.'
  - type: item
    ref: loss-functions-mcq
  - type: item
    ref: loss-functions-tf
  - type: item
    ref: loss-functions-code
