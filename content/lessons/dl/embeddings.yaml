id: dl.embeddings
concept: dl.embeddings
title: Embeddings
subtitle: Learned dense vectors represent tokens, items or users so that similar things end up close together
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Learned dense vectors represent tokens, items or users so that similar things end up close together.
objectives:
- Explain the mathematical operation behind embeddings.
- Trace a small numerical example and interpret its output.
- Identify a training or inference limitation that affects real systems.
sources:
- title: torch.nn.Embedding
  url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Embedding.html
  publisher: PyTorch Foundation
- title: Efficient Estimation of Word Representations in Vector Space (word2vec)
  url: https://arxiv.org/abs/1301.3781
  publisher: arXiv (Mikolov et al.)
- title: Sentence Transformers documentation
  url: https://sbert.net/
  publisher: Sentence Transformers
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Learned dense vectors represent tokens, items or users so that similar things end up close together. Embeddings
      are how networks consume discrete things like words and products, and they power semantic search, recommendations
      and RAG retrieval.
- id: mental-model
  title: Core mechanism and assumptions
  kind: mental-model
  blocks:
  - type: markdown
    body: '- An embedding layer is a learned lookup table — row `i` of a `(num_items, dim)` matrix is the vector
      for item `i`, equivalent to multiplying a one-hot vector by a weight matrix.

      - Training moves items that appear in similar contexts or lead to similar outcomes towards similar vectors
      (word2vec, recommender embeddings).

      - Similarity is usually measured with cosine similarity or the dot product.

      - Sentence and document embedding models (used for RAG) are trained with contrastive objectives so that related
      texts land close together.

      - Individual embedding dimensions are learned axes that rarely mean anything human-readable.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Vectors from different embedding models, or different versions of one model, live in different spaces
      and cannot be compared or mixed.

      - Close embeddings mean "used similarly in training data", not "equivalent" or "true" — antonyms often sit
      close together.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python example isolates the operation. Production frameworks use tensor libraries and
      automatic differentiation, but the underlying arithmetic remains the same.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import math\ndef cosine_similarity(a,b):\n    if len(a)!=len(b) or not a: raise ValueError(\"vectors\
      \ must have equal non-zero dimensions\")\n    na=math.sqrt(sum(x*x for x in a)); nb=math.sqrt(sum(x*x for\
      \ x in b))\n    if na==0 or nb==0: raise ValueError(\"zero vector has no direction\")\n    return sum(x*y\
      \ for x,y in zip(a,b))/(na*nb)\n\nprint(round(cosine_similarity([1,0],[1,1]),3))"
    caption: Runnable numerical model using Python standard-library operations.
- id: practice
  title: Practice and trace
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper, inspect intermediate values and test at least one boundary condition. Explain what
      the calculation means for training or inference.
  - type: item
    ref: embeddings-code
  - type: item
    ref: embeddings-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - An embedding layer is a learned lookup table — row `i` of a `(num_items, dim)` matrix is the vector for
      item `i`, equivalent to multiplying a one-hot vector by a weight matrix.

      - Training moves items that appear in similar contexts or lead to similar outcomes towards similar vectors
      (word2vec, recommender embeddings).

      - Similarity is usually measured with cosine similarity or the dot product.

      - Sentence and document embedding models (used for RAG) are trained with contrastive objectives so that related
      texts land close together.

      - Individual embedding dimensions are learned axes that rarely mean anything human-readable.


      **Limitations**

      - Vectors from different embedding models, or different versions of one model, live in different spaces and
      cannot be compared or mixed.

      - Close embeddings mean "used similarly in training data", not "equivalent" or "true" — antonyms often sit
      close together.'
  - type: item
    ref: embeddings-mcq
  - type: item
    ref: embeddings-tf
  - type: item
    ref: embeddings-code
items:
- id: embeddings-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of embeddings?
  explanation: An embedding layer is a learned lookup table — row `i` of a `(num_items, dim)` matrix is the vector
    for item `i`, equivalent to multiplying a one-hot vector by a weight matrix.
  options:
  - id: a
    text: An embedding layer is a learned lookup table — row `i` of a `(num_items, dim)` matrix is the vector for
      item `i`, equivalent to multiplying a one-hot vector by a weight matrix.
    correct: true
    feedback: 'Correct: this describes the operation or purpose introduced in the lesson.'
  - id: b
    text: Vectors from different embedding models, or different versions of one model, live in different spaces
      and cannot be compared or mixed.
    feedback: This is a misconception; check the mathematical conditions and implementation details.
  - id: c
    text: A neural network learns without data, parameters or an objective.
    feedback: Training depends on data, a parameterised model and an objective or learning signal.
- id: embeddings-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Vectors from different embedding models, or different versions of one model, live in different spaces
    and cannot be compared or mixed.
  answer: false
  explanation: The statement is a known misconception. Frameworks implement the operations; understanding them is
    necessary for debugging and choosing the right architecture.
- id: embeddings-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Explain embeddings using a small numerical example. Identify the input, operation and output, then describe
    one limitation or failure mode.
  rubric:
  - Describe the operation and relevant inputs/outputs accurately.
  - Use a numerical example or trace to support the explanation.
  - Identify a limitation, assumption or numerical issue.
  modelAnswer: Start with a small set of values and apply the operation step by step. Explain how each intermediate
    value is produced and what the final result represents. Then discuss a relevant edge case such as numerical
    stability, dimensions, scale or generalisation.
  explanation: A strong answer connects the equations to computation and recognises the assumptions behind the result.
- id: embeddings-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for embeddings. The tests cover the main calculation and an edge case.
  starterCode: "import math\n\ndef cosine_similarity(a, b):\n    raise NotImplementedError('Complete this function')"
  solution: "import math\ndef cosine_similarity(a,b):\n    if len(a)!=len(b) or not a: raise ValueError(\"vectors\
    \ must have equal non-zero dimensions\")\n    na=math.sqrt(sum(x*x for x in a)); nb=math.sqrt(sum(x*x for x\
    \ in b))\n    if na==0 or nb==0: raise ValueError(\"zero vector has no direction\")\n    return sum(x*y for\
    \ x,y in zip(a,b))/(na*nb)"
  tests:
  - name: Core calculation
    code: assert abs(cosine_similarity([1,0],[1,1])-2**-0.5)<1e-9
  - name: Edge behaviour
    code: 'assert cosine_similarity([1,0],[1,0]) == 1

      try: cosine_similarity([0,0],[1,0])

      except ValueError: pass

      else: raise AssertionError("zero vector must fail")'
  hints:
  - Translate the mathematical operation into explicit steps.
  - Check vector dimensions, empty inputs and numerical limits.
  - Run the tests and explain the meaning of the output.
  explanation: This exercise checks the numerical operation and a boundary condition.
