id: data.data-cleaning
concept: data.data-cleaning
title: Data cleaning
subtitle: Handle missing values, duplicates, wrong types, inconsistent categories and outliers deliberately, documenting
  every decision
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Handle missing values, duplicates, wrong types, inconsistent categories and outliers deliberately, documenting
  every decision.
objectives:
- Explain the role of data cleaning in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: Working with missing data
  url: https://pandas.pydata.org/docs/user_guide/missing_data.html
  publisher: pandas
- title: pandas.DataFrame.drop_duplicates
  url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
  publisher: pandas
- title: Imputation of missing values
  url: https://scikit-learn.org/stable/modules/impute.html
  publisher: scikit-learn
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Handle missing values, duplicates, wrong types, inconsistent categories and outliers deliberately, documenting
      every decision. Models and dashboards faithfully learn from whatever you feed them, including duplicates,
      typos and placeholder values, so cleaning choices directly change results and must be deliberate and recorded.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Count missing values with `df.isna().sum()`, then decide per column whether to drop, fill (median,
      mode, a sentinel category) or keep missingness as its own feature.

      - Watch for disguised missing values such as `-1`, `999`, `"N/A"` or empty strings, and convert them with
      `na_values=` at load time or `replace`.

      - Fix types explicitly with `pd.to_numeric(..., errors="coerce")`, `pd.to_datetime(...)` and `astype("category")`
      for low-cardinality text.

      - Normalise categories (`.str.strip().str.lower()`, mapping synonyms) and remove duplicate records with `drop_duplicates(subset=[...])`.

      - Write cleaning as a script or function that goes from raw data to clean data, so every step can be rerun
      and reviewed.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Dropping every row with any missing value is not neutral; it can discard most of the data and bias
      what remains.

      - Outliers are not automatically errors; investigate them first, because some are the most important records
      (fraud, failures).

      - Computing fill values on the whole dataset leaks test information; fit imputation on the training split
      only.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def clean_names(values):\n    return [value.strip().lower() for value in values if isinstance(value,\
      \ str) and value.strip()]\n\nprint(clean_names([\" Ada \", None, \"\", \"GRACE\"]))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: data-cleaning-code
  - type: item
    ref: data-cleaning-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Count missing values with `df.isna().sum()`, then decide per column whether to drop, fill (median, mode,
      a sentinel category) or keep missingness as its own feature.

      - Watch for disguised missing values such as `-1`, `999`, `"N/A"` or empty strings, and convert them with
      `na_values=` at load time or `replace`.

      - Fix types explicitly with `pd.to_numeric(..., errors="coerce")`, `pd.to_datetime(...)` and `astype("category")`
      for low-cardinality text.

      - Normalise categories (`.str.strip().str.lower()`, mapping synonyms) and remove duplicate records with `drop_duplicates(subset=[...])`.

      - Write cleaning as a script or function that goes from raw data to clean data, so every step can be rerun
      and reviewed.


      **Watch for**

      - Dropping every row with any missing value is not neutral; it can discard most of the data and bias what
      remains.

      - Outliers are not automatically errors; investigate them first, because some are the most important records
      (fraud, failures).

      - Computing fill values on the whole dataset leaks test information; fit imputation on the training split
      only.'
  - type: item
    ref: data-cleaning-mcq
  - type: item
    ref: data-cleaning-tf
  - type: item
    ref: data-cleaning-code
items:
- id: data-cleaning-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of data cleaning?
  explanation: Count missing values with `df.isna().sum()`, then decide per column whether to drop, fill (median,
    mode, a sentinel category) or keep missingness as its own feature.
  options:
  - id: a
    text: Count missing values with `df.isna().sum()`, then decide per column whether to drop, fill (median, mode,
      a sentinel category) or keep missingness as its own feature.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Dropping every row with any missing value is not neutral; it can discard most of the data and bias what
      remains.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: data-cleaning-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Dropping every row with any missing value is not neutral; it can discard most of the data and bias what
    remains.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: data-cleaning-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying data cleaning to a dataset that may contain missing, duplicate or malformed records.
    Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: data-cleaning-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for data cleaning. The assertions test the main behaviour and an important edge case.
  starterCode: "def clean_names(values):\n    raise NotImplementedError('Complete this function')"
  solution: "def clean_names(values):\n    return [value.strip().lower() for value in values if isinstance(value,\
    \ str) and value.strip()]"
  tests:
  - name: Core transformation
    code: assert clean_names([" Ada ", None, "", "GRACE"]) == ["ada", "grace"]
  - name: Edge case
    code: assert clean_names([None, " "]) == []
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - data-cleaning-mcq
  - data-cleaning-tf
  - data-cleaning-code
