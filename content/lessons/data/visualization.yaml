id: data.visualization
concept: data.visualization
title: Data visualisation
subtitle: Choose chart types for the question, label honestly, avoid misleading axes, and use matplotlib/seaborn
  to explore and communicate
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Choose chart types for the question, label honestly, avoid misleading axes, and use matplotlib/seaborn
  to explore and communicate.
objectives:
- Explain the role of data visualisation in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: Quick start guide
  url: https://matplotlib.org/stable/users/explain/quick_start.html
  publisher: Matplotlib
- title: User guide and tutorial
  url: https://seaborn.pydata.org/tutorial.html
  publisher: seaborn
- title: Fundamentals of Data Visualization (free online book)
  url: https://clauswilke.com/dataviz/
  publisher: Claus O. Wilke
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Choose chart types for the question, label honestly, avoid misleading axes, and use matplotlib/seaborn
      to explore and communicate. A good chart reveals patterns and problems in seconds that tables hide, and a
      misleading one drives wrong decisions; engineers need charts both to explore data and to communicate results.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Match the chart to the question - histograms, box or violin plots for distributions; scatter plots
      for relationships; line charts for trends over time; bar charts for comparing categories.

      - Use matplotlib''s object-oriented API (`fig, ax = plt.subplots()`, `ax.plot(...)`, `ax.set_xlabel(...)`)
      for control; seaborn draws statistical plots straight from DataFrames, as in `sns.histplot(data=df, x="price",
      hue="type")`.

      - Bar charts must start at zero; line charts may zoom in but should say so. Label axes with units and give
      each chart a title that states its takeaway.

      - Use colour-blind-friendly palettes (for example viridis), and avoid 3-D effects and pie charts when readers
      need precise comparisons.

      - For large datasets use transparency, hexbin or 2-D histograms, or sampling to avoid overplotting.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Default chart settings are not neutral; axis limits, bin widths and aggregation choices can change
      the story.

      - Dual y-axes often suggest relationships that are artefacts of how each axis was scaled.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def histogram_bins(values, edges):\n    counts = [0] * (len(edges) - 1)\n    for value in values:\n \
      \       for i in range(len(edges)-1):\n            if edges[i] <= value < edges[i+1] or (i == len(edges)-2\
      \ and value == edges[i+1]): counts[i] += 1; break\n    return counts\n\nprint(histogram_bins([1,2,2,3,4],\
      \ [0,2,4]))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: visualization-code
  - type: item
    ref: visualization-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Match the chart to the question - histograms, box or violin plots for distributions; scatter plots for relationships;
      line charts for trends over time; bar charts for comparing categories.

      - Use matplotlib''s object-oriented API (`fig, ax = plt.subplots()`, `ax.plot(...)`, `ax.set_xlabel(...)`)
      for control; seaborn draws statistical plots straight from DataFrames, as in `sns.histplot(data=df, x="price",
      hue="type")`.

      - Bar charts must start at zero; line charts may zoom in but should say so. Label axes with units and give
      each chart a title that states its takeaway.

      - Use colour-blind-friendly palettes (for example viridis), and avoid 3-D effects and pie charts when readers
      need precise comparisons.

      - For large datasets use transparency, hexbin or 2-D histograms, or sampling to avoid overplotting.


      **Watch for**

      - Default chart settings are not neutral; axis limits, bin widths and aggregation choices can change the story.

      - Dual y-axes often suggest relationships that are artefacts of how each axis was scaled.'
  - type: item
    ref: visualization-mcq
  - type: item
    ref: visualization-tf
  - type: item
    ref: visualization-code
items:
- id: visualization-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of data visualisation?
  explanation: Match the chart to the question - histograms, box or violin plots for distributions; scatter plots
    for relationships; line charts for trends over time; bar charts for comparing categories.
  options:
  - id: a
    text: Match the chart to the question - histograms, box or violin plots for distributions; scatter plots for
      relationships; line charts for trends over time; bar charts for comparing categories.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Default chart settings are not neutral; axis limits, bin widths and aggregation choices can change the
      story.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: visualization-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Default chart settings are not neutral; axis limits, bin widths and aggregation choices can change the
    story.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: visualization-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying data visualisation to a dataset that may contain missing, duplicate or malformed records.
    Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: visualization-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for data visualisation. The assertions test the main behaviour and an important edge
    case.
  starterCode: "def histogram_bins(values, edges):\n    raise NotImplementedError('Complete this function')"
  solution: "def histogram_bins(values, edges):\n    counts = [0] * (len(edges) - 1)\n    for value in values:\n\
    \        for i in range(len(edges)-1):\n            if edges[i] <= value < edges[i+1] or (i == len(edges)-2\
    \ and value == edges[i+1]): counts[i] += 1; break\n    return counts"
  tests:
  - name: Core transformation
    code: assert histogram_bins([1,2,2,3,4], [0,2,4]) == [1,4]
  - name: Edge case
    code: assert histogram_bins([], [0,1,2]) == [0,0]
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - visualization-mcq
  - visualization-tf
  - visualization-code
