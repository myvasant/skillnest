items:
- id: numpy-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of numpy arrays and vectorisation?
  explanation: An `ndarray` has a `shape` such as `(1000, 3)` and one `dtype` such as `float64`; create arrays with
    `np.array`, `np.zeros`, `np.arange` or `np.linspace`.
  options:
  - id: a
    text: An `ndarray` has a `shape` such as `(1000, 3)` and one `dtype` such as `float64`; create arrays with `np.array`,
      `np.zeros`, `np.arange` or `np.linspace`.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Changing a slice changes the original array, because slices are views; call `.copy()` when you need an
      independent array.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: numpy-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Changing a slice changes the original array, because slices are views; call `.copy()` when you need an
    independent array.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: numpy-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying numpy arrays and vectorisation to a dataset that may contain missing, duplicate or malformed
    records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: numpy-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for numpy arrays and vectorisation. The assertions test the main behaviour and an
    important edge case.
  starterCode: "def scale(values, factor):\n    raise NotImplementedError('Complete this function')"
  solution: "def scale(values, factor):\n    return [value * factor for value in values]"
  tests:
  - name: Core transformation
    code: assert scale([1,2,3], 10) == [10,20,30]
  - name: Edge case
    code: assert scale([], 10) == []
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
