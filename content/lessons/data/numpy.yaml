id: data.numpy
concept: data.numpy
title: NumPy arrays and vectorisation
subtitle: N-dimensional arrays with a fixed dtype and shape; vectorised operations and broadcasting replace slow
  Python loops
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: N-dimensional arrays with a fixed dtype and shape; vectorised operations and broadcasting replace slow
  Python loops.
objectives:
- Explain the role of numpy arrays and vectorisation in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
