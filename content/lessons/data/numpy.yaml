  publisher: NumPy
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: N-dimensional arrays with a fixed dtype and shape; vectorised operations and broadcasting replace slow
      Python loops. Python loops over millions of numbers are slow; NumPy stores numbers in compact typed arrays
      and runs operations in compiled code, and pandas, scikit-learn and PyTorch all build on its array model.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- An `ndarray` has a `shape` such as `(1000, 3)` and one `dtype` such as `float64`; create arrays with
      `np.array`, `np.zeros`, `np.arange` or `np.linspace`.

      - Vectorised operations apply element-wise without Python loops, as in `(x - x.mean()) / x.std()`; reductions
      take an `axis`, so `X.sum(axis=0)` sums down the columns.

      - Broadcasting compares shapes from the right; two dimensions are compatible when they are equal or one of
      them is 1, so `(1000, 3) - (3,)` subtracts a per-column value from every row.

      - Basic slices such as `x[1:5]` return views that share memory with the original; boolean masks (`x[x > 0]`)
      and integer-array indexing return copies.

      - Use `rng = np.random.default_rng(seed)` for reproducible random numbers.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Changing a slice changes the original array, because slices are views; call `.copy()` when you need
      an independent array.

      - Fixed-width integer arrays can overflow silently (an `int8` wraps around past 127), unlike Python''s unbounded
      `int`.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def scale(values, factor):\n    return [value * factor for value in values]\n\nprint(scale([1, 2, 3],\
      \ 10))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: numpy-code
  - type: item
    ref: numpy-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - An `ndarray` has a `shape` such as `(1000, 3)` and one `dtype` such as `float64`; create arrays with `np.array`,
      `np.zeros`, `np.arange` or `np.linspace`.

      - Vectorised operations apply element-wise without Python loops, as in `(x - x.mean()) / x.std()`; reductions
      take an `axis`, so `X.sum(axis=0)` sums down the columns.

      - Broadcasting compares shapes from the right; two dimensions are compatible when they are equal or one of
      them is 1, so `(1000, 3) - (3,)` subtracts a per-column value from every row.

      - Basic slices such as `x[1:5]` return views that share memory with the original; boolean masks (`x[x > 0]`)
      and integer-array indexing return copies.

      - Use `rng = np.random.default_rng(seed)` for reproducible random numbers.


      **Watch for**

      - Changing a slice changes the original array, because slices are views; call `.copy()` when you need an independent
      array.

      - Fixed-width integer arrays can overflow silently (an `int8` wraps around past 127), unlike Python''s unbounded
      `int`.'
  - type: item
