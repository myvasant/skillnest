id: data.data-loading
concept: data.data-loading
title: Loading data from files and databases
subtitle: Read CSV, JSON, Excel, Parquet and SQL into DataFrames while controlling types, encodings, dates and memory
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Read CSV, JSON, Excel, Parquet and SQL into DataFrames while controlling types, encodings, dates and memory.
objectives:
- Explain the role of loading data from files and databases in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: IO tools (text, CSV, HDF5, ...)
  url: https://pandas.pydata.org/docs/user_guide/io.html
  publisher: pandas
- title: Scaling to large datasets
  url: https://pandas.pydata.org/docs/user_guide/scale.html
  publisher: pandas
- title: Apache Parquet documentation
  url: https://parquet.apache.org/docs/
  publisher: Apache Software Foundation
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Read CSV, JSON, Excel, Parquet and SQL into DataFrames while controlling types, encodings, dates and memory.
      Many data bugs start at load time (wrong types, mangled dates, broken encodings), and loading large files
      carelessly runs out of memory.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- `pd.read_csv(path, dtype={...}, parse_dates=["created_at"], usecols=[...], encoding="utf-8")` controls
      types, dates, columns and encoding.

      - Parquet (`pd.read_parquet`, via PyArrow) is a columnar, compressed and typed format; it is much faster and
      smaller than CSV and keeps dtypes intact.

      - Read from a database with `pd.read_sql(query, engine, params=...)` using a SQLAlchemy engine or connection,
      passing values as parameters rather than formatting them into the SQL.

      - For big files, load only the columns you need, use compact dtypes (`category`, smaller integers) or read
      in pieces with `chunksize=`; for data larger than memory consider DuckDB or Polars.

      - Since pandas 3.0, text columns are inferred as the dedicated `str` dtype (backed by PyArrow when it is installed)
      instead of `object`.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- CSV has no types - leading zeros in IDs and postcodes vanish and dates stay strings unless you specify
      dtypes and date parsing.

      - Spreadsheets are not a reliable interchange format; they can silently convert values such as long IDs, gene
      names and dates.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import csv\nfrom io import StringIO\ndef read_rows(text):\n    return list(csv.DictReader(StringIO(text)))\n\
      \nprint(read_rows(\"name,score\\nAda,9\\nGrace,10\\n\"))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: data-loading-code
  - type: item
    ref: data-loading-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - `pd.read_csv(path, dtype={...}, parse_dates=["created_at"], usecols=[...], encoding="utf-8")` controls types,
      dates, columns and encoding.

      - Parquet (`pd.read_parquet`, via PyArrow) is a columnar, compressed and typed format; it is much faster and
      smaller than CSV and keeps dtypes intact.

      - Read from a database with `pd.read_sql(query, engine, params=...)` using a SQLAlchemy engine or connection,
      passing values as parameters rather than formatting them into the SQL.

      - For big files, load only the columns you need, use compact dtypes (`category`, smaller integers) or read
      in pieces with `chunksize=`; for data larger than memory consider DuckDB or Polars.

      - Since pandas 3.0, text columns are inferred as the dedicated `str` dtype (backed by PyArrow when it is installed)
      instead of `object`.


      **Watch for**

      - CSV has no types - leading zeros in IDs and postcodes vanish and dates stay strings unless you specify dtypes
      and date parsing.

      - Spreadsheets are not a reliable interchange format; they can silently convert values such as long IDs, gene
      names and dates.'
  - type: item
    ref: data-loading-mcq
  - type: item
    ref: data-loading-tf
  - type: item
    ref: data-loading-code
items:
- id: data-loading-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of loading data from files and databases?
  explanation: '`pd.read_csv(path, dtype={...}, parse_dates=["created_at"], usecols=[...], encoding="utf-8")` controls
    types, dates, columns and encoding.'
  options:
  - id: a
    text: '`pd.read_csv(path, dtype={...}, parse_dates=["created_at"], usecols=[...], encoding="utf-8")` controls
      types, dates, columns and encoding.'
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: CSV has no types - leading zeros in IDs and postcodes vanish and dates stay strings unless you specify
      dtypes and date parsing.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: data-loading-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: CSV has no types - leading zeros in IDs and postcodes vanish and dates stay strings unless you specify
    dtypes and date parsing.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: data-loading-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying loading data from files and databases to a dataset that may contain missing, duplicate
    or malformed records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: data-loading-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for loading data from files and databases. The assertions test the main behaviour
    and an important edge case.
  starterCode: "import csv\nfrom io import StringIO\n\ndef read_rows(text):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "import csv\nfrom io import StringIO\ndef read_rows(text):\n    return list(csv.DictReader(StringIO(text)))"
  tests:
  - name: Core transformation
    code: assert read_rows("name,score\nAda,9\n")[0] == {"name":"Ada","score":"9"}
  - name: Edge case
    code: assert read_rows("name,score\n") == []
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - data-loading-mcq
  - data-loading-tf
  - data-loading-code
