id: data.eda
concept: data.eda
title: Exploratory data analysis
subtitle: A systematic first look — distributions, relationships, anomalies, leakage hints and questions to ask
  before modelling
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: A systematic first look — distributions, relationships, anomalies, leakage hints and questions to ask before
  modelling.
objectives:
- Explain the role of exploratory data analysis in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: 'NIST/SEMATECH e-Handbook: Exploratory Data Analysis'
  url: https://www.itl.nist.gov/div898/handbook/eda/eda.htm
  publisher: NIST
- title: Common pitfalls and recommended practices (data leakage)
  url: https://scikit-learn.org/stable/common_pitfalls.html
  publisher: scikit-learn
- title: pandas.DataFrame.describe
  url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.describe.html
  publisher: pandas
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A systematic first look — distributions, relationships, anomalies, leakage hints and questions to ask
      before modelling. Modelling before understanding the data wastes time and hides problems such as leakage,
      skew and bad labels; EDA tells you which models, features and metrics make sense.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Start with shape, dtypes, missingness and `describe()`, then look at each variable''s distribution
      (histograms, `value_counts()`) before relationships.

      - Examine relationships with correlations, scatter plots, group comparisons and cross-tabulations, especially
      between each feature and the target.

      - Inspect the target itself - class balance, label noise and how it was defined; an imbalanced target changes
      which metrics are meaningful.

      - Look for leakage hints - features that predict the target suspiciously well, IDs or timestamps correlated
      with the label, or values recorded after the outcome.

      - Write down questions and findings as you go, and keep the held-out test set untouched during EDA so it does
      not bias later evaluation.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Summary statistics alone are not enough; always plot, because very different data can share the same
      summaries.

      - A strong correlation found during EDA is a hypothesis to test, not a causal conclusion.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def numeric_summary(values):\n    if not values: return {\"count\":0,\"min\":None,\"max\":None,\"mean\"\
      :None}\n    return {\"count\":len(values),\"min\":min(values),\"max\":max(values),\"mean\":sum(values)/len(values)}\n\
      \nprint(numeric_summary([2, 4, 6, 8]))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: eda-code
  - type: item
    ref: eda-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Start with shape, dtypes, missingness and `describe()`, then look at each variable''s distribution (histograms,
      `value_counts()`) before relationships.

      - Examine relationships with correlations, scatter plots, group comparisons and cross-tabulations, especially
      between each feature and the target.

      - Inspect the target itself - class balance, label noise and how it was defined; an imbalanced target changes
      which metrics are meaningful.

      - Look for leakage hints - features that predict the target suspiciously well, IDs or timestamps correlated
      with the label, or values recorded after the outcome.

      - Write down questions and findings as you go, and keep the held-out test set untouched during EDA so it does
      not bias later evaluation.


      **Watch for**

      - Summary statistics alone are not enough; always plot, because very different data can share the same summaries.

      - A strong correlation found during EDA is a hypothesis to test, not a causal conclusion.'
  - type: item
    ref: eda-mcq
  - type: item
    ref: eda-tf
  - type: item
    ref: eda-code
items:
- id: eda-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of exploratory data analysis?
  explanation: Start with shape, dtypes, missingness and `describe()`, then look at each variable's distribution
    (histograms, `value_counts()`) before relationships.
  options:
  - id: a
    text: Start with shape, dtypes, missingness and `describe()`, then look at each variable's distribution (histograms,
      `value_counts()`) before relationships.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Summary statistics alone are not enough; always plot, because very different data can share the same summaries.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: eda-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Summary statistics alone are not enough; always plot, because very different data can share the same summaries.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: eda-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying exploratory data analysis to a dataset that may contain missing, duplicate or malformed
    records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: eda-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for exploratory data analysis. The assertions test the main behaviour and an important
    edge case.
  starterCode: "def numeric_summary(values):\n    raise NotImplementedError('Complete this function')"
  solution: "def numeric_summary(values):\n    if not values: return {\"count\":0,\"min\":None,\"max\":None,\"mean\"\
    :None}\n    return {\"count\":len(values),\"min\":min(values),\"max\":max(values),\"mean\":sum(values)/len(values)}"
  tests:
  - name: Core transformation
    code: assert numeric_summary([2,4,6]) == {"count":3,"min":2,"max":6,"mean":4}
  - name: Edge case
    code: assert numeric_summary([])["mean"] is None
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - eda-mcq
  - eda-tf
  - eda-code
