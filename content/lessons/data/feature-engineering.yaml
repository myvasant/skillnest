sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Turn raw columns into model inputs — encoding categories, scaling, binning, date parts, text features
      and interaction terms. Models only see numbers in the form you give them; good features often improve results
      more than a fancier model, and leaky features produce models that fail in production.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- One-hot encode low-cardinality categories (`OneHotEncoder(handle_unknown="ignore")`); for high-cardinality
      ones consider frequency or target encoding (fitted inside cross-validation) or hashing.

      - Standardise numeric features (`StandardScaler`) for distance- and gradient-based models, log-transform heavily
      skewed values, and remember that tree models usually need no scaling.

      - Extract date parts (hour, day of week, days since an event) and turn text into counts, TF-IDF vectors or
      embeddings.

      - Fit every transformation on training data only and apply it to validation and test data; a scikit-learn
      `Pipeline` with a `ColumnTransformer` does this automatically.

      - Use only information that will be available at prediction time; features computed from the future or from
      the target itself are leakage.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Scaling or encoding the whole dataset before splitting is not harmless; it leaks test-set information
      into training.

      - More features are not always better; noisy or redundant ones can hurt generalisation and slow training.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def add_ratio(rows, numerator, denominator, output):\n    result = []\n    for row in rows:\n       \
      \ value = row.get(denominator)\n        result.append({**row, output: row[numerator] / value if value not\
      \ in (None, 0) else None})\n    return result\n\nprint(add_ratio([{\"wins\":6,\"games\":10},{\"wins\":0,\"\
      games\":0}], \"wins\", \"games\", \"win_rate\"))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: feature-engineering-code
  - type: item
    ref: feature-engineering-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - One-hot encode low-cardinality categories (`OneHotEncoder(handle_unknown="ignore")`); for high-cardinality
      ones consider frequency or target encoding (fitted inside cross-validation) or hashing.

      - Standardise numeric features (`StandardScaler`) for distance- and gradient-based models, log-transform heavily
      skewed values, and remember that tree models usually need no scaling.

      - Extract date parts (hour, day of week, days since an event) and turn text into counts, TF-IDF vectors or
      embeddings.

      - Fit every transformation on training data only and apply it to validation and test data; a scikit-learn
      `Pipeline` with a `ColumnTransformer` does this automatically.

      - Use only information that will be available at prediction time; features computed from the future or from
      the target itself are leakage.


      **Watch for**

      - Scaling or encoding the whole dataset before splitting is not harmless; it leaks test-set information into
      training.

      - More features are not always better; noisy or redundant ones can hurt generalisation and slow training.'
  - type: item
    ref: feature-engineering-mcq
  - type: item
    ref: feature-engineering-tf
  - type: item
    ref: feature-engineering-code
items:
- id: feature-engineering-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of feature engineering?
  explanation: One-hot encode low-cardinality categories (`OneHotEncoder(handle_unknown="ignore")`); for high-cardinality
    ones consider frequency or target encoding (fitted inside cross-validation) or hashing.
  options:
  - id: a
    text: One-hot encode low-cardinality categories (`OneHotEncoder(handle_unknown="ignore")`); for high-cardinality
      ones consider frequency or target encoding (fitted inside cross-validation) or hashing.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Scaling or encoding the whole dataset before splitting is not harmless; it leaks test-set information
      into training.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: feature-engineering-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Scaling or encoding the whole dataset before splitting is not harmless; it leaks test-set information
    into training.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: feature-engineering-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying feature engineering to a dataset that may contain missing, duplicate or malformed records.
    Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: feature-engineering-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for feature engineering. The assertions test the main behaviour and an important edge
    case.
  starterCode: "def add_ratio(rows, numerator, denominator, output):\n    raise NotImplementedError('Complete this\
    \ function')"
  solution: "def add_ratio(rows, numerator, denominator, output):\n    result = []\n    for row in rows:\n     \
    \   value = row.get(denominator)\n        result.append({**row, output: row[numerator] / value if value not\
    \ in (None, 0) else None})\n    return result"
  tests:
  - name: Core transformation
    code: assert add_ratio([{"a":6,"b":10}], "a", "b", "ratio")[0]["ratio"] == 0.6
  - name: Edge case
    code: assert add_ratio([{"a":1,"b":0}], "a", "b", "ratio")[0]["ratio"] is None
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
