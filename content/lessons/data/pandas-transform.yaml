sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: groupby/aggregate, merge, concat, pivot and melt — the DataFrame equivalents of SQL aggregation and joins.
      Real questions need summaries by group and combinations of tables; doing that correctly in pandas mirrors
      SQL and avoids error-prone loops.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Split-apply-combine: `df.groupby("country").agg(revenue=("amount", "sum"), users=("user_id", "nunique"))`
      returns one row per group with named result columns.

      - `transform` returns a result aligned to the original rows (for example each row''s share of its group total),
      whereas `agg` returns one row per group.

      - `pd.merge(left, right, on="id", how="left", validate="many_to_one")` is a SQL-style join; `validate=` and
      `indicator=True` expose duplicate keys and unmatched rows.

      - `pd.concat` stacks frames vertically or side by side; `pivot_table` reshapes long data to wide with aggregation,
      and `melt` turns wide data back into long form.

      - Compare row counts before and after every merge; an unexpected increase means duplicated keys.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- `groupby` drops rows whose key is missing (NaN) by default; pass `dropna=False` to keep them.

      - A left merge does not guarantee the original row count; duplicate keys on the right multiply rows.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def group_totals(rows, group_key, value_key):\n    totals = {}\n    for row in rows: totals[row[group_key]]\
      \ = totals.get(row[group_key], 0) + row[value_key]\n    return totals\n\nprint(group_totals([{\"team\":\"\
      A\",\"points\":3},{\"team\":\"A\",\"points\":4},{\"team\":\"B\",\"points\":2}], \"team\", \"points\"))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: pandas-transform-code
  - type: item
    ref: pandas-transform-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Split-apply-combine: `df.groupby("country").agg(revenue=("amount", "sum"), users=("user_id", "nunique"))`
      returns one row per group with named result columns.

      - `transform` returns a result aligned to the original rows (for example each row''s share of its group total),
      whereas `agg` returns one row per group.

      - `pd.merge(left, right, on="id", how="left", validate="many_to_one")` is a SQL-style join; `validate=` and
      `indicator=True` expose duplicate keys and unmatched rows.

      - `pd.concat` stacks frames vertically or side by side; `pivot_table` reshapes long data to wide with aggregation,
      and `melt` turns wide data back into long form.

      - Compare row counts before and after every merge; an unexpected increase means duplicated keys.


      **Watch for**

      - `groupby` drops rows whose key is missing (NaN) by default; pass `dropna=False` to keep them.

      - A left merge does not guarantee the original row count; duplicate keys on the right multiply rows.'
  - type: item
    ref: pandas-transform-mcq
