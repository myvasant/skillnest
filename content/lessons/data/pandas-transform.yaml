summary: groupby/aggregate, merge, concat, pivot and melt — the DataFrame equivalents of SQL aggregation and joins.
objectives:
- Explain the role of grouping, joining and reshaping in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
