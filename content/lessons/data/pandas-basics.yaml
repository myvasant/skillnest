sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Labelled one- and two-dimensional data with indexes; select, filter and compute columns with vectorised
      expressions. Real data has named columns, mixed types, missing values and row labels; pandas adds these to
      NumPy-style arrays and is the default tool for tabular data in Python.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A `Series` is a labelled 1-D array and a `DataFrame` is a table of Series sharing one index; inspect
      them with `df.head()`, `df.info()`, `df.describe()` and `df.dtypes`.

      - Select a column with `df["col"]` or several with `df[["a", "b"]]`; select by label with `df.loc[rows, cols]`
      and by position with `df.iloc[rows, cols]`.

      - Filter with boolean masks such as `df[(df["age"] > 30) & (df["country"] == "FR")]`, using `&`, `|` and `~`
      with parentheses rather than `and`, `or` and `not`.

      - Create columns with vectorised expressions (`df["total"] = df["price"] * df["qty"]`) or `df.assign(...)`;
      avoid row loops and `apply` with Python functions when a vectorised method exists.

      - In pandas 3.0 and later, Copy-on-Write is the only mode - derived objects behave as copies and chained assignment
      such as `df["a"][mask] = 0` never changes `df`; write `df.loc[mask, "a"] = 0` instead.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- `.loc` slicing by label includes the end label, while `.iloc` slicing by position excludes it, like
      Python slices.

      - Arithmetic between two Series aligns them by index label, not by position, and labels missing from either
      side produce NaN.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def column_values(rows, column):\n    return [row.get(column) for row in rows]\n\nprint(column_values([{\"\
      name\":\"Ada\"},{\"name\":\"Grace\"}], \"name\"))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: pandas-basics-code
  - type: item
    ref: pandas-basics-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A `Series` is a labelled 1-D array and a `DataFrame` is a table of Series sharing one index; inspect them
      with `df.head()`, `df.info()`, `df.describe()` and `df.dtypes`.

      - Select a column with `df["col"]` or several with `df[["a", "b"]]`; select by label with `df.loc[rows, cols]`
      and by position with `df.iloc[rows, cols]`.

      - Filter with boolean masks such as `df[(df["age"] > 30) & (df["country"] == "FR")]`, using `&`, `|` and `~`
      with parentheses rather than `and`, `or` and `not`.

      - Create columns with vectorised expressions (`df["total"] = df["price"] * df["qty"]`) or `df.assign(...)`;
      avoid row loops and `apply` with Python functions when a vectorised method exists.

      - In pandas 3.0 and later, Copy-on-Write is the only mode - derived objects behave as copies and chained assignment
      such as `df["a"][mask] = 0` never changes `df`; write `df.loc[mask, "a"] = 0` instead.


      **Watch for**

      - `.loc` slicing by label includes the end label, while `.iloc` slicing by position excludes it, like Python
      slices.

      - Arithmetic between two Series aligns them by index label, not by position, and labels missing from either
      side produce NaN.'
  - type: item
    ref: pandas-basics-mcq
  - type: item
    ref: pandas-basics-tf
  - type: item
    ref: pandas-basics-code
items:
- id: pandas-basics-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of pandas series and dataframes?
  explanation: A `Series` is a labelled 1-D array and a `DataFrame` is a table of Series sharing one index; inspect
    them with `df.head()`, `df.info()`, `df.describe()` and `df.dtypes`.
  options:
  - id: a
    text: A `Series` is a labelled 1-D array and a `DataFrame` is a table of Series sharing one index; inspect them
      with `df.head()`, `df.info()`, `df.describe()` and `df.dtypes`.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: '`.loc` slicing by label includes the end label, while `.iloc` slicing by position excludes it, like Python
      slices.'
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: pandas-basics-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '`.loc` slicing by label includes the end label, while `.iloc` slicing by position excludes it, like Python
    slices.'
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: pandas-basics-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying pandas series and dataframes to a dataset that may contain missing, duplicate or malformed
    records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: pandas-basics-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for pandas series and dataframes. The assertions test the main behaviour and an important
    edge case.
  starterCode: "def column_values(rows, column):\n    raise NotImplementedError('Complete this function')"
  solution: "def column_values(rows, column):\n    return [row.get(column) for row in rows]"
  tests:
  - name: Core transformation
    code: assert column_values([{"x":1},{"x":2}], "x") == [1,2]
  - name: Edge case
    code: assert column_values([{"y":3}], "x") == [None]
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - pandas-basics-mcq
