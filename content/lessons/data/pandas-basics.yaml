id: data.pandas-basics
concept: data.pandas-basics
title: pandas Series and DataFrames
subtitle: Labelled one- and two-dimensional data with indexes; select, filter and compute columns with vectorised
  expressions
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Labelled one- and two-dimensional data with indexes; select, filter and compute columns with vectorised
  expressions.
objectives:
- Explain the role of pandas series and dataframes in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: 10 minutes to pandas
  url: https://pandas.pydata.org/docs/user_guide/10min.html
  publisher: pandas
- title: Indexing and selecting data
  url: https://pandas.pydata.org/docs/user_guide/indexing.html
  publisher: pandas
