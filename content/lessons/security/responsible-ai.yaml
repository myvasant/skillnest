id: security.responsible-ai
concept: security.responsible-ai
title: Responsible AI
subtitle: Fairness, transparency, accountability, human oversight and harm assessment across the AI lifecycle
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Fairness, transparency, accountability, human oversight and harm assessment across the AI lifecycle.
objectives:
- Explain the core engineering decisions behind responsible ai.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: AI Risk Management Framework
  url: https://www.nist.gov/itl/ai-risk-management-framework
  publisher: NIST
- title: OECD AI Principles
  url: https://oecd.ai/en/ai-principles
  publisher: OECD
- title: People + AI Guidebook
  url: https://pair.withgoogle.com/guidebook/
  publisher: Google PAIR
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Fairness, transparency, accountability, human oversight and harm assessment across the AI lifecycle. AI
      systems can be unfair, opaque or harmful even when they are accurate on average; responsible AI practice finds
      and reduces those harms before they reach people.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Major frameworks (OECD AI Principles, NIST AI RMF) share core values - fairness, transparency and explainability,
      privacy, safety and security, accountability, and human oversight.

      - Assess impact early - who is affected, what happens when the system is wrong, and who bears the cost of
      errors, especially in high-stakes uses such as hiring, credit or health.

      - Evaluate performance and error rates per group (disaggregated evaluation), not only overall, and test with
      diverse and adversarial inputs.

      - Design for human oversight - people must be able to understand, contest and override decisions, and users
      should know when they are interacting with AI.

      - Responsibility covers the whole lifecycle - data collection, training, deployment, monitoring and retirement.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Removing a sensitive attribute such as gender does not make a model fair; proxies like postcode or
      name can carry the same information.

      - There is no single fairness metric; some definitions are mathematically incompatible, so choosing one is
      a documented value judgement.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def group_outcome_rates(groups):\n    return {group:sum(outcomes)/len(outcomes) if outcomes else None\
      \ for group,outcomes in groups.items()}\n\nprint(group_outcome_rates({\"A\":[1,1,0],\"B\":[1,0,0]}))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: responsible-ai-code
  - type: item
    ref: responsible-ai-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Major frameworks (OECD AI Principles, NIST AI RMF) share core values - fairness, transparency and explainability,
      privacy, safety and security, accountability, and human oversight.

      - Assess impact early - who is affected, what happens when the system is wrong, and who bears the cost of
      errors, especially in high-stakes uses such as hiring, credit or health.

      - Evaluate performance and error rates per group (disaggregated evaluation), not only overall, and test with
      diverse and adversarial inputs.

      - Design for human oversight - people must be able to understand, contest and override decisions, and users
      should know when they are interacting with AI.

      - Responsibility covers the whole lifecycle - data collection, training, deployment, monitoring and retirement.


      **Watch for**

      - Removing a sensitive attribute such as gender does not make a model fair; proxies like postcode or name
      can carry the same information.

      - There is no single fairness metric; some definitions are mathematically incompatible, so choosing one is
      a documented value judgement.'
  - type: item
    ref: responsible-ai-mcq
  - type: item
    ref: responsible-ai-tf
  - type: item
    ref: responsible-ai-code
items:
- id: responsible-ai-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of responsible ai?
  explanation: Major frameworks (OECD AI Principles, NIST AI RMF) share core values - fairness, transparency and
    explainability, privacy, safety and security, accountability, and human oversight.
  options:
  - id: a
    text: Major frameworks (OECD AI Principles, NIST AI RMF) share core values - fairness, transparency and explainability,
      privacy, safety and security, accountability, and human oversight.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Removing a sensitive attribute such as gender does not make a model fair; proxies like postcode or name
      can carry the same information.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: responsible-ai-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Removing a sensitive attribute such as gender does not make a model fair; proxies like postcode or name
    can carry the same information.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: responsible-ai-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply responsible ai to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: responsible-ai-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for responsible ai. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def group_outcome_rates(groups):\n    raise NotImplementedError('Complete this function')"
  solution: "def group_outcome_rates(groups):\n    return {group:sum(outcomes)/len(outcomes) if outcomes else None\
    \ for group,outcomes in groups.items()}"
  tests:
  - name: Core behaviour
    code: rates=group_outcome_rates({"A":[1,1,0],"B":[1,0,0]})
  - name: Boundary behaviour
    code: 'assert abs(rates["A"]-2/3)<1e-12 and abs(rates["B"]-1/3)<1e-12

      assert group_outcome_rates({"empty":[]})["empty"] is None'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - responsible-ai-mcq
  - responsible-ai-tf
  - responsible-ai-code
