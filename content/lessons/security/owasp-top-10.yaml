id: security.owasp-top-10
concept: security.owasp-top-10
title: Web application risks (OWASP Top 10)
subtitle: Broken access control, security misconfiguration, supply-chain failures, cryptographic failures, injection,
  insecure design and the other most common web application risks
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Broken access control, security misconfiguration, supply-chain failures, cryptographic failures, injection,
  insecure design and the other most common web application risks.
objectives:
- Explain the core engineering decisions behind web application risks (owasp top 10).
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: OWASP Top 10:2025
  url: https://top10.owasp.org/2025/
  publisher: OWASP Foundation
  version: '2025'
- title: Application Security Verification Standard (ASVS)
  url: https://owasp.org/projects/asvs
  publisher: OWASP Foundation
- title: Authorization Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  publisher: OWASP Cheat Sheet Series
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Broken access control, security misconfiguration, supply-chain failures, cryptographic failures, injection,
      insecure design and the other most common web application risks. Most real web breaches exploit a small set
      of recurring weaknesses; the OWASP Top 10 is the shared vocabulary for them across developers, testers and
      auditors.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The 2025 edition: A01 Broken Access Control, A02 Security Misconfiguration, A03 Software Supply Chain
      Failures, A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures, A08
      Software or Data Integrity Failures, A09 Security Logging and Alerting Failures, A10 Mishandling of Exceptional
      Conditions.

      - Broken access control is ranked first - for example changing `/invoices/123` to `/invoices/124` exposes
      another user''s invoice (an IDOR); check authorisation on the server for every request and object, and deny
      by default.

      - Injection happens when untrusted data is interpreted as code or commands (SQL, shell, templates); parameterised
      queries and safe APIs prevent it.

      - The Top 10 is an awareness document built from vulnerability data and a community survey; for a testable
      list of requirements use the OWASP Application Security Verification Standard (ASVS).'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- The Top 10 is not a complete security standard; passing a Top 10 scan does not make an application
      secure.

      - Hiding a button in the UI is not access control; the server must enforce every permission.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def classify_control(input_validation, output_encoding, access_control):\n    return {\"input_validation\"\
      :input_validation,\"output_encoding\":output_encoding,\"access_control\":access_control}\n\nprint(classify_control(True,\
      \ True, False))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: owasp-top-10-code
  - type: item
    ref: owasp-top-10-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - The 2025 edition: A01 Broken Access Control, A02 Security Misconfiguration, A03 Software Supply Chain Failures,
      A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures, A08 Software
      or Data Integrity Failures, A09 Security Logging and Alerting Failures, A10 Mishandling of Exceptional Conditions.

      - Broken access control is ranked first - for example changing `/invoices/123` to `/invoices/124` exposes
      another user''s invoice (an IDOR); check authorisation on the server for every request and object, and deny
      by default.

      - Injection happens when untrusted data is interpreted as code or commands (SQL, shell, templates); parameterised
      queries and safe APIs prevent it.

      - The Top 10 is an awareness document built from vulnerability data and a community survey; for a testable
      list of requirements use the OWASP Application Security Verification Standard (ASVS).


      **Watch for**

      - The Top 10 is not a complete security standard; passing a Top 10 scan does not make an application secure.

      - Hiding a button in the UI is not access control; the server must enforce every permission.'
  - type: item
    ref: owasp-top-10-mcq
  - type: item
    ref: owasp-top-10-tf
  - type: item
    ref: owasp-top-10-code
items:
- id: owasp-top-10-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of web application risks (owasp top 10)?
  explanation: 'The 2025 edition: A01 Broken Access Control, A02 Security Misconfiguration, A03 Software Supply
    Chain Failures, A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures,
    A08 Software or Data Integrity Failures, A09 Security Logging and Alerting Failures, A10 Mishandling of Exceptional
    Conditions.'
  options:
  - id: a
    text: 'The 2025 edition: A01 Broken Access Control, A02 Security Misconfiguration, A03 Software Supply Chain
      Failures, A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures, A08
      Software or Data Integrity Failures, A09 Security Logging and Alerting Failures, A10 Mishandling of Exceptional
      Conditions.'
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: The Top 10 is not a complete security standard; passing a Top 10 scan does not make an application secure.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: owasp-top-10-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: The Top 10 is not a complete security standard; passing a Top 10 scan does not make an application secure.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: owasp-top-10-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply web application risks (owasp top 10) to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: owasp-top-10-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for web application risks (owasp top 10). The assertions cover the expected path and
    an important boundary case.
  starterCode: "def classify_control(input_validation, output_encoding, access_control):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def classify_control(input_validation, output_encoding, access_control):\n    return {\"input_validation\"\
    :input_validation,\"output_encoding\":output_encoding,\"access_control\":access_control}"
  tests:
  - name: Core behaviour
    code: controls=classify_control(True,True,False)
  - name: Boundary behaviour
    code: 'assert controls["input_validation"] and controls["output_encoding"]

      assert controls["access_control"] is False'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - owasp-top-10-mcq
  - owasp-top-10-tf
  - owasp-top-10-code
