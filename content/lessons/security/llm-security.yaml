summary: The OWASP Top 10 for LLM applications — prompt injection, sensitive information disclosure, supply chain,
  excessive agency and more.
objectives:
- Explain the core engineering decisions behind llm application security.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
