sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: The OWASP Top 10 for LLM applications — prompt injection, sensitive information disclosure, supply chain,
      excessive agency and more. LLM apps mix untrusted text with instructions and often give the model tools and
      data access, which creates attack paths traditional controls do not cover.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The 2025 OWASP Top 10 for LLM Applications: prompt injection, sensitive information disclosure, supply
      chain, data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector
      and embedding weaknesses, misinformation, and unbounded consumption.

      - Indirect prompt injection hides instructions in content the model reads (web pages, documents, emails, tool
      results); there is no complete fix, so limit what a manipulated model is able to do.

      - Limit agency - give agents the fewest tools and permissions needed, scope credentials to the current user,
      and require human approval for high-impact actions such as payments, deletions or sending email.

      - Treat model output as untrusted - validate and encode it before rendering it, executing it or passing it
      to tools, SQL or a shell.

      - Enforce access control in retrieval (filter documents by the user''s permissions before they reach the prompt)
      and set rate, token and cost limits per user.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A system prompt saying "never reveal secrets" is not a security control; never put secrets in prompts
      at all.

      - Guardrail classifiers reduce risk but can be bypassed; they complement privilege limits, they do not replace
      them.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def is_untrusted_instruction(source, trusted_sources):\n    return source not in trusted_sources\n\n\
      print(is_untrusted_instruction(\"retrieved_document\", {\"system_policy\",\"developer_config\"}))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: llm-security-code
  - type: item
    ref: llm-security-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - The 2025 OWASP Top 10 for LLM Applications: prompt injection, sensitive information disclosure, supply chain,
      data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector and embedding
      weaknesses, misinformation, and unbounded consumption.

      - Indirect prompt injection hides instructions in content the model reads (web pages, documents, emails, tool
      results); there is no complete fix, so limit what a manipulated model is able to do.

      - Limit agency - give agents the fewest tools and permissions needed, scope credentials to the current user,
      and require human approval for high-impact actions such as payments, deletions or sending email.

      - Treat model output as untrusted - validate and encode it before rendering it, executing it or passing it
      to tools, SQL or a shell.

      - Enforce access control in retrieval (filter documents by the user''s permissions before they reach the prompt)
      and set rate, token and cost limits per user.


      **Watch for**

      - A system prompt saying "never reveal secrets" is not a security control; never put secrets in prompts at
      all.

      - Guardrail classifiers reduce risk but can be bypassed; they complement privilege limits, they do not replace
      them.'
  - type: item
    ref: llm-security-mcq
  - type: item
    ref: llm-security-tf
  - type: item
    ref: llm-security-code
items:
- id: llm-security-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of llm application security?
  explanation: 'The 2025 OWASP Top 10 for LLM Applications: prompt injection, sensitive information disclosure,
    supply chain, data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector
    and embedding weaknesses, misinformation, and unbounded consumption.'
  options:
  - id: a
    text: 'The 2025 OWASP Top 10 for LLM Applications: prompt injection, sensitive information disclosure, supply
      chain, data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector
      and embedding weaknesses, misinformation, and unbounded consumption.'
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: A system prompt saying "never reveal secrets" is not a security control; never put secrets in prompts
      at all.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: llm-security-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A system prompt saying "never reveal secrets" is not a security control; never put secrets in prompts
    at all.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: llm-security-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply llm application security to a realistic engineering scenario. State your assumptions, explain your
    decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: llm-security-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for llm application security. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def is_untrusted_instruction(source, trusted_sources):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def is_untrusted_instruction(source, trusted_sources):\n    return source not in trusted_sources"
  tests:
  - name: Core behaviour
    code: assert is_untrusted_instruction("retrieved_document", {"system_policy"}) is True
  - name: Boundary behaviour
    code: assert is_untrusted_instruction("system_policy", {"system_policy"}) is False
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - llm-security-mcq
  - llm-security-tf
  - llm-security-code
