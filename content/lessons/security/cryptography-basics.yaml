  - id: m-predict-salt
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      import hashlib

      def store(password, salt):
          return hashlib.sha256(salt + password.encode()).hexdigest()

      a = store("blue-moon", b"salt-A")
      b = store("blue-moon", b"salt-B")
      c = store("blue-moon", b"salt-A")
      print(a == b, a == c)
    answer: "False True"
    explanation: >-
      Different salts give different hashes of the same password (a != b). The function is deterministic, so
      the same salt and password always give the same hash (a == c) - which is exactly how verification works.
    wrongAnswers:
      - answer: "True True"
        feedback: The salt is part of what is hashed, so changing it changes the digest completely.
      - answer: "False False"
        feedback: Hashing is deterministic - with the same salt and password you always get the same result, which is what makes verification possible.

  - id: m-mcq-session-id
    type: mcq
    skill: design
    prompt: Which expression should generate a new session ID after a user logs in?
    explanation: >-
      Session IDs must be unguessable, so they need plenty of randomness from a cryptographically secure
      generator. The other options are predictable or derived from public information.
    options:
      - id: a
        text: "`secrets.token_urlsafe(32)`"
        correct: true
        feedback: Correct - 256 bits from the OS's secure random generator, safe to put in a cookie.
      - id: b
        text: "`str(random.random())`"
        feedback: The random module is predictable from its state, and attackers can reconstruct that state from outputs.
      - id: c
        text: "`hashlib.sha256(username.encode()).hexdigest()`"
        feedback: Anyone who knows the username can compute this - hashing public data does not make it secret.
      - id: d
        text: "`base64.b64encode(f\"{user_id}:{login_time}\".encode())`"
        feedback: Base64 hides nothing; the user ID and approximate time are easy to guess.

  - id: m-design-hash-or-encrypt
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: >-
      Your app stores each customer's API key for a third-party service, because your server must call that
      service on the customer's behalf later. How should those keys be stored?
    explanation: >-
      You must be able to recover the original key to use it, so a one-way hash is impossible. Encrypt it with
      authenticated encryption, keeping the encryption key separate from the database (a KMS or secret
      manager). Passwords are different: you only need to verify them, so they are hashed.
    options:
      - id: a
        text: Hash them with Argon2id, like passwords
        feedback: A hash is one-way. You could check a key but never send it to the third-party service.
      - id: b
        text: Encrypt them with AES-GCM using a key held in a KMS or secret manager, not in the database
        correct: true
        feedback: Right - you need the original back, so encrypt (with authentication), and keep the key elsewhere.
      - id: c
        text: Base64-encode them so they are not readable at a glance
        feedback: Base64 is not protection; anyone with the database can decode it.
      - id: d
        text: Store them in plain text, because the database is behind a firewall
        feedback: Databases, backups and logs leak. Defence in depth means the data stays protected even then.

  - id: m-tf-encryption-integrity
    type: true-false
    skill: explanation
    prompt: "True or false: if an attacker cannot read encrypted data, they also cannot change it in a meaningful way."
    answer: false
    explanation: >-
      Without authentication, ciphertext can be malleable: as in the toy XOR example, flipping bits in the
      ciphertext flips the same bits in the plaintext, so an attacker who knows the format can change 100 into
      900 without the key. Authenticated encryption (AES-GCM, ChaCha20-Poly1305) detects such changes.

  - id: m-signed-cookie
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Implement tamper-proof cookies with HMAC-SHA256 and the given `KEY`.

      - `sign(value)` returns `"<value>.<hex tag>"`, where the tag is the hex HMAC-SHA256 of `value`.
      - `unsign(cookie)` returns the value if the tag is valid, otherwise `None`. Values may themselves
        contain dots, so split on the **last** dot. Compare tags in constant time.
    starterCode: |
      import hashlib, hmac

      KEY = b"demo-cookie-key"   # real apps load this from a secret store

      def sign(value):
          return value

      def unsign(cookie):
          return cookie
    solution: |
      import hashlib, hmac

      KEY = b"demo-cookie-key"   # real apps load this from a secret store

      def sign(value):
          tag = hmac.new(KEY, value.encode(), hashlib.sha256).hexdigest()
          return f"{value}.{tag}"

      def unsign(cookie):
          value, dot, tag = cookie.rpartition(".")
          if not dot:
              return None
          expected = hmac.new(KEY, value.encode(), hashlib.sha256).hexdigest()
          if hmac.compare_digest(expected, tag):
              return value
          return None
    tests:
      - name: sign produces value.tag
        code: |
          import hashlib, hmac
          expected = "user=ana." + hmac.new(KEY, b"user=ana", hashlib.sha256).hexdigest()
          assert sign("user=ana") == expected, f"sign('user=ana') should be 'user=ana.<hex HMAC-SHA256 of the value>', got {sign('user=ana')!r}."
      - name: Round trip, including dots in the value
        code: |
          for value in ["user=ana", "user=ana.smith", ""]:
              assert unsign(sign(value)) == value, f"unsign(sign({value!r})) should give {value!r} back. Split on the last dot (rpartition)."
      - name: Rejects tampering
        code: |
          cookie = sign("role=viewer")
          tag = cookie.rsplit(".", 1)[1]
          assert unsign("role=admin." + tag) is None, "Changing the value must invalidate the cookie."
          assert unsign(cookie[:-1] + ("0" if cookie[-1] != "0" else "1")) is None, "Changing the tag must invalidate the cookie."
          assert unsign("no-dot-here") is None, "A cookie without a tag must be rejected."
      - name: Constant-time comparison
        code: |
          assert calls("compare_digest"), "Use hmac.compare_digest to compare tags."
    hints:
      - "`hmac.new(KEY, value.encode(), hashlib.sha256).hexdigest()` is the tag."
      - "`cookie.rpartition(\".\")` returns (before, \".\", after) using the last dot; if there is no dot, the middle part is empty."
    explanation: >-
      The tag binds the value to the server's key: changing either part, or forging a tag without the key, fails
      verification. Splitting on the last dot keeps values containing dots intact, and compare_digest avoids a
      timing side channel. Note that signing is not encrypting - the value is still readable by the user.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-salt, m-mcq-session-id, m-design-hash-or-encrypt, m-tf-encryption-integrity, m-signed-cookie]

cheatsheet: |
  ```python
  import base64, hashlib, hmac, secrets

  base64.b64encode(b"data")                       # encoding: NOT secret
  hashlib.sha256(b"data").hexdigest()             # integrity fingerprint (64 hex chars)
  tag = hmac.new(key, msg, hashlib.sha256).hexdigest()   # message authentication
  hmac.compare_digest(tag, received)              # constant-time comparison
  secrets.token_urlsafe(32)                       # tokens, session IDs, reset links
  secrets.token_bytes(16)                         # salts
  # Passwords (on CPython): argon2-cffi PasswordHasher, hashlib.scrypt(..., n=2**17, r=8, p=1, maxmem=...)
  #                         or hashlib.pbkdf2_hmac("sha256", pw, salt, 600_000)
  ```
  - Encoding ≠ hashing ≠ encryption · MD5/SHA-1: never for security
  - Passwords: unique salt + slow (memory-hard) hash; store parameters with the hash
  - Encryption needs authentication (AES-GCM / ChaCha20-Poly1305), fresh nonces, keys in a KMS
  - TLS: public-key for key exchange + server identity; symmetric AEAD for data
  - Don't roll your own crypto
