id: security.cryptography-basics
concept: security.cryptography-basics
title: Cryptography Basics
subtitle: Hashes, MACs, password storage, randomness and encryption
estimatedMinutes: 60
reviewedOn: 2026-10-23
summary: >-
  Choose the right cryptographic tool for the job: encoding is not encryption, hashes give integrity, HMACs
  prove a message came from a key holder, passwords need salted slow hashing, tokens need the `secrets`
  module, and encryption (symmetric, public-key, and the two combined in TLS) protects confidentiality. You
  will use Python's `hashlib`, `hmac` and `secrets`, build PBKDF2 from HMAC to see how password hashing
  works, and learn why real systems use well-reviewed libraries instead of home-made crypto.
objectives:
  - Distinguish encoding, hashing, MACs and encryption, and choose the right one for a requirement.
  - Explain the properties of a cryptographic hash and use SHA-256 to check integrity.
  - Store and verify passwords with a unique salt and a slow password-hashing function, comparing in constant time.
  - Sign and verify messages with HMAC, and generate tokens with the secrets module instead of random.
  - Explain symmetric vs public-key encryption, why encryption needs authentication, and how TLS combines them.
