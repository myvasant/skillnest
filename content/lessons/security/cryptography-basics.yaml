          pass
    solution: |
      import hmac
      import secrets

      ITERATIONS = 10_000   # kept small so the checks run quickly; production: 600,000 or more

      def pbkdf2_sha256(password, salt, iterations, length=32):
          """Given helper: PBKDF2-HMAC-SHA256 (RFC 8018). Takes and returns bytes."""
          result, block = b"", 1
          while len(result) < length:
              u = hmac.digest(password, salt + block.to_bytes(4, "big"), "sha256")
              acc = int.from_bytes(u, "big")
              for _ in range(iterations - 1):
                  u = hmac.digest(password, u, "sha256")
                  acc ^= int.from_bytes(u, "big")
              result += acc.to_bytes(32, "big")
              block += 1
          return result[:length]

      def hash_password(password, salt=None):
          if salt is None:
              salt = secrets.token_bytes(16)
          digest = pbkdf2_sha256(password.encode(), salt, ITERATIONS)
          return f"pbkdf2_sha256${ITERATIONS}${salt.hex()}${digest.hex()}"

      def verify_password(password, stored):
          algorithm, iterations, salt_hex, digest_hex = stored.split("$")
          if algorithm != "pbkdf2_sha256":
              return False
          candidate = pbkdf2_sha256(password.encode(), bytes.fromhex(salt_hex), int(iterations))
          return hmac.compare_digest(candidate.hex(), digest_hex)
    tests:
      - name: Stored format is correct
        code: |
          salt = b"0123456789abcdef"
          stored = hash_password("pw", salt)
          assert isinstance(stored, str), f"hash_password should return a str, got {stored!r}."
          parts = stored.split("$")
          assert len(parts) == 4 and parts[0] == "pbkdf2_sha256", f"Expected 'pbkdf2_sha256$...$...$...', got {stored!r}."
          assert parts[1] == str(ITERATIONS), f"The second field should be the iteration count {ITERATIONS}, got {parts[1]!r}."
          assert parts[2] == salt.hex(), "The third field should be salt.hex()."
          assert parts[3] == pbkdf2_sha256(b"pw", salt, ITERATIONS).hex(), "The fourth field should be pbkdf2_sha256(password.encode(), salt, ITERATIONS).hex()."
      - name: Verifies right and wrong passwords
        code: |
          stored = hash_password("correct horse", b"fixed-test-salt!")
          assert verify_password("correct horse", stored) is True, "The right password must verify (return True)."
          assert verify_password("Correct horse", stored) is False, "A different password must not verify (return False)."
          assert verify_password("", stored) is False, "An empty password must not verify."
      - name: A new random salt each time
        code: |
          a = hash_password("same password")
          b = hash_password("same password")
          assert a != b, "With no salt given, each call must create a new random salt, so two hashes of the same password differ."
          assert len(a.split("$")[2]) == 32, "Use a 16-byte salt (32 hex characters): secrets.token_bytes(16)."
          assert verify_password("same password", a) and verify_password("same password", b), "Both hashes must still verify."
          assert calls("token_bytes") or calls("token_hex") or calls("urandom"), "Create salts with the secrets module (secrets.token_bytes(16)), never with random."
      - name: Uses the stored iteration count
        code: |
          salt = b"older-hash-salt!"
          old = "pbkdf2_sha256$1000$" + salt.hex() + "$" + pbkdf2_sha256(b"pw", salt, 1000).hex()
          assert verify_password("pw", old) is True, "verify_password must read the iteration count from the stored string, so hashes made with older settings still verify."
      - name: Compares in constant time
        code: |
          assert calls("compare_digest"), "Compare the hashes with hmac.compare_digest, not ==."
    hints:
      - "`stored.split(\"$\")` gives the four parts; `int(...)` and `bytes.fromhex(...)` turn them back into numbers and bytes."
      - "`pbkdf2_sha256` takes bytes - call `password.encode()` first."
      - "Return `hmac.compare_digest(candidate.hex(), digest_hex)` so the result is True or False."
    feedback:
      - when: { errorType: TypeError }
        message: The helper works on bytes. Convert the password with `.encode()`, and the stored hex salt with `bytes.fromhex()`.
      - when: { codeContains: "import random" }
        message: Salts must come from `secrets` (a cryptographically secure generator), not `random`.
    explanation: >-
      The stored string carries everything verification needs - algorithm, cost, salt and hash - so you can
      raise ITERATIONS later without breaking old accounts (and rehash them on their next login). A fresh salt
      per password defeats precomputed tables, and compare_digest avoids leaking timing information.

  - id: debug-webhook
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      A payment provider signs each webhook it sends you: the `X-Signature` header holds the hex
      **HMAC-SHA256** of the raw request body, keyed with a shared secret. This check rejects genuine
      webhooks and also has a security weakness. Fix both problems.
    starterCode: |
      import hashlib, hmac

      WEBHOOK_SECRET = b"whsec_demo_only"   # real code loads this from a secret store

      def signature_is_valid(body: bytes, signature: str) -> bool:
          expected = hashlib.sha256(WEBHOOK_SECRET + body).hexdigest()
          return expected == signature
    solution: |
      import hashlib, hmac

      WEBHOOK_SECRET = b"whsec_demo_only"   # real code loads this from a secret store

      def signature_is_valid(body: bytes, signature: str) -> bool:
          expected = hmac.new(WEBHOOK_SECRET, body, hashlib.sha256).hexdigest()
          return hmac.compare_digest(expected, signature)
    tests:
      - name: Accepts genuine signatures
        code: |
          import hashlib, hmac
          body = b'{"event": "payment.succeeded", "order": 42}'
          good = hmac.new(WEBHOOK_SECRET, body, hashlib.sha256).hexdigest()
          assert signature_is_valid(body, good) is True, "A genuine HMAC-SHA256 signature must be accepted. sha256(secret + body) is not an HMAC - use hmac.new(WEBHOOK_SECRET, body, hashlib.sha256)."
      - name: Rejects tampered bodies and wrong keys
        code: |
          import hashlib, hmac
          body = b'{"event": "payment.succeeded", "order": 42}'
          good = hmac.new(WEBHOOK_SECRET, body, hashlib.sha256).hexdigest()
          assert signature_is_valid(b'{"event": "payment.succeeded", "order": 43}', good) is False, "A changed body must be rejected."
          forged = hmac.new(b"attacker-key", body, hashlib.sha256).hexdigest()
          assert signature_is_valid(body, forged) is False, "A signature made with a different key must be rejected."
          assert signature_is_valid(body, "not-a-signature") is False, "Garbage signatures must be rejected."
      - name: Compares in constant time
        code: |
          assert calls("compare_digest"), "Compare signatures with hmac.compare_digest so response timing does not leak how much of a forged signature was right."
    hints:
      - "The provider uses HMAC, not a plain hash of secret + body. Which function in the `hmac` module computes one?"
      - "`hmac.new(key, message, hashlib.sha256).hexdigest()` gives the expected hex signature."
      - Replace `==` with `hmac.compare_digest(expected, signature)`.
    feedback:
      - when: { codeContains: "== signature" }
        message: Comparing with == can leak timing information. Use hmac.compare_digest.
    explanation: >-
      `sha256(secret + body)` is not what the provider computes, so genuine webhooks failed - and that
      construction is also vulnerable to length-extension attacks. HMAC is the standard keyed construction.
      `compare_digest` removes the timing side channel that `==` can create.

  - id: reset-token
    type: code
    skill: transfer
    prompt: |
      Password-reset links contain a token: anyone who can guess it can take over the account. Rewrite
      `new_reset_token()` so that it returns an **unguessable, URL-safe** string with at least 32 bytes of
      randomness. Do not use the `random` module.
    starterCode: |
      import random

      def new_reset_token():
          # Make an unguessable, URL-safe token with at least 32 bytes of randomness.
          return str(random.randint(100000, 999999))
    solution: |
      import secrets

      def new_reset_token():
          return secrets.token_urlsafe(32)
    tests:
      - name: Long enough
        code: |
          token = new_reset_token()
          assert isinstance(token, str), f"Return a str, got {type(token).__name__}."
          assert len(token) >= 43, f"32 random bytes give at least 43 URL-safe characters; your token has {len(token)} characters."
      - name: URL-safe characters only
        code: |
          import string
          allowed = set(string.ascii_letters + string.digits + "-_")
          token = new_reset_token()
          assert set(token) <= allowed, f"Use only URL-safe characters (letters, digits, - and _); got {token!r}."
      - name: Different every time
        code: |
          tokens = {new_reset_token() for _ in range(200)}
          assert len(tokens) == 200, "Every call must return a new token."
      - name: Does not use the random module
        code: |
          import ast
          imported = set()
          for node in ast.walk(ast.parse(source)):
              if isinstance(node, ast.Import):
                  imported |= {alias.name.split(".")[0] for alias in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split(".")[0])
          assert "random" not in imported, "The random module is predictable - use the secrets module for security tokens."
          assert "secrets" in imported, "Import and use the secrets module."
    hints:
      - The `secrets` module has a function that returns URL-safe text directly.
      - "`secrets.token_urlsafe(32)` uses 32 random bytes."
    explanation: >-
      `secrets.token_urlsafe(32)` gives 256 bits of randomness from the operating system's secure generator,
      encoded with URL-safe Base64 (43 characters). A six-digit `random` number has only a million
      possibilities and comes from a predictable generator. In production, also store only a hash of the token,
      expire it quickly and allow it to be used once.

  - id: parsons-hmac
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines into a program that signs a message and verifies it, printing `True` for the
      original and `False` for a modified message. Two lines are distractors.
    solution: |
      import hashlib, hmac
      key = b"demo-key-from-secret-store"
      def sign(body):
          return hmac.new(key, body, hashlib.sha256).hexdigest()
      def verify(body, tag):
          return hmac.compare_digest(sign(body), tag)
      tag = sign(b"order 42 paid")
      print(verify(b"order 42 paid", tag))
      print(verify(b"order 43 paid", tag))
    distractors:
      - "    return hashlib.sha256(body).hexdigest()"
      - "tag = sign(\"order 42 paid\")"
    expectedOutput: |
      True
      False
    explanation: >-
      The key and `sign` must exist before `verify` uses them, and the tag is computed before verifying. A plain
      `sha256(body)` uses no key, so anyone could forge it, and HMAC needs bytes, not a str.

