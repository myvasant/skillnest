id: security.supply-chain
concept: security.supply-chain
title: Dependency and supply-chain security
subtitle: Pin and audit dependencies (pip-audit, Dependabot), beware typosquatting, verify provenance and generate
  SBOMs
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Pin and audit dependencies (pip-audit, Dependabot), beware typosquatting, verify provenance and generate
  SBOMs.
objectives:
- Explain the core engineering decisions behind dependency and supply-chain security.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Software Supply Chain Security Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.html
  publisher: OWASP Cheat Sheet Series
- title: Supply-chain Levels for Software Artifacts (SLSA)
  url: https://slsa.dev/
  publisher: OpenSSF
- title: Software Bill of Materials (SBOM)
  url: https://www.cisa.gov/sbom
  publisher: US Cybersecurity and Infrastructure Security Agency (CISA)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Pin and audit dependencies (pip-audit, Dependabot), beware typosquatting, verify provenance and generate
      SBOMs. Most of the code you ship was written by someone else; a vulnerable or malicious dependency, or a compromised
      build, runs with your application's full privileges.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Pin exact versions in a lock file, with hashes where supported (for example `pip install --require-hashes
      -r requirements.txt`), so builds are reproducible and cannot silently pull a new release.

      - Scan dependencies for known vulnerabilities in CI (`pip-audit`, Dependabot alerts and updates) and update
      regularly in small steps.

      - Watch for typosquatting and dependency confusion - check the exact package name, maintainers and project
      history before installing, and configure private package indexes carefully.

      - An SBOM (Software Bill of Materials, in SPDX or CycloneDX format) lists every component you ship, so you
      can quickly answer "are we affected?" when a new vulnerability is announced.

      - SLSA and Sigstore address build integrity - signed provenance shows which source and which pipeline produced
      an artefact.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Popular packages are not automatically safe; maintainer accounts and build pipelines do get compromised.

      - Not every reported CVE is exploitable in your application, but each one needs triage rather than blanket
      dismissal.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def verify_dependency_lock(expected, installed):\n    return {name: installed.get(name)==version for\
      \ name,version in expected.items()}\n\nprint(verify_dependency_lock({\"requests\":\"2.32.0\"},{\"requests\"\
      :\"2.32.0\"}))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: supply-chain-code
  - type: item
    ref: supply-chain-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Pin exact versions in a lock file, with hashes where supported (for example `pip install --require-hashes
      -r requirements.txt`), so builds are reproducible and cannot silently pull a new release.

      - Scan dependencies for known vulnerabilities in CI (`pip-audit`, Dependabot alerts and updates) and update
      regularly in small steps.

      - Watch for typosquatting and dependency confusion - check the exact package name, maintainers and project
      history before installing, and configure private package indexes carefully.

      - An SBOM (Software Bill of Materials, in SPDX or CycloneDX format) lists every component you ship, so you
      can quickly answer "are we affected?" when a new vulnerability is announced.

      - SLSA and Sigstore address build integrity - signed provenance shows which source and which pipeline produced
      an artefact.


      **Watch for**

      - Popular packages are not automatically safe; maintainer accounts and build pipelines do get compromised.

      - Not every reported CVE is exploitable in your application, but each one needs triage rather than blanket
      dismissal.'
  - type: item
    ref: supply-chain-mcq
  - type: item
    ref: supply-chain-tf
  - type: item
    ref: supply-chain-code
items:
- id: supply-chain-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of dependency and supply-chain security?
  explanation: Pin exact versions in a lock file, with hashes where supported (for example `pip install --require-hashes
    -r requirements.txt`), so builds are reproducible and cannot silently pull a new release.
  options:
  - id: a
    text: Pin exact versions in a lock file, with hashes where supported (for example `pip install --require-hashes
      -r requirements.txt`), so builds are reproducible and cannot silently pull a new release.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Popular packages are not automatically safe; maintainer accounts and build pipelines do get compromised.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: supply-chain-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Popular packages are not automatically safe; maintainer accounts and build pipelines do get compromised.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: supply-chain-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply dependency and supply-chain security to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: supply-chain-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for dependency and supply-chain security. The assertions cover the expected path and
    an important boundary case.
  starterCode: "def verify_dependency_lock(expected, installed):\n    raise NotImplementedError('Complete this function')"
  solution: "def verify_dependency_lock(expected, installed):\n    return {name: installed.get(name)==version for\
    \ name,version in expected.items()}"
  tests:
  - name: Core behaviour
    code: assert verify_dependency_lock({"pkg":"1.0"},{"pkg":"1.0"})["pkg"] is True
  - name: Boundary behaviour
    code: assert verify_dependency_lock({"pkg":"1.0"},{"pkg":"2.0"})["pkg"] is False
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - supply-chain-mcq
  - supply-chain-tf
  - supply-chain-code
