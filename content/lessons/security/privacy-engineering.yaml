      - Minimise and limit - collect only the fields you need, set retention periods with automatic deletion, and
      restrict access by role.

      - Pseudonymised data (identifiers replaced by tokens) is still personal data under GDPR for anyone who can
      re-link it, such as whoever holds the key; true anonymisation is hard to achieve.

      - India''s Digital Personal Data Protection Act 2023 requires notice and consent (or another legitimate use),
      purpose limitation, security safeguards, breach notification and honouring data principals'' rights; its Rules
