id: security.privacy-engineering
concept: security.privacy-engineering
title: Privacy engineering
subtitle: Identify personal data, collect the minimum, limit retention, pseudonymise where possible and respect
  regulations such as GDPR and India's DPDP Act
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Identify personal data, collect the minimum, limit retention, pseudonymise where possible and respect regulations
  such as GDPR and India's DPDP Act.
objectives:
- Explain the core engineering decisions behind privacy engineering.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: 'GDPR Art. 5: Principles relating to processing of personal data'
  url: https://gdpr-info.eu/art-5-gdpr/
  publisher: gdpr-info.eu (consolidated text of Regulation (EU) 2016/679)
- title: The Digital Personal Data Protection Act, 2023 (Gazette of India)
  url: https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf
  publisher: Ministry of Electronics and Information Technology, Government of India
- title: NIST Privacy Framework
  url: https://www.nist.gov/privacy-framework
  publisher: NIST
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Identify personal data, collect the minimum, limit retention, pseudonymise where possible and respect
      regulations such as GDPR and India's DPDP Act. Personal data brings legal obligations and real harm when it
      leaks or is misused; designing privacy in from the start is far cheaper than retrofitting it after a breach
      or complaint.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Personal data is any information about an identifiable person - names and emails, but also IP addresses,
      device IDs, location and free text that mentions people.

      - GDPR Article 5 principles are lawfulness, fairness and transparency; purpose limitation; data minimisation;
      accuracy; storage limitation; integrity and confidentiality; and accountability.

      - Minimise and limit - collect only the fields you need, set retention periods with automatic deletion, and
      restrict access by role.

      - Pseudonymised data (identifiers replaced by tokens) is still personal data under GDPR for anyone who can
      re-link it, such as whoever holds the key; true anonymisation is hard to achieve.

      - India''s Digital Personal Data Protection Act 2023 requires notice and consent (or another legitimate use),
      purpose limitation, security safeguards, breach notification and honouring data principals'' rights; its Rules
      were notified in November 2025 and phase in over about 18 months, so check the current status.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Hashing an email address does not anonymise it; common values can be re-identified by hashing guesses.

      - Keeping data "in case we need it later" is not a lawful purpose.

      - This concept is awareness, not legal advice; your organisation''s privacy or legal team decides real obligations.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def minimise_fields(record, required_fields):\n    return {key:record[key] for key in required_fields\
      \ if key in record}\n\nprint(minimise_fields({\"name\":\"Ada\",\"email\":\"a@example.test\",\"ssn\":\"secret\"\
      },{\"name\"}))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: privacy-engineering-code
  - type: item
    ref: privacy-engineering-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
