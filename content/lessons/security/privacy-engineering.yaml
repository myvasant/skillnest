items:
- id: privacy-engineering-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of privacy engineering?
  explanation: Personal data is any information about an identifiable person - names and emails, but also IP addresses,
    device IDs, location and free text that mentions people.
  options:
  - id: a
    text: Personal data is any information about an identifiable person - names and emails, but also IP addresses,
      device IDs, location and free text that mentions people.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Hashing an email address does not anonymise it; common values can be re-identified by hashing guesses.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: privacy-engineering-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Hashing an email address does not anonymise it; common values can be re-identified by hashing guesses.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: privacy-engineering-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply privacy engineering to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: privacy-engineering-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for privacy engineering. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def minimise_fields(record, required_fields):\n    raise NotImplementedError('Complete this function')"
  solution: "def minimise_fields(record, required_fields):\n    return {key:record[key] for key in required_fields\
    \ if key in record}"
  tests:
  - name: Core behaviour
    code: assert minimise_fields({"name":"Ada","email":"x"},{"name"}) == {"name":"Ada"}
  - name: Boundary behaviour
    code: assert minimise_fields({"name":"Ada"},set()) == {}
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - privacy-engineering-mcq
  - privacy-engineering-tf
  - privacy-engineering-code
