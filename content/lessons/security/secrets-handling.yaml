id: security.secrets-handling
concept: security.secrets-handling
title: Handling secrets
subtitle: Store secrets in environment variables or vaults, scan repositories for leaks, rotate on exposure and
  keep them out of logs and prompts
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Store secrets in environment variables or vaults, scan repositories for leaks, rotate on exposure and keep
  them out of logs and prompts.
objectives:
- Explain the core engineering decisions behind handling secrets.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Secrets Management Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  publisher: OWASP Cheat Sheet Series
- title: Secret scanning
  url: https://docs.github.com/en/code-security/concepts/secret-security/secret-scanning
  publisher: GitHub
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Store secrets in environment variables or vaults, scan repositories for leaks, rotate on exposure and
      keep them out of logs and prompts. Leaked API keys and database passwords are among the most common causes
      of breaches and surprise cloud bills; good habits keep secrets out of code, history and logs.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Never commit secrets; load them at runtime from environment variables or a secret manager (such as
      HashiCorp Vault, OpenBao or a cloud secret manager), and keep `.env` files in `.gitignore`.

      - A secret pushed to a repository is compromised even if you delete it later, because history and clones keep
      it; revoke and rotate it immediately.

      - Scan for leaks before and after pushing - pre-commit hooks with a scanner such as gitleaks, plus GitHub
      secret scanning and push protection.

      - Prefer short-lived, narrowly scoped credentials, such as OIDC federation from CI to the cloud instead of
      long-lived access keys.

      - Keep secrets out of logs, error messages, URLs, container images and LLM prompts.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Environment variables are not encrypted; they stop secrets being committed, not being read by anyone
      who can inspect the process.

      - A private repository is not a safe place for secrets; access widens over time and repositories get cloned
      and forked.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def redact_config(config, secret_keys):\n    return {key:(\"[REDACTED]\" if key.lower() in {x.lower()\
      \ for x in secret_keys} else value) for key,value in config.items()}\n\nprint(redact_config({\"DB_HOST\":\"\
      db\",\"API_KEY\":\"abc123\"},{\"api_key\"}))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: secrets-handling-code
  - type: item
    ref: secrets-handling-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Never commit secrets; load them at runtime from environment variables or a secret manager (such as HashiCorp
      Vault, OpenBao or a cloud secret manager), and keep `.env` files in `.gitignore`.

      - A secret pushed to a repository is compromised even if you delete it later, because history and clones keep
      it; revoke and rotate it immediately.

      - Scan for leaks before and after pushing - pre-commit hooks with a scanner such as gitleaks, plus GitHub
      secret scanning and push protection.

      - Prefer short-lived, narrowly scoped credentials, such as OIDC federation from CI to the cloud instead of
      long-lived access keys.

      - Keep secrets out of logs, error messages, URLs, container images and LLM prompts.


      **Watch for**

      - Environment variables are not encrypted; they stop secrets being committed, not being read by anyone who
      can inspect the process.

      - A private repository is not a safe place for secrets; access widens over time and repositories get cloned
      and forked.'
  - type: item
    ref: secrets-handling-mcq
  - type: item
