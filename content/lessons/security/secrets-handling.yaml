items:
- id: secrets-handling-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of handling secrets?
  explanation: Never commit secrets; load them at runtime from environment variables or a secret manager (such as
    HashiCorp Vault, OpenBao or a cloud secret manager), and keep `.env` files in `.gitignore`.
  options:
  - id: a
    text: Never commit secrets; load them at runtime from environment variables or a secret manager (such as HashiCorp
      Vault, OpenBao or a cloud secret manager), and keep `.env` files in `.gitignore`.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Environment variables are not encrypted; they stop secrets being committed, not being read by anyone who
      can inspect the process.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: secrets-handling-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Environment variables are not encrypted; they stop secrets being committed, not being read by anyone who
    can inspect the process.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: secrets-handling-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply handling secrets to a realistic engineering scenario. State your assumptions, explain your decision,
