    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: secrets-handling-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for handling secrets. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def redact_config(config, secret_keys):\n    raise NotImplementedError('Complete this function')"
  solution: "def redact_config(config, secret_keys):\n    secret_keys={x.lower() for x in secret_keys}\n    return\
    \ {key:(\"[REDACTED]\" if key.lower() in secret_keys else value) for key,value in config.items()}"
  tests:
  - name: Core behaviour
    code: r=redact_config({"DB_HOST":"db","API_KEY":"secret"},{"api_key"})
  - name: Boundary behaviour
    code: assert r["API_KEY"] == "[REDACTED]" and r["DB_HOST"] == "db"
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
