id: security.threat-modeling
concept: security.threat-modeling
title: Threat modelling
subtitle: Map data flows and trust boundaries, ask what can go wrong (for example with STRIDE), and prioritise mitigations
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Map data flows and trust boundaries, ask what can go wrong (for example with STRIDE), and prioritise mitigations.
objectives:
- Explain the core engineering decisions behind threat modelling.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Threat Modeling Cheat Sheet
  url: https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
  publisher: OWASP Cheat Sheet Series
- title: Threat Modeling Manifesto
  url: https://www.threatmodelingmanifesto.org/
  publisher: Threat Modeling Manifesto working group
- title: Threats - Microsoft Threat Modeling Tool (STRIDE)
  url: https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats
  publisher: Microsoft
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Map data flows and trust boundaries, ask what can go wrong (for example with STRIDE), and prioritise mitigations.
      You cannot defend against everything; threat modelling finds the most likely and damaging attacks on your
      design early, when fixes are cheap.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The four questions of the Threat Modeling Manifesto - What are we working on? What can go wrong? What
      are we going to do about it? Did we do a good enough job?

      - Draw a data flow diagram of external entities, processes, data stores and data flows, and mark the trust
      boundaries where data crosses between levels of trust.

      - STRIDE prompts for what can go wrong - Spoofing, Tampering, Repudiation, Information disclosure, Denial
      of service and Elevation of privilege.

      - For each threat decide to mitigate, eliminate (remove the feature), transfer or accept it, and record the
      decision and its owner.

      - Revisit the model when the design changes; it is a living document, not a one-off exercise.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Threat modelling is not only for security specialists; a 30-minute whiteboard session on a new feature
      finds real issues.

      - It is not a generic vulnerability checklist; it is reasoning about your specific design and its data.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def risk_score(likelihood, impact):\n    if not 1<=likelihood<=5 or not 1<=impact<=5: raise ValueError(\"\
      scores must be 1 through 5\")\n    return likelihood*impact\n\nprint(risk_score(3,5))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: threat-modeling-code
  - type: item
    ref: threat-modeling-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - The four questions of the Threat Modeling Manifesto - What are we working on? What can go wrong? What are
      we going to do about it? Did we do a good enough job?

      - Draw a data flow diagram of external entities, processes, data stores and data flows, and mark the trust
      boundaries where data crosses between levels of trust.

      - STRIDE prompts for what can go wrong - Spoofing, Tampering, Repudiation, Information disclosure, Denial
      of service and Elevation of privilege.

      - For each threat decide to mitigate, eliminate (remove the feature), transfer or accept it, and record the
      decision and its owner.

      - Revisit the model when the design changes; it is a living document, not a one-off exercise.


      **Watch for**

      - Threat modelling is not only for security specialists; a 30-minute whiteboard session on a new feature finds
      real issues.

      - It is not a generic vulnerability checklist; it is reasoning about your specific design and its data.'
  - type: item
    ref: threat-modeling-mcq
  - type: item
    ref: threat-modeling-tf
  - type: item
    ref: threat-modeling-code
items:
- id: threat-modeling-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of threat modelling?
  explanation: The four questions of the Threat Modeling Manifesto - What are we working on? What can go wrong?
    What are we going to do about it? Did we do a good enough job?
  options:
  - id: a
    text: The four questions of the Threat Modeling Manifesto - What are we working on? What can go wrong? What
      are we going to do about it? Did we do a good enough job?
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Threat modelling is not only for security specialists; a 30-minute whiteboard session on a new feature
      finds real issues.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: threat-modeling-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Threat modelling is not only for security specialists; a 30-minute whiteboard session on a new feature
    finds real issues.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: threat-modeling-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply threat modelling to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: threat-modeling-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for threat modelling. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def risk_score(likelihood, impact):\n    raise NotImplementedError('Complete this function')"
  solution: "def risk_score(likelihood, impact):\n    if not 1<=likelihood<=5 or not 1<=impact<=5: raise ValueError(\"\
    scores must be 1 through 5\")\n    return likelihood*impact"
  tests:
  - name: Core behaviour
    code: assert risk_score(3,5) == 15
  - name: Boundary behaviour
    code: 'try: risk_score(0,5)

      except ValueError: pass

      else: raise AssertionError("out-of-range score must fail")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - threat-modeling-mcq
  - threat-modeling-tf
  - threat-modeling-code
