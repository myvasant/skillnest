id: graphs.relational-vs-graph
concept: graphs.relational-vs-graph
title: Relational vs graph modelling
subtitle: Graphs shine when queries traverse many variable-length relationships; relational databases remain better
  for most tabular, aggregate-heavy workloads
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Graphs shine when queries traverse many variable-length relationships; relational databases remain better
  for most tabular, aggregate-heavy workloads.
objectives:
- Explain the architecture and trade-offs behind relational vs graph modelling.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Transition from relational to graph database
  url: https://neo4j.com/docs/getting-started/appendix/graphdb-concepts/graphdb-vs-rdbms/
  publisher: Neo4j
- title: WITH queries (common table expressions, including WITH RECURSIVE)
  url: https://www.postgresql.org/docs/current/queries-with.html
  publisher: PostgreSQL Global Development Group
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Graphs shine when queries traverse many variable-length relationships; relational databases remain better
      for most tabular, aggregate-heavy workloads. Choosing a graph database for a tabular workload — or forcing
      deeply connected queries into SQL — causes pain. Knowing where each model shines lets you choose deliberately,
      or combine them.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Relational databases connect rows at query time through foreign-key joins; graph databases store relationships
      directly, so traversals follow links from node to node (index-free adjacency in native graph engines).

      - Graphs excel at variable-depth and path questions — friends of friends, shortest routes, dependency chains
      — where the number of hops is not fixed in advance.

      - SQL can traverse too, using recursive common table expressions (`WITH RECURSIVE`), which is often enough
      at moderate depth and data size.

      - Relational systems remain stronger for large aggregations, reporting and strict schemas with mature tooling.

      - Hybrids are common — keep the system of record relational and project a graph, or use an extension such
      as Apache AGE or SQL/PGQ for relationship-heavy queries.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A graph database is not automatically faster; for simple lookups and aggregations it is often slower.

      - Having many-to-many join tables does not by itself mean you need a graph database.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def relationship_count(rows, source, target):\n    return sum(row[\"source\"]==source and row[\"target\"\
      ]==target for row in rows)\n\nprint(relationship_count([{\"source\":\"A\",\"target\":\"B\"},{\"source\":\"\
      A\",\"target\":\"C\"}],\"A\",\"B\"))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: relational-vs-graph-code
  - type: item
    ref: relational-vs-graph-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Relational databases connect rows at query time through foreign-key joins; graph databases store relationships
      directly, so traversals follow links from node to node (index-free adjacency in native graph engines).

      - Graphs excel at variable-depth and path questions — friends of friends, shortest routes, dependency chains
      — where the number of hops is not fixed in advance.

      - SQL can traverse too, using recursive common table expressions (`WITH RECURSIVE`), which is often enough
      at moderate depth and data size.

      - Relational systems remain stronger for large aggregations, reporting and strict schemas with mature tooling.

      - Hybrids are common — keep the system of record relational and project a graph, or use an extension such
      as Apache AGE or SQL/PGQ for relationship-heavy queries.


      **Limitations**

      - A graph database is not automatically faster; for simple lookups and aggregations it is often slower.

      - Having many-to-many join tables does not by itself mean you need a graph database.'
