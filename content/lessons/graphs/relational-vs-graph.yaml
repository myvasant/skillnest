items:
- id: relational-vs-graph-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of relational vs graph modelling?
  explanation: Relational databases connect rows at query time through foreign-key joins; graph databases store
    relationships directly, so traversals follow links from node to node (index-free adjacency in native graph engines).
  options:
  - id: a
    text: Relational databases connect rows at query time through foreign-key joins; graph databases store relationships
      directly, so traversals follow links from node to node (index-free adjacency in native graph engines).
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: A graph database is not automatically faster; for simple lookups and aggregations it is often slower.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: relational-vs-graph-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A graph database is not automatically faster; for simple lookups and aggregations it is often slower.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: relational-vs-graph-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing relational vs graph modelling for a production application. Explain the main design
    decision, one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: relational-vs-graph-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for relational vs graph modelling. The tests cover the main rule and
    a boundary or failure case.
  starterCode: "def relationship_count(rows, source, target):\n    raise NotImplementedError('Complete this function')"
  solution: "def relationship_count(rows, source, target):\n    return sum(row[\"source\"]==source and row[\"target\"\
    ]==target for row in rows)"
  tests:
  - name: Core behaviour
    code: assert relationship_count([{"source":"A","target":"B"}],"A","B") == 1
  - name: Failure or edge case
    code: assert relationship_count([],"A","B") == 0
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
