id: graphs.graph-modeling
concept: graphs.graph-modeling
title: Graph data modelling
subtitle: Decide what becomes a node, relationship or property based on the questions you will ask; avoid supernodes
  and model time explicitly
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Decide what becomes a node, relationship or property based on the questions you will ask; avoid supernodes
  and model time explicitly.
objectives:
- Explain the architecture and trade-offs behind graph data modelling.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Data modeling
  url: https://neo4j.com/docs/getting-started/data-modeling/
  publisher: Neo4j
- title: Indexes
  url: https://neo4j.com/docs/cypher-manual/current/indexes/
  publisher: Neo4j
  version: Cypher 25
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Decide what becomes a node, relationship or property based on the questions you will ask; avoid supernodes
      and model time explicitly. The same data can be modelled many ways, and a model that ignores your real queries
      leads to slow traversals, supernodes and awkward code. Good graph modelling starts from the questions.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- List the questions first, then sketch nodes (things), relationships (verbs between things) and properties
      (attributes) that answer them directly.

      - Make something a node when you need to connect to it, query it on its own or attach relationships to it
      (e.g. an `Address` shared by many customers); otherwise keep it a property.

      - Prefer specific relationship types (`:PURCHASED`, `:REVIEWED`) over a generic `:RELATED_TO` with a type
      property, because types are cheap to filter on during traversal.

      - Model events and changing facts explicitly (e.g. an `:Employment` node with start and end dates) when facts
      change over time or need their own relationships.

      - Watch for supernodes (e.g. a `Country` node everyone links to) and split them or store the value as a property;
      add uniqueness constraints on natural keys and indexes on lookup properties.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Copying a relational schema table-for-table misses the point; join tables usually become relationships.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def validate_graph(nodes, edges):\n    known=set(nodes)\n    return [(a,r,b) for a,r,b in edges if a\
      \ not in known or b not in known]\n\nprint(validate_graph([\"Ada\",\"Lab\"], [(\"Ada\",\"WORKS_AT\",\"Lab\"\
      ),(\"Ada\",\"KNOWS\",\"Grace\")]))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: graph-modeling-code
  - type: item
    ref: graph-modeling-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - List the questions first, then sketch nodes (things), relationships (verbs between things) and properties
      (attributes) that answer them directly.

      - Make something a node when you need to connect to it, query it on its own or attach relationships to it
      (e.g. an `Address` shared by many customers); otherwise keep it a property.

      - Prefer specific relationship types (`:PURCHASED`, `:REVIEWED`) over a generic `:RELATED_TO` with a type
      property, because types are cheap to filter on during traversal.

      - Model events and changing facts explicitly (e.g. an `:Employment` node with start and end dates) when facts
      change over time or need their own relationships.

      - Watch for supernodes (e.g. a `Country` node everyone links to) and split them or store the value as a property;
      add uniqueness constraints on natural keys and indexes on lookup properties.


      **Limitations**

      - Copying a relational schema table-for-table misses the point; join tables usually become relationships.'
  - type: item
    ref: graph-modeling-mcq
  - type: item
    ref: graph-modeling-tf
  - type: item
    ref: graph-modeling-code
items:
- id: graph-modeling-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of graph data modelling?
  explanation: List the questions first, then sketch nodes (things), relationships (verbs between things) and properties
    (attributes) that answer them directly.
  options:
  - id: a
    text: List the questions first, then sketch nodes (things), relationships (verbs between things) and properties
      (attributes) that answer them directly.
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: Copying a relational schema table-for-table misses the point; join tables usually become relationships.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: graph-modeling-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Copying a relational schema table-for-table misses the point; join tables usually become relationships.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: graph-modeling-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing graph data modelling for a production application. Explain the main design decision,
    one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: graph-modeling-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for graph data modelling. The tests cover the main rule and a boundary
    or failure case.
  starterCode: "def validate_graph(nodes, edges):\n    raise NotImplementedError('Complete this function')"
  solution: "def validate_graph(nodes, edges):\n    known=set(nodes)\n    return [(a,r,b) for a,r,b in edges if\
    \ a not in known or b not in known]"
  tests:
  - name: Core behaviour
    code: assert validate_graph(["A","B"], [("A","LINKS","B")]) == []
  - name: Failure or edge case
    code: assert validate_graph(["A"], [("A","LINKS","C")]) == [("A","LINKS","C")]
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - graph-modeling-mcq
  - graph-modeling-tf
  - graph-modeling-code
