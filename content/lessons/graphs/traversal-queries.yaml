  solution: "from collections import deque\ndef reachable(graph, start):\n    seen={start};queue=deque([start])\n\
    \    while queue:\n        node=queue.popleft()\n        for neighbour in graph.get(node, []):\n           \
    \ if neighbour not in seen: seen.add(neighbour);queue.append(neighbour)\n    return seen"
  tests:
