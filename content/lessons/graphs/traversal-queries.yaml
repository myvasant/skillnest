sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Variable-length patterns, shortest paths and neighbourhood queries — and how to keep them bounded and
      fast. The value of a graph lies in following connections, but unbounded traversals explode combinatorially.
      You need to express paths precisely and keep them bounded to stay fast.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Variable-length patterns such as `(a)-[:KNOWS*1..3]->(b)` match 1 to 3 hops; current Cypher also supports
      quantified path patterns such as `((:Station)-[:LINK]->(:Station)){1,5}`.

      - Shortest paths use `SHORTEST 1` / `ALL SHORTEST` in current Cypher (older code uses `shortestPath()` / `allShortestPaths()`)
      and count hops; weighted shortest paths need algorithms such as Dijkstra, for example from a graph-algorithms
      library.

      - Always bound the depth and start from a selective anchor found through an index (e.g. one user by ID) rather
      than scanning all nodes.

      - The number of paths grows roughly as average degree to the power of depth, and a few very high-degree supernodes
      can make a 3-hop query touch millions of paths.

      - Use `EXPLAIN` and `PROFILE` to see the query plan and the rows and database hits at each step.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Unbounded variable-length patterns are not just slower; on real graphs they can run effectively forever.

      - Shortest by hop count is not shortest by distance or cost; weights need a weighted algorithm.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "from collections import deque\ndef reachable(graph, start):\n    seen={start};queue=deque([start])\n\
      \    while queue:\n        node=queue.popleft()\n        for neighbour in graph.get(node, []):\n         \
      \   if neighbour not in seen: seen.add(neighbour);queue.append(neighbour)\n    return seen\n\ngraph={\"A\"\
      :[\"B\"],\"B\":[\"C\"],\"C\":[]}\nprint(reachable(graph,\"A\"))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: traversal-queries-code
  - type: item
