id: graphs.traversal-queries
concept: graphs.traversal-queries
title: Paths and traversals
subtitle: Variable-length patterns, shortest paths and neighbourhood queries — and how to keep them bounded and
  fast
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Variable-length patterns, shortest paths and neighbourhood queries — and how to keep them bounded and fast.
objectives:
- Explain the architecture and trade-offs behind paths and traversals.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
