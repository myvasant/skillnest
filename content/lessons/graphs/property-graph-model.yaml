id: graphs.property-graph-model
concept: graphs.property-graph-model
title: The property graph model
subtitle: Nodes with labels, relationships with types and direction, and key–value properties on both
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Nodes with labels, relationships with types and direction, and key–value properties on both.
objectives:
- Explain the architecture and trade-offs behind the property graph model.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Graph database concepts
  url: https://neo4j.com/docs/getting-started/graph-database/
  publisher: Neo4j
- title: GQL conformance (Cypher manual appendix)
  url: https://neo4j.com/docs/cypher-manual/current/appendix/gql-conformance/
  publisher: Neo4j
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Nodes with labels, relationships with types and direction, and key–value properties on both. Many domains
      — social networks, supply chains, software dependencies, fraud rings — are about connections. The property
      graph model stores relationships as first-class data, so you query them directly instead of reconstructing
      them through joins.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Nodes represent entities and can carry zero or more labels (e.g. `:Person`, `:Employee`).

      - Relationships connect exactly two nodes and always have one type (e.g. `:WORKS_AT`) and a direction; queries
      can still traverse them either way.

      - Both nodes and relationships hold key-value properties (e.g. `since: 2021`).

      - Most property-graph databases are schema-optional; constraints and indexes are added explicitly rather than
      required up front.

      - The ISO GQL standard (ISO/IEC 39075:2024) defines a property-graph data model and query language, and SQL/PGQ
      adds property-graph queries to SQL.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Graph databases are not only for social networks; any domain whose questions follow relationships can
      benefit.

      - Stored direction does not restrict traversal; you can match a relationship in either direction.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def add_edge(graph, source, relation, target):\n    graph.setdefault(source, []).append((relation,target))\n\
      \    graph.setdefault(target, [])\n    return graph\n\ngraph={}\nprint(add_edge(graph, \"Ada\", \"WORKS_AT\"\
      , \"Lab\"))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: property-graph-model-code
  - type: item
    ref: property-graph-model-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Nodes represent entities and can carry zero or more labels (e.g. `:Person`, `:Employee`).

      - Relationships connect exactly two nodes and always have one type (e.g. `:WORKS_AT`) and a direction; queries
      can still traverse them either way.

      - Both nodes and relationships hold key-value properties (e.g. `since: 2021`).

      - Most property-graph databases are schema-optional; constraints and indexes are added explicitly rather than
      required up front.

      - The ISO GQL standard (ISO/IEC 39075:2024) defines a property-graph data model and query language, and SQL/PGQ
      adds property-graph queries to SQL.


      **Limitations**

      - Graph databases are not only for social networks; any domain whose questions follow relationships can benefit.

      - Stored direction does not restrict traversal; you can match a relationship in either direction.'
  - type: item
    ref: property-graph-model-mcq
  - type: item
    ref: property-graph-model-tf
  - type: item
    ref: property-graph-model-code
items:
- id: property-graph-model-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of the property graph model?
  explanation: Nodes represent entities and can carry zero or more labels (e.g. `:Person`, `:Employee`).
  options:
  - id: a
    text: Nodes represent entities and can carry zero or more labels (e.g. `:Person`, `:Employee`).
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: Graph databases are not only for social networks; any domain whose questions follow relationships can
      benefit.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: property-graph-model-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Graph databases are not only for social networks; any domain whose questions follow relationships can
    benefit.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: property-graph-model-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing the property graph model for a production application. Explain the main design decision,
    one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: property-graph-model-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for the property graph model. The tests cover the main rule and a boundary
    or failure case.
  starterCode: "def add_edge(graph, source, relation, target):\n    raise NotImplementedError('Complete this function')"
  solution: "def add_edge(graph, source, relation, target):\n    graph.setdefault(source, []).append((relation,target))\n\
    \    graph.setdefault(target, [])\n    return graph"
  tests:
  - name: Core behaviour
    code: g=add_edge({},"Ada","WORKS_AT","Lab")
  - name: Failure or edge case
    code: 'assert g["Ada"] == [("WORKS_AT","Lab")]

      assert "Lab" in g'
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - property-graph-model-mcq
  - property-graph-model-tf
  - property-graph-model-code
