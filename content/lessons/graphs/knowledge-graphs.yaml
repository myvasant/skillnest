id: graphs.knowledge-graphs
concept: graphs.knowledge-graphs
title: Knowledge graphs
subtitle: Entities and typed relations with a schema or ontology; RDF/SPARQL and property graphs are two ways to
  represent them
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Entities and typed relations with a schema or ontology; RDF/SPARQL and property graphs are two ways to
  represent them.
objectives:
- Explain the architecture and trade-offs behind knowledge graphs.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: RDF 1.1 Concepts and Abstract Syntax
