sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Entities and typed relations with a schema or ontology; RDF/SPARQL and property graphs are two ways to
      represent them. Organisations need machine-readable knowledge — which products contain which components, which
      drugs interact — with explicit meaning and sources. Knowledge graphs provide it, and give LLM applications
      facts they can traverse and cite.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A knowledge graph stores entities (nodes) and typed relations (edges) under a schema or ontology that
      defines entity types, relation types and constraints.

      - RDF expresses knowledge as subject-predicate-object triples named by IRIs, with schemas in RDFS or OWL and
      queries in SPARQL (matching triple patterns); it is a W3C standards family built for data exchange and linked
      data.

      - Property graphs (Neo4j, GQL) put properties directly on nodes and relationships and are queried with Cypher
      or GQL; they are popular for application development.

      - Classic RDF needs verbose reification to make statements about a statement; RDF 1.2 (a W3C Candidate Recommendation
      in 2026) adds triple terms for this, while property graphs use relationship properties.

      - Public examples include Wikidata (queryable with SPARQL); enterprise knowledge graphs combine curated data
      with extracted facts.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A knowledge graph is not just any graph database; its value comes from consistent identities, types
      and meaning.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def extract_triples(records):\n    triples=[]\n    for row in records:\n        if row.get(\"subject\"\
      ) and row.get(\"predicate\") and row.get(\"object\"):\n            triples.append((row[\"subject\"],row[\"\
      predicate\"],row[\"object\"]))\n    return triples\n\nprint(extract_triples([{\"subject\":\"Ada\",\"predicate\"\
      :\"USES\",\"object\":\"Python\"}]))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: knowledge-graphs-code
  - type: item
    ref: knowledge-graphs-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A knowledge graph stores entities (nodes) and typed relations (edges) under a schema or ontology that defines
      entity types, relation types and constraints.

      - RDF expresses knowledge as subject-predicate-object triples named by IRIs, with schemas in RDFS or OWL and
      queries in SPARQL (matching triple patterns); it is a W3C standards family built for data exchange and linked
      data.

      - Property graphs (Neo4j, GQL) put properties directly on nodes and relationships and are queried with Cypher
      or GQL; they are popular for application development.

      - Classic RDF needs verbose reification to make statements about a statement; RDF 1.2 (a W3C Candidate Recommendation
      in 2026) adds triple terms for this, while property graphs use relationship properties.

      - Public examples include Wikidata (queryable with SPARQL); enterprise knowledge graphs combine curated data
      with extracted facts.


      **Limitations**

      - A knowledge graph is not just any graph database; its value comes from consistent identities, types and
      meaning.'
  - type: item
    ref: knowledge-graphs-mcq
  - type: item
    ref: knowledge-graphs-tf
  - type: item
    ref: knowledge-graphs-code
items:
- id: knowledge-graphs-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of knowledge graphs?
  explanation: A knowledge graph stores entities (nodes) and typed relations (edges) under a schema or ontology
    that defines entity types, relation types and constraints.
  options:
  - id: a
    text: A knowledge graph stores entities (nodes) and typed relations (edges) under a schema or ontology that
      defines entity types, relation types and constraints.
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: A knowledge graph is not just any graph database; its value comes from consistent identities, types and
      meaning.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: knowledge-graphs-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A knowledge graph is not just any graph database; its value comes from consistent identities, types and
    meaning.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: knowledge-graphs-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing knowledge graphs for a production application. Explain the main design decision, one
    alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: knowledge-graphs-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for knowledge graphs. The tests cover the main rule and a boundary or
    failure case.
  starterCode: "def extract_triples(records):\n    raise NotImplementedError('Complete this function')"
  solution: "def extract_triples(records):\n    triples=[]\n    for row in records:\n        if row.get(\"subject\"\
    ) and row.get(\"predicate\") and row.get(\"object\"):\n            triples.append((row[\"subject\"],row[\"predicate\"\
    ],row[\"object\"]))\n    return triples"
  tests:
  - name: Core behaviour
    code: assert extract_triples([{"subject":"Ada","predicate":"USES","object":"Python"}]) == [("Ada","USES","Python")]
  - name: Failure or edge case
    code: assert extract_triples([{"subject":"Ada","predicate":"USES"}]) == []
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
