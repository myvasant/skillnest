id: interview.project-walkthroughs
concept: interview.project-walkthroughs
title: Project walkthroughs and behavioural questions
subtitle: Present projects with context, your decisions, trade-offs, results and lessons (STAR), and answer questions
  about incidents and collaboration
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Present projects with context, your decisions, trade-offs, results and lessons (STAR), and answer questions
  about incidents and collaboration.
objectives:
- Explain the core engineering decisions behind project walkthroughs and behavioural questions.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Behavioral interviews for software engineers
  url: https://www.techinterviewhandbook.org/behavioral-interview/
  publisher: Tech Interview Handbook (Yangshun Tay)
- title: Using the STAR method for your next behavioral interview
  url: https://capd.mit.edu/resources/the-star-method-for-behavioral-interviews/
  publisher: MIT Career Advising and Professional Development
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Present projects with context, your decisions, trade-offs, results and lessons (STAR), and answer questions
      about incidents and collaboration. Projects and past experience are your evidence; telling them clearly shows
      ownership, judgement and impact better than any certificate.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- STAR - Situation (context), Task (your responsibility), Action (what you did; say "I", not only "we")
      and Result (a measured outcome), followed by what you learned.

      - A project walkthrough covers the problem and users, the architecture, key decisions and alternatives, one
      hard bug or trade-off, results with numbers, and what you would do differently.

      - Prepare about five to eight stories covering a success, a failure, a conflict, an incident, leadership and
      learning something new, and adapt them to each question.

      - Be honest about scope and your own contribution; interviewers probe with follow-up questions.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Talking about a failure is not a weakness when you show what you changed afterwards.

      - Listing technologies is not a walkthrough; explain why you chose them.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def project_story(problem, role, decisions, outcome, learning):\n    parts=[problem,role,decisions,outcome,learning]\n\
      \    if any(not part for part in parts): raise ValueError(\"all story elements are required\")\n    return\
      \ {\"problem\":problem,\"role\":role,\"decisions\":decisions,\"outcome\":outcome,\"learning\":learning}\n\n\
      print(project_story(\"slow API\",\"backend owner\",\"added cache\",\"p95 fell\",\"measured hit ratio\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: project-walkthroughs-code
  - type: item
    ref: project-walkthroughs-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - STAR - Situation (context), Task (your responsibility), Action (what you did; say "I", not only "we") and
      Result (a measured outcome), followed by what you learned.

      - A project walkthrough covers the problem and users, the architecture, key decisions and alternatives, one
      hard bug or trade-off, results with numbers, and what you would do differently.

      - Prepare about five to eight stories covering a success, a failure, a conflict, an incident, leadership and
      learning something new, and adapt them to each question.

      - Be honest about scope and your own contribution; interviewers probe with follow-up questions.


      **Watch for**

      - Talking about a failure is not a weakness when you show what you changed afterwards.

      - Listing technologies is not a walkthrough; explain why you chose them.'
  - type: item
    ref: project-walkthroughs-mcq
  - type: item
    ref: project-walkthroughs-tf
  - type: item
    ref: project-walkthroughs-code
items:
- id: project-walkthroughs-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of project walkthroughs and behavioural questions?
  explanation: STAR - Situation (context), Task (your responsibility), Action (what you did; say "I", not only "we")
    and Result (a measured outcome), followed by what you learned.
  options:
  - id: a
    text: STAR - Situation (context), Task (your responsibility), Action (what you did; say "I", not only "we")
      and Result (a measured outcome), followed by what you learned.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Talking about a failure is not a weakness when you show what you changed afterwards.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: project-walkthroughs-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Talking about a failure is not a weakness when you show what you changed afterwards.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: project-walkthroughs-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply project walkthroughs and behavioural questions to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: project-walkthroughs-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for project walkthroughs and behavioural questions. The assertions cover the expected
    path and an important boundary case.
  starterCode: "def project_story(problem, role, decisions, outcome, learning):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def project_story(problem, role, decisions, outcome, learning):\n    parts=[problem,role,decisions,outcome,learning]\n\
    \    if any(not part for part in parts): raise ValueError(\"all story elements are required\")\n    return {\"\
    problem\":problem,\"role\":role,\"decisions\":decisions,\"outcome\":outcome,\"learning\":learning}"
  tests:
  - name: Core behaviour
    code: story=project_story("p","owner","d","o","l")
  - name: Boundary behaviour
    code: 'assert story["role"] == "owner"

      try: project_story("p","","d","o","l")

      except ValueError: pass

      else: raise AssertionError("role must be stated")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - project-walkthroughs-mcq
  - project-walkthroughs-tf
  - project-walkthroughs-code
cheatsheet: '**Key principles**

  - STAR - Situation (context), Task (your responsibility), Action (what you did; say "I", not only "we") and Result
  (a measured outcome), followed by what you learned.

  - A project walkthrough covers the problem and users, the architecture, key decisions and alternatives, one hard
  bug or trade-off, results with numbers, and what you would do differently.

  - Prepare about five to eight stories covering a success, a failure, a conflict, an incident, leadership and learning
  something new, and adapt them to each question.

  - Be honest about scope and your own contribution; interviewers probe with follow-up questions.


  **Trade-offs**

  - Talking about a failure is not a weakness when you show what you changed afterwards.

  - Listing technologies is not a walkthrough; explain why you chose them.'
