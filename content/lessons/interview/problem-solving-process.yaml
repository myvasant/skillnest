id: interview.problem-solving-process
concept: interview.problem-solving-process
title: A problem-solving process for coding interviews
subtitle: Clarify the problem, work examples, state a brute force, improve it, code it cleanly, then test edge cases
  — out loud
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Clarify the problem, work examples, state a brute force, improve it, code it cleanly, then test edge cases
  — out loud.
objectives:
- Explain the core engineering decisions behind a problem-solving process for coding interviews.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Coding interview techniques
  url: https://www.techinterviewhandbook.org/coding-interview-techniques/
  publisher: Tech Interview Handbook (Yangshun Tay)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Clarify the problem, work examples, state a brute force, improve it, code it cleanly, then test edge cases
      — out loud. Under time pressure people jump into code and get stuck; a fixed process keeps you moving and
      shows the interviewer how you think.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Clarify first - restate the problem and ask about input size, types, edge cases (empty input, duplicates,
      negative numbers) and the expected output.

      - Work one or two examples by hand, including an edge case, before writing any code.

      - State a brute-force solution with its time and space complexity, then find its bottleneck and improve it
      (hashing, sorting, two pointers, precomputation).

      - Agree the approach with the interviewer, then write clean code with meaningful names while narrating your
      reasoning.

      - Test by tracing the code on an example and then on edge cases; fix bugs calmly and state the final complexity.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Silence is not focus to an interviewer; they can only credit reasoning they hear.

      - Aiming straight for the optimal solution without a brute force often ends with nothing working.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def interview_steps(problem, examples, constraints):\n    if not problem or not examples or not constraints:\
      \ raise ValueError(\"clarify the problem first\")\n    return [\"restate\", \"clarify\", \"propose\", \"implement\"\
      , \"test\", \"analyse\"]\n\nprint(interview_steps(\"parse input\", [\"empty input\"], [\"linear time\"]))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: problem-solving-process-code
  - type: item
    ref: problem-solving-process-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Clarify first - restate the problem and ask about input size, types, edge cases (empty input, duplicates,
      negative numbers) and the expected output.

      - Work one or two examples by hand, including an edge case, before writing any code.

      - State a brute-force solution with its time and space complexity, then find its bottleneck and improve it
      (hashing, sorting, two pointers, precomputation).

      - Agree the approach with the interviewer, then write clean code with meaningful names while narrating your
      reasoning.

      - Test by tracing the code on an example and then on edge cases; fix bugs calmly and state the final complexity.


      **Watch for**

      - Silence is not focus to an interviewer; they can only credit reasoning they hear.

      - Aiming straight for the optimal solution without a brute force often ends with nothing working.'
  - type: item
    ref: problem-solving-process-mcq
  - type: item
    ref: problem-solving-process-tf
  - type: item
    ref: problem-solving-process-code
items:
- id: problem-solving-process-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of a problem-solving process for coding interviews?
  explanation: Clarify first - restate the problem and ask about input size, types, edge cases (empty input, duplicates,
    negative numbers) and the expected output.
  options:
  - id: a
    text: Clarify first - restate the problem and ask about input size, types, edge cases (empty input, duplicates,
      negative numbers) and the expected output.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Silence is not focus to an interviewer; they can only credit reasoning they hear.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: problem-solving-process-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Silence is not focus to an interviewer; they can only credit reasoning they hear.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: problem-solving-process-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply a problem-solving process for coding interviews to a realistic engineering scenario. State your
    assumptions, explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: problem-solving-process-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for a problem-solving process for coding interviews. The assertions cover the expected
    path and an important boundary case.
  starterCode: "def interview_steps(problem, examples, constraints):\n    raise NotImplementedError('Complete this\
    \ function')"
  solution: "def interview_steps(problem, examples, constraints):\n    if not problem or not examples or not constraints:\
    \ raise ValueError(\"clarify the problem first\")\n    return [\"restate\", \"clarify\", \"propose\", \"implement\"\
    , \"test\", \"analyse\"]"
  tests:
  - name: Core behaviour
    code: assert interview_steps("p",["e"],["c"])[0] == "restate"
  - name: Boundary behaviour
    code: 'try: interview_steps("p",[],["c"])

      except ValueError: pass

      else: raise AssertionError("clarification is required")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - problem-solving-process-mcq
  - problem-solving-process-tf
  - problem-solving-process-code
cheatsheet: '**Key principles**

  - Clarify first - restate the problem and ask about input size, types, edge cases (empty input, duplicates, negative
  numbers) and the expected output.

  - Work one or two examples by hand, including an edge case, before writing any code.

  - State a brute-force solution with its time and space complexity, then find its bottleneck and improve it (hashing,
  sorting, two pointers, precomputation).

  - Agree the approach with the interviewer, then write clean code with meaningful names while narrating your reasoning.

  - Test by tracing the code on an example and then on edge cases; fix bugs calmly and state the final complexity.


  **Trade-offs**

  - Silence is not focus to an interviewer; they can only credit reasoning they hear.

  - Aiming straight for the optimal solution without a brute force often ends with nothing working.'
