id: interview.technical-communication
concept: interview.technical-communication
title: Technical communication
subtitle: Explain at the right level for the audience, structure answers, draw clear diagrams and write concise
  design documents
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Explain at the right level for the audience, structure answers, draw clear diagrams and write concise design
  documents.
objectives:
- Explain the core engineering decisions behind technical communication.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Technical Writing courses
  url: https://developers.google.com/tech-writing
  publisher: Google for Developers
- title: Design Docs at Google
  url: https://www.industrialempathy.com/posts/design-docs-at-google/
  publisher: Malte Ubl (Industrial Empathy)
- title: The C4 model
  url: https://c4model.com/
  publisher: Simon Brown
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Explain at the right level for the audience, structure answers, draw clear diagrams and write concise
      design documents. Clear explanations multiply an engineer's impact; unclear ones waste meetings, lead to wrong
      decisions and hide good work.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Know your audience - lead with the conclusion or recommendation, then the reasoning, and adjust the
      detail for executives, peers or newcomers.

      - Structure answers as context, problem, options, decision, trade-offs and next steps.

      - Give diagrams a title, labelled arrows and one level of abstraction at a time; the C4 model''s levels (context,
      containers, components, code) help.

      - A design document states goals and non-goals, the proposed design, alternatives considered with their trade-offs,
      and open questions - before implementation starts.

      - Prefer short sentences, concrete examples and numbers over vague adjectives.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- More detail is not clearer; choosing what to leave out is part of the skill.

      - Design documents are not bureaucracy; they are cheaper than discovering a flawed design in code review.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def concise_technical_answer(context, decision, reason, caveat):\n    if not all([context,decision,reason,caveat]):\
      \ raise ValueError(\"complete explanation required\")\n    return f\"Context: {context}. Decision: {decision}.\
      \ Reason: {reason}. Caveat: {caveat}.\"\n\nprint(concise_technical_answer(\"API latency\", \"cache reads\"\
      , \"reduce repeated work\", \"stale data risk\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: technical-communication-code
  - type: item
    ref: technical-communication-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Know your audience - lead with the conclusion or recommendation, then the reasoning, and adjust the detail
      for executives, peers or newcomers.

      - Structure answers as context, problem, options, decision, trade-offs and next steps.

      - Give diagrams a title, labelled arrows and one level of abstraction at a time; the C4 model''s levels (context,
      containers, components, code) help.

      - A design document states goals and non-goals, the proposed design, alternatives considered with their trade-offs,
      and open questions - before implementation starts.

      - Prefer short sentences, concrete examples and numbers over vague adjectives.


      **Watch for**

      - More detail is not clearer; choosing what to leave out is part of the skill.

      - Design documents are not bureaucracy; they are cheaper than discovering a flawed design in code review.'
  - type: item
    ref: technical-communication-mcq
  - type: item
    ref: technical-communication-tf
  - type: item
    ref: technical-communication-code
items:
- id: technical-communication-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of technical communication?
  explanation: Know your audience - lead with the conclusion or recommendation, then the reasoning, and adjust the
    detail for executives, peers or newcomers.
  options:
  - id: a
    text: Know your audience - lead with the conclusion or recommendation, then the reasoning, and adjust the detail
      for executives, peers or newcomers.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: More detail is not clearer; choosing what to leave out is part of the skill.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: technical-communication-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: More detail is not clearer; choosing what to leave out is part of the skill.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: technical-communication-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply technical communication to a realistic engineering scenario. State your assumptions, explain your
    decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: technical-communication-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for technical communication. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def concise_technical_answer(context, decision, reason, caveat):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def concise_technical_answer(context, decision, reason, caveat):\n    if not all([context,decision,reason,caveat]):\
    \ raise ValueError(\"complete explanation required\")\n    return f\"Context: {context}. Decision: {decision}.\
    \ Reason: {reason}. Caveat: {caveat}.\""
  tests:
  - name: Core behaviour
    code: answer=concise_technical_answer("latency","cache","reuse","staleness")
  - name: Boundary behaviour
    code: 'assert "Decision: cache" in answer and "Caveat:" in answer

      try: concise_technical_answer("x","","y","z")

      except ValueError: pass

      else: raise AssertionError("missing decision must fail")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - technical-communication-mcq
  - technical-communication-tf
  - technical-communication-code
cheatsheet: '**Key principles**

  - Know your audience - lead with the conclusion or recommendation, then the reasoning, and adjust the detail for
  executives, peers or newcomers.

  - Structure answers as context, problem, options, decision, trade-offs and next steps.

  - Give diagrams a title, labelled arrows and one level of abstraction at a time; the C4 model''s levels (context,
  containers, components, code) help.

  - A design document states goals and non-goals, the proposed design, alternatives considered with their trade-offs,
  and open questions - before implementation starts.

  - Prefer short sentences, concrete examples and numbers over vague adjectives.


  **Trade-offs**

  - More detail is not clearer; choosing what to leave out is part of the skill.

  - Design documents are not bureaucracy; they are cheaper than discovering a flawed design in code review.'
