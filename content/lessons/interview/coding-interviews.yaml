items:
- id: coding-interviews-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of coding interviews?
  explanation: Map clues to patterns - pair or duplicate lookups suggest a hash map or set; sorted input suggests
    two pointers or binary search; contiguous ranges suggest a sliding window or prefix sums; shortest path in an
    unweighted graph suggests BFS; top-k suggests a heap; counting ways or best value with overlapping subproblems
    suggests dynamic programming.
  options:
  - id: a
    text: Map clues to patterns - pair or duplicate lookups suggest a hash map or set; sorted input suggests two
      pointers or binary search; contiguous ranges suggest a sliding window or prefix sums; shortest path in an
      unweighted graph suggests BFS; top-k suggests a heap; counting ways or best value with overlapping subproblems
      suggests dynamic programming.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Memorising hundreds of solutions works less well than understanding a few dozen patterns deeply.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: coding-interviews-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Memorising hundreds of solutions works less well than understanding a few dozen patterns deeply.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: coding-interviews-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply coding interviews to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: coding-interviews-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for coding interviews. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def complexity_summary(n):\n    raise NotImplementedError('Complete this function')"
  solution: "def complexity_summary(n):\n    if n<0: raise ValueError(\"n must be non-negative\")\n    return {\"\
    single_pass\":\"O(n)\",\"nested_pair_scan\":\"O(n^2)\",\"sort_then_scan\":\"O(n log n)\"}"
  tests:
  - name: Core behaviour
    code: assert complexity_summary(5)["single_pass"] == "O(n)"
  - name: Boundary behaviour
    code: 'try: complexity_summary(-1)

      except ValueError: pass

      else: raise AssertionError("negative input size is invalid")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - coding-interviews-mcq
  - coding-interviews-tf
  - coding-interviews-code
