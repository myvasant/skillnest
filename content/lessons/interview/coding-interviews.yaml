id: interview.coding-interviews
concept: interview.coding-interviews
title: Coding interviews
subtitle: Recognise common patterns (hashing, two pointers, BFS/DFS, heaps, dynamic programming) and practise deliberately
  with timed, explained solutions
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Recognise common patterns (hashing, two pointers, BFS/DFS, heaps, dynamic programming) and practise deliberately
  with timed, explained solutions.
objectives:
- Explain the core engineering decisions behind coding interviews.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Coding interview study plan
  url: https://www.techinterviewhandbook.org/coding-interview-study-plan/
  publisher: Tech Interview Handbook (Yangshun Tay)
- title: Data structures and algorithms study cheatsheets
  url: https://www.techinterviewhandbook.org/algorithms/study-cheatsheet/
  publisher: Tech Interview Handbook (Yangshun Tay)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Recognise common patterns (hashing, two pointers, BFS/DFS, heaps, dynamic programming) and practise deliberately
      with timed, explained solutions. Coding interviews remain the most common filter for engineering roles, and
      a modest set of patterns covers most of the questions.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Map clues to patterns - pair or duplicate lookups suggest a hash map or set; sorted input suggests
      two pointers or binary search; contiguous ranges suggest a sliding window or prefix sums; shortest path in
      an unweighted graph suggests BFS; top-k suggests a heap; counting ways or best value with overlapping subproblems
      suggests dynamic programming.

      - Know core costs - dict and set lookup O(1) on average, sorting O(n log n), heap push and pop O(log n), BFS
      and DFS O(V + E).

      - Practise deliberately - timed problems grouped by pattern, review solutions you could not finish, and re-solve
      them a few days later.

      - Explain trade-offs aloud and write readable Python (small helpers, clear names) rather than clever one-liners.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Memorising hundreds of solutions works less well than understanding a few dozen patterns deeply.

      - The optimal answer is not the only signal; a correct, tested brute force with a clear improvement plan often
      scores better than a buggy optimal attempt.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def complexity_summary(n):\n    if n<0: raise ValueError(\"n must be non-negative\")\n    return {\"\
      single_pass\":\"O(n)\",\"nested_pair_scan\":\"O(n^2)\",\"sort_then_scan\":\"O(n log n)\"}\n\nprint(complexity_summary(10))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: coding-interviews-code
  - type: item
    ref: coding-interviews-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Map clues to patterns - pair or duplicate lookups suggest a hash map or set; sorted input suggests two pointers
      or binary search; contiguous ranges suggest a sliding window or prefix sums; shortest path in an unweighted
      graph suggests BFS; top-k suggests a heap; counting ways or best value with overlapping subproblems suggests
      dynamic programming.

      - Know core costs - dict and set lookup O(1) on average, sorting O(n log n), heap push and pop O(log n), BFS
      and DFS O(V + E).

      - Practise deliberately - timed problems grouped by pattern, review solutions you could not finish, and re-solve
      them a few days later.

      - Explain trade-offs aloud and write readable Python (small helpers, clear names) rather than clever one-liners.


      **Watch for**

      - Memorising hundreds of solutions works less well than understanding a few dozen patterns deeply.

      - The optimal answer is not the only signal; a correct, tested brute force with a clear improvement plan often
