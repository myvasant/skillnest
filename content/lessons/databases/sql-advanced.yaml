- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - A subquery is a query inside another; a correlated subquery refers to the outer row, and `EXISTS (...)`
      tests whether any matching row exists.

      - `WITH recent AS (SELECT ...) SELECT ... FROM recent` names an intermediate result; `WITH RECURSIVE` walks
      hierarchies such as org charts or category trees.

      - Window functions compute across related rows without collapsing them, for example `ROW_NUMBER() OVER (PARTITION
      BY category ORDER BY sales DESC)`.

      - Running totals and moving averages use frames such as `SUM(amount) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING
      AND CURRENT ROW)`; `LAG` and `LEAD` read the previous and next rows.

      - Window functions are evaluated after WHERE, GROUP BY and HAVING, so to filter on their result wrap the query
      in a CTE or subquery.


      **Avoid**

      - `RANK()` and `ROW_NUMBER()` are not interchangeable; RANK gives ties the same number and then skips, while
      ROW_NUMBER is always unique.

      - `NOT IN (subquery)` returns no rows at all if the subquery produces any NULL; prefer `NOT EXISTS`.'
