items:
- id: sql-advanced-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of subqueries, ctes and window functions?
  explanation: A subquery is a query inside another; a correlated subquery refers to the outer row, and `EXISTS
    (...)` tests whether any matching row exists.
  options:
  - id: a
    text: A subquery is a query inside another; a correlated subquery refers to the outer row, and `EXISTS (...)`
      tests whether any matching row exists.
    correct: true
    feedback: 'Correct: this is the core rule described in the lesson.'
  - id: b
    text: '`RANK()` and `ROW_NUMBER()` are not interchangeable; RANK gives ties the same number and then skips,
      while ROW_NUMBER is always unique.'
    feedback: This is a common misconception; see the explanation above.
  - id: c
    text: The implementation does not need tests or operational checks.
    feedback: Reliable systems require verification and explicit failure handling.
- id: sql-advanced-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '`RANK()` and `ROW_NUMBER()` are not interchangeable; RANK gives ties the same number and then skips,
    while ROW_NUMBER is always unique.'
  answer: false
  explanation: This statement describes a known misconception. Use the underlying mechanism and test evidence rather
    than relying on the shortcut.
- id: sql-advanced-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are implementing subqueries, ctes and window functions in a real application. What design decisions
    would you make, what failure case would you test, and what evidence would tell you the implementation is correct?
  rubric:
  - Describe the relevant mechanism and the design choice it implies.
  - Name a realistic failure or edge case and a concrete test for it.
  - Explain a security, correctness or operational trade-off.
  modelAnswer: Start with the system contract and its failure modes. Choose the simplest implementation that meets
    the contract, validate inputs at the boundary, and test both successful and unsuccessful cases. Observe the
    relevant status, state or output and document any limitations.
  explanation: A strong response links design decisions to observable behaviour and explicitly handles edge cases.
- id: sql-advanced-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the function for subqueries, ctes and window functions. Implement the stated rule and make sure
    both ordinary and edge-case tests pass.
  starterCode: "def rank_scores(rows):\n    raise NotImplementedError('Complete this function')"
  solution: "def rank_scores(rows):\n    ordered = sorted(rows, key=lambda r: r[\"score\"], reverse=True)\n    result\
    \ = []\n    previous = None; rank = 0\n    for index, row in enumerate(ordered, 1):\n        if row[\"score\"\
    ] != previous: rank = index; previous = row[\"score\"]\n        result.append({**row, \"rank\": rank})\n   \
    \ return result"
  tests:
  - name: Core behaviour
    code: r = rank_scores([{"name":"A","score":9},{"name":"B","score":9},{"name":"C","score":7}])
  - name: Edge cases
    code: 'assert [x["rank"] for x in r] == [1,1,3]

      assert rank_scores([]) == []'
  hints:
  - Read the rule in the mental-model section before coding.
  - Keep the function deterministic and handle boundary cases explicitly.
  - Run every assertion before considering the exercise complete.
  explanation: This exercise checks practical application of the lesson rule and includes edge cases to help detect
    incorrect assumptions.
