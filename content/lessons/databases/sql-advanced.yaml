sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Common table expressions name intermediate results; window functions rank and compute running totals without
      collapsing rows. Questions such as "top three products per category" or "running total per day" are awkward
      or slow with plain GROUP BY; subqueries, CTEs and window functions express them clearly in one query.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A subquery is a query inside another; a correlated subquery refers to the outer row, and `EXISTS (...)`
      tests whether any matching row exists.

      - `WITH recent AS (SELECT ...) SELECT ... FROM recent` names an intermediate result; `WITH RECURSIVE` walks
      hierarchies such as org charts or category trees.

      - Window functions compute across related rows without collapsing them, for example `ROW_NUMBER() OVER (PARTITION
      BY category ORDER BY sales DESC)`.

      - Running totals and moving averages use frames such as `SUM(amount) OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING
      AND CURRENT ROW)`; `LAG` and `LEAD` read the previous and next rows.

      - Window functions are evaluated after WHERE, GROUP BY and HAVING, so to filter on their result wrap the query
      in a CTE or subquery.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- `RANK()` and `ROW_NUMBER()` are not interchangeable; RANK gives ties the same number and then skips,
      while ROW_NUMBER is always unique.

      - `NOT IN (subquery)` returns no rows at all if the subquery produces any NULL; prefer `NOT EXISTS`.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def rank_scores(rows):\n    ordered = sorted(rows, key=lambda r: r[\"score\"], reverse=True)\n    result\
      \ = []\n    previous = None; rank = 0\n    for index, row in enumerate(ordered, 1):\n        if row[\"score\"\
      ] != previous: rank = index; previous = row[\"score\"]\n        result.append({**row, \"rank\": rank})\n \
      \   return result\n\nprint(rank_scores([{\"name\":\"A\",\"score\":9},{\"name\":\"B\",\"score\":9},{\"name\"\
      :\"C\",\"score\":7}]))"
    caption: Runnable model of the lesson concept.
