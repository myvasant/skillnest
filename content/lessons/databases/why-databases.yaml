sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Databases give durable, concurrent, queryable storage with guarantees that plain files cannot provide.
      As soon as several users or processes read and write the same data, plain files get corrupted, overwrite each
      other and become slow to search; databases solve this with transactions, concurrency control and indexes.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A database management system (DBMS) provides durable storage, a query language, safe concurrent access,
      transactions and access control.

      - Durability means committed data survives a crash, typically because changes are written to a write-ahead
      log on disk before the commit is acknowledged.

      - Embedded databases such as SQLite run inside your process and store everything in one file; client-server
      databases such as PostgreSQL and MySQL run as a separate service that many applications connect to over the
      network.

      - Choose by access pattern - relational databases for structured data with relationships and integrity rules,
      key-value stores for fast lookups by key, document or search engines for other shapes.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- SQLite is not a toy; it is a production-grade database for embedded and single-machine use, though
      it allows only one writer at a time.

      - A database is not a backup; you still need separate, tested backups.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def durable_write(store, key, value):\n    store[key] = value\n    return store[key]\n\nstore = {}\n\
      print(durable_write(store, \"user:1\", \"Ada\"))"
    caption: Runnable model of the lesson concept.
