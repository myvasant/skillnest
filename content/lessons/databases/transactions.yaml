id: databases.transactions
concept: databases.transactions
title: Transactions and isolation
subtitle: ACID transactions group changes atomically; isolation levels trade concurrency for protection against
  anomalies such as lost updates
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: ACID transactions group changes atomically; isolation levels trade concurrency for protection against anomalies
  such as lost updates.
objectives:
- Explain the core model behind transactions and isolation.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: 'PostgreSQL: Transaction Isolation'
  url: https://www.postgresql.org/docs/current/transaction-iso.html
  publisher: PostgreSQL Global Development Group
- title: 'PostgreSQL Tutorial: Transactions'
  url: https://www.postgresql.org/docs/current/tutorial-transactions.html
  publisher: PostgreSQL Global Development Group
