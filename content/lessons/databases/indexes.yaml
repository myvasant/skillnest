id: databases.indexes
concept: databases.indexes
title: Indexes
subtitle: B-tree indexes make lookups and sorts fast at the cost of storage and slower writes; column order in composite
  indexes matters
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: B-tree indexes make lookups and sorts fast at the cost of storage and slower writes; column order in composite
  indexes matters.
objectives:
- Explain the core model behind indexes.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: 'PostgreSQL: Indexes'
