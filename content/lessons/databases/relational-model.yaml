id: databases.relational-model
concept: databases.relational-model
title: The relational model
subtitle: Data lives in tables of rows and typed columns; primary keys identify rows and foreign keys relate tables
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Data lives in tables of rows and typed columns; primary keys identify rows and foreign keys relate tables.
objectives:
- Explain the core model behind the relational model.
- Apply the main rules to a realistic engineering task.
- Identify common mistakes and verify behaviour with focused tests.
sources:
- title: 'PostgreSQL Tutorial: Concepts'
  url: https://www.postgresql.org/docs/current/tutorial-concepts.html
  publisher: PostgreSQL Global Development Group
- title: 'PostgreSQL: Constraints'
  url: https://www.postgresql.org/docs/current/ddl-constraints.html
  publisher: PostgreSQL Global Development Group
- title: SQLite Foreign Key Support
  url: https://www.sqlite.org/foreignkeys.html
  publisher: SQLite
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Data lives in tables of rows and typed columns; primary keys identify rows and foreign keys relate tables.
      Organising data as related tables with keys lets the database enforce consistency and answer questions you
      did not anticipate when you designed it.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A table (relation) has named, typed columns; each row records one fact about one entity.

      - A primary key uniquely identifies each row and cannot be NULL; it can be a natural key (an ISBN) or a surrogate
      key (a generated integer or UUID).

      - A foreign key stores another table''s key (`orders.customer_id` references `customers.id`), and the database
      rejects references to rows that do not exist.

      - One-to-many relationships put the foreign key on the "many" side; many-to-many relationships use a junction
      table holding two foreign keys.

      - NULL means unknown or missing, not zero or an empty string, and comparing anything with NULL gives unknown
      rather than true or false.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Rows in a table have no guaranteed order; without ORDER BY a query may return them in any order.

      - SQLite does not enforce foreign keys unless you run `PRAGMA foreign_keys = ON` on each connection.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def valid_foreign_keys(rows, parent_ids, field):\n    return all(row[field] in parent_ids for row in\
      \ rows)\n\nprint(valid_foreign_keys([{\"customer_id\":1}], {1, 2}, \"customer_id\"))"
    caption: Runnable model of the lesson concept.
- id: practice
  title: Practice and implementation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper first, then run the provided assertions. Consider malformed input and boundary cases.
  - type: item
    ref: relational-model-code
  - type: item
    ref: relational-model-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - A table (relation) has named, typed columns; each row records one fact about one entity.

      - A primary key uniquely identifies each row and cannot be NULL; it can be a natural key (an ISBN) or a surrogate
      key (a generated integer or UUID).

      - A foreign key stores another table''s key (`orders.customer_id` references `customers.id`), and the database
      rejects references to rows that do not exist.

      - One-to-many relationships put the foreign key on the "many" side; many-to-many relationships use a junction
      table holding two foreign keys.

      - NULL means unknown or missing, not zero or an empty string, and comparing anything with NULL gives unknown
      rather than true or false.


      **Avoid**

      - Rows in a table have no guaranteed order; without ORDER BY a query may return them in any order.

      - SQLite does not enforce foreign keys unless you run `PRAGMA foreign_keys = ON` on each connection.'
  - type: item
    ref: relational-model-mcq
  - type: item
    ref: relational-model-tf
  - type: item
    ref: relational-model-code
items:
- id: relational-model-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of the relational model?
  explanation: A table (relation) has named, typed columns; each row records one fact about one entity.
  options:
  - id: a
    text: A table (relation) has named, typed columns; each row records one fact about one entity.
    correct: true
    feedback: 'Correct: this is the core rule described in the lesson.'
  - id: b
    text: Rows in a table have no guaranteed order; without ORDER BY a query may return them in any order.
    feedback: This is a common misconception; see the explanation above.
  - id: c
    text: The implementation does not need tests or operational checks.
    feedback: Reliable systems require verification and explicit failure handling.
- id: relational-model-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Rows in a table have no guaranteed order; without ORDER BY a query may return them in any order.
  answer: false
  explanation: This statement describes a known misconception. Use the underlying mechanism and test evidence rather
    than relying on the shortcut.
- id: relational-model-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are implementing the relational model in a real application. What design decisions would you make,
    what failure case would you test, and what evidence would tell you the implementation is correct?
  rubric:
  - Describe the relevant mechanism and the design choice it implies.
  - Name a realistic failure or edge case and a concrete test for it.
  - Explain a security, correctness or operational trade-off.
  modelAnswer: Start with the system contract and its failure modes. Choose the simplest implementation that meets
    the contract, validate inputs at the boundary, and test both successful and unsuccessful cases. Observe the
    relevant status, state or output and document any limitations.
  explanation: A strong response links design decisions to observable behaviour and explicitly handles edge cases.
- id: relational-model-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the function for the relational model. Implement the stated rule and make sure both ordinary
    and edge-case tests pass.
  starterCode: "def valid_foreign_keys(rows, parent_ids, field):\n    raise NotImplementedError('Complete this function')"
  solution: "def valid_foreign_keys(rows, parent_ids, field):\n    return all(row[field] in parent_ids for row in\
    \ rows)"
  tests:
  - name: Core behaviour
    code: assert valid_foreign_keys([{"customer_id":1}], {1,2}, "customer_id") is True
  - name: Edge cases
    code: assert valid_foreign_keys([{"customer_id":3}], {1,2}, "customer_id") is False
  hints:
  - Read the rule in the mental-model section before coding.
  - Keep the function deterministic and handle boundary cases explicitly.
  - Run every assertion before considering the exercise complete.
  explanation: This exercise checks practical application of the lesson rule and includes edge cases to help detect
    incorrect assumptions.
masteryCheck:
  passThreshold: 0.8
  items:
  - relational-model-mcq
  - relational-model-tf
  - relational-model-code
