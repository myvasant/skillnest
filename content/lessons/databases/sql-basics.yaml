masteryCheck:
  passThreshold: 0.8
  items: [m-predict-between, m-mcq-null-logic, m-tf-alias-order, m-code-report, m-debug-precedence]

cheatsheet: |
  ```sql
  SELECT name, price * 2 AS doubled        -- columns and expressions; AS names them
  FROM products
  WHERE (category = 'home' OR category = 'electronics')   -- parenthesise OR inside AND
    AND price BETWEEN 5 AND 25             -- inclusive range
    AND name LIKE 'm%'                      -- % = any run, _ = one char
    AND stock IS NOT NULL                   -- never "= NULL"
  ORDER BY price DESC, id                   -- unique tie-breaker last
  LIMIT 10 OFFSET 20;                       -- page 3 of 10
  SELECT DISTINCT category FROM products;   -- one row per distinct value (NULLs collapse)
  ```
  - Logical order: FROM → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT
  - WHERE keeps only TRUE rows; any comparison with NULL is UNKNOWN
  - SQLite vs PostgreSQL: LIKE case-insensitive vs case-sensitive (ILIKE) · NULLs sort first vs last (ASC) · SQLite allows SELECT aliases in WHERE, PostgreSQL does not
  - Python: `con = sqlite3.connect(":memory:")` · `con.execute(sql).fetchall()` → list of tuples, NULL → None
