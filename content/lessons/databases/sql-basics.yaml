              (5, 'USB cable', 'electronics', 7, 80), (6, 'Headphones', 'electronics', 59, 0),
              (7, 'Gift card', NULL, 25, NULL);
      """)

      QUERY = "SELECT name FROM products WHERE stock = NULL ORDER BY id"

      for row in con.execute(QUERY):
          print(row)
    solution: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.executescript("""
          CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL,
                                 category TEXT, price INTEGER NOT NULL, stock INTEGER);
          INSERT INTO products VALUES
              (1, 'Notebook', 'stationery', 4, 120),  (2, 'Pen', 'stationery', 2, 500),
              (3, 'Desk lamp', 'home', 24, 15),       (4, 'Mug', 'home', 8, NULL),
              (5, 'USB cable', 'electronics', 7, 80), (6, 'Headphones', 'electronics', 59, 0),
              (7, 'Gift card', NULL, 25, NULL);
      """)

      QUERY = "SELECT name FROM products WHERE stock IS NULL ORDER BY id"

      for row in con.execute(QUERY):
          print(row)
    expectedOutput: |
      ('Mug',)
      ('Gift card',)
    tests:
      - name: returns the products with unknown stock
        code: |
          rows = con.execute(QUERY).fetchall()
          assert rows == [("Mug",), ("Gift card",)], f"Expected [('Mug',), ('Gift card',)] but the query returned {rows}."
      - name: works on other data
        code: |
          import sqlite3
          other = sqlite3.connect(":memory:")
          other.executescript("""
              CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL,
                                     category TEXT, price INTEGER NOT NULL, stock INTEGER);
              INSERT INTO products VALUES (1, 'Kettle', 'home', 30, NULL), (2, 'Stapler', 'office', 9, 0),
                  (3, 'Torch', 'outdoor', 12, NULL);
          """)
          got = other.execute(QUERY).fetchall()
          assert got == [("Kettle",), ("Torch",)], f"On other data the query returned {got}. Test the stock column for NULL rather than naming products."
      - name: does not compare with = NULL
        code: |
          import re
          assert not re.search(r"(?<![!<>])=\s*NULL", QUERY, re.IGNORECASE), "Comparing with = NULL is never TRUE. Use IS NULL."
    hints:
      - Run the starter. What is `NULL = NULL` in SQL — TRUE, FALSE or something else?
      - Comparisons with NULL are UNKNOWN, and WHERE drops UNKNOWN rows. SQL has a special operator for this test.
      - "Replace `= NULL` with `IS NULL`."
    feedback:
      - when: { outputContains: "Headphones" }
        message: The Headphones' stock is 0, which is a known number. Only missing values are NULL.
      - when: { codeMatches: "stock\\s*=\\s*0" }
        message: Zero is not the same as unknown. Test for NULL with IS NULL.
    explanation: >-
      `stock = NULL` evaluates to UNKNOWN for every row, so WHERE keeps none of them. `stock IS NULL` is TRUE
      exactly when the value is missing, which selects the Mug and the Gift card.

  - id: parsons-top-cheap
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines so the program prints the names of the **two most expensive items that cost less
      than 30**: `[('cable',), ('mug',)]`. The SQL clauses must be in the order SQL requires. Two lines are
      distractors.
    solution: |
      import sqlite3
      con = sqlite3.connect(":memory:")
      con.executescript("CREATE TABLE items (name TEXT, price INTEGER); INSERT INTO items VALUES ('pen', 5), ('lamp', 50), ('mug', 15), ('cable', 25);")
      query = """
      SELECT name
      FROM items
      WHERE price < 30
      ORDER BY price DESC
      LIMIT 2
      """
      print(con.execute(query).fetchall())
    distractors:
      - WHERE price > 30
      - ORDER BY price ASC
    expectedOutput: |
      [('cable',), ('mug',)]
    explanation: >-
      The written order is SELECT, FROM, WHERE, ORDER BY, LIMIT. WHERE keeps pen, mug and cable (all under 30);
      ORDER BY price DESC puts cable (25) before mug (15) before pen (5); LIMIT 2 keeps the first two.

