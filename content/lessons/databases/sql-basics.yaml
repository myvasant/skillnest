      On the lesson's table the result is `[('Desk lamp',), ('Mug',), ('USB cable',)]`.
    starterCode: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.executescript("""
          CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL,
                                 category TEXT, price INTEGER NOT NULL, stock INTEGER);
          INSERT INTO products VALUES
              (1, 'Notebook', 'stationery', 4, 120),  (2, 'Pen', 'stationery', 2, 500),
              (3, 'Desk lamp', 'home', 24, 15),       (4, 'Mug', 'home', 8, NULL),
              (5, 'USB cable', 'electronics', 7, 80), (6, 'Headphones', 'electronics', 59, 0),
              (7, 'Gift card', NULL, 25, NULL);
      """)

      QUERY = """
          SELECT name FROM products
      """

      print(con.execute(QUERY).fetchall())
    solution: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.executescript("""
          CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL,
                                 category TEXT, price INTEGER NOT NULL, stock INTEGER);
          INSERT INTO products VALUES
              (1, 'Notebook', 'stationery', 4, 120),  (2, 'Pen', 'stationery', 2, 500),
              (3, 'Desk lamp', 'home', 24, 15),       (4, 'Mug', 'home', 8, NULL),
              (5, 'USB cable', 'electronics', 7, 80), (6, 'Headphones', 'electronics', 59, 0),
              (7, 'Gift card', NULL, 25, NULL);
      """)

      QUERY = """
          SELECT name FROM products
          WHERE category IN ('home', 'electronics')
            AND (stock <> 0 OR stock IS NULL)
          ORDER BY name
      """

      print(con.execute(QUERY).fetchall())
    expectedOutput: |
      [('Desk lamp',), ('Mug',), ('USB cable',)]
    tests:
      - name: correct rows on the lesson table
        code: |
          rows = con.execute(QUERY).fetchall()
          assert rows == [("Desk lamp",), ("Mug",), ("USB cable",)], (
              f"Your query returned {rows}. Keep home and electronics products, drop stock = 0, "
              "keep NULL stock, and ORDER BY name."
          )
      - name: correct rows on a different table
        code: |
          import sqlite3
          other = sqlite3.connect(":memory:")
          other.executescript("""
              CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL,
                                     category TEXT, price INTEGER NOT NULL, stock INTEGER);
              INSERT INTO products VALUES (1, 'Kettle', 'home', 30, 0), (2, 'Radio', 'electronics', 45, NULL),
                  (3, 'Toaster', 'home', 20, 3), (4, 'Map', NULL, 3, NULL), (5, 'Cable', 'electronics', 5, 9),
                  (6, 'Torch', 'outdoor', 12, 6);
          """)
          got = other.execute(QUERY).fetchall()
          assert got == [("Cable",), ("Radio",), ("Toaster",)], (
              f"On a different table your query returned {got}; expected [('Cable',), ('Radio',), ('Toaster',)]. "
              "Check the NULL handling and the parentheses around the OR."
          )
    hints:
      - "Two categories: `category IN ('home', 'electronics')`."
      - "`stock <> 0` is UNKNOWN when stock is NULL, so those rows need `OR stock IS NULL`."
      - "Mixing AND with OR? Put the OR part in parentheses: `AND (stock <> 0 OR stock IS NULL)`."
    feedback:
      - when: { outputContains: "Headphones" }
        message: The Headphones have stock 0, so they are out of stock and should be excluded.
      - when: { outputEquals: "[('Desk lamp',), ('USB cable',)]\n" }
        message: The Mug is missing. Its stock is NULL, and `stock <> 0` is UNKNOWN for NULL — add an IS NULL test.
      - when: { outputContains: "Gift card" }
        message: "The Gift card's category is NULL, not home or electronics. Check your parentheses: AND binds tighter than OR."
    explanation: >-
      `category IN ('home', 'electronics')` picks the categories. `stock <> 0` alone would drop the Mug because
      `NULL <> 0` is UNKNOWN, so `OR stock IS NULL` adds unknown stock back — and the parentheses keep that OR
      from swallowing the category test.

