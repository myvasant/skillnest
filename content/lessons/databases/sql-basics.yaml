          WHERE (category = 'home' OR category = 'electronics') AND price < 10
          ORDER BY id
      """

      print(con.execute(QUERY).fetchall())
    expectedOutput: |
      [('Mug', 8), ('USB cable', 7)]
    tests:
      - name: correct rows
        code: |
          rows = con.execute(QUERY).fetchall()
          assert rows == [("Mug", 8), ("USB cable", 7)], f"Expected [('Mug', 8), ('USB cable', 7)] but got {rows}."
      - name: works on other data
        code: |
          import sqlite3
