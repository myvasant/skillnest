id: databases.sql-basics
concept: databases.sql-basics
title: "SQL Queries: SELECT, WHERE, ORDER BY"
subtitle: Describe the rows you want and let the database fetch them
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Read data with SQL: choose columns with SELECT, filter rows with WHERE (comparisons, AND/OR, IN,
  BETWEEN, LIKE), handle missing values with IS NULL and three-valued logic, then sort, limit and
  de-duplicate results. Every query runs for real in SQLite through Python's built-in sqlite3 module,
  and the lesson points out where PostgreSQL behaves differently.
objectives:
  - Write SELECT queries that pick columns, compute expressions and rename them with AS.
  - Filter rows with comparison operators, AND/OR/NOT, IN, BETWEEN and LIKE, using parentheses when mixing AND with OR.
  - Explain three-valued logic and test for missing values with IS NULL and IS NOT NULL instead of = NULL.
  - Sort, limit and de-duplicate results with ORDER BY, LIMIT/OFFSET and DISTINCT, and explain why LIMIT needs ORDER BY.
  - Predict a query's result by applying the logical evaluation order FROM, WHERE, SELECT, ORDER BY, LIMIT.
  - Contrast declarative SQL with an imperative Python loop that computes the same result.
