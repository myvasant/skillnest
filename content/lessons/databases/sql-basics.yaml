  - id: m-predict-between
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What does this print? (Same `products` table as the lesson.)
    code: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.executescript("""
          CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL,
                                 category TEXT, price INTEGER NOT NULL, stock INTEGER);
          INSERT INTO products VALUES
              (1, 'Notebook', 'stationery', 4, 120),  (2, 'Pen', 'stationery', 2, 500),
              (3, 'Desk lamp', 'home', 24, 15),       (4, 'Mug', 'home', 8, NULL),
              (5, 'USB cable', 'electronics', 7, 80), (6, 'Headphones', 'electronics', 59, 0),
              (7, 'Gift card', NULL, 25, NULL);
      """)

      query = """SELECT name FROM products
                 WHERE price BETWEEN 4 AND 25 AND category <> 'home'
                 ORDER BY price DESC"""
      print([row[0] for row in con.execute(query)])
    answer: "['USB cable', 'Notebook']"
    explanation: >-
      BETWEEN 4 AND 25 is inclusive: Notebook (4), USB cable (7), Mug (8), Desk lamp (24) and Gift card (25).
      `category <> 'home'` removes the Mug and the Desk lamp, and is UNKNOWN for the Gift card's NULL category,
      so it is removed too. Sorted by price descending: USB cable, Notebook.
    wrongAnswers:
      - answer: "['Gift card', 'USB cable', 'Notebook']"
        feedback: "The Gift card's category is NULL, so `NULL <> 'home'` is UNKNOWN and WHERE drops the row."
      - answer: "['USB cable']"
        feedback: BETWEEN includes both ends, so the Notebook at exactly 4 is inside the range.
      - answer: "['Notebook', 'USB cable']"
        feedback: ORDER BY price DESC puts the higher price (USB cable, 7) first.

  - id: m-mcq-null-logic
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: Which WHERE clause returns the products whose stock is **unknown or below 10**?
    explanation: >-
      `stock < 10` handles known values; rows with NULL stock make it UNKNOWN, so they need their own
      `IS NULL` test joined with OR.
    options:
      - id: a
        text: "`WHERE stock < 10 OR stock = NULL`"
        feedback: "`stock = NULL` is never TRUE, so this behaves like `stock < 10` alone."
      - id: b
        text: "`WHERE stock < 10 OR stock IS NULL`"
        correct: true
        feedback: Correct. IS NULL is TRUE for missing values, and OR combines the two cases.
      - id: c
        text: "`WHERE NOT stock >= 10`"
        feedback: For NULL stock, `stock >= 10` is UNKNOWN and NOT UNKNOWN is still UNKNOWN, so those rows are dropped.
      - id: d
        text: "`WHERE stock < 10 AND stock IS NULL`"
        feedback: No row can be both below 10 and unknown, so this returns nothing.

  - id: m-tf-alias-order
    type: true-false
    skill: recognition
    prompt: >-
      True or false: in PostgreSQL, `SELECT price * 2 AS doubled FROM products ORDER BY doubled` is valid,
      because ORDER BY is evaluated after SELECT.
    answer: true
    explanation: >-
      ORDER BY runs after SELECT in the logical order, so it can refer to output column aliases. It is WHERE
      (evaluated before SELECT) that cannot use them.

