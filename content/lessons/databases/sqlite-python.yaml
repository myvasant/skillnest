id: databases.sqlite-python
concept: databases.sqlite-python
title: SQL from Python with sqlite3
subtitle: Connections, parameters, transactions — and why string formatting is never safe
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Use Python's built-in sqlite3 module the way production code uses any database driver: connect,
  execute, fetch, commit; let `with con:` manage transactions (it does not close the connection); pass
  every value as a parameter; and see SQL injection happen — safely, in an in-memory database — before
  fixing it. Also covers rollback on errors, executemany and sqlite3.Row.
objectives:
  - Open a connection, execute statements and fetch results with fetchone, fetchall and iteration.
  - Explain when changes become permanent, and use commit(), rollback() and `with con:` correctly — knowing that `with con:` does not close the connection.
  - Pass values with ? and named placeholders, including one-element tuples, and explain why placeholders cannot stand in for table or column names.
  - Demonstrate how string-formatted SQL enables SQL injection and fix it with parameterised queries.
  - Group related changes in a transaction so that an error rolls all of them back.
  - Insert many rows with executemany and read columns by name with sqlite3.Row.
