id: databases.sql-joins
concept: databases.sql-joins
title: Joins
subtitle: Putting split tables back together — without losing or multiplying rows
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Learn why data is split across tables and how joins recombine it: INNER, LEFT, RIGHT and FULL OUTER
  joins, why one-to-many joins multiply rows, how to find rows with no match (anti-joins), joining a
  table to itself, and the classic bugs — the WHERE clause that silently turns a LEFT JOIN into an inner
  join, NOT IN with NULLs and accidental Cartesian products. Every query runs in SQLite via Python's
  sqlite3 module.
objectives:
  - Explain why normalised designs split data into tables linked by primary and foreign keys.
  - Write INNER, LEFT, RIGHT and FULL OUTER joins and predict exactly which rows each returns, including rows with NULL keys.
  - Predict how many rows a join produces from the cardinality of the relationship, and recognise totals inflated by fan-out.
  - Find rows without a match with an anti-join (LEFT JOIN ... WHERE right.id IS NULL or NOT EXISTS) and explain why NOT IN fails with NULLs.
  - Join a table to itself with aliases to relate rows of the same table.
  - Diagnose join bugs — conditions in WHERE versus ON, missing join conditions, ambiguous columns.
