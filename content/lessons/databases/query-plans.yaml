sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: EXPLAIN shows how the database will execute a query; reading plans reveals missing indexes, bad estimates
      and expensive joins. When a query is slow, guessing wastes time; the plan shows exactly what the database
      is doing and where the time goes.
- id: mental-model
  title: Core model and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- `EXPLAIN` shows the chosen plan with estimated costs and row counts; `EXPLAIN (ANALYZE, BUFFERS)` actually
      runs the query and adds real timings, row counts and pages read.

      - Read a plan from the most indented nodes outwards - scans (Seq Scan, Index Scan, Index Only Scan, Bitmap
      Heap Scan) feed joins (Nested Loop, Hash Join, Merge Join), which feed sorts and aggregates.

      - A large gap between estimated and actual rows points to stale or insufficient statistics; run `ANALYZE`
      or raise the column''s statistics target.

      - Work in order: find the queries that cost the most in total (`pg_stat_statements`), check for missing or
      unusable indexes, then rewrite the query or change the schema.

      - In SQLite, `EXPLAIN QUERY PLAN` shows whether a query uses an index (SEARCH) or reads the whole table (SCAN).'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- `EXPLAIN ANALYZE` really executes the statement, including INSERT, UPDATE and DELETE; wrap those in
      a transaction and roll it back.

      - A sequential scan is not automatically bad; for small tables or large result sets it is the right choice.'
- id: walkthrough
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This small Python model isolates one rule from the production concept. It helps make the rule testable;
      it is not a substitute for the framework or database itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def estimated_scan_cost(row_count, selectivity=1.0):\n    return {\"rows_scanned\": row_count, \"rows_returned\"\
      : int(row_count * selectivity)}\n\nprint(estimated_scan_cost(10000, 0.02))"
    caption: Runnable model of the lesson concept.
- id: practice
  title: Practice and implementation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper first, then run the provided assertions. Consider malformed input and boundary cases.
  - type: item
    ref: query-plans-code
  - type: item
    ref: query-plans-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Remember**

      - `EXPLAIN` shows the chosen plan with estimated costs and row counts; `EXPLAIN (ANALYZE, BUFFERS)` actually
      runs the query and adds real timings, row counts and pages read.

      - Read a plan from the most indented nodes outwards - scans (Seq Scan, Index Scan, Index Only Scan, Bitmap
      Heap Scan) feed joins (Nested Loop, Hash Join, Merge Join), which feed sorts and aggregates.

      - A large gap between estimated and actual rows points to stale or insufficient statistics; run `ANALYZE`
      or raise the column''s statistics target.

      - Work in order: find the queries that cost the most in total (`pg_stat_statements`), check for missing or
      unusable indexes, then rewrite the query or change the schema.

      - In SQLite, `EXPLAIN QUERY PLAN` shows whether a query uses an index (SEARCH) or reads the whole table (SCAN).


      **Avoid**

      - `EXPLAIN ANALYZE` really executes the statement, including INSERT, UPDATE and DELETE; wrap those in a transaction
      and roll it back.

      - A sequential scan is not automatically bad; for small tables or large result sets it is the right choice.'
  - type: item
    ref: query-plans-mcq
  - type: item
    ref: query-plans-tf
  - type: item
    ref: query-plans-code
