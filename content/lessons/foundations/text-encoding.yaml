id: foundations.text-encoding
concept: foundations.text-encoding
title: Text Encoding, Unicode and UTF-8
subtitle: Characters, code points and bytes
estimatedMinutes: 45
reviewedOn: 2026-10-22
summary: >-
  Computers store bytes, not letters. Unicode gives every character a number (a code point) and an encoding
  such as UTF-8 turns those numbers into bytes. Learn to move between str and bytes in Python, predict how
  many bytes text takes, recognise and fix decoding errors and garbled text, and always open text files with
  an explicit encoding.
objectives:
  - Distinguish characters, code points and bytes, and convert between them with ord(), chr(), str.encode() and bytes.decode().
  - Predict the UTF-8 length of text containing ASCII letters, accented letters, symbols such as ₹ and emoji.
  - Explain why len() of a str and len() of its encoded bytes differ.
  - Diagnose UnicodeDecodeError and mojibake, and fix them by decoding with the correct encoding.
  - Open text files with an explicit encoding, and handle a UTF-8 byte order mark.
  - Explain why visually identical strings can compare unequal, and normalise them with NFC.
