sections:
  - id: why
    title: Why text goes wrong
    kind: why
    blocks:
      - type: markdown
        body: |
          You have probably seen text like **cafÃ©** instead of **café**, or a customer name that turns into
          question marks after an export. These bugs come from one fact: **files, networks and databases store
          bytes, not letters.** Turning text into bytes and back requires an agreed rule, an
          [encoding](glossary:character-encoding). Use the wrong rule when reading, and the bytes are
          misinterpreted.

          This lesson uses a little Python: names for values (`data = ...`), strings in quotes, `print` and
          `len`. Every new tool is explained as it appears. Run this:
      - type: code
        runnable: true
        code: |
          data = "café".encode("utf-8")
          print(data)
          print(data.decode("utf-8"))
          print(data.decode("latin-1"))
        expectedOutput: |
          b'caf\xc3\xa9'
          café
          cafÃ©
        annotations:
          - line: 1
            text: "`.encode(\"utf-8\")` turns the text into bytes using the UTF-8 rule."
          - line: 2
            text: "Five bytes: c, a, f, then two bytes (`\\xc3\\xa9`) for é."
          - line: 3
            text: Decoding with the same rule gives the original text back.
          - line: 4
            text: Decoding with a different rule (Latin-1) reads each of é's two bytes as a separate character - garbled text, and no error.
      - type: markdown
        body: |
          Same bytes, two different readings. The fix is never "try random encodings until it looks right";
          it is knowing **which encoding the bytes were written with** and using that one. To do that
          confidently you need three ideas: characters, code points and bytes.

  - id: code-points
    title: Characters and code points
    kind: concept
    blocks:
      - type: markdown
        body: |
          [Unicode](glossary:unicode) is a catalogue that gives every character — Latin and Devanagari
          letters, Chinese characters, symbols such as ₹, emoji — a unique number called a
          [code point](glossary:code-point). Code points are written `U+` followed by the number in
          hexadecimal (base 16): `A` is U+0041, `é` is U+00E9, `₹` is U+20B9, `😀` is U+1F600. Unicode has
          room for 1,114,112 code points (U+0000 to U+10FFFF).

          In Python, a `str` is a sequence of code points. `ord()` gives a character's code point and `chr()`
          goes the other way:
      - type: code
        runnable: true
        code: |
          for ch in "Aé₹😀":
              print(ch, ord(ch), f"U+{ord(ch):04X}")
        expectedOutput: |
          A 65 U+0041
          é 233 U+00E9
          ₹ 8377 U+20B9
          😀 128512 U+1F600
        annotations:
          - line: 1
            text: The loop takes one character (code point) of the string at a time.
          - line: 2
            text: "`ord(ch)` is the code point as a normal number; `:04X` formats it as at least four hexadecimal digits."
      - type: code
        runnable: true
        code: |
          print(chr(65), chr(233), chr(8377), chr(0x1F600))
          print(len("café"))
        expectedOutput: |
          A é ₹ 😀
          4
        annotations:
          - line: 1
            text: "`chr()` turns a code point back into a one-character string. `0x1F600` is a number written in hexadecimal."
          - line: 2
            text: "`len()` of a str counts code points: c, a, f, é."
      - type: callout
        variant: note
        title: A code point is a number, not bytes
        body: |
          U+20B9 tells you *which* character ₹ is. It does not say how ₹ is stored. Storage is the job of an
          encoding, and different encodings store the same code point as different bytes.
      - type: item
        ref: what-is-code-point

  - id: bytes-and-encodings
    title: Bytes, encode and decode
    kind: concept
    blocks:
      - type: markdown
        body: |
          A byte holds a number from 0 to 255. Python represents raw bytes with the
          [bytes](glossary:bytes-object) type. Two methods move between the worlds:

          - **`text.encode("utf-8")`** — str → bytes (characters to storage).
          - **`data.decode("utf-8")`** — bytes → str (storage back to characters).
      - type: code
        runnable: true
        code: |
          text = "café"
          data = text.encode("utf-8")
          print(type(text).__name__, type(data).__name__)
          print(data)
          print(list(data))
          print(data.decode("utf-8") == text)
        expectedOutput: |
          str bytes
          b'caf\xc3\xa9'
          [99, 97, 102, 195, 169]
          True
        annotations:
          - line: 3
            text: Two different types. A str holds code points; a bytes object holds numbers 0-255.
          - line: 4
            text: "The `b'...'` display shows bytes that happen to be printable ASCII as letters, and the rest as `\\x` plus two hex digits."
          - line: 5
            text: "`list()` reveals the actual numbers: 195 and 169 (hex c3 and a9) together encode é."
          - line: 6
            text: Decoding with the same encoding is a perfect round trip.
      - type: markdown
        body: |
          A useful rule: **text inside your program is `str`; text at the edges is bytes.** Decode bytes as
          soon as they arrive (from a file, socket or HTTP response), work with `str`, and encode when you
          send or save. Mixing the two is an error, not a silent conversion:
      - type: code
        runnable: true
        code: |
          print("abc" + b"def")
        expectError: TypeError
        caption: "TypeError: can only concatenate str (not \"bytes\") to str. Decode the bytes first."
      - type: item
        ref: predict-len-bytes

  - id: utf8-lengths
    title: "UTF-8: one to four bytes per character"
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          [UTF-8](glossary:utf-8) is the dominant encoding on the web and the default in most modern tools.
          It uses a **variable number of bytes** per code point:

          | Code points | Bytes | Examples |
          |---|---|---|
          | U+0000 – U+007F | 1 | English letters, digits, punctuation (the [ASCII](glossary:ascii) range) |
          | U+0080 – U+07FF | 2 | é, ü, ñ, Greek, Cyrillic, Hebrew, Arabic |
          | U+0800 – U+FFFF | 3 | ₹, €, Devanagari, Chinese, Japanese, Korean |
          | U+10000 – U+10FFFF | 4 | Most emoji, rare scripts and symbols |

          See it for yourself — `.hex(" ")` prints bytes as hexadecimal pairs:
      - type: code
        runnable: true
        code: |
          for ch in "Aé₹😀":
              encoded = ch.encode("utf-8")
              print(ch, f"U+{ord(ch):04X}", len(encoded), encoded.hex(" "))
        expectedOutput: |
          A U+0041 1 41
          é U+00E9 2 c3 a9
          ₹ U+20B9 3 e2 82 b9
          😀 U+1F600 4 f0 9f 98 80
      - type: markdown
        body: |
          Because the sizes vary, **the number of characters and the number of bytes are different
          measurements**:
      - type: code
        runnable: true
        code: |
          text = "Aé₹😀"
          print(len(text))
          print(len(text.encode("utf-8")))
        expectedOutput: |
          4
          10
        annotations:
          - line: 2
            text: 4 code points.
          - line: 3
            text: 1 + 2 + 3 + 4 = 10 bytes.
      - type: markdown
        body: |
          Step through a loop that adds up the bytes character by character. Watch `size` change with each
          character and `total` grow:
      - type: visualization
        component: python-tracer
        title: Counting UTF-8 bytes per character
        caption: n takes 1 byte, é takes 2 and ₹ takes 3, so 3 characters need 6 bytes.
        props:
          code: |
            word = "né₹"
            total = 0
            for ch in word:
                size = len(ch.encode("utf-8"))
                total += size
            print(len(word), total)
      - type: callout
        variant: production
        title: Where the difference bites
        body: |
          Limits are often in **bytes**: the HTTP `Content-Length` header, database column sizes in some
          systems, message size limits, buffers. A 20-character name in Hindi can be 60 bytes. Measure the
          encoded length whenever a limit or a protocol talks about bytes.
      - type: item
        ref: predict-emoji

  - id: decoding-errors
    title: Wrong encodings, errors and garbled text
    kind: concept
    blocks:
      - type: markdown
        body: |
          Decoding with the wrong encoding fails in one of two ways.

          **1. Loudly — a [UnicodeDecodeError](glossary:unicode-decode-error).** The bytes are not valid in
          the encoding you chose. ASCII only knows 0-127, so the byte 0xC3 is impossible:
      - type: code
        runnable: true
        code: |
          data = "café".encode("utf-8")
          print(data.decode("ascii"))
        expectError: UnicodeDecodeError
        caption: "'ascii' codec can't decode byte 0xc3 in position 3: ordinal not in range(128)"
      - type: markdown
        body: |
          UTF-8 has strict rules about which bytes may follow which, so text saved in an older Windows
          encoding usually fails loudly when read as UTF-8:
      - type: code
        runnable: true
        code: |
          data = "Zoë,Renée".encode("cp1252")
          print(data.decode("utf-8"))
        expectError: UnicodeDecodeError
        caption: "'utf-8' codec can't decode byte 0xeb in position 2: invalid continuation byte. In cp1252, ë is the single byte 0xEB."
      - type: markdown
        body: |
          The message tells you a lot: **which codec** was used, **which byte** was bad, and **where**. A
          byte such as 0xE9 or 0xEB in "UTF-8" text is a strong hint that the data is really Latin-1 or
          cp1252.

          Encoding can fail too: `"₹".encode("ascii")` raises `UnicodeEncodeError`, because ASCII has no
          byte for ₹.

          **2. Silently — [mojibake](glossary:mojibake).** Single-byte encodings such as Latin-1 and cp1252
          assign a character to (almost) every byte, so decoding "succeeds" with the wrong characters. That is
          the cafÃ© you saw at the start. Silent corruption is worse than an error: it gets saved, indexed
          and emailed to customers.
      - type: markdown
        body: |
          The `errors=` argument chooses what happens on a bad byte. The default `"strict"` raises; `"replace"`
          substitutes a marker (U+FFFD `�` when decoding, `?` when encoding to ASCII). Use `"replace"` only
          when losing data is acceptable, such as displaying a log line — never to make an error "go away".
      - type: code
        runnable: true
        code: |
          data = "café".encode("utf-8")
          print(data.decode("ascii", errors="replace"))
          print("₹50".encode("ascii", errors="replace"))
        expectedOutput: |
          caf��
          b'?50'
        annotations:
          - line: 2
            text: Each of é's two bytes became one replacement character - information is lost.
      - type: item
        ref: latin1-silent

  - id: files
    title: Always say encoding="utf-8" for text files
    kind: concept
    blocks:
      - type: markdown
        body: |
          When Python opens a file in text mode it decodes bytes to `str` for you — using an encoding. If you
          do not name one, Python uses a **platform-dependent default** from the operating system's locale.
          On Linux and macOS that is usually UTF-8; on many Windows machines it is a legacy code page such as
          cp1252. The same program then reads a file correctly on one computer and fails (or garbles it) on
          another. ([PEP 686](https://peps.python.org/pep-0686/) makes UTF-8 the default from Python 3.15,
          but code that must run on older versions still needs the explicit argument.)

          `open()` is covered fully in [reading and writing files](concept:python.files); here, notice only
          the `encoding=` argument and the `"rb"` mode, which reads raw bytes without decoding.
      - type: code
        runnable: true
        code: |
          with open("names.txt", "w", encoding="utf-8") as f:
              f.write("José\n")

          with open("names.txt", "rb") as f:
              print(f.read())

          with open("names.txt", encoding="utf-8") as f:
              print(f.read().strip())

          with open("names.txt", encoding="latin-1") as f:
              print(f.read().strip())
        expectedOutput: |
          b'Jos\xc3\xa9\n'
          José
          JosÃ©
        annotations:
          - line: 1
            text: Write text; Python encodes it to UTF-8 bytes on the way to the file.
          - line: 4
            text: '"rb" = read bytes. This is what is really on disk.'
          - line: 7
            text: Reading with the encoding it was written in gives the original text.
          - line: 10
            text: Reading the same bytes as Latin-1 silently produces mojibake.
      - type: markdown
        body: |
          **The rule:** pass `encoding="utf-8"` every time you open a text file for reading or writing —
          unless you know the file uses another encoding, in which case name that one.

          **The byte order mark.** Some programs (for example spreadsheet software exporting "CSV UTF-8")
          put an invisible [byte order mark](glossary:byte-order-mark), U+FEFF, at the start of a UTF-8 file.
          Decoded as plain UTF-8 it stays glued to the first column name. The `"utf-8-sig"` codec removes it
          if present:
      - type: code
        runnable: true
        code: |
          data = b"\xef\xbb\xbfname,city\nAsha,Pune\n"

          header = data.decode("utf-8").splitlines()[0].split(",")
          print(header[0] == "name", len(header[0]), hex(ord(header[0][0])))

          header = data.decode("utf-8-sig").splitlines()[0].split(",")
          print(header[0] == "name", header)
        expectedOutput: |
          False 5 0xfeff
          True ['name', 'city']
        annotations:
          - line: 1
            text: The first three bytes, EF BB BF, are the BOM in UTF-8; the rest is an ordinary CSV.
          - line: 4
            text: Decoded as plain UTF-8, the first column name is 5 characters - an invisible U+FEFF followed by name - so it is not equal to "name".
          - line: 7
            text: utf-8-sig strips a leading BOM; files without one are read exactly as with utf-8.

  - id: under-the-hood
    title: How UTF-8 packs bits, and how other encodings compare
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          UTF-8 ([RFC 3629](https://www.rfc-editor.org/rfc/rfc3629)) spreads a code point's bits over one to
          four bytes. The first byte's leading bits say how many bytes follow; every continuation byte starts
          with `10`:

          | Bytes | Byte pattern | Payload bits |
          |---|---|---|
          | 1 | `0xxxxxxx` | 7 |
          | 2 | `110xxxxx 10xxxxxx` | 11 |
          | 3 | `1110xxxx 10xxxxxx 10xxxxxx` | 16 |
          | 4 | `11110xxx 10xxxxxx 10xxxxxx 10xxxxxx` | 21 |
      - type: code
        runnable: true
        code: |
          for byte in "é".encode("utf-8"):
              print(format(byte, "08b"))
          print(format(ord("é"), "011b"))
        expectedOutput: |
          11000011
          10101001
          00011101001
        caption: >-
          é is U+00E9 = 233. The payload bits after 110 and 10 are 00011 and 101001; joined they give
          00011101001, which is 233.
      - type: markdown
        body: |
          This design has valuable properties:

          - **ASCII compatible.** Bytes 0-127 mean exactly what they mean in ASCII, and never appear inside a
            multi-byte sequence. Old ASCII files are valid UTF-8, and searching for `/` or `,` in UTF-8 bytes
            never matches half of another character.
          - **Self-synchronising.** From any position you can find the start of the next character (skip
            bytes that begin with `10`).
          - **No byte-order problem.** UTF-8 is a sequence of single bytes, so it needs no BOM.

          **UTF-16** (used inside Windows, Java and JavaScript strings) uses 2 bytes for most characters and 4
          (a *surrogate pair*) for code points above U+FFFF. That is why `"😀".length` is 2 in JavaScript while
          `len("😀")` is 1 in Python, which counts code points.
      - type: code
        runnable: true
        code: |
          print(len("A".encode("utf-16-le")), len("😀".encode("utf-16-le")))
          print("A".encode("utf-16"))
        expectedOutput: |
          2 4
          b'\xff\xfeA\x00'
        caption: '"utf-16" (no -le/-be) writes a BOM, FF FE here, so the reader can tell the byte order.'
      - type: markdown
        body: |
          **Chunked data.** A multi-byte character can be split across two network packets or two reads of a
          file. Decoding each chunk separately then fails with *unexpected end of data*. An incremental
          decoder keeps the unfinished bytes until the rest arrive — this matters when you stream text from a
          socket or an LLM API.
      - type: code
        runnable: true
        code: |
          data = "₹100".encode("utf-8")
          print(data[:2].decode("utf-8"))
        expectError: UnicodeDecodeError
        caption: "'utf-8' codec can't decode bytes in position 0-1: unexpected end of data - only 2 of ₹'s 3 bytes."
      - type: code
        runnable: true
        code: |
          import codecs

          decoder = codecs.getincrementaldecoder("utf-8")()
          text = ""
          for chunk in [b"\xe2\x82", b"\xb9100"]:
              text += decoder.decode(chunk)
          text += decoder.decode(b"", final=True)
          print(text)
        expectedOutput: |
          ₹100
        caption: The decoder holds the incomplete bytes from the first chunk and completes ₹ when the second arrives.
      - type: markdown
        body: |
          **How CPython stores str.** Internally CPython picks 1, 2 or 4 bytes per code point for each string,
          depending on the largest code point it contains ([PEP 393](https://peps.python.org/pep-0393/)).
          That is an implementation detail: the language only promises that a str is a sequence of code
          points.

  - id: normalisation
    title: "Same look, different code points: normalisation"
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          Unicode can represent some characters in more than one way. `é` can be a single *precomposed* code
          point (U+00E9) or the letter `e` followed by U+0301 COMBINING ACUTE ACCENT. They look identical but
          are different sequences, so `==` says they differ. Text typed on different systems, or copied from
          PDFs and web pages, mixes both forms.
      - type: code
        runnable: true
        code: |
          import unicodedata

          composed = chr(0xE9)
          decomposed = "e" + chr(0x301)
          print(composed == decomposed, len(composed), len(decomposed))
          print([unicodedata.name(ch) for ch in decomposed])
          print(unicodedata.normalize("NFC", decomposed) == composed)
          print([f"U+{ord(ch):04X}" for ch in unicodedata.normalize("NFD", composed)])
        expectedOutput: |
          False 1 2
          ['LATIN SMALL LETTER E', 'COMBINING ACUTE ACCENT']
          True
          ['U+0065', 'U+0301']
        annotations:
          - line: 3
            text: "`chr(0xE9)` is the precomposed é, one code point."
          - line: 4
            text: The letter e followed by U+0301, a combining accent that attaches to the previous letter. On screen it also looks like é.
          - line: 7
            text: NFC composes sequences into single code points where possible.
          - line: 8
            text: NFD decomposes them into a base letter plus combining marks.
      - type: markdown
        body: |
          [Normalisation](glossary:unicode-normalization) ([UAX #15](https://www.unicode.org/reports/tr15/))
          defines standard forms:

          | Form | What it does | Typical use |
          |---|---|---|
          | **NFC** | Compose (é as one code point) | Storing and comparing text; most common |
          | **NFD** | Decompose (e + accent) | Some file systems store names this way; stripping accents |
          | **NFKC / NFKD** | Also replace "compatibility" variants: ligature ﬁ → fi, full-width Ａ → A, ² → 2 | Search, usernames, identifiers |

          Normalise **both sides** before comparing, hashing or storing text as a key. Python itself applies
          NFKC to identifiers when it parses source code. For caseless matching use `str.casefold()`, which is
          more thorough than `lower()`:
      - type: code
        runnable: true
        code: |
          import unicodedata

          print(unicodedata.normalize("NFKC", "ﬁ Ａ ²"))
          print("Straße".lower(), "Straße".casefold())
          print(len("👍🏽"), [f"U+{ord(ch):04X}" for ch in "👍🏽"])
        expectedOutput: |
          fi A 2
          straße strasse
          2 ['U+1F44D', 'U+1F3FD']
        annotations:
          - line: 5
            text: A thumbs-up with a skin-tone modifier is two code points shown as one symbol.
      - type: callout
        variant: note
        title: len() counts code points, not what a reader sees
        body: |
          What a reader perceives as one character is a [grapheme cluster](glossary:grapheme-cluster): it may
          be several code points (an emoji with a skin tone, a family emoji joined with zero-width joiners, a
          letter with combining marks). The standard library has no grapheme splitter; the rules are in
          [UAX #29](https://www.unicode.org/reports/tr29/), and third-party packages implement them. Keep this
          in mind before truncating user-visible text to "N characters".
      - type: item
        ref: normalise-mcq

  - id: mistakes
    title: Common mistakes and how to fix them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `UnicodeDecodeError: 'utf-8' codec can't decode byte 0xe9 ...` | The data is not UTF-8 (often Latin-1 or cp1252) | Find out the real encoding (ask the producer, check the export settings) and decode with it; convert to UTF-8 when you save |
          | `UnicodeDecodeError: ... unexpected end of data` | Bytes were cut in the middle of a character | Decode the complete data, or use an incremental decoder for streams |
          | Text shows `Ã©`, `â‚¹` or `Ã¼` | UTF-8 bytes were decoded as Latin-1/cp1252 | Decode the original bytes as UTF-8. Do not try to "repair" already-garbled text by guessing |
          | `UnicodeEncodeError: 'ascii' codec can't encode character` | Writing to a destination configured for ASCII | Encode/open with `encoding="utf-8"` |
          | `row["name"]` raises KeyError although the header looks like `name,city` | The file starts with a UTF-8 BOM, so the first column is really U+FEFF + `name` | Open with `encoding="utf-8-sig"` |
          | `TypeError: can only concatenate str (not "bytes") to str` | Mixing str and bytes | Decode bytes at the edge of your program; work in str |
          | Works on your laptop, fails on a colleague's | `open()` without `encoding=` uses each machine's default | Always pass `encoding="utf-8"` |
          | Two names that look the same do not match | Different normalisation forms | `unicodedata.normalize("NFC", s)` on both sides |
      - type: callout
        variant: warning
        title: errors="ignore" hides data loss
        body: |
          `decode("utf-8", errors="ignore")` silently drops bytes it cannot decode, so "José" can become "Jos".
          It makes the error message disappear, not the problem. Find the right encoding instead.

