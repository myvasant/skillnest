  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - **Character** (what you see) → **code point** (Unicode's number, `ord`/`chr`) → **bytes** (what is
            stored, chosen by an **encoding**).
          - `str.encode("utf-8")` makes bytes; `bytes.decode("utf-8")` makes text. Decode at the edges, work
            in `str` inside.
          - UTF-8 uses 1 byte for ASCII, 2 for é, 3 for ₹, 4 for most emoji, so `len(text)` and
            `len(text.encode("utf-8"))` differ.
          - The wrong codec gives a **UnicodeDecodeError** (loud) or **mojibake** (silent). Fix it by using
            the encoding the bytes were written with.
          - Always `open(..., encoding="utf-8")`; use `"utf-8-sig"` for files that may start with a BOM.
          - Visually identical text can differ in code points; normalise with NFC before comparing.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "What is the difference between Unicode and UTF-8?" — Unicode assigns code points to characters;
          UTF-8 is one encoding that stores code points as 1–4 bytes, ASCII-compatible. Be ready to explain
          why `len()` of text and of its bytes differ, and how you would debug a `UnicodeDecodeError`. See
          [the interview question](interview:foundations.text-encoding.unicode-vs-utf8).

items:
  - id: what-is-code-point
    type: mcq
    skill: recognition
    prompt: What is a Unicode code point?
    explanation: >-
      A code point is the number Unicode assigns to a character (U+20B9 for ₹). How that number is stored as
      bytes depends on the encoding.
    options:
      - id: a
        text: The number Unicode assigns to a character, such as U+20B9 for ₹.
        correct: true
        feedback: Right. ord("₹") gives 8377, which is 0x20B9.
      - id: b
        text: The byte that stores a character on disk.
        feedback: Bytes come from an encoding. ₹ has one code point but three bytes in UTF-8.
      - id: c
        text: The position of a character inside a string.
        feedback: That is an index. A code point identifies which character it is, wherever it appears.
      - id: d
        text: Another name for UTF-8.
        feedback: UTF-8 is an encoding that turns code points into bytes; Unicode code points exist independently of any encoding.

  - id: predict-len-bytes
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      word = "naïve"
      print(len(word), len(word.encode("utf-8")))
    answer: "5 6"
    explanation: >-
      "naïve" has 5 code points. In UTF-8, n, a, v and e take one byte each and ï (U+00EF) takes two, so the
      encoded form has 6 bytes.
    wrongAnswers:
      - answer: "5 5"
        feedback: One character is not always one byte. ï is outside the ASCII range and needs two bytes in UTF-8.
      - answer: "6 6"
        feedback: len() of a str counts code points, and ï is a single code point here, so the str length is 5.
      - answer: "6 5"
        feedback: The str has 5 characters; it is the bytes that are longer, because ï needs two bytes.

  - id: predict-emoji
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      smile = "😀"
      print(len(smile), len(smile.encode("utf-8")))
    answer: "1 4"
    explanation: >-
      😀 is one code point (U+1F600), so its str length is 1. Code points above U+FFFF need four bytes in
      UTF-8.
    wrongAnswers:
      - answer: "2 4"
        feedback: >-
          That is the JavaScript answer, where strings count UTF-16 code units and 😀 needs two. Python's len()
          counts code points, so it is 1.
      - answer: "1 1"
        feedback: An emoji is far outside the one-byte ASCII range. UTF-8 uses four bytes for U+1F600.
      - answer: "4 4"
        feedback: The str holds one code point. Only the encoded bytes number four.

  - id: latin1-silent
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      A teammate "fixed" a UnicodeDecodeError by changing `data.decode("utf-8")` to `data.decode("latin-1")`.
      The error is gone. Why is this risky?
    explanation: >-
      Latin-1 maps every byte 0-255 to some character, so decoding can never fail - it just produces wrong
      text when the bytes were written in another encoding. The real fix is to use the encoding the data was
      written with.
    options:
      - id: a
        text: Latin-1 decodes any bytes without error, so wrong text (mojibake) is produced silently instead of an error.
        correct: true
        feedback: Correct. An error you can see has been replaced by corruption you cannot.
      - id: b
        text: Latin-1 is slower than UTF-8.
        feedback: Speed is not the issue. Correctness is - the characters may simply be wrong.
      - id: c
        text: There is no risk; Latin-1 can represent every Unicode character.
        feedback: Latin-1 covers only 256 characters (U+0000-U+00FF). It cannot represent ₹ or emoji at all.
      - id: d
        text: Latin-1 removes accents from the text.
        feedback: It does not remove anything; it reads each byte as one character, which garbles multi-byte UTF-8 characters into several wrong ones.

  - id: normalise-mcq
    type: mcq
    skill: debugging
    difficulty: 3
    prompt: |
      A login form compares the typed username with the stored one. Both display as `renée`, but `typed ==
      stored` is `False`, and `len(typed)` is 6 while `len(stored)` is 5. What is the best fix?
    explanation: >-
      One string uses e + COMBINING ACUTE ACCENT (6 code points), the other the precomposed é (5). Normalising
      both to the same form, usually NFC, before comparing or storing makes equivalent text equal.
    options:
      - id: a
        text: Normalise both strings with unicodedata.normalize("NFC", ...) before comparing (and store usernames normalised).
        correct: true
        feedback: Right. Normalise on the way in and before every comparison.
      - id: b
        text: Compare the UTF-8 bytes instead of the strings.
        feedback: The bytes differ too, because the code points differ. Encoding does not make equivalent forms equal.
      - id: c
        text: Remove all non-ASCII characters from usernames.
        feedback: That destroys legitimate names and can make different users collide.
      - id: d
        text: Use .lower() on both.
        feedback: Case is not the problem here; both strings are already lower case but use different code point sequences.

  - id: byte-budget
    type: code
    skill: implementation
    prompt: |
      A messaging gateway measures messages in UTF-8 **bytes**. For the given `message`:

      1. create `char_count`, the number of characters (code points),
      2. create `byte_count`, the number of bytes when encoded as UTF-8,
      3. print them in the form `10 characters, 16 bytes`.

      Calculate both from `message` — the checks re-run your code with a different message.
    starterCode: |
      message = "Café ₹50 😀"

      # Create char_count and byte_count from message, then print them.
    solution: |
      message = "Café ₹50 😀"

      char_count = len(message)
      byte_count = len(message.encode("utf-8"))
      print(f"{char_count} characters, {byte_count} bytes")
    expectedOutput: |
      10 characters, 16 bytes
    tests:
      - name: char_count counts code points
        code: |
          assert defined("char_count"), "Create a variable named char_count."
          assert char_count == len(message), f"char_count should be len(message) = {len(message)}, but it is {char_count!r}."
      - name: byte_count counts UTF-8 bytes
        code: |
          assert defined("byte_count"), "Create a variable named byte_count."
          assert byte_count == len(message.encode("utf-8")), f"byte_count should be the length of message.encode('utf-8'), which is {len(message.encode('utf-8'))}, but it is {byte_count!r}."
      - name: prints the summary line
        code: |
          assert output_lines()[-1:] == ["10 characters, 16 bytes"], f"The last line should be '10 characters, 16 bytes'. Your program printed {output()!r}."
      - name: works for a different message
        code: |
          import ast, io, contextlib
          tree = ast.parse(source)
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "message" for t in node.targets):
                  node.value = ast.Constant("naïve ☕")
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(ast.fix_missing_locations(tree), "<check>", "exec"), {"__name__": "__main__"})
          last = buffer.getvalue().strip().splitlines()[-1:]
          assert last == ["7 characters, 10 bytes"], f"With message = 'naïve ☕' your program printed {last!r}; expected '7 characters, 10 bytes'. Compute both numbers from message with len() and .encode('utf-8')."
    hints:
      - "`len(message)` counts characters (code points)."
      - "`message.encode(\"utf-8\")` gives the bytes; take `len()` of that."
      - "An f-string such as `f\"{char_count} characters, {byte_count} bytes\"` builds the line."
    feedback:
      - when: { outputContains: "10 characters, 10 bytes" }
        message: You measured the str twice. byte_count must measure the encoded bytes - call .encode("utf-8") first.
      - when: { errorType: TypeError }
        message: Check that you take len() of the result of message.encode("utf-8"), and that you are not adding str and bytes together.
    explanation: >-
      len(message) counts 10 code points. Encoded as UTF-8, the ASCII characters take 1 byte each, é takes 2,
      ₹ takes 3 and 😀 takes 4, giving 16 bytes. Computing both from message keeps the numbers right for any
      text.

  - id: fix-mojibake
    type: debug
    skill: debugging
    prompt: |
      These bytes arrived from an API that documents its responses as UTF-8. The program prints garbled text
      instead of `José paid ₹500`. Fix the decoding — do not retype the text.
    starterCode: |
      raw = b"Jos\xc3\xa9 paid \xe2\x82\xb9500"
      text = raw.decode("latin-1")
      print(text)
    solution: |
      raw = b"Jos\xc3\xa9 paid \xe2\x82\xb9500"
      text = raw.decode("utf-8")
      print(text)
    expectedOutput: |
      José paid ₹500
    tests:
      - name: decodes to the right text
        code: |
          assert text == "José paid ₹500", f"text should be 'José paid ₹500' but it is {text!r}. Which encoding did the API say it uses?"
      - name: prints it
        code: |
          assert output_lines() == ["José paid ₹500"], f"Print text. Your program printed {output()!r}."
      - name: decodes the original bytes
        code: |
          assert raw == b"Jos\xc3\xa9 paid \xe2\x82\xb9500", "Keep raw exactly as given - the bytes are correct; the decoding is wrong."
          assert calls("decode") and "José" not in source, "Get the text by decoding raw, not by typing it."
    hints:
      - The API says its responses are UTF-8. Which encoding does the program use to decode them?
      - "Decode with the encoding the bytes were written in: `raw.decode(\"utf-8\")`."
    feedback:
      - when: { outputContains: "Ã" }
        message: You are still decoding UTF-8 bytes with a single-byte encoding (Latin-1 or cp1252). Use utf-8.
      - when: { errorType: UnicodeDecodeError }
        message: That codec cannot read these bytes. They are UTF-8, as the API documents.
    explanation: >-
      The bytes are valid UTF-8 (c3 a9 is é, e2 82 b9 is ₹). Latin-1 read each byte as its own character,
      producing mojibake without an error. Decoding with UTF-8, the encoding they were written in, restores
      the text.

  - id: parsons-roundtrip
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to encode a price to UTF-8, print how many bytes it takes, decode it back and confirm
      the round trip. One line is a distractor.
    solution: |
      price = "₹100"
      data = price.encode("utf-8")
      print(len(data))
      back = data.decode("utf-8")
      print(back == price)
    distractors:
      - back = data.encode("utf-8")
    expectedOutput: |
      6
      True
    explanation: >-
      Encode str to bytes (₹ is 3 bytes, plus 3 digits = 6), then decode bytes back to str. bytes objects have
      no encode method - you decode bytes and encode text.

  - id: explain-ascii-compat
    type: explain
    skill: explanation
    prompt: |
      Explain why UTF-8 uses a variable number of bytes per character, and why being compatible with ASCII
      helped it become the standard encoding of the web.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says Unicode has over a million possible code points, too many for one byte.
      - Says UTF-8 uses 1 byte for ASCII characters and 2-4 bytes for others, keeping common English text small.
      - Explains that ASCII files are already valid UTF-8 with identical bytes, so old files and tools kept working.
      - Mentions that bytes 0-127 never appear inside multi-byte sequences, so searching for ASCII characters is safe.
    modelAnswer: |
      Unicode has room for more than a million code points, so a fixed one-byte encoding cannot cover it, and
      a fixed four bytes per character would quadruple the size of English text. UTF-8 compromises: code
      points 0-127 (ASCII) take one byte, and larger code points take two, three or four bytes. Because the
      one-byte range is exactly ASCII, every existing ASCII file was already valid UTF-8, and programs that
      only cared about ASCII characters such as `/`, `,` or newline kept working - those byte values never
      occur inside the multi-byte sequences of other characters. That painless migration is a big reason the
      web standardised on it.

  # ----- Mastery check (new items) -----
  - id: m-predict-rupee
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      print("₹".encode("utf-8"), len("₹"))
    answer: |
      b'\xe2\x82\xb9' 1
    explanation: >-
      ₹ is one code point (len 1) encoded in UTF-8 as three bytes, which Python displays as \x escapes because
      they are not printable ASCII.
    wrongAnswers:
      - answer: |
          b'₹' 1
        feedback: A bytes display never contains non-ASCII characters; bytes outside printable ASCII are shown as \x plus two hex digits.
      - answer: |
          b'\xe2\x82\xb9' 3
        feedback: The second value is len() of the str "₹", which counts code points - one.
      - answer: |
          ₹ 1
        feedback: .encode() returns bytes, and printing bytes shows the b'...' form, not the character.

  - id: m-bom-mcq
    type: mcq
    skill: debugging
    difficulty: 2
    prompt: |
      A CSV exported as "CSV UTF-8" is read with `encoding="utf-8"`. Looking up the `name` column raises
      `KeyError: 'name'`, although the header looks like `name,city`. Checking `len(header[0])` gives 5 and
      `hex(ord(header[0][0]))` gives `0xfeff`. What is the best fix?
    explanation: >-
      The file starts with a UTF-8 byte order mark (EF BB BF), which decodes to U+FEFF and sticks to the first
      header. The utf-8-sig codec removes a leading BOM and otherwise behaves like utf-8.
    options:
      - id: a
        text: Open the file with encoding="utf-8-sig".
        correct: true
        feedback: Correct. It strips the BOM if present and reads files without one normally.
      - id: b
        text: Open the file with encoding="latin-1".
        feedback: Latin-1 would turn the BOM into three garbage characters (ï»¿) and garble every non-ASCII letter.
      - id: c
        text: Delete all non-ASCII characters from the file.
        feedback: That destroys real data such as names with accents; the problem is one invisible character at the start.
      - id: d
        text: Prefix the column name with the invisible U+FEFF character everywhere in your code.
        feedback: That ties your code to one export tool's quirk and breaks for files without a BOM.

  - id: m-partner-cp1252
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      A partner system writes its export files in Windows-1252 (Python codec name `cp1252`). The first part of
      the program simulates that file. Reading it crashes with a UnicodeDecodeError. Fix the **reading** so the
      program prints `['Zoë', 'Renée']`. Do not change how the file is written, and do not hide errors with
      `errors=`.
    starterCode: |
      # The partner's file (written in cp1252) - leave this part unchanged.
      with open("partner.txt", "wb") as f:
          f.write("Zoë,Renée\n".encode("cp1252"))

      # Read it back.
      with open("partner.txt", encoding="utf-8") as f:
          names = f.read().strip().split(",")
      print(names)
    solution: |
      # The partner's file (written in cp1252) - leave this part unchanged.
      with open("partner.txt", "wb") as f:
          f.write("Zoë,Renée\n".encode("cp1252"))

      # Read it back.
      with open("partner.txt", encoding="cp1252") as f:
          names = f.read().strip().split(",")
      print(names)
    expectedOutput: |
      ['Zoë', 'Renée']
    tests:
      - name: names are decoded correctly
        code: |
          assert names == ["Zoë", "Renée"], f"names should be ['Zoë', 'Renée'] but is {names!r}. Read the file with the encoding it was written in."
      - name: the partner file is unchanged
        code: |
          with open("partner.txt", "rb") as f:
              on_disk = f.read()
          assert on_disk == "Zoë,Renée\n".encode("cp1252"), "Keep writing the file in cp1252 - the partner's format is not yours to change."
      - name: no error hiding
        code: |
          assert "errors=" not in source, "Don't use errors=...; choose the correct encoding instead."
    hints:
      - The error mentions byte 0xeb. In which encoding is ë the single byte 0xEB?
      - "Change only the reading line: `open(\"partner.txt\", encoding=\"cp1252\")`."
    feedback:
      - when: { errorType: UnicodeDecodeError }
        message: The file is still being decoded as UTF-8 (or another wrong codec). The partner writes cp1252.
      - when: { outputContains: "Ã" }
        message: That is mojibake - the bytes were decoded with the wrong single-byte codec. Use cp1252 for reading.
    explanation: >-
      The file's bytes are cp1252, where ë is the single byte 0xEB - invalid as UTF-8. Reading with
      encoding="cp1252" decodes them correctly. In a real pipeline you would then write your own outputs as
      UTF-8.

  - id: m-utf8-report
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Write a program that, for the string `word`, prints one line per character with the character and its
      UTF-8 byte count, followed by a final `total` line. For `word = "₹5é"` the output is:

      ```text
      ₹ 3
      5 1
      é 2
      total 6
      ```

      Use a loop; the checks also run your program with a different `word`.
    starterCode: |
      word = "₹5é"

    solution: |
      word = "₹5é"

      total = 0
      for ch in word:
          size = len(ch.encode("utf-8"))
          print(ch, size)
          total += size
      print("total", total)
    expectedOutput: |
      ₹ 3
      5 1
      é 2
      total 6
    tests:
      - name: report for ₹5é
        code: |
          expected = ["₹ 3", "5 1", "é 2", "total 6"]
          assert output_lines() == expected, f"Expected {expected}, but your program printed {output_lines()!r}."
      - name: uses a loop and encode
        code: |
          assert uses("For", "While"), "Loop over the characters of word."
          assert calls("encode"), "Measure each character with ch.encode('utf-8')."
      - name: works for another word
        code: |
          import ast, io, contextlib
          tree = ast.parse(source)
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "word" for t in node.targets):
                  node.value = ast.Constant("aü😀")
          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              exec(compile(ast.fix_missing_locations(tree), "<check>", "exec"), {"__name__": "__main__"})
          lines = [line.rstrip() for line in buffer.getvalue().strip().splitlines()]
          expected = ["a 1", "ü 2", "😀 4", "total 7"]
          assert lines == expected, f"With word = 'aü😀' expected {expected} but got {lines!r}. Compute sizes from each character instead of typing them."
    hints:
      - "`for ch in word:` gives one character at a time."
      - "`len(ch.encode(\"utf-8\"))` is that character's byte count. Keep a running total that starts at 0."
    feedback:
      - when: { outputContains: "total 3" }
        message: Your total counts characters, not bytes. Add each character's encoded length.
    explanation: >-
      Each character is encoded separately and measured. Summing the sizes gives the same number as
      len(word.encode("utf-8")), because UTF-8 encodes characters independently.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-rupee, m-bom-mcq, m-partner-cp1252, m-utf8-report]

cheatsheet: |
  ```python
  ord("₹"), chr(8377)              # 8377, '₹'   (code point <-> character)
  data = text.encode("utf-8")      # str -> bytes
  text = data.decode("utf-8")      # bytes -> str
  len(text), len(text.encode("utf-8"))   # code points vs bytes
  open(path, encoding="utf-8")     # ALWAYS name the encoding
  open(path, encoding="utf-8-sig") # strip a BOM (spreadsheet CSVs)
  unicodedata.normalize("NFC", s)  # compare/store equivalent text equally
  ```
  - UTF-8 sizes: ASCII 1 · é 2 · ₹ 3 · emoji 4
  - UnicodeDecodeError → wrong codec (often cp1252/Latin-1 data read as UTF-8)
  - Ã© / â‚¹ (mojibake) → UTF-8 bytes decoded as Latin-1/cp1252
