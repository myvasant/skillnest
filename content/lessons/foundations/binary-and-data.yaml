id: foundations.binary-and-data
concept: foundations.binary-and-data
title: Bits, Bytes and Data Representation
subtitle: How computers represent numbers and information
estimatedMinutes: 40
reviewedOn: 2026-11-04
summary: >-
  Learn how information is represented as bits, how binary place values work, why a byte has 256
  possible patterns, and why floating-point numbers sometimes produce surprising decimal results.
objectives:
  - Define a bit, byte and binary place value.
  - Convert small binary integers to decimal and decimal integers to binary.
  - Explain why a byte has 256 possible bit patterns.
  - Distinguish integer representation from approximate floating-point representation.
  - Recognise why text and other data need an agreed encoding or format.
sources:
  - title: "Python Tutorial — Floating-Point Arithmetic: Issues and Limitations"
    url: https://docs.python.org/3/tutorial/floatingpoint.html
    publisher: Python Software Foundation
  - title: Python Built-in Types — Numeric Types
    url: https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex
    publisher: Python Software Foundation
  - title: CS50x — Computer Science
    url: https://cs50.harvard.edu/x/
    publisher: Harvard University
    note: Introductory treatment of binary representation and data.
sections:
  - id: bits
    title: Everything is represented by patterns
    kind: intro
    blocks:
      - type: markdown
        body: |
          A computer stores and processes information using physical states that digital systems treat
          as two symbols: **0** and **1**. One binary digit is a **bit**. A bit can represent one of two
          states, such as off/on.

          A **byte** is a group of 8 bits. Each bit position can independently be 0 or 1, so eight bits
          have \(2^8 = 256\) possible patterns. If interpreted as an unsigned integer, those patterns
          represent values from 0 through 255.
      - type: code
        runnable: true
        code: |
          bits = "1011"
          value = int(bits, 2)
          print(value)
          print(2 ** 8)
        expectedOutput: |
          11
          256
        annotations:
          - line: 2
            text: The second argument `2` tells `int` to interpret the string using base two.
          - line: 3
            text: The binary pattern `1011` represents decimal eleven.
      - type: item
        ref: bit-byte-check

  - id: place-values
    title: Binary place values
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          Decimal uses powers of ten. Binary uses powers of two. Read each digit from right to left,
          multiplying it by the place value beneath it:

          | Binary position | 3 | 2 | 1 | 0 |
          |---|---:|---:|---:|---:|
          | Place value | 8 | 4 | 2 | 1 |
          | Example `1011` | 1 | 0 | 1 | 1 |
          | Contribution | 8 | 0 | 2 | 1 |

          Add the contributions: 8 + 0 + 2 + 1 = **11**. A binary digit is called a *bit*; the rightmost
          bit is the least significant bit because it contributes the smallest place value.
      - type: item
        ref: predict-binary
      - type: markdown
        body: |
          Now implement the same place-value idea yourself. Start with zero, read the bits from left to
          right, multiply the value so far by two, then add the next bit. This is the same calculation
          you do by hand when you expand a binary number into powers of two.
      - type: item
        ref: convert-binary

  - id: representation-limits
    title: Integers, floating point and precision
    kind: concept
    blocks:
      - type: markdown
        body: |
          An integer can be represented exactly within a chosen integer format's range. Real computers
          also need to represent fractions, very large magnitudes and very small values. A common approach
          is **floating-point representation**, which stores a sign, a significand (also called a
          mantissa in many explanations) and an exponent.

          Floating point has finite precision. Many decimal fractions — including 0.1 — do not have an
          exact finite binary representation. The stored value is the nearest representable value, which
          can make arithmetic results look surprising:
      - type: code
        runnable: true
        code: |
          print(0.1 + 0.2)
          print((0.1 + 0.2) == 0.3)
        expectedOutput: |
          0.30000000000000004
          False
        annotations:
          - line: 1
            text: The displayed result exposes a tiny rounding difference from the mathematical decimal sum.
          - line: 2
            text: Exact equality is not a safe general test for computed floating-point values.
      - type: callout
        variant: tip
        title: Compare with a tolerance
        body: |
          For approximate numerical results, compare the absolute difference with a tolerance chosen for
          the problem: `abs(actual - expected) < tolerance`. For money, use decimal arithmetic such as
          Python's `decimal.Decimal` when exact decimal rounding rules matter.
      - type: item
        ref: float-precision-check

  - id: formats-and-meaning
    title: Bits need an agreed interpretation
    kind: concept
    blocks:
      - type: markdown
        body: |
          A bit pattern does not explain its own meaning. The same eight bits might be interpreted as an
          unsigned number, part of a signed number, a character code, a colour channel or part of an image.
          Both sides must agree on the **format** or **encoding**.

          Text makes this especially clear: Unicode assigns code points to characters, and UTF-8 defines
          how those code points are encoded as bytes. An image format defines how bytes describe pixels,
          dimensions and compression. You will explore text encoding in the next related lesson.
      - type: item
        ref: explain-encoding

  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A bit is one binary digit; a byte is eight bits.
          - Eight bits have 256 possible patterns.
          - Binary place values are powers of two.
          - Floating-point numbers have finite precision; many decimal fractions are approximations.
          - A bit pattern needs an agreed representation to be interpreted as a number, character or image.
      - type: item
        ref: transfer-binary
items:
  - id: bit-byte-check
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: How many distinct patterns can eight independent bits represent?
    options:
      - id: a
        text: "8"
        correct: false
        feedback: Eight is the number of bit positions, not the number of patterns.
      - id: b
        text: "16"
        correct: false
        feedback: Two bits have four patterns; eight bits have many more.
      - id: c
        text: "256"
        correct: true
        feedback: Correct. Each of the eight positions has two choices, so there are 2⁸ = 256 patterns.
    explanation: "Each bit has two possible states. For eight independent bits, multiply 2 by itself eight times: 2⁸ = 256."
  - id: predict-binary
    type: predict-output
    skill: prediction
    difficulty: 1
    prompt: What does this program print?
    code: |
      print(int("1101", 2))
    answer: |
      13
    wrongAnswers:
      - answer: |
          1101
        feedback: The `int` call converts the binary text to a decimal integer; it does not print the original text.
      - answer: |
          11
        feedback: Add the place values 8 + 4 + 0 + 1. The result is 13.
    explanation: "`1101` in base two is 1×8 + 1×4 + 0×2 + 1×1 = 13."
  - id: float-precision-check
    type: true-false
    skill: explanation
    difficulty: 2
    prompt: Every decimal fraction has an exact finite representation in binary floating point.
    answer: false
    explanation: Only fractions whose reduced denominator is a power of two have an exact finite binary expansion. Values such as 0.1 are approximated.
  - id: explain-encoding
    type: explain
    skill: explanation
    difficulty: 2
    prompt: Why must a program know the encoding or format used for a sequence of bytes?
    rubric:
      - Explains that bytes alone do not specify whether they represent text, numbers, pixels or another structure.
      - Explains that the sender and receiver need to agree on the interpretation.
    modelAnswer: Bytes are just numeric patterns. The same pattern can mean different things under different formats. An agreed encoding or format tells the program how to interpret those bytes consistently.
    explanation: The data's meaning comes from the agreed representation, not from the byte pattern alone.
  - id: transfer-binary
    type: explain
    skill: transfer
    difficulty: 2
    prompt: A developer sees `0.1 + 0.2` produce `0.30000000000000004`. Explain why this is not evidence that Python's addition operator is broken, and suggest an appropriate response.
    rubric:
      - Identifies finite binary floating-point precision as the cause.
      - Suggests tolerance-based comparison or Decimal for exact decimal rules such as money.
    modelAnswer: The decimal fractions 0.1 and 0.2 are not represented exactly as finite binary floating-point values. The operation is performed on their nearest representable values. For approximate calculations, compare using a tolerance; for decimal monetary rules, use Decimal with explicit rounding.
    explanation: The result follows from the representation's precision limits. The correct response depends on whether approximation is acceptable.
  - id: convert-binary
    type: code
    skill: implementation
    difficulty: 2
    prompt: Implement `binary_to_decimal(bits)`. Accept a non-empty string containing only `0` and `1`, return its base-10 integer value, and raise ValueError for an empty string or any other character. Do not call `int(bits, 2)`.
    explanation: Read the bits from left to right. Each new bit shifts the accumulated value one binary place to the left (multiply by two), then adds the new digit.
    starterCode: |
      def binary_to_decimal(bits):
          # Convert one binary digit at a time.
          pass
    solution: |
      def binary_to_decimal(bits):
          if not bits:
              raise ValueError("bits must not be empty")
          value = 0
          for bit in bits:
              if bit not in "01":
                  raise ValueError("bits must contain only 0 and 1")
              value = value * 2 + int(bit)
          return value
    tests:
      - name: converts a binary value
        code: assert binary_to_decimal("1101") == 13
      - name: handles leading zeroes
        code: assert binary_to_decimal("00101") == 5
      - name: rejects an empty string
        code: |
          try:
              binary_to_decimal("")
          except ValueError:
              pass
          else:
              raise AssertionError("empty input should raise ValueError")
      - name: rejects invalid digits
        code: |
          try:
              binary_to_decimal("1021")
          except ValueError:
              pass
          else:
              raise AssertionError("invalid binary digits should raise ValueError")
    hints:
      - Start with `value = 0`.
      - For each bit, multiply the current value by two before adding the new digit.
      - Check that every character is either `0` or `1`; raise ValueError otherwise.
masteryCheck:
  passThreshold: 0.75
  items: [bit-byte-check, predict-binary, convert-binary, transfer-binary]
cheatsheet: |
  - 1 bit = 0 or 1.
  - 1 byte = 8 bits = 256 possible patterns.
  - Binary place values: 1, 2, 4, 8, 16, 32, ...
  - Floating point approximates many decimal fractions.
  - Use tolerance for approximate values; use Decimal for exact decimal business rules.
