id: foundations.installing-tools
concept: foundations.installing-tools
title: Installing and Managing Developer Tools
subtitle: Install safely, choose the right version and verify what your terminal runs
estimatedMinutes: 35
reviewedOn: 2026-11-04
summary: >-
  Learn how to choose trusted installation sources, use operating-system package managers, handle multiple
  tool versions and verify that the terminal can find the intended executable. Understand why a successful
  installer does not guarantee that the right version is first on PATH.
objectives:
  - Distinguish an operating-system package manager from a language package manager.
  - Choose official installers or trusted package-manager sources and verify the publisher.
  - Explain how PATH order affects which executable a shell starts.
  - Verify a tool's version and executable location in a newly opened terminal.
  - Diagnose common installation problems without repeatedly reinstalling or using administrator privileges unnecessarily.
sources:
  - title: Using Python on Windows
    url: https://docs.python.org/3/using/windows.html
    publisher: Python Software Foundation
  - title: Windows Package Manager (winget)
    url: https://learn.microsoft.com/en-us/windows/package-manager/winget/
    publisher: Microsoft Learn
  - title: Homebrew Documentation
    url: https://docs.brew.sh/
    publisher: Homebrew
  - title: Python Downloads
    url: https://www.python.org/downloads/
    publisher: Python Software Foundation
sections:
  - id: why-installation-is-a-workflow
    title: Installing a tool is more than running an installer
    kind: intro
    blocks:
      - type: markdown
        body: |
          A developer tool is another program on your computer: Python, Git, Node.js, a database client or
          an editor. Installing it usually copies files to a known location and may register that location
          so your shell can find it.

          Treat installation as a four-part workflow:

          1. **Choose a trustworthy source.** Prefer the tool's official download page or a reputable
             operating-system package manager.
          2. **Install the intended version.** Check the platform and version requirements first.
          3. **Open a new terminal.** A terminal that was already running may still have its old environment.
          4. **Verify what runs.** Check both the version and the executable location.

          An installer showing “completed” proves only that the installer finished. It does not prove that
          your terminal can find the tool, that it finds the intended copy, or that the version is suitable.
      - type: callout
        variant: analogy
        title: Installation versus finding the tool
        body: |
          Installing a tool is like putting a book on a shelf. PATH is like the catalogue that tells you
          which shelf to check when someone asks for that book. The book can exist even when the catalogue
          points somewhere else.

  - id: trusted-sources
    title: Choose a safe installation source
    kind: concept
    blocks:
      - type: markdown
        body: |
          Common free installation routes include:

          - **Official installer:** download from the project's own website and follow its documented steps.
          - **Windows:** `winget` is Microsoft's package manager for installing and updating supported
            applications from configured sources.
          - **macOS:** Homebrew installs tools from formulae maintained in its package ecosystem.
          - **Debian or Ubuntu Linux:** `apt` installs packages from configured distribution repositories.

          These tools are not interchangeable. `winget`, Homebrew and `apt` manage operating-system
          applications. A language package manager such as `pip` installs Python packages into a Python
          environment; it does not install or replace the Python interpreter itself.
      - type: code
        language: powershell
        status: illustrative
        code: |
          # Search before installing; inspect the package identity and publisher.
          winget search Python
          winget show --id Python.Python.3.14
          # Install only after confirming the package is the one you intend to use.
          winget install --id Python.Python.3.14 -e
        caption: |
          Illustrative Windows Package Manager workflow. Package IDs and available versions can change;
          search and inspect the current package details before installing.
      - type: code
        language: bash
        status: illustrative
        code: |
          # macOS with Homebrew
          brew info python
          brew install python

          # Debian or Ubuntu: inspect the package before installing
          apt show python3
          sudo apt install python3
        caption: |
          Illustrative commands. Linux distributions may provide a Python version chosen for that release.
          Do not replace the system Python just to obtain a newer development version.
      - type: callout
        variant: warning
        title: Do not run installation commands blindly
        body: |
          Check the source, publisher, package name and requested permissions. Be especially cautious with
          commands that download a script and immediately execute it, or installers that request
          administrator access without a clear reason. Never disable security software just to make an
          unfamiliar installer run.

  - id: versions-and-path
    title: Multiple versions and PATH order
    kind: concept
    blocks:
      - type: markdown
        body: |
          It is possible to have more than one copy of a tool. For example, one Python installation may
          come from the official installer and another from a package manager. A project may intentionally
          use a different version from the one used by another project.

          The shell searches directories listed in the **[PATH environment variable](concept:foundations.environment-variables)**
          when you type a command. Search order matters: the first matching executable is normally the one
          that runs. Installing another copy does not automatically make it the default.

          A few useful distinctions:

          - **Version:** which release of the tool is running.
          - **Executable location:** which file the shell found.
          - **Package environment:** which libraries or plugins are available to that executable.
          - **Shell environment:** the PATH and other settings inherited when the terminal started.

          These are separate questions. A correct version number does not prove that a project is using the
          intended virtual environment, and a command that works in one terminal may fail in another.
      - type: code
        language: powershell
        status: illustrative
        code: |
          Get-Command python -All
          where.exe python
          python --version
          python -c "import sys; print(sys.executable)"
        caption: |
          Read-only PowerShell checks. `Get-Command` and `where.exe` show command candidates; the Python
          command reports the version and executable path of the interpreter that actually starts.
      - type: code
        language: bash
        status: illustrative
        code: |
          type -a python3
          command -v python3
          python3 --version
          python3 -c 'import sys; print(sys.executable)'
        caption: |
          Read-only checks for bash-like shells. `type -a` can reveal more than one matching command.

  - id: verify-after-install
    title: Verify from a new terminal
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          After installing a tool, close the terminal window and open a new one. Then verify it in this order:

          1. Ask the shell which command it will run.
          2. Ask the tool for its version.
          3. If the tool has a runtime or interpreter, ask it for its executable location.
          4. Compare the results with the version and location your project expects.

          For Python, the checks are commonly `python --version` and
          `python -c "import sys; print(sys.executable)"`. On Windows, `py --version` may also be available
          when the Python launcher or install manager is configured. The exact launcher commands depend on
          the Python distribution you installed; consult its current official documentation.
      - type: code
        language: python
        runnable: true
        code: |
          import sys

          print(sys.version_info.major >= 3)
        expectedOutput: |
          True
        annotations:
          - line: 1
            text: "`sys` provides information about the Python interpreter that is currently running this code."
          - line: 3
            text: This simple check verifies that the interpreter reports a Python 3 major version; real projects should check the exact supported version they require.
      - type: item
        ref: verify-installation-mcq

  - id: troubleshoot-installation
    title: Diagnose an installation that does not work
    kind: debugging
    blocks:
      - type: markdown
        body: |
          Use the symptom to choose the next check rather than repeating the installation:

          | Symptom | First check |
          |---|---|
          | `command not found` or “not recognized” | Is the executable's folder on PATH? Is the terminal new? |
          | An unexpected version runs | Which matching executable appears first on PATH? |
          | It works in one terminal but not another | Are the shells using different PATH values or profiles? |
          | Permission denied | Is the installation location writable by this user? Is the command actually executable? |
          | A Python package cannot be imported | Which interpreter and package environment are active? |

          Avoid these common “fixes”:

          - Reinstalling repeatedly without checking command resolution.
          - Adding several duplicate folders to PATH without knowing their order.
          - Running every terminal as Administrator or root.
          - Using `sudo pip install` to modify the operating system's Python environment.
          - Deleting a system-managed Python installation because a project needs another version.
      - type: callout
        variant: tip
        title: Change one thing, then verify
        body: |
          Record the current command location and version before changing PATH or reinstalling. Make one
          change, open a new terminal and run the same checks again. This makes it clear which change helped.
      - type: item
        ref: path-reinstall-tf

  - id: summary
    title: Summary and mastery check
    kind: summary
    blocks:
      - type: markdown
        body: |
          - Prefer official installers and trusted package managers.
          - An operating-system package manager and a language package manager solve different problems.
          - Multiple versions can coexist; PATH order influences which executable the shell finds.
          - Verify both the version and executable location in a new terminal.
          - Diagnose command resolution before reinstalling or requesting administrator access.
      - type: item
        ref: install-order-debug
items:
  - id: verify-installation-mcq
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: |
      Python is installed, but PowerShell runs an older version than the one you expected. Which check is
      most useful first?
    explanation: |
      Inspect all matching commands and their order. The shell may find an older installation earlier on
      PATH, so installing again is not the first useful diagnostic step.
    options:
      - id: a
        text: Run the installer again immediately.
        feedback: Reinstalling does not reveal which executable PowerShell currently finds.
      - id: b
        text: Use `Get-Command python -All` and inspect the matching locations.
        correct: true
        feedback: Correct. It shows the commands PowerShell can resolve and helps identify PATH precedence.
      - id: c
        text: Run PowerShell as Administrator for every command.
        feedback: Elevation does not select the intended version and increases risk.
      - id: d
        text: Delete every other Python installation.
        feedback: Multiple versions can coexist intentionally; first identify which one the project needs.

  - id: path-reinstall-tf
    type: true-false
    skill: explanation
    difficulty: 1
    prompt: Installing the same tool a second time is a reliable way to fix a command that is missing from PATH.
    answer: false
    explanation: |
      Installation and command lookup are different. If the executable exists but its folder is not on
      PATH, another installation may leave the same lookup problem or create another competing version.

  - id: install-order-debug
    type: debug
    skill: debugging
    difficulty: 1
    prompt: |
      Put these verification steps in a safe order after installing a developer tool. The goal is to identify
      the command the shell will run before trusting its version output.

      Expected output:

      ```text
      Open a new terminal
      Check which executable the shell finds
      Check the tool version
      Compare with the project requirement
      ```
    starterCode: |
      print("Check the tool version")
      print("Open a new terminal")
      print("Compare with the project requirement")
      print("Check which executable the shell finds")
    solution: |
      print("Open a new terminal")
      print("Check which executable the shell finds")
      print("Check the tool version")
      print("Compare with the project requirement")
    expectedOutput: |
      Open a new terminal
      Check which executable the shell finds
      Check the tool version
      Compare with the project requirement
    tests:
      - name: verifies the executable before relying on its version
        code: |
          expected = [
              "Open a new terminal",
              "Check which executable the shell finds",
              "Check the tool version",
              "Compare with the project requirement",
          ]
          assert output_lines() == expected, f"Expected the verification sequence, got {output_lines()!r}."
    hints:
      - An already-open terminal may have an old PATH value.
      - Identify the executable first; then ask that executable for its version.
      - Compare the result with what the project actually requires.
    explanation: |
      The new terminal receives the updated environment. The shell's command resolution identifies the
      executable, its version command reports which release it is, and the project requirement determines
      whether that release is suitable.

masteryCheck:
  passThreshold: 0.8
  items: [verify-installation-mcq, path-reinstall-tf, install-order-debug]
cheatsheet: |
  - Use official download pages or trusted OS package managers.
  - `pip` installs Python packages; it does not install the Python interpreter.
  - PATH is searched in order; the first matching executable normally wins.
  - Open a new terminal after changing PATH.
  - Check command location and version before reinstalling.
