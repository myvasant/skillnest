id: foundations.editors-and-ides
concept: foundations.editors-and-ides
title: Code Editors and IDEs
subtitle: Turn an ordinary text file into a productive development workspace
estimatedMinutes: 35
reviewedOn: 2026-11-04
summary: >-
  Learn what a code editor and an integrated development environment provide, how syntax highlighting,
  language tools and debugging fit together, and why opening a project folder and selecting the intended
  Python interpreter matter. Build a small, repeatable workflow using free tools.
objectives:
  - Distinguish a plain text editor, a code editor and an integrated development environment.
  - Explain the roles of syntax highlighting, language servers, linters, formatters and debuggers.
  - Open a project as a workspace and identify its files and folders.
  - Select and verify the interpreter used by the editor rather than assuming it matches the terminal.
  - Use breakpoints and step controls to inspect a program instead of guessing.
  - Evaluate editor extensions as software that must come from trusted publishers.
sources:
  - title: Python in Visual Studio Code
    url: https://code.visualstudio.com/docs/python/python-tutorial
    publisher: Microsoft
  - title: Debugging in Visual Studio Code
    url: https://code.visualstudio.com/docs/debugtest/debugging
    publisher: Microsoft
  - title: Python IDLE documentation
    url: https://docs.python.org/3/library/idle.html
    publisher: Python Software Foundation
sections:
  - id: why-use-a-code-editor
    title: Why use a code editor?
    kind: intro
    blocks:
      - type: markdown
        body: |
          Python source code is text, so you can write it in a basic text editor. A development-focused
          editor adds tools that help you read, navigate, run and debug that text.

          A **code editor** is a text editor designed for programming. An **integrated development
          environment (IDE)** combines an editor with additional tools such as a run configuration,
          debugger and project navigation. The boundary is not strict: modern editors can gain IDE-like
          features through extensions.

          Free starting points include:

          - **IDLE**, which is included with many standard Python installations and is enough for small
            beginner programs.
          - **Visual Studio Code**, a free editor with Python support available through extensions.
          - Other editors can work too; the important ideas are selecting the right interpreter, opening the
            project folder, and learning how to run and debug a file.
      - type: callout
        variant: note
        title: The editor does not replace Python
        body: |
          The editor helps you write and inspect code. A Python interpreter still executes the program. If
          the editor is configured to use a different interpreter from your terminal, the same file may run
          with different package versions or behave differently.

  - id: editor-features
    title: Understand the tools inside an editor
    kind: concept
    blocks:
      - type: markdown
        body: |
          These features solve different problems:

          | Feature | What it does | What it does not guarantee |
          |---|---|---|
          | Syntax highlighting | Colours language elements to make structure easier to see. | That the code is correct. |
          | Autocomplete | Suggests names and possible completions. | That a suggestion is appropriate. |
          | Language server | Understands language structure for navigation, completion and diagnostics. | That every diagnostic is a runtime error. |
          | Linter | Reports likely mistakes or style problems. | That the program's behaviour is correct. |
          | Formatter | Rewrites code into a consistent layout. | That the logic is correct. |
          | Debugger | Runs code under inspection and lets you pause and examine state. | That it automatically finds the bug. |

          A language server is a helper program that analyses code for the editor. A linter checks code for
          suspicious patterns. A formatter changes layout. A debugger helps you observe execution. These
          tools complement one another; they are not interchangeable.
      - type: code
        language: python
        runnable: true
        code: |
          print("Start")
          print(2 + 3)
          print("Finish")
        expectedOutput: |
          Start
          5
          Finish
        annotations:
          - line: 1
            text: A breakpoint on this line pauses execution before the message is printed.
          - line: 2
            text: Step over this line to see the calculation and output.
          - line: 3
            text: Continue execution to reach the final statement.
      - type: item
        ref: editor-output-predict

  - id: open-a-workspace
    title: Open the project folder, not only one file
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          A **workspace** is the project context the editor opens. For a small Python project, it normally
          means opening the top-level project folder rather than opening one `.py` file by itself.

          A folder workspace lets the editor show related files, recognise project configuration, search
          across the project and run commands from a known location. It also makes relative paths and
          terminal behaviour easier to understand.

          A practical first setup in Visual Studio Code:

          1. Install VS Code from its official website.
          2. Open the project folder with **File → Open Folder**.
          3. Install the official Python extension from Microsoft if Python support is needed.
          4. Open a `.py` file and select the interpreter for the project.
          5. Open the integrated terminal and check its current directory.
          6. Run a tiny program before adding more extensions or configuration.

          The exact menu labels can change between releases. If a command is missing, use the editor's
          command palette or current official documentation rather than assuming a tutorial screenshot is
          still accurate.
      - type: code
        language: text
        status: illustrative
        code: |
          ai-course/
          ├── README.md
          ├── .venv/
          ├── src/
          │   └── main.py
          └── tests/
              └── test_main.py
        caption: |
          Example project tree. The editor should open `ai-course/` as the workspace so it can see the
          source, tests and project-level configuration together.
      - type: callout
        variant: warning
        title: Check the selected interpreter
        body: |
          The integrated terminal and the editor's Run or Debug button can use different interpreters.
          Check the selected interpreter and its path before concluding that a package is missing. Do not
          install the same package into several Python installations just to make an editor warning vanish.

  - id: debugger-basics
    title: Use a debugger instead of guessing
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **breakpoint** is a marker that tells the debugger to pause when execution reaches a chosen line.
          Once paused, you can inspect variables and the call stack, then control how execution continues.

          Common controls:

          - **Continue:** run until the next breakpoint or program end.
          - **Step over:** execute the current line without entering a called function.
          - **Step into:** enter the function called on the current line.
          - **Step out:** finish the current function and return to its caller.
          - **Call stack:** show the chain of active function calls.
          - **Variables panel:** inspect values currently available in the paused frame.

          A useful debugging loop is: reproduce the problem, place a breakpoint near it, inspect the values,
          step through the relevant lines, form a hypothesis, change one thing and run the test again.
      - type: callout
        variant: analogy
        title: A debugger is a pause-and-inspect control
        body: |
          Watching a program run normally is like watching a film. A debugger lets you pause at a frame,
          inspect what is on screen and move one step at a time. It does not tell you which frame is wrong;
          you still need a hypothesis and evidence.
      - type: item
        ref: debugger-explain

  - id: extension-safety
    title: Keep the development environment trustworthy
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          Editor extensions can read files, run programs and communicate over the network. Treat them as
          software, not harmless decorations.

          - Prefer extensions from the official publisher and verify the publisher name.
          - Install only what you need; many extensions increase startup time and create more update work.
          - Review permissions and release notes when an extension requests new capabilities.
          - Keep the editor and extensions updated from their trusted distribution channels.
          - Never paste secrets into editor settings, snippets or source files merely to make a tool work.

          If syntax highlighting works but autocomplete does not, the file may still be valid Python. Check
          that the language extension and interpreter are configured before reinstalling the editor.
      - type: item
        ref: editor-setup-debug

  - id: summary
    title: Summary and mastery check
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A code editor improves the experience of writing and understanding source files; the interpreter executes them.
          - Language servers, linters, formatters and debuggers solve different problems.
          - Open the project folder as a workspace and select the interpreter the project should use.
          - Use breakpoints, stepping and variable inspection to investigate behaviour.
          - Treat extensions as software from publishers you trust.
      - type: item
        ref: editor-setup-debug
items:
  - id: editor-output-predict
    type: predict-output
    skill: prediction
    difficulty: 1
    prompt: What three lines does this program print?
    code: |
      print("Start")
      print(2 + 3)
      print("Finish")
    answer: |
      Start
      5
      Finish
    explanation: |
      The statements run from top to bottom. The second line calculates 2 + 3 before printing the result.

  - id: debugger-explain
    type: explain
    skill: explanation
    difficulty: 2
    prompt: |
      Your program prints the wrong total. Explain how a breakpoint and stepping through the code could
      help you find the first line where the value becomes incorrect.
    rubric:
      - Places a breakpoint before or near the calculation that produces the wrong total.
      - Inspects the relevant values while the program is paused.
      - Steps through the statements and compares actual values with expected values.
    modelAnswer: |
      I would reproduce the problem and place a breakpoint before the total is calculated. When execution
      pauses, I would inspect the input values, step over the calculation and inspect the result. I would
      continue one line at a time until I find where the actual value first differs from the expected value.
    explanation: |
      A debugger exposes the program's state at specific execution points. The learner still has to decide
      which values to inspect and what result should have occurred.

  - id: editor-setup-debug
    type: debug
    skill: debugging
    difficulty: 1
    prompt: |
      This tiny program has two errors. Run it, read the first error, fix that problem, then run it again
      and fix the second problem. It should print both lines in order.

      Expected output:

      ```text
      Open the project folder
      Select the Python interpreter
      ```
    starterCode: |
      Print("Open the project folder")
      print("Select the Python interpreter"
    solution: |
      print("Open the project folder")
      print("Select the Python interpreter")
    expectedOutput: |
      Open the project folder
      Select the Python interpreter
    tests:
      - name: prints both setup steps
        code: |
          expected = ["Open the project folder", "Select the Python interpreter"]
          assert output_lines() == expected, f"Expected {expected!r}, got {output_lines()!r}."
    hints:
      - The first error is a syntax error. Check the closing parenthesis on line 2.
      - After the syntax error is fixed, Python reports a name error on line 1. Python names are case-sensitive.
    feedback:
      - when: { errorType: SyntaxError }
        message: Python cannot parse the file yet. Close the parenthesis on the second line first.
      - when: { errorType: NameError }
        message: The file now parses, but `Print` is not the built-in `print` function. Use the lowercase name.
    explanation: |
      Python compiles the whole file before running it, so the missing parenthesis is reported first. Once
      the syntax is fixed, execution reaches `Print`, which raises NameError because Python is case-sensitive.

masteryCheck:
  passThreshold: 0.8
  items: [editor-output-predict, debugger-explain, editor-setup-debug]
cheatsheet: |
  - Editor = write and inspect code; interpreter = execute Python code.
  - Language server = code intelligence; linter = suspicious patterns; formatter = consistent layout.
  - Debugger = pause, inspect values and step through execution.
  - Open the project folder and select the intended interpreter.
  - Trust extensions only after checking the publisher and permissions.
