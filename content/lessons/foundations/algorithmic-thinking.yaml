id: foundations.algorithmic-thinking
concept: foundations.algorithmic-thinking
title: Algorithmic Thinking
subtitle: Turn a vague problem into precise steps a computer can follow
estimatedMinutes: 45
reviewedOn: 2026-11-04
summary: >-
  Learn to define a problem's inputs and outputs, break it into smaller steps, write an algorithm before
  coding, dry-run it with a table, and test normal and edge cases. Practise designing a simple algorithm
  and translating it into Python only after the reasoning is clear.
objectives:
  - Define an algorithm as a finite, precise sequence of steps for solving a problem.
  - Identify inputs, outputs, constraints and edge cases before writing code.
  - Decompose a larger task into smaller steps with clear responsibilities.
  - Write pseudocode and dry-run it with sample values.
  - Use a simple loop invariant to explain what a running variable means.
  - Translate an algorithm into Python and test it against examples and edge cases.
sources:
  - title: CS50x — Introduction to Computer Science
    url: https://cs50.harvard.edu/x/
    publisher: Harvard University
  - title: Python Tutorial — More Control Flow Tools
    url: https://docs.python.org/3/tutorial/controlflow.html
    publisher: Python Software Foundation
  - title: OpenDSA — Algorithm Analysis and Design
    url: https://opendsa-server.cs.vt.edu/ODSA/Books/Everything/html/
    publisher: Virginia Tech and collaborators
sections:
  - id: why
    title: Why plan before coding?
    kind: why
    blocks:
      - type: markdown
        body: |
          Suppose someone asks you to calculate the average score in a list. You could start typing Python
          immediately, but several questions are still unanswered: What if the list is empty? Should the
          result be rounded? Are scores always numbers? Should the original list change?

          **Algorithmic thinking** means turning a problem into a sequence of precise steps before choosing
          the code that expresses them. It reduces guessing and makes it easier to check whether a solution
          is correct.
      - type: callout
        variant: analogy
        title: A recipe is a small algorithm
        body: |
          A recipe has inputs, ordered actions and an intended result. A computer algorithm is similar, but
          its instructions must be precise enough that a machine can follow them without interpreting your
          intention. An algorithm also needs to terminate for the inputs it claims to support.

  - id: define-problem
    title: Define inputs, outputs and constraints
    kind: concept
    blocks:
      - type: markdown
        body: |
          Before choosing steps, write down:

          1. **Inputs:** what information is provided?
          2. **Output:** what exact result must be produced?
          3. **Rules:** what operations are allowed or required?
          4. **Constraints:** how large can the input be, and what types are valid?
          5. **Edge cases:** what happens with no values, one value, duplicates or invalid input?

          For a maximum-finding problem, a clear contract could be: input is a list of numbers; output is
          the largest number; an empty list returns `None`; the input list is not modified. A precise
          contract makes the solution testable.
      - type: item
        ref: problem-contract-check

  - id: decompose
    title: Break the task into steps
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          To find the largest number in a non-empty list, use these steps:

          1. Start by treating the first number as the largest seen so far.
          2. Visit each remaining number once.
          3. If the current number is larger, replace the remembered largest value.
          4. Return the remembered value.

          Pseudocode expresses the logic without committing to a programming language:
      - type: code
        language: text
        status: illustrative
        code: |
          IF the list is empty:
              RETURN None
          largest = first item
          FOR each remaining item:
              IF item > largest:
                  largest = item
          RETURN largest
        caption: Pseudocode is a planning aid, not Python syntax. It makes the algorithm visible before language details are added.
      - type: visualization
        component: step-diagram
        title: Track the largest value seen so far
        caption: Each new number is compared with the current best candidate.
        props:
          nodes:
            - { id: input, label: Input list, x: 10, y: 35, detail: "Example values: 4, 9, 2, 7." }
            - { id: compare, label: Compare, x: 42, y: 35, detail: Compare the next value with largest. }
            - { id: update, label: Update candidate, x: 72, y: 35, detail: Replace largest only when a bigger value appears. }
            - { id: result, label: Return result, x: 92, y: 82, detail: Return the largest value found. }
          edges:
            - { id: e1, from: input, to: compare, label: next item }
            - { id: e2, from: compare, to: update, label: if bigger }
            - { id: e3, from: update, to: compare, label: continue }
            - { id: e4, from: compare, to: result, label: after final item }
          steps:
            - title: Start with 4
              body: "The first item becomes the initial candidate: largest = 4."
              active: [input]
              payload: "largest = 4"
            - title: Compare 9
              body: Nine is greater than four, so update the candidate to nine.
              active: [input, compare, update, e1, e2]
              payload: "largest = 9"
            - title: Compare 2 and 7
              body: Neither two nor seven is greater than nine, so the candidate stays nine.
              active: [compare, e3]
              payload: "largest = 9"
            - title: Return
              body: All items have been checked. Return nine.
              active: [compare, result, e4]
              payload: "return 9"
      - type: item
        ref: largest-prediction

  - id: dry-run
    title: Dry-run the algorithm
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **dry run** means tracing the steps by hand with a small input. Record the important variables
          after each step. For `[4, 9, 2, 7]`:

          | Current item | largest before | Comparison | largest after |
          |---:|---:|---|---:|
          | 9 | 4 | 9 > 4 | 9 |
          | 2 | 9 | 2 > 9 is false | 9 |
          | 7 | 9 | 7 > 9 is false | 9 |

          A **loop invariant** is a statement that should remain true at a particular point in every loop
          iteration. Here it is: after processing the first *k* values, `largest` equals the largest of
          those *k* values. The invariant explains why returning `largest` after the final iteration is
          correct.
      - type: code
        runnable: true
        code: |
          numbers = [4, 9, 2, 7]
          largest = numbers[0]
          for number in numbers[1:]:
              if number > largest:
                  largest = number
              print("checked:", number, "largest:", largest)
          print("answer:", largest)
        expectedOutput: |
          checked: 9 largest: 9
          checked: 2 largest: 9
          checked: 7 largest: 9
          answer: 9
        annotations:
          - line: 2
            text: The first item is a valid starting candidate because the list is non-empty.
          - line: 3
            text: Only the remaining values need to be compared.
          - line: 5
            text: The candidate changes only when the new value is larger.
      - type: item
        ref: explain-invariant

  - id: implementation
    title: Translate the plan into Python
    kind: practice
    blocks:
      - type: markdown
        body: |
          Now that the input contract and steps are clear, the Python implementation is short. Notice how
          the empty-list case is handled before indexing the first item.
      - type: code
        runnable: true
        code: |
          def find_largest(numbers):
              if not numbers:
                  return None
              largest = numbers[0]
              for number in numbers[1:]:
                  if number > largest:
                      largest = number
              return largest

          print(find_largest([4, 9, 2, 7]))
          print(find_largest([]))
        expectedOutput: |
          9
          None
        annotations:
          - line: 2
            text: The empty case follows the stated contract and avoids an IndexError.
          - line: 4
            text: The first value is the initial candidate.
          - line: 5
            text: Each remaining value is visited once.
          - line: 8
            text: Return the best candidate after the loop ends.
      - type: item
        ref: largest-exercise

  - id: summary
    title: Summary and mastery check
    kind: summary
    blocks:
      - type: markdown
        body: |
          - State the inputs, output, constraints and edge cases before coding.
          - Decompose the task into small, precise steps.
          - Use pseudocode to plan and a dry run to check the logic.
          - A loop invariant explains what a running variable means after each iteration.
          - Translate the checked algorithm into code and test edge cases.
      - type: item
        ref: mastery-algorithm
      - type: item
        ref: mastery-algorithm-code
      - type: item
        ref: mastery-algorithm-explain

items:
  - id: problem-contract-check
    type: mcq
    skill: design
    difficulty: 1
    prompt: Before implementing a function that finds the largest value, which question should be answered in its input/output contract?
    options:
      - id: a
        text: What should happen when the input list is empty?
        correct: true
        feedback: Correct. Empty input is an edge case that affects the function's behaviour and tests.
      - id: b
        text: Which variable name uses the fewest letters?
        correct: false
        feedback: Naming matters, but it does not define the required behaviour.
      - id: c
        text: Which editor theme should be selected?
        correct: false
        feedback: Editor appearance does not define the algorithm's contract.
    explanation: A contract defines valid inputs, outputs and behaviour for edge cases.
  - id: largest-prediction
    type: predict-output
    skill: prediction
    difficulty: 1
    prompt: What does the trace print?
    code: |
      largest = 5
      for number in [3, 8, 2]:
          if number > largest:
              largest = number
      print(largest)
    answer: "8"
    explanation: The candidate changes from five to eight; two is not larger.
  - id: explain-invariant
    type: explain
    skill: explanation
    difficulty: 2
    prompt: In the largest-value algorithm, what does `largest` mean after the loop has processed the first k values?
    rubric:
      - States that largest is the maximum among the values processed so far.
      - Connects this property to why the final value is the maximum of the whole list.
    modelAnswer: After processing the first k values, `largest` equals the maximum of those k values. Once every value has been processed, it is therefore the maximum of the complete list.
    explanation: The invariant is the reason the repeated comparison produces the correct result.
  - id: largest-exercise
    type: code
    skill: implementation
    difficulty: 2
    prompt: "Implement `find_smallest(numbers)` with the same contract: return the smallest number, or None for an empty list. Do not modify the input."
    explanation: >-
      The algorithm keeps the smallest value seen so far. It begins with the first item, compares each remaining item and updates the candidate only when a smaller value is found. An empty list has no smallest item, so the function returns None.
    starterCode: |
      def find_smallest(numbers):
          pass
    solution: |
      def find_smallest(numbers):
          if not numbers:
              return None
          smallest = numbers[0]
          for number in numbers[1:]:
              if number < smallest:
                  smallest = number
          return smallest
    tests:
      - name: mixed positive values
        code: assert find_smallest([4, 9, 2, 7]) == 2
      - name: negative values
        code: assert find_smallest([-3, 5, -8]) == -8
      - name: empty list
        code: assert find_smallest([]) is None
      - name: does not mutate input
        code: |
          values = [3, 1, 2]
          find_smallest(values)
          assert values == [3, 1, 2]
    hints:
      - Start with the first value as the current smallest.
      - Replace it only when a smaller value is found.
      - Handle the empty list before reading index zero.
  - id: mastery-algorithm
    type: mcq
    skill: recognition
    difficulty: 1
    prompt: What is the purpose of a dry run?
    options:
      - id: a
        text: To trace the algorithm with sample values and check each step.
        correct: true
        feedback: Correct. A dry run makes the state changes visible before or alongside implementation.
      - id: b
        text: To install the programming language.
        correct: false
        feedback: Installation is unrelated to tracing an algorithm.
      - id: c
        text: To guarantee the program has no bugs for every possible input.
        correct: false
        feedback: A dry run checks selected examples; it is not a proof for every possible input.
    explanation: A dry run helps expose incorrect reasoning by tracking the values and decisions made at each step.
  - id: mastery-algorithm-code
    type: code
    skill: implementation
    difficulty: 2
    prompt: Implement `count_matches(values, target)` to return how many values equal target. Return zero for an empty list.
    explanation: >-
      The function checks each number against the current candidate and replaces the candidate only when it finds a smaller value. The empty-list case is handled explicitly because there is no first item to use as a starting candidate.
    starterCode: |
      def count_matches(values, target):
          pass
    solution: |
      def count_matches(values, target):
          count = 0
          for value in values:
              if value == target:
                  count += 1
          return count
    tests:
      - name: counts repeated matches
        code: assert count_matches([1, 2, 1, 3, 1], 1) == 3
      - name: no matches
        code: assert count_matches([2, 3], 9) == 0
      - name: empty input
        code: assert count_matches([], 1) == 0
    hints:
      - Start the counter at zero.
      - Visit each value and increase the counter only when it equals the target.
  - id: mastery-algorithm-explain
    type: explain
    skill: transfer
    difficulty: 2
    prompt: A developer writes code before deciding what should happen for an empty list. What risk does this create, and how does an input/output contract help?
    rubric:
      - Identifies that an undefined edge case can lead to accidental or inconsistent behaviour.
      - Explains that a contract makes expected behaviour explicit and testable.
    modelAnswer: Without a defined empty-list rule, the code may raise an unexpected error or return an arbitrary value. A contract states the required behaviour before implementation, so the developer can handle the case deliberately and write a test for it.
    explanation: Clear contracts reduce ambiguity and make correctness testable.
masteryCheck:
  passThreshold: 0.8
  items: [mastery-algorithm, mastery-algorithm-code, mastery-algorithm-explain]
cheatsheet: |
  Define inputs, outputs, rules, constraints and edge cases. Break the task into precise steps.
  Use pseudocode to plan, a dry run to trace, and an invariant to explain why the loop is correct.
  Implement only after the logic is clear; test normal, boundary and invalid inputs.
