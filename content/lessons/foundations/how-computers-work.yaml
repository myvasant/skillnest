id: foundations.how-computers-work
concept: foundations.how-computers-work
title: How Computers Work
subtitle: The CPU, memory, storage and input/output
estimatedMinutes: 35
reviewedOn: 2026-11-04
summary: >-
  Build a practical mental model of a computer: the CPU executes instructions, RAM holds the data
  currently in use, storage keeps data for later, and input/output devices move information in and out.
  These ideas explain many everyday performance and troubleshooting problems.
objectives:
  - Describe the basic roles of the CPU, RAM, persistent storage and input/output devices.
  - Explain the fetch-decode-execute cycle at a beginner-friendly level.
  - Distinguish running program state in memory from files saved on storage.
  - Predict why CPU, memory, storage and network bottlenecks feel different.
  - Use the model to reason about a simple computer-performance problem.
sources:
  - title: CS50x — Computer Science
    url: https://cs50.harvard.edu/x/
    publisher: Harvard University
    note: Introductory computer science course covering representation, hardware and computation.
  - title: Operating System Concepts — course materials
    url: https://www.os-book.com/OS10/slide-dir/
    publisher: Silberschatz, Galvin and Gagne
    note: Background on processes, memory and operating-system resource management.
sections:
  - id: mental-model
    title: A computer is a system of cooperating parts
    kind: intro
    blocks:
      - type: markdown
        body: |
          A computer does not understand an entire application as one magical thing. It is a collection of
          hardware parts that cooperate to move, store and transform information.

          Start with four jobs:

          - **CPU (central processing unit):** carries out instructions and calculations.
          - **RAM (random-access memory):** holds the instructions and data that active programs are using.
          - **Storage:** keeps files and installed programs even when the computer is switched off.
          - **Input/output (I/O):** moves information between the computer and the outside world — for
            example, a keyboard, display, disk or network connection.

          The operating system coordinates access to these resources. You will study it in a later lesson.
      - type: callout
        variant: analogy
        title: A small workshop
        body: |
          Imagine a workshop. The CPU is the worker doing the task, RAM is the workbench holding the tools
          and materials currently needed, storage is the filing cabinet, and I/O is the door through which
          materials and finished work enter or leave. A huge filing cabinet does not make the worker faster
          if the workbench is too small or the worker is busy.
      - type: markdown
        body: |
          This is a simplified model. Modern computers have caches, multiple CPU cores, virtual memory,
          accelerators and many layers of storage. The four-part model is still useful for first diagnosis.

  - id: cpu
    title: The CPU executes instructions
    kind: concept
    blocks:
      - type: markdown
        body: |
          The **CPU** is the processor that executes machine instructions. At a high level, it repeatedly:

          1. **Fetches** the next instruction from memory.
          2. **Decodes** what that instruction means.
          3. **Executes** the operation — perhaps adding numbers, comparing values or moving data.
          4. Moves to the next instruction, unless the current instruction changes the flow.

          This is commonly called the *fetch-decode-execute cycle*. Real processors overlap and optimise
          work using pipelines, caches and prediction, so the cycle is a teaching model rather than a
          literal description of every transistor-level event.
      - type: code
        language: text
        status: illustrative
        code: |
          instruction 1: load the value 4
          instruction 2: add the value 3
          instruction 3: store the result
        caption: >-
          Conceptual instructions, not real CPU machine code. A processor performs simple operations like
          these as part of executing a program.
      - type: item
        ref: cpu-cycle-check

  - id: memory-storage
    title: RAM is working space; storage is persistent
    kind: concept
    blocks:
      - type: markdown
        body: |
          **RAM** is fast working memory used while programs run. It is normally volatile: when power is
          removed, its contents are not retained. A running program's current variables, temporary results
          and active data structures occupy memory.

          **Persistent storage**, such as an SSD or hard disk, keeps files when the computer is off. It is
          used for your source code, documents, installed applications and saved data. Storage is generally
          slower to access than RAM, but it retains information without power.

          Consider editing `report.py`:

          - The file on the SSD is the saved version.
          - The editor may hold unsaved changes in RAM.
          - When Python runs the file, the operating system loads the program and its working data into
            memory as needed.
          - Saving writes the edited file back to persistent storage.
      - type: callout
        variant: misconception
        title: More disk space does not mean more RAM
        body: |
          A laptop with a 2 TB SSD and 4 GB RAM still has only 4 GB of physical RAM. A large drive gives you
          room to keep files; it does not automatically give running programs more fast working memory.
          Operating systems can use storage to support virtual memory, but that is not equivalent to RAM
          performance.
      - type: item
        ref: ram-storage-check

  - id: io-and-bottlenecks
    title: Input/output and performance bottlenecks
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          **Input/output** is any transfer between a program and something outside its immediate CPU
          calculations. Reading a file, displaying pixels, receiving keyboard input and downloading data
          are all I/O operations.

          A *bottleneck* is the part of a system that limits the overall rate of work. The symptom gives a
          clue, but not proof, about the bottleneck:

          | Symptom | Possible limiting resource | What to investigate |
          |---|---|---|
          | A calculation-heavy task keeps CPU usage high | CPU | Algorithm, parallel work, processor speed |
          | Many applications slow down when memory is full | RAM | Memory use, leaks, data size |
          | Opening a huge file takes a long time | Storage or I/O | Disk speed, file size, access pattern |
          | A web request waits on a remote service | Network or remote service | DNS, latency, bandwidth, server health |

          These are clues, not automatic diagnoses. Measure before changing hardware or rewriting code.
      - type: code
        runnable: true
        code: |
          # A small CPU-bound calculation: it repeatedly performs arithmetic.
          total = 0
          for number in range(100_000):
              total += number
          print(total)
        expectedOutput: |
          4999950000
        annotations:
          - line: 2
            text: The variable `total` holds the running result in the program's working memory.
          - line: 3
            text: The loop repeatedly asks the CPU to perform integer addition and loop-control work.
      - type: item
        ref: diagnose-bottleneck

  - id: summary
    title: Summary and practical checks
    kind: summary
    blocks:
      - type: markdown
        body: |
          - The **CPU** executes instructions.
          - **RAM** holds working data for active programs and is normally volatile.
          - **Storage** keeps files and programs when power is off.
          - **I/O** moves data between a program and devices or other systems.
          - A **bottleneck** limits the whole task; identify it with evidence rather than guessing.

          When a computer feels slow, ask: Is it calculating, short of memory, waiting for storage, or
          waiting for the network? The answer determines what to measure next.
      - type: item
        ref: explain-resource-roles
items:
  - id: cpu-cycle-check
    type: mcq
    skill: explanation
    difficulty: 1
    prompt: Which sequence best describes the simplified CPU instruction cycle?
    options:
      - id: a
        text: Fetch, decode, execute
        correct: true
        feedback: Correct. The processor obtains an instruction, interprets it and performs the operation.
      - id: b
        text: Save, print, download
        correct: false
        feedback: Those are possible application actions, not the basic instruction cycle.
      - id: c
        text: Compile, install, uninstall
        correct: false
        feedback: These are software lifecycle activities, not CPU instruction steps.
    explanation: The simplified model is fetch, decode and execute. Modern CPUs optimise and overlap these stages.
  - id: ram-storage-check
    type: true-false
    skill: recognition
    difficulty: 1
    prompt: A file saved on an SSD normally remains there after the computer is switched off.
    answer: true
    explanation: Persistent storage retains saved data without power. RAM normally does not.
  - id: diagnose-bottleneck
    type: explain
    skill: transfer
    difficulty: 2
    prompt: A program spends most of its time waiting for responses from a remote API while CPU usage stays low. Name a likely bottleneck and one measurement you would collect before changing the code.
    rubric:
      - Identifies network latency or the remote service as a likely waiting bottleneck.
      - Suggests measuring request duration, connection timing, or server response timing.
    modelAnswer: The program may be network-bound or waiting on the remote service. I would record request duration and, where possible, separate connection/DNS time from time-to-first-byte and total response time before changing the algorithm.
    explanation: Low CPU usage while waiting suggests the processor is not the limiting resource. Timing measurements help separate network and server delays.
  - id: memory-budget-code
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      A computer has 8 GiB of RAM. Other running applications currently use 5 GiB, and a new program
      needs 2 GiB. Calculate how much RAM is available and whether the new program fits in that amount.

      Complete `available_gib` and `enough`, then print both values. The numbers are simplified for this
      exercise; a real operating system also reserves memory and manages it in pages.
    starterCode: |
      total_ram_gib = 8
      other_apps_gib = 5
      program_needs_gib = 2

      available_gib = 0  # TODO: subtract the memory already in use
      enough = False     # TODO: compare available memory with the program's need

      print(available_gib)
      print(enough)
    solution: |
      total_ram_gib = 8
      other_apps_gib = 5
      program_needs_gib = 2

      available_gib = total_ram_gib - other_apps_gib
      enough = available_gib >= program_needs_gib

      print(available_gib)
      print(enough)
    expectedOutput: |
      3
      True
    tests:
      - name: calculates the remaining memory
        code: |
          assert available_gib == 3, f"Expected 3 GiB available, got {available_gib!r}."
      - name: checks whether the program fits
        code: |
          assert enough is True, "The program needs 2 GiB and 3 GiB are available, so it should fit."
    hints:
      - Available memory is total RAM minus memory already in use.
      - Use `>=` to check whether available memory is at least the program's requirement.
    feedback:
      - when: { outputEquals: "0\nFalse\n" }
        message: The placeholder values are still present. Calculate the remaining RAM first, then compare it with the program's requirement.
    explanation: |
      Five GiB are already in use, so 8 - 5 leaves 3 GiB. Since 3 is greater than or equal to 2, the
      program's simplified memory requirement fits. Real memory availability is more complex than this
      arithmetic model, but the comparison illustrates resource budgeting.

  - id: explain-resource-roles
    type: explain
    skill: explanation
    difficulty: 2
    prompt: Explain the difference between RAM and persistent storage, using a running Python program and its saved `.py` file.
    rubric:
      - States that RAM holds active working data and is normally volatile.
      - States that persistent storage keeps the saved file when power is off.
    modelAnswer: When Python runs, the process and its working data use RAM. The `.py` file is stored on an SSD or other persistent storage and remains there after shutdown. Saving writes edits to the persistent file.
    explanation: The key distinction is temporary working state versus saved data that survives power loss.
masteryCheck:
  passThreshold: 0.75
  items: [cpu-cycle-check, ram-storage-check, diagnose-bottleneck, memory-budget-code]
cheatsheet: |
  - CPU = executes instructions.
  - RAM = fast, temporary working memory.
  - SSD/HDD = persistent file storage.
  - I/O = data moving into or out of the computer.
  - Bottleneck = resource limiting total throughput.
