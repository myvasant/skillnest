sections:
  - id: why
    title: Why the computer needs a translator
    kind: why
    blocks:
      - type: markdown
        body: |
          A computer's processor (the CPU) can only carry out very simple instructions such as "copy this
          number", "add these two numbers" or "jump to that instruction". Each instruction is stored as a
          pattern of bytes called [machine code](glossary:machine-code). Here are three real instructions for
          the x86-64 processors found in most laptops, shown as bytes in hexadecimal with a human-readable
          spelling (called *assembly language*) next to them:
      - type: code
        language: text
        status: illustrative
        code: |
          B8 01 00 00 00    mov eax, 1     put the number 1 into a CPU register called eax
          83 C0 02          add eax, 2     add 2 to it, so eax now holds 3
          C3                ret            return to whoever called this code
        caption: >-
          Real x86-64 machine code. A different kind of CPU (for example the ARM chips in phones and recent
          Macs) uses completely different bytes for the same work.
      - type: markdown
        body: |
          Writing whole applications like this is slow, error-prone and tied to one kind of CPU. So people
          write programs in a **programming language** — text that humans can read — and let another program
          translate it. In Python, the same calculation is one readable line. Press **Run**:
      - type: code
        runnable: true
        code: |
          print(1 + 2)
        expectedOutput: |
          3
        annotations:
          - line: 1
            text: "`print(...)` displays a value. Python works out `1 + 2` first, then displays the result."
      - type: markdown
        body: |
          Your computer never runs the text `print(1 + 2)` directly. Something has to turn it into work the
          CPU can do. This lesson is about that *something*: the compilers, interpreters and runtimes that
          sit between the code you write and the processor.

  - id: what-is-a-program
    title: Programs and source code
    kind: concept
    blocks:
      - type: markdown
        body: |
          A [program](glossary:program) is a **precise, ordered list of instructions** for a computer, plus
          the data those instructions need. "Precise" matters: the computer does exactly what is written,
          not what you meant. A missing bracket or a misspelled word is not "close enough".

          The text you write in a programming language is called [source code](glossary:source-code). It is
          stored in an ordinary text file — Python files end in `.py` — and you can open it in any editor.

          Here is a complete Python program. You do not need to know Python yet; each line is explained
          below the code.
      - type: code
        runnable: true
        code: |
          print("Hello!")
          print(2 + 3)
          print("Goodbye!")
        expectedOutput: |
          Hello!
          5
          Goodbye!
        annotations:
          - line: 1
            text: "`print` is a built-in instruction that displays something. Text inside quotes is shown exactly as written."
          - line: 2
            text: Without quotes, `2 + 3` is a calculation. Python computes 5 and displays it.
          - line: 3
            text: Each line is one instruction (a *statement*). They run in order, top to bottom.
      - type: markdown
        body: |
          Three words you will meet constantly:

          | Term | Meaning | Example |
          |---|---|---|
          | **Source code** | Text written by people in a programming language | `print(2 + 3)` in `hello.py` |
          | **Machine code** | Bytes the CPU executes directly; differs between CPU families | `83 C0 02` (add 2) |
          | **Executable** | A file the operating system can start as a program | `python.exe`, `git`, a compiled app |
      - type: item
        ref: source-vs-machine

  - id: translators
    title: Compilers, interpreters and runtimes
    kind: concept
    blocks:
      - type: markdown
        body: |
          There are two basic strategies for getting from source code to work the CPU does, plus a helper
          that every running program needs.

          **A [compiler](glossary:compiler) translates the whole program ahead of time** into another form —
          often machine code — and saves the result. You run the translation later, as often as you like,
          without the compiler. Mistakes in the text are reported *before* anything runs. C, C++, Rust and Go
          are usually compiled to machine code this way.

          **An [interpreter](glossary:interpreter) is a program that reads code and carries it out**
          instruction by instruction, while you wait. There is no separate translated file to run; you run
          the interpreter and give it your code.

          **A [runtime](glossary:runtime) is the support system around a running program**: it manages
          memory, provides built-in features such as `print`, and reports errors. Even compiled programs
          usually come with a small runtime; interpreted languages ship a large one inside the interpreter.
      - type: callout
        variant: analogy
        title: A book translator versus a live interpreter
        body: |
          A **compiler** is like a translator who translates a whole book into Hindi, prints it, and goes
          home. Readers then use the translated book directly, and spelling mistakes were caught before
          printing. An **interpreter** is like a live interpreter at a meeting: they translate each sentence
          as it is spoken. Nothing is printed, and they must be present every time.
      - type: markdown
        body: |
          Here is what the compiled route looks like for a C program. It runs on your own computer, not in
          this browser (which has no C compiler), so it is shown rather than run:
      - type: code
        language: bash
        status: illustrative
        code: |
          $ cat hello.c
          #include <stdio.h>

          int main(void) {
              printf("%d\n", 1 + 2);
              return 0;
          }
          $ gcc hello.c -o hello     # compile: hello.c (source) -> hello (machine code)
          $ ./hello                  # run the translation; gcc is no longer involved
          3
        caption: >-
          Illustrative terminal session (requires a C compiler such as gcc). `$` is the shell prompt; you type
          what follows it.
      - type: markdown
        body: |
          | | Compiled ahead of time (typical C) | Interpreted (typical Python) |
          |---|---|---|
          | When translation happens | Once, before running | Every time you run it |
          | What you distribute | The executable (one per CPU and OS) | The source code, plus an interpreter |
          | Text mistakes found | Before running | Before running (CPython checks the whole file first — see below) |
          | Start-up | Fast | Slower: translation happens at start |
          | Typical speed | Fast | Slower for heavy calculation |

          Real systems mix these strategies, as you are about to see with Python itself.

  - id: how-python-runs
    title: How CPython runs your program
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          When you install "Python" you get **CPython**, the reference implementation written in the C
          language. (This browser runs CPython too, compiled to WebAssembly.) CPython does **both** of the
          things described above:

          1. **Compile.** It reads your whole file, checks that it is valid Python, and translates it into
             [bytecode](glossary:bytecode) — compact instructions for an imaginary computer, not for your
             real CPU.
          2. **Interpret.** A loop inside CPython (often called the *Python virtual machine*) then carries out
             the bytecode instructions one by one, calling into the runtime for things like memory and
             `print`.

          Step through the pipeline:
      - type: visualization
        component: step-diagram
        title: From hello.py to output
        caption: Click through the steps. Lit boxes and arrows are the ones involved in each step.
        props:
          width: 760
          height: 300
          nodes:
            - { id: source, label: "hello.py (source)", x: 90, y: 70, shape: store }
            - { id: parser, label: "Tokenizer + parser", x: 290, y: 70 }
            - { id: compiler, label: "Bytecode compiler", x: 490, y: 70 }
            - { id: code, label: "Code object", x: 670, y: 70, shape: pill }
            - { id: pyc, label: "__pycache__ .pyc", x: 670, y: 230, shape: store }
            - { id: vm, label: "Interpreter loop", x: 470, y: 230 }
            - { id: output, label: "Output and effects", x: 250, y: 230, shape: actor }
          edges:
            - { id: e-read, from: source, to: parser, label: text }
            - { id: e-tree, from: parser, to: compiler, label: syntax tree }
            - { id: e-emit, from: compiler, to: code, label: bytecode }
            - { id: e-cache, from: code, to: pyc, label: imports only }
            - { id: e-run, from: code, to: vm, label: execute }
            - { id: e-out, from: vm, to: output, label: print }
          steps:
            - title: You write source code
              body: The program is plain text in a file. Nothing has happened yet.
              active: [source]
              payload: |
                print("Hello")
            - title: Read the text and check the grammar
              body: >-
                The tokenizer splits the text into pieces (the name `print`, a bracket, the text "Hello",
                another bracket); the parser checks they form valid Python and builds a tree. A missing bracket
                anywhere in the file is reported here as a **SyntaxError**, so no line runs at all.
              active: [source, parser, e-read]
              payload: "NAME 'print'   OP '('   STRING '\"Hello\"'   OP ')'"
            - title: Compile to bytecode
              body: >-
                The compiler turns the tree into a **code object**: a list of bytecode instructions plus the
                constants and names they use. This happens for the whole file before anything runs.
              active: [parser, compiler, code, e-tree, e-emit]
              payload: "LOAD_NAME print, PUSH_NULL, LOAD_CONST 'Hello', CALL, POP_TOP, ..."
            - title: Cache it (for imported modules)
              body: >-
                When a file is *imported* by another file, CPython saves the bytecode in a `__pycache__` folder
                so the next import can skip compiling. The main script you run directly is compiled again each
                time.
              active: [code, pyc, e-cache]
              payload: __pycache__/greeting.cpython-314.pyc
            - title: Execute the bytecode
              body: >-
                The interpreter loop fetches one instruction, does what it says, then fetches the next — the
                same fetch-decode-execute idea as a real CPU, but in software.
              active: [code, vm, e-run]
            - title: Effects happen
              body: >-
                Some instructions call into the runtime, which talks to the operating system: here `print`
                writes text to the screen. Runtime errors (dividing by zero, an unknown name) are raised during
                this phase, at a specific line.
              active: [vm, output, e-out]
              payload: Hello
      - type: markdown
        body: |
          You can ask CPython to do the compile step on its own with the built-in function `compile()`, and
          run the result later with `exec()`. The code below is explained line by line; the only new idea is
          that `source = ...` and `code = ...` give *names* to values so later lines can use them (you will
          study this properly in [variables](concept:python.variables)).
      - type: code
        runnable: true
        code: |
          source = 'print("Hello from compiled code")'
          code = compile(source, "hello.py", "exec")
          print(type(code).__name__)
          exec(code)
        expectedOutput: |
          code
          Hello from compiled code
        annotations:
          - line: 1
            text: "`source` names a piece of text that happens to contain a Python program."
          - line: 2
            text: "Compile it. `\"hello.py\"` is the file name to show in error messages; `\"exec\"` means \"a whole program\". Nothing is printed yet."
          - line: 3
            text: The result is a *code object* - compiled bytecode waiting to be run.
          - line: 4
            text: "`exec` hands the code object to the interpreter loop, and only now does Hello appear."
      - type: item
        ref: predict-compile-then-run
      - type: markdown
        body: |
          The standard-library module `dis` (short for *disassembler*) lists the bytecode instructions inside
          a code object. `import dis` loads that module; the `for` line repeats the indented line once per
          instruction (loops come later in [for loops](concept:python.for-loops)).
      - type: code
        runnable: true
        code: |
          import dis

          code = compile('print("Hello")', "hello.py", "exec")
          for instruction in dis.get_instructions(code):
              print(instruction.opname, instruction.argrepr)
        expectedOutput: |
          RESUME
          LOAD_NAME print
          PUSH_NULL
          LOAD_CONST 'Hello'
          CALL
          POP_TOP
          LOAD_CONST None
          RETURN_VALUE
        caption: Output from CPython 3.14 in this browser. Other Python versions print different instructions.
        annotations:
          - line: 4
            text: Ask dis for the instructions one at a time.
          - line: 5
            text: "`opname` is the instruction's name; `argrepr` describes what it works on (blank if nothing)."
      - type: markdown
        body: |
          One line of Python became eight small instructions:

          | Instruction | What it does |
          |---|---|
          | `RESUME` | Bookkeeping at the start of a code object |
          | `LOAD_NAME print` | Look up what the name `print` means (the built-in display function) |
          | `PUSH_NULL` | An internal placeholder the call mechanism needs |
          | `LOAD_CONST 'Hello'` | Fetch the text "Hello", which the compiler stored with the code |
          | `CALL` | Call the function with the value(s) loaded above — this is when text appears |
          | `POP_TOP` | Throw away `print`'s result, which nobody uses |
          | `LOAD_CONST None` + `RETURN_VALUE` | The program is finished |
      - type: callout
        variant: warning
        title: Bytecode is a CPython detail that changes between versions
        body: |
          The Python documentation states that bytecode is an implementation detail of CPython with no
          guarantee it stays the same between releases. Python 3.13 and 3.15 print different instruction
          names for the same program. Use `dis` to *understand* what happens; never write programs that
          depend on particular instructions.

  - id: execution-order
    title: Execution order, and why errors stop programs where they do
    kind: mental-model
    blocks:
      - type: markdown
        body: |
          Once the bytecode is running, CPython carries out [statements](glossary:statement) **one at a time,
          from top to bottom**. Each statement finishes before the next begins. Step through this program and
          watch the highlighted line move. Line 2 previews a *name* for a value — the tracer shows the name
          on the left and the value it refers to.
      - type: visualization
        component: python-tracer
        title: Top to bottom, one statement at a time
        caption: Press Next to run one line. The output panel grows only when a print runs.
        props:
          code: |
            print("Step 1")
            total = 2 + 3
            print("Step 2:", total)
            print("Step 3")
      - type: markdown
        body: |
          Programs do not *only* go straight down. **Control flow** statements change the order: a condition
          can skip lines, a loop can repeat them, and a function call jumps away and comes back. You will
          learn each of these later; for now, just watch line 3 run three times:
      - type: visualization
        component: python-tracer
        title: A loop changes the order
        caption: The loop (previewed here) sends execution back to line 2 until it has run three times.
        props:
          code: |
            print("start")
            for lap in range(3):
                print("lap", lap)
            print("end")
      - type: markdown
        body: |
          The compile-then-run pipeline explains a puzzle every beginner meets: **two kinds of error stop a
          program at different moments.**

          - A [SyntaxError](glossary:syntax-error) is found while *compiling*. CPython cannot build bytecode
            for a file it cannot read, so **no line runs**, not even the first.
          - A runtime error (an [exception](glossary:exception)) happens while *executing*, at one specific
            line. Every line before it has already run.
      - type: code
        runnable: true
        code: |
          print("A")
          print("B"
          print("C")
        expectError: SyntaxError
        caption: Run it. "A" is never printed - the file failed to compile, so nothing was executed.
      - type: code
        runnable: true
        code: |
          print("one")
          print(10 / 0)
          print("three")
        expectError: ZeroDivisionError
        expectedOutput: |
          one
        caption: >-
          This file compiles fine. Line 1 runs, then line 2 raises ZeroDivisionError at runtime and the
          program stops; line 3 never runs.
      - type: item
        ref: predict-runtime-stop
      - type: item
        ref: why-nothing-ran

  - id: interpreted-vs-compiled
    title: '"Interpreted" and "compiled" describe implementations'
    kind: concept
    blocks:
      - type: markdown
        body: |
          You will often read "Python is an interpreted language" and "C is a compiled language". Those are
          handy shorthand for the *usual* way each language is run, but strictly they describe
          **implementations** — particular programs that run the language — not the language itself.

          | Implementation | Language | What it actually does |
          |---|---|---|
          | **CPython** | Python | Compiles to bytecode, then interprets the bytecode |
          | **PyPy** | Python | Interprets, and a [just-in-time (JIT) compiler](glossary:jit-compiler) turns frequently run code into machine code while the program runs |
          | **CPython 3.13+ experimental JIT** | Python | Optional and off by default; the 3.14 Windows and macOS installers include it, enabled with the environment variable `PYTHON_JIT=1`, and it is not recommended for production |
          | **javac + the JVM** | Java | Compiles to JVM bytecode ahead of time; the JVM interprets it and JIT-compiles hot code |
          | **V8** (Chrome, Node.js) | JavaScript | Interprets and JIT-compiles |
          | **gcc / clang** | C | Compiles to machine code ahead of time |

          The same Python program can run on CPython or on PyPy with identical results but different
          speed. So the precise statement is: *"CPython compiles Python to bytecode and interprets that
          bytecode."*
      - type: callout
        variant: misconception
        title: '"Python is never compiled"'
        body: |
          CPython compiles every file to bytecode before running any of it — that is exactly why a
          SyntaxError on the last line stops the first line from running. What CPython does *not* normally do
          is compile to machine code for your CPU.
      - type: item
        ref: interpreted-claim

  - id: under-the-hood
    title: Inside CPython
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Each source line becomes several instructions.** `dis.get_instructions` also reports which
          source line every instruction came from (`\n` inside the text below means "new line"):
      - type: code
        runnable: true
        code: |
          import dis

          source = "price = 20\ntotal = price * 3\nprint(total)\n"
          code = compile(source, "shop.py", "exec")
          for instruction in dis.get_instructions(code):
              print(instruction.line_number, instruction.opname)
        expectedOutput: |
          0 RESUME
          1 LOAD_SMALL_INT
          1 STORE_NAME
          2 LOAD_NAME
          2 LOAD_SMALL_INT
          2 BINARY_OP
          2 STORE_NAME
          3 LOAD_NAME
          3 PUSH_NULL
          3 LOAD_NAME
          3 CALL
          3 POP_TOP
          3 LOAD_CONST
          3 RETURN_VALUE
        caption: CPython 3.14. `STORE_NAME` attaches a name to a value; `BINARY_OP` does the multiplication.
      - type: markdown
        body: |
          **The compiler does some work ahead of time.** If an expression uses only constants, CPython's
          compiler may compute it during compilation (*constant folding*). There is no `BINARY_OP` below:
          the addition was done before the program ran.
      - type: code
        runnable: true
        code: |
          import dis

          code = compile("print(2 + 3)", "demo.py", "exec")
          names = [instruction.opname for instruction in dis.get_instructions(code)]
          print(names)
          print("BINARY_OP" in names)
        expectedOutput: |
          ['RESUME', 'LOAD_NAME', 'PUSH_NULL', 'LOAD_SMALL_INT', 'CALL', 'POP_TOP', 'LOAD_CONST', 'RETURN_VALUE']
          False
      - type: markdown
        body: |
          **Bytecode caching (`.pyc` files).** When one file *imports* another, CPython compiles the imported
          module and, by default, writes the bytecode to `__pycache__/<name>.cpython-314.pyc`
          ([PEP 3147](https://peps.python.org/pep-3147/)). On the next import it checks the cached file's
          header — a *magic number* identifying the bytecode version, plus the source file's modification
          time and size — and skips compiling if nothing changed. The version tag in the file name
          (`cpython-314`) is why Python 3.13 and 3.14 keep separate caches. The script you run directly is
          not cached. You can compile a file explicitly with `py_compile`:
      - type: code
        runnable: true
        code: |
          import py_compile

          with open("shop.py", "w", encoding="utf-8") as f:
              f.write("print(20 * 3)\n")

          cached = py_compile.compile("shop.py")
          print(cached)
        expectedOutput: |
          __pycache__/shop.cpython-314.pyc
        caption: >-
          Lines 3-4 create a small source file (files are covered in a later lesson). This browser's Python
          turns off automatic `.pyc` writing on import (`sys.dont_write_bytecode` is True), but desktop
          CPython writes them for you.
      - type: markdown
        body: |
          **The interpreter loop and specialisation.** The heart of CPython is a large loop in C that fetches
          the next instruction and runs the C code for it. Since Python 3.11 it is a *specialising adaptive
          interpreter* ([PEP 659](https://peps.python.org/pep-0659/)): after an instruction has run a few
          times, CPython may replace it with a faster version specialised for the types it actually saw (for
          example, adding two integers). `dis.dis(code, adaptive=True)` shows the specialised form.

          **Deleting `__pycache__` is always safe**; CPython simply recompiles. Do not commit these folders
          to version control — they are generated files.
      - type: item
        ref: pyc-purpose

  - id: mistakes
    title: Common mistakes and confusions
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `SyntaxError` and *nothing* printed, even from line 1 | The file could not be compiled (missing bracket or quote, typo in a keyword) | Fix the line the error points at, or the line just before it; then rerun |
          | `SyntaxError: invalid syntax` on a line starting with `>>>` | You copied the interactive prompt `>>>` from a tutorial into your file | Delete the `>>>` (and `...`) prompts; type only the code |
          | `NameError: name 'Print' is not defined` | Python is case-sensitive: `Print` is not `print` | Match the exact spelling and capitals |
          | Some lines printed, then an error | A runtime error at the line in the traceback; earlier lines already ran | Read the last line of the error, then the line number |
          | `'python' is not recognized ...` (Windows) or `python: command not found` | The shell cannot find the interpreter program | Install Python or fix PATH (see [installing tools](concept:foundations.installing-tools)) |
      - type: code
        runnable: true
        code: |
          >>> print("hi")
        expectError: SyntaxError
        caption: The `>>>` prompt belongs to the interactive interpreter, not to the program.
      - type: code
        runnable: true
        code: |
          Print("Hello")
        expectError: NameError
        caption: "This compiles fine (it is valid grammar), then fails at runtime: no name `Print` exists."
      - type: callout
        variant: tip
        title: Compilation checks grammar, not meaning
        body: |
          The compiler only checks that the text is *valid Python*. It does not check that names exist or
          that values make sense - `Print("Hello")` and `print(10 / 0)` both compile happily. Those problems
          appear when the line executes.

  - id: practice
    title: Practice
    kind: practice
    blocks:
