id: foundations.programs-and-languages
concept: foundations.programs-and-languages
title: Programs, Interpreters and Compilers
subtitle: From the text you write to instructions a CPU can run
estimatedMinutes: 40
reviewedOn: 2026-10-22
summary: >-
  A program is a precise list of instructions written as text. The CPU cannot read that text, so another
  program must translate or carry it out. Learn what compilers, interpreters and runtimes do, watch CPython
  turn a line of Python into bytecode, and see why "interpreted versus compiled" describes an implementation,
  not a language.
objectives:
  - Explain the difference between source code and machine code, and why a translator is needed.
  - Describe what a compiler, an interpreter and a runtime each do, with one example of each.
  - Describe how CPython runs a file - compile the whole file to bytecode first, then execute the bytecode.
  - Predict which lines of a program run before a SyntaxError or a runtime error stops it.
  - Explain why "Python is interpreted" is a statement about CPython, not about the Python language.
