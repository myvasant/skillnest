  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A **program** is a precise, ordered list of instructions; **source code** is its human-readable
            text. The CPU only executes **machine code**.
          - A **compiler** translates ahead of time; an **interpreter** carries out code while you wait; a
            **runtime** supports the running program (memory, built-ins, errors).
          - **CPython** compiles the whole file to **bytecode**, then its interpreter loop executes the
            bytecode. Imported modules' bytecode is cached in `__pycache__/*.pyc`.
          - Statements run top to bottom unless control flow (conditions, loops, calls) changes the order.
          - **SyntaxError** → found while compiling → nothing runs. **Runtime errors** → found while
            executing → earlier lines already ran.
          - "Interpreted" and "compiled" describe **implementations** (CPython, PyPy, the JVM), not languages.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Is Python compiled or interpreted?" — Say that CPython does both: it compiles source to bytecode
          (cached in `.pyc` files for imported modules) and interprets the bytecode in a virtual machine; PyPy
          adds a JIT compiler; and the distinction belongs to implementations, not languages. See
          [the interview question](interview:foundations.programs-and-languages.compiled-or-interpreted).

items:
  - id: source-vs-machine
    type: mcq
    skill: recognition
    prompt: Which statement about source code and machine code is correct?
    explanation: >-
      Source code is text written for people and tools; machine code is the byte-encoded instructions a
      particular CPU family executes. Something (a compiler, an interpreter, or both) must bridge the two.
    options:
      - id: a
        text: The CPU reads source code directly, one character at a time.
        feedback: CPUs only execute machine code. Text such as `print(2 + 3)` must be translated or carried out by another program.
      - id: b
        text: Source code is human-readable text; machine code is bytes a specific kind of CPU executes.
        correct: true
        feedback: Right. That is why the same machine code does not run on both x86-64 and ARM processors.
      - id: c
        text: Machine code is the same on every computer, so programs run anywhere once compiled.
        feedback: Each CPU family has its own instruction set. A program compiled for x86-64 will not run on an ARM CPU without being recompiled or emulated.
      - id: d
        text: Source code and machine code are two names for the same thing.
        feedback: They are different. Source code is the text you write; machine code is what the processor runs.

  - id: predict-compile-then-run
    type: predict-output
    skill: prediction
    prompt: |
      `compile()` turns text into a code object and `exec()` runs a code object. What does this program print?
    code: |
      code = compile('print("hi")', "demo.py", "exec")
      print("compiled")
      exec(code)
      exec(code)
    answer: |
      compiled
      hi
      hi
    explanation: >-
      Compiling only translates; it never runs anything. "compiled" is printed by line 2. Each `exec` then
      runs the same code object, so "hi" appears twice. A compiled program can be run as many times as you
      like without compiling again.
    wrongAnswers:
      - answer: |
          hi
          compiled
          hi
          hi
        feedback: >-
          `compile()` does not run the code - it only produces bytecode. Nothing is printed until `exec()`
          executes it.
      - answer: |
          compiled
          hi
        feedback: >-
          A code object can be executed more than once. Each `exec(code)` runs the whole program again.

  - id: predict-runtime-stop
    type: predict-output
    skill: prediction
    prompt: What is printed before this program stops with an error?
    code: |
      print("one")
      print("two")
      print(10 / 0)
      print("four")
    answer: |
      one
      two
    explanation: >-
      The file is valid Python, so it compiles and starts running. Lines 1 and 2 run; line 3 raises
      ZeroDivisionError during execution, which stops the program. Line 4 never runs.
    wrongAnswers:
      - answer: |
          one
          two
          four
        feedback: >-
          An error does not skip a line and carry on. Unless the error is handled (you will learn how later),
          the program stops at the failing line.
      - answer: ""
        feedback: >-
          That would be true for a SyntaxError, which is found before anything runs. Dividing by zero is valid
          grammar, so the problem only appears when line 3 executes - after lines 1 and 2 have run.

  - id: why-nothing-ran
    type: mcq
    skill: explanation
    prompt: |
      A 200-line program has a missing closing bracket on line 200. When you run it, not even line 1's
      `print` appears. Why?
    explanation: >-
      CPython compiles the whole file to bytecode before executing any of it. A SyntaxError anywhere means
      there is no bytecode to run, so no statement executes.
    options:
      - id: a
        text: CPython compiles the whole file before running it, and a file with a SyntaxError cannot be compiled.
        correct: true
        feedback: Exactly. Grammar is checked for the entire file first.
      - id: b
        text: CPython runs the file backwards, so line 200 runs first.
        feedback: Execution goes top to bottom. The point is that compilation of the whole file happens before execution starts.
      - id: c
        text: The print on line 1 ran, but its output was deleted when the error happened.
        feedback: Output that has been printed stays printed. Here line 1 never ran at all.
      - id: d
        text: Python only shows output after the whole program finishes successfully.
        feedback: Try the ZeroDivisionError example above - lines before a runtime error do print.

  - id: interpreted-claim
    type: mcq
    skill: explanation
    difficulty: 2
    prompt: |
      A classmate says: "Python is an interpreted language, so Python code is never compiled." What is the
      most accurate reply?
    explanation: >-
      CPython compiles source to bytecode and then interprets the bytecode. Other implementations make other
      choices (PyPy adds a JIT compiler). "Interpreted" describes how an implementation runs code.
    options:
      - id: a
        text: You are right - Python reads and runs each line of text directly.
        feedback: If that were true, line 1 would run even when line 200 has a SyntaxError. CPython compiles the whole file to bytecode first.
      - id: b
        text: Wrong - Python is compiled to machine code just like C.
        feedback: CPython does not normally produce machine code for your CPU. It compiles to bytecode, which its own virtual machine interprets.
      - id: c
        text: CPython compiles Python to bytecode and then interprets that bytecode; "interpreted" describes an implementation, not the language.
        correct: true
        feedback: Correct, and other implementations such as PyPy also JIT-compile hot code to machine code.
      - id: d
        text: It depends on whether the file ends in .py or .pyc.
        feedback: The extension does not change the language. A .pyc file just stores bytecode that CPython already compiled from .py source.

  - id: pyc-purpose
    type: mcq
    skill: recognition
    prompt: What is stored in `__pycache__/notes.cpython-314.pyc`, and why does it exist?
    explanation: >-
      It is the compiled bytecode of the imported module notes.py, saved by CPython 3.14 so later imports can
      skip compiling while the source is unchanged. It is safe to delete and should not be committed.
    options:
      - id: a
        text: Machine code for your CPU, so the module runs without the interpreter.
        feedback: A .pyc holds CPython bytecode, which still needs the interpreter loop to execute.
      - id: b
        text: Cached bytecode for notes.py, so later imports can skip compiling when the source has not changed.
        correct: true
        feedback: Right. The cpython-314 tag keeps caches for different Python versions apart.
      - id: c
        text: A backup copy of the source code in case you delete notes.py.
        feedback: It contains bytecode, not your source text, and it is regenerated automatically.
      - id: d
        text: An encrypted version of the program that hides it from users.
        feedback: Bytecode is not encryption; tools such as dis can read it.

  - id: print-pipeline
    type: code
    skill: implementation
    prompt: |
      Write a program that prints these three lines, in this order, using **one `print` per line**:

      ```text
      1. Write source code
      2. Compile to bytecode
      3. Interpret the bytecode
      ```
    starterCode: |
      # Print the three steps, one print per line.

    solution: |
      print("1. Write source code")
      print("2. Compile to bytecode")
      print("3. Interpret the bytecode")
    expectedOutput: |
      1. Write source code
      2. Compile to bytecode
      3. Interpret the bytecode
    tests:
      - name: prints the three lines in order
        code: |
          expected = ["1. Write source code", "2. Compile to bytecode", "3. Interpret the bytecode"]
          assert output_lines() == expected, f"Expected exactly these lines: {expected}. Your program printed {output_lines()!r}."
      - name: uses one print per line
        code: |
          import ast
          prints = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call) and getattr(n.func, "id", "") == "print"]
          assert len(prints) == 3, f"Use exactly three print(...) calls, one for each line. You used {len(prints)}."
    hints:
      - "Each line of output needs its own `print(\"...\")` statement."
      - "Text must be inside quotes, exactly as shown: `print(\"1. Write source code\")`."
    feedback:
      - when: { errorType: SyntaxError }
        message: Python could not compile your program. Check that every opening quote and bracket has a matching closing one.
      - when: { errorType: NameError }
        message: Python treated some text as a name. Put the text of each line inside quotes, and spell print in lower case.
    explanation: >-
      Three statements run in order, top to bottom, so the output appears in the same order as the code.

  - id: fix-pipeline
    type: debug
    skill: debugging
    prompt: |
      This program should print the three steps in order, but it does not even start. Run it, read the error,
      fix it, then run it again - there is a second problem that only shows up once the program runs.

      Expected output:

      ```text
      Write the source code
      Compile it to bytecode
      Run the bytecode
      ```
    starterCode: |
      print("Write the source code")
      print("Run the bytecode")
      print("Compile it to bytecode)
    solution: |
      print("Write the source code")
      print("Compile it to bytecode")
      print("Run the bytecode")
    expectedOutput: |
      Write the source code
      Compile it to bytecode
      Run the bytecode
    tests:
      - name: prints the steps in the right order
        code: |
          expected = ["Write the source code", "Compile it to bytecode", "Run the bytecode"]
          assert output_lines() == expected, f"Expected {expected}, but your program printed {output_lines()!r}."
    hints:
      - The first error is a SyntaxError about a string. Which text is missing its closing quote?
      - Once it runs, compare the order of the printed lines with the expected output. Statements run top to bottom.
    feedback:
      - when: { errorType: SyntaxError }
        message: The file still cannot be compiled, so nothing runs. Every string needs a closing quote before the closing bracket.
      - when: { outputEquals: "Write the source code\nRun the bytecode\nCompile it to bytecode\n" }
        message: The syntax error is fixed. Now the lines run in the order they are written - move the Compile line above the Run line.
    explanation: >-
      The missing quote is a SyntaxError, so CPython could not compile the file and nothing ran. After fixing
      it, the program ran top to bottom - which revealed that two lines were in the wrong order.

  - id: parsons-pipeline
    type: parsons
    skill: recognition
    prompt: |
      Arrange the lines so the program prints how CPython runs a file, in the correct order. One line is a
      distractor that describes something CPython does not do.
    solution: |
      print("CPython reads the source text")
      print("It checks the grammar of the whole file")
      print("It compiles the file to bytecode")
      print("The interpreter loop executes the bytecode")
    distractors:
      - print("The CPU executes the source text directly")
    explanation: >-
      CPython reads the text, parses the whole file (reporting any SyntaxError), compiles it to bytecode and
      only then executes the bytecode. The CPU never runs source text directly.

  - id: explain-pipeline
    type: explain
    skill: explanation
    prompt: |
      Explain to a friend why a missing bracket on the **last** line of a Python file stops the **first** line
      from printing, while dividing by zero on the last line does not.
    explanation: Compare your explanation with the model answer and tick each rubric point you covered.
    rubric:
      - Says that CPython compiles the whole file to bytecode before executing anything.
      - Says that a missing bracket is a SyntaxError found during compilation, so no bytecode exists and nothing runs.
      - Says that dividing by zero is valid grammar, so the file compiles and starts running.
      - Says that the runtime error happens when that line executes, after earlier lines have already run.
    modelAnswer: |
      CPython works in two phases. First it reads and compiles the entire file into bytecode. A missing
      bracket breaks the grammar, so compilation fails with a SyntaxError and there is no bytecode to run -
      not even line 1 executes. `10 / 0` is perfectly valid grammar, so the file compiles and execution
      begins at the top. Lines run one by one, and only when the last line executes does the division fail
      with ZeroDivisionError. By then the earlier lines have already printed their output.

  # ----- Mastery check (new items, not used in the sections) -----
  - id: m-predict-nameerror
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: What is printed before this program stops?
    code: |
      print("Loading")
      print("Ready")
      Print("Go")
      print("Done")
    answer: |
      Loading
      Ready
    explanation: >-
      `Print("Go")` is valid grammar, so the file compiles. The compiler does not check whether names exist.
      Lines 1-2 run, then line 3 raises NameError at runtime because there is no name `Print`.
    wrongAnswers:
      - answer: ""
        feedback: >-
          A misspelled name is not a SyntaxError. The grammar is fine, so the program compiles and starts; the
          NameError appears only when line 3 executes.
      - answer: |
          Loading
          Ready
          Go
          Done
        feedback: Python is case-sensitive. `Print` is not the built-in `print`, so line 3 fails.
      - answer: |
          Loading
          Ready
          Done
        feedback: An unhandled error stops the program; it does not skip the line and continue.

  - id: m-java-tf
    type: true-false
    skill: transfer
    prompt: |
      True or false: Java programs are compiled with `javac`, so a Java program is never interpreted.
    answer: false
    explanation: >-
      `javac` compiles Java to JVM bytecode, not to machine code. The Java Virtual Machine then interprets that
      bytecode and JIT-compiles frequently used parts. Like CPython, it mixes compilation and interpretation.

  - id: m-pypy-mcq
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: |
      The same `report.py` prints identical results on CPython and on PyPy, but runs five times faster on PyPy
      because PyPy JIT-compiles the hot loops to machine code. What does this show?
    explanation: >-
      The language (Python) defines what the program means; each implementation decides how to run it.
      Speed and the interpret/compile strategy are properties of the implementation.
    options:
      - id: a
        text: PyPy runs a different language that only looks like Python.
        feedback: PyPy implements the Python language; that is why the results are identical.
      - id: b
        text: "\"Interpreted\" or \"compiled\" is a property of an implementation, not of the Python language."
        correct: true
        feedback: Right. One language, several implementations with different strategies.
      - id: c
        text: CPython has a bug that makes it slow.
        feedback: CPython is not wrong, it simply uses a different strategy (bytecode interpretation, with an optional experimental JIT).
      - id: d
        text: report.py must have been saved as machine code.
        feedback: The source file is the same text for both; PyPy produces machine code itself while the program runs.

  - id: m-debug-two-errors
    type: debug
    skill: debugging
    difficulty: 2
    prompt: |
      Fix this program so that it prints exactly:

      ```text
      Compiling...
      Running...
      ```

      Notice which error you see first, and which one only appears after you fix it.
    starterCode: |
      Print("Compiling...")
      print("Running..."
    solution: |
      print("Compiling...")
      print("Running...")
    expectedOutput: |
      Compiling...
      Running...
    tests:
      - name: prints both lines
        code: |
          assert output_lines() == ["Compiling...", "Running..."], f"Expected two lines, Compiling... then Running... Your program printed {output_lines()!r}."
    hints:
      - The first error is a SyntaxError on line 2. Which bracket is never closed?
      - After that, a NameError appears on line 1. Python is case-sensitive.
    feedback:
      - when: { errorType: SyntaxError }
        message: The file still cannot be compiled. Close the bracket at the end of line 2.
      - when: { errorType: NameError }
        message: The file compiles now and runs until line 1 fails. `Print` must be written `print`.
    explanation: >-
      The SyntaxError on line 2 is reported first even though it comes later in the file, because compilation
      of the whole file happens before execution. Once it compiles, execution reaches line 1 and the NameError
      appears. Fixing both lets both lines run.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-nameerror, m-java-tf, m-pypy-mcq, m-debug-two-errors]

cheatsheet: |
  ```text
  source code (.py text)
      -> tokenizer + parser      SyntaxError here => nothing runs
      -> bytecode compiler       produces a code object (cached as __pycache__/*.pyc for imports)
      -> interpreter loop        runs bytecode top to bottom; runtime errors here
  ```
  ```python
  code = compile(text, "file.py", "exec")   # compile only
  exec(code)                                # run the code object
  import dis
  [i.opname for i in dis.get_instructions(code)]   # inspect bytecode (CPython-specific)
  ```
  - Compiler = translate ahead of time · Interpreter = carry out code now · Runtime = support while running
  - CPython: compile to bytecode, then interpret. PyPy: + JIT. "Interpreted" describes implementations.
