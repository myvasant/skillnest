id: cs.dynamic-arrays
concept: cs.dynamic-arrays
title: Arrays and Dynamic Arrays
subtitle: Why Python list operations have different costs
estimatedMinutes: 50
reviewedOn: 2026-11-04
summary: >-
  Understand contiguous arrays, direct indexing, spare capacity and resizing. Connect the dynamic-array
  model to Python list operations, explain amortised append cost, and choose a deque or another structure
  when repeated front insertion or removal would be expensive.
objectives:
  - Explain why an array can access an element by index in constant time.
  - Describe how a dynamic array grows when its capacity is exhausted.
  - Explain why append is amortised O(1) while inserting or removing at the front is O(n).
  - Distinguish a Python list's array of object references from the objects it references.
  - Choose between list, deque and numeric arrays based on the operation and data shape.
sources:
  - title: Python FAQ — How are lists implemented in CPython?
    url: https://docs.python.org/3/faq/design.html#how-are-lists-implemented-in-cpython
    publisher: Python Software Foundation
  - title: Python Wiki — Time Complexity
    url: https://wiki.python.org/moin/TimeComplexity
    publisher: Python Wiki
  - title: collections.deque
    url: https://docs.python.org/3/library/collections.html#collections.deque
