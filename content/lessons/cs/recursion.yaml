cheatsheet: |
  ```python
  def solve(problem):
      if is_smallest(problem):          # base case: answer directly
          return direct_answer(problem)
      smaller = shrink(problem)         # must move toward the base case
      return combine(problem, solve(smaller))   # recursive case: RETURN it

  import sys
  sys.getrecursionlimit()               # 1000 by default; RecursionError beyond it

  from functools import lru_cache
  @lru_cache(maxsize=None)              # memoise overlapping sub-problems
  def fib(n): return n if n < 2 else fib(n - 1) + fib(n - 2)
  ```
  - Each call has its own frame; frames finish in reverse order. Stack space is O(depth).
  - Nested data: `isinstance(x, list/dict)` → recurse; otherwise handle the value.
  - Deep linear recursion → loop or explicit stack. No tail-call optimisation in CPython.
  - Bugs: missing/unreachable base case (use `<=`), forgetting `return`, append vs extend.
