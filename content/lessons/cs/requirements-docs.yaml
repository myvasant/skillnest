id: cs.requirements-docs
concept: cs.requirements-docs
title: Requirements and Technical Documentation
subtitle: Turn needs and decisions into shared, testable knowledge
estimatedMinutes: 55
reviewedOn: '2026-11-04'
summary: Learn to discover the real user problem, separate functional and non-functional requirements, write testable
  acceptance criteria, prepare design documents and ADRs, and maintain a useful README.
objectives:
- Turn a proposed solution into a clear user problem and user story.
- Distinguish functional requirements from measurable quality constraints.
- Write Given/When/Then acceptance criteria for normal, invalid and permission cases.
- Explain how requirements trace to tests, implementation and release evidence.
- Choose when to write a design document or an Architecture Decision Record.
- Create and maintain documentation that helps a new contributor run and change a project.
sources:
- title: Architectural Decision Records
  url: https://adr.github.io/
  publisher: ADR GitHub organization
- title: Diátaxis documentation framework
  url: https://diataxis.fr/
  publisher: Daniele Procida
- title: 'Software Engineering at Google — Chapter 10: Documentation'
  url: https://abseil.io/resources/swe-book/html/ch10.html
  publisher: Google
sections:
- id: why-requirements
  title: Why write requirements and documentation?
  kind: why
  blocks:
  - type: markdown
    body: |-
      A team can build a feature that works exactly as coded and still fail because it solved the wrong problem. Requirements make the intended outcome explicit. Technical documentation preserves the context that future engineers need to operate and change the system. Both reduce dependence on one person remembering every conversation.
  - type: callout
    variant: analogy
    title: A requirement is a shared agreement about the outcome
    body: It is not a promise that every detail is known on day one. It is a way to make assumptions visible,
      test them and revise them when evidence changes.
- id: discover-need
  title: Start with the user problem
  kind: walkthrough
  blocks:
  - type: markdown
    body: |-
      Do not turn the first requested solution directly into a specification. Ask who has the problem, what they are trying to do, why the current approach fails, how often it happens, what constraints exist and how success will be recognised. Separate observed facts from assumptions.

      A [user story](glossary:user-story) is a compact way to express perspective and value: “As a [user], I want [capability], so that [benefit].” It is a conversation starter, not a complete contract.
  - type: markdown
    body: |-
      For example, “add a CSV export button” is a proposed solution. The underlying need may be “a finance user needs to reconcile monthly expenses outside the application.” That need raises questions about date ranges, permissions, data format, large exports and auditability.
- id: functional-quality
  title: Functional and non-functional requirements
  kind: concept
  blocks:
  - type: markdown
    body: |-
      A **functional requirement** describes what the system must do: create an expense, search invoices, reset a password or export a report. A **non-functional requirement** describes a quality or constraint on how the system behaves: response time, availability, security, privacy, accessibility, cost or maintainability.

      Non-functional requirements should be measurable where possible. “Fast” is vague. “The 95th-percentile search response is under 250 ms for 200 concurrent users on the agreed dataset” can be tested, although the workload and measurement environment must also be specified.
  - type: callout
    variant: warning
    title: Do not confuse a target with an implementation choice
    body: “Use Redis” is usually a proposed solution. The requirement might be “serve repeated product lookups
      within 50 ms while tolerating a short-lived stale value.” Compare solutions against that need.
- id: acceptance-criteria
  title: Make acceptance criteria testable
  kind: concept
  blocks:
  - type: markdown
    body: |-
      [Acceptance criteria](glossary:acceptance-criteria) describe observable conditions that must hold for a requirement to be accepted. Given/When/Then is one useful format:

      - **Given** a starting context.
      - **When** an action occurs.
      - **Then** an observable result follows.

      Example: Given a signed-in user with an expense of 12.50, when they export the selected month, then the CSV contains that expense and does not contain another user’s records. Add invalid input, empty data, permission and boundary cases. Acceptance criteria are not merely a list of implementation tasks.
  - type: code
    language: python
    code: |-
      def create_expense(amount, description):
          text = description.strip()
          if amount <= 0 or not text:
              raise ValueError("invalid expense")
          return {"amount": round(amount, 2), "description": text}

      print(create_expense(12.5, " Lunch "))
    runnable: true
    status: verified
    expectedOutput: '{''amount'': 12.5, ''description'': ''Lunch''}'
    caption: 'The example implements two acceptance rules: a positive amount and a non-blank, trimmed description.'
  - type: markdown
    body: |-
      A traceability chain links the requirement to acceptance criteria, tests, code and release evidence. It helps the team answer: what requirement does this change satisfy, and what proves it?
- id: design-docs-adrs
  title: Design documents and Architecture Decision Records
  kind: concept
  blocks:
  - type: markdown
    body: |-
      A design document is useful before a change with meaningful complexity or risk. It usually states context, problem, goals and non-goals, constraints, proposed design, alternatives, risks, rollout and open questions. It invites review before a large amount of implementation depends on an assumption.

      An [Architecture Decision Record](glossary:architecture-decision-record) (ADR) captures one significant decision: title and status, context, decision, alternatives considered and consequences. Keep it short. When a decision changes, write a new ADR that supersedes the old one; preserve the history instead of rewriting the reason the earlier choice was made.
  - type: callout
    variant: tip
    title: Document decisions at the point they matter
    body: A small reversible choice may need only a code comment or README note. A data model, public API or security
      boundary deserves a more durable explanation.
- id: readme-and-docs
  title: README and maintainable documentation
  kind: application
  blocks:
  - type: markdown
    body: |-
      A useful README helps a newcomer answer: what is this project, what problem does it solve, how do I install it, how do I run it, how do I test it, where is configuration documented, and where can I get help? Keep setup instructions executable and update them in the same change that alters the workflow.

      Documentation types serve different needs: tutorials help someone learn, how-to guides help someone complete a task, reference material describes facts and interfaces, and explanations give context. The [Diátaxis](https://diataxis.fr/) framework is one way to keep these purposes distinct.
  - type: markdown
    body: |-
      Avoid documenting every line of code. Document contracts, domain rules, operational steps, non-obvious decisions and the reasons behind constraints. Let clear names and tests describe ordinary mechanics.
- id: mistakes-requirements
  title: Common documentation mistakes
  kind: mistakes
  blocks:
  - type: markdown
    body: |-
      - **“Make it user-friendly”:** too vague; identify a user task and observable measure.
      - **Only happy-path criteria:** add invalid, empty, boundary and permission cases.
      - **Mixing requirements and design:** record the outcome separately from the chosen implementation.
      - **Writing an ADR as a retrospective:** record context and alternatives while the decision is made.
      - **Leaving stale setup steps:** update docs with the code change and test the commands.
      - **Treating a user story as a full specification:** add constraints, acceptance criteria and unresolved questions.
  - type: callout
    variant: misconception
    title: More pages do not automatically mean better documentation
    body: The goal is useful, current information at the point a person needs it. A short accurate decision record
      beats a long document nobody maintains.
- id: practice-requirements
  title: Practice before the mastery check
  kind: practice
  blocks:
  - type: markdown
    body: |-
      1. Rewrite “the API should be secure and fast” into two measurable requirements, including the workload and the security boundary.
      2. Draft Given/When/Then criteria for deleting an account, including what happens to associated data.
      3. Write an ADR outline for choosing between a local SQLite database and PostgreSQL for a small internal service.
  - type: item
    ref: req-practice-nfr
  - type: item
    ref: req-practice-validation-output
- id: summary-requirements
  title: Summary and checklist
  kind: summary
  blocks:
  - type: markdown
    body: |-
      Start with the user problem. Separate functional behaviour from quality constraints. Write acceptance criteria that can be observed and tested, including errors and permissions. Use design documents for complex proposals, ADRs for significant decisions, and a README for the path a newcomer must follow. Keep documentation current with the code.

      Before implementation, ask: who needs this, why, what is explicitly in and out of scope, how will we test success, what risks or quality constraints matter, and what decisions must be recorded?
items:
- id: req-practice-nfr
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: A service must return 95% of search responses within 250 milliseconds under 200 concurrent users. What
    kind of requirement is this primarily?
  options:
  - id: nonfunctional
    text: A non-functional performance requirement.
    correct: true
    feedback: It describes a measurable quality of the service rather than a business action it performs.
  - id: functional
    text: A functional requirement.
    correct: false
    feedback: A functional requirement describes behaviour such as creating, searching or deleting a record.
  - id: implementation
    text: An implementation detail.
    correct: false
    feedback: The response-time target is an externally observable quality constraint, not a specific code choice.
  - id: user-story
    text: A user story.
    correct: false
    feedback: A user story can express the need, but the statement is a measurable quality requirement.
  explanation: Latency and concurrency are performance qualities. They should be measurable and tied to a workload.
- id: req-practice-validation-output
  type: predict-output
  skill: prediction
  difficulty: 2
  prompt: Predict the output after the function applies the acceptance rules for amount and description.
  code: |-
    def create_expense(amount, description):
        text = description.strip()
        if amount <= 0 or not text:
            raise ValueError("invalid expense")
        return {"amount": round(amount, 2), "description": text}

    print(create_expense(12.5, " Lunch "))
  answer: '{''amount'': 12.5, ''description'': ''Lunch''}'
  wrongAnswers:
  - answer: '{''amount'': 12.5, ''description'': '' Lunch ''}'
    feedback: The function strips surrounding whitespace before returning the description.
  - answer: ValueError
    feedback: The amount is positive and the stripped description is not empty.
  - answer: '{''amount'': 12, ''description'': ''Lunch''}'
    feedback: The amount is rounded to two decimal places, but 12.5 remains 12.5.
  explanation: The input is valid. The description is normalised with `strip`, and the amount is rounded to two
    decimal places.
- id: req-master-adr
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: A team chooses PostgreSQL instead of a document database. Six months later, a new engineer asks why.
    Which artifact should preserve the context, alternatives and consequences of that decision?
  options:
  - id: adr
    text: An Architecture Decision Record (ADR).
    correct: true
    feedback: An ADR records one significant decision, its context, alternatives and consequences.
  - id: changelog
    text: A release changelog.
    correct: false
    feedback: A changelog lists user-visible changes, not necessarily the reasoning behind an architecture choice.
  - id: test-report
    text: A test report.
    correct: false
    feedback: A test report gives evidence about tests; it does not preserve the decision context.
  - id: api-doc
    text: An API reference.
    correct: false
    feedback: An API reference documents an interface, not the broader decision and rejected alternatives.
  explanation: An ADR is a short record of one architectural decision. It is superseded by a new ADR when the
    decision changes, rather than silently rewritten.
- id: req-master-testable
  type: true-false
  skill: recognition
  difficulty: 1
  prompt: “The application should be easy to use” is a sufficiently testable acceptance criterion as written.
  answer: false
  explanation: The statement is too vague to verify consistently. Add a user, task, context and observable success
    measure.
- id: req-master-create-expense
  type: code
  skill: implementation
  difficulty: 2
  prompt: 'Implement `create_expense(amount, description)` from these acceptance criteria: amount must be greater
    than zero; description must be a string containing non-whitespace text; trim the description; return a dictionary
    with the rounded amount and cleaned description; otherwise raise `ValueError`.'
  starterCode: |-
    def create_expense(amount, description):
        # Apply the acceptance criteria and return the normalised record.
        pass
  solution: |-
    def create_expense(amount, description):
        if not isinstance(amount, (int, float)) or amount <= 0:
            raise ValueError("amount must be positive")
        if not isinstance(description, str):
            raise ValueError("description must be text")
        cleaned = description.strip()
        if not cleaned:
            raise ValueError("description cannot be blank")
        return {"amount": round(amount, 2), "description": cleaned}
  tests:
  - name: valid input is normalised
    code: |-
      assert create_expense(12.5, " Lunch ") == {"amount": 12.5, "description": "Lunch"}
  - name: zero amount is rejected
    code: |-
      try:
          create_expense(0, "Lunch")
      except ValueError:
          pass
      else:
          raise AssertionError("zero amount must be rejected")
  - name: blank description is rejected
    code: |-
      try:
          create_expense(10, "   ")
      except ValueError:
          pass
      else:
          raise AssertionError("blank description must be rejected")
  hints:
  - Turn each acceptance criterion into one explicit validation or output rule.
  - Check the cleaned description, not only the original string.
  explanation: 'The function makes each acceptance criterion observable: valid amount, text description, trimmed
    content and a predictable result. This is traceability from requirement to implementation and tests.'
- id: req-master-debug-whitespace
  type: debug
  skill: debugging
  difficulty: 2
  prompt: The blank-description check misses strings containing only spaces. Fix the validation so whitespace-only
    descriptions are rejected after normalisation.
  starterCode: |-
    def valid_description(description):
        return description != ""
  solution: |-
    def valid_description(description):
        return isinstance(description, str) and bool(description.strip())
  tests:
  - name: ordinary text is accepted
    code: |-
      assert valid_description("Lunch") is True
  - name: empty text is rejected
    code: |-
      assert valid_description("") is False
  - name: spaces are rejected
    code: |-
      assert valid_description("   ") is False
  hints:
  - An input can be non-empty before normalisation but empty after trimming.
  - Use `strip()` and convert its result to a boolean.
  explanation: The original check only catches the exact empty string. Acceptance criteria should define whether
    whitespace counts as meaningful text, and the implementation must apply that rule.
- id: req-master-write-criteria
  type: explain
  skill: design
  difficulty: 3
  prompt: Write a short user story and three Given/When/Then acceptance criteria for a user exporting their own
    monthly expenses as CSV. Include one functional rule and one security or privacy constraint.
  rubric:
  - Identifies the user, desired capability and reason in the story.
  - Includes observable success and empty-data or invalid-period behaviour.
  - States that a user can export only their own authorised records.
  - Uses concrete outcomes that can be tested rather than vague adjectives.
  modelAnswer: As a signed-in user, I want to export my expenses for a selected month as CSV so that I can analyse
    my spending. Given I have expenses in the selected month, when I request an export, then the response contains
    only those expenses with the documented columns. Given I have no expenses in that month, when I export, then
    I receive a valid CSV containing the header row and no data rows. Given I request another user’s records,
    when the export is processed, then the request is denied and no other user data is returned.
  explanation: A good requirement is testable and includes permissions and failure cases, not only the happy path.
masteryCheck:
  passThreshold: 0.8
  items:
  - req-master-adr
  - req-master-testable
  - req-master-create-expense
  - req-master-debug-whitespace
  - req-master-write-criteria
