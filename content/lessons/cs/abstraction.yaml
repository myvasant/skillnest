cheatsheet: |
  - **Abstraction:** show essential behaviour; hide details the caller does not need.
  - **Encapsulation:** keep state and behaviour together and control changes to preserve invariants.
  - **Interface:** the contract callers rely on; **implementation:** the code behind it.
  - `_name` is an internal-use convention, not enforced privacy.
  - `__name` triggers name mangling to reduce accidental subclass collisions, not to protect secrets.
  - **ABC:** nominal inheritance plus abstract methods; **Protocol:** structural interface checked by static type tools.
  - Aim for small interfaces, high cohesion and low coupling; use functions/modules when a class adds no value.
