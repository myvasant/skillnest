id: cs.abstraction
concept: cs.abstraction
title: Abstraction, Encapsulation and Interfaces
subtitle: Hide changeable details behind clear contracts
estimatedMinutes: 55
reviewedOn: 2026-11-04
summary: >-
  Learn how abstraction reduces the amount of detail a caller must understand, how encapsulation protects
  object invariants, and how interfaces let components work together without depending on concrete
  implementations. Use Python properties, abstract base classes and Protocols without adding unnecessary
  classes or pretending Python has strict private fields.
objectives:
  - Distinguish abstraction, encapsulation, interface and implementation.
  - Design a small public API that hides changeable internal decisions.
  - Use properties and methods to keep object invariants valid.
  - Explain Python's underscore convention and double-underscore name mangling accurately.
  - Compare abstract base classes (ABC) with structural typing through typing.Protocol.
  - Recognise high cohesion, low coupling and cases where a function or module is simpler than a class.
