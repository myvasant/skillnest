id: cs.clean-code
concept: cs.clean-code
title: Clean, Readable Code
subtitle: Names, responsibilities and clear contracts
estimatedMinutes: 40
summary: Learn to write Python that communicates intent through names, focused functions, explicit contracts
  and consistent style. Recognise readability smells without mistaking short code for simple code.
objectives:
- Choose intention-revealing names for functions, variables and booleans.
- Describe a function contract using inputs, outputs, errors and side effects.
- Keep functions focused without splitting code into meaningless fragments.
- Write comments that explain why and docstrings that explain contracts.
- Recognise common readability smells and improve them safely.
sources:
- title: PEP 8 — Style Guide for Python Code
  url: https://peps.python.org/pep-0008/
  publisher: Python Software Foundation
- title: PEP 20 — The Zen of Python
  url: https://peps.python.org/pep-0020/
  publisher: Python Software Foundation
- title: Google Python Style Guide
  url: https://google.github.io/styleguide/pyguide.html
  publisher: Google
- title: Python Tutorial — Defining Functions
  url: https://docs.python.org/3/tutorial/controlflow.html#defining-functions
  publisher: Python Software Foundation
reviewedOn: '2026-11-04'
sections:
- id: why-readable
  title: Why readability is an engineering property
  kind: why
  blocks:
  - type: markdown
    body: 'Code is written once but read many times: during debugging, review, incidents and later feature
      work. **Clean code** makes intent visible so a reader can understand the behaviour without reconstructing
      every detail from syntax.


      Clean code is not a universal aesthetic or a demand for the fewest lines. It is code whose names,
      structure and contracts make correct change easier.'
  - type: callout
    variant: note
    title: Consistency beats personal taste
    body: Follow the conventions of the repository. PEP 8 gives a shared baseline for Python, while tools
      such as Ruff can automate many mechanical checks.
- id: names-contracts
  title: Names and function contracts
  kind: concept
  blocks:
  - type: markdown
    body: 'A name should answer “what does this represent?” Functions usually start with an action verb
      (`load_orders`, `calculate_tax`); booleans often read as questions (`is_valid`, `has_permission`).
      Avoid unexplained abbreviations and names that are only meaningful in the current few lines.


      A function contract describes its purpose, inputs, return value and important errors or side effects.
      Type hints and docstrings help communicate that contract, but they do not replace runtime validation
      when untrusted values are involved.'
- id: function-shape
  title: Keep one clear responsibility per function
  kind: walkthrough
  blocks:
  - type: markdown
    body: A function becomes difficult to reason about when it validates input, reads files, transforms
      data, prints output and updates global state. Split work along meaningful responsibilities, then
      give each helper a name that describes its job. Avoid splitting a simple three-line operation into
      many tiny functions just to satisfy a line limit.
  - type: code
    language: python
    code: "def active_names(users):\n    \"\"\"Return stripped names for active user records.\"\"\"\n\
      \    names = []\n    for user in users:\n        if user[\"active\"]:\n            names.append(user[\"\
      name\"].strip())\n    return names\n\nusers = [\n    {\"name\": \" Ada \", \"active\": True},\n\
      \    {\"name\": \"Lin\", \"active\": False},\n]\nprint(active_names(users))"
    runnable: true
    expectedOutput: '[''Ada'']'
    caption: 'The function name and docstring describe the contract. The body has one job: select and
      normalise names.'
- id: comments-style
  title: Comments, docstrings and formatting
  kind: concept
  blocks:
  - type: markdown
    body: 'Use comments for information that the code cannot easily express: a business rule, a surprising
      constraint, a compatibility workaround or the reason a non-obvious choice was made. A comment that
      says `# add one` above `count += 1` repeats the code and can become stale.


      A docstring belongs to a public module, class or function and explains its contract. PEP 8 formatting
      makes code familiar to Python readers; automated formatters and linters should handle mechanical
      consistency so humans can focus on correctness.'
  - type: callout
    variant: warning
    title: Do not hide complexity behind a clever one-liner
    body: A compact comprehension is useful when it is straightforward. If it contains several conditions,
      side effects or nested expressions, a normal loop with named steps may be clearer.
- id: smells
  title: Recognise common readability smells
  kind: concept
  blocks:
  - type: markdown
    body: 'Look for vague names, long parameter lists, duplicated business rules, deeply nested branches,
      functions with several unrelated jobs, hidden global state and comments that disagree with the implementation.
      A smell is a prompt to investigate, not proof that a rewrite is required.


      Prefer removing duplicated knowledge over building a generic framework for two coincidentally similar
      lines. Keep the simplest design that expresses the actual requirement.'
- id: practice
  title: Practise making intent visible
  kind: practice
  blocks:
  - type: item
    ref: clean-names-mcq
  - type: item
    ref: clean-comments-tf
  - type: item
    ref: clean-pure-predict
  - type: item
    ref: clean-invoice-code
  - type: item
    ref: clean-review-explain
- id: summary
  title: Clean-code checklist
  kind: summary
  blocks:
  - type: markdown
    body: 'Can a new reader understand the name, inputs, output and side effects? Does each function have
      a coherent responsibility? Are invalid inputs handled at a clear boundary? Do comments explain why?
      Is the code consistent with the repository? Could a simple function replace an unnecessary class?


      Make code easy to read first; then use tests and review to make sure it is correct.'
items:
- id: clean-names-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: Which name best communicates that a function returns the number of active accounts?
  options:
  - id: f
    text: '`f(x)`'
    correct: false
    feedback: The name reveals neither the action nor the returned value.
  - id: get_data
    text: '`get_data(items)`'
    correct: false
    feedback: This is better than a single letter but does not say which data is returned.
  - id: count_active_accounts
    text: '`count_active_accounts(accounts)`'
    correct: true
    feedback: The verb and noun make the function purpose and input clear.
  - id: do_stuff
    text: '`do_stuff(accounts)`'
    correct: false
    feedback: This hides the responsibility and forces the reader to inspect the implementation.
  explanation: Names are part of the interface. Choose names that reveal intent and use consistent conventions.
- id: clean-comments-tf
  type: true-false
  skill: recognition
  difficulty: 1
  prompt: A useful comment usually explains why a non-obvious decision exists rather than repeating what
    the next line already says.
  answer: true
  explanation: Comments that merely translate syntax become stale. Explain constraints, surprising trade-offs
    or domain rules; let clear code show the mechanics.
- id: clean-pure-predict
  type: predict-output
  skill: prediction
  difficulty: 2
  prompt: What does this function return for the given input?
  code: "def active_names(users):\n    return [user[\"name\"].strip() for user in users if user[\"active\"\
    ]]\n\nusers = [\n    {\"name\": \" Ada \", \"active\": True},\n    {\"name\": \"Lin\", \"active\"\
    : False},\n    {\"name\": \" Grace \", \"active\": True},\n]\nprint(active_names(users))"
  answer: '[''Ada'', ''Grace'']'
  wrongAnswers:
  - answer: '['' Ada '', ''Lin'', '' Grace '']'
    feedback: Inactive records are filtered out, and the selected names are stripped.
  - answer: '[''Ada'', ''Lin'', ''Grace'']'
    feedback: The condition keeps only records whose active value is true.
  - answer: None
    feedback: The function returns the list created by the comprehension.
  explanation: The list comprehension first filters on `active`, then strips the name for each retained
    record.
- id: clean-invoice-code
  type: code
  skill: implementation
  difficulty: 3
  prompt: Implement `build_invoice(items, tax_rate)`. Each item is a `(description, price)` pair. Return
    a dictionary with `subtotal`, `tax` and `total`, each rounded to two decimals. Reject negative prices
    and tax rates outside 0..1. An empty item list is valid and produces zeros.
  starterCode: "def build_invoice(items, tax_rate):\n    # TODO: validate tax_rate and item prices\n \
    \   # TODO: calculate subtotal, tax and total\n    return {}\n"
  solution: "def build_invoice(items, tax_rate):\n    if not isinstance(tax_rate, (int, float)) or isinstance(tax_rate,\
    \ bool):\n        raise TypeError(\"tax_rate must be numeric\")\n    if not 0 <= tax_rate <= 1:\n\
    \        raise ValueError(\"tax_rate must be between 0 and 1\")\n\n    subtotal = 0.0\n    for description,\
    \ price in items:\n        if not isinstance(price, (int, float)) or isinstance(price, bool):\n  \
    \          raise TypeError(\"price must be numeric\")\n        if price < 0:\n            raise ValueError(\"\
    price cannot be negative\")\n        subtotal += price\n\n    tax = subtotal * tax_rate\n    return\
    \ {\n        \"subtotal\": round(subtotal, 2),\n        \"tax\": round(tax, 2),\n        \"total\"\
    : round(subtotal + tax, 2),\n    }\n"
  tests:
  - name: calculates amounts
    code: 'result = build_invoice([("Book", 12.50), ("Pen", 2.00)], 0.10)

      assert result == {"subtotal": 14.5, "tax": 1.45, "total": 15.95}'
  - name: empty invoice
    code: 'assert build_invoice([], 0.18) == {"subtotal": 0.0, "tax": 0.0, "total": 0.0}'
  - name: rejects negative price
    code: "try:\n    build_invoice([(\"Refund\", -2)], 0.1)\nexcept ValueError:\n    pass\nelse:\n   \
      \ raise AssertionError(\"negative price must be rejected\")"
  - name: rejects invalid rate
    code: "try:\n    build_invoice([(\"Book\", 10)], 1.5)\nexcept ValueError:\n    pass\nelse:\n    raise\
      \ AssertionError(\"tax rate above one must be rejected\")"
  hints:
  - Validate the tax rate before doing calculations.
  - Accumulate prices in a clearly named `subtotal` variable.
  - Return the three named values in one dictionary; use `round(value, 2)`.
  explanation: The implementation uses names that reveal meaning, a direct validation boundary, and one
    obvious calculation path. It is not shorter at any cost; it is easier to read and change.
- id: clean-review-explain
  type: explain
  skill: design
  difficulty: 2
  prompt: A function is only four lines long but uses names like `x`, `d`, and `z`, has three nested conditional
    expressions, and mutates a global list. Explain why line count is a poor measure of readability and
    give three changes that would improve maintainability.
  explanation: Readable code communicates intent and makes behaviour easy to verify. A compact expression
    can hide branches, side effects and assumptions.
  rubric:
  - Explains that short code can still hide complex decisions or side effects.
  - Suggests intention-revealing names and a clear function contract.
  - Suggests removing or controlling global mutable state.
  - Suggests extracting a focused helper or simplifying branches without over-fragmenting.
  modelAnswer: Line count does not measure cognitive effort. I would rename values according to their
    meaning, pass the list as an explicit argument or return a new result instead of mutating global state,
    and replace nested conditional expressions with named intermediate steps or focused branches. I would
    then add tests for the behaviour before making a larger change.
masteryCheck:
  passThreshold: 0.8
  items:
  - clean-names-mcq
  - clean-comments-tf
  - clean-pure-predict
  - clean-invoice-code
  - clean-review-explain
cheatsheet: '- Prefer names that reveal intent.

  - Functions usually use verb phrases; booleans read as questions.

  - State the contract: inputs, return value, errors and side effects.

  - One coherent responsibility per function; avoid both giant functions and needless fragmentation.

  - Comments explain why; docstrings explain public contracts.

  - Follow repository conventions and automate formatting/linting.

  - Shorter code is not automatically clearer.'
