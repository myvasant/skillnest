id: cs.sorting
concept: cs.sorting
title: Sorting Algorithms and Python Sorting
subtitle: Understand quadratic and n log n sorts, stability and the built-in sort
estimatedMinutes: 50
reviewedOn: 2026-11-04
summary: >-
  Compare selection, insertion and merge sort, reason about their time and space costs, understand stability,
  and use Python's built-in stable Timsort with key functions rather than implementing a custom sort in
  production without a specific reason.
objectives:
  - Explain why sorting is useful and how comparison-based sorting works.
  - Trace selection sort and insertion sort on a small list.
  - Explain the O(n squared) and O(n log n) growth trade-offs.
  - Describe merge sort's divide-and-conquer approach and extra memory cost.
  - Explain stability and why it matters when records share a sort key.
  - Use `sorted()` and `list.sort()` with `key` and `reverse`, and distinguish their return behaviour.
sources:
  - title: Sorting Techniques
    url: https://docs.python.org/3/howto/sorting.html
    publisher: Python Software Foundation
  - title: TimeComplexity — Python Wiki
    url: https://wiki.python.org/moin/TimeComplexity
