id: cs.sdlc
concept: cs.sdlc
title: The Software Development Lifecycle
subtitle: From problem discovery to production feedback
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Understand the lifecycle of software work from discovery and requirements through design, implementation,
  verification, release, operation and learning. Compare waterfall, iterative delivery, Agile, Scrum and Kanban
  without treating any process as universal.
objectives:
- Describe the common activities in a software development lifecycle and how they feed one another.
- Distinguish a lifecycle model from a team process or framework.
- Compare sequential and iterative delivery using uncertainty, risk and feedback time.
- Explain how testing, CI/CD and operations shorten the feedback loop.
- Choose a proportionate process for a concrete team and product scenario.
- Identify the release and operational evidence needed for a safe change.
sources:
- title: Manifesto for Agile Software Development
  url: https://agilemanifesto.org/
  publisher: Agile Manifesto authors
- title: The Scrum Guide
  url: https://scrumguides.org/scrum-guide.html
  publisher: Ken Schwaber and Jeff Sutherland
- title: The DevOps Handbook
  url: https://itrevolution.com/product/the-devops-handbook-second-edition/
  publisher: IT Revolution
  note: Use the freely available publisher overview; the book itself is not a required resource.
sections:
- id: why-sdlc
  title: Why software needs a lifecycle
  kind: why
  blocks:
  - type: markdown
    body: Software is not finished when the first version runs. People discover new needs, environments change,
      defects appear, security issues are found and dependencies need updates. The [software development lifecycle](glossary:software-development-lifecycle)
      describes the work that takes an idea through delivery and keeps it useful afterward.
  - type: callout
    variant: note
    title: A lifecycle is a model of work, not a mandatory ceremony
    body: A small script and a safety-critical service need different levels of planning, evidence and release
      control. The same broad activities exist, but their depth should match risk.
- id: lifecycle-loop
  title: The common lifecycle activities
  kind: concept
  blocks:
  - type: markdown
    body: 'A useful high-level loop is:


      1. **Discover and define:** understand the problem, users, constraints and success measures.

      2. **Design:** choose a structure, interfaces and data model.

      3. **Build:** implement a small change.

      4. **Verify:** review, test and check security and quality.

      5. **Release:** make the change available safely.

      6. **Operate:** observe reliability, performance, cost and user outcomes.

      7. **Learn:** use evidence to refine the next requirement.


      These activities overlap. A team may test while building and revise a design after a small experiment.'
  - type: markdown
    body: 'The important idea is traceability: a released change should connect to a real need, a design decision,
      evidence that it works and a way to know whether it works in production.'
- id: process-models
  title: Waterfall, iterative delivery, Agile, Scrum and Kanban
  kind: concept
  blocks:
  - type: markdown
    body: '**Waterfall** organises work into largely sequential phases with major handoffs. It can suit work with
      stable requirements, strong approval gates or expensive physical dependencies, but late feedback makes changes
      costly.


      **Iterative development** delivers a small slice, learns from it and adjusts. The [Agile Manifesto](https://agilemanifesto.org/)
      expresses values such as collaboration and responding to change; it does not say planning or documentation
      are useless.


      **Scrum** is a framework with time-boxed sprints, defined accountabilities and events. **Kanban** focuses
      on visualising flow, limiting work in progress and improving throughput. They are not synonyms for Agile
      and should not be mixed into one vague process label.'
  - type: callout
    variant: misconception
    title: Agile does not mean “no plan”
    body: Agile teams still clarify goals, manage risks, document decisions and test. They plan at a level that
      can adapt as evidence changes.
- id: feedback-and-devops
  title: Feedback, CI/CD and operations
  kind: application
  blocks:
  - type: markdown
    body: 'A short feedback loop means a defect or mistaken assumption is found while the change is still small.
      Automated tests and continuous integration provide fast feedback after a change is proposed. Continuous
      delivery keeps software in a releasable state; deployment automation can release it after the required controls
      pass.


      Operations completes the loop: logs, metrics, traces, support reports and incidents show how the software
      behaves outside the developer machine. DevOps is a set of practices and cultural ideas that connect development
      and operations; it is not simply a job title or a tool.'
  - type: code
    language: python
    code: "REQUIRED_CHECKS = (\"tests\", \"security_scan\", \"rollback_plan\")\n\ndef release_ready(checks):\n\
      \    return all(checks.get(name, False) for name in REQUIRED_CHECKS)\n\nprint(release_ready({\"tests\":\
      \ True, \"security_scan\": True}))\nprint(release_ready({\"tests\": True, \"security_scan\": True, \"rollback_plan\"\
      : True}))"
    runnable: true
    status: verified
    expectedOutput: 'False

      True'
    caption: A simplified release gate fails closed when evidence is missing. Real systems need risk-specific
      controls and human ownership.
  - type: callout
    variant: production
    title: Production is part of the lifecycle
    body: Define how to detect failure, who responds, how to roll back or mitigate, and how to learn from incidents
      before a high-risk release.
- id: scenario-sdlc
  title: Walk through one feature
  kind: walkthrough
  blocks:
  - type: markdown
    body: 'Imagine adding password reset to an existing application. First, ask who can request a reset and what
      happens if an attacker requests it for another person. Design a short-lived, single-use token flow. Implement
      a small vertical slice. Test valid, expired, reused and guessed tokens. Release gradually, monitor success
      and abuse signals, and use support reports to improve the next iteration.


      Notice that the team does not need to finish every possible password feature before learning whether the
      reset flow works. It does need enough security design and tests for the risk involved.'
- id: mistakes-sdlc
  title: Common process mistakes
  kind: mistakes
  blocks:
  - type: markdown
    body: '- **Treating a phase diagram as a guarantee:** a lifecycle model helps organise work; it does not ensure
      quality by itself.

      - **Calling every process Agile:** name the actual practices and explain why they fit the work.

      - **Skipping operations:** a release without monitoring and ownership is an incomplete handoff.

      - **Measuring activity instead of outcomes:** story points or tickets closed do not prove users received
      value.

      - **Making every change a large project:** small, reversible increments usually shorten feedback time.'
  - type: callout
    variant: tip
    title: Scale ceremony to risk
    body: A one-person learning project may need a README, tests and version history. A payment system needs stronger
      review, security evidence, auditability, rollback and operational controls.
- id: practice-sdlc
  title: Practice before the mastery check
  kind: practice
  blocks:
  - type: markdown
    body: '1. Choose a suitable process for a team maintaining a service with unpredictable incidents. Explain
      your choice.

      2. For a new search feature, list one requirement, one test, one release signal and one production metric.

      3. Identify which lifecycle activity is missing when a feature ships but nobody owns alerts or rollback.'
  - type: item
    ref: sdlc-practice-feedback-loop
  - type: item
    ref: sdlc-practice-release-gate
- id: summary-sdlc
  title: Summary and checklist
  kind: summary
  blocks:
  - type: markdown
    body: 'The lifecycle connects problem discovery, requirements, design, implementation, verification, release,
      operation and learning. Waterfall, iterative delivery, Scrum and Kanban organise work differently; choose
      based on uncertainty, risk and flow. CI/CD shortens feedback, while operations reveals whether the change
      works for real users.


      Before a release, ask: what need does it satisfy, what evidence says it works, what risk remains, how will
      we detect failure, and how will we recover?'
items:
- id: sdlc-practice-feedback-loop
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: A team wants to discover whether a new reporting feature solves the customer problem before spending
    six months building it. Which approach best supports that goal?
  options:
  - id: small-increments
    text: Deliver a small, testable increment and use feedback to decide the next step.
    correct: true
    feedback: Short feedback loops expose incorrect assumptions before they become expensive.
  - id: big-design-upfront
    text: Complete every design document and implementation before showing users anything.
    correct: false
    feedback: This delays feedback and makes it harder to discover whether the team solved the right problem.
  - id: skip-tests
    text: Release the entire feature quickly and let users report defects.
    correct: false
    feedback: Fast feedback does not mean abandoning testing or release safeguards.
  - id: no-plan
    text: Avoid planning because iterative teams should never make plans.
    correct: false
    feedback: Iteration still needs goals, constraints and a plan for the next slice of work.
  explanation: Iterative delivery reduces the time between an assumption and evidence about whether it is correct.
- id: sdlc-practice-release-gate
  type: predict-output
  skill: prediction
  difficulty: 2
  prompt: Which two release decisions are printed? A release needs every required check, not merely one successful
    check.
  code: "required = (\"tests\", \"security\", \"rollback\")\ndef ready(checks):\n    return all(checks.get(name,\
    \ False) for name in required)\n\nprint(ready({\"tests\": True, \"security\": True}))\nprint(ready({\"tests\"\
    : True, \"security\": True, \"rollback\": True}))"
  answer: 'False

    True'
  wrongAnswers:
  - answer: 'True

      True'
    feedback: The first mapping omits the rollback check. Missing required evidence must not silently pass.
  - answer: 'False

      False'
    feedback: The second mapping supplies all three required checks as true.
  - answer: 'True

      False'
    feedback: '`all` returns true only when every required value is true.'
  explanation: The first mapping is missing `rollback`, so `get` supplies False. The second contains all required
    checks.
- id: sdlc-master-choose-process
  type: mcq
  skill: transfer
  difficulty: 2
  prompt: A small operations team receives production incidents continuously. Work arrives unpredictably and needs
    a visible queue with limits on how much is in progress. Which approach is the best fit?
  options:
  - id: kanban
    text: A Kanban-style flow with explicit work-in-progress limits.
    correct: true
    feedback: Kanban is designed around visualising and limiting continuous flow.
  - id: fixed-sprints-only
    text: A strict sprint process that refuses all urgent work until the next sprint.
    correct: false
    feedback: A fixed sprint commitment can be awkward when urgent operational work is continuous.
  - id: waterfall
    text: A one-time sequence of phases with a single final handoff.
    correct: false
    feedback: A one-time phase sequence is a poor match for continuous incoming work.
  - id: no-process
    text: No shared process or visible work queue.
    correct: false
    feedback: Without a shared queue, work and capacity become difficult to coordinate.
  explanation: Process choice follows the work. Kanban can make continuous flow and work-in-progress visible;
    it is not a universal replacement for every approach.
- id: sdlc-master-release-ready
  type: code
  skill: implementation
  difficulty: 2
  prompt: Implement `release_ready(checks)`. Return True only when `tests`, `security_scan` and `rollback_plan`
    are all present and truthy. Missing keys must fail closed.
  starterCode: "def release_ready(checks):\n    # Require all three release gates.\n    pass"
  solution: "def release_ready(checks):\n    required = (\"tests\", \"security_scan\", \"rollback_plan\")\n  \
    \  return all(checks.get(name, False) for name in required)"
  tests:
  - name: all gates pass
    code: 'assert release_ready({"tests": True, "security_scan": True, "rollback_plan": True}) is True'
  - name: missing gate fails closed
    code: 'assert release_ready({"tests": True, "security_scan": True}) is False'
  - name: false gate blocks release
    code: 'assert release_ready({"tests": True, "security_scan": False, "rollback_plan": True}) is False'
  hints:
  - List the required gate names once.
  - Use `all(...)` and `dict.get(name, False)` so a missing key is treated as not approved.
  explanation: 'Release readiness is a conjunction: every required gate must pass. The function is a simplified
    example, not a complete release process.'
- id: sdlc-master-debug-any-gate
  type: debug
  skill: debugging
  difficulty: 2
  prompt: This release check allows deployment when any one gate passes. Change it so every required gate must
    pass, and keep missing keys as failures.
  starterCode: "def release_ready(checks):\n    required = (\"tests\", \"security_scan\", \"rollback_plan\")\n\
    \    return any(checks.get(name, False) for name in required)"
  solution: "def release_ready(checks):\n    required = (\"tests\", \"security_scan\", \"rollback_plan\")\n  \
    \  return all(checks.get(name, False) for name in required)"
  tests:
  - name: one passing gate is not enough
    code: 'assert release_ready({"tests": True, "security_scan": False, "rollback_plan": False}) is False'
  - name: all passing gates allow release
    code: 'assert release_ready({"tests": True, "security_scan": True, "rollback_plan": True}) is True'
  hints:
  - Ask whether the rule is “at least one” or “every required gate”.
  - Replace `any` with `all`.
  explanation: '`any` is true when one item is true. A release gate that requires every check must use `all` and
    fail closed for missing checks.'
- id: sdlc-master-map-lifecycle
  type: explain
  skill: design
  difficulty: 2
  prompt: A team is building password reset. Describe how the work moves from the initial problem to production
    and back into improvement. Include at least one feedback point and one operational concern.
  rubric:
  - Clarifies the user problem and constraints before implementation.
  - Mentions design, implementation and verification with testable acceptance criteria.
  - Describes a controlled release and a way to observe production behaviour.
  - Explains how user or operational feedback changes the next iteration.
  modelAnswer: First clarify who needs password reset and what abuse, identity and expiry constraints apply. Design
    the token flow and write acceptance criteria. Implement it in a small change, test normal, expired and reused-token
    cases, then release behind appropriate monitoring and rollback controls. Watch reset success, failure and
    abuse signals; use support feedback and incidents to improve the next iteration.
  explanation: The lifecycle is a feedback loop, not merely a one-way checklist. Testing and operations inform
    future requirements.
- id: sdlc-master-agile-docs
  type: true-false
  skill: recognition
  difficulty: 1
  prompt: Because Agile values working software over comprehensive documentation, an Agile team should avoid writing
    requirements or recording design decisions.
  answer: false
  explanation: The Agile Manifesto values working software more than comprehensive documentation; it does not
    say documentation has no value. Teams should write useful, current documentation in proportion to risk and
    need.
masteryCheck:
  passThreshold: 0.8
  items:
  - sdlc-master-choose-process
  - sdlc-master-release-ready
  - sdlc-master-debug-any-gate
  - sdlc-master-map-lifecycle
  - sdlc-master-agile-docs
