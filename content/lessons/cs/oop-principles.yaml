id: cs.oop-principles
concept: cs.oop-principles
title: Object-Oriented Design Principles
subtitle: Composition, polymorphism and responsibilities
estimatedMinutes: 50
summary: Learn how to use encapsulation, abstraction, polymorphism and composition to organise Python
  programs around clear responsibilities. Practise choosing between a class, a function, an inheritance
  relationship and a collaborator instead of treating OOP as a goal in itself.
objectives:
- Explain encapsulation, abstraction, polymorphism and composition in your own words.
- Use composition to provide replaceable collaborators.
- Use duck typing safely by defining the behaviour a collaborator must provide.
- Choose inheritance only when a subtype can honour its parent contract.
- Evaluate cohesion, coupling and responsibility boundaries.
- Recognise when a function or module is simpler than a class.
sources:
- title: The Python Tutorial — Classes
  url: https://docs.python.org/3.14/tutorial/classes.html
  publisher: Python Software Foundation
  version: '3.14'
- title: Python Design Patterns — Composition over inheritance
  url: https://python-patterns.guide/gang-of-four/composition-over-inheritance/
  publisher: Python Patterns Guide
- title: PEP 8 — Style Guide for Python Code
  url: https://peps.python.org/pep-0008/
  publisher: Python Software Foundation
reviewedOn: '2026-11-04'
sections:
- id: why-objects
  title: Why object-oriented design exists
  kind: why
  blocks:
  - type: markdown
    body: 'Object-oriented programming (OOP) is a way to organise code around objects: values that combine
      **state** (data) with **behaviour** (operations). It is useful when a part of a program has identity,
      rules that must stay true, or behaviour that varies behind a stable interface.


      OOP is not a requirement for every Python program. A short transformation may be clearer as a function.
      The design question is not “How can I make a class?” but “What should own this state and responsibility?”'
- id: principles
  title: Four ideas you will use repeatedly
  kind: concept
  blocks:
  - type: markdown
    body: 'These ideas overlap, but each answers a different design question:


      - **Encapsulation:** who owns state, and how do we protect its valid rules?

      - **Abstraction:** what small contract should a caller see?

      - **Polymorphism:** can different objects respond to the same operation in their own way?

      - **Composition:** can we build a behaviour by combining smaller collaborators?


      A class is one tool for expressing these ideas. Modules, functions, protocols and plain data structures
      are also part of good Python design.'
- id: composition-walkthrough
  title: 'Composition: give an object collaborators'
  kind: walkthrough
  blocks:
  - type: markdown
    body: Suppose a report service must format data and deliver the result. Formatting and delivery are
      separate reasons for change, so keep them in separate collaborators. The service coordinates them
      rather than inheriting from a formatter or sender.
  - type: code
    language: python
    code: "class CsvFormatter:\n    def format(self, rows):\n        return \"\\n\".join(\",\".join(row)\
      \ for row in rows)\n\nclass ConsoleSender:\n    def send(self, message):\n        print(f\"SENT:\
      \ {message}\")\n\nclass ReportService:\n    def __init__(self, formatter, sender):\n        self.formatter\
      \ = formatter\n        self.sender = sender\n\n    def publish(self, rows):\n        message = self.formatter.format(rows)\n\
      \        self.sender.send(message)\n\nservice = ReportService(CsvFormatter(), ConsoleSender())\n\
      service.publish([[\"name\", \"score\"], [\"Asha\", \"92\"]])"
    runnable: true
    expectedOutput: 'SENT: name,score

      Asha,92'
    caption: The service is assembled from two collaborators. A different formatter or sender can be supplied
      without rewriting ReportService.
- id: polymorphism
  title: Polymorphism and duck typing
  kind: concept
  blocks:
  - type: markdown
    body: '**Polymorphism** means one caller can use different implementations through a common operation.
      Python often uses **duck typing**: if an object provides the methods the code needs, the code can
      use it.


      This can be simpler than forcing every implementation to inherit from one base class. A `typing.Protocol`
      can document the expected shape for static type checkers, but it does not automatically enforce
      business rules at runtime.'
  - type: callout
    variant: warning
    title: Do not confuse “has the method” with “is correct”
    body: Duck typing makes substitution possible; it does not prove that an implementation is reliable.
      Define and test the behaviour contract, including error cases.
- id: inheritance-tradeoffs
  title: When inheritance helps — and when it hurts
  kind: concept
  blocks:
  - type: markdown
    body: 'Inheritance expresses an **is-a** relationship: a specialised object can safely stand in for
      its parent without breaking the parent’s promises. It is useful for a stable shared contract or
      genuinely shared behaviour.


      Prefer composition when capabilities vary independently, when a class needs several behaviours,
      or when subclasses keep overriding parent methods to work around assumptions. Deep hierarchies make
      changes travel through many files.'
  - type: callout
    variant: misconception
    title: A class is not automatically better than a function
    body: Use a function for a stateless operation, a module for a cohesive group of functions, and a
      class when state plus behaviour or interchangeable implementations provide a real benefit.
- id: cohesion-coupling
  title: Cohesion, coupling and responsibility
  kind: concept
  blocks:
  - type: markdown
    body: '**Cohesion** asks whether the parts of one module or class belong together. **Coupling** asks
      how strongly it depends on other parts. A useful direction is high cohesion and low coupling: keep
      related behaviour together and depend on as little outside detail as practical.


      A class that reads files, sends email, formats HTML, writes SQL and calculates discounts has too
      many reasons to change. Split responsibilities only when the boundaries make the code easier to
      understand; do not create a class for every sentence in a requirement.'
- id: practice
  title: Check your design judgement
  kind: practice
  blocks:
  - type: item
    ref: oop-composition-mcq
  - type: item
    ref: oop-polymorphism-tf
  - type: item
    ref: oop-polymorphism-predict
  - type: item
    ref: oop-cart-policy-code
  - type: item
    ref: oop-design-explain
- id: summary
  title: Design checklist
  kind: summary
  blocks:
  - type: markdown
    body: 'Before adding a class or inheritance relationship, ask: what state does it own? What invariant
      must it protect? What contract do callers need? Which behaviour varies? Can a collaborator provide
      that behaviour? Is a function or module enough?


      In a review, explain the trade-off: a design is not good because it uses OOP; it is good when its
      responsibilities and dependencies make change safer.'
items:
- id: oop-composition-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: A notification service must send messages by email today and by SMS later. What is the most
    flexible starting design?
  options:
  - id: inherit
    text: Make EmailNotifier the parent of SMSNotifier and inherit all email behaviour.
    correct: false
    feedback: SMS is not a kind of email. This models the wrong relationship and couples the two implementations.
  - id: compose
    text: Give the service a sender object that provides a small `send(message)` operation.
    correct: true
    feedback: The service depends on the behaviour it needs. Different sender objects can provide that
      behaviour without an inheritance hierarchy.
  - id: global
    text: Put the email client in a global variable and replace it when SMS is needed.
    correct: false
    feedback: Global mutable configuration hides dependencies and makes tests and parallel use harder.
  - id: branch
    text: Add an `if channel == ...` branch to every function that sends a message.
    correct: false
    feedback: Scattered conditionals duplicate policy and make every new channel require changes in many
      places.
  explanation: Composition builds a component from smaller collaborators. The service needs a sender capability,
    not an email-specific parent class.
- id: oop-polymorphism-tf
  type: true-false
  skill: recognition
  difficulty: 1
  prompt: In Python, two unrelated classes can be used polymorphically when both provide the operations
    a caller expects.
  answer: true
  explanation: 'Python commonly uses duck typing: code can work with objects based on the behaviour they
    provide, without requiring a shared parent class.'
- id: oop-polymorphism-predict
  type: predict-output
  skill: prediction
  difficulty: 2
  prompt: What does this program print when each formatter provides the same `format` operation?
  code: "class Upper:\n    def format(self, text):\n        return text.upper()\n\nclass Bracket:\n  \
    \  def format(self, text):\n        return f\"[{text}]\"\n\ndef render(formatter, value):\n    return\
    \ formatter.format(value)\n\nprint(render(Upper(), \"ready\"))\nprint(render(Bracket(), \"ready\"\
    ))"
  answer: 'READY

    [ready]'
  wrongAnswers:
  - answer: 'ready

      ready'
    feedback: Both objects return the original value. Their methods implement different behaviour.
  - answer: AttributeError
    feedback: Both objects define `format`, so the caller can use either one.
  - answer: 'READY

      READY'
    feedback: Only the Upper implementation changes the text to uppercase.
  explanation: The caller relies on the shared operation name, not on a shared class. Each object supplies
    its own implementation.
- id: oop-cart-policy-code
  type: code
  skill: implementation
  difficulty: 3
  prompt: Implement a `Cart` that receives a discount policy object. The policy must provide `discount_for(subtotal)`.
    `Cart.total()` must reject negative item prices, calculate the subtotal, ask the policy for a discount,
    reject a discount below 0 or above the subtotal, and return the final amount rounded to two decimals.
    Do not make `Cart` inherit from a particular policy class.
  starterCode: "class Cart:\n    def __init__(self, prices, discount_policy):\n        self.prices = prices\n\
    \        self.discount_policy = discount_policy\n\n    def total(self):\n        # TODO: validate\
    \ prices, calculate subtotal, apply the collaborator\n        return 0\n\n\nclass NoDiscount:\n  \
    \  def discount_for(self, subtotal):\n        return 0\n"
  solution: "class Cart:\n    def __init__(self, prices, discount_policy):\n        self.prices = prices\n\
    \        self.discount_policy = discount_policy\n\n    def total(self):\n        if any(price < 0\
    \ for price in self.prices):\n            raise ValueError(\"prices cannot be negative\")\n      \
    \  subtotal = sum(self.prices)\n        discount = self.discount_policy.discount_for(subtotal)\n \
    \       if discount < 0 or discount > subtotal:\n            raise ValueError(\"discount must be between\
    \ zero and subtotal\")\n        return round(subtotal - discount, 2)\n\n\nclass NoDiscount:\n    def\
    \ discount_for(self, subtotal):\n        return 0\n"
  tests:
  - name: no discount
    code: 'cart = Cart([10, 20], NoDiscount())

      assert cart.total() == 30.0'
  - name: percentage policy
    code: "class TenPercent:\n    def discount_for(self, subtotal):\n        return subtotal * 0.10\n\n\
      assert Cart([10, 20], TenPercent()).total() == 27.0"
  - name: invalid price
    code: "try:\n    Cart([10, -1], NoDiscount()).total()\nexcept ValueError:\n    pass\nelse:\n    raise\
      \ AssertionError(\"negative price should fail\")"
  - name: invalid policy output
    code: "class InvalidPolicy:\n    def discount_for(self, subtotal):\n        return subtotal + 1\n\n\
      try:\n    Cart([10], InvalidPolicy()).total()\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError(\"\
      excessive discount should fail\")"
  hints:
  - Keep the policy as a collaborator stored on the cart; do not subclass Cart for each discount type.
  - Validate the subtotal inputs before calling the policy.
  - Check the policy result against the range 0 <= discount <= subtotal.
  explanation: The Cart owns cart calculation and delegates the variable discount decision to a collaborator.
    This is composition. Any object with the required method can be supplied, so the design is polymorphic
    without a forced inheritance tree.
- id: oop-design-explain
  type: explain
  skill: design
  difficulty: 3
  prompt: A team proposes `Animal -> Mammal -> Dog -> GuideDog` classes for a delivery application. Explain
    why a real-world taxonomy may be a poor software model, and describe when composition is a better
    fit.
  explanation: Good object-oriented design models the responsibilities and variation the software actually
    needs. A taxonomy can create fragile inheritance when the domain changes or when one object needs
    several capabilities.
  rubric:
  - Explains that inheritance represents an is-a relationship and creates parent-child coupling.
  - Identifies the actual behaviours the application needs rather than relying on labels from the real
    world.
  - Describes composition as assembling an object from collaborators or capabilities.
  - Notes that a function or module may be simpler when state and polymorphism are unnecessary.
  modelAnswer: A delivery system may care that a vehicle can carry a parcel, report its location and calculate
    a route. Those are capabilities, not necessarily a useful Animal-style family tree. I would model
    the delivery service around small collaborators such as a route planner and location provider, and
    let different vehicle objects provide the required operations. Inheritance is appropriate when the
    subtype genuinely preserves the parent contract; composition is better when behaviour varies independently
    or a deep hierarchy would couple unrelated decisions.
masteryCheck:
  passThreshold: 0.8
  items:
  - oop-composition-mcq
  - oop-polymorphism-tf
  - oop-polymorphism-predict
  - oop-cart-policy-code
  - oop-design-explain
cheatsheet: '- **Encapsulation:** keep state and its validity rules together.

  - **Abstraction:** expose a small useful contract.

  - **Polymorphism:** use one operation with different implementations.

  - **Duck typing:** rely on provided behaviour, not necessarily a shared parent.

  - **Composition:** assemble behaviour from collaborators (“has-a”).

  - **Inheritance:** model a safe “is-a” substitution, not just code reuse.

  - Aim for high cohesion and low coupling.

  - A function or module is often the best design for simple stateless work.'
