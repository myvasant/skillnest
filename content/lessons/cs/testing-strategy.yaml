id: cs.testing-strategy
concept: cs.testing-strategy
title: Testing Strategy
subtitle: Choose the right boundary and build trustworthy feedback
estimatedMinutes: 55
summary: Learn the roles of unit, integration and end-to-end tests; apply Arrange–Act–Assert and red–green–refactor;
  choose test doubles carefully; and understand coverage, determinism and flaky tests.
objectives:
- Distinguish unit, integration and end-to-end tests by the boundary they exercise.
- Use the test pyramid as a feedback-cost heuristic rather than a rigid rule.
- Structure tests with Arrange, Act and Assert.
- Explain the red–green–refactor TDD cycle.
- Choose between a stub, fake and mock based on the behaviour under test.
- Explain what coverage can and cannot prove.
- Design deterministic tests for normal, boundary and failure cases.
