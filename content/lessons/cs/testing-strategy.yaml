sections:
- id: why-testing
  title: Why a test strategy matters
  kind: why
  blocks:
  - type: markdown
    body: 'A **test** is executable evidence about a behaviour. Tests help detect regressions: defects
      introduced when code changes. A test strategy decides which behaviours to check, at what boundaries,
      and how to keep the suite trustworthy.


      The goal is not the largest test count. The goal is fast, meaningful feedback that gives engineers
      confidence to change the system.'
- id: test-levels
  title: Unit, integration and end-to-end tests
  kind: concept
  blocks:
  - type: markdown
    body: 'The names describe the boundary under test:


      - **Unit test:** checks a small unit (often a function or class) with collaborators controlled or
      isolated. It should be fast and focused.

      - **Integration test:** checks that components work together, such as repository code with a real
      database or an API with its authentication middleware.

      - **End-to-end (E2E) test:** drives a complete user-visible journey through the system, often through
      a browser or public API.


      These levels overlap in practice. Label a test by the real boundary it exercises, not by the test
      framework used.'
- id: pyramid
  title: The test pyramid is a cost heuristic
  kind: concept
  blocks:
  - type: markdown
    body: 'A common strategy uses many fast unit tests, fewer integration tests and a small number of
      end-to-end tests. The lower layers provide quick, precise feedback; the upper layer confirms that
      critical pieces work together from the user’s perspective.


      This is a heuristic, not a law. A system with complex database behaviour may need substantial integration
      coverage. Avoid a test suite where every tiny rule is checked only through a slow browser journey.'
- id: aaa
  title: Arrange, Act, Assert
  kind: walkthrough
  blocks:
  - type: markdown
    body: 'A readable test usually has three visible parts: **Arrange** the input and dependencies, **Act**
      by calling the behaviour, and **Assert** the observable result. Test normal cases, boundaries and
      failure behaviour.'
  - type: code
    language: python
    code: "def apply_discount(total, rate):\n    if total < 0 or not 0 <= rate <= 1:\n        raise ValueError(\"\
      invalid total or rate\")\n    return round(total * (1 - rate), 2)\n\n# Arrange\nsubtotal = 80.0\n\
      rate = 0.25\n\n# Act\nresult = apply_discount(subtotal, rate)\n\n# Assert\nassert result == 60.0\n\
      assert apply_discount(0, 0.5) == 0.0\nprint(\"discount checks passed\")"
    runnable: true
    expectedOutput: discount checks passed
    caption: The test data, operation and expected behaviour are explicit. The same function can be tested
      without files, a database or network access.
- id: tdd
  title: 'Test-driven development: red, green, refactor'
  kind: concept
  blocks:
  - type: markdown
    body: '**TDD** is a short feedback cycle:


      1. **Red:** write a small test for the next behaviour and see it fail for the expected reason.

      2. **Green:** write the simplest implementation that makes it pass.

      3. **Refactor:** improve the design while keeping the tests green.


      The failing test proves that the test can detect the missing behaviour. If it passes before the
      implementation exists, check whether it actually exercises the requirement.'
- id: doubles
  title: Test doubles and isolation
  kind: concept
  blocks:
  - type: markdown
    body: 'A test double replaces a dependency during a test:


      - A **stub** returns canned values so the test can control a dependency’s response.

      - A **fake** is a lightweight working implementation, such as an in-memory repository.

      - A **mock** records or verifies interactions, such as whether a notification was sent once.


      Use the simplest double that makes the behaviour clear. Mocking every internal call can make tests
      brittle: they fail when implementation details change even though the public behaviour remains correct.'
- id: quality
  title: Determinism, coverage and flaky tests
  kind: concept
  blocks:
  - type: markdown
    body: 'A valuable test is independent, repeatable and focused on observable behaviour. Control time,
      randomness, environment variables and external services. Clean up temporary files and database state.


      **Code coverage** tells you which lines or branches executed. It does not tell you whether the assertions
      were strong. A line can run without its result being checked. A **flaky test** sometimes passes
      and sometimes fails without a relevant code change; treat it as a reliability defect, not harmless
      noise.'
- id: practice
  title: Test your understanding
  kind: practice
  blocks:
  - type: item
    ref: testing-levels-mcq
  - type: item
    ref: testing-coverage-tf
  - type: item
    ref: testing-assert-predict
  - type: item
    ref: testing-parse-port-code
  - type: item
    ref: testing-double-explain
- id: summary
  title: Testing strategy checklist
  kind: summary
  blocks:
  - type: markdown
    body: 'For each important behaviour, ask: what is the public contract? Which normal, boundary and
      failure cases matter? Can a fast unit test cover the rule? Which real component boundary needs an
      integration test? Which user journey deserves an E2E test? Are external dependencies controlled?


      Use coverage to find unexecuted code, not as a correctness score. Keep tests deterministic and avoid
      mocking implementation details.'
items:
- id: testing-levels-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: A test creates a real temporary SQLite database, runs repository code against it, and checks
    the saved row. Which test level is this?
  options:
  - id: unit
    text: 'Unit test: it checks one function in isolation.'
    correct: false
    feedback: The database and repository are integrated, so the test checks a component boundary.
  - id: integration
    text: 'Integration test: it checks that multiple components work together.'
    correct: true
    feedback: A real database plus repository code is an integration boundary.
  - id: e2e
    text: 'End-to-end test: it drives the entire product as a user would.'
    correct: false
    feedback: This does not exercise the whole user journey or UI.
  - id: static
    text: 'Static analysis: it checks code without running it.'
    correct: false
    feedback: The test executes the program and checks its result.
  explanation: Test levels describe the boundary being exercised. A real database integrated with repository
    code is an integration test.
- id: testing-coverage-tf
  type: true-false
  skill: recognition
  difficulty: 1
  prompt: If a test suite reports 100% line coverage, every important behaviour and edge case is proven
    correct.
  answer: false
  explanation: Coverage reports which lines executed. It does not prove assertions are meaningful or that
    important inputs and outcomes were checked.
- id: testing-assert-predict
  type: predict-output
  skill: prediction
  difficulty: 2
  prompt: What happens when this test code runs?
  code: "def clamp(value, low, high):\n    return max(low, min(value, high))\n\nassert clamp(12, 0, 10)\
    \ == 10\nassert clamp(-2, 0, 10) == 0\nprint(\"2 checks passed\")"
  answer: 2 checks passed
  wrongAnswers:
  - answer: AssertionError
    feedback: Both values are clamped to the nearest boundary.
  - answer: None
    feedback: The print statement runs after both assertions pass.
  - answer: '12

      -2'
    feedback: Assertions do not print their compared values.
  explanation: The two assertions verify upper and lower boundary behaviour. Successful assertions produce
    no output, so the final print runs.
- id: testing-parse-port-code
  type: code
  skill: implementation
  difficulty: 3
  prompt: Implement `parse_port(value)`. Accept an integer or a string containing decimal digits, return
    an integer from 1 through 65535, and reject booleans, floats, empty strings, non-digits and out-of-range
    values with `ValueError`. Use a small function that can be tested without network access.
  starterCode: "def parse_port(value):\n    # TODO: reject bool and unsupported types\n    # TODO: parse\
    \ decimal digits and enforce 1..65535\n    return 0\n"
  solution: "def parse_port(value):\n    if isinstance(value, bool):\n        raise ValueError(\"port\
    \ must be an integer or digit string\")\n    if isinstance(value, int):\n        port = value\n  \
    \  elif isinstance(value, str) and value.isdecimal():\n        port = int(value)\n    else:\n    \
    \    raise ValueError(\"port must be an integer or digit string\")\n    if not 1 <= port <= 65535:\n\
    \        raise ValueError(\"port must be between 1 and 65535\")\n    return port\n"
  tests:
  - name: integer input
    code: assert parse_port(443) == 443
  - name: string input
    code: assert parse_port("8080") == 8080
  - name: reject boolean
    code: "try:\n    parse_port(True)\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError(\"\
      bool must be rejected\")"
  - name: reject float
    code: "try:\n    parse_port(80.0)\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError(\"\
      float must be rejected\")"
  - name: reject boundaries
    code: "for value in (0, 65536, \"\", \"80/tcp\"):\n    try:\n        parse_port(value)\n    except\
      \ ValueError:\n        continue\n    raise AssertionError(f\"{value!r} should be rejected\")"
  hints:
  - Check bool before int because bool is a subclass of int in Python.
  - For strings, require decimal digits before calling int().
  - Check the inclusive range after conversion.
  explanation: A small pure function has a clear input/output contract and no network dependency. Tests
    cover accepted types, rejected types and both range boundaries.
- id: testing-double-explain
  type: explain
  skill: design
  difficulty: 3
  prompt: A unit test for an email service sends a real email every time it runs. Explain the risks and
    compare a fake, a stub and a mock. When would you still need an integration test?
  explanation: Tests should be deterministic, fast and safe to repeat. Test doubles isolate a unit from
    slow or externally visible dependencies, but they cannot prove the real integration works.
  rubric:
  - Identifies external side effects, network dependence, cost or nondeterminism.
  - Explains a fake as a lightweight working substitute, a stub as a source of canned responses, and a
    mock as an object used to verify interactions.
  - Explains that excessive mocking can test assumptions rather than real behaviour.
  - States that an integration test should verify the real adapter/service boundary in a controlled environment.
  modelAnswer: Sending a real email makes the unit test slow, flaky and potentially harmful. A stub can
    return a predetermined provider response; a fake can store messages in memory; a mock can verify that
    the service requested a send with the expected arguments. The unit test should use one of these to
    check its own behaviour. A separate integration test should exercise the real email adapter against
    a sandbox or controlled test server to verify configuration, protocol handling and response mapping.
masteryCheck:
  passThreshold: 0.8
  items:
  - testing-levels-mcq
  - testing-coverage-tf
  - testing-assert-predict
  - testing-parse-port-code
  - testing-double-explain
cheatsheet: '- Unit tests check a small unit; integration tests check component boundaries; E2E tests
  check user journeys.

  - Prefer many fast tests and fewer slow broad tests, adjusting to the system’s risks.

  - Arrange → Act → Assert.

  - TDD: Red → Green → Refactor.

  - Stub: canned response; Fake: lightweight working substitute; Mock: verifies interactions.

  - Coverage measures execution, not assertion quality.

  - Control time, randomness, state and external services to avoid flaky tests.'
