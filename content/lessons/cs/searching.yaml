id: cs.searching
concept: cs.searching
title: Linear and Binary Search
subtitle: From checking everything to halving the problem
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Linear search checks items one by one and works on any data in O(n). Binary search needs sorted data
  and halves the remaining range at every step, finding an item among a million in about 20 comparisons —
  if you get its loop invariant exactly right. Learn both, the off-by-one traps, the bisect module, and
  when sorting first pays off.
objectives:
  - Implement linear search and state its best-case and worst-case cost.
  - Implement iterative binary search on a sorted list and trace lo, hi and mid through it.
  - State a loop invariant for binary search and keep the loop condition and updates consistent with it.
  - Use bisect_left, bisect_right and insort for lookups, insertion points and range counts.
  - Decide, with numbers, whether sorting first, a set, or a single linear scan is the right choice.
  - Apply binary search to a monotonic yes/no question, not only to a list.
