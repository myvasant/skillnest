    solution: |
      def binary_search(items, target):
          lo, hi = 0, len(items) - 1
          while lo <= hi:
              mid = (lo + hi) // 2
              if items[mid] == target:
                  return mid
              elif items[mid] < target:
                  lo = mid + 1
              else:
                  hi = mid - 1
          return -1

      print(binary_search([4, 9, 16, 25, 36], 25))
    expectedOutput: |
      3
    tests:
      - name: finds present items
        code: |
          data = [4, 9, 16, 25, 36]
          for i, x in enumerate(data):
              got = binary_search(data, x)
              assert got == i, f"binary_search({data}, {x}) should be {i}, got {got!r}."
      - name: absent items give -1
        code: |
          for x in [0, 10, 40]:
              assert binary_search([4, 9, 16, 25, 36], x) == -1, f"binary_search(..., {x}) should be -1."
          assert binary_search([], 3) == -1, "An empty list should give -1."
      - name: keeps the halving loop
        code: |
          assert uses("While") and "//" in source, "Keep the while loop and compute mid with floor division //."
          assert not calls("index"), "Fix the binary search rather than replacing it with list.index()."
