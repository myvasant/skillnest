  - id: m-max-passes
    type: mcq
    skill: recognition
    prompt: At most how many passes of the loop does binary search need on a sorted list of 1,000 items?
    explanation: >-
      Each pass halves the range: 1000 → 500 → 250 → 125 → 62 → 31 → 15 → 7 → 3 → 1. That is at most
      ⌊log₂ 1000⌋ + 1 = 10 passes.
    options:
      - id: a
        text: About 10
        correct: true
        feedback: Right — 2¹⁰ = 1024 ≥ 1000.
      - id: b
        text: About 500
        feedback: That is the average for linear search. Binary search halves the range every pass.
      - id: c
        text: About 32
        feedback: "32 is roughly √1000. Binary search grows with log₂ n, which is much smaller: about 10."
      - id: d
        text: "1000"
        feedback: That is linear search's worst case.

