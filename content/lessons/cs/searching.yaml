  - id: m-unsorted-tf
    type: true-false
    skill: recognition
    prompt: "True or false: if you run binary search on an unsorted list, Python raises an error."
    answer: false
    explanation: >-
      Nothing checks the order. The search compares with middle items and discards halves as usual, so it
