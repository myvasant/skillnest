  - id: m-count-in-range
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `count_in_range(sorted_items, low, high)` that returns how many items x satisfy
      `low <= x <= high`. For `[1, 3, 3, 5, 8, 13]` with low = 3 and high = 8 the answer is 4.

      Use the `bisect` module so it runs in O(log n); the tests count comparisons.
    starterCode: |
      import bisect

      def count_in_range(sorted_items, low, high):
          pass

      print(count_in_range([1, 3, 3, 5, 8, 13], 3, 8))
    solution: |
      import bisect

      def count_in_range(sorted_items, low, high):
          start = bisect.bisect_left(sorted_items, low)
          end = bisect.bisect_right(sorted_items, high)
          return max(0, end - start)

      print(count_in_range([1, 3, 3, 5, 8, 13], 3, 8))
    expectedOutput: |
      4
    tests:
      - name: counts items in the range
        code: |
          data = [1, 3, 3, 5, 8, 13]
          for low, high, expected in [(3, 8, 4), (0, 100, 6), (4, 4, 0), (3, 3, 2), (14, 20, 0), (-5, 0, 0), (13, 13, 1)]:
              got = count_in_range(data, low, high)
              assert got == expected, f"count_in_range({data}, {low}, {high}) should be {expected}, got {got!r}."
          assert count_in_range([], 1, 5) == 0, "An empty list has 0 items in any range."
          assert count_in_range(data, 9, 2) == 0, "If low > high the range is empty: return 0."
      - name: runs in O(log n)
        code: |
          class Tracked:
              comparisons = 0
              def __init__(self, value):
                  self.value = value
              def __eq__(self, other):
                  Tracked.comparisons += 1
                  return self.value == other.value
              def __lt__(self, other):
                  Tracked.comparisons += 1
                  return self.value < other.value
              def __le__(self, other):
                  Tracked.comparisons += 1
                  return self.value <= other.value
              def __gt__(self, other):
                  Tracked.comparisons += 1
                  return self.value > other.value
              def __ge__(self, other):
                  Tracked.comparisons += 1
                  return self.value >= other.value

          data = [Tracked(i) for i in range(1000)]
          Tracked.comparisons = 0
          got = count_in_range(data, Tracked(250), Tracked(749))
          assert got == 500, f"Values 250..749 in 0..999 should count 500, got {got!r}."
          assert Tracked.comparisons <= 40, f"count_in_range made {Tracked.comparisons} comparisons on 1,000 items. Use bisect_left for low and bisect_right for high instead of looping."
