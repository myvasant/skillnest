cheatsheet: |
  ```python
  # Closed range [lo, hi]
  lo, hi = 0, len(a) - 1
  while lo <= hi:
      mid = (lo + hi) // 2
      if a[mid] == x: return mid
      elif a[mid] < x: lo = mid + 1
      else: hi = mid - 1
  return -1

  # Half-open [lo, hi): first index with a[i] >= x  (= bisect_left)
  lo, hi = 0, len(a)
  while lo < hi:
      mid = (lo + hi) // 2
      if a[mid] < x: lo = mid + 1
      else: hi = mid
  return lo

  import bisect
  bisect.bisect_left(a, x)    # before equal items     bisect.bisect_right(a, x)  # after them
  bisect.insort(a, x)         # keep sorted (O(n) insert)
  bisect.bisect_left(a, x, key=f)   # 3.10+: key applies to items, not x
  ```
  - Linear O(n), any data · binary O(log n), sorted data only (no error if unsorted!)
  - Every pass must exclude mid · `//` not `/` · test empty, one item, ends, duplicates
  - Many lookups: set for membership, sort + bisect for ordered queries; one lookup: scan
