id: cs.code-review
concept: cs.code-review
title: 'Code Review: Correctness, Risk and Collaboration'
subtitle: How to review changes without turning review into a style debate
estimatedMinutes: 35
reviewedOn: '2026-11-04'
summary: Code review is a collaborative quality practice. Learn to prioritize correctness and security, inspect
  tests and edge cases, and give feedback that is specific, respectful and actionable.
objectives:
- Explain the purpose of code review and what it cannot guarantee.
- Prioritize correctness, security, data integrity and maintainability risks.
- Inspect tests for meaningful edge-case coverage.
- Write actionable review comments and respond constructively as an author.
sources:
- title: Google Engineering Practices — Code Review
  url: https://google.github.io/eng-practices/review/
  publisher: Google
- title: 'Software Engineering at Google, Chapter 9: Code Review'
  url: https://abseil.io/resources/swe-book/html/ch09.html
  publisher: Google
sections:
- id: why
  title: Why review changes
  kind: why
  blocks:
  - type: markdown
    body: A code review is a structured check of a proposed change before it becomes part of the shared codebase.
      It is not a competition to write code in the reviewer’s preferred style. Its purpose is to reduce risk, improve
      clarity and share knowledge.
  - type: callout
    variant: note
    title: Review the change, not the person
    body: Ask what the code does, what can fail and what evidence supports it. Phrase comments about observable
      behaviour and risk, not the author’s ability.
- id: priority
  title: Review in risk order
  kind: concept
  blocks:
  - type: markdown
    body: 'A practical review order is: **correctness and security**, data integrity, design and maintainability,
      tests and edge cases, then readability. Automated formatting and lint tools should handle mechanical style
      rules so humans can focus on reasoning.'
  - type: markdown
    body: 'Check the intended behaviour against the issue or acceptance criteria. Then inspect error paths, authorization,
      input validation, resource cleanup, concurrency and backwards compatibility where relevant. Look at tests
      as executable claims: do they fail when the behaviour is broken?'
  - type: item
    ref: review-priority-mcq
- id: workflow
  title: A useful review workflow
  kind: walkthrough
  blocks:
  - type: markdown
    body: As an author, keep changes small and focused, explain why the change exists, describe how you tested it
      and review your own diff before requesting review. As a reviewer, understand the context, read the whole diff,
      run or inspect relevant tests, ask questions when intent is unclear and separate blocking requests from optional
      suggestions.
  - type: markdown
    body: A review comment should identify the location, describe the behaviour or risk, explain why it matters
      and suggest a concrete next step. “This is wrong” is not actionable. “This accepts a user ID from the request
      without checking resource ownership; please authorize against the authenticated principal and add a cross-user
      test” is actionable.
  - type: item
    ref: review-approval-tf
  - type: item
    ref: review-action-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '- Review for correctness and security before style.

      - Small, focused changes receive better reviews.

      - Review behaviour and evidence, not personal preference.

      - The author remains accountable for the change.

      - Keep feedback specific, respectful and actionable.'
  - type: item
    ref: review-priority-mcq
  - type: item
    ref: review-approval-tf
  - type: item
    ref: review-action-explain
items:
- id: review-priority-mcq
  type: mcq
  skill: recognition
  difficulty: 1
  prompt: During a code review, which issue should normally be investigated first?
  explanation: Correctness and security risks can cause data loss, exposure or incorrect behaviour. Formatting should
    usually be automated.
  options:
  - id: a
    text: A variable could have a slightly shorter name.
    correct: false
    feedback: That is usually a low-priority style suggestion.
  - id: b
    text: An endpoint trusts a user ID supplied by the caller without checking ownership.
    correct: true
    feedback: Correct. This may be an authorization vulnerability.
  - id: c
    text: A line is one character longer than the team preference.
    correct: false
    feedback: Formatting tools should handle this.
  - id: d
    text: A comment uses a different punctuation style.
    correct: false
    feedback: This is not more important than a correctness or security defect.
- id: review-approval-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: An approval means the reviewer now owns the change and the author is no longer responsible for its correctness.
  answer: false
  explanation: The author remains responsible for the change. Review is a collaborative risk-reduction practice,
    not a transfer of ownership.
- id: review-action-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: A pull request changes a payment endpoint. The happy path works, but the diff has no tests for duplicate
    submissions, authorization or a failed database write. Write a concise review comment that identifies the risk
    and asks for actionable evidence.
  rubric:
  - Identify at least one high-impact missing edge case.
  - Explain the consequence rather than judging the author.
  - Request a specific test or implementation change.
  - Keep the tone respectful and focused on the code.
  modelAnswer: The endpoint needs tests for repeated submissions and for a caller attempting to access another user’s
    payment. Please add tests that demonstrate duplicate requests do not create duplicate charges and that ownership
    is checked server-side. Also cover the database failure path so the response and transaction behaviour are explicit.
  explanation: A useful review comment is specific, evidence-oriented and respectful. It prioritizes impact and
    asks for a concrete improvement.
masteryCheck:
  passThreshold: 0.8
  items:
  - review-priority-mcq
  - review-approval-tf
  - review-action-explain
cheatsheet: 'Review order: correctness/security → data integrity → design → tests/edge cases → readability. Keep
  diffs small. Explain risk, request evidence and comment on code rather than people. Approval does not transfer
  ownership.'
