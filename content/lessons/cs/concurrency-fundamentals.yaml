id: cs.concurrency-fundamentals
concept: cs.concurrency-fundamentals
title: Concurrency Fundamentals
subtitle: Atomicity, race conditions, synchronization and deadlock prevention
estimatedMinutes: 55
summary: Learn why shared mutable state is difficult under concurrency, how read-modify-write operations
  can lose updates, how locks protect critical sections, how deadlocks form, and when message passing
  is safer than shared state.
objectives:
- Explain atomicity and how task interleaving creates race conditions.
- Identify the complete critical section that protects a shared invariant.
- Use locks conceptually and explain why lock scope should be small.
- Explain deadlock and prevent circular wait with a consistent lock order.
- Compare locks, semaphores, events, conditions and thread-safe queues.
- Design worker coordination around local results and message passing.
sources:
- title: threading — Thread-based parallelism
  url: https://docs.python.org/3.14/library/threading.html
  publisher: Python Software Foundation
  version: '3.14'
- title: queue — A synchronized queue class
  url: https://docs.python.org/3.14/library/queue.html
