    solution: |
      class Table:
          def __init__(self):
              self.buckets = [[] for _ in range(4)]
              self.count = 0

          def _index(self, key):
              return key % len(self.buckets)        # int keys only, for simplicity

          def put(self, key, value):
              bucket = self.buckets[self._index(key)]
              for pair in bucket:
                  if pair[0] == key:
                      pair[1] = value
                      return
              bucket.append([key, value])
              self.count += 1
              if self.count / len(self.buckets) > 0.75:
                  self._resize()

          def _resize(self):
              old = self.buckets
              self.buckets = [[] for _ in range(2 * len(old))]
              for bucket in old:
                  for key, value in bucket:
                      self.buckets[self._index(key)].append([key, value])

          def get(self, key):
              for stored, value in self.buckets[self._index(key)]:
                  if stored == key:
                      return value
              raise KeyError(key)

      table = Table()
      for k in range(1, 11):
          table.put(k, k * k)
      print([table.get(k) for k in range(1, 11)])
    expectedOutput: |
      [1, 4, 9, 16, 25, 36, 49, 64, 81, 100]
    tests:
      - name: every stored key can be found after resizes
        code: |
          t = Table()
          for k in range(1, 101):
              t.put(k, -k)
          for k in range(1, 101):
              assert t.get(k) == -k, f"get({k}) should return {-k}."
      - name: buckets double and keys are rehashed
        code: |
          t = Table()
          for k in range(1, 101):
              t.put(k, k)
          assert len(t.buckets) == 256, f"After 100 inserts the table should have grown 4 -> 8 -> ... -> 256 buckets, but it has {len(t.buckets)}."
          for i, bucket in enumerate(t.buckets):
              for key, _ in bucket:
                  assert key % len(t.buckets) == i, f"Key {key} sits in bucket {i}, but it belongs in bucket {key % len(t.buckets)}. Re-insert every entry after growing."
          assert t.count == 100 and sum(len(b) for b in t.buckets) == 100, "Resizing must keep exactly one entry per key."
    hints:
      - After the bucket list grows, where does `_index(4)` point? Where is key 4 actually stored?
      - A key's bucket depends on the number of buckets, so every existing entry has to be placed again.
      - "Keep a reference to the old buckets, create a new list of twice as many empty buckets, then re-insert every [key, value] using _index."
    feedback:
      - when: { errorType: KeyError }
        message: >-
          Some keys are still sitting in the bucket they were given before the resize. After adding buckets,
          every entry must be re-inserted at its new index.
    explanation: >-
      Adding empty buckets changes `len(self.buckets)`, and therefore every key's index, but leaves the
      entries where they were. Key 4 was stored in bucket 4 % 4 = 0, yet after growing to 16 buckets get(4)
      looks in bucket 4. Rehashing — re-inserting every entry into a fresh, larger array — is what makes
      resizing correct. It costs O(n) per resize but, with doubling, O(1) amortised per insert.

