id: cs.hashing
concept: cs.hashing
title: Hash Functions and Hash Tables
subtitle: How dicts and sets find things without searching
estimatedMinutes: 60
reviewedOn: 2026-10-22
summary: >-
  A hash function turns a key into a number that says where to store it, so a hash table can jump almost
  straight to the right place instead of searching. Build a hash table from scratch with buckets and
  chaining, see collisions, load factor and resizing at work, and learn why Python's dict and set are
  O(1) on average, O(n) in the worst case, and why lists cannot be keys.
objectives:
  - Explain what a hash function does and which properties a hash table needs from it.
  - Implement a toy hash table with buckets and separate chaining, including put, get and update.
  - Explain collisions, the load factor and why tables resize and rehash, and compute a load factor.
  - Explain why dict and set operations are O(1) on average but O(n) in the worst case.
  - Explain why mutable objects such as lists cannot be dict keys, and choose hashable alternatives.
  - Write __eq__ and __hash__ that respect the rule "equal objects must have equal hashes".
