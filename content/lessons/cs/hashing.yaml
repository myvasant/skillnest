cheatsheet: |
  ```python
  index = hash(key) % len(buckets)        # which bucket (Python's dict mixes bits more cleverly)
  # chaining: buckets[index] is a list of [key, value]; compare keys with == inside it
  load_factor = count / len(buckets)      # resize + rehash every key when it gets too high

  hash(42) == 42                          # CPython detail; never print/store str hashes (salted per run)
  {(3, 4): "ok"}                          # tuples/frozensets of hashables are hashable
  {[3, 4]: "no"}                          # TypeError: cannot use 'list' as a dict key

  class Point:
      def __eq__(self, other): ...        # compares (x, y)
      def __hash__(self):
          return hash((self.x, self.y))   # SAME fields as __eq__
  # or: @dataclass(frozen=True)
  ```
  - Rule: `a == b` ⇒ `hash(a) == hash(b)` (not the reverse)
  - dict/set: O(1) average, O(n) worst (collisions) · inserts amortised O(1) · no ordering by key
  - `hash()` is not cryptographic → `hashlib` for fingerprints and integrity
