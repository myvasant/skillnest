id: cs.graphs
concept: cs.graphs
title: Graphs, BFS and DFS
subtitle: Modelling connections and exploring them systematically
estimatedMinutes: 60
reviewedOn: 2026-10-22
summary: >-
  Graphs model anything made of connections: friendships, roads, web links, package dependencies. Learn
  the vocabulary, store graphs as adjacency lists in dicts, and explore them with breadth-first search
  (a queue — shortest paths in unweighted graphs) and depth-first search (recursion or a stack), always
  with a visited set so cycles cannot trap you.
objectives:
  - Use graph vocabulary correctly — vertex, edge, directed, weighted, neighbour, degree, path, cycle, component.
  - Represent a graph as an adjacency list with a dict, and compare it with an adjacency matrix.
  - Implement breadth-first search with collections.deque and use it to find shortest paths in unweighted graphs.
  - Implement depth-first search both recursively and with an explicit stack, and predict visit orders.
  - Explain why a visited set is required and what goes wrong without one.
  - State the O(V + E) cost of BFS and DFS and choose the right traversal for a problem.
sources:
