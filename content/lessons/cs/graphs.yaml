  - id: m-predict-levels
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: Predict the output.
    code: |
      from collections import deque

      graph = {"home": ["park", "shop"], "park": ["lake"], "shop": ["lake", "school"],
               "lake": ["hill"], "school": [], "hill": []}
      dist = {"home": 0}
      queue = deque(["home"])
      while queue:
          place = queue.popleft()
          for nxt in graph[place]:
              if nxt not in dist:
                  dist[nxt] = dist[place] + 1
                  queue.append(nxt)
      print(dist["lake"], dist["school"], dist["hill"])
    answer: "2 2 3"
    explanation: >-
      park and shop are 1 step from home. lake is discovered first from park (distance 2) — when shop later
      sees lake, it is already in dist. school is 2 (via shop) and hill is 3 (via lake).
    wrongAnswers:
      - answer: "3 2 4"
        feedback: lake is reached through park in two steps; BFS records the first (shortest) discovery and never overwrites it.
      - answer: "2 2 2"
        feedback: hill is only reachable through lake, which is itself 2 steps away, so hill is 3.
      - answer: "1 2 3"
        feedback: lake is not a direct neighbour of home; it takes home → park → lake.

