cheatsheet: |
  ```python
  from collections import defaultdict, deque

  graph = defaultdict(list)                # adjacency list
  for a, b in edges:
      graph[a].append(b); graph[b].append(a)    # undirected: both ways

  def bfs(graph, start):                   # FIFO queue: ring by ring, fewest edges
      visited, queue = {start}, deque([start])
      while queue:
          node = queue.popleft()
          for nb in graph.get(node, []):
              if nb not in visited:
                  visited.add(nb); queue.append(nb)   # mark when discovered

  def dfs(node, visited):                  # recursion (or a list used as a stack)
      visited.add(node)
      for nb in graph.get(node, []):
          if nb not in visited:
              dfs(nb, visited)
  ```
  - Always a visited **set** (cycles!) · `graph.get(node, [])` for vertices with no outgoing edges
  - BFS → shortest path in unweighted graphs (keep `parent` to rebuild it) · DFS → reachability, components, ordering
  - O(V + E) time, O(V) space · matrix O(V²) memory · weighted → Dijkstra · dependencies → `graphlib.TopologicalSorter`
