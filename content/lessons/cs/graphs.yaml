      friends = [("Ana", "Ben"), ("Ben", "Cai"), ("Dev", "Cai")]
      graph = build_graph(friends)
      print(sorted(reachable(graph, "Ana")))
      print(sorted(reachable(graph, "Dev")))
    solution: |
      def build_graph(edges):
          graph = {}
          for a, b in edges:
              graph.setdefault(a, []).append(b)
              graph.setdefault(b, []).append(a)
          return graph

      def reachable(graph, start):
          seen = {start}
          stack = [start]
          while stack:
              node = stack.pop()
              for nb in graph.get(node, []):
                  if nb not in seen:
                      seen.add(nb)
                      stack.append(nb)
          return seen

      friends = [("Ana", "Ben"), ("Ben", "Cai"), ("Dev", "Cai")]
      graph = build_graph(friends)
      print(sorted(reachable(graph, "Ana")))
      print(sorted(reachable(graph, "Dev")))
    expectedOutput: |
      ['Ana', 'Ben', 'Cai', 'Dev']
      ['Ana', 'Ben', 'Cai', 'Dev']
    tests:
      - name: every edge is stored both ways
        code: |
          pairs = [("p", "q"), ("q", "r"), ("s", "r"), ("t", "p")]
          g = build_graph(pairs)
          for a, b in pairs:
              assert b in g.get(a, []) and a in g.get(b, []), f"The friendship ({a!r}, {b!r}) should appear under both {a!r} and {b!r}; got {g}."
      - name: everyone is reachable from everyone
        code: |
          g = build_graph([("Ana", "Ben"), ("Ben", "Cai"), ("Dev", "Cai")])
          for person in ["Ana", "Ben", "Cai", "Dev"]:
              got = sorted(reachable(g, person))
              assert got == ["Ana", "Ben", "Cai", "Dev"], f"From {person!r} everyone should be reachable, got {got}."
    hints:
      - In an undirected graph, the edge a–b can be followed from a to b and from b to a.
      - Add a second line in the loop that stores a under b.
    explanation: >-
      An undirected edge must appear in both endpoints' neighbour lists. Storing it once turns the graph into
      a directed one, so traversals can follow some friendships in only one direction.

