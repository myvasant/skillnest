  - id: m-dfs-shortest-tf
    type: true-false
    skill: recognition
    prompt: "True or false: in an unweighted graph, the first path DFS finds from start to goal is always a shortest one."
    answer: false
    explanation: >-
      DFS follows whichever neighbour comes first as deep as it can, so it may reach the goal by a long detour
      before trying a direct route. BFS, which explores ring by ring, is the traversal that guarantees fewest
