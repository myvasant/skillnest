  - id: m-has-path
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `has_path(graph, start, goal)` that returns `True` if `goal` can be reached from `start` by
      following edges in a **directed** graph, else `False`. The graph may contain cycles, and vertices with
      no outgoing edges may be missing from the dict. Any traversal is fine — but it must always finish.
    starterCode: |
      def has_path(graph, start, goal):
          return False

      graph = {"A": ["B"], "B": ["C"], "C": ["A", "D"], "E": ["A"]}
      print(has_path(graph, "A", "D"), has_path(graph, "A", "E"))
    solution: |
      def has_path(graph, start, goal):
          visited = {start}
          stack = [start]
          while stack:
              node = stack.pop()
              if node == goal:
                  return True
              for neighbour in graph.get(node, []):
                  if neighbour not in visited:
                      visited.add(neighbour)
                      stack.append(neighbour)
          return False

      graph = {"A": ["B"], "B": ["C"], "C": ["A", "D"], "E": ["A"]}
      print(has_path(graph, "A", "D"), has_path(graph, "A", "E"))
    expectedOutput: |
      True False
    tests:
      - name: follows edges in their direction
        code: |
          g = {"A": ["B"], "B": ["C"], "C": ["A", "D"], "E": ["A"]}
          for s, t, expected in [("A", "D", True), ("A", "E", False), ("E", "D", True), ("D", "A", False), ("B", "A", True)]:
              got = has_path(g, s, t)
              assert got is expected, f"has_path(g, {s!r}, {t!r}) should be {expected}, got {got!r}."
      - name: a vertex reaches itself
        code: |
          assert has_path({"A": ["B"]}, "A", "A") is True, "Every vertex can reach itself: has_path(g, 'A', 'A') should be True."
          assert has_path({}, "Z", "Z") is True, "Even a vertex that is not in the dict reaches itself."
      - name: terminates on graphs full of cycles
        code: |
          g = {i: [(i + 1) % 50, (i + 7) % 50] for i in range(50)}
          g[100] = [0]
          assert has_path(g, 0, 100) is False, "Vertex 100 points into the cycle but nothing points back to it: False."
          assert has_path(g, 100, 49) is True, "100 -> 0 -> ... reaches 49."
    hints:
      - Use a visited set — the graph has cycles, so without one the search never ends.
      - "Use `graph.get(node, [])` so vertices missing from the dict simply have no neighbours."
      - Return True as soon as you take goal off the stack (or queue); return False when it is empty.
    feedback:
      - when: { errorType: KeyError }
        message: A vertex with no outgoing edges is not in the dict. Use graph.get(node, []).
      - when: { errorType: RecursionError }
        message: Your recursion never stops — the graph has cycles. Keep a visited set and skip vertices already in it.
    explanation: >-
      Reachability is a plain traversal: start at start, follow edges, and see whether goal is ever reached.
      The visited set guarantees termination on cyclic graphs, and `get` handles vertices with no outgoing
      edges. DFS and BFS are equally correct here; the cost is O(V + E).

  - id: m-debug-undirected
    type: debug
