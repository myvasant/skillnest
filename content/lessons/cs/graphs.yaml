    difficulty: 2
    prompt: |
      Friendships are mutual, but `build_graph` stores each friendship only one way. As a result, starting
      from Ana the search never finds Dev, and starting from Dev it never finds Ana or Ben. Fix `build_graph`
      so both searches find all four people.
    starterCode: |
      def build_graph(edges):
          graph = {}
          for a, b in edges:
              graph.setdefault(a, []).append(b)
          return graph

      def reachable(graph, start):
