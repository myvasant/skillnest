cheatsheet: |
  | Class | Shape in code | Python examples |
  |---|---|---|
  | O(1) | no loop | `a[i]`, `len(a)`, `d[k]`*, `x in s`*, `a.append(x)`† |
  | O(log n) | halve each step | binary search, `bisect` |
  | O(n) | one loop | `x in list`, `a.index(x)`, `sum`, `max`, `a.insert(0, x)`, `a.pop(0)` |
  | O(n log n) | sort | `sorted(a)`, `a.sort()` |
  | O(n²) | loop in a loop | compare every pair; O(n) call inside a loop |
  | O(2ⁿ) | all subsets | naive recursive Fibonacci |

  \* average case (worst O(n)) · † amortised

  - Simplify: keep the dominant term, drop constants (3n² + 5n + 2 → O(n²)).
  - Sequential loops add; nested loops multiply; separate inputs get separate letters (O(n · m)).
  - Space: count extra memory the same way (a set of seen items is O(n)).
  - Build strings with `"".join(parts)`; use a set/dict for repeated lookups; use `deque` for queues.
