id: cs.complexity
concept: cs.complexity
title: Algorithmic Complexity and Big-O
subtitle: Predicting how code scales before you run it
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Learn to count the work an algorithm does as a function of its input size n, describe how that work
  grows with Big-O notation, read the complexity straight off loops and nested loops, and know the
  hidden cost of everyday Python operations such as `x in my_list`, `insert(0, x)` and string building.
objectives:
  - Count the basic operations a short function performs as a function of its input size n.
  - Simplify an operation count to its Big-O class by dropping constant factors and lower-order terms.
  - Determine the time complexity of single, nested, sequential and halving loops by reading the code.
  - Distinguish time complexity from space complexity, and worst-case from amortised cost.
  - Predict the cost of common Python operations (list vs set membership, append vs insert(0, …), string joining) and rewrite accidentally quadratic code to run in linear time.
  - Explain why Big-O is not a measurement and why O(1) does not mean "fast".
sources:
