id: de.etl-elt
concept: de.etl-elt
title: ETL and ELT pipelines
subtitle: Extract, transform and load data between systems; ELT loads raw data first and transforms inside the warehouse
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Extract, transform and load data between systems; ELT loads raw data first and transforms inside the warehouse.
objectives:
- Explain the role of etl and elt pipelines in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: Extract, transform, load (ETL)
  url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/etl
  publisher: Microsoft Azure Architecture Center
- title: How we structure our dbt projects
  url: https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview
  publisher: dbt Labs
