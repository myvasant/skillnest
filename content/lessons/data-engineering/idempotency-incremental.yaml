items:
- id: idempotency-incremental-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of idempotent and incremental pipelines?
  explanation: Idempotent means running a job twice with the same input leaves the same result as running it once.
  options:
  - id: a
    text: Idempotent means running a job twice with the same input leaves the same result as running it once.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Retries are not safe by default; an `INSERT` that timed out may have succeeded, so retrying it can duplicate
      rows.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: idempotency-incremental-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Retries are not safe by default; an `INSERT` that timed out may have succeeded, so retrying it can duplicate
    rows.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: idempotency-incremental-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying idempotent and incremental pipelines to a dataset that may contain missing, duplicate
    or malformed records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: idempotency-incremental-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for idempotent and incremental pipelines. The assertions test the main behaviour and
    an important edge case.
  starterCode: "def apply_events(state, events):\n    raise NotImplementedError('Complete this function')"
  solution: "def apply_events(state, events):\n    seen = set(state.get(\"processed\", [])); total = state.get(\"\
    total\", 0)\n    for event in events:\n        if event[\"id\"] not in seen: total += event[\"amount\"]; seen.add(event[\"\
    id\"])\n    return {\"total\":total,\"processed\":sorted(seen)}"
  tests:
  - name: Core transformation
    code: assert apply_events({}, [{"id":"a","amount":5},{"id":"a","amount":5}])["total"] == 5
  - name: Edge case
    code: assert apply_events({"total":5,"processed":["a"]}, [{"id":"a","amount":9}])["total"] == 5
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - idempotency-incremental-mcq
  - idempotency-incremental-tf
  - idempotency-incremental-code
