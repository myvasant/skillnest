  publisher: Delta Lake (Linux Foundation)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Re-running a pipeline must not duplicate data; incremental loads process only new data using watermarks,
      and backfills reprocess history safely. Pipelines fail and are retried all the time; without idempotency every
      retry or backfill risks duplicated, missing or half-written data.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Idempotent means running a job twice with the same input leaves the same result as running it once.

      - Common techniques: overwrite a whole partition (for example `dt=2026-10-21`) instead of appending, `MERGE`/upsert
      on a business key, and deduplicate on a unique event ID.

      - Incremental loads store a high-water mark (the largest `updated_at` or offset processed) and read only newer
      rows, usually with a small overlap to catch late updates.

      - Parameterise jobs by the logical interval they process, not by "now", so a backfill of any past interval
      runs exactly the same code.

      - Hard deletes in a source are invisible to an `updated_at` watermark; use CDC or soft-delete flags to propagate
      them.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Retries are not safe by default; an `INSERT` that timed out may have succeeded, so retrying it can
      duplicate rows.

      - Watermarks on timestamps can skip rows when transactions commit out of order; an overlap window plus deduplication
      fixes this.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def apply_events(state, events):\n    seen = set(state.get(\"processed\", [])); total = state.get(\"\
      total\", 0)\n    for event in events:\n        if event[\"id\"] not in seen: total += event[\"amount\"]; seen.add(event[\"\
      id\"])\n    return {\"total\":total,\"processed\":sorted(seen)}\n\nprint(apply_events({}, [{\"id\":\"a\",\"\
      amount\":5},{\"id\":\"a\",\"amount\":5}]))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: idempotency-incremental-code
  - type: item
    ref: idempotency-incremental-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Idempotent means running a job twice with the same input leaves the same result as running it once.

      - Common techniques: overwrite a whole partition (for example `dt=2026-10-21`) instead of appending, `MERGE`/upsert
      on a business key, and deduplicate on a unique event ID.

      - Incremental loads store a high-water mark (the largest `updated_at` or offset processed) and read only newer
      rows, usually with a small overlap to catch late updates.

      - Parameterise jobs by the logical interval they process, not by "now", so a backfill of any past interval
      runs exactly the same code.

      - Hard deletes in a source are invisible to an `updated_at` watermark; use CDC or soft-delete flags to propagate
      them.


      **Watch for**

      - Retries are not safe by default; an `INSERT` that timed out may have succeeded, so retrying it can duplicate
      rows.

      - Watermarks on timestamps can skip rows when transactions commit out of order; an overlap window plus deduplication
      fixes this.'
