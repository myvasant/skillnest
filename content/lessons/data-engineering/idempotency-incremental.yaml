id: de.idempotency-incremental
concept: de.idempotency-incremental
title: Idempotent and incremental pipelines
subtitle: Re-running a pipeline must not duplicate data; incremental loads process only new data using watermarks,
  and backfills reprocess history safely
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Re-running a pipeline must not duplicate data; incremental loads process only new data using watermarks,
  and backfills reprocess history safely.
objectives:
- Explain the role of idempotent and incremental pipelines in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
sources:
- title: Airflow best practices
  url: https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html
  publisher: Apache Software Foundation
- title: Configure incremental models
  url: https://docs.getdbt.com/docs/build/incremental-models
  publisher: dbt Labs
