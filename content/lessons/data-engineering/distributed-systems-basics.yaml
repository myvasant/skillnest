- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Partitioning (sharding) splits data across nodes for scale; replication keeps copies for availability and
      read throughput.

      - Partial failure — a missing reply cannot distinguish a slow node, a crashed node and a lost message, so
      timeouts are guesses and retries require idempotent operations.

      - Clocks on different machines drift; order events with sequence numbers or logical clocks rather than wall-clock
      timestamps.

      - CAP — during a network partition a replicated system must choose between consistency (linearizability) and
      availability; PACELC adds the latency vs consistency trade-off when there is no partition.

      - Consensus protocols such as Raft and Paxos let a majority quorum agree on a leader or log; a cluster of
      `2f + 1` nodes tolerates `f` failed nodes.


      **Watch for**

      - CAP is not "pick any two of three" at all times; the choice only applies while a partition is happening.

      - Exactly-once delivery over a network is not achievable in general; systems provide exactly-once effects
      through at-least-once delivery plus idempotent or transactional processing.'
