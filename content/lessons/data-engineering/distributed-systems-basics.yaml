items:
- id: distributed-systems-basics-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of distributed systems fundamentals?
  explanation: Partitioning (sharding) splits data across nodes for scale; replication keeps copies for availability
    and read throughput.
  options:
  - id: a
    text: Partitioning (sharding) splits data across nodes for scale; replication keeps copies for availability
      and read throughput.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: CAP is not "pick any two of three" at all times; the choice only applies while a partition is happening.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: distributed-systems-basics-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: CAP is not "pick any two of three" at all times; the choice only applies while a partition is happening.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: distributed-systems-basics-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying distributed systems fundamentals to a dataset that may contain missing, duplicate or
    malformed records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: distributed-systems-basics-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for distributed systems fundamentals. The assertions test the main behaviour and an
    important edge case.
  starterCode: "def process_at_least_once(events, processed):\n    raise NotImplementedError('Complete this function')"
  solution: "def process_at_least_once(events, processed):\n    results=[]\n    for event in events:\n        if\
    \ event[\"id\"] not in processed: results.append(event[\"value\"]); processed.add(event[\"id\"])\n    return\
    \ results"
  tests:
  - name: Core transformation
    code: seen=set()
  - name: Edge case
    code: 'assert process_at_least_once([{"id":"x","value":1},{"id":"x","value":1}], seen) == [1]

      assert process_at_least_once([{"id":"x","value":2}], seen) == []'
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
