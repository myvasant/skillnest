sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Partitioning, replication, partial failure, clocks and the CAP trade-off explain why distributed systems
      behave differently from one machine. Spark, Kafka, cloud warehouses and vector databases are all distributed;
      their duplicates, stale reads and odd failures only make sense with these fundamentals.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Partitioning (sharding) splits data across nodes for scale; replication keeps copies for availability
      and read throughput.

      - Partial failure — a missing reply cannot distinguish a slow node, a crashed node and a lost message, so
      timeouts are guesses and retries require idempotent operations.

      - Clocks on different machines drift; order events with sequence numbers or logical clocks rather than wall-clock
      timestamps.

      - CAP — during a network partition a replicated system must choose between consistency (linearizability) and
      availability; PACELC adds the latency vs consistency trade-off when there is no partition.

      - Consensus protocols such as Raft and Paxos let a majority quorum agree on a leader or log; a cluster of
      `2f + 1` nodes tolerates `f` failed nodes.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- CAP is not "pick any two of three" at all times; the choice only applies while a partition is happening.

      - Exactly-once delivery over a network is not achievable in general; systems provide exactly-once effects
      through at-least-once delivery plus idempotent or transactional processing.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def process_at_least_once(events, processed):\n    results=[]\n    for event in events:\n        if event[\"\
      id\"] not in processed: results.append(event[\"value\"]); processed.add(event[\"id\"])\n    return results\n\
      \nprocessed=set()\nprint(process_at_least_once([{\"id\":\"x\",\"value\":1},{\"id\":\"x\",\"value\":1}], processed))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: distributed-systems-basics-code
  - type: item
