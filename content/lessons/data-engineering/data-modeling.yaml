id: de.data-modeling
concept: de.data-modeling
title: Dimensional data modelling
subtitle: Fact and dimension tables, star schemas, grain and slowly changing dimensions organise data for analysis
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Fact and dimension tables, star schemas, grain and slowly changing dimensions organise data for analysis.
objectives:
- Explain the role of dimensional data modelling in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
