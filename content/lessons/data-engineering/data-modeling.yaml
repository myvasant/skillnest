items:
- id: data-modeling-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of dimensional data modelling?
  explanation: Fact tables record measurable events (orders, payments, clicks) with numeric measures and foreign
    keys; dimension tables describe the who, what, where and when.
  options:
  - id: a
    text: Fact tables record measurable events (orders, payments, clicks) with numeric measures and foreign keys;
      dimension tables describe the who, what, where and when.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: Mixing grains in one fact table (order totals next to order lines) silently double-counts when users sum
      a measure.
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: data-modeling-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Mixing grains in one fact table (order totals next to order lines) silently double-counts when users sum
    a measure.
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: data-modeling-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying dimensional data modelling to a dataset that may contain missing, duplicate or malformed
    records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: data-modeling-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for dimensional data modelling. The assertions test the main behaviour and an important
    edge case.
  starterCode: "def star_schema_components():\n    raise NotImplementedError('Complete this function')"
  solution: "def star_schema_components():\n    return {\"fact\": [\"order_id\", \"customer_id\", \"product_id\"\
    , \"date_id\", \"amount\"],\n            \"dimensions\": {\"customer\": [\"customer_id\", \"segment\"], \"product\"\
    : [\"product_id\", \"category\"], \"date\": [\"date_id\", \"day\", \"month\"]}}"
  tests:
  - name: Core transformation
    code: schema = star_schema_components()
  - name: Edge case
    code: 'assert "amount" in schema["fact"]

      assert "customer" in schema["dimensions"]'
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - data-modeling-mcq
  - data-modeling-tf
  - data-modeling-code
