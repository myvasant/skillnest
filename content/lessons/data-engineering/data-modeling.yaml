sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Fact and dimension tables, star schemas, grain and slowly changing dimensions organise data for analysis.
      Operational tables are normalised for fast writes; analysts need tables that make business questions easy
      to ask and give the same answer every time.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Fact tables record measurable events (orders, payments, clicks) with numeric measures and foreign keys;
      dimension tables describe the who, what, where and when.

      - Declare the grain first — exactly what one fact row represents, such as "one row per order line" — and keep
      every measure consistent with it.

      - A star schema joins one fact table directly to denormalised dimensions; a snowflake schema normalises dimensions
      into further tables.

      - Slowly changing dimensions — Type 1 overwrites the old value; Type 2 adds a new row with `valid_from`, `valid_to`
      and `is_current` so history is preserved.

      - Use surrogate keys for dimensions so source-key changes and Type 2 history are handled cleanly; conformed
      dimensions are shared across fact tables.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Mixing grains in one fact table (order totals next to order lines) silently double-counts when users
      sum a measure.

      - Cheap storage has not made modelling obsolete; wide denormalised tables still need a defined grain and consistent
      dimensions.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def star_schema_components():\n    return {\"fact\": [\"order_id\", \"customer_id\", \"product_id\",\
      \ \"date_id\", \"amount\"],\n            \"dimensions\": {\"customer\": [\"customer_id\", \"segment\"], \"\
      product\": [\"product_id\", \"category\"], \"date\": [\"date_id\", \"day\", \"month\"]}}\n\nprint(star_schema_components()[\"\
      fact\"])"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
  - type: item
    ref: data-modeling-code
  - type: item
    ref: data-modeling-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
