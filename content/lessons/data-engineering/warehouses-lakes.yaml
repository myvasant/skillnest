id: de.warehouses-lakes
concept: de.warehouses-lakes
title: Warehouses, lakes and lakehouses
subtitle: Warehouses store modelled data for SQL analytics; lakes store raw files cheaply; lakehouse table formats
  (Delta Lake, Apache Iceberg) add transactions to lakes
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Warehouses store modelled data for SQL analytics; lakes store raw files cheaply; lakehouse table formats
  (Delta Lake, Apache Iceberg) add transactions to lakes.
objectives:
- Explain the role of warehouses, lakes and lakehouses in a reliable data workflow.
- Apply the core technique to a small dataset or pipeline example.
- Identify data-quality, correctness or operational failure modes.
