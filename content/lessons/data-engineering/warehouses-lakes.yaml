items:
- id: warehouses-lakes-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central idea of warehouses, lakes and lakehouses?
  explanation: A warehouse stores structured, modelled data in a managed columnar engine optimised for SQL; most
    cloud warehouses separate storage from compute.
  options:
  - id: a
    text: A warehouse stores structured, modelled data in a managed columnar engine optimised for SQL; most cloud
      warehouses separate storage from compute.
    correct: true
    feedback: 'Correct: this is the core principle in the lesson.'
  - id: b
    text: A lake without governance or a table format does not become a cheaper warehouse — it becomes a "data swamp".
    feedback: This is a misconception; data contracts and evidence are needed.
  - id: c
    text: The pipeline does not need validation if the input file exists.
    feedback: Existence is not the same as validity or correctness.
- id: warehouses-lakes-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A lake without governance or a table format does not become a cheaper warehouse — it becomes a "data swamp".
  answer: false
  explanation: The statement is a known misconception. Validate data shape, semantics, edge cases and the expected
    output.
- id: warehouses-lakes-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are applying warehouses, lakes and lakehouses to a dataset that may contain missing, duplicate or
    malformed records. Describe the approach, checks and trade-offs you would use.
  rubric:
  - Explain the data or pipeline operation and its assumptions.
  - Describe concrete checks for missing, duplicate or malformed records.
  - Explain how you would make the result reproducible and observable.
  modelAnswer: Define the expected schema and business rules first. Apply the transformation in a deterministic
    way, record rejected rows with reasons, and measure counts before and after each stage. Test edge cases and
    make repeated runs safe where the workflow may be retried.
  explanation: A strong response considers data contracts and operational evidence, not just the happy path.
- id: warehouses-lakes-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for warehouses, lakes and lakehouses. The assertions test the main behaviour and an
    important edge case.
  starterCode: "def choose_storage(workload):\n    raise NotImplementedError('Complete this function')"
  solution: "def choose_storage(workload):\n    return {\"raw_files\": \"data lake\", \"curated_sql_analytics\"\
    : \"data warehouse\", \"mixed_open_formats_and_engines\": \"lakehouse\"}.get(workload, \"clarify requirements\"\
    )"
  tests:
  - name: Core transformation
    code: assert choose_storage("raw_files") == "data lake"
  - name: Edge case
    code: 'assert choose_storage("curated_sql_analytics") == "data warehouse"

      assert choose_storage("unknown") == "clarify requirements"'
  hints:
  - Translate the data rule into deterministic steps.
  - Handle missing values, invalid records or repeated input deliberately.
  - Run the assertions and explain why the edge case is correct.
  explanation: This exercise verifies the central transformation or model rule and asks you to handle a meaningful
    edge case.
