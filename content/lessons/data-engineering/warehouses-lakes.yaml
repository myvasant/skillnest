sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Warehouses store modelled data for SQL analytics; lakes store raw files cheaply; lakehouse table formats
      (Delta Lake, Apache Iceberg) add transactions to lakes. Where analytical data lives determines its cost, which
      workloads (SQL, ML, file processing) can use it, and whether updates are reliable.
- id: mental-model
  title: Core concepts and workflow
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A warehouse stores structured, modelled data in a managed columnar engine optimised for SQL; most cloud
      warehouses separate storage from compute.

      - A data lake stores files of any format (often Parquet) in cheap object storage; without a table layer there
      are no transactions, so failed or concurrent writes can leave partial data.

      - Open table formats (Delta Lake, Apache Iceberg, Apache Hudi) keep a metadata/transaction log over data files,
      giving atomic commits, schema enforcement and evolution, time travel and efficient `MERGE`/delete.

      - A lakehouse uses such a table format so SQL engines, Spark and ML tools share one copy of the data.

      - The medallion pattern layers data as bronze (raw), silver (cleaned, conformed) and gold (business-level
      aggregates).'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A lake without governance or a table format does not become a cheaper warehouse — it becomes a "data
      swamp".

      - Delta Lake and Iceberg are not databases or query engines; they are table formats that engines such as Spark,
      Trino, Flink and warehouses read and write.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: The following pure-Python model makes the underlying data operation executable without requiring a paid
      service or optional package. Where the topic uses NumPy or pandas in practice, those APIs are explained separately;
      this small example focuses on the data transformation itself.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def choose_storage(workload):\n    return {\"raw_files\": \"data lake\", \"curated_sql_analytics\": \"\
      data warehouse\", \"mixed_open_formats_and_engines\": \"lakehouse\"}.get(workload, \"clarify requirements\"\
      )\n\nprint(choose_storage(\"curated_sql_analytics\"))"
    caption: Runnable standard-library example; production libraries may provide more efficient implementations.
- id: practice
  title: Practice and validation
  kind: practice
  blocks:
  - type: markdown
    body: Implement the transformation, run the tests and consider missing values, duplicates, malformed records
      and repeated execution where relevant.
