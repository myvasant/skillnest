id: math.matrices
concept: math.matrices
title: Matrices and matrix multiplication
subtitle: Matrices are grids of numbers; multiplying a matrix by a vector applies many dot products at once, which
  is how neural network layers compute
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Matrices are grids of numbers; multiplying a matrix by a vector applies many dot products at once, which
  is how neural network layers compute.
objectives:
- Explain the mathematical idea behind matrices and matrix multiplication.
- Interpret the notation and connect it to a concrete numerical example.
- Use a small computation to check assumptions and edge cases.
