sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Matrices are grids of numbers; multiplying a matrix by a vector applies many dot products at once, which
      is how neural network layers compute. A neural network layer is a matrix multiplication followed by a non-linearity
      and a batch of data is a matrix, so shape errors are among the most common bugs in ML code.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- An m x n matrix has m rows and n columns; `A @ B` needs A''s column count to equal B''s row count,
      and (m x n) times (n x p) gives m x p.

      - Entry `(AB)_ij` is the dot product of row i of A with column j of B; `A @ x` is a weighted combination of
      A''s columns.

      - Matrix multiplication is associative but not commutative - AB and BA are generally different, and one may
      not even be defined.

      - The transpose swaps rows and columns, with `(AB)^T = B^T A^T`; the identity matrix I leaves every vector
      unchanged.

      - A dense layer computes `y = W x + b` for one input, or `X @ W.T + b` for a batch whose rows are examples.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- In NumPy `A * B` multiplies element by element; matrix multiplication is `A @ B` (or `np.matmul`).

      - A 1-D NumPy array is neither a row nor a column vector; the operation decides how it is treated.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def matrix_multiply(a, b):\n    if not a or not b or len(a[0]) != len(b): raise ValueError(\"incompatible\
      \ dimensions\")\n    if any(len(row) != len(a[0]) for row in a) or any(len(row) != len(b[0]) for row in b):\
      \ raise ValueError(\"ragged matrix\")\n    return [[sum(a[i][k] * b[k][j] for k in range(len(b))) for j in\
      \ range(len(b[0]))] for i in range(len(a))]\n\nprint(matrix_multiply([[1,2],[3,4]], [[2,0],[1,2]]))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: matrices-code
  - type: item
    ref: matrices-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - An m x n matrix has m rows and n columns; `A @ B` needs A''s column count to equal B''s row count, and (m
      x n) times (n x p) gives m x p.

      - Entry `(AB)_ij` is the dot product of row i of A with column j of B; `A @ x` is a weighted combination of
      A''s columns.

      - Matrix multiplication is associative but not commutative - AB and BA are generally different, and one may
      not even be defined.

      - The transpose swaps rows and columns, with `(AB)^T = B^T A^T`; the identity matrix I leaves every vector
      unchanged.

      - A dense layer computes `y = W x + b` for one input, or `X @ W.T + b` for a batch whose rows are examples.


      **Watch for**

      - In NumPy `A * B` multiplies element by element; matrix multiplication is `A @ B` (or `np.matmul`).

      - A 1-D NumPy array is neither a row nor a column vector; the operation decides how it is treated.'
