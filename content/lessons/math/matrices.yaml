    ref: matrices-mcq
  - type: item
    ref: matrices-tf
  - type: item
    ref: matrices-code
items:
- id: matrices-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of matrices and matrix multiplication?
  explanation: An m x n matrix has m rows and n columns; `A @ B` needs A's column count to equal B's row count,
    and (m x n) times (n x p) gives m x p.
  options:
  - id: a
    text: An m x n matrix has m rows and n columns; `A @ B` needs A's column count to equal B's row count, and (m
      x n) times (n x p) gives m x p.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: In NumPy `A * B` multiplies element by element; matrix multiplication is `A @ B` (or `np.matmul`).
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: matrices-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: In NumPy `A * B` multiplies element by element; matrix multiplication is `A @ B` (or `np.matmul`).
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: matrices-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of matrices and matrix multiplication. State the assumptions you are making,
    interpret the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: matrices-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for matrices and matrix multiplication. The tests include ordinary values and
    at least one boundary or invalid input.
  starterCode: "def matrix_multiply(a, b):\n    raise NotImplementedError('Complete this function')"
  solution: "def matrix_multiply(a, b):\n    if not a or not b or len(a[0]) != len(b): raise ValueError(\"incompatible\
    \ dimensions\")\n    if any(len(row) != len(a[0]) for row in a) or any(len(row) != len(b[0]) for row in b):\
    \ raise ValueError(\"ragged matrix\")\n    return [[sum(a[i][k] * b[k][j] for k in range(len(b))) for j in range(len(b[0]))]\
    \ for i in range(len(a))]"
  tests:
  - name: Core calculation
    code: assert matrix_multiply([[1,2],[3,4]], [[2,0],[1,2]]) == [[4,4],[10,8]]
  - name: Boundary behaviour
    code: 'try: matrix_multiply([[1,2]], [[1,2]])

      except ValueError: pass

      else: raise AssertionError("incompatible dimensions must fail")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
