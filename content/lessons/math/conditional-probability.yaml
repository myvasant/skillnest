    solution: |
      from fractions import Fraction

      def p_spam_given_free(emails):
          spam_and_free = sum(1 for label, free in emails if label == "spam" and free)
          free_count = sum(1 for label, free in emails if free)
          return Fraction(spam_and_free, free_count)

      emails = ([("spam", True)] * 120 + [("spam", False)] * 80
                + [("ham", True)] * 40 + [("ham", False)] * 760)
      print(p_spam_given_free(emails))
    expectedOutput: |
      3/4
    tests:
      - name: the lesson's table
        code: |
          from fractions import Fraction
          got = p_spam_given_free(emails)
          assert got == Fraction(3, 4), f"Expected 3/4, got {got}. Divide by the number of emails that contain 'free'."
      - name: other data
        code: |
          from fractions import Fraction
          other = [("spam", True)] * 3 + [("ham", True)] * 9 + [("spam", False)] * 5 + [("ham", False)] * 83
          got = p_spam_given_free(other)
          assert got == Fraction(1, 4), f"With 3 spam among 12 'free' emails the answer is 1/4; got {got}."
    hints:
      - "3/25 = 120/1000 is P(spam and free) — a joint probability."
      - The condition is "contains free". Which group should the 120 be divided by?
      - "Count the emails where `free` is True and divide by that."
    feedback:
      - when: { outputEquals: "3/5\n" }
        message: 3/5 is P(free | spam) — you divided by the spam emails. The condition here is "contains free".
    explanation: >-
      Dividing by all 1,000 emails gives the joint probability P(spam and free) = 120/1000. Conditioning on "free"
      means dividing by the 160 emails that contain it: 120/160 = 3/4.

