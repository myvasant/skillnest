cheatsheet: |
  ```text
  P(A | B) = P(A and B) / P(B)                    shrink the universe to B, count A inside it
  P(A and B) = P(A | B) · P(B)                     multiplication rule
  independent  ⇔  P(A | B) = P(A)  ⇔  P(A and B) = P(A) · P(B)
  P(H | E) = P(E | H) · P(H) / P(E)                Bayes: posterior = likelihood × prior / evidence
  P(E) = P(E | H) P(H) + P(E | not H) P(not H)     law of total probability
  posterior odds = prior odds × P(E | H) / P(E | not H)
  ```
  ```python
  from fractions import Fraction
  def posterior(prior, sens, fpr):
      return sens * prior / (sens * prior + fpr * (1 - prior))
  posterior(Fraction(1, 1000), Fraction(99, 100), Fraction(1, 100))   # 11/122 ≈ 9%
  ```
  - P(A|B) ≠ P(B|A) · mutually exclusive ≠ independent · always ask for the base rate
  - Sensitivity = recall = P(+|condition) · specificity = P(−|no condition) · PPV = precision = P(condition|+)
  - Simulate with a seed (`random.Random(seed)`); multiply many probabilities in log space
