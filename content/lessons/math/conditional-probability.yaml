id: math.conditional-probability
concept: math.conditional-probability
title: "Conditional Probability and Bayes' Theorem"
subtitle: Why a positive result from a 99%-accurate test can still mean "probably not"
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Compute P(A|B) by counting inside a table, test events for independence, derive Bayes' theorem and use it
  to reverse a condition. Work the classic medical-test example exactly with fractions, confirm it with a
  seeded simulation, and see the same reasoning in spam filters, diagnostic metrics and model calibration.
objectives:
  - Compute a conditional probability from counts by restricting attention to the cases where the condition holds.
  - Distinguish P(A|B) from P(B|A) and explain why confusing them leads to wrong decisions.
  - Test whether two events are independent, and distinguish independent from mutually exclusive events.
  - Apply Bayes' theorem with the law of total probability to turn a prior and likelihoods into a posterior.
  - Explain the base-rate fallacy with an exact calculation and verify it with a seeded simulation.
  - Recognise conditional probabilities in spam filtering, diagnostic tests and classifier calibration.
