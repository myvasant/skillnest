  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - A vector is an ordered list of n numbers — an arrow with length and direction, or a row of features.
          - Add/subtract element-wise; multiply by a scalar to stretch, shrink or flip. Python lists need `zip`.
          - Norm (L2): `||v|| = √Σ vᵢ²` (`math.hypot`); distance: `||a − b||` (`math.dist`); L1: `Σ |vᵢ|`.
          - Dot product: `a · b = Σ aᵢbᵢ = ||a|| ||b|| cos θ` — positive (aligned), 0 (perpendicular), negative (opposed).
          - Cosine similarity `a·b / (||a|| ||b||)` ∈ [−1, 1] ignores length; it is the default way to compare embeddings.
          - Unit vectors: `v / ||v||`. For them, cosine = dot product, and distance gives the same ranking.
          - Compare floats with `math.isclose`; clamp before `acos`; never compare vectors from different models.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Explain the dot product geometrically" — `a·b = |a||b| cos θ`, the sign tells you the angle class,
          and with a unit vector it is a projection. "Why cosine similarity for embeddings?" — it compares
          direction (meaning) and ignores magnitude; for normalised vectors it equals the dot product, and
          ranking by Euclidean distance gives the same order.

items:
  - id: predict-list-plus
    type: predict-output
    skill: prediction
    prompt: What does this print?
    code: |
      u = [2, 0, 1]
      v = [1, 1, 1]
      print(u + v, len(2 * u))
    answer: "[2, 0, 1, 1, 1, 1] 6"
    explanation: >-
      For Python lists, `+` concatenates and `*` repeats. `u + v` is a six-element list, and `2 * u` is u
      repeated twice, so its length is 6. Vector addition would need `[x + y for x, y in zip(u, v)]`.
    wrongAnswers:
