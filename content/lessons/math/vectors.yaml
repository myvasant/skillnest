  - id: mcq-norm
    type: mcq
    skill: recognition
    prompt: What is the length (L2 norm) of the vector v = (1, 2, 2)?
    explanation: >-
      ||v|| = √(1² + 2² + 2²) = √(1 + 4 + 4) = √9 = 3. Square, sum, then take the square root.
    options:
      - id: a
        text: "3"
        correct: true
        feedback: Correct — √(1 + 4 + 4) = √9 = 3.
      - id: b
        text: "5"
        feedback: That is the L1 norm (1 + 2 + 2), which adds absolute values instead of squaring.
      - id: c
        text: "9"
        feedback: That is the sum of squares, ||v||². Take the square root to get the length.
      - id: d
        text: "√5 ≈ 2.24"
        feedback: That uses only the first two elements. The norm includes every element.

