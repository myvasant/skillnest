id: math.vectors
concept: math.vectors
title: Vectors, Norms and the Dot Product
subtitle: The geometry behind feature rows, embeddings and similarity search
estimatedMinutes: 50
reviewedOn: 2026-10-22
summary: >-
  Treat lists of numbers as vectors: add and scale them, measure their length (norm), and compare them with
  the dot product and cosine similarity — the measure embedding search uses. Everything is implemented
  from scratch in plain Python with the math module, so each formula becomes code you can test.
objectives:
  - Represent data as vectors and explain why Python lists do not behave like vectors under + and *.
  - Implement vector addition, subtraction and scalar multiplication, and describe their geometric meaning.
  - Compute the L2 and L1 norms and the Euclidean distance between two vectors.
  - Compute the dot product and interpret its sign and size geometrically (a·b = |a||b| cos θ).
  - Implement cosine similarity, explain why it ignores length, and why embedding search uses it.
  - Normalise vectors to unit length and explain why dot product, cosine and distance then rank results the same way.
sources:
  - title: Mathematics for Machine Learning (Ch. 2-3, linear algebra and analytic geometry)
    url: https://mml-book.github.io/
    publisher: Deisenroth, Faisal and Ong (Cambridge University Press, free PDF)
  - title: "Essence of linear algebra: Dot products and duality"
    url: https://www.3blue1brown.com/lessons/dot-products/
    publisher: 3Blue1Brown
  - title: "Dive into Deep Learning: Linear Algebra"
    url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
    publisher: Zhang, Lipton, Li and Smola (d2l.ai)
  - title: math — Mathematical functions (hypot, dist, sumprod, isclose)
    url: https://docs.python.org/3/library/math.html
    publisher: Python Software Foundation
    version: "3.14"
sections:
  - id: why
    title: Why turn things into lists of numbers?
    kind: why
    blocks:
      - type: markdown
        body: |
          A streaming service wants to recommend a film. Comparing films by hand — "this one has a bit more
          action, but less comedy..." — does not scale to millions of films and users. Instead, describe each
          film by a few numbers, here scores from 0 to 5 for *action*, *comedy* and *romance*, describe the
          viewer's taste the same way, and compute **one similarity score per film**:
      - type: code
        runnable: true
        code: |
          import math

          def cosine(a, b):
              dot = sum(x * y for x, y in zip(a, b))
              return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

          # each film scored 0-5 for [action, comedy, romance]
          films = {
              "Star Raid": [5, 1, 0],
              "Laugh Lane": [1, 5, 1],
              "Heart Song": [0, 2, 5],
              "Fast Fury": [4, 2, 1],
          }
          taste = [5, 2, 0]   # what this viewer enjoys

          ranked = sorted(films, key=lambda name: cosine(taste, films[name]), reverse=True)
          for name in ranked:
              print(f"{name:<10} {cosine(taste, films[name]):.3f}")
        expectedOutput: |
          Star Raid  0.983
          Fast Fury  0.973
          Laugh Lane 0.536
          Heart Song 0.138
        caption: Four lines of maths turn "which film is most like this taste?" into a sort.
      - type: markdown
        body: |
          Each list is a [vector](glossary:vector), and `cosine` is
          [cosine similarity](glossary:cosine-similarity). The same idea, with hundreds of numbers per item
          instead of three, powers recommendation systems, semantic search and retrieval-augmented generation:
          a model turns text into an [embedding](concept:rag.embeddings) vector, and "find relevant documents"
          means "find the vectors most similar to the query's vector". By the end of this lesson you will have
          built every piece of that function yourself and know exactly why it works.

  - id: what-is-a-vector
    title: What a vector is
    kind: concept
    blocks:
      - type: markdown
        body: |
          A **vector** is an **ordered list of n numbers**, written v = (v₁, v₂, …, vₙ). The count n is its
          **dimension**; the set of all such vectors is called ℝⁿ. Two views of the same object, both useful:

          - **A point or an arrow.** In 2-D, (3, 1) is the arrow from the origin to the point 3 right, 1 up.
            It has a **length** and a **direction**. The maths is identical in 3, 300 or 3,000 dimensions —
            we just cannot draw those.
          - **A row of features.** A customer as `[age, visits_per_month, basket_size]`, a pixel as
            `[red, green, blue]`, a sentence as a 768-number embedding.

          **Order matters**: (3, 1) and (1, 3) are different vectors. And you can only combine or compare
          vectors of the **same dimension** whose positions mean the same thing.

          In plain Python a vector is a list (or tuple) of numbers — but Python's list operators do **list**
          things, not vector things:
      - type: code
        runnable: true
        code: |
          a = [1, 2]
          b = [3, 4]
          print(a + b)                               # list concatenation
          print(3 * a)                               # list repetition
          print([x + y for x, y in zip(a, b)])       # vector addition, element by element
          print([3 * x for x in a])                  # scalar multiplication
        expectedOutput: |
          [1, 2, 3, 4]
          [1, 2, 1, 2, 1, 2]
          [4, 6]
          [3, 6]
        annotations:
          - line: 3
            text: "`+` on lists joins them. It does not add numbers."
          - line: 5
            text: "`zip` pairs up elements at the same position, which is what vector operations need."
      - type: callout
        variant: note
        title: NumPy does vector maths with operators
        body: |
          In data science code, vectors are usually NumPy arrays, for which `a + b` and `3 * a` *do* mean
          element-wise addition and scaling, implemented in fast compiled loops (see
          [NumPy](concept:data.numpy)). This lesson uses plain Python so that every step is visible and
          runnable here; the formulas are the same.
      - type: item
        ref: predict-list-plus

  - id: add-scale
    title: Adding, subtracting and scaling
    kind: concept
    blocks:
      - type: markdown
        body: |
          | Operation | Rule | Picture |
          |---|---|---|
          | **Addition** a + b | (a₁ + b₁, …, aₙ + bₙ) | put b's arrow at the tip of a's: tip-to-tail |
          | **Subtraction** b − a | (b₁ − a₁, …, bₙ − aₙ) | the arrow **from** a **to** b |
          | **Scalar multiplication** c·v | (c·v₁, …, c·vₙ) | stretch (c > 1), shrink (0 < c < 1) or flip (c < 0) |

          A *scalar* is just a single number. Implementing these with `zip(..., strict=True)` (Python 3.10+)
          has a bonus: vectors of different lengths raise an error instead of being silently truncated.
      - type: code
        runnable: true
        code: |
          def add(a, b):
              return [x + y for x, y in zip(a, b, strict=True)]

          def sub(a, b):
              return [x - y for x, y in zip(a, b, strict=True)]

          def scale(c, v):
              return [c * x for x in v]

          a = [3, 1]
          b = [1, 2]
          print(add(a, b), sub(b, a), scale(2, a), scale(-0.5, b))
          print("midpoint:", scale(0.5, add(a, b)))
          try:
              add([1, 2, 3], [4, 5])
          except ValueError as error:
              print("ValueError:", error)
        expectedOutput: |
          [4, 3] [-2, 1] [6, 2] [-0.5, -1.0]
          midpoint: [2.0, 1.5]
          ValueError: zip() argument 2 is shorter than argument 1
        annotations:
          - line: 12
            text: "b − a = (−2, 1): the step that takes you from point a to point b."
          - line: 13
            text: The average of vectors (their centroid) — used, for example, to summarise a cluster of embeddings.
          - line: 15
            text: Without strict=True, zip would quietly stop after two pairs and return a wrong answer.

  - id: norm
    title: "Length: the norm"
    kind: concept
    blocks:
      - type: markdown
        body: |
          The length of (3, 4) comes from Pythagoras: √(3² + 4²) = √25 = 5. The same formula works in any
          dimension and is called the **L2 norm** or Euclidean [norm](glossary:vector-norm):

          ```text
          ||v|| = √(v₁² + v₂² + … + vₙ²)
          ```

          Two relatives you will meet:

          - The **L1 norm** `|v₁| + |v₂| + … + |vₙ|` ("Manhattan" length — walking along grid streets).
          - The [Euclidean distance](glossary:euclidean-distance) between two points is the length of the
            arrow between them: `||a − b||`.

          Python's `math` module has both: `math.hypot(*v)` computes the L2 norm (any number of coordinates
          since Python 3.8) and `math.dist(a, b)` the Euclidean distance.
      - type: code
        runnable: true
        code: |
          import math

          def norm(v):
              return math.sqrt(sum(x * x for x in v))

          def l1_norm(v):
              return sum(abs(x) for x in v)

          print(norm([3, 4]), norm([2, 3, 6]), l1_norm([3, -4]))
          print(math.hypot(3, 4), math.hypot(*[2, 3, 6]))
          print(math.dist([1, 1], [4, 5]), norm([4 - 1, 5 - 1]))
        expectedOutput: |
          5.0 7.0 7
          5.0 7.0
          5.0 5.0
        annotations:
          - line: 4
            text: Square every element, add them up, take the square root.
          - line: 11
            text: "Distance from (1, 1) to (4, 5) = length of (3, 4) = 5."
      - type: item
        ref: mcq-norm

  - id: dot-product
    title: The dot product
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          The [dot product](glossary:dot-product) multiplies two equal-length vectors element by element and
          adds the results:

          ```text
          a · b = a₁b₁ + a₂b₂ + … + aₙbₙ
          ```

          It turns two vectors into **one number**. Step through the loop that computes it:
      - type: visualization
        component: python-tracer
        title: Accumulating a dot product
        caption: Each pass multiplies one pair of elements and adds the product to the running total.
        props:
          code: |
            a = [3, 1, 2]
            b = [2, -1, 4]
            total = 0
            for x, y in zip(a, b):
                total = total + x * y
            print(total)
      - type: code
        runnable: true
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          print(dot([3, 1, 2], [2, -1, 4]))
          print(math.sumprod([3, 1, 2], [2, -1, 4]))
          print(dot([3, 4], [3, 4]), math.hypot(3, 4) ** 2)
        expectedOutput: |
          13
          13
          25 25.0
        annotations:
          - line: 7
            text: "`math.sumprod` (Python 3.12+) is the built-in dot product; it also raises ValueError for unequal lengths."
          - line: 8
            text: "A vector dotted with itself is its squared length: a · a = ||a||²."
      - type: markdown
        body: |
          **What the number means.** The dot product has a second, geometric formula:

          ```text
          a · b = ||a|| ||b|| cos θ
          ```

          where θ is the angle between the arrows. Lengths are never negative, so the **sign** of the dot
          product is the sign of cos θ:

          | a · b | angle θ | meaning |
          |---|---|---|
          | positive | less than 90° | they point in broadly the same direction |
          | zero | exactly 90° | perpendicular (*orthogonal*): no shared direction |
          | negative | more than 90° | they point in broadly opposite directions |

          Another reading: if b has length 1, `a · b` is the length of a's "shadow" on b's direction — how much
          of a lies along b. Rearranging the formula gives the angle itself:
      - type: code
        runnable: true
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          def norm(v):
              return math.sqrt(dot(v, v))

          def angle_degrees(a, b):
              cos_theta = dot(a, b) / (norm(a) * norm(b))
              cos_theta = max(-1.0, min(1.0, cos_theta))
              return math.degrees(math.acos(cos_theta))

          for a, b in [([3, 1], [1, 2]), ([3, 0], [0, 2]), ([2, 1], [-2, -1]), ([2, 0], [1, 3])]:
              print(a, b, "dot =", dot(a, b), "angle =", round(angle_degrees(a, b), 1))
        expectedOutput: |
          [3, 1] [1, 2] dot = 5 angle = 45.0
          [3, 0] [0, 2] dot = 0 angle = 90.0
          [2, 1] [-2, -1] dot = -5 angle = 180.0
          [2, 0] [1, 3] dot = 2 angle = 71.6
        annotations:
          - line: 11
            text: Rounding can push the ratio a hair past ±1, where acos is undefined. Clamping keeps it in range (see the deep dive).
          - line: 12
            text: acos gives the angle in radians; math.degrees converts it.
      - type: item
        ref: predict-dot
      - type: item
        ref: mcq-dot-sign

  - id: cosine
    title: Cosine similarity — direction, not length
    kind: concept
    blocks:
      - type: markdown
        body: |
          The dot product mixes two things: how **aligned** the vectors are (cos θ) and how **long** they are.
          Divide the lengths out and only the alignment remains — that is cosine similarity:

          ```text
          cosine_similarity(a, b) = (a · b) / (||a|| ||b||) = cos θ
          ```

          It always lies between **−1** (opposite) and **1** (same direction), with **0** meaning unrelated
          (perpendicular). Multiplying either vector by a positive number does not change it. Drag the vectors
          below and watch the dot product, the cosine and the distance react differently — try the
          "Same direction, different length" preset:
      - type: visualization
        component: vector-similarity
        title: Dot product vs cosine similarity vs distance
        caption: "Make b twice as long without turning it: the dot product doubles, the cosine does not move."
        props:
          a: [3, 1]
          b: [1, 2]
      - type: markdown
        body: |
          **Why length is a problem.** Represent documents by word counts over the vocabulary
          `[cat, dog, purr, bark]`. A long article mentions "cat" a few times among hundreds of dog words; a
          short note is entirely about cats purring. Which is closer to the query "cat purr"?
      - type: code
        runnable: true
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          def norm(v):
              return math.sqrt(dot(v, v))

          def cosine_similarity(a, b):
              return dot(a, b) / (norm(a) * norm(b))

          # word counts for the vocabulary [cat, dog, purr, bark]
          query = [1, 0, 1, 0]                       # "cat purr"
          docs = {
              "short cat note": [1, 0, 1, 0],
              "short note x10": [10, 0, 10, 0],      # the same note pasted ten times
              "long dog article": [3, 8, 0, 6],
          }
          for name, vec in docs.items():
              print(f"{name:<17} dot={dot(query, vec):<3} cosine={cosine_similarity(query, vec):.3f}")
        expectedOutput: |
          short cat note    dot=2   cosine=1.000
          short note x10    dot=20  cosine=1.000
          long dog article  dot=3   cosine=0.203
        caption: The dot product prefers the long dog article over the cat note; cosine similarity does not.
        annotations:
          - line: 16
            text: Repeating the note makes it 10× longer but points it in exactly the same direction.
          - line: 17
            text: Three "cat"s give this article a bigger dot product than the cat note, purely because it is long.
      - type: markdown
        body: |
          **Why embeddings use cosine similarity.** An embedding model places texts so that *direction*
          encodes meaning. A vector's length can be influenced by things you usually do not want to rank by —
          how long or how frequent a text is, for example — so comparing directions is the safer default.
          In practice:

          - Many embedding models return vectors already normalised to length 1, and then cosine similarity
            and the dot product are the same number. Whether a particular model does this is model-specific —
            check its documentation, and use the similarity measure it recommends.
          - Vector databases let you choose the metric (cosine, inner product or Euclidean distance); see
            [vector similarity](concept:rag.vector-similarity) and
            [vector databases](concept:rag.vector-databases).
          - Similarity scores are only comparable **within one model**. Vectors from two different models
            live in unrelated spaces, even if they happen to have the same dimension.
      - type: item
        ref: predict-cosine-scale
      - type: item
        ref: explain-cosine-embeddings

  - id: unit-vectors
    title: Unit vectors and normalisation
    kind: concept
    blocks:
      - type: markdown
        body: |
          Dividing a non-zero vector by its length gives a [unit vector](glossary:unit-vector) — same
          direction, length 1. This is called **normalising** (or L2-normalising) the vector:

          ```text
          v̂ = v / ||v||
          ```

          Two consequences make normalisation the standard preprocessing step for similarity search:

          1. For unit vectors, **cosine similarity equals the dot product** (the lengths in the denominator
             are both 1), and a dot product is cheaper to compute.
          2. For unit vectors, **Euclidean distance and cosine similarity give the same ranking**, because
             `||a − b||² = ||a||² + ||b||² − 2 a·b = 2 − 2 cos θ`. Larger cosine ⇔ smaller distance.

          The zero vector has no direction and cannot be normalised.
      - type: code
        runnable: true
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          def norm(v):
              return math.sqrt(dot(v, v))

          def normalize(v):
              length = norm(v)
              if length == 0:
                  raise ValueError("cannot normalise the zero vector")
              return [x / length for x in v]

          u = normalize([3, 4])
          print(u, math.isclose(norm(u), 1.0))

          query = normalize([1, 0, 1, 0])
          docs = {"short": [1, 0, 1, 0], "mixed": [2, 1, 1, 0], "long": [3, 8, 0, 6]}
          for name, vec in docs.items():
              d = normalize(vec)
              print(f"{name:<6} cosine={dot(query, d):.3f}  distance={math.dist(query, d):.3f}")
        expectedOutput: |
          [0.6, 0.8] True
          short  cosine=1.000  distance=0.000
          mixed  cosine=0.866  distance=0.518
          long   cosine=0.203  distance=1.262
        caption: Highest cosine ⇔ smallest distance once everything has length 1. Check one row against √(2 − 2 cos θ).
        annotations:
          - line: 16
            text: "Compare floats with math.isclose: rounding can leave the length a tiny fraction away from 1."
          - line: 21
            text: After normalising, the dot product is the cosine similarity.
      - type: item
        ref: tf-unit-distance

  - id: under-the-hood
    title: Under the hood — floating point, speed and high dimensions
    kind: internals
    depth: deep
    blocks:
      - type: markdown
        body: |
          **Rounding can push a cosine past 1.** Mathematically, a vector compared with itself has cosine
          exactly 1. In floating point, `√3 × √3` is slightly *less* than 3, so the ratio comes out slightly
          *more* than 1 — and `math.acos` rejects anything outside [−1, 1]:
      - type: code
        runnable: true
        code: |
          import math

          v = [1, 1, 1]
          dot_vv = sum(x * x for x in v)
          c = dot_vv / (math.sqrt(dot_vv) * math.sqrt(dot_vv))
          print(c)
          try:
              math.acos(c)
          except ValueError:
              print("math.acos raised ValueError")
          print(math.degrees(math.acos(max(-1.0, min(1.0, c)))))
        expectedOutput: |
          1.0000000000000002
          math.acos raised ValueError
          0.0
        caption: Clamp to [−1, 1] before calling acos. For ranking you rarely need the angle at all — compare cosines directly.
      - type: markdown
        body: |
          `math.sumprod` (3.12+) computes float products and sums with extended precision, and
          `math.hypot` is accurate to within one unit in the last place, so prefer them when accuracy matters.

          **High dimensions behave unlike 2-D intuition.** Two *random* directions in 2-D are often quite
          aligned; in 1,000 dimensions they are almost always nearly perpendicular. That is why a cosine of
          0.3 can be meaningful for embeddings, and why thresholds must be calibrated per model:
      - type: code
        runnable: true
        code: |
          import math
          import random

          random.seed(7)

          def random_vector(n):
              return [random.gauss(0, 1) for _ in range(n)]

          def cosine(a, b):
              return math.sumprod(a, b) / (math.hypot(*a) * math.hypot(*b))

          for n in (2, 10, 1000):
              sims = [abs(cosine(random_vector(n), random_vector(n))) for _ in range(200)]
              print(f"n={n:<5} average |cosine| of random pairs: {sum(sims) / len(sims):.3f}")
        expectedOutput: |
          n=2     average |cosine| of random pairs: 0.643
          n=10    average |cosine| of random pairs: 0.237
          n=1000  average |cosine| of random pairs: 0.023
        caption: Seeded, so the numbers are reproducible. The average shrinks roughly like 1/√n.
      - type: markdown
        body: |
          **Speed.** A Python loop handles each element as a separate object, costing tens of nanoseconds per
          multiply-add. NumPy stores numbers in contiguous arrays and runs compiled loops, typically one to two
          orders of magnitude faster, and it compares a query against a whole matrix of documents in one call
          (a matrix–vector product — see [matrices](concept:math.matrices)). For millions of vectors, vector
          databases use approximate nearest-neighbour indexes (such as HNSW) instead of comparing against
          every vector.
      - type: code
        language: python
        status: illustrative
        code: |
          import numpy as np                      # third-party: pip install numpy

          docs = np.array([[1, 0, 1, 0], [2, 1, 1, 0], [3, 8, 0, 6]], dtype=float)
          query = np.array([1, 0, 1, 0], dtype=float)

          docs /= np.linalg.norm(docs, axis=1, keepdims=True)   # normalise every row
          query /= np.linalg.norm(query)
          scores = docs @ query                                  # all cosine similarities at once
          print(np.argsort(-scores))                             # best match first: [0 1 2]
        caption: >-
          The same ranking with NumPy (not run here: NumPy is not part of the verified browser examples). Run it
          locally after `pip install numpy`.

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | `[1, 2] + [3, 4]` gives `[1, 2, 3, 4]` | List `+` concatenates | Add element-wise with `zip`, or use NumPy arrays. |
          | A similarity silently ignores the last features | `zip` stops at the shorter list | `zip(a, b, strict=True)` or `math.sumprod` raise ValueError instead. |
          | `ZeroDivisionError: float division by zero` | Cosine of a zero vector (e.g. an empty document) | Check for zero length and decide what it should mean. |
          | `ValueError` from `math.acos` | Rounding pushed the cosine just past ±1 | Clamp with `max(-1.0, min(1.0, c))`. |
          | Cosine values above 1 or tiny values like 0.1 for parallel vectors | Divided by the squared lengths (forgot the square root) | Divide by `norm(a) * norm(b)`, where norm includes `sqrt`. |
          | Long documents always win | Ranking by raw dot product of unnormalised vectors | Use cosine similarity, or normalise first. |
          | Similarity scores look random | Comparing vectors from different embedding models, or features in different orders | Embed everything with one model; keep one feature order. |
      - type: code
        runnable: true
        code: |
          import math

          def cosine_similarity(a, b):
              dot = sum(x * y for x, y in zip(a, b))
              return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

          print(cosine_similarity([0, 0, 0], [1, 2, 3]))
        expectError: ZeroDivisionError
        caption: A zero vector has no direction, so its cosine with anything is undefined.
      - type: item
        ref: debug-cosine

  - id: practice
