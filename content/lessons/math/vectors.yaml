  - id: m-code-euclidean
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write two functions without `math.dist` or `math.hypot`:

      - `euclidean_distance(a, b)` — the straight-line distance √Σ(aᵢ − bᵢ)²; raise `ValueError` if the
        lengths differ;
      - `nearest(point, points)` — the **index** in `points` of the point closest to `point`.
    starterCode: |
      import math

      def euclidean_distance(a, b):
          ...

      def nearest(point, points):
          ...

      points = [[0, 0], [5, 5], [1, 2], [-3, 1]]
      print(euclidean_distance([0, 0], [3, 4]))
      print(nearest([2, 2], points))
    solution: |
      import math

      def euclidean_distance(a, b):
          return math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b, strict=True)))

      def nearest(point, points):
          return min(range(len(points)), key=lambda i: euclidean_distance(point, points[i]))

      points = [[0, 0], [5, 5], [1, 2], [-3, 1]]
      print(euclidean_distance([0, 0], [3, 4]))
      print(nearest([2, 2], points))
    expectedOutput: |
      5.0
      2
    tests:
      - name: distances
        code: |
          import math
          for a, b, expected in [([0, 0], [3, 4], 5.0), ([1, 2, 3], [1, 2, 3], 0.0), ([1, 1, 1], [2, 3, 3], 3.0), ([-1], [2], 3.0)]:
              got = euclidean_distance(a, b)
              assert got is not None and math.isclose(got, expected, abs_tol=1e-12), f"euclidean_distance({a}, {b}) should be {expected}, got {got!r}."
      - name: rejects different lengths
        code: |
          try:
              euclidean_distance([1, 2], [1, 2, 3])
          except ValueError:
              pass
          else:
              raise AssertionError("euclidean_distance([1, 2], [1, 2, 3]) should raise ValueError (zip(..., strict=True) does this).")
      - name: nearest returns the index of the closest point
        code: |
          got = nearest([2, 2], [[0, 0], [5, 5], [1, 2], [-3, 1]])
          assert got == 2, f"nearest([2, 2], ...) should be index 2 (the point [1, 2]), got {got!r}."
          got = nearest([10, -1, 0], [[0, 0, 0], [9, 0, 1], [10, 5, 0]])
          assert got == 1, f"Expected index 1, got {got!r}. Return the position in the list, not the point."
          got = nearest([0, 0], [[3, 3]])
          assert got == 0, "With a single point the answer is index 0."
      - name: implemented from the definition
        code: |
          assert not (calls("dist") or calls("hypot")), "Compute the distance yourself with zip, ** 2, sum and math.sqrt."
    hints:
      - "Subtract matching elements, square, sum, square-root: `math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b, strict=True)))`."
      - "For nearest, loop over `range(len(points))` and keep the index with the smallest distance — or use `min` with a `key`."
    feedback:
      - when: { outputContains: "[1, 2]" }
        message: nearest should return the index of the closest point (2), not the point itself.
    explanation: >-
      The distance is the norm of the difference vector. `min(range(len(points)), key=...)` scores every index by
      its distance to the query point and returns the index with the smallest score — a brute-force nearest-neighbour
      search, which vector databases speed up with approximate indexes.

