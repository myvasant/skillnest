sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Σ notation compactly describes sums such as means and losses; it translates directly into a Python loop
      or sum(). Means, variances, losses and dot products are written with Σ in every textbook and paper; translating
      Σ into code and back is how formulas become working programs.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- `Σ_{i=1}^{n} x_i` means x_1 + x_2 + ... + x_n; i is the index, 1 and n are the bounds and x_i is the
      term.

      - The mean `(1/n) Σ x_i` is `sum(xs) / len(xs)` in plain Python and `x.mean()` in NumPy.

      - Constants factor out and sums split: `Σ c·x_i = c Σ x_i` and `Σ (x_i + y_i) = Σ x_i + Σ y_i`.

      - A double sum `Σ_i Σ_j a_ij` is a nested loop; Π is the product symbol, as in a likelihood `Π p(x_i)`, whose
      logarithm becomes a sum.

      - Maths usually indexes from 1 and Python from 0, so `Σ_{i=1}^{n} x_i` becomes a loop over `x[0]` to `x[n-1]`,
      i.e. `range(n)`.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- `(Σ x_i)^2` is not `Σ x_i^2`; squaring a sum and summing squares give different results.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def arithmetic_sum(start, step, count):\n    return sum(start + step * i for i in range(max(0, count)))\n\
      \nprint(arithmetic_sum(2, 3, 4))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: summation-notation-code
  - type: item
    ref: summation-notation-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - `Σ_{i=1}^{n} x_i` means x_1 + x_2 + ... + x_n; i is the index, 1 and n are the bounds and x_i is the term.

      - The mean `(1/n) Σ x_i` is `sum(xs) / len(xs)` in plain Python and `x.mean()` in NumPy.

      - Constants factor out and sums split: `Σ c·x_i = c Σ x_i` and `Σ (x_i + y_i) = Σ x_i + Σ y_i`.

      - A double sum `Σ_i Σ_j a_ij` is a nested loop; Π is the product symbol, as in a likelihood `Π p(x_i)`, whose
      logarithm becomes a sum.

      - Maths usually indexes from 1 and Python from 0, so `Σ_{i=1}^{n} x_i` becomes a loop over `x[0]` to `x[n-1]`,
      i.e. `range(n)`.


      **Watch for**

      - `(Σ x_i)^2` is not `Σ x_i^2`; squaring a sum and summing squares give different results.'
