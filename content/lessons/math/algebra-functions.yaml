sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Functions map inputs to outputs; exponentials grow multiplicatively and logarithms undo them — both appear
      everywhere in ML. Loss functions, probabilities, learning-rate schedules and scaling laws are written as functions
      with exponents and logarithms; reading them fluently is the entry ticket to ML maths.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A function maps each input to exactly one output, for example `f(x) = 2x + 1`; composition `f(g(x))`
      feeds one function''s output into another.

      - Exponent rules: `a^m · a^n = a^(m+n)`, `(a^m)^n = a^(mn)`, `a^0 = 1` and `a^(-n) = 1 / a^n`.

      - `log_b(x)` answers "b to what power gives x?"; logs turn products into sums, `log(xy) = log x + log y`,
      and powers into multiples, `log(x^k) = k log x`.

      - `exp(x) = e^x` and the natural log `ln` undo each other; ML formulas use natural logs unless stated otherwise
      (`math.log` and `np.log` are natural logs).

      - Exponential growth multiplies by a constant factor each step, while logarithmic growth adds a constant each
      time the input doubles, which is why binary search over a million items needs only about 20 steps.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- `log(a + b)` is not `log a + log b`; only products split into sums.

      - In Python `^` is bitwise XOR, not a power; use `**` or `math.pow`.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def evaluate_linear(x, slope, intercept):\n    return slope * x + intercept\n\nprint(evaluate_linear(4,\
      \ 3, 2))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
