- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A function maps each input to exactly one output, for example `f(x) = 2x + 1`; composition `f(g(x))` feeds
      one function''s output into another.

      - Exponent rules: `a^m · a^n = a^(m+n)`, `(a^m)^n = a^(mn)`, `a^0 = 1` and `a^(-n) = 1 / a^n`.

      - `log_b(x)` answers "b to what power gives x?"; logs turn products into sums, `log(xy) = log x + log y`,
      and powers into multiples, `log(x^k) = k log x`.

      - `exp(x) = e^x` and the natural log `ln` undo each other; ML formulas use natural logs unless stated otherwise
      (`math.log` and `np.log` are natural logs).

      - Exponential growth multiplies by a constant factor each step, while logarithmic growth adds a constant each
      time the input doubles, which is why binary search over a million items needs only about 20 steps.


      **Watch for**

      - `log(a + b)` is not `log a + log b`; only products split into sums.

      - In Python `^` is bitwise XOR, not a power; use `**` or `math.pow`.'
