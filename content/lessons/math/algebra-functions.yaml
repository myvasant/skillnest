- id: algebra-functions-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for functions, exponents and logarithms. The tests include ordinary values
    and at least one boundary or invalid input.
  starterCode: "def evaluate_linear(x, slope, intercept):\n    raise NotImplementedError('Complete this function')"
  solution: "def evaluate_linear(x, slope, intercept):\n    return slope * x + intercept"
  tests:
  - name: Core calculation
    code: assert evaluate_linear(4, 3, 2) == 14
  - name: Boundary behaviour
    code: assert evaluate_linear(0, -2, 7) == 7
  hints:
