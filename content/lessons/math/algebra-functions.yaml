concept: math.algebra-functions
title: Functions, exponents and logarithms
subtitle: Functions map inputs to outputs; exponentials grow multiplicatively and logarithms undo them — both appear
  everywhere in ML
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Functions map inputs to outputs; exponentials grow multiplicatively and logarithms undo them — both appear
  everywhere in ML.
objectives:
- Explain the mathematical idea behind functions, exponents and logarithms.
- Interpret the notation and connect it to a concrete numerical example.
- Use a small computation to check assumptions and edge cases.
