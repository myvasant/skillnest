- id: algebra-functions-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of functions, exponents and logarithms?
  explanation: A function maps each input to exactly one output, for example `f(x) = 2x + 1`; composition `f(g(x))`
    feeds one function's output into another.
  options:
  - id: a
    text: A function maps each input to exactly one output, for example `f(x) = 2x + 1`; composition `f(g(x))` feeds
      one function's output into another.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: '`log(a + b)` is not `log a + log b`; only products split into sums.'
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: algebra-functions-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '`log(a + b)` is not `log a + log b`; only products split into sums.'
  answer: false
