cheatsheet: '**Key ideas**

  - The derivative `f''(x) = lim_{h→0} (f(x+h) - f(x)) / h` is the slope of the tangent line, i.e. how fast f changes
  as x changes.

  - Rules to know: `d/dx x^n = n x^(n-1)`, `d/dx e^x = e^x`, `d/dx ln x = 1/x`, the sum and constant-multiple rules,
  and the product rule `(fg)'' = f''g + fg''`.

  - Chain rule: if `y = f(g(x))` then `dy/dx = f''(g(x)) · g''(x)`; multiply the local derivatives along the chain.

  - Where `f''(x) = 0` the function is flat (a minimum, maximum or saddle point); the sign of f'' says whether f
  is increasing or decreasing.

  - Check a derivative numerically with the central difference `(f(x+h) - f(x-h)) / (2h)` for a small h such as
  1e-5.


  **Assumptions and limitations**

  - The derivative at a point is a number (a slope), not the value of the function there.

  - The chain rule is not `f''(g''(x))`; evaluate f'' at g(x), then multiply by g''(x).'
