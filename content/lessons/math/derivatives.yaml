sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A derivative is an instantaneous rate of change; the chain rule differentiates compositions — the core
      of backpropagation. Training means adjusting parameters to reduce a loss, and derivatives say in which direction
      and how strongly each change affects it; backpropagation is the chain rule applied systematically.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The derivative `f''(x) = lim_{h→0} (f(x+h) - f(x)) / h` is the slope of the tangent line, i.e. how
      fast f changes as x changes.

      - Rules to know: `d/dx x^n = n x^(n-1)`, `d/dx e^x = e^x`, `d/dx ln x = 1/x`, the sum and constant-multiple
      rules, and the product rule `(fg)'' = f''g + fg''`.

      - Chain rule: if `y = f(g(x))` then `dy/dx = f''(g(x)) · g''(x)`; multiply the local derivatives along the
      chain.

      - Where `f''(x) = 0` the function is flat (a minimum, maximum or saddle point); the sign of f'' says whether
      f is increasing or decreasing.

      - Check a derivative numerically with the central difference `(f(x+h) - f(x-h)) / (2h)` for a small h such
      as 1e-5.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- The derivative at a point is a number (a slope), not the value of the function there.

      - The chain rule is not `f''(g''(x))`; evaluate f'' at g(x), then multiply by g''(x).'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def central_difference(f, x, h=1e-5):\n    if h <= 0: raise ValueError(\"h must be positive\")\n    return\
      \ (f(x + h) - f(x - h)) / (2 * h)\n\nprint(round(central_difference(lambda x: x*x, 3), 5))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: derivatives-code
  - type: item
    ref: derivatives-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - The derivative `f''(x) = lim_{h→0} (f(x+h) - f(x)) / h` is the slope of the tangent line, i.e. how fast
      f changes as x changes.

      - Rules to know: `d/dx x^n = n x^(n-1)`, `d/dx e^x = e^x`, `d/dx ln x = 1/x`, the sum and constant-multiple
      rules, and the product rule `(fg)'' = f''g + fg''`.

      - Chain rule: if `y = f(g(x))` then `dy/dx = f''(g(x)) · g''(x)`; multiply the local derivatives along the
      chain.

      - Where `f''(x) = 0` the function is flat (a minimum, maximum or saddle point); the sign of f'' says whether
      f is increasing or decreasing.

      - Check a derivative numerically with the central difference `(f(x+h) - f(x-h)) / (2h)` for a small h such
      as 1e-5.


      **Watch for**

      - The derivative at a point is a number (a slope), not the value of the function there.

      - The chain rule is not `f''(g''(x))`; evaluate f'' at g(x), then multiply by g''(x).'
