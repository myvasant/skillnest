items:
- id: derivatives-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of derivatives and the chain rule?
  explanation: The derivative `f'(x) = lim_{h→0} (f(x+h) - f(x)) / h` is the slope of the tangent line, i.e. how
    fast f changes as x changes.
  options:
  - id: a
    text: The derivative `f'(x) = lim_{h→0} (f(x+h) - f(x)) / h` is the slope of the tangent line, i.e. how fast
      f changes as x changes.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: The derivative at a point is a number (a slope), not the value of the function there.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: derivatives-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: The derivative at a point is a number (a slope), not the value of the function there.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: derivatives-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of derivatives and the chain rule. State the assumptions you are making,
    interpret the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: derivatives-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for derivatives and the chain rule. The tests include ordinary values and at
    least one boundary or invalid input.
  starterCode: "def central_difference(f, x, h=1e-05):\n    raise NotImplementedError('Complete this function')"
  solution: "def central_difference(f, x, h=1e-5):\n    if h <= 0: raise ValueError(\"h must be positive\")\n  \
    \  return (f(x + h) - f(x - h)) / (2 * h)"
  tests:
  - name: Core calculation
    code: 'assert abs(central_difference(lambda x: x*x, 3) - 6) < 1e-4'
  - name: Boundary behaviour
    code: 'assert abs(central_difference(lambda x: 5*x + 2, 10) - 5) < 1e-5

      try: central_difference(lambda x: x, 1, 0)

      except ValueError: pass

      else: raise AssertionError("zero step must fail")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
