cheatsheet: |
  ```python
  def numerical_derivative(f, x, h=1e-5):          # central difference, error ~ h²
      return (f(x + h) - f(x - h)) / (2 * h)

  x = start
  for _ in range(steps):                           # gradient descent
      x = x - learning_rate * grad(x)              # subtract: the gradient points uphill

  # linear regression, MSE loss: errors e_i = w*x_i + b - y_i
  dw = 2 / n * sum(e * x for e, x in zip(errors, xs))
  db = 2 / n * sum(errors)
  w, b = w - lr * dw, b - lr * db                  # simultaneous update
  ```
  - Learning rate: too small → slow · too large → oscillation, divergence, inf, NaN
  - For (x − c)²: each step multiplies the distance by (1 − 2η); stable for 0 < η < 1
  - Convex → local minimum = global minimum · non-convex → result depends on the start
  - Check hand-derived gradients against central differences; judge models on held-out data
