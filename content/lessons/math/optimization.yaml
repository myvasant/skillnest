id: math.optimization
concept: math.optimization
title: Optimisation and Gradient Descent
subtitle: How models learn — by repeatedly stepping downhill on a loss
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Training a model means finding parameters that make a loss small. Learn to read the derivative as a slope
  (and estimate it numerically), derive the gradient-descent update, see what the learning rate does when it
  is too small, right or too large, understand local versus global minima and convexity, and fit a straight
  line to seeded data by gradient descent in plain Python — checked against the exact answer.
objectives:
  - Explain what a loss function is and what it means to minimise it.
  - Estimate a derivative with forward and central finite differences and compare it with the analytic derivative.
  - Apply the update rule x ← x − η·f′(x) by hand and in code, and choose a stopping rule.
  - Predict how a learning rate that is too small, well chosen or too large affects convergence, including divergence to inf and NaN.
  - Distinguish local and global minima and explain why convex losses make gradient descent reliable.
  - Fit a two-parameter model (a line) by gradient descent on mean squared error and verify the gradients numerically.
