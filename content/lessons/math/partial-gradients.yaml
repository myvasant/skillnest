items:
- id: partial-gradients-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of partial derivatives and gradients?
  explanation: A partial derivative `∂f/∂x` differentiates with respect to one variable while holding all the others
    constant.
  options:
  - id: a
    text: A partial derivative `∂f/∂x` differentiates with respect to one variable while holding all the others
      constant.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: The gradient points uphill; to minimise a loss you step in the negative gradient direction.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: partial-gradients-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: The gradient points uphill; to minimise a loss you step in the negative gradient direction.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: partial-gradients-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of partial derivatives and gradients. State the assumptions you are making,
    interpret the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: partial-gradients-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for partial derivatives and gradients. The tests include ordinary values and
    at least one boundary or invalid input.
  starterCode: "import math\n\ndef gradient_norm(components):\n    raise NotImplementedError('Complete this function')"
  solution: "import math\ndef gradient_norm(components):\n    return math.sqrt(sum(value * value for value in components))"
  tests:
  - name: Core calculation
    code: assert gradient_norm([3, 4]) == 5
  - name: Boundary behaviour
    code: 'assert gradient_norm([]) == 0

      assert abs(gradient_norm([1, 1, 1]) - math.sqrt(3)) < 1e-10'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
