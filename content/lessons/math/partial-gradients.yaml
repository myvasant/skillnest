  publisher: Zhang, Lipton, Li and Smola (d2l.ai)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: For functions of many variables, partial derivatives form the gradient, which points uphill most steeply.
      A model's loss depends on millions of parameters; the gradient bundles every parameter's sensitivity into
      one vector that the optimiser follows.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A partial derivative `∂f/∂x` differentiates with respect to one variable while holding all the others
      constant.

      - The gradient `∇f = (∂f/∂x_1, ..., ∂f/∂x_n)` points in the direction of steepest increase, and its length
      is the rate of increase in that direction.

      - A gradient has the same shape as the parameters it is taken with respect to; for a weight matrix W, `∂L/∂W`
      is a matrix of the same shape.

      - When a variable affects the output through several paths, the multivariable chain rule adds the contributions
      of each path; backpropagation does exactly this over the network''s computation graph.

      - Automatic differentiation (PyTorch autograd, JAX) computes exact gradients of your code mechanically, so
      you rarely derive them by hand - but you must understand what they mean.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- The gradient points uphill; to minimise a loss you step in the negative gradient direction.

      - Automatic differentiation is neither finite-difference approximation nor symbolic algebra; it applies the
      chain rule to the operations your code actually executed.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import math\ndef gradient_norm(components):\n    return math.sqrt(sum(value * value for value in components))\n\
      \nprint(gradient_norm([3, 4]))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: partial-gradients-code
  - type: item
    ref: partial-gradients-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A partial derivative `∂f/∂x` differentiates with respect to one variable while holding all the others constant.

      - The gradient `∇f = (∂f/∂x_1, ..., ∂f/∂x_n)` points in the direction of steepest increase, and its length
      is the rate of increase in that direction.

      - A gradient has the same shape as the parameters it is taken with respect to; for a weight matrix W, `∂L/∂W`
      is a matrix of the same shape.

      - When a variable affects the output through several paths, the multivariable chain rule adds the contributions
      of each path; backpropagation does exactly this over the network''s computation graph.

      - Automatic differentiation (PyTorch autograd, JAX) computes exact gradients of your code mechanically, so
      you rarely derive them by hand - but you must understand what they mean.


      **Watch for**

      - The gradient points uphill; to minimise a loss you step in the negative gradient direction.

      - Automatic differentiation is neither finite-difference approximation nor symbolic algebra; it applies the
      chain rule to the operations your code actually executed.'
