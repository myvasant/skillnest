id: math.descriptive-statistics
concept: math.descriptive-statistics
title: Descriptive statistics
subtitle: Mean, median, mode, variance, standard deviation, percentiles and correlation summarise data — and each
  can mislead in specific ways
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Mean, median, mode, variance, standard deviation, percentiles and correlation summarise data — and each
  can mislead in specific ways.
objectives:
- Explain the mathematical idea behind descriptive statistics.
- Interpret the notation and connect it to a concrete numerical example.
- Use a small computation to check assumptions and edge cases.
sources:
- title: 'Introductory Statistics 2e, Chapter 2: Descriptive Statistics'
  url: https://openstax.org/books/introductory-statistics-2e/pages/2-introduction
  publisher: OpenStax (Rice University)
- title: statistics — Mathematical statistics functions
  url: https://docs.python.org/3/library/statistics.html
  publisher: Python Software Foundation
- title: NIST/SEMATECH e-Handbook of Statistical Methods
  url: https://www.itl.nist.gov/div898/handbook/
  publisher: NIST
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Mean, median, mode, variance, standard deviation, percentiles and correlation summarise data — and each
      can mislead in specific ways. Before modelling or reporting anything you need a few honest numbers that describe
      the data, and you need to know when those numbers hide what is really going on.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The mean is pulled by outliers; the median (50th percentile) is robust to them; the mode is the most
      frequent value.

      - Spread is measured by variance and standard deviation (divide by n - 1 for a sample estimate), the range,
      and the interquartile range IQR = Q3 - Q1.

      - Percentiles describe tails - p50, p95 and p99 latency say more about user experience than the mean does.

      - Pearson correlation measures linear association between -1 and 1; Spearman correlation works on ranks and
      captures any monotonic relationship.

      - Always plot the data, because very different datasets can share the same mean, variance and correlation
      (Anscombe''s quartet).'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Correlation does not imply causation, and zero correlation does not mean no relationship; the relationship
      may be non-linear.

      - The mean is not the "typical" value of skewed data; report the median as well.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import statistics\ndef describe(values):\n    if not values: raise ValueError(\"at least one value is\
      \ required\")\n    return {\"count\": len(values), \"mean\": statistics.mean(values), \"median\": statistics.median(values),\n\
      \            \"stdev\": statistics.stdev(values) if len(values) > 1 else 0.0}\n\nprint(describe([2, 4, 4,\
      \ 4, 5, 5, 7, 9]))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: descriptive-statistics-code
  - type: item
    ref: descriptive-statistics-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - The mean is pulled by outliers; the median (50th percentile) is robust to them; the mode is the most frequent
      value.

      - Spread is measured by variance and standard deviation (divide by n - 1 for a sample estimate), the range,
      and the interquartile range IQR = Q3 - Q1.

      - Percentiles describe tails - p50, p95 and p99 latency say more about user experience than the mean does.

      - Pearson correlation measures linear association between -1 and 1; Spearman correlation works on ranks and
      captures any monotonic relationship.

      - Always plot the data, because very different datasets can share the same mean, variance and correlation
      (Anscombe''s quartet).


      **Watch for**

      - Correlation does not imply causation, and zero correlation does not mean no relationship; the relationship
      may be non-linear.

      - The mean is not the "typical" value of skewed data; report the median as well.'
  - type: item
    ref: descriptive-statistics-mcq
  - type: item
    ref: descriptive-statistics-tf
  - type: item
    ref: descriptive-statistics-code
items:
- id: descriptive-statistics-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of descriptive statistics?
  explanation: The mean is pulled by outliers; the median (50th percentile) is robust to them; the mode is the most
    frequent value.
  options:
  - id: a
    text: The mean is pulled by outliers; the median (50th percentile) is robust to them; the mode is the most frequent
      value.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: Correlation does not imply causation, and zero correlation does not mean no relationship; the relationship
      may be non-linear.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: descriptive-statistics-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Correlation does not imply causation, and zero correlation does not mean no relationship; the relationship
    may be non-linear.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: descriptive-statistics-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of descriptive statistics. State the assumptions you are making, interpret
    the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: descriptive-statistics-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for descriptive statistics. The tests include ordinary values and at least
    one boundary or invalid input.
  starterCode: "import statistics\n\ndef describe(values):\n    raise NotImplementedError('Complete this function')"
  solution: "import statistics\ndef describe(values):\n    if not values: raise ValueError(\"at least one value\
    \ is required\")\n    return {\"count\": len(values), \"mean\": statistics.mean(values), \"median\": statistics.median(values),\n\
    \            \"stdev\": statistics.stdev(values) if len(values) > 1 else 0.0}"
  tests:
  - name: Core calculation
    code: assert describe([1, 2, 3])["mean"] == 2
  - name: Boundary behaviour
    code: 'assert describe([1, 2, 3])["median"] == 2

      assert describe([5])["stdev"] == 0.0

      try: describe([])

      except ValueError: pass

      else: raise AssertionError("empty sample must fail")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
masteryCheck:
  passThreshold: 0.8
  items:
  - descriptive-statistics-mcq
  - descriptive-statistics-tf
  - descriptive-statistics-code
