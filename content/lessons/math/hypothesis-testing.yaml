id: math.hypothesis-testing
concept: math.hypothesis-testing
title: Hypothesis testing and A/B tests
subtitle: Null hypotheses, p-values, significance, power and multiple comparisons — what a test can and cannot tell
  you
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Null hypotheses, p-values, significance, power and multiple comparisons — what a test can and cannot tell
  you.
objectives:
- Explain the mathematical idea behind hypothesis testing and a/b tests.
- Interpret the notation and connect it to a concrete numerical example.
- Use a small computation to check assumptions and edge cases.
sources:
- title: 'Introductory Statistics 2e, Chapter 9: Hypothesis Testing with One Sample'
  url: https://openstax.org/books/introductory-statistics-2e/pages/9-introduction
  publisher: OpenStax (Rice University)
- title: 'The ASA''s Statement on p-Values: Context, Process, and Purpose'
  url: https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf
  publisher: American Statistical Association
- title: Statistical functions (scipy.stats)
  url: https://docs.scipy.org/doc/scipy/reference/stats.html
