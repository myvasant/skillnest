sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Null hypotheses, p-values, significance, power and multiple comparisons — what a test can and cannot tell
      you. A/B tests and model comparisons decide what ships; without proper testing, random noise looks like improvement
      and teams chase false wins.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The null hypothesis H0 assumes no effect; the p-value is the probability of seeing data at least as
      extreme as yours if H0 were true.

      - Fix the significance level α (often 0.05) in advance; p < α means "reject H0", not that the effect is large
      or important.

      - A Type I error is a false positive (rate α) and a Type II error a false negative (rate β); power = 1 - β
      grows with sample size and effect size.

      - Choose the sample size in advance with a power analysis; stopping as soon as p dips below 0.05 ("peeking")
      inflates false positives.

      - Testing many metrics or variants multiplies false discoveries; correct with Bonferroni or Benjamini-Hochberg,
      or pre-register one primary metric.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A p-value is not the probability that the null hypothesis is true, nor the probability that the result
      is "due to chance".

      - A non-significant result does not prove there is no effect; the test may simply lack power.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def absolute_difference(a, b):\n    return abs(a - b)\n\nprint(absolute_difference(0.54, 0.49))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: hypothesis-testing-code
  - type: item
    ref: hypothesis-testing-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - The null hypothesis H0 assumes no effect; the p-value is the probability of seeing data at least as extreme
      as yours if H0 were true.

      - Fix the significance level α (often 0.05) in advance; p < α means "reject H0", not that the effect is large
      or important.

      - A Type I error is a false positive (rate α) and a Type II error a false negative (rate β); power = 1 - β
      grows with sample size and effect size.

      - Choose the sample size in advance with a power analysis; stopping as soon as p dips below 0.05 ("peeking")
      inflates false positives.

      - Testing many metrics or variants multiplies false discoveries; correct with Bonferroni or Benjamini-Hochberg,
      or pre-register one primary metric.


      **Watch for**

      - A p-value is not the probability that the null hypothesis is true, nor the probability that the result is
      "due to chance".

      - A non-significant result does not prove there is no effect; the test may simply lack power.'
  - type: item
    ref: hypothesis-testing-mcq
  - type: item
    ref: hypothesis-testing-tf
  - type: item
    ref: hypothesis-testing-code
items:
- id: hypothesis-testing-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of hypothesis testing and a/b tests?
  explanation: The null hypothesis H0 assumes no effect; the p-value is the probability of seeing data at least
    as extreme as yours if H0 were true.
  options:
  - id: a
    text: The null hypothesis H0 assumes no effect; the p-value is the probability of seeing data at least as extreme
      as yours if H0 were true.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: A p-value is not the probability that the null hypothesis is true, nor the probability that the result
      is "due to chance".
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: hypothesis-testing-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A p-value is not the probability that the null hypothesis is true, nor the probability that the result
    is "due to chance".
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: hypothesis-testing-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of hypothesis testing and a/b tests. State the assumptions you are making,
    interpret the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: hypothesis-testing-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for hypothesis testing and a/b tests. The tests include ordinary values and
    at least one boundary or invalid input.
  starterCode: "def absolute_difference(a, b):\n    raise NotImplementedError('Complete this function')"
  solution: "def absolute_difference(a, b):\n    return abs(a - b)"
  tests:
  - name: Core calculation
    code: assert abs(absolute_difference(0.54, 0.49) - 0.05) < 1e-12
  - name: Boundary behaviour
    code: assert absolute_difference(2, 2) == 0
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
masteryCheck:
  passThreshold: 0.8
  items:
  - hypothesis-testing-mcq
  - hypothesis-testing-tf
  - hypothesis-testing-code
