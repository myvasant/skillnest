sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A random variable assigns numbers to outcomes; its expected value is the long-run average and variance
      measures spread. Losses, metrics, latencies and model outputs vary from run to run; expectation and variance
      are how you describe that variation and reason about averages.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A random variable X maps outcomes to numbers; a discrete one has a probability mass function, and a
      continuous one has a probability density function whose area over an interval gives a probability.

      - Expectation `E[X] = Σ x · P(X = x)` is the probability-weighted average, and it is always linear: `E[aX
      + bY] = a E[X] + b E[Y]`.

      - Variance `Var(X) = E[(X - E[X])^2] = E[X^2] - E[X]^2`; the standard deviation is its square root and has
      the same units as X.

      - `Var(aX + b) = a^2 Var(X)`, and for independent X and Y, `Var(X + Y) = Var(X) + Var(Y)`.

      - Covariance measures how two variables move together; correlation is covariance rescaled to lie between -1
      and 1.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A density value is not a probability and can be greater than 1; only areas under the density curve
      are probabilities.

      - Variances add for independent variables; standard deviations do not.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def expected_value(outcomes, probabilities):\n    if len(outcomes) != len(probabilities): raise ValueError(\"\
      length mismatch\")\n    if any(p < 0 for p in probabilities) or abs(sum(probabilities) - 1) > 1e-9: raise\
      \ ValueError(\"probabilities must sum to one\")\n    return sum(x * p for x, p in zip(outcomes, probabilities))\n\
      \nprint(expected_value([0, 1, 2], [0.2, 0.5, 0.3]))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: random-variables-code
  - type: item
    ref: random-variables-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A random variable X maps outcomes to numbers; a discrete one has a probability mass function, and a continuous
      one has a probability density function whose area over an interval gives a probability.

      - Expectation `E[X] = Σ x · P(X = x)` is the probability-weighted average, and it is always linear: `E[aX
      + bY] = a E[X] + b E[Y]`.

      - Variance `Var(X) = E[(X - E[X])^2] = E[X^2] - E[X]^2`; the standard deviation is its square root and has
      the same units as X.

      - `Var(aX + b) = a^2 Var(X)`, and for independent X and Y, `Var(X + Y) = Var(X) + Var(Y)`.

      - Covariance measures how two variables move together; correlation is covariance rescaled to lie between -1
      and 1.


      **Watch for**

      - A density value is not a probability and can be greater than 1; only areas under the density curve are probabilities.

      - Variances add for independent variables; standard deviations do not.'
