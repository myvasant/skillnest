items:
- id: random-variables-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of random variables, expectation and variance?
  explanation: A random variable X maps outcomes to numbers; a discrete one has a probability mass function, and
    a continuous one has a probability density function whose area over an interval gives a probability.
  options:
  - id: a
    text: A random variable X maps outcomes to numbers; a discrete one has a probability mass function, and a continuous
      one has a probability density function whose area over an interval gives a probability.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: A density value is not a probability and can be greater than 1; only areas under the density curve are
      probabilities.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: random-variables-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A density value is not a probability and can be greater than 1; only areas under the density curve are
    probabilities.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: random-variables-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of random variables, expectation and variance. State the assumptions you
    are making, interpret the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: random-variables-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for random variables, expectation and variance. The tests include ordinary
    values and at least one boundary or invalid input.
  starterCode: "def expected_value(outcomes, probabilities):\n    raise NotImplementedError('Complete this function')"
  solution: "def expected_value(outcomes, probabilities):\n    if len(outcomes) != len(probabilities): raise ValueError(\"\
    length mismatch\")\n    if any(p < 0 for p in probabilities) or abs(sum(probabilities) - 1) > 1e-9: raise ValueError(\"\
    probabilities must sum to one\")\n    return sum(x * p for x, p in zip(outcomes, probabilities))"
  tests:
  - name: Core calculation
    code: assert expected_value([0, 1, 2], [0.2, 0.5, 0.3]) == 1.1
  - name: Boundary behaviour
    code: 'try: expected_value([1, 2], [0.2, 0.2])

      except ValueError: pass

      else: raise AssertionError("probabilities must sum to one")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
