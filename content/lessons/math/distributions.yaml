  - type: item
    ref: distributions-code
items:
- id: distributions-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of probability distributions?
  explanation: Bernoulli(p) is one yes/no trial; Binomial(n, p) counts successes in n independent trials, with mean
    `np` and variance `np(1 - p)`.
  options:
  - id: a
    text: Bernoulli(p) is one yes/no trial; Binomial(n, p) counts successes in n independent trials, with mean `np`
      and variance `np(1 - p)`.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: Not all data is normal; incomes, latencies and word frequencies are heavily skewed or heavy-tailed, so
      mean plus or minus two standard deviations rules mislead.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: distributions-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Not all data is normal; incomes, latencies and word frequencies are heavily skewed or heavy-tailed, so
    mean plus or minus two standard deviations rules mislead.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: distributions-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of probability distributions. State the assumptions you are making, interpret
    the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: distributions-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for probability distributions. The tests include ordinary values and at least
    one boundary or invalid input.
  starterCode: "def normalise_weights(weights):\n    raise NotImplementedError('Complete this function')"
  solution: "def normalise_weights(weights):\n    if any(w < 0 for w in weights): raise ValueError(\"weights cannot\
    \ be negative\")\n    total = sum(weights)\n    if total <= 0: raise ValueError(\"total weight must be positive\"\
    )\n    return [w / total for w in weights]"
  tests:
  - name: Core calculation
    code: assert normalise_weights([2, 3, 5]) == [0.2, 0.3, 0.5]
  - name: Boundary behaviour
    code: 'try: normalise_weights([0, 0])

      except ValueError: pass

      else: raise AssertionError("zero total must fail")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
masteryCheck:
  passThreshold: 0.8
  items:
  - distributions-mcq
  - distributions-tf
  - distributions-code
