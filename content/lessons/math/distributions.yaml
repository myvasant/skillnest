summary: Bernoulli, binomial, uniform, normal and Poisson distributions model common processes; the normal distribution
  emerges from sums of many effects.
objectives:
- Explain the mathematical idea behind probability distributions.
- Interpret the notation and connect it to a concrete numerical example.
- Use a small computation to check assumptions and edge cases.
