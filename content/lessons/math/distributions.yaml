sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Bernoulli, binomial, uniform, normal and Poisson distributions model common processes; the normal distribution
      emerges from sums of many effects. Choosing a distribution means choosing a model of how data is generated;
      it underlies loss functions, simulations, priors, anomaly thresholds and statistical tests.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Bernoulli(p) is one yes/no trial; Binomial(n, p) counts successes in n independent trials, with mean
      `np` and variance `np(1 - p)`.

      - Uniform(a, b) makes every value in the interval equally likely; Poisson(λ) counts events in a fixed interval
      and has mean and variance both equal to λ.

      - The normal distribution N(μ, σ²) is a symmetric bell curve; about 68%, 95% and 99.7% of values lie within
      1, 2 and 3 standard deviations of the mean.

      - The central limit theorem says sums and averages of many independent variables with finite variance are
      approximately normal, whatever the original distribution.

      - In Python, `scipy.stats` gives probabilities (`norm.cdf`, `binom.pmf`) and `numpy.random.default_rng().normal(...)`
      draws samples.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Not all data is normal; incomes, latencies and word frequencies are heavily skewed or heavy-tailed,
      so mean plus or minus two standard deviations rules mislead.

      - The central limit theorem is about averages of samples; it does not make individual data points normal.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def normalise_weights(weights):\n    if any(w < 0 for w in weights): raise ValueError(\"weights cannot\
      \ be negative\")\n    total = sum(weights)\n    if total <= 0: raise ValueError(\"total weight must be positive\"\
      )\n    return [w / total for w in weights]\n\nprint(normalise_weights([2, 3, 5]))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: distributions-code
  - type: item
    ref: distributions-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Bernoulli(p) is one yes/no trial; Binomial(n, p) counts successes in n independent trials, with mean `np`
      and variance `np(1 - p)`.

      - Uniform(a, b) makes every value in the interval equally likely; Poisson(λ) counts events in a fixed interval
      and has mean and variance both equal to λ.

      - The normal distribution N(μ, σ²) is a symmetric bell curve; about 68%, 95% and 99.7% of values lie within
      1, 2 and 3 standard deviations of the mean.

      - The central limit theorem says sums and averages of many independent variables with finite variance are
      approximately normal, whatever the original distribution.

      - In Python, `scipy.stats` gives probabilities (`norm.cdf`, `binom.pmf`) and `numpy.random.default_rng().normal(...)`
      draws samples.


      **Watch for**

      - Not all data is normal; incomes, latencies and word frequencies are heavily skewed or heavy-tailed, so mean
      plus or minus two standard deviations rules mislead.

      - The central limit theorem is about averages of samples; it does not make individual data points normal.'
  - type: item
    ref: distributions-mcq
