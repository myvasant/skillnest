items:
- id: probability-basics-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of probability fundamentals?
  explanation: The sample space is the set of all possible outcomes and an event is a subset of it; probabilities
    lie between 0 and 1, and the whole sample space has probability 1.
  options:
  - id: a
    text: The sample space is the set of all possible outcomes and an event is a subset of it; probabilities lie
      between 0 and 1, and the whole sample space has probability 1.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: Independent and mutually exclusive are different ideas; two mutually exclusive events with non-zero probabilities
      are never independent.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: probability-basics-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Independent and mutually exclusive are different ideas; two mutually exclusive events with non-zero probabilities
    are never independent.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: probability-basics-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of probability fundamentals. State the assumptions you are making, interpret
    the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: probability-basics-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for probability fundamentals. The tests include ordinary values and at least
    one boundary or invalid input.
  starterCode: "def empirical_probability(successes, trials):\n    raise NotImplementedError('Complete this function')"
  solution: "def empirical_probability(successes, trials):\n    if trials <= 0: raise ValueError(\"trials must be\
    \ positive\")\n    if successes < 0 or successes > trials: raise ValueError(\"successes must be between zero\
    \ and trials\")\n    return successes / trials"
  tests:
  - name: Core calculation
    code: assert empirical_probability(18, 30) == 0.6
  - name: Boundary behaviour
    code: 'assert empirical_probability(0, 10) == 0

      try: empirical_probability(11, 10)

      except ValueError: pass

      else: raise AssertionError("success count cannot exceed trials")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
