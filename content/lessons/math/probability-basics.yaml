sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Sample spaces, events, and the rules for combining probabilities, with simulation in Python to check intuition.
      Models output probabilities, data is noisy and evaluation is statistical; reasoning correctly about uncertainty
      starts with a few basic rules.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The sample space is the set of all possible outcomes and an event is a subset of it; probabilities
      lie between 0 and 1, and the whole sample space has probability 1.

      - Complement rule `P(not A) = 1 - P(A)`; addition rule `P(A or B) = P(A) + P(B) - P(A and B)`.

      - Independent events satisfy `P(A and B) = P(A) · P(B)`; mutually exclusive events cannot happen together,
      so `P(A and B) = 0`.

      - With equally likely outcomes, P(A) is the number of outcomes in A divided by the total; permutations count
      ordered arrangements and combinations (`math.comb(n, k)`) unordered selections.

      - Check intuition by simulation - repeat a random experiment many times with `numpy.random.default_rng(seed)`
      and compare frequencies with your calculation.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Independent and mutually exclusive are different ideas; two mutually exclusive events with non-zero
      probabilities are never independent.

      - The gambler''s fallacy - after five heads in a row a fair coin is still 50/50 on the next flip.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def empirical_probability(successes, trials):\n    if trials <= 0: raise ValueError(\"trials must be\
      \ positive\")\n    if successes < 0 or successes > trials: raise ValueError(\"successes must be between zero\
      \ and trials\")\n    return successes / trials\n\nprint(empirical_probability(18, 30))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: probability-basics-code
  - type: item
    ref: probability-basics-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - The sample space is the set of all possible outcomes and an event is a subset of it; probabilities lie between
      0 and 1, and the whole sample space has probability 1.

      - Complement rule `P(not A) = 1 - P(A)`; addition rule `P(A or B) = P(A) + P(B) - P(A and B)`.

      - Independent events satisfy `P(A and B) = P(A) · P(B)`; mutually exclusive events cannot happen together,
      so `P(A and B) = 0`.

      - With equally likely outcomes, P(A) is the number of outcomes in A divided by the total; permutations count
      ordered arrangements and combinations (`math.comb(n, k)`) unordered selections.

      - Check intuition by simulation - repeat a random experiment many times with `numpy.random.default_rng(seed)`
      and compare frequencies with your calculation.


      **Watch for**

      - Independent and mutually exclusive are different ideas; two mutually exclusive events with non-zero probabilities
      are never independent.

      - The gambler''s fallacy - after five heads in a row a fair coin is still 50/50 on the next flip.'
