items:
- id: sampling-inference-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of sampling and statistical inference?
  explanation: A statistic computed on a sample, such as the sample mean, estimates a population parameter and varies
    from one sample to the next.
  options:
  - id: a
    text: A statistic computed on a sample, such as the sample mean, estimates a population parameter and varies
      from one sample to the next.
    correct: true
    feedback: 'Correct: this captures the mathematical rule introduced in the lesson.'
  - id: b
    text: A 95% confidence interval does not mean there is a 95% probability that this particular interval contains
      the true value; it means 95% of intervals built this way would.
    feedback: This is a misconception; check the conditions under which the formula applies.
  - id: c
    text: Numerical output is always exact and independent of precision or sample size.
    feedback: Numerical methods and statistical estimates have assumptions and limitations.
- id: sampling-inference-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A 95% confidence interval does not mean there is a 95% probability that this particular interval contains
    the true value; it means 95% of intervals built this way would.
  answer: false
  explanation: The statement is a known misconception. Mathematical results depend on definitions, assumptions and
    the domain of the inputs.
- id: sampling-inference-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Give a small numerical example of sampling and statistical inference. State the assumptions you are making,
    interpret the result, and explain one limitation or edge case.
  rubric:
  - Use a mathematically valid example and show the relevant calculation or reasoning.
  - Interpret what the result means rather than only giving a number.
  - Identify an assumption, limitation or edge case.
  modelAnswer: Choose a small example with values that make the calculation transparent. State the assumptions and
    units, perform the calculation step by step, and interpret the result in context. Check whether the result changes
    under a boundary case or a different assumption.
  explanation: A strong answer demonstrates both the procedure and the meaning and limitations of the result.
- id: sampling-inference-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the Python helper for sampling and statistical inference. The tests include ordinary values and
    at least one boundary or invalid input.
  starterCode: "def sample_mean(values):\n    raise NotImplementedError('Complete this function')"
  solution: "def sample_mean(values):\n    if not values: raise ValueError(\"sample cannot be empty\")\n    return\
    \ sum(values) / len(values)"
  tests:
  - name: Core calculation
    code: assert sample_mean([8, 9, 10, 11]) == 9.5
  - name: Boundary behaviour
    code: 'assert sample_mean([4]) == 4

      try: sample_mean([])

      except ValueError: pass

      else: raise AssertionError("empty sample must fail")'
  hints:
  - Translate the mathematical definition into a sequence of operations.
  - Check dimensions, domains and boundary values before calculating.
  - Use a tolerance when comparing floating-point results.
  explanation: This exercise checks the calculation and requires you to handle a boundary condition explicitly.
