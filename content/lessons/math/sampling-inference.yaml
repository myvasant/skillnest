sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Samples estimate population properties with uncertainty; the central limit theorem justifies confidence
      intervals. You almost never see the whole population (all users, all future data), so every metric is an estimate,
      and you need to know how uncertain it is before acting on it.
- id: notation
  title: Notation and intuition
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A statistic computed on a sample, such as the sample mean, estimates a population parameter and varies
      from one sample to the next.

      - The standard error of the mean is `σ / sqrt(n)`, so quadrupling the sample size halves the uncertainty.

      - By the central limit theorem, an approximate 95% confidence interval for a mean is `x̄ ± 1.96 · s / sqrt(n)`
      for large n; use the t distribution for small samples.

      - Bootstrapping estimates uncertainty by resampling the data with replacement many times and recomputing the
      statistic each time.

      - Biased samples (self-selection, survivorship, non-response) are not fixed by collecting more of the same
      data.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A 95% confidence interval does not mean there is a 95% probability that this particular interval contains
      the true value; it means 95% of intervals built this way would.

      - A larger sample reduces random error but does nothing about systematic bias.'
- id: worked-example
  title: Worked numerical example
  kind: walkthrough
  blocks:
  - type: markdown
    body: Work through the calculation by hand first, then run the small Python model. The code illustrates the
      operation; it does not replace understanding the assumptions behind the mathematics.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def sample_mean(values):\n    if not values: raise ValueError(\"sample cannot be empty\")\n    return\
      \ sum(values) / len(values)\n\nprint(sample_mean([8, 9, 10, 11]))"
    caption: Runnable numerical example using Python standard-library functionality.
- id: practice
  title: Practice and edge cases
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test both a typical input and a boundary case. Explain why the boundary behaviour
      is mathematically valid.
  - type: item
    ref: sampling-inference-code
  - type: item
    ref: sampling-inference-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - A statistic computed on a sample, such as the sample mean, estimates a population parameter and varies from
      one sample to the next.

      - The standard error of the mean is `σ / sqrt(n)`, so quadrupling the sample size halves the uncertainty.

      - By the central limit theorem, an approximate 95% confidence interval for a mean is `x̄ ± 1.96 · s / sqrt(n)`
      for large n; use the t distribution for small samples.

      - Bootstrapping estimates uncertainty by resampling the data with replacement many times and recomputing the
      statistic each time.

      - Biased samples (self-selection, survivorship, non-response) are not fixed by collecting more of the same
      data.


      **Watch for**

      - A 95% confidence interval does not mean there is a 95% probability that this particular interval contains
      the true value; it means 95% of intervals built this way would.

      - A larger sample reduces random error but does nothing about systematic bias.'
