id: math.sampling-inference
concept: math.sampling-inference
title: Sampling and statistical inference
subtitle: Samples estimate population properties with uncertainty; the central limit theorem justifies confidence
  intervals
estimatedMinutes: 40
reviewedOn: '2026-11-04'
summary: Samples estimate population properties with uncertainty; the central limit theorem justifies confidence
  intervals.
objectives:
- Explain the mathematical idea behind sampling and statistical inference.
- Interpret the notation and connect it to a concrete numerical example.
- Use a small computation to check assumptions and edge cases.
