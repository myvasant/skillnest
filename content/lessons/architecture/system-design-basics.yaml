id: architecture.system-design-basics
concept: architecture.system-design-basics
title: System design fundamentals
subtitle: Start from functional and non-functional requirements, sketch components and data flows, identify bottlenecks
  and state trade-offs explicitly
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Start from functional and non-functional requirements, sketch components and data flows, identify bottlenecks
  and state trade-offs explicitly.
objectives:
- Explain the core engineering decisions behind system design fundamentals.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: The System Design Primer
  url: https://github.com/donnemartin/system-design-primer
  publisher: Donne Martin (GitHub)
- title: AWS Well-Architected Framework
  url: https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html
  publisher: Amazon Web Services
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Start from functional and non-functional requirements, sketch components and data flows, identify bottlenecks
      and state trade-offs explicitly. Jumping straight to technology choices produces systems that miss the real
      requirements; a structured approach makes the design fit the problem and makes its trade-offs visible.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Start with functional requirements (what the system does) and non-functional requirements (scale, latency,
      availability, consistency, cost, security, compliance), with numbers wherever possible.

      - Sketch the high-level design - clients, API layer, services, data stores, caches, queues and external dependencies
      - and trace the main request and data flows through it.

      - Choose data models and stores from access patterns (read/write ratio, query shapes, consistency needs),
      not from habit.

      - Look for bottlenecks and single points of failure, and fix the ones that matter for the stated requirements.

      - Every choice is a trade-off (latency vs consistency, simplicity vs flexibility, cost vs availability); say
      explicitly what you give up.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- There is no single correct design; a good design is one whose trade-offs match the requirements.

      - Designing for internet-giant scale on day one is usually a mistake; design for current needs with a clear
      path to grow.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def design_brief(requirements, constraints):\n    if not requirements: raise ValueError(\"requirements\
      \ required\")\n    return {\"requirements\":list(requirements),\"constraints\":dict(constraints),\"open_questions\"\
      :[]}\n\nprint(design_brief([\"search\",\"save progress\"], {\"local_first\":True}))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: system-design-basics-code
  - type: item
    ref: system-design-basics-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Start with functional requirements (what the system does) and non-functional requirements (scale, latency,
      availability, consistency, cost, security, compliance), with numbers wherever possible.

      - Sketch the high-level design - clients, API layer, services, data stores, caches, queues and external dependencies
      - and trace the main request and data flows through it.

      - Choose data models and stores from access patterns (read/write ratio, query shapes, consistency needs),
      not from habit.

      - Look for bottlenecks and single points of failure, and fix the ones that matter for the stated requirements.

      - Every choice is a trade-off (latency vs consistency, simplicity vs flexibility, cost vs availability); say
      explicitly what you give up.


      **Watch for**

      - There is no single correct design; a good design is one whose trade-offs match the requirements.

      - Designing for internet-giant scale on day one is usually a mistake; design for current needs with a clear
      path to grow.'
  - type: item
    ref: system-design-basics-mcq
  - type: item
    ref: system-design-basics-tf
  - type: item
    ref: system-design-basics-code
items:
- id: system-design-basics-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of system design fundamentals?
  explanation: Start with functional requirements (what the system does) and non-functional requirements (scale,
    latency, availability, consistency, cost, security, compliance), with numbers wherever possible.
  options:
  - id: a
    text: Start with functional requirements (what the system does) and non-functional requirements (scale, latency,
      availability, consistency, cost, security, compliance), with numbers wherever possible.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: There is no single correct design; a good design is one whose trade-offs match the requirements.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: system-design-basics-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: There is no single correct design; a good design is one whose trade-offs match the requirements.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: system-design-basics-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply system design fundamentals to a realistic engineering scenario. State your assumptions, explain
    your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: system-design-basics-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for system design fundamentals. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def design_brief(requirements, constraints):\n    raise NotImplementedError('Complete this function')"
  solution: "def design_brief(requirements, constraints):\n    if not requirements: raise ValueError(\"requirements\
    \ required\")\n    return {\"requirements\":list(requirements),\"constraints\":dict(constraints),\"open_questions\"\
    :[]}"
  tests:
  - name: Core behaviour
    code: assert design_brief(["search"], {"local":True})["requirements"] == ["search"]
  - name: Boundary behaviour
    code: 'try: design_brief([], {})

      except ValueError: pass

      else: raise AssertionError("requirements must be explicit")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - system-design-basics-mcq
  - system-design-basics-tf
  - system-design-basics-code
