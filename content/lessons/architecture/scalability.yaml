items:
- id: scalability-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of scalability patterns?
  explanation: Make application servers stateless (sessions in a shared store or signed tokens) so you can add instances
    behind a load balancer.
  options:
  - id: a
    text: Make application servers stateless (sessions in a shared store or signed tokens) so you can add instances
      behind a load balancer.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Sharding is not a first step; it complicates joins, transactions and rebalancing, so exhaust simpler options
      first.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: scalability-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Sharding is not a first step; it complicates joins, transactions and rebalancing, so exhaust simpler options
    first.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: scalability-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply scalability patterns to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: scalability-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for scalability patterns. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def choose_scaling(action, bottleneck):\n    raise NotImplementedError('Complete this function')"
  solution: "def choose_scaling(action, bottleneck):\n    if bottleneck==\"single_instance_cpu\" and action==\"\
    add_capacity\": return \"vertical scaling\"\n    if bottleneck==\"request_volume\" and action==\"add_instances\"\
    : return \"horizontal scaling\"\n    return \"measure bottleneck first\""
  tests:
  - name: Core behaviour
    code: assert choose_scaling("add_instances","request_volume") == "horizontal scaling"
  - name: Boundary behaviour
    code: assert choose_scaling("unknown","unknown") == "measure bottleneck first"
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - scalability-mcq
  - scalability-tf
  - scalability-code
