id: architecture.scalability
concept: architecture.scalability
title: Scalability patterns
subtitle: Stateless services, horizontal scaling, caching, read replicas, sharding and asynchronous processing
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Stateless services, horizontal scaling, caching, read replicas, sharding and asynchronous processing.
objectives:
- Explain the core engineering decisions behind scalability patterns.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: The System Design Primer
  url: https://github.com/donnemartin/system-design-primer
  publisher: Donne Martin (GitHub)
- title: 'The Twelve-Factor App: VI. Processes'
  url: https://12factor.net/processes
  publisher: 12factor.net
- title: Performance Efficiency Pillar - AWS Well-Architected Framework
  url: https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html
  publisher: Amazon Web Services
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Stateless services, horizontal scaling, caching, read replicas, sharding and asynchronous processing.
      Growth breaks designs at predictable points - the single server, the single database, slow synchronous work
      - and each scalability pattern addresses one of them.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Make application servers stateless (sessions in a shared store or signed tokens) so you can add instances
      behind a load balancer.

      - Cache at several layers - CDN, application cache such as Redis, database buffer cache - to cut repeated
      reads.

      - Scale reads with read replicas (accepting replication lag); scale writes by partitioning (sharding) data
      on a key that spreads load evenly and avoids hot keys.

      - Move slow or bursty work off the request path into queues processed asynchronously by workers.

      - Take the cheapest step first - fix queries and add indexes, then scale vertically, then horizontally, and
      shard last - because each step adds complexity.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Sharding is not a first step; it complicates joins, transactions and rebalancing, so exhaust simpler
      options first.

      - Read replicas do not help write-heavy workloads, and reads from them can be stale.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def choose_scaling(action, bottleneck):\n    if bottleneck==\"single_instance_cpu\" and action==\"add_capacity\"\
      : return \"vertical scaling\"\n    if bottleneck==\"request_volume\" and action==\"add_instances\": return\
      \ \"horizontal scaling\"\n    return \"measure bottleneck first\"\n\nprint(choose_scaling(\"add_instances\"\
      ,\"request_volume\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: scalability-code
  - type: item
    ref: scalability-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Make application servers stateless (sessions in a shared store or signed tokens) so you can add instances
      behind a load balancer.

      - Cache at several layers - CDN, application cache such as Redis, database buffer cache - to cut repeated
      reads.

      - Scale reads with read replicas (accepting replication lag); scale writes by partitioning (sharding) data
      on a key that spreads load evenly and avoids hot keys.

      - Move slow or bursty work off the request path into queues processed asynchronously by workers.

      - Take the cheapest step first - fix queries and add indexes, then scale vertically, then horizontally, and
      shard last - because each step adds complexity.


      **Watch for**

      - Sharding is not a first step; it complicates joins, transactions and rebalancing, so exhaust simpler options
      first.

      - Read replicas do not help write-heavy workloads, and reads from them can be stale.'
  - type: item
    ref: scalability-mcq
  - type: item
    ref: scalability-tf
  - type: item
