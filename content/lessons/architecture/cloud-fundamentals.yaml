id: architecture.cloud-fundamentals
concept: architecture.cloud-fundamentals
title: Cloud fundamentals
subtitle: IaaS, PaaS and SaaS, regions and availability zones, managed services, the shared responsibility model,
  and how free tiers and billing work
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: IaaS, PaaS and SaaS, regions and availability zones, managed services, the shared responsibility model,
  and how free tiers and billing work.
objectives:
- Explain the core engineering decisions behind cloud fundamentals.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: 'SP 800-145: The NIST Definition of Cloud Computing'
  url: https://csrc.nist.gov/pubs/sp/800/145/final
  publisher: NIST
- title: Shared Responsibility Model
  url: https://aws.amazon.com/compliance/shared-responsibility-model/
  publisher: Amazon Web Services
- title: Regions and Zones
  url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
  publisher: Amazon Web Services
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: IaaS, PaaS and SaaS, regions and availability zones, managed services, the shared responsibility model,
      and how free tiers and billing work. Most production systems run on cloud platforms; knowing the service models,
      the geography and who is responsible for what prevents insecure setups and surprise bills.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- NIST service models - IaaS (you manage the OS and everything above, such as virtual machines), PaaS
      (you manage your application and data on a managed runtime) and SaaS (you use a finished application).

      - A region is a geographic area; an availability zone is one or more isolated data centres within a region.
      Spread across zones for availability, and choose regions for latency and data-residency rules.

      - Shared responsibility - the provider secures the cloud itself (hardware, facilities, virtualisation); you
      secure what you put in it (identities and access, data, configuration, and OS patching on IaaS).

      - Managed services (databases, queues, object storage) trade some control and portability for much less operational
      work.

      - Billing is usage-based (compute time, storage, requests, data egress); set budgets and alerts from day one,
      and treat free-tier details as changeable - check current terms.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- The cloud is not secure by default; most cloud breaches come from customer misconfiguration, such as
      public storage buckets or over-privileged keys.

      - One availability zone is not high availability; a whole zone can fail.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def classify_cloud_model(control):\n    return {\"provider_managed_application\":\"SaaS\",\"managed_runtime\"\
      :\"PaaS\",\"virtual_machines\":\"IaaS\"}.get(control,\"clarify responsibility split\")\n\nprint(classify_cloud_model(\"\
      managed_runtime\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: cloud-fundamentals-code
  - type: item
    ref: cloud-fundamentals-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
