items:
- id: cloud-fundamentals-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of cloud fundamentals?
  explanation: NIST service models - IaaS (you manage the OS and everything above, such as virtual machines), PaaS
    (you manage your application and data on a managed runtime) and SaaS (you use a finished application).
  options:
  - id: a
    text: NIST service models - IaaS (you manage the OS and everything above, such as virtual machines), PaaS (you
      manage your application and data on a managed runtime) and SaaS (you use a finished application).
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: The cloud is not secure by default; most cloud breaches come from customer misconfiguration, such as public
      storage buckets or over-privileged keys.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: cloud-fundamentals-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: The cloud is not secure by default; most cloud breaches come from customer misconfiguration, such as public
    storage buckets or over-privileged keys.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: cloud-fundamentals-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply cloud fundamentals to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: cloud-fundamentals-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for cloud fundamentals. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def classify_cloud_model(control):\n    raise NotImplementedError('Complete this function')"
  solution: "def classify_cloud_model(control):\n    return {\"provider_managed_application\":\"SaaS\",\"managed_runtime\"\
    :\"PaaS\",\"virtual_machines\":\"IaaS\"}.get(control,\"clarify responsibility split\")"
  tests:
  - name: Core behaviour
    code: assert classify_cloud_model("virtual_machines") == "IaaS"
  - name: Boundary behaviour
    code: assert classify_cloud_model("unknown") == "clarify responsibility split"
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - cloud-fundamentals-mcq
