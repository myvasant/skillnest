    body: '**Key principles**

      - NIST service models - IaaS (you manage the OS and everything above, such as virtual machines), PaaS (you
      manage your application and data on a managed runtime) and SaaS (you use a finished application).

      - A region is a geographic area; an availability zone is one or more isolated data centres within a region.
      Spread across zones for availability, and choose regions for latency and data-residency rules.

      - Shared responsibility - the provider secures the cloud itself (hardware, facilities, virtualisation); you
      secure what you put in it (identities and access, data, configuration, and OS patching on IaaS).

      - Managed services (databases, queues, object storage) trade some control and portability for much less operational
      work.

      - Billing is usage-based (compute time, storage, requests, data egress); set budgets and alerts from day one,
      and treat free-tier details as changeable - check current terms.


      **Watch for**

      - The cloud is not secure by default; most cloud breaches come from customer misconfiguration, such as public
      storage buckets or over-privileged keys.

      - One availability zone is not high availability; a whole zone can fail.'
