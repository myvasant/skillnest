id: architecture.ai-system-design
concept: architecture.ai-system-design
title: Designing AI systems
subtitle: End-to-end design of LLM, RAG and agent systems — model choice, retrieval, evaluation gates, guardrails,
  fallbacks, observability, latency and cost
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: End-to-end design of LLM, RAG and agent systems — model choice, retrieval, evaluation gates, guardrails,
  fallbacks, observability, latency and cost.
objectives:
- Explain the core engineering decisions behind designing ai systems.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Building effective AI agents
  url: https://www.anthropic.com/research/building-effective-agents
  publisher: Anthropic
- title: Generative AI Lens - AWS Well-Architected Framework
  url: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html
  publisher: Amazon Web Services
- title: Building A Generative AI Platform
