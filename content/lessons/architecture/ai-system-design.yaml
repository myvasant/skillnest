  publisher: Chip Huyen
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: End-to-end design of LLM, RAG and agent systems — model choice, retrieval, evaluation gates, guardrails,
      fallbacks, observability, latency and cost. The LLM call is the easy part; a reliable AI product needs retrieval,
      evaluation, guardrails, fallbacks and cost control designed together as one system.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Start from the task and its success metric, and use the simplest design that meets it - one well-prompted
      call, then a fixed workflow, and only then an autonomous agent.

      - Choose models by measured quality on your own eval set, latency, cost and data-handling terms; route easy
      requests to smaller models and hard ones to larger models.

      - A RAG pipeline has stages - ingestion and chunking, embedding and (often hybrid) search, reranking, permission
      filtering and context assembly - and each stage needs its own evaluation.

      - Wrap the model in guardrails - input checks (prompt injection, personal data), output validation (schemas,
      grounding checks) and human review for high-stakes actions.

      - Design for failure and cost - timeouts, retries, fallback to another model or a non-AI path, caching, streaming
      for perceived latency, token budgets and end-to-end tracing.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A bigger model is not always the fix; retrieval quality and evaluation usually matter more.

      - Agents are not automatically better than workflows; autonomy adds cost, latency and unpredictability.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def ai_pipeline_components(needs_retrieval, needs_tools, needs_human_review):\n    components=[\"input_validation\"\
      ,\"model_or_workflow\",\"output_validation\",\"observability\"]\n    if needs_retrieval: components.insert(1,\"\
      retrieval\")\n    if needs_tools: components.insert(-1,\"permissioned_tools\")\n    if needs_human_review:\
      \ components.insert(-1,\"human_approval\")\n    return components\n\nprint(ai_pipeline_components(True,True,True))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: ai-system-design-code
  - type: item
    ref: ai-system-design-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Start from the task and its success metric, and use the simplest design that meets it - one well-prompted
      call, then a fixed workflow, and only then an autonomous agent.

      - Choose models by measured quality on your own eval set, latency, cost and data-handling terms; route easy
      requests to smaller models and hard ones to larger models.

      - A RAG pipeline has stages - ingestion and chunking, embedding and (often hybrid) search, reranking, permission
      filtering and context assembly - and each stage needs its own evaluation.

      - Wrap the model in guardrails - input checks (prompt injection, personal data), output validation (schemas,
      grounding checks) and human review for high-stakes actions.

      - Design for failure and cost - timeouts, retries, fallback to another model or a non-AI path, caching, streaming
      for perceived latency, token budgets and end-to-end tracing.


      **Watch for**

      - A bigger model is not always the fix; retrieval quality and evaluation usually matter more.

      - Agents are not automatically better than workflows; autonomy adds cost, latency and unpredictability.'
  - type: item
    ref: ai-system-design-mcq
  - type: item
    ref: ai-system-design-tf
  - type: item
    ref: ai-system-design-code
items:
- id: ai-system-design-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of designing ai systems?
  explanation: Start from the task and its success metric, and use the simplest design that meets it - one well-prompted
    call, then a fixed workflow, and only then an autonomous agent.
  options:
  - id: a
    text: Start from the task and its success metric, and use the simplest design that meets it - one well-prompted
      call, then a fixed workflow, and only then an autonomous agent.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: A bigger model is not always the fix; retrieval quality and evaluation usually matter more.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: ai-system-design-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A bigger model is not always the fix; retrieval quality and evaluation usually matter more.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: ai-system-design-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply designing ai systems to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: ai-system-design-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for designing ai systems. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def ai_pipeline_components(needs_retrieval, needs_tools, needs_human_review):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def ai_pipeline_components(needs_retrieval, needs_tools, needs_human_review):\n    components=[\"input_validation\"\
    ,\"model_or_workflow\",\"output_validation\",\"observability\"]\n    if needs_retrieval: components.insert(1,\"\
    retrieval\")\n    if needs_tools: components.insert(-1,\"permissioned_tools\")\n    if needs_human_review: components.insert(-1,\"\
    human_approval\")\n    return components"
  tests:
  - name: Core behaviour
    code: parts=ai_pipeline_components(True,True,True)
  - name: Boundary behaviour
    code: 'assert "retrieval" in parts and "permissioned_tools" in parts and "human_approval" in parts

      assert "retrieval" not in ai_pipeline_components(False,False,False)'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - ai-system-design-mcq
  - ai-system-design-tf
  - ai-system-design-code
