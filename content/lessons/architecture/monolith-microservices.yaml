id: architecture.monolith-microservices
concept: architecture.monolith-microservices
title: Modular monoliths and microservices
subtitle: A well-structured monolith is the right default; microservices buy independent deployment and scaling
  at a large operational cost
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: A well-structured monolith is the right default; microservices buy independent deployment and scaling at
  a large operational cost.
objectives:
- Explain the core engineering decisions behind modular monoliths and microservices.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Microservices
  url: https://martinfowler.com/articles/microservices.html
  publisher: Martin Fowler and James Lewis
- title: Monolith First
  url: https://martinfowler.com/bliki/MonolithFirst.html
  publisher: Martin Fowler
- title: Microservice Architecture pattern
  url: https://microservices.io/patterns/microservices.html
  publisher: Chris Richardson (microservices.io)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A well-structured monolith is the right default; microservices buy independent deployment and scaling
      at a large operational cost. Service boundaries are among the hardest design decisions to reverse; microservices
      too early slow small teams down, and a tangled monolith slows large teams down.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A modular monolith is one deployable unit with clear internal modules and interfaces; it keeps transactions,
      debugging and deployment simple.

      - Microservices are independently deployable services that each own their data, usually aligned with business
      capabilities and team boundaries.

      - They buy independent deployment, scaling and technology choices at the cost of network calls, partial failures,
      cross-service data consistency, more infrastructure and heavier observability needs.

      - Start with a monolith and extract a service when there is a clear reason (team autonomy, very different
      scaling or reliability needs) - the "monolith first" approach.

      - Services that share one database are coupled as tightly as a monolith but harder to change (a distributed
      monolith).'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Microservices are mainly a way to scale an organisation, not a performance optimisation; in-process
      calls are faster than network calls.

      - Splitting code into many repositories is not the same as having well-defined boundaries.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def service_boundary(shared_database, independent_deployment, team_ownership):\n    if not independent_deployment\
      \ and not team_ownership: return \"modular monolith is a strong default\"\n    if independent_deployment and\
      \ team_ownership and not shared_database: return \"consider service extraction\"\n    return \"clarify boundaries\
      \ and operational cost\"\n\nprint(service_boundary(False,False,False))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: monolith-microservices-code
  - type: item
    ref: monolith-microservices-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - A modular monolith is one deployable unit with clear internal modules and interfaces; it keeps transactions,
      debugging and deployment simple.

      - Microservices are independently deployable services that each own their data, usually aligned with business
      capabilities and team boundaries.

      - They buy independent deployment, scaling and technology choices at the cost of network calls, partial failures,
      cross-service data consistency, more infrastructure and heavier observability needs.

      - Start with a monolith and extract a service when there is a clear reason (team autonomy, very different
      scaling or reliability needs) - the "monolith first" approach.

      - Services that share one database are coupled as tightly as a monolith but harder to change (a distributed
      monolith).


      **Watch for**

      - Microservices are mainly a way to scale an organisation, not a performance optimisation; in-process calls
