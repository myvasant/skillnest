items:
- id: monolith-microservices-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of modular monoliths and microservices?
  explanation: A modular monolith is one deployable unit with clear internal modules and interfaces; it keeps transactions,
    debugging and deployment simple.
  options:
  - id: a
    text: A modular monolith is one deployable unit with clear internal modules and interfaces; it keeps transactions,
      debugging and deployment simple.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Microservices are mainly a way to scale an organisation, not a performance optimisation; in-process calls
      are faster than network calls.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: monolith-microservices-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Microservices are mainly a way to scale an organisation, not a performance optimisation; in-process calls
    are faster than network calls.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: monolith-microservices-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply modular monoliths and microservices to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: monolith-microservices-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for modular monoliths and microservices. The assertions cover the expected path and
    an important boundary case.
  starterCode: "def service_boundary(shared_database, independent_deployment, team_ownership):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def service_boundary(shared_database, independent_deployment, team_ownership):\n    if not independent_deployment\
    \ and not team_ownership: return \"modular monolith is a strong default\"\n    if independent_deployment and\
    \ team_ownership and not shared_database: return \"consider service extraction\"\n    return \"clarify boundaries\
    \ and operational cost\""
  tests:
  - name: Core behaviour
    code: assert service_boundary(False,False,False).startswith("modular monolith")
  - name: Boundary behaviour
    code: assert service_boundary(False,True,True).startswith("consider")
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
