id: rag.failure-analysis
concept: rag.failure-analysis
title: RAG failure analysis
subtitle: Diagnose whether a bad answer came from parsing, chunking, retrieval, ranking, context assembly or generation
  — then fix the right layer
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Diagnose whether a bad answer came from parsing, chunking, retrieval, ranking, context assembly or generation
  — then fix the right layer.
objectives:
- Explain the role of rag failure analysis in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Seven Failure Points When Engineering a Retrieval Augmented Generation System
  url: https://arxiv.org/abs/2401.05856
  publisher: arXiv
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Diagnose whether a bad answer came from parsing, chunking, retrieval, ranking, context assembly or generation
      — then fix the right layer. A wrong answer can come from any layer, and fixing the wrong one — swapping the
      LLM when the real problem is a broken PDF parse — wastes time. Systematic failure analysis pins the cause
      down with evidence.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Trace one bad answer backwards: Is the information in the source? Did parsing extract it? Did chunking
      keep it intact? Was it retrieved in the top k? Did it survive reranking and context assembly? Did the model
      use it correctly?

      - Typical failure points: missing content, the answer ranked below the cutoff, relevant chunks dropped during
      context assembly, the answer present but not extracted, wrong format, wrong level of detail, and incomplete
      answers.

      - Label failures by category over a sample of real queries and fix the most frequent category first.

      - Read the actual retrieved chunks and final prompts; aggregate metrics hide the specific failure.

      - Turn every diagnosed failure into a new evaluation case so it stays fixed.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- "The model is hallucinating" is a symptom, not a diagnosis; most RAG failures trace back to ingestion
      or retrieval.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def classify_rag_failure(retrieved, relevant, grounded):\n    if not retrieved: return \"retrieval returned\
      \ no context\"\n    if not relevant.issubset(set(retrieved)): return \"retrieval missed relevant context\"\
      \n    if not grounded: return \"generation was not grounded in retrieved context\"\n    return \"no failure\
      \ detected by these checks\"\n\nprint(classify_rag_failure([\"a\"], {\"a\",\"b\"}, True))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: failure-analysis-code
  - type: item
    ref: failure-analysis-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Trace one bad answer backwards: Is the information in the source? Did parsing extract it? Did chunking keep
      it intact? Was it retrieved in the top k? Did it survive reranking and context assembly? Did the model use
      it correctly?

      - Typical failure points: missing content, the answer ranked below the cutoff, relevant chunks dropped during
      context assembly, the answer present but not extracted, wrong format, wrong level of detail, and incomplete
      answers.

      - Label failures by category over a sample of real queries and fix the most frequent category first.

      - Read the actual retrieved chunks and final prompts; aggregate metrics hide the specific failure.

      - Turn every diagnosed failure into a new evaluation case so it stays fixed.


      **Limitations**

      - "The model is hallucinating" is a symptom, not a diagnosis; most RAG failures trace back to ingestion or
      retrieval.'
  - type: item
    ref: failure-analysis-mcq
  - type: item
    ref: failure-analysis-tf
  - type: item
    ref: failure-analysis-code
items:
- id: failure-analysis-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of rag failure analysis?
  explanation: 'Trace one bad answer backwards: Is the information in the source? Did parsing extract it? Did chunking
    keep it intact? Was it retrieved in the top k? Did it survive reranking and context assembly? Did the model
    use it correctly?'
  options:
  - id: a
    text: 'Trace one bad answer backwards: Is the information in the source? Did parsing extract it? Did chunking
      keep it intact? Was it retrieved in the top k? Did it survive reranking and context assembly? Did the model
      use it correctly?'
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: '"The model is hallucinating" is a symptom, not a diagnosis; most RAG failures trace back to ingestion
      or retrieval.'
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: failure-analysis-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '"The model is hallucinating" is a symptom, not a diagnosis; most RAG failures trace back to ingestion
    or retrieval.'
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: failure-analysis-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding rag failure analysis to an application. Describe the design, one failure mode, and how
    you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: failure-analysis-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for rag failure analysis. The assertions include the normal path and
    a meaningful edge case.
  starterCode: "def classify_rag_failure(retrieved, relevant, grounded):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def classify_rag_failure(retrieved, relevant, grounded):\n    if not retrieved: return \"retrieval\
    \ returned no context\"\n    if not relevant.issubset(set(retrieved)): return \"retrieval missed relevant context\"\
    \n    if not grounded: return \"generation was not grounded in retrieved context\"\n    return \"no failure\
    \ detected by these checks\""
  tests:
  - name: Core behaviour
    code: assert classify_rag_failure([], {"a"}, False).startswith("retrieval returned")
  - name: Edge case
    code: assert classify_rag_failure(["a"], {"a"}, False).startswith("generation")
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - failure-analysis-mcq
  - failure-analysis-tf
  - failure-analysis-code
