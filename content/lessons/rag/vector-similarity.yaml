id: rag.vector-similarity
concept: rag.vector-similarity
title: Vector Similarity Search
subtitle: Retrieval as geometry — find the nearest vectors
estimatedMinutes: 50
reviewedOn: 2026-10-23
summary: >-
  Once text is turned into vectors, retrieval means finding the stored vectors closest to the query's
  vector. Using small hand-made "embeddings" and a toy hashing embedder, you will implement dot product,
  cosine similarity and Euclidean distance, see why normalisation makes them agree, write exact
  k-nearest-neighbour search, and compare how semantic and keyword search fail.
objectives:
  - Compute dot product, cosine similarity and Euclidean distance in plain Python and explain what each one measures.
  - Normalise vectors to unit length and explain why dot product, cosine and L2 distance then rank results identically.
  - Implement exact (brute-force) top-k nearest-neighbour search and estimate its cost.
  - Explain what a toy hashing-trick embedder can and cannot capture, compared with a learned embedding model.
  - Predict how semantic search and keyword search fail differently, and choose between them or combine them.
sources:
  - title: MetricType and distances
    url: https://github.com/facebookresearch/faiss/wiki/MetricType-and-distances
    publisher: Meta (FAISS wiki)
  - title: pgvector README (distance operators)
    url: https://github.com/pgvector/pgvector
    publisher: pgvector
  - title: Sentence Transformers documentation
    url: https://sbert.net/
    publisher: Sentence Transformers (Hugging Face)
  - title: Feature Hashing for Large Scale Multitask Learning
    url: https://arxiv.org/abs/0902.2206
    publisher: arXiv (Weinberger et al.)
  - title: "BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models"
    url: https://arxiv.org/abs/2104.08663
    publisher: arXiv (Thakur et al.)
sections:
  - id: why
    title: Why measure meaning with geometry?
    kind: why
    blocks:
      - type: markdown
        body: |
          In [keyword search](concept:rag.keyword-search) the query "I forgot my login" scored **zero**
          against "Reset your password", because the two share no words. People see they mean nearly the
          same thing; word counting cannot.

          [Embedding models](concept:rag.embeddings) solve this by mapping each text to a list of numbers
          — a **vector** — placed so that texts with similar meaning get vectors pointing in similar
          directions. Retrieval then becomes a geometry question: **which stored vectors are closest to
          the query's vector?**

          No real embedding model can run in this lesson, so we use two clearly labelled toys:

          1. **Hand-made "embeddings"** — 3 numbers per text, chosen by hand so the geometry is easy to
             see. They show what a *learned* model provides.
          2. **A hashing-trick embedder** — a real, simple algorithm that turns words into a vector
             without any learning. It shows the mechanics of "text → fixed-length vector", and its
             limits.

  - id: vectors
    title: Embeddings as vectors
    kind: concept
    blocks:
      - type: markdown
        body: |
          Pretend an embedding model gave us three numbers per text, roughly meaning *how much is this
          about logging in / about money / about delivery?* (This is a toy: real embeddings have hundreds
          to thousands of dimensions, learned from data, and individual dimensions usually have no
          human-readable meaning.)

          | Text | login | money | delivery |
          |---|---|---|---|
          | Reset your password | 0.95 | 0.10 | 0.00 |
          | Change your account email | 0.50 | 0.10 | 0.20 |
          | Our refund policy | 0.05 | 0.95 | 0.10 |
          | Track your parcel | 0.00 | 0.10 | 0.95 |
          | *query:* I forgot my login | 0.90 | 0.05 | 0.00 |

          The query's vector points almost the same way as "Reset your password" — even though they
          share no words. That is the whole promise of [semantic search](glossary:semantic-search). To
          use it we need a precise measure of "points the same way".

  - id: measures
    title: Dot product, cosine similarity and Euclidean distance
    kind: concept
    blocks:
      - type: markdown
        body: |
          Three measures are used in practice (you met them in [vectors](concept:math.vectors)):

          | Measure | Formula | Range | Better match |
          |---|---|---|---|
          | **Dot product** | *a·b = Σ aᵢbᵢ* | any number | larger |
          | **Cosine similarity** | *a·b / (‖a‖ ‖b‖)* | −1 to 1 | larger |
          | **Euclidean (L2) distance** | *√Σ (aᵢ − bᵢ)²* | 0 or more | **smaller** |

          *‖a‖ = √(a·a)* is the vector's length (its L2 norm). Cosine similarity compares **direction
          only**; the dot product also grows with length; Euclidean distance is the straight-line gap
          between the two points.
      - type: code
        runnable: true
        id: measures
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          def norm(a):
              return math.sqrt(dot(a, a))

          def cosine(a, b):
              return dot(a, b) / (norm(a) * norm(b))

          def euclidean(a, b):
              return math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b, strict=True)))

          a = [3, 1]
          b = [1, 2]
          print("dot:", dot(a, b))
          print("cosine:", round(cosine(a, b), 4))
          print("euclidean:", round(euclidean(a, b), 4))
        expectedOutput: |
          dot: 5
          cosine: 0.7071
          euclidean: 2.2361
        annotations:
          - line: 4
            text: "`strict=True` makes zip raise ValueError if the vectors have different lengths, instead of silently ignoring the extra numbers."
          - line: 10
            text: Dividing by both lengths removes the effect of magnitude, leaving the cosine of the angle between the vectors.
      - type: visualization
        component: vector-similarity
        title: Drag the vectors
        caption: Make one vector longer without changing its direction — the dot product and distance change, but the cosine similarity stays the same.
        props:
          a: [3, 1]
          b: [1, 2]
      - type: markdown
        body: |
          The difference matters when vector lengths vary. Here `short` and `long` point in exactly the
          same direction:
      - type: code
        runnable: true
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          def cosine(a, b):
              return dot(a, b) / (math.sqrt(dot(a, a)) * math.sqrt(dot(b, b)))

          short, long, other = [1, 1], [10, 10], [1, 0]
          print("short vs long :", dot(short, long), round(cosine(short, long), 4))
          print("short vs other:", dot(short, other), round(cosine(short, other), 4))
          print("long  vs other:", dot(long, other), round(cosine(long, other), 4))
        expectedOutput: |
          short vs long : 20 1.0
          short vs other: 1 0.7071
          long  vs other: 10 0.7071
        caption: By dot product, "long" looks ten times more similar to "other" than "short" does; by cosine they are identical, because the angle is the same.
      - type: item
        ref: predict-cosine-length

  - id: normalisation
    title: Normalisation makes the measures agree
    kind: concept
    blocks:
      - type: markdown
        body: |
          **[L2 normalisation](glossary:l2-normalisation)** divides a vector by its length, producing a
          **unit vector** (length 1) pointing the same way. For unit vectors:

          - the dot product **equals** the cosine similarity (the denominator is 1 × 1), and
          - the squared Euclidean distance is *‖a − b‖² = 2 − 2·cos(a, b)*,

          so all three measures produce **the same ranking** (distance in the opposite direction). That
          is why many systems normalise embeddings once at indexing time and then use the cheaper dot
          product. Check the identities on our toy vectors:
      - type: code
        runnable: true
        code: |
          import math

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          def normalize(v):
              length = math.sqrt(dot(v, v))
              return [x / length for x in v]

          print(normalize([3, 4]))

          docs = {
              "Reset your password":       [0.95, 0.10, 0.00],
              "Change your account email": [0.50, 0.10, 0.20],
              "Our refund policy":         [0.05, 0.95, 0.10],
              "Track your parcel":         [0.00, 0.10, 0.95],
          }
          query = [0.90, 0.05, 0.00]          # "I forgot my login"
          q = normalize(query)
          for text, vec in docs.items():
              v = normalize(vec)
              cos = dot(q, v)
              sq_dist = sum((x - y) ** 2 for x, y in zip(q, v))
              print(f"{text:26} cos {cos:.4f}   squared L2 {sq_dist:.4f}   2 - 2cos {2 - 2 * cos:.4f}")
        expectedOutput: |
          [0.6, 0.8]
          Reset your password        cos 0.9988   squared L2 0.0024   2 - 2cos 0.0024
          Change your account email  cos 0.9216   squared L2 0.1568   2 - 2cos 0.1568
          Our refund policy          cos 0.1073   squared L2 1.7854   2 - 2cos 1.7854
          Track your parcel          cos 0.0058   squared L2 1.9884   2 - 2cos 1.9884
        caption: Highest cosine ⇔ smallest distance, row by row. The 3-4-5 triangle shows normalisation in its simplest form.
      - type: callout
        variant: tip
        title: Use the metric the model was trained for
        body: |
          An embedding model's documentation says which measure it expects (often cosine, sometimes dot
          product on unnormalised vectors). Vector stores make you choose: FAISS has inner-product and L2
          indexes, and pgvector has separate operators for L2 distance (`<->`), cosine distance (`<=>`)
          and negative inner product (`<#>`). If your vectors are normalised, they agree on ranking.
      - type: item
        ref: mcq-normalised

  - id: knn
    title: Exact k-nearest-neighbour search
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          **[Exact k-nearest-neighbour search](glossary:exact-knn-search)** (brute force) is just a loop:
          score the query against **every** stored vector, sort, keep the best *k*.
      - type: code
        runnable: true
        id: top-k
        code: |
          import math

          def cosine(a, b):
              dot = sum(x * y for x, y in zip(a, b, strict=True))
              return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

          def top_k(query, vectors, k):
              scored = [(cosine(query, vec), doc_id) for doc_id, vec in vectors.items()]
              scored.sort(reverse=True)            # highest similarity first
              return scored[:k]

          docs = {
              "Reset your password":       [0.95, 0.10, 0.00],
              "Change your account email": [0.50, 0.10, 0.20],
              "Our refund policy":         [0.05, 0.95, 0.10],
              "Track your parcel":         [0.00, 0.10, 0.95],
          }
          for score, doc_id in top_k([0.90, 0.05, 0.00], docs, 2):
              print(f"{score:.3f}  {doc_id}")
        expectedOutput: |
          0.999  Reset your password
          0.922  Change your account email
        annotations:
          - line: 8
            text: One similarity per stored vector — this line is where all the work happens.
          - line: 9
            text: Tuples sort by their first item (the score); reverse=True puts the best first.
      - type: visualization
        component: python-tracer
        title: Step through a tiny search
        caption: Each loop pass scores one stored vector; the best-so-far is kept. (A dot product is used because these vectors are already unit length.)
        props:
          code: |
            query = [0.6, 0.8]
            stored = {"a": [1.0, 0.0], "b": [0.0, 1.0], "c": [0.8, 0.6]}
            best_id, best_score = None, -2.0
            for doc_id, vec in stored.items():
                score = query[0] * vec[0] + query[1] * vec[1]
                if score > best_score:
                    best_id, best_score = doc_id, score
            print(best_id, round(best_score, 2))
      - type: markdown
        body: |
          **Cost.** Each query does *N × d* multiply-adds for *N* stored vectors of *d* dimensions —
          O(N · d). That is trivial for thousands of chunks, fine for tens of thousands with NumPy, and a
          problem at hundreds of millions:
      - type: code
        runnable: true
        code: |
          for n, d in [(10_000, 384), (1_000_000, 768), (100_000_000, 1024)]:
              print(f"{n:,} vectors x {d} dims = {n * d:,} multiply-adds per query")
        expectedOutput: |
          10,000 vectors x 384 dims = 3,840,000 multiply-adds per query
          1,000,000 vectors x 768 dims = 768,000,000 multiply-adds per query
          100,000,000 vectors x 1024 dims = 102,400,000,000 multiply-adds per query
        caption: Multiply by the number of queries per second, and brute force becomes too slow and expensive — which is why approximate indexes exist.
      - type: markdown
        body: |
          **Approximate nearest-neighbour (ANN) indexes** such as HNSW (a navigable graph of vectors) and
          IVF (search only the most promising clusters) avoid comparing against everything. They trade a
          little **recall** — occasionally missing a true nearest neighbour — for very large speed-ups,
          and they come with vector databases that add persistence and filtering. That is the topic of
          [vector indexes and databases](concept:rag.vector-databases). Exact search remains the
          reference you measure ANN recall against.
      - type: code
        status: illustrative
        code: |
          import numpy as np
          from sentence_transformers import SentenceTransformer

          model = SentenceTransformer("all-MiniLM-L6-v2")                   # one open embedding model
          doc_vecs = model.encode(chunks, normalize_embeddings=True)        # shape (N, d), unit length
          query_vec = model.encode(["I forgot my login"], normalize_embeddings=True)[0]

          scores = doc_vecs @ query_vec                  # N dot products = N cosine similarities
          best = np.argsort(-scores)[:5]                 # indices of the 5 highest scores
        caption: >-
          Illustrative, not executed: NumPy, sentence-transformers and a downloaded model are not
          available in the browser runtime. This is one library's API; hosted embedding APIs return
          similar arrays of floats. Run it locally in a virtual environment to try real embeddings.
      - type: callout
        variant: misconception
        title: Similar is not the same as relevant
        body: |
          The nearest chunk may share the topic without answering the question ("refund policy for
          *gift cards*" for a question about *orders*). And similarity scores are relative, not
          calibrated probabilities: a fixed threshold such as 0.8 means different things for different
          models. Pick thresholds, if any, by measuring on your own data.

  - id: hashing-embedder
    title: A toy embedder you can run — the hashing trick
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          How does text become a fixed-length vector at all? The **[hashing trick](glossary:hashing-trick)**
          is the simplest real method ([Weinberger et al., 2009](https://arxiv.org/abs/0902.2206)): give
          the vector *D* slots, hash each word to a slot number, and count. No vocabulary list and no
          training are needed. We use `hashlib.sha256` (Python's built-in `hash()` changes between runs
          for strings, so it would make vectors unreproducible).
      - type: code
        runnable: true
        id: hash-embed
        code: |
          import hashlib
          import math

          def hash_embed(text, dim=97):
              vec = [0.0] * dim
              for word in text.lower().split():
                  digest = hashlib.sha256(word.encode("utf-8")).digest()
                  bucket = int.from_bytes(digest, "big") % dim
                  vec[bucket] += 1.0
              length = math.sqrt(sum(x * x for x in vec))
              return [x / length for x in vec] if length else vec

          def dot(a, b):
              return sum(x * y for x, y in zip(a, b, strict=True))

          docs = ["reset your password", "change your account email", "our refund policy", "track your parcel"]
          for query in ["forgot your password", "forgot my login"]:
              q = hash_embed(query)
              print(f"query: {query!r}")
              for text in docs:
                  print(f"  {dot(q, hash_embed(text)):.3f}  {text}")
        expectedOutput: |
          query: 'forgot your password'
            0.667  reset your password
            0.289  change your account email
            0.000  our refund policy
            0.333  track your parcel
          query: 'forgot my login'
            0.000  reset your password
            0.000  change your account email
            0.000  our refund policy
            0.000  track your parcel
        annotations:
          - line: 7
            text: A stable hash of the word, turned into a slot number from 0 to dim − 1.
          - line: 10
            text: Normalise once, so the dot product below is the cosine similarity.
        caption: "Toy, not a semantic model: it only sees shared words. \"your\" alone makes \"track your parcel\" look related, and \"forgot my login\" matches nothing."
      - type: markdown
        body: |
          This embedder is **lexical**: it is basically keyword overlap in vector form, so it fails on
          paraphrases exactly like BM25 (without BM25's IDF weighting, which is why "your" counts as much
          as "password"). Hashing has a second quirk — different words can land in the **same slot**
          (a *collision*). With only 50 slots, "reset" and "forgot" collide, and a false match appears:
      - type: code
        runnable: true
        code: |
          import hashlib
          import math

          def hash_embed(text, dim):
              vec = [0.0] * dim
              for word in text.lower().split():
                  bucket = int.from_bytes(hashlib.sha256(word.encode("utf-8")).digest(), "big") % dim
                  vec[bucket] += 1.0
              length = math.sqrt(sum(x * x for x in vec))
              return [x / length for x in vec] if length else vec

          q = hash_embed("forgot my login", dim=50)
          d = hash_embed("reset your password", dim=50)
          print(round(sum(x * y for x, y in zip(q, d)), 3))
        expectedOutput: |
          0.333
        caption: A similarity caused purely by a hash collision — it happens to look sensible here, but it is luck, not meaning. Real hashing systems use far more slots (often around a million) to make collisions rare.
      - type: markdown
        body: |
          A **learned** embedding model is different in kind: trained on huge numbers of related text
          pairs, it places "forgot my login" near "reset your password" because they are used in similar
          contexts — what our hand-made vectors imitated. That is why the hashing trick is useful for fast
          features in classic machine learning, while RAG uses trained embedding models.

  - id: failure-modes
    title: How semantic and keyword search fail differently
    kind: concept
    blocks:
      - type: markdown
        body: |
          | | Keyword search (BM25) | Semantic search (learned embeddings) |
          |---|---|---|
          | Matches | Exact terms after analysis | Overall meaning |
          | Paraphrase, synonyms ("forgot login" vs "reset password") | **Fails** — no shared terms | Usually succeeds |
          | Exact identifiers (`E1042` vs `E1024`, part numbers, names) | **Succeeds** — rare term, exact match | Often blurs near-identical strings |
          | Negation, numbers ("refundable" vs "not refundable") | Matches the words either way | Vectors can be very close either way |
          | Rare jargon, new product names, other domains | Works if the term appears | Depends on what the model learned; can degrade out of domain |
          | Explaining a result | Shows which terms matched | Hard — "the vectors were close" |
          | Cost | No model; tiny index | Embedding model calls; larger index |

          Neither is strictly better. On the BEIR benchmark, BM25 remained a robust baseline across many
          domains while several dense retrievers struggled out of domain
          ([Thakur et al., 2021](https://arxiv.org/abs/2104.08663)). Because the failures are
          *different*, combining both — [hybrid search](concept:rag.hybrid-search) — usually beats either
          one alone.
      - type: item
        ref: mcq-semantic-vs-keyword

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | Search returns the *worst* matches | Sorted distances in descending order (or similarities ascending) | Distances: smaller is better. Similarities: larger is better. Check what your API returns. |
          | Similarities look random after a model upgrade | Query and documents embedded with different models or versions | Re-embed the whole corpus with the same model; store the model name with each vector. |
          | Silently wrong scores, no error | `zip` stopped at the shorter vector (different dimensions) | Use `zip(..., strict=True)` and check dimensions when loading. |
          | `ZeroDivisionError` in cosine | A zero vector (for example, empty text) | Skip or reject empty inputs; return 0.0 for a zero vector. |
          | "0.8 worked with the old model" | Thresholds are model-specific | Re-tune thresholds on labelled examples for each model. |

          Here is the dimension mismatch, caught by `strict=True`:
      - type: code
        runnable: true
        code: |
          query = [0.1, 0.7, 0.2]               # 3 dimensions (one model)
          stored = [0.3, 0.1, 0.4, 0.9, 0.2]    # 5 dimensions (another model)
          print(sum(x * y for x, y in zip(query, stored, strict=True)))
        expectError: ValueError
        caption: "ValueError: zip() argument 2 is longer than argument 1. Without strict=True, zip would quietly use only the first 3 numbers and print a meaningless score."

  - id: practice
    title: Practice
    kind: practice
    blocks:
