  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - Embeddings turn text into vectors; semantic retrieval finds the vectors nearest the query's.
          - **Cosine** compares direction; **dot product** also rewards length; **Euclidean distance** is
            smaller-is-better. Use the measure the model was trained for.
          - **Unit-normalised** vectors make dot = cosine and squared L2 = 2 − 2·cos, so all rank the same.
          - **Exact k-NN** scores every vector: O(N · d) per query — fine for small corpora, the
            baseline for measuring approximate indexes.
          - A hashing-trick embedder is lexical (word overlap) and has collisions; learned models capture
            meaning.
          - Keyword search fails on paraphrases; semantic search blurs exact identifiers and negation —
            combine them.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Implement top-k cosine search and explain normalisation." — Normalise the stored vectors once,
          normalise the query, compute dot products (a matrix–vector product in NumPy), take the k
          largest. Explain that for unit vectors dot product equals cosine and L2 distance gives the same
          ranking, that exact search is O(N · d), and when you would switch to an ANN index.

items:
  - id: predict-cosine-length
    type: predict-output
    skill: prediction
    prompt: "`[2, 4]` is `[1, 2]` scaled by 2. What does this print?"
    code: |
      import math

      def dot(a, b):
          return sum(x * y for x, y in zip(a, b))

      def cosine(a, b):
          return dot(a, b) / (math.sqrt(dot(a, a)) * math.sqrt(dot(b, b)))

      print(dot([1, 2], [2, 4]), round(cosine([1, 2], [2, 4]), 4))
    answer: "10 1.0"
    explanation: >-
      The dot product is 1×2 + 2×4 = 10. The vectors point in exactly the same direction, so the cosine
      similarity is 1.0, however long they are.
    wrongAnswers:
      - answer: "10 0.5"
        feedback: Cosine similarity ignores length. Scaling a vector by 2 does not change its direction, so the cosine stays 1.0.
      - answer: "5 1.0"
        feedback: The dot product multiplies matching elements and adds them, 1×2 + 2×4 = 10.
      - answer: "10 10"
        feedback: Cosine divides the dot product by both lengths (√5 × √20 = 10), giving 10 / 10 = 1.0.

  - id: mcq-normalised
    type: mcq
    skill: recognition
    prompt: Your embedding model returns **unit-length** vectors. Which statement is true?
    explanation: >-
      For unit vectors the cosine denominator is 1, so dot product equals cosine similarity, and squared
      Euclidean distance equals 2 − 2·cosine — so all three produce the same ranking (distance ascending).
    options:
      - id: a
        text: Dot product equals cosine similarity, and ranking by smallest Euclidean distance gives the same order.
        correct: true
        feedback: Right — that is why systems normalise once and use the cheaper dot product.
      - id: b
        text: Dot product and cosine similarity now give opposite rankings.
        feedback: They are equal for unit vectors, so their rankings are identical.
      - id: c
        text: Euclidean distance becomes meaningless and must not be used.
        feedback: It still works; for unit vectors it is a monotonic function of cosine (‖a − b‖² = 2 − 2·cos).
      - id: d
        text: All similarity scores become exactly 1.
        feedback: Normalising sets each vector's length to 1, not the similarity between different vectors.

  - id: mcq-semantic-vs-keyword
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: Which retrieval failure is typical of **embedding-based** search but not of keyword (BM25) search?
    explanation: >-
      Embeddings represent overall meaning, so near-identical identifiers ("E1042" and "E1024") or a
      sentence and its negation can land very close together. Keyword search treats E1042 as an exact,
      rare term. Missing a paraphrase is the typical keyword-search failure.
    options:
      - id: a
        text: The query "error E1042" retrieves a passage about error E1024.
        correct: true
        feedback: Right — exact identifiers are where keyword search is stronger.
      - id: b
        text: The query "forgot my login" misses the passage "reset your password".
        feedback: That vocabulary mismatch is the classic keyword-search failure; embeddings usually handle it.
      - id: c
        text: A query with a typo-free rare product name finds the exact page that contains it.
        feedback: That is a success, and keyword search is especially good at it.
      - id: d
        text: Common words such as "the" dominate the ranking.
        feedback: That happens with naive keyword scoring without IDF or stop words, not typically with embeddings.

  - id: code-cosine
    type: code
    skill: implementation
    prompt: |
      Write `cosine_similarity(a, b)` for two lists of numbers:

      - return dot(a, b) / (‖a‖ · ‖b‖);
      - return `0.0` if either vector is all zeros (instead of dividing by zero);
      - raise `ValueError` if the lengths differ (`zip(a, b, strict=True)` does this for you).
    starterCode: |
      import math

      def cosine_similarity(a, b):
          # dot product divided by the product of the lengths
          return 0.0

      print(round(cosine_similarity([3, 1], [1, 2]), 4))
    solution: |
      import math

      def cosine_similarity(a, b):
          dot = sum(x * y for x, y in zip(a, b, strict=True))
          norm_a = math.sqrt(sum(x * x for x in a))
          norm_b = math.sqrt(sum(y * y for y in b))
          if norm_a == 0 or norm_b == 0:
              return 0.0
          return dot / (norm_a * norm_b)

      print(round(cosine_similarity([3, 1], [1, 2]), 4))
    expectedOutput: |
      0.7071
    tests:
      - name: basic values
        code: |
          import math
          assert math.isclose(cosine_similarity([3, 1], [1, 2]), 0.70710678, abs_tol=1e-6), f"cosine([3,1],[1,2]) should be about 0.7071, got {cosine_similarity([3, 1], [1, 2])}."
          assert math.isclose(cosine_similarity([1, 0], [0, 5]), 0.0, abs_tol=1e-9), "Perpendicular vectors have cosine 0."
          assert math.isclose(cosine_similarity([1, 2, 3], [-1, -2, -3]), -1.0), "Opposite vectors have cosine -1."
      - name: ignores length
        code: |
          import math
          assert math.isclose(cosine_similarity([1, 2, 2], [10, 20, 20]), 1.0), "Vectors in the same direction have cosine 1.0, whatever their lengths."
      - name: zero vector gives 0.0
        code: |
          assert cosine_similarity([0, 0, 0], [1, 2, 3]) == 0.0, "If a vector is all zeros, return 0.0 instead of dividing by zero."
      - name: different lengths raise ValueError
        code: |
          try:
              cosine_similarity([1, 2, 3], [1, 2])
          except ValueError:
              pass
          else:
              raise AssertionError("Vectors of different lengths should raise ValueError. Use zip(a, b, strict=True).")
    hints:
      - "Dot product: `sum(x * y for x, y in zip(a, b, strict=True))`."
      - "Length: `math.sqrt(sum(x * x for x in a))`."
      - Check for a zero length before dividing.
    feedback:
      - when: { errorType: ZeroDivisionError }
        message: A zero vector has length 0. Return 0.0 when either length is 0, before dividing.
      - when: { outputEquals: "0.0\n" }
        message: The function still returns 0.0 for the example. Compute the dot product and divide by both lengths.
    explanation: >-
      Cosine similarity is the dot product of the two directions. Guarding the zero vector and using a
      strict zip turn two silent failure modes (division by zero, mismatched dimensions) into explicit
      behaviour.

  - id: parsons-normalize
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to L2-normalise a vector and print it. It should print `[0.6, 0.8]`. Two lines
      are distractors.
    solution: |
      import math
      v = [3, 4]
      length = math.sqrt(sum(x * x for x in v))
      unit = [x / length for x in v]
      print(unit)
    distractors:
      - "length = sum(v)"
      - "unit = [x * length for x in v]"
    expectedOutput: |
      [0.6, 0.8]
    explanation: >-
      The L2 length is the square root of the sum of squares (5 for [3, 4]); dividing each element by it
      gives a unit vector. `sum(v)` is the L1 norm for non-negative numbers (7), and multiplying makes the
      vector longer instead of unit length.

  - id: code-top-k
    type: code
    skill: implementation
    prompt: |
      Write `top_k(query, vectors, k)` — exact nearest-neighbour search. `vectors` maps IDs to vectors.
      Return a **list of IDs** of the `k` vectors with the highest cosine similarity to `query`, best
      first. Use the provided `cosine`.
    starterCode: |
      import math

      def cosine(a, b):
          dot = sum(x * y for x, y in zip(a, b, strict=True))
          return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

      def top_k(query, vectors, k):
          # Score every vector, sort best first, return the first k IDs.
          return []

      docs = {
          "password": [0.95, 0.10, 0.00],
          "email": [0.50, 0.10, 0.20],
          "refund": [0.05, 0.95, 0.10],
          "parcel": [0.00, 0.10, 0.95],
      }
      print(top_k([0.90, 0.05, 0.00], docs, 2))
    solution: |
      import math

      def cosine(a, b):
          dot = sum(x * y for x, y in zip(a, b, strict=True))
          return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

      def top_k(query, vectors, k):
          scored = [(cosine(query, vec), doc_id) for doc_id, vec in vectors.items()]
          scored.sort(reverse=True)
          return [doc_id for _, doc_id in scored[:k]]

      docs = {
          "password": [0.95, 0.10, 0.00],
          "email": [0.50, 0.10, 0.20],
          "refund": [0.05, 0.95, 0.10],
          "parcel": [0.00, 0.10, 0.95],
      }
      print(top_k([0.90, 0.05, 0.00], docs, 2))
    expectedOutput: |
      ['password', 'email']
    tests:
      - name: the example query
        code: |
          assert top_k([0.90, 0.05, 0.00], docs, 2) == ["password", "email"], f"Expected ['password', 'email'], got {top_k([0.90, 0.05, 0.00], docs, 2)}."
      - name: other queries
        code: |
          assert top_k([0.0, 0.2, 0.9], docs, 1) == ["parcel"], f"A delivery-like query should return ['parcel'], got {top_k([0.0, 0.2, 0.9], docs, 1)}."
          assert top_k([0.1, 0.9, 0.0], docs, 3)[0] == "refund", "A money-like query should rank 'refund' first."
      - name: k larger than the collection returns everything, best first
        code: |
          result = top_k([0.90, 0.05, 0.00], docs, 10)
          assert result == ["password", "email", "refund", "parcel"], f"With k=10 all 4 IDs should come back in order of similarity, got {result}."
      - name: works on another dataset
        code: |
          pts = {"x": [1, 0], "y": [0, 1], "z": [1, 1]}
          assert top_k([2, 1], pts, 2) == ["z", "x"], f"For [2, 1], z (cos 0.95) then x (cos 0.89) are nearest; got {top_k([2, 1], pts, 2)}."
    hints:
      - "Build a list of `(score, doc_id)` tuples, one per stored vector."
      - "`list.sort(reverse=True)` sorts by score, highest first."
      - Return only the IDs of the first k tuples.
    feedback:
      - when: { outputEquals: "['parcel', 'refund']\n" }
        message: You returned the least similar vectors. Higher cosine similarity is better — sort in descending order.
      - when: { outputEquals: "[]\n" }
        message: The function still returns an empty list. Score each vector, sort, and slice the first k.
    explanation: >-
      Exact k-NN is a scoring loop plus a sort. For very large N, `heapq.nlargest(k, ...)` avoids sorting
      everything, and NumPy turns the loop into one matrix–vector product — but the result is the same.

  - id: debug-distance-sort
    type: debug
    skill: debugging
    prompt: |
      `nearest` should return the IDs of the `k` points **closest** to the query by Euclidean distance.
      For the example it should print `['d', 'a']`, but it returns the farthest points. Fix it.
    starterCode: |
      import math

      def euclidean(a, b):
          return math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b, strict=True)))

      def nearest(query, vectors, k):
          scored = [(euclidean(query, vec), doc_id) for doc_id, vec in vectors.items()]
          scored.sort(reverse=True)
          return [doc_id for _, doc_id in scored[:k]]

      points = {"a": [0, 0], "b": [1, 2], "c": [5, 5], "d": [2, 0]}
      print(nearest([1.5, 0], points, 2))
    solution: |
      import math

      def euclidean(a, b):
          return math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b, strict=True)))

      def nearest(query, vectors, k):
          scored = [(euclidean(query, vec), doc_id) for doc_id, vec in vectors.items()]
          scored.sort()
          return [doc_id for _, doc_id in scored[:k]]

      points = {"a": [0, 0], "b": [1, 2], "c": [5, 5], "d": [2, 0]}
      print(nearest([1.5, 0], points, 2))
    expectedOutput: |
      ['d', 'a']
    tests:
      - name: returns the closest points
        code: |
          assert nearest([1.5, 0], points, 2) == ["d", "a"], f"d (0.5 away) and a (1.5 away) are closest to [1.5, 0]; got {nearest([1.5, 0], points, 2)}."
      - name: works for other queries
        code: |
          assert nearest([5, 4], points, 1) == ["c"], f"c is closest to [5, 4]; got {nearest([5, 4], points, 1)}."
          assert nearest([1, 2.2], points, 1) == ["b"], f"b is closest to [1, 2.2]; got {nearest([1, 2.2], points, 1)}."
    hints:
      - For a distance, is a bigger or a smaller number a better match?
      - "`sort()` without `reverse=True` puts the smallest first."
    feedback:
      - when: { outputContains: "'c'" }
        message: The farthest point c is being returned. Distances are smaller-is-better — sort ascending.
    explanation: >-
      Similarities are larger-is-better; distances are smaller-is-better. Copying the similarity code
      (with reverse=True) to a distance metric returns the worst matches — one of the most common vector
      search bugs, also seen with database APIs that return distances.

  - id: code-hash-embed
    type: code
    skill: transfer
    difficulty: 2
    prompt: |
      Write `hash_embed(text, dim)`, the toy hashing-trick embedder:

      1. start with `dim` zeros (floats);
      2. for each word in `text.lower().split()`, compute
         `bucket = int.from_bytes(hashlib.sha256(word.encode("utf-8")).digest(), "big") % dim`
         and add 1.0 to that slot;
      3. divide every slot by the vector's L2 length — unless the length is 0 (empty text), in which case
         return the zero vector.
    starterCode: |
      import hashlib
      import math

      def hash_embed(text, dim):
          vec = [0.0] * dim
          # Hash each word to a slot, count, then L2-normalise.
          return vec

      v = hash_embed("reset your password", 97)
      print(len(v), round(sum(x * x for x in v), 6))
    solution: |
      import hashlib
      import math

      def hash_embed(text, dim):
          vec = [0.0] * dim
          for word in text.lower().split():
              digest = hashlib.sha256(word.encode("utf-8")).digest()
              bucket = int.from_bytes(digest, "big") % dim
              vec[bucket] += 1.0
          length = math.sqrt(sum(x * x for x in vec))
          if length == 0:
              return vec
          return [x / length for x in vec]

      v = hash_embed("reset your password", 97)
      print(len(v), round(sum(x * x for x in v), 6))
    expectedOutput: |
      97 1.0
    tests:
      - name: right size and unit length
        code: |
          import math
          v = hash_embed("reset your password", 97)
          assert len(v) == 97, f"The vector should have dim = 97 slots, got {len(v)}."
          assert math.isclose(sum(x * x for x in v), 1.0), "The vector should be L2-normalised (sum of squares = 1)."
      - name: matches the specified hashing
        code: |
          import hashlib, math
          def reference(text, dim):
              vec = [0.0] * dim
              for word in text.lower().split():
                  vec[int.from_bytes(hashlib.sha256(word.encode("utf-8")).digest(), "big") % dim] += 1.0
              n = math.sqrt(sum(x * x for x in vec))
              return [x / n for x in vec] if n else vec
          for text, dim in [("Reset your password", 97), ("the cat and the hat", 16), ("one", 5)]:
              got = hash_embed(text, dim)
              assert all(math.isclose(a, b) for a, b in zip(got, reference(text, dim))), f"hash_embed({text!r}, {dim}) does not match the specified algorithm. Lowercase, split, sha256 bucket, count, normalise."
      - name: bag of words ignores order
        code: |
          assert hash_embed("password reset", 97) == hash_embed("reset password", 97), "The same words in a different order should give the same vector."
      - name: empty text gives a zero vector
        code: |
          v = hash_embed("", 8)
          assert v == [0.0] * 8, f"Empty text should give 8 zeros, got {v}."
    hints:
      - "Loop over `text.lower().split()` and compute the bucket exactly as shown."
      - "`vec[bucket] += 1.0` counts the word."
      - "Compute `length = math.sqrt(sum(x * x for x in vec))`; return `vec` unchanged if it is 0."
    feedback:
      - when: { outputEquals: "97 0.0\n" }
        message: The vector is still all zeros. Add 1.0 to the hashed slot for every word, then normalise.
      - when: { errorType: ZeroDivisionError }
        message: Empty text gives a zero-length vector. Return it unchanged instead of dividing by 0.
      - when: { codeMatches: "\\bhash\\(" }
        message: Python's built-in hash() is randomised for strings between runs. Use hashlib.sha256 as described so vectors are reproducible.
    explanation: >-
      The hashing trick maps any vocabulary into a fixed number of slots without storing a word list.
      It is reproducible (thanks to SHA-256), order-insensitive and lexical — it captures word overlap,
      not meaning.

