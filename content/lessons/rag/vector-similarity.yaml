  - id: m-predict-unit
    type: predict-output
    skill: prediction
    difficulty: 2
    prompt: Both vectors are normalised first. What does this print?
    code: |
      import math

      def normalize(v):
          n = math.sqrt(sum(x * x for x in v))
          return [x / n for x in v]

      a = normalize([1, 0])
      b = normalize([1, 1])
      dot = sum(x * y for x, y in zip(a, b))
      sq_dist = sum((x - y) ** 2 for x, y in zip(a, b))
      print(round(dot, 4), round(sq_dist, 4), round(2 - 2 * dot, 4))
    answer: "0.7071 0.5858 0.5858"
    explanation: >-
      The angle is 45°, so the dot product of the unit vectors is cos 45° ≈ 0.7071. For unit vectors the
      squared distance equals 2 − 2·cos = 0.5858, so the last two numbers match.
    wrongAnswers:
      - answer: "1 0.5858 1"
        feedback: "The dot product of the normalised vectors is the cosine of the angle between them (45°), about 0.7071, not the raw dot product 1."
      - answer: "0.7071 1.0 0.5858"
        feedback: "a = [1, 0] and b ≈ [0.7071, 0.7071]; the squared distance is (1 − 0.7071)² + 0.7071² ≈ 0.5858, the same as 2 − 2·cos."

  - id: m-distance-api
    type: mcq
    skill: transfer
    prompt: |
      A vector database query returns L2 **distances**: chunk A 0.12, chunk B 0.85, chunk C 0.40. Which
      chunk is the best match?
    explanation: >-
      A distance measures how far apart the vectors are, so the smallest distance is the closest match:
      chunk A. Sorting distances in descending order would return the worst match first.
    options:
      - id: a
        text: Chunk A (0.12)
        correct: true
        feedback: Right — for distances, smaller is better.
      - id: b
        text: Chunk B (0.85)
        feedback: That would be right for a similarity score. For a distance, 0.85 is the farthest.
      - id: c
        text: Chunk C (0.40)
        feedback: C is in the middle. The smallest distance, A, is closest.
      - id: d
        text: It cannot be decided without knowing the cosine similarities.
        feedback: For a single metric, the ranking is clear — the smallest L2 distance wins.

  - id: m-unit-search
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Speed up search by normalising once. Write:

      - `build_unit_index(vectors)` — return a new dict with every vector L2-normalised;
      - `search(query, unit_index, k)` — normalise the query, rank stored vectors by **dot product**
        (which now equals cosine similarity), and return the top `k` IDs, best first.
    starterCode: |
      import math

      def normalize(v):
          length = math.sqrt(sum(x * x for x in v))
          return [x / length for x in v]

      def build_unit_index(vectors):
          return vectors        # normalise every vector

      def search(query, unit_index, k):
          return []             # normalise query, rank by dot product

      index = build_unit_index({"a": [10, 0], "b": [0, 2], "c": [3, 3]})
      print(search([1, 0.2], index, 2))
    solution: |
      import math

      def normalize(v):
          length = math.sqrt(sum(x * x for x in v))
          return [x / length for x in v]

      def build_unit_index(vectors):
          return {doc_id: normalize(vec) for doc_id, vec in vectors.items()}

      def search(query, unit_index, k):
          q = normalize(query)
          scored = [(sum(x * y for x, y in zip(q, vec, strict=True)), doc_id) for doc_id, vec in unit_index.items()]
          scored.sort(reverse=True)
          return [doc_id for _, doc_id in scored[:k]]

      index = build_unit_index({"a": [10, 0], "b": [0, 2], "c": [3, 3]})
      print(search([1, 0.2], index, 2))
    expectedOutput: |
      ['a', 'c']
    tests:
      - name: stored vectors are unit length
        code: |
          import math
          idx = build_unit_index({"a": [10, 0], "b": [0, 2], "c": [3, 3]})
          assert set(idx) == {"a", "b", "c"}, "Keep the same IDs."
          for doc_id, vec in idx.items():
              assert math.isclose(math.sqrt(sum(x * x for x in vec)), 1.0), f"Vector {doc_id} should have length 1 after build_unit_index, got {vec}."
      - name: ranking ignores vector length
        code: |
          idx = build_unit_index({"long": [100, 1], "short": [1, 1]})
          assert search([1, 1], idx, 1) == ["short"], "[1, 1] points exactly like 'short'; length must not matter after normalisation."
      - name: matches cosine ranking on the example
        code: |
          idx = build_unit_index({"a": [10, 0], "b": [0, 2], "c": [3, 3]})
          assert search([1, 0.2], idx, 2) == ["a", "c"], f"Expected ['a', 'c'], got {search([1, 0.2], idx, 2)}."
          assert search([0.1, 1], idx, 3) == ["b", "c", "a"], f"Expected ['b', 'c', 'a'], got {search([0.1, 1], idx, 3)}."
      - name: does not modify the input vectors
        code: |
          original = {"a": [10, 0]}
          build_unit_index(original)
          assert original["a"] == [10, 0], "build_unit_index should return a new dict, not change the vectors you passed in."
    hints:
      - "`{doc_id: normalize(vec) for doc_id, vec in vectors.items()}` builds the new index."
      - In `search`, normalise the query too, then score with a plain dot product.
      - Sort `(score, doc_id)` tuples in descending order and return the first k IDs.
    feedback:
      - when: { outputEquals: "[]\n" }
        message: search() still returns an empty list. Normalise the query, compute dot products, sort, and return k IDs.
    explanation: >-
      Normalising the stored vectors once at indexing time means each query needs only dot products —
      the reason many vector stores recommend normalised embeddings with an inner-product index.

  - id: m-tf-threshold
    type: true-false
    skill: recognition
    prompt: "True or false: a cosine similarity of 0.8 indicates a good match regardless of which embedding model produced the vectors."
    answer: false
    explanation: >-
      Similarity scores are relative and model-specific. Some models put unrelated texts at 0.7, others
      put close paraphrases at 0.6. Thresholds must be chosen (and re-chosen after a model change) by
      measuring on your own labelled examples.

  - id: m-design-hybrid
    type: mcq
    skill: design
    difficulty: 2
    prompt: |
      Engineers search a parts catalogue both by exact part numbers (`XK-4471`) and by descriptions
      ("battery drains overnight"). Which retrieval design fits best?
    explanation: >-
      Exact part numbers need keyword matching; descriptions need semantic matching. Their failure modes
      differ, so running both and fusing the rankings (hybrid search) covers both kinds of query.
    options:
      - id: a
        text: Hybrid search — run BM25 and vector search and combine their rankings.
        correct: true
        feedback: Right — each covers the other's blind spot.
      - id: b
        text: Vector search only, with a larger embedding model.
        feedback: Even strong embedding models can blur near-identical part numbers; exact matching is keyword search's strength.
      - id: c
        text: BM25 only, with a long synonym list.
        feedback: Synonym lists are brittle and incomplete for free-text descriptions; embeddings handle paraphrases better.
      - id: d
        text: Substring search over all documents.
        feedback: No ranking, false matches inside words, and a full scan per query.

masteryCheck:
  passThreshold: 0.8
  items: [m-predict-unit, m-distance-api, m-unit-search, m-tf-threshold, m-design-hybrid]

cheatsheet: |
  ```python
  dot = sum(x * y for x, y in zip(a, b, strict=True))     # strict: catch dimension mismatch
  norm = math.sqrt(sum(x * x for x in a))
  cos = dot / (norm_a * norm_b)                           # direction only, -1..1
  dist = math.sqrt(sum((x - y) ** 2 for x, y in zip(a, b)))  # smaller is better
  unit = [x / norm for x in a]                            # normalise once

  # exact top-k (O(N·d) per query)
  scored = sorted(((cos(q, v), i) for i, v in vectors.items()), reverse=True)[:k]
  ```
  - Unit vectors: dot = cosine; ‖a − b‖² = 2 − 2·cos → same ranking.
  - Use the metric the model expects; same model for queries and documents.
  - Similar ≠ relevant; thresholds are model-specific.
  - Keyword fails on paraphrase; vectors blur exact IDs → hybrid search. ANN indexes when N is large.
