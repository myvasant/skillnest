sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Approximate nearest-neighbour indexes (HNSW, IVF) trade a little recall for big speed-ups; pgvector, Chroma,
      FAISS and Qdrant are common local-capable options. Brute-force search gets slow and expensive at millions
      of vectors. Approximate nearest-neighbour (ANN) indexes and the databases built around them keep retrieval
      fast while adding persistence, filtering and updates.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- HNSW builds a multi-layer proximity graph and searches greedily from sparse upper layers down to the
      dense bottom layer; key knobs are M (links per node), ef_construction (build quality) and ef_search (query-time
      recall versus speed).

      - IVF clusters vectors around centroids and searches only the nearest few lists (nprobe, or probes in pgvector);
      product quantization (PQ) compresses vectors to save memory at some accuracy cost.

      - ANN trades recall for speed; measure recall@k against exact search whenever you tune parameters.

      - pgvector adds a `vector` type, distance operators (`<->` L2, `<=>` cosine, `<#>` negative inner product)
      and HNSW or IVFFlat indexes to PostgreSQL; FAISS is an in-process library; Chroma and Qdrant are vector databases
      that run embedded or in Docker.

      - A database adds what a bare index lacks — persistence, metadata filtering, updates and deletes, replication;
      choose by data size, filtering needs and what you already operate.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- FAISS is a library, not a database; you handle persistence, metadata and updates yourself.

      - You often do not need a dedicated vector database; PostgreSQL with pgvector, or even exact search, is enough
      for many applications.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def top_k(query, vectors, k):\n    scored=[(sum(a*b for a,b in zip(query,vector)), doc_id) for doc_id,vector\
      \ in vectors.items()]\n    return [doc for score,doc in sorted(scored, reverse=True)[:max(0,k)]]\n\nprint(top_k([1,0],\
      \ {\"a\":[1,0],\"b\":[0,1],\"c\":[0.8,0.2]}, 2))"
    caption: Runnable deterministic example; no external model call is made.
