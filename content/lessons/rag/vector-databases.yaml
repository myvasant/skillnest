concept: rag.vector-databases
title: Vector indexes and databases
subtitle: Approximate nearest-neighbour indexes (HNSW, IVF) trade a little recall for big speed-ups; pgvector, Chroma,
  FAISS and Qdrant are common local-capable options
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Approximate nearest-neighbour indexes (HNSW, IVF) trade a little recall for big speed-ups; pgvector, Chroma,
  FAISS and Qdrant are common local-capable options.
objectives:
- Explain the role of vector indexes and databases in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
