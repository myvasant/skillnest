id: rag.grounding-citations
concept: rag.grounding-citations
title: Grounding and citations
subtitle: Attach sources to claims, verify that answers are supported by the retrieved text, and say "I don't know"
  when they are not
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Attach sources to claims, verify that answers are supported by the retrieved text, and say "I don't know"
  when they are not.
objectives:
- Explain the role of grounding and citations in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Enabling Large Language Models to Generate Text with Citations (ALCE)
  url: https://arxiv.org/abs/2305.14627
  publisher: arXiv
- title: Faithfulness metric
  url: https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/
  publisher: Ragas
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Attach sources to claims, verify that answers are supported by the retrieved text, and say "I don't know"
      when they are not. Users and auditors need to check where an answer came from, and a fluent answer the sources
      do not support is worse than no answer. Grounding and citations make RAG answers verifiable.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Ask the model to cite chunk IDs inline for each claim and map them back to document links in the UI;
      some provider APIs offer native citation features (check your provider''s current docs).

      - Faithfulness (groundedness) asks whether every claim is supported by the retrieved context — a different
      question from whether the answer is correct or relevant.

      - Verify after generation — check that cited IDs exist and quoted spans appear in the source; optionally use
      an NLI model or LLM judge to flag unsupported claims.

      - Define an abstention path: when retrieval scores are low or no support is found, answer "I don''t know"
      or ask a clarifying question.

      - Show quotes or highlighted passages, not just document titles, so users can verify quickly.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A citation is not proof; models can attach real citations to claims the cited text does not support.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def valid_citations(answer, retrieved_ids):\n    cited=[token[1:-1] for token in answer.split() if token.startswith(\"\
      [\") and token.endswith(\"]\")]\n    return all(source in retrieved_ids for source in cited)\n\nprint(valid_citations(\"\
      Claim [doc-1]\", {\"doc-1\",\"doc-2\"}))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: grounding-citations-code
  - type: item
    ref: grounding-citations-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Ask the model to cite chunk IDs inline for each claim and map them back to document links in the UI; some
      provider APIs offer native citation features (check your provider''s current docs).

      - Faithfulness (groundedness) asks whether every claim is supported by the retrieved context — a different
      question from whether the answer is correct or relevant.

      - Verify after generation — check that cited IDs exist and quoted spans appear in the source; optionally use
      an NLI model or LLM judge to flag unsupported claims.

      - Define an abstention path: when retrieval scores are low or no support is found, answer "I don''t know"
      or ask a clarifying question.

      - Show quotes or highlighted passages, not just document titles, so users can verify quickly.


      **Limitations**

      - A citation is not proof; models can attach real citations to claims the cited text does not support.'
  - type: item
    ref: grounding-citations-mcq
  - type: item
    ref: grounding-citations-tf
  - type: item
    ref: grounding-citations-code
items:
- id: grounding-citations-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of grounding and citations?
  explanation: Ask the model to cite chunk IDs inline for each claim and map them back to document links in the
    UI; some provider APIs offer native citation features (check your provider's current docs).
  options:
  - id: a
    text: Ask the model to cite chunk IDs inline for each claim and map them back to document links in the UI; some
      provider APIs offer native citation features (check your provider's current docs).
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: A citation is not proof; models can attach real citations to claims the cited text does not support.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: grounding-citations-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A citation is not proof; models can attach real citations to claims the cited text does not support.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: grounding-citations-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding grounding and citations to an application. Describe the design, one failure mode, and how
    you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: grounding-citations-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for grounding and citations. The assertions include the normal path
    and a meaningful edge case.
  starterCode: "def valid_citations(answer, retrieved_ids):\n    raise NotImplementedError('Complete this function')"
  solution: "def valid_citations(answer, retrieved_ids):\n    cited=[token[1:-1] for token in answer.split() if\
    \ token.startswith(\"[\") and token.endswith(\"]\")]\n    return all(source in retrieved_ids for source in cited)"
  tests:
  - name: Core behaviour
    code: assert valid_citations("Claim [doc-1]", {"doc-1"}) is True
  - name: Edge case
    code: assert valid_citations("Claim [unknown]", {"doc-1"}) is False
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
