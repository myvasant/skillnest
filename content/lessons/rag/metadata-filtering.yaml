id: rag.metadata-filtering
concept: rag.metadata-filtering
title: Metadata filtering
subtitle: Restrict retrieval by source, date, language, tenant or permissions before or during similarity search
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Restrict retrieval by source, date, language, tenant or permissions before or during similarity search.
objectives:
- Explain the role of metadata filtering in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Filtering
  url: https://qdrant.tech/documentation/search/filtering/
  publisher: Qdrant
- title: Metadata filtering
  url: https://docs.trychroma.com/docs/querying-collections/metadata-filtering
  publisher: Chroma
- title: pgvector README (filtering and iterative index scans)
  url: https://github.com/pgvector/pgvector
  publisher: pgvector
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Restrict retrieval by source, date, language, tenant or permissions before or during similarity search.
      Many questions are implicitly scoped — "in the 2025 policy", "for my team", "in German" — and permissions
      must limit what anyone can retrieve. Filters on structured metadata enforce these constraints exactly, which
      similarity alone never can.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Store structured fields with each chunk (source, doc_id, date, language, tenant_id, ACL groups) and
      apply exact conditions alongside the vector query.

      - Pre-filtering applies the condition before or during the ANN search; post-filtering searches first and drops
      non-matches, which can leave fewer than k results when the filter is selective.

      - Engines differ: Qdrant and Chroma take filter conditions in the query (Chroma''s `where`), and pgvector
      uses SQL `WHERE`; since pgvector 0.8.0, iterative index scans help HNSW and IVFFlat return enough rows under
      filters.

      - Index the fields you filter on (payload indexes in Qdrant; B-tree or partial indexes and partitions in PostgreSQL);
      very selective filters may be best served by exact search over the filtered subset.

      - Filters can be extracted from the question (e.g. an LLM pulling out a date range), but validate extracted
      values before using them.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Telling the model "only use documents from 2025" is not filtering; enforce constraints in the retrieval
      query.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def filter_documents(documents, allowed_tags, tenant):\n    return [d for d in documents if d.get(\"\
      tenant\")==tenant and d.get(\"tag\") in allowed_tags]\n\ndocs=[{\"id\":\"1\",\"tenant\":\"A\",\"tag\":\"policy\"\
      },{\"id\":\"2\",\"tenant\":\"B\",\"tag\":\"policy\"}]\nprint(filter_documents(docs, {\"policy\"}, \"A\"))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: metadata-filtering-code
  - type: item
    ref: metadata-filtering-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Store structured fields with each chunk (source, doc_id, date, language, tenant_id, ACL groups) and apply
      exact conditions alongside the vector query.

      - Pre-filtering applies the condition before or during the ANN search; post-filtering searches first and drops
      non-matches, which can leave fewer than k results when the filter is selective.

      - Engines differ: Qdrant and Chroma take filter conditions in the query (Chroma''s `where`), and pgvector
      uses SQL `WHERE`; since pgvector 0.8.0, iterative index scans help HNSW and IVFFlat return enough rows under
      filters.

      - Index the fields you filter on (payload indexes in Qdrant; B-tree or partial indexes and partitions in PostgreSQL);
      very selective filters may be best served by exact search over the filtered subset.

      - Filters can be extracted from the question (e.g. an LLM pulling out a date range), but validate extracted
      values before using them.


      **Limitations**

      - Telling the model "only use documents from 2025" is not filtering; enforce constraints in the retrieval
      query.'
  - type: item
    ref: metadata-filtering-mcq
  - type: item
    ref: metadata-filtering-tf
  - type: item
    ref: metadata-filtering-code
items:
- id: metadata-filtering-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of metadata filtering?
  explanation: Store structured fields with each chunk (source, doc_id, date, language, tenant_id, ACL groups) and
    apply exact conditions alongside the vector query.
  options:
  - id: a
    text: Store structured fields with each chunk (source, doc_id, date, language, tenant_id, ACL groups) and apply
      exact conditions alongside the vector query.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: Telling the model "only use documents from 2025" is not filtering; enforce constraints in the retrieval
      query.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: metadata-filtering-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Telling the model "only use documents from 2025" is not filtering; enforce constraints in the retrieval
    query.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: metadata-filtering-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding metadata filtering to an application. Describe the design, one failure mode, and how you
    would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: metadata-filtering-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for metadata filtering. The assertions include the normal path and a
    meaningful edge case.
  starterCode: "def filter_documents(documents, allowed_tags, tenant):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def filter_documents(documents, allowed_tags, tenant):\n    return [d for d in documents if d.get(\"\
    tenant\")==tenant and d.get(\"tag\") in allowed_tags]"
  tests:
  - name: Core behaviour
    code: docs=[{"id":"1","tenant":"A","tag":"policy"},{"id":"2","tenant":"B","tag":"policy"}]
  - name: Edge case
    code: 'assert [d["id"] for d in filter_documents(docs,{"policy"},"A")] == ["1"]

      assert filter_documents(docs,set(),"A") == []'
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
