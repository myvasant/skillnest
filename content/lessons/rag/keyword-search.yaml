  - id: summary
    title: Summary
    kind: summary
    blocks:
      - type: markdown
        body: |
          - **Analysis** (lowercase, split, stop words, stemming) decides what counts as a match. Apply
            the same analyser to documents and queries.
          - An **inverted index** maps each term to a postings list, so a query only touches documents
            that share its terms.
          - **TF-IDF** = term frequency × rarity; a term in every document gets idf 0.
          - **BM25** adds saturation (k₁ ≈ 1.2) and length normalisation (b ≈ 0.75) and uses an IDF that
            stays positive in Lucene-style engines.
          - Keyword search excels at exact names, codes and jargon and is explainable; it fails on
            synonyms and paraphrases, where embeddings help — hence hybrid search.
      - type: callout
        variant: interview
        title: Interview angle
        body: |
          "Explain BM25." — Score = sum over query terms of IDF (rare terms matter more) × a tf component
          that saturates (k₁: the tenth occurrence adds little) and is normalised by document length (b:
          long documents do not win just by being long). Then say when it beats vector search (exact
          identifiers, out-of-domain text, explainability) and when it loses (vocabulary mismatch).

items:
  - id: predict-postings
    type: predict-output
    skill: prediction
    prompt: What does this program print?
    code: |
      docs = {"a": "red apple", "b": "green apple pie", "c": "red red wine"}
      index = {}
      for doc_id, text in docs.items():
          for term in text.split():
              index.setdefault(term, {})
              index[term][doc_id] = index[term].get(doc_id, 0) + 1
      print(index["red"])
      print(index["apple"])
    answer: |
      {'a': 1, 'c': 2}
      {'a': 1, 'b': 1}
    explanation: >-
      "red" appears once in a and twice in c, so its postings list is {'a': 1, 'c': 2}; b does not appear
      because it does not contain "red". "apple" appears once each in a and b.
    wrongAnswers:
      - answer: |
          {'a': 1, 'b': 0, 'c': 2}
          {'a': 1, 'b': 1, 'c': 0}
        feedback: A postings list only contains documents that have the term. That is what makes the index fast — absent documents are never stored or visited.
      - answer: |
          {'a': 1, 'c': 1}
          {'a': 1, 'b': 1}
        feedback: The index counts every occurrence. "red red wine" contains "red" twice, so c has a count of 2.

  - id: predict-idf-zero
    type: predict-output
    skill: prediction
    prompt: '"cat" occurs twice in the third document. What is its TF-IDF weight there?'
    code: |
      import math

      docs = [["cat", "sat"], ["cat", "ran"], ["cat", "cat", "slept"]]
      N = len(docs)
      df = sum(1 for d in docs if "cat" in d)
      print(docs[2].count("cat") * math.log(N / df))
    answer: "0.0"
    explanation: >-
      "cat" is in all 3 documents, so idf = ln(3 / 3) = ln(1) = 0, and any tf times 0 is 0. A term that
      appears everywhere cannot distinguish documents.
    wrongAnswers:
      - answer: "2"
        feedback: That is the term frequency alone. TF-IDF multiplies it by idf, which is ln(3/3) = 0 here.
      - answer: "2.1972245773362196"
        feedback: That would be 2 × ln(3), the idf of a term that occurs in only one document. df here is 3.

  - id: mcq-k1-b
    type: mcq
    skill: explanation
    prompt: In BM25, what does the parameter **b** control?
    explanation: >-
      b sets how strongly the term-frequency component is normalised by document length relative to the
      average: b = 0 ignores length, b = 1 normalises fully. k1 controls saturation.
    options:
      - id: a
        text: How much a document's length (relative to the average) reduces its term-frequency credit.
        correct: true
        feedback: Right — with b = 0.75, a mention in a long document is worth less than one in a short document.
      - id: b
        text: How quickly repeated occurrences of a term stop adding to the score.
        feedback: That is k1, the saturation parameter.
      - id: c
        text: How rare a term must be before it counts.
        feedback: Rarity is handled by the IDF factor, which has no tunable parameter in this formula.
      - id: d
        text: The maximum number of documents returned.
        feedback: That is the k in top-k, chosen by the caller. b is part of the scoring formula.

  - id: mcq-keyword-vs-semantic
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: For which query is BM25 keyword search most likely to beat embedding-based semantic search over a support knowledge base?
    explanation: >-
      Exact identifiers such as error codes are where keyword search shines: the code is a rare term with
      high IDF and must match exactly. Embeddings may place E1042 near similar-looking codes or generic
      "error" passages. The paraphrase queries are where semantic search helps.
    options:
      - id: a
        text: "\"What does error E1042 mean?\""
        correct: true
        feedback: Right — an exact, rare identifier gets a high IDF and an exact match.
      - id: b
        text: "\"I can't get into my account\" (documents say \"reset your password\")"
        feedback: No words in common, so BM25 scores zero. This vocabulary mismatch is where embeddings help.
      - id: c
        text: "\"how do I get my money back\" (documents say \"refund policy\")"
        feedback: Another paraphrase with no shared terms — semantic search is the better tool here.
      - id: d
        text: "\"is it cold outside\" (documents are about the office heating policy)"
        feedback: The relation is about meaning, not shared words; keyword search will struggle.

  - id: code-build-index
    type: code
    skill: implementation
    prompt: |
      Write `build_index(docs)`. `docs` maps document IDs to **lists of terms** (already tokenised).
      Return an inverted index: a dict mapping each term to a dict `{doc_id: count}` of the documents that
      contain it. Documents without the term must not appear in its postings.
    starterCode: |
      def build_index(docs):
          index = {}
          # For each document and each term in it, add 1 to index[term][doc_id].
          return index

      docs = {"d1": ["reset", "password"], "d2": ["password", "rules", "password"]}
      print(build_index(docs))
    solution: |
      def build_index(docs):
          index = {}
          for doc_id, terms in docs.items():
              for term in terms:
                  postings = index.setdefault(term, {})
                  postings[doc_id] = postings.get(doc_id, 0) + 1
          return index

      docs = {"d1": ["reset", "password"], "d2": ["password", "rules", "password"]}
      print(build_index(docs))
    expectedOutput: |
      {'reset': {'d1': 1}, 'password': {'d1': 1, 'd2': 2}, 'rules': {'d2': 1}}
    tests:
      - name: builds the example index
        code: |
          result = build_index({"d1": ["reset", "password"], "d2": ["password", "rules", "password"]})
          expected = {"reset": {"d1": 1}, "password": {"d1": 1, "d2": 2}, "rules": {"d2": 1}}
          assert result == expected, f"Expected {expected}, got {result}."
      - name: only documents containing the term appear
        code: |
          result = build_index({"a": ["x"], "b": ["y"], "c": ["x", "x", "x"]})
          assert result.get("x") == {"a": 1, "c": 3}, f"'x' is in a once and c three times, and not in b; got {result.get('x')}."
          assert result.get("y") == {"b": 1}, f"'y' is only in b; got {result.get('y')}."
      - name: empty documents add nothing
        code: |
          result = build_index({"empty": [], "one": ["solo"]})
          assert result == {"solo": {"one": 1}}, f"An empty document contributes no terms; got {result}."
    hints:
      - Loop over `docs.items()`, then over each document's terms.
      - "`index.setdefault(term, {})` returns the postings dict for the term, creating it if needed."
      - "Increment with `postings[doc_id] = postings.get(doc_id, 0) + 1`."
    feedback:
      - when: { errorType: KeyError }
        message: You are adding to index[term] or index[term][doc_id] before it exists. Use setdefault for the term and .get(doc_id, 0) for the count.
      - when: { outputEquals: "{}\n" }
        message: The index is still empty. Loop over every document and every term in it.
    explanation: >-
      The inverted index is a dict of dicts: term → {doc_id: tf}. Building it is one pass over the corpus;
      afterwards, each query term's candidates are a single dictionary lookup away.

  - id: parsons-index
    type: parsons
    skill: implementation
    prompt: |
      Arrange the lines to find the documents containing **every** query term (an AND query) by
      intersecting postings lists. It should print `['d1']`. One line is a distractor.
    solution: |
      index = {"reset": {"d1": 1, "d4": 1}, "password": {"d1": 1, "d2": 2, "d3": 1}}
      query = ["reset", "password"]
      matches = set(index[query[0]])
      for term in query[1:]:
          matches &= set(index.get(term, {}))
      print(sorted(matches))
    distractors:
      - "    matches |= set(index.get(term, {}))"
    expectedOutput: |
      ['d1']
    explanation: >-
      Start from the first term's documents and intersect (`&=`) with each other term's documents. Union
      (`|=`) would give an OR query: every document containing any term.

  - id: code-bm25-term
    type: code
    skill: implementation
    difficulty: 2
    prompt: |
      Write `bm25_term(tf, df, N, dl, avgdl, k1=1.2, b=0.75)`, the BM25 contribution of **one** query term
      to **one** document, using the Lucene-style IDF:

      *IDF = ln(1 + (N − df + 0.5) / (df + 0.5))*

      *contribution = IDF · tf · (k1 + 1) / (tf + k1 · (1 − b + b · dl / avgdl))*

      Check: `bm25_term(1, 1, 3, 2, 4)` should be about `1.2330` ("reset" in d1 from the lesson).
    starterCode: |
      import math

      def bm25_term(tf, df, N, dl, avgdl, k1=1.2, b=0.75):
          idf = 0.0     # replace with the IDF formula
          norm = 0.0    # replace with k1 * (1 - b + b * dl / avgdl)
          return 0.0    # replace with the BM25 term weight

      print(round(bm25_term(1, 1, 3, 2, 4), 4))
    solution: |
      import math

      def bm25_term(tf, df, N, dl, avgdl, k1=1.2, b=0.75):
          idf = math.log(1 + (N - df + 0.5) / (df + 0.5))
          norm = k1 * (1 - b + b * dl / avgdl)
          return idf * tf * (k1 + 1) / (tf + norm)

      print(round(bm25_term(1, 1, 3, 2, 4), 4))
    expectedOutput: |
      1.233
    tests:
      - name: matches the hand calculation
        code: |
          import math
          assert math.isclose(bm25_term(1, 1, 3, 2, 4), 1.2330, abs_tol=1e-3), f"bm25_term(1, 1, 3, 2, 4) should be about 1.2330, got {bm25_term(1, 1, 3, 2, 4)}."
          assert math.isclose(bm25_term(2, 3, 3, 5, 4), 0.1715, abs_tol=1e-3), f"bm25_term(2, 3, 3, 5, 4) ('password' in d2) should be about 0.1715, got {bm25_term(2, 3, 3, 5, 4)}."
      - name: works on other numbers
        code: |
          import math
          got = bm25_term(3, 2, 10, 50, 100)
          assert math.isclose(got, 2.6076, abs_tol=1e-3), f"bm25_term(3, 2, 10, 50, 100) should be about 2.6076, got {got}."
      - name: k1 = 0 ignores term frequency
        code: |
          import math
          expected_idf = math.log(1 + 8.5 / 2.5)
          for tf in (1, 5):
              got = bm25_term(tf, 2, 10, 50, 100, k1=0)
              assert math.isclose(got, expected_idf, abs_tol=1e-6), f"With k1 = 0 the tf part is 1, so the result should equal the IDF ({expected_idf:.4f}) for any tf; got {got} for tf={tf}."
      - name: b = 0 ignores document length
        code: |
          import math
          short, long = bm25_term(1, 2, 10, 5, 100, b=0), bm25_term(1, 2, 10, 500, 100, b=0)
          assert math.isclose(short, long), f"With b = 0 document length should not matter, but dl=5 gave {short} and dl=500 gave {long}."
    hints:
      - "`math.log` is the natural logarithm (ln)."
      - "Compute `norm = k1 * (1 - b + b * dl / avgdl)` first; it equals k1 for a document of average length."
      - "Return `idf * tf * (k1 + 1) / (tf + norm)`."
    feedback:
      - when: { outputEquals: "0.0\n" }
        message: The function still returns 0.0. Fill in idf, norm and the returned weight.
      - when: { outputContains: "0.5108" }
        message: That is the classic IDF ln((N − df + 0.5)/(df + 0.5)) without the "1 +". Use the Lucene-style ln(1 + (N − df + 0.5)/(df + 0.5)).
    explanation: >-
      The IDF rewards rare terms, `norm` scales k1 by relative document length, and the tf fraction
      saturates toward k1 + 1. With k1 = 0 the fraction is always 1 (pure presence), and with b = 0 length
      plays no part.

