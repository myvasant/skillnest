  - id: code-mini-search
    type: code
    skill: transfer
    difficulty: 3
    prompt: |
      Put it all together. Write `search(query, docs, k=3)` that:

      1. tokenises every document and the query with the provided `tokenize`;
      2. builds an inverted index and computes `N`, each document's length and `avgdl`;
      3. scores documents with the provided `bm25_term`, using only documents in the query terms'
         postings lists and skipping query terms that are in no document;
      4. returns the top `k` results as a list of `(doc_id, score)` tuples, highest score first (ties by
         `doc_id`). Documents with no matching term are not returned.
    starterCode: |
      import math

      STOP_WORDS = {"a", "an", "and", "be", "for", "how", "is", "of", "the", "to", "your"}

      def tokenize(text):
          cleaned = "".join(ch if ch.isalnum() else " " for ch in text.lower())
          return [w for w in cleaned.split() if w not in STOP_WORDS]

      def bm25_term(tf, df, N, dl, avgdl, k1=1.2, b=0.75):
          idf = math.log(1 + (N - df + 0.5) / (df + 0.5))
          norm = k1 * (1 - b + b * dl / avgdl)
          return idf * tf * (k1 + 1) / (tf + norm)

      def search(query, docs, k=3):
          # 1. tokenise docs; 2. build index, N, lengths, avgdl; 3. score; 4. sort and cut to k
          return []

      docs = {
          "d1": "How to reset your password",
          "d2": "Password rules: a password must be long",
          "d3": "How to change the Wi-Fi router password",
      }
      for doc_id, score in search("reset password", docs):
          print(doc_id, round(score, 4))
    solution: |
      import math

      STOP_WORDS = {"a", "an", "and", "be", "for", "how", "is", "of", "the", "to", "your"}

      def tokenize(text):
          cleaned = "".join(ch if ch.isalnum() else " " for ch in text.lower())
          return [w for w in cleaned.split() if w not in STOP_WORDS]

      def bm25_term(tf, df, N, dl, avgdl, k1=1.2, b=0.75):
          idf = math.log(1 + (N - df + 0.5) / (df + 0.5))
          norm = k1 * (1 - b + b * dl / avgdl)
          return idf * tf * (k1 + 1) / (tf + norm)

      def search(query, docs, k=3):
          docs_terms = {doc_id: tokenize(text) for doc_id, text in docs.items()}
          N = len(docs_terms)
          avgdl = sum(len(terms) for terms in docs_terms.values()) / N
          index = {}
          for doc_id, terms in docs_terms.items():
              for term in terms:
                  postings = index.setdefault(term, {})
                  postings[doc_id] = postings.get(doc_id, 0) + 1
          scores = {}
          for term in tokenize(query):
              postings = index.get(term)
              if not postings:
                  continue
              for doc_id, tf in postings.items():
                  dl = len(docs_terms[doc_id])
                  scores[doc_id] = scores.get(doc_id, 0.0) + bm25_term(tf, len(postings), N, dl, avgdl)
          ranked = sorted(scores.items(), key=lambda item: (-item[1], item[0]))
          return ranked[:k]

      docs = {
          "d1": "How to reset your password",
          "d2": "Password rules: a password must be long",
          "d3": "How to change the Wi-Fi router password",
      }
      for doc_id, score in search("reset password", docs):
          print(doc_id, round(score, 4))
    expectedOutput: |
      d1 1.4009
      d2 0.1715
      d3 0.1211
    tests:
      - name: ranks the lesson corpus correctly
        code: |
          import math
          result = search("reset password", docs)
          ids = [d for d, _ in result]
          assert ids == ["d1", "d2", "d3"], f"Expected the order ['d1', 'd2', 'd3'], got {ids}."
          assert math.isclose(result[0][1], 1.4009, abs_tol=1e-3), f"d1 should score about 1.4009 (the hand calculation), got {result[0][1]}."
      - name: works on a different corpus
        code: |
          faq = {
              "f1": "Refunds are issued within 14 days",
              "f2": "Error E1042 means the card was declined",
              "f3": "To get a refund, contact support with your order number",
              "f4": "Delivery takes 3 to 5 days",
          }
          result = search("refund error E1042", faq)
          ids = [d for d, _ in result]
          assert ids == ["f2", "f3"], f"'refund error E1042' should return f2 (two rare matching terms) then f3; got {ids}. Note f1 says 'Refunds', which does not match 'refund' without stemming."
      - name: respects k and skips unknown terms
        code: |
          faq = {"f1": "Delivery takes 3 to 5 days", "f2": "Refunds take 14 days", "f3": "Contact support"}
          result = search("days unicorn", faq, k=1)
          assert len(result) == 1, f"With k=1 return exactly one result, got {result}."
          assert search("unicorn", faq) == [], "A query whose terms are in no document should return []."
      - name: results are (doc_id, score) tuples, best first
        code: |
          result = search("password", docs)
          assert all(isinstance(r, tuple) and len(r) == 2 for r in result), f"Return a list of (doc_id, score) tuples, got {result}."
          scores = [s for _, s in result]
          assert scores == sorted(scores, reverse=True), f"Scores must be in descending order, got {scores}."
    hints:
      - Reuse your `build_index` logic on the tokenised documents, and compute `avgdl` as total terms / N.
      - "For each query term, `postings = index.get(term)`; the document frequency is `len(postings)`; loop over `postings.items()` to get each document's tf."
      - "Sort with `sorted(scores.items(), key=lambda item: (-item[1], item[0]))` for score-descending, then doc_id; slice `[:k]`."
    feedback:
      - when: { outputEquals: "" }
        message: search() returns an empty list. Build the index and add each matching term's bm25_term to the document's score.
      - when: { outputEquals: "d3 0.1211\nd2 0.1715\nd1 1.4009\n" }
        message: The results are in ascending order. Higher BM25 scores are better — sort descending.
      - when: { errorType: ZeroDivisionError }
        message: Something divides by zero — check avgdl (N must be the number of documents) and that you skip terms not in the index.
    explanation: >-
      This is a real (if small) search engine: analysis, an inverted index, BM25 scoring over postings
      only, and top-k ranking. The FAQ test also shows a classic keyword limitation — "Refunds" and
      "refund" are different terms without stemming.

  # ----- Mastery check (new items) -----
  - id: m-predict-saturation
    type: predict-output
    skill: prediction
    prompt: For a document of average length, what is BM25's tf component when the term occurs once, and when it occurs 4 times (k1 = 1.2)?
    code: |
      k1 = 1.2
      for tf in (1, 4):
          print(round(tf * (k1 + 1) / (tf + k1), 2))
    answer: |
      1.0
      1.69
    explanation: >-
      tf = 1 gives 2.2 / 2.2 = 1.0. tf = 4 gives 8.8 / 5.2 ≈ 1.69. Four times the occurrences earn only
      69% more credit — saturation.
    wrongAnswers:
      - answer: |
          1.0
          4.0
        feedback: That is linear term frequency, as in plain TF-IDF. BM25 saturates, approaching k1 + 1 = 2.2.
      - answer: |
          2.2
          8.8
        feedback: Those are only the numerators. Divide by tf + k1 (2.2 and 5.2).

  - id: m-k1-zero
    type: mcq
    skill: transfer
    difficulty: 2
    prompt: You set **k1 = 0** in BM25 (b unchanged). How does ranking behave?
    explanation: >-
      With k1 = 0 the tf component is tf · 1 / (tf + 0) = 1 whenever the term is present. Documents are
      scored only by which query terms they contain (weighted by IDF), not how often — and length
      normalisation has no effect either, since it only scales k1.
    options:
      - id: a
        text: Only whether each query term is present matters (weighted by IDF); how often it occurs no longer counts.
        correct: true
        feedback: Right — binary matching. Large k1 moves toward linear tf instead.
      - id: b
        text: Term frequency counts linearly, as in TF-IDF.
        feedback: That is the behaviour as k1 grows very large, not at 0.
      - id: c
        text: All documents get a score of 0.
        feedback: The tf component becomes 1, not 0, so the IDF weights still apply.
      - id: d
        text: Long documents are penalised more strongly.
        feedback: Length normalisation multiplies k1; with k1 = 0 it has no effect at all.

  - id: m-and-query
    type: code
    skill: implementation
    prompt: |
      Write `and_query(index, terms)` that returns a **sorted list** of the document IDs containing
      **every** term in `terms`, using the inverted index (`term -> {doc_id: count}`). Return `[]` if any
      term is missing from the index or if `terms` is empty.
    starterCode: |
      def and_query(index, terms):
          # Intersect the postings lists of all the terms.
          return []

      index = {
          "reset": {"d1": 1, "d4": 1},
          "password": {"d1": 1, "d2": 2, "d4": 3},
          "router": {"d3": 1, "d4": 1},
      }
      print(and_query(index, ["reset", "password"]))
    solution: |
      def and_query(index, terms):
          if not terms:
              return []
          matches = None
          for term in terms:
              docs = set(index.get(term, {}))
              matches = docs if matches is None else matches & docs
          return sorted(matches)

      index = {
          "reset": {"d1": 1, "d4": 1},
          "password": {"d1": 1, "d2": 2, "d4": 3},
          "router": {"d3": 1, "d4": 1},
      }
      print(and_query(index, ["reset", "password"]))
    expectedOutput: |
      ['d1', 'd4']
    tests:
      - name: two terms
        code: |
          assert and_query(index, ["reset", "password"]) == ["d1", "d4"], f"d1 and d4 contain both 'reset' and 'password'; got {and_query(index, ['reset', 'password'])}."
      - name: three terms and one term
        code: |
          assert and_query(index, ["reset", "password", "router"]) == ["d4"], f"Only d4 contains all three terms; got {and_query(index, ['reset', 'password', 'router'])}."
          assert and_query(index, ["password"]) == ["d1", "d2", "d4"], f"A single term returns its whole postings list, sorted; got {and_query(index, ['password'])}."
      - name: missing terms and empty queries
        code: |
          assert and_query(index, ["reset", "unicorn"]) == [], "If any term is in no document, no document can contain all terms: return []."
          assert and_query(index, []) == [], "An empty query should return []."
      - name: works with another index
        code: |
          other = {"x": {"a": 1, "b": 1, "c": 1}, "y": {"b": 2, "c": 1}, "z": {"c": 5}}
          assert and_query(other, ["y", "x"]) == ["b", "c"], f"Expected ['b', 'c'], got {and_query(other, ['y', 'x'])}."
    hints:
      - "`set(index.get(term, {}))` gives the set of documents for a term (empty if the term is unknown)."
      - Start from the first term's set and intersect with `&` for each remaining term.
      - Handle the empty-query case first; return `sorted(...)` at the end.
    feedback:
      - when: { outputEquals: "['d1', 'd2', 'd4']\n" }
        message: That is the union (documents with ANY term). An AND query needs the intersection (&).
      - when: { errorType: KeyError }
        message: index[term] fails for unknown terms. Use index.get(term, {}).
    explanation: >-
      An AND query intersects postings lists. Engines intersect starting from the shortest list (the
      rarest term) because the result can never be larger than it.

  - id: m-tf-obsolete
    type: true-false
    skill: recognition
    prompt: "True or false: now that embedding models exist, BM25 keyword search is obsolete for RAG retrieval."
    answer: false
    explanation: >-
      BM25 remains a strong, cheap and explainable baseline, is better for exact identifiers, and was
      robust out of domain on benchmarks such as BEIR. Many production systems combine it with vector
      search (hybrid search) rather than replacing it.

  - id: m-explain-bm25
    type: explain
    skill: explanation
    prompt: >-
      Explain to a teammate, without the formula, why BM25 ranks "How to reset your password" above
      "Password rules: a password must be long" for the query "reset password", even though the second
      document says "password" twice.
    explanation: Compare your answer with the model answer and tick each rubric point you covered.
    rubric:
      - Explains that "reset" is rare in the collection, so it has a much higher IDF weight than "password", which appears in every document.
      - Explains saturation — the second occurrence of "password" adds much less than the first.
      - Mentions length normalisation — the second document is longer than average, so its matches count for less.
      - Concludes that matching the rare term outweighs repeating the common one.
    modelAnswer: |
      BM25 cares most about rare words. "password" appears in every document, so matching it says little
      and earns a small weight, while "reset" appears in only one document and earns a large weight. The
      first document is the only one matching "reset", so it gets a big boost. The second document does
      say "password" twice, but BM25 saturates term frequency — the second occurrence adds much less than
      the first — and it is also longer than average, which reduces its credit. So one rare match beats
      two common ones.

