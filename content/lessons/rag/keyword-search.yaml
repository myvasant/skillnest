cheatsheet: |
  ```python
  def tokenize(text):                                   # same for docs AND queries
      cleaned = "".join(c if c.isalnum() else " " for c in text.lower())
      return [w for w in cleaned.split() if w not in STOP_WORDS]

  index.setdefault(term, {})[doc_id] = index[term].get(doc_id, 0) + 1   # term -> {doc: tf}

  idf_tfidf = math.log(N / df)                          # 0 for a term in every doc
  idf_bm25  = math.log(1 + (N - df + 0.5) / (df + 0.5)) # Lucene-style, always > 0
  norm = k1 * (1 - b + b * dl / avgdl)                  # k1≈1.2, b≈0.75
  score += idf_bm25 * tf * (k1 + 1) / (tf + norm)
  ```
  - OR query = union of postings; AND query = intersection.
  - k1 → saturation (0 = presence only); b → length normalisation (0 = ignore length).
  - Great for codes, names, jargon; blind to synonyms → combine with vectors (hybrid search).
