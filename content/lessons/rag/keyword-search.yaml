id: rag.keyword-search
concept: rag.keyword-search
title: Keyword Search — Inverted Indexes, TF-IDF and BM25
subtitle: The fast, explainable baseline every retriever must beat
estimatedMinutes: 55
reviewedOn: 2026-10-22
summary: >-
  Classic search finds documents that share words with the query and ranks them by how often and how
  rare those words are. You will tokenise and normalise text, build an inverted index, score with TF-IDF,
  implement BM25 from scratch (checking it by hand on three documents), and see where keyword search
  shines (codes, names) and where it fails (synonyms).
objectives:
  - Tokenise and normalise text consistently for documents and queries, and explain the trade-offs of stop words and stemming.
  - Build an inverted index and use its postings lists to find candidate documents without scanning everything.
  - Compute TF-IDF and BM25 scores, explaining the roles of IDF, k1 (saturation) and b (length normalisation).
  - Implement a small BM25 search engine that returns the top-k documents for a query.
  - Predict when keyword search beats semantic search (exact identifiers) and when it fails (vocabulary mismatch).
sources:
  - title: "The Probabilistic Relevance Framework: BM25 and Beyond (Robertson and Zaragoza, 2009)"
    url: https://www.staff.city.ac.uk/~sbrp622/papers/foundations_bm25_review.pdf
    publisher: Foundations and Trends in Information Retrieval (author copy)
  - title: Similarity settings (BM25 parameters)
    url: https://www.elastic.co/docs/reference/elasticsearch/index-settings/similarity
    publisher: Elastic
  - title: SQLite FTS5 extension (includes the bm25() ranking function)
    url: https://www.sqlite.org/fts5.html
    publisher: SQLite
  - title: "BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models"
    url: https://arxiv.org/abs/2104.08663
    publisher: arXiv (Thakur et al.)
sections:
  - id: why
    title: Why "does the text contain the query?" is not search
    kind: why
    blocks:
      - type: markdown
        body: |
          [RAG](concept:rag.why-rag) answers are only as good as the passages retrieved for them. The most
          naive retriever checks every document for the query string:
      - type: code
        runnable: true
        code: |
          docs = ["Error E1042: payment declined", "Category list for the catalogue", "How to reset a password"]
          print([d for d in docs if "cat" in d.lower()])
          print([d for d in docs if "reset password" in d.lower()])
        expectedOutput: |
          ['Category list for the catalogue']
          []
        caption: '"cat" matches inside "Category"; "reset password" misses "reset a password". And every query reads every document.'
      - type: markdown
        body: |
          Substring matching has three problems: it matches **inside** unrelated words, it misses
          documents that contain the words in a different order or with other words between them, and it
          gives **no ranking** — every match counts the same. It also reads every document on every
          query.

          Real keyword search fixes all three: it splits text into **terms**, keeps an **index** from each
          term to the documents that contain it, and **scores** documents by how well their terms match.
          This is how Elasticsearch, OpenSearch and SQLite's full-text search work, and it is still the
          baseline every RAG retriever should beat.

  - id: analysis
    title: Tokenising and normalising text
    kind: concept
    blocks:
      - type: markdown
        body: |
          **Text analysis** turns raw text into the terms that will be matched. A minimal analyser:

          1. **lowercase** everything, so "Password" matches "password";
          2. **split** on anything that is not a letter or digit;
          3. drop **[stop words](glossary:stop-words)** — very common words such as "the" and "to" that
             appear everywhere and carry little meaning for matching.
      - type: code
        runnable: true
        id: tokenize
        code: |
          STOP_WORDS = {"a", "an", "and", "be", "for", "how", "is", "of", "the", "to", "your"}

          def tokenize(text):
              cleaned = "".join(ch if ch.isalnum() else " " for ch in text.lower())
              return [word for word in cleaned.split() if word not in STOP_WORDS]

          print(tokenize("How to reset your Password?"))
          print(tokenize("Error E-1042: payment DECLINED."))
          print(tokenize("Wi-Fi router's password"))
        expectedOutput: |
          ['reset', 'password']
          ['error', 'e', '1042', 'payment', 'declined']
          ['wi', 'fi', 'router', 's', 'password']
        annotations:
          - line: 4
            text: Every character that is not a letter or digit becomes a space, so punctuation separates terms.
          - line: 9
            text: '"E-1042" becomes two terms, "e" and "1042". Whether that is right depends on your data — product codes often need a custom rule.'
      - type: markdown
        body: |
          **Stemming** goes further and reduces words to a common stem so that "passwords" matches
          "password". Real stemmers (such as the Porter stemmer) use dozens of rules; even a one-rule toy
          shows the trade-off:
      - type: code
        runnable: true
        code: |
          def stem(word):  # a toy: strip one trailing "s"
              if len(word) > 3 and word.endswith("s"):
                  return word[:-1]
              return word

          for word in ["passwords", "routers", "news", "status", "glass"]:
              print(word, "->", stem(word))
        expectedOutput: |
          passwords -> password
          routers -> router
          news -> new
          status -> statu
          glass -> glas
        caption: Helpful for plurals, harmful for "news" (now matches "new"). Every analysis step trades recall (finding more) against precision (finding the right things).
      - type: callout
        variant: warning
        title: Analyse queries and documents the same way
        body: |
          If documents are lowercased and stemmed but the query is not, "Passwords" will never match
          anything. Use **one** analyser function for both, and re-index if you change it.

  - id: inverted-index
    title: The inverted index
    kind: walkthrough
    blocks:
      - type: markdown
        body: |
          An **[inverted index](glossary:inverted-index)** maps each term to its
          **[postings list](glossary:postings-list)**: the documents that contain the term (here with how
          many times). It is "inverted" because a document maps to words, while the index maps words to
          documents — like the index at the back of a book.

          Here is the corpus we will use for the rest of the lesson:
      - type: code
        runnable: true
        id: build-index
        code: |
          STOP_WORDS = {"a", "an", "and", "be", "for", "how", "is", "of", "the", "to", "your"}

          def tokenize(text):
              cleaned = "".join(ch if ch.isalnum() else " " for ch in text.lower())
              return [word for word in cleaned.split() if word not in STOP_WORDS]

          docs = {
              "d1": "How to reset your password",
              "d2": "Password rules: a password must be long",
              "d3": "How to change the Wi-Fi router password",
          }
          docs_terms = {doc_id: tokenize(text) for doc_id, text in docs.items()}
          for doc_id, terms in docs_terms.items():
              print(doc_id, terms)

          index = {}
          for doc_id, terms in docs_terms.items():
              for term in terms:
                  postings = index.setdefault(term, {})
                  postings[doc_id] = postings.get(doc_id, 0) + 1

          for term in sorted(index):
              print(f"{term:9} -> {index[term]}")
        expectedOutput: |
          d1 ['reset', 'password']
          d2 ['password', 'rules', 'password', 'must', 'long']
          d3 ['change', 'wi', 'fi', 'router', 'password']
          change    -> {'d3': 1}
          fi        -> {'d3': 1}
          long      -> {'d2': 1}
          must      -> {'d2': 1}
          password  -> {'d1': 1, 'd2': 2, 'd3': 1}
          reset     -> {'d1': 1}
          router    -> {'d3': 1}
          rules     -> {'d2': 1}
          wi        -> {'d3': 1}
        annotations:
          - line: 19
            text: "`setdefault` returns the term's postings dict, creating an empty one the first time the term is seen."
          - line: 20
            text: Count how often the term occurs in this document — its term frequency (tf).
      - type: visualization
        component: python-tracer
        title: Watch postings lists form
        caption: Two tiny documents. Each term gets an entry the first time it is seen; later occurrences update the count.
        props:
          code: |
            docs = {"a": "red apple", "b": "red red wine"}
            index = {}
            for doc_id, text in docs.items():
                for term in text.split():
                    postings = index.setdefault(term, {})
                    postings[doc_id] = postings.get(doc_id, 0) + 1
            print(index)
      - type: markdown
        body: |
          To answer a query, look up only the query's terms. Their postings lists name every
          **candidate** document; documents sharing no term are never touched. With millions of
          documents that is the difference between milliseconds and minutes. (Production indexes also
          store each term's **positions** in the document, which enables phrase queries such as
          `"reset password"`.)
      - type: code
        runnable: true
        code: |
          index = {
              "password": {"d1": 1, "d2": 2, "d3": 1},
              "reset": {"d1": 1},
              "router": {"d3": 1},
          }
          query_terms = ["reset", "password"]
          candidates = set()
          for term in query_terms:
              candidates |= set(index.get(term, {}))
          print(sorted(candidates))
        expectedOutput: |
          ['d1', 'd2', 'd3']
        caption: An OR query takes the union of postings lists. Every document mentions "password", so all three are candidates — now we need to rank them.
      - type: item
        ref: predict-postings

  - id: tf-idf
    title: "Ranking, step 1: TF-IDF"
    kind: concept
    blocks:
      - type: markdown
        body: |
          Two intuitions drive keyword ranking:

          - **Term frequency (tf):** a document that mentions a query term more often is more likely to
            be about it.
          - **Inverse document frequency (idf):** a term that appears in *few* documents is more
            informative than one that appears everywhere. "reset" narrows things down; "password" does
            not in this corpus.

          **[TF-IDF](glossary:tf-idf)** multiplies them. A common form is
          *idf(t) = ln(N / df(t))*, where *N* is the number of documents and *df(t)* the number containing
          *t*, and a document's score is the [sum](concept:math.summation-notation) over query terms:

          *score(d, q) = Σ_{t ∈ q} tf(t, d) · idf(t)*
      - type: code
        runnable: true
        code: |
          import math

          index = {
              "password": {"d1": 1, "d2": 2, "d3": 1},
              "reset": {"d1": 1},
              "router": {"d3": 1},
          }
          N = 3

          def idf(term):
              return math.log(N / len(index[term]))

          for term in ["reset", "password", "router"]:
              print(f"idf({term}) = ln({N}/{len(index[term])}) = {idf(term):.4f}")

          query = ["reset", "password"]
          for doc_id in ["d1", "d2", "d3"]:
              score = sum(index[t].get(doc_id, 0) * idf(t) for t in query if t in index)
              print(doc_id, round(score, 4))
        expectedOutput: |
          idf(reset) = ln(3/1) = 1.0986
          idf(password) = ln(3/3) = 0.0000
          idf(router) = ln(3/1) = 1.0986
          d1 1.0986
          d2 0.0
          d3 0.0
        caption: '"password" is in every document, so its idf is ln(1) = 0 and it contributes nothing. Only the rare term "reset" separates the documents.'
      - type: markdown
        body: |
          TF-IDF works, but it has two weaknesses. Term frequency counts **linearly** — a document that
          repeats "password" 20 times scores 20 times higher than one that says it once, which rewards
          keyword stuffing. And **long documents** naturally contain more occurrences of everything.
          BM25 fixes both.
      - type: item
        ref: predict-idf-zero

  - id: bm25
    title: "Ranking, step 2: BM25"
    kind: concept
    blocks:
      - type: markdown
        body: |
          **[BM25](glossary:bm25)** comes from the probabilistic relevance framework developed by
          Robertson, Spärck Jones and others; Robertson and Zaragoza's review
          ([2009](https://www.staff.city.ac.uk/~sbrp622/papers/foundations_bm25_review.pdf)) is the
          standard reference. Per query term it multiplies an IDF weight by a **saturating**,
          **length-normalised** term-frequency component:

          *score(d, q) = Σ_{t ∈ q} IDF(t) · tf · (k₁ + 1) / (tf + k₁ · (1 − b + b · dl / avgdl))*

          | Symbol | Meaning |
          |---|---|
          | *tf* | how often term *t* occurs in document *d* |
          | *dl*, *avgdl* | length of *d* in terms, and the average length over the collection |
          | **k₁** | **saturation**: how quickly extra occurrences stop helping. k₁ = 0 ignores tf (present or not); large k₁ makes tf nearly linear. Common default 1.2. |
          | **b** | **length normalisation**, from 0 to 1: how much long documents are penalised. b = 0 ignores length; b = 1 fully normalises. Common default 0.75. |

          For the IDF part, the classic weight without relevance information is
          *ln((N − df + 0.5) / (df + 0.5))*. It turns **negative** for terms in more than half the
          documents, so Lucene-based engines (Elasticsearch, OpenSearch) use
          *ln(1 + (N − df + 0.5) / (df + 0.5))*, which is always positive. We use that variant.
          Implementations differ in such small details — for example, some drop the constant (k₁ + 1)
          factor, which does not change the ranking — so scores from different engines are not directly
          comparable.

          Elasticsearch documents its defaults as k₁ = 1.2 and b = 0.75
          ([similarity settings](https://www.elastic.co/docs/reference/elasticsearch/index-settings/similarity)),
          and SQLite's FTS5 hard-codes the same values.
      - type: code
        runnable: true
        id: bm25
        code: |
          import math
          from collections import Counter

          def bm25_scores(query_terms, docs_terms, k1=1.2, b=0.75):
              N = len(docs_terms)
              avgdl = sum(len(terms) for terms in docs_terms.values()) / N
              df = Counter()
              for terms in docs_terms.values():
                  df.update(set(terms))              # each document counts once per term
              scores = {}
              for doc_id, terms in docs_terms.items():
                  tf = Counter(terms)
                  norm = k1 * (1 - b + b * len(terms) / avgdl)
                  score = 0.0
                  for q in query_terms:
                      if tf[q] == 0:
                          continue
                      idf = math.log(1 + (N - df[q] + 0.5) / (df[q] + 0.5))
                      score += idf * tf[q] * (k1 + 1) / (tf[q] + norm)
                  scores[doc_id] = score
              return scores

          docs_terms = {
              "d1": ["reset", "password"],
              "d2": ["password", "rules", "password", "must", "long"],
              "d3": ["change", "wi", "fi", "router", "password"],
          }
          scores = bm25_scores(["reset", "password"], docs_terms)
          for doc_id in sorted(scores, key=scores.get, reverse=True):
              print(doc_id, round(scores[doc_id], 4))
        expectedOutput: |
          d1 1.4009
          d2 0.1715
          d3 0.1211
        annotations:
          - line: 9
            text: "`set(terms)` so a term repeated in one document only adds 1 to its document frequency."
          - line: 13
            text: "The length-normalised k1 term: equals k1 exactly when the document has average length."
          - line: 19
            text: The BM25 term weight. Its tf part can never exceed k1 + 1, however often the term repeats.
      - type: markdown
        body: |
          **Check it by hand.** The token lists have lengths 2, 5 and 5, so *avgdl* = 12 / 3 = **4**,
          and *N* = 3.

          | Quantity | Calculation | Value |
          |---|---|---|
          | IDF(reset), df = 1 | ln(1 + (3 − 1 + 0.5) / (1 + 0.5)) = ln(2.6667) | **0.9808** |
          | IDF(password), df = 3 | ln(1 + (3 − 3 + 0.5) / (3 + 0.5)) = ln(1.1429) | **0.1335** |
          | norm(d1), dl = 2 | 1.2 × (1 − 0.75 + 0.75 × 2/4) = 1.2 × 0.625 | **0.75** |
          | norm(d2) = norm(d3), dl = 5 | 1.2 × (0.25 + 0.75 × 5/4) = 1.2 × 1.1875 | **1.425** |
          | score(d1) | 0.9808 × (1 × 2.2)/(1 + 0.75) + 0.1335 × (1 × 2.2)/(1 + 0.75) = 1.2330 + 0.1679 | **1.4009** |
          | score(d2) | 0.1335 × (2 × 2.2)/(2 + 1.425) = 0.1335 × 1.2847 | **0.1715** |
          | score(d3) | 0.1335 × (1 × 2.2)/(1 + 1.425) = 0.1335 × 0.9072 | **0.1211** |

          The rare term "reset" decides the ranking. d2 beats d3 because it says "password" twice — but
          only by about 40%, not 100%, because of saturation.

          **Saturation (k₁).** Compare the tf part of TF-IDF (linear) and BM25 for a document of average
          length (where the tf part is tf · 2.2 / (tf + 1.2)):
      - type: code
        runnable: true
        code: |
          k1 = 1.2
          print("tf  tf-idf  bm25")
          for tf in (1, 2, 3, 5, 10, 20):
              print(f"{tf:<4}{tf:<8}{tf * (k1 + 1) / (tf + k1):.2f}")
        expectedOutput: |
          tf  tf-idf  bm25
          1   1       1.00
          2   2       1.38
          3   3       1.57
          5   5       1.77
          10  10      1.96
          20  20      2.08
        caption: BM25's tf part approaches k1 + 1 = 2.2 and never exceeds it — repeating a word 20 times barely helps more than repeating it 5 times.
      - type: markdown
        body: |
          **Length normalisation (b).** The tf part for a single occurrence (tf = 1) in documents of
          different lengths, when the average length is 4:
      - type: code
        runnable: true
        code: |
          avgdl = 4
          print("dl:     " + "  ".join(f"{dl:4}" for dl in (2, 4, 8, 16)))
          for b in (0.0, 0.75, 1.0):
              row = []
              for dl in (2, 4, 8, 16):
                  norm = 1.2 * (1 - b + b * dl / avgdl)
                  row.append(f"{1 * 2.2 / (1 + norm):4.2f}")
              print(f"b={b:<4}: " + "  ".join(row))
        expectedOutput: |
          dl:        2     4     8    16
          b=0.0 : 1.00  1.00  1.00  1.00
          b=0.75: 1.26  1.00  0.71  0.45
          b=1.0 : 1.38  1.00  0.65  0.38
        caption: With b = 0 a mention in a 16-term document counts as much as in a 2-term one. With b = 0.75 the long document's mention is worth less — it is more likely to be incidental.
      - type: item
        ref: mcq-k1-b

  - id: strengths-weaknesses
    title: Where keyword search wins and where it fails
    kind: concept
    blocks:
      - type: markdown
        body: |
          **Strengths.** Keyword search finds **exact identifiers** — error codes (`E1042`), product
          names, people's names, clause numbers, function names — that embedding models tend to blur. It
          needs no model, indexes quickly, runs cheaply on a CPU, and is **explainable**: you can show
          exactly which terms matched and why a document ranked first. On the BEIR benchmark, BM25 was a
          robust baseline that many neural retrievers did not beat on out-of-domain data
          ([Thakur et al., 2021](https://arxiv.org/abs/2104.08663)).

          **Weakness: vocabulary mismatch.** If the user's words differ from the document's words, the
          score is zero, no matter how related the meaning:
      - type: code
        runnable: true
        code: |
          import math
          from collections import Counter

          def bm25_scores(query_terms, docs_terms, k1=1.2, b=0.75):
              N = len(docs_terms)
              avgdl = sum(len(t) for t in docs_terms.values()) / N
              df = Counter()
              for terms in docs_terms.values():
                  df.update(set(terms))
              scores = {}
              for doc_id, terms in docs_terms.items():
                  tf = Counter(terms)
                  norm = k1 * (1 - b + b * len(terms) / avgdl)
                  scores[doc_id] = sum(
                      math.log(1 + (N - df[q] + 0.5) / (df[q] + 0.5)) * tf[q] * (k1 + 1) / (tf[q] + norm)
                      for q in query_terms if tf[q]
                  )
              return scores

          docs_terms = {
              "d1": ["reset", "password"],
              "d2": ["password", "rules", "password", "must", "long"],
              "d3": ["change", "wi", "fi", "router", "password"],
          }
          print(bm25_scores(["forgot", "login"], docs_terms))
        expectedOutput: |
          {'d1': 0, 'd2': 0, 'd3': 0}
        caption: '"forgot login" means the same as "reset password" to a person, but shares no term with any document.'
      - type: markdown
        body: |
          Fixes within keyword search include stemming, synonym lists and query expansion, but they are
          manual and brittle. **Embeddings** handle paraphrases by comparing meaning instead of words —
          see [vector similarity search](concept:rag.vector-similarity) — and they fail in *other* ways.
          That is why production systems often combine both in [hybrid search](concept:rag.hybrid-search).
      - type: item
        ref: mcq-keyword-vs-semantic

  - id: in-practice
    title: Keyword search in real systems
    kind: application
    blocks:
      - type: markdown
        body: |
          You rarely write BM25 yourself in production — search engines and databases provide it. SQLite
          ships a full-text search extension, FTS5, with a built-in `bm25()` ranking function, and
          Python's `sqlite3` module can use it (it works in this browser runtime too). FTS5's
          documentation states that better matches get numerically **lower** values (it multiplies the
          score by −1), so you sort ascending, and that whitespace-separated query terms are combined
          with an implicit AND.
      - type: code
        runnable: true
        code: |
          import sqlite3

          con = sqlite3.connect(":memory:")
          con.execute("CREATE VIRTUAL TABLE docs USING fts5(body)")
          con.executemany("INSERT INTO docs(body) VALUES (?)", [
              ("How to reset your password",),
              ("Password rules: a password must be long",),
              ("How to change the Wi-Fi router password",),
          ])

          query = "SELECT rowid, round(bm25(docs), 4) FROM docs WHERE docs MATCH ? ORDER BY bm25(docs)"
          print("reset password    ", con.execute(query, ("reset password",)).fetchall())
          print("reset OR password ", con.execute(query, ("reset OR password",)).fetchall())
        expectedOutput: |
          reset password     [(1, -0.569)]
          reset OR password  [(1, -0.569), (2, -0.0), (3, -0.0)]
        annotations:
          - line: 11
            text: The query text is passed as a parameter (?), never pasted into the SQL string.
          - line: 12
            text: Implicit AND — only row 1 contains both terms.
          - line: 13
            text: With OR, rows 2 and 3 match "password" only. That term is in every row, so it adds essentially nothing (shown as -0.0).
        caption: >-
          Lower is better in FTS5, so the best match comes first with ORDER BY bm25(docs). The numbers
          differ from our toy because FTS5 has its own tokeniser (no stop words) and IDF details — scores
          are only comparable within one engine.
      - type: markdown
        body: |
          Engines such as Elasticsearch and OpenSearch add configurable analysers (language-specific
          stemming, synonyms), field boosts, phrase and fuzzy queries, and distributed indexes. The
          concepts — analysis, postings, IDF, saturation, length normalisation — are the ones you just
          built.

  - id: mistakes
    title: Common mistakes and how to debug them
    kind: mistakes
    blocks:
      - type: markdown
        body: |
          | Symptom | Likely cause | Fix |
          |---|---|---|
          | A query with capitals or plurals finds nothing | Query analysed differently from documents | Run the same `tokenize` (and stemmer) on both. |
          | `ZeroDivisionError` in TF-IDF | Computing ln(N / df) for a query term no document contains (df = 0) | Skip query terms that are not in the index. |
          | Common words dominate the ranking | IDF missing, or stop words kept with plain tf | Multiply by IDF; consider stop words. |
          | Long documents always win | No length normalisation | Use BM25 with b around 0.75. |
          | The worst results come first | Sorted ascending — or an engine like FTS5 where lower is better was sorted descending | Check the score direction of your engine and sort accordingly. |
          | Product code `E-1042` never matches `E1042` | The tokeniser splits on `-` | Add a custom rule or a normalisation step for identifiers. |
      - type: code
        runnable: true
        code: |
          import math

          index = {"password": {"d1": 1, "d2": 2}, "reset": {"d1": 1}}
          N = 2
          query = ["reset", "username"]
          for term in query:
              df = len(index.get(term, {}))
              print(term, math.log(N / df))
        expectError: ZeroDivisionError
        caption: '"username" is in no document, so df = 0 and N / df divides by zero. Guard with `if term in index`.'

