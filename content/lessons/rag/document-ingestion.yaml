id: rag.document-ingestion
concept: rag.document-ingestion
title: Document ingestion and parsing
subtitle: Extract clean text and metadata from PDFs, HTML, Markdown and office files; parsing quality caps everything
  downstream
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Extract clean text and metadata from PDFs, HTML, Markdown and office files; parsing quality caps everything
  downstream.
objectives:
- Explain the role of document ingestion and parsing in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Docling documentation
  url: https://docling-project.github.io/docling/
  publisher: Docling Project
- title: Unstructured open source overview
  url: https://docs.unstructured.io/open-source/introduction/overview
  publisher: Unstructured
- title: pypdf documentation
  url: https://pypdf.readthedocs.io/en/stable/
  publisher: pypdf
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Extract clean text and metadata from PDFs, HTML, Markdown and office files; parsing quality caps everything
      downstream. Real documents are PDFs with columns, tables, headers and scanned pages. If extraction scrambles
      reading order or drops a table, no retriever or model downstream can recover the lost information.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Ingestion = load, extract text and structure, clean, attach metadata (source, title, section, page,
      date, permissions), then hand off to chunking.

      - PDFs store positioned glyphs, not paragraphs; layout-aware parsers (such as Docling or Unstructured) recover
      reading order, headings and tables, while simple extractors like pypdf only pull out the text streams.

      - Scanned pages need OCR; tables are usually best converted to Markdown or HTML so row and column relationships
      survive chunking.

      - Give every document a stable ID and a content hash so re-ingestion can detect changes and skip unchanged
      files.

      - Inspect parsed output for a sample of every document type before building anything on top of it.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- ''The PDF opens fine, so the text is fine'' is false: extracted text often has broken words, merged
      columns, repeated headers and footers, or missing tables.

      - Metadata is not decoration; it is what later makes filtering, citations and access control possible.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def normalise_document(document):\n    required=(\"id\",\"text\",\"source\")\n    if any(not document.get(k)\
      \ for k in required): raise ValueError(\"document missing required field\")\n    return {\"id\":str(document[\"\
      id\"]),\"text\": \" \".join(document[\"text\"].split()), \"source\":document[\"source\"]}\n\nprint(normalise_document({\"\
      id\":1,\"text\":\"  hello   world \",\"source\":\"guide.md\"}))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: document-ingestion-code
  - type: item
    ref: document-ingestion-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Ingestion = load, extract text and structure, clean, attach metadata (source, title, section, page, date,
      permissions), then hand off to chunking.

      - PDFs store positioned glyphs, not paragraphs; layout-aware parsers (such as Docling or Unstructured) recover
      reading order, headings and tables, while simple extractors like pypdf only pull out the text streams.

      - Scanned pages need OCR; tables are usually best converted to Markdown or HTML so row and column relationships
      survive chunking.

      - Give every document a stable ID and a content hash so re-ingestion can detect changes and skip unchanged
      files.

      - Inspect parsed output for a sample of every document type before building anything on top of it.


      **Limitations**

      - ''The PDF opens fine, so the text is fine'' is false: extracted text often has broken words, merged columns,
      repeated headers and footers, or missing tables.

      - Metadata is not decoration; it is what later makes filtering, citations and access control possible.'
  - type: item
    ref: document-ingestion-mcq
  - type: item
    ref: document-ingestion-tf
  - type: item
    ref: document-ingestion-code
items:
- id: document-ingestion-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of document ingestion and parsing?
  explanation: Ingestion = load, extract text and structure, clean, attach metadata (source, title, section, page,
    date, permissions), then hand off to chunking.
  options:
  - id: a
    text: Ingestion = load, extract text and structure, clean, attach metadata (source, title, section, page, date,
      permissions), then hand off to chunking.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: '''The PDF opens fine, so the text is fine'' is false: extracted text often has broken words, merged columns,
      repeated headers and footers, or missing tables.'
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: document-ingestion-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: '''The PDF opens fine, so the text is fine'' is false: extracted text often has broken words, merged columns,
    repeated headers and footers, or missing tables.'
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: document-ingestion-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding document ingestion and parsing to an application. Describe the design, one failure mode,
    and how you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: document-ingestion-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for document ingestion and parsing. The assertions include the normal
    path and a meaningful edge case.
  starterCode: "def normalise_document(document):\n    raise NotImplementedError('Complete this function')"
  solution: "def normalise_document(document):\n    required=(\"id\",\"text\",\"source\")\n    if any(not document.get(k)\
    \ for k in required): raise ValueError(\"document missing required field\")\n    return {\"id\":str(document[\"\
    id\"]),\"text\": \" \".join(document[\"text\"].split()), \"source\":document[\"source\"]}"
  tests:
  - name: Core behaviour
    code: assert normalise_document({"id":1,"text":" hello  world ","source":"a"})["text"] == "hello world"
  - name: Edge case
    code: 'try: normalise_document({"id":1,"text":"x"})

      except ValueError: pass

      else: raise AssertionError("missing source must fail")'
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - document-ingestion-mcq
  - document-ingestion-tf
  - document-ingestion-code
