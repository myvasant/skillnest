id: rag.embeddings
concept: rag.embeddings
title: Text embeddings and embedding models
subtitle: Embedding models map text to vectors so that similar meanings are close; model choice, dimensions, normalisation
  and language support matter
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Embedding models map text to vectors so that similar meanings are close; model choice, dimensions, normalisation
  and language support matter.
objectives:
- Explain the role of text embeddings and embedding models in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Sentence Transformers documentation
  url: https://sbert.net/
  publisher: Sentence Transformers (Hugging Face)
- title: 'Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks'
  url: https://arxiv.org/abs/1908.10084
  publisher: arXiv
- title: 'MTEB: Massive Text Embedding Benchmark'
  url: https://arxiv.org/abs/2210.07316
  publisher: arXiv
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Embedding models map text to vectors so that similar meanings are close; model choice, dimensions, normalisation
      and language support matter. To find passages that mean the same as a question even when they share no words,
      you need a numeric representation of meaning. Embedding models provide it, and their choice largely sets the
      ceiling of dense retrieval quality.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- An embedding model (usually a bi-encoder trained with contrastive learning) maps text to a fixed-length
      vector, typically hundreds to a few thousand dimensions; similar meanings point in similar directions.

      - Queries and documents must be embedded with the same model, version and settings; some models expect different
      prefixes or instructions for queries and passages.

      - Every model has a maximum input length in tokens; match your chunk size to it.

      - Normalising vectors to unit length makes dot product equal to cosine similarity; Matryoshka-trained models
      let you truncate dimensions to save space with modest quality loss.

      - Benchmark candidate models on your own queries; public leaderboards such as MTEB are only a starting point,
      and language and domain coverage matter.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- Vectors from different models (or model versions) are not comparable; switching models means re-embedding
      the whole corpus.

      - A larger or top-of-leaderboard model is not automatically better for your domain, and it costs more to store
      and search.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "import math\ndef cosine(a,b):\n    if len(a)!=len(b) or not a: raise ValueError(\"dimension mismatch\"\
      )\n    na=math.sqrt(sum(x*x for x in a));nb=math.sqrt(sum(x*x for x in b))\n    if not na or not nb: raise\
      \ ValueError(\"zero vector\")\n    return sum(x*y for x,y in zip(a,b))/(na*nb)\n\nprint(round(cosine([1,0],[0.8,0.2]),3))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: embeddings-code
  - type: item
    ref: embeddings-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - An embedding model (usually a bi-encoder trained with contrastive learning) maps text to a fixed-length
      vector, typically hundreds to a few thousand dimensions; similar meanings point in similar directions.

      - Queries and documents must be embedded with the same model, version and settings; some models expect different
      prefixes or instructions for queries and passages.

      - Every model has a maximum input length in tokens; match your chunk size to it.

      - Normalising vectors to unit length makes dot product equal to cosine similarity; Matryoshka-trained models
      let you truncate dimensions to save space with modest quality loss.

      - Benchmark candidate models on your own queries; public leaderboards such as MTEB are only a starting point,
      and language and domain coverage matter.


      **Limitations**

      - Vectors from different models (or model versions) are not comparable; switching models means re-embedding
      the whole corpus.

      - A larger or top-of-leaderboard model is not automatically better for your domain, and it costs more to store
      and search.'
  - type: item
    ref: embeddings-mcq
  - type: item
    ref: embeddings-tf
  - type: item
    ref: embeddings-code
items:
- id: embeddings-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of text embeddings and embedding models?
  explanation: An embedding model (usually a bi-encoder trained with contrastive learning) maps text to a fixed-length
    vector, typically hundreds to a few thousand dimensions; similar meanings point in similar directions.
  options:
  - id: a
    text: An embedding model (usually a bi-encoder trained with contrastive learning) maps text to a fixed-length
      vector, typically hundreds to a few thousand dimensions; similar meanings point in similar directions.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: Vectors from different models (or model versions) are not comparable; switching models means re-embedding
      the whole corpus.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: embeddings-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Vectors from different models (or model versions) are not comparable; switching models means re-embedding
    the whole corpus.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: embeddings-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding text embeddings and embedding models to an application. Describe the design, one failure
    mode, and how you would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: embeddings-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for text embeddings and embedding models. The assertions include the
    normal path and a meaningful edge case.
  starterCode: "import math\n\ndef cosine(a, b):\n    raise NotImplementedError('Complete this function')"
  solution: "import math\ndef cosine(a,b):\n    if len(a)!=len(b) or not a: raise ValueError(\"dimension mismatch\"\
    )\n    na=math.sqrt(sum(x*x for x in a));nb=math.sqrt(sum(x*x for x in b))\n    if not na or not nb: raise ValueError(\"\
    zero vector\")\n    return sum(x*y for x,y in zip(a,b))/(na*nb)"
  tests:
  - name: Core behaviour
    code: assert cosine([1,0],[1,0]) == 1
  - name: Edge case
    code: assert cosine([1,0],[0,1]) == 0
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
masteryCheck:
  passThreshold: 0.8
  items:
  - embeddings-mcq
  - embeddings-tf
  - embeddings-code
