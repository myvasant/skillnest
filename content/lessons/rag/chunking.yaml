id: rag.chunking
concept: rag.chunking
title: Chunking strategies
subtitle: Split documents into retrievable pieces — fixed-size, structure-aware or semantic, with overlap — balancing
  precision against lost context
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Split documents into retrievable pieces — fixed-size, structure-aware or semantic, with overlap — balancing
  precision against lost context.
objectives:
- Explain the role of chunking strategies in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Text splitters
  url: https://docs.langchain.com/oss/python/integrations/splitters
  publisher: LangChain
- title: Node parsers / text splitters
  url: https://developers.llamaindex.ai/python/framework/module_guides/loading/node_parsers/
  publisher: LlamaIndex
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Split documents into retrievable pieces — fixed-size, structure-aware or semantic, with overlap — balancing
      precision against lost context. Embedding models and prompts work on limited amounts of text, and one vector
      for a whole document blurs many topics together. Chunking decides the unit that can be retrieved, ranked and
      cited.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Fixed-size chunking splits by tokens or characters (often a few hundred tokens) with some overlap (commonly
      10-20%) so a sentence cut at a boundary appears in both chunks.

      - Recursive or structure-aware splitting tries separators in order (headings, paragraphs, sentences, words)
      so chunks follow the document''s own structure.

      - Semantic chunking places boundaries where the embedding similarity between neighbouring sentences drops;
      it costs more and is not always better.

      - Small chunks match precisely but lose context; large chunks keep context but dilute the embedding and use
      more prompt tokens. Parent-document retrieval searches small chunks and returns their larger parent.

      - Copy metadata (document ID, section heading, page) into every chunk; prepending the title or heading to
      the chunk text often improves retrieval.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- There is no universally best chunk size; choose it by measuring retrieval quality on your own questions.

      - Size limits are in the embedding model''s tokens, not characters; text beyond the model''s maximum input
      is truncated (often silently) or rejected.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def chunk_words(text, size, overlap=0):\n    words=text.split()\n    if size<=0 or overlap<0 or overlap>=size:\
      \ raise ValueError(\"invalid chunk settings\")\n    step=size-overlap\n    return [\" \".join(words[i:i+size])\
      \ for i in range(0,len(words),step)]\n\nprint(chunk_words(\"one two three four five\", 3, 1))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: chunking-code
  - type: item
    ref: chunking-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - Fixed-size chunking splits by tokens or characters (often a few hundred tokens) with some overlap (commonly
      10-20%) so a sentence cut at a boundary appears in both chunks.

      - Recursive or structure-aware splitting tries separators in order (headings, paragraphs, sentences, words)
      so chunks follow the document''s own structure.

      - Semantic chunking places boundaries where the embedding similarity between neighbouring sentences drops;
      it costs more and is not always better.

      - Small chunks match precisely but lose context; large chunks keep context but dilute the embedding and use
      more prompt tokens. Parent-document retrieval searches small chunks and returns their larger parent.

      - Copy metadata (document ID, section heading, page) into every chunk; prepending the title or heading to
      the chunk text often improves retrieval.


      **Limitations**

      - There is no universally best chunk size; choose it by measuring retrieval quality on your own questions.

      - Size limits are in the embedding model''s tokens, not characters; text beyond the model''s maximum input
      is truncated (often silently) or rejected.'
  - type: item
    ref: chunking-mcq
  - type: item
    ref: chunking-tf
  - type: item
    ref: chunking-code
items:
- id: chunking-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of chunking strategies?
  explanation: Fixed-size chunking splits by tokens or characters (often a few hundred tokens) with some overlap
    (commonly 10-20%) so a sentence cut at a boundary appears in both chunks.
  options:
  - id: a
    text: Fixed-size chunking splits by tokens or characters (often a few hundred tokens) with some overlap (commonly
      10-20%) so a sentence cut at a boundary appears in both chunks.
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
  - id: b
    text: There is no universally best chunk size; choose it by measuring retrieval quality on your own questions.
    feedback: This is a misconception; outputs and system behaviour require verification.
  - id: c
    text: Security and evaluation can be added after the system is deployed.
    feedback: Security and evaluation must shape the design and acceptance criteria.
- id: chunking-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: There is no universally best chunk size; choose it by measuring retrieval quality on your own questions.
  answer: false
  explanation: The statement is a known misconception. Treat model output as a candidate result and verify it against
    the contract, evidence and safety constraints.
- id: chunking-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are adding chunking strategies to an application. Describe the design, one failure mode, and how you
    would evaluate whether the feature is reliable and safe.
  rubric:
  - Explain the underlying mechanism and the responsibility of each component.
  - Identify a realistic failure mode and a targeted test or evaluation.
  - Discuss a security, privacy, cost or reliability trade-off.
  modelAnswer: Define the input and output contract, identify trust boundaries, and make the relevant quality or
    safety checks explicit. Test both expected and adversarial inputs, record failures with useful diagnostics,
    and keep a deterministic fallback when the model or retrieval layer cannot be trusted.
  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: chunking-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for chunking strategies. The assertions include the normal path and
    a meaningful edge case.
  starterCode: "def chunk_words(text, size, overlap=0):\n    raise NotImplementedError('Complete this function')"
  solution: "def chunk_words(text, size, overlap=0):\n    words=text.split()\n    if size<=0 or overlap<0 or overlap>=size:\
    \ raise ValueError(\"invalid chunk settings\")\n    step=size-overlap\n    return [\" \".join(words[i:i+size])\
    \ for i in range(0,len(words),step)]"
  tests:
  - name: Core behaviour
    code: assert chunk_words("one two three four five",3,1) == ["one two three","three four five","five"]
  - name: Edge case
    code: 'try: chunk_words("a b",2,2)

      except ValueError: pass

      else: raise AssertionError("overlap must be smaller than chunk size")'
  hints:
  - Translate the requirement into explicit deterministic rules.
  - Validate untrusted input and handle missing or empty data.
  - Remember that this helper is only one check in the complete system.
  explanation: This exercise tests the core rule and an important failure or boundary case.
