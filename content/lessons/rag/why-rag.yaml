  options:
  - id: a
    text: 'The pipeline has two halves: offline indexing (parse, chunk, embed or index documents) and online answering
      (retrieve the top-k passages, put them in the prompt, generate).'
    correct: true
    feedback: 'Correct: this captures the main mechanism or engineering requirement.'
