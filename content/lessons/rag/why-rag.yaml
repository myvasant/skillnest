  explanation: A strong answer treats the feature as an engineered system, not merely a prompt or API call.
- id: why-rag-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for why rag exists. The assertions include the normal path and a meaningful
    edge case.
  starterCode: "def answer_mode(question_needs_private_facts, model_has_current_facts):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def answer_mode(question_needs_private_facts, model_has_current_facts):\n    return \"retrieve then\
    \ generate\" if question_needs_private_facts or not model_has_current_facts else \"direct generation may suffice\""
  tests:
  - name: Core behaviour
    code: assert answer_mode(True, False) == "retrieve then generate"
  - name: Edge case
    code: assert answer_mode(False, True) == "direct generation may suffice"
