id: rag.why-rag
concept: rag.why-rag
title: Why RAG exists
subtitle: Models don't know your private or recent data and can't cite sources; retrieving relevant passages into
  the prompt addresses both — when retrieval works
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Models don't know your private or recent data and can't cite sources; retrieving relevant passages into
  the prompt addresses both — when retrieval works.
objectives:
- Explain the role of why rag exists in a reliable LLM application.
- Apply the concept to a small deterministic example.
- Identify quality, security, cost or retrieval failure modes.
sources:
- title: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al., 2020)
  url: https://arxiv.org/abs/2005.11401
  publisher: arXiv
- title: 'Retrieval-Augmented Generation for Large Language Models: A Survey (Gao et al.)'
  url: https://arxiv.org/abs/2312.10997
  publisher: arXiv
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Models don't know your private or recent data and can't cite sources; retrieving relevant passages into
      the prompt addresses both — when retrieval works. An LLM only knows what was in its training data up to a
      cutoff, cannot see your private documents and cannot point to where a claim came from. RAG fetches relevant
      passages at question time so answers can use, and cite, current and private information without retraining
      the model.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- The pipeline has two halves: offline indexing (parse, chunk, embed or index documents) and online answering
      (retrieve the top-k passages, put them in the prompt, generate).

      - RAG changes what the model sees, not what it knows; updating knowledge means re-indexing documents, not
      retraining weights.

      - Answer quality is capped by retrieval: if the right passage is not in the top k, the model cannot use it
      and may guess instead.

      - Rough rule: RAG for large, changing, private or must-cite knowledge; fine-tuning for style, format and behaviour;
      plain long-context prompting when the whole corpus fits cheaply in the context window.

      - The name comes from Lewis et al. (2020), who paired a neural retriever with a generator; today it names
      the general pattern with any model.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- RAG does not eliminate hallucinations; the model can still ignore, misread or go beyond the retrieved
      text.

      - Long context windows do not make retrieval obsolete; cost, latency and weaker use of mid-context information
      still favour sending fewer, better passages.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python model makes one key decision or calculation executable. It does not call a paid model
      API or transmit learner data. Framework or provider-specific integrations are discussed separately.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def answer_mode(question_needs_private_facts, model_has_current_facts):\n    return \"retrieve then generate\"\
      \ if question_needs_private_facts or not model_has_current_facts else \"direct generation may suffice\"\n\n\
      print(answer_mode(True, False))"
    caption: Runnable deterministic example; no external model call is made.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Implement the helper and test a normal case and a failure case. Think about what the check can guarantee
      and what still requires a broader evaluation.
  - type: item
    ref: why-rag-code
  - type: item
    ref: why-rag-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - The pipeline has two halves: offline indexing (parse, chunk, embed or index documents) and online answering
      (retrieve the top-k passages, put them in the prompt, generate).

      - RAG changes what the model sees, not what it knows; updating knowledge means re-indexing documents, not
      retraining weights.

      - Answer quality is capped by retrieval: if the right passage is not in the top k, the model cannot use it
      and may guess instead.

      - Rough rule: RAG for large, changing, private or must-cite knowledge; fine-tuning for style, format and behaviour;
      plain long-context prompting when the whole corpus fits cheaply in the context window.

      - The name comes from Lewis et al. (2020), who paired a neural retriever with a generator; today it names
      the general pattern with any model.


      **Limitations**

      - RAG does not eliminate hallucinations; the model can still ignore, misread or go beyond the retrieved text.

      - Long context windows do not make retrieval obsolete; cost, latency and weaker use of mid-context information
      still favour sending fewer, better passages.'
