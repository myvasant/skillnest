id: mlops.experiment-tracking
concept: mlops.experiment-tracking
title: Experiment tracking
subtitle: Log parameters, metrics, code versions, data versions and artefacts for every run so results can be compared
  and reproduced
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Log parameters, metrics, code versions, data versions and artefacts for every run so results can be compared
  and reproduced.
objectives:
- Explain the core engineering decisions behind experiment tracking.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: ML Experiment Tracking
  url: https://mlflow.org/docs/latest/ml/tracking/
  publisher: MLflow (Linux Foundation)
  version: 3.x
- title: Rules of Machine Learning
  url: https://developers.google.com/machine-learning/guides/rules-of-ml
  publisher: Google
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Log parameters, metrics, code versions, data versions and artefacts for every run so results can be compared
      and reproduced. ML work involves many runs with different data, code and settings; without a record you cannot
      tell which change helped or rebuild the best model.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- For every run, log parameters (hyperparameters, config), metrics (per step and final), the code version
      (git commit), the data version, the environment and artefacts such as model files and plots.

      - Group related runs into experiments and compare them in tables and charts to see which change caused which
      effect.

      - A run is reproducible only if code, data, configuration, environment and random seeds are all captured.

      - Prefer automatic logging (framework autologging, a shared training script) so the record does not depend
      on discipline.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A spreadsheet of final accuracies is not experiment tracking; without code and data versions the result
      cannot be reproduced.

      - The best validation score out of hundreds of runs is optimistically biased; confirm the chosen model once
      on a held-out test set.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def record_experiment(parameters, metrics, dataset_version, code_version):\n    if not dataset_version\
      \ or not code_version: raise ValueError(\"versions required\")\n    return {\"parameters\":dict(parameters),\"\
      metrics\":dict(metrics),\"dataset\":dataset_version,\"code\":code_version}\n\nprint(record_experiment({\"\
      lr\":0.01},{\"f1\":0.91},\"data-v2\",\"git-a1b2\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: experiment-tracking-code
  - type: item
    ref: experiment-tracking-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - For every run, log parameters (hyperparameters, config), metrics (per step and final), the code version
      (git commit), the data version, the environment and artefacts such as model files and plots.

      - Group related runs into experiments and compare them in tables and charts to see which change caused which
      effect.

      - A run is reproducible only if code, data, configuration, environment and random seeds are all captured.

      - Prefer automatic logging (framework autologging, a shared training script) so the record does not depend
      on discipline.


      **Watch for**

      - A spreadsheet of final accuracies is not experiment tracking; without code and data versions the result
      cannot be reproduced.

      - The best validation score out of hundreds of runs is optimistically biased; confirm the chosen model once
      on a held-out test set.'
  - type: item
    ref: experiment-tracking-mcq
  - type: item
    ref: experiment-tracking-tf
  - type: item
    ref: experiment-tracking-code
items:
- id: experiment-tracking-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of experiment tracking?
  explanation: For every run, log parameters (hyperparameters, config), metrics (per step and final), the code version
    (git commit), the data version, the environment and artefacts such as model files and plots.
  options:
  - id: a
    text: For every run, log parameters (hyperparameters, config), metrics (per step and final), the code version
      (git commit), the data version, the environment and artefacts such as model files and plots.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: A spreadsheet of final accuracies is not experiment tracking; without code and data versions the result
      cannot be reproduced.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: experiment-tracking-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A spreadsheet of final accuracies is not experiment tracking; without code and data versions the result
    cannot be reproduced.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: experiment-tracking-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply experiment tracking to a realistic engineering scenario. State your assumptions, explain your decision,
    compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: experiment-tracking-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for experiment tracking. The assertions cover the expected path and an important boundary
    case.
  starterCode: "def record_experiment(parameters, metrics, dataset_version, code_version):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def record_experiment(parameters, metrics, dataset_version, code_version):\n    if not dataset_version\
    \ or not code_version: raise ValueError(\"versions required\")\n    return {\"parameters\":dict(parameters),\"\
    metrics\":dict(metrics),\"dataset\":dataset_version,\"code\":code_version}"
  tests:
  - name: Core behaviour
    code: assert record_experiment({"lr":0.1},{"acc":0.9},"d1","c1")["dataset"] == "d1"
  - name: Boundary behaviour
    code: 'try: record_experiment({}, {}, "", "c1")

      except ValueError: pass

      else: raise AssertionError("dataset version required")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - experiment-tracking-mcq
  - experiment-tracking-tf
  - experiment-tracking-code
