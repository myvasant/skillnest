items:
- id: containers-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of containers?
  explanation: A container is an ordinary process isolated by Linux kernel features - namespaces limit what it can
    see (processes, network, mounts) and cgroups limit what it can use (CPU, memory).
  options:
  - id: a
    text: A container is an ordinary process isolated by Linux kernel features - namespaces limit what it can see
      (processes, network, mounts) and cgroups limit what it can use (CPU, memory).
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Containers are not lightweight VMs with their own kernel; isolation is weaker than a VM, and a privileged
      container or kernel exploit can affect the host.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: containers-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Containers are not lightweight VMs with their own kernel; isolation is weaker than a VM, and a privileged
    container or kernel exploit can affect the host.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: containers-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply containers to a realistic engineering scenario. State your assumptions, explain your decision, compare
    an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: containers-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for containers. The assertions cover the expected path and an important boundary case.
  starterCode: "def image_tag(application, version, commit):\n    raise NotImplementedError('Complete this function')"
  solution: "def image_tag(application, version, commit):\n    if not application or not version or not commit:\
    \ raise ValueError(\"all identifiers required\")\n    return f\"{application}:{version}-{commit[:8]}\""
  tests:
  - name: Core behaviour
    code: assert image_tag("api","1.4.0","abcdef123456") == "api:1.4.0-abcdef12"
  - name: Boundary behaviour
    code: 'try: image_tag("api","","abc")

      except ValueError: pass

      else: raise AssertionError("missing tag parts must fail")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - containers-mcq
  - containers-tf
  - containers-code
