id: mlops.containers
concept: mlops.containers
title: Containers
subtitle: A container packages an application with its dependencies and runs it isolated on a shared kernel — lighter
  than a virtual machine
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: A container packages an application with its dependencies and runs it isolated on a shared kernel — lighter
  than a virtual machine.
objectives:
- Explain the core engineering decisions behind containers.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: What is a container?
  url: https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
  publisher: Docker
- title: Open Container Initiative
