sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: A container packages an application with its dependencies and runs it isolated on a shared kernel — lighter
      than a virtual machine. "It works on my machine" failures come from different OS libraries, runtimes and settings.
      A container ships the app with its exact user-space environment, so it runs the same on a laptop, in CI and
      in production.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- A container is an ordinary process isolated by Linux kernel features - namespaces limit what it can
      see (processes, network, mounts) and cgroups limit what it can use (CPU, memory).

      - An image is a read-only, layered filesystem plus metadata (entrypoint, environment); a container is a running
      instance of an image with a thin writable layer on top.

      - Containers share the host kernel, so they start in seconds or less and use far less memory than virtual
      machines; Docker Desktop on Windows and macOS runs Linux containers inside a small Linux VM.

      - The Open Container Initiative (OCI) standardises image and runtime formats, so an image built with Docker
      also runs under Podman, containerd or Kubernetes.

      - Containers are disposable - anything written inside is lost when the container is removed unless it is stored
      in a volume or an external service.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Containers are not lightweight VMs with their own kernel; isolation is weaker than a VM, and a privileged
      container or kernel exploit can affect the host.

      - An image is not a container; one image can run as many containers at once.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def image_tag(application, version, commit):\n    if not application or not version or not commit: raise\
      \ ValueError(\"all identifiers required\")\n    return f\"{application}:{version}-{commit[:8]}\"\n\nprint(image_tag(\"\
      api\", \"1.4.0\", \"abcdef123456\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: containers-code
  - type: item
    ref: containers-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - A container is an ordinary process isolated by Linux kernel features - namespaces limit what it can see
      (processes, network, mounts) and cgroups limit what it can use (CPU, memory).

      - An image is a read-only, layered filesystem plus metadata (entrypoint, environment); a container is a running
      instance of an image with a thin writable layer on top.

      - Containers share the host kernel, so they start in seconds or less and use far less memory than virtual
      machines; Docker Desktop on Windows and macOS runs Linux containers inside a small Linux VM.

      - The Open Container Initiative (OCI) standardises image and runtime formats, so an image built with Docker
      also runs under Podman, containerd or Kubernetes.

      - Containers are disposable - anything written inside is lost when the container is removed unless it is stored
      in a volume or an external service.


      **Watch for**

      - Containers are not lightweight VMs with their own kernel; isolation is weaker than a VM, and a privileged
      container or kernel exploit can affect the host.

      - An image is not a container; one image can run as many containers at once.'
