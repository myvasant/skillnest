id: mlops.observability
concept: mlops.observability
title: Observability — metrics, logs and traces
subtitle: Instrument services with the RED/USE metrics, dashboards and actionable alerts tied to service-level objectives
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Instrument services with the RED/USE metrics, dashboards and actionable alerts tied to service-level objectives.
objectives:
- Explain the core engineering decisions behind observability — metrics, logs and traces.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: 'Site Reliability Engineering: Monitoring Distributed Systems'
  url: https://sre.google/sre-book/monitoring-distributed-systems/
  publisher: Google
- title: Prometheus overview
  url: https://prometheus.io/docs/introduction/overview/
  publisher: Prometheus (CNCF)
- title: Instrumentation best practices
  url: https://prometheus.io/docs/practices/instrumentation/
  publisher: Prometheus (CNCF)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Instrument services with the RED/USE metrics, dashboards and actionable alerts tied to service-level objectives.
      You cannot fix what you cannot see; observability tells you when users are affected and helps you find out
      why, ideally before they report it.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Metrics are cheap numeric time series (counters, gauges, histograms); logs record individual events;
      traces follow single requests. Use all three together.

      - RED for request-driven services is Rate, Errors and Duration; USE for resources is Utilisation, Saturation
      and Errors; Google SRE''s four golden signals are latency, traffic, errors and saturation.

      - Prometheus scrapes metrics from `/metrics` endpoints and queries them with PromQL, for example `rate(http_requests_total[5m])`;
      Grafana builds dashboards and alerts on top.

      - Record latency in histograms and report percentiles (p50, p95, p99), because averages hide slow tail requests.

      - Alert on user-facing symptoms (error rate, latency, SLO burn), not on every possible cause such as CPU at
      80%; every page should require action.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- High-cardinality labels such as user IDs or request IDs explode Prometheus storage; put those in logs
      and traces instead.

      - A dashboard is not monitoring; without alerts someone has to be watching it.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def error_rate(errors, requests):\n    if requests <= 0: raise ValueError(\"requests must be positive\"\
      )\n    return errors/requests\n\nprint(error_rate(3, 1000))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: observability-code
  - type: item
    ref: observability-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Metrics are cheap numeric time series (counters, gauges, histograms); logs record individual events; traces
      follow single requests. Use all three together.

      - RED for request-driven services is Rate, Errors and Duration; USE for resources is Utilisation, Saturation
      and Errors; Google SRE''s four golden signals are latency, traffic, errors and saturation.

      - Prometheus scrapes metrics from `/metrics` endpoints and queries them with PromQL, for example `rate(http_requests_total[5m])`;
      Grafana builds dashboards and alerts on top.

      - Record latency in histograms and report percentiles (p50, p95, p99), because averages hide slow tail requests.

      - Alert on user-facing symptoms (error rate, latency, SLO burn), not on every possible cause such as CPU at
      80%; every page should require action.


      **Watch for**

      - High-cardinality labels such as user IDs or request IDs explode Prometheus storage; put those in logs and
      traces instead.

      - A dashboard is not monitoring; without alerts someone has to be watching it.'
  - type: item
    ref: observability-mcq
  - type: item
    ref: observability-tf
  - type: item
    ref: observability-code
items:
- id: observability-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of observability — metrics, logs and traces?
  explanation: Metrics are cheap numeric time series (counters, gauges, histograms); logs record individual events;
    traces follow single requests. Use all three together.
  options:
  - id: a
    text: Metrics are cheap numeric time series (counters, gauges, histograms); logs record individual events; traces
      follow single requests. Use all three together.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: High-cardinality labels such as user IDs or request IDs explode Prometheus storage; put those in logs
      and traces instead.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: observability-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: High-cardinality labels such as user IDs or request IDs explode Prometheus storage; put those in logs
    and traces instead.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: observability-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply observability — metrics, logs and traces to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: observability-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for observability — metrics, logs and traces. The assertions cover the expected path
    and an important boundary case.
  starterCode: "def error_rate(errors, requests):\n    raise NotImplementedError('Complete this function')"
  solution: "def error_rate(errors, requests):\n    if requests <= 0: raise ValueError(\"requests must be positive\"\
    )\n    return errors/requests"
  tests:
  - name: Core behaviour
    code: assert error_rate(3,1000) == 0.003
  - name: Boundary behaviour
    code: 'try: error_rate(0,0)

      except ValueError: pass

      else: raise AssertionError("zero requests must fail")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - observability-mcq
  - observability-tf
  - observability-code
