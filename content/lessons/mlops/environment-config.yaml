id: mlops.environment-config
concept: mlops.environment-config
title: Environments and configuration promotion
subtitle: Dev, staging and production differ only in configuration; feature flags decouple deploying code from releasing
  features
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Dev, staging and production differ only in configuration; feature flags decouple deploying code from releasing
  features.
objectives:
- Explain the core engineering decisions behind environments and configuration promotion.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: 'The Twelve-Factor App: III. Config'
  url: https://12factor.net/config
  publisher: 12factor.net
- title: 'The Twelve-Factor App: X. Dev/prod parity'
  url: https://12factor.net/dev-prod-parity
  publisher: 12factor.net
- title: Feature Toggles (aka Feature Flags)
  url: https://martinfowler.com/articles/feature-toggles.html
  publisher: Martin Fowler (Pete Hodgson)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Dev, staging and production differ only in configuration; feature flags decouple deploying code from releasing
      features. If staging differs from production in more than configuration, a passing staging test proves little;
      separating config from code lets one artefact run safely everywhere.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Twelve-factor rule - store anything that varies between deploys (URLs, credentials, limits) in the
      environment, not in code, so the same build runs in every environment.

      - Keep development, staging and production as similar as possible (same backing services and versions) to
      avoid surprises that only appear in production.

      - Promote, do not rebuild - move the same versioned artefact from dev to staging to production, changing only
      configuration.

      - Feature flags separate deploying code from releasing a feature - ship it switched off, enable it for a percentage
      of users, and switch it off instantly without a redeploy.

      - Validate configuration at startup and fail fast on missing or malformed values.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Feature flags are not free; stale flags add code paths and test combinations, so remove each flag once
      its rollout is complete.

      - A separate settings file per environment checked into the code is not config separation; it couples code
      to deployments and tends to leak secrets.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def config_for_environment(defaults, environment_overrides, environment):\n    result=dict(defaults);result.update(environment_overrides.get(environment,\
      \ {}));return result\n\nprint(config_for_environment({\"debug\":False,\"timeout\":10},{\"staging\":{\"debug\"\
      :True}},\"staging\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: environment-config-code
  - type: item
    ref: environment-config-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Twelve-factor rule - store anything that varies between deploys (URLs, credentials, limits) in the environment,
      not in code, so the same build runs in every environment.

      - Keep development, staging and production as similar as possible (same backing services and versions) to
      avoid surprises that only appear in production.

      - Promote, do not rebuild - move the same versioned artefact from dev to staging to production, changing only
      configuration.

      - Feature flags separate deploying code from releasing a feature - ship it switched off, enable it for a percentage
      of users, and switch it off instantly without a redeploy.

      - Validate configuration at startup and fail fast on missing or malformed values.


      **Watch for**

      - Feature flags are not free; stale flags add code paths and test combinations, so remove each flag once its
      rollout is complete.

      - A separate settings file per environment checked into the code is not config separation; it couples code
      to deployments and tends to leak secrets.'
  - type: item
    ref: environment-config-mcq
  - type: item
    ref: environment-config-tf
  - type: item
    ref: environment-config-code
items:
- id: environment-config-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of environments and configuration promotion?
  explanation: Twelve-factor rule - store anything that varies between deploys (URLs, credentials, limits) in the
    environment, not in code, so the same build runs in every environment.
  options:
  - id: a
    text: Twelve-factor rule - store anything that varies between deploys (URLs, credentials, limits) in the environment,
      not in code, so the same build runs in every environment.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Feature flags are not free; stale flags add code paths and test combinations, so remove each flag once
      its rollout is complete.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: environment-config-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Feature flags are not free; stale flags add code paths and test combinations, so remove each flag once
    its rollout is complete.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: environment-config-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply environments and configuration promotion to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: environment-config-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for environments and configuration promotion. The assertions cover the expected path
    and an important boundary case.
  starterCode: "def config_for_environment(defaults, environment_overrides, environment):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def config_for_environment(defaults, environment_overrides, environment):\n    result=dict(defaults);result.update(environment_overrides.get(environment,\
    \ {}));return result"
  tests:
  - name: Core behaviour
    code: assert config_for_environment({"debug":False},{"staging":{"debug":True}},"staging")["debug"] is True
  - name: Boundary behaviour
    code: assert config_for_environment({"debug":False},{},"prod")["debug"] is False
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - environment-config-mcq
  - environment-config-tf
  - environment-config-code
