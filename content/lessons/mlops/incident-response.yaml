id: mlops.incident-response
concept: mlops.incident-response
title: Incident response and postmortems
subtitle: Detect, triage, mitigate, communicate, then write a blameless postmortem with concrete follow-ups
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Detect, triage, mitigate, communicate, then write a blameless postmortem with concrete follow-ups.
objectives:
- Explain the core engineering decisions behind incident response and postmortems.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: 'Site Reliability Engineering: Managing Incidents'
  url: https://sre.google/sre-book/managing-incidents/
  publisher: Google
- title: 'Site Reliability Engineering: Postmortem Culture - Learning from Failure'
  url: https://sre.google/sre-book/postmortem-culture/
  publisher: Google
- title: 'The Site Reliability Workbook: Incident Response'
  url: https://sre.google/workbook/incident-response/
  publisher: Google
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Detect, triage, mitigate, communicate, then write a blameless postmortem with concrete follow-ups. Every
      production system eventually fails; a practised response shortens outages, and a good postmortem stops the
      same failure from happening again.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Mitigate user impact first (roll back, switch a feature flag off, fail over), then look for the root
      cause.

      - Assign clear roles - an incident commander who coordinates, an operations lead who makes changes, a communications
      lead who updates stakeholders - and keep a timestamped log.

      - Declare incidents early and post regular status updates, even when the update is "still investigating".

      - A blameless postmortem records impact, timeline, contributing causes, what went well and concrete follow-up
      actions with owners, focusing on systems rather than individuals.

      - Runbooks and on-call rotations turn tribal knowledge into repeatable steps.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Incidents rarely have a single root cause; most have several contributing factors.

      - Blameless does not mean no accountability; it means people can report mistakes honestly so the system can
      be fixed.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def incident_timeline(events):\n    required={\"detected\",\"mitigated\",\"resolved\"}\n    present={event[\"\
      stage\"] for event in events}\n    return sorted(required-present)\n\nprint(incident_timeline([{\"stage\"\
      :\"detected\"},{\"stage\":\"mitigated\"}]))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: incident-response-code
  - type: item
    ref: incident-response-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Mitigate user impact first (roll back, switch a feature flag off, fail over), then look for the root cause.

      - Assign clear roles - an incident commander who coordinates, an operations lead who makes changes, a communications
      lead who updates stakeholders - and keep a timestamped log.

      - Declare incidents early and post regular status updates, even when the update is "still investigating".

      - A blameless postmortem records impact, timeline, contributing causes, what went well and concrete follow-up
      actions with owners, focusing on systems rather than individuals.

      - Runbooks and on-call rotations turn tribal knowledge into repeatable steps.


      **Watch for**

      - Incidents rarely have a single root cause; most have several contributing factors.

      - Blameless does not mean no accountability; it means people can report mistakes honestly so the system can
      be fixed.'
  - type: item
    ref: incident-response-mcq
  - type: item
    ref: incident-response-tf
  - type: item
    ref: incident-response-code
items:
- id: incident-response-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of incident response and postmortems?
  explanation: Mitigate user impact first (roll back, switch a feature flag off, fail over), then look for the root
    cause.
  options:
  - id: a
    text: Mitigate user impact first (roll back, switch a feature flag off, fail over), then look for the root cause.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Incidents rarely have a single root cause; most have several contributing factors.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: incident-response-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Incidents rarely have a single root cause; most have several contributing factors.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: incident-response-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply incident response and postmortems to a realistic engineering scenario. State your assumptions, explain
    your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: incident-response-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for incident response and postmortems. The assertions cover the expected path and
    an important boundary case.
  starterCode: "def incident_timeline(events):\n    raise NotImplementedError('Complete this function')"
  solution: "def incident_timeline(events):\n    required={\"detected\",\"mitigated\",\"resolved\"}\n    present={event[\"\
    stage\"] for event in events}\n    return sorted(required-present)"
  tests:
  - name: Core behaviour
    code: assert incident_timeline([{"stage":"detected"},{"stage":"mitigated"}]) == ["resolved"]
  - name: Boundary behaviour
    code: assert incident_timeline([]) == ["detected","mitigated","resolved"]
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - incident-response-mcq
  - incident-response-tf
  - incident-response-code
