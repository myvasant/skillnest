id: mlops.llmops
concept: mlops.llmops
title: LLMOps
subtitle: Version prompts and model configurations, run evaluations in CI, trace production calls, monitor quality,
  cost and latency, and roll back safely
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Version prompts and model configurations, run evaluations in CI, trace production calls, monitor quality,
  cost and latency, and roll back safely.
objectives:
- Explain the core engineering decisions behind llmops.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: MLflow for Agents and LLMs
  url: https://mlflow.org/docs/latest/genai/
  publisher: MLflow (Linux Foundation)
  version: 3.x
- title: Prompt Registry
  url: https://mlflow.org/docs/latest/genai/prompt-registry/
  publisher: MLflow (Linux Foundation)
  version: 3.x
- title: Semantic conventions for generative AI
  url: https://github.com/open-telemetry/semantic-conventions-genai
  publisher: OpenTelemetry (CNCF)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Version prompts and model configurations, run evaluations in CI, trace production calls, monitor quality,
      cost and latency, and roll back safely. LLM features change behaviour when you edit a prompt, switch models
      or a provider updates a model; without versioning, evals and tracing, regressions reach users unnoticed.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Treat prompts, model identifiers, parameters (temperature, max tokens) and tool definitions as versioned
      configuration, reviewed and deployed like code.

      - Run an evaluation suite in CI on every prompt or model change (golden datasets, assertions, LLM-as-judge
      with calibrated rubrics) and block merges on regressions.

      - Trace each call with its inputs, retrieved context, tool calls, output, token counts, latency, cost and
      model version, linked to the user request; OpenTelemetry''s GenAI semantic conventions standardise these attribute
      names.

      - Pin dated model versions where the provider allows it, and re-run evals before moving to a new one.

      - Plan for provider problems - timeouts, rate limits (HTTP 429), fallback models, and per-user or per-feature
      token budgets.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A prompt edit is not a harmless text change; it can alter behaviour as much as a code change.

      - A model alias that always points to the newest version can change behaviour underneath you.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def llm_release_gate(quality, latency_ms, cost_per_call, min_quality, max_latency, max_cost):\n    return\
      \ quality>=min_quality and latency_ms<=max_latency and cost_per_call<=max_cost\n\nprint(llm_release_gate(0.92,800,0.004,0.9,1000,0.01))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: llmops-code
  - type: item
    ref: llmops-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Treat prompts, model identifiers, parameters (temperature, max tokens) and tool definitions as versioned
      configuration, reviewed and deployed like code.

      - Run an evaluation suite in CI on every prompt or model change (golden datasets, assertions, LLM-as-judge
      with calibrated rubrics) and block merges on regressions.

      - Trace each call with its inputs, retrieved context, tool calls, output, token counts, latency, cost and
      model version, linked to the user request; OpenTelemetry''s GenAI semantic conventions standardise these attribute
      names.

      - Pin dated model versions where the provider allows it, and re-run evals before moving to a new one.

      - Plan for provider problems - timeouts, rate limits (HTTP 429), fallback models, and per-user or per-feature
      token budgets.


      **Watch for**

      - A prompt edit is not a harmless text change; it can alter behaviour as much as a code change.

      - A model alias that always points to the newest version can change behaviour underneath you.'
  - type: item
    ref: llmops-mcq
  - type: item
    ref: llmops-tf
  - type: item
    ref: llmops-code
items:
- id: llmops-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of llmops?
  explanation: Treat prompts, model identifiers, parameters (temperature, max tokens) and tool definitions as versioned
    configuration, reviewed and deployed like code.
  options:
  - id: a
    text: Treat prompts, model identifiers, parameters (temperature, max tokens) and tool definitions as versioned
      configuration, reviewed and deployed like code.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: A prompt edit is not a harmless text change; it can alter behaviour as much as a code change.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: llmops-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A prompt edit is not a harmless text change; it can alter behaviour as much as a code change.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: llmops-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply llmops to a realistic engineering scenario. State your assumptions, explain your decision, compare
    an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: llmops-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for llmops. The assertions cover the expected path and an important boundary case.
  starterCode: "def llm_release_gate(quality, latency_ms, cost_per_call, min_quality, max_latency, max_cost):\n\
    \    raise NotImplementedError('Complete this function')"
  solution: "def llm_release_gate(quality, latency_ms, cost_per_call, min_quality, max_latency, max_cost):\n   \
    \ return quality>=min_quality and latency_ms<=max_latency and cost_per_call<=max_cost"
  tests:
  - name: Core behaviour
    code: assert llm_release_gate(0.92,800,0.004,0.9,1000,0.01) is True
  - name: Boundary behaviour
    code: assert llm_release_gate(0.89,800,0.004,0.9,1000,0.01) is False
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - llmops-mcq
  - llmops-tf
  - llmops-code
