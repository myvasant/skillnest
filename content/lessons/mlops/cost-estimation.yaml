id: mlops.cost-estimation
concept: mlops.cost-estimation
title: Resource and cost estimation
subtitle: Estimate compute, storage, GPU and token costs before building, and track unit economics (cost per request
  or per user) afterwards
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Estimate compute, storage, GPU and token costs before building, and track unit economics (cost per request
  or per user) afterwards.
objectives:
- Explain the core engineering decisions behind resource and cost estimation.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Cost Optimization Pillar - AWS Well-Architected Framework
  url: https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html
  publisher: Amazon Web Services
- title: What is FinOps?
  url: https://www.finops.org/introduction/what-is-finops/
  publisher: FinOps Foundation
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Estimate compute, storage, GPU and token costs before building, and track unit economics (cost per request
      or per user) afterwards. Cloud and model costs grow with usage and surprise teams; estimating before building
      avoids unaffordable designs, and tracking unit cost shows whether growth is sustainable.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Estimate from cost drivers - requests per day x cost per request (compute time, tokens, storage, data
      transfer), sized for peak rather than average load.

      - LLM cost per call is roughly input tokens x input price + output tokens x output price; prices change often
      and vary by model and provider, so check current pricing pages.

      - Track unit economics such as cost per request, per active user or per prediction, and set budgets and billing
      alerts from day one.

      - Big levers are right-sizing instances, switching off idle resources, using smaller models where quality
      allows, caching, batching and choosing storage tiers by access frequency.

      - Idle GPUs are expensive; utilisation matters more than the hourly price.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- A free tier is not a cost plan; limits and terms change, so check current terms and set billing alerts
      anyway.

      - Data egress, logging and monitoring are often overlooked but large costs.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def monthly_cost(hours, hourly_rate, requests, cost_per_thousand):\n    if min(hours,hourly_rate,requests,cost_per_thousand)<0:\
      \ raise ValueError(\"inputs must be non-negative\")\n    return hours*hourly_rate + requests/1000*cost_per_thousand\n\
      \nprint(monthly_cost(100,0.5,200000,0.02))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: cost-estimation-code
  - type: item
    ref: cost-estimation-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Estimate from cost drivers - requests per day x cost per request (compute time, tokens, storage, data transfer),
      sized for peak rather than average load.

      - LLM cost per call is roughly input tokens x input price + output tokens x output price; prices change often
      and vary by model and provider, so check current pricing pages.

      - Track unit economics such as cost per request, per active user or per prediction, and set budgets and billing
      alerts from day one.

      - Big levers are right-sizing instances, switching off idle resources, using smaller models where quality
      allows, caching, batching and choosing storage tiers by access frequency.

      - Idle GPUs are expensive; utilisation matters more than the hourly price.


      **Watch for**

      - A free tier is not a cost plan; limits and terms change, so check current terms and set billing alerts anyway.

      - Data egress, logging and monitoring are often overlooked but large costs.'
  - type: item
    ref: cost-estimation-mcq
  - type: item
    ref: cost-estimation-tf
  - type: item
    ref: cost-estimation-code
items:
- id: cost-estimation-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of resource and cost estimation?
  explanation: Estimate from cost drivers - requests per day x cost per request (compute time, tokens, storage,
    data transfer), sized for peak rather than average load.
  options:
  - id: a
    text: Estimate from cost drivers - requests per day x cost per request (compute time, tokens, storage, data
      transfer), sized for peak rather than average load.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: A free tier is not a cost plan; limits and terms change, so check current terms and set billing alerts
      anyway.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: cost-estimation-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A free tier is not a cost plan; limits and terms change, so check current terms and set billing alerts
    anyway.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: cost-estimation-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply resource and cost estimation to a realistic engineering scenario. State your assumptions, explain
    your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: cost-estimation-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for resource and cost estimation. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def monthly_cost(hours, hourly_rate, requests, cost_per_thousand):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def monthly_cost(hours, hourly_rate, requests, cost_per_thousand):\n    if min(hours,hourly_rate,requests,cost_per_thousand)<0:\
    \ raise ValueError(\"inputs must be non-negative\")\n    return hours*hourly_rate + requests/1000*cost_per_thousand"
  tests:
  - name: Core behaviour
    code: assert monthly_cost(100,0.5,200000,0.02) == 54
  - name: Boundary behaviour
    code: 'try: monthly_cost(-1,1,1,1)

      except ValueError: pass

      else: raise AssertionError("negative cost input must fail")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
