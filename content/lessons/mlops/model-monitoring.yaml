id: mlops.model-monitoring
concept: mlops.model-monitoring
title: Model monitoring and drift
subtitle: Watch input distributions, prediction distributions and delayed ground truth to detect data drift, concept
  drift and silent degradation
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Watch input distributions, prediction distributions and delayed ground truth to detect data drift, concept
  drift and silent degradation.
objectives:
- Explain the core engineering decisions behind model monitoring and drift.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Evidently documentation
  url: https://docs.evidentlyai.com/introduction
  publisher: Evidently AI
- title: 'Failing Loudly: An Empirical Study of Methods for Detecting Dataset Shift'
  url: https://arxiv.org/abs/1810.11953
  publisher: arXiv (Rabanser et al., NeurIPS 2019)
- title: 'The ML Test Score: A Rubric for ML Production Readiness and Technical Debt Reduction'
  url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  publisher: Google Research
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Watch input distributions, prediction distributions and delayed ground truth to detect data drift, concept
      drift and silent degradation. Models degrade silently - the API keeps returning 200 OK while predictions get
      worse because the world changed. Only monitoring data and predictions catches this.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Data drift (covariate shift) is a change in the input distribution; concept drift is a change in the
      relationship between inputs and the target; prediction drift is a change in the output distribution.

      - Compare a recent production window with a reference window (often the training data) per feature, using
      measures such as the population stability index, the Kolmogorov-Smirnov test or Jensen-Shannon distance; alert
      on sustained shifts, not single blips.

      - True labels often arrive late (days or months); track real performance when they arrive and rely on drift
      and proxy metrics in the meantime.

      - Monitor data quality too - missing values, schema changes and out-of-range values cause many apparent drift
      incidents.

      - Track performance per segment (region, device, user group), because an overall metric can hide one failing
      slice.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Drift does not automatically mean the model got worse; confirm with labels or business metrics before
      retraining.

      - With large samples, statistical tests flag tiny, harmless differences; use effect sizes and thresholds that
      matter for the business.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def population_shift(reference_mean, current_mean, scale):\n    if scale <= 0: raise ValueError(\"scale\
      \ must be positive\")\n    return abs(current_mean-reference_mean)/scale\n\nprint(population_shift(10, 13,\
      \ 2))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: model-monitoring-code
  - type: item
    ref: model-monitoring-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Data drift (covariate shift) is a change in the input distribution; concept drift is a change in the relationship
      between inputs and the target; prediction drift is a change in the output distribution.

      - Compare a recent production window with a reference window (often the training data) per feature, using
      measures such as the population stability index, the Kolmogorov-Smirnov test or Jensen-Shannon distance; alert
      on sustained shifts, not single blips.

      - True labels often arrive late (days or months); track real performance when they arrive and rely on drift
      and proxy metrics in the meantime.

      - Monitor data quality too - missing values, schema changes and out-of-range values cause many apparent drift
      incidents.

      - Track performance per segment (region, device, user group), because an overall metric can hide one failing
      slice.


      **Watch for**

      - Drift does not automatically mean the model got worse; confirm with labels or business metrics before retraining.

      - With large samples, statistical tests flag tiny, harmless differences; use effect sizes and thresholds that
      matter for the business.'
  - type: item
    ref: model-monitoring-mcq
  - type: item
    ref: model-monitoring-tf
  - type: item
    ref: model-monitoring-code
items:
- id: model-monitoring-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of model monitoring and drift?
  explanation: Data drift (covariate shift) is a change in the input distribution; concept drift is a change in
    the relationship between inputs and the target; prediction drift is a change in the output distribution.
  options:
  - id: a
    text: Data drift (covariate shift) is a change in the input distribution; concept drift is a change in the relationship
      between inputs and the target; prediction drift is a change in the output distribution.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Drift does not automatically mean the model got worse; confirm with labels or business metrics before
      retraining.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: model-monitoring-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Drift does not automatically mean the model got worse; confirm with labels or business metrics before
    retraining.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: model-monitoring-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply model monitoring and drift to a realistic engineering scenario. State your assumptions, explain
    your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: model-monitoring-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for model monitoring and drift. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def population_shift(reference_mean, current_mean, scale):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def population_shift(reference_mean, current_mean, scale):\n    if scale <= 0: raise ValueError(\"\
    scale must be positive\")\n    return abs(current_mean-reference_mean)/scale"
  tests:
  - name: Core behaviour
    code: assert population_shift(10,13,2) == 1.5
  - name: Boundary behaviour
    code: 'assert population_shift(5,5,1) == 0

      try: population_shift(1,2,0)

      except ValueError: pass

      else: raise AssertionError("scale must be positive")'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
