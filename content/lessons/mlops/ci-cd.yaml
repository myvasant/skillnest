id: mlops.ci-cd
concept: mlops.ci-cd
title: Continuous integration and delivery
subtitle: Every push runs linting, tests and builds automatically; delivery pipelines promote verified artefacts
  to environments
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Every push runs linting, tests and builds automatically; delivery pipelines promote verified artefacts
  to environments.
objectives:
- Explain the core engineering decisions behind continuous integration and delivery.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Understanding GitHub Actions
  url: https://docs.github.com/en/actions/get-started/understand-github-actions
  publisher: GitHub
- title: Continuous Integration
  url: https://martinfowler.com/articles/continuousIntegration.html
  publisher: Martin Fowler
- title: Secure use reference (GitHub Actions)
  url: https://docs.github.com/en/actions/reference/security/secure-use
  publisher: GitHub
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Every push runs linting, tests and builds automatically; delivery pipelines promote verified artefacts
      to environments. Manual testing and deployment are slow and error-prone; automating them on every push catches
      mistakes within minutes and makes releasing routine instead of risky.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Continuous integration means merging small changes into the main branch often, with every push or pull
      request running lint, type checks, tests and a build; a broken main build is fixed first.

      - Continuous delivery keeps main always releasable by producing a versioned artefact (such as an image tagged
      with the commit SHA); continuous deployment goes further and releases every passing change automatically.

      - In GitHub Actions, a workflow file in `.github/workflows/` is triggered by the events listed under `on`
      (such as `push` and `pull_request`) and runs jobs made of steps on runners; jobs run in parallel unless linked
      with `needs`.

      - Build once, deploy many - the exact artefact tested in CI is the one promoted to staging and production;
      rebuilding per environment ships something untested.

      - Keep pipelines fast (a common target is about ten minutes) with dependency caching and parallel jobs, or
      people start bypassing them.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- CI is not just owning a build server; it is the practice of integrating small changes frequently.

      - Continuous delivery does not mean every commit goes straight to production; that is continuous deployment.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def pipeline_order(stages):\n    required=[\"test\",\"build\",\"security_scan\",\"deploy\"]\n    positions=[stages.index(x)\
      \ if x in stages else -1 for x in required]\n    return all(x>=0 for x in positions) and positions==sorted(positions)\n\
      \nprint(pipeline_order([\"test\",\"build\",\"security_scan\",\"deploy\"]))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: ci-cd-code
  - type: item
    ref: ci-cd-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Continuous integration means merging small changes into the main branch often, with every push or pull request
      running lint, type checks, tests and a build; a broken main build is fixed first.

      - Continuous delivery keeps main always releasable by producing a versioned artefact (such as an image tagged
      with the commit SHA); continuous deployment goes further and releases every passing change automatically.

      - In GitHub Actions, a workflow file in `.github/workflows/` is triggered by the events listed under `on`
      (such as `push` and `pull_request`) and runs jobs made of steps on runners; jobs run in parallel unless linked
      with `needs`.

      - Build once, deploy many - the exact artefact tested in CI is the one promoted to staging and production;
      rebuilding per environment ships something untested.

      - Keep pipelines fast (a common target is about ten minutes) with dependency caching and parallel jobs, or
      people start bypassing them.


      **Watch for**

      - CI is not just owning a build server; it is the practice of integrating small changes frequently.

      - Continuous delivery does not mean every commit goes straight to production; that is continuous deployment.'
  - type: item
    ref: ci-cd-mcq
  - type: item
    ref: ci-cd-tf
  - type: item
    ref: ci-cd-code
items:
- id: ci-cd-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of continuous integration and delivery?
  explanation: Continuous integration means merging small changes into the main branch often, with every push or
    pull request running lint, type checks, tests and a build; a broken main build is fixed first.
  options:
  - id: a
    text: Continuous integration means merging small changes into the main branch often, with every push or pull
      request running lint, type checks, tests and a build; a broken main build is fixed first.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: CI is not just owning a build server; it is the practice of integrating small changes frequently.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: ci-cd-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: CI is not just owning a build server; it is the practice of integrating small changes frequently.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: ci-cd-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply continuous integration and delivery to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: ci-cd-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for continuous integration and delivery. The assertions cover the expected path and
    an important boundary case.
  starterCode: "def pipeline_order(stages):\n    raise NotImplementedError('Complete this function')"
  solution: "def pipeline_order(stages):\n    required=[\"test\",\"build\",\"security_scan\",\"deploy\"]\n    positions=[stages.index(x)\
    \ if x in stages else -1 for x in required]\n    return all(x>=0 for x in positions) and positions==sorted(positions)"
  tests:
  - name: Core behaviour
    code: assert pipeline_order(["test","build","security_scan","deploy"]) is True
  - name: Boundary behaviour
    code: 'assert pipeline_order(["deploy","test","build","security_scan"]) is False

      assert pipeline_order(["test","deploy"]) is False'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - ci-cd-mcq
  - ci-cd-tf
  - ci-cd-code
