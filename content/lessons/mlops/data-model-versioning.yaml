id: mlops.data-model-versioning
concept: mlops.data-model-versioning
title: Data and model versioning
subtitle: Version datasets and models alongside code (DVC, registries, immutable artefact storage) so any prediction
  can be traced to its inputs
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Version datasets and models alongside code (DVC, registries, immutable artefact storage) so any prediction
  can be traced to its inputs.
objectives:
- Explain the core engineering decisions behind data and model versioning.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: DVC documentation
  url: https://doc.dvc.org/
  publisher: DVC (Iterative)
- title: Get Started with DVC
  url: https://doc.dvc.org/start
  publisher: DVC (Iterative)
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Version datasets and models alongside code (DVC, registries, immutable artefact storage) so any prediction
      can be traced to its inputs. A model's behaviour depends as much on its data as on its code; if you cannot
      reconstruct the exact data and model behind a prediction, you cannot debug, audit or roll back.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Git handles large binary files badly; DVC stores small `.dvc` pointer files (content hashes) in Git
      and keeps the data itself in a cache and a remote (S3, GCS, SSH or a shared folder).

      - Typical DVC loop - `dvc add data/raw`, `git commit`, `dvc push`; later `git checkout <commit>` followed
      by `dvc checkout` (or `dvc pull`) restores the matching data.

      - Treat artefacts as immutable and content-addressed - never overwrite `model.pkl`; publish a new version
      and record which data, code and config produced it (lineage).

      - Model version, training run, data version and git commit linked together give end-to-end traceability from
      any prediction back to its inputs.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- Versioning data does not mean copying the whole dataset for each change; content-addressed storage
      only stores files that changed.

      - Committing large datasets straight into Git is not versioning; it bloats the repository permanently.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def compatible_artifact(data_version, model_data_version):\n    return data_version == model_data_version\n\
      \nprint(compatible_artifact(\"dataset-12\", \"dataset-12\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: data-model-versioning-code
  - type: item
    ref: data-model-versioning-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Git handles large binary files badly; DVC stores small `.dvc` pointer files (content hashes) in Git and
      keeps the data itself in a cache and a remote (S3, GCS, SSH or a shared folder).

      - Typical DVC loop - `dvc add data/raw`, `git commit`, `dvc push`; later `git checkout <commit>` followed
      by `dvc checkout` (or `dvc pull`) restores the matching data.

      - Treat artefacts as immutable and content-addressed - never overwrite `model.pkl`; publish a new version
      and record which data, code and config produced it (lineage).

      - Model version, training run, data version and git commit linked together give end-to-end traceability from
      any prediction back to its inputs.


      **Watch for**

      - Versioning data does not mean copying the whole dataset for each change; content-addressed storage only
      stores files that changed.

      - Committing large datasets straight into Git is not versioning; it bloats the repository permanently.'
  - type: item
    ref: data-model-versioning-mcq
  - type: item
    ref: data-model-versioning-tf
  - type: item
    ref: data-model-versioning-code
items:
- id: data-model-versioning-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of data and model versioning?
  explanation: Git handles large binary files badly; DVC stores small `.dvc` pointer files (content hashes) in Git
    and keeps the data itself in a cache and a remote (S3, GCS, SSH or a shared folder).
  options:
  - id: a
    text: Git handles large binary files badly; DVC stores small `.dvc` pointer files (content hashes) in Git and
      keeps the data itself in a cache and a remote (S3, GCS, SSH or a shared folder).
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: Versioning data does not mean copying the whole dataset for each change; content-addressed storage only
      stores files that changed.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: data-model-versioning-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: Versioning data does not mean copying the whole dataset for each change; content-addressed storage only
    stores files that changed.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: data-model-versioning-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply data and model versioning to a realistic engineering scenario. State your assumptions, explain your
    decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: data-model-versioning-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for data and model versioning. The assertions cover the expected path and an important
    boundary case.
  starterCode: "def compatible_artifact(data_version, model_data_version):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def compatible_artifact(data_version, model_data_version):\n    return data_version == model_data_version"
  tests:
  - name: Core behaviour
    code: assert compatible_artifact("d1","d1") is True
  - name: Boundary behaviour
    code: assert compatible_artifact("d1","d2") is False
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - data-model-versioning-mcq
  - data-model-versioning-tf
  - data-model-versioning-code
