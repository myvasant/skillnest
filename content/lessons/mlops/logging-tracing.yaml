id: mlops.logging-tracing
concept: mlops.logging-tracing
title: Structured logging and distributed tracing
subtitle: Machine-readable logs with request IDs and OpenTelemetry traces show what happened across services for
  each request
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Machine-readable logs with request IDs and OpenTelemetry traces show what happened across services for
  each request.
objectives:
- Explain the core engineering decisions behind structured logging and distributed tracing.
- Apply the principle to a small realistic scenario.
- Identify operational, security or communication failure modes.
sources:
- title: Observability primer
  url: https://opentelemetry.io/docs/concepts/observability-primer/
  publisher: OpenTelemetry (CNCF)
- title: Traces
  url: https://opentelemetry.io/docs/concepts/signals/traces/
  publisher: OpenTelemetry (CNCF)
- title: Trace Context
  url: https://www.w3.org/TR/trace-context/
  publisher: W3C
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Machine-readable logs with request IDs and OpenTelemetry traces show what happened across services for
      each request. When a request fails somewhere across several services, scattered free-text logs are nearly
      useless; structured logs and traces let you follow one request end to end.
- id: mental-model
  title: Core principles and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- Structured logs are key-value records (usually JSON) with a timestamp, level, message and fields such
      as `request_id`, `user_id` and `duration_ms`, so they can be filtered and aggregated.

      - Create or accept a request ID at the edge, pass it to every downstream call and include it in every log
      line.

      - A trace is a tree of spans, one per operation, each with a start time, duration, attributes and status;
      context propagation carries the trace ID between services in the W3C `traceparent` header.

      - OpenTelemetry is the vendor-neutral standard (APIs, SDKs and the Collector) for producing traces, metrics
      and logs and exporting them to any backend.

      - Log meaningful events at meaningful levels (DEBUG, INFO, WARNING, ERROR), not every line executed.'
  - type: callout
    variant: misconception
    title: Common mistakes
    body: '- More logs do not mean better observability; noisy, high-volume logs are expensive and bury the signal.

      - Logs are not private; never log passwords, tokens, API keys or unredacted personal data.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This deterministic Python helper models one part of the engineering decision. Production use requires
      environment-specific measurement, review and operational controls.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def trace_event(trace_id, span_id, operation, duration_ms, status):\n    return {\"trace_id\":trace_id,\"\
      span_id\":span_id,\"operation\":operation,\"duration_ms\":duration_ms,\"status\":status}\n\nprint(trace_event(\"\
      t1\",\"s2\",\"retrieve\",42,\"ok\"))"
    caption: Runnable model for the lesson principle.
- id: practice
  title: Apply and verify
  kind: practice
  blocks:
  - type: markdown
    body: Complete the function, run its assertions and explain the limitations of the simplified model.
  - type: item
    ref: logging-tracing-code
  - type: item
    ref: logging-tracing-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key principles**

      - Structured logs are key-value records (usually JSON) with a timestamp, level, message and fields such as
      `request_id`, `user_id` and `duration_ms`, so they can be filtered and aggregated.

      - Create or accept a request ID at the edge, pass it to every downstream call and include it in every log
      line.

      - A trace is a tree of spans, one per operation, each with a start time, duration, attributes and status;
      context propagation carries the trace ID between services in the W3C `traceparent` header.

      - OpenTelemetry is the vendor-neutral standard (APIs, SDKs and the Collector) for producing traces, metrics
      and logs and exporting them to any backend.

      - Log meaningful events at meaningful levels (DEBUG, INFO, WARNING, ERROR), not every line executed.


      **Watch for**

      - More logs do not mean better observability; noisy, high-volume logs are expensive and bury the signal.

      - Logs are not private; never log passwords, tokens, API keys or unredacted personal data.'
  - type: item
    ref: logging-tracing-mcq
  - type: item
    ref: logging-tracing-tf
  - type: item
    ref: logging-tracing-code
items:
- id: logging-tracing-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best captures the central principle of structured logging and distributed tracing?
  explanation: Structured logs are key-value records (usually JSON) with a timestamp, level, message and fields
    such as `request_id`, `user_id` and `duration_ms`, so they can be filtered and aggregated.
  options:
  - id: a
    text: Structured logs are key-value records (usually JSON) with a timestamp, level, message and fields such
      as `request_id`, `user_id` and `duration_ms`, so they can be filtered and aggregated.
    correct: true
    feedback: 'Correct: this is the key principle described in the lesson.'
  - id: b
    text: More logs do not mean better observability; noisy, high-volume logs are expensive and bury the signal.
    feedback: This is a misconception; validate assumptions and failure modes.
  - id: c
    text: Operational concerns can be ignored if a local example works.
    feedback: Local correctness does not establish production reliability.
- id: logging-tracing-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: More logs do not mean better observability; noisy, high-volume logs are expensive and bury the signal.
  answer: false
  explanation: The statement is a known misconception. Engineering choices must be evaluated against requirements,
    constraints and failure behaviour.
- id: logging-tracing-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: Apply structured logging and distributed tracing to a realistic engineering scenario. State your assumptions,
    explain your decision, compare an alternative and describe how you would verify the result.
  rubric:
  - State the relevant requirement and assumptions.
  - Explain the chosen approach and at least one trade-off.
  - Describe a concrete validation or measurement step.
  modelAnswer: Clarify the requirement and constraints first. Choose a proportionate approach, explain why it is
    preferable to at least one alternative, then verify it with tests and measurements that reflect the real workload
    or user scenario. Document remaining risks.
  explanation: A strong response makes assumptions explicit and connects the design to measurable evidence.
- id: logging-tracing-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the helper for structured logging and distributed tracing. The assertions cover the expected
    path and an important boundary case.
  starterCode: "def trace_event(trace_id, span_id, operation, duration_ms, status):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def trace_event(trace_id, span_id, operation, duration_ms, status):\n    return {\"trace_id\":trace_id,\"\
    span_id\":span_id,\"operation\":operation,\"duration_ms\":duration_ms,\"status\":status}"
  tests:
  - name: Core behaviour
    code: event=trace_event("t1","s1","load",12,"ok")
  - name: Boundary behaviour
    code: 'assert event["trace_id"] == "t1" and event["duration_ms"] == 12

      assert event["status"] == "ok"'
  hints:
  - Turn the requirement into an explicit contract.
  - Reject invalid assumptions rather than silently guessing.
  - Test the result and explain its production limitations.
  explanation: This exercise tests the key principle and an important edge case.
masteryCheck:
  passThreshold: 0.8
  items:
  - logging-tracing-mcq
  - logging-tracing-tf
  - logging-tracing-code
