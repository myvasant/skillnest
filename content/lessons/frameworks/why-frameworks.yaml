id: frameworks.why-frameworks
concept: frameworks.why-frameworks
title: Why (and when) to use an LLM framework
subtitle: Frameworks standardise model interfaces, prompts, tools, retrieval and tracing; for small, stable apps
  a provider SDK and plain Python may be clearer
estimatedMinutes: 45
reviewedOn: '2026-11-04'
summary: Frameworks standardise model interfaces, prompts, tools, retrieval and tracing; for small, stable apps
  a provider SDK and plain Python may be clearer.
objectives:
- Explain the architecture and trade-offs behind why (and when) to use an llm framework.
- Apply the idea in a small deterministic example.
- Identify security, state, reliability or operational failure modes.
sources:
- title: Building effective agents
  url: https://www.anthropic.com/research/building-effective-agents
  publisher: Anthropic
- title: LangChain overview
  url: https://docs.langchain.com/oss/python/langchain/overview
  publisher: LangChain
  version: 1.x
sections:
- id: why
  title: Why this matters
  kind: why
  blocks:
  - type: markdown
    body: Frameworks standardise model interfaces, prompts, tools, retrieval and tracing; for small, stable apps
      a provider SDK and plain Python may be clearer. Every LLM app needs the same plumbing — provider APIs, message
      formats, tool schemas, retries, retrieval, tracing. Frameworks package it, but you should know what you are
      buying before adding a dependency that changes quickly.
- id: mental-model
  title: Core model and trade-offs
  kind: mental-model
  blocks:
  - type: markdown
    body: '- What frameworks give you: one interface across model providers, prompt and message utilities, tool
      and structured-output helpers, retrieval integrations, orchestration (graphs, agents) and tracing hooks.

      - What they cost: abstraction between you and the API, frequent breaking changes, large dependency trees,
      and debugging through someone else''s code.

      - A provider SDK plus plain Python is often clearer when you use one provider and a few fixed calls; a framework
      pays off with many integrations, durable orchestration or its ecosystem tooling.

      - Whatever you choose, understand the raw calls underneath; Anthropic''s agent guidance suggests starting
      with LLM APIs directly and making sure you understand any framework code you adopt.

      - Pin versions and read migration guides — LangChain, for example, reorganised its packages and agent API
      in its 1.0 release.'
  - type: callout
    variant: misconception
    title: Common misconceptions
    body: '- A framework does not make an app production-ready; evaluation, error handling, security and observability
      are still your job.'
- id: worked-example
  title: Worked example
  kind: walkthrough
  blocks:
  - type: markdown
    body: This pure-Python example isolates one deterministic rule from the architecture. It does not connect to
      external services, grant permissions or execute untrusted tools.
  - type: code
    language: python
    runnable: true
    status: verified
    code: "def framework_need(needs_state, tools, branching, persistence):\n    return any([needs_state, tools,\
      \ branching, persistence])\n\nprint(framework_need(True, False, False, False))"
    caption: Runnable local model; production implementations need additional controls and tests.
- id: practice
  title: Practice and failure analysis
  kind: practice
  blocks:
  - type: markdown
    body: Complete the helper and test both normal behaviour and a failure case. Explain what this small model leaves
      out of a production implementation.
  - type: item
    ref: why-frameworks-code
  - type: item
    ref: why-frameworks-explain
- id: summary
  title: Summary and mastery check
  kind: summary
  blocks:
  - type: markdown
    body: '**Key ideas**

      - What frameworks give you: one interface across model providers, prompt and message utilities, tool and structured-output
      helpers, retrieval integrations, orchestration (graphs, agents) and tracing hooks.

      - What they cost: abstraction between you and the API, frequent breaking changes, large dependency trees,
      and debugging through someone else''s code.

      - A provider SDK plus plain Python is often clearer when you use one provider and a few fixed calls; a framework
      pays off with many integrations, durable orchestration or its ecosystem tooling.

      - Whatever you choose, understand the raw calls underneath; Anthropic''s agent guidance suggests starting
      with LLM APIs directly and making sure you understand any framework code you adopt.

      - Pin versions and read migration guides — LangChain, for example, reorganised its packages and agent API
      in its 1.0 release.


      **Limitations**

      - A framework does not make an app production-ready; evaluation, error handling, security and observability
      are still your job.'
  - type: item
    ref: why-frameworks-mcq
  - type: item
    ref: why-frameworks-tf
  - type: item
    ref: why-frameworks-code
items:
- id: why-frameworks-mcq
  type: mcq
  skill: recognition
  difficulty: 2
  prompt: Which statement best describes the central idea of why (and when) to use an llm framework?
  explanation: 'What frameworks give you: one interface across model providers, prompt and message utilities, tool
    and structured-output helpers, retrieval integrations, orchestration (graphs, agents) and tracing hooks.'
  options:
  - id: a
    text: 'What frameworks give you: one interface across model providers, prompt and message utilities, tool and
      structured-output helpers, retrieval integrations, orchestration (graphs, agents) and tracing hooks.'
    correct: true
    feedback: 'Correct: this captures the central mechanism or design choice.'
  - id: b
    text: A framework does not make an app production-ready; evaluation, error handling, security and observability
      are still your job.
    feedback: This is a misconception; explicit validation, tests and boundaries remain necessary.
  - id: c
    text: The most autonomous or complex design is always the best choice.
    feedback: Prefer the simplest design that satisfies the requirements and risk constraints.
- id: why-frameworks-tf
  type: true-false
  skill: explanation
  difficulty: 1
  prompt: A framework does not make an app production-ready; evaluation, error handling, security and observability
    are still your job.
  answer: false
  explanation: The statement is a known misconception. More components create additional interfaces, state and failure
    modes; justify complexity with measurable requirements.
- id: why-frameworks-explain
  type: explain
  skill: transfer
  difficulty: 2
  prompt: You are designing why (and when) to use an llm framework for a production application. Explain the main
    design decision, one alternative, a failure mode and how you would test the result.
  rubric:
  - Describe the core mechanism and why it fits the requirement.
  - Compare at least one simpler or alternative approach.
  - Identify a concrete failure mode and a verification or recovery step.
  modelAnswer: Start from the user requirement and risk level. Choose the smallest architecture that meets it, define
    its contracts and state boundaries, then test success, failure, retries and permission checks. Document what
    the simplified model does not guarantee.
  explanation: A strong answer reasons about trade-offs and operational consequences instead of naming a framework
    as the solution.
- id: why-frameworks-code
  type: code
  skill: implementation
  difficulty: 2
  prompt: Complete the deterministic helper for why (and when) to use an llm framework. The tests cover the main
    rule and a boundary or failure case.
  starterCode: "def framework_need(needs_state, tools, branching, persistence):\n    raise NotImplementedError('Complete\
    \ this function')"
  solution: "def framework_need(needs_state, tools, branching, persistence):\n    return any([needs_state, tools,\
    \ branching, persistence])"
  tests:
  - name: Core behaviour
    code: assert framework_need(False,False,False,False) is False
  - name: Failure or edge case
    code: assert framework_need(True,False,False,False) is True
  hints:
  - Make the contract explicit before implementing it.
  - Validate inputs and reject unsupported operations safely.
  - Run the tests and explain what the model does not cover.
  explanation: This exercise checks the design rule and an important failure condition.
masteryCheck:
  passThreshold: 0.8
  items:
  - why-frameworks-mcq
  - why-frameworks-tf
  - why-frameworks-code
