# Goal-based learning paths. Only targets are listed: each path is computed as
# the prerequisite closure of its targets, ordered so every concept comes after
# everything it depends on. Paths share the one curriculum graph.
defaultPath: python-developer
paths:
  - id: python-developer
    title: Python Developer
    role: Write, test and ship reliable Python programs and tools.
    summary: >-
      From your first program to idiomatic, tested, packaged Python. The foundation for every other path.
    outcomes:
      - Write idiomatic Python using functions, classes, comprehensions and generators.
      - Debug systematically and read tracebacks with confidence.
      - Test code with pytest and keep it clean with linters and type checkers.
      - Structure, package, configure and secure real projects.
    targets:
      - python.testing
      - python.packaging
      - python.logging
      - python.cli-apps
      - python.dataclasses
      - python.context-managers
      - python.decorators
      - python.generators
      - python.secure-coding
      - python.asyncio
      - python.regex
      - python.static-analysis
      - tooling.pull-requests

  - id: backend-developer
    title: Backend Developer
    role: Design, build, test and operate HTTP APIs backed by databases.
    summary: >-
      Python plus networking, HTTP, FastAPI, SQL and PostgreSQL, authentication, caching, background work,
      containers and CI — everything needed to put a reliable service in production.
    outcomes:
      - Design REST APIs with clear contracts, validation and error handling.
      - Model data relationally and write efficient, safe SQL.
      - Implement authentication, authorisation and secret management correctly.
      - Test, containerise and continuously deliver a service.
    targets:
      - backend.api-testing
      - backend.authorization
      - backend.secrets-management
      - backend.background-jobs
      - backend.caching-strategies
      - backend.rate-limiting
      - backend.error-handling
      - databases.migrations
      - databases.orm
      - databases.query-plans
      - databases.connection-pooling
      - security.input-handling
      - mlops.docker
      - mlops.ci-cd
      - mlops.logging-tracing
      - networking.debugging-network

  - id: data-scientist
    title: Data Scientist
    role: Turn data into trustworthy insight and predictive models.
    summary: >-
      Statistics and probability, NumPy and pandas, cleaning and exploration, visualisation, classical
      machine learning, evaluation and communicating results honestly.
    outcomes:
      - Clean, explore and visualise real datasets and spot data-quality problems.
      - Apply statistical reasoning and hypothesis tests correctly.
      - Train, tune and evaluate models while avoiding leakage.
      - Explain models and their limitations to non-specialists.
    targets:
      - data.eda
      - data.visualization
      - data.time-series
      - math.hypothesis-testing
      - ml.ensembles
      - ml.cross-validation
      - ml.hyperparameter-tuning
      - ml.interpretability
      - ml.clustering
      - ml.dimensionality-reduction
      - ml.imbalanced-data
      - ml.fairness
      - ml.ml-pipelines
      - databases.sql-advanced
      - interview.technical-communication

  - id: data-engineer
    title: Data Engineer
    role: Build reliable, governed data pipelines and platforms.
    summary: >-
      SQL and modelling, data formats, ETL/ELT, orchestration, warehouses and lakehouses, Spark and streaming,
      data quality and governance.
    outcomes:
      - Design idempotent batch and streaming pipelines.
      - Model data for analytics and evolve schemas safely.
      - Operate orchestrated pipelines with tests, monitoring and lineage.
      - Work with distributed processing engines and lakehouse table formats.
    targets:
      - de.idempotency-incremental
      - de.orchestration
      - de.dbt
      - de.warehouses-lakes
      - de.spark
      - de.streaming-systems
      - de.pipeline-quality
      - de.schema-evolution
      - de.lineage-governance
      - de.databricks
      - de.cloud-data-platforms
      - mlops.docker

  - id: ml-engineer
    title: Machine Learning Engineer
    role: Train, deploy and maintain machine learning models in production.
    summary: >-
      Machine learning and deep learning fundamentals plus the engineering to make models reproducible,
      served, monitored and retrained.
    outcomes:
      - Build reproducible training pipelines with tracked experiments.
      - Train neural networks with PyTorch and diagnose training problems.
      - Serve models behind APIs and monitor them for drift.
      - Automate retraining and releases with CI/CD.
    targets:
      - ml.ml-pipelines
      - ml.reproducibility
      - dl.pytorch
      - dl.regularization
      - mlops.mlflow
      - mlops.data-model-versioning
      - mlops.model-serving
      - mlops.model-monitoring
      - mlops.training-pipelines
      - mlops.docker
      - mlops.release-strategies
      - interview.ml-interviews

  - id: genai-engineer
    title: Generative AI Engineer
    role: Build dependable applications on top of large language models.
    summary: >-
      How LLMs behave and how to engineer around their limits: prompting, structured outputs, tool calling,
      local models, evaluation, security, cost and the APIs that deliver them.
    outcomes:
      - Explain tokens, context windows and sampling, and their effect on behaviour and cost.
      - Produce reliable structured outputs and tool calls.
      - Run open-weight models locally and choose models deliberately.
      - Evaluate LLM features and defend against prompt injection.
    targets:
      - genai.structured-outputs
      - genai.tool-calling
      - genai.local-inference
      - genai.model-selection
      - genai.evaluation
      - genai.prompt-injection
      - genai.guardrails
      - genai.cost-latency
      - genai.llm-architecture
      - backend.fastapi-basics
      - rag.grounding-citations

  - id: rag-developer
    title: RAG Application Developer
    role: Build search-grounded assistants over private documents.
    summary: >-
      Ingestion, chunking, keyword and vector search, hybrid retrieval, reranking, grounded answers with
      citations, access control, evaluation and failure analysis.
    outcomes:
      - Build a local RAG pipeline from scratch before using frameworks.
      - Combine keyword and vector search and measure retrieval quality.
      - Produce grounded, cited answers and say "I don't know" correctly.
      - Diagnose and fix RAG failures layer by layer.
    targets:
      - rag.evaluation
      - rag.failure-analysis
      - rag.grounding-citations
      - rag.reranking
      - rag.access-control
      - rag.performance
      - rag.advanced-patterns
      - rag.observability
      - rag.security
      - frameworks.langchain-retrievers
      - graphs.graphrag

  - id: agentic-ai-engineer
    title: Agentic AI Engineer
    role: Design, secure and evaluate tool-using agents and multi-agent systems.
    summary: >-
      Workflows versus agents, the agent loop, tool design, memory, human approval, sandboxing, recovery,
      MCP and A2A, LangGraph and other frameworks, evaluation and security.
    outcomes:
      - Choose between deterministic workflows and agents with clear reasoning.
      - Build agents with well-designed tools, memory and human approval steps.
      - Expose and consume tools through MCP and understand A2A.
      - Evaluate, observe and secure agents against injection and excessive agency.
    targets:
      - agents.multi-agent
      - agents.mcp-servers
      - agents.a2a
      - agents.evaluation
      - agents.security
      - agents.observability
      - agents.langgraph-agents
      - agents.human-in-the-loop
      - agents.failure-recovery
      - agents.planning
      - agents.context-engineering
      - frameworks.langgraph-hitl
      - frameworks.tradeoffs

  - id: production-ai-engineer
    title: Production AI Engineer
    role: Operate AI systems that are reliable, observable, secure and affordable.
    summary: >-
      The full stack for production AI: system design, deployment, observability, LLMOps, evaluation in
      production, fault tolerance, cost, security and incident response.
    outcomes:
      - Design end-to-end AI systems with explicit trade-offs.
      - Deploy with CI/CD, containers and safe release strategies.
      - Monitor quality, cost and latency, and respond to incidents.
      - Secure AI applications and govern them responsibly.
    targets:
      - architecture.ai-system-design
      - mlops.llmops
      - mlops.production-evaluation
      - mlops.fault-tolerance
      - mlops.cost-estimation
      - mlops.incident-response
      - mlops.reliability-engineering
      - mlops.caching-queues
      - security.llm-security
      - security.ai-governance
      - agents.observability
      - rag.observability

  - id: interview-prep
    title: Technical Interview Preparation
    role: Prepare for software, data and AI engineering interviews.
    summary: >-
      The problem-solving process, data structures and algorithms, system design, ML and GenAI design,
      debugging and communication.
    outcomes:
      - Solve coding problems with a clear, communicated process.
      - Recognise common algorithmic patterns and their complexities.
      - Lead system design discussions, including AI systems.
      - Present projects and answer behavioural questions with structure.
    targets:
      - interview.coding-interviews
      - interview.system-design-interviews
      - interview.ml-interviews
      - interview.genai-interviews
      - interview.debugging-interviews
      - interview.project-walkthroughs
      - cs.dynamic-programming
      - cs.shortest-paths
      - cs.greedy
