    solution: |
      # Notes file processor: complete program (milestones 1-4)

      NOTES_PATH = "notes.txt"
      SUMMARY_PATH = "summary.txt"

      SAMPLE_NOTES = """TODO: buy milk
      IDEA: a calculator that speaks its answers
      DONE: finish the quiz project

      TODO: read about dictionaries
      Meeting notes: Sam liked the quiz idea
      IDEA: palindrome finder for song titles
      TODO: practise reading files
      """


      def write_text(path, text):
          """Write text to the file at path, replacing its old content (UTF-8)."""
          with open(path, "w", encoding="utf-8") as file:
              file.write(text)


      def read_lines(path):
          """Return the lines of a UTF-8 text file, without their line endings."""
          lines = []
          with open(path, encoding="utf-8") as file:
              for line in file:
                  lines.append(line.rstrip("\n"))
          return lines


      def count_non_blank(lines):
          """Return how many lines contain something other than whitespace."""
          count = 0
          for line in lines:
              if line.strip() != "":
                  count = count + 1
          return count


      def filter_lines(lines, keyword):
          """Return the lines that contain keyword, ignoring case, in their original order."""
          keyword = keyword.lower()
          matches = []
          for line in lines:
              if keyword in line.lower():
                  matches.append(line)
          return matches


      def get_tag(line):
          """Return the tag of a line such as "TODO: buy milk" ("TODO"), or None."""
          if ":" not in line:
              return None
          tag = line.split(":")[0].strip()
          if tag.isalpha() and tag.isupper():
              return tag
          return None


      def count_tags(lines):
          """Return a dictionary that counts each tag in lines."""
          counts = {}
          for line in lines:
              tag = get_tag(line)
              if tag is not None:
                  counts[tag] = counts.get(tag, 0) + 1
          return counts


      def build_summary(lines):
          """Return a short report about the notes, one fact per line."""
          report = [
              "Notes summary",
              f"Total lines: {len(lines)}",
              f"Non-blank lines: {count_non_blank(lines)}",
          ]
          tags = count_tags(lines)
          for tag in sorted(tags):
              report.append(f"{tag}: {tags[tag]}")
          todos = []
          for line in lines:
              if get_tag(line) == "TODO":
                  todos.append(line.split(":", 1)[1].strip())
          if len(todos) == 0:
              report.append("Open TODOs: none")
          else:
              report.append("Open TODOs:")
              for todo in todos:
                  report.append(f"- {todo}")
          return "\n".join(report)


      def summarise_file(notes_path, summary_path):
          """Summarise the notes file into the summary file and return the summary.

          Raises FileNotFoundError if the notes file does not exist.
          """
          lines = read_lines(notes_path)
          summary = build_summary(lines)
          write_text(summary_path, summary + "\n")
          return summary


      def read_line(prompt):
          """Show prompt and return what the user typed, or None if there is no more input."""
          try:
              return input(prompt).strip()
          except EOFError:
              return None


      def main():
          """Create the sample notes, summarise a file chosen by the user, and search it."""
          write_text(NOTES_PATH, SAMPLE_NOTES)
          print(f"Created {NOTES_PATH} with sample notes.")
          name = read_line(f"File to summarise (Enter for {NOTES_PATH}): ")
          if name is None or name == "":
              name = NOTES_PATH
          try:
              summary = summarise_file(name, SUMMARY_PATH)
          except FileNotFoundError:
              print(f"Could not find '{name}'. Check the name and try again.")
              return
          print(summary)
          print(f"Summary saved to {SUMMARY_PATH}.")
          keyword = read_line("Search for (Enter to skip): ")
          if keyword is not None and keyword != "":
              matches = filter_lines(read_lines(name), keyword)
              print(f"Lines containing '{keyword}': {len(matches)}")
              for line in matches:
                  print(f"  {line}")


      if __name__ == "__main__":
          main()
testing: |
  Click **Run milestone tests** under a milestone. The tests run against your **whole program**
  (all milestones share one file), so earlier functions must keep working as you add new ones.

  * **File checks** write and read real files in the virtual file system, using names that start
    with `gw_test_` so they never clash with your `notes.txt`, and delete them afterwards. They
    inspect the bytes on disk, so they notice a missing `encoding="utf-8"` or a file opened in the
    wrong mode.
  * **Function checks** pass made-up lists of lines to the analysis functions and compare the
    results exactly.
  * **Program checks** re-run your whole program with `run_program("...")`, one line per
    `input()` call, and then look at both what was printed and what ended up in `summary.txt`.

  Every failed check says what it tried and what it expected. After your first test run you can
  open the **reference solution** for the milestone to compare approaches.

  On your own computer (see Setup), run the program, then open `notes.txt` in an editor, add
  lines with new tags, run it again, and check `summary.txt`. Try a file name that does not
  exist, too.
security:
  - File names typed by users are untrusted. Here any name in the folder can be read; a real application must restrict names to one folder (reject names containing / or \ and names starting with .) so that a name such as ../../secret.txt cannot reach other files.
  - Mode "w" silently replaces a file. Only write to files your program owns (here summary.txt), never to a path the user typed without asking first; mode "x" creates a file only if it does not exist yet.
  - Always pass encoding="utf-8". Without it Python uses the computer's default encoding, so the same file can be read differently, or fail, on another machine.
  - Read big files line by line (for line in file) as read_lines does, rather than file.read(), so one huge file cannot exhaust memory.
  - Report a missing file with a short message instead of a traceback; tracebacks can reveal folder names and other details about your system.
extensions:
  - Add a DONE count to the summary as a progress bar, for example 1 of 4 tasks done (25%).
  - Let the user add a new TODO line from the program, appending it to the notes file with mode "a".
  - Make tags case-insensitive, so that a line starting with "todo:" counts as TODO, and decide whether that is a good idea for your notes.
  - Summarise several files at once (typed separated by commas) and write one combined summary, still reporting each missing file by name.
  - Rewrite the file layer with pathlib.Path (read_text, write_text, exists) and compare it with open().
rubric:
  - criterion: Safe file handling
    needsWork: Files are opened without with or without an encoding, or a file is left open.
    meets: Every open() uses with and encoding="utf-8", and write_text replaces the file content.
    exceeds: Only write_text and read_lines touch files, and you can explain why mode "w" is risky for user-chosen paths.
  - criterion: Error handling
    needsWork: A missing file crashes the program with a traceback.
    meets: FileNotFoundError is caught in main() with a clear message, and the previous summary file is left untouched.
    exceeds: Errors are handled in exactly one place, and read_lines stays simple because it lets the caller decide.
  - criterion: Correct analysis
    needsWork: Counts, tags or the summary layout are wrong for blank lines, extra colons or lower-case tags.
    meets: All analysis functions and build_summary pass the exact tests.
    exceeds: The tag rule lives only in get_tag and every other function reuses it.
  - criterion: Program structure
    needsWork: File access, analysis and printing are mixed together in main().
    meets: Separate file, analysis and program layers; functions return values and main() does the talking.
    exceeds: Every function has a docstring and the program would be easy to extend with new tags or reports.
