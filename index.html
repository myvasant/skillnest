<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Groundwork — learn Python, software engineering, data, ML, GenAI, RAG and agentic AI from first principles. Local-first and free."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Groundwork</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem("groundwork:progress");
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : "system";
          var dark = theme === "dark" || ((!theme || theme === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Groundwork needs JavaScript enabled: lessons, the Python runtime and your progress all run in the browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
